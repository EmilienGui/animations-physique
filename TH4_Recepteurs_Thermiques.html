  sci(x,n=2){

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

function makeS(app){

    FONT,MATH,

    v(sym,sub,sup){

      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;

    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();

      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;

      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});

/* TH4 · ajouts à physique.js (inchangé) : cycles de Joule (Brayton) et d'Ericsson, cycle d'essence réel schématique
   (compression et détente polytropiques), cycle frigorifique avec surchauffe et sous-refroidissement.
   SI pour les gaz ; bar, °C et kJ/kg pour les tables frigorifiques. */
'use strict';
globalThis.TH4Ajouts=(()=>{
 const M=TH4Physics,R=M.R,clamp=M.clamp,mix=M.mix;
 /* même bilan que physique.js::assemble ; reg = indices des étapes concernées par un régénérateur (fraction p.regen) */
 function assemble(states,types,n,gamma,kind,p,reg=[]){
  const cv=n*R/(gamma-1);
  states=states.map((v,i)=>({...v,P:n*R*v.T/v.V,S:cv*Math.log(v.T/states[0].T)+n*R*Math.log(v.V/states[0].V),name:'ABCD'[i]}));
  const steps=states.map((s,i)=>M.segment(s,states[(i+1)%4],types[i],n,gamma)),eps=p.regen??0;
  let Qc=0,Qf=0,W=0;
  for(let i=0;i<4;i++){const e=steps[i];W+=e.W;const ext=reg.includes(i)?e.Q*(1-eps):e.Q;if(ext>0)Qc+=ext;else Qf+=ext}
  const tc=Math.max(...states.map(x=>x.T)),tf=Math.min(...states.map(x=>x.T));
  return {kind,n,gamma,cv,states,steps,W,Qc,Qf,eta:-W/Qc,etaBound:1-tf/tc,tc,tf,Sc:-Qc/tc-Qf/tf,
   sample(u){u=clamp(u);const i=Math.min(3,Math.floor(u*4)),v=u===1?1:u*4-i,e=steps[i].at(v);let w=0,q=0,ext=0,rg=0;
    for(let k=0;k<=i;k++){const z=k===i?e:steps[k];w+=z.W;q+=z.Q;const qr=reg.includes(k)?z.Q*eps:0;ext+=z.Q-qr;rg+=qr}
    return {...e,W:w,Q:q,Qexternal:ext,Qreg:rg,dU:cv*(e.T-states[0].T),S:cv*Math.log(e.T/states[0].T)+n*R*Math.log(e.V/states[0].V),step:i,f:v};}};
 }
 /* Joule : A(P1,T1) → B adiabatique → C isobare à P2 (T3) → D adiabatique → A isobare */
 function joule(p={}){
  const gamma=p.gamma||1.4,rp=p.rp||8,T1=p.T0||300,T3=p.tmax||1200,P1=1e5,n=p.n||1,k=(gamma-1)/gamma,
   TB=T1*rp**k,TD=T3*rp**-k,V=(T,P)=>n*R*T/P;
  const states=[{T:T1,V:V(T1,P1)},{T:TB,V:V(TB,rp*P1)},{T:T3,V:V(T3,rp*P1)},{T:TD,V:V(TD,P1)}];
  const c=assemble(states,['adiabatique','isobare','adiabatique','isobare'],n,gamma,'joule',p);
  return {...c,etaTheo:1-rp**-k,rp};
 }
 /* Ericsson : A(P1,Tf) → B isotherme à Tf → C isobare à P2 (Tc) → D isotherme à Tc → A isobare */
 function ericsson(p={}){
  const gamma=p.gamma||1.4,rp=p.rp||5,Tf=(p.tf??27)+273.15,Tc=(p.tc??527)+273.15,P1=1e5,n=p.n||1,V=(T,P)=>n*R*T/P;
  const states=[{T:Tf,V:V(Tf,P1)},{T:Tf,V:V(Tf,rp*P1)},{T:Tc,V:V(Tc,rp*P1)},{T:Tc,V:V(Tc,P1)}];
  const c=assemble(states,['isotherme','isobare','isotherme','isobare'],n,gamma,'ericsson',p,[1,3]);
  const cp=gamma*R/(gamma-1)/R*R;
  return {...c,tc:Tc,tf:Tf,etaBound:1-Tf/Tc,rp,
   etaTheo:(eps)=>{const Wm=R*Math.log(rp)*(Tc-Tf),Qc=R*Tc*Math.log(rp)+(1-eps)*cp*(Tc-Tf);return Wm/Qc}};
 }
 /* Essence réelle schématique : compression et détente polytropiques d'indices kc et kd (échanges avec les parois),
    apport isochore jusqu'à la même température maximale que le cycle idéal. Renvoie les points (V,P) et le bilan. */
 function essenceReel(p={},kc=1.32,kd=1.28){
  const id=M.cycle('essence',p),A=id.states[0],alpha=p.alpha||10,n=id.n,gamma=p.gamma||1.4,cv=id.cv;
  const TB=A.T*alpha**(kc-1),PB=A.P*alpha**kc,TC=id.states[2].T,PC=PB*TC/TB,PD=PC*alpha**-kd,TD=TC*alpha**(1-kd);
  const work=(Pi,Vi,Pf,Vf,k)=>-(Pf*Vf-Pi*Vi)/(1-k);
  const Wc=work(A.P,A.V,PB,id.states[1].V,kc),Wd=work(PC,id.states[1].V,PD,A.V,kd),W=Wc+Wd;
  const Qcomp=cv*(TB-A.T)-Wc,Qapport=cv*(TC-TB),Qdet=cv*(TD-TC)-Wd,Qech=cv*(A.T-TD);
  const Qc=Qapport+Math.max(0,Qcomp)+Math.max(0,Qdet);
  const pts=[];const Vb=id.states[1].V,Va=A.V;
  for(let i=0;i<=60;i++){const V=Va*(Vb/Va)**(i/60);pts.push([V,A.P*(Va/V)**kc])}
  pts.push([Vb,PC]);
  for(let i=0;i<=60;i++){const V=Vb*(Va/Vb)**(i/60);pts.push([V,PC*(Vb/V)**kd])}
  pts.push([Va,A.P]);
  return {pts,W,Qc,eta:-W/Qc,etaId:id.eta,Qcomp,Qdet,PB,PC,PD,TB,TC,TD};
 }
 /* Cycle frigorifique avec surchauffe sh (K) en sortie d'évaporateur et sous-refroidissement sc (K) en sortie de condenseur */
 function frigo(p={}){
  const Rf=M.refrigerant,tf=p.tf??4,tc=p.tc??20,te=tf-(p.ec??14),tk=tc+(p.eh??11),eta=p.eta??.6,sh=p.sh??0,sc=p.sc??0;
  const a=Rf.sat(te),c=Rf.sat(tk),ts=Rf.sat(tk-sc);
  const A=sh>0?{...Rf.vapor(te,sh),p:a.p,phase:'vapeur'}:{p:a.p,h:a.hv,T:te,s:a.sv,x:1,phase:'vapeur'};
  const Bs=Rf.atPS(c.p,A.s),B=Rf.atPH(c.p,A.h+(Bs.h-A.h)/eta),C={p:c.p,h:ts.hl,T:tk-sc,s:ts.sl,x:0,phase:'liquide'},D=Rf.atPH(a.p,C.h);
  const qf=A.h-D.h,qc=C.h-B.h,w=B.h-A.h,Sc=-qf/(tf+273.15)-qc/(tc+273.15);
  function sample(u){u=clamp(u);const k=Math.min(3,Math.floor(u*4)),f=u===1?1:u*4-k;let d;
   if(k===0){const pp=A.p*(B.p/A.p)**f,hs=Rf.atPS(pp,A.s).h;d=Rf.atPH(pp,A.h+(hs-A.h)/eta)}
   else if(k===1){/* désurchauffe puis liquéfaction puis sous-refroidissement à P constante */d=Rf.atPH(B.p,mix(B.h,C.h,f))}
   else if(k===2)d=Rf.atPH(C.p*(D.p/C.p)**f,C.h);
   else d=Rf.atPH(A.p,mix(D.h,A.h,f));
   return {...d,step:k,f}}
  return {states:[A,B,C,D],A,B,C,D,Bs,te,tk,tf,tc,eta,sh,sc,qf,qc,w,ef:qf/w,ep:-qc/w,efMax:tc>tf?(tf+273.15)/(tc-tf):null,epMax:tc>tf?(tc+273.15)/(tc-tf):null,Sc,sample};
 }
 return {assemble,joule,ericsson,essenceReel,frigo};
})();

/* TH4 · outils de dessin communs aux trois animations (SVG, kit AnimKit).
   Dépend de TH4Physics (physique.js) et d'AnimKit. */
'use strict';
globalThis.TH4K=(()=>{
 const M=TH4Physics,clamp=M.clamp;
 const mixc=(x,y,f)=>x.map((v,i)=>Math.round(v+(y[i]-v)*f));
 /* échelle froid → chaud commune à tout TH4 : bleu → gris → rouge (indépendante du thème) */
 function tcol(T,lo=240,hi=950){
  const t=clamp((T-lo)/(hi-lo),0,1),c0=[47,111,214],c1=[150,150,150],c2=[214,52,52],t1=.35;
  return 'rgb('+(t<t1?mixc(c0,c1,t/t1):mixc(c1,c2,(t-t1)/(1-t1))).join(',')+')';
 }
 /* couleurs des étapes : chaud, froid, travail, régénérateur */
 const stepCols=(C)=>({hot:C.hot,cold:C.cold,work:C.v,regen:C.E});
 /** Diagramme d'un cycle (P,V), (T,S) ou (P,h) déjà échantillonné.
     cyc.sample(u) → {V,P,T,S,step} ; cols[step] → couleur ; renvoie {G, curve:[[px,py,u]]} */
 function cyclePlot(a,id,cyc,u,mode,o={}){
  const P=a.panels[id],S=a.S,C=a.C,k=a.k,w=P.w,h=P.h,N=480,ts=mode==='ts',pts=[];
  const X=d=>ts?d.S:d.V*1e3,Y=d=>ts?d.T:d.P/1e5;
  for(let i=0;i<=N;i++){const d=o.sampler?o.sampler(i/N):cyc.sample(i/N);pts.push({x:X(d),y:Y(d),u:i/N,step:d.step})}
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),x1=Math.min(...xs),x2=Math.max(...xs),y1=Math.min(...ys),y2=Math.max(...ys);
  const xmin=ts?x1-(x2-x1)*.12:0,xmax=x2+(x2-x1)*.1,ymin=ts?Math.max(0,y1-(y2-y1)*.12):Math.max(0,y1*.6),ymax=y2+(y2-y1)*.1;
  const G=S.graph({x:0,y:0,w,h,xmin,xmax,ymin,ymax,xlab:ts?`${S.v('S')} − ${S.v('S','A')} (J·K${S.sup('−1')})`:`${S.v('V')} (L)`,ylab:ts?`${S.v('T')} (K)`:`${S.v('P')} (bar)`,ny:3,
   xfmt:(v,st)=>a.fmt.fix(v,st<.1?2:st<1?1:0)});
  let s=S.clip('cp'+id,G)+G.svg;
  const px=pts.map(p=>[G.X(p.x),G.Y(p.y),p.u,p.step]);
  if(o.fill)s+=S.path('M'+px.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L')+'Z',{fill:C.cSoft,fop:.55,c:null,w:0});
  s+=typeof o.under==='function'?o.under(G):(o.under||'');
  let run=[];const flush=(c)=>{if(run.length>1)s+=S.poly(run,{c,w:3})};let last=-1;
  for(const p of px){if(p[3]!==last){flush(o.cols[last]);run=run.length?[run[run.length-1]]:[];last=p[3]}run.push([p[0],p[1]])}flush(o.cols[last]);
  /* flèche au milieu de chaque étape */
  const by={};for(const p of px)(by[p[3]]=by[p[3]]||[]).push(p);
  for(const st in by){const q=by[st];if(q.length<4)continue;const m=Math.floor(q.length/2),p0=q[m-1],p1=q[m+1],an=Math.atan2(p1[1]-p0[1],p1[0]-p0[0]),L=8*k,c=o.cols[st];
   s+=`<path d="M${q[m][0]+L*Math.cos(an)},${q[m][1]+L*Math.sin(an)}L${q[m][0]-L*Math.cos(an-.5)},${q[m][1]-L*Math.sin(an-.5)}L${q[m][0]-L*Math.cos(an+.5)},${q[m][1]-L*Math.sin(an+.5)}Z" fill="${c}"/>`}
  /* états A à D */
  if(o.points!==false&&cyc.states)cyc.states.forEach((z,i)=>{const sx=ts?z.S:z.V*1e3,sy=ts?z.T:z.P/1e5,x=G.X(sx),y=G.Y(sy),dx=i===1||i===2?(o.lab?.[i]??1):(o.lab?.[i]??-1);
    s+=S.circle(x,y,3.5*k,{fill:C.ink})+S.text(x+dx*12*k,y+(i<2?-11:11)*k,'ABCD'[i],{anchor:'middle',size:15,c:C.ink,weight:700})});
  const d0=o.sampler?o.sampler(u):cyc.sample(u),cx=G.X(X(d0)),cy=G.Y(Y(d0));
  s+=S.circle(cx,cy,6.5*k,{fill:C.cInk,c:C.paper,w:2});
  s+=typeof o.over==='function'?o.over(G):(o.over||'');
  a.svg(id,s);

  /* condenseur (haut) : serpentin */
  const coil=(y,col)=>{let pts=[];const n=6,a0=mx-bw*.22,a1=mx+bw*.22;for(let i=0;i<=n*2;i++)pts.push([a0+(a1-a0)*i/(n*2),y+(i%2?-12*k:12*k)]);return S.poly(pts,{c:col,w:3,fill:'none'})};
  s+=S.rect(mx-bw*.26,y1-22*k,bw*.52,44*k,{fill:C.card,c:C.hot,w:cur===1?4:2.4,rx:8*k})+coil(y1,C.hot);
  s+=S.rect(mx-bw*.26,y2-22*k,bw*.52,44*k,{fill:C.card,c:C.cold,w:cur===3?4:2.4,rx:8*k})+coil(y2,C.cold);
  /* détendeur (gauche) : deux triangles */
  const vx=x1,vy=my;s+=S.rect(vx-20*k,vy-24*k,40*k,48*k,{fill:C.card,c:C.E,w:cur===2?4:2.4,rx:6*k})+S.poly([[vx-12*k,vy-14*k],[vx+12*k,vy-14*k],[vx-12*k,vy+14*k],[vx+12*k,vy+14*k]],{close:true,fill:C.E,fop:.35,c:C.E,w:1.5});
  s+=S.text(x2,my+44*k,'Compresseur',{anchor:'middle',size:13,c:C.v,weight:600})+S.text(mx,y1-30*k,'Condenseur',{anchor:'middle',size:13,c:C.hot,weight:600})+S.text(mx,y2+38*k,'Évaporateur',{anchor:'middle',size:13,c:C.cold,weight:600})+S.text(x1,my+44*k,'Détendeur',{anchor:'middle',size:13,c:C.E,weight:600});
  /* états */
  [['A',x2,y2,12,14],['B',x2,y1,12,-8],['C',x1,y1,-12,-8],['D',x1,y2,-12,14]].forEach(([n,x,y,dx,dy])=>{s+=S.circle(x,y,4.5*k,{fill:C.ink})+S.text(x+dx*k*1.6,y+dy*k,n,{anchor:'middle',size:15,weight:700})});
  /* énergie : flèches proportionnelles */
  if(a.p.prev){const vm=Math.max(Math.abs(c.qc),c.qf,c.w);
    s+=K.energyArrow(a,[mx,y1-24*k],[mx,Math.max(26*k,y1-76*k)],-c.qc,vm,C.hot,{w:5})+K.energyArrow(a,[mx,y2+60*k],[mx,y2+24*k],c.qf,vm,C.cold,{w:5})+K.energyArrow(a,[x2+80*k,my-20*k],[x2+30*k,my-20*k],c.w,vm,C.v,{w:5})
     +S.text(mx+22*k,y1-48*k,`q_c = ${sg(a,c.qc)}`,{anchor:'start',size:13,c:C.hot,weight:600})+S.text(mx+22*k,y2+48*k,`q_f = ${sg(a,c.qf)}`,{size:13,c:C.cold,weight:600})+S.text(x2+80*k,my-28*k,`w = ${sg(a,c.w)}`,{anchor:'end',size:13,c:C.v,weight:600})}
  /* points mobiles */
  for(let i=0;i<14;i++){const p=pos(U+i/14),d=c.sample(((U+i/14)%1));s+=S.circle(p[0],p[1],3.2*k,{fill:C.paper,c:C.ink,w:1})}
  const pm=pos(U);s+=S.circle(pm[0],pm[1],9*k,{c:C.F,w:3,fill:'none'});
  const st=c.sample(U);
  s+=S.text(w/2,h-6*k,`${st.phase==='mélange'?'Mélange':st.phase==='liquide'?'Liquide':'Vapeur'} · ${a.fmt.fix(st.p,2)} bar · ${a.fmt.fix(st.T,1)} °C`,{anchor:'middle',size:14,c:C.cInk,weight:600});
  a.svg('scene',s);
}
A.drag('scene',{
  hit:(x,y)=>L&&x>L.x1-50*A.k&&x<L.x2+50*A.k&&y>L.y1-30*A.k&&y<L.y2+30*A.k,
  start(x,y){A.play(false);const mx=(L.x1+L.x2)/2,my=(L.y1+L.y2)/2;let k;
    if(Math.abs(x-L.x2)<Math.abs(y-my)+L.x2-L.x1 && x>mx+(L.x2-mx)*.5)k=0;else if(x<mx-(mx-L.x1)*.5)k=2;else k=y<my?1:3;
    U=(k+.12)/4;A.t=U*DUREE}
});

/* ---------- diagramme (P, h) ---------- */
function phGraph(a){
  const P=a.panels.graphe,S=a.S,C=a.C,k=a.k,w=P.w,h=P.h,c=cyc(a),f=a.fmt,lg=Math.log10;let s='';
  const G=S.graph({x:0,y:0,w,h,xmin:130,xmax:540,ymin:lg(.5),ymax:lg(48),xticks:[150,250,350,450],yticks:[.5,1,2,5,10,20,40].map(lg),yfmt:v=>String(+(10**v).toPrecision(2)),zeroAxis:false,xlab:'h (kJ/kg)',ylab:'P (bar) · échelle log'});
  const X=G.X,Y=v=>G.Y(lg(v));s+=S.clip('cph',G)+G.svg;
  const rows=RF.rows(),left=rows.map(r=>[X(r[2]),Y(r[1])]),right=rows.map(r=>[X(r[3]),Y(r[1])]);
  s+=`<g clip-path="url(#cph)">`+S.poly([...left,...right.slice().reverse()],{close:true,fill:C.cSoft,fop:.35,c:C.ink2,w:1.6})+`</g>`;
  if(a.p.quality)for(const x of [.25,.5,.75]){s+=S.poly(rows.map(r=>[X(M4.mix(r[2],r[3],x)),Y(r[1])]),{c:C.E,w:1,dash:`${3*k} ${4*k}`})+S.text(X(M4.mix(RF.atP(.8).hl,RF.atP(.8).hv,x)),Y(.8),f.fix(x,2),{anchor:'middle',size:12,c:C.E})}
  if(a.p.isotherms)for(const t of [-20,0,20,40,60,80]){const z=RF.sat(t),v=[];for(let ts=-40;ts<=t;ts+=2){const d=RF.vapor(ts,t-ts);v.push([X(d.h),Y(d.p)])}
    s+=S.poly([[X(z.hl),Y(z.p)],...v.reverse()],{c:C.cold,w:1,dash:`${5*k} ${4*k}`})+S.text(X(z.hv)+10*k,Y(z.p)-5*k,`${t} °C`,{size:12,c:C.cold})}
  if(a.p.isentropes)for(const e of [1.5,1.6,1.7,1.8,1.9]){const ps=[];for(let t=-40;t<=95;t+=2){const z=RF.sat(t);if(e>=z.sl&&e<=RF.vapor(t,280).s){const d=RF.atPS(z.p,e);ps.push([X(d.h),Y(d.p)])}}if(ps.length>1)s+=S.poly(ps,{c:C.v,w:1,dash:`${2*k} ${4*k}`})}
  s+=S.text(X(176),Y(5),'Liquide',{size:13,c:C.ink2})+S.text(X(300),Y(1.1),'Liquide + vapeur',{anchor:'middle',size:12,c:C.ink2})+S.text(X(500),Y(1.1),'Vapeur',{anchor:'middle',size:13,c:C.ink2});
  /* cycle du cours */
  if(a.p.cours){const cp=[[390,2],[440,8],[245,8],[245,2]].map(z=>[X(z[0]),Y(z[1])]);s+=S.poly(cp,{close:true,c:C.F,w:2,dash:`${6*k} ${4*k}`})+S.text(X(430),Y(2.4),'cycle du cours',{size:12,c:C.F,weight:600})}
  /* cycle */
  const cols=[C.v,C.hot,C.E,C.cold],px=[];
  for(let i=0;i<4;i++){const pts=[];for(let j=0;j<=60;j++){const u=(i+j/60)/4,d=c.sample(u),x=X(d.h),y=Y(d.p);pts.push([x,y]);px.push([x,y,u,i])}
    s+=S.path('M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L'),{c:cols[i],w:cur(a)===i?4.5:2.8});
    const m=pts[30],m2=pts[34];s+=S.arrow(m[0],m[1],m2[0],m2[1],{c:cols[i],w:2.5})}
  c.states.forEach((z,i)=>{s+=S.circle(X(z.h),Y(z.p),4.5*k,{fill:C.ink})+S.text(X(z.h)+(i<2?12:-12)*k,Y(z.p)+(i===0||i===3?15:-9)*k,'ABCD'[i],{anchor:'middle',size:15,weight:700})});
  const d=c.sample(U);s+=S.circle(X(d.h),Y(d.p),7*k,{fill:C.F,c:C.paper,w:2});
  a.svg('graphe',s);
  plotP={G,curve:px,hit:(x,y)=>px.some(p=>Math.hypot(p[0]-x,p[1]-y)<26*k)};
  a.legend([{c:C.v,label:'Compresseur'},{c:C.hot,label:'Condenseur'},{c:C.E,label:'Détendeur'},{c:C.cold,label:'Évaporateur'}]);
}
const cur=a=>Math.min(3,Math.floor(U*4));
K.cycleDrag(A,'graphe',()=>plotP,u=>{U=u;A.t=u*DUREE},()=>A.p.gmode==='ph');

/* ---------- bilans par organe ---------- */
function bilGraph(a){
  const P=a.panels.graphe,S=a.S,C=a.C,k=a.k,w=P.w,h=P.h,c=cyc(a),f=a.fmt;let s='';plotP=null;
  const rows=[['Compresseur',c.w,C.v,'h_B − h_A'],['Condenseur',c.qc,C.hot,'h_C − h_B'],['Détendeur',0,C.E,'h_D − h_C = 0'],['Évaporateur',c.qf,C.cold,'h_A − h_D']],mx=Math.max(c.w,-c.qc,c.qf),x=24*k,ww=w-48*k,dy=Math.min(90*k,(h-30*k)/4);
  rows.forEach(([n,v,col,eq],i)=>{const y=34*k+i*dy;s+=S.text(x,y,n,{size:15,c:col,weight:600,halo:false})+S.text(x+ww,y,a.p.prev?`${sg(a,v)} kJ/kg`:'?',{anchor:'end',size:15,c:col,halo:false})
    +S.rect(x,y+10*k,ww,10*k,{fill:C.rule,fop:.5,rx:3*k})+(a.p.prev&&v?S.rect(x,y+10*k,ww*Math.abs(v)/mx,10*k,{fill:col,rx:3*k}):'')+S.text(x,y+40*k,eq,{size:13,c:C.ink2,halo:false})});
  a.svg('graphe',s);a.legend([]);
}

/* ---------- efficacité en fonction de T_c ---------- */
function effGraph(a){
  const P=a.panels.graphe,S=a.S,C=a.C,k=a.k,w=P.w,h=P.h,f=a.fmt,q=par(a),pac=!!a.tab;let s='';plotP=null;
  const G=S.graph({x:0,y:0,w,h,xmin:15,xmax:55,ymin:0,ymax:pac?20:15,xlab:`${pac?'Chauffage':'Pièce'} T_c (°C)`,ylab:pac?'e_PAC':'e_frigo'});
  s+=S.clip('eg2',G)+G.svg;
  const pts=[],bd=[];for(let t=Math.max(15,q.tf+5);t<=55.001;t+=1){const c=X4.frigo({...q,open:false,tc:t});pts.push([t,pac?c.ep:c.ef]);bd.push([t,pac?c.epMax:c.efMax])}
  if(a.p.prev)s+=S.curve(bd,G,{c:C.pred,w:2,dash:`${5*k} ${4*k}`});
  s+=S.curve(pts,G,{c:C.v,w:3});
  if(!q.open){const c=cyc(a);s+=S.circle(G.X(q.tc),G.Y(pac?c.ep:c.ef),6*k,{fill:C.F,c:C.paper,w:2})}
  a.svg('graphe',s);a.legend(a.p.prev?[{c:C.v,label:'Cycle réel (R134a)'},{c:C.pred,label:'Carnot entre les sources',dash:true}]:[{c:C.v,label:'Cycle réel (R134a)'}]);
}

/* ---------- mesures ---------- */
function infos(a){const c=cyc(a),f=a.fmt,v=M.v,q=par(a),pac=!!a.tab,m=[],d=c.sample(U);
  m.push({label:'État du fluide',value:`${f.fix(d.p,2)} bar · ${f.fix(d.T,1)} °C`,hint:`${d.phase} · h = ${f.fix(d.h,1)} kJ/kg${d.phase==='mélange'?' · x = '+f.fix(d.x,2):''}`});
  if(a.p.prev){
    m.push({label:`${v('q','f')} prélevé`,value:sg(a,c.qf),unit:'kJ/kg',hint:'h_A − h_D'},{label:`${v('q','c')} cédé`,value:sg(a,c.qc),unit:'kJ/kg',hint:'h_C − h_B'},{label:`${v('w')} compresseur`,value:sg(a,c.w),unit:'kJ/kg',hint:'h_B − h_A'});
    if(q.open)m.push({label:'Bilan de la pièce',value:sg(a,-(c.qc+c.qf)),unit:'kJ/kg',warn:true,hint:'= w : la pièce chauffe'});
    else{m.push({label:pac?'e PAC':'e frigo',value:f.fix(pac?c.ep:c.ef,2),hint:`Carnot : ${f.fix(pac?c.epMax:c.efMax,1)}`});m.push({label:`${v('T','B')}`,value:f.fix(c.B.T,1),unit:'°C',hint:'sortie du compresseur'},{label:`${v('x','D')}`,value:f.fix(c.D.x*100,1),unit:'%',hint:'titre en vapeur après détente'})}
  }
  a.metrics(m)}
