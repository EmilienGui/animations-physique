/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));

    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);

  },
  sci(x,n=2){

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;

}

  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);

    },

    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},

        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;

    if(metrics._h!==html){metrics.innerHTML=html;metrics._h=html}
  };
  A.insight=()=>{};
  A.legend=arr=>{const html=(arr||[]).filter(Boolean).map(l=>`<span><i class="${l.dash?'dash':l.dot?'dot':''}" style="background:${l.c};--lc:${l.c}"></i>${l.label}</span>`).join('');if(legend._h!==html){legend.innerHTML=html;legend._h=html}};
  A.clock=html=>{const c=$('.ak-clock',tr);if(c._h!==html){c.innerHTML=html;c._h=html}};
  A.toast=m=>{toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastEl._h);toastEl._h=setTimeout(()=>toastEl.classList.remove('show'),1800)};
  A.panelVisible=id=>!A.panels[id].el.hidden;

  /* ---------- tailles ---------- */
  function viewBox(P){
    const {w,h,vx,vy,vz}=P;
    P.node.setAttribute('viewBox',P.vue==='svg'?`${vx.toFixed(2)} ${vy.toFixed(2)} ${(w/vz).toFixed(2)} ${(h/vz).toFixed(2)}`:`0 0 ${w.toFixed(1)} ${h.toFixed(1)}`);
  }
  function measure(){
    A.narrow=ak.clientWidth<=640; ak.style.setProperty('--ak-top',(top.offsetHeight+(tabs?tabs.offsetHeight:0))+'px');
    if(A.narrow){if(metricsWrap.parentNode!==right||right.lastElementChild!==metricsWrap)right.append(metricsWrap)}
    else{if(metricsWrap.parentNode!==right||right.firstElementChild!==metricsWrap)right.insertBefore(metricsWrap,side)}
    A.k=ak.classList.contains('is-proj')?1.6:A.narrow?1:1.15;
    for(const P of Object.values(A.panels)){
      if(P.el.hidden)continue;
      if(A.narrow){const w=P.el.clientWidth||ak.clientWidth;P.node.style.height=Math.round(w*(P.cfg.ratioTel??.8))+'px'}else P.node.style.height='';
      const r=P.node.getBoundingClientRect(); P.w=Math.max(50,r.width); P.h=Math.max(50,r.height);
      if(P.type==='canvas'){const d=window.devicePixelRatio||1;if(P.node.width!==Math.round(P.w*d)||P.node.height!==Math.round(P.h*d)){P.node.width=Math.round(P.w*d);P.node.height=Math.round(P.h*d)}P.ctx=P.node.getContext('2d');P.ctx.setTransform(d,0,0,d,0,0)}
      else viewBox(P);
    }
  }
  /* ---------- rendu ---------- */
  let graphPanels=[];
  const activeChartView=P=>P?.vue==='graphe'&&zoomed(P)?P:null;
  function drawFrame(){
    const frame={graphs:[],views:graphPanels.map(activeChartView),outputs:new Map()};
    A._graphFrame=frame;
    try{cfg.draw?.(A)}finally{A._graphFrame=null}
    graphPanels=[];
    for(const [P,output] of frame.outputs){
      const graphs=[...output.html.matchAll(/<g data-ak-graph="(\d+)">/g)].map(m=>frame.graphs[+m[1]]).filter(Boolean);
      output.graphs=graphs;
      if(P.vue==='svg'||P.vue==='graphe'){
        const vue=graphs.length?'graphe':'svg';
        if(vue!==P.vue){P.vue=vue;resetView(P);viewBox(P)}
        P.graphs=graphs;
      }
      const view=activeChartView(P);
      for(const graph of graphs){
        graphPanels[graph.id]=P;
        if(graph.view!==view)frame.changed=true;
      }
    }
    return frame;
  }
  function clipCharts(node,graphs){
    const svgElement=tag=>document.createElementNS(node.namespaceURI,tag);
    for(const graph of graphs){
      const axes=node.querySelector(`[data-ak-graph="${graph.id}"]`);
      if(!axes)continue;
      const id='ak-cadre-'+graph.id, defs=svgElement('defs'),clip=svgElement('clipPath'),rect=svgElement('rect');
      clip.id=id;
      for(const [k,v] of Object.entries({x:graph.x0,y:graph.y0,width:graph.w,height:graph.h}))rect.setAttribute(k,v);
      clip.append(rect);defs.append(clip);axes.append(defs);
      let layer=null;
      for(let next=axes.nextElementSibling;next&&!next.hasAttribute('data-ak-graph');){
        const child=next;next=child.nextElementSibling;
        if(child.localName==='defs'||child.hasAttribute('data-ak-hors-graphe')){layer=null;continue}
        if(!layer){
          layer=svgElement('g');
          layer.setAttribute('clip-path',`url(#${id})`);
          child.before(layer);
        }
        layer.append(child);
      }
    }
  }
  function writeSvg(P,html,graphs=[]){
    if(P.node._h===html)return;
    P.node.innerHTML=html;
    P.node._h=html;
    if(activeChartView(P))clipCharts(P.node,graphs);
  }
  A.renderNow=()=>{
    A._dirty=false;measure();
    let frame=drawFrame();
    if(frame.changed)frame=drawFrame();
    for(const [P,output] of frame.outputs)writeSvg(P,output.html,output.graphs);
    syncScrub();guardScroll();
  };
  A.render=()=>{if(A._dirty)return;A._dirty=true;requestAnimationFrame(()=>{if(A._dirty)A.renderNow()})};
  A.svg=(id,html)=>{
    const P=A.panels[id];if(!P)return;
    if(A._graphFrame)A._graphFrame.outputs.set(P,{html});
    else writeSvg(P,html);
  };

  /* ---------- temps ---------- */
  let last=0;
  const playBtn=$('.ak-play',tr);
  A.play=on=>{on=on===undefined?!A.running:on;if(on&&cfg.peutLire&&!cfg.peutLire(A))on=false;A.running=on;playBtn.textContent=on?'❚❚ Pause':'▶ Lecture';if(on){last=performance.now();requestAnimationFrame(loop)}};
  function loop(now){if(!A.running)return;const dt=Math.min(.05,(now-last)/1000)*A.speed;last=now;if(cfg.step)cfg.step(A,dt);A.renderNow();requestAnimationFrame(loop)}
  A.stepOnce=()=>{A.play(false);if(cfg.step)cfg.step(A,cfg.pas??1/24);A.render()};
  A.reset=()=>{A.play(false);A.t=0;if(cfg.reset)cfg.reset(A);A.render()};
  $('.ak-speed',tr).onchange=e=>{A.speed=+e.target.value};A.speed=cfg.vitesse||1;

  /* ---------- onglets ---------- */
  A.setTab=i=>{if(!tabs||i<0||i>=cfg.onglets.length)return;A.play(false);A.tab=i;A.cadrerTout();clearActivePresets();$$('.ak-tab',tabs).forEach((b,j)=>b.setAttribute('aria-selected',String(j===i)));if(cfg.onglet)cfg.onglet(A,i);refreshSettings();A.render()};

  /* ---------- thème, projection, plein écran ---------- */
  A.setTheme=t=>{root.dataset.theme=t;writeStore(THEME_KEY,t);readColors();syncMenu();A.renderNow()};
  A.setProj=on=>{
    ak.classList.toggle('is-proj',on);
    ak.classList.remove('drawer-open');
    projButton.classList.toggle('on',on);
    syncMenu();
    A.render();
  };
  const acts={
    play:()=>A.play(),step:()=>A.stepOnce(),reset:()=>A.reset(),
    help:()=>{dlg.showModal()},theme:()=>A.setTheme(root.dataset.theme==='dark'?'light':'dark'),
    image:()=>A.exportImage(),proj:()=>{
      const projected=ak.classList.contains('is-proj');
      A.setProj(!projected);
      if(cfg.menuCommun&&projected&&A.narrow)ak.classList.add('drawer-open');
    },
    fs:()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>A.toast('Plein écran refusé par le navigateur'))},
    settings:()=>{ak.classList.toggle('drawer-open');A.render()}
  };
  ak.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&acts[b.dataset.act])acts[b.dataset.act]()});
  addEventListener('keydown',e=>{
    if(dlg.open||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.target.matches('input,select,textarea'))return;
    const k=e.key.toLowerCase(), custom=cfg.touches&&cfg.touches[k];
    if(custom){e.preventDefault();custom(A);A.render();return}
    if(k===' '&&!tr.hidden){e.preventDefault();acts.play()}
    else if(k==='arrowright'&&!tr.hidden){e.preventDefault();acts.step()}
    else if(k==='r'&&!tr.hidden)acts.reset();
    else if(k==='h'||k==='?')acts.help();else if(k==='p')acts.proj();else if(k==='f')acts.fs();else if(k==='t')acts.theme();else if(k==='i')acts.image();
    else if(k==='+'||k==='='||k==='-'||k==='0'){const P=(A._hover&&!A._hover.el.hidden&&A._hover.vue)?A._hover:Object.values(A.panels).find(q=>q.vue&&!q.el.hidden);if(P){e.preventDefault();if(k==='0')A.cadrer(P);else A.zoomer(P,k==='-'?.8:1.25)}}
    else if(k==='escape'){ak.classList.remove('drawer-open');A.render()}
    else if(/^[1-9]$/.test(k))A.setTab(+k-1);
  });

  /* ---------- vue : zoom, cadrage, déplacement ---------- */
  const deplacable=P=>P.vue==='svg'||P.vue==='graphe';
  function zoomed(P){
    if(P.vue==='interne')return Math.abs(P.zoom-1)>1e-6;
    if(!deplacable(P))return false;
    const seuil=P.vue==='graphe'?1e-6:.5;
    return Math.abs(P.vz-1)>1e-6||Math.abs(P.vx)>seuil||Math.abs(P.vy)>seuil;
  }
  const markZoom=P=>{if(P.tools)P.tools.classList.toggle('is-zoomed',zoomed(P))};
  const graphAt=(P,x,y)=>P.graphs.find(g=>x>=g.x0&&x<=g.x0+g.w&&y>=g.y0&&y<=g.y0+g.h);
  function resetView(P){P.vz=1;P.vx=P.vy=0;P.zoom=1;P.panX=P.panY=0;markZoom(P)}
  A.zoomer=(P,f,px,py)=>{if(typeof P==='string')P=A.panels[P];if(!P||!P.vue)return;
    if(P.vue==='interne')P.zoom=Math.max(.4,Math.min(5,P.zoom*f));
    else{
      if(P.vue==='graphe'){
        const graph=graphAt(P,px,py);
        px=graph?(px-graph.x0)/graph.w:.5;
        py=graph?(py-graph.y0)/graph.h:.5;
      }else{px=px??P.w/2;py=py??P.h/2}
      const z=Math.max(.5,Math.min(8,P.vz*f)), delta=1/P.vz-1/z;
      P.vx+=px*delta;P.vy+=py*delta;P.vz=z;
    }
    markZoom(P);A.render()};
  A.deplacer=(P,dx,dy,px,py)=>{
    if(!deplacable(P))return;
    if(P.vue==='graphe'){const g=graphAt(P,px,py)||P.graphs[0];dx/=g.w;dy/=g.h}
    P.vx-=dx/P.vz;P.vy-=dy/P.vz;markZoom(P);A.render()
  };
  A.cadrer=P=>{if(typeof P==='string')P=A.panels[P];if(!P)return;resetView(P);A.render()};
  A.cadrerTout=()=>{for(const P of Object.values(A.panels))A.cadrer(P)};

  function wire(P){const N=P.node,pts=new Map();let mode=null,h=null,last=null,pin=null;
    const scr=e=>{const r=N.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    const toV=s=>P.vue==='svg'?[P.vx+s[0]/P.vz,P.vy+s[1]/P.vz]:s;
    const two=()=>{const[a,b]=[...pts.values()];return{d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,c:[(a[0]+b[0])/2,(a[1]+b[1])/2]}};
    N.addEventListener('pointerdown',e=>{
      const s=scr(e);A._hover=P;pts.set(e.pointerId,s);
      if(pts.size===2&&P.vue){if(mode==='drag'&&h&&h.end)h.end(e);mode='pinch';h=null;pin=two();N.setPointerCapture(e.pointerId);e.preventDefault();return}
      if(pts.size>1)return;
      const[x,y]=toV(s);
      if(deplacable(P)&&(e.shiftKey||e.button===1))mode='pan';
      else{h=P._drags.find(d=>!d.hit||d.hit(x,y,e))||null;
        if(h){mode='drag';if(h.start)h.start(x,y,e)}
        else if(deplacable(P)&&zoomed(P))mode='pan';
        else{mode=null;return}}
      last=s;N.setPointerCapture(e.pointerId);e.preventDefault();A.render()});
    N.addEventListener('pointermove',e=>{const s=scr(e);
      if(!pts.has(e.pointerId)){if(e.pointerType==='mouse'){const[x,y]=toV(s);N.style.cursor=P._drags.some(d=>d.hit&&d.hit(x,y,e))?'grab':(deplacable(P)&&(e.shiftKey||zoomed(P)))?'move':''}return}
      pts.set(e.pointerId,s);
      if(mode==='pinch'&&pts.size>=2){const q=two();A.zoomer(P,q.d/pin.d,q.c[0],q.c[1]);A.deplacer(P,q.c[0]-pin.c[0],q.c[1]-pin.c[1],q.c[0],q.c[1]);pin=q;return}
      if(mode==='pan'){A.deplacer(P,s[0]-last[0],s[1]-last[1],last[0],last[1]);last=s;return}
      if(mode==='drag'&&h){const[x,y]=toV(s);h.move(x,y,e);A.render()}});
    const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
      if(mode==='drag'&&h&&h.end)h.end(e);
      if(pts.size===0){mode=null;h=null}else if(mode==='pinch'){mode='pan';last=[...pts.values()][0]}
      A.render()};
    N.addEventListener('pointerup',end);N.addEventListener('pointercancel',end);
    if(P.vue){
      N.addEventListener('wheel',e=>{if(A.narrow&&!e.ctrlKey)return;e.preventDefault();const s=scr(e);A.zoomer(P,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),s[0],s[1])},{passive:false});
      N.addEventListener('dblclick',e=>{const[x,y]=toV(scr(e));if(!P._drags.some(d=>d.hit&&d.hit(x,y,e))&&zoomed(P))A.cadrer(P)});
      N.addEventListener('pointerenter',()=>{A._hover=P});
    }
  }
  for(const P of Object.values(A.panels))wire(P);
  A.drag=(id,h)=>{A.panels[id]._drags.push(h)};

  /* ---------- export image (toujours en thème clair) ---------- */
  A.exportImage=async()=>{
    const was=root.dataset.theme; root.dataset.theme='light'; readColors(); A.renderNow();
    const vis=Object.values(A.panels).filter(P=>!P.el.hidden), base=pwrap.getBoundingClientRect(), sc=2;
    const cv=document.createElement('canvas'); cv.width=Math.round(base.width*sc); cv.height=Math.round(base.height*sc);
    const ctx=cv.getContext('2d'); ctx.fillStyle=A.C.card; ctx.fillRect(0,0,cv.width,cv.height);
    const jobs=vis.map(P=>new Promise(res=>{const r=P.node.getBoundingClientRect(), x=(r.left-base.left)*sc, y=(r.top-base.top)*sc;
      if(P.type==='canvas'){ctx.drawImage(P.node,x,y,r.width*sc,r.height*sc);res();return}
      const clone=P.node.cloneNode(true); clone.setAttribute('width',r.width); clone.setAttribute('height',r.height);
      const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
      const im=new Image(); im.onload=()=>{ctx.drawImage(im,x,y,r.width*sc,r.height*sc);res()}; im.onerror=()=>res(); im.src=src;}));
    await Promise.all(jobs);
    root.dataset.theme=was; readColors(); A.renderNow();
    const a=document.createElement('a'); const tabName=cfg.onglets&&cfg.onglets.length>1?'_'+(A.tab+1):'';
    a.download=`${cfg.code}_${(cfg.fichier||cfg.titre).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_')}${tabName}.png`;
    a.href=cv.toDataURL('image/png'); a.click(); A.toast('Image enregistrée (thème clair)');
  };

  /* ---------- aide ---------- */
  function buildHelp(){
    const h=cfg.aide||{}, sec=(t,c)=>c?`<h4>${t}</h4>${/^\s*</.test(c)?c:`<p>${c}</p>`}`:'';
    dlg.innerHTML=`<header><h3>Aide · ${cfg.titre}</h3><button class="mini" data-close>Fermer ✕</button></header><div class="db">
    ${cfg.sousTitre?`<p class="ak-dlg-sub">${cfg.sousTitre}</p>`:''}${sec('Ce qu\'on voit',h.voit)}${sec('Ce qu\'on peut faire',h.faire)}${sec('Modèle et hypothèses',h.modele)}${sec('Lien avec le cours',h.cours)}${sec('Pour aller plus loin',h.plus)}
    <h4>Raccourcis</h4><p>${cfg.temps?'<kbd>Espace</kbd> lecture / pause · <kbd>→</kbd> pas à pas · <kbd>R</kbd> recommencer · ':''}${tabs?`<kbd>1</kbd>–<kbd>${cfg.onglets.length}</kbd> onglets · `:''}<kbd>P</kbd> projection · <kbd>F</kbd> plein écran · <kbd>T</kbd> thème · <kbd>I</kbd> image · <kbd>H</kbd> aide${h.touches?' · '+h.touches:''}</p>
    <p>Vue : molette, pincement ou <kbd>+</kbd> <kbd>−</kbd> pour zoomer · <kbd>Maj</kbd> + glisser, deux doigts, ou glisser une vue zoomée pour la déplacer · « Cadrer », <kbd>0</kbd> ou double clic : vue initiale · Double-clic sur un curseur : valeur par défaut.</p>
    ${h.credits?`<h4>Crédits</h4><p>${h.credits}</p>`:''}</div>`;
    dlg.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===dlg)dlg.close()});
  }

  /* ---------- démarrage ---------- */
  buildSettings(); buildHelp(); readColors();
  if(cfg.init)cfg.init(A);
  refreshSettings(); A.reset();
  new ResizeObserver(()=>A.render()).observe(ak);
  return A;
}

window.AnimKit={app,fmt,M,ticks,niceStep,FONT,MATH,interrupteur};
})();

<script>
'use strict';

/* TH1 · A3 · Turboréacteur idéal et cycle de Brayton : modèle du cours (III.2), sans schéma numérique.

   Air : gaz parfait, c_P et γ constants. Compresseur, turbine et tuyère adiabatiques et réversibles ; combustion modélisée
   par un transfert thermique isobare q_comb ; w_turb = −w_comp ; énergies cinétiques négligées sauf en sortie de tuyère ;
   c_1 ≈ 0 (essai au sol) ; P_5 = P_1 ; débit de kérosène négligé devant celui de l'air.
   Avec τ = β^((γ−1)/γ) : T_2 = τ T_1, T_4 = T_3 − (T_2 − T_1), T_5 = T_3/τ, c_5 = √(2 c_P (T_4 − T_5)), η = 1 − 1/τ.

   Les profils T(x), P(x), c(x) à l'intérieur des organes ne figurent pas dans le cours (qui ne définit que les états
   aux frontières) : ce sont des interpolations illustratives qui respectent le modèle (isentrope dans le compresseur,
   la turbine et la tuyère ; chauffage uniforme dans la chambre) et raccordent exactement les états 1 à 5.
   Abscisse x : unités du schéma du cours (entrée d'air de 0 à 1.5, compresseur 1.5 à 5, chambre 5 à 8, turbine 8 à 10.5,
   tuyère 10.5 à 12.5). Entropie massique s mesurée à partir de l'état 1 (s_1 = 0). */
const TH1Brayton = (() => {
  const T1 = 288, P1 = 1, GAMMA = 1.4, CP = 1000, DM = 100, PCI = 43e6;
  const KAPPA = (GAMMA - 1) / GAMMA, R = CP * KAPPA;
  const XS = [1.5, 5, 8, 10.5, 12.5], XEND = XS[4];

  const betaMax = T3 => Math.pow(T3 / T1, 1 / KAPPA);
  const betaOpt = T3 => Math.pow(Math.sqrt(T3 / T1), 1 / KAPPA);
  const tauOf = beta => Math.pow(beta, KAPPA);
  const eta = beta => 1 - 1 / tauOf(beta);
  const c5 = (beta, T3) => {
    const tau = tauOf(beta);
    const v = 2 * CP * (tau - 1) * (T3 / tau - T1);
    return v > 0 ? Math.sqrt(v) : 0;
  };
  const etaCarnot = T3 => 1 - T1 / T3;

  function create(beta0, T3) {
    const bm = betaMax(T3), clamped = beta0 > bm;
    const beta = Math.min(Math.max(beta0, 1), bm);
    const tau = tauOf(beta);
    const T2 = tau * T1, T4 = Math.max(T3 - (T2 - T1), T1), T5 = T3 / tau;
    const P2 = beta * P1, P4 = P2 * Math.pow(T4 / T3, 1 / KAPPA);
    const wcomp = CP * (T2 - T1), wturb = -wcomp, qcomb = CP * (T3 - T2);
    const vit5 = c5(beta, T3), ec5 = vit5 * vit5 / 2;
    const s3 = CP * Math.log(T3 / T2);
    const M = {beta, betaMax: bm, betaOpt: betaOpt(T3), clamped, tau, T1, T2, T3, T4, T5, P1, P2, P3: P2, P4, P5: P1,
      wcomp, wturb, qcomb, c5: vit5, ec5, eta: 1 - 1 / tau, etaCarnot: etaCarnot(T3), s3, qrej: CP * (T5 - T1),
      Dm: DM, Dker: DM * qcomb / PCI, poussee: DM * vit5, puissance: DM * ec5};

    /* état d'une parcelle d'air à l'abscisse x */
    M.at = x => {
      let T = T1, P = P1, c = 0, organ = 'entrée d’air';
      if (x >= XS[0] && x < XS[1]) {
        const xi = (x - XS[0]) / (XS[1] - XS[0]);
        P = P1 * Math.pow(beta, xi); T = T1 * Math.pow(tau, xi); organ = 'compresseur';
      } else if (x >= XS[1] && x < XS[2]) {
        const xi = (x - XS[1]) / (XS[2] - XS[1]);
        P = P2; T = T2 + xi * (T3 - T2); organ = 'chambre de combustion';
      } else if (x >= XS[2] && x < XS[3]) {
        const xi = (x - XS[2]) / (XS[3] - XS[2]);
        T = T3 - xi * (T3 - T4); P = P2 * Math.pow(T / T3, 1 / KAPPA); organ = 'turbine';
      } else if (x >= XS[3]) {
        const xi = Math.min(1, (x - XS[3]) / (XS[4] - XS[3]));
        P = P4 * Math.pow(P1 / P4, xi); T = T4 * Math.pow(P / P4, KAPPA);
        c = Math.sqrt(Math.max(0, 2 * CP * (T4 - T))); organ = 'tuyère';
      }
      return {T, P, c, s: CP * Math.log(T / T1) - R * Math.log(P / P1), organ};
    };
    /* points 1 à 5 : T (K), P (bar), s (J.K⁻¹.kg⁻¹) */
    M.states = [[T1, P1, 0], [T2, P2, 0], [T3, P2, s3], [T4, P4, s3], [T5, P1, s3]];
    /* isobare du gaz parfait passant par (s0, T0) : T = T0 exp((s − s0)/c_P) */
    M.isobare = (T0, s0, s) => T0 * Math.exp((s - s0) / CP);
    return M;
  }
  return {T1, P1, GAMMA, CP, DM, PCI, XS, XEND, KAPPA, R, betaMax, betaOpt, tauOf, eta, c5, etaCarnot, create};
})();

// @titre Turboréacteur et cycle de Brayton · TH1 · MP
// @sortie ../TH1_Turboreacteur_Brayton/TH1_Turboreacteur_Brayton.html
// @inclure TH1_Brayton_Physique.js
// @description Turboréacteur idéal : températures le long du réacteur, cycle de Brayton dans le diagramme (T,s), effet de β et de T3 sur c5 et η.
'use strict';

(() => {
  const B = TH1Brayton;
  const {XS, XEND, T1, CP} = B;
  const UMAX = 14.4, PADL = 42, PADR = 14;
  const TMAXC = 2000, WREF = 1200e3, CREF = 1300;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const range = (id, label, min, max, step, value, unit, extra = {}) => ({id, label, min, max, step, value, unit, ...extra});
  const label = (a, x, y, html, o = {}) => a.S.text(x, y, html, {size: 13.5, ...o});
  const frames = {};
  const model = a => B.create(a.p.beta, a.p.T3);
  const sub = (s, i) => AnimKit.M.v(s, i);
  const LOGT = [0, Math.log10(3), 1, 1 + Math.log10(3), 2, 2 + Math.log10(3), 3];
  const logTick = v => String(Math.round(Math.pow(10, v)));

  /* échelle de couleur de la température : bleu (288 K) → orange → rouge (2000 K), échelle fixe */
  const rgb = s => {
    s = s.trim();
    if (s[0] === '#') {if (s.length === 4) s = '#' + [...s.slice(1)].map(x => x + x).join(''); return [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16));}
    return s.match(/[\d.]+/g).slice(0, 3).map(Number);
  };
  const tcolor = (C, T) => {
    const u = clamp((T - T1) / (TMAXC - T1), 0, 1), stops = [rgb(C.cold), rgb(C.E), rgb(C.hot)];
    const p = u * 2, i = Math.min(1, Math.floor(p)), f = p - i;
    return 'rgb(' + stops[i].map((v, j) => Math.round(v * (1 - f) + stops[i + 1][j] * f)).join(',') + ')';
  };

  const wallPts = [[0, 1.3], [1.5, 1.3], [5, .85], [8, .85], [10.5, 1.15], [12.5, .7]];
  const wall = x => {
    for (let i = 0; i < wallPts.length - 1; i++) {
      const [x0, y0] = wallPts[i], [x1, y1] = wallPts[i + 1];
      if (x <= x1) return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
    }
    return wallPts[wallPts.length - 1][1];
  };

  const sym = {
    T: (S, i) => S.v('T', i), c5: S => S.v('c', '5'), wcomp: S => S.v('w', 'comp'), wturb: S => S.v('w', 'turb'),
    qcomb: S => S.v('q', 'comb'), P1: S => S.v('P', '1'), beta: S => S.r('β'), eta: S => S.r('η')
  };

  const arrow2 = (a, x1, y1, x2, y2, col) => a.S.arrow(x1, y1, x2, y2, {c: a.C.card, w: 5.4, head: 12}) + a.S.arrow(x1, y1, x2, y2, {c: col, w: 2.6, head: 12});

  function notes(a, M) {
    const {S} = a;
    return M.clamped ? label(a, a.panels.scene.w - 12 * a.k, 14 * a.k,
      'β limité à ' + S.v('β', 'max') + ' = ' + a.fmt.sig(M.betaMax, 3) + ' (' + S.v('T', '2') + ' = ' + S.v('T', '3') + ')', {anchor: 'end', c: a.C.hot}) : '';
  }

  function parcelMetrics(a, M) {
    const s = M.at(a.t), {fmt} = a;
    return [
      {label: 'Parcelle · ' + AnimKit.M.v('T'), value: fmt.sig(s.T, 3), unit: 'K'},
      {label: 'Parcelle · P', value: fmt.sig(s.P, 3), unit: 'bar'},
      {label: 'Parcelle · c', value: fmt.sig(s.c, 3), unit: 'm·s<sup>−1</sup>'}
    ];
  }
  function valueMetrics(a, M) {
    const {fmt} = a;
    if (!a.p.valeurs) return [];
    return [
      {label: sub('T', '2') + ' − ' + sub('T', '1'), value: fmt.sig(M.T2 - M.T1, 3), unit: 'K'},
      {label: sub('T', '3') + ' − ' + sub('T', '4'), value: fmt.sig(M.T3 - M.T4, 3), unit: 'K'},
      {label: sub('q', 'comb'), value: fmt.sig(M.qcomb / 1e3, 3), unit: 'kJ·kg<sup>−1</sup>'},
      {label: sub('c', '5'), value: fmt.sig(M.c5, 3), unit: 'm·s<sup>−1</sup>'},
      {label: 'η', value: fmt.sig(M.eta, 3), unit: ''},
      {label: sub('D', 'kér'), value: fmt.sig(M.Dker, 2), unit: 'kg·s<sup>−1</sup>'},
      {label: 'Poussée', value: fmt.sig(M.poussee / 1e3, 3), unit: 'kN'}
    ];
  }

  /* ---------- onglet 1 : le réacteur coloré par la température et le profil T(x) aligné ---------- */
  function drawReactor(a) {
    const {S, C, k, fmt} = a, P = a.panels.scene, M = model(a), t = a.t;
    const W = P.w, H = P.h, padL = PADL * k, padR = PADR * k;
    const ux = (W - padL - padR) / UMAX, uy = Math.min(ux, (.46 * H - 14 * k) / 5.6), yc = 3.3 * uy + 8 * k, Hs = 5.6 * uy + 14 * k;
    const X = u => padL + u * ux, Y = (u, s = 1) => yc - s * u * uy;
    const narrow = ux < 38;
    let svg = '';
    // gaz coloré par la température locale
    const N = 160;
    for (let i = 0; i < N; i++) {
      const xa = XEND * i / N, xb = XEND * (i + 1) / N, col = tcolor(C, M.at((xa + xb) / 2).T);
      svg += S.path('M' + X(xa).toFixed(2) + ',' + Y(wall(xa)).toFixed(2) + 'L' + X(xb).toFixed(2) + ',' + Y(wall(xb)).toFixed(2) +
        'L' + X(xb).toFixed(2) + ',' + Y(wall(xb), -1).toFixed(2) + 'L' + X(xa).toFixed(2) + ',' + Y(wall(xa), -1).toFixed(2) + 'Z', {fill: col, c: col, w: .8, raw: true});
    }
    // parois, arbre, aubes
    for (const s of [1, -1]) svg += S.poly(wallPts.map(([x, h]) => [X(x), Y(h, s)]), {c: C.ink, w: 2.4});
    svg += S.rect(X(1.7), Y(.12), X(10.3) - X(1.7), .24 * uy, {fill: C.ink2, fop: .55, c: C.ink, w: 1.6});
    for (const x of [2, 2.5, 3, 3.5, 4, 4.5, 8.5, 9, 9.5, 10]) for (const s of [1, -1])
      svg += S.line(X(x), Y(.12, s), X(x), Y(wall(x) - .06, s), {c: C.ink, w: 1.7});
    // limites des organes et états
    XS.forEach((x, i) => {
      svg += S.line(X(x), Y(wall(x)), X(x), Y(wall(x), -1), {c: C.ink, w: 1.4, dash: '5 4'});
      svg += S.circle(X(x), Y(1.85), 11 * k, {fill: C.card, c: C.ink, w: 1.6});
      svg += label(a, X(x), Y(1.85), String(i + 1), {anchor: 'middle', c: C.ink, weight: 650, halo: false});
    });
    // noms des organes
    for (const [x, name, dy] of narrow ? [[.75, 'entrée', 0], [3.25, 'compr.', 0], [6.5, 'chambre', 0], [9.25, 'turbine', 0], [11.5, 'tuyère', 0]] : [[.75, 'entrée d’air', 0], [3.25, 'compresseur', 0], [6.5, 'chambre de combustion', 0], [9.25, 'turbine', 0], [11.5, 'tuyère', 0]])
      svg += label(a, X(x), Y(1.55, -1) + dy, name, {anchor: 'middle', c: C.ink});
    // échanges : flèches proportionnelles
    const Lmax = 1.5 * uy, lw = Math.min(M.wcomp / WREF * Lmax, 2 * uy), lq = Math.min(M.qcomb / WREF * Lmax, 2 * uy);
    const yw = Y(wall(3.25) + .12), yt = Y(wall(9.25) + .12), yq = Y(wall(6.5) + .12);
    svg += arrow2(a, X(3.25), yw - lw, X(3.25), yw, C.ink) + label(a, X(3.25), yw - lw - 12 * k, sym.wcomp(S), {anchor: 'middle', c: C.ink});
    svg += arrow2(a, X(9.25), yt, X(9.25), yt - lw, C.ink) + label(a, X(9.25), yt - lw - 12 * k, sym.wturb(S), {anchor: 'middle', c: C.ink});
    svg += arrow2(a, X(6.5), yq - lq, X(6.5), yq, C.hot) + label(a, X(6.5), yq - lq - 12 * k, (narrow ? '' : 'kérosène · ') + sym.qcomb(S), {anchor: 'middle', c: C.ink});
    svg += arrow2(a, X(.15), Y(0), X(1.15), Y(0), C.ink) + label(a, X(.65), Y(.38), 'air', {anchor: 'middle', c: C.ink});
    const l5 = M.c5 / CREF * 1.5 * ux;
    if (l5 > 1) svg += arrow2(a, X(12.65), Y(0), X(12.65) + l5, Y(0), C.ink) + label(a, X(12.65) + l5 / 2, Y(.42), sym.c5(S), {anchor: 'middle', c: C.ink});
    // échelle de couleur fixe
    const bw = Math.min(3.4 * ux, 150 * k), bx = X(UMAX) - 52 * k - bw, by = 8 * k, bh = 9 * k, nb = 24;
    for (let i = 0; i < nb; i++) svg += S.rect(bx + bw * i / nb, by, bw / nb + .6, bh, {fill: tcolor(C, T1 + (TMAXC - T1) * (i + .5) / nb)});
    svg += S.rect(bx, by, bw, bh, {c: C.ink2, w: 1});
    svg += label(a, bx - 5 * k, by + bh / 2, '288 K', {anchor: 'end', c: C.ink2, size: 13}) + label(a, bx + bw + 5 * k, by + bh / 2, '2000 K', {anchor: 'start', c: C.ink2, size: 13});
    // parcelle d'air suivie
    svg += S.circle(X(t), Y(0), 8 * k, {fill: C.card, c: C.ink, w: 2.4}) + S.circle(X(t), Y(0), 3 * k, {fill: C.ink});
    svg += notes(a, M);

    if (a.p.bas === 'cycle') {
      a.svg('scene', svg + cycleGraph(a, M, {x: 0, y: Hs, w: W, h: H - Hs}));
      a.clock('parcelle d’air : ' + M.at(t).organ);
      a.legend(cycleLegend(a));
      a.metrics([...parcelMetrics(a, M), ...aireMetrics(a, M), ...valueMetrics(a, M)]);
      return;
    }
    // profil de température, même abscisse que le schéma
    const G = S.graph({x: 0, y: Hs, w: W, h: H - Hs, padL, padR, xmin: 0, xmax: UMAX, ymin: 200, ymax: 2100, xticks: XS, xfmt: v => String(XS.indexOf(v) + 1),
      yticks: [400, 800, 1200, 1600, 2000], xlab: 'états', ylab: 'T (K)'});
    frames.prof = G;
    let g = svg + G.svg + S.clip('th1a3-prof', G);
    g += S.curve(Array.from({length: 241}, (_, i) => {const x = XEND * i / 240; return [x, M.at(x).T];}), G, {c: C.cInk, w: 3.2});
    g += S.line(G.X(t), G.y0, G.X(t), G.y0 + G.h, {c: C.ink2, w: 1.4, dash: '5 4'});
    M.states.forEach(([T], i) => {
      g += S.circle(G.X(XS[i]), G.Y(T), 4.6 * k, {fill: C.c, c: C.card, w: 1.2});
      if (a.p.valeurs) g += label(a, G.X(XS[i]) + (i === 4 ? -8 : 8) * k, G.Y(T) + (i === 0 ? -14 : i === 4 ? -13 : -13) * k, a.fmt.sig(T, 3) + ' K', {anchor: i === 4 ? 'end' : 'start', c: C.ink});
    });
    g += S.circle(G.X(t), G.Y(M.at(t).T), 6 * k, {fill: C.card, c: C.ink, w: 2.2});
    a.svg('scene', g);

    a.clock('parcelle d’air : ' + M.at(t).organ);
    a.legend([{c: C.cInk, label: 'T(x) le long du réacteur (profils internes illustratifs)'}, {c: C.ink, dot: true, label: 'Parcelle d’air suivie'}]);
    a.metrics([...parcelMetrics(a, M), ...valueMetrics(a, M)]);
  }

  /* ---------- le cycle de Brayton dans le diagramme (T,s) : onglet 2 en grand, onglet 1 sous le schéma ---------- */
  function cycleGraph(a, M, box) {
    const {S, C, k, fmt} = a, t = a.t, SK = 1e-3;
    const G = S.graph({x: box.x, y: box.y, w: box.w, h: box.h, xmin: -.3, xmax: 2.1, ymin: 0, ymax: 2100, yticks: [0, 500, 1000, 1500, 2000], xticks: [0, .5, 1, 1.5, 2],
      xlab: 's − s₁ (kJ·K⁻¹·kg⁻¹)', ylab: 'T (K)'});
    frames.cycle = G;
    const s3 = M.s3 * SK;
    const iso = (T0, s) => M.isobare(T0, 0, s / SK);
    const sample = (T0, sa, sb, n = 60) => Array.from({length: n + 1}, (_, i) => {const s = sa + (sb - sa) * i / n; return [s, iso(T0, s)];});
    let g = G.svg + S.clip('th1a3-cycle', G);
    // aires (prévision masquée par défaut)
    if (a.p.aires && s3 > 1e-3) {
      const hi = sample(M.T2, 0, s3), lo = sample(M.T1, 0, s3);
      const poly = pts => 'M' + pts.map(([s, T]) => G.X(s).toFixed(2) + ',' + G.Y(T).toFixed(2)).join('L');
      g += S.path(poly(hi) + 'L' + poly(lo.slice().reverse()).slice(1) + 'Z', {fill: C.c, fop: .42, c: 'none'});
      g += S.path(poly(lo) + 'L' + G.X(s3).toFixed(2) + ',' + G.Y(0).toFixed(2) + 'L' + G.X(0).toFixed(2) + ',' + G.Y(0).toFixed(2) + 'Z', {fill: C.pred, fop: .3, c: 'none'});
    }
    // isobares
    g += S.curve(sample(M.T1, -.2, 2.1, 90), G, {c: C.ink2, w: 1.3});
    g += S.curve(sample(M.T2, -.2, 2.1, 90), G, {c: C.ink2, w: 1.3});
    // cycle 1 → 2 → 3 → 4 → 5 → 1
    const cyc = {c: C.cInk, w: 3.6};
    g += S.line(G.X(0), G.Y(M.T1), G.X(0), G.Y(M.T2), cyc);
    g += S.curve(sample(M.T2, 0, s3), G, cyc);
    g += S.line(G.X(s3), G.Y(M.T3), G.X(s3), G.Y(M.T5), cyc);
    g += S.curve(sample(M.T1, s3, 0), G, {...cyc, dash: '10 7'});
    // sens de parcours
    const tang = (p, q) => S.arrow(G.X(p[0]) - 0, G.Y(p[1]), G.X(q[0]), G.Y(q[1]), {c: C.cInk, w: 3.6, head: 13});
    if (M.T2 - M.T1 > 150) g += tang([0, (M.T1 + M.T2) / 2 - 70], [0, (M.T1 + M.T2) / 2 + 70]);
    if (s3 > .08) g += tang([s3 / 2, iso(M.T2, s3 / 2 - .03)], [s3 / 2 + .03, iso(M.T2, s3 / 2 + .03)]);
    if (M.T3 - M.T5 > 150) g += tang([s3, (M.T3 + M.T5) / 2 + 70], [s3, (M.T3 + M.T5) / 2 - 70]);
    if (s3 > .08) g += tang([s3 / 2 + .03, iso(M.T1, s3 / 2 + .03)], [s3 / 2 - .03, iso(M.T1, s3 / 2 - .03)]);
    // étiquettes des isobares
    const l2 = Math.min(2.0, Math.log(1950 / M.T2) * CP * SK), l1 = Math.min(2.0, Math.log(1950 / M.T1) * CP * SK);
    g += label(a, G.X(l2) - 6 * k, G.Y(iso(M.T2, l2)) - 10 * k, sym.beta(S) + sym.P1(S), {anchor: 'end', c: C.ink2});
    g += label(a, G.X(l1) - 6 * k, G.Y(iso(M.T1, l1)) + 14 * k, sym.P1(S), {anchor: 'end', c: C.ink2});
    // points 1 à 5 (4 et 5 sur l'isentrope de 3)
    const pos = [[-1, 1], [-1, -.2], [1, -.3], [1, .3], [1, 1.2]];
    M.states.forEach(([T, , s], i) => {
      const sx = s * SK;
      g += S.circle(G.X(sx), G.Y(T), 5 * k, {fill: C.card, c: C.cInk, w: 2.2});
      const d = [[-9, 14], [-9, -2], [9, -12], [9, 2], [9, 14]][i];
      g += label(a, G.X(sx) + d[0] * k, G.Y(T) + d[1] * k, String(i + 1) + (a.p.valeurs ? ' · ' + fmt.sig(T, 3) + ' K' : ''), {anchor: i < 2 ? 'end' : 'start', c: C.ink, weight: 650});
    });
    // parcelle d'air
    const q = M.at(t);
    g += S.circle(G.X(q.s * SK), G.Y(q.T), 7.5 * k, {fill: C.card, c: C.ink, w: 2.4}) + S.circle(G.X(q.s * SK), G.Y(q.T), 2.8 * k, {fill: C.ink});
    return g;
  }
  const cycleLegend = a => {
    const leg = [{c: a.C.cInk, label: 'Cycle 1→2→3→5→1 (5→1 en tirets : dans l’atmosphère)'}, {c: a.C.ink2, label: 'Isobares P₁ et βP₁'}];
    if (a.p.aires) leg.push({c: a.C.c, label: 'Aire du cycle = énergie cinétique e<sub>c,5</sub>'}, {c: a.C.pred, label: 'Aire sous 5→1 = énergie rejetée'});
    return leg;
  };
  const aireMetrics = (a, M) => !a.p.aires ? [] : [
    {label: 'Aire sous 2→3 · ' + sub('q', 'comb'), value: a.fmt.sig(M.qcomb / 1e3, 3), unit: 'kJ·kg<sup>−1</sup>'},
    {label: 'Aire sous 5→1 · rejetée', value: a.fmt.sig(M.qrej / 1e3, 3), unit: 'kJ·kg<sup>−1</sup>'},
    {label: 'Aire du cycle · ' + sub('e', 'c,5'), value: a.fmt.sig(M.ec5 / 1e3, 3), unit: 'kJ·kg<sup>−1</sup>'}];

  /* ---------- onglet 2 : effet de β et de T3 sur c5 et η ---------- */
  function drawEffect(a) {
    const {S, C, k, fmt} = a, P = a.panels.scene, M = model(a), lb = Math.log10(M.beta), h1 = Math.round(.47 * P.h);
    const mk = o => S.graph({x: 0, w: P.w, padL: PADL * k, padR: PADR * k, xmin: 0, xmax: 3, xticks: LOGT, xfmt: logTick, ...o});
    const G1 = mk({y: 0, h: h1, padB: 6 * k, ymin: 0, ymax: 1400, yticks: [0, 400, 800, 1200], ylab: 'c₅ (m·s⁻¹)', xlabels: false});
    const G2 = mk({y: h1, h: P.h - h1, padB: 34 * k, ymin: 0, ymax: 1, yticks: [0, .2, .4, .6, .8, 1], ylab: 'η', xlab: 'β (échelle logarithmique)'});
    frames.gc = G1; frames.ge = G2;
    const curve = (T3, fn, n = 300) => {
      const lm = Math.log10(B.betaMax(T3)), pts = [];
      for (let i = 0; i <= n; i++) {const l = lm * i / n; pts.push([l, fn(Math.pow(10, l), T3)]);}
      return pts;
    };
    const others = a.p.comparer ? [1200, 1600, 1800].filter(T => T !== a.p.T3) : [];
    let g1 = G1.svg + S.clip('th1a3-c5', G1), g2 = G2.svg + S.clip('th1a3-eta', G2);
    const lmax = Math.log10(M.betaMax), lopt = Math.log10(M.betaOpt);
    if (a.p.reperes) {
      for (const [l, name] of [[lopt, S.v('β', 'opt')], [lmax, S.v('β', 'max')]]) {
        g1 += S.line(G1.X(l), G1.y0, G1.X(l), G1.y0 + G1.h, {c: C.ink2, w: 1.3, dash: '6 5'});
        g2 += S.line(G2.X(l), G2.y0, G2.X(l), G2.y0 + G2.h, {c: C.ink2, w: 1.3, dash: '6 5'});
        g1 += label(a, G1.X(l) + 5 * k, G1.y0 + 12 * k, name, {c: C.ink2});
      }
      g2 += S.line(G2.x0, G2.Y(M.etaCarnot), G2.x0 + G2.w, G2.Y(M.etaCarnot), {c: C.ink2, w: 1.3, dash: '6 5'});
      g2 += label(a, G2.x0 + 6 * k, G2.Y(M.etaCarnot) - 11 * k, 'η de Carnot = 1 − T₁/T₃', {c: C.ink2});
    }
    for (const T3 of others) {
      g1 += S.curve(curve(T3, B.c5), G1, {c: C.B, w: 2, dash: '8 6'});
      const lm = Math.log10(B.betaMax(T3));
      g1 += label(a, G1.X(lm) - 4 * k, G1.Y(0) - 12 * k, T3 + ' K', {anchor: 'middle', c: C.B});
      g2 += S.circle(G2.X(lm), G2.Y(B.eta(B.betaMax(T3))), 4.2 * k, {fill: C.B, c: C.card, w: 1.1}) + label(a, G2.X(lm), G2.Y(B.eta(B.betaMax(T3))) + (T3 > a.p.T3 ? -13 : 15) * k, T3 + ' K', {anchor: 'middle', c: C.B});
    }
    g1 += S.curve(curve(a.p.T3, B.c5), G1, {c: C.cInk, w: 3.4});
    g2 += S.curve(curve(a.p.T3, (b) => B.eta(b)), G2, {c: C.cInk, w: 3.4});
    if (a.p.reperes) {
      g1 += S.circle(G1.X(lopt), G1.Y(B.c5(M.betaOpt, a.p.T3)), 4.6 * k, {fill: C.card, c: C.cInk, w: 2});
      g2 += S.circle(G2.X(lmax), G2.Y(M.etaCarnot), 4.6 * k, {fill: C.card, c: C.cInk, w: 2});
    }
    for (const [G, gy, key] of [[G1, M.c5, 1], [G2, M.eta, 2]]) {
      const mark = S.line(G.X(lb), G.y0, G.X(lb), G.y0 + G.h, {c: C.ink, w: 1.4, dash: '5 4'}) + S.circle(G.X(lb), G.Y(gy), 6 * k, {fill: C.card, c: C.ink, w: 2.4}) +
        (a.p.valeurs ? label(a, G.X(lb) + 9 * k, G.Y(gy) - 12 * k, key === 1 ? fmt.sig(gy, 3) + ' m·s' + S.sup('−1') : fmt.sig(gy, 3), {c: C.ink}) : '');
      if (key === 1) g1 += mark; else g2 += mark;
    }
    a.svg('scene', g1 + g2 + '<g data-ak-hors-graphe>' + notes(a, M) + '</g>');

    a.clock('');
    const leg = [{c: C.cInk, label: 'T<sub>3</sub> = ' + fmt.sig(a.p.T3, 3) + ' K'}, {c: C.ink, dot: true, label: 'β choisi'}];
    if (others.length) leg.push({c: C.B, dash: true, label: 'Autres T<sub>3</sub> (même η, domaine plus court)'});
    a.legend(leg);
    const mm = [];
    if (a.p.valeurs) mm.push({label: sub('q', 'comb'), value: fmt.sig(M.qcomb / 1e3, 3), unit: 'kJ·kg<sup>−1</sup>'}, {label: sub('T', '2'), value: fmt.sig(M.T2, 3), unit: 'K'});
    if (a.p.reperes) mm.push({label: sub('β', 'opt'), value: fmt.sig(M.betaOpt, 3), unit: ''}, {label: sub('c', '5') + ' max', value: fmt.sig(B.c5(M.betaOpt, a.p.T3), 3), unit: 'm·s<sup>−1</sup>'},
      {label: sub('β', 'max'), value: fmt.sig(M.betaMax, 3), unit: ''});
    a.metrics(mm);
  }

  const seek = (a, x) => {a.t = clamp(x, 0, XEND);};
  AnimKit.app({
    code: 'TH1', partie: 'OrangeBrule', titre: 'Turboréacteur et cycle de Brayton',
    titreFenetre: 'Turboréacteur et cycle de Brayton · TH1 · MP',
    menuCommun: true, fichier: 'Turboreacteur_Brayton',
    onglets: ['Réacteur', 'Effet de β et de T₃'],
    panneaux: [{id: 'scene', poids: 1, ratioTel: 1.05}],
    temps: a => a.tab === 0, pas: .25,
    curseur: {max: () => XEND, get: a => a.t, set: seek},
    peutLire(a) {
      if (a.t >= XEND) a.t = 0;
      return true;
    },
    step(a, dt) {
      seek(a, a.t + dt * XEND / 10);
      if (a.t >= XEND) a.play(false);
    },
    onglet(a) {a.reset();},
    touches: {arrowleft(a) {a.play(false); seek(a, a.t - XEND / 40);}},
    reglages: [
      {titre: 'Situations', presets: [
        {label: 'Application 3 du cours', valeurs: {beta: 12, T3: 1400}},
        {label: 'Sans compression', valeurs: {beta: 1, T3: 1400}},
        {label: 'Poussée maximale', valeurs: {beta: Math.round(B.betaOpt(1400) * 10) / 10, T3: 1400}},
        {label: 'Rendement maximal', valeurs: {beta: Math.floor(B.betaMax(1400)), T3: 1400}},
        {label: 'T₃ élevée', valeurs: {beta: 30, T3: 1800}}
      ]},
      {titre: 'Réacteur', items: [
        range('beta', 'Rapport de compression β', 1, 300, 0, 12, '', {log: true, dec: 1, step: 'any'}),
        range('T3', 'Température d’entrée de turbine T<sub>3</sub>', 800, 2000, 10, 1400, 'K')
      ]},
      {titre: 'Affichage', items: [
        {id: 'bas', type: 'seg', label: 'Graphe sous le schéma', options: [['cycle', 'Cycle (T,s)'], ['profil', 'T le long du réacteur']], value: 'cycle', onglets: [0]},
        {id: 'valeurs', type: 'check', label: 'Afficher les valeurs calculées', value: false},
        {id: 'aires', type: 'check', label: 'Afficher les aires', value: false, si: a => a.tab === 0 && a.p.bas === 'cycle'},
        {id: 'reperes', type: 'check', label: 'Afficher β<sub>opt</sub>, β<sub>max</sub> et le rendement de Carnot', value: false, onglets: [1]},
        {id: 'comparer', type: 'check', label: 'Comparer avec d’autres T<sub>3</sub>', value: false, onglets: [1]}
      ]}
    ],
    aide: {
      voit: '<ul><li><b>Réacteur.</b> Schéma du cours : entrée d’air, compresseur (1→2), chambre de combustion (2→3), turbine (3→4), tuyère (4→5). Le gaz est coloré par sa température (échelle fixe, 288 à 2000 K). Les flèches w<sub>comp</sub>, w<sub>turb</sub>, q<sub>comb</sub> et c<sub>5</sub> sont proportionnelles à la grandeur. Le point blanc est une parcelle d’air que l’on suit de l’entrée à la sortie (lecture ou curseur) ; sa température, sa pression et sa vitesse sont lues dans les mesures. Sous le schéma, au choix : le cycle de Brayton dans le diagramme (T,s), où la parcelle parcourt les états 1 à 5 (par défaut), ou T le long du réacteur, aligné sur le schéma. Dans le diagramme (T,s), deux isobares exponentielles (P<sub>1</sub> et βP<sub>1</sub>) et deux isentropes verticales ; le cycle 1→2→3→5→1 ferme la boucle dans l’atmosphère (5→1 en tirets), et l’aire sous une isobare est le transfert thermique q = ∫T ds.</li>' +
        '<li><b>Effet de β et de T<sub>3</sub>.</b> Vitesse d’éjection c<sub>5</sub> et rendement η en fonction de β (échelle logarithmique). On peut cliquer ou glisser sur un graphe pour choisir β.</li></ul>',
      faire: '<p>Avant d’afficher les valeurs calculées, prévoir T<sub>2</sub>, T<sub>4</sub> et T<sub>5</sub> pour β = 12 et T<sub>3</sub> = 1400 K, puis vérifier : T<sub>2</sub> − T<sub>1</sub> = T<sub>3</sub> − T<sub>4</sub> (la turbine fournit exactement le travail du compresseur). Pour « Sans compression » (β = 1), prévoir η et c<sub>5</sub>.</p>' +
        '<p>Sous le schéma, avec le cycle (T,s), afficher les aires : l’aire du cycle est l’énergie cinétique c<sub>5</sub>²/2, différence entre l’aire sous 2→3 (q<sub>comb</sub>) et l’aire sous 5→1 (énergie rejetée).</p>' +
        '<p>Dans « Effet de β et de T<sub>3</sub> », faire varier T<sub>3</sub> à β fixé : η ne change pas, mais c<sub>5</sub> et la poussée augmentent. Faire croître β : η croît sans cesse, alors que c<sub>5</sub> passe par un maximum puis s’annule quand T<sub>2</sub> atteint T<sub>3</sub> (plus de combustion possible) ; η tend alors vers le rendement de Carnot 1 − T<sub>1</sub>/T<sub>3</sub>. La température T<sub>3</sub>, limitée par la tenue des aubes, borne l’énergie fournie à chaque kilogramme d’air.</p>',
      modele: '<p>Modèle du cours : air gaz parfait (γ = 1.4, c<sub>P</sub> = 1.0 kJ·K<sup>−1</sup>·kg<sup>−1</sup>), T<sub>1</sub> = 288 K, P<sub>1</sub> = 1.0 bar, c<sub>1</sub> ≈ 0 (essai au sol), P<sub>5</sub> = P<sub>1</sub>. Compresseur, turbine et tuyère adiabatiques et réversibles ; combustion modélisée par un transfert thermique isobare q<sub>comb</sub> ; w<sub>turb</sub> = −w<sub>comp</sub> ; débit de kérosène négligé ; énergies cinétiques négligées sauf en sortie de tuyère. Avec τ = β<sup>(γ−1)/γ</sup> : T<sub>2</sub> = τT<sub>1</sub>, T<sub>4</sub> = T<sub>3</sub> − (T<sub>2</sub> − T<sub>1</sub>), T<sub>5</sub> = T<sub>3</sub>/τ, c<sub>5</sub> = √(2c<sub>P</sub>(T<sub>4</sub> − T<sub>5</sub>)), η = 1 − 1/τ. Poussée D<sub>m</sub>c<sub>5</sub> avec D<sub>m</sub> = 100 kg·s<sup>−1</sup> ; débit de kérosène pour un pouvoir calorifique de 43 MJ·kg<sup>−1</sup>.</p>' +
        '<p><b>Limites.</b> Le cours ne définit que les états 1 à 5 : les profils de température, de pression et de vitesse à l’intérieur des organes sont des interpolations illustratives (isentrope dans le compresseur, la turbine et la tuyère, chauffage uniforme dans la chambre). Un réacteur réel a des pertes (rendements isentropiques inférieurs à 1, pertes de charge), brûle du kérosène et, sur un avion de ligne, est à double flux. Le diagramme (T,s) est un complément, hors des capacités exigibles en MP. β est limité à β<sub>max</sub> = (T<sub>3</sub>/T<sub>1</sub>)<sup>γ/(γ−1)</sup>, où T<sub>2</sub> = T<sub>3</sub>.</p>',
      cours: 'TH1 MP, III.2 « Turboréacteur » (application 3) et III.3 (diagramme (T,s), complément).'
    },
    init(a) {
      const keys = () => a.tab === 0 ? (a.p.bas === 'profil' ? ['prof'] : []) : a.tab === 1 ? ['gc', 'ge'] : [];
      const which = (x, y) => keys().find(id => {const f = frames[id]; return f && x >= f.x0 && x <= f.x0 + f.w && y >= f.y0 && y <= f.y0 + f.h;});
      let key = null;
      const apply = x => {
        const f = frames[key]; if (!f) return;
        if (a.tab === 0) seek(a, f.xv(x)); else a.set('beta', +clamp(Math.pow(10, f.xv(x)), 1, 300).toFixed(1));
      };
      a.drag('scene', {
        hit: (x, y) => Boolean(which(x, y)),
        start: (x, y) => {key = which(x, y); if (a.tab === 0) a.play(false); apply(x);},
        move: x => apply(x)
      });
    },
    draw(a) {
      if (a.tab === 0) drawReactor(a); else drawEffect(a);
    }
  });
})();

</script>
</body>
</html>
