  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

<script>
'use strict';
// Toutes les entrées sont en SI. Convention complexe exp(+jωt).
window.OS5Model = (() => {
 const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
 const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
 const mul=(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]];
 const scale=(a,k)=>[a[0]*k,a[1]*k];
 const div=(a,b)=>{const d=b[0]*b[0]+b[1]*b[1];return [(a[0]*b[0]+a[1]*b[1])/d,(a[1]*b[0]-a[0]*b[1])/d];};
 const abs=a=>Math.hypot(...a), phase=a=>a[0]===0&&a[1]===0?null:Math.atan2(a[1],a[0]);
 const at=(a,angle)=>a[0]*Math.cos(angle)-a[1]*Math.sin(angle);
 function characteristics(p){
  if(!['rlc','radio','spring','road'].includes(p.kind))throw new RangeError('Modèle inconnu');
  const electrical=p.kind==='rlc'||p.kind==='radio';
  const keys=electrical?['R','L','C','E']:['m','k','c','A'];
  if(!keys.every(k=>Number.isFinite(p[k])&&p[k]>0))throw new RangeError('Paramètres positifs et finis requis');
  const w0=electrical?1/Math.sqrt(p.L*p.C):Math.sqrt(p.k/p.m);
  const Q=electrical?Math.sqrt(p.L/p.C)/p.R:Math.sqrt(p.k*p.m)/p.c;
  const wr=Q>Math.SQRT1_2?w0*Math.sqrt(1-1/(2*Q*Q)):null;
  const s=Math.sqrt(4+1/(Q*Q)), w1=w0*2/(s+1/Q), w2=w0*(s+1/Q)/2;
  const roadPeak=w0*Math.sqrt(2/(1+Math.sqrt(1+2/(Q*Q))));
  return {w0,f0:w0/(2*Math.PI),Q,wr,w1,w2,bandwidth:w0/Q,roadPeak,electrical};
 }
 function response(p,w){
  if(!Number.isFinite(w)||w<0)throw new RangeError('Pulsation positive ou nulle requise');
  const m=characteristics(p),x=w/m.w0,D=[1-x*x,x/m.Q];
  const h=div([1,0],D),hi=div([0,x/m.Q],D);
  const hc=scale(h,p.E||1),ir=scale(hi,(p.E||1)/(p.R||1));
  const road=div([1,x/m.Q],D);
  const suspension=sub(road,[1,0]);
  const y=scale(p.kind==='road'?road:h,p.A||1);
  return {...m,w,x,D,h,hi,uc:hc,i:ir,ur:scale(hi,p.E||1),ul:scale(h,-(p.E||1)*x*x),road,suspension,y,
   travel:scale(suspension,p.A||1),acceleration:scale(y,-w*w),velocity:mul(y,[0,w])};
 }
 // Solution homogène exacte pour toute valeur de Q, temps réduit τ=ω0 t.
 function homogeneous(Q,tau,y0,v0){
  const b=1/(2*Q),d=b*b-1;
  let y,v;
  if(Math.abs(d)<1e-9){const B=v0+b*y0,e=Math.exp(-b*tau);y=e*(y0+B*tau);v=e*(B-b*(y0+B*tau));}
  else if(d<0){const a=Math.sqrt(-d),B=(v0+b*y0)/a,e=Math.exp(-b*tau),co=Math.cos(a*tau),si=Math.sin(a*tau);y=e*(y0*co+B*si);v=-b*y+e*a*(-y0*si+B*co);}
  else{const a=Math.sqrt(d),r1=-1/(b+a),r2=-b-a,A=(v0-r2*y0)/(r1-r2),B=y0-A; y=A*Math.exp(r1*tau)+B*Math.exp(r2*tau);v=r1*A*Math.exp(r1*tau)+r2*B*Math.exp(r2*tau);}
  return {y,v};
 }
 // État depuis le repos à t=0, excitation cosinus enclenchée en t=0.
 // Ressort: y(0)=v(0)=0. RLC: uC(0)=i(0)=0.
 function startup(p,w,t){
  if(t<0)throw new RangeError('Temps positif requis');
  const r=response(p,w),theta=w*t,h=r.h;
  const sh=homogeneous(r.Q,r.w0*t,-h[0],r.x*h[1]);
  const z=at(h,theta)+sh.y, v=at(mul(h,[0,r.x]),theta)+sh.v;
  return {...r,z,v,ucValue:r.electrical?p.E*z:null,iValue:r.electrical?p.E*p.C*r.w0*v:null,yValue:r.electrical?null:p.A*z};
 }
 return Object.freeze({add,sub,mul,scale,div,abs,phase,at,characteristics,response,homogeneous,startup});
})();

/* =====================================================================
   Outils communs des animations d'électrocinétique (OS1, OS2) · AnimKit · lot 13
   - OSK.unit(max, u)  : préfixe SI lisible (k, m, µ, n) ; renvoie {f, u}
   - OSK.plot(a, o)    : graphe temporel (ou autre) avec séries, remplissage signé, repères, curseur
   - OSC.*             : symboles de circuit (copie des symboles d'EM4), flèches de tension et de courant
   ===================================================================== */
'use strict';
globalThis.OSK=(()=>{
  const PREF=[[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p']];
  function unit(max,u){
    max=Math.abs(max);
    if(!(max>0)||!isFinite(max))return {f:1,u};
    for(const[s,p]of PREF)if(max>=s*.9995)return {f:1/s,u:p+u};
    return {f:1e12,u:'p'+u};
  }
  /** valeur et unité en texte : « 2.02 ms » */
  const qty=(a,x,u)=>{const q=unit(x,u);return a.fmt.sig(x*q.f,3)+' '+q.u};
  const thin=(pts,n=700)=>{if(pts.length<=n)return pts;const st=pts.length/n,o=[];for(let i=0;i<n;i++)o.push(pts[Math.floor(i*st)]);o.push(pts[pts.length-1]);return o};
  /**
   * o = {box,xmin,xmax,ymin?,ymax?,sym?,zero?,xlab,ylab,id,series:[{pts,c,w,dash,op}],
   *      signed:{pts,pos,neg}, hlines:[{y,c,dash,label}], marks:[{x,label,c}], cursor:x, dots:[{x,y,c}],
   *      tangent:{x,y,slope,half,c}, yticks, xticks, xfmt, yfmt, padL}
   */
  function plot(a,o){
    const S=a.S,k=a.k,C=a.C,box=o.box;
    let lo=o.ymin,hi=o.ymax;
    if(lo===undefined||hi===undefined){
      let l=Infinity,h=-Infinity;
      const scan=ps=>{for(const[x,y]of ps)if(isFinite(y)&&x>=o.xmin-1e-12&&x<=o.xmax+1e-12){if(y<l)l=y;if(y>h)h=y}};
      for(const s of o.series||[])scan(s.pts);
      if(o.signed)scan(o.signed.pts);
      for(const hl of o.hlines||[])if(isFinite(hl.y)){if(hl.y<l)l=hl.y;if(hl.y>h)h=hl.y}
      if(o.zero!==false){l=Math.min(l,0);h=Math.max(h,0)}
      if(!(h-l>1e-30)){h=1;l=o.sym?-1:0}
      if(o.sym){const m=Math.max(Math.abs(l),Math.abs(h));l=-m;h=m}
      const pd=(h-l)*.08;lo=o.ymin??(l-(l<0?pd:0));hi=o.ymax??(h+pd);
    }
    const G=S.graph({x:box.x+2*k,y:box.y+2*k,w:box.w-4*k,h:box.h-4*k,xmin:o.xmin,xmax:o.xmax,ymin:lo,ymax:hi,xlab:o.xlab,ylab:o.ylab,
      xticks:o.xticks,yticks:o.yticks,xfmt:o.xfmt,yfmt:o.yfmt,padL:o.padL,padB:o.padB,xlabels:o.xlabels});
    const id=(o.id||'g')+Math.round(box.y)+'_'+Math.round(box.x);
    let s=G.svg+S.clip(id,G);
    const inside=(ps)=>ps;
    if(o.signed){
      const pts=thin(o.signed.pts),y0=G.Y(0),pos=[],neg=[];
      for(const[x,y]of pts){if(!isFinite(y))continue;pos.push([G.X(x),G.Y(Math.max(0,y))]);neg.push([G.X(x),G.Y(Math.min(0,y))])}
      const poly=(arr,c)=>arr.length>1?`<path d="M${arr[0][0].toFixed(1)},${y0.toFixed(1)}${arr.map(p=>`L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('')}L${arr[arr.length-1][0].toFixed(1)},${y0.toFixed(1)}Z" fill="${c}" fill-opacity=".28" stroke="none"/>`:'';
      s+=`<g clip-path="url(#${id})">${poly(pos,o.signed.pos)}${poly(neg,o.signed.neg)}</g>`;
    }
    for(const hl of o.hlines||[]){if(!isFinite(hl.y))continue;
      s+=S.line(G.x0,G.Y(hl.y),G.x0+G.w,G.Y(hl.y),{c:hl.c||C.pred,w:1.3,dash:hl.dash===false?undefined:`${6*k} ${4*k}`,op:.85});
      if(hl.label)s+=S.text(G.x0+G.w-3*k,G.Y(hl.y)-9*k,hl.label,{anchor:'end',size:13,c:hl.c||C.ink2});}
    for(const m of o.marks||[]){if(m.x<o.xmin||m.x>o.xmax)continue;
      s+=S.line(G.X(m.x),G.y0,G.X(m.x),G.y0+G.h,{c:m.c||C.pred,w:1.2,dash:`${2*k} ${3*k}`,op:.7})+S.text(G.X(m.x)+4*k,G.y0+4*k,m.label,{base:'top',size:13,c:m.c||C.ink2});}
    for(const sr of o.series||[])s+=S.curve(thin(sr.pts),G,{c:sr.c,w:sr.w??2.6,dash:sr.dash?`${7*k} ${4*k}`:undefined,op:sr.op});
    if(o.tangent){const t=o.tangent,h=t.half;s+=S.curve([[t.x-h,t.y-t.slope*h],[t.x+h,t.y+t.slope*h]],G,{c:t.c||C.pred,w:1.8,dash:`${5*k} ${3*k}`});}
    if(o.cursor!==undefined&&o.cursor>=o.xmin&&o.cursor<=o.xmax)s+=S.line(G.X(o.cursor),G.y0,G.X(o.cursor),G.y0+G.h,{c:C.ink2,w:1,dash:`${3*k} ${4*k}`});
    for(const d of o.dots||[])if(isFinite(d.y)&&d.x>=o.xmin&&d.x<=o.xmax)s+=S.circle(G.X(d.x),G.Y(d.y),4*k,{fill:d.c});
    return {svg:s,G};
  }
  return Object.freeze({unit,qty,plot,thin});
})();

/* Symboles de circuit (normes françaises usuelles), en pixels d'écran. a = application AnimKit. */
globalThis.OSC=(()=>{
  const W=(a,x1,y1,x2,y2,c)=>a.S.line(x1,y1,x2,y2,{c:c||a.C.ink,w:2});
  function res(a,x1,y1,x2,y2,o={}){if(!(Math.hypot(x2-x1,y2-y1)>1))return '';const S=a.S,k=a.k,c=o.c||a.C.ink,L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L,len=Math.min(o.len??34*k,L*.8),wd=o.wd??11*k,mx=(x1+x2)/2,my=(y1+y2)/2;
    const p=(s,t)=>[mx+ux*s-uy*t,my+uy*s+ux*t];const q=[p(-len/2,-wd/2),p(len/2,-wd/2),p(len/2,wd/2),p(-len/2,wd/2)];
    return W(a,x1,y1,mx-ux*len/2,my-uy*len/2,c)+W(a,mx+ux*len/2,my+uy*len/2,x2,y2,c)+S.poly(q,{c,w:2,fill:o.fill||a.C.card,close:true});}
  function ind(a,x1,y1,x2,y2,o={}){if(!(Math.hypot(x2-x1,y2-y1)>1))return '';const S=a.S,k=a.k,c=o.c||a.C.ink,L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L,len=Math.min(o.len??44*k,L*.85),n=4,r=len/(2*n),mx=(x1+x2)/2,my=(y1+y2)/2,sd=o.side??1;
    const s0=[mx-ux*len/2,my-uy*len/2];let d=`M${s0[0].toFixed(1)},${s0[1].toFixed(1)}`;
    for(let j=0;j<n;j++){const e=[s0[0]+ux*2*r*(j+1),s0[1]+uy*2*r*(j+1)];d+=`A${r.toFixed(1)},${r.toFixed(1)} 0 0 ${sd>0?1:0} ${e[0].toFixed(1)},${e[1].toFixed(1)}`;}
    return W(a,x1,y1,s0[0],s0[1],c)+W(a,mx+ux*len/2,my+uy*len/2,x2,y2,c)+S.path(d,{c,w:2.4});}
  function gen(a,x,y,o={}){const S=a.S,k=a.k,c=o.c||a.C.ink,r=o.r??15*k;let s=S.circle(x,y,r,{fill:a.C.card,c,w:2});
    if(o.type==='~')s+=S.path(`M${x-r*.55},${y}c${r*.18},${-r*.5} ${r*.37},${-r*.5} ${r*.55},0s${r*.37},${r*.5} ${r*.55},0`,{c,w:1.8});
    else s+=S.line(x,y-r,x,y+r,{c,w:2});
    return s;}
  function sw(a,x1,y,x2,open,o={}){const S=a.S,k=a.k,c=o.c||a.C.ink;return S.circle(x1,y,2.6*k,{fill:c})+S.circle(x2,y,2.6*k,{fill:c})+S.line(x1,y,open?x2-2*k:x2,open?y-(x2-x1)*.55:y,{c,w:2.2});}
  function cap(a,x1,y1,x2,y2,o={}){if(!(Math.hypot(x2-x1,y2-y1)>1))return '';const S=a.S,k=a.k,c=o.c||a.C.ink,L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L,g=4*k,hw=11*k,mx=(x1+x2)/2,my=(y1+y2)/2;
    const p=(t,n)=>[mx+ux*t-uy*n,my+uy*t+ux*n];
    return W(a,x1,y1,...p(-g,0),c)+W(a,...p(g,0),x2,y2,c)+S.line(...p(-g,-hw),...p(-g,hw),{c,w:2.4})+S.line(...p(g,-hw),...p(g,hw),{c,w:2.4});}
  /** flèche de tension (à côté d'un dipôle), de (x1,y1) vers (x2,y2) */
  function volt(a,x1,y1,x2,y2,lab,o={}){const S=a.S,k=a.k,c=o.c||a.C.F;return S.arrow(x1,y1,x2,y2,{c,w:1.8,dash:o.dash})+S.text((x1+x2)/2+(o.dx??10*k),(y1+y2)/2+(o.dy??0),lab,{size:15,c,anchor:o.anchor||'start'});}
  /** flèche de courant (référence) sur un fil */
  function cur(a,x,y,dir,lab,o={}){const S=a.S,k=a.k,c=o.c||a.C.E,L=o.len??18*k,d=dir==='l'?[-1,0]:dir==='r'?[1,0]:dir==='u'?[0,-1]:[0,1];
    return S.arrow(x-d[0]*L/2,y-d[1]*L/2,x+d[0]*L/2,y+d[1]*L/2,{c,w:2.4,head:9*k})+S.text(x+(o.lx??(d[1]?12*k:0)),y+(o.ly??(d[0]?-14*k:0)),lab,{size:15,c,anchor:d[1]?'start':'middle'});}
  function solenoid(a,x1,x2,cy,r,o={}){const S=a.S,k=a.k,c=o.c||a.C.E,n=o.turns??14;let s='';
    if(o.fill)s+=S.rect(x1,cy-r,x2-x1,2*r,{fill:o.fill,fop:o.fop??.2});
    for(let j=0;j<n;j++){const x=x1+(x2-x1)*(j+.5)/n,dx=(x2-x1)/n*.35;
      s+=S.path(`M${(x-dx).toFixed(1)},${(cy+r).toFixed(1)}L${(x+dx).toFixed(1)},${(cy-r).toFixed(1)}`,{c,w:2.2,op:.9})+S.path(`M${(x+dx).toFixed(1)},${(cy-r).toFixed(1)}L${(x+dx*2.8).toFixed(1)},${(cy+r).toFixed(1)}`,{c,w:1.2,op:.35});}

  return Object.freeze({res,ind,gen,sw,cap,volt,cur,solenoid,W});
})();

  const all=samples(a,q,key),gh=st.ghost?samples(a,st.ghost.q,st.ghost.key):null,both=a.p.both&&kd==='rlc',sec=both?samples(a,q,key==='i'?'uc':'i'):null;
  const show=canShow(a),top=show?20*k:4*k,hA=(h-top)*.62,b1={x:0,y:B.y+top,w,h:hA},b2={x:0,y:B.y+top+hA,w,h:h-top-hA};
  const gf=s=>norm?s.o.gain:phys(s.o),xt=[0,1,2,3,4].map(i=>R[0]+i*(R[1]-R[0])/4);
  const ymax=norm?a.p.gmax:a.p.pmax,ser=[];
  if(gh)ser.push({pts:gh.map(s=>[s.f,gf(s)]),c:C.ink2,dash:true,w:2.2});
  if(sec)ser.push({pts:sec.map(s=>[s.f,gf(s)]),c:C.B,dash:true,w:2.6});
  ser.push({pts:all.map(s=>[s.f,gf(s)]),c:C.F,w:3});
  const marks=[],hl=[];
  if(a.p.markers&&show){
    marks.push({x:m.f0,label:S.v('f','0'),c:C.cInk});
    if((kd==='rlc'&&key==='uc'||kd==='spring')&&m.wr)marks.push({x:m.wr/TAU,label:S.v('f','r'),c:C.pred});
    if((kd==='rlc'&&key==='i')||kd==='radio'){marks.push({x:m.w1/TAU,label:'',c:C.pred},{x:m.w2/TAU,label:'',c:C.pred});
      if(kd==='rlc')hl.push({y:norm?Math.SQRT1_2:q.E/q.R*1000*Math.SQRT1_2,label:S.v('I','max')+' / √2',c:C.pred})}
    if(kd==='road'&&key==='body'){marks.push({x:Math.SQRT2*m.f0,label:'√2 '+S.v('f','0'),c:C.pred});hl.push({y:norm?1:q.A*1000,label:S.v('A'),c:C.ink2})}
  }
  const dots=[];if(f>=R[0]&&f<=R[1]&&kd!=='radio')dots.push({x:f,y:gf({o}),c:C.F});
  const pl1=K.plot(a,{box:b1,id:'amp',xmin:R[0],xmax:R[1],ymin:0,ymax,xticks:xt,xlab:'f (Hz)',ylab:norm?o.d.norm(S.v):o.d.lab+' ('+pUnit(o)+')',series:ser,marks,hlines:hl,cursor:kd==='radio'?undefined:f,dots,padB:16*k});
  let s=pl1.svg,G=pl1.G;st.g.amp=G;
  if(show)for(const x of xt.slice(1,4))s+=S.text(G.X(x),G.y0-8*k,a.fmt.sig(x/m.f0,2),{anchor:'middle',size:12,c:C.ink2,halo:false});
  if(show)s+=S.text(G.x0+G.w,G.y0-8*k,'f / '+S.v('f','0'),{anchor:'end',size:12,c:C.ink2,halo:false});
  if(kd==='radio')SRC.forEach((sr,i)=>{const v=gf({o:outInfo(q,'ur',TAU*sr.f)})*sr.a,x=G.X(sr.f);
    s+=S.line(x,G.Y(0),x,G.Y(v),{c:i===1?C.E:C.B,w:4*k})+S.circle(x,G.Y(v),4.5*k,{fill:C.ink})+S.text(x,G.Y(v)-12*k,sr.name,{anchor:'middle',size:15})});
  if(a.p.rulers&&(kd==='rlc'||kd==='spring'))st.ruler.forEach((x,i)=>{if(x<R[0]||x>R[1])return;
    s+=S.line(G.X(x),G.y0,G.X(x),G.y0+G.h,{c:C.E,w:1.6,dash:`${3*k} ${4*k}`})+S.circle(G.X(x),G.y0+G.h,7*k,{fill:C.E})+S.text(G.X(x),G.y0+G.h-14*k,String(i+1),{anchor:'middle',size:14,c:C.E})});
  const [p0,p1]=phaseRange(a),pt=[0,1,2,3].map(v=>v*Math.PI/2).filter(v=>v>=p0-.01&&v<=p1+.01).concat([-1,-2].map(v=>v*Math.PI/2).filter(v=>v>=p0-.01&&v<=p1+.01));
  const pser=[];
  if(gh)pser.push({pts:phasePts(a,gh),c:C.ink2,dash:true,w:2});
  if(sec)pser.push({pts:phasePts(a,sec),c:C.B,dash:true,w:2.4});
  pser.push({pts:phasePts(a,all),c:C.F,w:2.8});
  const pmk=a.p.markers&&show?[{x:m.f0,label:'',c:C.cInk}]:[],pd=[];
  if(o.phase!==null&&f>=R[0]&&f<=R[1]&&kd!=='radio')pd.push({x:f,y:o.phase+(kd==='road'&&key==='acc'&&o.phase<-.01?TAU:0),c:C.F});
  if(a.p.markers&&show){const o0=outInfo(q,key,m.w0);if(o0.phase!==null)pd.push({x:m.f0,y:o0.phase,c:C.cInk});
    if(m.wr&&(kd==='spring'||(kd==='rlc'&&key==='uc'))){const o1=outInfo(q,key,m.wr);if(o1.phase!==null)pd.push({x:m.wr/TAU,y:o1.phase,c:C.pred})}}
  const pl2=K.plot(a,{box:b2,id:'pha',xmin:R[0],xmax:R[1],ymin:p0,ymax:p1,xticks:xt,yticks:pt,yfmt:PIf,xlab:'f (Hz)',ylab:S.v('φ')+' (rad)',series:pser,marks:pmk,cursor:kd==='radio'?undefined:f,dots:pd});
  st.g.ph=pl2.G;s+=pl2.svg;
  return s;
}
function temps(a,B){
  const P={w:a.panels.graphes.w,h:B.h},S=a.S,C=a.C,k=a.k,ti=timeInfo(a),ms=ti.dur<.1,fc=ms?1000:1,tm=a.p.tmax,N=520,inp=[],out=[];
  for(let i=0;i<=N;i++){const t=ti.dur*i/N,v=normVal(a,t);inp.push([t*fc,v.inp]);out.push([t*fc,v.out])}
  const tc=tcur(a),vc=normVal(a,tc,kind(a)==='radio'||a.p.startup?undefined:st.s);
  const pl=K.plot(a,{box:{x:0,y:B.y,w:P.w,h:P.h},id:'tps',xmin:0,xmax:ti.dur*fc,ymin:-tm,ymax:tm,xlab:ms?'t (ms)':'t (s)',ylab:'signaux normalisés',
    series:[{pts:inp,c:C.E,dash:true,w:2.2},{pts:out,c:C.F,w:3}],cursor:tc*fc,dots:[{x:tc*fc,y:vc.out,c:C.F}],hlines:[{y:0,c:C.rule,dash:false}]});
  return pl.svg;
}

/* ---------- réglages, mesures ---------- */
const PAR=['rR','rL','rC','rE','sm','sk','sc','sA','dm','dk','dc','dA','dl','aR','aL','aC'];
const FREQ=['rf','sf','dv'];
function setp(a,o){for(const[k,v]of Object.entries(o))a.set(k,v,{silent:true})}
function setFreq(a,f){const k=kind(a);
  if(k==='road')a.set('dv',clampv(f*3.6*a.p.dl,0,180),{silent:true});
  else if(k==='rlc')a.set('rf',clampv(f,0,2000),{silent:true});
  else if(k==='spring')a.set('sf',clampv(f,0,20),{silent:true});
  if(k!=='road')st.s=0;
  if(freq(a)<st.range[0]||freq(a)>st.range[1])frame(a);}
function commit(a){st.s=0;frame(a);cadrerY(a)}
function preset(a,name){
  const k=kind(a);setp(a,INIT[k]);const m=chr(a);
  if(k==='rlc'){const o={};if(name==='broad')o.rR=150;if(name==='threshold')o.rR=Math.sqrt(2*(a.p.rL/1000)/(a.p.rC*1e-6));if(name==='nopeak')o.rR=300;if(name==='large')o.rR=8;setp(a,o);a.set('rf',chr(a).f0,{silent:true})}
  else if(k==='spring'){if(name==='broad')a.set('sc',4,{silent:true});if(name==='threshold')a.set('sc',Math.sqrt(2*a.p.sk*a.p.sm),{silent:true});a.set('sf',chr(a).f0*(name==='slow'?.15:name==='fast'?3:1),{silent:true})}
  else if(k==='road'){if(name==='soft')a.set('dc',250,{silent:true});if(name==='damped')a.set('dc',4000,{silent:true});
    if(name==='resonance')a.set('dv',m.roadPeak/TAU*3.6*a.p.dl,{silent:true});if(name==='isolation')a.set('dv',m.f0*3*3.6*a.p.dl,{silent:true})}
  else{const tg=name==='A'?4200:name==='C'?5800:5000;a.set('aC',1/((TAU*tg)**2*(a.p.aL/1000))*1e9,{silent:true});if(name==='broad')a.set('aR',160,{silent:true});if(name==='sharp')a.set('aR',8,{silent:true})}
  st.ruler=[chr(a).f0*.8,chr(a).f0*1.2];commit(a)}
const RG=(id,label,min,max,step,value,unit,tab,more)=>Object.assign({id,label,min,max,step,dec:step<.1?2:step<1?1:0,value,unit,si:a=>a.tab===tab},more||{});
function insight(a){
  const k=kind(a),m=chr(a),key=outKey(a),r=MD.response(pm(a),TAU*freq(a));
  if(k==='rlc')return key==='i'?'courant maximal à f<sub>0</sub> ; largeur à −3 dB : Δf = f<sub>0</sub>/Q = '+a.fmt.sig(m.bandwidth/TAU,3)+' Hz':(m.wr?'pic de tension à f<sub>r</sub> = '+a.fmt.sig(m.wr/TAU,3)+' Hz, distinct de f<sub>0</sub>':'Q ≤ 1/√2 : pas de pic de tension à fréquence non nulle');
  if(k==='spring')return m.wr?'pic à f<sub>r</sub> = '+a.fmt.sig(m.wr/TAU,3)+' Hz':'Q ≤ 1/√2 : pas de résonance en élongation à fréquence non nulle';
  if(k==='road'){const tr=MD.abs(r.road);return 'caisse / route : '+a.fmt.sig(tr,3)+(r.x>Math.SQRT2?' (f/f<sub>0</sub> > √2 : atténué)':' (f/f<sub>0</sub> < √2 : amplifié)')}
  return 'bande à −3 dB : Δf = '+a.fmt.sig(m.bandwidth/TAU,3)+' Hz'}
function info(a){
  const k=kind(a),m=chr(a),o=cur(a),C=a.C,show=canShow(a),q=pm(a),f=freq(a),M=[],tl=timeInfo(a);
  a.clock(a.p.startup?'t = '+K.qty(a,st.s,'s'):'f = '+a.fmt.sig(f,3)+' Hz'+(show?' · f / f<sub>0</sub> = '+a.fmt.sig(f/m.f0,3):''));
  if(k==='radio'){const am=SRC.map(s=>MD.abs(MD.response(q,TAU*s.f).hi)*s.a),w=am.indexOf(Math.max(...am));
    M.push({label:'Amplitudes de sortie A · B · C',value:am.map(x=>a.fmt.sig(x,2)).join(' · '),unit:'V',hint:'dominante : '+SRC[w].name+' ('+a.fmt.sig(SRC[w].f,4)+' Hz)'});}
  else M.push({label:o.d.lab+' · amplitude',value:qv(a,o.amp,o.d.u),hint:k==='road'?'débattement : '+K.qty(a,MD.abs(o.r.travel),'m')+' · accélération : '+a.fmt.sig(MD.abs(o.r.acceleration),3)+' m·s⁻²':''});
  M.push({label:'Déphasage '+Mh.v('φ'),value:o.phase===null?'indéfini':a.fmt.sig(o.phase*180/Math.PI,3),unit:o.phase===null?'':'°'});
  M.push({label:'Fréquence propre '+Mh.v('f','0'),value:show?a.fmt.sig(m.f0,4):'À déterminer',unit:show?'Hz':'',hint:show?insight(a):'repérer f<sub>0</sub> sur la phase'});
  M.push({label:'Facteur de qualité '+Mh.v('Q'),value:show?a.fmt.sig(m.Q,3):'À déterminer'});
  if(k==='rlc'){const Im=MD.abs(o.r.i);M.push({label:'Puissance moyenne dissipée '+Mh.v('⟨P⟩'),value:K.qty(a,.5*q.R*Im*Im,'W'),hint:'½ R I<sub>m</sub>²'})}
  if(a.p.rulers&&(k==='rlc'||k==='spring')){const d=Math.abs(st.ruler[1]-st.ruler[0]);
    M.push({label:'Mesure entre les repères '+Mh.v('Δf'),value:a.fmt.sig(d,3),unit:'Hz',hint:k==='rlc'&&outKey(a)==='i'&&d>0?'Q estimé = √(f<sub>1</sub>f<sub>2</sub>)/Δf = '+a.fmt.sig(Math.sqrt(st.ruler[0]*st.ruler[1])/d,3):''})}
  a.metrics(M);
  const L=[{c:C.F,label:'sortie : '+o.d.sig(Mh.v)}];
  if(a.p.both&&k==='rlc')L.push({c:C.B,dash:true,label:'l’autre grandeur'});
  L.push({c:C.E,dash:true,label:'entrée'});
  if(st.ghost)L.push({c:C.ink2,dash:true,label:'courbe mémorisée'});
  a.legend(L);
}

  ],
  aide:{
    voit:'À gauche, le montage (circuit, ressort, suspension ou récepteur radio) ; à droite, la <b>réponse en fréquence</b> (amplitude et phase) et les <b>signaux temporels</b>. La ligne verticale pointillée repère la fréquence d’excitation. Par défaut, les repères théoriques sont masqués : on lit f<sub>0</sub> sur la phase, le maximum sur l’amplitude, puis on vérifie. Ressort : axe <i>z</i> vers le bas, <i>z</i><sub>A</sub> déplacement du support, <i>Z</i><sub>m</sub> et <i>Z</i><sub>A,m</sub> amplitudes. Les échelles des axes sont fixes. L’animation est au ralenti, proportionnelle à la fréquence : 0.7 oscillation par seconde d’écran à f<sub>0</sub>, deux fois plus vite à 2 f<sub>0</sub>, à l’arrêt à fréquence nulle.',
    faire:'<ul><li>Cliquer ou glisser dans les courbes de réponse (ou régler le curseur de fréquence) pour déplacer l’excitation.</li><li>Choisir la grandeur de sortie : tension de C ou intensité, déplacement de la caisse, débattement, accélération.</li><li><b>Mémoriser la courbe</b>, changer R, Q ou m, comparer.</li><li><b>Démarrage depuis le repos</b> : transitoire puis régime sinusoïdal forcé.</li><li><b>Balayage</b> en fréquence depuis la valeur actuelle.</li><li><b>Deux repères</b> : largeur de bande Δf et estimation de Q.</li><li><b>Mode exercice</b> : f<sub>0</sub> et Q masqués jusqu’à « Révéler ».</li><li><b>Zoom +/−/Cadrer</b> agit sur l’axe des fréquences ; « Ajuster les échelles » recadre les ordonnées une fois.</li></ul>',
    modele:'Régime sinusoïdal forcé établi, notation complexe en exp(+jωt). RLC série : <i>U</i><sub>C</sub>/<i>E</i> = 1/<i>D</i> ; <i>R I</i>/<i>E</i> = (j<i>x</i>/<i>Q</i>)/<i>D</i> ; ω<sub>0</sub> = 1/√(<i>LC</i>), <i>Q</i> = √(<i>L</i>/<i>C</i>)/<i>R</i>. Pic de tension en ω<sub>r</sub> = ω<sub>0</sub>√(1 − 1/2<i>Q</i>²) si <i>Q</i> > 1/√2 ; bande passante −3 dB de l’intensité Δω = ω<sub>0</sub>/<i>Q</i>. Suspension à une masse (modèle de quart de véhicule) : <i>Y</i>/<i>R</i> = (1 + j<i>x</i>/<i>Q</i>)/<i>D</i>, atténuation pour <i>f</i>/<i>f</i><sub>0</sub> > √2. Le démarrage depuis le repos ajoute la solution homogène exacte. Puissance moyenne ⟨<i>P</i>⟩ = ½ <i>R I</i><sub>m</sub>².',
    cours:'OS5 : résonance en régime sinusoïdal forcé ; résonance en élongation (ressort) et en tension aux bornes du condensateur, résonance en intensité ; facteur de qualité et bande passante ; analogie électro-mécanique.'
  },
  init(a){
    a.drag('graphes',{
      hit:(x,y)=>kind(a)!=='radio'&&(inBox(st.g.amp,x,y)||inBox(st.g.ph,x,y)),
      start:(x,y)=>{st.drag=null;const G=st.g.amp;
        if(a.p.rulers&&a.tab<2&&inBox(G,x,y)){let dm=18*a.k;st.ruler.forEach((r,i)=>{const d=Math.abs(x-G.X(r));if(d<dm){dm=d;st.drag=i}})}
        pick(a,x,y)},
      move:(x,y)=>pick(a,x,y),end:()=>{st.drag=null}});
    st.ruler=[chr(a).f0*.8,chr(a).f0*1.2];commit(a);
  },
  reset(a){st.s=0},
  change(a,id,v){
    if(['markers','phasors','tensions','rulers','formules','gmax','pmax','tmax','ru1','ru2','exo','sweep'].includes(id)){
      if(id==='ru1')st.ruler[0]=v;if(id==='ru2')st.ruler[1]=v;if(id==='exo')st.reveal=false;
      if(id==='sweep'&&v){a.set('startup',false,{silent:true});a.play(true)}return}
    if(id==='o_rlc'||id==='o_road'){if(st.ghost&&st.ghost.key!==v)st.ghost=null;commit(a);return}
    if(id==='normalized'){if(!v)a.set('both',false,{silent:true});commit(a);return}
    if(id==='both'){if(v)a.set('normalized',true,{silent:true});cadrerY(a);return}
    if(id==='startup'){st.s=0;if(v)a.set('sweep',false,{silent:true});cadrerY(a);a.play(false);return}
    if(PAR.includes(id)||FREQ.includes(id)){if(id!=='dv')st.s=0;const f0=chr(a).f0;
      if((a.tab===2&&id==='dl')||f0<st.range[0]||f0>st.range[1]*.9||freq(a)>st.range[1]||freq(a)<st.range[0])frame(a)}
  },
  onglet(a,i){st.ghost=null;st.reveal=false;a.set('sweep',false,{silent:true});a.set('startup',false,{silent:true});a.set('phasors',false,{silent:true});a.set('exo',false,{silent:true});
    st.ruler=[chr(a).f0*.8,chr(a).f0*1.2];a.set('ru1',st.ruler[0],{silent:true});a.set('ru2',st.ruler[1],{silent:true});commit(a);a.play(true)},
  step(a,dt){
    const k=kind(a);
    if(a.p.sweep&&k!=='radio'){const R=st.range,nx=freq(a)+(R[1]-R[0])*dt/20;setFreq(a,nx>R[1]?R[0]:nx)}
    const ti=timeInfo(a);
    if(a.p.startup){st.s+=dt*ti.dur/12;if(st.s>=ti.dur){st.s=ti.dur;a.play(false)}}
    else if(k==='radio')st.s=(st.s+dt*.0005)%.002;
    else st.s=(st.s+dt*TAU*.7*freq(a)/ti.m.f0)%(3*TAU);
  },
  peutLire(a){if(a.p.startup&&st.s>=timeInfo(a).dur-1e-12)st.s=0;return true},
  draw(a){
    const k=kind(a);
    a.svg('scene','<g>'+(k==='rlc'?(a.p.phasors?scenePhasors(a):sceneCircuit(a)):k==='spring'?sceneSpring(a):k==='road'?sceneRoad(a):sceneRadio(a))+'</g>');
    const H=a.panels.graphes.h,B1={y:0,h:H*.66},B2={y:H*.66,h:H*.34};
    a.svg('graphes',reponse(a,B1)+temps(a,B2));info(a);
  }
});
function inBox(g,x,y){return g&&x>=g.x0&&x<=g.x0+g.w&&y>=g.y0&&y<=g.y0+g.h}
function pick(a,x,y){const G=st.g.amp;if(!G)return;const f=clampv(G.xv(x),st.range[0],st.range[1]);
  if(st.drag!==null){st.ruler[st.drag]=f;a.set(st.drag?'ru2':'ru1',clampv(f,.1,2000),{silent:true})}else setFreq(a,f)}

</script>
</body>
