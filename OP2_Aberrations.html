   Une animation décrit sa configuration et ses fonctions :
     AnimKit.app({
       code:'OP1', partie:'TurquoiseLagon', titre:'…', sousTitre:'…', chapitre:'OP1 Propagation de la lumière',
       onglets:['Vue de face','Perspective'],            // facultatif
       temps:true | (app)=>bool,                          // barre de lecture
       pas:1/24,                                          // durée simulée d'un « Pas »
       panneaux:[{id:'scene', titre:'…', poids:2, type:'svg'|'canvas', onglets:[0], ratioTel:.8, zoom:true}],
       reglages:[{titre:'Situations', presets:[{label, valeurs:{…}, lecture:true}]},
                 {titre:'…', items:[{id,type:'range'|'select'|'seg'|'check'|'boutons'|'note', …}], onglets:[…], si:(app)=>bool}],
       aide:{voit, faire, modele, cours},
       init(app), reset(app), step(app,dt), draw(app), change(app,id,v), onglet(app,i)
     })
   Le kit fournit : app.p (paramètres), app.tab, app.t, app.C (couleurs), app.k (échelle projection),
   app.S (dessin SVG), app.fmt (nombres), app.metrics(), app.insight(), app.legend(), app.clock(), app.drag()…
   Réglage à échelle logarithmique : {id,type:'range',log:true,min,max,dec} (curseur en log10, champ numérique en valeur réelle).
   Disposition facultative  atelier:{saisie:'Mes mesures', detail:'Voir le calcul'} : app.zones.saisie / .resultat / .detail
   (nœuds DOM à remplir par l'animation) ; pas de colonne de réglages.
   ===================================================================== */
(function(){
'use strict';
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const MATH='"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif';
const MINUS='−';

/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  /** n chiffres significatifs, sans notation exponentielle */
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e<-3||e>=6){const m=x/10**e;return (+m.toFixed(n-1)).toFixed(n-1).replace('-',MINUS)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>'}
    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

/* ---------------- mathématiques en HTML ---------------- */
const M={
  v:(s,sub,sup)=>`<span class="m">${s}</span>${sub!==undefined?`<sub>${sub}</sub>`:''}${sup!==undefined?`<sup>${sup}</sup>`:''}`,
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt"><span class="sym">√</span><span class="rad">${x}</span></span>`,
  vec:s=>`<span class="vec">${s}</span>`
};

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}
      return s;
    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const X=v=>x0+(v-o.xmin)/(o.xmax-o.xmin)*w, Y=v=>y0+h-(v-o.ymin)/(o.ymax-o.ymin)*h;
      let s='';
      const xt=o.xticks||ticks(o.xmin,o.xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5)))), yt=o.yticks||ticks(o.ymin,o.ymax,o.ny??Math.max(1,Math.round(h/(fs*3))));
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      const yAx=o.ymin<=0&&o.ymax>=0&&o.zeroAxis!==false?Y(0):y0+h, xAx=x0;
      s+=`<line x1="${n(x0)}" y1="${n(yAx)}" x2="${n(x0+w)}" y2="${n(yAx)}" stroke="${C0.ink2}" stroke-width="1.2"/><line x1="${n(xAx)}" y1="${n(y0)}" x2="${n(xAx)}" y2="${n(y0+h)}" stroke="${C0.ink2}" stroke-width="1.2"/>`;
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>o.xmin+(px-x0)/w*(o.xmax-o.xmin),yv:py=>o.ymin+(y0+h-py)/h*(o.ymax-o.ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){
      let d='',pen=false;
      for(const[x,y]of pts){if(!isFinite(y)||!isFinite(x)){pen=false;continue}
        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}
      return`<g clip-path="url(#${G.clip||''})">`+S.path(d,o)+'</g>';
    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}
  };
  return S;
}

/* ===================================================================== */
function app(cfg){
  const A={cfg,p:{},tab:0,t:0,running:false,speed:1,k:1,narrow:false,C:{},fmt,M,panels:{},_dirty:false};
  A.S=makeS(A);
  const root=document.documentElement;
  root.dataset.theme='dark';
  if(cfg.partie)root.style.setProperty('--chap',`var(--${cfg.partie})`);
  document.title=cfg.titreFenetre||`${cfg.titre} · ${cfg.code} · MPSI`;

  /* ---------- structure ---------- */
  const ak=el('div',{class:'ak',id:'ak'});
  const top=el('header',{class:'ak-top'});
  top.innerHTML=`<span class="ak-badge">${cfg.code}</span><div class="ak-titles"><h1 class="ak-title">${cfg.titre}</h1></div>
  <nav class="ak-tools" aria-label="Outils">
   <button class="ib ak-btn-settings" data-act="settings" title="Réglages">${IC.settings}<span class="ak-lbl">Réglages</span></button>
   <button class="ib" data-act="help" title="Aide (H)">${IC.help}<span class="ak-lbl">Aide</span></button>
   <button class="ib" data-act="theme" title="Thème clair / sombre (T)">${IC.theme}<span class="ak-lbl">Thème</span></button>
   <button class="ib" data-act="image" title="Enregistrer l'image (I)">${IC.image}<span class="ak-lbl">Image</span></button>
   <button class="ib" data-act="proj" title="Mode projection (P)">${IC.proj}<span class="ak-lbl">Projection</span></button>
   <button class="ib" data-act="fs" title="Plein écran (F)">${IC.fs}</button>
  </nav>`;
  ak.append(top);
  const tabs=cfg.onglets&&cfg.onglets.length>1?el('div',{class:'ak-tabs',role:'tablist'}):null;
  if(tabs){cfg.onglets.forEach((t,i)=>{const b=el('button',{class:'ak-tab',role:'tab','aria-selected':String(i===0),'data-tab':i},`<b>${i+1}</b>${t}`);b.onclick=()=>A.setTab(i);tabs.append(b)});ak.append(tabs)}
  const body=el('div',{class:'ak-body'}); ak.append(body);
  const main=el('main',{class:'ak-main'}); body.append(main);
  const scene=el('section',{class:'ak-card ak-scene'}); main.append(scene);
  /* disposition « atelier » (7 novembre 2026, facultative : cfg.atelier) :
     saisie à gauche ; résultat, graphique et détail du calcul à droite ; pas de colonne de réglages */
  A.zones={};
  if(cfg.atelier){
    const at=typeof cfg.atelier==='object'?cfg.atelier:{};
    ak.classList.add('ak-atelier');
    const left=el('section',{class:'ak-card ak-saisie'},`<div class="ak-zone-h">${at.saisie||'Mes mesures'}</div>`);
    A.zones.saisie=el('div',{class:'ak-saisie-body'}); left.append(A.zones.saisie);
    A.zones.resultat=el('section',{class:'ak-card ak-res','aria-live':'polite'});
    const det=el('details',{class:'ak-card ak-detail'},`<summary>${at.detail||'Voir le calcul'}</summary>`);
    A.zones.detail=el('div',{class:'ak-detail-body'}); det.append(A.zones.detail);
    body.insertBefore(left,main); main.insertBefore(A.zones.resultat,scene); main.append(det);
  }
  const pwrap=el('div',{class:'ak-panels'}); scene.append(pwrap);
  for(const pc of (cfg.panneaux||[{id:'scene'}])){
    const pe=el('div',{class:'ak-panel','data-id':pc.id}); pe.style.flex=`${pc.poids||1} 1 0`;
    if(pc.titre)pe.append(el('div',{class:'ak-phead'},pc.titre));
    const type=pc.type||'svg';
    const node=type==='canvas'?el('canvas'):document.createElementNS('http://www.w3.org/2000/svg','svg');
    if(type!=='canvas'){node.setAttribute('xmlns','http://www.w3.org/2000/svg');node.setAttribute('role','img');node.setAttribute('aria-label',pc.titre||cfg.titre)}
    pe.append(node);
    const P={id:pc.id,cfg:pc,el:pe,node,type,w:300,h:200,zoom:1,panX:0,panY:0,vz:1,vx:0,vy:0,_drags:[],head:pe.querySelector('.ak-phead')};
    /* Vue (7 novembre 2026) : tout panneau SVG se zoome, se cadre et se déplace (viewBox) ;
       un canvas déclaré zoom:true garde son zoom interne P.zoom, lu par l'animation. */
    P.vue=type!=='canvas'?(pc.zoom===false?null:'svg'):(pc.zoom?'interne':null);
    if(P.vue){const tl=el('div',{class:'ak-ptools'});tl.innerHTML='<button class="mini" data-z="-" title="Dézoomer (−)">−</button><button class="mini" data-z="0" title="Cadrer : vue initiale (0)">Cadrer</button><button class="mini" data-z="+" title="Zoomer (+)">+</button>';
      tl.onclick=e=>{const z=e.target.closest('[data-z]');if(!z)return;const v=z.dataset.z;if(v==='0')A.cadrer(P);else A.zoomer(P,v==='+'?1.25:.8)};P.tools=tl;pe.append(tl)}
    A.panels[pc.id]=P; pwrap.append(pe);
  }
  /* légende : bande fine entre la scène et la barre de lecture (6 novembre 2026) */
  const legend=el('div',{class:'ak-legend'}); scene.append(legend);
  const tr=el('div',{class:'ak-transport'});
  tr.innerHTML=`<button class="ib ak-play" data-act="play" title="Lecture / pause (Espace)">▶ Lecture</button>
   <button class="ib" data-act="step" title="Pas à pas (→)">${IC.step}<span class="ak-lbl">Pas</span></button>
   <button class="ib" data-act="reset" title="Recommencer (R)">${IC.reset}<span class="ak-lbl">Recommencer</span></button>
   <select class="ak-speed" title="Vitesse de lecture">${(cfg.vitesses||[.25,.5,1,2,4]).map(v=>`<option value="${v}"${v===(cfg.vitesse||1)?' selected':''}>× ${v}</option>`).join('')}</select>
   <input type="range" class="ak-scrub" min="0" max="1" step="any" value="0" aria-label="Curseur temporel" hidden><span class="ak-extra"></span><span class="ak-clock"></span>`;
  scene.append(tr);
  /* colonne de droite (6 novembre 2026) : réglages qui défilent, mesures en bas des réglages
     (sur téléphone, les mesures restent sous la scène) */
  const right=el('div',{class:'ak-right'}); body.append(right);
  const metrics=el('section',{class:'ak-metrics','aria-label':'Mesures'});
  const side=el('aside',{class:'ak-side','aria-label':'Réglages'});
  side.innerHTML='<div class="ak-drawer-head"><span>Réglages</span><button class="mini" data-act="settings">Fermer ✕</button></div>';
  right.append(side);
  /* pied de page supprimé le 6 novembre 2026 */
  const dlg=el('dialog',{class:'ak-dialog'}); const toastEl=el('div',{class:'ak-toast'});
  document.body.append(ak,dlg,toastEl);
  A.root=ak; A.extra=$('.ak-extra',tr);
  /* curseur temporel (facultatif) : cfg.curseur = {max:(a)=>…, get:(a)=>…, set:(a,v)=>…} */
  const scrub=$('.ak-scrub',tr);
  if(cfg.curseur){scrub.hidden=false;scrub.oninput=()=>{A.play(false);cfg.curseur.set(A,+scrub.value*cfg.curseur.max(A));A.render()}}
  const syncScrub=()=>{if(!cfg.curseur||document.activeElement===scrub)return;const m=cfg.curseur.max(A)||1;scrub.value=Math.max(0,Math.min(1,cfg.curseur.get(A)/m))};

  /* ---------- couleurs ---------- */
  function readColors(){
    const cs=getComputedStyle(ak), g=v=>cs.getPropertyValue(v).trim();
    const rgb=s=>{s=s.trim();if(s[0]==='#'){if(s.length===4)s='#'+[...s.slice(1)].map(x=>x+x).join('');return[1,3,5].map(i=>parseInt(s.slice(i,i+2),16))}return s.match(/[\d.]+/g).slice(0,3).map(Number)};
    const mix=(a,b,t)=>'rgb('+a.map((v,i)=>Math.round(v*t+b[i]*(1-t))).join(',')+')';
    const dark=root.dataset.theme==='dark', base=rgb(getComputedStyle(root).getPropertyValue('--'+(cfg.partie||'Anthracite')));
    const c=mix(base,base,1), cInk=dark?mix(base,[255,255,255],.5):mix(base,[0,0,0],.7), cSoft=dark?mix(base,rgb(g('--card')),.22):mix(base,rgb(g('--paper')),.1);
    A.C={paper:g('--paper'),card:g('--card'),ink:g('--ink'),ink2:g('--ink2'),rule:g('--rule'),grid:g('--grid'),c,cInk,cSoft,
      v:g('--q-v'),F:g('--q-F'),B:g('--q-B'),E:g('--q-E'),Ec:g('--q-Ec'),Ep:g('--q-Ep'),Em:g('--q-Em'),pred:g('--q-pred'),hot:g('--q-hot'),cold:g('--q-cold'),
      dark:root.dataset.theme==='dark'};
  }

  /* ---------- réglages ---------- */
  const items={}; const groups=[];
  function stepDec(st){const s=String(st);return s.includes('.')?s.split('.')[1].length:0}
  function buildSettings(){
    (cfg.reglages||[]).forEach(gc=>{
      const g=el('div',{class:'ak-card ak-grp'}); const h=el('h4',{},`<span></span>${gc.titre}`); g.append(h);
      groups.push({gc,el:g,h});
      if(gc.presets){const pr=el('div',{class:'ak-presets'});gc.presets.forEach(ps=>{const b=el('button',{class:'mini',title:ps.titre||''},ps.label);b.onclick=()=>A.preset(ps);ps._btn=b;pr.append(b)});g.append(pr)}
      for(const it of gc.items||[]){
        const box=el('div',{class:'ak-item'}); const type=it.type||'range';
        if(type==='range'){
          const dec=it.dec??stepDec(it.step??1);
          box.innerHTML=`<div class="ak-row"><label for="r_${it.id}">${it.label}</label><input class="ak-num" id="n_${it.id}" type="number" step="${it.step??1}" min="${it.min}" max="${it.max}" inputmode="decimal"><span class="ak-unit">${it.unit||''}</span></div><input type="range" id="r_${it.id}" min="${it.log?Math.log10(it.min):it.min}" max="${it.log?Math.log10(it.max):it.max}" step="${it.log?(it.stepLog??.002):(it.step??1)}">`;
          const R=$('input[type=range]',box), N=$('.ak-num',box);

        {label:'Focale sagittale S',action:a=>{a.set('autofocus',false);a.set('plane2',+calcGeo(a).fp[1].toFixed(2))}},
        {label:'Meilleur compromis',action:a=>a.set('autofocus',true)}]}]},
    {titre:'Corrections',onglets:[1],items:[
      {id:'ap2',label:'Rayon du diaphragme',min:1,max:17,step:.5,value:12,unit:'mm',dec:1},
      {id:'shape',type:'seg',label:'Forme de la lentille',options:[['biconvex','Biconvexe'],['plano','Plan-convexe']],value:'biconvex'},
      {id:'flip',type:'check',label:'Face plane tournée vers la lumière incidente',value:false,si:a=>a.p.shape==='plano'},
      {id:'asphere',type:'check',label:'Surfaces asphériques (coniques)',value:false},
      {id:'k',label:`Constante conique ${M.v('k')}`,min:-6,max:0,step:.025,value:-.7,dec:3,si:a=>a.p.asphere},
      {type:'boutons',items:[{label:'Diaphragmer',action:a=>a.set('ap2',3)},{label:'Ouvrir',action:a=>a.set('ap2',16)},
        {label:`Optimiser ${M.v('k')} sur l'axe`,action:optimiserK}]}]},
    {titre:'Affichage',items:[
      {id:'visual',type:'seg',label:'Vue agrandie',options:[['spot','Tache d\'un point'],['mire','Mire']],value:'spot',onglets:[1]},
      {id:'pixel',label:'Pas des pixels (loupe)',min:2,max:50,step:1,value:10,unit:'µm',onglets:[1],si:a=>a.p.visual==='spot'},
      {id:'ampl',type:'seg',label:'Distorsion dessinée',options:[[1,'réelle'],[10,'amplifiée × 10']],value:10,onglets:[1],si:a=>a.p.family==='distortion'&&a.p.visual==='mire'},
      {id:'parax',type:'check',label:'Repères de Gauss : foyer paraxial, focales T et S, grille idéale (masqués au départ)',value:false,onglets:[1]},
      {id:'foyers',type:'check',label:'Foyers de chaque couleur et valeurs (masqués au départ)',value:false,onglets:[0]}]}
  ],
  aide:{
    voit:'<ul><li><b>Chromatisme</b> : à gauche, les rayons marginaux de six longueurs d\'onde traversent une lentille simple ou un doublet ; à droite, une loupe autour des foyers (échelle longitudinale dilatée) et la coupe de la tache colorée sur le capteur.</li><li><b>Aberrations géométriques</b> : à gauche, les rayons d\'un plan méridien réellement réfractés par les deux faces d\'une lentille épaisse, le diaphragme et le capteur ; à droite, la tache d\'un point vue de face (impacts de tout le faisceau) ou une mire locale floutée par cette tache.</li></ul>',
    faire:'<ul><li>Choisir un défaut dans « Situations » ou « Phénomène ».</li><li>Glisser le capteur dans la scène, ou lancer la <b>Lecture</b> : le capteur balaie la zone de mise au point et la tache évolue (focales tangentielle et sagittale de l\'astigmatisme, cercle de moindre diffusion).</li><li>Corriger : diaphragmer, retourner une lentille plan-convexe, rendre les faces asphériques et optimiser <i class="m">k</i>, ou accoler un second verre (doublet).</li><li>Faire prévoir, puis cocher les repères de Gauss ou les foyers colorés.</li></ul>',
    modele:'<p><b>Chromatisme.</b> Lentilles minces, rayons paraxiaux. L\'indice suit une loi de Cauchy à termes en 1/λ² et 1/λ⁴, calée sur <i class="m">n</i><sub>d</sub> et <i class="m">V</i><sub>d</sub> = '+M.frac('<i class="m">n</i><sub>d</sub> − 1','<i class="m">n</i><sub>F</sub> − <i class="m">n</i><sub>C</sub>')+' ; la focale de la lentille simple vaut '+M.v('f')+'′(λ) = '+M.v('f','d')+'′ '+M.frac('<i class="m">n</i><sub>d</sub> − 1','<i class="m">n</i>(λ) − 1')+'. Le doublet idéal accolé vérifie <i class="m">C</i><sub>1</sub> + <i class="m">C</i><sub>2</sub> = '+M.frac('1',M.v('f','d')+'′')+' et '+M.frac('<i class="m">C</i><sub>1</sub>','<i class="m">V</i><sub>1</sub>')+' + '+M.frac('<i class="m">C</i><sub>2</sub>','<i class="m">V</i><sub>2</sub>')+' = 0 : les foyers F (486 nm) et C (656 nm) sont confondus, un faible spectre secondaire subsiste. Teintes conventionnelles, ni synthèse des couleurs ni diffraction.</p><p><b>Géométrie.</b> Lentille épaisse de verre <i class="m">n</i> = 1.52 (biconvexe <i class="m">R</i> = ±50 mm ou plan-convexe <i class="m">R</i> = 25 mm, 8 mm au centre), lumière monochromatique, objet à l\'infini vu sous l\'angle de champ, diaphragme 7 mm devant la lentille. Lois de Snell-Descartes appliquées exactement en 3D à 120 rayons. Le meilleur plan minimise l\'écart quadratique moyen (RMS) des impacts. Les défauts ne sont pas séparés artificiellement : plusieurs peuvent coexister. La mire (étoile de 3 mm de diamètre) est la moyenne d\'images décalées selon les impacts du faisceau ; la distorsion compare la position des barycentres au grandissement paraxial. Asphère conique : <i class="m">z</i>(<i class="m">r</i>) = '+M.frac('<i class="m">r</i><sup>2</sup>','<i class="m">R</i> (1 + '+M.sqrt('1 − (1 + <i class="m">k</i>) <i class="m">r</i><sup>2</sup>/<i class="m">R</i><sup>2</sup>')+')')+'.</p>',
    cours:'OP2 Formation des images : stigmatisme approché, conditions de Gauss, rôle du diaphragme (« plus plat, plus près »), taille des cellules du capteur.',
    plus:'L\'astigmatisme hors axe étudié ici existe pour une lentille de révolution ; il est différent de l\'astigmatisme de l\'œil (atelier « Œil et appareil photographique »). Diaphragmer réduit les aberrations mais aussi le flux reçu, et augmente la diffraction (non représentée).'
  },
  change(a,id,v){
    if(id==='family'){const F=FAM[v];a.set('angle',F.angle,{silent:true});a.set('ap2',F.ap,{silent:true});a.set('autofocus',F.af,{silent:true});
      if(F.plane)a.set('plane2',F.plane,{silent:true});if(v==='distortion')a.set('visual','mire',{silent:true})}
  },
  onglet(a){a.play(false)},
  reset(a){a.t=0},
  step(a,dt){
    a.t+=dt; const w=2*Math.PI/6, s=.5-.5*Math.cos(w*a.t);
    if(a.tab===0){const f1=O.chromatic(436,a.p.f,false),f2=O.chromatic(656.27,a.p.f,false),m=(f2-f1)*.6;a.set('plane',+(f1-m+s*(f2-f1+2*m)).toFixed(3),{silent:true})}
    else{if(a.p.autofocus)a.set('autofocus',false,{silent:true});const b=calcGeo(a).best;a.set('plane2',+K.clamp(b-5+10*s,30,85).toFixed(3),{silent:true})}
  },
  draw(a){a.tab===0?chromatique(a):geometrique(a)}
});
const sig=(x,n=3)=>A.fmt.sig(x,n), fix=(x,d)=>A.fmt.fix(x,d);
const coul=a=>a.C.dark?COUL_SOMBRE:COUL_CLAIR;
/* le même paramètre physique « ap » n'a pas la même plage dans les deux onglets : deux réglages */
function moindreDiffusion(a){
  let best=a.p.f,bv=1e9; const fs=LAMBDAS.map(l=>O.chromatic(l,a.p.f,a.p.achrom));
  for(let x=a.p.f-3;x<=a.p.f+3;x+=.002){const r=Math.max(...fs.map(f=>Math.abs(1-x/f)));if(r<bv){bv=r;best=x}}
  return best;
}

/* ===================== 1 · CHROMATISME ===================== */
function chromatique(a){
  const P=a.panels.chrom, S=a.S, C=a.C, k=a.k, p=a.p, cc=coul(a);
  K.vider('chrom');
  const fs=LAMBDAS.map(l=>O.chromatic(l,p.f,p.achrom));
  const G=K.repere(P,{xmin:-32,xmax:96,ymax:21,my:14*k});
  let s=K.axe(a,G);
  // lentille ou doublet
  const yt=G.Y(18.5), yb=G.Y(-18.5), X0=G.X(0);
  if(!p.achrom)s+=K.lentille(a,X0,1,yt,yb,'𝓛');
  else{const w=Math.max(6*k,G.sx*2.2);
    s+=S.path(`M${X0-w},${yt}Q${X0-2.4*w},${(yt+yb)/2} ${X0-w},${yb}L${X0},${yb}L${X0},${yt}Z`,{c:C.cInk,w:1.6,fill:C.c,fop:.22});
    s+=S.path(`M${X0},${yt}L${X0+w*1.25},${yt}Q${X0+.55*w},${(yt+yb)/2} ${X0+w*1.25},${yb}L${X0},${yb}Z`,{c:C.cInk,w:1.6,fill:C.c,fop:.45});
    s+=S.text(X0+w*1.4,yt,'doublet',{base:'top',size:14,c:C.cInk})}
  // rayons marginaux de chaque couleur
  const XL=G.x(G.left), XR=G.x(G.right);
  LAMBDAS.forEach((l,j)=>{for(const h of[-p.ap,p.ap])s+=K.rayon(a,[[G.X(XL),G.Y(h)],[X0,G.Y(h)],[G.X(XR),G.Y(h*(1-XR/fs[j]))]],cc[j],{w:1.5,fleches:j===0})});
  // capteur
  const Xs=G.X(p.plane);
  s+=S.line(Xs,G.Y(-19.5),Xs,G.Y(19.5),{c:C.E,w:3.2})+S.text(Xs+7*k,G.Y(19.5),'capteur',{base:'top',size:14,c:C.E});
  s+=K.poignee(a,'chrom',Xs,G.Y(-17.5),x=>a.set('plane',+K.clamp(G.x(x),30,90).toFixed(2)),{c:C.E});
  s+=K.pointAxe(a,G,p.f,S.v('F′','d'),{dy:14});
  a.svg('chrom',s);
  loupeChrom(a,fs);
  const ff=fs[1], fc=fs[5], R=Math.max(...fs.map(f=>Math.abs(p.ap*(1-p.plane/f))));
  a.metrics([
    {label:'Rayon de la tache colorée',value:sig(R*1000,3),unit:'µm'},
    {label:'Foyer bleu (486 nm)',value:p.foyers?sig(ff,4):'?',unit:p.foyers?'mm':''},
    {label:'Foyer rouge (656 nm)',value:p.foyers?sig(fc,4):'?',unit:p.foyers?'mm':''},
    {label:'Écart longitudinal rouge − bleu',value:p.foyers?sig((fc-ff)*1000,3):'?',unit:p.foyers?'µm':''}]);
  a.insight(p.achrom?'Le doublet associe un verre peu dispersif convergent et un verre plus dispersif divergent : les foyers bleu et rouge sont confondus, il ne reste qu\'un faible spectre secondaire.'
    :'L\'indice du verre dépend de la longueur d\'onde : le bleu, plus dévié, converge plus près de la lentille que le rouge. Aucune position du capteur ne donne une image nette pour toutes les couleurs.');
  a.legend([{c:cc[0],label:'436 nm'},{c:cc[1],label:'486 nm'},{c:cc[2],label:'546 nm'},{c:cc[3],label:'588 nm'},{c:cc[4],label:'620 nm'},{c:cc[5],label:'656 nm'},{c:C.E,label:'Capteur'}]);
  a.clock(a.running?`capteur à ${fix(p.plane,2)} mm`:'');
}
function loupeChrom(a,fs){
  const P=a.panels.tache, S=a.S, C=a.C, k=a.k, p=a.p, cc=coul(a), w=P.w, h=P.h;
  let s='';
  // 1) loupe longitudinale autour des foyers (échelle fixe, celle de la lentille simple)
  const h1=h*.5, f1=O.chromatic(436,p.f,false), f2=O.chromatic(656.27,p.f,false), d=(f2-f1)*.75;
  const xlo=f1-d, xhi=f2+d, X=x=>14*k+(x-xlo)/(xhi-xlo)*(w-28*k);
  const ymax=p.ap*d/p.f*1.8, cy=h1*.5+6*k, Y=y=>cy-y/ymax*(h1*.4);
  s+=S.line(8*k,cy,w-8*k,cy,{c:C.ink2,w:1,dash:`${6*k} ${4*k}`});
  LAMBDAS.forEach((l,j)=>{for(const sg of[-1,1]){const y=x=>sg*p.ap*(1-x/fs[j]);s+=S.line(X(xlo),Y(y(xlo)),X(xhi),Y(y(xhi)),{c:cc[j],w:1.5})}
    if(p.foyers&&fs[j]>xlo&&fs[j]<xhi)s+=S.circle(X(fs[j]),cy,3.6*k,{fill:cc[j]})});
  if(p.foyers){s+=S.text(X(fs[1]),cy+10*k,'bleu',{anchor:'middle',base:'top',size:13,c:cc[1]})+S.text(X(fs[5]),cy-10*k,'rouge',{anchor:'middle',base:'bottom',size:13,c:cc[5]})}
  const xs=p.plane;
  if(xs>=xlo&&xs<=xhi)s+=S.line(X(xs),cy-h1*.42,X(xs),cy+h1*.42,{c:C.E,w:3});
  else s+=S.text(xs<xlo?10*k:w-10*k,cy-h1*.36,xs<xlo?'← capteur':'capteur →',{anchor:xs<xlo?'start':'end',size:13,c:C.E});
  const nice=AnimKit.niceStep((xhi-xlo)*1000*.3,1), L=nice/1000/(xhi-xlo)*(w-28*k), yb=h1-6*k;
  s+=S.line(14*k,yb,14*k+L,yb,{c:C.ink,w:2,cap:'butt'})+S.text(20*k+L,yb,`${sig(nice,2)} µm le long de l'axe`,{size:13});
  s+=S.line(0,h1+4*k,w,h1+4*k,{c:C.rule,w:1,raw:true});
  // 2) coupe de la tache sur le capteur
  const r=fs.map(f=>Math.abs(p.ap*(1-p.plane/f))), rm=Math.max(.02,...r), cx=w/2, cy2=h1+(h-h1)*.47, R=Math.min(w*.4,(h-h1)*.36);
  s+=S.text(10*k,h1+12*k,'Tache sur le capteur (vue de face)',{base:'top',size:13,c:C.ink2});
  LAMBDAS.forEach((l,j)=>{s+=S.circle(cx,cy2,Math.max(1.2*k,r[j]/rm*R),{c:cc[j],w:2.2})});
  const n2=AnimKit.niceStep(rm*1000*.6,1), L2=n2/1000/rm*R, yb2=h-12*k;
  s+=S.line(14*k,yb2,14*k+L2,yb2,{c:C.ink,w:2,cap:'butt'})+S.text(20*k+L2,yb2,`${sig(n2,2)} µm`,{size:13,halo:false});
  a.svg('tache',s);
}

/* ===================== 2 · DÉFAUTS GÉOMÉTRIQUES ===================== */
function options(a){const p=a.p;return{u:200,angle:p.angle*DEG,ap:p.ap2,n:1.52,k:p.asphere?p.k:0,
  ...(p.shape==='plano'?{R1:p.flip?Infinity:25,R2:p.flip?-25:Infinity}:{R1:50,R2:-50})}}
let geo={key:'',v:null};
function calcGeo(a){
  const p=a.p, o=options(a), key=JSON.stringify([o,p.family]);
  if(geo.key!==key){
    const rs=faisceau(o), best=O.bestPlane(rs), fp=O.focusPlanes(rs);
    const par=faisceau({...o,ap:.3},2,8), xp=O.bestPlane(par), yp=O.spot(par,xp).cy;
    let champ=null;
    if(p.family==='field'){champ=[];for(let d=-12;d<=12;d+=1.5){const r=faisceau({...o,angle:d*DEG},3,12),b=O.bestPlane(r);champ.push([b,O.spot(r,b).cy])}}
    let dist=null;
    if(p.family==='distortion'){const aa=Math.max(.5*DEG,o.angle),x0=O.bestPlane(faisceau({...o,angle:0},3,12)),hs=[];
      for(let j=0;j<=30;j++){const an=aa*Math.SQRT2*j/30;hs.push(j?O.spot(faisceau({...o,angle:an},2,12),x0).cy:0)}
      const ref=O.spot(faisceau({...o,ap:.3,angle:aa*Math.SQRT2/30},2,8),x0).cy/Math.tan(aa*Math.SQRT2/30);
      dist={aa,hs,ref,bord:hs[30]/(ref*Math.tan(aa*Math.SQRT2))-1}}
    geo={key,v:{o,rs,best,fp,xp,yp,champ,dist}};
  }
  const x=p.autofocus?geo.v.best:p.plane2;
  return{...geo.v,x,sp:O.spot(geo.v.rs,x)};
}
function optimiserK(a){
  a.set('asphere',true);
  const o={...options(a),angle:0};
  const score=kk=>{const rs=faisceau({...o,k:kk},3,12);return O.spot(rs,O.bestPlane(rs)).rms};
  let lo=-6,hi=0;for(let i=0;i<22;i++){const u=lo+(hi-lo)/3,v=hi-(hi-lo)/3;if(score(u)<score(v))hi=v;else lo=u}
  a.set('k',+((lo+hi)/2).toFixed(3));
}
function geometrique(a){
  const P=a.panels.geo, S=a.S, C=a.C, k=a.k, p=a.p, cc=K.couleurs(a), E=calcGeo(a), o=E.o;
  K.vider('geo');
  const G=K.repere(P,{xmin:-28,xmax:96,ymax:23,my:12*k});
  let s=K.axe(a,G);
  // profil exact de la lentille
  const prof=[];for(let j=0;j<=50;j++){const y=-17+34*j/50;prof.push([G.X(-4+O.sag(Math.abs(y),o.R1,o.k)),G.Y(y)])}
  for(let j=50;j>=0;j--){const y=-17+34*j/50;prof.push([G.X(4+O.sag(Math.abs(y),o.R2,o.k)),G.Y(y)])}
  s+=S.poly(prof,{close:true,fill:C.c,fop:.2,c:cc.lens,w:1.5});
  // diaphragme
  for(const sg of[-1,1])s+=S.line(G.X(XSTOP),G.Y(sg*p.ap2),G.X(XSTOP),G.Y(sg*22),{c:C.ink,w:4,cap:'butt'});
  s+=S.text(G.X(XSTOP)-6*k,G.Y(-22),'diaphragme',{anchor:'end',base:'bottom',size:13});
  // rayons méridiens
  const XL=G.x(G.left)+1, XR=G.x(G.right), t=Math.tan(o.angle);
  for(let j=0;j<13;j++){const hs=-p.ap2*.96+2*p.ap2*.96*j/12, r=meridien(o,hs); if(!r)continue;
    const yL=r.a[1]+(XL-r.a[0])*t;
    s+=K.rayon(a,[[G.X(XL),G.Y(yL)],[G.X(r.a[0]),G.Y(r.a[1])],[G.X(r.b[0]),G.Y(r.b[1])],[G.X(XR),G.Y(O.at(r,XR)[1])]],j%2?cc.r[0]:cc.r[1],{w:1.4,fleches:j===0||j===12})}
  // lieu des meilleurs foyers
  if(E.champ){s+=S.poly(E.champ.map(q=>[G.X(q[0]),G.Y(q[1])]),{c:cc.plan,w:3});
    const q=E.champ[E.champ.length-1];s+=S.text(G.X(q[0])+8*k,G.Y(q[1]),'lieu des meilleurs foyers',{base:'top',size:14,c:cc.plan})}
  // repères de Gauss
  if(p.parax){const Xp=G.X(E.xp);s+=S.line(Xp,G.Y(-21),Xp,G.Y(21),{c:C.pred,w:1.3,dash:`${6*k} ${4*k}`})+S.circle(Xp,G.Y(E.yp),4.5*k,{fill:C.pred})+S.text(Xp+6*k,G.Y(-21),'foyer paraxial',{base:'bottom',size:13,c:C.pred});
    if(p.family==='astig'||p.family==='coma'||p.family==='field')E.fp.forEach((x,i)=>{const X=G.X(x);s+=S.line(X,G.Y(E.sp.cy)-14*k,X,G.Y(E.sp.cy)+14*k,{c:C.pred,w:2.4})+S.text(X,G.Y(E.sp.cy)+(i?18:-18)*k,i?'S':'T',{anchor:'middle',size:14,c:C.pred,math:true})})}
  // capteur
  const Xd=G.X(E.x);
  s+=S.line(Xd,G.Y(-21),Xd,G.Y(21),{c:C.E,w:3.2})+S.text(Xd+7*k,G.Y(21),'capteur',{base:'top',size:14,c:C.E});
  s+=K.poignee(a,'geo',Xd,G.Y(-19),x=>{if(a.p.autofocus)a.set('autofocus',false);a.set('plane2',+K.clamp(G.x(x),30,85).toFixed(2))},{c:C.E});
  s+=S.text(G.left+6*k,G.top+6*k,`lumière venant de l'infini sous ${fix(p.angle,p.angle%1?2:0)}°`,{base:'top',size:13,c:C.ink2});
  a.svg('geo',s);
  loupeGeo(a,E);
  // mesures
  const third={
    sphere:{label:'Foyer paraxial − meilleur plan',value:p.parax?sig(E.xp-E.best,3):'?',unit:p.parax?'mm':''},
    coma:{label:'Diamètre de la tache',value:sig(E.sp.diam*1000,3),unit:'µm'},
    astig:{label:'Écart des focales S − T',value:p.parax?sig(E.fp[1]-E.fp[0],3):'?',unit:p.parax?'mm':''},
    field:{label:'Meilleur plan (champ) − foyer paraxial (axe)',value:p.parax?sig(E.best-O.bestPlane(faisceau({...E.o,angle:0,ap:.3},2,8)),3):'?',unit:p.parax?'mm':''},
    distortion:{label:'Distorsion au bord de la grille',value:p.parax&&E.dist?sig(E.dist.bord*100,2):'?',unit:p.parax?'%':''}}[p.family];
  a.metrics([
    {label:'Rayon RMS de la tache',value:sig(E.sp.rms*1000,3),unit:'µm'},
    {label:p.autofocus?'Meilleur plan (depuis le centre)':'Position du capteur',value:sig(E.x,4),unit:'mm'},third]);
  a.insight({sphere:'Sur l\'axe, les rayons marginaux convergent plus près de la lentille que les rayons paraxiaux : c\'est l\'aberration sphérique. Diaphragmer ou mieux orienter la lentille la réduit.',
    coma:'Hors de l\'axe, la tache devient dissymétrique, en forme de comète : c\'est la coma.',
    astig:'Hors de l\'axe, le faisceau se focalise en deux segments perpendiculaires (focales tangentielle T et sagittale S) : c\'est l\'astigmatisme. Balayer le capteur pour les voir.',
    field:'Les meilleurs foyers des points hors axe ne sont pas dans un même plan transverse : un capteur plan ne peut pas être net partout.',
    distortion:'Le grandissement varie avec l\'angle de champ : les droites de la mire se courbent, sans flou.'}[p.family]);
  a.legend([{c:cc.r[1],label:'Rayons du plan méridien'},{c:C.E,label:'Capteur'},E.champ?{c:cc.plan,label:'Lieu des meilleurs foyers'}:null,p.parax?{c:C.pred,dash:true,label:'Repères de Gauss'}:null]);
  a.clock(a.running?`capteur à ${fix(E.x,2)} mm`:'');
}
/* mire locale (étoile de Siemens de 3 mm de diamètre, dans le plan du capteur), floutée par la tache :
   somme pondérée d'images de la mire décalées selon les impacts (calcul en flottants, sans filtre du navigateur) */
const mireCv=document.createElement('canvas');
let mireCache={key:'',url:''}, etoile={N:0,T:0,m:0,a:null};
function etoileAlpha(N){
  if(etoile.N===N)return etoile;
  const m=Math.round(N*.5), T=N+2*m, cv=document.createElement('canvas'); cv.width=cv.height=T;
  const c=cv.getContext('2d'), cx=T/2, R=N*.47; c.fillStyle='#000';
  for(let j=0;j<18;j++){const a1=j*Math.PI/9, a2=a1+Math.PI/18;c.beginPath();c.moveTo(cx,cx);c.arc(cx,cx,R,a1,a2);c.closePath();c.fill()}
  c.lineWidth=Math.max(1.5,N/120);c.strokeStyle='#000';c.beginPath();c.arc(cx,cx,R*1.04,0,2*Math.PI);c.stroke();
  const d=c.getImageData(0,0,T,T).data, a=new Float32Array(T*T); for(let i=0;i<T*T;i++)a[i]=d[i*4+3]/255;
  etoile={N,T,m,a}; return etoile;
}
function mireFloue(a,E,N){
  const sp=E.sp, key=[geo.key,E.x,a.C.ink,N].join('|');
  if(mireCache.key===key)return mireCache.url;
  const {T,m,a:src}=etoileAlpha(N), ps=N/3, sum=new Float32Array(N*N), pts=sp.pts;
  for(const q of pts){const dx=(q[2]-sp.cz)*ps, dy=-(q[1]-sp.cy)*ps, ix=Math.floor(dx), iy=Math.floor(dy), fx=dx-ix, fy=dy-iy;
    const w00=(1-fx)*(1-fy), w10=fx*(1-fy), w01=(1-fx)*fy, w11=fx*fy;
    for(let y=0;y<N;y++){const sy=y+m-iy; if(sy<1||sy>=T)continue; const r1=sy*T, r0=(sy-1)*T;
      for(let x=0;x<N;x++){const sx=x+m-ix; if(sx<1||sx>=T)continue;
        sum[y*N+x]+=w00*src[r1+sx]+w10*src[r1+sx-1]+w01*src[r0+sx]+w11*src[r0+sx-1]}}}
  mireCv.width=mireCv.height=N; const c=mireCv.getContext('2d'), img=c.createImageData(N,N), col=a.C.ink.match(/[0-9a-f]{2}/gi).map(h=>parseInt(h,16)), n=pts.length;
  for(let i=0;i<N*N;i++){img.data[i*4]=col[0];img.data[i*4+1]=col[1];img.data[i*4+2]=col[2];img.data[i*4+3]=Math.min(255,255*sum[i]/n)}
  c.putImageData(img,0,0);
  mireCache={key,url:mireCv.toDataURL('image/png')}; return mireCache.url;
}
function loupeGeo(a,E){
  const P=a.panels.loupe, S=a.S, C=a.C, k=a.k, p=a.p, sp=E.sp, cc=K.couleurs(a);
  const band=50*k, top=26*k, w=P.w, h=P.h-band, cx=w/2, cy=top+(h-top)/2, side=Math.min(w-16*k,h-top-8*k);
  let s=S.text(10*k,8*k,p.visual==='spot'?'Tache d\'un point, vue de face':p.family==='distortion'?'Mire : distorsion':'Mire floutée par la tache',{base:'top',size:13,c:C.ink2,halo:false});
  s+=`<defs><clipPath id="lg"><rect x="0" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${(h-top).toFixed(1)}"/></clipPath></defs><g clip-path="url(#lg)">`;
  if(p.visual==='spot'){
    const span=Math.max(p.pixel/1000*5,sp.diam*1.3,.008), sc=side/span, pix=p.pixel/1000*sc;
    if(pix>3){const n=Math.ceil(Math.max(w,h)/pix/2)+1;for(let j=-n;j<=n;j++)s+=S.line(cx+(j+.5)*pix,top,cx+(j+.5)*pix,h,{c:C.ink2,w:.7,op:.4,raw:true})+S.line(0,cy+(j+.5)*pix,w,cy+(j+.5)*pix,{c:C.ink2,w:.7,op:.4,raw:true})}
    for(const q of sp.pts)s+=S.circle(cx+(q[2]-sp.cz)*sc,cy-(q[1]-sp.cy)*sc,2.2*k,{fill:cc.r[1]});
    s+='</g>';
    const nice=AnimKit.niceStep(span*1000*.35,1), L=nice/1000*sc, y0=h+band*.3;
    s+=S.line(12*k,y0,12*k+L,y0,{c:C.ink,w:2.2,cap:'butt'})+S.text(18*k+L,y0,`${sig(nice,2)} µm`,{size:13,halo:false});
    s+=S.text(12*k,h+band*.72,pix>3?`carrés : pixels de ${p.pixel} µm`:'pixels plus petits que l\'affichage',{size:13,halo:false});
  }else if(p.family==='distortion'&&E.dist){
    const D=E.dist, half=side*.46, amp=+p.ampl;
    const tr=(u,v)=>{const r=Math.hypot(u,v);if(r<1e-9)return[cx,cy];const q=Math.min(29.999,r/Math.SQRT2*30),j=Math.floor(q),hh=D.hs[j]+(D.hs[j+1]-D.hs[j])*(q-j),fct=hh/(D.ref*Math.tan(D.aa*r));const g=1+(fct-1)*amp;return[cx+u*g*half,cy-v*g*half]};
    if(p.parax)for(let j=-5;j<=5;j++){s+=S.line(cx+j/5*half,cy-half,cx+j/5*half,cy+half,{c:C.pred,w:1,dash:`${4*k} ${3*k}`})+S.line(cx-half,cy+j/5*half,cx+half,cy+j/5*half,{c:C.pred,w:1,dash:`${4*k} ${3*k}`})}
    for(let j=-5;j<=5;j++){const u=j/5;s+=S.poly(Array.from({length:41},(_,i)=>tr(u,-1+i/20)),{c:C.cInk,w:1.6})+S.poly(Array.from({length:41},(_,i)=>tr(-1+i/20,u)),{c:C.cInk,w:1.6})}
    s+='</g>';
    s+=S.text(12*k,h+band*.3,`demi-champ de la grille : ${fix(D.aa/DEG,1)}°`,{size:13,halo:false});
    s+=S.text(12*k,h+band*.72,amp>1?'écart à la grille idéale amplifié × 10':'distorsion à l\'échelle réelle',{size:13,halo:false,c:amp>1?C.E:C.ink2});
  }else{
    const N=Math.round(Math.min(300,side*Math.min(2,window.devicePixelRatio||1)));
    s+=`<image href="${mireFloue(a,E,N)}" x="${(cx-side/2).toFixed(1)}" y="${(cy-side/2).toFixed(1)}" width="${side.toFixed(1)}" height="${side.toFixed(1)}"/>`;
    s+='</g>';
    s+=S.line(12*k,h+band*.3,12*k+side/6,h+band*.3,{c:C.ink,w:2.2,cap:'butt'})+S.text(18*k+side/6,h+band*.3,'500 µm',{size:13,halo:false});
    s+=S.text(12*k,h+band*.72,'étoile de 3 mm de diamètre dans le plan du capteur',{size:13,halo:false});
  }
  a.svg('loupe',s);
}
K.activerGlisser(A,'chrom');
K.activerGlisser(A,'geo');
