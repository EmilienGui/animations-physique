  /** n chiffres significatifs, sans notation exponentielle */
  sig(x,n=3){

  /** d décimales fixes */

function niceStep(range,n){

/* ---------------- mathématiques en HTML ---------------- */
const M={
  v:(s,sub,sup)=>`<span class="m">${s}</span>${sub!==undefined?`<sub>${sub}</sub>`:''}${sup!==undefined?`<sup>${sup}</sup>`:''}`,
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt"><span class="sym">√</span><span class="rad">${x}</span></span>`,
  vec:s=>`<span class="vec">${s}</span>`
};

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}
      return s;
    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const X=v=>x0+(v-o.xmin)/(o.xmax-o.xmin)*w, Y=v=>y0+h-(v-o.ymin)/(o.ymax-o.ymin)*h;
      let s='';
      const xt=o.xticks||ticks(o.xmin,o.xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5)))), yt=o.yticks||ticks(o.ymin,o.ymax,o.ny??Math.max(1,Math.round(h/(fs*3))));
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      const yAx=o.ymin<=0&&o.ymax>=0&&o.zeroAxis!==false?Y(0):y0+h, xAx=x0;
      s+=`<line x1="${n(x0)}" y1="${n(yAx)}" x2="${n(x0+w)}" y2="${n(yAx)}" stroke="${C0.ink2}" stroke-width="1.2"/><line x1="${n(xAx)}" y1="${n(y0)}" x2="${n(xAx)}" y2="${n(y0+h)}" stroke="${C0.ink2}" stroke-width="1.2"/>`;
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>o.xmin+(px-x0)/w*(o.xmax-o.xmin),yv:py=>o.ymin+(y0+h-py)/h*(o.ymax-o.ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){
      let d='',pen=false;
      for(const[x,y]of pts){if(!isFinite(y)||!isFinite(x)){pen=false;continue}
        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}
      return`<g clip-path="url(#${G.clip||''})">`+S.path(d,o)+'</g>';
    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}
  };
  return S;
}

/* ===================================================================== */
function app(cfg){
  const A={cfg,p:{},tab:0,t:0,running:false,speed:1,k:1,narrow:false,C:{},fmt,M,panels:{},_dirty:false};
  A.S=makeS(A);
  const root=document.documentElement;
  root.dataset.theme='dark';
  if(cfg.partie)root.style.setProperty('--chap',`var(--${cfg.partie})`);
  document.title=cfg.titreFenetre||`${cfg.titre} · ${cfg.code} · MPSI`;

  /* ---------- structure ---------- */
  const ak=el('div',{class:'ak',id:'ak'});
  const top=el('header',{class:'ak-top'});
  top.innerHTML=`<span class="ak-badge">${cfg.code}</span><div class="ak-titles"><h1 class="ak-title">${cfg.titre}</h1></div>
  <nav class="ak-tools" aria-label="Outils">
   <button class="ib ak-btn-settings" data-act="settings" title="Réglages">${IC.settings}<span class="ak-lbl">Réglages</span></button>
   <button class="ib" data-act="help" title="Aide (H)">${IC.help}<span class="ak-lbl">Aide</span></button>
   <button class="ib" data-act="theme" title="Thème clair / sombre (T)">${IC.theme}<span class="ak-lbl">Thème</span></button>
   <button class="ib" data-act="image" title="Enregistrer l'image (I)">${IC.image}<span class="ak-lbl">Image</span></button>
   <button class="ib" data-act="proj" title="Mode projection (P)">${IC.proj}<span class="ak-lbl">Projection</span></button>
   <button class="ib" data-act="fs" title="Plein écran (F)">${IC.fs}</button>
  </nav>`;
  ak.append(top);
  const tabs=cfg.onglets&&cfg.onglets.length>1?el('div',{class:'ak-tabs',role:'tablist'}):null;
  if(tabs){cfg.onglets.forEach((t,i)=>{const b=el('button',{class:'ak-tab',role:'tab','aria-selected':String(i===0),'data-tab':i},`<b>${i+1}</b>${t}`);b.onclick=()=>A.setTab(i);tabs.append(b)});ak.append(tabs)}
  const body=el('div',{class:'ak-body'}); ak.append(body);
  const main=el('main',{class:'ak-main'}); body.append(main);
  const scene=el('section',{class:'ak-card ak-scene'}); main.append(scene);
  /* disposition « atelier » (7 novembre 2026, facultative : cfg.atelier) :
     saisie à gauche ; résultat, graphique et détail du calcul à droite ; pas de colonne de réglages */
  A.zones={};
  if(cfg.atelier){
    const at=typeof cfg.atelier==='object'?cfg.atelier:{};
    ak.classList.add('ak-atelier');
    const left=el('section',{class:'ak-card ak-saisie'},`<div class="ak-zone-h">${at.saisie||'Mes mesures'}</div>`);
    A.zones.saisie=el('div',{class:'ak-saisie-body'}); left.append(A.zones.saisie);
    A.zones.resultat=el('section',{class:'ak-card ak-res','aria-live':'polite'});
    const det=el('details',{class:'ak-card ak-detail'},`<summary>${at.detail||'Voir le calcul'}</summary>`);
    A.zones.detail=el('div',{class:'ak-detail-body'}); det.append(A.zones.detail);
    body.insertBefore(left,main); main.insertBefore(A.zones.resultat,scene); main.append(det);
  }
  const pwrap=el('div',{class:'ak-panels'}); scene.append(pwrap);
  for(const pc of (cfg.panneaux||[{id:'scene'}])){
    const pe=el('div',{class:'ak-panel','data-id':pc.id}); pe.style.flex=`${pc.poids||1} 1 0`;
    if(pc.titre)pe.append(el('div',{class:'ak-phead'},pc.titre));
    const type=pc.type||'svg';
    const node=type==='canvas'?el('canvas'):document.createElementNS('http://www.w3.org/2000/svg','svg');
    if(type!=='canvas'){node.setAttribute('xmlns','http://www.w3.org/2000/svg');node.setAttribute('role','img');node.setAttribute('aria-label',pc.titre||cfg.titre)}
    pe.append(node);
    const P={id:pc.id,cfg:pc,el:pe,node,type,w:300,h:200,zoom:1,panX:0,panY:0,vz:1,vx:0,vy:0,_drags:[],head:pe.querySelector('.ak-phead')};
    /* Vue (7 novembre 2026) : tout panneau SVG se zoome, se cadre et se déplace (viewBox) ;
       un canvas déclaré zoom:true garde son zoom interne P.zoom, lu par l'animation. */
    P.vue=type!=='canvas'?(pc.zoom===false?null:'svg'):(pc.zoom?'interne':null);
    if(P.vue){const tl=el('div',{class:'ak-ptools'});tl.innerHTML='<button class="mini" data-z="-" title="Dézoomer (−)">−</button><button class="mini" data-z="0" title="Cadrer : vue initiale (0)">Cadrer</button><button class="mini" data-z="+" title="Zoomer (+)">+</button>';
      tl.onclick=e=>{const z=e.target.closest('[data-z]');if(!z)return;const v=z.dataset.z;if(v==='0')A.cadrer(P);else A.zoomer(P,v==='+'?1.25:.8)};P.tools=tl;pe.append(tl)}
    A.panels[pc.id]=P; pwrap.append(pe);
  }
  /* légende : bande fine entre la scène et la barre de lecture (6 novembre 2026) */
  const legend=el('div',{class:'ak-legend'}); scene.append(legend);
  const tr=el('div',{class:'ak-transport'});
  tr.innerHTML=`<button class="ib ak-play" data-act="play" title="Lecture / pause (Espace)">▶ Lecture</button>
   <button class="ib" data-act="step" title="Pas à pas (→)">${IC.step}<span class="ak-lbl">Pas</span></button>
   <button class="ib" data-act="reset" title="Recommencer (R)">${IC.reset}<span class="ak-lbl">Recommencer</span></button>
   <select class="ak-speed" title="Vitesse de lecture">${(cfg.vitesses||[.25,.5,1,2,4]).map(v=>`<option value="${v}"${v===(cfg.vitesse||1)?' selected':''}>× ${v}</option>`).join('')}</select>
   <input type="range" class="ak-scrub" min="0" max="1" step="any" value="0" aria-label="Curseur temporel" hidden><span class="ak-extra"></span><span class="ak-clock"></span>`;
  scene.append(tr);
  /* colonne de droite (6 novembre 2026) : réglages qui défilent, mesures en bas des réglages
     (sur téléphone, les mesures restent sous la scène) */
  const right=el('div',{class:'ak-right'}); body.append(right);
  const metrics=el('section',{class:'ak-metrics','aria-label':'Mesures'});
  const side=el('aside',{class:'ak-side','aria-label':'Réglages'});
  side.innerHTML='<div class="ak-drawer-head"><span>Réglages</span><button class="mini" data-act="settings">Fermer ✕</button></div>';
  right.append(side);
  /* pied de page supprimé le 6 novembre 2026 */
  const dlg=el('dialog',{class:'ak-dialog'}); const toastEl=el('div',{class:'ak-toast'});
  document.body.append(ak,dlg,toastEl);
  A.root=ak; A.extra=$('.ak-extra',tr);
  /* curseur temporel (facultatif) : cfg.curseur = {max:(a)=>…, get:(a)=>…, set:(a,v)=>…} */
  const scrub=$('.ak-scrub',tr);
  if(cfg.curseur){scrub.hidden=false;scrub.oninput=()=>{A.play(false);cfg.curseur.set(A,+scrub.value*cfg.curseur.max(A));A.render()}}
  const syncScrub=()=>{if(!cfg.curseur||document.activeElement===scrub)return;const m=cfg.curseur.max(A)||1;scrub.value=Math.max(0,Math.min(1,cfg.curseur.get(A)/m))};

  /* ---------- couleurs ---------- */
  function readColors(){
    const cs=getComputedStyle(ak), g=v=>cs.getPropertyValue(v).trim();
    const rgb=s=>{s=s.trim();if(s[0]==='#'){if(s.length===4)s='#'+[...s.slice(1)].map(x=>x+x).join('');return[1,3,5].map(i=>parseInt(s.slice(i,i+2),16))}return s.match(/[\d.]+/g).slice(0,3).map(Number)};
    const mix=(a,b,t)=>'rgb('+a.map((v,i)=>Math.round(v*t+b[i]*(1-t))).join(',')+')';
    const dark=root.dataset.theme==='dark', base=rgb(getComputedStyle(root).getPropertyValue('--'+(cfg.partie||'Anthracite')));
    const c=mix(base,base,1), cInk=dark?mix(base,[255,255,255],.5):mix(base,[0,0,0],.7), cSoft=dark?mix(base,rgb(g('--card')),.22):mix(base,rgb(g('--paper')),.1);
    A.C={paper:g('--paper'),card:g('--card'),ink:g('--ink'),ink2:g('--ink2'),rule:g('--rule'),grid:g('--grid'),c,cInk,cSoft,
      v:g('--q-v'),F:g('--q-F'),B:g('--q-B'),E:g('--q-E'),Ec:g('--q-Ec'),Ep:g('--q-Ep'),Em:g('--q-Em'),pred:g('--q-pred'),hot:g('--q-hot'),cold:g('--q-cold'),
      dark:root.dataset.theme==='dark'};
  }

  /* ---------- réglages ---------- */
  const items={}; const groups=[];
  function stepDec(st){const s=String(st);return s.includes('.')?s.split('.')[1].length:0}
  function buildSettings(){
    (cfg.reglages||[]).forEach(gc=>{
      const g=el('div',{class:'ak-card ak-grp'}); const h=el('h4',{},`<span></span>${gc.titre}`); g.append(h);
      groups.push({gc,el:g,h});
      if(gc.presets){const pr=el('div',{class:'ak-presets'});gc.presets.forEach(ps=>{const b=el('button',{class:'mini',title:ps.titre||''},ps.label);b.onclick=()=>A.preset(ps);ps._btn=b;pr.append(b)});g.append(pr)}
      for(const it of gc.items||[]){
        const box=el('div',{class:'ak-item'}); const type=it.type||'range';
        if(type==='range'){
          const dec=it.dec??stepDec(it.step??1);
          box.innerHTML=`<div class="ak-row"><label for="r_${it.id}">${it.label}</label><input class="ak-num" id="n_${it.id}" type="number" step="${it.step??1}" min="${it.min}" max="${it.max}" inputmode="decimal"><span class="ak-unit">${it.unit||''}</span></div><input type="range" id="r_${it.id}" min="${it.log?Math.log10(it.min):it.min}" max="${it.log?Math.log10(it.max):it.max}" step="${it.log?(it.stepLog??.002):(it.step??1)}">`;
          const R=$('input[type=range]',box), N=$('.ak-num',box);

function repere(P,{xmin,xmax,ymax,x0=0,y0=0,w=P.w,h=P.h,mx=18,my=16,cy=null}){
  const z=P.zoom||1, xc=(xmin+xmax)/2, hw=(xmax-xmin)/2/z;

      {id:'nr',type:'seg',label:'Étapes de la construction (touche C)',options:[[0,'Départ'],[1,'1'],[2,'2'],[3,'Complète']],value:0,onglets:[0,2]},
      {id:'prol',type:'check',label:'Prolongements (pointillés)',value:true,onglets:[0,2]},
      {id:'parax',type:'check',label:'Image paraxiale (modèle de Gauss)',value:false,onglets:[1]},
      {id:'res',type:'check',label:'Résultats : positions et grandissement (masqués au départ)',value:false,onglets:[0,2]}]}
  ],
  aide:{
    voit:'<ul><li><b>Miroir plan</b> : rayons issus de B réfléchis par le miroir, leurs prolongements derrière le miroir et l\'œil d\'un observateur.</li><li><b>Lentille épaisse</b> : rayons réellement réfractés par les deux dioptres sphériques d\'une lentille épaisse, et la tache qu\'ils forment sur un détecteur à pixels (vue agrandie à droite).</li><li><b>Lentille mince</b> : constructions dans les conditions de Gauss (image d\'un objet, rayon quelconque, objet à l\'infini).</li></ul>',
    faire:'<ul><li>Glisser les points cerclés (objet, œil, détecteur, point d\'impact).</li><li>Construction pas à pas avec « Étapes de la construction » ou la touche <kbd>C</kbd>.</li><li>Lentille épaisse : réduire le diaphragme et la hauteur du point objet pour retrouver les conditions de Gauss ; comparer la tache au pas des pixels.</li><li>Faire prévoir la position et la nature de l\'image, puis cocher « Résultats ».</li></ul>',
    modele:'Miroir plan d\'étendue finie : stigmatisme rigoureux, '+bar('OA′')+' = −'+bar('OA')+'. Lentille épaisse : deux dioptres sphériques (<i class="m">R</i><sub>1</sub> = +50 mm, <i class="m">R</i><sub>2</sub> = −50 mm, 8 mm au centre), lois de Snell-Descartes appliquées exactement en trois dimensions, lumière monochromatique. Le meilleur plan minimise l\'écart quadratique moyen des impacts ; la tache est purement géométrique (ni diffraction, ni intensités). Lentille mince : conditions de Gauss, relation de Descartes et grandissement '+M.v('γ')+' = '+M.frac(bar('OA′'),bar('OA'))+'. Échelles longitudinale et transversale différentes ; angles agrandis.',
    cours:'OP2 Formation des images : miroir plan, stigmatisme et aplanétisme, conditions de Gauss, lentilles minces (foyers, foyers secondaires, construction des images, relation de conjugaison de Descartes, grandissement transversal).',
    touches:'<kbd>C</kbd> étape suivante de la construction'
  },
  touches:{c:a=>{if(a.tab!==1)a.set('nr',(a.p.nr+1)%4)}},
  change(a,id,v){
    if(id==='p'&&Math.abs(v)<.5)a.set('p',v<0?-.5:.5,{silent:true});
    if(id==='mode'&&v==='aplan'&&a.p.ap>8)a.set('ap',6,{silent:true});
  },
  reset(){K.phase=0},
  onglet(a){a.play(false);K.phase=0},
  step(a,dt){K.phase+=dt; a.t+=dt},

function fp(a){return a.p.kind==='conv'?a.p.fa:-a.p.fa}
const sig=(x,n=3)=>A.fmt.sig(x,n), fix=(x,d)=>A.fmt.fix(x,d);
const cache=(v,ok)=>ok?v:'?';

/* ===================== 1 · MIROIR PLAN ===================== */
function miroir(a){
  const P=a.panels.scene, S=a.S, C=a.C, k=a.k, cc=K.couleurs(a), {u,h,nr,prol,res}=a.p;
  K.vider('scene');
  const G=K.repere(P,{xmin:-15,xmax:15,ymax:5,my:14*k});
  let s=K.axe(a,G);
  // miroir et hachures (côté non réfléchissant)
  const mx=G.X(0), yt=G.Y(4), yb=G.Y(-4);
  for(let y=yt+8*k;y<yb;y+=10*k)s+=S.line(mx,y,mx+9*k,y-7*k,{c:C.ink2,w:1});
  s+=S.line(mx,yt,mx,yb,{c:cc.lens,w:3.5});
  s+=S.text(mx+12*k,yt,'𝓜',{base:'top',size:20,c:cc.lens,math:true})+S.text(mx-6*k,G.Y(0)+8*k,'O',{anchor:'end',base:'top',size:15,c:C.ink2,math:true});
  // rayons issus de B
  const B=[-u,h], Bp=[u,h];
  const imp=[h,h<2.2?3.4:.6,-2.6].map(y=>Math.max(-3.9,Math.min(3.9,y)));
  const n=nr;
  for(let i=0;i<Math.min(n,3);i++){
    const y=imp[i], m=(y-h)/u, c=cc.r[i];
    const end=[G.x(G.left),y-m*G.x(G.left)];
    s+=K.rayon(a,[[G.X(B[0]),G.Y(B[1])],[mx,G.Y(y)],[G.left,G.Y(end[1])]],c);
    if(prol&&nr>=2)s+=K.rayon(a,[[mx,G.Y(y)],[G.X(Bp[0]),G.Y(Bp[1])]],c,{dash:true});
  }
  // objet et image
  s+=K.fleche(a,G,-u,h,cc.obj,{A:S.v('A'),B:S.v('B')});
  if(nr>=2)s+=K.fleche(a,G,u,h,cc.img,{virtuel:true,A:S.v('A′'),B:S.v('B′'),dxA:18});
  // œil
  const ex=G.X(st.eyeX), ey=G.Y(st.eyeY), t=-st.eyeX/(u-st.eyeX), hit=st.eyeY+t*(h-st.eyeY), vu=Math.abs(hit)<=4;
  if(vu&&nr===3){s+=K.rayon(a,[[G.X(B[0]),G.Y(B[1])],[mx,G.Y(hit)],[ex,ey]],C.E,{w:2.4});
    if(prol)s+=K.rayon(a,[[mx,G.Y(hit)],[G.X(Bp[0]),G.Y(Bp[1])]],C.E,{dash:true})}
  s+=oeil(a,ex,ey,Math.atan2(G.Y(vu?hit:0)-ey,mx-ex));
  s+=S.text(ex,ey+16*k,'œil',{anchor:'middle',base:'top',size:14});
  s+=K.poignee(a,'scene',G.X(B[0]),G.Y(B[1]),(x,y)=>{a.set('u',+K.clamp(-G.x(x),2,12).toFixed(1));a.set('h',+K.clamp(G.y(y),.5,4).toFixed(1))});
  s+=K.poignee(a,'scene',ex-26*k,ey,(x,y)=>{st.eyeX=K.clamp(G.x(x+26*k),-14,-1);st.eyeY=K.clamp(G.y(y),-4.5,4.5);a.render()});
  a.svg('scene',s);
  a.metrics([
    {label:`Position de l'objet ${bar('OA')}`,value:fix(-u,1),unit:'cm'},
    {label:`Position de l'image ${bar('OA′')}`,value:cache(fix(u,1),res),unit:res?'cm':''},
    {label:`Grandissement ${M.v('γ')}`,value:cache('+1',res)}]);
  a.insight(nr<2?'Tracer au moins deux rayons issus de B et leurs prolongements derrière le miroir.':vu?`Les rayons réfléchis semblent tous provenir de B′, symétrique de B par rapport au miroir : l'image est <b>virtuelle</b>, droite, de même taille.`:'Cet œil ne reçoit aucun rayon issu de B réfléchi par ce miroir de taille finie : il ne voit pas l\'image.');
  a.legend([{c:cc.r[0],label:'Rayons issus de B'},prol?{c:C.ink2,dash:true,label:'Prolongements (pas de lumière)'}:null,vu&&nr===3?{c:C.E,label:'Rayon reçu par l\'œil'}:null]);
  a.clock('');
}
function oeil(a,x,y,dir){
  const S=a.S,k=a.k,L=18*k,H=9*k, r=a=>a*180/Math.PI;
  return`<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${r(dir).toFixed(1)})">`+
    S.path(`M${-L},0Q0,${-2*H} ${L},0Q0,${2*H} ${-L},0Z`,{c:a.C.ink,w:1.8,fill:a.C.card})+S.circle(L*.42,0,H*.62,{fill:a.C.B})+S.circle(L*.42,0,H*.25,{fill:a.C.ink})+'</g>';
}

/* ===================== 2 · LENTILLE ÉPAISSE ===================== */
let ep={key:'',val:null};
function calcEp(a){
  const {ap,off,source,n,autofocus,sensor,mode}=a.p, key=[ap,off,source,n,autofocus,sensor,mode].join('|');
  if(ep.key===key)return ep.val;
  const o={u:source,y0:off,ap,n}, rs=O.bundle(o), best=O.bestPlane(rs), x=autofocus?best:sensor, sp=O.spot(rs,x);
  const par=O.bundle({...o,ap:.15},2,8), xp=O.bestPlane(par), yp=O.spot(par,xp).cy;
  const pts=mode==='aplan'?[off-8,off,off+8].map(y0=>{const r=O.bundle({...o,y0},3,12),b=O.bestPlane(r);return{y0,x:b,y:O.spot(r,b).cy}}):[];
  ep={key,val:{o,rs,best,x,sp,xp,yp,pts}}; return ep.val;
}
function epaisse(a){
  const P=a.panels.meridien, S=a.S, C=a.C, k=a.k, cc=K.couleurs(a), p=a.p, E=calcEp(a);
  K.vider('meridien');
  const G=K.repere(P,{xmin:-45,xmax:125,ymax:30,my:10*k});
  let s=K.axe(a,G);
  // lentille épaisse (profil exact des deux dioptres)
  const prof=[];for(let j=0;j<=40;j++){const y=-18+36*j/40;prof.push([G.X(-4+O.sag(Math.abs(y),50)),G.Y(y)])}
  for(let j=40;j>=0;j--){const y=-18+36*j/40;prof.push([G.X(4+O.sag(Math.abs(y),-50)),G.Y(y)])}
  s+=S.poly(prof,{close:true,fill:C.c,fop:.18,c:cc.lens,w:1.5});
  // diaphragme
  for(const sg of[-1,1])s+=S.line(G.X(-7),G.Y(sg*p.ap),G.X(-7),G.Y(sg*29),{c:C.ink,w:4,cap:'butt'});
  s+=S.text(G.X(-7)-6*k,G.Y(-29),'diaphragme',{anchor:'end',base:'bottom',size:13});
  // rayons dans le plan méridien
  const srcs=p.mode==='aplan'?[p.off-8,p.off,p.off+8]:[p.off], xl=G.x(G.left), xr=G.x(G.right);
  srcs.forEach((y0,j)=>{const c=srcs.length>1?cc.r[j]:cc.r[0];
    for(let i=0;i<11;i++){const r=O.thick({...E.o,y0,h:-p.ap*.95+2*p.ap*.95*i/10});if(!r)continue;
      const yi=y0+(r.a[1]-y0)*(xl+p.source)/(r.a[0]+p.source), yo=O.at(r,xr)[1];
      s+=K.rayon(a,[[G.left,G.Y(yi)],[G.X(r.a[0]),G.Y(r.a[1])],[G.X(r.b[0]),G.Y(r.b[1])],[G.right,G.Y(yo)]],c,{w:1.4,fleches:i===0||i===10})}});
  // meilleurs foyers des trois points (aplanétisme)
  E.pts.forEach((q,j)=>{s+=S.circle(G.X(q.x),G.Y(q.y),5*k,{fill:cc.r[j]})+S.text(G.X(q.x)+8*k,G.Y(q.y)-6*k,S.v('B′',j+1),{base:'bottom',size:15,c:cc.r[j],math:true})});
  // image paraxiale
  if(p.parax){const X=G.X(E.xp);s+=S.line(X,G.Y(-27),X,G.Y(27),{c:C.pred,w:1.3,dash:`${6*k} ${4*k}`})+S.circle(X,G.Y(E.yp),4.5*k,{fill:C.pred})+S.text(X+6*k,G.Y(-27),'image de Gauss',{base:'bottom',size:13,c:C.pred})}
  // détecteur
  const Xd=G.X(E.x);
  s+=S.line(Xd,G.Y(-25),Xd,G.Y(25),{c:C.E,w:3.2});
  s+=S.text(Xd+7*k,G.Y(25),'détecteur',{base:'top',size:14,c:C.E});
  if(!p.autofocus)s+=K.poignee(a,'meridien',Xd,G.Y(-23),(x)=>a.set('sensor',+K.clamp(G.x(x),40,110).toFixed(1)),{c:C.E});
  s+=S.text(G.left+6*k,G.top+8*k,`vers l'objet à ${sig(p.source,3)} mm`,{base:'top',size:13,c:C.ink2});
  a.svg('meridien',s);
  loupe(a,E);
  const ratio=E.sp.diam*1000/p.pixel;
  a.metrics([
    {label:'Diamètre de la tache',value:sig(E.sp.diam*1000,3),unit:'µm'},
    {label:'Tache / pas des pixels',value:sig(ratio,2),warn:ratio>1&&p.mode==='pixel'},
    {label:p.autofocus?'Meilleur plan (après le centre)':'Position du détecteur',value:sig(E.x,3),unit:'mm'}]);
  const msg={gauss:'Conditions de Gauss : rayons peu inclinés et proches de l\'axe. Fermer le diaphragme ou rapprocher le point objet de l\'axe réduit la tache : le stigmatisme devient approché.',
    stigma:'Hors des conditions de Gauss, les rayons issus d\'un même point ne convergent plus en un seul point : la lentille n\'est pas rigoureusement stigmatique.',
    aplan:'Les meilleurs foyers B′<sub>1</sub>, B′<sub>2</sub>, B′<sub>3</sub> de trois points d\'un plan transverse restent presque dans un même plan transverse : aplanétisme approché.',
    pixel:ratio<1?'La tache est plus petite qu\'un pixel : l\'image paraît nette sur ce détecteur, bien que le stigmatisme ne soit qu\'approché.':'La tache couvre plusieurs pixels : l\'image paraît floue. Des pixels plus gros masquent le défaut sans corriger la lentille.'}[p.mode];
  a.insight(msg);
  a.legend([{c:cc.r[0],label:p.mode==='aplan'?'Trois points objets':'Rayons issus du point objet'},{c:C.E,label:'Détecteur'},p.parax?{c:C.pred,dash:true,label:'Image de Gauss (paraxiale)'}:null]);
  a.clock('');
}
function loupe(a,E){
  const P=a.panels.loupe, S=a.S, C=a.C, k=a.k, p=a.p, sp=E.sp;
  const band=56*k, w=P.w, h=P.h-band, cx=w/2, cy=h/2;
  const span=Math.max(p.pixel/1000*5,sp.diam*1.35,.006), sc=Math.min(w,h)*.92/span, pix=p.pixel/1000*sc;
  let s=`<defs><clipPath id="lp"><rect x="0" y="0" width="${w.toFixed(1)}" height="${h.toFixed(1)}"/></clipPath></defs><g clip-path="url(#lp)">`;
  if(pix>3){const n=Math.ceil(Math.max(w,h)/pix/2)+1;for(let j=-n;j<=n;j++){s+=S.line(cx+(j+.5)*pix,0,cx+(j+.5)*pix,h,{c:C.ink2,w:.7,op:.45,raw:true})+S.line(0,cy+(j+.5)*pix,w,cy+(j+.5)*pix,{c:C.ink2,w:.7,op:.45,raw:true})}}
  else s+=S.rect(0,0,w,h,{fill:C.ink2,fop:.08});
  for(const q of sp.pts)s+=S.circle(cx+(q[1]-sp.cy)*sc,cy-(q[2]-sp.cz)*sc,2.3*k,{fill:K.couleurs(a).r[0]});
  s+=S.circle(cx,cy,sp.diam/2*sc,{c:C.ink2,w:1,dash:`${4*k} ${3*k}`,op:.8});
  s+='</g>';
  // barre d'échelle
  const nice=AnimKit.niceStep(span*1000*.35,1), L=nice/1000*sc, y0=h+band*.32;
  s+=S.line(12*k,y0,12*k+L,y0,{c:C.ink,w:2.2,cap:'butt'})+S.line(12*k,y0-5*k,12*k,y0+5*k,{c:C.ink,w:1.5})+S.line(12*k+L,y0-5*k,12*k+L,y0+5*k,{c:C.ink,w:1.5});
  s+=S.text(12*k+L+8*k,y0,`${sig(nice,3)} µm`,{size:13,halo:false});
  s+=S.text(12*k,h+band*.75,pix>3?`carrés : pixels de ${p.pixel} µm`:'pixels plus petits que l\'affichage',{size:13,halo:false});
  a.svg('loupe',s);
}

/* ===================== 3 · LENTILLE MINCE ===================== */
function cadreMince(a){
  const p=a.p, f=fp(a), F=p.fa;
  if(p.cons!=='image'){const L=Math.max(2.6*F,14);return{xmin:-L,xmax:L,ymax:5.2}}
  const m=O.thin(p.p,f), fin=Number.isFinite(m.q), qd=fin?K.clamp(m.q,-100,100):0;
  const xmin=Math.min(-3*F,p.p-.8*F,fin?qd-.8*F:0,-12), xmax=Math.max(3*F,p.p+.8*F,fin?qd+.8*F:0,12);
  const yi=fin&&Math.abs(m.q)<100?Math.abs(m.g*p.b):0;
  return{xmin,xmax,ymax:K.clamp(Math.max(2*p.b,1.25*yi),2*p.b,9*p.b)};
}
function mince(a){
  const P=a.panels.scene, S=a.S, C=a.C, k=a.k, cc=K.couleurs(a), p=a.p, f=fp(a), nr=p.nr;
  K.vider('scene');
  const fr=st.gel||cadreMince(a);
  const G=K.repere(P,{...fr,my:16*k});
  let s=K.axe(a,G);
  const yt=G.Y(fr.ymax*.9), yb=G.Y(-fr.ymax*.9), X0=G.X(0), Y0=G.Y(0);
  s+=K.lentille(a,X0,f,yt,yb,'𝓛');
  s+=S.text(X0-6*k,Y0+8*k,'O',{anchor:'end',base:'top',size:15,c:C.ink2,math:true});
  s+=K.pointAxe(a,G,-f,S.v('F'))+K.pointAxe(a,G,f,S.v('F′'));
  const XL=G.x(G.left), XR=G.x(G.right), pt=(x,y)=>[G.X(x),G.Y(y)];
  let res=null;
  if(p.cons==='image'){
    const m=O.thin(p.p,f), fin=Number.isFinite(m.q), virtObj=p.p>0;
    const hs=[p.b,0,Math.abs(p.p+f)>1e-6?p.b*f/(p.p+f):null];
    for(let i=0;i<Math.min(nr,3);i++){const h=hs[i];if(h===null||Math.abs(h)>fr.ymax*4)continue;
      const si=(h-p.b)/(-p.p), so=si-h/f, c=cc.r[i];
      const inc=virtObj?pt(XL,h+si*XL):pt(p.p,p.b), out=pt(XR,h+so*XR);
      s+=K.rayon(a,[inc,pt(0,h),out],c);
      if(p.prol){
        if(virtObj)s+=K.rayon(a,[pt(0,h),pt(p.p,p.b)],c,{dash:true});
        if(f<0&&i===0)s+=K.rayon(a,[pt(0,h),pt(f,0)],c,{dash:true});
        if(f<0&&i===2&&!virtObj)s+=K.rayon(a,[pt(0,h),pt(-f,0)],c,{dash:true});
        if(fin&&m.q<0&&nr>=2)s+=K.rayon(a,[pt(0,h),pt(m.q,m.g*p.b)],c,{dash:true});
      }}
    s+=K.fleche(a,G,p.p,p.b,cc.obj,{virtuel:virtObj,A:S.v('A'),B:S.v('B'),dxA:virtObj?18:-7});
    if(nr>=2&&fin&&Math.abs(m.q)<100)s+=K.fleche(a,G,m.q,m.g*p.b,cc.img,{virtuel:m.q<0,A:S.v('A′'),B:S.v('B′'),dxA:m.q<0?-7:18});
    s+=K.poignee(a,'scene',G.X(p.p),G.Y(p.b),(x,y)=>{let v=K.clamp(G.x(x),-80,50);if(Math.abs(v)<.5)v=v<0?-.5:.5;a.set('p',Math.round(v*2)/2);a.set('b',+K.clamp(G.y(y),.3,4).toFixed(1))});
    res=m;
    const nat=fin?(m.q>0?'réelle':'virtuelle'):'à l\'infini';
    a.metrics([
      {label:`Position de l'image ${bar('OA′')}`,value:p.res?(fin?sig(m.q,3):'∞'):'?',unit:p.res&&fin?'cm':''},
      {label:`Grandissement ${M.v('γ')}`,value:p.res?(fin?sig(m.g,3):'non défini'):'?'},
      {label:'Nature de l\'image',value:p.res?nat:'?'}]);
    let msg;
    if(nr<2)msg='Deux rayons issus de B suffisent pour placer son image B′ ; le troisième sert de vérification.';
    else if(!fin)msg='Objet dans le plan focal objet : les rayons émergents sont parallèles, l\'image est rejetée à l\'infini.';
    else if(!p.res)msg=`Objet ${virtObj?'virtuel':'réel'}. Prévoir la nature, le sens et la taille de l'image, puis cocher « Résultats ».`;
    else msg=`Objet ${virtObj?'virtuel':'réel'}, image ${nat}, ${m.g>0?'droite':'renversée'}, ${Math.abs(m.g)>1?'agrandie':'réduite'} : ${M.frac('1',bar('OA′'))} − ${M.frac('1',bar('OA'))} = ${M.frac('1',M.v('f')+'′')} et ${M.v('γ')} = ${M.frac(bar('OA′'),bar('OA'))}.`+(Math.abs(m.q)>=100?' L\'image sort du cadre.':'');
    a.insight(msg);
    a.legend([{c:cc.r[0],label:'Parallèle à l\'axe'},{c:cc.r[1],label:'Par le centre O'},{c:cc.r[2],label:'Par le foyer F'},p.prol?{c:C.ink2,dash:true,label:'Prolongements'}:null]);
  }else{
    const t=Math.tan(p.ang*DEG), rev=p.cons==='reverse', inf=p.cons==='infinity', xf=rev?-f:f, yf=xf*t;
    // plan focal utile et rayon auxiliaire passant par O
    if(nr>=2){s+=S.line(G.X(xf),G.Y(fr.ymax*.95),G.X(xf),G.Y(-fr.ymax*.95),{c:cc.plan,w:1.3,dash:`${6*k} ${4*k}`});
      s+=S.text(G.X(xf)+6*k,G.Y(fr.ymax*.95),rev?'plan focal objet':'plan focal image',{base:'top',size:13,c:cc.plan});
      s+=K.rayon(a,[pt(XL,t*XL),pt(XR,t*XR)],cc.r[1],{w:1.5});
      s+=S.circle(G.X(xf),G.Y(yf),5*k,{fill:cc.plan})+S.text(G.X(xf)+8*k,G.Y(yf)-6*k,S.v(rev?'φ':'φ′'),{base:'bottom',size:18,c:cc.plan,math:true})}
    const hs=inf?[-3,-1.5,0,1.5,3]:[p.hi];
    for(const h of hs){const inc=rev?t+h/f:t, out=rev?t:t-h/f, c=cc.r[0];
      const showIn=rev?nr>=3:nr>=1, showOut=rev?nr>=1:nr>=3;
      if(showIn)s+=K.rayon(a,[pt(XL,h+inc*XL),pt(0,h)],c);
      if(showOut)s+=K.rayon(a,[pt(0,h),pt(XR,h+out*XR)],c);
      if(p.prol&&showIn&&showOut&&f<0)s+=K.rayon(a,[pt(0,h),pt(xf,yf)],c,{dash:true});
    }
    if(!inf)s+=K.poignee(a,'scene',X0,G.Y(p.hi),(x,y)=>a.set('hi',+K.clamp(G.y(y),-4,4).toFixed(1)));
    a.metrics([
      {label:`Distance focale ${M.v('f')}′`,value:fix(f,1),unit:'cm'},
      {label:rev?'Inclinaison du rayon émergent':'Inclinaison du rayon incident',value:fix(p.ang,2),unit:'°'},
      {label:`Hauteur du foyer secondaire ${M.v(rev?'φ':'φ′')}`,value:p.res||nr>=2?sig(yf,3):'?',unit:p.res||nr>=2?'cm':''}]);
    a.insight(rev?'Rayon émergent quelconque : le rayon auxiliaire émergent parallèle passant par O coupe le plan focal objet en φ ; le rayon incident cherché passe par φ.'
      :inf?'Un faisceau parallèle incliné converge en un foyer secondaire φ′ du plan focal image, sur le rayon passant par O.'
      :'Rayon incident quelconque : le rayon auxiliaire parallèle passant par O coupe le plan focal image en φ′ ; le rayon émergent passe par φ′.');
    a.legend([{c:cc.r[0],label:'Rayon étudié'},nr>=2?{c:cc.r[1],label:'Rayon auxiliaire par O'}:null,nr>=2?{c:cc.plan,dash:true,label:'Plan focal'}:null]);
  }
  a.svg('scene',s);
  a.clock('');
}
K.activerGlisser(A,'scene',{debut(){if(A.tab===2)st.gel=cadreMince(A)},fin(){st.gel=null;A.render()}});
K.activerGlisser(A,'meridien');

</script>
