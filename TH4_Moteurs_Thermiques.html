  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){

        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

/* TH4 · ajouts à physique.js (inchangé) : cycles de Joule (Brayton) et d'Ericsson, cycle d'essence réel schématique

/* ---------- moteur à quatre temps (mécanisme) ---------- */
function engineScene(a){

  const head=76*k,R=Math.min((h-head-26*k)/(6.25+2/(al-1)),w*.16),l=3.5*R,dead=2*R/(al-1),pH=.9*R,bore=2.5*R,cx=w/2,cy=head+dead+pH/2+R+l;

  const cp=[cx+R*Math.sin(th),cy-R*Math.cos(th)];
  geo={cx,cy,R,rr:1.3*R};
  const T=mo.state.T,gas=K.tcol(T,240,2600);

  s+=S.path(`M${cx-bore/2},${head+dead+2*R+pH+4*k}V${head}H${cx+bore/2}V${head+dead+2*R+pH+4*k}`,{c:C.ink,w:3.2});
  const valve=(x,open,col,inn)=>{const lift=open*Math.min(11*k,R*.3);let o=S.line(x,head-42*k+lift,x,head+lift,{c:C.ink2,w:3})+S.poly([[x-12*k,head+lift+3*k],[x+12*k,head+lift+3*k],[x+8*k,head+lift-3*k],[x-8*k,head+lift-3*k]],{close:true,fill:C.ink2,c:C.ink,w:1});
    if(open>.05){const y=head-8*k;o+=inn?S.arrow(x-6*k,head-34*k,x-6*k,head+12*k+lift,{c:col,w:3*open+1}):S.arrow(x,head+14*k,x,head-36*k,{c:col,w:3*open+1})}
    return o};
  s+=valve(cx-bore*.28,mo.intake,C.B,true)+valve(cx+bore*.28,mo.exhaust,C.F,false);
  s+=S.text(cx-bore*.28+8*k,head-52*k,'Admission',{anchor:'end',size:13,c:C.B,halo:false})+S.text(cx+bore*.28-8*k,head-52*k,'Échappement',{anchor:'start',size:13,c:C.F,halo:false});
  s+=a.tab===0?S.line(cx,head-30*k,cx,head+9*k,{c:C.ink2,w:5})+(mo.fire>0?S.circle(cx,head+10*k,4*k+6*k*mo.fire,{fill:'#ffe066'}):''):S.poly([[cx-5*k,head-30*k],[cx+5*k,head-30*k],[cx+2*k,head+9*k],[cx-2*k,head+9*k]],{close:true,fill:C.ink2,c:C.ink,w:1});
  s+=S.text(cx,head-52*k+0,'',{});
  /* piston, bielle, vilebrequin */

  s+=S.line(cx,pinY,cp[0],cp[1],{c:C.ink2,w:6})+S.circle(cx,pinY,3*k,{fill:C.paper,c:C.ink,w:1});
  s+=S.circle(cx,cy,1.3*R,{fill:C.card,c:C.ink2,w:3});
  for(let i=0;i<8;i++){const an=th+i*Math.PI/4;s+=S.line(cx,cy,cx+1.2*R*Math.sin(an),cy-1.2*R*Math.cos(an),{c:C.rule,w:1.2})}

/* ---------- Stirling alpha (modèle continu) ---------- */
function stirlingScene(a){
  const P=a.panels.scene,S=a.S,C=a.C,k=a.k,w=P.w,h=P.h,p=params(a),z=M4.schmidt({tc:a.p.st_tc,tf:a.p.st_tf},U);let s='';
  const Vd=.06,Vs=.23,Vr=.035;
  const R=Math.min((h-70*k)/7,w*.075),Hs=2*R*1.35,dead=Hs*Vd/Vs,bore=Math.min(w*.2,3*R),gap=w*.34,xh=w/2-gap/2,xc=w/2+gap/2,head=48*k,l=3.5*R;
  const cy=head+dead+Hs+l*.55+R,wr=1.3*R;
  const cyl=(x,f,Tc,name,col)=>{const crown=head+dead+f*Hs,ph=.8*R;
    let o=S.rect(x-bore/2,head,bore,crown-head,{fill:K.tcol(Tc,280,700),fop:.6})+S.rect(x-bore/2+1,crown,bore-2,ph,{fill:C.ink2,c:C.ink,w:1,rx:2*k});
    o+=S.path(`M${x-bore/2},${head+dead+Hs+ph}V${head}H${x+bore/2}V${head+dead+Hs+ph}`,{c:col,w:3.4});
    return{o,crown,ph}};

  const fl=z.flow;if(Math.abs(fl)>0){const ax=fl>0?[w/2-gap*.38,w/2+gap*.38]:[w/2+gap*.38,w/2-gap*.38];s+=S.arrow(ax[0],py+22*k,ax[1],py+22*k,{c:C.E,w:3})}
  s+=hotC.o+coldC.o;
  s+=S.text(xh,head-44*k,`Chambre chaude · ${a.fmt.fix(a.p.st_tc,0)} °C`,{anchor:'middle',size:13,c:C.hot,weight:600})+S.text(xc,head-44*k,`Chambre froide · ${a.fmt.fix(a.p.st_tf,0)} °C`,{anchor:'middle',size:13,c:C.cold,weight:600});

  const wheel=(x,th,pistonCrown,ph)=>{const cp=[x+R*Math.sin(th),cy-R*Math.cos(th)],pin=pistonCrown+ph/2;
    return S.line(x,pin,cp[0],cp[1],{c:C.ink2,w:5})+S.circle(x,cy,wr,{fill:C.card,c:C.ink2,w:2.6})+S.line(x,cy,cp[0],cp[1],{c:C.ink2,w:5})+S.circle(x,cy,4*k,{fill:C.ink2})+S.circle(cp[0],cp[1],7*k,{fill:C.cInk,c:C.paper,w:2})};
  s+=S.line(xh,cy,xc,cy,{c:C.ink2,w:5})+wheel(xh,z.theta,hotC.crown,hotC.ph)+wheel(xc,z.theta-Math.PI/2,coldC.crown,coldC.ph);
  geo={wheels:[[xh,cy],[xc,cy]],rr:wr};
  s+=S.text(w/2,cy+wr+22*k,`Arbre : ${a.fmt.fix(U*360,0)}° · pistons déphasés de 90°`,{anchor:'middle',size:14,c:C.cInk,weight:600});
  s+=S.text(w/2,h-8*k,z.flow>0?'Le gaz va globalement vers la chambre froide : le régénérateur reçoit de l\'énergie':'Le gaz va globalement vers la chambre chaude : le régénérateur en restitue',{anchor:'middle',size:13,c:C.ink2});
  a.svg('scene',s);
}
A.drag('scene',{
  hit:(x,y)=>ismech(A)&&geo&&(geo.wheels?geo.wheels.some(q=>Math.hypot(x-q[0],y-q[1])<geo.rr+8*A.k):Math.hypot(x-geo.cx,y-geo.cy)<geo.rr+8*A.k),

/* ---------- vue idéale : gaz fermé et contacts ---------- */
function idealScene(a){
  const P=a.panels.scene,S=a.S,C=a.C,k=a.k,w=P.w,h=P.h,c=cyc(a),d=c.sample(U);let s='';
  if(a.tab>=3){K.loopScene(a,c,U,a.tab===4?a.p.er_eps:0);return}
  const Vlo=Math.min(...c.states.map(z=>z.V)),Vhi=Math.max(...c.states.map(z=>z.V)),f=clamp((d.V-Vlo)/(Vhi-Vlo),0,1);
  const bw=Math.min(w*.22,120*k),top=50*k,Hs=Math.max(70*k,h-top-196*k),cx=w/2,dead=Hs*.15;
  const cyl=K.cylinder(a,cx,top,bw,Hs,f,{dead,gas:K.tcol(d.T,240,a.tab===2?700:2600),gop:.55});
  const zy1=top,zy2=top+dead+Hs,st=c.steps[d.step],eps=a.tab===2?a.p.st_eps:0;
  const qext=st.Q*(a.tab===2&&d.step%2===1?1-eps:1),qreg=a.tab===2&&d.step%2===1?st.Q*eps:0;
  const blocks=[['cold','Source froide',C.cold,-1],['hot','Source chaude',C.hot,1]];
  const act=qext>1e-6*Math.abs(c.Qc)?'hot':qext<-1e-6*Math.abs(c.Qc)?'cold':null;
  const bl=Math.min(w*.18,100*k),gap=46*k;
  const Tc=a.tab===2?a.p.st_tc+K0:Math.max(...c.states.map(z=>z.T)),Tf=a.tab===2?a.p.st_tf+K0:Math.min(...c.states.map(z=>z.T));
  const Qm=Math.max(Math.abs(c.Qc),Math.abs(c.Qf)),Wm=Math.max(...c.steps.map(z=>Math.abs(z.W)),1e-9);
  for(const[id,name,col,sd] of blocks){const on=act===id,x=sd<0?cx-bw/2-gap-bl:cx+bw/2+gap;
    s+=S.rect(x,zy1,bl,zy2-zy1,{fill:col,fop:on?.3:.1,c:col,w:on?2.5:1,dash:on?undefined:`${4*k} ${4*k}`,rx:5*k})+S.text(x+bl/2,zy1+(zy2-zy1)/2-10*k,name,{anchor:'middle',size:14,c:col,weight:600,halo:false})+S.text(x+bl/2,zy1+(zy2-zy1)/2+12*k,`${a.fmt.fix((id==='hot'?Tc:Tf)-K0,0)} °C`,{anchor:'middle',size:14,c:col,halo:false});
    if(on){const y=zy1+(zy2-zy1)*.75,x1=sd<0?x+bl+2*k:x-2*k,x2=sd<0?cx-bw/2-2*k:cx+bw/2+2*k;s+=K.energyArrow(a,[x1,y],[x2,y],qext,Qm,col,{w:5})+S.text((x1+x2)/2,y-16*k,`Q = ${sg(a,qext)} J`,{anchor:'middle',size:14,c:col,weight:600})}}
  if(qreg!==0){const rx=cx-bw/2-bl-gap,ry=zy2+6*k;s+=S.rect(cx-bl*.7,zy2+28*k,bl*1.4,30*k,{fill:C.E,fop:.22,c:C.E,w:2,rx:6*k})+S.text(cx,zy2+43*k,'Régénérateur',{anchor:'middle',size:14,c:C.E,weight:600,halo:false})
    +K.energyArrow(a,[cx,zy2+26*k],[cx,zy2+4*k],qreg,Qm,C.E,{w:5})+S.text(cx+12*k,zy2+16*k,`${sg(a,qreg)} J`,{size:13,c:C.E,weight:600})}
  else if(!act&&Math.abs(st.Q)<1e-9)s+=S.text(cx,zy1-14*k,'Parois isolées · Q = 0',{anchor:'middle',size:14,c:C.pred,weight:600});
  s+=cyl.s;
  s+=K.energyArrow(a,[cx,cyl.bottom+44*k],[cx,cyl.bottom+4*k],st.W,Wm,C.v,{w:5})+(Math.abs(st.W)>1e-9?S.text(cx+14*k,cyl.bottom+28*k,`W = ${sg(a,st.W)} J`,{size:14,c:C.v,weight:600}):'');
  s+=S.text(w/2,h-10*k,`${'ABCD'[d.step]} → ${'ABCD'[(d.step+1)%4]} · ${namesOf(a)[d.step]}`,{anchor:'middle',size:15,c:C.cInk,weight:700});
  a.svg('scene',s);
}

/* ---------- graphes ---------- */
function cycleGraph(a,mode){
  const c=cyc(a),cols=colsOf(a),C=a.C;let over='',under='';
  let o={cols};
  if(ismech(a)){
    if(a.tab===2){const zs=Array.from({length:361},(_,i)=>M4.schmidt({tc:a.p.st_tc,tf:a.p.st_tf},i/360));
      o.sampler=u=>{const z=M4.schmidt({tc:a.p.st_tc,tf:a.p.st_tf},u);return{V:z.V,P:z.P,T:0,S:0,step:Math.min(3,Math.floor(u*4))}};o.points=false;o.cols=[C.hot,C.E,C.cold,C.v]}
    else{o.sampler=u=>{const m=M4.engineMotion(kind(a),params(a),u);return{V:m.state.V,P:m.state.P,T:m.state.T,S:0,step:m.step}};o.cols=[C.cold,C.v,C.hot,C.cold]}
    mode='pv';
  }else o.fill=a.p.prev;
  /* cycle réel schématique (essence) */
  const real=a.tab===0&&a.p.reel?X4.essenceReel(params(a),a.p.kc,a.p.kd):null;
  o.over=G=>{const S=a.S;let r='';
    if(real&&mode==='pv'){const pts=real.pts.map(q=>[G.X(q[0]*1e3),G.Y(q[1]/1e5)]);r+=S.poly(pts,{c:C.F,w:2.4,dash:`${6*a.k} ${4*a.k}`})}
    if(ismech(a)&&a.tab!==2&&mode==='pv'){const y=G.Y(1);r+=S.line(G.X(c.states[1].V*1e3),y,G.X(c.states[0].V*1e3),y,{c:C.pred,w:1.4,dash:`${5*a.k} ${4*a.k}`})}
    return r};
  const plot=K.cyclePlot(a,'graphe',c,U,mode,o);plotM=plot;
  const lg=a.tab===2?[{c:C.cold,label:'Isotherme froide'},{c:C.E,label:'Isochore (régénérateur)'},{c:C.hot,label:'Isotherme chaude'}]:[{c:C.v,label:'Adiabatique'},{c:C.hot,label:'Apport'},{c:C.cold,label:'Refroidissement / admission'}];
  if(real)lg.push({c:C.F,label:'Cycle réel schématique',dash:true});
  a.legend(a.tab>=3?[{c:C.v,label:'Adiabatique / isotherme'},{c:C.hot,label:'Échauffement'},{c:C.cold,label:'Refroidissement'}]:lg);
}
K.cycleDrag(A,'graphe',()=>plotM,u=>{U=u;A.t=u*dur(A)},()=>graphMode(A)!=='eta');

function etaGraph(a){
  const P=a.panels.graphe,S=a.S,C=a.C,k=a.k,w=P.w,h=P.h;let s='';const f=a.fmt,pr=params(a);let pts=[],pts2=[],xl='',xr=[0,1],cur=0,curx=0,bound=null,xf=null;
  if(a.tab<2){const g=pr.gamma,alpha=x=>1-Math.pow(x,1-g),rho=a.p.di_rho,dies=x=>1-(Math.pow(rho,g)-1)/(g*Math.pow(x,g-1)*(rho-1));
    for(let x=4;x<=18.001;x+=.25){pts.push([x,alpha(x)]);pts2.push([x,dies(x)])}xr=[4,18];xl='Taux de compression α';curx=pr.alpha;cur=a.tab===0?alpha(curx):dies(curx)}
  else if(a.tab===3){const g=pr.gamma;for(let x=1;x<=30.001;x+=.25)pts.push([x,1-Math.pow(x,-(g-1)/g)]);xr=[1,30];xl='Rapport de pressions p₂/p₁';curx=pr.rp;cur=1-Math.pow(curx,-(g-1)/g)}
  else{xr=[0,1];xl='Fraction régénérée ε';const bd=a.tab===2?{tc:a.p.st_tc,tf:a.p.st_tf}:null;
    for(let i=0;i<=40;i++){const e=i/40,c=a.tab===2?M4.cycle('stirling',{...pr,regen:e}):X4.ericsson({...pr,regen:e});pts.push([e,c.eta])}
    curx=pr.regen;cur=cyc(a).eta;bound=cyc(a).etaBound}
  const G=S.graph({x:0,y:0,w,h,xmin:xr[0],xmax:xr[1],ymin:0,ymax:1,xlab:xl,ylab:'Rendement η',xticks:a.tab===0||a.tab===1?[4,8,12,16]:null,ny:5,yfmt:v=>f.fix(v,1)});
  s+=S.clip('eg',G)+G.svg;
  if(bound!==null)s+=S.line(G.x0,G.Y(bound),G.x0+G.w,G.Y(bound),{c:C.pred,w:1.5,dash:`${5*k} ${4*k}`})+S.text(G.x0+G.w-4*k,G.Y(bound)-9*k,`Carnot : ${f.fix(bound*100,1)} %`,{anchor:'end',size:13,c:C.pred});
  s+=S.curve(pts,G,{c:a.tab===1?C.pred:C.v,w:a.tab===1?2:3,dash:a.tab===1?`${5*k} ${4*k}`:undefined});
  if(a.tab<2){s+=S.curve(pts2,G,{c:a.tab===1?C.v:C.pred,w:a.tab===1?3:2,dash:a.tab===1?undefined:`${5*k} ${4*k}`});
    s+=S.text(G.x0+G.w-4*k,G.Y((a.tab===0?pts:pts2).at(-1)[1])-9*k,'',{})}
  s+=S.line(G.X(curx),G.y0,G.X(curx),G.y0+G.h,{c:C.F,w:1.5,dash:`${4*k} ${4*k}`})+S.circle(G.X(curx),G.Y(cur),6*k,{fill:C.F,c:C.paper,w:2});
  a.svg('graphe',s);
  a.legend(a.tab<2?[{c:a.tab===0?C.v:C.pred,label:'Beau de Rochas',dash:a.tab!==0},{c:a.tab===1?C.v:C.pred,label:`Diesel (ρ = ${f.fix(a.p.di_rho,2)})`,dash:a.tab!==1}]:[{c:C.v,label:'Rendement du cycle idéal'}]);
}

/* ---------- mesures ---------- */
function infos(a){
  const c=cyc(a),f=a.fmt,v=M.v,m=[];
  if(a.p.prev||false){
    const bound=c.etaBound??(1-c.tf/c.tc);
    m.push({label:`${v('Q','c')} du cycle`,value:sg(a,c.Qc),unit:'J',hint:'Apport thermique extérieur'},{label:`${v('Q','f')} du cycle`,value:sg(a,c.Qf),unit:'J',hint:'Transfert thermique cédé'},{label:`${v('W')} du cycle`,value:sg(a,c.W),unit:'J',hint:'Reçu : négatif en moteur'});
    m.push({label:v('η'),value:f.fix(c.eta*100,1),unit:'%',hint:`Carnot (${f.fix(c.tf,0)} K, ${f.fix(c.tc,0)} K) : ${f.fix(bound*100,1)} %`});
    if(a.tab===2)m.push({label:`${v('S','c')}`,value:f.fix(c.Sc,3),unit:'J·K<sup>−1</sup>',hint:'0 si ε = 1 (régénération réversible)'});
    if(a.tab===0&&a.p.reel){const r=X4.essenceReel(params(a),a.p.kc,a.p.kd);m.push({label:`${v('η')} du cycle réel`,value:f.fix(r.eta*100,1),unit:'%',warn:true,hint:`idéal : ${f.fix(r.etaId*100,1)} %`})}
  }
  a.metrics(m);
}
