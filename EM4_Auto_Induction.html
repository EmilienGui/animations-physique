  /** n chiffres significatifs, sans notation exponentielle */
  sig(x,n=3){

function niceStep(range,n){

/* ---------------- mathématiques en HTML ---------------- */
const M={
  v:(s,sub,sup)=>`<span class="m">${s}</span>${sub!==undefined?`<sub>${sub}</sub>`:''}${sup!==undefined?`<sup>${sup}</sup>`:''}`,
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt"><span class="sym">√</span><span class="rad">${x}</span></span>`,
  vec:s=>`<span class="vec">${s}</span>`
};

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}
      return s;
    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const X=v=>x0+(v-o.xmin)/(o.xmax-o.xmin)*w, Y=v=>y0+h-(v-o.ymin)/(o.ymax-o.ymin)*h;
      let s='';
      const xt=o.xticks||ticks(o.xmin,o.xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5)))), yt=o.yticks||ticks(o.ymin,o.ymax,o.ny??Math.max(1,Math.round(h/(fs*3))));
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      const yAx=o.ymin<=0&&o.ymax>=0&&o.zeroAxis!==false?Y(0):y0+h, xAx=x0;
      s+=`<line x1="${n(x0)}" y1="${n(yAx)}" x2="${n(x0+w)}" y2="${n(yAx)}" stroke="${C0.ink2}" stroke-width="1.2"/><line x1="${n(xAx)}" y1="${n(y0)}" x2="${n(xAx)}" y2="${n(y0+h)}" stroke="${C0.ink2}" stroke-width="1.2"/>`;
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>o.xmin+(px-x0)/w*(o.xmax-o.xmin),yv:py=>o.ymin+(y0+h-py)/h*(o.ymax-o.ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){
      let d='',pen=false;
      for(const[x,y]of pts){if(!isFinite(y)||!isFinite(x)){pen=false;continue}
        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}
      return`<g clip-path="url(#${G.clip||''})">`+S.path(d,o)+'</g>';
    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}
  };
  return S;
}

/* ===================================================================== */
function app(cfg){
  const A={cfg,p:{},tab:0,t:0,running:false,speed:1,k:1,narrow:false,C:{},fmt,M,panels:{},_dirty:false};
  A.S=makeS(A);
  const root=document.documentElement;
  root.dataset.theme='dark';
  if(cfg.partie)root.style.setProperty('--chap',`var(--${cfg.partie})`);
  document.title=cfg.titreFenetre||`${cfg.titre} · ${cfg.code} · MPSI`;

  /* ---------- structure ---------- */
  const ak=el('div',{class:'ak',id:'ak'});
  const top=el('header',{class:'ak-top'});
  top.innerHTML=`<span class="ak-badge">${cfg.code}</span><div class="ak-titles"><h1 class="ak-title">${cfg.titre}</h1></div>
  <nav class="ak-tools" aria-label="Outils">
   <button class="ib ak-btn-settings" data-act="settings" title="Réglages">${IC.settings}<span class="ak-lbl">Réglages</span></button>
   <button class="ib" data-act="help" title="Aide (H)">${IC.help}<span class="ak-lbl">Aide</span></button>
   <button class="ib" data-act="theme" title="Thème clair / sombre (T)">${IC.theme}<span class="ak-lbl">Thème</span></button>
   <button class="ib" data-act="image" title="Enregistrer l'image (I)">${IC.image}<span class="ak-lbl">Image</span></button>
   <button class="ib" data-act="proj" title="Mode projection (P)">${IC.proj}<span class="ak-lbl">Projection</span></button>
   <button class="ib" data-act="fs" title="Plein écran (F)">${IC.fs}</button>
  </nav>`;
  ak.append(top);
  const tabs=cfg.onglets&&cfg.onglets.length>1?el('div',{class:'ak-tabs',role:'tablist'}):null;
  if(tabs){cfg.onglets.forEach((t,i)=>{const b=el('button',{class:'ak-tab',role:'tab','aria-selected':String(i===0),'data-tab':i},`<b>${i+1}</b>${t}`);b.onclick=()=>A.setTab(i);tabs.append(b)});ak.append(tabs)}
  const body=el('div',{class:'ak-body'}); ak.append(body);
  const main=el('main',{class:'ak-main'}); body.append(main);
  const scene=el('section',{class:'ak-card ak-scene'}); main.append(scene);
  /* disposition « atelier » (7 novembre 2026, facultative : cfg.atelier) :
     saisie à gauche ; résultat, graphique et détail du calcul à droite ; pas de colonne de réglages */
  A.zones={};
  if(cfg.atelier){
    const at=typeof cfg.atelier==='object'?cfg.atelier:{};
    ak.classList.add('ak-atelier');
    const left=el('section',{class:'ak-card ak-saisie'},`<div class="ak-zone-h">${at.saisie||'Mes mesures'}</div>`);
    A.zones.saisie=el('div',{class:'ak-saisie-body'}); left.append(A.zones.saisie);
    A.zones.resultat=el('section',{class:'ak-card ak-res','aria-live':'polite'});
    const det=el('details',{class:'ak-card ak-detail'},`<summary>${at.detail||'Voir le calcul'}</summary>`);
    A.zones.detail=el('div',{class:'ak-detail-body'}); det.append(A.zones.detail);
    body.insertBefore(left,main); main.insertBefore(A.zones.resultat,scene); main.append(det);
  }
  const pwrap=el('div',{class:'ak-panels'}); scene.append(pwrap);
  for(const pc of (cfg.panneaux||[{id:'scene'}])){
    const pe=el('div',{class:'ak-panel','data-id':pc.id}); pe.style.flex=`${pc.poids||1} 1 0`;
    if(pc.titre)pe.append(el('div',{class:'ak-phead'},pc.titre));
    const type=pc.type||'svg';
    const node=type==='canvas'?el('canvas'):document.createElementNS('http://www.w3.org/2000/svg','svg');
    if(type!=='canvas'){node.setAttribute('xmlns','http://www.w3.org/2000/svg');node.setAttribute('role','img');node.setAttribute('aria-label',pc.titre||cfg.titre)}
    pe.append(node);
    const P={id:pc.id,cfg:pc,el:pe,node,type,w:300,h:200,zoom:1,panX:0,panY:0,vz:1,vx:0,vy:0,_drags:[],head:pe.querySelector('.ak-phead')};
    /* Vue (7 novembre 2026) : tout panneau SVG se zoome, se cadre et se déplace (viewBox) ;
       un canvas déclaré zoom:true garde son zoom interne P.zoom, lu par l'animation. */
    P.vue=type!=='canvas'?(pc.zoom===false?null:'svg'):(pc.zoom?'interne':null);
    if(P.vue){const tl=el('div',{class:'ak-ptools'});tl.innerHTML='<button class="mini" data-z="-" title="Dézoomer (−)">−</button><button class="mini" data-z="0" title="Cadrer : vue initiale (0)">Cadrer</button><button class="mini" data-z="+" title="Zoomer (+)">+</button>';
      tl.onclick=e=>{const z=e.target.closest('[data-z]');if(!z)return;const v=z.dataset.z;if(v==='0')A.cadrer(P);else A.zoomer(P,v==='+'?1.25:.8)};P.tools=tl;pe.append(tl)}
    A.panels[pc.id]=P; pwrap.append(pe);
  }
  /* légende : bande fine entre la scène et la barre de lecture (6 novembre 2026) */
  const legend=el('div',{class:'ak-legend'}); scene.append(legend);
  const tr=el('div',{class:'ak-transport'});
  tr.innerHTML=`<button class="ib ak-play" data-act="play" title="Lecture / pause (Espace)">▶ Lecture</button>
   <button class="ib" data-act="step" title="Pas à pas (→)">${IC.step}<span class="ak-lbl">Pas</span></button>
   <button class="ib" data-act="reset" title="Recommencer (R)">${IC.reset}<span class="ak-lbl">Recommencer</span></button>
   <select class="ak-speed" title="Vitesse de lecture">${(cfg.vitesses||[.25,.5,1,2,4]).map(v=>`<option value="${v}"${v===(cfg.vitesse||1)?' selected':''}>× ${v}</option>`).join('')}</select>
   <input type="range" class="ak-scrub" min="0" max="1" step="any" value="0" aria-label="Curseur temporel" hidden><span class="ak-extra"></span><span class="ak-clock"></span>`;
  scene.append(tr);
  /* colonne de droite (6 novembre 2026) : réglages qui défilent, mesures en bas des réglages
     (sur téléphone, les mesures restent sous la scène) */
  const right=el('div',{class:'ak-right'}); body.append(right);
  const metrics=el('section',{class:'ak-metrics','aria-label':'Mesures'});
  const side=el('aside',{class:'ak-side','aria-label':'Réglages'});
  side.innerHTML='<div class="ak-drawer-head"><span>Réglages</span><button class="mini" data-act="settings">Fermer ✕</button></div>';
  right.append(side);
  /* pied de page supprimé le 6 novembre 2026 */
  const dlg=el('dialog',{class:'ak-dialog'}); const toastEl=el('div',{class:'ak-toast'});
  document.body.append(ak,dlg,toastEl);
  A.root=ak; A.extra=$('.ak-extra',tr);
  /* curseur temporel (facultatif) : cfg.curseur = {max:(a)=>…, get:(a)=>…, set:(a,v)=>…} */
  const scrub=$('.ak-scrub',tr);
  if(cfg.curseur){scrub.hidden=false;scrub.oninput=()=>{A.play(false);cfg.curseur.set(A,+scrub.value*cfg.curseur.max(A));A.render()}}
  const syncScrub=()=>{if(!cfg.curseur||document.activeElement===scrub)return;const m=cfg.curseur.max(A)||1;scrub.value=Math.max(0,Math.min(1,cfg.curseur.get(A)/m))};

  /* ---------- couleurs ---------- */
  function readColors(){
    const cs=getComputedStyle(ak), g=v=>cs.getPropertyValue(v).trim();
    const rgb=s=>{s=s.trim();if(s[0]==='#'){if(s.length===4)s='#'+[...s.slice(1)].map(x=>x+x).join('');return[1,3,5].map(i=>parseInt(s.slice(i,i+2),16))}return s.match(/[\d.]+/g).slice(0,3).map(Number)};
    const mix=(a,b,t)=>'rgb('+a.map((v,i)=>Math.round(v*t+b[i]*(1-t))).join(',')+')';
    const dark=root.dataset.theme==='dark', base=rgb(getComputedStyle(root).getPropertyValue('--'+(cfg.partie||'Anthracite')));
    const c=mix(base,base,1), cInk=dark?mix(base,[255,255,255],.5):mix(base,[0,0,0],.7), cSoft=dark?mix(base,rgb(g('--card')),.22):mix(base,rgb(g('--paper')),.1);
    A.C={paper:g('--paper'),card:g('--card'),ink:g('--ink'),ink2:g('--ink2'),rule:g('--rule'),grid:g('--grid'),c,cInk,cSoft,
      v:g('--q-v'),F:g('--q-F'),B:g('--q-B'),E:g('--q-E'),Ec:g('--q-Ec'),Ep:g('--q-Ep'),Em:g('--q-Em'),pred:g('--q-pred'),hot:g('--q-hot'),cold:g('--q-cold'),
      dark:root.dataset.theme==='dark'};
  }

  /* ---------- réglages ---------- */
  const items={}; const groups=[];
  function stepDec(st){const s=String(st);return s.includes('.')?s.split('.')[1].length:0}
  function buildSettings(){
    (cfg.reglages||[]).forEach(gc=>{
      const g=el('div',{class:'ak-card ak-grp'}); const h=el('h4',{},`<span></span>${gc.titre}`); g.append(h);
      groups.push({gc,el:g,h});
      if(gc.presets){const pr=el('div',{class:'ak-presets'});gc.presets.forEach(ps=>{const b=el('button',{class:'mini',title:ps.titre||''},ps.label);b.onclick=()=>A.preset(ps);ps._btn=b;pr.append(b)});g.append(pr)}
      for(const it of gc.items||[]){
        const box=el('div',{class:'ak-item'}); const type=it.type||'range';
        if(type==='range'){
          const dec=it.dec??stepDec(it.step??1);
          box.innerHTML=`<div class="ak-row"><label for="r_${it.id}">${it.label}</label><input class="ak-num" id="n_${it.id}" type="number" step="${it.step??1}" min="${it.min}" max="${it.max}" inputmode="decimal"><span class="ak-unit">${it.unit||''}</span></div><input type="range" id="r_${it.id}" min="${it.log?Math.log10(it.min):it.min}" max="${it.log?Math.log10(it.max):it.max}" step="${it.log?(it.stepLog??.002):(it.step??1)}">`;
          const R=$('input[type=range]',box), N=$('.ak-num',box);

/* ---------- outils ---------- */
function sfrac(a,x,y,num,den,o={}){const S=a.S,k=a.k,size=o.size??15,c=o.c||a.C.ink,wd=(o.w??40)*k;
  return S.text(x,y-10*k,num,{anchor:'middle',size,c})+S.line(x-wd/2,y,x+wd/2,y,{c,w:1.2})+S.text(x,y+11*k,den,{anchor:'middle',size,c});}
const sub=(a,s,b)=>a.S.v(s,b);
const BREF=.0754;   // champ maximal réglable (N = 2000, l = 10 cm, i = 3 A)

/** bobine longue de profil ; renvoie le SVG et les poignées */
function coil(a,b,o){
  const S=a.S,C=a.C,k=a.k,Lpx=o.Lpx,r=o.r,cx=b.x+b.w*.5,cy=b.y+b.h*.5,x1=cx-Lpx/2,x2=cx+Lpx/2;
  let s='';
  const fop=.05+.55*Math.sqrt(Math.min(1,o.dens));
  s+=S.rect(x1,cy-r,Lpx,2*r,{fill:C.c,fop,rx:3});
  // lignes de retour schématiques
  if(Math.abs(o.B)>1e-12){const op=.25+.4*Math.min(1,Math.abs(o.B)/o.Bref);
    for(const sg of [1,-1]){const yc=cy-sg*(r+Math.min(b.h*.28,r*1.9+24*k));s+=S.path(`M${x2},${cy-sg*r*.55}C${x2+40*k},${yc} ${x1-40*k},${yc} ${x1},${cy-sg*r*.55}`,{c:C.B,w:1.4,op});
      const xm=cx,ym=cy-sg*(r*.55+.75*(Math.abs(yc-cy)-r*.55)),d=o.B>0?-1:1;s+=S.arrow(xm-d*9*k,ym,xm+d*9*k,ym,{c:C.B,w:1.6,op});}}
  s+=E.solenoid(a,x1,x2,cy,r,{c:C.E,turns:o.turns});
  // champ intérieur : longueur proportionnelle à B
  const Lb=o.pxT*o.B,cap=Math.abs(Lb)>Lpx*.92,Le=cap?Math.sign(Lb)*Lpx*.92:Lb;
  if(Math.abs(Le)>3)for(const yy of [-.35,.35]){s+=S.arrow(cx-Le/2,cy+yy*r,cx+Le/2,cy+yy*r,{c:C.B,w:3,dash:cap?`${7*k} ${3*k}`:undefined});}
  if(Math.abs(Le)>3)s+=K.vt(a,x2+10*k,cy-r-8*k,'B','P',{c:C.B,size:16});
  // courant (sens dans les spires, côté visible)
  if(Math.abs(o.i)>1e-12){const L=Math.max(6*k,30*k*Math.abs(o.i)/o.iref),sg=Math.sign(o.i);s+=S.arrow(x1-14*k,cy-sg*L/2,x1-14*k,cy+sg*L/2,{c:C.E,w:3})+S.text(x1-22*k,cy,S.v('i'),{anchor:'end',size:16,c:C.E});}
  return {s,x1,x2,cx,cy,r};
}
function bars(a,box,items,eq,max){
  const S=a.S,C=a.C,k=a.k,f=a.fmt,n=items.length,top=box.y+22*k,Hb=Math.max(0,box.h-58*k),bw=(box.w-20*k)/n,u=K.unit(max,'J');
  let s=S.text(box.x+8*k,box.y+4*k,eq,{base:'top',size:13,c:C.ink});
  if(Hb<12*k)return s;
  items.forEach((it,j)=>{const h=Hb*Math.max(0,it.v)/max,x=box.x+10*k+j*bw+bw*.2;
    s+=S.rect(x,top+Hb-h,bw*.6,h,{fill:it.c,fop:.85})+S.text(x+bw*.3,top+Hb+12*k,it.l,{anchor:'middle',size:13,c:it.c})+S.text(x+bw*.3,top+Hb+28*k,f.sig(it.v*u.f,3),{anchor:'middle',size:13,c:C.ink2});});
  s+=S.line(box.x+8*k,top+Hb,box.x+box.w-8*k,top+Hb,{c:C.ink2,w:1})+S.text(box.x+box.w-6*k,box.y+4*k,`(${u.u})`,{anchor:'end',base:'top',size:13,c:C.ink2});
  return s;
}

/* ---------- scène ---------- */
function drawScene(a){
  const Pn=a.panels.scene,S=a.S,C=a.C,k=a.k,f=a.fmt,w=Pn.w,h=Pn.h,stack=a.narrow;
  let s='';
  if(a.tab===0){
    const g=geo(a),m=P.solenoid(g),zl=stack?{x:0,y:0,w,h:h*.56}:{x:0,y:0,w:w*.6,h},zr=stack?{x:0,y:h*.56,w,h:h*.44}:{x:w*.6,y:0,w:w*.4,h};
    const scl=(zl.w-70*k)/.40,Lpx=g.l*scl,r=Math.min(zl.h*.22,62*k)*g.a/.02;
    const C1=coil(a,zl,{Lpx,r,B:m.B,Bref:BREF,pxT:.9*.40*scl/BREF,dens:m.density/(BREF**2/(2*MU0)),i:g.i,iref:3,turns:Math.max(6,Math.min(34,Math.round(g.N/60)))});
    s+=C1.s;
    // cote de longueur et poignées
    const yc=Math.min(zl.y+zl.h-26*k,C1.cy+C1.r+Math.min(zl.h*.28,C1.r*1.9+24*k)+18*k);
    s+=S.line(C1.x1,yc,C1.x2,yc,{c:C.ink2,w:1})+S.text(C1.cx,yc+14*k,`${S.v('l')} = ${f.sig(g.l*100,3)} cm`,{anchor:'middle',size:14,c:C.ink2});
    s+=S.circle(C1.x2,C1.cy,7*k,{fill:C.card,c:C.ink,w:2.2})+S.circle(C1.cx,C1.cy-C1.r,7*k,{fill:C.card,c:C.ink,w:2.2});
    st.geo={len:[C1.x2,C1.cy],rad:[C1.cx,C1.cy-C1.r]};
    s+=S.text(zl.x+10*k,10*k,`Bobine longue · ${S.v('N')} = ${f.fix(g.N,0)} · ${S.v('a')} = ${f.sig(g.a*100,3)} cm (échelle radiale dilatée)`,{base:'top',size:14,c:C.ink});
    // du champ au flux
    const x=zr.x+Math.min(zr.w*.42,96*k),dy=Math.min(70*k,zr.h/5.3),y0=zr.y+Math.max(40*k,(zr.h-4.3*dy)/2);
    const row=(y,lhs,rhs,val,c)=>S.text(x-6*k,y,lhs,{anchor:'end',size:16,c})+rhs+S.text(x+4*k,y+24*k,'= '+val,{size:13,c:a.C.ink2});
    s+=row(y0,sub(a,'B','P')+' =',sfrac(a,x+34*k,y0,`${S.r('μ')}${S.r('<tspan font-size="72%" dy="0.42em">0</tspan><tspan dy="-0.3em">​</tspan>')} ${S.v('N')} ${S.v('i')}`,S.v('l'),{c:C.B,w:56}),f.sig(m.B*1e3,3)+' mT',C.B);
    s+=row(y0+dy,sub(a,'Φ','1 spire')+' =',S.text(x+6*k,y0+dy,`${sub(a,'B','P')} ${S.v('S')}`,{size:16,c:C.v}),f.sig(m.phiTurn*1e6,3)+' µWb',C.v);
    s+=row(y0+2*dy,sub(a,'Φ','P')+' =',S.text(x+6*k,y0+2*dy,`${S.v('N')} ${sub(a,'Φ','1 spire')}`,{size:16,c:C.v}),f.sig(m.phi*1e3,3)+' mWb',C.v);
    s+=row(y0+3*dy,S.v('L')+' =',sfrac(a,x+38*k,y0+3*dy,`${S.r('μ₀')} ${S.v('N')}${S.sup('2')} ${S.v('S')}`,S.v('l'),{c:C.ink,w:64}),f.sig(m.L*1e3,3)+' mH',C.ink);
    s+=row(y0+4*dy,sub(a,'E','mag')+' =',S.text(x+6*k,y0+4*dy,`½ ${S.v('L')} ${S.v('i')}${S.sup('2')}`,{size:16,c:C.cInk}),f.sig(m.energy*1e3,3)+' mJ',C.cInk);
    if(!stack)s+=S.line(zr.x,12*k,zr.x,h-12*k,{c:C.rule,w:1});
    a.svg('scene',s);return;
  }
  const zl=stack?{x:0,y:0,w,h:h*.4}:{x:0,y:0,w:w*.36,h},zr=stack?{x:0,y:h*.4,w,h:h*.6}:{x:w*.36,y:0,w:w*.64,h};
  const m=at(a,a.t),T=TT(a);
  if(a.tab===1){
    const p=rlp(a),g={N:p.N,l:p.l,a:p.a},m0=P.solenoid({...g,i:m.I}),scl=(zl.w-60*k)/.40;
    const C1=coil(a,zl,{Lpx:Math.max(40*k,p.l*scl),r:Math.min(zl.h*.22,60*k)*p.a/.02,B:m.B,Bref:m0.B||1,pxT:.75*Math.max(40*k,p.l*scl)/(m0.B||1),dens:(m.i/m.I)**2,i:m.i,iref:m.I,turns:Math.max(6,Math.min(26,Math.round(p.N/70)))});
    s+=C1.s+S.text(zl.x+10*k,10*k,`${S.v('L')} = ${f.sig(m.L*1e3,3)} mH`,{base:'top',size:14,c:C.ink});
    s+=circuitRL(a,zr,m,p);
  }else{
    const p=cutp(a);
    s+=energyCoil(a,zl,m,p)+circuitCut(a,zr,m,p);
  }
  if(!stack)s+=S.line(zr.x,12*k,zr.x,h-12*k,{c:C.rule,w:1});
  a.svg('scene',s);
}
function energyCoil(a,zl,m,p){
  const S=a.S,C=a.C,k=a.k,f=a.fmt;
  const C1=coil(a,zl,{Lpx:zl.w*.6,r:Math.min(zl.h*.16,46*k),B:m.i,Bref:m.I0,pxT:.6*zl.w*.6/m.I0,dens:m.energy/m.E0,i:m.i,iref:m.I0,turns:14});
  let s=C1.s+S.text(zl.x+10*k,10*k,`${S.v('L')} = ${f.sig(p.L,3)} H`,{base:'top',size:14,c:C.ink});
  return s;
}
function circuitRL(a,b,m,p){
  const S=a.S,C=a.C,k=a.k,f=a.fmt,eq=a.p.schema==='equiv',decay=p.program==='decay';
  const xl=b.x+48*k,xr=b.x+b.w-70*k,yt=b.y+56*k,yb=b.y+b.h-48*k,ym=(yt+yb)/2;
  let s=S.text(b.x+12*k,10*k,eq?'Schéma équivalent : générateur '+sub(a,'e','P'):'Circuit électrique',{base:'top',size:14,c:C.ink});
  // branche gauche : générateur ou fil
  if(decay)s+=E.W(a,xl,yt,xl,yb)+S.text(xl-10*k,ym,'générateur retiré',{anchor:'end',size:13,c:C.ink2,rot:-90});
  else s+=E.W(a,xl,yt,xl,ym-15*k)+E.W(a,xl,ym+15*k,xl,yb)+E.gen(a,xl,ym)+S.text(xl-20*k,ym,S.v('E'),{anchor:'end',size:16});
  // fil du haut : R0 puis interrupteur fermé
  const xm=(xl+xr)/2;s+=E.res(a,xl,yt,xm,yt)+S.text((xl+xm)/2,yt-18*k,sub(a,'R','0'),{anchor:'middle',size:15})+E.sw(a,xm+10*k,yt,xm+40*k,false)+E.W(a,xm,yt,xm+10*k,yt)+E.W(a,xm+40*k,yt,xr,yt);
  s+=S.text(xm+25*k,yt-16*k,'K',{anchor:'middle',size:14,c:C.ink2});
  // bobine (réelle : L et R ; équivalente : e_P et R)
  const y1=yt+(yb-yt)*.12,y2=ym+4*k,y3=yb-(yb-yt)*.12;
  s+=E.W(a,xr,yt,xr,y1)+E.W(a,xr,y3,xr,yb)+E.res(a,xr,y2,xr,y3,{len:30*k})+S.text(xr+14*k,(y2+y3)/2,S.v('R'),{size:15});
  if(eq){const yg=(y1+y2)/2;s+=E.W(a,xr,y1,xr,yg-14*k)+E.W(a,xr,yg+14*k,xr,y2)+S.circle(xr,yg,14*k,{fill:C.card,c:C.ink,w:2})+S.line(xr,yg-14*k,xr,yg+14*k,{c:C.ink,w:1.6});
    s+=E.volt(a,xr+30*k,yg-18*k,xr+30*k,yg+18*k,sub(a,'e','P'),{c:C.F,dx:8*k});}
  else{s+=E.ind(a,xr,y1,xr,y2,{side:-1})+S.text(xr-16*k,(y1+y2)/2,S.v('L'),{anchor:'end',size:15});
    s+=E.volt(a,xr+30*k,y2-4*k,xr+30*k,y1+4*k,sub(a,'u','L'),{c:C.F,dx:8*k});}
  s+=S.rect(xr-26*k,y1-6*k,62*k,y3-y1+12*k,{c:C.ink2,w:1,dash:`${4*k} ${3*k}`,rx:4})+S.text(xr+5*k,y3+20*k,'bobine',{anchor:'middle',size:13,c:C.ink2});
  s+=E.W(a,xl,yb,xr,yb);
  // courant : flèche proportionnelle
  if(m.i>1e-12){const L=60*k*m.i/m.I;s+=S.arrow(xm+L/2,yb,xm-L/2,yb,{c:C.E,w:3.2,head:10*k})+S.text(xm,yb+16*k,S.v('i'),{anchor:'middle',size:16,c:C.E});}
  return s;
}
function circuitCut(a,b,m,p){
  const S=a.S,C=a.C,k=a.k,f=a.fmt,eq=a.p.schema==='equiv',open=a.t>0||true;
  const xl=b.x+44*k,xr=b.x+b.w-74*k,yt=b.y+62*k,yb=b.y+b.h-46*k,ym=(yt+yb)/2,xk=xl+(xr-xl)*.33,xp=xl+(xr-xl)*.66;
  let s=S.text(b.x+12*k,10*k,'K s\'ouvre à '+S.v('t')+' = 0',{base:'top',size:14,c:C.ink});
  {const pk=[p.E+p.L*m.I0/p.delta,p.E+p.Rp*m.I0,p.E+p.Vd];s+=S.text(b.x+b.w/2,b.y+b.h-14*k,`max ${sub(a,'u','K')} : ${f.sig(pk[0],3)} V (sans) · ${f.sig(pk[1],3)} V (${S.v('R')}′) · ${f.sig(pk[2],3)} V (D)`,{anchor:'middle',size:13,c:C.ink2});}
  s+=E.W(a,xl,yt,xl,ym-15*k)+E.W(a,xl,ym+15*k,xl,yb)+E.gen(a,xl,ym)+S.text(xl-20*k,ym,S.v('E'),{anchor:'end',size:16});
  s+=E.W(a,xl,yt,xk-16*k,yt)+E.sw(a,xk-16*k,yt,xk+16*k,true)+E.W(a,xk+16*k,yt,xr,yt)+S.text(xk,yt-30*k,'K',{anchor:'middle',size:15,c:C.ink2});
  s+=E.W(a,xl,yb,xr,yb);
  // étincelle (coupure sans protection, tant que le courant circule)
  if(p.protection==='open'&&m.i>1e-9){const sp=Math.min(1,m.i/m.I0);s+=S.path(`M${xk-10*k},${yt}l${6*k},${-9*k} ${4*k},${8*k} ${5*k},${-10*k} ${5*k},${10*k}`,{c:C.F,w:1.5+2*sp,op:.4+.6*sp});}
  s+=S.text(xk,yt+20*k,`${sub(a,'u','K')} = ${f.sig(m.UK,3)} V`,{anchor:'middle',size:15,c:C.F});
  // protection, du côté de la bobine
  if(p.protection==='resistor')s+=E.res(a,xp,yb,xp,yt,{c:C.cInk})+S.text(xp-14*k,ym,S.v('R')+'′',{anchor:'end',size:16,c:C.cInk});
  if(p.protection==='diode')s+=E.diode(a,xp,yb,xp,yt,{c:C.cInk})+S.text(xp-16*k,ym,'D',{anchor:'end',size:16,c:C.cInk});
  if(p.protection!=='open'&&m.i>1e-12&&a.t>0){const L=50*k*m.i/m.I0;s+=S.arrow(xp+16*k,ym+L/2,xp+16*k,ym-L/2,{c:C.E,w:2.6,head:9*k});}
  // bobine
  const y1=yt+(yb-yt)*.1,y2=ym+4*k,y3=yb-(yb-yt)*.1;
  s+=E.W(a,xr,yt,xr,y1)+E.W(a,xr,y3,xr,yb)+E.res(a,xr,y2,xr,y3,{len:30*k})+S.text(xr+14*k,(y2+y3)/2,S.v('R'),{size:15});
  if(eq){const yg=(y1+y2)/2;s+=E.W(a,xr,y1,xr,yg-14*k)+E.W(a,xr,yg+14*k,xr,y2)+S.circle(xr,yg,14*k,{fill:C.card,c:C.ink,w:2})+S.line(xr,yg-14*k,xr,yg+14*k,{c:C.ink,w:1.6})+E.volt(a,xr+30*k,yg-18*k,xr+30*k,yg+18*k,sub(a,'e','P'),{c:C.F,dx:8*k});}
  else s+=E.ind(a,xr,y1,xr,y2,{side:-1})+S.text(xr-16*k,(y1+y2)/2,S.v('L'),{anchor:'end',size:15})+E.volt(a,xr+30*k,y2-4*k,xr+30*k,y1+4*k,sub(a,'u','L'),{c:C.F,dx:8*k});
  if(m.i>1e-12){const L=56*k*m.i/m.I0;s+=S.arrow(xr-16*k,ym-L/2,xr-16*k,ym+L/2,{c:C.E,w:3.2,head:10*k})+S.text(xr-24*k,ym+L/2+12*k,S.v('i'),{anchor:'end',size:16,c:C.E});}
  return s;
}

/* ---------- graphes ---------- */
function zones(P,k,wts){const g=6*k,tot=wts.reduce((x,y)=>x+y,0),H=P.h-g*(wts.length-1);let y=0;return wts.map(q=>{const b={x:0,y,w:P.w,h:H*q/tot};y+=b.h+g;return b;});}
function drawGraph(a){
  const Pn=a.panels.graphe,S=a.S,C=a.C,k=a.k,f=a.fmt;
  if(a.tab===0){
    const g=geo(a),b=zones(Pn,k,[1,1]),L=P.solenoid(g).L,uP=K.unit(L*3,'Wb'),uE=K.unit(.5*L*9,'J');
    const g1=K.tplot(a,{box:b[0],xmin:-3,T:3,t:g.i,futur:true,xlab:`${S.v('i')} (A)`,ylab:`${sub(a,'Φ','P')} (${uP.u})`,series:[{f:i=>L*i*uP.f,c:C.v}],id:'a1'});
    const g2=K.tplot(a,{box:b[1],xmin:-3,T:3,t:g.i,futur:true,xlab:`${S.v('i')} (A)`,ylab:`${sub(a,'E','mag')} (${uE.u})`,series:[{f:i=>.5*L*i*i*uE.f,c:C.cInk}],id:'a2'});
    st.gr=g1.G;a.svg('graphe',g1.svg+g2.svg);return;
  }
  const T=TT(a),uT=K.unit(T,'s'),tf=uT.f,m=at(a,a.t),b=zones(Pn,k,a.p.bilan?[1,1,.95]:[1,1]);
  const I0=a.tab===1?m.I:m.I0,uI=K.unit(I0,'A');
  const sI=[{f:x=>at(a,x/tf).i*uI.f,c:C.E}];
  let marks=[];
  if(a.tab===1&&a.p.tangente){const tau=m.tau,dec=a.p.prog==='decay';
    sI.unshift({f:()=>I0*uI.f,c:C.pred,w:1.3,dash:true,all:true,ghost:true});
    sI.unshift({f:x=>{const t=x/tf;return t<=1.25*tau?(dec?I0*(1-t/tau):I0*t/tau)*uI.f:NaN},c:C.pred,w:1.6,dash:true,all:true,ghost:true});
    marks=[{x:tau*tf,label:'τ'}];}
  const g1=K.tplot(a,{box:b[0],T:T*tf,t:a.t*tf,futur:a.p.futur,xlab:`${S.v('t')} (${uT.u})`,ylab:`${S.v('i')} (${uI.u})`,series:sI,marks,id:'b1'});
  let sU;
  if(a.tab===1){const key=a.p.schema==='equiv'?'ep':'uL';sU=[{f:x=>at(a,x/tf)[key],c:C.F}];}
  else sU=[{f:x=>at(a,x/tf).ep,c:C.F},{f:x=>at(a,x/tf).UK,c:C.cInk,dash:true}];
  const g2=K.tplot(a,{box:b[1],T:T*tf,t:a.t*tf,futur:a.p.futur,xlab:`${S.v('t')} (${uT.u})`,ylab:`${a.tab===1?(a.p.schema==='equiv'?sub(a,'e','P'):sub(a,'u','L')):sub(a,'e','P')+' et '+sub(a,'u','K')} (V)`,series:sU,id:'b2'});
  let s=g1.svg+g2.svg;
  if(a.p.bilan){
    if(a.tab===1){const dec=a.p.prog==='decay',tot=dec?m.E0:m.Eg,max=Math.max(1e-15,dec?m.E0:P.rl(rlp(a),TT(a)).Eg);
      s+=bars(a,b[2],[{l:dec?sub(a,'E','mag')+'(0)':'fournie',v:tot,c:C.ink2},{l:'Joule',v:m.Q,c:C.E},{l:sub(a,'E','mag'),v:m.energy,c:C.cInk}],dec?'Bilan : '+sub(a,'E','mag')+'(0) = Joule + '+sub(a,'E','mag'):'Bilan : fournie = Joule + '+sub(a,'E','mag'),max);}
    else{const end=P.rupture(cutp(a),TT(a)),max=Math.max(1e-15,end.E0+end.Eg);
      s+=bars(a,b[2],[{l:'disponible',v:m.E0+m.Eg,c:C.ink2},{l:'Joule R',v:m.Qcoil,c:C.E},{l:a.p.prot==='open'?'Arc':a.p.prot==='resistor'?'R′':'Diode',v:m.Qprotection,c:C.F},{l:sub(a,'E','mag'),v:m.energy,c:C.cInk}],'Bilan : disponible = dissipations + '+sub(a,'E','mag'),max);}
  }
  a.svg('graphe',s);
}

/* ---------- mesures ---------- */
function info(a){
  const f=a.fmt,C=a.C;
  if(a.tab===0){const g=geo(a),m=P.solenoid(g);
    a.metrics([{label:`Inductance ${mv('L')} = ${M.frac('μ<sub>0</sub>'+mv('N')+'<sup>2</sup>'+mv('S'),mv('l'))}`,value:f.sig(m.L*1e3,3),unit:'mH',hint:'toujours positive'},
      {label:`Flux propre ${M.v('Φ','P')} = ${mv('L')}${mv('i')}`,value:f.sig(m.phi*1e3,3),unit:'mWb',hint:'flux lié aux N spires'},
      {label:`Champ propre ${M.v('B','P')}`,value:f.sig(m.B*1e3,3),unit:'mT',hint:`densité ${f.sig(m.density,3)} J·m<sup>−3</sup>`},
      {label:`Énergie ${M.v('E','mag')} = ½${mv('L')}${mv('i')}<sup>2</sup>`,value:f.sig(m.energy*1e3,3),unit:'mJ',hint:`= ${M.frac(mv('B')+'<sup>2</sup>','2μ<sub>0</sub>')}${mv('S')}${mv('l')}`}]);
    a.insight(g.i===0?'Sans courant, pas de champ propre ni de flux propre ; l\'énergie magnétique est nulle.':'<i class="m">L</i> ne dépend que de la géométrie : doubler <i class="m">N</i> multiplie <i class="m">L</i> par 4. Le flux propre change de signe avec <i class="m">i</i>, l\'énergie ½<i class="m">Li</i>² non.',['<i class="m">L</i> ne dépend que de la géométrie : doubler <i class="m">N</i> multiplie <i class="m">L</i> par 4. Le flux propre change de signe avec <i class="m">i</i>, l\'énergie ½<i class="m">Li</i>² non.']);
    a.legend([{c:C.B,label:'champ propre'},{c:C.E,label:'courant'},{c:C.v,label:'flux propre'},{c:C.cInk,label:'énergie magnétique'}]);return;}
  const m=at(a,a.t),T=TT(a),uT=K.unit(T,'s');
  a.clock(`${mv('t')} = ${f.sig(a.t*uT.f,3)} ${uT.u}`);
  if(a.tab===1){const p=rlp(a),eq=a.p.schema==='equiv';
    a.metrics([{label:`Courant ${mv('i')}`,value:f.sig(m.i,3),unit:'A',hint:p.program==='decay'?`${mv('i')}(0) = ${f.sig(m.I,3)} A`:`${M.v('I','∞')} = ${f.sig(m.I,3)} A`},
      {label:eq?`${M.v('e','P')} = −${mv('L')} d${mv('i')}/d${mv('t')}`:`${M.v('u','L')} = ${mv('L')} d${mv('i')}/d${mv('t')}`,value:f.sig(eq?m.ep:m.uL,3),unit:'V',hint:eq?'générateur':'récepteur'},
      {label:`Constante de temps τ = ${M.frac(mv('L'),M.v('R','0')+' + '+mv('R'))}`,value:f.sig(m.tau*1e3,3),unit:'ms',hint:`${mv('L')} = ${f.sig(m.L*1e3,3)} mH`},
      {label:`Énergie ${M.v('E','mag')}`,value:f.sig(m.energy*1e3,3),unit:'mJ',hint:''}]);
    a.insight(p.program==='decay'?'La bobine restitue son énergie magnétique, dissipée par effet Joule dans <i class="m">R</i><sub>0</sub> + <i class="m">R</i> : le courant ne s\'annule pas brutalement.':'La f.é.m. auto-induite s\'oppose à l\'établissement du courant : <i class="m">i</i> est continu et atteint <i class="m">E</i>/(<i class="m">R</i><sub>0</sub> + <i class="m">R</i>) en quelques τ.',['La bobine restitue son énergie magnétique, dissipée par effet Joule dans <i class="m">R</i><sub>0</sub> + <i class="m">R</i> : le courant ne s\'annule pas brutalement.']);
    a.legend([{c:C.E,label:'courant'},{c:C.F,label:eq?'f.é.m. e_P':'tension u_L'},{c:C.B,label:'champ propre'},a.p.tangente&&{c:C.pred,dash:true,label:'tangente à l\'origine'}]);
    return;}
  const p=cutp(a),pk={open:p.E+p.L*m.I0/p.delta,resistor:p.E+p.Rp*m.I0,diode:p.E+p.Vd};
  a.metrics([{label:`Courant ${mv('i')}`,value:f.sig(m.i,3),unit:'A',hint:`${mv('i')}(0) = ${M.frac(mv('E'),mv('R'))} = ${f.sig(m.I0,3)} A`},
    {label:`Tension sur K ${M.v('u','K')}`,value:f.sig(m.UK,3),unit:'V',hint:`max ${f.sig(pk[p.protection],3)} V`},
    {label:`${M.v('e','P')} = −${mv('L')} d${mv('i')}/d${mv('t')}`,value:f.sig(m.ep,3),unit:'V',hint:p.protection==='open'?`≈ ${mv('L')}${M.v('I','0')}/Δ${mv('t')}`:'convention générateur'},
    {label:`Énergie ${M.v('E','mag')}`,value:f.sig(m.energy*1e3,3),unit:'mJ',hint:`initialement ${f.sig(m.E0*1e3,3)} mJ`}]);
  a.insight(p.protection==='open'?'Couper brutalement le courant d\'une bobine crée une f.é.m. très grande : la tension sur K dépasse largement <i class="m">E</i> et une étincelle dissipe l\'énergie magnétique.':p.protection==='resistor'?'R′ offre un chemin au courant de la bobine : la surtension est limitée à <i class="m">E</i> + <i class="m">R</i>′<i class="m">I</i><sub>0</sub>.':'La diode de roue libre laisse le courant décroître dans la bobine : la tension sur K ne dépasse pas <i class="m">E</i> + <i class="m">V</i><sub>D</sub>.',['Couper brutalement le courant d\'une bobine crée une f.é.m. très grande : la tension sur K dépasse largement <i class="m">E</i> et une étincelle dissipe l\'énergie magnétique.']);
  a.legend([{c:C.E,label:'courant'},{c:C.F,label:'f.é.m. e_P'},{c:C.cInk,dash:true,label:'tension u_K'},{c:C.cInk,label:'énergie magnétique'}]);
}

/* ---------- interactions ---------- */
A.drag('scene',{
  hit:(x,y)=>{if(A.tab!==0||!st.geo)return false;const g=st.geo,k=A.k;return Math.hypot(x-g.len[0],y-g.len[1])<20*k||Math.hypot(x-g.rad[0],y-g.rad[1])<20*k;},
  start(x,y){const g=st.geo,k=A.k;st.drag=Math.hypot(x-g.len[0],y-g.len[1])<20*k?{id:'l',x,v:A.p.l}:{id:'ra',y,v:A.p.ra};},
  move(x,y){const d=st.drag;if(!d)return;if(d.id==='l')A.p.l=Math.round(Math.max(10,Math.min(40,d.v+(x-d.x)*.08))*2)/2;else A.p.ra=Math.round(Math.max(.5,Math.min(2,d.v-(y-d.y)*.012))*20)/20;A.refresh();},
  end(){st.drag=null;}
});
A.drag('graphe',{
  hit:()=>A.tab===0,
  start(x){this.move(x)},
  move(x){if(!st.gr)return;A.p.i0=Math.round(Math.max(-3,Math.min(3,st.gr.xv(x)))*100)/100;A.refresh();}
});

</script>
