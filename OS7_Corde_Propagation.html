  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){

        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

      const im=new Image(); im.onload=()=>{ctx.drawImage(im,x,y,r.width*sc,r.height*sc);res()}; im.onerror=()=>res(); im.src=src;}));

'use strict';
// Corde linéaire : y_tt = c0² y_xx - (2π fc)² y. Unités SI.
// Verlet en vitesse, amortissement uniquement dans le prolongement absorbant.
class StringModel {
 constructor({c=3,fc=0,end='infinite',L=12,dx=.0125}={}){this.c=c;this.fc=fc;this.end=end;this.L=L;this.dx=dx;this.n=Math.round((end==='infinite'?L+120:L)/dx)+1;this.y=new Float64Array(this.n);this.v=new Float64Array(this.n);this.a=new Float64Array(this.n);this.gamma=new Float64Array(this.n);this.t=0;this.dt=.4*dx/c;for(let i=0;i<this.n;i++){let z=(i*dx-L-3)/117;this.gamma[i]=end==='infinite'&&z>0?1.2*z*z:0;}}
 accel(){const {y,a,n,c,dx,fc}=this,q=c*c/(dx*dx),om2=(2*Math.PI*fc)**2;for(let i=1;i<n-1;i++)a[i]=q*(y[i-1]-2*y[i]+y[i+1])-om2*y[i];a[n-1]=this.end==='free'?2*q*(y[n-2]-y[n-1])-om2*y[n-1]:0;}
 step(dt,source){this.y[0]=source(this.t);this.accel();for(let i=1;i<this.n;i++){this.v[i]=(this.v[i]+.5*dt*this.a[i])*Math.exp(-.5*dt*this.gamma[i]);this.y[i]+=dt*this.v[i];}if(this.end!=='free'){this.y[this.n-1]=0;this.v[this.n-1]=0;}this.t+=dt;this.y[0]=source(this.t);this.accel();for(let i=1;i<this.n;i++)this.v[i]=(this.v[i]+.5*dt*this.a[i])*Math.exp(-.5*dt*this.gamma[i]);}
 advance(duration,source){const steps=Math.max(1,Math.ceil(duration/this.dt)),dt=duration/steps;for(let j=0;j<steps;j++)this.step(dt,source);}
 sample(x){const u=Math.max(0,Math.min(this.n-1,x/this.dx)),i=Math.min(this.n-2,Math.floor(u)),f=u-i;return this.y[i]*(1-f)+this.y[i+1]*f;}
 static pulse(u){return u<=0||u>=1?0:(729/16)*u*u*(1-u)**4;}
 static phase(c,fc,f){if(f<=fc)return null;const v=c/Math.sqrt(1-(fc/f)**2);return {v,lambda:v/f,k:2*Math.PI*f/v};}
}
globalThis.OS7String=StringModel;

// @titre Corde, propagation et dispersion · OS7 · MPSI
// @sortie ../OS7_Corde_Propagation/OS7_Corde_Propagation.html

'use strict';

   Physique : OS7String (OS7_Corde_Propagation_physique.js, d'origine, inchangée)
     s_tt = c² s_xx − (2π f_c)² s ; Verlet en vitesse ; prolongement absorbant pour l'extrémité « infinie ».

   ===================================================================== */

const MINUS='−',DT=.0125,NX=480,DX=12/NX,MAXSNAP=4000;
const st={model:null,ref:null,snaps:[],t0:0,acc:0,pulses:[.1],manual:0,photo:null,xm:[3,7],tm:[1,2.33],G:null,H:null};

const dir=a=>a.p.side==='right'?-1:1;
const prm=a=>({c:a.p.c,fc:a.p.disp?a.p.fc:0,end:a.p.end});
const smp=(a,m,x)=>m.sample(dir(a)>0?x:12-x);
const exc=a=>t=>{
  const A0=a.p.amp/100,f=a.p.freq,mode=a.p.mode;
  if(mode==='manual')return st.manual;
  if(mode==='pulse')return A0*st.pulses.reduce((s,t0)=>s+PH.pulse((t-t0)/a.p.duration),0);
  const ramp=.5-.5*Math.cos(Math.PI*Math.min(1,Math.max(0,t/.8)));

};

}
function advance(a,dt){
  st.acc+=dt;const ex=exc(a);

}
const lam=a=>PH.phase(a.p.c,a.p.disp?a.p.fc:0,a.p.freq);

const A=AnimKit.app({

    modele:'Corde sans dispersion : <i class="m">s</i><sub>tt</sub> = <i class="m">c</i><sub>0</sub><sup>2</sup> <i class="m">s</i><sub>xx</sub>. Avec rappel élastique réparti : <i class="m">s</i><sub>tt</sub> = <i class="m">c</i><sub>0</sub><sup>2</sup> <i class="m">s</i><sub>xx</sub> − (2π<i class="m">f</i><sub>c</sub>)<sup>2</sup> <i class="m">s</i>, soit ω<sup>2</sup> = <i class="m">c</i><sub>0</sub><sup>2</sup><i class="m">k</i><sup>2</sup> + (2π<i class="m">f</i><sub>c</sub>)<sup>2</sup> et <i class="m">v</i><sub>ϕ</sub> = <i class="m">c</i><sub>0</sub>/√(1 − (<i class="m">f</i><sub>c</sub>/<i class="m">f</i>)<sup>2</sup>) pour <i class="m">f</i> &gt; <i class="m">f</i><sub>c</sub>. Sous la coupure, la réponse monochromatique est évanescente ; un transitoire de démarrage peut néanmoins se propager. Extrémité fixe : <i class="m">s</i> = 0 ; libre : ∂<i class="m">s</i>/∂<i class="m">x</i> = 0 ; « infinie » : prolongement de 120 m avec absorption très progressive hors de la partie visible (réflexion résiduelle inférieure à 0.3 %). La source impose son déplacement. Retard et phase affichés : onde <b>incidente</b> seule ; les enregistrements A et B donnent le déplacement total, réflexions comprises. Calcul : différences finies, Verlet en vitesse, pas spatial 1.25 cm, pas temporel 0.4 Δ<i class="m">x</i>/<i class="m">c</i><sub>0</sub> ; faible dispersion numérique aux courtes longueurs d\'onde. Linéaire, sans atténuation.',

    let body='';
    const endX=dir(a)>0?12:0,srcX=12-endX;
    if(p.disp)for(let x=.45;x<12;x+=.6){const y=at(sn.p,x)*100;body+=S.poly([[G.X(x),G.Y(-ymax*.87)],[G.X(x-.06),G.Y(-ymax*.72)],[G.X(x+.06),G.Y(-ymax*.56)],[G.X(x-.06),G.Y(-ymax*.4)],[G.X(x),G.Y(y)]],{c:C.ink2,w:1,op:.55})}
    const pts=[];for(let j=0;j<=NX;j+=2)pts.push([j*DX,sn.p[j]*100]);
    if(st.photo){const q=[];for(let j=0;j<=NX;j+=2)q.push([j*DX,st.photo.p[j]*100]);body+=S.curve(q,G,{c:C.pred,w:2,dash:'6 5'})}
    if(p.disp&&p.compare&&sn.r){const q=[];for(let j=0;j<=NX;j+=2)q.push([j*DX,sn.r[j]*100]);body+=S.curve(q,G,{c:C.pred,w:2,dash:'8 5'})}
    body+=S.curve(pts,G,{c:C.cInk,w:3});
    for(let x=.6;x<12;x+=.6)body+=S.circle(G.X(x),G.Y(at(sn.p,x)*100),2.6*k,{fill:C.pred,op:.8});
    if(p.end==='fixed'){body+=S.line(G.X(endX),G.Y(-ymax*.65),G.X(endX),G.Y(ymax*.65),{c:C.ink,w:5});body+=S.circle(G.X(endX),G.Y(0),5*k,{fill:C.cInk})}
    else if(p.end==='free'){body+=S.line(G.X(endX)+(endX?6*k:-6*k),G.Y(-ymax*.85),G.X(endX)+(endX?6*k:-6*k),G.Y(ymax*.85),{c:C.pred,w:2});body+=S.circle(G.X(endX),G.Y(at(sn.p,endX)*100),7*k,{fill:C.card,c:C.cInk,w:3})}
    else body+=S.text(G.X(endX)+(endX?-4*k:4*k),G.Y(at(sn.p,endX)*100),dir(a)>0?'→':'←',{anchor:endX?'end':'start',size:26,c:C.cInk,halo:false});
    if(p.rulers)st.xm.forEach((x,j)=>{body+=S.line(G.X(x),G.y0+8,G.X(x),G.y0+G.h,{c:C.pred,w:1.5,dash:'4 5'})+S.text(G.X(x)+10*k,G.y0+G.h-12*k,'x'+(j?'₂':'₁'),{size:14,c:C.ink2})});
    const marks=[['S',srcX,C.cInk],['A',p.pa,col.A],['B',p.pb,col.B]];
    for(const[nm,x,cl]of marks){const y=G.Y(at(sn.p,x)*100);body+=S.circle(G.X(x),y,8*k,{fill:cl,c:C.card,w:1.5})+S.text(G.X(x),G.y0+11*k,nm,{anchor:'middle',size:16,c:cl,weight:700});}
    if(p.mode==='manual')body+=S.text(G.X(srcX)+(srcX?-14*k:14*k),G.Y(0)-18*k,'glisser S',{anchor:srcX?'end':'start',size:13,c:C.ink2});
    if(st.photo)body+=S.text(G.x0+G.w-6*k,G.y0+12*k,'Photo : t = '+a.fmt.fix(st.photo.t,2)+' s',{anchor:'end',size:13,c:C.ink2});
    const ph=lam(a);let warn='';
    if(p.disp&&p.mode==='sine'&&!ph)warn=Math.abs(p.freq-p.fc)<1e-8?'f = f_c : à la coupure':'f < f_c : réponse évanescente, pas d\'onde progressive monochromatique';
    if(warn)body+=S.text(G.x0+8*k,G.y0+G.h-10*k,warn.replace('f_c','f<tspan font-size="72%" dy="0.42em">c</tspan>'),{size:14,c:C.F,weight:600,base:'bottom'});
    a.svg('profil',g+`<g clip-path="url(#cp)">${body}</g>`);
    /* ----- historique des capteurs ----- */
    const tmax=Math.max(12,tv),tmin=tmax-12;
    const GH=S.graph({x:0,y:0,w:H.w,h:H.h,xmin:tmin,xmax:tmax,ymin:-ymax,ymax,xlab:'t (s)',ylab:'s (cm)',yticks:[-ymax,-ymax/2,0,ymax/2,ymax].map(v=>+v.toFixed(2))});
    st.H=GH;let hb=S.clip('ch',GH),hc='';
    const i0=Math.max(0,Math.floor((tmin-st.t0)/(2*DT)));
    for(const[w,cl]of[['pa',col.A],['pb',col.B]]){const q=[];for(let j=i0;j<=i;j++)q.push([st.snaps[j].t,at(st.snaps[j].p,p[w])*100]);hc+=S.curve(q,GH,{c:cl,w:2.6})}
    if(p.rulers)st.tm.forEach((t,j)=>{hc+=S.line(GH.X(t),GH.y0,GH.X(t),GH.y0+GH.h,{c:C.pred,w:1.5,dash:'5 5'})+S.text(GH.X(t)+5*k,GH.y0+12*k,'t'+(j?'₂':'₁'),{size:14,c:C.ink2})});
    a.svg('histo',GH.svg+hb+`<g clip-path="url(#ch)">${hc}</g>`);
    a.legend([{label:'Corde',c:C.cInk},{label:'A',c:col.A},{label:'B',c:col.B},p.disp&&p.compare?{label:'Sans dispersion',c:C.pred,dash:true}:null,st.photo?{label:'Photographie',c:C.pred,dash:true}:null]);
    a.clock(`<span class="m">t</span> = ${a.fmt.fix(tv,2)} s`);
    /* ----- mesures ----- */
    const mets=[],dist=p.pb-p.pa,sinus=p.mode==='sine';
    if(p.rulers)mets.push({label:'Δx entre x₁ et x₂',value:a.fmt.fix(Math.abs(st.xm[1]-st.xm[0]),2),unit:'m'},{label:'Δt entre t₁ et t₂',value:a.fmt.fix(Math.abs(st.tm[1]-st.tm[0]),2),unit:'s'});
    if(p.attendu){
      if(!p.disp){
        mets.push({label:'Retard attendu B/A',value:a.fmt.sig(dir(a)*dist/p.c,3),unit:'s'});
        if(sinus){const l=p.c/p.freq,ph2=-2*Math.PI*dir(a)*dist/l,w=((ph2+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;mets.push({label:'λ incidente',value:a.fmt.sig(l,3),unit:'m'},{label:'Δϕ B/A incident',value:a.fmt.sig(w/Math.PI,3),unit:'π rad'})}
      }else if(sinus&&ph){const ph2=-ph.k*dist*dir(a),w=((ph2+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;mets.push({label:'Vitesse de phase incidente',value:a.fmt.sig(ph.v,3),unit:'m·s⁻¹'},{label:'λ incidente',value:a.fmt.sig(ph.lambda,3),unit:'m'},{label:'Δϕ B/A incident',value:a.fmt.sig(w/Math.PI,3),unit:'π rad'})}
      else mets.push({label:'Retard d\'une impulsion',value:'pas de retard unique'});
    }
    a.metrics(mets);
  }
});

</script>
