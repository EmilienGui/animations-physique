.ak.is-proj .ak-drawer-head{display:flex}
.ak.is-proj .ak-btn-settings{display:inline-flex}

@media (max-width:640px){.ak{height:auto;min-height:100vh;min-height:100dvh;overflow:visible}}
@media (max-width:640px){

<script>
/* =====================================================================
   AnimKit · script commun des animations (version test UI)
   ===================================================================== */
(function(){
'use strict';
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const MATH='"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif';
const MINUS='−';
const THEME_KEY='cpge-anim-theme';
const METRICS_KEY='cpge-anim-metrics-open';

/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e<-3||e>=6){const m=x/10**e;return (+m.toFixed(n-1)).toFixed(n-1).replace('-',MINUS)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>'}
    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}
function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- icônes ---------------- */
const IC={
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
  sommaire:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h0"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>',
  image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>',
  proj:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M12 16v4M8 20h8"/></svg>',
  fs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  cadrer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>',
  step:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5l9 7-9 7zM16 5h2.5v14H16z"/></svg>',
  reset:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>'
};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function el(tag,attrs={},html){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs))if(v!==undefined&&v!==null&&v!==false)e.setAttribute(k,v===true?'':v);if(html!==undefined)e.innerHTML=html;return e}
function readStore(k,def){try{const v=localStorage.getItem(k);return v===null?def:v}catch{return def}}
function writeStore(k,v){try{localStorage.setItem(k,v)}catch{}}

function interrupteur(label,id){
  const conteneur=el('label',{class:'ak-chk'});
  conteneur.append(
    el('input',{type:'checkbox',role:'switch',id}),
    el('span',{class:'ak-switch-track','aria-hidden':'true'}),
    el('span',{},label)
  );
  return conteneur;
}

/* ---------------- mathématiques en HTML ---------------- */
const M={
  v:(s,sub,sup)=>`<span class="m">${s}</span>${sub!==undefined?`<sub>${sub}</sub>`:''}${sup!==undefined?`<sup>${sup}</sup>`:''}`,
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,

  vec:s=>`<span class="vec">${s}</span>`

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}
      return s;
    },
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;

    const html=L.map((m,i)=>`<div class="ak-metric${m.warn?' warn':''}${expandedMetrics.has(String(i))?' is-expanded':''}" data-idx="${i}" title="Cliquer pour développer / réduire"><div class="k">${m.label}</div><div class="v">${m.value}${m.unit?(m.unit==='°'?'°':`<span class="u">${m.unit}</span>`):''}</div>${m.hint?`<div class="h">${m.hint}</div>`:''}</div>`).join('');
    if(metrics._h!==html){metrics.innerHTML=html;metrics._h=html}
  };
  A.insight=()=>{};
  A.legend=arr=>{const html=(arr||[]).filter(Boolean).map(l=>`<span><i class="${l.dash?'dash':l.dot?'dot':''}" style="background:${l.c};--lc:${l.c}"></i>${l.label}</span>`).join('');if(legend._h!==html){legend.innerHTML=html;legend._h=html}};
  A.clock=html=>{const c=$('.ak-clock',tr);if(c._h!==html){c.innerHTML=html;c._h=html}};
  A.toast=m=>{toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastEl._h);toastEl._h=setTimeout(()=>toastEl.classList.remove('show'),1800)};
  A.panelVisible=id=>!A.panels[id].el.hidden;

  /* ---------- tailles ---------- */
  function viewBox(P){
    const {w,h,vx,vy,vz}=P;
    P.node.setAttribute('viewBox',P.vue==='svg'?`${vx.toFixed(2)} ${vy.toFixed(2)} ${(w/vz).toFixed(2)} ${(h/vz).toFixed(2)}`:`0 0 ${w.toFixed(1)} ${h.toFixed(1)}`);
  }
  function measure(){
    A.narrow=ak.clientWidth<=640; ak.style.setProperty('--ak-top',(top.offsetHeight+(tabs?tabs.offsetHeight:0))+'px');
    if(A.narrow){if(metricsWrap.parentNode!==right||right.lastElementChild!==metricsWrap)right.append(metricsWrap)}
    else{if(metricsWrap.parentNode!==right||right.firstElementChild!==metricsWrap)right.insertBefore(metricsWrap,side)}
    A.k=ak.classList.contains('is-proj')?1.6:A.narrow?1:1.15;
    for(const P of Object.values(A.panels)){
      if(P.el.hidden)continue;
      if(A.narrow){const w=P.el.clientWidth||ak.clientWidth;P.node.style.height=Math.round(w*(P.cfg.ratioTel??.8))+'px'}else P.node.style.height='';
      const r=P.node.getBoundingClientRect(); P.w=Math.max(50,r.width); P.h=Math.max(50,r.height);
      if(P.type==='canvas'){const d=window.devicePixelRatio||1;if(P.node.width!==Math.round(P.w*d)||P.node.height!==Math.round(P.h*d)){P.node.width=Math.round(P.w*d);P.node.height=Math.round(P.h*d)}P.ctx=P.node.getContext('2d');P.ctx.setTransform(d,0,0,d,0,0)}
      else viewBox(P);
    }
  }
  /* ---------- rendu ---------- */
  let graphPanels=[];
  const activeChartView=P=>P?.vue==='graphe'&&zoomed(P)?P:null;
  function drawFrame(){
    const frame={graphs:[],views:graphPanels.map(activeChartView),outputs:new Map()};
    A._graphFrame=frame;
    try{cfg.draw?.(A)}finally{A._graphFrame=null}
    graphPanels=[];
    for(const [P,output] of frame.outputs){
      const graphs=[...output.html.matchAll(/<g data-ak-graph="(\d+)">/g)].map(m=>frame.graphs[+m[1]]).filter(Boolean);
      output.graphs=graphs;
      if(P.vue==='svg'||P.vue==='graphe'){
        const vue=graphs.length?'graphe':'svg';
        if(vue!==P.vue){P.vue=vue;resetView(P);viewBox(P)}
        P.graphs=graphs;
      }
      const view=activeChartView(P);
      for(const graph of graphs){
        graphPanels[graph.id]=P;
        if(graph.view!==view)frame.changed=true;
      }
    }
    return frame;
  }
  function clipCharts(node,graphs){
    const svgElement=tag=>document.createElementNS(node.namespaceURI,tag);
    for(const graph of graphs){
      const axes=node.querySelector(`[data-ak-graph="${graph.id}"]`);
      if(!axes)continue;
      const id='ak-cadre-'+graph.id, defs=svgElement('defs'),clip=svgElement('clipPath'),rect=svgElement('rect');
      clip.id=id;
      for(const [k,v] of Object.entries({x:graph.x0,y:graph.y0,width:graph.w,height:graph.h}))rect.setAttribute(k,v);
      clip.append(rect);defs.append(clip);axes.append(defs);
      let layer=null;
      for(let next=axes.nextElementSibling;next&&!next.hasAttribute('data-ak-graph');){
        const child=next;next=child.nextElementSibling;
        if(child.localName==='defs'||child.hasAttribute('data-ak-hors-graphe')){layer=null;continue}
        if(!layer){
          layer=svgElement('g');
          layer.setAttribute('clip-path',`url(#${id})`);
          child.before(layer);
        }
        layer.append(child);
      }
    }
  }
  function writeSvg(P,html,graphs=[]){
    if(P.node._h===html)return;
    P.node.innerHTML=html;
    P.node._h=html;
    if(activeChartView(P))clipCharts(P.node,graphs);
  }
  A.renderNow=()=>{
    A._dirty=false;measure();
    let frame=drawFrame();
    if(frame.changed)frame=drawFrame();
    for(const [P,output] of frame.outputs)writeSvg(P,output.html,output.graphs);
    syncScrub();guardScroll();
  };
  A.render=()=>{if(A._dirty)return;A._dirty=true;requestAnimationFrame(()=>{if(A._dirty)A.renderNow()})};
  A.svg=(id,html)=>{
    const P=A.panels[id];if(!P)return;
    if(A._graphFrame)A._graphFrame.outputs.set(P,{html});
    else writeSvg(P,html);
  };

  /* ---------- temps ---------- */
  let last=0;
  const playBtn=$('.ak-play',tr);
  A.play=on=>{on=on===undefined?!A.running:on;if(on&&cfg.peutLire&&!cfg.peutLire(A))on=false;A.running=on;playBtn.textContent=on?'❚❚ Pause':'▶ Lecture';if(on){last=performance.now();requestAnimationFrame(loop)}};
  function loop(now){if(!A.running)return;const dt=Math.min(.05,(now-last)/1000)*A.speed;last=now;if(cfg.step)cfg.step(A,dt);A.renderNow();requestAnimationFrame(loop)}
  A.stepOnce=()=>{A.play(false);if(cfg.step)cfg.step(A,cfg.pas??1/24);A.render()};
  A.reset=()=>{A.play(false);A.t=0;if(cfg.reset)cfg.reset(A);A.render()};
  $('.ak-speed',tr).onchange=e=>{A.speed=+e.target.value};A.speed=cfg.vitesse||1;

  /* ---------- onglets ---------- */
  A.setTab=i=>{if(!tabs||i<0||i>=cfg.onglets.length)return;A.play(false);A.tab=i;A.cadrerTout();clearActivePresets();$$('.ak-tab',tabs).forEach((b,j)=>b.setAttribute('aria-selected',String(j===i)));if(cfg.onglet)cfg.onglet(A,i);refreshSettings();A.render()};

  /* ---------- thème, projection, plein écran ---------- */
  A.setTheme=t=>{root.dataset.theme=t;writeStore(THEME_KEY,t);readColors();syncMenu();A.renderNow()};
  A.setProj=on=>{
    ak.classList.toggle('is-proj',on);
    ak.classList.remove('drawer-open');
    projButton.classList.toggle('on',on);
    syncMenu();
    A.render();
  };
  const acts={
    play:()=>A.play(),step:()=>A.stepOnce(),reset:()=>A.reset(),
    help:()=>{dlg.showModal()},theme:()=>A.setTheme(root.dataset.theme==='dark'?'light':'dark'),
    image:()=>A.exportImage(),proj:()=>{
      const projected=ak.classList.contains('is-proj');
      A.setProj(!projected);
      if(cfg.menuCommun&&projected&&A.narrow)ak.classList.add('drawer-open');
    },
    fs:()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>A.toast('Plein écran refusé par le navigateur'))},
    settings:()=>{ak.classList.toggle('drawer-open');A.render()}
  };
  ak.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&acts[b.dataset.act])acts[b.dataset.act]()});
  addEventListener('keydown',e=>{
    if(dlg.open||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.target.matches('input,select,textarea'))return;
    const k=e.key.toLowerCase(), custom=cfg.touches&&cfg.touches[k];
    if(custom){e.preventDefault();custom(A);A.render();return}
    if(k===' '&&!tr.hidden){e.preventDefault();acts.play()}
    else if(k==='arrowright'&&!tr.hidden){e.preventDefault();acts.step()}
    else if(k==='r'&&!tr.hidden)acts.reset();
    else if(k==='h'||k==='?')acts.help();else if(k==='p')acts.proj();else if(k==='f')acts.fs();else if(k==='t')acts.theme();else if(k==='i')acts.image();
    else if(k==='+'||k==='='||k==='-'||k==='0'){const P=(A._hover&&!A._hover.el.hidden&&A._hover.vue)?A._hover:Object.values(A.panels).find(q=>q.vue&&!q.el.hidden);if(P){e.preventDefault();if(k==='0')A.cadrer(P);else A.zoomer(P,k==='-'?.8:1.25)}}
    else if(k==='escape'){ak.classList.remove('drawer-open');A.render()}
    else if(/^[1-9]$/.test(k))A.setTab(+k-1);
  });

  /* ---------- vue : zoom, cadrage, déplacement ---------- */
  const deplacable=P=>P.vue==='svg'||P.vue==='graphe';
  function zoomed(P){
    if(P.vue==='interne')return Math.abs(P.zoom-1)>1e-6;
    if(!deplacable(P))return false;
    const seuil=P.vue==='graphe'?1e-6:.5;
    return Math.abs(P.vz-1)>1e-6||Math.abs(P.vx)>seuil||Math.abs(P.vy)>seuil;
  }
  const markZoom=P=>{if(P.tools)P.tools.classList.toggle('is-zoomed',zoomed(P))};
  const graphAt=(P,x,y)=>P.graphs.find(g=>x>=g.x0&&x<=g.x0+g.w&&y>=g.y0&&y<=g.y0+g.h);
  function resetView(P){P.vz=1;P.vx=P.vy=0;P.zoom=1;P.panX=P.panY=0;markZoom(P)}
  A.zoomer=(P,f,px,py)=>{if(typeof P==='string')P=A.panels[P];if(!P||!P.vue)return;
    if(P.vue==='interne')P.zoom=Math.max(.4,Math.min(5,P.zoom*f));
    else{
      if(P.vue==='graphe'){
        const graph=graphAt(P,px,py);
        px=graph?(px-graph.x0)/graph.w:.5;
        py=graph?(py-graph.y0)/graph.h:.5;
      }else{px=px??P.w/2;py=py??P.h/2}
      const z=Math.max(.5,Math.min(8,P.vz*f)), delta=1/P.vz-1/z;
      P.vx+=px*delta;P.vy+=py*delta;P.vz=z;
    }
    markZoom(P);A.render()};
  A.deplacer=(P,dx,dy,px,py)=>{
    if(!deplacable(P))return;
    if(P.vue==='graphe'){const g=graphAt(P,px,py)||P.graphs[0];dx/=g.w;dy/=g.h}
    P.vx-=dx/P.vz;P.vy-=dy/P.vz;markZoom(P);A.render()
  };
  A.cadrer=P=>{if(typeof P==='string')P=A.panels[P];if(!P)return;resetView(P);A.render()};
  A.cadrerTout=()=>{for(const P of Object.values(A.panels))A.cadrer(P)};

  function wire(P){const N=P.node,pts=new Map();let mode=null,h=null,last=null,pin=null;
    const scr=e=>{const r=N.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    const toV=s=>P.vue==='svg'?[P.vx+s[0]/P.vz,P.vy+s[1]/P.vz]:s;
    const two=()=>{const[a,b]=[...pts.values()];return{d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,c:[(a[0]+b[0])/2,(a[1]+b[1])/2]}};
    N.addEventListener('pointerdown',e=>{
      const s=scr(e);A._hover=P;pts.set(e.pointerId,s);
      if(pts.size===2&&P.vue){if(mode==='drag'&&h&&h.end)h.end(e);mode='pinch';h=null;pin=two();N.setPointerCapture(e.pointerId);e.preventDefault();return}
      if(pts.size>1)return;
      const[x,y]=toV(s);
      if(deplacable(P)&&(e.shiftKey||e.button===1))mode='pan';
      else{h=P._drags.find(d=>!d.hit||d.hit(x,y,e))||null;
        if(h){mode='drag';if(h.start)h.start(x,y,e)}
        else if(deplacable(P)&&zoomed(P))mode='pan';
        else{mode=null;return}}
      last=s;N.setPointerCapture(e.pointerId);e.preventDefault();A.render()});
    N.addEventListener('pointermove',e=>{const s=scr(e);
      if(!pts.has(e.pointerId)){if(e.pointerType==='mouse'){const[x,y]=toV(s);N.style.cursor=P._drags.some(d=>d.hit&&d.hit(x,y,e))?'grab':(deplacable(P)&&(e.shiftKey||zoomed(P)))?'move':''}return}
      pts.set(e.pointerId,s);
      if(mode==='pinch'&&pts.size>=2){const q=two();A.zoomer(P,q.d/pin.d,q.c[0],q.c[1]);A.deplacer(P,q.c[0]-pin.c[0],q.c[1]-pin.c[1],q.c[0],q.c[1]);pin=q;return}
      if(mode==='pan'){A.deplacer(P,s[0]-last[0],s[1]-last[1],last[0],last[1]);last=s;return}
      if(mode==='drag'&&h){const[x,y]=toV(s);h.move(x,y,e);A.render()}});
    const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
      if(mode==='drag'&&h&&h.end)h.end(e);
      if(pts.size===0){mode=null;h=null}else if(mode==='pinch'){mode='pan';last=[...pts.values()][0]}
      A.render()};
    N.addEventListener('pointerup',end);N.addEventListener('pointercancel',end);
    if(P.vue){
      N.addEventListener('wheel',e=>{if(A.narrow&&!e.ctrlKey)return;e.preventDefault();const s=scr(e);A.zoomer(P,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),s[0],s[1])},{passive:false});
      N.addEventListener('dblclick',e=>{const[x,y]=toV(scr(e));if(!P._drags.some(d=>d.hit&&d.hit(x,y,e))&&zoomed(P))A.cadrer(P)});
      N.addEventListener('pointerenter',()=>{A._hover=P});
    }
  }
  for(const P of Object.values(A.panels))wire(P);
  A.drag=(id,h)=>{A.panels[id]._drags.push(h)};

  /* ---------- export image (toujours en thème clair) ---------- */
  A.exportImage=async()=>{
    const was=root.dataset.theme; root.dataset.theme='light'; readColors(); A.renderNow();
    const vis=Object.values(A.panels).filter(P=>!P.el.hidden), base=pwrap.getBoundingClientRect(), sc=2;
    const cv=document.createElement('canvas'); cv.width=Math.round(base.width*sc); cv.height=Math.round(base.height*sc);
    const ctx=cv.getContext('2d'); ctx.fillStyle=A.C.card; ctx.fillRect(0,0,cv.width,cv.height);
    const jobs=vis.map(P=>new Promise(res=>{const r=P.node.getBoundingClientRect(), x=(r.left-base.left)*sc, y=(r.top-base.top)*sc;
      if(P.type==='canvas'){ctx.drawImage(P.node,x,y,r.width*sc,r.height*sc);res();return}
      const clone=P.node.cloneNode(true); clone.setAttribute('width',r.width); clone.setAttribute('height',r.height);
      const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
      const im=new Image(); im.onload=()=>{ctx.drawImage(im,x,y,r.width*sc,r.height*sc);res()}; im.onerror=()=>res(); im.src=src;}));
    await Promise.all(jobs);
    root.dataset.theme=was; readColors(); A.renderNow();
    const a=document.createElement('a'); const tabName=cfg.onglets&&cfg.onglets.length>1?'_'+(A.tab+1):'';
    a.download=`${cfg.code}_${(cfg.fichier||cfg.titre).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_')}${tabName}.png`;
    a.href=cv.toDataURL('image/png'); a.click(); A.toast('Image enregistrée (thème clair)');
  };

  /* ---------- aide ---------- */
  function buildHelp(){
    const h=cfg.aide||{}, sec=(t,c)=>c?`<h4>${t}</h4>${/^\s*</.test(c)?c:`<p>${c}</p>`}`:'';
    dlg.innerHTML=`<header><h3>Aide · ${cfg.titre}</h3><button class="mini" data-close>Fermer ✕</button></header><div class="db">
    ${cfg.sousTitre?`<p class="ak-dlg-sub">${cfg.sousTitre}</p>`:''}${sec('Ce qu\'on voit',h.voit)}${sec('Ce qu\'on peut faire',h.faire)}${sec('Modèle et hypothèses',h.modele)}${sec('Lien avec le cours',h.cours)}${sec('Pour aller plus loin',h.plus)}
    <h4>Raccourcis</h4><p>${cfg.temps?'<kbd>Espace</kbd> lecture / pause · <kbd>→</kbd> pas à pas · <kbd>R</kbd> recommencer · ':''}${tabs?`<kbd>1</kbd>–<kbd>${cfg.onglets.length}</kbd> onglets · `:''}<kbd>P</kbd> projection · <kbd>F</kbd> plein écran · <kbd>T</kbd> thème · <kbd>I</kbd> image · <kbd>H</kbd> aide${h.touches?' · '+h.touches:''}</p>
    <p>Vue : molette, pincement ou <kbd>+</kbd> <kbd>−</kbd> pour zoomer · <kbd>Maj</kbd> + glisser, deux doigts, ou glisser une vue zoomée pour la déplacer · « Cadrer », <kbd>0</kbd> ou double clic : vue initiale · Double-clic sur un curseur : valeur par défaut.</p>
    ${h.credits?`<h4>Crédits</h4><p>${h.credits}</p>`:''}</div>`;
    dlg.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===dlg)dlg.close()});
  }

  /* ---------- démarrage ---------- */
  buildSettings(); buildHelp(); readColors();
  if(cfg.init)cfg.init(A);
  refreshSettings(); A.reset();
  new ResizeObserver(()=>A.render()).observe(ak);
  return A;
}

window.AnimKit={app,fmt,M,ticks,niceStep,FONT,MATH,interrupteur};
})();

<script>
'use strict';
/* =====================================================================
   TH3 MP · A3 « Gel des degrés de liberté » : physique
   Notations du cours (III.3 et III.4) : Θ_rot = ħ²/(2 J k_B), Θ_vib = ħω/k_B, Θ_E = ħω/k_B.
   Gaz diatomique parfait : C_Vm / R = 3/2 + C_rot / R + C_vib / R.
     · rotation : rotateur rigide quantique, niveaux E_ℓ = ℓ(ℓ+1) k_B Θ_rot, dégénérescence 2ℓ+1
       (spin nucléaire ignoré), C_rot / R = variance de E / (k_B T) ;
     · vibration : oscillateur harmonique, C_vib,m = R (Θ_vib/T)² e^{Θ_vib/T} / (e^{Θ_vib/T} − 1)².
   Solide d'Einstein : C_m = 3R (Θ_E/T)² e^{Θ_E/T} / (e^{Θ_E/T} − 1)² par mole d'atomes.
   Les Θ sont calculés comme en phase 1B depuis les constantes spectroscopiques (B et ω_e, en cm⁻¹).
   ===================================================================== */
const TH3Gel = (() => {
  const kB = 1.380649e-23, NA = 6.02214076e23, R = kB * NA;
  const hcK = 1.438776877;                       // hc / k_B en cm·K

  /* Gaz : B, ω_e (cm⁻¹, constantes spectroscopiques), température d'ébullition sous 1 bar (K),
     C_Vm mesurée à 298 K (J·K⁻¹·mol⁻¹, tableau du cours) */
  const GAZ = {
    H2: {nom: 'H₂', B: 60.853, we: 4401.2, Teb: 20.3, mes: 20.5},
    N2: {nom: 'N₂', B: 1.99824, we: 2358.57, Teb: 77.4, mes: 20.8},
    Cl2: {nom: 'Cl₂', B: 0.2440, we: 559.7, Teb: 239.1, mes: 25.6}
  };
  for (const g of Object.values(GAZ)) {g.thRot = g.B * hcK; g.thVib = g.we * hcK;}

  /* Solides : température d'Einstein (K) et C_m mesurée à 298 K (J·K⁻¹·mol⁻¹, cours) */
  const SOL = {
    Cu: {nom: 'cuivre', thE: 240, mes: 24.4},
    C: {nom: 'diamant', thE: 1310, mes: 6.11}
  };

  /** rotation : {c = C_rot/R, u = ⟨E_rot⟩/(k_B T)} */
  function rot(T, th) {
    const x = th / T, lmax = Math.min(6000, Math.ceil(Math.sqrt(60 / x)) + 2);
    let Z = 0, S1 = 0, S2 = 0;
    for (let l = 0; l <= lmax; l++) {
      const e = l * (l + 1) * x, w = (2 * l + 1) * Math.exp(-e);
      Z += w; S1 += w * e; S2 += w * e * e;
    }
    const m1 = S1 / Z, m2 = S2 / Z;
    return {c: Math.max(0, m2 - m1 * m1), u: m1};
  }
  /** vibration (ou oscillateur d'Einstein) : {c = C/R, u = énergie thermique ⟨E⟩ − ħω/2 en k_B T} */
  function vib(T, th) {
    const x = th / T;
    if (x > 700) return {c: 0, u: 0};
    const em = Math.expm1(-x);
    return {c: x * x * Math.exp(-x) / (em * em), u: x / Math.expm1(x)};
  }
  /** gaz diatomique : contributions de la translation, de la rotation et de la vibration à C_Vm / R */
  function gaz(T, thRot, thVib) {
    const r = rot(T, thRot), v = vib(T, thVib);
    return {tr: 1.5, rot: r.c, vib: v.c, tot: 1.5 + r.c + v.c, uRot: r.u, uVib: v.u};
  }
  /** solide d'Einstein : C_m / (3R) et énergie thermique molaire U_m(T) − U_m(0) (J·mol⁻¹) */
  const solC = (T, th) => vib(T, th).c;
  const solU = (T, th) => th / T > 700 ? 0 : 3 * R * th / Math.expm1(th / T);

  /** niveaux de rotation visibles jusqu'à E / k_B T = emax : e = E_ℓ / k_B T, p = probabilité d'occupation de chaque niveau */
  function niveauxRot(T, th, emax) {
    const x = th / T, lmax = Math.min(6000, Math.ceil(Math.sqrt(60 / x)) + 2);
    let Z = 0;
    for (let l = 0; l <= lmax; l++) Z += (2 * l + 1) * Math.exp(-l * (l + 1) * x);
    const out = {l: [], e: [], p: [], e1: 2 * x, Z};
    for (let l = 0; l <= lmax; l++) {

    const G1 = S.graph(gOpts(a, Z.g[0], {xmin: xr[0], xmax: xr[1], ymin: 0, ymax: 1.1, xticks: xt, xfmt: xf, yticks: [0, .25, .5, .75, 1], yfmt: fx1, xlab: S.v('T') + ' (K)', ylab: S.v('C', 'm') + ' / (3' + S.v('R') + ')'}));
    const fC = t => G.solC(t, s.th);
    let g1 = '';
    if (p.reperes) {
      g1 += S.line(G1.x0, G1.Y(1), G1.x0 + G1.w, G1.Y(1), {c: C.ink2, w: 1.2, dash: '6 5'}) + lab(a, G1.x0 + 8 * k, G1.Y(1) + 12 * k, 'Dulong et Petit', {c: C.ink});
      const lt = Math.log10(s.th);
      if (!lg || (lt >= xr[0] && lt <= xr[1])) if (s.th <= SOLMAX) g1 += S.line(G1.X(xv(s.th)), G1.y0, G1.X(xv(s.th)), G1.y0 + G1.h, {c: C.ink2, w: 1.3, dash: '2 5'}) + lab(a, G1.X(xv(s.th)) + 5 * k, G1.y0 + G1.h - 14 * k, S.v('Θ', 'E'), {c: C.ink});
      if (s.mes) {const X = G1.X(xv(298)), Y = G1.Y(s.mes / (3 * G.R)); g1 += S.poly([[X, Y - 7 * k], [X + 7 * k, Y], [X, Y + 7 * k], [X - 7 * k, Y]], {close: true, c: C.ink, w: 2, fill: C.card});}
    }
    if (p.entiere) g1 += S.curve(full(fC), G1, {c: C.ink2, w: 2, dash: '2 6'});
    g1 += S.curve(upTo(samples(fC), fC), G1, {c: C.ink, w: 3});
    out += G1.svg + clipped(S, G1, 'th3a3-g1', g1);
    const G2 = S.graph(gOpts(a, Z.g[1], {xmin: xr[0], xmax: xr[1], ymin: 0, ymax: 40, xticks: xt, xfmt: xf, yticks: [0, 10, 20, 30, 40], yfmt: fx1, xlab: S.v('T') + ' (K)', ylab: S.v('U', 'm') + '(T) − ' + S.v('U', 'm') + '(0) (kJ·mol' + S.sup('−1') + ')'}));
    const fU = t => G.solU(t, s.th) / 1000, U = fU(T);
    let g2 = '';
    if (p.reperes) {
      g2 += S.curve(full(t => 3 * G.R * t / 1000), G2, {c: C.ink2, w: 1.5, dash: '6 5'}) + lab(a, G2.X(xv(lg ? 12 : 40)), G2.Y(lg ? 5 : 31), '3' + S.v('R') + S.v('T'), {c: C.ink});
      const tan = [], t0 = lg ? Math.max(SOLMIN, T / 2.2) : Math.max(SOLMIN, T - 260), t1 = lg ? Math.min(SOLMAX, T * 2.2) : Math.min(SOLMAX, T + 260);
      for (let i = 0; i <= 16; i++) {const t = t0 + (t1 - t0) * i / 16, y = U + c3 * 3 * G.R / 1000 * (t - T); tan.push([xv(t), y]);}
      g2 += S.curve(tan, G2, {c: C.F, w: 3});
    }
    if (p.entiere) g2 += S.curve(full(fU), G2, {c: C.ink2, w: 2, dash: '2 6'});
    g2 += S.curve(upTo(samples(fU), fU), G2, {c: C.ink, w: 3});
    out += G2.svg + clipped(S, G2, 'th3a3-g2', g2);
    for (const [Gx, y] of [[G1, c3], [G2, U]]) {
      out += S.line(Gx.X(xv(T)), Gx.y0, Gx.X(xv(T)), Gx.y0 + Gx.h, {c: C.B, w: 1.8, dash: '7 5'}) + S.circle(Gx.X(xv(T)), Gx.Y(y), 6.5 * k, {fill: C.ink, c: C.card, w: 1.6});
    }
    out += S.circle(G1.X(xv(T)), G1.y0 + 12 * k, 7 * k, {fill: C.B, c: C.card, w: 1.6});
    frame = {tab: 1, Gs: [G1, G2], xv};
    a.svg('scene', out);
    a.clock('T = ' + fmt.sig(T, 3) + ' K');
    a.legend([{c: C.ink, label: 'C<sub>m</sub> et énergie thermique, modèle d’Einstein quantique'}, p.reperes ? {c: C.F, label: 'tangente : pente C<sub>m</sub>'} : null, p.reperes && s.mes ? {c: C.ink, dot: true, label: 'mesure à 298 K (cours)'} : null,
      {c: C.B, label: 'segment bleu : 1 k<sub>B</sub>T sur l’échelle d’énergie'}]);
    a.metrics([
      {label: 'C<sub>m</sub>', value: fmt.sig(3 * G.R * c3, 3), unit: 'J·K⁻¹·mol⁻¹', hint: 'C<sub>m</sub>/(3R) = ' + fmt.fix(c3, 3)},
      {label: 'Θ<sub>E</sub> / T', value: fmt.sig(s.th / T, 3), hint: 'petit devant 1 : Dulong et Petit ; grand devant 1 : gelé'}
    ]);
  }

  /* ---------- application ---------- */
  const setSweep = (a, id, v) => a.set(id, v, {silent: true});
  AnimKit.app({
    code: 'TH3', partie: 'OrangeBrule', titre: 'Gel des degrés de liberté',
    titreFenetre: 'Gel des degrés de liberté · TH3 · MP',
    menuCommun: true, fichier: 'Gel_Degres_Liberte',
    onglets: ['Gaz diatomique', 'Solide'],
    panneaux: [{id: 'scene', titre: '', poids: 1, ratioTel: 1.9}],
    temps: true, pas: 1 / 30, vitesses: [.25, .5, 1, 2, 4], vitesse: 1,
    step(a, dt) {
      ph.t += dt;
      if (a.tab === 0) {
        const g = gazOf(a), st = G.gaz(a.p.T1, g.thr, g.thv);
        ph.rot += dt * 5.5 * Math.sqrt(st.uRot);
        ph.vib += dt * 11;
        if (a.p.balayage) {
          const lt = Math.min(LT_MAX, Math.log10(a.p.T1) + .25 * dt);
          setSweep(a, 'T1', 10 ** lt);
          if (lt >= LT_MAX - 1e-9) a.play(false);
        }
      } else {
        ph.net += dt;
        if (a.p.balayage) {
          const t = a.p.logT ? Math.min(SOLMAX, a.p.T2 * 10 ** (.2 * dt)) : Math.min(SOLMAX, a.p.T2 + SOLMAX / 14 * dt);
          setSweep(a, 'T2', t);
          if (t >= SOLMAX - 1e-9) a.play(false);
        }
      }
    },
    reset(a) {
      ph.t = 0;
      if (a.p.T1 !== undefined && a.p.T1 >= 1e4 - 1e-6) a.set('T1', 1, {silent: true});
      if (a.p.T2 !== undefined && a.p.T2 >= SOLMAX - 1e-6) a.set('T2', SOLMIN, {silent: true});
    },
    reglages: [
      {titre: 'Situations', onglets: [0], presets: [
        {label: 'H₂ : chauffer depuis 1 K', valeurs: {gaz: 'H2', T1: 1, balayage: true}, lecture: true},
        {label: 'N₂ : chauffer depuis 1 K', valeurs: {gaz: 'N2', T1: 1, balayage: true}, lecture: true},
        {label: 'Cl₂ : chauffer depuis 1 K', valeurs: {gaz: 'Cl2', T1: 1, balayage: true}, lecture: true},
        {label: 'Température ambiante, 300 K', valeurs: {T1: 300}}
      ]},
      {titre: 'Situations', onglets: [1], presets: [
        {label: 'Cuivre : chauffer depuis 5 K', valeurs: {sol: 'Cu', T2: 5, balayage: true}, lecture: true},
        {label: 'Diamant : chauffer depuis 5 K', valeurs: {sol: 'C', T2: 5, balayage: true}, lecture: true},
        {label: 'Température ambiante, 298 K', valeurs: {T2: 298}}
      ]},
      {titre: 'Gaz diatomique', onglets: [0], items: [
        {id: 'gaz', type: 'seg', label: 'Gaz', options: [['H2', 'H<sub>2</sub>'], ['N2', 'N<sub>2</sub>'], ['Cl2', 'Cl<sub>2</sub>'], ['libre', 'Libre']], value: 'H2'},
        {id: 'T1', type: 'range', label: 'Température T', min: 1, max: 10000, step: 'any', log: true, dec: 0, value: 300, unit: 'K'},
        {id: 'thrL', type: 'range', label: 'Θ<sub>rot</sub> du gaz libre', min: .1, max: 1000, step: 'any', log: true, dec: 2, value: 30, unit: 'K', si: a => a.p.gaz === 'libre'},
        {id: 'thvL', type: 'range', label: 'Θ<sub>vib</sub> du gaz libre', min: 100, max: 20000, step: 'any', log: true, dec: 0, value: 3000, unit: 'K', si: a => a.p.gaz === 'libre'},
        {type: 'note', html: a => {
          if (a.p.gaz === 'libre') return 'Gaz libre : seul le rapport T/Θ compte. Θ<sub>rot</sub> et Θ<sub>vib</sub> se règlent séparément.';
          const g = G.GAZ[a.p.gaz];
          return g.nom + ' : B = ' + g.B + ' cm<sup>−1</sup>, ω<sub>e</sub> = ' + g.we + ' cm<sup>−1</sup>, d’où Θ<sub>rot</sub> = ' + (+g.thRot.toPrecision(3)) + ' K et Θ<sub>vib</sub> = ' + Math.round(g.thVib) + ' K. Ébullition sous 1 bar à ' + g.Teb + ' K.';
        }}
      ]},
      {titre: 'Solide', onglets: [1], items: [
        {id: 'sol', type: 'seg', label: 'Solide', options: [['Cu', 'Cuivre'], ['C', 'Diamant'], ['libre', 'Libre']], value: 'Cu'},
        {id: 'T2', type: 'range', label: 'Température T', min: SOLMIN, max: SOLMAX, step: 'any', dec: 0, value: 298, unit: 'K'},
        {id: 'thEL', type: 'range', label: 'Θ<sub>E</sub> du solide libre', min: 50, max: 3000, step: 'any', log: true, dec: 0, value: 500, unit: 'K', si: a => a.p.sol === 'libre'},
        {id: 'logT', type: 'check', label: 'Température en échelle logarithmique', value: false},
        {type: 'note', html: a => a.p.sol === 'libre' ? 'Solide libre : seul le rapport T/Θ<sub>E</sub> compte.' : 'Θ<sub>E</sub> = ' + G.SOL[a.p.sol].thE + ' K (valeur du cours et du TD).'}
      ]},
      {titre: 'Lecture', items: [
        {id: 'balayage', type: 'check', label: 'La lecture chauffe le système', value: true},
        {type: 'note', html: 'Lecture : T augmente à partir de la valeur réglée. Sans cette case, la lecture anime seulement l’agitation.'}
      ]},
      {titre: 'Affichage', items: [
        {id: 'reperes', type: 'check', label: 'Afficher les repères (Θ, paliers, mesures, tangente)', value: false},
        {id: 'entiere', type: 'check', label: 'Afficher la courbe entière', value: false}
      ]}
    ],
    aide: {
      voit: '<ul><li><b>Gaz diatomique.</b> Un gaz parfait diatomique est chauffé de 1 K à 10<sup>4</sup> K. À gauche, la molécule dans sa boîte (translation toujours active), les trois contributions à C<sub>Vm</sub>/R et les échelles de niveaux de rotation et de vibration, tracées en unités de k<sub>B</sub>T : le segment bleu de l’axe vaut 1 k<sub>B</sub>T. Quand l’écart entre niveaux est grand devant k<sub>B</sub>T, presque toute la population reste dans le fondamental : le mouvement est gelé. À droite, C<sub>Vm</sub>/R se construit par bandes (translation, rotation, vibration) jusqu’à la température réglée.</li><li><b>Solide.</b> Modèle d’Einstein quantique : les atomes d’une mole d’atomes vibrent indépendamment autour de leur site, comme 3𝒩<sub>A</sub> oscillateurs de même pulsation. L’échelle de niveaux est celle d’un oscillateur ; C<sub>m</sub>/(3R) est tracée en fonction de T, et l’énergie thermique U<sub>m</sub>(T) − U<sub>m</sub>(0) en dessous : la pente de U<sub>m</sub> est C<sub>m</sub>.</li></ul>',
      faire: '<p>Gaz : choisir « H₂ : chauffer depuis 1 K » et lancer la lecture. Repérer à quelle température la rotation s’éveille (Θ<sub>rot</sub>/T de l’ordre de 1, premier niveau excité à quelques k<sub>B</sub>T) puis où se trouverait la vibration. Avant de cocher les repères, prévoir les températures des paliers. Comparer N₂ (rotation active dès quelques kelvins, mais le gaz est liquide sous 77 K) et Cl₂ (Θ<sub>vib</sub> = 805 K : à 300 K, C<sub>Vm</sub> = 25.5 J·K<sup>−1</sup>·mol<sup>−1</sup>, entre 5/2 R et 7/2 R). Avec « Libre », décaler Θ<sub>vib</sub> : le palier se déplace sans changer de forme, seul T/Θ compte.</p><p>Solide : comparer le cuivre (Θ<sub>E</sub> = 240 K) et le diamant (1.31 × 10<sup>3</sup> K) à 298 K : C<sub>m</sub>/(3R) = 0.95 contre 0.24. Cocher « échelle logarithmique » pour voir la chute exponentielle à basse température, et les repères pour la tangente de U<sub>m</sub>(T).</p>',
      modele: '<p>Gaz parfait, molécules rigides ou vibrant harmoniquement, niveaux électroniques fondamentaux, spin nucléaire ignoré. C<sub>Vm</sub>/R = 3/2 + C<sub>rot</sub>/R + C<sub>vib</sub>/R. La rotation est celle d’un rotateur rigide quantique : niveaux ℓ(ℓ+1)k<sub>B</sub>Θ<sub>rot</sub>, dégénérescence 2ℓ+1, C<sub>rot</sub>/R = variance de E/(k<sub>B</sub>T) sur la loi de Boltzmann (elle passe par un maximum de 1.10 vers 0.8 Θ<sub>rot</sub>, d’où la bosse au-dessus de 5/2 pour H₂, comme sur la figure du cours ; le H₂ réel s’en écarte à basse température à cause des spins nucléaires). La vibration est un oscillateur harmonique : C<sub>vib,m</sub> = R (Θ<sub>vib</sub>/T)² e<sup>Θ<sub>vib</sub>/T</sup>/(e<sup>Θ<sub>vib</sub>/T</sup> − 1)². Θ<sub>rot</sub> et Θ<sub>vib</sub> sont calculés depuis les constantes spectroscopiques B et ω<sub>e</sub>. Le gaz n’est pas dissocié et ne se liquéfie pas dans le modèle : la zone grisée indique les températures où le gaz réel serait liquide sous 1 bar. Les populations des échelles sont normalisées au niveau le plus peuplé de chaque échelle.</p><p>Solide : C<sub>m</sub> = 3R (Θ<sub>E</sub>/T)² e<sup>Θ<sub>E</sub>/T</sup>/(e<sup>Θ<sub>E</sub>/T</sup> − 1)², par mole d’atomes ; U<sub>m</sub>(T) − U<sub>m</sub>(0) = 3RΘ<sub>E</sub>/(e<sup>Θ<sub>E</sub>/T</sup> − 1). Aux très basses températures, le solide réel suit une loi en T<sup>3</sup> (modèle de Debye, hors programme). Les amplitudes dessinées sont qualitatives.</p>',
      cours: 'TH3 MP, III.3 « Capacité thermique des gaz parfaits » (gel des degrés de liberté) et III.4 « Capacité thermique des solides » (modèle d’Einstein quantique).'
    },
    init(a) {
      a.drag('scene', {
        hit: (x, y) => {
          if (!frame || frame.tab !== a.tab) return false;
          const Gs = frame.Gs, T = a.tab === 0 ? Math.log10(a.p.T1) : frame.xv(a.p.T2);
          return y >= Gs[0].y0 - 8 && y <= Gs[Gs.length - 1].y0 + Gs[Gs.length - 1].h && Math.abs(x - Gs[0].X(T)) < 18;
        },
        start: () => {},
        move: x => {
          const Gx = frame.Gs[0], v = Gx.xv(x);
          if (a.tab === 0) a.set('T1', 10 ** Math.min(LT_MAX, Math.max(0, v)));
          else a.set('T2', Math.min(SOLMAX, Math.max(SOLMIN, a.p.logT ? 10 ** v : v)));
        }
      });
    },
    draw(a) {
      if (a.tab === 0) draw0(a); else draw1(a);
    }
  });
})();

</script>
</body>
