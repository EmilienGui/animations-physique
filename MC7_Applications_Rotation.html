  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}

    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },

/* ---------- mesures, message, légende ---------- */

  const clk=`${mv('t')} = ${f.fix(a.t,2)} s`;
  if(a.tab===0){
    a.metrics([{label:`Moment d'inertie ${JD}`,value:f.sig(B.J,3),unit:'kg·m²',hint:`seuil de révolution ${f.sig(B.wlim,3)} rad·s<sup>−1</sup>`},
      {label:`Petits angles ${mv('T')}<sub>0</sub>`,value:f.sig(B.T0,3),unit:'s',hint:`2π √(${JD}/${mv('m')}${mv('g')}${mv('d')})`},
      {label:B.rotation?'Durée d\'un tour':`Période mesurée ${mv('T')}`,value:B.Tm?f.sig(B.Tm,3):'—',unit:B.Tm?'s':'',hint:B.Tm&&!B.rotation?`${mv('T')}/${mv('T')}<sub>0</sub> = ${f.fix(B.Tm/B.T0,3)}`:B.rotation?'mouvement révolutif':'équilibre'}]);
    const near=Math.abs(B.E0/B.Emax-1)<.06;
    const conclusion=B.rotation?(near?'À peine plus que 2<i class="m">mgd</i> : le pendule passe le sommet très lentement, puis fait des tours.':'Énergie supérieure à 2<i class="m">mgd</i> : mouvement révolutif.'):near?'À peine moins que 2<i class="m">mgd</i> : le pendule s\'approche du sommet, s\'y attarde puis redescend ; la période devient très longue.':B.Tm&&B.Tm/B.T0>1.02?'La période augmente avec l\'amplitude : elle n\'est égale à '+mv('T')+'<sub>0</sub> qu\'aux petits angles.':'Petites oscillations : période proche de '+mv('T')+'<sub>0</sub>.';
    const bilan=(Ec,Ep,E)=>`${mv('E')}<sub>c</sub> = ${Ec} J, ${mv('E')}<sub>p</sub> = ${Ep} J : énergie mécanique conservée (${E} J). ${conclusion}`;
    // Réserver aussi la notation scientifique des très petites énergies : les
    // valeurs peuvent changer sans ajouter une ligne ni redimensionner la scène.
    const large='10.00 × 10<sup>−12</sup>';
    a.insight(bilan(f.sig(q.Ec,3),f.sig(q.Ep,3),f.sig(q.E,3)),[bilan(large,large,large)]);
    L.push({c:C.cInk,label:'pendule'},{c:C.F,label:'poids (proportionnel à m)'});if(p.harm)L.push({c:C.pred,label:B.rotation?'petits angles : sans objet (révolution)':'approximation des petits angles',dash:true});if(p.gp==='phase'&&p.sep)L.push({c:C.pred,label:'séparatrice',dash:true});
  }else if(a.tab===1){
    a.metrics([{label:'Moment cinétique total ℒ<sub>tot</sub>',value:f.sig(q.L,3),unit:'kg·m²·s<sup>−1</sup>',hint:'conservé'},
      {label:`Énergie cinétique ${mv('E')}<sub>c</sub>`,value:f.sig(q.E,3),unit:'J',hint:`initiale ${f.sig(q.E0,3)} J`},
      {label:`Énergie dissipée ${mv('Q')}`,value:f.sig(q.Q,3),unit:'J',hint:p.wf?`finale ${f.sig(B.Qf,3)} J`:''}]);
    const D=p.w1-p.w2;
    a.insight(Math.abs(D)<1e-9?'Même vitesse au départ : aucun glissement entre les disques, aucun échange.':p.cmode==='visq'&&p.k===0?'Sans couplage, chaque disque garde sa vitesse : pas d\'échange de moment cinétique.'
      :p.wf?`Visqueux ou brusque, l'état final est le même : ω<sub>f</sub> = ${Mh.frac('ℒ<sub>tot</sub>',`${mv('J')}<sub>1</sub> + ${mv('J')}<sub>2</sub>`)} = ${f.sig(B.wf,3)} rad·s<sup>−1</sup> et ${mv('Q')} = ${f.sig(B.Qf,3)} J, comme pour un choc mou.`
      :'Les couples intérieurs sont opposés : ℒ<sub>tot</sub> se conserve, mais pas l\'énergie cinétique. Prévoir la vitesse finale, puis l\'afficher.');
    L.push({c:C.cInk,label:'disque 1'},{c:C.B,label:'disque 2 (coaxial, dessiné à côté)'});if(p.cmode==='visq')L.push({c:C.F,label:'couple intérieur (proportionnel)'});if(p.wf)L.push({c:C.pred,label:'ω<sub>f</sub>',dash:true});
  }else if(a.tab===2){
    a.metrics([{label:`Inertie totale ${mv('J')}`,value:f.sig(q.J,3),unit:'kg·m²',hint:`rotor seul ${f.sig(p.Jrot,3)} kg·m²`},
      {label:'Amplitude des fluctuations de ω',value:f.sig(q.A,3),unit:'rad·s<sup>−1</sup>',hint:`rotor seul ${f.sig(q.Aref,3)} rad·s<sup>−1</sup>`},
      {label:`Temps de mise en régime ${Mh.frac(mv('J'),'α')}`,value:f.sig(q.tau,3),unit:'s',hint:`rotor seul ${f.sig(q.tauRef,3)} s`}]);
    a.insight(p.gamma===0?`Sans perturbation, le volant ne fait que ralentir la mise en régime : ω tend vers Γ<sub>0</sub>/α = ${f.sig(q.wmoy,3)} rad·s<sup>−1</sup> dans les deux cas.`:p.Jfly===0?'Sans volant, les deux rotors sont identiques.':`Le volant divise les fluctuations par ${f.sig(q.Aref/q.A,3)}, mais la mise en régime est ${f.sig(q.tau/q.tauRef,3)} fois plus lente. La vitesse moyenne Γ<sub>0</sub>/α ne change pas.`);
    L.push({c:C.cInk,label:'rotor + volant'},{c:C.B,label:'rotor seul'});
  }else if(a.tab===3){
    a.metrics([{label:'Satellite ω<sub>s</sub>',value:f.sig(q.ws,3),unit:'rad·s<sup>−1</sup>',hint:`θ<sub>s</sub> = ${f.fix(q.theta/DEG,1)}°`},
      {label:'Roue ω<sub>r</sub> (absolue)',value:f.sig(q.wr,3),unit:'rad·s<sup>−1</sup>',hint:`relative au satellite : ${f.sig(q.relative,3)} rad·s<sup>−1</sup>`},
      {label:'Moment cinétique total',value:f.sig(q.L,3),unit:'kg·m²·s<sup>−1</sup>',hint:'nul : aucun moment extérieur'}]);
    a.insight(p.smode==='asservi'?(a.t>2&&Math.abs(q.theta/DEG-p.cible)<1&&Math.abs(q.ws)<.01?'Cible atteinte : le satellite s\'est orienté sans moteur-fusée, en faisant tourner la roue en sens inverse.':`${mv('J')}<sub>s</sub>ω<sub>s</sub> = −${mv('J')}<sub>r</sub>ω<sub>r</sub> à chaque instant : pour tourner, le satellite fait tourner la roue en sens inverse. `+(q.saturated?'Couple limité : le freinage arrive trop tard, le satellite dépasse la cible.':''))
      :p.smode==='manoeuvre'&&a.t>=2*p.burn?'Manœuvre terminée : roue et satellite au repos, mais le satellite a changé d\'orientation.':q.saturated?'Roue saturée : le moteur est coupé, roue et satellite continuent de tourner. Seule une action extérieure peut désaturer la roue.':`${mv('J')}<sub>s</sub>ω<sub>s</sub> + ${mv('J')}<sub>r</sub>ω<sub>r</sub> = 0 : le moteur échange du moment cinétique entre la roue et le satellite.`);
    L.push({c:C.cInk,label:'satellite'},{c:C.E,label:'roue'});if(p.smode==='asservi')L.push({c:C.v,label:'angle visé',dash:true});L.push({c:C.ink2,label:'flèches courbes : ω (même échelle, plafonnée à un tour)'});
  }else{
    const done=a.t>=B.duration-1e-7;
    a.metrics([{label:'Angle θ (sens horaire)',value:f.fix(q.theta/DEG,1),unit:'°',hint:q.phase==='pivot'?`départ en vol à ${f.fix(B.release/DEG,1)}°`:`ω = ${f.sig(q.w,3)} rad·s<sup>−1</sup>`},
      {label:'Vitesse angulaire ω',value:f.sig(q.w,3),unit:'rad·s<sup>−1</sup>',hint:q.phase==='pivot'?`${mv('N')}/${mv('m')}${mv('g')} = ${f.sig(q.N,2)} ; ${mv('T')}/${mv('m')}${mv('g')} = ${f.sig(q.T,2)}`:`temps de vol ${f.fix(q.flightTime,3)} s`},
      {label:'Angle tourné au premier contact',value:done?f.fix(B.end.theta/DEG,0):'—',unit:done?'°':'',hint:done?(Math.abs(B.end.theta/DEG-270)<2.5?'sur la tranche (limite)':B.face):'aller jusqu\'à l\'impact',warn:done&&B.face==='beurre vers le bas'}]);
    a.insight(q.phase==='pivot'?'Basculement : le poids crée un moment par rapport à I ; la réaction de la table, appliquée en I, n\'en crée pas.':q.phase==='vol'?'En vol, le poids s\'applique en G : moment nul par rapport à G, donc ℒ<sub>G</sub> et ω restent constants.':`Premier contact à ${f.fix(B.end.theta/DEG,0)}° : ${Math.abs(B.end.theta/DEG-270)<2.5?'la tartine arrive sur la tranche, à la limite entre les deux faces':B.face}. `+(sweep.hlim?`Il faudrait ${f.fix(sweep.hlim,2)} m de chute pour atteindre 270°.`:''));
    L.push({c:C.cInk,label:'tartine'},{c:'#e8b53a',label:'beurre'});if(q.phase==='pivot')L.push({c:C.F,label:'poids'},{c:C.B,label:'réaction en I (même échelle)'});
  }
  a.legend(L);a.clock(a.tab===1&&p.cmode==='clutch'?clk+(a.t<p.tcl?' · débrayés':' · embrayés'):clk);
}

/* ---------- interactions ---------- */
let hdl=null;
A.drag('scene',{
  hit:(x,y,e)=>{const h=e.target.closest&&e.target.closest('[data-h]');hdl=h?h.dataset.h:null;return !!hdl},
  start(){A.play(false)},
  move(x,y){if(hdl==='G'&&A.tab===0){const V=geo.pend,v=Math.max(-170,Math.min(170,Math.round(Math.atan2(V.x(x),-V.y(y))/DEG)));if(v!==A.p.angle){A.set('angle',v);A.reset()}}
    else if(hdl==='cible'&&A.tab===3){const V=geo.sat,v=Math.round(Math.atan2(V.y(y),V.x(x))/DEG);if(v!==A.p.cible){A.set('cible',v);A.reset()}}}
});
MC7.seekGraph(A,'g',()=>((A.tab===0&&A.p.gp==='phase')||(A.tab===4&&A.p.gt==='h'))?null:G,()=>B.duration,v=>{A.t=v});

</script>
