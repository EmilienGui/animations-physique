    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}
      return s;
    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){
      let d='',pen=false;
      for(const[x,y]of pts){if(!isFinite(y)||!isFinite(x)){pen=false;continue}
        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

      {id:'b',label:`Paramètre d'impact ${mv('b')}`,min:0,max:200000,step:100,unit:'km',value:60000},

      {type:'boutons',items:[{label:'Changer de côté',action:a=>{st.side*=-1;build(a)}},{label:'Approche',titre:'Pause au point le plus proche et zoom',action:a=>approche(a)}]},
      {type:'note',html:`${mv('b')} est la distance entre O et l'asymptote entrante (glisser sa poignée ↕) ; ce n'est pas ${mv('r')}<sub>min</sub>. La vitesse à l'infini est notée ${mv('v')}<sub>0</sub> dans le TD.`}]},
    {titre:'Prévoir puis vérifier',items:[
      {id:'prev',type:'check',label:`Asymptote sortante, déviation ${mv('D')}, distance ${mv('r')}<sub>min</sub>`,value:false},
      {type:'note',html:a=>a.p.prev?`tan(${Mh.frac(mv('D'),'2')}) = ${Mh.frac('|'+mv('K')+'|',mv('m')+mv('b')+mv('v')+'<sub>∞</sub><sup>2</sup>')} : ${mv('D')} relie les directions des vitesses à l'infini.`:'Prévoir le sens et l\'ordre de grandeur de la déviation avant d\'afficher.'}]},
    {titre:'Focalisation gravitationnelle',si:a=>a.p.mode==='terre',items:[
      {type:'note',html:a=>{const c=bcrit(a);return `${mv('b')}<sub>crit</sub> = ${mv('R')}<sub>T</sub>${Mh.sqrt('1 + '+Mh.frac('2'+mv('G')+mv('M')+'<sub>T</sub>',mv('R')+'<sub>T</sub>'+mv('v')+'<sub>∞</sub><sup>2</sup>'))} = ${MC6.nb(a,c)} km : un objet de paramètre d'impact ${mv('b')} &lt; ${mv('b')}<sub>crit</sub> heurte la Terre, même si ${mv('b')} &gt; ${mv('R')}<sub>T</sub>. Section efficace : σ/(π${mv('R')}<sub>T</sub><sup>2</sup>) = ${a.fmt.sig((c/cfg.R)**2,3)}.`}}]},
    {titre:'Affichage',items:[
      {id:'vel',type:'check',label:'Vitesse instantanée',value:true},
      {id:'beam',type:'check',label:'Faisceau de trajectoires',value:false,si:a=>a.p.mode!=='comp'},
      {id:'duree',type:'seg',label:'Durée à l\'écran d\'un passage',options:[[10,'10 s'],[30,'30 s'],[60,'60 s'],[120,'120 s']],value:30}]}
  ],
  aide:{
    voit:'Le passage d\'un mobile venu de l\'infini sur l\'asymptote entrante, à la distance <span class="m">b</span> de O. Onglet 2 : la déviation <span class="m">D</span>(<span class="m">b</span>) et la distance minimale <span class="m">r</span><sub>min</sub>(<span class="m">b</span>), à côté de la trajectoire.',
    faire:'<ul><li>Choisir Terre, Rutherford ou Comparer ; régler <span class="m">b</span> et <span class="m">v</span><sub>∞</sub> ou glisser la poignée de l\'asymptote.</li><li>Prévoir la déviation, puis cocher « Prévoir puis vérifier ».</li><li>Approche : pause au point le plus proche, vue rapprochée ; Cadrer revient à la vue entière.</li><li>Onglet 2 : cliquer ou glisser dans les graphes pour régler <span class="m">b</span>.</li></ul>',
    modele:'Centre de force fixe, force newtonienne <span class="m">K</span>/<span class="m">r</span>² seule, ℰ<sub>m</sub> = ½<span class="m">mv</span><sub>∞</sub>² &gt; 0 : trajectoire hyperbolique exacte. Le mobile part d\'une distance finie de la conique (pas d\'un point à l\'infini) : sa vitesse au bord du dessin diffère un peu de <span class="m">v</span><sub>∞</sub>. Rutherford : <span class="m">K</span> = <span class="m">Ze</span>²/(2πε<sub>0</sub>) avec les valeurs du TD ; le halo du noyau est symbolique. Terre : <span class="m">GM</span><sub>T</sub> = 398 600 km<sup>3</sup>·s<sup>−2</sup>, <span class="m">R</span><sub>T</sub> = 6 371 km, sans atmosphère. Temps accéléré.',
    cours:'MC6 § 3.3 (champ répulsif : branche d\'hyperbole) et § 3.4 (champ attractif, ℰ<sub>m</sub> &gt; 0). Conservation de ℰ<sub>m</sub> et de 𝒞 = <span class="m">bv</span><sub>∞</sub> ; en <span class="m">r</span><sub>min</sub>, <span class="m">ṙ</span> = 0. TD : expérience de Rutherford (<span class="m">D</span> = 60° et 180°), alerte astéroïde.'
  },
  init(a){cfg=CFG[a.p.mode];bornes(a);build(a);fit(a);MC6.drag(a,'scene',grab);graphDrag(a);
    a.panels.scene.el.querySelector('.ak-ptools').addEventListener('click',e=>{if(e.target.closest('[data-z="0"]')){st.focus=false;fit(a)}},true)},
  reset(a){build(a)},
  change(a,id,v){if(id==='mode'){setMode(a,v)}else if(['b','v','beam'].includes(id)){if(id!=='beam'){a.t=0;st.focus=false}build(a);if(id!=='beam')fit(a)}},
  step(a,dt){a.t=Math.min(span,a.t+Math.max(0,dt)*span/a.p.duree);if(a.t>=span)a.play(false)},
  draw(a){scene(a);if(a.tab===1)graph(a);infos(a)}
});
function bcritV(v){return K.criticalImpact({radius:CFG.terre.R,kappa:CFG.terre.kappa,v,sign:-1})}
function approche(a){a.play(false);const o=models[0];a.t=Math.min(o.end,tPeri(o));st.focus=true;const P=a.panels.scene;P.zoom=1;P.panX=P.panY=0}

/* ---------- caméra ---------- */
function fit(a){const P=a.panels.scene;P.zoom=1;P.panX=P.panY=0;
  const ps=samples.flat();ps.push({x:0,y:0},{x:-cfg.R,y:-cfg.R},{x:cfg.R,y:cfg.R});for(const o of models){ps.push({x:o.center[0],y:o.center[1]},{x:0,y:st.side*a.p.b})}
  bounds={xmin:Math.min(...ps.map(q=>q.x)),xmax:Math.max(...ps.map(q=>q.x)),ymin:Math.min(...ps.map(q=>q.y)),ymax:Math.max(...ps.map(q=>q.y))};
  const m=models[0].a;if(bounds.xmax-bounds.xmin<m){bounds.xmin-=m/2;bounds.xmax+=m/2}if(bounds.ymax-bounds.ymin<m){bounds.ymin-=m/2;bounds.ymax+=m/2}}
function view(a){if(!st.focus)return bounds;const r=Math.max(cfg.R*1.6,...models.map(o=>K.atH(o,0).r))*1.5;return{xmin:-r,xmax:r,ymin:-r,ymax:r}}
function grab(x,y){const a=A,yy=cam.X(0,st.side*a.p.b)[1];
  if(Math.hypot(x-hx,y-yy)<24*a.k)return{start(){a.play(false)},move(px,py){const w=cam.inv(px,py)[1];st.side=w<0?-1:1;const b=Math.min(cfg.maxB,Math.abs(w));a.set('b',+b.toFixed(a.p.mode==='terre'?0:2),{silent:true});a.t=0;build(a)},end(){fit(a)}};
  return null}

/* ---------- scène ---------- */
function scene(a){
  const P=a.panels.scene,S=a.S,C=a.C,k=a.k,W=P.w,H=P.h;cam=MC6.camera(P,view(a),40*k);const X=cam.X,L=MC6.placer(a,P);
  const col=i=>a.p.mode==='comp'?(i?C.B:C.F):(models[0].sign<0?C.F:C.B);
  let s='';const O=X(0,0);
  for(const e of beam)s+=S.poly(e.p.map(q=>X(q.x,q.y)),{c:e.o.collision?C.F:C.ink2,w:1.1,op:.3});
  models.forEach((o,i)=>{s+=S.poly(K.path(o,360,{full:true}).map(q=>X(q.x,q.y)),{c:col(i),w:1.6,dash:`${6*k} ${6*k}`,op:.45})});
  /* obstacle / noyau */
  if(cfg.R>0){const er=cfg.R*cam.s;s+=S.circle(O[0],O[1],er,{fill:C.dark?'#2d4a5c':'#cfe3ee',c:C.dark?'#7fb3cc':'#4f7f99',w:1.2})}
  else s+=S.circle(O[0],O[1],10*k,{fill:C.E,op:.2,c:C.E,w:1.2});
  s+=S.circle(O[0],O[1],2.8*k,{fill:C.ink});L.obstacle(O[0],O[1],12*k);s+=L.put(O[0],O[1],'O',{weight:600,pref:[-16*k,18*k]});
  /* asymptote entrante, b, v∞ */
  const yb=X(0,st.side*a.p.b)[1];hx=cfg.dir>0?W-38*k:38*k;
  s+=S.line(0,O[1],W,O[1],{c:C.rule,w:1,dash:`${3*k} ${6*k}`});
  s+=S.line(0,yb,W,yb,{c:C.v,w:1.2,dash:`${6*k} ${6*k}`,op:.75});
  if(yb>8&&yb<H-8){s+=S.line(hx,O[1],hx,yb,{c:C.v,w:1.4});for(const yy of[O[1],yb])s+=S.line(hx-6*k,yy,hx+6*k,yy,{c:C.v,w:1.4});
    s+=S.text(hx+(cfg.dir>0?-10*k:10*k),(O[1]+yb)/2,S.v('b'),{size:17,c:C.v,anchor:cfg.dir>0?'end':'start'});
    const ax=cfg.dir>0?70*k:W-70*k;s+=S.arrow(ax,yb,ax+cfg.dir*55*k,yb,{c:C.v,w:2.2});s+=S.text(ax+cfg.dir*27*k,yb-12*k,S.v('v')+'<tspan font-size="72%" dy="0.42em">∞</tspan>',{size:16,c:C.v,anchor:'middle'});
    s+=S.circle(hx,yb,15*k,{fill:C.v,op:.15,c:C.v,w:1,dash:`${3*k} ${3*k}`})+S.text(hx,yb,'↕',{size:17,c:C.v,anchor:'middle',halo:false});L.obstacle(hx,yb,16*k)}
  /* prévisions : asymptote sortante, D, r_min */
  if(a.p.prev)models.forEach((o,i)=>{const c=col(i),I=X(...o.center),u=o.outgoing,Lg=3*Math.max(W,H);
    s+=S.line(I[0]-Lg*u[0],I[1]+Lg*u[1],I[0]+Lg*u[0],I[1]-Lg*u[1],{c,w:1.2,dash:`${6*k} ${6*k}`,op:.7});
    if(o.D!==null&&o.D>1e-6&&I[0]>30&&I[0]<W-30&&I[1]>30&&I[1]<H-30){const t0=cfg.dir>0?0:Math.PI,dl=cfg.dir*st.side*o.sign*o.D,rr=34*k;s+=S.arc(I[0],I[1],rr,Math.min(t0,t0+dl),Math.max(t0,t0+dl),{c,w:1.6});
      const am=t0+dl/2;s+=L.put(I[0]+(rr+10*k)*Math.cos(am),I[1]-(rr+10*k)*Math.sin(am),a.p.mode==='comp'?S.v('D',i?'r':'a'):o.collision?S.v('D','th'):S.v('D'),{c,size:15})}
    const q=K.atH(o,0),z=X(q.x,q.y);L.obstacle(z[0],z[1],7*k);s+=S.line(O[0],O[1],z[0],z[1],{c:C.pred,w:1.5,dash:`${4*k} ${4*k}`})+S.circle(z[0],z[1],4*k,{fill:C.card,c:C.pred,w:1.6});
    s+=L.put((O[0]+z[0])/2,(O[1]+z[1])/2,a.p.mode==='comp'?S.v('r','min,'+(i?'r':'a')):S.v('r','min'),{c:C.pred,size:14});
    s+=L.put(z[0],z[1],a.p.mode==='ruth'?'S':'P',{c:C.pred,size:14,weight:600})});
  /* trajectoires parcourues et mobiles */
  const vmax=Math.max(...models.map(m=>m.sign<0?Math.sqrt(m.v*m.v+2*m.kappa/Math.max(m.radius,m.rmin)):m.v));
  models.forEach((o,i)=>{const c=col(i),p=K.atTime(o,Math.min(a.t,o.end)),tr=samples[i].filter(q=>q.H<=p.H+1e-12).map(q=>X(q.x,q.y)),M=X(p.x,p.y);tr.push(M);s+=S.poly(tr,{c,w:2.6});
    L.obstacle(M[0],M[1],10*k);
    if(a.p.vel&&p.speed>0){const l=52*k*p.speed/vmax,t=[M[0]+l*p.vx/p.speed,M[1]-l*p.vy/p.speed];s+=S.arrow(M[0],M[1],t[0],t[1],{c:C.v,w:2.2});if(l>22*k)s+=L.put(t[0],t[1],S.v('v'),{c:C.v,size:15})}
    const hit=o.collision&&a.t>=o.end*(1-1e-9);s+=S.circle(M[0],M[1],6.5*k,{fill:c,c:C.card,w:1.5});
    s+=L.put(M[0],M[1],hit?'Contact':a.p.mode==='comp'?S.v('M',i?'r':'a'):S.v('M'),{c:hit?C.F:c,size:15,pref:[12*k,-12*k]})});
  s+=MC6.scaleBar(a,P,cam,cfg.L);
  a.svg('scene',s);
}

/* ---------- graphes D(b) et r_min(b) ---------- */
function graph(a){
  const P=a.panels.graph,S=a.S,C=a.C,k=a.k,o=models[0],h=P.h/2;
  gmax=Math.min(cfg.maxB,Math.max(a.p.b*2,o.a*6,cfg.R*4));
  const crit=a.p.mode==='terre'?bcrit(a):null,pl=(a.p.mode==='terre'?56:40)*k,nf=a.p.mode==='terre'?(v=>MC6.nb(a,v)):undefined;
  GD=S.graph({x:0,y:0,w:P.w,h,xmin:0,xmax:gmax,ymin:0,ymax:180,yticks:[0,45,90,135,180],xlab:`${S.v('b')} (${cfg.L})`,ylab:`${S.v('D')} (°)`,xfmt:nf,padL:pl,padB:30*k,padT:22*k});
  let s=GD.svg+S.clip('clipD',GD);
  if(crit)s+=`<rect x="${GD.x0}" y="${GD.y0}" width="${Math.max(0,Math.min(GD.w,GD.X(crit)-GD.x0))}" height="${GD.h}" fill="${C.F}" opacity=".12"/>`;
  const Dc=[];for(let j=0;j<=300;j++){const b=gmax*j/300;Dc.push([b,2*Math.atan2(o.a,b)/RAD])}s+=S.curve(Dc,GD,{c:C.cInk,w:2.4});
  const x=GD.X(a.p.b),y=GD.Y(o.Dlimit/RAD);s+=S.line(x,y,x,GD.y0+GD.h,{c:C.v,w:1.2,dash:`${4*k} ${4*k}`})+S.circle(x,y,5.5*k,{fill:o.collision?C.card:C.v,c:o.collision?C.F:C.v,w:1.8});
  if(crit)s+=S.text(GD.x0+GD.w-4*k,GD.y0+8*k,'zone teintée : contact',{size:12,c:C.F,anchor:'end'});
  /* r_min(b) */
  const G2=S.graph({x:0,y:h,w:P.w,h,xmin:0,xmax:gmax,ymin:0,ymax:Math.max(...models.map(m=>K.create({b:gmax,v:m.v,kappa:m.kappa,sign:m.sign,radius:0}).rmin))*1.08,xlab:`${S.v('b')} (${cfg.L})`,ylab:`${S.v('r','min')} (${cfg.L})`,xfmt:nf,yfmt:nf,padL:pl,padB:30*k,padT:22*k});
  s+=G2.svg+S.clip('clipR',G2);
  const signs=a.p.mode==='comp'?[-1,1]:[o.sign];
  signs.forEach(sg=>{const c=sg<0?C.F:C.B,pts=[];for(let j=0;j<=200;j++){const b=gmax*j/200;if(b===0&&sg<0)continue;pts.push([b,K.create({b,v:o.v,kappa:o.kappa,sign:sg,radius:0}).rmin])}s+=S.curve(pts,G2,{c,w:2.2})});
  s+=S.curve([[0,0],[gmax,gmax]],G2,{c:C.ink2,w:1,dash:`${3*k} ${4*k}`});s+=S.text(G2.X(gmax*.93),G2.Y(Math.min(gmax*.93,G2.yv(G2.y0+12*k))),`${S.v('r','min')} = ${S.v('b')}`,{size:12,c:C.ink2,anchor:'end'});
  if(cfg.R>0&&cfg.R<G2.yv(G2.y0))s+=S.curve([[0,cfg.R],[gmax,cfg.R]],G2,{c:C.E,w:1.2,dash:`${5*k} ${4*k}`})+S.text(G2.x0+G2.w-4*k,G2.Y(cfg.R)-9*k,a.p.mode==='terre'?S.v('R','T'):S.v('R'),{size:13,c:C.E,anchor:'end'});
  models.forEach(m=>{s+=S.circle(G2.X(a.p.b),G2.Y(m.rmin),5*k,{fill:C.v,c:C.card,w:1.4})});
  GD.h2=G2;a.svg('graph',s);
}
function graphDrag(a){const P=a.panels.graph;a.drag('graph',{hit:()=>true,start:(x)=>setB(x),move:(x)=>setB(x)});
  function setB(x){if(!GD)return;const b=Math.max(0,Math.min(cfg.maxB,(x-GD.x0)/GD.w*gmax));a.set('b',+b.toFixed(a.p.mode==='terre'?0:2),{silent:true});a.t=0;st.focus=false;build(a);fit(a)}}

/* ---------- valeurs ---------- */
function infos(a){
  const f=a.fmt,o=models[0],p=K.atTime(o,Math.min(a.t,o.end)),prev=a.p.prev,Lu=cfg.L,dg=x=>f.fix(x/RAD,1);
  const dist=x=>a.p.mode==='terre'?MC6.nb(a,x):f.sig(x,3);
  const Einf=a.p.mode==='ruth'?`${f.sig(.5*MA*(a.p.v*1e7)**2/(QE*1e6),3)} MeV`:a.p.mode==='terre'?`${f.sig(.5*a.p.v**2,3)} MJ·kg<sup>−1</sup>`:`${f.sig(.5*a.p.v**2,3)} L₀<sup>2</sup>·τ₀<sup>−2</sup>`;
  if(a.p.mode==='comp')a.metrics([
    {label:`${mv('r')}<sub>min</sub> · attraction`,value:prev?dist(models[0].rmin):'?',unit:prev?Lu:'',hint:prev?'':'à prévoir'},
    {label:`${mv('r')}<sub>min</sub> · répulsion`,value:prev?dist(models[1].rmin):'?',unit:prev?Lu:'',hint:prev?`écart = 2ℓ = ${f.sig(2*o.a,3)} ${Lu}`:'à prévoir'},
    {label:`Déviation ${mv('D')}`,value:prev?(o.D===null?dg(models[1].D):dg(o.D)):'?',unit:prev?'°':'',hint:prev?'même angle, sens opposés':'à prévoir'}]);
  else a.metrics([
    {label:`Paramètre d'impact ${mv('b')}`,value:dist(a.p.b),unit:Lu,hint:`ℓ = ${Mh.frac('|'+mv('K')+'|',mv('m')+mv('v')+'<sub>∞</sub><sup>2</sup>')} = ${dist(o.a)} ${Lu}`},
    {label:`Distance minimale ${mv('r')}<sub>min</sub>`,value:prev?dist(o.rmin):'?',unit:prev?Lu:'',hint:prev?(o.collision?'sans obstacle (contact avant)':`excentricité ${mv('e')} = ${f.sig(o.e,3)}`):'à prévoir'},
    {label:`Déviation ${mv('D')}`,value:prev?(o.D===null?'—':dg(o.D)):'?',unit:prev&&o.D!==null?'°':'',hint:prev?(a.p.mode==='ruth'?`ℰ<sub>m</sub> = ${Einf}`:`ℰ<sub>m</sub>/${mv('m')} = ${Einf}`):`${mv('v')} actuelle : ${f.sig(p.speed/cfg.vf,3)} ${cfg.V}`}]);
  let msg;
  if(a.p.mode==='comp')msg=prev?`Même ${mv('b')}, même ${mv('v')}<sub>∞</sub>, même |${mv('K')}| : même déviation ${mv('D')}, en sens opposés ; l'attraction rapproche (${mv('r')}<sub>min</sub> &lt; ${mv('b')}), la répulsion éloigne (${mv('r')}<sub>min</sub> &gt; ${mv('b')}).`:`Prévoir : laquelle des deux trajectoires passe le plus près de O ? Laquelle est la plus déviée ?`;
  else if(o.b===0&&o.sign<0)msg='Cas axial attractif : chute radiale, sans direction de sortie définie.';
  else if(a.p.mode==='ruth')msg=prev?`tan(${Mh.frac(mv('D'),'2')}) = ${Mh.frac(mv('K'),mv('m')+mv('b')+mv('v')+'<sub>∞</sub><sup>2</sup>')} : une forte déviation exige un petit ${mv('b')}. Pour ${mv('D')} = 180°, ${mv('r')}<sub>min</sub> = ${Mh.frac('2'+mv('K'),mv('m')+mv('v')+'<sub>∞</sub><sup>2</sup>')} borne le rayon du noyau.`:`Prévoir : comment varie la déviation quand ${mv('b')} diminue ? Que vaut ${mv('D')} pour ${mv('b')} = 0 ?`;
  else msg=prev?(o.collision?`${mv('b')} &lt; ${mv('b')}<sub>crit</sub> : la gravitation courbe la trajectoire jusqu'au contact, alors que l'asymptote entrante passe hors de la Terre.`:`${mv('b')} et ${mv('r')}<sub>min</sub> sont différents : l'attraction rapproche le mobile de O (${mv('r')}<sub>min</sub> &lt; ${mv('b')}) et le dévie de ${mv('D')} avec tan(${Mh.frac(mv('D'),'2')}) = ${Mh.frac('|'+mv('K')+'|',mv('m')+mv('b')+mv('v')+'<sub>∞</sub><sup>2</sup>')}.`):`Prévoir : le mobile passe-t-il plus près ou plus loin de O que ${mv('b')} ? De quel côté est-il dévié ?`;
  a.insight(msg,[`${mv('b')} et ${mv('r')}<sub>min</sub> sont différents : l'attraction rapproche le mobile de O (${mv('r')}<sub>min</sub> &lt; ${mv('b')}) et le dévie de ${mv('D')} avec tan(${Mh.frac(mv('D'),'2')}) = ${Mh.frac('|'+mv('K')+'|',mv('m')+mv('b')+mv('v')+'<sub>∞</sub><sup>2</sup>')}.`]);
  a.legend(a.p.mode==='comp'?[{c:a.C.F,label:'attraction'},{c:a.C.B,label:'répulsion'},{c:a.C.v,label:`${mv('b')} et asymptote entrante`},prev&&{c:a.C.pred,label:`${mv('r')}<sub>min</sub>`,dash:true}]
    :[{c:o.sign<0?a.C.F:a.C.B,label:'trajectoire'},{c:a.C.v,label:`${mv('b')}, ${mv('v')}<sub>∞</sub> et vitesse`},prev&&{c:a.C.pred,label:`${mv('r')}<sub>min</sub> théorique`,dash:true},a.p.beam&&{c:a.C.ink2,label:'faisceau'}]);
  const T=a.t,cl=a.p.mode==='ruth'?`${f.sig(T/1e-21,3)} × 10<sup>−21</sup> s`:a.p.mode==='comp'?`${f.sig(T,3)} τ₀`:MC6.duree(a,T);
  a.clock(`${mv('t')} = ${cl}`);
}
