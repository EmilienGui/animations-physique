  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e<-3||e>=6){const m=x/10**e;return (+m.toFixed(n-1)).toFixed(n-1).replace('-',MINUS)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>'}
    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}
      return s;
    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){
      let d='',pen=false;
      for(const[x,y]of pts){if(!isFinite(y)||!isFinite(x)){pen=false;continue}
        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}
  };

 };
 function amounts(c,n0,x){return n0.map((n,i)=>Math.max(0,n+c.nu[i]*x));}

 function activities(c,n,V){const f=c.phase==='solution'? .001/V : .001*R*c.T/V;return n.map((v,i)=>c.solids?.includes(i)?1:v*f);}

// @titre Équilibres chimiques en mouvement · TC1 · MPSI

// @inclure TC1_Equilibres_Chimiques_physique.js

// @description Équilibres chimiques en mouvement : réacteur de particules, courbes des quantités, axe logarithmique de Qr et perturbation de l'équilibre.
'use strict';
/* =====================================================================
   TC1 · Équilibres chimiques en mouvement (5 onglets = 5 exemples)
   A + B = AB · 2 NO₂ = N₂O₄ · H₂ + I₂ = 2 HI · PCl₅ = PCl₃ + Cl₂ · CaCO₃ = CaO + CO₂
   Physique : Chemistry (TC1_Equilibres_Chimiques_physique.js, d'origine, inchangée) ; avancement continu, activités idéales.

   axes des courbes fixes (durée réglable, fenêtre glissante) ; niveaux d'équilibre et ligne « Final calculé » masqués au départ ;
   proposition A « Perturber l'équilibre » : ajout ou retrait d'une espèce, volume × 2 ou ÷ 2 à partir de l'état courant,

const CH=Chemistry,fm=AnimKit.fmt,Mh=AnimKit.M;
const KEYS=Object.keys(CH.cases);

const ATOM={A:'#3886ed',B:'#ee8960',N:'#4895d8',O:'#ec735e',H:'#e3e9ed',I:'#ac79d0',P:'#e4a456',Cl:'#68b887',Ca:'#9babc0',C:'#526578'};
const TARGET={association:120,no2:96,hi:100,pcl5:60,chaux:72};
const st={model:null,particles:[],effects:[],history:[],visualX:0,quantum:1,cycle:0,sample:0,serial:0,t0:0,marks:[],logQ0:0,n0run:[],ymax:1,probe:null,drag:null,question:'',ci:0};
const subT=t=>`<tspan font-size="72%" dy="0.3em">${t}</tspan><tspan dy="-0.3em">​</tspan>`;
const uS=s=>String(s).replace(/[₀-₉]/g,d=>subT(d.charCodeAt(0)-8320));          /* indices Unicode → tspan (SVG) */
const uH=s=>String(s).replace(/[₀-₉]/g,d=>'<sub>'+(d.charCodeAt(0)-8320)+'</sub>');  /* → HTML */
const sv=(a,s)=>String(s).replace(/<sup>(.*?)<\/sup>/g,(_,e)=>a.S.sup(e));
const caseOf=a=>CH.cases[KEYS[a.tab]];

const niceMax=v=>{if(!(v>0))return 1;const s=10**Math.floor(Math.log10(v)),q=v/s;return(q<=1?1:q<=2?2:q<=2.5?2.5:q<=5?5:10)*s};

/* ---------- préparation d'un mélange ---------- */
function makeParticle(s,x,y){const m=st.model,solid=m.c.solids&&m.c.solids.includes(s);return{uid:st.serial++,s,x:x??(.06+Math.random()*.88),y:y??(.07+Math.random()*(m.id==='chaux'?.5:.85)),vx:(Math.random()-.5)*.19,vy:(Math.random()-.5)*.19,angle:Math.random()*Math.PI*2,spin:(Math.random()-.5)*1.2,age:2,solid:!!solid}}

  st.logQ0=CH.logQ(c,n0,V);

/* ---------- mouvement, réactions ---------- */
function react(a,dir,balanced=false){
  const m=st.model,nu=m.c.nu,need=[];
  nu.forEach((v,s)=>{if(v*dir<0)for(let j=0;j<Math.abs(v);j++)need.push(s)});
  const chosen=[];
  for(const s of need){
    const cand=st.particles.filter(p=>p.s===s&&!chosen.includes(p)&&(p.age>.28||!balanced));
    if(!cand.length)return false;
    let p;
    if(!chosen.length)p=cand[Math.floor(Math.random()*cand.length)];
    else{const o=chosen[0];p=cand.reduce((b,q)=>((q.x-o.x)**2+(q.y-o.y)**2<(b.x-o.x)**2+(b.y-o.y)**2)?q:b,cand[0])}
    chosen.push(p);
  }
  const center={x:chosen.reduce((s,p)=>s+p.x,0)/chosen.length,y:chosen.reduce((s,p)=>s+p.y,0)/chosen.length};
  const solid=chosen.find(p=>p.solid);if(solid&&dir>0){center.x=solid.x;center.y=solid.y-.025}
  const ghosts=chosen.map(p=>({...p}));
  st.particles=st.particles.filter(p=>!chosen.includes(p));
  const created=[];nu.forEach((v,s)=>{if(v*dir>0)for(let j=0;j<Math.abs(v);j++)created.push(s)});
  created.forEach((s,i)=>{const ang=(i/Math.max(1,created.length))*Math.PI*2+Math.random()*.4;
    const p=makeParticle(s,clamp(center.x+Math.cos(ang)*.015,.03,.97),clamp(center.y+Math.sin(ang)*.02,.035,.95));
    p.age=0;p.vx=Math.cos(ang)*.12;p.vy=Math.sin(ang)*.12;st.particles.push(p)});
  if(a.p.effects)st.effects.push({type:'reaction',dir,x:center.x,y:center.y,age:0,ghosts});

}
function synchronize(a,dt){
  const m=st.model,target=Math.round(m.x/st.quantum);let gap=target-st.visualX,lim=0;
  while(gap&&lim++<8){const d=Math.sign(gap);if(!react(a,d))break;st.visualX+=d;gap-=d}
  if(gap===0){const[f,b]=CH.rates(m),n=CH.amounts(m.c,m.n0,m.x);
    if(m.c.solids&&(n[0]<st.quantum*.55||n[1]<st.quantum*.55))return;
    st.cycle+=Math.min(f,b)*dt/st.quantum;
    while(st.cycle>=1){st.cycle--;if(react(a,1,true))react(a,-1,false)}}
}
function simulate(a,dt){
  const m=st.model;let left=dt;
  while(left>1e-9){const h=Math.min(left,.02);CH.advance(m,h);synchronize(a,h);st.sample+=h;
    if(st.sample>=.045){st.sample=0;st.history.push({t:st.t0+m.t,n:CH.amounts(m.c,m.n0,m.x)})}left-=h}
  if(st.history.length>6000)st.history=st.history.filter((_,i)=>i%2===0||i===st.history.length-1);
}
function collR(a,p){const n=st.model.c.atoms[p.s].length;return(n===1?6.5:n===2?10:n===3?12.5:n===4?14:16)*a.k}
function move(a,dt){
  const P=a.panels.reactor,w=P.w-24,h=P.h-18,m=st.model,bed=m.id==='chaux'?.68:.96;
  for(const p of st.particles){p.age+=dt;if(p.solid||st.drag===p)continue;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.angle+=p.spin*dt;
    if(p.x<.035||p.x>.965){p.vx*=-1;p.x=clamp(p.x,.035,.965)}
    if(p.y<.045||p.y>bed){p.vy*=-1;p.y=clamp(p.y,.045,bed)}}
  const free=st.particles.filter(p=>!p.solid&&p.age>.25);let flash=0;
  for(let i=0;i<free.length;i++)for(let j=i+1;j<free.length;j++){
    const A1=free[i],B1=free[j],dx=(B1.x-A1.x)*w,dy=(B1.y-A1.y)*h,r=collR(a,A1)+collR(a,B1),dd=dx*dx+dy*dy;
    if(dd>0&&dd<r*r){const d=Math.sqrt(dd),nx=dx/d,ny=dy/d,ov=(r-d)*.5;
      A1.x-=nx*ov/w;A1.y-=ny*ov/h;B1.x+=nx*ov/w;B1.y+=ny*ov/h;
      const dv=(A1.vx-B1.vx)*w*nx+(A1.vy-B1.vy)*h*ny;
      if(dv>0){A1.vx-=dv*nx/w;A1.vy-=dv*ny/h;B1.vx+=dv*nx/w;B1.vy+=dv*ny/h;
        if(a.p.effects&&flash++<2&&Math.random()<.12)st.effects.push({type:'collision',x:(A1.x+B1.x)/2,y:(A1.y+B1.y)/2,age:0})}}}
  for(const e of st.effects)e.age+=dt;
  st.effects=st.effects.filter(e=>e.age<(e.type==='reaction'?.6:.28));
}

/* ---------- perturbation de l'équilibre (proposition A) ---------- */
function perturb(a,kind,amt){
  const m=st.model;if(!m)return;
  const ci=a.tab,c=m.c,sp=a.p[pid(ci,'pEsp')]??0,n=CH.amounts(c,m.n0,m.x),n2=n.slice();let V2=m.V,label='';
  if(kind==='add'){n2[sp]+=amt;label='+ '+fm.sig(amt,2)+' mmol '+c.species[sp]}
  else if(kind==='remove'){n2[sp]=Math.max(0,n2[sp]-amt);label='− '+fm.sig(amt,2)+' mmol '+c.species[sp]}
  else if(kind==='v2'){V2=Math.min(100,m.V*2);label='volume × 2'}
  else if(kind==='v12'){V2=Math.max(.001,m.V/2);label='volume ÷ 2'}
  else label='repart d\'ici';
  if(V2===m.V&&(kind==='v2'||kind==='v12')){a.toast('Volume limité à 0.001–100 L.');return}
  if(n2.some(v=>v>c.max*3)){a.toast('Quantité trop grande pour le réacteur.');return}
  /* nouveau segment : la courbe continue, le temps local repart de 0 */
  const tAbs=st.t0+m.t,nm=CH.create(m.id,n2,V2,m.K);
  /* particules : on ajuste les effectifs de chaque espèce, sans tout redessiner */
  const nq=st.quantum;
  for(let s=0;s<n2.length;s++){
    const want=Math.round(n2[s]/nq),have=st.particles.filter(p=>p.s===s);
    if(have.length>want){for(const p of have.slice(0,have.length-want)){const i=st.particles.indexOf(p);if(i>=0)st.particles.splice(i,1)}}
    st.model=nm;for(let j=have.length;j<want;j++)st.particles.push(makeParticle(s));
  }
  st.model=nm;arrangeSolids();
  st.t0=tAbs;st.visualX=0;st.cycle=0;st.sample=0;
  st.history.push({t:tAbs,n:n2.slice()});st.marks.push({t:tAbs,label});
  st.n0run=n2.slice();st.logQ0=CH.logQ(c,n2,V2);
  st.ymax=Math.max(st.ymax,niceMax(Math.max(...n2,...nm.eq.n)));
  st.question='Perturbation : '+label+'. Comparer Q à K° : dans quel sens le système évolue-t-il ?';
  a.refresh();
}

/* ---------- état et mesures ---------- */
function statut(a){
  const m=st.model,n=CH.amounts(m.c,m.n0,m.x),gap=Math.abs(m.eq.x-m.x)/m.ref;
  const bnd=m.id==='chaux'&&m.eq.boundary,lq=CH.logQ(m.c,n,m.V);
  const near=bnd?gap<1e-8:Number.isFinite(lq)&&Math.abs(lq-Math.log(m.K))<.01;
  if(m.t===0)return'Prévoir, puis observer';
  if(CH.rates(m).every(r=>r===0)&&!bnd)return'Aucune évolution pour ce mélange';
  if(near){
    if(bnd)return m.eq.n[0]<1e-8?'Calcaire épuisé':'Une phase ou un réactif est épuisé';
    if(m.id==='pcl5'&&m.n0[0]>0&&m.eq.x>=0)return'Équilibre : conversion finale '+fm.fix(100*m.eq.x/m.n0[0],2)+' %';
    return'Équilibre dynamique : les réactions continuent';
  }
  return m.eq.x>0?'Évolution dans le sens direct':'Évolution dans le sens indirect';
}

/* ---------- le réacteur ---------- */
function mol(a,p,x,y,alpha){
  const m=st.model,c=m.c,atoms=c.atoms[p.s],S=a.S,C=a.C,col=spCol(C)[p.s],k=a.k,unit=1.15*k,r=5.1*unit,cnt=atoms.length;
  if(p.solid){const side=11*unit;return`<rect x="${(x-side/2).toFixed(1)}" y="${(y-side/2).toFixed(1)}" width="${side.toFixed(1)}" height="${side.toFixed(1)}" rx="2" fill="${col}" stroke="${C.card}" stroke-width="1" opacity="${alpha.toFixed(2)}"/>`}
  const co=[];
  if(cnt===1)co.push([0,0]);else if(cnt===2)co.push([-r*.77,0],[r*.77,0]);else if(cnt===3)co.push([0,0],[-r*1.3,-r*.8],[r*1.3,-r*.8]);
  else if(cnt===4){co.push([0,0]);for(let j=0;j<3;j++)co.push([Math.cos(j*2.094)*r*1.7,Math.sin(j*2.094)*r*1.7])}
  else if(cnt===5)co.push([-r,0],[r,0],[-r*1.5,-r*1.5],[r*1.6,-r*1.25],[r*1.8,r*.9]);
  else co.push([-r*.8,0],[-r*1.7,-r],[-r*1.7,r],[r*.8,0],[r*1.7,-r],[r*1.7,r]);
  let s=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" opacity="${alpha.toFixed(2)}"><g transform="rotate(${(p.angle*180/Math.PI).toFixed(0)})">`;
  for(let j=1;j<co.length;j++){const b=(cnt===6&&m.id==='no2'&&j>3)?co[3]:co[0];s+=`<line x1="${b[0].toFixed(1)}" y1="${b[1].toFixed(1)}" x2="${co[j][0].toFixed(1)}" y2="${co[j][1].toFixed(1)}" stroke="${col}" stroke-width="${(2*k).toFixed(1)}" opacity=".7"/>`}
  co.forEach(([cx,cy],j)=>{s+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="${ATOM[atoms[j]]||col}" stroke="${C.dark?'#12232c88':'#ffffffcc'}" stroke-width="1"/>`});
  s+='</g>';
  const ring=(cnt===1?7:cnt===2?11:cnt<5?15:18)*unit;
  s+=`<circle r="${ring.toFixed(1)}" fill="none" stroke="${col}" stroke-width="${(1.25*k).toFixed(2)}" opacity=".75"${p.s===1?` stroke-dasharray="${(5*k).toFixed(1)} ${(2*k).toFixed(1)}"`:p.s===2?` stroke-dasharray="${(1.5*k).toFixed(1)} ${(2.5*k).toFixed(1)}"`:''}/>`;
  if(a.p.names)s+=S.text(0,-(cnt<3?15:22)*unit,uS(c.species[p.s]),{anchor:'middle',size:13,c:C.ink,weight:600});
  return s+'</g>';
}
function drawReactor(a){

  const mp=p=>[12+p.x*(w-24),9+p.y*(h-18)];

  for(const e of st.effects)if(e.type==='reaction'&&e.age<.18){const t=Math.min(1,e.age/.18);for(const g of e.ghosts){const q=mp({x:g.x+(e.x-g.x)*t,y:g.y+(e.y-g.y)*t});o+=mol(a,g,q[0],q[1],1-t)}}
  for(const p of st.particles){const q=mp(p);o+=mol(a,p,q[0],q[1],Math.min(1,p.age/.18))}

}

  const now={t:tNow,n:CH.amounts(m.c,m.n0,m.x)},all=st.history.at(-1).t===now.t?st.history:[...st.history,now];

  if(m.t===0&&st.history.length<2)o+=S.text(G.x0+G.w/2,G.y0+G.h*.45,'Lecture pour tracer les courbes',{anchor:'middle',size:14,c:C.ink2});
  /* sonde de lecture */
  if(st.probe!==null){
    const t=clamp(st.probe,tmin,tNow),pt=all.reduce((b,q)=>Math.abs(q.t-t)<Math.abs(b.t-t)?q:b,all[0]),x=G.X(pt.t);
    o+=S.line(x,G.y0,x,G.y0+G.h,{c:C.ink2,w:1,dash:`${3*k} ${4*k}`});
    const lines=[`t = ${fm.fix(pt.t,2)} u.a.`].concat(m.c.species.map((s,i)=>`${uS(s)} : ${fm.sig(pt.n[i],3).replace(/<sup>(.*?)<\/sup>/g,(_,e)=>S.sup(e))} mmol`));
    const lh=19*k,bw=Math.min(200,G.w-12)*Math.max(1,k*.85),bh=lines.length*lh+10*k,bx=clamp(x+10*k,G.x0+4,G.x0+G.w-bw-4),by=G.y0+6*k;
    o+=S.rect(bx,by,bw,bh,{fill:C.card,c:C.rule,w:1,rx:8,fop:.94});
    lines.forEach((l,i)=>{o+=S.text(bx+9*k,by+10*k+i*lh,l,{size:13.5,c:i?cols[i-1]:C.ink,halo:false,weight:i?500:400})});
  }
  a.svg('courbes',o);
}

/* ---------- axe logarithmique de Qr ---------- */
function drawQuot(a){
  const P=a.panels.quot,S=a.S,C=a.C,k=a.k,m=st.model,w=P.w,h=P.h,cols=spCol(C);
  const n=CH.amounts(m.c,m.n0,m.x),cur=CH.logQ(m.c,n,m.V),sc=CH.quotientScale(st.logQ0,Math.log(m.K),CH.logQ(m.c,m.eq.n,m.V),cur);
  const left=34,right=w-34,X=p=>left+p*(right-left),axisY=Math.max(34*k,h*.42);
  let o=S.line(left,axisY,right,axisY,{c:C.ink2,w:2})+S.line(right,axisY,right-6,axisY-4,{c:C.ink2,w:2})+S.line(right,axisY,right-6,axisY+4,{c:C.ink2,w:2});
  o+=S.text(left,axisY-12*k,'0',{anchor:'middle',size:13,c:C.ink2,halo:false})+S.text(right,axisY-12*k,'∞',{anchor:'middle',size:13,c:C.ink2,halo:false});
  const stride=Math.max(1,Math.ceil((sc.hi-sc.lo)/Math.max(3,Math.floor(w/80))));
  for(let e=sc.lo;e<=sc.hi;e+=stride){const x=X(.08+.84*(e-sc.lo)/(sc.hi-sc.lo));o+=S.line(x,axisY-4,x,axisY+4,{c:C.ink2,w:1})+S.text(x,axisY-12*k,'10'+S.sup(String(e).replace('-','−')),{anchor:'middle',size:13,c:C.ink2,halo:false})}
  const lab=(txt,x,y,c,size=14)=>S.text(clamp(x,34,w-34),y,txt,{anchor:'middle',size,c,weight:600});
  const kx=X(sc.equilibrium);
  o+=S.line(kx,axisY-6,kx,axisY+16*k,{c:C.c,w:2.2})+lab('K°',kx,axisY+Math.min(32,h*.33)*k,C.cInk);
  if(sc.initial!==null){const x=X(sc.initial);o+=S.line(x,axisY+5,x,h-24*k,{c:C.ink2,w:1,dash:`${2*k} ${3*k}`})+S.circle(x,axisY,5*k,{fill:C.card,c:C.ink2,w:1.5})+lab('Q'+subT('0'),x,h-12*k,C.ink2)}
  if(sc.current!==null){const x=X(sc.current),clipped=Number.isFinite(cur)&&(cur/Math.LN10<sc.lo||cur/Math.LN10>sc.hi);
    o+=S.line(x,axisY-6,x,18*k,{c:cols[0],w:1.5})+S.circle(x,axisY,5.5*k,{fill:cols[0]})+lab(clipped?'Q (hors plage)':'Q',x,12*k,cols[0])}
  else o+=lab('Q non défini (0 / 0)',w/2,12*k,C.ink2);
  a.svg('quot',o);
}

/* ---------- mesures, légende, temps ---------- */
function info(a){
  const m=st.model,p=a.p,c=m.c,n=CH.amounts(c,m.n0,m.x),Mv=Mh.v,arr=[];
  const cur=CH.logQ(c,n,m.V),disp=v=>Number.isNaN(v)?'non défini':v===-Infinity?'0':v===Infinity?'∞':fm.sig(Math.exp(v),3);
  arr.push({label:`Quotient ${Mv('Q')}`,value:disp(cur),hint:`K° = ${fm.sig(m.K,3)} · ${Mv('Q','0')} = ${disp(st.logQ0)}`});
  arr.push({label:`Avancement ${Mv('ξ')}`,value:fm.sig(m.x,3),unit:'mmol'});
  {const xmax=Math.min(...c.nu.map((v,i)=>v<0?st.n0run[i]/(-v):Infinity));arr.push({label:`Taux d'avancement ${Mv('τ')} = ${Mv('ξ')} / ${Mv('ξ','max')}`,value:Number.isFinite(xmax)&&xmax>0&&m.x>=0?fm.fix(m.x/xmax,3):'—',unit:'sans unité',hint:Number.isFinite(xmax)&&xmax>0?`${Mv('ξ','max')} = ${fm.sig(xmax,3)} mmol`:undefined})}
  if(c.phase!=='solution'){const gas=c.solids?n[2]:n.reduce((x,y)=>x+y,0),P=gas*.001*CH.R*c.T/m.V;arr.push({label:c.solids?`Pression ${Mv('P','CO₂')}`:'Pression',value:fm.sig(P,3),unit:'bar',hint:c.solids?'coexistence : 0.358 bar':(m.id==='hi'?'constante dans ce modèle':'varie avec la quantité de gaz')})}
  const[f,b]=CH.rates(m),r=Math.max(f,b,1e-20);
  arr.push({label:'Vitesses relatives (directe | indirecte)',value:`${fm.fix(f/r*100,0)} | ${fm.fix(b/r*100,0)}`,unit:'%'});
  a.metrics(arr);
  const col=spCol(a.C);
  a.legend(c.species.map((s,i)=>({c:col[i],label:uH(s),dash:i===1,dot:i===2})));
  a.clock(`t = ${fm.fix(st.t0+m.t,2)} u.a. · ${statut(a)}`);
}

/* ---------- interactions : particule, sonde ---------- */
function pick(a,x,y){
  const P=a.panels.reactor,w=P.w,h=P.h;let best=null,bd=22*a.k;
  for(const p of st.particles){if(p.solid)continue;const d=Math.hypot(12+p.x*(w-24)-x,9+p.y*(h-18)-y);if(d<bd){bd=d;best=p}}
  return best;
}
A.drag('reactor',{
  hit:(x,y)=>!!st.model&&!!pick(A,x,y),
  start:(x,y)=>{st.drag=pick(A,x,y)},
  move:(x,y)=>{const p=st.drag;if(!p)return;const P=A.panels.reactor;p.x=clamp((x-12)/(P.w-24),.035,.965);p.y=clamp((y-9)/(P.h-18),.045,st.model.id==='chaux'?.68:.96);p.vx=p.vy=0},
  end:()=>{const p=st.drag;if(p){p.vx=(Math.random()-.5)*.19;p.vy=(Math.random()-.5)*.19}st.drag=null}
});
A.drag('courbes',{
  hit:(x,y)=>{const G=st.G;return !!G&&x>=G.x0&&x<=G.x0+G.w&&y>=G.y0&&y<=G.y0+G.h},
  start:(x)=>{st.probe=st.G.xv(x)},move:(x)=>{st.probe=st.G.xv(x)},end:()=>{}
});

</script>
