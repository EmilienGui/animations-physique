/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));

    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);

  },
  sci(x,n=2){

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;

}

  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);

    },

    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},

        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;

    if(metrics._h!==html){metrics.innerHTML=html;metrics._h=html}
  };
  A.insight=()=>{};
  A.legend=arr=>{const html=(arr||[]).filter(Boolean).map(l=>`<span><i class="${l.dash?'dash':l.dot?'dot':''}" style="background:${l.c};--lc:${l.c}"></i>${l.label}</span>`).join('');if(legend._h!==html){legend.innerHTML=html;legend._h=html}};
  A.clock=html=>{const c=$('.ak-clock',tr);if(c._h!==html){c.innerHTML=html;c._h=html}};
  A.toast=m=>{toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastEl._h);toastEl._h=setTimeout(()=>toastEl.classList.remove('show'),1800)};
  A.panelVisible=id=>!A.panels[id].el.hidden;

  /* ---------- tailles ---------- */
  function viewBox(P){
    const {w,h,vx,vy,vz}=P;
    P.node.setAttribute('viewBox',P.vue==='svg'?`${vx.toFixed(2)} ${vy.toFixed(2)} ${(w/vz).toFixed(2)} ${(h/vz).toFixed(2)}`:`0 0 ${w.toFixed(1)} ${h.toFixed(1)}`);
  }
  function measure(){
    A.narrow=ak.clientWidth<=640; ak.style.setProperty('--ak-top',(top.offsetHeight+(tabs?tabs.offsetHeight:0))+'px');
    if(A.narrow){if(metricsWrap.parentNode!==right||right.lastElementChild!==metricsWrap)right.append(metricsWrap)}
    else{if(metricsWrap.parentNode!==right||right.firstElementChild!==metricsWrap)right.insertBefore(metricsWrap,side)}
    A.k=ak.classList.contains('is-proj')?1.6:A.narrow?1:1.15;
    for(const P of Object.values(A.panels)){
      if(P.el.hidden)continue;
      if(A.narrow){const w=P.el.clientWidth||ak.clientWidth;P.node.style.height=Math.round(w*(P.cfg.ratioTel??.8))+'px'}else P.node.style.height='';
      const r=P.node.getBoundingClientRect(); P.w=Math.max(50,r.width); P.h=Math.max(50,r.height);
      if(P.type==='canvas'){const d=window.devicePixelRatio||1;if(P.node.width!==Math.round(P.w*d)||P.node.height!==Math.round(P.h*d)){P.node.width=Math.round(P.w*d);P.node.height=Math.round(P.h*d)}P.ctx=P.node.getContext('2d');P.ctx.setTransform(d,0,0,d,0,0)}
      else viewBox(P);
    }
  }
  /* ---------- rendu ---------- */
  let graphPanels=[];
  const activeChartView=P=>P?.vue==='graphe'&&zoomed(P)?P:null;
  function drawFrame(){
    const frame={graphs:[],views:graphPanels.map(activeChartView),outputs:new Map()};
    A._graphFrame=frame;
    try{cfg.draw?.(A)}finally{A._graphFrame=null}
    graphPanels=[];
    for(const [P,output] of frame.outputs){
      const graphs=[...output.html.matchAll(/<g data-ak-graph="(\d+)">/g)].map(m=>frame.graphs[+m[1]]).filter(Boolean);
      output.graphs=graphs;
      if(P.vue==='svg'||P.vue==='graphe'){
        const vue=graphs.length?'graphe':'svg';
        if(vue!==P.vue){P.vue=vue;resetView(P);viewBox(P)}
        P.graphs=graphs;
      }
      const view=activeChartView(P);
      for(const graph of graphs){
        graphPanels[graph.id]=P;
        if(graph.view!==view)frame.changed=true;
      }
    }
    return frame;
  }
  function clipCharts(node,graphs){
    const svgElement=tag=>document.createElementNS(node.namespaceURI,tag);
    for(const graph of graphs){
      const axes=node.querySelector(`[data-ak-graph="${graph.id}"]`);
      if(!axes)continue;
      const id='ak-cadre-'+graph.id, defs=svgElement('defs'),clip=svgElement('clipPath'),rect=svgElement('rect');
      clip.id=id;
      for(const [k,v] of Object.entries({x:graph.x0,y:graph.y0,width:graph.w,height:graph.h}))rect.setAttribute(k,v);
      clip.append(rect);defs.append(clip);axes.append(defs);
      let layer=null;
      for(let next=axes.nextElementSibling;next&&!next.hasAttribute('data-ak-graph');){
        const child=next;next=child.nextElementSibling;
        if(child.localName==='defs'||child.hasAttribute('data-ak-hors-graphe')){layer=null;continue}
        if(!layer){
          layer=svgElement('g');
          layer.setAttribute('clip-path',`url(#${id})`);
          child.before(layer);
        }
        layer.append(child);
      }
    }
  }
  function writeSvg(P,html,graphs=[]){
    if(P.node._h===html)return;
    P.node.innerHTML=html;
    P.node._h=html;
    if(activeChartView(P))clipCharts(P.node,graphs);
  }
  A.renderNow=()=>{
    A._dirty=false;measure();
    let frame=drawFrame();
    if(frame.changed)frame=drawFrame();
    for(const [P,output] of frame.outputs)writeSvg(P,output.html,output.graphs);
    syncScrub();guardScroll();
  };
  A.render=()=>{if(A._dirty)return;A._dirty=true;requestAnimationFrame(()=>{if(A._dirty)A.renderNow()})};
  A.svg=(id,html)=>{
    const P=A.panels[id];if(!P)return;
    if(A._graphFrame)A._graphFrame.outputs.set(P,{html});
    else writeSvg(P,html);
  };

  /* ---------- temps ---------- */
  let last=0;
  const playBtn=$('.ak-play',tr);
  A.play=on=>{on=on===undefined?!A.running:on;if(on&&cfg.peutLire&&!cfg.peutLire(A))on=false;A.running=on;playBtn.textContent=on?'❚❚ Pause':'▶ Lecture';if(on){last=performance.now();requestAnimationFrame(loop)}};
  function loop(now){if(!A.running)return;const dt=Math.min(.05,(now-last)/1000)*A.speed;last=now;if(cfg.step)cfg.step(A,dt);A.renderNow();requestAnimationFrame(loop)}
  A.stepOnce=()=>{A.play(false);if(cfg.step)cfg.step(A,cfg.pas??1/24);A.render()};
  A.reset=()=>{A.play(false);A.t=0;if(cfg.reset)cfg.reset(A);A.render()};
  $('.ak-speed',tr).onchange=e=>{A.speed=+e.target.value};A.speed=cfg.vitesse||1;

  /* ---------- onglets ---------- */
  A.setTab=i=>{if(!tabs||i<0||i>=cfg.onglets.length)return;A.play(false);A.tab=i;A.cadrerTout();clearActivePresets();$$('.ak-tab',tabs).forEach((b,j)=>b.setAttribute('aria-selected',String(j===i)));if(cfg.onglet)cfg.onglet(A,i);refreshSettings();A.render()};

  /* ---------- thème, projection, plein écran ---------- */
  A.setTheme=t=>{root.dataset.theme=t;writeStore(THEME_KEY,t);readColors();syncMenu();A.renderNow()};
  A.setProj=on=>{
    ak.classList.toggle('is-proj',on);
    ak.classList.remove('drawer-open');
    projButton.classList.toggle('on',on);
    syncMenu();
    A.render();
  };
  const acts={
    play:()=>A.play(),step:()=>A.stepOnce(),reset:()=>A.reset(),
    help:()=>{dlg.showModal()},theme:()=>A.setTheme(root.dataset.theme==='dark'?'light':'dark'),
    image:()=>A.exportImage(),proj:()=>{
      const projected=ak.classList.contains('is-proj');
      A.setProj(!projected);
      if(cfg.menuCommun&&projected&&A.narrow)ak.classList.add('drawer-open');
    },
    fs:()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>A.toast('Plein écran refusé par le navigateur'))},
    settings:()=>{ak.classList.toggle('drawer-open');A.render()}
  };
  ak.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&acts[b.dataset.act])acts[b.dataset.act]()});
  addEventListener('keydown',e=>{
    if(dlg.open||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.target.matches('input,select,textarea'))return;
    const k=e.key.toLowerCase(), custom=cfg.touches&&cfg.touches[k];
    if(custom){e.preventDefault();custom(A);A.render();return}
    if(k===' '&&!tr.hidden){e.preventDefault();acts.play()}
    else if(k==='arrowright'&&!tr.hidden){e.preventDefault();acts.step()}
    else if(k==='r'&&!tr.hidden)acts.reset();
    else if(k==='h'||k==='?')acts.help();else if(k==='p')acts.proj();else if(k==='f')acts.fs();else if(k==='t')acts.theme();else if(k==='i')acts.image();
    else if(k==='+'||k==='='||k==='-'||k==='0'){const P=(A._hover&&!A._hover.el.hidden&&A._hover.vue)?A._hover:Object.values(A.panels).find(q=>q.vue&&!q.el.hidden);if(P){e.preventDefault();if(k==='0')A.cadrer(P);else A.zoomer(P,k==='-'?.8:1.25)}}
    else if(k==='escape'){ak.classList.remove('drawer-open');A.render()}
    else if(/^[1-9]$/.test(k))A.setTab(+k-1);
  });

  /* ---------- vue : zoom, cadrage, déplacement ---------- */
  const deplacable=P=>P.vue==='svg'||P.vue==='graphe';
  function zoomed(P){
    if(P.vue==='interne')return Math.abs(P.zoom-1)>1e-6;
    if(!deplacable(P))return false;
    const seuil=P.vue==='graphe'?1e-6:.5;
    return Math.abs(P.vz-1)>1e-6||Math.abs(P.vx)>seuil||Math.abs(P.vy)>seuil;
  }
  const markZoom=P=>{if(P.tools)P.tools.classList.toggle('is-zoomed',zoomed(P))};
  const graphAt=(P,x,y)=>P.graphs.find(g=>x>=g.x0&&x<=g.x0+g.w&&y>=g.y0&&y<=g.y0+g.h);
  function resetView(P){P.vz=1;P.vx=P.vy=0;P.zoom=1;P.panX=P.panY=0;markZoom(P)}
  A.zoomer=(P,f,px,py)=>{if(typeof P==='string')P=A.panels[P];if(!P||!P.vue)return;
    if(P.vue==='interne')P.zoom=Math.max(.4,Math.min(5,P.zoom*f));
    else{
      if(P.vue==='graphe'){
        const graph=graphAt(P,px,py);
        px=graph?(px-graph.x0)/graph.w:.5;
        py=graph?(py-graph.y0)/graph.h:.5;
      }else{px=px??P.w/2;py=py??P.h/2}
      const z=Math.max(.5,Math.min(8,P.vz*f)), delta=1/P.vz-1/z;
      P.vx+=px*delta;P.vy+=py*delta;P.vz=z;
    }
    markZoom(P);A.render()};
  A.deplacer=(P,dx,dy,px,py)=>{
    if(!deplacable(P))return;
    if(P.vue==='graphe'){const g=graphAt(P,px,py)||P.graphs[0];dx/=g.w;dy/=g.h}
    P.vx-=dx/P.vz;P.vy-=dy/P.vz;markZoom(P);A.render()
  };
  A.cadrer=P=>{if(typeof P==='string')P=A.panels[P];if(!P)return;resetView(P);A.render()};
  A.cadrerTout=()=>{for(const P of Object.values(A.panels))A.cadrer(P)};

  function wire(P){const N=P.node,pts=new Map();let mode=null,h=null,last=null,pin=null;
    const scr=e=>{const r=N.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    const toV=s=>P.vue==='svg'?[P.vx+s[0]/P.vz,P.vy+s[1]/P.vz]:s;
    const two=()=>{const[a,b]=[...pts.values()];return{d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,c:[(a[0]+b[0])/2,(a[1]+b[1])/2]}};
    N.addEventListener('pointerdown',e=>{
      const s=scr(e);A._hover=P;pts.set(e.pointerId,s);
      if(pts.size===2&&P.vue){if(mode==='drag'&&h&&h.end)h.end(e);mode='pinch';h=null;pin=two();N.setPointerCapture(e.pointerId);e.preventDefault();return}
      if(pts.size>1)return;
      const[x,y]=toV(s);
      if(deplacable(P)&&(e.shiftKey||e.button===1))mode='pan';
      else{h=P._drags.find(d=>!d.hit||d.hit(x,y,e))||null;
        if(h){mode='drag';if(h.start)h.start(x,y,e)}
        else if(deplacable(P)&&zoomed(P))mode='pan';
        else{mode=null;return}}
      last=s;N.setPointerCapture(e.pointerId);e.preventDefault();A.render()});
    N.addEventListener('pointermove',e=>{const s=scr(e);
      if(!pts.has(e.pointerId)){if(e.pointerType==='mouse'){const[x,y]=toV(s);N.style.cursor=P._drags.some(d=>d.hit&&d.hit(x,y,e))?'grab':(deplacable(P)&&(e.shiftKey||zoomed(P)))?'move':''}return}
      pts.set(e.pointerId,s);
      if(mode==='pinch'&&pts.size>=2){const q=two();A.zoomer(P,q.d/pin.d,q.c[0],q.c[1]);A.deplacer(P,q.c[0]-pin.c[0],q.c[1]-pin.c[1],q.c[0],q.c[1]);pin=q;return}
      if(mode==='pan'){A.deplacer(P,s[0]-last[0],s[1]-last[1],last[0],last[1]);last=s;return}
      if(mode==='drag'&&h){const[x,y]=toV(s);h.move(x,y,e);A.render()}});
    const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
      if(mode==='drag'&&h&&h.end)h.end(e);
      if(pts.size===0){mode=null;h=null}else if(mode==='pinch'){mode='pan';last=[...pts.values()][0]}
      A.render()};
    N.addEventListener('pointerup',end);N.addEventListener('pointercancel',end);
    if(P.vue){
      N.addEventListener('wheel',e=>{if(A.narrow&&!e.ctrlKey)return;e.preventDefault();const s=scr(e);A.zoomer(P,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),s[0],s[1])},{passive:false});
      N.addEventListener('dblclick',e=>{const[x,y]=toV(scr(e));if(!P._drags.some(d=>d.hit&&d.hit(x,y,e))&&zoomed(P))A.cadrer(P)});
      N.addEventListener('pointerenter',()=>{A._hover=P});
    }
  }
  for(const P of Object.values(A.panels))wire(P);
  A.drag=(id,h)=>{A.panels[id]._drags.push(h)};

  /* ---------- export image (toujours en thème clair) ---------- */
  A.exportImage=async()=>{
    const was=root.dataset.theme; root.dataset.theme='light'; readColors(); A.renderNow();
    const vis=Object.values(A.panels).filter(P=>!P.el.hidden), base=pwrap.getBoundingClientRect(), sc=2;
    const cv=document.createElement('canvas'); cv.width=Math.round(base.width*sc); cv.height=Math.round(base.height*sc);
    const ctx=cv.getContext('2d'); ctx.fillStyle=A.C.card; ctx.fillRect(0,0,cv.width,cv.height);
    const jobs=vis.map(P=>new Promise(res=>{const r=P.node.getBoundingClientRect(), x=(r.left-base.left)*sc, y=(r.top-base.top)*sc;
      if(P.type==='canvas'){ctx.drawImage(P.node,x,y,r.width*sc,r.height*sc);res();return}
      const clone=P.node.cloneNode(true); clone.setAttribute('width',r.width); clone.setAttribute('height',r.height);
      const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
      const im=new Image(); im.onload=()=>{ctx.drawImage(im,x,y,r.width*sc,r.height*sc);res()}; im.onerror=()=>res(); im.src=src;}));
    await Promise.all(jobs);
    root.dataset.theme=was; readColors(); A.renderNow();
    const a=document.createElement('a'); const tabName=cfg.onglets&&cfg.onglets.length>1?'_'+(A.tab+1):'';
    a.download=`${cfg.code}_${(cfg.fichier||cfg.titre).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_')}${tabName}.png`;
    a.href=cv.toDataURL('image/png'); a.click(); A.toast('Image enregistrée (thème clair)');
  };

  /* ---------- aide ---------- */
  function buildHelp(){
    const h=cfg.aide||{}, sec=(t,c)=>c?`<h4>${t}</h4>${/^\s*</.test(c)?c:`<p>${c}</p>`}`:'';
    dlg.innerHTML=`<header><h3>Aide · ${cfg.titre}</h3><button class="mini" data-close>Fermer ✕</button></header><div class="db">
    ${cfg.sousTitre?`<p class="ak-dlg-sub">${cfg.sousTitre}</p>`:''}${sec('Ce qu\'on voit',h.voit)}${sec('Ce qu\'on peut faire',h.faire)}${sec('Modèle et hypothèses',h.modele)}${sec('Lien avec le cours',h.cours)}${sec('Pour aller plus loin',h.plus)}
    <h4>Raccourcis</h4><p>${cfg.temps?'<kbd>Espace</kbd> lecture / pause · <kbd>→</kbd> pas à pas · <kbd>R</kbd> recommencer · ':''}${tabs?`<kbd>1</kbd>–<kbd>${cfg.onglets.length}</kbd> onglets · `:''}<kbd>P</kbd> projection · <kbd>F</kbd> plein écran · <kbd>T</kbd> thème · <kbd>I</kbd> image · <kbd>H</kbd> aide${h.touches?' · '+h.touches:''}</p>
    <p>Vue : molette, pincement ou <kbd>+</kbd> <kbd>−</kbd> pour zoomer · <kbd>Maj</kbd> + glisser, deux doigts, ou glisser une vue zoomée pour la déplacer · « Cadrer », <kbd>0</kbd> ou double clic : vue initiale · Double-clic sur un curseur : valeur par défaut.</p>
    ${h.credits?`<h4>Crédits</h4><p>${h.credits}</p>`:''}</div>`;
    dlg.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===dlg)dlg.close()});
  }

  /* ---------- démarrage ---------- */
  buildSettings(); buildHelp(); readColors();
  if(cfg.init)cfg.init(A);
  refreshSettings(); A.reset();
  new ResizeObserver(()=>A.render()).observe(ak);
  return A;
}

window.AnimKit={app,fmt,M,ticks,niceStep,FONT,MATH,interrupteur};
})();

<script>
'use strict';
/* =====================================================================
   TH3 MP · A2 « N particules à deux niveaux » : physique
   Notations du cours : niveaux E_1 = −ε (fondamental) et E_2 = +ε, x = ε / k_B T, τ = k_B T / ε,
   p_1 = e^x / (2 ch x), p_2 = e^(−x) / (2 ch x), ⟨E⟩ = −ε th x, σ_E = ε / ch x,
   C = N k_B x² / ch² x, σ_tot² = k_B T² C.

   Aucune dynamique : chaque tirage place N particules indépendantes sur les deux niveaux
   (probabilité p_2 pour l'état excité). Le nombre N_2 de particules excitées suit exactement la loi
   binomiale B(N, p_2) ; il est tiré particule par particule pour l'échantillon dessiné, puis
   directement dans la loi binomiale pour le reste (inversion pour N p petit, algorithme BTRS de
   Hörmann sinon). E_tot = ε (2 N_2 − N).
   ===================================================================== */
const TH3Deux = (() => {
  const kB = 1.380649e-23, muB = 9.2740100783e-24, mup = 1.41060679e-26;

  /* ---------- générateur pseudo-aléatoire reproductible (xorshift32) ---------- */
  function rng(seed) {
    let s = (seed | 0) || 1;
    const next = () => {s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296;};
    const unif = () => {let u = next(); while (u <= 1e-12) u = next(); return u;};
    return {unif, next};
  }

  /* ---------- loi du système à deux niveaux ---------- */
  const xcap = x => Math.min(x, 300);
  const p2of = x => 1 / (1 + Math.exp(2 * xcap(x)));
  function law(x) {
    const p2 = p2of(x), p1 = 1 - p2, t = Math.tanh(x), c = Math.cosh(xcap(x));
    return {x, p1, p2, e: -t, sigE: 1 / c, C: x * x / (c * c),
      ratio: t === 0 ? Infinity : 1 / (c * Math.abs(t)),        // σ_E / |⟨E⟩|, énergie comptée depuis 0
      ratioFond: 1 / (2 * p2 * c)};                             // σ_E / ⟨E − E_1⟩, énergie comptée depuis le fondamental
  }

  /* ---------- log-gamma (Stirling avec décalage) ---------- */
  function lgamma(z) {
    let shift = 0;
    while (z < 10) {shift += Math.log(z); z += 1;}
    const z2 = z * z;
    return (z - .5) * Math.log(z) - z + .9189385332046727 + 1 / (12 * z) - 1 / (360 * z * z2) + 1 / (1260 * z2 * z2 * z) - shift;
  }
  const lfact = n => lgamma(n + 1);

  /* ---------- loi binomiale ---------- */
  function binomSmall(n, p, r) {            // inversion séquentielle, p ≤ 1/2, n p < 10
    const q = 1 - p, s = p / q;
    let f = Math.pow(q, n), u = r.unif(), x = 0;
    while (u > f && x < n) {u -= f; x++; f *= (n - x + 1) / x * s;}
    return x;
  }
  function binomBTRS(n, p, r) {             // Hörmann 1993, p ≤ 1/2, n p ≥ 10
    const spq = Math.sqrt(n * p * (1 - p)), b = 1.15 + 2.53 * spq, a = -.0873 + .0248 * b + .01 * p, c = n * p + .5;
    const alpha = (2.83 + 5.1 / b) * spq, vr = .92 - 4.2 / b, lpq = Math.log(p / (1 - p));
    const m = Math.floor((n + 1) * p), h = lfact(m) + lfact(n - m);
    for (;;) {
      const u = r.next() - .5, v = r.next(), us = .5 - Math.abs(u);
      if (us <= 0) continue;
      const k = Math.floor((2 * a / us + b) * u + c);
      if (k < 0 || k > n) continue;
      if (us >= .07 && v <= vr) return k;
      if (v <= 0) continue;
      const w = Math.log(v * alpha / (a / (us * us) + b));
      if (w <= h - lfact(k) - lfact(n - k) + (k - m) * lpq) return k;
    }
  }
  function binom(n, p, r) {
    if (n <= 0 || p <= 0) return 0;
    if (p >= 1) return n;
    if (p > .5) return n - binom(n, 1 - p, r);
    return n * p < 10 ? binomSmall(n, p, r) : binomBTRS(n, p, r);
  }
  /** probabilité exacte P(N_2 = j) */
  function pmf(n, p, j) {
    if (j < 0 || j > n) return 0;
    if (p <= 0) return j === 0 ? 1 : 0;
    if (p >= 1) return j === n ? 1 : 0;
    return Math.exp(lfact(n) - lfact(j) - lfact(n - j) + j * Math.log(p) + (n - j) * Math.log(1 - p));

      g1 += S.circle(G1.X(q.tau), G1.Y(1 - q.p2), 4.2 * k, {fill: C.cold, c: C.card, w: 1}) + S.circle(G1.X(q.tau), G1.Y(q.p2), 4.2 * k, {fill: C.hot, c: C.card, w: 1}) + S.circle(G1.X(q.tau), G1.Y(q.e), 4.2 * k, {fill: C.v, c: C.card, w: 1});
    }
    g1 += S.line(G1.X(tau), G1.y0, G1.X(tau), G1.y0 + G1.h, {c: C.B, w: 1.8, dash: '7 5'}) + S.circle(G1.X(tau), G1.y0 + 12 * k, 7 * k, {fill: C.B, c: C.card, w: 1.6});
    if (live) g1 += S.circle(G1.X(tau), G1.Y(1 - live.p2), 6.5 * k, {c: C.cold, w: 2.2}) + S.circle(G1.X(tau), G1.Y(live.p2), 6.5 * k, {c: C.hot, w: 2.2}) + S.circle(G1.X(tau), G1.Y(live.e), 6.5 * k, {c: C.v, w: 2.2});
    out += G1.svg + clipped(S, G1, 'th3a2-g1', g1);
    /* capacité thermique C / (N k_B) */
    const G2 = S.graph(gOpts(a, Z.g[1], {xmin: 0, xmax: 4, ymin: 0, ymax: .5, xticks: [0, 1, 2, 3, 4], yticks: [0, .1, .2, .3, .4, .5], xfmt: fx1,
      xlab: S.v('k', 'B') + S.v('T') + ' / ' + S.v('ε'), ylab: S.v('C') + ' / (' + S.v('N') + S.v('k', 'B') + ')  mesurée par ' + S.v('σ', 'tot') + S.sup('2') + ' / (' + S.v('k', 'B') + S.v('T') + S.sup('2') + ')'}));
    let g2 = '';
    if (p.prevision) {
      g2 += S.curve(th(l => l.C), G2, {c: C.ink, w: 2.4});
      g2 += S.line(G2.X(.8336), G2.Y(0), G2.X(.8336), G2.Y(.4392), {c: C.ink2, w: 1.3, dash: '5 5'}) + S.circle(G2.X(.8336), G2.Y(.4392), 4.5 * k, {fill: C.ink});
      g2 += S.line(G2.X(.8336), G2.Y(.4392), G2.X(1.45), G2.Y(.47), {c: C.ink2, w: 1.2}) + lab(a, G2.X(1.5), G2.Y(.47), 'anomalie de Schottky', {c: C.ink, weight: 650});
    }
    for (const q of pts2) g2 += errBar(S, G2, q.tau, q.C, q.err, C.B) + S.circle(G2.X(q.tau), G2.Y(q.C), 4.4 * k, {fill: C.B, c: C.card, w: 1});
    g2 += S.line(G2.X(tau), G2.y0, G2.X(tau), G2.y0 + G2.h, {c: C.B, w: 1.8, dash: '7 5'});
    if (live) g2 += errBar(S, G2, tau, live.C, live.err, C.hot) + S.circle(G2.X(tau), G2.Y(live.C), 7 * k, {fill: C.hot, c: C.card, w: 1.8});
    out += G2.svg + clipped(S, G2, 'th3a2-g2', g2);
    frame2 = {G1, G2};
    a.svg('scene', out);
    a.clock('tirages : ' + s.n + ' · k<sub>B</sub>T = ' + fmt.fix(tau, 2) + ' ε');
    lg.push({c: C.B, dot: true, label: 'points relevés (C par les fluctuations)'}, live ? {c: C.hot, dot: true, label: 'série en cours'} : null);
    a.legend(lg);
    const m = [];
    if (live) m.push({label: 'C / (N k<sub>B</sub>) mesuré par σ<sub>tot</sub>² / (k<sub>B</sub>T²)', value: fmt.sig(live.C, 3) + ' ± ' + fmt.sig(live.err, 1), hint: 'sur ' + s.n + ' tirages'});
    if (p.valeurs) m.push({label: 'C / (N k<sub>B</sub>) calculé = x² / ch² x', value: fmt.sig(L.C, 3), hint: 'x = ε / k<sub>B</sub>T = ' + fmt.sig(1 / tau, 3)},
      {label: 'Énergie moyenne calculée −th x', value: fmt.sig(L.e, 3)},
      {label: 'Maximum de C (Schottky)', value: '0.439', hint: 'pour k<sub>B</sub>T = 0.834 ε'});
    a.metrics(m);
  }

  /* ---------- onglet 3 : paramagnétisme ---------- */
  function drawSpins(a, R, s, v) {
    const {S, C, k, fmt} = a;
    const strip = Math.round(R.w * .30), n = s.nShow, gx = R.x + strip, gw = R.w - strip - 8 * k, top = 34 * k, bottom = 26 * k, h = Math.max(30, R.h - top - bottom);
    const cols = Math.max(1, Math.round(Math.sqrt(n * gw / h))), rows = Math.ceil(n / cols), cell = Math.min(gw / cols, h / rows, 26 * k);
    const x0 = gx + (gw - cols * cell) / 2, y0 = R.y + top + (h - rows * cell) / 2, len = cell * .62;
    let out = lab(a, gx + gw / 2, R.y + 15 * k, s.N > n ? 'échantillon de ' + n + ' spins sur ' + S.v('N') + ' = ' + sci(S, s.N) : S.v('N') + ' = ' + s.N + ' spins', {anchor: 'middle', c: C.ink, weight: 650});
    for (let i = 0; i < n; i++) {
      const cx = x0 + (i % cols + .5) * cell, cy = y0 + (Math.floor(i / cols) + .5) * cell;
      if (s.n === 0) out += S.circle(cx, cy, cell * .12, {fill: C.ink2, op: .5});
      else out += s.sites[i] ? S.arrow(cx, cy - len / 2, cx, cy + len / 2, {c: C.hot, w: 1.7}) : S.arrow(cx, cy + len / 2, cx, cy - len / 2, {c: C.cold, w: 1.7});
    }
    /* champ B et moment total ℳ, dans la bande de gauche */
    const yb = R.y + R.h - 30 * k, hmax = R.h - 96 * k, xB = R.x + strip * .30, xM = R.x + strip * .74;
    out += S.arrow(xB, yb, xB, yb - hmax, {c: C.ink, w: 2.6});
    out += lab(a, R.x + 6 * k, yb - hmax - 16 * k, S.v('B') + ' = ' + fmt.sig(a.p.B, 2) + ' T', {c: C.ink, weight: 650});
    out += lab(a, xB, yb + 14 * k, S.v('B'), {anchor: 'middle', c: C.ink, weight: 650});
    out += S.line(xM - 14 * k, yb, xM + 14 * k, yb, {c: C.ink2, w: 1, dash: '4 4'});
    out += S.arrow(xM, yb, xM, yb - v * hmax, {c: C.c, w: 3.4});
    out += lab(a, xM, yb + 14 * k, S.v('ℳ'), {anchor: 'middle', c: C.cInk, weight: 650});
    return out;
  }

  function draw2(a) {
    const {S, C, k, fmt} = a, p = a.p, P = a.panels.scene, W = P.w, H = P.h, s = ensure(a, 2), N = s.N;
    const x = xOf(a, 2), th = Math.tanh(x), vv = valeur3(a, s, x), Z = zones(a, W, H, 1);
    let out = drawSpins(a, Z.schema, s, s.n > 0 ? Math.max(-1, Math.min(1, vv.v)) : 0);
    const G = S.graph(gOpts(a, Z.g[0], {xmin: 0, xmax: 5, ymin: -.3, ymax: 1.12, xticks: [0, 1, 2, 3, 4, 5], yticks: [0, .5, 1], xfmt: fx1, yfmt: fx1,
      xlab: S.v('x') + ' = ' + S.v('μ') + S.v('B') + ' / (' + S.v('k', 'B') + S.v('T') + ')',
      ylab: '⟨' + S.v('μ', 'z') + '⟩ / ' + S.v('μ') + ' = ' + S.v('ℳ') + ' / (' + S.v('N') + S.v('μ') + ')'}));
    let g = '';
    const lg = [{c: C.hot, dot: true, label: 'moment ↓ (état excité +ε)'}, {c: C.cold, dot: true, label: 'moment ↑ (état fondamental −ε)'}, {c: C.B, dot: true, label: 'points relevés'}];
    if (p.prevision) {
      g += S.curve(Array.from({length: 201}, (_, i) => [5 * i / 200, Math.tanh(5 * i / 200)]), G, {c: C.ink, w: 2.6});
      g += S.curve([[0, 0], [1.4, 1.4]], G, {c: C.F, w: 2, dash: '7 5'}) + S.line(G.X(0), G.Y(1), G.X(5), G.Y(1), {c: C.ink2, w: 1.4, dash: '3 5'});
      g += lab(a, G.X(.78), G.Y(.3), 'loi de Curie : ℳ / (Nμ) = x', {c: C.F, weight: 650}) + lab(a, G.X(4.9), G.Y(1) - 12 * k, 'saturation', {c: C.ink2, anchor: 'end'});
      lg.push({c: C.ink, label: 'th x'}, {c: C.F, dash: true, label: 'loi de Curie : ℳ / (Nμ) = x'});
    }
    const mark = (px, v, e, r, o) => {
      const xx = Math.min(px, 5);
      return errBar(S, G, xx, v, e, o.c) + S.circle(G.X(xx), G.Y(v), r, o) + (px > 5 ? lab(a, G.X(5) - 8 * k, G.Y(v) + 18 * k, 'x = ' + sci(S, px) + ' →', {anchor: 'end', c: C.ink2}) : '');
    };
    for (const q of pts3) g += mark(q.x, q.v, q.err, 5 * k, {fill: C.B, c: C.B, w: 1});
    if (s.n > 0) g += mark(x, vv.v, vv.err, 7.5 * k, {fill: C.c, c: C.card, w: 1.8});
    out += G.svg + clipped(S, G, 'th3a2-g3', g);
    a.svg('scene', out);
    a.clock('tirages : ' + s.n);
    lg.push(s.n > 0 ? {c: C.c, dot: true, label: p.moy ? 'moyenne des tirages (± incertitude)' : 'dernier tirage (± fluctuation attendue)'} : null);
    a.legend(lg);
    const m = [{label: 'x = μB / k<sub>B</sub>T', value: fmt.sig(x, 3)}];
    if (s.n > 0) m.push({label: '⟨μ<sub>z</sub>⟩ / μ mesuré', value: fmt.sig(vv.v, 2) + ' ± ' + fmt.sig(vv.err, 1), hint: p.moy ? 'moyenne sur ' + s.n + ' tirages' : 'un seul tirage'});
    if (p.valeurs) {
      m.push({label: '⟨μ<sub>z</sub>⟩ / μ calculé = th x', value: fmt.sig(th, 3), hint: 'Curie : x = ' + fmt.sig(x, 3)},
        {label: 'N pour que le signal égale le bruit', value: fmt.sci(1 / (th * th), 2), hint: 'bruit statistique : 1 / √N'},
        {label: 'Moment total ℳ calculé', value: fmt.sci(N * mu(a) * th, 2), unit: 'A·m²'});
    }
    a.metrics(m);
  }

  /* ---------- relevés et tirages groupés ---------- */
  function releve(a) {
    const s = ensure(a, a.tab);
    if (a.tab === 0) {
      const r = ratioMes(s, a.p.origine);
      if (r) pts1.push({N: s.N, r}); else a.toast('Faire au moins 20 tirages');
    } else if (a.tab === 1) {
      if (s.n >= 30) pts2.push(pointT(s, a.p.tau2)); else a.toast('Faire au moins 30 tirages');
    } else if (s.n > 0) {
      const x = xOf(a, 2), vv = valeur3(a, s, x);
      pts3.push({x, v: vv.v, err: vv.err});
    } else a.toast('Faire d’abord un tirage');
  }
  const groupe = n => ({label: n === 1 ? 'Un tirage' : n + ' tirages', action: a => tirer(a, a.tab, n)});
  const effacer = a => {(a.tab === 0 ? pts1 : a.tab === 1 ? pts2 : pts3).length = 0;};

  AnimKit.app({
    code: 'TH3', partie: 'OrangeBrule', titre: 'N particules à deux niveaux',
    titreFenetre: 'N particules à deux niveaux · TH3 · MP',
    menuCommun: true, fichier: 'Particules_Deux_Niveaux',
    onglets: ['Fluctuations', 'Énergie et capacité thermique', 'Paramagnétisme'],
    panneaux: [{id: 'scene', titre: '', poids: 1, ratioTel: 1.75}],
    temps: true, pas: 1 / BASE, vitesses: [.25, .5, 1, 2, 5, 20], vitesse: 1,
    step(a, dt) {
      carry += dt * BASE;
      const n = Math.floor(carry);
      carry -= n;
      if (n > 0) tirer(a, a.tab, n);
    },
    reset(a) {build(a, a.tab); carry = 0;},
    change(a, id) {
      if (id === 'N1' || id === 'tau1') E[0] = null;
      if (id === 'tau1' || id === 'origine') pts1.length = 0;
      if (id === 'N2' || id === 'tau2') E[1] = null;
      if (id === 'moment' || id === 'B' || id === 'T3' || id === 'N3') E[2] = null;
    },
    onglet(a) {ensure(a, a.tab); carry = 0;},
    reglages: [
      {titre: 'Situations', onglets: [0], presets: [
        {label: 'N = 10', valeurs: {N1: 10}, lecture: true},
        {label: 'N = 100', valeurs: {N1: 100}, lecture: true},
        {label: 'N = 10⁴', valeurs: {N1: 10000}, lecture: true},
        {label: 'Basse température', valeurs: {tau1: .3}, lecture: true},
        {label: 'Haute température', valeurs: {tau1: 5}, lecture: true}
      ]},
      {titre: 'Situations', onglets: [1], presets: [
        {label: 'Basse température', valeurs: {tau2: .3}, lecture: true},
        {label: 'Maximum de C', valeurs: {tau2: .83}, lecture: true},
        {label: 'k_BT = ε', valeurs: {tau2: 1}, lecture: true},
        {label: 'Haute température', valeurs: {tau2: 3}, lecture: true},
        {label: 'N = 100 (bruité)', valeurs: {N2: 100}, lecture: true},
        {label: 'N = 1000', valeurs: {N2: 1000}, lecture: true}
      ]},
      {titre: 'Situations', onglets: [2], presets: [
        {label: 'Électron, 1.5 K, 5 T (saturation)', valeurs: {moment: 'e', B: 5, T3: 1.5, N3: 400, moy: false}, lecture: true},
        {label: 'Électron, 300 K, 1 T (Curie)', valeurs: {moment: 'e', B: 1, T3: 300, N3: 1e6, moy: true}, lecture: true},
        {label: 'Proton, 310 K, 1.5 T (IRM)', valeurs: {moment: 'p', B: 1.5, T3: 310, N3: 1e6, moy: true}, lecture: true}
      ]},
      {titre: 'Système et température', onglets: [0], items: [
        {id: 'N1', type: 'range', label: 'Nombre de particules N', min: 1, max: 10000, step: 'any', log: true, dec: 0, value: 10},
        {id: 'tau1', type: 'range', label: 'Température k<sub>B</sub>T / ε', min: .1, max: 10, step: 'any', log: true, dec: 2, value: 1},
        {id: 'origine', type: 'check', label: 'Énergie comptée depuis le fondamental', value: false},
        {type: 'note', html: 'Si ⟨E<sub>tot</sub>⟩ est proche de 0 (haute température), la fluctuation relative diverge : on compte alors l’énergie depuis l’état fondamental.'}
      ]},
      {titre: 'Système et température', onglets: [1], items: [
        {id: 'N2', type: 'range', label: 'Nombre de particules N', min: 10, max: 10000, step: 'any', log: true, dec: 0, value: 1000},
        {id: 'tau2', type: 'range', label: 'Température k<sub>B</sub>T / ε', min: .1, max: 4, step: 'any', log: true, dec: 2, value: 1},
        {type: 'note', html: 'Le repère bleu peut aussi être glissé sur l’un des deux graphes. Le balayage place 30 points, chacun sur 2000 tirages.'}
      ]},
      {titre: 'Cristal paramagnétique', onglets: [2], items: [
        {id: 'moment', type: 'seg', label: 'Moment magnétique', options: [['e', 'Électron (μ<sub>B</sub>)'], ['p', 'Proton (μ<sub>p</sub>)']], value: 'e'},
        {id: 'B', type: 'range', label: 'Champ magnétique B', min: .01, max: 20, step: 'any', log: true, dec: 2, value: 2, unit: 'T'},
        {id: 'T3', type: 'range', label: 'Température T', min: .1, max: 1000, step: 'any', log: true, dec: 2, value: 1.5, unit: 'K'},
        {id: 'N3', type: 'range', label: 'Nombre de spins N', min: 10, max: 1e6, step: 'any', log: true, dec: 0, value: 400},
        {id: 'moy', type: 'check', label: 'Moyenner sur les tirages', value: false},
        {type: 'note', html: 'μ<sub>B</sub> = 9.27 × 10<sup>−24</sup> J·T<sup>−1</sup> ; μ<sub>p</sub> = 1.41 × 10<sup>−26</sup> J·T<sup>−1</sup>. Seuls 400 spins sont dessinés : les autres sont tirés dans la même loi.'}
      ]},
      {titre: 'Tirages et relevés', items: [
        {type: 'boutons', items: [groupe(1), groupe(100), groupe(1000)]},
        {type: 'boutons', items: [{label: 'Relever ce point', action: releve}, {label: 'Effacer les points', action: effacer}]}
      ]},
      {titre: 'Balayages', onglets: [0], items: [
        {type: 'boutons', items: [{label: 'Balayage en N (13 points)', action: balayageN}]}
      ]},
      {titre: 'Balayages', onglets: [1], items: [
        {type: 'boutons', items: [{label: 'Balayage en température (30 points)', action: balayageT}]}
      ]},
      {titre: 'Affichage', items: [
        {id: 'prevision', type: 'check', label: 'Afficher les prévisions', value: false},
        {id: 'valeurs', type: 'check', label: 'Afficher les valeurs calculées', value: false}
      ]}
    ],
    aide: {
      voit: '<ul><li><b>Fluctuations.</b> N particules indépendantes, à l’équilibre avec un thermostat, occupent chacune l’un des deux niveaux −ε ou +ε avec la loi de Boltzmann. Chaque tirage donne une énergie totale E<sub>tot</sub> ; l’histogramme rassemble les tirages successifs, en fonction de E<sub>tot</sub>/(Nε). Le graphe du bas place les points σ<sub>tot</sub>/|⟨E<sub>tot</sub>⟩| mesurés en fonction de N, en échelles logarithmiques.</li><li><b>Énergie et capacité thermique.</b> La capacité thermique C est mesurée par la variance de l’énergie sur les tirages, d’après σ<sub>tot</sub>² = k<sub>B</sub>T²C. Les points mesurés dessinent l’anomalie de Schottky.</li><li><b>Paramagnétisme.</b> Chaque spin ½ a un moment μ<sub>z</sub> = ±μ dans le champ B. La moyenne ⟨μ<sub>z</sub>⟩/μ mesurée se place sur la courbe th x avec x = μB/k<sub>B</sub>T, quels que soient B, T et μ.</li></ul>',
      faire: '<p>Fluctuations : choisir « N = 10 » et lancer la lecture ; l’histogramme est large (27 % pour k<sub>B</sub>T = ε). Cliquer « Relever ce point » après quelques centaines de tirages, puis recommencer avec « N = 100 » et « N = 10⁴ ». Le « Balayage en N » place les 13 points d’un coup. Avant d’afficher les prévisions, estimer la pente de la droite. Avec « Haute température », la fluctuation relative diverge : cocher « Énergie comptée depuis le fondamental ».</p><p>Énergie et capacité thermique : lancer « k<sub>B</sub>T = ε », relever, puis glisser le repère bleu. Le « Balayage en température » place 30 points ; chercher le maximum de C avant d’afficher la courbe prévue. Comparer avec « N = 100 » : les points sont plus dispersés.</p><p>Paramagnétisme : « Électron, 1.5 K, 5 T » donne la saturation. « Électron, 300 K, 1 T » donne le régime de Curie : le signal (2.2 × 10<sup>−3</sup>) est comparable au bruit pour N = 10<sup>6</sup>, il faut moyenner. « Proton, 310 K, 1.5 T » : l’excès de 5 × 10<sup>−6</sup> n’est visible que pour N ≳ 10<sup>11</sup> ; une IRM compte 10<sup>22</sup> protons par millilitre.</p>',
      modele: '<p>Aucune dynamique : chaque tirage place N particules indépendantes. Chacune est dans l’état excité avec la probabilité p<sub>2</sub> = e<sup>−x</sup>/(2 ch x), x = ε/k<sub>B</sub>T. Le nombre de particules excitées suit exactement la loi binomiale B(N, p<sub>2</sub>) ; E<sub>tot</sub> = ε (2N<sub>2</sub> − N). Les particules dessinées sont tirées une à une ; les autres sont tirées directement dans la loi binomiale.</p><p>La capacité thermique mesurée est C = σ<sub>tot</sub>²/(k<sub>B</sub>T²), avec σ<sub>tot</sub> écart-type de E<sub>tot</sub> sur les tirages ; son incertitude relative est de l’ordre de √(2/n) pour n tirages. Calculs : ⟨E<sub>tot</sub>⟩ = −Nε th x, C = N k<sub>B</sub> x²/ch² x, maximum 0.439 N k<sub>B</sub> pour k<sub>B</sub>T = 0.834 ε.</p><p>Paramagnétisme : ε = μB ; le niveau fondamental est celui du moment aligné avec le champ. L’incertitude affichée est celle d’un tirage, √(1 − th² x)/√N, ou celle de la moyenne sur n tirages.</p>',
      cours: 'TH3 MP, II.3 « Système de N particules indépendantes » (expérience de cours E2), II.4 « Système à deux niveaux » (capacité thermique, fluctuations) et II.5 « Paramagnétisme et loi de Curie ».'
    },
    init(a) {
      a.drag('scene', {
        hit: (x, y) => {
          if (a.tab !== 1 || !frame2) return false;
          const {G1, G2} = frame2;
          if (y < G1.y0 - 6 || y > G2.y0 + G2.h || Math.abs(x - G1.X(a.p.tau2)) > 18) return false;
          drag2 = {G: y < G2.y0 - 10 ? G1 : G2};
          return true;
        },
        start: () => {},
        move: x => {
          const t = Math.min(4, Math.max(.1, drag2.G.xv(x)));
          a.set('tau2', t);
        }
      });
    },
    draw(a) {
      if (a.tab === 0) draw0(a); else if (a.tab === 1) draw1(a); else draw2(a);
    }
  });
})();

</script>
