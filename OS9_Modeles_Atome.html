const MINUS='−';

/* ---------------- nombres : point décimal, vrai signe moins ---------------- */

  /** n chiffres significatifs, sans notation exponentielle */
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));

    let s=(+x.toFixed(d)).toFixed(d);

  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';

/* ---------------- graduations ---------------- */
function niceStep(range,n){

/* ---------------- mathématiques en HTML ---------------- */
const M={
  v:(s,sub,sup)=>`<span class="m">${s}</span>${sub!==undefined?`<sub>${sub}</sub>`:''}${sup!==undefined?`<sup>${sup}</sup>`:''}`,
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt"><span class="sym">√</span><span class="rad">${x}</span></span>`,
  vec:s=>`<span class="vec">${s}</span>`
};

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}
      return s;
    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const X=v=>x0+(v-o.xmin)/(o.xmax-o.xmin)*w, Y=v=>y0+h-(v-o.ymin)/(o.ymax-o.ymin)*h;
      let s='';
      const xt=o.xticks||ticks(o.xmin,o.xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5)))), yt=o.yticks||ticks(o.ymin,o.ymax,o.ny??Math.max(1,Math.round(h/(fs*3))));
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      const yAx=o.ymin<=0&&o.ymax>=0&&o.zeroAxis!==false?Y(0):y0+h, xAx=x0;
      s+=`<line x1="${n(x0)}" y1="${n(yAx)}" x2="${n(x0+w)}" y2="${n(yAx)}" stroke="${C0.ink2}" stroke-width="1.2"/><line x1="${n(xAx)}" y1="${n(y0)}" x2="${n(xAx)}" y2="${n(y0+h)}" stroke="${C0.ink2}" stroke-width="1.2"/>`;
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>o.xmin+(px-x0)/w*(o.xmax-o.xmin),yv:py=>o.ymin+(y0+h-py)/h*(o.ymax-o.ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){
      let d='',pen=false;
      for(const[x,y]of pts){if(!isFinite(y)||!isFinite(x)){pen=false;continue}
        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}
      return`<g clip-path="url(#${G.clip||''})">`+S.path(d,o)+'</g>';
    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}
  };
  return S;
}

/* ===================================================================== */
function app(cfg){
  const A={cfg,p:{},tab:0,t:0,running:false,speed:1,k:1,narrow:false,C:{},fmt,M,panels:{},_dirty:false};
  A.S=makeS(A);
  const root=document.documentElement;
  root.dataset.theme='dark';
  if(cfg.partie)root.style.setProperty('--chap',`var(--${cfg.partie})`);
  document.title=cfg.titreFenetre||`${cfg.titre} · ${cfg.code} · MPSI`;

  /* ---------- structure ---------- */
  const ak=el('div',{class:'ak',id:'ak'});
  const top=el('header',{class:'ak-top'});
  top.innerHTML=`<span class="ak-badge">${cfg.code}</span><div class="ak-titles"><h1 class="ak-title">${cfg.titre}</h1></div>
  <nav class="ak-tools" aria-label="Outils">
   <button class="ib ak-btn-settings" data-act="settings" title="Réglages">${IC.settings}<span class="ak-lbl">Réglages</span></button>
   <button class="ib" data-act="help" title="Aide (H)">${IC.help}<span class="ak-lbl">Aide</span></button>
   <button class="ib" data-act="theme" title="Thème clair / sombre (T)">${IC.theme}<span class="ak-lbl">Thème</span></button>
   <button class="ib" data-act="image" title="Enregistrer l'image (I)">${IC.image}<span class="ak-lbl">Image</span></button>
   <button class="ib" data-act="proj" title="Mode projection (P)">${IC.proj}<span class="ak-lbl">Projection</span></button>
   <button class="ib" data-act="fs" title="Plein écran (F)">${IC.fs}</button>
  </nav>`;
  ak.append(top);
  const tabs=cfg.onglets&&cfg.onglets.length>1?el('div',{class:'ak-tabs',role:'tablist'}):null;
  if(tabs){cfg.onglets.forEach((t,i)=>{const b=el('button',{class:'ak-tab',role:'tab','aria-selected':String(i===0),'data-tab':i},`<b>${i+1}</b>${t}`);b.onclick=()=>A.setTab(i);tabs.append(b)});ak.append(tabs)}
  const body=el('div',{class:'ak-body'}); ak.append(body);
  const main=el('main',{class:'ak-main'}); body.append(main);
  const scene=el('section',{class:'ak-card ak-scene'}); main.append(scene);
  /* disposition « atelier » (7 novembre 2026, facultative : cfg.atelier) :
     saisie à gauche ; résultat, graphique et détail du calcul à droite ; pas de colonne de réglages */
  A.zones={};
  if(cfg.atelier){
    const at=typeof cfg.atelier==='object'?cfg.atelier:{};
    ak.classList.add('ak-atelier');
    const left=el('section',{class:'ak-card ak-saisie'},`<div class="ak-zone-h">${at.saisie||'Mes mesures'}</div>`);
    A.zones.saisie=el('div',{class:'ak-saisie-body'}); left.append(A.zones.saisie);
    A.zones.resultat=el('section',{class:'ak-card ak-res','aria-live':'polite'});
    const det=el('details',{class:'ak-card ak-detail'},`<summary>${at.detail||'Voir le calcul'}</summary>`);
    A.zones.detail=el('div',{class:'ak-detail-body'}); det.append(A.zones.detail);
    body.insertBefore(left,main); main.insertBefore(A.zones.resultat,scene); main.append(det);
  }
  const pwrap=el('div',{class:'ak-panels'}); scene.append(pwrap);
  for(const pc of (cfg.panneaux||[{id:'scene'}])){
    const pe=el('div',{class:'ak-panel','data-id':pc.id}); pe.style.flex=`${pc.poids||1} 1 0`;
    if(pc.titre)pe.append(el('div',{class:'ak-phead'},pc.titre));
    const type=pc.type||'svg';
    const node=type==='canvas'?el('canvas'):document.createElementNS('http://www.w3.org/2000/svg','svg');
    if(type!=='canvas'){node.setAttribute('xmlns','http://www.w3.org/2000/svg');node.setAttribute('role','img');node.setAttribute('aria-label',pc.titre||cfg.titre)}
    pe.append(node);
    const P={id:pc.id,cfg:pc,el:pe,node,type,w:300,h:200,zoom:1,panX:0,panY:0,vz:1,vx:0,vy:0,_drags:[],head:pe.querySelector('.ak-phead')};
    /* Vue (7 novembre 2026) : tout panneau SVG se zoome, se cadre et se déplace (viewBox) ;
       un canvas déclaré zoom:true garde son zoom interne P.zoom, lu par l'animation. */
    P.vue=type!=='canvas'?(pc.zoom===false?null:'svg'):(pc.zoom?'interne':null);
    if(P.vue){const tl=el('div',{class:'ak-ptools'});tl.innerHTML='<button class="mini" data-z="-" title="Dézoomer (−)">−</button><button class="mini" data-z="0" title="Cadrer : vue initiale (0)">Cadrer</button><button class="mini" data-z="+" title="Zoomer (+)">+</button>';
      tl.onclick=e=>{const z=e.target.closest('[data-z]');if(!z)return;const v=z.dataset.z;if(v==='0')A.cadrer(P);else A.zoomer(P,v==='+'?1.25:.8)};P.tools=tl;pe.append(tl)}
    A.panels[pc.id]=P; pwrap.append(pe);
  }
  /* légende : bande fine entre la scène et la barre de lecture (6 novembre 2026) */
  const legend=el('div',{class:'ak-legend'}); scene.append(legend);
  const tr=el('div',{class:'ak-transport'});
  tr.innerHTML=`<button class="ib ak-play" data-act="play" title="Lecture / pause (Espace)">▶ Lecture</button>
   <button class="ib" data-act="step" title="Pas à pas (→)">${IC.step}<span class="ak-lbl">Pas</span></button>
   <button class="ib" data-act="reset" title="Recommencer (R)">${IC.reset}<span class="ak-lbl">Recommencer</span></button>
   <select class="ak-speed" title="Vitesse de lecture">${(cfg.vitesses||[.25,.5,1,2,4]).map(v=>`<option value="${v}"${v===(cfg.vitesse||1)?' selected':''}>× ${v}</option>`).join('')}</select>
   <input type="range" class="ak-scrub" min="0" max="1" step="any" value="0" aria-label="Curseur temporel" hidden><span class="ak-extra"></span><span class="ak-clock"></span>`;
  scene.append(tr);
  /* colonne de droite (6 novembre 2026) : réglages qui défilent, mesures en bas des réglages
     (sur téléphone, les mesures restent sous la scène) */
  const right=el('div',{class:'ak-right'}); body.append(right);
  const metrics=el('section',{class:'ak-metrics','aria-label':'Mesures'});
  const side=el('aside',{class:'ak-side','aria-label':'Réglages'});
  side.innerHTML='<div class="ak-drawer-head"><span>Réglages</span><button class="mini" data-act="settings">Fermer ✕</button></div>';
  right.append(side);
  /* pied de page supprimé le 6 novembre 2026 */
  const dlg=el('dialog',{class:'ak-dialog'}); const toastEl=el('div',{class:'ak-toast'});
  document.body.append(ak,dlg,toastEl);
  A.root=ak; A.extra=$('.ak-extra',tr);
  /* curseur temporel (facultatif) : cfg.curseur = {max:(a)=>…, get:(a)=>…, set:(a,v)=>…} */
  const scrub=$('.ak-scrub',tr);
  if(cfg.curseur){scrub.hidden=false;scrub.oninput=()=>{A.play(false);cfg.curseur.set(A,+scrub.value*cfg.curseur.max(A));A.render()}}
  const syncScrub=()=>{if(!cfg.curseur||document.activeElement===scrub)return;const m=cfg.curseur.max(A)||1;scrub.value=Math.max(0,Math.min(1,cfg.curseur.get(A)/m))};

  /* ---------- couleurs ---------- */
  function readColors(){
    const cs=getComputedStyle(ak), g=v=>cs.getPropertyValue(v).trim();
    const rgb=s=>{s=s.trim();if(s[0]==='#'){if(s.length===4)s='#'+[...s.slice(1)].map(x=>x+x).join('');return[1,3,5].map(i=>parseInt(s.slice(i,i+2),16))}return s.match(/[\d.]+/g).slice(0,3).map(Number)};
    const mix=(a,b,t)=>'rgb('+a.map((v,i)=>Math.round(v*t+b[i]*(1-t))).join(',')+')';
    const dark=root.dataset.theme==='dark', base=rgb(getComputedStyle(root).getPropertyValue('--'+(cfg.partie||'Anthracite')));
    const c=mix(base,base,1), cInk=dark?mix(base,[255,255,255],.5):mix(base,[0,0,0],.7), cSoft=dark?mix(base,rgb(g('--card')),.22):mix(base,rgb(g('--paper')),.1);
    A.C={paper:g('--paper'),card:g('--card'),ink:g('--ink'),ink2:g('--ink2'),rule:g('--rule'),grid:g('--grid'),c,cInk,cSoft,
      v:g('--q-v'),F:g('--q-F'),B:g('--q-B'),E:g('--q-E'),Ec:g('--q-Ec'),Ep:g('--q-Ep'),Em:g('--q-Em'),pred:g('--q-pred'),hot:g('--q-hot'),cold:g('--q-cold'),
      dark:root.dataset.theme==='dark'};
  }

  /* ---------- réglages ---------- */
  const items={}; const groups=[];
  function stepDec(st){const s=String(st);return s.includes('.')?s.split('.')[1].length:0}
  function buildSettings(){
    (cfg.reglages||[]).forEach(gc=>{
      const g=el('div',{class:'ak-card ak-grp'}); const h=el('h4',{},`<span></span>${gc.titre}`); g.append(h);
      groups.push({gc,el:g,h});
      if(gc.presets){const pr=el('div',{class:'ak-presets'});gc.presets.forEach(ps=>{const b=el('button',{class:'mini',title:ps.titre||''},ps.label);b.onclick=()=>A.preset(ps);ps._btn=b;pr.append(b)});g.append(pr)}
      for(const it of gc.items||[]){
        const box=el('div',{class:'ak-item'}); const type=it.type||'range';
        if(type==='range'){
          const dec=it.dec??stepDec(it.step??1);
          box.innerHTML=`<div class="ak-row"><label for="r_${it.id}">${it.label}</label><input class="ak-num" id="n_${it.id}" type="number" step="${it.step??1}" min="${it.min}" max="${it.max}" inputmode="decimal"><span class="ak-unit">${it.unit||''}</span></div><input type="range" id="r_${it.id}" min="${it.log?Math.log10(it.min):it.min}" max="${it.log?Math.log10(it.max):it.max}" step="${it.log?(it.stepLog??.002):(it.step??1)}">`;
          const R=$('input[type=range]',box), N=$('.ak-num',box);

'use strict';
const QA=(()=>{
  /* ---- orbitales : densité volumique |ψ|² au point (x,z) du plan y = 0, et loi radiale P(r) ---- */
  const ORB={
    '1s':{label:'1s · fondamentale',n:1,l:0,ext:4,rmax:8,axis:null},
    '2s':{label:'2s · nœud radial',n:2,l:0,ext:12,rmax:22,axis:null},
    '2pz':{label:'2p<sub>z</sub> · plan nodal z = 0',n:2,l:1,ext:12,rmax:22,axis:2},
    '2px':{label:'2p<sub>x</sub> · plan nodal x = 0',n:2,l:1,ext:12,rmax:22,axis:0},
    '3pz':{label:'3p<sub>z</sub> · un nœud radial et un plan nodal',n:3,l:1,ext:32,rmax:48,axis:2}
  };

  function sample(state,rng=Math.random){
    const o=ORB[state];let r;

  }

  const A_RUTH=79*2*1.43996455/(2*5);          // fm (5 MeV)

    M.push({label:'Observé',value:f.big?F.sci(f.N/f.big,2):'—',hint:'Geiger et Marsden (1909) : environ une sur 8 000'});}
  if(i===3){const r=Math.cbrt(1-(p.radiation?st.f:0)),tc=Q.classicalCollapse(Q.a0);
    M.push({label:'Rayon '+Mh.v('r'),value:lenTxt(Q.a0*r*1e15)});
    M.push({label:'Énergie mécanique '+Mh.v('ℰ'),value:F.sig(-Q.k/(2*Q.a0*r)/Q.e,3),unit:'eV'});
    M.push({label:'Temps classique extrapolé',value:F.sci(tc,2),unit:'s',hint:'durée de vie de 2p dans H : 1.6 × 10⁻⁹ s'});}
  if(i===4){const n=+p.n;
    M.push({label:st.ionized?'Énergie cinétique de l’électron':'Énergie du niveau '+Mh.v('ℰ','n'),value:F.sig(st.ionized?st.kin:E_n(n),3),unit:'eV'});
    const ev=st.ev;
    if(ev&&ev.kind!=='test')M.push({label:'Photon ('+ev.ni+' → '+ev.nf+')',value:F.sig(Math.abs(ev.delta),3),unit:'eV',hint:'λ = '+F.sig(ev.lambda*1e9,4)+' nm'});
    else{const t=Q.transition(n,+p.destination);if(n!==+p.destination&&!st.ionized)M.push({label:'Transition choisie',value:F.sig(t.lambda*1e9,4),unit:'nm',hint:Math.abs(t.delta).toFixed(2)+' eV'})}
    M.push({label:'Test d’absorption',value:F.sig(p.photon,3),unit:'eV',hint:'résonance à ±0.025 eV près'});}
  if(i===5){const N=Math.sqrt(p.rho);
    M.push({label:'Longueurs d’onde sur un tour',value:F.sig(N,3)});
    M.push({label:'Moment cinétique '+Mh.v('ℒ'),value:F.sig(N,3),unit:'ℏ'});
    M.push({label:'Décalage de phase',value:F.fix((N-Math.round(N))*360,1),unit:'°'});}
  if(i===6){const o=QA.ORB[p.orbital];
    M.push({label:'Énergie '+Mh.v('ℰ'),value:F.sig(E_n(o.n),3),unit:'eV'});
    M.push({label:'Moment cinétique orbital',value:o.l?'√2 ℏ':'0'});
    M.push({label:'Positions mesurées',value:String(st.pts.length)});}
  a.metrics(M);
}
/* ================================================================ dessin */
function draw(a){
  const i=a.tab,ps=a.panels.scene,pg=a.panels.graphes;
  try{const sc=document.querySelector('.ak-scrub');if(sc)sc.hidden=!(i===3||i===4)}catch(e){}
  let sceneS,graphS,L=[];
  const C=a.C;
  if(i===0){sceneS=sceneThomson(a,ps);graphS=graphsAlpha(a,pg);L=[{c:C.B,label:'Thomson'},{c:C.F,label:'Rutherford'}]}
  else if(i===1){sceneS=sceneRuth(a,ps);graphS=graphsAlpha(a,pg);L=[{c:C.F,label:'trajectoire de l’α'},{c:C.c,label:'noyau'}]}
  else if(i===2){sceneS=sceneFoil(a,ps);graphS=graphsFoil(a,pg);L=[{c:C.c,label:'α détectées'},a.p.prev?{c:C.F,dash:true,label:'prévision (une seule diffusion)'}:null]}
  else if(i===3){sceneS=sceneClassic(a,ps);graphS=graphsClassic(a,pg);L=[{c:C.c,label:'ℰ(t)'},a.p.prev?{c:C.pred,dash:true,label:'évolution prévue'}:null]}
  else if(i===4){sceneS=sceneBohr(a,ps);graphS=graphsBohr(a,pg);L=[{c:C.F,label:'émission'},{c:C.B,label:'absorption'}]}
  else if(i===5){sceneS=sceneBroglie(a,ps);graphS=graphsBroglie(a,pg);L=[{c:C.B,label:'point de départ'},{c:C.F,label:'point d’arrivée'},a.p.prev&&a.p.cst?{c:C.F,dash:true,label:'λ constante (erreur)'}:null]}
  else{sceneS=sceneOrbital(a,ps);graphS=graphsOrbital(a,pg);L=[{c:C.F,label:'histogramme des rayons mesurés'},a.p.prev?{c:C.c,label:'P(r)'}:null]}
  a.svg('scene',sceneS);a.svg('graphes',graphS);
  a.legend(L);metrics(a);
  const ev=st.ev;
  a.clock(i===3?'t / t<sub>classique</sub> = '+F.sig(a.p.radiation?st.f:0,2):i===4&&ev?'événement '+F.sig(ev.s,2)+' s':'');
}
/* ================================================================ application */
const SCRUB_MAX=a=>a.tab===3?.97:T_EV;
const A=AnimKit.app({
  code:'OS9',partie:'VioletImperial',chapitre:'OS9 Introduction à la physique quantique',
  titre:'Modèles de l’atome',sousTitre:'De la charge diffuse de Thomson aux orbitales : ce que chaque modèle prédit et ce qui le met en défaut',
  fichier:'Modeles_Atome',
  onglets:TABS,temps:true,pas:.1,
  curseur:{max:a=>SCRUB_MAX(a),
    get:a=>a.tab===3?st.f:st.ev?st.ev.s:0,
    set:(a,v)=>{if(a.tab===3){if(a.p.radiation)st.f=clampv(v,0,.97)}
      else if(a.tab===4){if(!st.ev)startTransition(a);if(st.ev)st.ev.s=clampv(v,0,st.ev.T)}}},
  panneaux:[{id:'scene',poids:.95,ratioTel:.95},{id:'graphes',poids:1.05,ratioTel:1.1}],
  reglages:[
    {titre:'Situations',onglets:[0,1],presets:[
      {label:'Passage proche · 10 fm',valeurs:{impact:10}},{label:'Passage éloigné · 150 fm',valeurs:{impact:150}},{label:'Collision frontale',valeurs:{impact:0}}],items:[]},
    {titre:'Faisceau incident',onglets:[0,1],items:[
      RG('impact','Paramètre d’impact '+Mh.v('b'),-180,180,1,50,'fm',0),
      {id:'compare',type:'check',label:'Comparer avec l’autre modèle (déviation en bas)',value:false,si:a=>a.tab===0}]},
    {titre:'Changer d’échelle',onglets:[1],items:[
      RG('span','Largeur du champ (demi-côté)',20,1e5,1,700,'fm',0,{log:true}),
      {type:'boutons',items:[{label:'Atome',action:a=>tweenSpan(a,1e5)},{label:'Diffusion',action:a=>tweenSpan(a,700)},{label:'Noyau · fort zoom',action:a=>tweenSpan(a,20)}]},
      {type:'note',html:'Le noyau (rayon estimé 1.2 A<sup>1/3</sup> ≈ 7 fm) et la barre d’échelle changent ensemble ; la trajectoire calculée est conservée. À 5 MeV, l’α ne pénètre jamais dans le noyau d’or.'}]},
    {titre:'Feuille d’or',onglets:[2],items:[
      RG('foilT','Épaisseur de la feuille',.1,3,.1,1,'µm',1),
      {type:'boutons',items:[{label:'+ 100 000 α',action:a=>foilBatch(a,1e5)},{label:'+ 1 000 000 α',action:a=>foilBatch(a,1e6)}]},
      {type:'note',html:'Chaque α subit au plus une diffusion de Rutherford : la probabilité de passer à moins de <i>b</i> d’un noyau est π n t b². L’aire π b² et l’angle θ sont liés par tan(θ/2) = a/b.'}]},
    {titre:'Rayonnement classique',onglets:[3],items:[
      {id:'radiation',type:'check',label:'Tenir compte du rayonnement de Larmor',value:true},
      {type:'boutons',items:[{label:'État initial',action:a=>{st.f=0}},{label:'À 90 % du temps classique',action:a=>{st.f=.9}}]},
      {type:'note',html:'On part du rayon r<sub>0</sub> sans quantifier l’orbite. Le temps est fortement dilaté à l’écran. Le rapprochement suit la loi quasi circulaire r³ = r<sub>0</sub>³ (1 − t / t<sub>classique</sub>) ; la lecture s’arrête à 97 %.'}]},
    {titre:'État et transition',onglets:[4],items:[
      {id:'n',type:'select',label:'Niveau initial n',options:Array.from({length:8},(_,j)=>[j+1,`n = ${j+1} · ${F.sig(E_n(j+1),3)} eV`]),value:3},
      {id:'destination',type:'select',label:'Niveau final n′ (ou clic sur le diagramme)',options:Array.from({length:8},(_,j)=>[j+1,`n′ = ${j+1}`]),value:2},
      {type:'boutons',items:[{label:'Effectuer la transition',action:a=>{st.casc=[];startTransition(a);if(st.ev)a.play(true)}}]},
      {id:'continu',type:'check',label:'Lecture continue (désexcitations puis ré-excitations aléatoires, sans fin)',value:false},
      {id:'orbits',type:'check',label:'Afficher les autres orbites permises',value:true},
      {id:'series',type:'select',label:'Niveau bas de la série tracée',options:[[1,'Lyman · n′ = 1'],[2,'Balmer · n′ = 2'],[3,'Paschen · n′ = 3']],value:2}]},
    {titre:'Situations',onglets:[4],presets:[
      {label:'Hα · 3 → 2',valeurs:{n:3,destination:2,series:2}},{label:'Lyman α · 2 → 1',valeurs:{n:2,destination:1,series:1}},
      {label:'Cascade · 4 → 3 → 2 → 1',valeurs:{n:4,destination:3,series:2},action:a=>{st.casc=[2,1];startTransition(a);a.play(true)}}],items:[]},
    {titre:'Tester une absorption',onglets:[4],items:[
      RG('photon','Énergie du photon incident',.1,20,.01,10.2,'eV',2),
      {type:'boutons',items:[{label:'Envoyer ce photon',action:a=>{absorbTest(a);a.play(true)}}]},
      {type:'note',html:'Résonance idéale à ±0.025 eV près (tolérance de manipulation, pas une largeur de raie). Au-dessus du seuil, l’excès devient énergie cinétique : ℰ<sub>c</sub> = hν + ℰ<sub>n</sub>.'}]},
    {titre:'Fermeture de phase',onglets:[5],items:[
      RG('rho','Rayon '+Mh.v('r')+' / '+Mh.v('r','0'),.5,25,.05,4,'',2),
      {type:'boutons',items:[{label:'n = 1',action:a=>a.set('rho',1)},{label:'n = 2',action:a=>a.set('rho',4)},{label:'n = 3',action:a=>a.set('rho',9)},{label:'Rayon non permis',action:a=>a.set('rho',6.3)},{label:'Ajuster au rayon permis',action:a=>a.set('rho',clampv(Math.round(Math.sqrt(a.p.rho))**2,1,25))}]},
      {id:'cst',type:'check',label:'Montrer l’erreur « λ constante » (avec les prévisions)',value:false},
      {type:'note',html:'λ = h / (m<sub>e</sub> v) avec v² = k / (m<sub>e</sub> r) : 2πr/λ = √(r / r<sub>0</sub>). La fermeture 2πr = nλ redonne ℒ = nℏ. Le rayon du cercle dessiné est proportionnel à √(r / r<sub>0</sub>).'}]},
    {titre:'État stationnaire',onglets:[6],items:[
      {id:'orbital',type:'select',label:'Orbitale',options:Object.entries(QA.ORB).map(([k,o])=>[k,o.label]),value:'1s'},
      {id:'view',type:'select',label:'Représentation',options:[['density','Coupe xz de |ψ|²'],['detections','Positions 3D projetées sur xz']],value:'density'},
      {type:'boutons',items:[{label:'+ 500 positions',action:a=>{for(let j=0;j<500;j++)singleOrbital(a);a.set('view','detections',{silent:true})}}]},
      {type:'note',html:'Coupe : densité volumique dans le plan y = 0 (teinte non linéaire). Détections : positions 3D indépendantes projetées sur xz ; ce n’est ni une trajectoire ni une coupe. P(r) dr est une probabilité dans une coquille.'}]},
    {titre:'Affichage',onglets:[0,1,2,3,4,5,6],items:[
      {id:'prev',type:'check',label:'Voir les prévisions (courbes théoriques, repères)',value:false}]}
  ],
  aide:{
    voit:'À gauche, le modèle étudié à l’échelle (ou schématique, quand c’est précisé) ; à droite, ce qu’on en déduit : histogramme des déviations, diagramme des niveaux, phase déroulée, distribution radiale. Les prévisions et courbes théoriques sont masquées au départ : formuler une attente, puis cocher « Voir les prévisions ».',
    faire:'<ul><li><b>Thomson, Rutherford</b> : cliquer ou glisser dans le dessin pour déplacer le faisceau (b), tirer des α, changer d’échelle jusqu’au noyau.</li><li><b>Feuille d’or</b> : envoyer 10<sup>5</sup> à 10<sup>6</sup> α et compter celles qui reviennent en arrière.</li><li><b>Bohr</b> : choisir n et n′ (ou cliquer sur le diagramme), lancer une transition ou la cascade ; le curseur temporel rejoue l’événement et les raies émises s’ajoutent au spectre.</li><li><b>De Broglie</b> : régler le rayon, ajuster au rayon permis, comparer à l’erreur « λ constante ».</li><li><b>Orbitales</b> : comparer 1s, 2s, 2p<sub>z</sub>, 2p<sub>x</sub>, 3p<sub>z</sub> ; accumuler des mesures.</li></ul>',
    modele:'<p><b>Thomson</b> : sphère positive uniforme de rayon 100 pm, Z = 79, α de 5 MeV ; θ ≈ (2a/b)[1 − (1 − b²/R²)<sup>3/2</sup>] avec a = k/(2ℰ<sub>c</sub>). Les électrons du dessin ne participent pas au calcul.</p><p><b>Rutherford</b> : m r̈ = k r / r³ intégrée par Runge–Kutta d’ordre 4, comparée à tan(θ/2) = k/(2ℰ<sub>c</sub>|b|) ; noyau fixe et ponctuel, rayon estimé 1.2 A<sup>1/3</sup> fm. La distance minimale est a + √(a² + b²) (&gt; 22.7 fm) : l’α reste hors du noyau.</p><p><b>Feuille d’or</b> : une seule diffusion par α ; n = 5.90 × 10<sup>28</sup> m<sup>−3</sup>, P(θ &gt; θ<sub>1</sub>) = n t π a² / tan²(θ<sub>1</sub>/2). Les diffusions multiples, les électrons et le recul sont négligés.</p><p><b>Atome classique</b> : puissance de Larmor P = e²a²/(6πε<sub>0</sub>c³), orbite quasi circulaire, r³(t) = r<sub>0</sub>³ − 4k²t/(m<sub>e</sub>²c³) ; t<sub>classique</sub> = m<sub>e</sub>²c³r<sub>0</sub>³/(4k²) ≈ 1.6 × 10<sup>−11</sup> s. Le modèle cesse d’être valable avant le noyau.</p><p><b>Bohr</b> : noyau fixe, r<sub>n</sub> = n²r<sub>0</sub>, ℰ<sub>n</sub> = −ℰ<sub>0</sub>/n², hν = |ℰ<sub>f</sub> − ℰ<sub>i</sub>|. Les durées sont schématiques, aucune trajectoire n’est décrite pendant le saut, les règles de sélection ne sont pas incluses. UV et IR en fausses couleurs.</p><p><b>De Broglie</b> : orbite circulaire coulombienne, 2πr/λ = √(r/r<sub>0</sub>) ; la sinusoïde est une phase d’amplitude arbitraire, pas une orbitale.</p><p><b>Orbitales</b> : états hydrogénoïdes 1s, 2s, 2p<sub>z</sub>, 2p<sub>x</sub>, 3p<sub>z</sub>, noyau fixe, spin ignoré ; 2s et 2p ont la même énergie dans l’approximation coulombienne.</p>',
    cours:'Notations du cours : ℰ, ℰ<sub>c</sub>, ℰ<sub>0</sub> = 13.6 eV, r<sub>0</sub> = 53 pm, ℒ = nℏ, hν<sub>nm</sub> = ℰ<sub>n</sub> − ℰ<sub>m</sub>. Chapitre OS9 : quantification de l’énergie.',
    plus:'<a href="https://www.feynmanlectures.caltech.edu/III_19.html" target="_blank" rel="noopener">Feynman, volume III, chapitre 19 — hydrogène et orbitales</a> (lien facultatif, connexion nécessaire).'
  },
  init(a){
    a.drag('scene',{
      hit:(x,y)=>(a.tab===0||a.tab===1)&&st.lay,
      move:(x,y)=>{const l=st.lay;if(!l)return;const ly=(y-l.L.oy)/l.L.s;
        if(a.tab===0)a.set('impact',clampv(Math.round((250-ly)/.9),-180,180));
        else a.set('impact',clampv(Math.round((l.cy-ly)/(l.half/l.span)),-180,180))},
      start(x,y){this.move(x,y)}});
    a.drag('graphes',{
      hit:(x,y)=>a.tab===4&&st.dg&&!st.ionized&&y<st.dg.y+st.dg.h,
      start(x,y){this.move(x,y)},
      move:(x,y)=>{const D=st.dg;let best=1,dist=1e9;for(let n=1;n<=8;n++){const d=Math.abs(energyY(D,E_n(n))-y);if(d<dist){dist=d;best=n}}if(dist<40*a.k){a.set('destination',best);st.ev=null;st.msg=''}}});
  },
  reset(a){resetState()},
  change(a,id,v){
    if(id==='orbital'||id==='view'){st.pts=[];st.radii=[];st.imgKey=''}
    if(id==='foilT'){st.foil={N:0,bins:Array(36).fill(0),big:0}}
    if(id==='n'){st.ionized=false;st.ev=null;st.msg=''}
    if(id==='destination'){st.msg=''}
  },
  onglet(a,i){a.play(false);if(i===3&&st.f>=.97)st.f=0},
  step(a,dt){
    const i=a.tab;st.rot+=dt*3;
    if(i<2){st.acc+=dt*30;while(st.acc>=1){singleAlpha(a,i);st.acc--}}
    else if(i===2){foilBatch(a,Math.round(dt*40000))}
    else if(i===3){if(a.p.radiation){st.f=Math.min(.97,st.f+dt*.08);if(st.f>=.97)a.play(false)}}
    else if(i===4)stepEvent(a,dt);
    else if(i===6){st.acc+=dt*30;while(st.acc>=1){singleOrbital(a);st.acc--}if(a.p.view!=='detections')a.set('view','detections',{silent:true})}
  },
  draw
});
function tweenSpan(a,target){
  const start=a.p.span,t0=performance.now(),tk=++st.tw;
  const f=now=>{if(tk!==st.tw)return;const p=Math.min(1,(now-t0)/650),e=p*p*(3-2*p);
    a.set('span',Math.exp(Math.log(start)+(Math.log(target)-Math.log(start))*e),{silent:true});if(p<1)requestAnimationFrame(f)};
  requestAnimationFrame(f);
}

</script>
