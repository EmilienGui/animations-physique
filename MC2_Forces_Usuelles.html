       onglets:['Vue de face','Perspective'],            // facultatif
       temps:true | (app)=>bool,                          // barre de lecture
       pas:1/24,                                          // durée simulée d'un « Pas »
       panneaux:[{id:'scene', titre:'…', poids:2, type:'svg'|'canvas', onglets:[0], ratioTel:.8, zoom:true}],
       reglages:[{titre:'Situations', presets:[{label, valeurs:{…}, lecture:true}]},

       aide:{voit, faire, modele, cours},
       init(app), reset(app), step(app,dt), draw(app), change(app,id,v), onglet(app,i)
     })
   Le kit fournit : app.p (paramètres), app.tab, app.t, app.C (couleurs), app.k (échelle projection),
   app.S (dessin SVG), app.fmt (nombres), app.metrics(), app.insight(), app.legend(), app.clock(), app.drag()…
   Réglage à échelle logarithmique : {id,type:'range',log:true,min,max,dec} (curseur en log10, champ numérique en valeur réelle).
   Disposition facultative  atelier:{saisie:'Mes mesures', detail:'Voir le calcul'} : app.zones.saisie / .resultat / .detail

(function(){
'use strict';
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const MATH='"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif';
const MINUS='−';

/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  /** n chiffres significatifs, sans notation exponentielle */
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e<-3||e>=6){const m=x/10**e;return (+m.toFixed(n-1)).toFixed(n-1).replace('-',MINUS)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>'}
    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;

function makeS(app){

    v(sym,sub,sup){

      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();

      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const X=v=>x0+(v-o.xmin)/(o.xmax-o.xmin)*w, Y=v=>y0+h-(v-o.ymin)/(o.ymax-o.ymin)*h;
      let s='';
      const xt=o.xticks||ticks(o.xmin,o.xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5)))), yt=o.yticks||ticks(o.ymin,o.ymax,o.ny??Math.max(1,Math.round(h/(fs*3))));

      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      const yAx=o.ymin<=0&&o.ymax>=0&&o.zeroAxis!==false?Y(0):y0+h, xAx=x0;
      s+=`<line x1="${n(x0)}" y1="${n(yAx)}" x2="${n(x0+w)}" y2="${n(yAx)}" stroke="${C0.ink2}" stroke-width="1.2"/><line x1="${n(xAx)}" y1="${n(y0)}" x2="${n(xAx)}" y2="${n(y0+h)}" stroke="${C0.ink2}" stroke-width="1.2"/>`;
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>o.xmin+(px-x0)/w*(o.xmax-o.xmin),yv:py=>o.ymin+(y0+h-py)/h*(o.ymax-o.ymin)};

  };

}

    A.zones.detail=el('div',{class:'ak-detail-body'}); det.append(A.zones.detail);
    body.insertBefore(left,main); main.insertBefore(A.zones.resultat,scene); main.append(det);
  }
  const pwrap=el('div',{class:'ak-panels'}); scene.append(pwrap);
  for(const pc of (cfg.panneaux||[{id:'scene'}])){

    const mix=(a,b,t)=>'rgb('+a.map((v,i)=>Math.round(v*t+b[i]*(1-t))).join(',')+')';
    const dark=root.dataset.theme==='dark', base=rgb(getComputedStyle(root).getPropertyValue('--'+(cfg.partie||'Anthracite')));
    const c=mix(base,base,1), cInk=dark?mix(base,[255,255,255],.5):mix(base,[0,0,0],.7), cSoft=dark?mix(base,rgb(g('--card')),.22):mix(base,rgb(g('--paper')),.1);
    A.C={paper:g('--paper'),card:g('--card'),ink:g('--ink'),ink2:g('--ink2'),rule:g('--rule'),grid:g('--grid'),c,cInk,cSoft,
      v:g('--q-v'),F:g('--q-F'),B:g('--q-B'),E:g('--q-E'),Ec:g('--q-Ec'),Ep:g('--q-Ep'),Em:g('--q-Em'),pred:g('--q-pred'),hot:g('--q-hot'),cold:g('--q-cold'),

  }
  A._change=(it,v)=>{A.p[it.id]=v;if(items[it.id])items[it.id]._last=v;if(cfg.change)cfg.change(A,it.id,v);if(it.reinit)A.reset();refreshSettings();A.render()};
  function vis(c){if(!c)return true;if(c.onglets&&!c.onglets.includes(A.tab))return false;if(c.si&&!c.si(A))return false;return true}

    {const home=A.narrow?right:side;if(metrics.parentNode!==home||(!A.narrow&&side.lastElementChild!==metrics))home.append(metrics)} A.k=ak.classList.contains('is-proj')?1.6:A.narrow?1:1.15;

<script>

window.ForceModel=(()=>{

function rString(a){

  const shape=amp=>Array.from({length:N+1},(_,i)=>[O[0]+amp*Math.sin(Math.PI*i/N),O[1]+d*i/N]);
  const arcLength=pts=>pts.slice(1).reduce((sum,q,i)=>sum+Math.hypot(q[0]-pts[i][0],q[1]-pts[i][1]),0);
  let amplitude=0;
  if(shortening>0){let lo=0,hi=length;for(let i=0;i<26;i++){const mid=(lo+hi)/2;if(arcLength(shape(mid))<length)lo=mid;else hi=mid}amplitude=(lo+hi)/2}

  force(a,p,[0,m.T],'T',8);force(a,p,[0,-m.P],'P',8);

    msg:m.slack?'Le support accélère vers le bas plus vite que la chute libre : M tombe avec a = −g.':m.limit?`À ${mv('a')}<sub>s</sub> = −${mv('g')}, le fil peut rester rectiligne sans exercer de force.`:`${mv('T')} = ${mv('m')}${mv('g')} seulement si le support n'accélère pas.`,
    metrics:[met(`Tension ${mv('T')}`,sci(a,m.T)),met(`Poids ${mv('P')}`,sci(a,m.P)),met('Accélération de M (vers le haut)',[a.fmt.sig(m.aMass,3),ms2])],
    legend:[{c:C.F,label:`forces : 1 N ↔ ${a.fmt.sig(8*a.p.gain*k,2)} px`},{c:C.cInk,label:`accélération du support : 1 ${ms2} ↔ ${a.fmt.sig(6*k,2)} px`,dash:true}]};
}

  if(m.N>0){force(a,foot,n.map(v=>v*m.N),{html:S.v('R','N'),n:1.7,vw:.6},10);if(Math.abs(m.T)>1e-9)force(a,foot,t.map(v=>v*m.T),{html:S.v('R','T'),n:1.7,vw:.6},10);
    if(a.p.res)force(a,foot,[n[0]*m.N+t[0]*m.T,n[1]*m.N+t[1]*m.T],'R',10,{w:2,dash:true,c:C.ink2})}
  if(s.pull)force(a,p,n.map(v=>v*s.pull),{html:S.v('F','n'),n:1.7,vw:.6},10);
  const hd=Pw(2*t[0],2*t[1]);if(hd[0]>15*k&&hd[0]<W-15*k&&hd[1]>15*k&&hd[1]<H-15*k){out+=S.circle(hd[0],hd[1],6*k,{fill:C.cInk})+S.circle(hd[0],hd[1],12*k,{c:C.cInk,w:1,dash:`${2*k} ${3*k}`});hits=[{key:'inc',p:hd,r:24*k}]}
  if(originVisible){if(s.alpha>.5)out+=S.arc(origin[0],origin[1],1.25*sc,0,s.alpha*DEG,{c:C.ink2,w:1.2});if(s.alpha>3)lab(a,Pw(1.45*Math.cos(s.alpha*DEG/2),1.45*Math.sin(s.alpha*DEG/2)),S.v('α'),1,C.ink2,4,8,16)}
  if(a.p.compS){const o=[W*.18,H*.18];out+=S.arrow(o[0],o[1],o[0]+t[0]*50*k,o[1]-t[1]*50*k,{c:C.ink2,w:1.5})+S.arrow(o[0],o[1],o[0]+n[0]*50*k,o[1]-n[1]*50*k,{c:C.ink2,w:1.5});
    lab(a,[o[0]+t[0]*50*k,o[1]-t[1]*50*k],S.v('t'),1,C.ink2,6,14,16,{vec:true});lab(a,[o[0]+n[0]*50*k,o[1]-n[1]*50*k],S.v('n'),1,C.ink2,5,-5,16,{vec:true})}
  const held=`L'objet reste immobile : |${mv('R')}<sub>T</sub>| ≤ ${mv('f')}<sub>s</sub> ${mv('R')}<sub>N</sub>.`,sliding=`${vec('R')}<sub>T</sub> s'oppose au glissement. L'angle du plan reste fixe.`;
  const msg=m.detached?'Le support ne peut pas tirer l\'objet : la réaction s\'annule et l\'objet décolle.':m.limit?'Au seuil, la réaction est nulle ; le contact peut subsister.':s.mode==='smooth'?(s.alpha===0?'Sur le plan horizontal sans frottement, l\'objet reste au repos.':'Sans frottement, l\'objet glisse sous l\'effet de la composante tangentielle du poids.'):m.regime==='Adhérence possible'?held:sliding;
  const reserve=s.mode!=='smooth'&&m.N>0?['Adhérence possible','Seuil d’adhérence dépassé','Glissement descendant','Glissement montant'].map(regime=>`<b>${regime}, α = ${a.fmt.fix(s.alpha,1)}°.</b> ${vec('R')} = ${vec('R')}<sub>N</sub> + ${vec('R')}<sub>T</sub> ; ${mv('R')}<sub>N</sub> = max(0, ${mv('m')}${mv('g')} cos ${mv('α')} − ${mv('F')}<sub>n</sub>). ${regime==='Adhérence possible'?held:sliding}`):[];
  return{titre:`${m.regime.replace('’','\'')}, α = ${a.fmt.fix(s.alpha,1)}°`,eq:`${vec('R')} = ${vec('R')}<sub>N</sub> + ${vec('R')}<sub>T</sub> ; ${mv('R')}<sub>N</sub> = max(0, ${mv('m')}${mv('g')} cos ${mv('α')} − ${mv('F')}<sub>n</sub>).`,msg,
    metrics:[met('Réaction normale',sci(a,m.N)),met(`Composante tangentielle ${mv('R')}<sub>T</sub>`,[a.fmt.sig(m.T,3),'N']),met('Vitesse (positive vers le haut du plan)',[a.fmt.sig(state.v,3),'m·s<sup>−1</sup>'])],
    reserve,legend:[{c:C.F,label:`forces : 1 N ↔ ${a.fmt.sig(10*a.p.gain*k,2)} px`}]};
}
function rDrag(a){
  const S=a.S,C=a.C,k=a.k,s=S_(a),m=FM.drag(s.v,s.u,s.h,s.hp,s.law),p=Pw(0,0);
  out+=S.rect(0,0,W,H,{fill:C.B,fop:C.dark?.1:.07});
  for(const y of[-1,-.5,.5,1])for(const x of[-2.8,-1.5,1.5,2.8]){const o=Pw(x,y),L=s.u*9*k;if(Math.abs(L)>2)out+=S.arrow(o[0],o[1],o[0]+L,o[1],{c:C.B,w:1.2,op:.7})}
  point(a,p,'M',26);
  force(a,p,[m.F,0],{html:S.v('F','f'),n:1.6,vw:.6},35);
  const vp=Pw(-.8,1.3),up=Pw(-.8,-1.3),vt=[vp[0]+s.v*32*k,vp[1]],ut=[up[0]+s.u*32*k,up[1]];
  if(Math.abs(s.v)>.01)out+=S.arrow(vp[0],vp[1],vt[0],vt[1],{c:C.v,w:2.4});if(Math.abs(s.u)>.01)out+=S.arrow(up[0],up[1],ut[0],ut[1],{c:C.B,w:2.4});
  lab(a,vp,S.v('v','objet'),4,C.v,-62,-15,16,{vec:true});lab(a,up,S.v('v','fluide'),4.6,C.B,-66,28,16,{vec:true});
  out+=S.circle(vt[0],vt[1],6*k,{fill:C.v})+S.circle(ut[0],ut[1],6*k,{fill:C.B});
  hits=[{key:'v',p:vt,r:23*k,anchor:vp},{key:'u',p:ut,r:23*k,anchor:up}];
  return{titre:Math.abs(m.relative)<1e-10?'Objet et fluide entraînés ensemble : traînée nulle':m.relative>0?'Traînée vers la gauche':'Traînée vers la droite',
    eq:(s.law==='linear'?`${vec('F')}<sub>f</sub> = −${mv('h')} ${vec('v')}<sub>rel</sub>`:`${vec('F')}<sub>f</sub> = −${mv('h')}′ ‖${vec('v')}<sub>rel</sub>‖ ${vec('v')}<sub>rel</sub>`)+`, avec ${vec('v')}<sub>rel</sub> = ${vec('v')}<sub>objet</sub> − ${vec('v')}<sub>fluide</sub>.`,
    msg:'La traînée s\'oppose à la vitesse relative au fluide, qui peut différer de la vitesse dans le laboratoire.',
    metrics:[met(`Traînée ${mv('F')}<sub>f,x</sub>`,[a.fmt.sig(m.F,3),'N']),met('Vitesse relative',[a.fmt.sig(m.relative,3),'m·s<sup>−1</sup>']),met('Puissance relative',[a.fmt.sig(m.power,3),'W'])],
    legend:[{c:C.F,label:`forces : 1 N ↔ ${a.fmt.sig(35*a.p.gain*k,2)} px`},{c:C.v,label:`vitesses : 1 m·s<sup>−1</sup> ↔ ${a.fmt.sig(32*k,2)} px`}],
    graph:{fn:v=>FM.drag(v,0,s.h,s.hp,s.law).F,min:-8,max:8,cur:m.relative,xl:`${S.v('v','rel')} (m·s${S.sup('−1')})`,yl:`${S.v('F','f,x')} (N)`}};
}

/* ---------- graphe de la loi ---------- */
let GR=null;
function drawGraph(a,gd){
  const P=a.panels.graph,S=a.S,C=a.C,k=a.k,N=120,pts=[];for(let i=0;i<=N;i++){const x=gd.min+(gd.max-gd.min)*i/N;pts.push([x,gd.fn(x)])}
  let ym=Math.max(...pts.map(p=>Math.abs(p[1])),1e-12);const signed=pts.some(p=>p[1]<0);
  const big=ym<.01||ym>1000,ex=big?Math.floor(Math.log10(ym)):0,f=10**ex,yy=pts.map(([x,y])=>[x,y/f]);ym/=f;
  if(P.head._h!==gd.yl){P.head.innerHTML='Graphe de la loi';P.head._h=gd.yl}
  GR=S.graph({x:4*k,y:4*k,w:P.w-8*k,h:P.h-8*k,xmin:gd.min,xmax:gd.max,ymin:signed?-ym*1.08:0,ymax:ym*1.08,xlab:gd.xl,ylab:gd.yl+(big?` × 10${S.sup(String(ex).replace('-','−'))}`:''),padL:40*k});
  let s=GR.svg+S.clip('fcl',GR)+S.curve(yy,GR,{c:C.cInk,w:2.4});
  if(gd.cur>=gd.min&&gd.cur<=gd.max)s+=S.circle(GR.X(gd.cur),GR.Y(gd.fn(gd.cur)/f),5*k,{fill:C.cInk});
  a.svg('graph',s);
}

/* ---------- interactions ---------- */
let dg=null;
A.drag('scene',{
  hit:(x,y)=>hits.some(h=>h.box?x>=h.box[0]&&x<=h.box[2]&&y>=h.box[1]&&y<=h.box[3]:Math.hypot(x-h.p[0],y-h.p[1])<=h.r),
  start(x,y){A.play(false);const h=hits.find(h=>h.box?x>=h.box[0]&&x<=h.box[2]&&y>=h.box[1]&&y<=h.box[3]:Math.hypot(x-h.p[0],y-h.p[1])<=h.r);dg={...h,x0:x,y0:y,s0:S_(A)}},
  move(x,y){if(!dg)return;const t=tabOf(A),set=(k,v)=>A.set(t+'_'+k,+v.toFixed(3),{silent:true});
    if(dg.key==='A'||dg.key==='B'){const wx=(x-W/2)/sc+ctr[0],wy=-(y-H/2)/sc+ctr[1],f=dg.key==='A'?-2:2;set('r',Math.max(1,Math.min(5,Math.hypot(wx*f,wy*f))));set('angle',Math.max(-70,Math.min(70,Math.atan2(wy*f,wx*f)/DEG)))}
    if(dg.key==='spring'){const dl=A.p.spring_orientation==='vertical'?(y-dg.y0)/sc:(x-dg.x0)/sc;set('l',Math.max(.25,Math.min(3.8,dg.s0.l+dl)))}
    if(dg.key==='imm')set('f',Math.max(0,Math.min(100,dg.s0.f+(y-dg.y0)/sc/3*100)));
    if(dg.key==='inc'){const wx=(x-W/2)/sc+ctr[0],wy=-(y-H/2)/sc+ctr[1];set('alpha',Math.max(0,Math.min(65,Math.atan2(wy,wx)/DEG)))}
    if(dg.key==='v'||dg.key==='u')set(dg.key,Math.max(-4,Math.min(4,(x-dg.anchor[0])/(32*A.k))))},
  end(){dg=null}
});
