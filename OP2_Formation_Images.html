help:`<p>Trois étapes : miroir plan, réfraction dans une lentille épaisse, puis modèle de lentille mince dans les conditions de Gauss. Glisser les points cerclés ; les champs numériques permettent un réglage précis.</p><p><b>Lentille épaisse.</b> Deux surfaces sphériques séparées de 8 mm, air d’indice 1. Snell-Descartes vectoriel aux deux interfaces. Le meilleur plan minimise la moyenne quadratique des distances des impacts à leur barycentre, pour l’échantillonnage choisi. La tache est l’ensemble géométrique d’impacts, sans diffraction ni pondération de Fresnel. Sa taille ne dépend pas du pixel. La comparaison avec le pas du pixel est un critère pédagogique de netteté ; elle ne décrit pas à elle seule toute la résolution du détecteur. Une grande tache peut être répartie sur plusieurs pixels même si son diamètre est inférieur au pas, selon sa position sur la grille.</p><p><b>Aplanétisme.</b> Trois points d’un plan transverse sont étudiés ; leurs meilleurs foyers permettent d’examiner le caractère approximativement plan et transverse du lieu image. Le stigmatisme concerne séparément chaque point.</p><p><b>Lentille mince.</b> Distances algébriques orientées vers la droite. OA′/OA est le grandissement ; le cas OA = −f′ est traité comme une image à l’infini. Un objet virtuel représente un faisceau incident convergent, généralement préparé par un système précédent. Les échelles longitudinale et transversale diffèrent pour la lisibilité.</p><p>« Construction » révèle les rayons ; « Animer » déplace des repères le long de trajets déjà établis, sans simuler le temps de propagation réel. Zoom : géométrie seule ; les légendes gardent leur taille. Export PNG dans le thème courant.</p>`
