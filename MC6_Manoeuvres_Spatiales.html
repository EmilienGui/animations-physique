    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}
      return s;
    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){
      let d='',pen=false;
      for(const[x,y]of pts){if(!isFinite(y)||!isFinite(x)){pen=false;continue}
        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

const variant=a=>({transfer:a.p.trv,rdv:a.p.rdvv,flyby:a.p.fbv,oberth:'standard',plane:a.p.plv,capture:a.p.cpv})[mode(a)];
const known=(a,time)=>a.p.prev||(a.t>0&&a.t>=time-1e-6);
const following=a=>mode(a)==='rdv'&&a.p.duo;
const encounter=a=>mode(a)==='flyby'&&a.p.local;
const range=a=>encounter(a)?{s:mission.m.localStart,e:mission.m.localEnd}:{s:0,e:mission.end};
const projected=(a,r)=>mode(a)==='plane'?K.project3D(r,st.az,st.el).slice(0,2):[r[0],r[1]];
const circle=(r,n=200)=>Array.from({length:n+1},(_,i)=>[r*Math.cos(TAU*i/n),r*Math.sin(TAU*i/n),0]);
const sample=(at,s0,s1,n=240)=>Array.from({length:n+1},(_,i)=>{const t=s0+(s1-s0)*i/n;return{...at(t),t}});

function clampP(a){const p=a.p,fix=(id,v)=>{if(p[id]!==v)a.set(id,v,{silent:true})};
  fix('rb',Math.max(p.rb,p.r1,p.r2));fix('obra',Math.max(p.obra,p.obrp));fix('plra',Math.max(p.plra,p.plrp));fix('cpra',Math.max(p.cpra,p.cprp));fix('peri',Math.min(p.peri,p.cpr));}
function build(a){
  clampP(a);const p=a.p,md=mode(a),v=variant(a),refs=[],tracks=[];let m,end,events=[];
  const ref=(pts,c,n)=>refs.push({pts,c,n}),track=(at,s0,s1,c,live=true)=>tracks.push({at,s:s0,e:s1,c,live,pts:sample(at,s0,s1)});
  if(md==='transfer'||md==='rdv'){

    else{const r1=md==='rdv'?p.rd1:p.r1,r2=md==='rdv'?p.rd2:p.r2;
      m=md==='transfer'&&v==='bi'?K.bielliptic(r1,r2,p.rb):K.hohmann(r1,r2,md==='transfer'?+p.laps:0);
      end=(m.arrival??m.T)+(md==='transfer'&&v!=='bi'?K.period(r2):Math.min(m.T,K.period(r2))*.12);
      ref(circle(r1),'ini','orbite initiale');ref(circle(r2),'fin','orbite finale');
      if(v==='bi'){track(m.at,0,m.T1,'tr');track(m.at,m.T1,end,'tr2');m.hoh=K.hohmann(r1,r2)}
      else if(md==='transfer'){if(m.pre>0)track(m.at,0,m.pre,'ini');track(m.at,m.pre,m.arrival,'tr');track(m.at,m.arrival,end,'fin')}
      else track(m.at,0,end,'tr');
      if(md==='rdv'){m.phiOpt=wrap(Math.PI-Math.sqrt(K.MU/r2**3)*m.T);m.phi0=m.phiOpt+p.err*RAD;m.nT=Math.sqrt(K.MU/r2**3)}}
    events=m.events;
    if(md==='rdv'){m.target=t=>{const g=m.phi0+m.nT*t;return{r:[m.r2*Math.cos(g),m.r2*Math.sin(g),0],v:[-m.r2*m.nT*Math.sin(g),m.r2*m.nT*Math.cos(g),0]}};if(v!=='phase')ref(circle(m.r2),'tgt','orbite de la cible')}
  }else if(md==='flyby'){
    m=K.flyby(K.R+p.alt,p.vinf,p.vp,+p.side);const lh=Math.acosh((4*m.rp/m.a+1)/m.e);m.localStart=m.atH(-lh).t;m.localEnd=m.atH(lh).t;end=m.T;
    track(v==='solar'?m.solar:m.at,0,end,'tr');m.planetAt=t=>v==='solar'?[0,p.vp*(t-m.half),0]:[0,0,0];
  }else if(md==='oberth'){
    m=K.oberth(p.obrp,p.obra,p.dv);end=m.T;ref(sample(t=>K.propagate([p.obrp,0,0],[0,m.vp,0],t),0,K.period(m.a)).map(q=>q.r),'ini','ellipse initiale');
    m.branches.forEach((b,i)=>track(b.at,0,end,i?'fin':'tr'));events=m.events;
  }else if(md==='plane'){
    const rp=v==='apo'?p.plrp:p.plr,ra=v==='apo'?p.plra:p.plr;m=K.plane(rp,ra,p.incl*RAD);end=m.T;
    ref(sample(m.ghost,0,m.T).map(q=>q.r),'ini','plan initial');track(m.ghost,0,m.pre,'ini');track(m.at,m.pre,end,'tr');events=m.events;
  }else{
    if(v==='in'){m=K.capture(p.cprp,p.cpra,p.cpvinf);end=m.T;track(m.at,0,m.pre,'fin');track(m.at,m.pre,end,'tr');
      ref(sample(t=>K.propagate([p.cprp,0,0],[0,m.events[0].before[1],0],t),-m.pre,m.pre).map(q=>q.r),'fin','hyperbole sans freinage');
      ref(sample(t=>K.propagate([p.cprp,0,0],[0,m.events[0].after[1],0],t),0,K.period(m.a)).map(q=>q.r),'tr','orbite capturée')}
    else{m=K.deorbit(p.cpr,p.peri);end=m.T;track(m.at,0,end,'tr');ref(circle(p.cpr),'ini','orbite initiale')}

  }
  mission={m,refs,tracks,end,events};
  vscale=1/Math.max(1,...tracks.flatMap(tr=>tr.pts.map(q=>K.norm(q.v))),...events.flatMap(e=>[K.norm(e.before),K.norm(e.after)]));

  bounds={xmin:Math.min(...pts.map(q=>q[0])),xmax:Math.max(...pts.map(q=>q[0])),ymin:Math.min(...pts.map(q=>q[1])),ymax:Math.max(...pts.map(q=>q[1]))}}

  if(encounter(a)){const pl=mission.m.planetAt(a.t),pr=mission.tracks[0].at(a.t).r,d=K.norm(mission.m.at(a.t).r),sp=Math.max(4*K.R,2*d+2*K.R),c=projected(a,K.mul(K.add(pl,pr),.5));return{xmin:c[0]-sp/2,xmax:c[0]+sp/2,ymin:c[1]-sp/2,ymax:c[1]+sp/2}}
  if(following(a)){const d=Math.max(20,1.8*duoAt(a.t).distance);return{xmin:-d/2,xmax:d/2,ymin:-d/2,ymax:d/2}}
  return st.focus||bounds}
function grab(x,y,e){const a=A,md=mode(a);if(!cam||following(a)||encounter(a))return null;
  if(md==='plane'&&!(e&&e.shiftKey)){const az=st.az,el=st.el,x0=x,y0=y;return{start(){a.play(false)},move(px,py){st.az=az+(px-x0)*.008;st.el=Math.max(15*RAD,Math.min(85*RAD,el-(py-y0)*.006));updateBounds(a)}}}
  const H=[];if(md==='transfer'){H.push(['r2',[-a.p.r2,0,0]]);if(a.p.trv==='bi')H.push(['rb',[-a.p.rb,0,0]])}
  if(md==='rdv'&&a.t<1e-6)H.push(['tgt',mission.m.target(0).r]);
  for(const[key,r]of H){const q=cam.X(...projected(a,r));if(Math.hypot(q[0]-x,q[1]-y)<22*a.k)return{start(){a.play(false)},move(px,py){const w=cam.inv(px,py);
    if(key==='tgt'){const g=Math.atan2(w[1],w[0]),ref=a.p.rdvv==='phase'?a.p.phi*RAD:mission.m.phiOpt;a.set('err',Math.round(Math.max(-90,Math.min(90,wrap(g-ref)/RAD))*2)/2,{silent:true})}
    else{const it=key==='r2'?[6600,300000]:[Math.max(a.p.r1,a.p.r2),1200000];a.set(key,Math.round(Math.max(it[0],Math.min(it[1],Math.hypot(...w)))/100)*100,{silent:true})}
    a.t=0;st.applied=false;build(a)}}}
  return null}

/* ---------- couleurs ---------- */
function COL(a){const C=a.C;return{ini:C.B,tr:C.cInk,tr2:C.dark?'#b892ff':'#7a4fc4',fin:C.Ep,tgt:C.Ep,dv:C.dark?'#ffd34d':'#b98900',v:C.v,earth:C.dark?'#2d4a5c':'#cfe3ee',earthL:C.dark?'#7fb3cc':'#4f7f99'}}

/* ---------- scène ---------- */
function scene(a){
  const P=a.panels.scene,S=a.S,C=a.C,k=a.k,md=mode(a),m=mission.m,c=COL(a);
  cam=MC6.camera(P,view(a),30*k);const L=MC6.placer(a,P),X=r=>cam.X(...projected(a,r));
  let s='';
  if(following(a))s=duo(a,L);

  else{
    if(a.p.refs)for(const r of mission.refs)s+=S.poly(r.pts.map(X),{c:c[r.c],w:1.3,dash:`${5*k} ${6*k}`,op:.6});
    const E0=md==='flyby'?m.planetAt(a.t):[0,0,0],O=X(E0),er=K.R*cam.s;
    s+=S.circle(O[0],O[1],er,{fill:c.earth,c:c.earthL,w:1.2})+S.circle(O[0],O[1],2.5*k,{fill:C.ink});L.obstacle(O[0],O[1],10*k);
    s+=L.put(O[0],O[1],md==='flyby'?'Planète':'Terre',{size:13,c:C.ink2,pref:[er*.7+6*k,er*.7+14*k]});
    for(const tr of mission.tracks){const pts=encounter(a)?sample(tr.at,m.localStart,m.localEnd,280):tr.pts;
      if(a.p.fut)s+=S.poly(pts.map(q=>X(q.r)),{c:c[tr.c],w:1.6,dash:`${6*k} ${5*k}`,op:.55});
      if(a.t>=tr.s){const tt=Math.min(a.t,tr.e),q=tr.at(tt),tv=pts.filter(z=>z.t<=tt).map(z=>X(z.r));tv.push(X(q.r));s+=S.poly(tv,{c:c[tr.c],w:2.8})}}
    /* mobiles */
    const live=mission.tracks.filter(tr=>md==='oberth'?true:a.t>=tr.s&&(a.t<tr.e-1e-8||tr===mission.tracks.at(-1)));
    for(const tr of live){const q=tr.at(Math.min(a.t,tr.e)),z=X(q.r);L.obstacle(z[0],z[1],12*k);
      const hit=md==='capture'&&variant(a)==='out'&&m.collision&&a.t>=m.T-1e-6;
      if(a.p.vec&&!(mission.events.length&&atEvent(a))){const w=X(K.add(q.r,K.mul(q.v,vscale*vlen(a))));s+=S.arrow(z[0],z[1],w[0],w[1],{c:c.v,w:2.2})}
      s+=S.circle(z[0],z[1],6.5*k,{fill:c[tr.c],c:C.card,w:1.5})+L.put(z[0],z[1],hit?'Contact':md==='oberth'?(tr===mission.tracks[0]?'S<tspan font-size="72%" dy="0.42em">P</tspan>':'S<tspan font-size="72%" dy="0.42em">A</tspan>'):'S',{c:hit?C.F:c[tr.c],size:15,weight:600})}
    if(md==='rdv'){const q=m.target(a.t),z=X(q.r);s+=S.circle(z[0],z[1],6*k,{fill:c.tgt,c:C.card,w:1.5})+L.put(z[0],z[1],'Cible',{c:c.tgt,size:14});
      if(a.t<1e-6){s+=S.circle(z[0],z[1],15*k,{fill:c.tgt,op:.14,c:c.tgt,w:1,dash:`${3*k} ${3*k}`})+L.put(z[0],z[1],'φ<tspan font-size="72%" dy="0.42em">0</tspan> ↻',{c:c.tgt,size:13,pref:[14*k,22*k]})}}
    if(md==='transfer'){mission.events.forEach((e,i)=>{const z=X(e.r);s+=S.circle(z[0],z[1],3.5*k,{fill:c.dv})});
      const hd=(r,lab,cc)=>{const z=X(r);s+=S.circle(z[0],z[1],14*k,{fill:cc,op:.14,c:cc,w:1,dash:`${3*k} ${3*k}`})+L.put(z[0],z[1],lab,{c:cc,size:13,pref:[-34*k,24*k]})};
      hd([-a.p.r2,0,0],`${S.v('r','2')} ↔`,c.fin);if(a.p.trv==='bi')hd([-a.p.rb,0,0],`${S.v('r','b')} ↔`,c.tr2)}
    if(a.p.vec&&mission.events.length){if(md==='oberth'){if(a.t<1e-6)for(const e of mission.events)s+=impulse(a,L,e,X,c)}else{const e=lastEvent(a);if(e)s+=impulse(a,L,e,X,c)}}
    if(md==='flyby'&&variant(a)==='solar'&&a.p.vp>0&&a.p.vec){const z=O;s+=S.arrow(z[0],z[1],z[0],z[1]-a.p.vp*vscale*vlen(a)*cam.s,{c:c.dv,w:2.2})+L.put(z[0],z[1]-a.p.vp*vscale*vlen(a)*cam.s,S.v('V','p'),{c:c.dv,size:14})}
  }

}
const vlen=a=>Math.min(a.panels.scene.w,a.panels.scene.h)*.17/cam.s;      // longueur écran de la plus grande vitesse
const lastEvent=a=>{const ev=mission.events.filter(e=>e.time<=a.t+1e-6);return ev.length?ev[ev.length-1]:null};

  let s=S.arrow(p[0],p[1],A1[0],A1[1],{c:c.ini,w:2.1})+S.arrow(p[0],p[1],B1[0],B1[1],{c:c.tr,w:2.4});if(e.cost>1e-9)s+=S.arrow(A1[0],A1[1],B1[0],B1[1],{c:c.dv,w:2.6});

  if(e.cost>1e-9)s+=L.put((A1[0]+B1[0])/2,(A1[1]+B1[1])/2,'Δ<tspan font-weight="700">v</tspan>',{c:c.dv,size:14});return s}

/* ---------- rendez-vous : repère du milieu ---------- */

    if(a.p.vec&&sp>1e-8)s+=S.arrow(z[0],z[1],z[0]+q.v[0]*vs,z[1]-q.v[1]*vs,{c:cc,w:2.2});s+=S.circle(z[0],z[1],6.5*k,{fill:cc,c:C.card,w:1.5})+L.put(z[0],z[1],name,{c:cc,size:15,weight:600})}

/* ---------- plan orbital en 3D ---------- */
function planeScene(a,L,X){const S=a.S,C=a.C,k=a.k,m=mission.m,c=COL(a),node=m.events[0],ap=st.applied,q=m.at(a.t,ap),O=X([0,0,0]);let s='';

  const grid=(pts,eq)=>{for(const front of[false,true]){let d='',on=false;for(let i=1;i<pts.length;i++){const mid=K.mul(K.add(pts[i-1],pts[i]),.5),vis=K.project3D(mid,st.az,st.el)[2]>=0;if(vis!==front){on=false;continue}const p0=X(pts[i-1]),p1=X(pts[i]);d+=(on?'':'M'+p0[0].toFixed(1)+','+p0[1].toFixed(1))+'L'+p1[0].toFixed(1)+','+p1[1].toFixed(1);on=true}

  for(let lo=0;lo<360;lo+=30){const l=lo*RAD;grid(Array.from({length:61},(_,j)=>{const f=-Math.PI/2+Math.PI*j/60;return[K.R*Math.cos(f)*Math.cos(l),K.R*Math.cos(f)*Math.sin(l),K.R*Math.sin(f)]}))}

  s+=S.poly(sample(m.ghost,0,Math.min(a.t,m.pre),100).map(z=>X(z.r)),{c:c.ini,w:2.8,op:ap?.4:1});
  if(ap){if(a.p.fut)s+=S.poly(sample(m.at,m.pre,m.pre+m.orbitalPeriod,200).map(z=>X(z.r)),{c:c.tr,w:1.6,dash:`${5*k} ${6*k}`,op:.55});s+=S.poly(sample(m.at,m.pre,Math.max(m.pre,a.t),120).map(z=>X(z.r)),{c:c.tr,w:2.8})}

  const N=X(node.r);s+=S.circle(N[0],N[1],4*k,{fill:c.dv})+L.put(N[0],N[1],'Nœud',{c:c.dv,size:13,pref:[12*k,22*k]});
  for(const[g,cc,n]of planes)s+=L.put(...X(K.rotX([-.5*r,.86*r,0],g)),n?'plan final':'plan initial',{c:cc,size:13});
  if(a.p.norm){const hs=m.i<1e-10||!ap?[[0,c.ini,ap?'h₁ = h₂':'h₁']]:[[0,c.ini,'h₁'],[m.i,c.tr,'h₂']];for(const[g,cc,n]of hs){const t=X(K.rotX([0,0,m.ra*1.3],g));s+=S.arrow(O[0],O[1],t[0],t[1],{c:cc,w:1.8})+L.put(t[0],t[1],`<tspan font-weight="700">h</tspan>${n.includes('₂')?'<tspan font-size="72%" dy="0.42em">2</tspan>':'<tspan font-size="72%" dy="0.42em">1</tspan>'}`,{c:cc,size:14})}}
  const p=X(q.r),cc=ap?c.tr:c.ini,atN=Math.abs(a.t-m.pre)<1e-6;L.obstacle(p[0],p[1],12*k);
  if(a.p.vec){if(atN&&ap){const f=Math.min(85*a.k,a.panels.scene.h*.24)/m.speed,A1=X(K.add(node.r,K.mul(node.before,f/cam.s))),B1=X(K.add(node.r,K.mul(node.after,f/cam.s)));
      s+=S.arrow(p[0],p[1],A1[0],A1[1],{c:c.ini,w:2.1})+S.arrow(p[0],p[1],B1[0],B1[1],{c:c.tr,w:2.4});if(node.cost>1e-9)s+=S.arrow(A1[0],A1[1],B1[0],B1[1],{c:c.dv,w:2.6});
      s+=L.put(A1[0],A1[1],`<tspan font-weight="700">v</tspan>${S.sup('−')}`,{c:c.ini,size:14})+L.put(B1[0],B1[1],`<tspan font-weight="700">v</tspan>${S.sup('+')}`,{c:c.tr,size:14});if(node.cost>1e-9)s+=L.put((A1[0]+B1[0])/2,(A1[1]+B1[1])/2,'Δ<tspan font-weight="700">v</tspan>',{c:c.dv,size:14})}
    else{const f=Math.min(80*a.k,a.panels.scene.h*.23)/Math.max(m.speed,K.norm(q.v)),e2=X(K.add(q.r,K.mul(q.v,f/cam.s)));s+=S.arrow(p[0],p[1],e2[0],e2[1],{c:c.v,w:2.2})}}
  s+=S.circle(p[0],p[1],7*k,{fill:cc,c:C.card,w:1.5})+L.put(p[0],p[1],'S',{c:cc,size:15,weight:600});

/* ---------- panneau de bilan ---------- */
function bars(a,items,titre,pied){const P=a.panels.bil,S=a.S,C=a.C,k=a.k,W=P.w,H=P.h;
  const lw=Math.min(W*.42,Math.max(...items.map(q=>q.name.replace(/<[^>]+>/g,'').length))*7.6*k+12*k),top=36*k,row=Math.min(54*k,(H-top-50*k)/items.length),mx=Math.max(1e-9,...items.map(q=>Math.abs(q.v??0)));
  const neg=items.some(q=>(q.v??0)<0),x0=neg?lw+(W-lw-16*k)/2:lw,wd=neg?(W-lw-16*k)/2-62*k:W-lw-118*k;
  let s=S.text(12*k,18*k,titre,{size:14,c:C.ink,weight:600});
  if(neg)s+=S.line(x0,top-6*k,x0,top+row*items.length,{c:C.ink2,w:1});
  items.forEach((q,i)=>{const y=top+i*row;s+=S.text(lw-8*k,y+row*.38,q.name,{size:13,c:q.c,anchor:'end'});
    if(q.v===null){s+=S.text(x0+8*k,y+row*.38,'?',{size:15,c:C.ink2,weight:600})}
    else{const w=wd*Math.abs(q.v)/mx,x=q.v<0?x0-w:x0;s+=S.rect(x,y+row*.14,Math.max(1,w),row*.5,{fill:q.c,rx:3*k,op:.85});s+=S.text(q.v<0?x-6*k:x+w+6*k,y+row*.38,q.lab,{size:13,c:C.ink,anchor:q.v<0?'end':'start'})}});
  if(pied)s+=S.text(12*k,H-12*k,pied,{size:12.5,c:C.ink2});return s}
function bilan(a){const P=a.panels.bil,S=a.S,C=a.C,k=a.k,md=mode(a),m=mission.m,c=COL(a),f=a.fmt;let s='';
  if(md==='transfer'){
    /* coût total rapporté à la vitesse circulaire intérieure, en fonction de r₂/r₁ */
    const r1=Math.min(a.p.r1,a.p.r2),Rn=Math.max(a.p.r1,a.p.r2)/r1,v1=K.circular(r1),L10=Math.log10;

    s+=G.svg+S.clip('clipB',G);const hoh=[],bil=[],lim=[],al=a.p.rb/r1;
    for(let j=0;j<=200;j++){const x=2*j/200,R2=10**x;hoh.push([x,K.hohmann(r1,Math.max(K.R+1,r1*R2)).cost/v1]);lim.push([x,(Math.SQRT2-1)*(1+1/Math.sqrt(R2))]);if(R2<=al)bil.push([x,K.bielliptic(r1,r1*R2,a.p.rb).cost/v1])}
    s+=S.curve(lim,G,{c:C.ink2,w:1.2,dash:`${2*k} ${4*k}`})+S.curve(hoh,G,{c:c.fin,w:2.4});if(a.p.trv==='bi')s+=S.curve(bil,G,{c:c.tr2,w:2.2});
    for(const th of[11.94,15.58]){const x=G.X(L10(th));s+=S.line(x,G.y0,x,G.y0+G.h,{c:C.rule,w:1,dash:`${3*k} ${4*k}`})}
    s+=S.text(G.X(L10(11.94))-4*k,G.y0+10*k,'11.9',{size:11.5,c:C.ink2,anchor:'end'})+S.text(G.X(L10(15.58))+4*k,G.y0+10*k,'15.6',{size:11.5,c:C.ink2});
    const x=G.X(L10(Rn)),show=a.p.prev||a.t>=mission.events.at(-1).time-1e-6;
    if(show){const yh=G.Y((a.p.trv==='bi'?m.hoh.cost:m.cost)/v1);s+=S.circle(x,yh,5*k,{fill:c.fin,c:C.card,w:1.4});if(a.p.trv==='bi')s+=S.circle(x,G.Y(m.cost/v1),5*k,{fill:c.tr2,c:C.card,w:1.4})}

    const ym=Math.max(...pts.map(q=>q[1]))*1.08;
    const G=S.graph({x:0,y:0,w:P.w,h:P.h,xmin:0,xmax:T/3600,ymin:0,ymax:ym,xlab:`${S.v('t')} (h)`,ylab:'distance S–cible (km)',yfmt:v=>MC6.nb(a,v),padL:52*k,padB:32*k,padT:26*k});
    s+=G.svg+S.clip('clipB',G);const shown=a.p.prev?pts:pts.filter(q=>q[0]<=a.t/3600+1e-9);s+=S.curve(shown,G,{c:c.tr,w:2.4});
    const x=G.X(a.t/3600),y=G.Y(duoAt(a.t).distance);s+=S.circle(x,y,5*k,{fill:c.tr,c:C.card,w:1.4});
    if(a.p.prev||a.t>=m.T)s+=S.text(G.X(tmin/3600),G.Y(dmin)-12*k,`min : ${MC6.nb(a,dmin,dmin<10?2:0)} km`,{size:12.5,c:C.ink2,anchor:'middle'});
  }else if(md==='flyby')s=vectors(a);
  else if(md==='oberth'){const kn=a.p.prev||a.t>0;s=bars(a,m.branches.map((b,i)=>({name:i?'départ en A':'départ en P',v:kn?b.gain:null,lab:f.sig(b.gain,3)+' km²/s²',c:i?c.fin:c.tr})),`Gain Δℰ/${'m'} pour Δv = ${f.fix(a.p.dv,2)} km/s`,'Δℰ/m = v Δv + ½(Δv)²');}
  else if(md==='plane')s=vectors(a);
  else{const e=mission.events[0],kn=known(a,e.time),eb=K.dot(e.before,e.before)/2-K.MU/K.norm(e.r),ea=K.dot(e.after,e.after)/2-K.MU/K.norm(e.r);
    s=bars(a,[{name:'avant',v:eb,lab:f.sig(eb,3)+' km²/s²',c:c.fin},{name:'après',v:kn?ea:null,lab:f.sig(ea,3)+' km²/s²',c:c.tr}],'Énergie mécanique ℰm/m',eb>0&&ea<0?'ℰm > 0 : non lié ; ℰm < 0 : lié':'ℰm < 0 : mouvement lié')}
  a.svg('bil',s)}
function vectors(a){const P=a.panels.bil,S=a.S,C=a.C,k=a.k,W=P.w,H=P.h,m=mission.m,c=COL(a),L=MC6.placer(a,P);let s='';
  if(mode(a)==='plane'){const e=m.events[0],i=a.p.incl*RAD,l=Math.min(W*.42,H-110*k),O=[W*.32,H-54*k],A1=[O[0],O[1]-l],B1=[O[0]+l*Math.sin(i),O[1]-l*Math.cos(i)],kn=a.p.prev||st.applied;
    s+=S.text(12*k,18*k,'Rotation de la vitesse au nœud',{size:14,c:C.ink,weight:600});
    s+=S.arrow(O[0],O[1],A1[0],A1[1],{c:c.ini,w:2.6})+L.put(A1[0],A1[1],`<tspan font-weight="700">v</tspan>${S.sup('−')}`,{c:c.ini,size:15,pref:[-30*k,-8*k]});
    if(kn){s+=S.arrow(O[0],O[1],B1[0],B1[1],{c:c.tr,w:2.6})+L.put(B1[0],B1[1],`<tspan font-weight="700">v</tspan>${S.sup('+')}`,{c:c.tr,size:15});if(e.cost>1e-8){s+=S.arrow(A1[0],A1[1],B1[0],B1[1],{c:c.dv,w:2.6});s+=L.put((A1[0]+B1[0])/2,(A1[1]+B1[1])/2,'Δ<tspan font-weight="700">v</tspan>',{c:c.dv,size:15})}
      if(i>.02){s+=S.arc(O[0],O[1],46*k,Math.PI/2-i,Math.PI/2,{c:C.ink2,w:1.3});s+=S.text(O[0]+52*k*Math.sin(i/2),O[1]-52*k*Math.cos(i/2),'Δ'+S.v('i'),{size:14,c:C.ink2})}}
    s+=S.text(12*k,H-12*k,`|${'Δ'}v| = 2v sin(Δi/2) = ${kn?a.fmt.sig(e.cost,3)+' km/s':'?'}`,{size:13,c:C.ink2});return s}
  const all=[m.incoming,m.outgoing,m.sunIn,m.sunOut,m.planet],vmax=Math.max(...all.map(K.norm),1),cols=W>420?2:1,sc=Math.min((W/cols-60*k)/(vmax*1.3),(H-110*k)/(vmax*1.25)),org=cols===2?[[W*.2,H-46*k],[W*.68,H-46*k]]:[[W*.3,H-46*k]];
  s+=S.text(12*k,18*k,'Vitesses à l\'infini : '+S.v('v')+' = '+S.v('V','p')+' + '+S.v('u'),{size:14,c:C.ink,weight:600});
  const dr=(inc,O)=>{const u=inc?m.incoming:m.outgoing,v=inc?m.sunIn:m.sunOut,A1=[O[0],O[1]-a.p.vp*sc],B1=[O[0]+v[0]*sc,O[1]-v[1]*sc];let t='';
    if(a.p.vp>0)t+=S.arrow(O[0],O[1],A1[0],A1[1],{c:c.dv,w:2.3})+L.put(A1[0],A1[1],S.v('V','p'),{c:c.dv,size:14,pref:[-30*k,-6*k]});
    t+=S.arrow(A1[0],A1[1],B1[0],B1[1],{c:inc?c.ini:c.tr,w:2.3})+L.put((A1[0]+B1[0])/2,(A1[1]+B1[1])/2,S.v('u',inc?'∞,e':'∞,s'),{c:inc?c.ini:c.tr,size:14});
    t+=S.arrow(O[0],O[1],B1[0],B1[1],{c:c.fin,w:2.3})+L.put(B1[0],B1[1],S.v('v',inc?'e':'s'),{c:c.fin,size:14});t+=S.text(O[0],H-14*k,inc?'entrée':'sortie',{size:13,c:C.ink2,anchor:'middle'});return t};
  const kn=a.p.prev||a.t>=m.half;if(cols===2){s+=dr(true,org[0]);s+=kn?dr(false,org[1]):S.text(org[1][0],H*.5,'?',{size:22,c:C.ink2,anchor:'middle'})}else s+=dr(!(kn&&a.t>=m.half),org[0]);
  return s}

/* ---------- valeurs, à retenir ---------- */
function infos(a){const f=a.fmt,md=mode(a),m=mission.m,v=variant(a),ev=mission.events,ks=e=>known(a,e.time);
  const km=x=>`${MC6.nb(a,x)}`,q=(ok,x)=>ok?x:'?',dv=(e,i)=>({label:`|Δ${mv('v')}${ev.length>1?'<sub>'+(i+1)+'</sub>':''}|${e.name?' · '+e.name.toLowerCase().replace('périastre','périgée').replace('apoastre','apogée'):''}`,value:q(ks(e),f.sig(e.cost,3)),unit:ks(e)?'km·s<sup>−1</sup>':'',hint:ks(e)?`|${mv('v')}<sup>−</sup>| = ${f.sig(K.norm(e.before),3)} → |${mv('v')}<sup>+</sup>| = ${f.sig(K.norm(e.after),3)} km·s<sup>−1</sup>`:`à ${mv('t')} = ${D(a,e.time)}`});
  let M=[],msg='',res=[];
  if(md==='transfer'){const all=ks(ev.at(-1));
    M=ev.map(dv);if(ev.length<3)M.push({label:'Budget total · durée du transfert',value:q(all,f.sig(m.cost,3)),unit:all?'km·s<sup>−1</sup>':'',hint:all?`demi-ellipse : ${D(a,m.T)}`:'à prévoir'});
    else M=[dv(ev[0],0),{label:'Budget bielliptique',value:q(all,f.sig(m.cost,3)),unit:all?'km·s<sup>−1</sup>':'',hint:all?`durée ${D(a,m.T)}`:'trois impulsions'},{label:'Comparaison au Hohmann',value:q(all,(m.cost-m.hoh.cost>=0?'+':'−')+f.sig(Math.abs(m.cost-m.hoh.cost),3)),unit:all?'km·s<sup>−1</sup>':'',hint:all?`Hohmann : ${f.sig(m.hoh.cost,3)} km·s<sup>−1</sup> en ${D(a,m.hoh.T)}`:'à prévoir'}];
    const Rn=Math.max(a.p.r1,a.p.r2)/Math.min(a.p.r1,a.p.r2);
    msg=v==='bi'?`${mv('v')}<sup>2</sup> = μ(${Mh.frac('2',mv('r'))} − ${Mh.frac('1',mv('a'))}) à chaque impulsion. Le bielliptique ne peut battre le Hohmann que pour ${mv('r')}<sub>2</sub>/${mv('r')}<sub>1</sub> &gt; 11.9 (toujours au-delà de 15.6, avec ${mv('r')}<sub>b</sub> assez grand) ; ici ${mv('r')}<sub>2</sub>/${mv('r')}<sub>1</sub> = ${f.sig(Rn,3)}, au prix d'une durée bien plus longue.`
      :`Demi-ellipse de transfert : ${mv('a')} = ${Mh.frac(mv('r')+'<sub>1</sub> + '+mv('r')+'<sub>2</sub>','2')}, durée ${Mh.frac(mv('T'),'2')} = π${Mh.sqrt(Mh.frac(mv('a')+'<sup>3</sup>','μ'))} ; chaque impulsion tangente se calcule par ${mv('v')}<sup>2</sup> = μ(${Mh.frac('2',mv('r'))} − ${Mh.frac('1',mv('a'))}).`;
    res=[`${mv('v')}<sup>2</sup> = μ(${Mh.frac('2',mv('r'))} − ${Mh.frac('1',mv('a'))}) à chaque impulsion. Le bielliptique ne peut battre le Hohmann que pour ${mv('r')}<sub>2</sub>/${mv('r')}<sub>1</sub> &gt; 11.9 (toujours au-delà de 15.6, avec ${mv('r')}<sub>b</sub> assez grand) ; ici ${mv('r')}<sub>2</sub>/${mv('r')}<sub>1</sub> = 15.0, au prix d'une durée bien plus longue.`];}
  else if(md==='rdv'){const d=duoAt(a.t),opt=v==='phase'?a.p.phi:m.phiOpt/RAD,all=ks(ev.at(-1));
    M=[{label:'Phase initiale requise φ<sub>0</sub>',value:q(a.p.prev||a.t>0,f.fix(opt,1)),unit:a.p.prev||a.t>0?'°':'',hint:`erreur δφ = ${f.fix(a.p.err,1)}°`},
      {label:'Distance satellite–cible',value:MC6.nb(a,d.distance,d.distance<10?2:0),unit:'km',hint:`vitesse relative ${f.sig(d.relativeSpeed*1000,3)} m·s<sup>−1</sup>`},
      {label:'Budget total',value:q(all,f.sig(m.cost,3)),unit:all?'km·s<sup>−1</sup>':'',hint:all?`durée ${D(a,m.T)}`:'à prévoir'}];
    msg=a.t>=m.T?(Math.abs(a.p.err)<1e-6?'Rendez-vous réussi : même position, même vitesse, au même instant.':`Rendez-vous manqué : l'orbite finale est atteinte, mais la cible est décalée de ${f.fix(a.p.err,1)}° ; la phase décide de la rencontre, pas le budget.`)
      :v==='phase'?`Freiner abaisse le périgée et raccourcit la période : en ${mv('T')}<sub>φ</sub> = ${Mh.frac('2π − φ<sub>req</sub>',mv('n'))} le satellite revient au point de départ quand la cible y arrive.`:'Partir quand la cible a l\'avance angulaire φ<sub>0</sub> qu\'elle aura perdue (ou gagnée) pendant la demi-ellipse de transfert.';
    res=['Rendez-vous manqué : l\'orbite finale est atteinte, mais la cible est décalée de −90.0° ; la phase décide de la rencontre, pas le budget.'];}
  else if(md==='flyby'){const kn=a.p.prev||a.t>=m.half;
    M=[{label:`Déviation ${mv('D')} de ${Mh.vec('u')}`,value:q(kn,f.fix(m.D/RAD,1)),unit:kn?'°':'',hint:`${mv('u')}<sub>∞</sub> = ${f.sig(a.p.vinf,3)} km·s<sup>−1</sup> avant et après`},
      {label:'Vitesse solaire · entrée → sortie',value:`${f.sig(K.norm(m.sunIn),3)} → ${q(kn,f.sig(K.norm(m.sunOut),3))}`,unit:'km·s<sup>−1</sup>'},
      {label:`Gain Δ(${mv('v')}<sup>2</sup>/2) solaire`,value:q(kn,(m.gain>=0?'+':'−')+f.sig(Math.abs(m.gain),3)),unit:kn?'km<sup>2</sup>·s<sup>−2</sup>':'',hint:'sans moteur'}];
    msg=`Dans le repère de la planète, ${mv('u')}<sub>∞</sub> garde sa norme et tourne de ${mv('D')} ; dans le repère solaire, ${Mh.vec('v')} = ${Mh.vec('V')}<sub>p</sub> + ${Mh.vec('u')} change de norme : passer derrière la planète fait gagner de l'énergie, devant en fait perdre.`;}
  else if(md==='oberth'){const kn=a.p.prev||a.t>0,[bP,bA]=m.branches;
    M=[{label:`Δℰ/${mv('m')} · départ en P`,value:q(kn,f.sig(bP.gain,3)),unit:kn?'km<sup>2</sup>·s<sup>−2</sup>':'',hint:`${mv('v')}<sub>P</sub> = ${f.sig(m.vp,3)} km·s<sup>−1</sup>`},
      {label:`Δℰ/${mv('m')} · départ en A`,value:q(kn,f.sig(bA.gain,3)),unit:kn?'km<sup>2</sup>·s<sup>−2</sup>':'',hint:`${mv('v')}<sub>A</sub> = ${f.sig(m.va,3)} km·s<sup>−1</sup>`},
      {label:'Même impulsion Δ'+mv('v'),value:f.fix(a.p.dv,2),unit:'km·s<sup>−1</sup>',hint:m.branches.map((b,i)=>(i?'A':'P')+' : '+(Math.abs(b.epsilon)<1e-8?'parabole':b.epsilon>0?'échappement':'ellipse')).join(' · ')}];
    msg=`Δℰ/${mv('m')} = ${mv('v')}Δ${mv('v')} + ½(Δ${mv('v')})<sup>2</sup> : à Δ${mv('v')} fixé, le gain d'énergie est plus grand là où la vitesse est grande, au péricentre.`;}
  else if(md==='plane'){const e=ev[0],kn=a.p.prev||st.applied;
    M=[{label:'Coût du changement de plan',value:q(kn,f.sig(e.cost,3)),unit:kn?'km·s<sup>−1</sup>':'',hint:`Δ${mv('i')} = ${f.fix(a.p.incl,0)}°`},{label:'Vitesse au nœud',value:f.sig(m.speed,3),unit:'km·s<sup>−1</sup>',hint:'norme inchangée'},{label:'Énergie ℰ<sub>m</sub>/'+mv('m'),value:f.sig(-K.MU/(2*m.a),3),unit:'km<sup>2</sup>·s<sup>−2</sup>',hint:'conservée'}];
    const atN=Math.abs(a.t-m.pre)<1e-6;
    msg=atN&&!st.applied?'Arrêt au nœud : Lecture applique l\'impulsion, qui fait tourner la vitesse sans changer la position.':`|Δ${Mh.vec('v')}| = 2${mv('v')} sin(${Mh.frac('Δ'+mv('i'),'2')}) : rotation pure de la vitesse au nœud ; sa norme et l'énergie sont conservées, le coût est d'autant plus faible que ${mv('v')} est petite (à l'apocentre).`;
    res=['Arrêt au nœud : Lecture applique l\'impulsion, qui fait tourner la vitesse sans changer la position.'];}
  else{const e=ev[0],kn=known(a,e.time);
    if(v==='in')M=[dv(e,0),{label:'ℰ<sub>m</sub>/'+mv('m')+' avant',value:f.sig(a.p.cpvinf**2/2,3),unit:'km<sup>2</sup>·s<sup>−2</sup>',hint:'&gt; 0 : non lié'},{label:'ℰ<sub>m</sub>/'+mv('m')+' après',value:q(kn,f.sig(-K.MU/(2*m.a),3)),unit:kn?'km<sup>2</sup>·s<sup>−2</sup>':'',hint:kn?'&lt; 0 : lié':'à prévoir'}];
    else M=[dv(e,0),{label:'Altitude du périgée visé',value:km(a.p.peri-K.R),unit:'km',hint:a.p.peri<K.R?'sous la surface':'au-dessus de la surface'},{label:m.collision?'Temps avant contact':'Temps jusqu\'au périgée',value:q(a.p.prev||a.t>=m.T,D(a,m.T).split(' ')[0]),unit:a.p.prev||a.t>=m.T?D(a,m.T).split(' ')[1]:'',hint:'chute balistique'}];
    msg=v==='in'?'Une impulsion rétrograde au périgée retire de l\'énergie : ℰ<sub>m</sub> passe de positive (hyperbole) à négative (ellipse), le mouvement devient lié.':`Freiner à l'apogée abaisse le périgée (${mv('r')}<sub>min</sub> + ${mv('r')}<sub>max</sub> = 2${mv('a')}) ; la chute gravitationnelle accélère ensuite le satellite${m.collision?' jusqu\'au contact':''}.`;}
  a.metrics(M);a.insight(msg,res);
  const c=COL(a),Lg=md==='rdv'?(following(a)?[{c:c.tr,label:'satellite S'},{c:c.tgt,label:'cible'},{c:a.C.ink2,label:'M : milieu',dot:true}]:[{c:c.tr,label:'satellite S'},{c:c.tgt,label:'cible'}])
    :md==='flyby'?[{c:c.tr,label:'sonde'},{c:c.dv,label:`${mv('V')}<sub>p</sub>`},{c:c.fin,label:'vitesses solaires'}]
    :md==='oberth'?[{c:c.tr,label:'départ en P'},{c:c.fin,label:'départ en A'},{c:c.ini,label:'ellipse initiale',dash:true}]
    :md==='transfer'?[{c:c.ini,label:'orbite initiale'},{c:c.tr,label:'transfert'},v==='bi'&&{c:c.tr2,label:'2<sup>e</sup> demi-ellipse'},{c:c.fin,label:'orbite finale · Hohmann (bilan)'},{c:c.dv,label:'Δ'+Mh.vec('v')}]
    :md==='plane'?[{c:c.ini,label:'plan initial'},{c:c.tr,label:'plan incliné'},{c:c.dv,label:'Δ'+Mh.vec('v')}]
    :[{c:c.ini,label:'orbite initiale'},{c:c.fin,label:v==='in'?'hyperbole':'référence'},{c:c.tr,label:'après impulsion'},{c:c.dv,label:'Δ'+Mh.vec('v')}];
  a.legend([...Lg,a.p.vec&&{c:c.v,label:'vitesse'}]);
  a.clock(`${mv('t')} = ${D(a,a.t)}`);
}
