const MINUS='−';

/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  /** n chiffres significatifs, sans notation exponentielle */
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e<-3||e>=6){const m=x/10**e;return (+m.toFixed(n-1)).toFixed(n-1).replace('-',MINUS)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>'}

    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);

  sci(x,n=2){

    if(e>=-2&&e<=3)return fmt.sig(x,n);

  },

  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;

    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},

        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;

      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;

    graph(o){

      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);

      const view=frame?.views[id]||null;

      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;

        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}

      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});

      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});

  const nav=$('.ak-tools',top);

  }

    if(!cfg.menuCommun)return;

    themeButton.title=dark?'Passer au thème clair (T)':'Passer au thème sombre (T)';
    $('.ak-lbl',projButton).textContent=projected?'Réglages':'Projection';
    projButton.title=projected?'Rétablir les réglages (P)':'Agrandir la scène et masquer les réglages (P)';

  }

  }

    class:'ib ak-sommaire',href:'https://emiliengui.github.io/animations-physique/',
    'aria-label':'Sommaire des animations',title:'Retour au sommaire des animations'
  },`${IC.sommaire}<span class="ak-lbl">Sommaire</span>`));

  if(tabs){cfg.onglets.forEach((t,i)=>{const b=el('button',{class:'ak-tab',role:'tab','aria-selected':String(i===0),'data-tab':i},`<b>${i+1}</b>${t}`);b.onclick=()=>A.setTab(i);tabs.append(b)});ak.append(tabs)}

  };

    dlg.innerHTML=`<header><h3>Aide · ${cfg.titre}</h3><button class="mini" data-close>Fermer ✕</button></header><div class="db">

<script>
'use strict';
/* =====================================================================
   TH3 MP · A1 « Atmosphère isotherme et facteur de Boltzmann » : physique
   Notations du cours : m masse d'une particule, g, T (thermostat), H = k_B T / (m g),
   ℰ_p = m g z, p(z) = exp(−z/H) / H.

   GAZ. Particules indépendantes sur une demi-droite z ≥ 0. Entre deux chocs :
   chute libre exacte z(t) = z₀ + v₀ t − g t²/2, rebond élastique sur le sol (vitesse
   changée de signe). Chocs avec le thermostat à des instants de Poisson (fréquence ν) :
   v_z est alors retirée selon la loi de Maxwell à la température T (écart type √(k_B T / m)).
   Aucun pas de temps : les trajectoires et les instants de choc sont exacts.
   Loi stationnaire : n*(z) ∝ exp(−m g z / k_B T), ⟨v_z²⟩ = k_B T / m, quelle que soit ν.

   GRAINS (Perrin). Mouvement brownien suramorti dans l'eau : sédimentation à la vitesse
   v_s = m_app g / (6 π η r), diffusion D = k_B T / (6 π η r), fond et lamelle réfléchissants
   (cuve de hauteur L). Loi stationnaire : exp(−m_app g z / k_B T) tronquée à [0, L]
   (H = D / v_s). Pas de calcul : au plus H/100 par pas d'espace, réflexion en miroir.
   ===================================================================== */
const TH3Atm = (() => {
  const kB = 1.380649e-23, NA = 6.02214076e23, R = kB * NA;

  /* ---------- générateur pseudo-aléatoire reproductible (xorshift32) ---------- */
  function rng(seed) {
    let s = (seed | 0) || 1;
    const next = () => {s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296;};
    const unif = () => {let u = next(); while (u <= 1e-12) u = next(); return u;};
    return {unif, gauss: () => Math.sqrt(-2 * Math.log(unif())) * Math.cos(2 * Math.PI * next()), expo: () => -Math.log(unif())};
  }

  /* ---------- gaz ---------- */
  const law = (T, m, g) => ({H: kB * T / (m * g), sv: Math.sqrt(kB * T / m)});
  const out = {z: 0, v: 0};
  /** vol libre exact de durée tau avec rebonds élastiques sur le sol ; résultat dans out */
  function flight(z, v, tau, g) {
    let rem = tau, guard = 0;
    if (z < 0) z = 0;
    while (rem > 0) {
      const root = Math.sqrt(v * v + 2 * g * z), th = (v + root) / g;
      if (th >= rem) {z += v * rem - .5 * g * rem * rem; v -= g * rem; break;}
      rem -= th; z = 0; v = root;
      if (root < 1e-9 || ++guard > 40) break;
      const T = 2 * root / g;
      if (rem > T) rem %= T;
    }
    out.z = z < 0 ? 0 : z; out.v = v;
  }

  /** p = {T, m, g, nu, zmax} ; depart : 'sol' | 'uniforme' | 'equilibre' */
  function createGas(N, seed, depart, p) {
    const r = rng(seed), z = new Float64Array(N), v = new Float64Array(N), eps = new Float64Array(N), xc = new Float64Array(N);
    const {H, sv} = law(p.T, p.m, p.g);
    for (let i = 0; i < N; i++) {
      xc[i] = .06 + .88 * r.unif(); eps[i] = r.expo(); v[i] = r.gauss() * sv;
      z[i] = depart === 'uniforme' ? r.unif() * p.zmax : depart === 'equilibre' ? H * r.expo() : 0;
    }
    return {N, z, v, eps, xc, time: 0, r,
      advance(dt, q) {
        const g = q.g, nu = q.nu, sv2 = Math.sqrt(kB * q.T / q.m);
        for (let i = 0; i < N; i++) {
          let zi = z[i], vi = v[i], e = eps[i], rem = dt;
          while (rem > 0) {
            const tc = e / nu;
            if (tc <= rem) {flight(zi, vi, tc, g); zi = out.z; rem -= tc; vi = r.gauss() * sv2; e = r.expo();}
            else {flight(zi, vi, rem, g); zi = out.z; vi = out.v; e -= nu * rem; rem = 0;}
          }
          z[i] = zi; v[i] = vi; eps[i] = e;
        }
        this.time += dt;
      }};
  }

  /* ---------- grains de Perrin ---------- */
  function grainLaw(q) { // q = {r (m), rhog, rhof, T, eta}
    const Vg = 4 / 3 * Math.PI * q.r ** 3, mapp = (q.rhog - q.rhof) * Vg, g = 9.81, gam = 6 * Math.PI * q.eta * q.r;
    const D = kB * q.T / gam, vs = mapp * g / gam;
    return {Vg, mapp, g, gam, D, vs, H: kB * q.T / (mapp * g)};
  }
  function createGrains(N, seed, q, L, depart) {
    const r = rng(seed), z = new Float64Array(N), xc = new Float64Array(N), P0 = grainLaw(q);
    for (let i = 0; i < N; i++) {
      xc[i] = .08 + .84 * r.unif();
      // équilibre : exponentielle tronquée à [0, L] par inversion
      z[i] = depart === 'equilibre' ? -P0.H * Math.log(1 - r.unif() * (1 - Math.exp(-L / P0.H))) : r.unif() * L;
    }
    return {N, z, xc, L, time: 0, r, substeps: 1,
      advance(dt, qq) {
        const P = grainLaw(qq), hmax = Math.min((P.H / 100) ** 2 / (2 * P.D), L * L / 4e4 / P.D);
        const ns = Math.min(4000, Math.max(1, Math.ceil(dt / hmax))), h = dt / ns, sd = Math.sqrt(2 * P.D * h), dr = P.vs * h;
        this.substeps = ns;
        for (let s = 0; s < ns; s++)
          for (let i = 0; i < N; i++) {
            let x = z[i] - dr + sd * r.gauss();
            while (x < 0 || x > L) x = x < 0 ? -x : 2 * L - x;
            z[i] = x;
          }
        this.time += dt;
      }};
  }

  /* ---------- statistiques ---------- */
  /** comptages par tranche d'altitude [0, zmax] en nb tranches ; renvoie aussi le nombre au-dessus */
  function histogram(zArr, nb, zmax, counts) {
    counts.fill(0); let above = 0;
    for (let i = 0; i < zArr.length; i++) {const b = Math.floor(zArr[i] / zmax * nb); if (b < nb) counts[b]++; else above++;}
    return above;
  }
  const mean = arr => {let s = 0; for (let i = 0; i < arr.length; i++) s += arr[i]; return s / arr.length;};
  /** nombre de grains dans la tranche d'épaisseur e centrée en zc */
  function band(zArr, zc, e) {let n = 0, a = zc - e / 2, b = zc + e / 2; for (let i = 0; i < zArr.length; i++) if (zArr[i] >= a && zArr[i] < b) n++; return n;}
  /** ajustement de ln n = c − z / H aux comptages n > 0 (poids n : variance de ln n ≈ 1/n) */
  function fitLn(pts) {
    const P = pts.filter(p => p.n > 0); if (P.length < 2) return null;
    let sw = 0, sx = 0, sy = 0, sxx = 0, sxy = 0;
    for (const p of P) {const w = p.n, y = Math.log(p.n); sw += w; sx += w * p.z; sy += w * y; sxx += w * p.z * p.z; sxy += w * p.z * y;}
    const den = sw * sxx - sx * sx; if (Math.abs(den) < 1e-300) return null;
    const slope = (sw * sxy - sx * sy) / den, c = (sy - slope * sx) / sw;
    return slope < 0 ? {H: -1 / slope, c, slope} : null;
  }
  return {kB, NA, R, rng, law, flight, out, createGas, grainLaw, createGrains, histogram, mean, band, fitLn};
})();
if (typeof module !== 'undefined') module.exports = TH3Atm;

// @titre    Atmosphère isotherme et facteur de Boltzmann · TH3 · MP

(() => {

    const lg = [{c: C.c, dot: true, label: 'particules (N = ' + g.N + ')'}, {c: C.B, dot: true, label: 'une particule suivie'}, {c: C.c, label: 'histogramme p(z) = dN / (N dz)'}];
    if (p.prevision) {
      const pts = Array.from({length: 91}, (_, i) => {const zk = zU * i / 90; return [Math.exp(-zk / Hk) / Hk, zk];});
      let th = S.curve(pts, Gh, {c: C.ink, w: 2.6});
      th += S.line(Gh.X(1 / Hk), Gh.Y(0), Gh.X(0), Gh.Y(Hk), {c: C.ink2, w: 1.3, dash: '6 5'});
      if (Hk < zU) {
        th += S.circle(Gh.X(0), Gh.Y(Hk), 4 * k, {fill: C.ink});
        th += lab(a, Gh.X(0) + 10 * k, Gh.Y(Hk) - 10 * k, S.v('H') + ' = ' + fmt.fix(Hk, 2) + ' km', {c: C.ink, weight: 650});
      }
      s += S.clip('th3a1-th', Gh) + th;
      lg.push({c: C.ink, label: 'loi prévue exp(−z/H)/H et sa tangente en z = 0'});
    }
    if (above / g.N > .01) s += lab(a, Gh.x0 + Gh.w - 6 * k, Gh.y0 + 14 * k, fmt.fix(100 * above / g.N, 0) + ' % des particules au-dessus de la fenêtre', {anchor: 'end', c: C.hot, weight: 650});
    a.svg('scene', s);
    a.clock('t = ' + fmtT(g.time));
    a.legend(lg);
    const m = [];
    if (p.valeurs) {
      let sz = 0; for (let i = 0; i < g.N; i++) sz += g.z[i];
      sz /= g.N;
      m.push({label: a.M.v('H') + ' = ' + a.M.v('k', 'B') + a.M.v('T') + ' / (' + a.M.v('m') + a.M.v('g') + ')', value: fmt.sig(Hk, 3), unit: 'km'},
        {label: '⟨' + a.M.v('z') + '⟩ mesuré', value: fmt.sig(sz / 1000, 3), unit: 'km'},
        {label: '⟨ℰ<sub>p</sub>⟩ / (' + a.M.v('k', 'B') + a.M.v('T') + ')', value: fmt.sig(p.M * 1e-3 / NA * p.g * sz / (A.kB * p.T), 3)});
    }
    a.metrics(m);
  }

  /* ---------- onglet 2 : grains de Perrin ---------- */
  function draw1(a) {
    const {S, C, k, fmt} = a, p = a.p, P = a.panels.scene, W = P.w, Hh = P.h, g = ensure(a, 1);
    const padT = 28 * k, padB = 42 * k, Wc = Math.round(W * .36), q = grainP(a), law = A.grainLaw(q), Hu = law.H * 1e6;
    const XM = 3.5;
    const Gc = S.graph({x: 0, y: 0, w: Wc, h: Hh, padL: 56 * k, padR: 4 * k, padT, padB, xmin: 0, xmax: 1, ymin: 0, ymax: LC,
      xticks: [], grid: false, ylab: S.v('z') + ' (µm)', xlab: 'cuve de Perrin'});
    const Gn = S.graph({x: Wc, y: 0, w: W - Wc, h: Hh, padL: 8 * k, padR: 14 * k, padT, padB, xmin: 0, xmax: XM, ymin: 0, ymax: LC,
      ylabels: false, xticks: [0, 1, 2, 3], xfmt: v => String(Math.round(10 ** v)), xlab: S.v('n') + ' (grains comptés, échelle logarithmique)'});
    const defsN = S.clip('th3a1-n', Gn);
    const half = p.e / 2, inBand = z => BANDS.some(zc => Math.abs(z - zc) < half);
    let d1 = '', d2 = '';
    for (let i = 0; i < g.N; i++) {
      const zu = g.z[i] * 1e6, s1 = 'M' + Gc.X(g.xc[i]).toFixed(1) + ',' + Gc.Y(zu).toFixed(1) + 'h.01';
      if (inBand(zu)) d2 += s1; else d1 += s1;
    }
    let bands = '';
    for (const zc of BANDS) {
      bands += S.rect(Gc.x0, Gc.Y(zc + half), Gc.w, Gc.Y(zc - half) - Gc.Y(zc + half), {fill: C.B, fop: .16, c: C.B, w: 1});
      bands += lab(a, Gc.x0 + Gc.w - 4 * k, Gc.Y(zc) - (Gc.Y(zc - half) - Gc.Y(zc)) - 9 * k, fmt.fix(zc, 0) + ' µm', {anchor: 'end', c: C.ink2});
    }
    let s = Gc.svg + S.clip('th3a1-cuve', Gc) + bands + clipped(S, Gc, 'th3a1-grains', S.path(d1, {c: C.c, w: 3.4, op: .85}) + S.path(d2, {c: C.B, w: 3.8}));
    s += S.line(Gc.x0, Gc.y0, Gc.x0 + Gc.w, Gc.y0, {c: C.ink, w: 3});
    s += lab(a, Gc.x0 + 6 * k, Gc.y0 + 13 * k, 'lamelle', {c: C.ink2});
    // comptages : point et barre ±√n, un par plan, à la hauteur du plan
    const pts = BANDS.map((zc, i) => ({z: zc * 1e-6, n: bandCount(a, g, i)}));
    let gn = '';
    pts.forEach((pt, i) => {
      if (pt.n < .5) return;
      const x1 = Math.log10(Math.max(.5, pt.n - Math.sqrt(pt.n))), x2 = Math.log10(pt.n + Math.sqrt(pt.n)), y = Gn.Y(BANDS[i]);
      gn += S.line(Gn.X(x1), y, Gn.X(x2), y, {c: C.B, w: 2});
      gn += S.circle(Gn.X(Math.log10(pt.n)), y, 5.5 * k, {fill: C.B, c: C.card, w: 1.5});
      gn += lab(a, Gn.X(x2) + 8 * k, y, 'n = ' + fmt.fix(pt.n, p.cumul ? 1 : 0), {c: C.ink});
    });
    const fit = A.fitLn(pts), lg = [{c: C.c, dot: true, label: 'grains (N = ' + g.N + ')'}, {c: C.B, dot: true, label: 'grains dans un plan de comptage'}];
    if (p.prevision) {
      const norm = 1 / (Hu * (1 - Math.exp(-LC / Hu)));
      const th = Array.from({length: 101}, (_, i) => {const z = LC * i / 100; return [Math.log10(g.N * p.e * norm * Math.exp(-z / Hu)), z];});
      gn += S.curve(th, Gn, {c: C.ink, w: 2.4, dash: '8 6'});
      lg.push({c: C.ink, dash: true, label: 'loi prévue (N e / H) exp(−z/H)'});
    }
    if (p.valeurs && fit) {
      const line = Array.from({length: 36}, (_, i) => {const x = XM * i / 35; return [x, (x * Math.LN10 - fit.c) / fit.slope * 1e6];});
      gn += S.curve(line, Gn, {c: C.F, w: 2.4});
      lg.push({c: C.F, label: 'ajustement de ln n en fonction de z'});
    }
    s += Gn.svg + defsN + gn;
    a.svg('scene', s);
    a.clock('t = ' + fmtT(g.time) + (p.cumul ? ' · moyenne sur ' + cumP.k + ' relevés' : ''));
    a.legend(lg);
    const m = [];
    if (p.valeurs) {
      const mm = a.M.v('m', 'app');
      m.push({label: mm + ' = (ρ<sub>g</sub> − ρ<sub>f</sub>) V<sub>g</sub>', value: fmt.sig(law.mapp * 1e18, 3), unit: '10<sup>−18</sup> kg'},
        {label: a.M.v('H') + ' calculée', value: fmt.sig(Hu, 3), unit: 'µm'});
      if (fit) {
        const kb = law.mapp * law.g * fit.H / q.T;
        m.push({label: a.M.v('H') + ' mesurée (ajustement)', value: fmt.sig(fit.H * 1e6, 3), unit: 'µm'},
          {label: a.M.v('k', 'B') + ' = ' + mm + ' g H / T', value: fmt.sig(kb * 1e23, 3), unit: '10<sup>−23</sup> J·K<sup>−1</sup>'},
          {label: '𝒩<sub>A</sub> = R / ' + a.M.v('k', 'B'), value: fmt.sig(A.R / kb / 1e23, 3), unit: '10<sup>23</sup> mol<sup>−1</sup>'});
      }
    }
    a.metrics(m);
  }

  /* ---------- onglet 3 : histogramme et probabilités ---------- */
  function draw2(a) {
    const {S, C, k, fmt} = a, p = a.p, P = a.panels.scene, W = P.w, Hh = P.h, g = ensure(a, 2);
    const Hk = A.law(p.T, p.M * 1e-3 / NA, p.g).H / 1000, zU = p.zmax, zmode = p.variable === 'z';
    const f = fine(a), hi = zmode ? zU : XMAX, dx = hi / NB, arr = zmode ? f.z : f.x, pmax = zmode ? 6 / zU : 1.15;
    const umax = Math.min(XMAX, zU / Hk), toV = u => zmode ? u * Hk : u;
    if (plage.b > umax) plage.b = umax;
    if (plage.a > plage.b - .05) plage.a = Math.max(0, plage.b - .05);
    const G = S.graph({x: 0, y: 0, w: W, h: Hh, padL: 62 * k, padR: 14 * k, padT: 34 * k, padB: 44 * k, xmin: 0, xmax: hi, ymin: 0, ymax: pmax,
      xlab: zmode ? S.v('z') + ' (km)' : S.v('ℰ', 'p') + ' / (' + S.v('k', 'B') + S.v('T') + ')',
      ylab: zmode ? S.v('p') + '(' + S.v('z') + ') (km' + S.sup('−1') + ')' : 'densité de probabilité de ' + S.v('ℰ', 'p') + ' / (' + S.v('k', 'B') + S.v('T') + ')'});
    frame3 = {G, zmode, Hk, umax, toX: v => zmode ? v / Hk : v};
    let bars = '';
    if (f.S > 0) for (let b = 0; b < NB; b++) {
      let c = 0; for (let j = 0; j < NF / NB; j++) c += arr[b * NF / NB + j];
      if (!c) continue;
      const pv = c / (f.S * dx), y = G.Y(Math.min(pv, 1.5 * pmax));
      bars += S.rect(G.X(b * dx) + k, y, G.X((b + 1) * dx) - G.X(b * dx) - 2 * k, G.y0 + G.h - y, {fill: C.c, fop: .6, c: C.cInk, w: 1});
    }
    const xa = G.X(toV(plage.a)), xb = G.X(toV(plage.b));
    let s = G.svg + clipped(S, G, 'th3a1-h3', bars);
    s += S.rect(xa, G.y0, xb - xa, G.h, {fill: C.B, fop: .13});
    for (const x of [xa, xb]) {
      s += S.line(x, G.y0 - 4 * k, x, G.y0 + G.h, {c: C.B, w: 2, dash: '7 5'});
      s += S.circle(x, G.y0 - 8 * k, 7 * k, {fill: C.B, c: C.card, w: 1.6});
    }
    let sum = 0;
    const ia = Math.round(plage.a / XMAX * NF), ib = Math.round(plage.b / XMAX * NF);
    for (let i = ia; i < ib; i++) sum += f.x[i];
    const meas = f.S > 0 ? sum / f.S : 0, theo = Math.exp(-plage.a) - Math.exp(-plage.b);
    const lg = [{c: C.c, label: f.S > 0 ? 'histogramme (' + (p.mode === 'cum' ? f.S + ' relevés' : g.N + ' particules') + ')' : 'aucun relevé'},
      {c: C.B, dash: true, label: 'plage déplaçable (glisser les deux repères)'}];
    if (p.prevision) {
      const th = Array.from({length: 121}, (_, i) => {const v = hi * i / 120; return [v, zmode ? Math.exp(-v / Hk) / Hk : Math.exp(-v)];});
      s += S.clip('th3a1-t3', G) + S.curve(th, G, {c: C.ink, w: 2.8});
      lg.push({c: C.ink, label: zmode ? 'loi prévue exp(−z/H)/H' : 'loi prévue exp(−ℰ_p / k_BT)'});
    }
    s += lab(a, (xa + xb) / 2, G.y0 + 16 * k, fmt.fix(100 * meas, 1) + ' %', {anchor: 'middle', c: C.B, weight: 700});
    a.svg('scene', s);
    a.clock('t = ' + fmtT(g.time));
    a.legend(lg);
    const m = [{label: 'Fraction mesurée dans la plage', value: fmt.fix(100 * meas, 1), unit: '%'}];
    if (p.valeurs) {
      m.push({label: 'Probabilité calculée ∫dp', value: fmt.fix(100 * theo, 1), unit: '%', hint: 'e^(−x₁) − e^(−x₂), x = ℰ_p / k_BT'},
        {label: 'Plage en ℰ<sub>p</sub> / k<sub>B</sub>T', value: fmt.fix(plage.a, 2) + ' à ' + fmt.fix(plage.b, 2)},
        {label: zmode ? 'Plage en altitude' : a.M.v('H'), value: zmode ? fmt.fix(plage.a * Hk, 2) + ' à ' + fmt.fix(plage.b * Hk, 2) : fmt.fix(Hk, 2), unit: 'km'});
    }
    a.metrics(m);
  }

      voit: '<ul><li><b>Colonne de gaz.</b> Des particules sans interaction retombent sous la pesanteur et reçoivent des chocs aléatoires qui modélisent l’agitation thermique (thermostat à la température T). La colonne et l’histogramme partagent le même axe des altitudes : l’histogramme compte les particules par tranche de 1/30 de la hauteur affichée, divisées par N et par l’épaisseur de la tranche, c’est-à-dire p(z) = dN / (N dz).</li><li><b>Grains de Perrin.</b> Des grains de gomme-gutte dans l’eau, agités par les chocs des molécules, sédimentent et se répartissent en exponentielle. Quatre plans de comptage (5, 35, 65 et 95 µm) donnent des nombres n ; le tracé de n en échelle logarithmique en fonction de z mène à H, donc à k<sub>B</sub> et 𝒩<sub>A</sub> (application 2 du cours).</li><li><b>Histogramme.</b> Une seule particule suivie longtemps donne la même loi que N particules observées à un instant. La plage déplaçable est la probabilité de trouver la particule entre deux altitudes ; avec la variable ℰ<sub>p</sub>/(k<sub>B</sub>T), toutes les situations donnent la même exponentielle.</li></ul>',
      faire: '<p>Colonne : lancer la lecture avec « Air, 288 K (cours) » et N = 2000. Avant d’afficher la loi prévue, estimer H d’après l’histogramme. Puis choisir « T doublée, en marche » : la température change sans repartir de zéro, le nuage monte et H double. Revenir à 288 K, puis « Masse ÷ 2, en marche » : même effet que la température, car seul T/m intervient. Enfin « Vingt particules » : l’histogramme fluctue trop pour qu’on y lise une loi.</p><p>Grains : lancer avec « Perrin (cours) », attendre la sédimentation (environ une minute de simulation accélérée), puis cocher « Moyenner les comptages » et « Afficher les valeurs calculées » pour obtenir H, k<sub>B</sub> et 𝒩<sub>A</sub>. Recommencer avec « Nouveau tirage » : la dispersion des résultats est celle de la mesure de Perrin.</p><p>Histogramme : « Une particule, longtemps » puis « Mille particules, un instant ». Déplacer les deux repères pour lire la fraction du temps (ou des particules) dans la plage, puis comparer à la probabilité calculée. Choisir la variable ℰ<sub>p</sub>/k<sub>B</sub>T et changer T ou M : la courbe ne bouge plus.</p>',
      modele: '<p><b>Gaz.</b> Les particules sont indépendantes. Entre deux chocs, la chute libre est calculée exactement (z = z₀ + v₀t − gt²/2) ; le sol réfléchit élastiquement. Les chocs avec le thermostat surviennent à des instants aléatoires de fréquence moyenne ν ; après un choc, la vitesse verticale est tirée dans la loi de Maxwell à la température T. Aucun pas de temps n’intervient. La loi stationnaire est n*(z) ∝ exp(−mgz/k<sub>B</sub>T), pour toute valeur de ν : la fréquence des chocs ne règle que la vitesse de mise en équilibre. Elle est choisie ici bien plus petite que dans l’air réel, pour qu’on puisse suivre le mouvement. Le temps est accéléré (environ ×4 en colonne).</p><p><b>Grains.</b> Mouvement brownien suramorti dans l’eau : vitesse de sédimentation m<sub>app</sub>g/(6πηr), coefficient de diffusion k<sub>B</sub>T/(6πηr) ; H = k<sub>B</sub>T/(m<sub>app</sub>g). Le fond et la lamelle réfléchissent les grains. Le temps de mise en équilibre réel est de l’ordre de 45 minutes ; l’animation l’accélère environ 300 fois.</p><p>Les comptages dans les plans suivent une loi de Poisson : les barres horizontales valent ±√n. Les valeurs de k<sub>B</sub> et 𝒩<sub>A</sub> sont celles que la simulation permet de retrouver, avec la dispersion statistique attendue.</p>',
      cours: 'TH3 MP, I.2 « Atmosphère isotherme » (expérience de cours E1) et I.3 « Loi de Boltzmann » (application 2, grains de Perrin ; probabilité et normalisation).'
    },
    init(a) {
      a.drag('scene', {
        hit: (x, y) => {
          if (a.tab !== 2 || !frame3) return false;
          const G = frame3.G;
          if (y < G.y0 - 18 || y > G.y0 + G.h || x < G.x0 - 14 || x > G.x0 + G.w + 14) return false;
          const da = Math.abs(x - G.X(frame3.zmode ? plage.a * frame3.Hk : plage.a)), db = Math.abs(x - G.X(frame3.zmode ? plage.b * frame3.Hk : plage.b));
          if (Math.min(da, db) > 16) return false;
          dragH = da <= db ? 0 : 1;
          return true;
        },
        start: () => {},
        move: x => {
          const G = frame3.G, u = Math.min(frame3.umax, Math.max(0, frame3.toX(G.xv(x))));
          if (dragH === 0) plage.a = Math.min(u, plage.b - .05); else plage.b = Math.max(u, plage.a + .05);
        }
      });
    },
    draw(a) {
      if (a.tab === 0) draw0(a); else if (a.tab === 1) draw1(a); else draw2(a);
    }
  });
})();

</script>
