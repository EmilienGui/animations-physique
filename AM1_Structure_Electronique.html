  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){

        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

      N.addEventListener('dblclick',e=>{const[x,y]=toV(scr(e));if(!P._drags.some(d=>d.hit&&d.hit(x,y,e))&&zoomed(P))A.cadrer(P)});
      N.addEventListener('pointerenter',()=>{A._hover=P});
    }
  }
  for(const P of Object.values(A.panels))wire(P);
  A.drag=(id,h)=>{A.panels[id]._drags.push(h)};

  /* ---------- export image (toujours en thème clair) ---------- */
  A.exportImage=async()=>{
    const was=root.dataset.theme; root.dataset.theme='light'; readColors(); A.renderNow();
    const vis=Object.values(A.panels).filter(P=>!P.el.hidden), base=pwrap.getBoundingClientRect(), sc=2;
    const cv=document.createElement('canvas'); cv.width=Math.round(base.width*sc); cv.height=Math.round(base.height*sc);
    const ctx=cv.getContext('2d'); ctx.fillStyle=A.C.card; ctx.fillRect(0,0,cv.width,cv.height);
    const jobs=vis.map(P=>new Promise(res=>{const r=P.node.getBoundingClientRect(), x=(r.left-base.left)*sc, y=(r.top-base.top)*sc;
      if(P.type==='canvas'){ctx.drawImage(P.node,x,y,r.width*sc,r.height*sc);res();return}
      const clone=P.node.cloneNode(true); clone.setAttribute('width',r.width); clone.setAttribute('height',r.height);
      const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
      const im=new Image(); im.onload=()=>{ctx.drawImage(im,x,y,r.width*sc,r.height*sc);res()}; im.onerror=()=>res(); im.src=src;}));
    await Promise.all(jobs);
    root.dataset.theme=was; readColors(); A.renderNow();
    const a=document.createElement('a'); const tabName=cfg.onglets&&cfg.onglets.length>1?'_'+(A.tab+1):'';
    a.download=`${cfg.code}_${(cfg.fichier||cfg.titre).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_')}${tabName}.png`;
    a.href=cv.toDataURL('image/png'); a.click(); A.toast('Image enregistrée (thème clair)');
  };

  /* ---------- aide ---------- */
  function buildHelp(){
    const h=cfg.aide||{}, sec=(t,c)=>c?`<h4>${t}</h4>${/^\s*</.test(c)?c:`<p>${c}</p>`}`:'';
    dlg.innerHTML=`<header><h3>Aide · ${cfg.titre}</h3><button class="mini" data-close>Fermer ✕</button></header><div class="db">
    ${cfg.sousTitre?`<p class="ak-dlg-sub">${cfg.sousTitre}</p>`:''}${sec('Ce qu\'on voit',h.voit)}${sec('Ce qu\'on peut faire',h.faire)}${sec('Modèle et hypothèses',h.modele)}${sec('Lien avec le cours',h.cours)}${sec('Pour aller plus loin',h.plus)}
    <h4>Raccourcis</h4><p>${cfg.temps?'<kbd>Espace</kbd> lecture / pause · <kbd>→</kbd> pas à pas · <kbd>R</kbd> recommencer · ':''}${tabs?`<kbd>1</kbd>–<kbd>${cfg.onglets.length}</kbd> onglets · `:''}<kbd>P</kbd> projection · <kbd>F</kbd> plein écran · <kbd>T</kbd> thème · <kbd>I</kbd> image · <kbd>H</kbd> aide${h.touches?' · '+h.touches:''}</p>
    <p>Vue : molette, pincement ou <kbd>+</kbd> <kbd>−</kbd> pour zoomer · <kbd>Maj</kbd> + glisser, deux doigts, ou glisser une vue zoomée pour la déplacer · « Cadrer », <kbd>0</kbd> ou double clic : vue initiale.</p>
    ${h.credits?`<h4>Crédits</h4><p>${h.credits}</p>`:''}</div>`;
    dlg.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===dlg)dlg.close()});
  }

  /* ---------- démarrage ---------- */
  buildSettings(); buildHelp(); readColors();
  if(cfg.init)cfg.init(A);
  refreshSettings(); A.reset();
  new ResizeObserver(()=>A.render()).observe(ak);
  return A;
}

<script>
'use strict';
/* =====================================================================
   AM1 · physique (sans accès au DOM) : configurations électroniques de H à Kr, ions, diagnostics Pauli / Hund / effectifs.
   Migration AnimKit du 8 novembre 2026 ; les configurations sont reconstruites par la règle de Klechkowski
   avec les deux exceptions du cours (Cr : 3d⁵4s¹, Cu : 3d¹⁰4s¹) et contrôlées par leur nombre d'électrons.
   Les 38 ions monoatomiques de l'ancien atelier sont repris tels quels (He⁺ compris).
   ===================================================================== */
globalThis.AM1P=(()=>{
  const ORDER=['1s','2s','2p','3s','3p','4s','3d','4p','5s','4d','5p','6s','4f','5d','6p','7s','5f','6d','7p'];
  const KEYS=ORDER.slice(0,8);
  const L=k=>'spdf'.indexOf(k[1]),CAP=k=>2*(2*L(k)+1);
  const SYM='H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr'.split(' ');
  const NOM='Hydrogène Hélium Lithium Béryllium Bore Carbone Azote Oxygène Fluor Néon Sodium Magnésium Aluminium Silicium Phosphore Soufre Chlore Argon Potassium Calcium Scandium Titane Vanadium Chrome Manganèse Fer Cobalt Nickel Cuivre Zinc Gallium Germanium Arsenic Sélénium Brome Krypton'.split(' ');
  const MASS=[1,4,7,9,11,12,14,16,19,20,23,24,27,28,31,32,35,40,39,40,45,48,51,52,55,56,59,58,63,64,69,74,75,80,79,84];
  const EXC={24:{'4s':1,'3d':5},29:{'4s':1,'3d':10}};
  function madelung(z){const c={};let r=z;for(const k of ORDER){if(r<=0)break;const n=Math.min(CAP(k),r);c[k]=n;r-=n}return c}
  const ELEMENTS=SYM.map((s,i)=>{const z=i+1,c={...madelung(z),...(EXC[z]||{})};
    if(Object.values(c).reduce((a,b)=>a+b,0)!==z)throw new Error('configuration incohérente : Z = '+z);
    return{z,symbol:s,name:NOM[i],counts:c}});

  /* ---------- ions monoatomiques (ancien atelier) ---------- */
  const HE={'1s':2},NE={...HE,'2s':2,'2p':6},AR={...NE,'3s':2,'3p':6},KR={...AR,'4s':2,'3d':10,'4p':6};
  const NOBLE={He:HE,Ne:NE,Ar:AR,Kr:KR};
  const argonD=n=>({...AR,...(n?{'3d':n}:{})});
  const ION_CONFIGS={
    1:{1:{},'-1':HE},2:{1:{'1s':1}},3:{1:HE},4:{2:HE},
    7:{'-3':NE},8:{'-2':NE},9:{'-1':NE},11:{1:NE},12:{2:NE},13:{3:NE},
    15:{'-3':AR},16:{'-2':AR},17:{'-1':AR},19:{1:AR},20:{2:AR},21:{3:AR},
    22:{2:argonD(2),3:argonD(1),4:AR},23:{2:argonD(3),3:argonD(2)},
    24:{2:argonD(4),3:argonD(3)},25:{2:argonD(5),3:argonD(4)},
    26:{2:argonD(6),3:argonD(5)},27:{2:argonD(7),3:argonD(6)},28:{2:argonD(8)},
    29:{1:argonD(10),2:argonD(9)},30:{2:argonD(10)},31:{3:argonD(10)},
    33:{'-3':KR},34:{'-2':KR},35:{'-1':KR}
  };
  const charges=z=>[0,...Object.keys(ION_CONFIGS[z]||{}).map(Number).sort((a,b)=>b-a)];
  const SUPU='⁰¹²³⁴⁵⁶⁷⁸⁹';
  const chargeSup=q=>q===0?'':(Math.abs(q)>1?[...String(Math.abs(q))].map(c=>SUPU[+c]).join(''):'')+(q>0?'⁺':'⁻');
  const label=(z,q)=>ELEMENTS[z-1].symbol+chargeSup(q);
  const ION_LIST=[];for(let z=1;z<=36;z++)for(const q of charges(z))if(q)ION_LIST.push({z,q,label:label(z,q)});

  const clone=x=>JSON.parse(JSON.stringify(x));
  const targetCounts=(z,q)=>clone(q?ION_CONFIGS[z][q]:ELEMENTS[z-1].counts);
  const valenceKeys=z=>{const c=ELEMENTS[z-1].counts,n=Math.max(...Object.keys(c).map(k=>+k[0]));return Object.keys(c).filter(k=>+k[0]===n||(k[1]==='d'&&+k[0]===n-1&&c[k]<10))};
  const isCore=(k,z)=>!!ELEMENTS[z-1].counts[k]&&!valenceKeys(z).includes(k);

  /* ---------- cases quantiques ---------- */
  const emptyBoxes=()=>Object.fromEntries(KEYS.map(k=>[k,Array.from({length:2*L(k)+1},()=>[])]));
  function boxesFor(c){const b=emptyBoxes();for(const k of KEYS){const n=c[k]||0,m=b[k].length;for(let i=0;i<n;i++)b[k][i%m].push(i<m?1:-1)}return b}
  const countsOf=b=>Object.fromEntries(KEYS.map(k=>[k,b[k].reduce((n,x)=>n+x.length,0)]).filter(([,v])=>v));
  const total=b=>Object.values(countsOf(b)).reduce((x,y)=>x+y,0);
  const sameCounts=(a,b)=>KEYS.every(k=>(a[k]||0)===(b[k]||0));
  function prefixBoxes(z,q,n){const t=targetCounts(z,q),b=emptyBoxes();let r=n,last='1s';
    for(const k of KEYS){const m=b[k].length;for(let i=0;i<(t[k]||0)&&r>0;i++){b[k][i%m].push(i<m?1:-1);r--;last=k}}return{boxes:b,last}}

  /* ---------- diagnostics indépendants ---------- */
  function diagnose(boxes,z,q){
    const c=countsOf(boxes),tot=total(boxes),expected=z-q,invalid=[],hund=[];
    for(const k of KEYS){let bad=false;
      boxes[k].forEach((b,i)=>{if(b.length>2||new Set(b).size!==b.length){invalid.push(k);bad=true}});
      if(!bad&&L(k)>0){const n=c[k]||0,m=boxes[k].length,singles=boxes[k].filter(b=>b.length===1);
        if(singles.length!==Math.min(n,2*m-n)||new Set(singles.map(b=>b[0])).size>1)hund.push(k)}}
    return{pauli:!invalid.length,hund:!hund.length,invalid:[...new Set(invalid)],hundShells:hund,total:tot,expected,countsMatch:sameCounts(c,targetCounts(z,q))};
  }

  /* ---------- écriture des configurations ---------- */
  const noble=c=>Object.keys(NOBLE).find(n=>sameCounts(c,NOBLE[n]))||null;
  function condensed(c){
    let core='';for(const n of['Kr','Ar','Ne','He'])if(Object.keys(NOBLE[n]).every(k=>(c[k]||0)===NOBLE[n][k])){core=n;break}
    const terms=ORDER.filter(k=>c[k]&&!(core&&NOBLE[core][k])).map(k=>[k,c[k]]);
    return{core,terms};
  }
  const terms=c=>ORDER.filter(k=>c[k]).map(k=>[k,c[k]]);
  /** ions ayant exactement la configuration c (liste d'étiquettes), atome neutre compris */
  const sameAs=c=>{const out=[];ELEMENTS.forEach(e=>{if(sameCounts(e.counts,c))out.push(label(e.z,0))});ION_LIST.forEach(i=>{if(sameCounts(ION_CONFIGS[i.z][i.q],c))out.push(i.label)});return out};

  return{ORDER,KEYS,L,CAP,ELEMENTS,MASS,NOBLE,ION_CONFIGS,ION_LIST,charges,chargeSup,label,targetCounts,valenceKeys,isCore,
    emptyBoxes,boxesFor,countsOf,total,sameCounts,prefixBoxes,diagnose,noble,condensed,terms,sameAs,clone};
})();

'use strict';
/* =====================================================================
   AM1 · orbitales hydrogénoïdes (sans DOM) : nuage de 9000 points et distribution radiale.
   R_nl ∝ exp(−ρ/2) ρ^l L_{n−l−1}^{2l+1}(ρ) avec ρ = 2r/n, r en unités de a₀/Z : le modèle est donc EXACT pour
   un ion hydrogénoïde (H, He⁺ : Z = 1, 2) ; pour un atome polyélectronique c'est une illustration.
   Les longueurs sont calculées pour Z = 1 puis divisées par Z à l'affichage.
   L'échantillonnage sépare P(r) dr = r²|R|² dr et |Y réel|² dΩ.
   ===================================================================== */
globalThis.AM1O=(()=>{
  const SHAPES={0:['s'],1:['px','py','pz'],2:['dxy','dxz','dyz','dx2y2','dz2']};
  const cache={};
  function laguerre(k,al,x){if(k===0)return 1;let p=1,c=1+al-x;for(let i=1;i<k;i++){const nx=((2*i+1+al-x)*c-(i+al)*p)/(i+1);p=c;c=nx}return c}
  const radialAmp=(n,l,r)=>{const rho=2*r/n;return Math.exp(-rho/2)*rho**l*laguerre(n-l-1,2*l+1,rho)};
  const angularAmp=(sh,x,y,z)=>({s:()=>1,px:()=>x,py:()=>y,pz:()=>z,dxy:()=>2*x*y,dxz:()=>2*x*z,dyz:()=>2*y*z,dx2y2:()=>x*x-y*y,dz2:()=>.5*(3*z*z-1)})[sh]();
  const rng=seed=>{let v=seed>>>0;return()=>{v=(Math.imul(1664525,v)+1013904223)>>>0;return(v+.5)/4294967296}};
  function cloud(n,l,shape){
    const key=n+shape;if(cache[key])return cache[key];
    const rmax=6*n*n+10,steps=5000,dr=rmax/steps;
    let radial=Array.from({length:steps+1},(_,i)=>{const r=i*dr;return r*r*radialAmp(n,l,r)**2});
    const area=radial.reduce((a,b)=>a+b,0)*dr;radial=radial.map(y=>y/area);
    let s=0;const cdf=radial.map(v=>s+=v*dr);cdf[steps]=1;
    const inv=u=>{let lo=0,hi=cdf.length-1;while(lo<hi){const mid=(lo+hi)>>1;if(cdf[mid]<u)lo=mid+1;else hi=mid}const prev=lo?cdf[lo-1]:0;const f=(u-prev)/(cdf[lo]-prev||1);return Math.max(0,(lo-1+f)*dr)};
    const rnd=rng(179+n*1009+l*137+[...shape].reduce((v,c)=>v+c.charCodeAt(0),0)),points=[];
    for(let i=0;i<9000;i++){
      let x,y,z,a;
      do{z=2*rnd()-1;const th=2*Math.PI*rnd(),rho=Math.sqrt(1-z*z);x=rho*Math.cos(th);y=rho*Math.sin(th);a=angularAmp(shape,x,y,z)}while(rnd()>a*a);
      const r=inv(rnd()),sign=Math.sign(radialAmp(n,l,r)*a)||1;points.push([x*r,y*r,z*r,sign]);
    }
    return cache[key]={points,radial,dr,extent:inv(.997),limit:inv(.999),max:Math.max(...radial),inv};
  }
  return{SHAPES,cloud,radialAmp,angularAmp,laguerre};
})();

// @titre Structure électronique · AM1 · MPSI
// @sortie ../AM1_Structure_Electronique/AM1_Structure_Electronique.html
// @inclure AM1_physique.js
// @inclure AM1_orbitales.js
// @description Remplir les cases quantiques d'un atome ou d'un ion (Pauli, Hund, Klechkowski), comparer à la configuration réelle, puis visualiser les orbitales hydrogénoïdes.
'use strict';
/* =====================================================================
   AM1 · Structure électronique des atomes (3 onglets) · migré sur AnimKit le 8 novembre 2026
   1 Remplir les cases · 2 Ions · 3 Orbitales
   Physique : AM1_physique.js (configurations de H à Kr, ions, diagnostics) · AM1_orbitales.js (nuage et distribution radiale).
   Propositions du lot 17 : la lecture « +e⁻ » affiche la configuration réelle de l'atome suivant (Cr, Cu réorganisés) ;
   les prévisions (configuration attendue, ion) restent masquées tant qu'on ne demande pas la comparaison.
   ===================================================================== */
const P=AM1P,O=AM1O,M=AnimKit.M;
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const SUPU='⁰¹²³⁴⁵⁶⁷⁸⁹',sp=n=>[...String(n)].map(c=>SUPU[+c]).join('');
const lay={boxes:[],last:null};
const ROWS=['4p','3d','4s','3p','3s','2p','2s','1s'];
const KLEC=['1s','2s','2p','3s','3p','4s','3d','4p'];
const ORB={
  '1s':{n:1,l:0,shape:'s',lab:'1s'},'2s':{n:2,l:0,shape:'s',lab:'2s'},
  '2px':{n:2,l:1,shape:'px',lab:'2p (axe x)'},'2py':{n:2,l:1,shape:'py',lab:'2p (axe y)'},'2pz':{n:2,l:1,shape:'pz',lab:'2p (axe z)'},
  '3s':{n:3,l:0,shape:'s',lab:'3s'},'3pz':{n:3,l:1,shape:'pz',lab:'3p (axe z)'},
  '3dz2':{n:3,l:2,shape:'dz2',lab:'3d (z²)'},'3dxy':{n:3,l:2,shape:'dxy',lab:'3d (xy)'},'3dxz':{n:3,l:2,shape:'dxz',lab:'3d (xz)'},
  '3dyz':{n:3,l:2,shape:'dyz',lab:'3d (yz)'},'3dx2y2':{n:3,l:2,shape:'dx2y2',lab:'3d (x²−y²)'}
};
const RV={1:5.5,2:16,3:36};                       // rayon de vue fixe, en a₀ pour Z = 1
const ORBOPT=Object.keys(ORB).map(k=>[k,ORB[k].lab]);
const IONOPT=P.ION_LIST.map(i=>[i.z+':'+i.q,i.label+' (Z = '+i.z+')']);
const ionOf=v=>{const [z,q]=String(v).split(':').map(Number);return{z,q}};

/* ---------- paragraphe SVG à retour à la ligne ---------- */
function wrap(a,x,y,txt,maxW,size,c,lh=20){
  const k=a.k,cw=.52*size*k,max=Math.max(8,Math.floor(maxW/cw)),lines=[];let cur='';
  for(const w of String(txt).split(' ')){const t=cur?cur+' '+w:w;if(t.length>max&&cur){lines.push(cur);cur=w}else cur=t}
  if(cur)lines.push(cur);
  return{svg:lines.map((l,i)=>a.S.text(x,y+i*lh*k,l,{size,c,halo:false})).join(''),h:lines.length*lh*k};
}

/* ---------- état : cases, cible ---------- */
function syncRef(a){const p=a.p;p.acc=0;if(p.mode==='ref')p.boxes=P.boxesFor(P.targetCounts(p.z,p.q))}
function toFill(a){if(a.p.mode!=='fill')a.set('mode','fill',{silent:true})}
const spinTxt=s=>s>0?'↑':'↓';

/* configurations fautives des défis */
function mk(spec){const b=P.emptyBoxes();for(const k in spec)spec[k].forEach((e,i)=>{b[k][i]=e.slice()});return b}
const FAUX={
  hundC:{z:6,q:0,b:()=>mk({'1s':[[1,-1]],'2s':[[1,-1]],'2p':[[1,-1],[],[]]})},
  pauliN:{z:7,q:0,b:()=>mk({'1s':[[1,-1]],'2s':[[1,-1]],'2p':[[1,1],[1],[]]})},
  hundO:{z:8,q:0,b:()=>mk({'1s':[[1,-1]],'2s':[[1,-1]],'2p':[[1,-1],[1,-1],[]]})},
  copper:{z:29,q:0,b:()=>P.boxesFor({...P.NOBLE.Ar,'4s':2,'3d':9})},
  iron:{z:26,q:2,b:()=>P.boxesFor({...P.NOBLE.Ar,'4s':2,'3d':4})}
};
function defi(a,id){
  const d=FAUX[id],p=a.p;
  p.z=d.z;p.q=d.q;a.set('z',d.z,{silent:true});
  if(d.q)a.set('ion',d.z+':'+d.q,{silent:true});
  a.set('mode','fill',{silent:true});p.boxes=d.b();p.acc=0;a.play(false);a.render();
}

/* =====================================================================
   Panneau des cases quantiques
   ===================================================================== */
function drawCases(a){
  const Pn=a.panels.cases,W=Pn.w,H=Pn.h,k=a.k,S=a.S,C=a.C,p=a.p;
  const dg=P.diagnose(p.boxes,p.z,p.q),cnt=P.countsOf(p.boxes);
  const top=14*k,bot=12*k,rh=(H-top-bot)/8,labW=78*k;
  const bw=Math.min(46*k,(W-labW-34*k)/5),bh=Math.min(rh*(p.qn?.6:.8),bw*1.15);
  const x0=labW+12*k;
  let s=S.arrow(14*k,H-bot,14*k,top-4*k,{c:C.ink2,w:1.6})+S.text(31*k,top+(H-top-bot)/2,'énergie croissante',{size:13,c:C.ink2,rot:-90,anchor:'middle',halo:false});
  lay.boxes=[];
  ROWS.forEach((key,r)=>{
    const l=P.L(key),m=2*l+1,ry=top+r*rh+(rh-bh)/2-(p.qn?5*k:0),n=cnt[key]||0,hbad=dg.hundShells.includes(key);
    s+=S.text(44*k,ry+bh/2,key,{size:18,c:hbad?C.F:C.ink,weight:700,halo:false});
    if(p.qn)s+=S.text(44*k,ry+bh/2+19*k,`ℓ = ${l}`,{size:13,c:C.ink2,halo:false});
    for(let i=0;i<m;i++){
      const bx=x0+i*bw,e=p.boxes[key][i],bad=dg.invalid.includes(key)&&(e.length>2||new Set(e).size!==e.length);
      lay.boxes.push({k:key,i,x:bx,y:ry,w:bw,h:bh});
      s+=S.rect(bx,ry,bw,bh,{fill:C.cSoft,c:bad?C.F:C.ink2,w:bad?2.8:1.6,rx:3*k});
      e.forEach((sg,j)=>{const ax=bx+bw*(e.length===1?.5:j?.7:.3),up=sg>0;
        s+=up?S.arrow(ax,ry+bh*.84,ax,ry+bh*.16,{c:C.B,w:2.8}):S.arrow(ax,ry+bh*.16,ax,ry+bh*.84,{c:C.Em,w:2.8})});
      if(p.qn){const ml=i-l;s+=S.text(bx+bw/2,ry+bh+13*k,ml>0?'+'+ml:ml<0?'−'+(-ml):'0',{anchor:'middle',size:13,c:C.ink2,halo:false})}
    }
    if(n)s+=S.text(x0+m*bw+10*k,ry+bh/2,`${n} e⁻`,{size:14,c:C.ink2,halo:false});
  });
  a.svg('cases',s);
}

/* =====================================================================
   Panneau de droite : configuration, diagnostics, triangle de Klechkowski
   ===================================================================== */
function flow(a,x,y,maxW,tokens,size){
  const k=a.k,S=a.S,C=a.C;let s='',cx=x,cy=y;const lh=size*1.55*k;
  for(const t of tokens){
    const w=(t.t.length*.6+.5)*size*k;
    if(cx+w>x+maxW&&cx>x){cx=x;cy+=lh}
    s+=S.text(cx,cy,t.t,{size,c:t.dim?C.ink2:C.ink,weight:t.dim?400:700,halo:false});
    if(t.under)s+=S.line(cx,cy+size*.72*k,cx+w-.4*size*k,cy+size*.72*k,{c:C.c,w:2});
    cx+=w;
  }
  return{svg:s,y:cy+lh};
}
function drawDroite(a){
  const Pn=a.panels.droite,W=Pn.w,H=Pn.h,k=a.k,S=a.S,C=a.C,p=a.p,f=a.fmt;
  const z=p.z,q=p.q,el=P.ELEMENTS[z-1],cnt=P.countsOf(p.boxes),dg=P.diagnose(p.boxes,z,q);
  const ref=P.targetCounts(z,q),showRef=p.mode==='ref'||p.verif,n=dg.total,ne=z-q;
  const mx=W-36*k;
  let s=S.text(18*k,10*k,`${el.name} · ${P.label(z,q)} · Z = ${z}`,{base:'top',size:16,c:C.cInk,weight:600});
  let y=52*k;
  /* configuration écrite */
  let toks=[];
  if(n===0)toks=[{t:'aucun électron placé',dim:true}];
  else{
    const val=q===0&&showRef?P.valenceKeys(z):[];
    if(p.core){const cd=P.condensed(cnt);if(cd.core)toks.push({t:'['+cd.core+']',dim:true});for(const [kk,v] of cd.terms)toks.push({t:kk+sp(v),under:val.includes(kk)})}
    else for(const [kk,v] of P.terms(cnt))toks.push({t:kk+sp(v),dim:!!val.length&&!val.includes(kk)&&q===0,under:val.includes(kk)});
  }
  const fl=flow(a,18*k,y,mx,toks,22);s+=fl.svg;y=fl.y;
  s+=S.text(18*k,y-6*k,`${n} électron${n>1?'s':''} placé${n>1?'s':''} sur ${ne}`,{size:14,c:C.ink2,halo:false});y+=22*k;
  /* diagnostics */
  const diag=(ok,txt)=>{const w=wrap(a,42*k,y,txt,mx-24*k,14,ok?C.ink2:C.ink);
    const r=S.text(18*k,y,ok?'✓':'✗',{size:16,c:ok?C.v:C.F,weight:700,halo:false});y+=Math.max(w.h,22*k)+2*k;return r+w.svg};
  s+=diag(dg.pauli,dg.pauli?'Pauli : au plus deux électrons par case, de spins opposés.':`Pauli violé en ${dg.invalid.join(', ')} : deux électrons de même spin dans une case.`);
  s+=diag(dg.hund,dg.hund?'Hund : spins parallèles dans des cases différentes avant tout appariement.':`Hund violée en ${dg.hundShells.join(', ')} : remplir d’abord toutes les cases avec des spins parallèles.`);
  if(showRef&&p.mode==='fill'){
    const ok=dg.countsMatch;
    s+=diag(ok,ok?`Configuration identique à la configuration réelle de ${P.label(z,q)}.`:`Configuration réelle de ${P.label(z,q)} : ${P.terms(ref).map(([kk,v])=>kk+sp(v)).join(' ')}.`);
  }
  if(showRef&&n>0&&dg.countsMatch){
    const nb=P.noble(cnt);
    if(nb)s+=diag(true,`Configuration de gaz noble : celle de ${nb}.`);
    if(a.tab===1){const same=P.sameAs(cnt);if(same.length>1){const w=wrap(a,18*k,y,`Même configuration électronique : ${same.join(', ')}.`,mx,14,C.ink2);s+=w.svg;y+=w.h+4*k}}
  }
  if(showRef&&q===0&&(z===24||z===29)&&dg.countsMatch&&p.hundx){
    const w=wrap(a,18*k,y,'Exception à Klechkowski : une sous-couche d à moitié ou entièrement remplie est plus stable (hors programme).',mx,14,C.ink2);s+=w.svg;y+=w.h+4*k}
  /* triangle de Klechkowski */
  y+=6*k;
  const avail=H-y-10*k;
  if(avail>150*k){
    s+=S.text(18*k,y,'Ordre de Klechkowski',{base:'top',size:15,c:C.cInk,weight:600});
    const gy=y+44*k,ch=Math.min(70*k,(H-gy-12*k)/4),cw=Math.min(84*k,(W-70*k)/4),gx=Math.max(54*k,(W-4*cw)/2+24*k);
    for(let l=0;l<4;l++)s+=S.text(gx+l*cw+cw/2,y+30*k,'spdf'[l]+` (ℓ = ${l})`,{anchor:'middle',size:13,c:C.ink2,halo:false});
    const cell={},ctr=key=>{const nn=+key[0],l=P.L(key);return[gx+l*cw+cw/2,gy+(nn-1)*ch+ch/2]};
    for(let nn=1;nn<=4;nn++){
      s+=S.text(gx-14*k,gy+(nn-1)*ch+ch/2,`n = ${nn}`,{anchor:'end',size:13,c:C.ink2,halo:false});
      for(let l=0;l<nn;l++){
        const key=nn+'spdf'[l],[cx,cy]=ctr(key),v=cnt[key]||0,full=v===P.CAP(key),used=P.KEYS.includes(key);
        cell[key]=[cx,cy];
        s+=S.rect(cx-cw/2+3*k,cy-ch/2+3*k,cw-6*k,ch-6*k,{fill:full?C.c:v?C.cSoft:'none',fop:full?.28:1,c:v?C.c:C.rule,w:v?2:1.2,rx:4*k,dash:used?undefined:`${4*k} ${4*k}`});
        s+=S.text(cx,cy-(p.nl?8*k:0),key+(v?sp(v):''),{anchor:'middle',size:16,c:v?C.ink:C.ink2,weight:v?700:400,halo:false});
        if(p.nl)s+=S.text(cx,cy+12*k,`n+ℓ = ${nn+l}`,{anchor:'middle',size:13,c:C.ink2,halo:false});
      }
    }
    for(let i=0;i<KLEC.length-1;i++){
      const A1=cell[KLEC[i]],B1=cell[KLEC[i+1]],d=Math.hypot(B1[0]-A1[0],B1[1]-A1[1]),u=[(B1[0]-A1[0])/d,(B1[1]-A1[1])/d];
      const t0=Math.min(.3*d,34*k),t1=Math.min(.3*d,30*k);
      s+=S.arrow(A1[0]+u[0]*t0,A1[1]+u[1]*t0,B1[0]-u[0]*t1,B1[1]-u[1]*t1,{c:C.ink2,w:1.6,dash:`${5*k} ${4*k}`,op:.75});
    }
  }
  a.svg('droite',s);
  const ms=[{label:'Électrons placés',value:`${n} sur ${ne}`}];
  if(showRef&&q===0)ms.push({label:'Électrons de valence',value:String(P.valenceKeys(z).reduce((t,kk)=>t+(ref[kk]||0),0)),hint:'dernière couche (et d incomplète)'});
  a.metrics(ms);
  a.legend([{c:C.B,label:'↑ spin +½',dot:true},{c:C.Em,label:'↓ spin −½',dot:true}]);
}

/* =====================================================================
   Onglet orbitales : nuage (canvas) et distribution radiale (SVG)

function drawCloud(a){
  const Pn=a.panels.orb,c=Pn.ctx,W=Pn.w,H=Pn.h,k=a.k,C=a.C,p=a.p;
  const o=ORB[p.orb],cl=O.cloud(o.n,o.l,o.shape),Z=+p.Zh;
  c.fillStyle=C.card;c.fillRect(0,0,W,H);
  const R=Math.min(W,H)*.42,cx=W/2,cy=H/2+10*k,pxa=R/RV[o.n],sc=pxa/Z;
  const cy1=Math.cos(p.yaw),sy=Math.sin(p.yaw),cp=Math.cos(p.pitch),sp_=Math.sin(p.pitch);
  const proj=(x,y,zz)=>{const xr=x*cy1-y*sy,yr=x*sy+y*cy1,y2=yr*cp-zz*sp_,z2=yr*sp_+zz*cp;return[cx+xr,cy-z2,y2]};
  /* axes */
  c.lineWidth=1.4*k;c.font=`${14*k}px system-ui,sans-serif`;c.textAlign='center';c.textBaseline='middle';
  for(const [lab,v] of[['x',[1,0,0]],['y',[0,1,0]],['z',[0,0,1]]]){
    const e=proj(v[0]*R*.98,v[1]*R*.98,v[2]*R*.98);
    c.globalAlpha=.55;c.strokeStyle=C.ink2;c.beginPath();c.moveTo(cx,cy);c.lineTo(e[0],e[1]);c.stroke();
    c.globalAlpha=1;c.fillStyle=C.ink2;c.fillText(lab,cx+(e[0]-cx)*1.06,cy+(e[1]-cy)*1.06);
  }
  /* nuage */
  const N=Math.min(cl.points.length,p.npts),s=2.2*k,half=s/2;
  let lastSign=0;
  for(let i=0;i<N;i++){
    const pt=cl.points[i],q=proj(pt[0]*sc,pt[1]*sc,pt[2]*sc),sg=p.phase?pt[3]:1;
    if(sg!==lastSign){c.fillStyle=sg>0?C.B:C.F;lastSign=sg}
    c.globalAlpha=clamp(.32+.4*(q[2]/R),.12,.8);
    c.fillRect(q[0]-half,q[1]-half,s,s);
  }
  c.globalAlpha=1;
  /* échelle */
  const nice=[1,2,5,10,20].find(L=>L*pxa/Z>=50*k)||20,len=nice*pxa/Z;
  c.strokeStyle=C.ink;c.lineWidth=2*k;c.beginPath();c.moveTo(18*k,H-26*k);c.lineTo(18*k+len,H-26*k);c.stroke();
  c.textAlign='left';c.fillStyle=C.ink;c.fillText(`${nice} a₀`,18*k,H-44*k);
  c.fillStyle=C.cInk;c.font=`600 ${16*k}px system-ui,sans-serif`;c.fillText(`${o.lab} · ${Z===1?'H':'He⁺'}`,18*k,22*k);
}
function drawRadial(a){
  const Pn=a.panels.rad,W=Pn.w,H=Pn.h,k=a.k,S=a.S,C=a.C,p=a.p,f=a.fmt;
  const o=ORB[p.orb],cl=O.cloud(o.n,o.l,o.shape),Z=+p.Zh,dr=cl.dr;
  const xmax=RV[o.n]/Z,ymax=Z*cl.max*1.15;
  const Pr=r=>{const t=r*Z/dr,i=Math.floor(t);if(i<0||i>=cl.radial.length-1)return 0;const w=t-i;return Z*(cl.radial[i]*(1-w)+cl.radial[i+1]*w)};
  let s='';
  const G=S.graph({x:0,y:6*k,w:W,h:H-6*k,xmin:0,xmax,ymin:0,ymax,padL:62*k,padB:46*k,padT:22*k,
    xfmt:v=>f.sig(v,2).replace(/\.0+$/,''),yfmt:v=>f.sig(v,2),
    xlab:`${S.v('r')} (en ${S.v('a','0')})`,ylab:`densité radiale ${S.v('P')}(${S.v('r')}) (en ${S.v('a','0')}${S.sup('−1')})`});
  s+=G.svg+S.clip('am1r',G);
  const pts=[];for(let i=0;i<=300;i++){const r=xmax*i/300;pts.push([r,Pr(r)])}
  s+=S.curve(pts,G,{c:C.c,w:3});
  let imax=0;for(let i=0;i<cl.radial.length;i++)if(cl.radial[i]>cl.radial[imax])imax=i;
  const rmp=imax*dr/Z;let mean=0;for(let i=0;i<cl.radial.length;i++)mean+=i*dr*cl.radial[i]*dr;mean/=Z;
  lay.rad={rmp,mean,nodes:o.n-o.l-1};
  if(p.marks){
    s+=S.line(G.X(rmp),G.y0,G.X(rmp),G.y0+G.h,{c:C.B,w:1.8,dash:`${6*k} ${4*k}`});
    s+=S.line(G.X(mean),G.y0,G.X(mean),G.y0+G.h,{c:C.Em,w:1.8,dash:`${2*k} ${4*k}`});
  }
  a.svg('rad',s);
  const ar=`<i class="m">a</i><sub>0</sub>`;
  const ms=[{label:'Orbitale',value:o.lab,hint:`n = ${o.n}, ℓ = ${o.l}`}];
  if(p.marks)ms.push({label:'Rayon le plus probable',value:`${f.sig(rmp,3)} ${ar}`},{label:'Rayon moyen ⟨r⟩',value:`${f.sig(mean,3)} ${ar}`},{label:'Nœuds radiaux',value:String(o.n-o.l-1),hint:'n − ℓ − 1'});
  a.metrics(ms);
  const lg=[{c:C.B,label:p.phase?'signe + de la fonction d’onde':'densité de probabilité de présence',dot:true}];
  if(p.phase)lg.push({c:C.F,label:'signe −',dot:true});
  lg.push({c:C.c,label:'P(r) : probabilité par unité de longueur'});
  if(p.marks)lg.push({c:C.B,label:'rayon le plus probable',dash:true},{c:C.Em,label:'rayon moyen',dash:true});
  a.legend(lg);
}

});

/* ---------- clic sur une case ---------- */
A.drag('cases',{
  hit:(x,y)=>A.tab<2&&lay.boxes.some(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h),
  start(x,y){
    const b=lay.boxes.find(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);if(!b)return;
    A.play(false);
    if(A.p.mode!=='fill'){A.p.boxes=P.clone(A.p.boxes);A.set('mode','fill',{silent:true})}
    const e=A.p.boxes[b.k][b.i],tool=A.p.tool;
    if(tool==='up'||tool==='down'){if(e.length<2)e.push(tool==='up'?1:-1)}
    else if(tool==='flip'){if(e.length===1)e[0]=-e[0];else if(e.length===2){const j=x<b.x+b.w/2?0:1;e[j]=-e[j]}}
    else e.pop();
    A.p.acc=0;
  },
  move(){},end(){}
});
/* ---------- rotation du nuage ---------- */
A.drag('orb',{
  start(x,y){A.play(false);lay.last=[x,y]},
  move(x,y){const l=lay.last;if(!l)return;A.p.yaw+=(x-l[0])*.01;A.p.pitch=clamp(A.p.pitch+(y-l[1])*.01,-1.5,1.5);lay.last=[x,y];A.render()},
  end(){lay.last=null}
});
