/* ---------- mathématiques en HTML ---------- */

/* ---------- coquille ---------- */
.ak{--fs:17px;font-size:var(--fs);position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;background:var(--paper)}

.ib{display:inline-flex;align-items:center;justify-content:center;gap:.35em;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:.45em;padding:.3em .55em;font-size:.85em;cursor:pointer;min-height:2.2em;white-space:nowrap}

.ak-body{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) 18.5em;gap:.6em;padding:0 .6em .6em;border-top:1px solid var(--rule)}
.ak-main{display:flex;flex-direction:column;gap:.5em;padding-top:.6em;min-width:0;min-height:0}

.ak-panel>svg,.ak-panel>canvas{flex:1;min-height:0;width:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}

@media (hover:hover) and (pointer:fine){
  .ak-ptools{opacity:0;transition:opacity .15s}

.ak-ptools .mini{padding:.1em .45em;min-height:1.7em}

.mini{border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:.35em;font-size:.85em;padding:.15em .5em;cursor:pointer;min-height:1.9em}
.mini:hover{border-color:var(--c)}
.mini[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
/* légende : bande fine entre la scène et la barre de lecture (6 novembre 2026) */
.ak-legend{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.1em 1em;padding:.1em .7em;font-size:.74em;line-height:1.35;color:var(--ink2);border-top:1px solid var(--rule);flex:none}

.ak-chk>input:checked+.ak-switch-track{background:var(--switch-on,var(--c))}
.ak-chk>input:checked+.ak-switch-track::after{transform:translateX(18px)}
.ak-chk>input:focus-visible+.ak-switch-track{outline:2px solid var(--c-ink);outline-offset:2px}
.ak-chk:has(>input:disabled){opacity:.56;cursor:default}

.ak-note{font-size:.8em;color:var(--ink2);margin:.3em 0 0}

/* ---------- projection ---------- */
.ak.is-proj .ak-body{grid-template-columns:minmax(0,1fr)}
.ak.is-proj .ak-right{display:contents}
.ak.is-proj .ak-transport .ak-lbl{display:none}
.ak.is-proj .ak-play{min-width:0}
.ak.is-proj .ak-side{position:absolute;top:var(--ak-top,calc(2.95em + 3px));right:0;bottom:0;width:19em;max-width:92%;background:var(--paper);border-left:1px solid var(--rule);padding:.7em;transform:translateX(105%);transition:transform .2s;box-shadow:-8px 0 24px rgb(0 0 0/.25);z-index:5;visibility:hidden}
.ak.is-proj.drawer-open .ak-side{transform:none;visibility:visible}
/* projection : le volet ouvert pousse la scène à gauche au lieu de la recouvrir (6 novembre 2026) */
.ak.is-proj.drawer-open .ak-body{grid-template-columns:minmax(0,1fr) 19em}
.ak.is-proj.drawer-open .ak-right{display:flex}
.ak.is-proj.drawer-open .ak-side{position:static;width:auto;max-width:none;padding:0;background:none;border-left:0;box-shadow:none;transition:none}
.ak.is-proj .ak-drawer-head{display:flex}
.ak.is-proj .ak-btn-settings{display:inline-flex}

/* ---------- téléphone ---------- */
@media (max-width:640px){.ak{height:auto;min-height:100vh;min-height:100dvh;overflow:visible}}
@media (max-width:640px){
  .ak-chk{min-height:44px}
  .ak-body{grid-template-columns:minmax(0,1fr);padding:0 .4em .4em}
  .ak-sub,.ak-lbl{display:none}
  .ak-tools .ib{padding:.3em .45em}
  .ak-title{font-size:1.05em}
  .ak-ptools .mini{min-height:36px}

  .ak-tools [data-act=image],.ak-tools [data-act=proj]{display:none}
  .ak-btn-settings{display:inline-flex}
  .ak-side{position:fixed;left:0;right:0;bottom:0;max-height:72%;background:var(--paper);border-top:1px solid var(--rule);border-radius:1em 1em 0 0;padding:.6em .9em 1em;transform:translateY(105%);transition:transform .2s;box-shadow:0 -8px 24px rgb(0 0 0/.3);z-index:5;visibility:hidden}
  .ak.drawer-open .ak-side{transform:none;visibility:visible}
  .ak-drawer-head{display:flex}
  .ak-panels{flex-direction:column;flex:none}
  .ak-panel{flex:none!important}
  .ak-scene{flex:none;overflow:visible}
  .ak-panel+.ak-panel{border-left:0;border-top:1px solid var(--rule)}
  .ak-panel>svg,.ak-panel>canvas{flex:none}
  .ak-right{display:contents}
  .ak-right>.ak-metrics{flex-direction:row;flex-wrap:wrap}.ak-metric{flex:1 1 40%}
    .ib,.ak-grp .mini,.ak-play,.ak-speed{min-height:44px}

}

/* ---------- disposition « atelier » (7 novembre 2026, facultative) ----------
   Saisie à gauche ; résultat, graphique et détail du calcul à droite ; une colonne sur téléphone. */
.ak-atelier .ak-body{grid-template-columns:minmax(19em,5fr) minmax(0,7fr)}
.ak.ak-atelier .ak-right,.ak.ak-atelier.is-proj .ak-right{display:none}
.ak.ak-atelier .ak-btn-settings,.ak.ak-atelier.is-proj .ak-btn-settings{display:none}
.ak.ak-atelier.is-proj .ak-body{grid-template-columns:minmax(18em,4fr) minmax(0,8fr)}
.ak-saisie{margin-top:.6em;padding:.6em .8em;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:.4em;overscroll-behavior:contain}
.ak-zone-h{font-size:.72em;letter-spacing:.06em;text-transform:uppercase;color:var(--c-ink);font-weight:700}
.ak-res{padding:.45em .8em;flex:none}
.ak-detail{flex:none;padding:0 .8em}
.ak-detail summary{cursor:pointer;padding:.45em 0;font-size:.9em;font-weight:600;color:var(--c-ink)}
.ak-detail[open]{max-height:42%;overflow:auto}
.ak-detail-body{padding:0 0 .6em}
@media (max-width:640px){
  .ak-atelier .ak-body{grid-template-columns:minmax(0,1fr)}
  .ak-atelier .ak-saisie{margin-top:.4em;overflow:visible}
  .ak-atelier .ak-detail[open]{max-height:none;overflow:visible}
}

/* ---------- aide, messages ---------- */
.ak-dialog{max-width:min(680px,92vw);max-height:85vh;border:1px solid var(--rule);border-radius:12px;background:var(--card);color:var(--ink);padding:0;font-family:var(--font)}

.ak-dialog p,.ak-dialog li{margin:.3em 0}
.ak-dialog kbd{font:12px var(--font);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 5px}
.ak-toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.ak-toast.show{opacity:1}

<script>
/* =====================================================================
   AnimKit · script commun des animations de MPSI
   E. Guillaume · charte du 2 novembre 2026 (Charte_Animations.html)

   Une animation décrit sa configuration et ses fonctions :
     AnimKit.app({
       code:'OP1', partie:'TurquoiseLagon', titre:'…', sousTitre:'…', chapitre:'OP1 Propagation de la lumière',
       onglets:['Vue de face','Perspective'],            // facultatif
       temps:true | (app)=>bool,                          // barre de lecture
       pas:1/24,                                          // durée simulée d'un « Pas »
       panneaux:[{id:'scene', titre:'…', poids:2, type:'svg'|'canvas', onglets:[0], ratioTel:.8, zoom:true}],
       reglages:[{titre:'Situations', presets:[{label, valeurs:{…}, lecture:true}]},
                 {titre:'…', items:[{id,type:'range'|'select'|'seg'|'check'|'boutons'|'note', …}], onglets:[…], si:(app)=>bool}],
       aide:{voit, faire, modele, cours},
       init(app), reset(app), step(app,dt), draw(app), change(app,id,v), onglet(app,i)
     })
   Le kit fournit : app.p (paramètres), app.tab, app.t, app.C (couleurs), app.k (échelle projection),
   app.S (dessin SVG), app.fmt (nombres), app.metrics(), app.insight(), app.legend(), app.clock(), app.drag()…
   Réglage à échelle logarithmique : {id,type:'range',log:true,min,max,dec} (curseur en log10, champ numérique en valeur réelle).
   Disposition facultative  atelier:{saisie:'Mes mesures', detail:'Voir le calcul'} : app.zones.saisie / .resultat / .detail
   (nœuds DOM à remplir par l'animation) ; pas de colonne de réglages.
   ===================================================================== */
(function(){
'use strict';
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const MATH='"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif';
const MINUS='−';

/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  /** n chiffres significatifs, sans notation exponentielle */
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e<-3||e>=6){const m=x/10**e;return (+m.toFixed(n-1)).toFixed(n-1).replace('-',MINUS)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>'}
    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- icônes ---------------- */
const IC={
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
  sommaire:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h0"/></svg>',
  theme:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>',
  proj:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M12 16v4M8 20h8"/></svg>',
  fs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  cadrer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>',
  step:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5l9 7-9 7zM16 5h2.5v14H16z"/></svg>',
  reset:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>'
};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function el(tag,attrs={},html){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs))if(v!==undefined&&v!==null&&v!==false)e.setAttribute(k,v===true?'':v);if(html!==undefined)e.innerHTML=html;return e}

function interrupteur(label,id){
  const conteneur=el('label',{class:'ak-chk'});
  conteneur.append(
    el('input',{type:'checkbox',role:'switch',id}),
    el('span',{class:'ak-switch-track','aria-hidden':'true'}),
    el('span',{},label)
  );
  return conteneur;
}

/* ---------------- mathématiques en HTML ---------------- */
const M={
  v:(s,sub,sup)=>`<span class="m">${s}</span>${sub!==undefined?`<sub>${sub}</sub>`:''}${sup!==undefined?`<sup>${sup}</sup>`:''}`,
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt"><span class="sym">√</span><span class="rad">${x}</span></span>`,
  vec:s=>`<span class="vec">${s}</span>`
};

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}
      return s;
    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){
      let d='',pen=false;
      for(const[x,y]of pts){if(!isFinite(y)||!isFinite(x)){pen=false;continue}
        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}
      return`<g clip-path="url(#${G.clip||''})">`+S.path(d,o)+'</g>';
    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}
  };
  return S;
}

/* ===================================================================== */
function app(cfg){
  const A={cfg,p:{},tab:0,t:0,running:false,speed:1,k:1,narrow:false,C:{},fmt,M,panels:{},_dirty:false};
  A.S=makeS(A);
  const root=document.documentElement;
  root.dataset.theme='dark';
  if(cfg.partie)root.style.setProperty('--chap',`var(--${cfg.partie})`);
  document.title=cfg.titreFenetre||`${cfg.titre} · ${cfg.code} · MPSI`;

  /* ---------- structure ---------- */
  const ak=el('div',{class:cfg.menuCommun?'ak ak-menu-commun':'ak',id:'ak'});
  const top=el('header',{class:'ak-top'});
  top.innerHTML=`<span class="ak-badge">${cfg.code}</span><div class="ak-titles"><h1 class="ak-title">${cfg.titre}</h1></div>
  <nav class="ak-tools" aria-label="Outils">
   <button class="ib ak-btn-settings" data-act="settings" title="Réglages">${IC.settings}<span class="ak-lbl">Réglages</span></button>
   <button class="ib" data-act="help" title="Aide (H)">${IC.help}<span class="ak-lbl">Aide</span></button>
   <button class="ib" data-act="theme" title="Thème clair / sombre (T)">${IC.theme}<span class="ak-lbl">Thème</span></button>
   <button class="ib" data-act="image" title="Enregistrer l'image (I)">${IC.image}<span class="ak-lbl">Image</span></button>
   <button class="ib" data-act="proj" title="Mode projection (P)">${IC.proj}<span class="ak-lbl">Projection</span></button>
   <button class="ib" data-act="fs" title="Plein écran (F)">${IC.fs}</button>
  </nav>`;
  const nav=$('.ak-tools',top);
  const themeButton=$('[data-act=theme]',nav);
  const projButton=$('[data-act=proj]',nav);
  const fullButton=$('[data-act=fs]',nav);
  if(cfg.menuCommun){
    nav.insertBefore($('[data-act=settings]',nav),fullButton);
    $('[data-act=image]',nav).title='Enregistrer une image PNG (I)';
  }
  function syncMenu(){
    if(!cfg.menuCommun)return;
    const dark=root.dataset.theme==='dark', projected=ak.classList.contains('is-proj');
    const full=Boolean(document.fullscreenElement);
    themeButton.title=dark?'Passer au thème clair (T)':'Passer au thème sombre (T)';
    $('.ak-lbl',projButton).textContent=projected?'Réglages':'Projection';
    projButton.title=projected?'Rétablir les réglages (P)':'Agrandir la scène et masquer les réglages (P)';
    projButton.setAttribute('aria-pressed',String(projected));
    const fullscreenLabel=full?'Quitter le plein écran':'Plein écran';
    fullButton.setAttribute('aria-label',fullscreenLabel);
    fullButton.title=fullscreenLabel+' (F)';
  }
  if(cfg.menuCommun){
    syncMenu();
    document.addEventListener('fullscreenchange',syncMenu);
  }
  $('[data-act=help]',top).before(el('a',{
    class:'ib ak-sommaire',href:'https://emiliengui.github.io/animations-physique/',
    'aria-label':'Sommaire des animations',title:'Retour au sommaire des animations'
  },`${IC.sommaire}<span class="ak-lbl">Sommaire</span>`));

    else if(k==='+'||k==='='||k==='-'||k==='0'){const P=(A._hover&&!A._hover.el.hidden&&A._hover.vue)?A._hover:Object.values(A.panels).find(q=>q.vue&&!q.el.hidden);if(P){e.preventDefault();if(k==='0')A.cadrer(P);else A.zoomer(P,k==='-'?.8:1.25)}}
    else if(k==='escape'){ak.classList.remove('drawer-open');A.render()}
    else if(/^[1-9]$/.test(k))A.setTab(+k-1);
  });

  /* ---------- vue : zoom, cadrage, déplacement ---------- */
  const deplacable=P=>P.vue==='svg'||P.vue==='graphe';
  function zoomed(P){
    if(P.vue==='interne')return Math.abs(P.zoom-1)>1e-6;
    if(!deplacable(P))return false;
    const seuil=P.vue==='graphe'?1e-6:.5;
    return Math.abs(P.vz-1)>1e-6||Math.abs(P.vx)>seuil||Math.abs(P.vy)>seuil;
  }
  const markZoom=P=>{if(P.tools)P.tools.classList.toggle('is-zoomed',zoomed(P))};
  const graphAt=(P,x,y)=>P.graphs.find(g=>x>=g.x0&&x<=g.x0+g.w&&y>=g.y0&&y<=g.y0+g.h);
  function resetView(P){P.vz=1;P.vx=P.vy=0;P.zoom=1;P.panX=P.panY=0;markZoom(P)}
  /** zoom d'un facteur f autour du point (px, py) de l'écran du panneau (centre par défaut) */
  A.zoomer=(P,f,px,py)=>{if(typeof P==='string')P=A.panels[P];if(!P||!P.vue)return;
    if(P.vue==='interne')P.zoom=Math.max(.4,Math.min(5,P.zoom*f));
    else{
      if(P.vue==='graphe'){
        const graph=graphAt(P,px,py);
        px=graph?(px-graph.x0)/graph.w:.5;
        py=graph?(py-graph.y0)/graph.h:.5;
      }else{px=px??P.w/2;py=py??P.h/2}
      const z=Math.max(.5,Math.min(8,P.vz*f)), delta=1/P.vz-1/z;
      P.vx+=px*delta;P.vy+=py*delta;P.vz=z;
    }
    markZoom(P);A.render()};
  A.deplacer=(P,dx,dy,px,py)=>{
    if(!deplacable(P))return;
    if(P.vue==='graphe'){const g=graphAt(P,px,py)||P.graphs[0];dx/=g.w;dy/=g.h}
    P.vx-=dx/P.vz;P.vy-=dy/P.vz;markZoom(P);A.render()
  };
  A.cadrer=P=>{if(typeof P==='string')P=A.panels[P];if(!P)return;resetView(P);A.render()};
  A.cadrerTout=()=>{for(const P of Object.values(A.panels))A.cadrer(P)};
  /* ---------- glisser dans un panneau ----------
     Les coordonnées transmises aux animations sont celles de leur dessin (vue zoomée comprise).
     Maj + glisser, bouton du milieu ou deux doigts : déplacer la vue ; molette ou pincement : zoomer.
     Glisser hors de tout objet manipulable déplace aussi la vue quand elle est zoomée. */
  function wire(P){const N=P.node,pts=new Map();let mode=null,h=null,last=null,pin=null;
    const scr=e=>{const r=N.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    const toV=s=>P.vue==='svg'?[P.vx+s[0]/P.vz,P.vy+s[1]/P.vz]:s;
    const two=()=>{const[a,b]=[...pts.values()];return{d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,c:[(a[0]+b[0])/2,(a[1]+b[1])/2]}};
    N.addEventListener('pointerdown',e=>{
      const s=scr(e);A._hover=P;pts.set(e.pointerId,s);
      if(pts.size===2&&P.vue){if(mode==='drag'&&h&&h.end)h.end(e);mode='pinch';h=null;pin=two();N.setPointerCapture(e.pointerId);e.preventDefault();return}
      if(pts.size>1)return;
      const[x,y]=toV(s);
      if(deplacable(P)&&(e.shiftKey||e.button===1))mode='pan';
      else{h=P._drags.find(d=>!d.hit||d.hit(x,y,e))||null;
        if(h){mode='drag';if(h.start)h.start(x,y,e)}
        else if(deplacable(P)&&zoomed(P))mode='pan';
        else{mode=null;return}}
      last=s;N.setPointerCapture(e.pointerId);e.preventDefault();A.render()});
    N.addEventListener('pointermove',e=>{const s=scr(e);
      if(!pts.has(e.pointerId)){if(e.pointerType==='mouse'){const[x,y]=toV(s);N.style.cursor=P._drags.some(d=>d.hit&&d.hit(x,y,e))?'grab':(deplacable(P)&&(e.shiftKey||zoomed(P)))?'move':''}return}
      pts.set(e.pointerId,s);
      if(mode==='pinch'&&pts.size>=2){const q=two();A.zoomer(P,q.d/pin.d,q.c[0],q.c[1]);A.deplacer(P,q.c[0]-pin.c[0],q.c[1]-pin.c[1],q.c[0],q.c[1]);pin=q;return}
      if(mode==='pan'){A.deplacer(P,s[0]-last[0],s[1]-last[1],last[0],last[1]);last=s;return}
      if(mode==='drag'&&h){const[x,y]=toV(s);h.move(x,y,e);A.render()}});
    const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
      if(mode==='drag'&&h&&h.end)h.end(e);
      if(pts.size===0){mode=null;h=null}else if(mode==='pinch'){mode='pan';last=[...pts.values()][0]}
      A.render()};
    N.addEventListener('pointerup',end);N.addEventListener('pointercancel',end);
    if(P.vue){
      N.addEventListener('wheel',e=>{if(A.narrow&&!e.ctrlKey)return;e.preventDefault();const s=scr(e);A.zoomer(P,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),s[0],s[1])},{passive:false});
      N.addEventListener('dblclick',e=>{const[x,y]=toV(scr(e));if(!P._drags.some(d=>d.hit&&d.hit(x,y,e))&&zoomed(P))A.cadrer(P)});
      N.addEventListener('pointerenter',()=>{A._hover=P});
    }
  }
  for(const P of Object.values(A.panels))wire(P);
  A.drag=(id,h)=>{A.panels[id]._drags.push(h)};

  /* ---------- export image (toujours en thème clair) ---------- */
  A.exportImage=async()=>{
    const was=root.dataset.theme; root.dataset.theme='light'; readColors(); A.renderNow();
    const vis=Object.values(A.panels).filter(P=>!P.el.hidden), base=pwrap.getBoundingClientRect(), sc=2;
    const cv=document.createElement('canvas'); cv.width=Math.round(base.width*sc); cv.height=Math.round(base.height*sc);
    const ctx=cv.getContext('2d'); ctx.fillStyle=A.C.card; ctx.fillRect(0,0,cv.width,cv.height);
    const jobs=vis.map(P=>new Promise(res=>{const r=P.node.getBoundingClientRect(), x=(r.left-base.left)*sc, y=(r.top-base.top)*sc;
      if(P.type==='canvas'){ctx.drawImage(P.node,x,y,r.width*sc,r.height*sc);res();return}
      const clone=P.node.cloneNode(true); clone.setAttribute('width',r.width); clone.setAttribute('height',r.height);
      const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
      const im=new Image(); im.onload=()=>{ctx.drawImage(im,x,y,r.width*sc,r.height*sc);res()}; im.onerror=()=>res(); im.src=src;}));
    await Promise.all(jobs);
    root.dataset.theme=was; readColors(); A.renderNow();
    const a=document.createElement('a'); const tabName=cfg.onglets&&cfg.onglets.length>1?'_'+(A.tab+1):'';
    a.download=`${cfg.code}_${(cfg.fichier||cfg.titre).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_')}${tabName}.png`;
    a.href=cv.toDataURL('image/png'); a.click(); A.toast('Image enregistrée (thème clair)');
  };

  /* ---------- aide ---------- */
  function buildHelp(){
    const h=cfg.aide||{}, sec=(t,c)=>c?`<h4>${t}</h4>${/^\s*</.test(c)?c:`<p>${c}</p>`}`:'';
    dlg.innerHTML=`<header><h3>Aide · ${cfg.titre}</h3><button class="mini" data-close>Fermer ✕</button></header><div class="db">
    ${cfg.sousTitre?`<p class="ak-dlg-sub">${cfg.sousTitre}</p>`:''}${sec('Ce qu\'on voit',h.voit)}${sec('Ce qu\'on peut faire',h.faire)}${sec('Modèle et hypothèses',h.modele)}${sec('Lien avec le cours',h.cours)}${sec('Pour aller plus loin',h.plus)}
    <h4>Raccourcis</h4><p>${cfg.temps?'<kbd>Espace</kbd> lecture / pause · <kbd>→</kbd> pas à pas · <kbd>R</kbd> recommencer · ':''}${tabs?`<kbd>1</kbd>–<kbd>${cfg.onglets.length}</kbd> onglets · `:''}<kbd>P</kbd> projection · <kbd>F</kbd> plein écran · <kbd>T</kbd> thème · <kbd>I</kbd> image · <kbd>H</kbd> aide${h.touches?' · '+h.touches:''}</p>
    <p>Vue : molette, pincement ou <kbd>+</kbd> <kbd>−</kbd> pour zoomer · <kbd>Maj</kbd> + glisser, deux doigts, ou glisser une vue zoomée pour la déplacer · « Cadrer », <kbd>0</kbd> ou double clic : vue initiale.</p>
    ${h.credits?`<h4>Crédits</h4><p>${h.credits}</p>`:''}</div>`;
    dlg.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===dlg)dlg.close()});
  }

  /* ---------- démarrage ---------- */
  buildSettings(); buildHelp(); readColors();
  if(cfg.init)cfg.init(A);
  refreshSettings(); A.reset();
  new ResizeObserver(()=>A.render()).observe(ak);
  return A;
}

<script>
'use strict';

const TH2 = (() => {
  const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));
  const points = (a, b, n, f) => Array.from({length: n + 1}, (_, i) => {
    const x = a + (b - a) * i / n;
    return [x, f(x)];
  });
  const range = (id, label, min, max, step, value, unit = '', options = {}) =>
    ({id, label, min, max, step, value, unit, ...options});
  const select = (id, label, value, options, extra = {}) =>
    ({id, label, value, options, type: 'select', ...extra});

  function time(a, seconds) {
    if (seconds === 0) return '0 s';
    const [scale, unit] = seconds < 120 ? [1, 's']
      : seconds < 7200 ? [60, 'min'] : seconds < 172800 ? [3600, 'h'] : [86400, 'j'];
    return a.fmt.sig(seconds / scale, 3) + ' ' + unit;
  }

  function limits(min, max) {
    const pad = Math.max(.8, (max - min) * .085);
    return [min - pad, max + pad];
  }

  const colorStops = {
    viridis: ['#471365', '#472d7b', '#404588', '#375a8c', '#2e6e8e', '#27808e', '#20928c', '#21a585', '#34b679', '#58c765', '#86d549', '#b8de29', '#ece51b'],
    inferno: ['#2b0b57', '#490b6a', '#64156e', '#7d1e6d', '#982766', '#b3325a', '#cb4149', '#e05536', '#ef6e21', '#f98b0b', '#fca80d', '#f9c932', '#f2ea69'],
    cividis: ['#003070', '#263d6e', '#3d4a6c', '#50576c', '#61656f', '#727274', '#828079', '#948e77', '#a79d73', '#bbad6d', '#cfbd62', '#e4ce53', '#f9e03a'],
    blueAmber: ['#174b83', '#3b78a2', '#80adc2', '#c0d5d9', '#eee5cc', '#edcb91', '#d7954f', '#b26324', '#843c1c']
  };

  const palettes = Object.fromEntries(Object.entries(colorStops).map(([id, colors]) =>
    [id, colors.map(color => [1, 3, 5].map(offset => parseInt(color.slice(offset, offset + 2), 16)))]));
  const paletteControl = select('palette', 'Palette de température', 'viridis', [
    ['viridis', 'Viridis · indigo, vert, jaune'],
    ['inferno', 'Inferno · pourpre, orange, ivoire'],
    ['cividis', 'Cividis · bleu ardoise, or'],
    ['blueAmber', 'Bleu–ambre']
  ]);

  function rgbTemperature(position, palette = 'viridis') {
    const colors = palettes[palette];
    const t = clamp(position) * (colors.length - 1);
    const i = Math.min(Math.floor(t), colors.length - 2);
    return colors[i].map((v, j) => Math.round(v + (colors[i + 1][j] - v) * (t - i)));
  }

  function temperatureColor(a, value, min, max) {
    const ratio = max > min ? (value - min) / (max - min) : .5;
    return 'rgb(' + rgbTemperature(ratio, a.p.palette).join(',') + ')';
  }

  function thermalStrip(a, id, x, y, width, height, sample, min, max, segments = 64) {
    let stops = '';
    for (let i = 0; i <= segments; i++) {
      const u = i / segments;
      stops += '<stop offset="' + u + '" stop-color="' + temperatureColor(a, sample(u), min, max) + '"/>';
    }
    return '<defs><linearGradient id="' + id + '">' + stops + '</linearGradient></defs>' +
      a.S.rect(x, y, width, height, {c: a.C.rule, fill: 'url(#' + id + ')'});
  }

  function exportNumber(a, value) {
    const html = a.fmt.sig(value, 3);
    return html.replace(/<sup>(.*?)<\/sup>/g, (_, digits) =>
      [...digits].map(digit => '⁰¹²³⁴⁵⁶⁷⁸⁹⁻'['0123456789−'.indexOf(digit)]).join(''));
  }

  function readings(a) {
    a.root.classList.add('th2-animation');
    const row = document.createElement('dl');
    row.className = 'th2-readings';
    row.setAttribute('aria-label', 'Grandeurs affichées');
    a.root.querySelector('.ak-legend').before(row);
    let last;
    return values => {
      const html = values.map(([label, value]) => '<div><dt>' + label + '</dt><dd>' + value + '</dd></div>').join('');
      if (html !== last) row.innerHTML = last = html;
    };
  }

  function graph(a, id, xMin, xMax, yMin, yMax, xLab, yLab, options = {}) {
    const panel = a.panels[id];
    return a.S.graph({x: 7, y: 8 * a.k, w: panel.w - 20, h: panel.h - 13 * a.k,
      xmin: xMin, xmax: xMax, ymin: yMin, ymax: yMax, xlab: xLab, ylab: yLab, ...options});
  }

  function dragHorizontal(a, panel, handle, onMove) {
    a.drag(panel, {
      hit: (x, y, event) => event.target.getAttribute('data-hit') === handle,
      move: onMove
    });
  }

  return {clamp, points, range, select, time, limits, paletteControl, rgbTemperature, temperatureColor, thermalStrip, exportNumber, readings, graph, dragHorizontal};
})();

'use strict';

const TH2Diffusion = (() => {
  const materials = {
    steel: {name: 'Acier', lambda: 50, rhoC: 3.67e6},
    copper: {name: 'Cuivre', lambda: 390, rhoC: 3.45e6},
    glass: {name: 'Verre', lambda: 1, rhoC: 2.1e6},
    concrete: {name: 'Béton (TD)', lambda: 1, rhoC: 2e6},
    wood: {name: 'Bois', lambda: .15, rhoC: 1.19e6},
    foam: {name: 'Polystyrène expansé', lambda: .035, rhoC: 2.7e4}
  };

  function mesh(initial, left, right, lastTime, {
    intervals = 120, frames = 180, substeps = 8, initialScale = 0
  } = {}) {
    // Temps réduit D t / L² et mailles centrées sur les nœuds.
    // Les mailles de bord ont une demi-largeur. Les flux prescrits
    // sont positifs vers l'intérieur du solide, à chaque extrémité.
    const n = intervals;
    const logSpan = initialScale ? Math.log1p(lastTime / initialScale) : 0;
    const timeAt = f => logSpan ? initialScale * Math.expm1(logSpan * f) : lastTime * f;
    const frameAt = t => frames * TH2.clamp(logSpan ? Math.log1p(t / initialScale) / logSpan : t / lastTime);
    const values = Float64Array.from({length: n + 1}, (_, i) => initial(i / n));
    const fixedLeft = left.type === 'fixed';
    const fixedRight = right.type === 'fixed';
    if (fixedLeft) values[0] = left.value;
    if (fixedRight) values[n] = right.value;
    const profiles = [values.slice()];
    const lower = new Float64Array(n + 1);
    const upper = new Float64Array(n + 1);
    const diagonal = new Float64Array(n + 1);

    function edge(i, inside, condition, dt, r) {
      if (condition.type === 'fixed') {
        diagonal[i] = 1;
        inside[i] = 0;
        return 0;
      }
      inside[i] = -2 * r;
      if (condition.type === 'robin') {
        const weight = 2 * dt * n * condition.biot;
        diagonal[i] += weight;
        return weight * condition.value;
      }
      return condition.type === 'flux' ? 2 * dt * n * condition.value : 0;
    }

    let inputLeft, inputRight;
    for (let j = 1; j <= frames; j++) {
      if (j === 1 || logSpan) {
        const dt = (timeAt(j / frames) - timeAt((j - 1) / frames)) / substeps;
        const r = dt * n ** 2;
        lower.fill(-r);
        upper.fill(-r);
        diagonal.fill(1 + 2 * r);
        inputLeft = edge(0, upper, left, dt, r);
        inputRight = edge(n, lower, right, dt, r);
        for (let i = 1; i <= n; i++) {
          lower[i] /= diagonal[i - 1];
          diagonal[i] -= lower[i] * upper[i - 1];
        }
      }
      for (let s = 0; s < substeps; s++) {
        if (!fixedLeft) values[0] += inputLeft;
        for (let i = 1; i < n; i++) values[i] -= lower[i] * values[i - 1];
        if (!fixedRight) values[n] += inputRight - lower[n] * values[n - 1];
        values[n] /= diagonal[n];
        for (let i = n - 1; i >= 0; i--) values[i] = (values[i] - upper[i] * values[i + 1]) / diagonal[i];
      }
      profiles.push(values.slice());
    }
    return {profiles, n, frames, frameAt, timeAt};
  }

  function at(data, t, x) {
    const it = data.frameAt(t);
    const ix = TH2.clamp(x) * data.n;
    const j = Math.min(data.frames - 1, Math.floor(it));
    const i = Math.min(data.n - 1, Math.floor(ix));
    const previous = data.profiles[j], next = data.profiles[j + 1];
    const a = previous[i] + (ix - i) * (previous[i + 1] - previous[i]);
    const b = next[i] + (ix - i) * (next[i + 1] - next[i]);
    return a + (it - j) * (b - a);
  }

  function rangeOf(data) {
    let min = Infinity, max = -Infinity;
    for (const profile of data.profiles) {
      min = Math.min(min, ...profile);
      max = Math.max(max, ...profile);
    }
    return [min, max];
  }

  function periodic(omegaTau, left, rightMean, amplitude) {
    // Réponse périodique établie à droite, température fixe à gauche.
    // H(u) = sinh(k u) / sinh(k), k = (1 + i) sqrt(ω τ_D / 2).
    const c = Math.sqrt(omegaTau / 2);
    const sinh = q => [Math.sinh(q) * Math.cos(q), Math.cosh(q) * Math.sin(q)];
    const [a, b] = sinh(c);
    const d = a * a + b * b;
    const transfer = Array.from({length: 121}, (_, i) => {
      const [x, y] = sinh(c * i / 120);
      return [(x * a + y * b) / d, (y * a - x * b) / d];
    });
    function values(phase) {
      const cos = Math.cos(phase), sin = Math.sin(phase);
      return transfer.map(([re, im], i) => {
        const u = i / 120;
        return left + (rightMean - left) * u + amplitude * (re * cos - im * sin);
      });
    }
    return values;
  }

  return {materials, mesh, at, rangeOf, periodic};
})();

// @titre Diffusion et échelles de temps · TH2 · MP
// @sortie ../TH2_Diffusion_Echelles/TH2_Diffusion_Echelles.html
// @inclure TH2_Commun.js
// @inclure TH2_Diffusion_Physique.js
// @style TH2_Interface.css
// @description Conditions aux limites, carte espace-temps, approximation quasi stationnaire et modèle à capacité.
'use strict';

(() => {
  const {clamp, points, range, select, time, limits, rgbTemperature, thermalStrip, paletteControl, exportNumber, readings, graph, dragHorizontal} = TH2;
  const {materials, mesh, at, rangeOf, periodic} = TH2Diffusion;
  const {v} = AnimKit.M;
  const D = m => m.lambda / m.rhoC;
  const materialOptions = Object.entries(materials).map(([id, item]) => [id, item.name]);
  const boundaries = [['fixed', 'Température imposée'], ['flux', 'Flux imposé'],
    ['insulated', 'Paroi calorifugée'], ['robin', 'Échange avec un fluide']];
  const defaults = {barMaterial: 'steel', barLength: 10, initial: 'uniform', iniT: 0, pulse: 50,
    bcL: 'fixed', bcR: 'fixed', tempL: 100, tempR: 0, fluxL: 1, fluxR: 0, hL: 20, hR: 20,
    compare: 'none', barProbe: 35};
  const initialProfiles = [
    ['uniform', 'Uniforme'], ['pulse', 'Zone chaude au centre'], ['step', 'Deux moitiés'],
    ['linear', 'Profil affine']
  ];
  let display, cached, barGraph, mapGraph, slowGraph;
  const ghostLimit = 6;

  function ghostDates(t, interval, keep) {
    const newest = Math.max(0, Math.ceil((t - 1e-8) / interval) - 1);
    const oldest = keep ? 0 : Math.max(0, newest - ghostLimit + 1);
    return t <= 1e-8 ? [] : Array.from({length: newest - oldest + 1}, (_, i) => (oldest + i) * interval);
  }
  const val = (a, number, unit) => a.fmt.sig(number, 3) + (unit ? ' ' + unit : '');
  const deg = (a, temperature) => val(a, temperature, '°C');
  const plot = (a, values, G, color, dashed = false) =>
    a.S.curve(values, G, {c: color, w: dashed ? 2 : 2.7, dash: dashed ? '7 5' : undefined});
  const sec = (a, f) => '<i>t</i> = ' + time(a, f);
  const nodes = (values, factor = 1) => values.map((T, i) => [factor * i / (values.length - 1), T]);
  const stepTime = a => {
    const data = prepare(a);
    return data.maxTime * (a.tab === 1 ? 1 / 14 : 1 / 12);
  };
  const seek = (a, t) => {a.t = clamp(t, 0, prepare(a).maxTime)};
  const reducedClock = (a, data) => a.tab === 2 && data.biot > 25;
  const fraction = (a, data) => reducedClock(a, data)
    ? data.base.frameAt(a.t / data.tau) / data.base.frames : a.t / data.maxTime;
  const seekFraction = (a, data, f) => seek(a, f < 1 && reducedClock(a, data)
    ? data.tau * data.base.timeAt(f) : f * data.maxTime);
  const probes = {barProbe: 'probeBar', slowProbe: 'probeSlow'};
  const probeMove = (a, id, g, x) => a.set(id, Math.round(clamp(g.xv(x)) * 100), {silent: true});

        {reinit: true, log: true, si: is('robin')})
    ];
  }

  AnimKit.app({
    code: 'TH2', partie: 'OrangeBrule', titre: 'Diffusion et échelles de temps',
    titreFenetre: 'Diffusion et échelles de temps · TH2 · MP',
    fichier: 'Diffusion_Echelles', menuCommun: true,

      {id: 'map', titre: 'Carte espace-temps', onglets: [0], ratioTel: .79},
      {id: 'slow', titre: 'Profil dans la paroi', onglets: [1], ratioTel: .72},
      {id: 'signals', titre: 'Températures au cours d’une période', onglets: [1], ratioTel: .72},
      {id: 'slab', titre: 'Coupe de la plaque', onglets: [2], poids: .83, ratioTel: .54, zoom: false},
      {id: 'cooling', titre: 'Températures au cours du refroidissement', onglets: [2], poids: 1.24, ratioTel: .78}
    ],
    temps: true, pas: .12,
    curseur: {max: () => 1, get: a => fraction(a, prepare(a)),
      set: (a, f) => seekFraction(a, prepare(a), f)},
    peutLire(a) {
      if (a.t >= prepare(a).maxTime) a.t = 0;
      return true;
    },
    step(a, dt) {
      const data = prepare(a);
      seekFraction(a, data, clamp(fraction(a, data) + dt * stepTime(a) / data.maxTime));
      if (a.t >= prepare(a).maxTime) a.play(false);
    },
    onglet(a) { a.reset(); },
    touches: {arrowleft(a) {
      a.play(false);
      const data = prepare(a);
      seekFraction(a, data, clamp(fraction(a, data) - .12 * stepTime(a) / data.maxTime));
    }},
    reglages: [
      {titre: 'Situations', onglets: [0], presets: [
        {label: 'Barre d’acier du cours', valeurs: {...defaults}},
        {label: 'Mur de béton du TD', valeurs: {...defaults, barMaterial: 'concrete', barLength: 20, iniT: 20, tempL: -10, tempR: 20}},
        {label: 'Zone chaude, barre isolée', valeurs: {...defaults, initial: 'pulse', iniT: 20, bcL: 'insulated', bcR: 'insulated'}},
        {label: 'Doubler la longueur', valeurs: {...defaults, compare: 'physical'}},
        {label: 'Refroidissement par l’air', valeurs: {...defaults, initial: 'uniform', iniT: 70, bcL: 'insulated', bcR: 'robin', tempR: 20, hR: 300}}
      ]},
      {titre: 'Affichage', items: [paletteControl,
        {id: 'showGhosts', type: 'check', label: 'Fantômes', value: true, onglets: [0]},
        {id: 'keepGhosts', type: 'check', label: 'Garder les traces', value: false,

        select('ghostPeriod', 'Intervalle des profils fantômes', .05,
          [[.025, '0.025 τᴅ'], [.05, '0.05 τᴅ'], [.10, '0.10 τᴅ']], {onglets: [0], si: a => a.p.showGhosts})
      ]},
      {titre: 'Barre et état initial', onglets: [0], items: [
        select('barMaterial', 'Matériau', 'steel', materialOptions, {reinit: true}),
        range('barLength', 'Longueur ' + v('L'), 1, 100, .5, 10, 'cm', {log: true, reinit: true}),
        select('initial', 'Profil initial', 'uniform', initialProfiles, {reinit: true}),
        range('iniT', 'Température initiale de référence', -30, 100, 1, 0, '°C', {reinit: true}),
        range('pulse', 'Amplitude de l’écart initial', 1, 75, 1, 50, 'K',
          {reinit: true, si: a => a.p.initial !== 'uniform'}),
        select('compare', 'Comparer avec une barre deux fois plus longue', 'none',
          [['none', 'Une seule barre'], ['physical', 'Même temps physique'], ['reduced', 'Même temps réduit']], {reinit: true}),

      ]},
      {titre: 'Face gauche', onglets: [0], items: endControls('L')},
      {titre: 'Face droite', onglets: [0], items: endControls('R')},
      {titre: 'Situations', onglets: [1], presets: [
        {label: 'Sollicitation lente', valeurs: {omegaTau: .1}},
        {label: 'Sollicitation rapide', valeurs: {omegaTau: 40}},
        {label: 'Mur de béton, cycle de 24 h', valeurs: {slowMaterial: 'concrete', slowLength: 20, omegaTau: 2 * Math.PI * 80000 / 86400}}
      ]},
      {titre: 'Paroi et sollicitation', onglets: [1], items: [
        select('slowMaterial', 'Matériau', 'concrete', materialOptions, {reinit: true}),
        range('slowLength', 'Épaisseur ' + v('L'), 1, 100, .5, 20, 'cm', {log: true, reinit: true}),
        range('omegaTau', 'Pulsation réduite ' + v('ω') + ' ' + v('τ', 'D'), .02, 300, .01, 8, '', {log: true, reinit: true}),
        range('slowLeft', 'Température de la face fixe', -20, 75, 1, 20, '°C', {reinit: true}),
        range('slowMean', 'Température moyenne de la face à température variable', -20, 75, 1, 20, '°C', {reinit: true}),
        range('slowAmp', 'Amplitude de la variation', 1, 35, 1, 12, 'K', {reinit: true}),
        range('slowProbe', 'Position de la sonde', 0, 100, 1, 50, '% de L')
      ]},
      {titre: 'Situations', onglets: [2], presets: [
        {label: 'Faible Biot · acier dans l’air', valeurs: {capMaterial: 'steel', capLength: 2, capH: 20}},
        {label: 'Biot d’ordre 1 · verre', valeurs: {capMaterial: 'glass', capLength: 2, capH: 50}},
        {label: 'Fort Biot · béton', valeurs: {capMaterial: 'concrete', capLength: 4, capH: 250}}
      ]},
      {titre: 'Plaque et fluide', onglets: [2], items: [
        select('capMaterial', 'Matériau', 'glass', materialOptions, {reinit: true}),
        range('capLength', 'Demi-épaisseur ' + v('L', 'c'), .5, 25, .1, 2, 'cm', {log: true, reinit: true}),
        range('capH', 'Coefficient d’échange ' + v('h'), 1, 2000, 1, 50, 'W·m⁻²·K⁻¹', {log: true, reinit: true}),
        range('capInit', 'Température initiale', 25, 150, 1, 80, '°C', {reinit: true}),
        range('capFluid', 'Température du fluide', -20, 24, 1, 20, '°C', {reinit: true})
      ]}
    ],
    aide: {
      voit: '<ul><li><b>Conditions aux limites.</b> La carte se remplit de bas en haut jusqu’au temps choisi. Elle montre la température en fonction de x/L et de t/τ<sub>D</sub>. La ligne horizontale repère l’instant du profil. Les profils fantômes sont tracés à intervalles réguliers. Par défaut, ils pâlissent puis disparaissent après six intervalles. Dans Réglages → Affichage, activer « Garder les traces » pour conserver chaque profil depuis le début. Les petits points au bord de la carte repèrent les dates des profils visibles. « Fantômes » affiche ou masque l’ensemble des traces. La barre et la carte utilisent la même échelle de couleurs.</li><li><b>Quasi-stationnaire.</b> Le trait plein est le profil en régime périodique établi. Le trait en tirets relie les températures instantanées des deux faces. L’écart entre ces profils augmente lorsque τ<sub>D</sub> devient comparable ou supérieur à 1/ω.</li><li><b>Modèle à capacité.</b> La plaque symétrique est refroidie sur ses deux faces. L’exponentielle du modèle à capacité est comparée à la surface et au cœur de la plaque.</li></ul>',
      faire: 'Glisser une sonde sur le profil. Cliquer ou glisser dans la carte pour choisir une date, ou utiliser le curseur sous les graphes. En comparant L et 2L, le mode « même temps physique » montre le ralentissement. En « même temps réduit », les profils coïncident si les conditions aux limites réduites sont identiques. Pour un flux imposé ou la loi de Newton, les valeurs physiques fixées donnent en général des conditions réduites différentes.',
      modele: '<p>Conduction unidimensionnelle sans source dans un solide homogène à propriétés constantes. Le calcul transitoire utilise des différences en espace et des pas implicites, avec un bilan de flux sur les demi-mailles de bord. Le flux saisi est positif vers la barre sur chaque face. Les températures sont précalculées pour permettre de revenir à une date antérieure.</p><p>La sollicitation sinusoïdale est évaluée en régime périodique établi. Pour la plaque de demi-épaisseur L<sub>c</sub> = V/S, Bi = hL<sub>c</sub>/λ et τ = ρcL<sub>c</sub>/h. La durée affichée dépend de Bi. Pour Bi &gt; 25, la commande de lecture consacre plus de temps aux premiers instants. Aux très forts Biot, la couche thermique initiale peut être plus mince qu’une maille. Les couleurs de température sont données sur une échelle commune dans chaque onglet.</p>',
      cours: 'TH2 MP, parties II et IV. Le mur du TD permet de retrouver le profil et le changement de condition à une face. La comparaison porte ici sur l’évolution thermique.',
      credits: 'Carte espace-temps et temps réduit inspirés de l’animation de diffusion du collègue de MP* à Malherbe.'
    },
    init(a) {
      display = readings(a);
      dragHorizontal(a, 'bar', probes.barProbe, x => probeMove(a, 'barProbe', barGraph, x));
      dragHorizontal(a, 'slow', probes.slowProbe, x => probeMove(a, 'slowProbe', slowGraph, x));
      const readMap = (x, y) => {a.play(false); seek(a, mapGraph.yv(y) * prepare(a).tau);};
      a.drag('map', {
        hit: (x, y) => mapGraph && x >= mapGraph.x0 && x <= mapGraph.x0 + mapGraph.w &&
          y >= mapGraph.y0 && y <= mapGraph.y0 + mapGraph.h,
        start: readMap, move: readMap
      });
    },
    draw(a) {
      const data = prepare(a);
      if (a.tab === 0) drawBar(a, data);
      else if (a.tab === 1) drawSlow(a, data);
      else drawCapacity(a, data);
      const suffix = a.tab === 1 ? ' · ' + a.fmt.fix(100 * a.t / data.maxTime, 0) + ' % du cycle' : '';
      a.clock(sec(a, a.t) + suffix);
    }
  });

  function prepare(a) {
    const p = a.p;
    const keys = a.tab === 0
      ? ['barMaterial','barLength','initial','iniT','pulse','bcL','bcR','tempL','tempR','fluxL','fluxR','hL','hR','compare']
      : a.tab === 1
        ? ['slowMaterial','slowLength','omegaTau','slowLeft','slowMean','slowAmp']
        : ['capMaterial','capLength','capH','capInit','capFluid'];
    const key = JSON.stringify([a.tab, ...keys.map(k => p[k])]);
    if (cached?.key === key) return cached;
    let data;
    if (a.tab === 0) {
      const m = materials[p.barMaterial], length = p.barLength / 100, tau = length ** 2 / D(m);
      const initial = u => {
        if (p.initial === 'pulse') return p.iniT + p.pulse * Math.exp(-(((u - .5) / .10) ** 2));
        if (p.initial === 'step') return p.iniT + (u < .5 ? p.pulse : 0);
        if (p.initial === 'linear') return p.iniT + p.pulse * u;
        return p.iniT;
      };
      function boundary(side, L) {
        const type = p['bc' + side];
        const value = type === 'flux' ? 1000 * p['flux' + side] * L / m.lambda : p['temp' + side];
        return {type, value, biot: p['h' + side] * L / m.lambda};
      }
      const base = mesh(initial, boundary('L', length), boundary('R', length), 1);
      const comparison = p.compare === 'none' ? null : mesh(initial, boundary('L', 2 * length),
        boundary('R', 2 * length), p.compare === 'reduced' ? 1 : .25);
      let [min, max] = rangeOf(base);
      if (comparison) {
        const [lo, hi] = rangeOf(comparison);
        min = Math.min(min, lo); max = Math.max(max, hi);
      }
      data = {base, comparison, min, max, tau, maxTime: tau, m, length, colors: {}};
    } else if (a.tab === 1) {
      const m = materials[p.slowMaterial], tau = (p.slowLength / 100) ** 2 / D(m);
      const maxTime = 2 * Math.PI * tau / p.omegaTau;
      data = {tau, maxTime, value: periodic(p.omegaTau, p.slowLeft, p.slowMean, p.slowAmp)};
    } else {
      const m = materials[p.capMaterial], length = p.capLength / 100;
      const tau = length ** 2 / D(m), biot = p.capH * length / m.lambda;
      const capTime = tau / biot;
      const last = Math.max(5 / biot, 2.4);
      const base = mesh(() => p.capInit, {type: 'insulated'}, {type: 'robin', biot, value: p.capFluid},
        last, {intervals: 180, frames: 240, substeps: 12,
          initialScale: biot > 1 ? 1 / Math.min(biot, 180) ** 2 : 0});
      data = {tau, biot, capTime, base, maxTime: tau * last};
    }
    return cached = {key, ...data};
  }

  function probePoint(a, g, x, t, hit, color = a.C.cInk) {
    const {S, C} = a;
    return S.line(g.X(x), g.y0, g.X(x), g.y0 + g.h, {c: C.ink2, dash: '4 5', w: 1}) +
      S.circle(g.X(x), g.Y(t), 7 * a.k, {fill: color, c: C.card, w: 1.6, hit});
  }

  function mapImage(a, data) {
    const key = a.p.palette;
    if (data.colors[key]) return data.colors[key];
    const canvas = document.createElement('canvas');
    canvas.width = data.base.n + 1;
    canvas.height = data.base.frames + 1;
    const ctx = canvas.getContext('2d');
    const image = ctx.createImageData(canvas.width, canvas.height);
    for (let row = 0; row < canvas.height; row++) {
      const profile = data.base.profiles[data.base.frames - row];
      for (let i = 0; i < canvas.width; i++) {
        const color = rgbTemperature(data.max > data.min ? (profile[i] - data.min) / (data.max - data.min) : .5, key);
        image.data.set([...color, 255], 4 * (row * canvas.width + i));
      }
    }
    ctx.putImageData(image, 0, 0);
    return data.colors[key] = canvas.toDataURL();
  }

  function drawBar(a, data) {
    const {p, S, C} = a;
    const t = a.t / data.tau;
    const sample = x => at(data.base, t, x);
    const [min, max] = limits(data.min, data.max);
    const g = graph(a, 'bar', 0, 1, min, max, 'x / L', 'T (°C)', {padT: 48 * a.k});
    barGraph = g;
    let svg = g.svg + S.clip('th2-bar-profile', g);
    const {showGhosts, keepGhosts: keep} = p;
    const ghostColor = C.dark ? '#bab1ee' : '#6552a3';
    const opacity = date => keep ? .56
      : .82 * clamp(1 - (t - date) / (ghostLimit * p.ghostPeriod)) ** .8;
    const dates = showGhosts ? ghostDates(t, p.ghostPeriod, keep) : [];
    for (const date of dates) {
      const profile = points(0, 1, data.base.n, x => at(data.base, date, x));
      svg += '<g class="th2-ghost" data-time="' + date + '">' + S.curve(profile, g, {
        c: ghostColor, w: 1.35, dash: '5 4', op: opacity(date)
      }) + '</g>';
    }
    svg += plot(a, points(0, 1, data.base.n, sample), g, C.cInk);
    if (data.comparison) {
      const t2 = p.compare === 'physical' ? t / 4 : t;
      svg += plot(a, points(0, 1, data.comparison.n, x => at(data.comparison, t2, x)), g, C.B, true);
    }
    const x = p.barProbe / 100;
    svg += probePoint(a, g, x, sample(x), probes.barProbe);
    svg += '<g data-ak-hors-graphe>' + thermalStrip(a, 'th2-bar-gradient', g.x0, 9 * a.k, g.w, 17 * a.k,
      u => sample(clamp(g.xv(g.x0 + g.w * u))), data.min, data.max) + '</g>';
    a.svg('bar', svg);

    const map = graph(a, 'map', 0, 1, 0, 1, 'x / L', 't / τᴅ', {padT: 45 * a.k});
    mapGraph = map;
    const mx = map.X(0), my = map.Y(1), bottom = map.Y(0);
    const mw = map.X(1) - mx, mh = bottom - my;
    const cursorY = map.Y(t), probeX = map.X(x);
    let mapSvg = map.svg + S.clip('th2-map-clip', map);
    // Garder l'échelle espace-temps fixe pendant que la carte se remplit.
    mapSvg += '<defs><clipPath id="th2-map-history">' +
      S.rect(mx, cursorY, mw, Math.max(0, bottom - cursorY)) + '</clipPath></defs>';
    mapSvg += '<g clip-path="url(#th2-map-clip)"><image href="' + mapImage(a, data) +
      '" x="' + mx + '" y="' + my + '" width="' + mw + '" height="' + mh +
      '" preserveAspectRatio="none" clip-path="url(#th2-map-history)"/>';
    for (const [x1, y1, x2, y2] of [[mx, cursorY, mx + mw, cursorY], [probeX, cursorY, probeX, bottom]]) {
      mapSvg += S.line(x1, y1, x2, y2, {c: '#16151f', w: 3, op: .72});
      mapSvg += S.line(x1, y1, x2, y2, {c: '#fff', w: 1.55, dash: '6 5'});
    }
    mapSvg += S.circle(probeX, cursorY, 5 * a.k, {fill: '#fff', c: '#16151f'}) + '</g>';
    for (const date of dates) {
      const y = map.Y(date);
      if (y >= map.y0 && y <= map.y0 + map.h) {
        mapSvg += S.circle(map.x0 + 6 * a.k, y, 2.6 * a.k,
          {fill: '#d8cef8', c: '#31234e', op: opacity(date)});
      }
    }
    const swatchWidth = map.w * .56, swatchX = map.x0 + (map.w - swatchWidth) / 2;
    mapSvg += '<g data-ak-hors-graphe>' + thermalStrip(a, 'th2-scale-gradient', swatchX, 10 * a.k, swatchWidth, 10 * a.k,
      u => data.min + (data.max - data.min) * u, data.min, data.max, 40);
    mapSvg += S.text(swatchX - 5, 15 * a.k, exportNumber(a, data.min), {size: 11.8, anchor: 'end'});
    mapSvg += S.text(swatchX + swatchWidth + 5, 15 * a.k, exportNumber(a, data.max), {size: 11.8});
    mapSvg += S.text(swatchX + swatchWidth / 2, 28 * a.k, '°C', {size: 10, anchor: 'middle'}) + '</g>';
    a.svg('map', mapSvg);

    display([
      ['Diffusivité ' + v('D'), val(a, D(data.m), 'm²·s⁻¹')],
      ['Temps de diffusion ' + v('τ', 'D'), time(a, data.tau)],
      ['Temps réduit ' + v('t') + '/' + v('τ', 'D'), a.fmt.fix(t, 3)],
      ['Sonde · ' + val(a, 100 * x * data.length, 'cm'), deg(a, sample(x))],
      data.comparison && [p.compare === 'physical' ? '2L · même temps' : '2L · temps × 4',
        deg(a, at(data.comparison, p.compare === 'physical' ? t / 4 : t, x))]
    ].filter(Boolean));
    a.legend([
      {c: C.cInk, label: data.comparison ? 'Barre de longueur L' : 'Profil au temps sélectionné'},
      data.comparison && {c: C.B, label: 'Barre de longueur 2L · abscisse réduite', dash: true},
      showGhosts && {c: ghostColor, label: 'Fantômes tous les ' + time(a, data.tau * p.ghostPeriod), dash: true}
    ].filter(Boolean));
  }

  function drawSlow(a, data) {
    const {p, S, C} = a;
    const cycle = a.t / data.maxTime;
    const phase = 2 * Math.PI * cycle;
    const x = p.slowProbe / 100;
    const profile = data.value(phase);
    const right = p.slowMean + p.slowAmp * Math.cos(phase);
    const qs = u => p.slowLeft + u * (right - p.slowLeft);
    const measured = profile[Math.round(x * 120)];
    const [min, max] = limits(Math.min(p.slowLeft, p.slowMean - p.slowAmp), Math.max(p.slowLeft, p.slowMean + p.slowAmp));
    const g = graph(a, 'slow', 0, 1, min, max, 'x / L', 'T (°C)');
    slowGraph = g;
    let svg = g.svg + S.clip('th2-slow-profile', g);
    svg += plot(a, [[0, p.slowLeft], [1, right]], g, C.pred, true);
    svg += plot(a, nodes(profile), g, C.cInk);
    svg += probePoint(a, g, x, measured, probes.slowProbe);
    a.svg('slow', svg);

    const G = graph(a, 'signals', 0, 1, min, max, 't / période', 'T (°C)');
    let signals = G.svg + S.clip('th2-slow-signals', G);
    const phases = points(0, 1, 95, t => data.value(2 * Math.PI * t)[Math.round(x * 120)]);
    signals += plot(a, points(0, 1, 95, t => p.slowMean + p.slowAmp * Math.cos(2 * Math.PI * t)), G, C.B);
    signals += plot(a, phases, G, C.cInk);
    signals += S.line(G.X(cycle), G.y0, G.X(cycle), G.y0 + G.h, {c: C.ink2, dash: '4 5'});
    a.svg('signals', signals);
    const error = Math.max(...profile.map((T, i) => Math.abs(T - qs(i / 120))));
    display([
      ['Période imposée', time(a, data.maxTime)],
      [v('τ', 'D') + ' / ' + v('τ', 'ext') + ' = ω ' + v('τ', 'D'), a.fmt.sig(p.omegaTau, 3)],
      ['Température à la sonde', deg(a, measured)],
      ['Écart maximal au profil quasi stationnaire', val(a, error, 'K')]
    ]);
    a.legend([
      {c: C.cInk, label: 'Température calculée'},
      {c: C.pred, label: 'Profil quasi stationnaire', dash: true},
      {c: C.B, label: 'Face à température variable'}
    ]);
  }

  function drawCapacity(a, data) {
    const {p, S, C} = a;
    const sample = (x, t = a.t) => at(data.base, t / data.tau, x);
    const approximation = t => p.capFluid + (p.capInit - p.capFluid) * Math.exp(-t / data.capTime);
    const min = p.capFluid, max = p.capInit;
    const panel = a.panels.slab;
    const cy = panel.h * .42, width = panel.w * .68, left = (panel.w - width) / 2, cx = panel.w / 2, right = left + width;
    const barHeight = Math.min(panel.h * .21, 76 * a.k);
    let slab = thermalStrip(a, 'th2-capacity-gradient', left, cy - barHeight / 2, width, barHeight,
      u => sample(Math.abs(2 * u - 1)), min, max);
    slab += S.line(cx, cy - barHeight * .75, cx, cy + barHeight * .75, {c: C.ink, dash: '4 5'});
    slab += S.text(cx, cy - barHeight * .98, 'Cœur', {anchor: 'middle', c: C.ink, size: 15});
    slab += S.text(right, cy - barHeight * .98, 'Surface', {anchor: 'middle', c: C.ink, size: 15});
    const arrowSize = 27 * a.k * (sample(1) - min) / (max - min);
    slab += S.arrow(left, cy, left - arrowSize, cy, {c: C.cInk, w: 2.5});
    slab += S.arrow(right, cy, right + arrowSize, cy, {c: C.cInk, w: 2.5});
    slab += S.arrow(cx, cy + barHeight * .92, right, cy + barHeight * .92, {c: C.ink2});
    slab += S.text((cx + right) / 2, cy + barHeight * 1.13, S.v('L', 'c'), {anchor: 'middle', c: C.ink, size: 15, math: true});
    slab += S.text(cx, panel.h * .83, 'Fluide à ' + deg(a, min), {anchor: 'middle', c: C.B, size: 14});
    a.svg('slab', slab);

    const [yMin, yMax] = limits(min, max);
    const scale = data.biot > 1 ? data.tau : data.capTime;
    const g = graph(a, 'cooling', 0, data.maxTime / scale, yMin, yMax,
      data.biot > 1 ? 't / τᴅ' : 't / τ', 'T (°C)');
    let svg = g.svg + S.clip('th2-cooling', g);
    const dates = Array.from({length: data.base.frames + 1}, (_, i) =>
      data.tau * data.base.timeAt(i / data.base.frames));
    svg += plot(a, dates.map(t => [t / scale, approximation(t)]), g, C.pred, true);
    svg += plot(a, dates.map(t => [t / scale, sample(0, t)]), g, C.cInk);
    svg += plot(a, dates.map(t => [t / scale, sample(1, t)]), g, C.B);
    const now = a.t / scale;
    svg += S.line(g.X(now), g.y0, g.X(now), g.y0 + g.h, {c: C.ink2, dash: '4 5'});
    for (const [T, color] of [[sample(0), C.cInk], [sample(1), C.B], [approximation(a.t), C.pred]]) {
      svg += S.circle(g.X(now), g.Y(T), 4.1 * a.k, {fill: color, c: C.card});
    }
    a.svg('cooling', svg);
    display([
      ['Nombre de Biot', a.fmt.sig(data.biot, 3)],
      ['Constante du modèle à capacité', time(a, data.capTime)],
      ['T au cœur', deg(a, sample(0))],
      ['T en surface', deg(a, sample(1))],
      ['Écart cœur–surface', val(a, sample(0) - sample(1), 'K')]
    ]);
    a.legend([
      {c: C.cInk, label: 'Cœur de la plaque'},
      {c: C.B, label: 'Surface de la plaque'},
      {c: C.pred, label: 'Modèle à capacité', dash: true}
    ]);
  }
})();

</script>
