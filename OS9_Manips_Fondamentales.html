  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){

        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

function fit(){
  const r=st.rel,n=r.length,mx=r.reduce((s,q)=>s+q.nu,0)/n,my=r.reduce((s,q)=>s+q.U,0)/n;
  let num=0,den=0;for(const q of r){num+=(q.nu-mx)*(q.U-my);den+=(q.nu-mx)**2}
  const s=den?num/den:0;return{s,c:my-s*mx};
}

function graphsPhoton(a,P){

    if(st.rel.length>=2)M.push({label:'h déduite de la pente',value:F.sig(fit().s*Q.e*1e-12*1e34*1e12/1e12,3).replace(/./,m=>m),unit:'× 10⁻³⁴ J·s',hint:'vraie valeur : 6.626'});
    if(p.classic){const I=p.intensity*.01,t=wk(a)*Q.e/(I*Math.PI*1e-20);
      M.push({label:'Attente classique avant émission',value:F.sci(t,2),unit:'s',hint:'onde : W / (éclairement × π r²), r = 0.1 nm · observé : < 10⁻⁹ s (Lawrence et Beams, 1928)'})}}
  if(i===1){const rs=Q.rings(p.dvolt,p.ddist);
    M.push({label:'Longueur d’onde '+Mh.v('λ'),value:len(Q.electronLambda(p.dvolt))});
    M.push({label:'Rayon du premier anneau',value:isFinite(rs[0])?len(rs[0]):'—'});
    M.push({label:'Électrons détectés',value:String(st.ctr)});}
  if(i===2){const m=Q.young(yp(p)),nog=Q.h/(m.mass*m.v)*p.ydist/(p.separation*1e-6);
    M.push({label:'Longueur d’onde '+Mh.v('λ'),value:len(m.lambda)});
    M.push({label:'Interfrange',value:len(m.fringe),hint:p.species==='atom'&&p.gravity?'sans chute libre : '+len(nog)+' (λD/d)':'λL/d'});
    M.push({label:'Temps de vol',value:F.sci(m.T,2),unit:'s'});}
  if(i===3){
    if(p.profile==='gaussian'){const g=Q.gaussian(p.sigma*1e-6);
      M.push({label:'σ'+'ₓ',value:len(g.sx)});M.push({label:'σ'+'ₚ',value:F.sci(g.sp,3),unit:'kg·m·s⁻¹'});M.push({label:'σₓ σₚ',value:F.sci(g.product,3),unit:'J·s',hint:'= ℏ/2 exactement'});
      if(st.xs.length>20)M.push({label:'σₓ σₚ mesuré (échantillon)',value:F.sci(std(st.xs)*std(st.ps),3),unit:'J·s',hint:st.xs.length+' mesures'})}
    else{M.push({label:'Largeur de la fente',value:F.sig(p.awidth,3),unit:'µm'});
      M.push({label:'Premier zéro en impulsion',value:F.sci(Q.h/(p.awidth*1e-6),3),unit:'kg·m·s⁻¹'});
      M.push({label:'Angle du premier zéro',value:F.sci(Q.electronLambda(p.lenergy)/(p.awidth*1e-6),2),unit:'rad'});
      if(st.ps.length>20)M.push({label:'σₚ mesuré (queues tronquées à ±'+CAP+' h/a)',value:F.sci(std(st.ps),2),unit:'kg·m·s⁻¹',hint:'croît avec la troncature : la variance diverge'})}}
  if(i===4){const[N,A,B,AB]=st.det,al=N&&A&&B?AB*N/(A*B):NaN;
    M.push({label:'Essais',value:gap(N)});M.push({label:'Coïncidences',value:gap(AB)});
    M.push({label:'Anticorrélation normalisée '+Mh.v('α'),value:Number.isFinite(al)?F.sig(al,3):'—',hint:p.prev?(p.source==='single'?'idéal : 0':p.source==='coherent'?'idéal : 1':'idéal : 2 (faible μ)'):''});}
  a.metrics(M);
}
function draw(a){
  const i=a.tab,ps=a.panels.scene,pg=a.panels.graphes,C=a.C;let sc='',gr='',L=[];
  if(i===0){sc=scenePhoto(a,ps);gr=graphsPhoto(a,pg);L=[a.p.prev?{c:C.c,label:'courant calculé'}:null,{c:C.F,label:'point de fonctionnement / relevés'}]}
  else if(i===1){sc=sceneDiff(a,ps);gr=graphsDiff(a,pg);L=[{c:C.c,label:'anneau 1'},{c:C.B,label:'anneau 2'}]}
  else if(i===2){sc=sceneYoung(a,ps);gr=graphsYoung(a,pg);L=[a.p.prev?{c:C.c,label:'loi (cohérente)'}:null,a.p.prev&&a.p.compare&&a.p.slits==='both'?{c:C.B,dash:true,label:'somme incohérente'}:null,{c:C.F,label:'histogramme'}]}
  else if(i===3){sc=sceneLoc(a,ps);gr=graphsLoc(a,pg);L=[{c:C.F,label:'mesures'},a.p.prev?{c:C.B,label:'loi'}:null]}
  else{sc=scenePhoton(a,ps);gr=graphsPhoton(a,pg);L=[{c:C.ink,label:'fréquence mesurée'},a.p.prev?{c:C.F,label:'prévision'}:null]}
  a.svg('scene',sc);a.svg('graphes',gr);a.legend(L);metrics(a);
  a.clock(i===1||i===2||i===3?gap(st.ctr)+' mesures':'');
}

    modele:'<p><b>Photoélectricité</b> : ℰ<sub>c,max</sub> = hν − W, flux = P/(hν), courant de collecte linéaire en tension de freinage (distribution uniforme d’énergies longitudinales : choix du modèle). Travaux d’extraction représentatifs, absorption à un photon. Les relevés ont un bruit de lecture simulé de ±0.03 V. Attente classique : t = W/(E π r²) ≈ 20 min pour 1 µW·cm⁻² (ordre de grandeur) ; observé : moins de 10<sup>−9</sup> s. L’effet photoélectrique seul ne prouve pas la quantification du champ.</p><p><b>Diffraction</b> : modèle de Bragg à deux familles de plans du graphite, poids 60 % / 40 % illustratifs ; p = √[2m<sub>e</sub>eU(1 + eU/2m<sub>e</sub>c²)] ; R = D tan 2θ sans approximation des petits angles ; écran de taille fixe.</p><p><b>Interférences</b> : fentes de Fraunhofer identiques, loi de Born, atomes de néon 20 (m ≈ 20 u) en chute libre D = v<sub>0</sub>T + gT²/2, interfrange hT/(md). Géométrie inspirée des atomes froids, sans reproduire un jeu de mesures.</p><p><b>Localisation</b> : fente : sinc²(πap<sub>x</sub>/h), premiers zéros ±h/a ; gaussien : σ<sub>p</sub> = ℏ/(2σ<sub>x</sub>).</p><p><b>Photon</b> : détecteurs parfaits ; cohérent : Poisson de moyennes Tμ et (1 − T)μ ; thermique : P(A et B) = 1 − 1/(1 + Tμ) − 1/(1 + (1 − T)μ) + 1/(1 + μ).</p>',
