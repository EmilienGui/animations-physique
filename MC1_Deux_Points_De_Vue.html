/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));

    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);

  },
  sci(x,n=2){

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;

}

  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);

    },

    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},

        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;

  };
  A.insight=()=>{};
  A.legend=arr=>{const html=(arr||[]).filter(Boolean).map(l=>`<span><i class="${l.dash?'dash':l.dot?'dot':''}" style="background:${l.c};--lc:${l.c}"></i>${l.label}</span>`).join('');if(legend._h!==html){legend.innerHTML=html;legend._h=html}};
  A.clock=html=>{const c=$('.ak-clock',tr);if(c._h!==html){c.innerHTML=html;c._h=html}};
  A.toast=m=>{toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastEl._h);toastEl._h=setTimeout(()=>toastEl.classList.remove('show'),1800)};
  A.panelVisible=id=>!A.panels[id].el.hidden;

  /* ---------- tailles ---------- */
  function viewBox(P){
    const {w,h,vx,vy,vz}=P;
    P.node.setAttribute('viewBox',P.vue==='svg'?`${vx.toFixed(2)} ${vy.toFixed(2)} ${(w/vz).toFixed(2)} ${(h/vz).toFixed(2)}`:`0 0 ${w.toFixed(1)} ${h.toFixed(1)}`);
  }
  function measure(){
    A.narrow=ak.clientWidth<=640; ak.style.setProperty('--ak-top',(top.offsetHeight+(tabs?tabs.offsetHeight:0))+'px');
    if(A.narrow){if(metricsWrap.parentNode!==right||right.lastElementChild!==metricsWrap)right.append(metricsWrap)}
    else{if(metricsWrap.parentNode!==right||right.firstElementChild!==metricsWrap)right.insertBefore(metricsWrap,side)}
    A.k=ak.classList.contains('is-proj')?1.6:A.narrow?1:1.15;
    for(const P of Object.values(A.panels)){
      if(P.el.hidden)continue;
      if(A.narrow){const w=P.el.clientWidth||ak.clientWidth;P.node.style.height=Math.round(w*(P.cfg.ratioTel??.8))+'px'}else P.node.style.height='';
      const r=P.node.getBoundingClientRect(); P.w=Math.max(50,r.width); P.h=Math.max(50,r.height);
      if(P.type==='canvas'){const d=window.devicePixelRatio||1;if(P.node.width!==Math.round(P.w*d)||P.node.height!==Math.round(P.h*d)){P.node.width=Math.round(P.w*d);P.node.height=Math.round(P.h*d)}P.ctx=P.node.getContext('2d');P.ctx.setTransform(d,0,0,d,0,0)}
      else viewBox(P);
    }
  }
  /* ---------- rendu ---------- */
  let graphPanels=[];
  const activeChartView=P=>P?.vue==='graphe'&&zoomed(P)?P:null;
  function drawFrame(){
    const frame={graphs:[],views:graphPanels.map(activeChartView),outputs:new Map()};
    A._graphFrame=frame;
    try{cfg.draw?.(A)}finally{A._graphFrame=null}
    graphPanels=[];
    for(const [P,output] of frame.outputs){
      const graphs=[...output.html.matchAll(/<g data-ak-graph="(\d+)">/g)].map(m=>frame.graphs[+m[1]]).filter(Boolean);
      output.graphs=graphs;
      if(P.vue==='svg'||P.vue==='graphe'){
        const vue=graphs.length?'graphe':'svg';
        if(vue!==P.vue){P.vue=vue;resetView(P);viewBox(P)}
        P.graphs=graphs;
      }
      const view=activeChartView(P);
      for(const graph of graphs){
        graphPanels[graph.id]=P;
        if(graph.view!==view)frame.changed=true;
      }
    }
    return frame;
  }
  function clipCharts(node,graphs){
    const svgElement=tag=>document.createElementNS(node.namespaceURI,tag);
    for(const graph of graphs){
      const axes=node.querySelector(`[data-ak-graph="${graph.id}"]`);
      if(!axes)continue;
      const id='ak-cadre-'+graph.id, defs=svgElement('defs'),clip=svgElement('clipPath'),rect=svgElement('rect');
      clip.id=id;
      for(const [k,v] of Object.entries({x:graph.x0,y:graph.y0,width:graph.w,height:graph.h}))rect.setAttribute(k,v);
      clip.append(rect);defs.append(clip);axes.append(defs);
      let layer=null;
      for(let next=axes.nextElementSibling;next&&!next.hasAttribute('data-ak-graph');){
        const child=next;next=child.nextElementSibling;
        if(child.localName==='defs'||child.hasAttribute('data-ak-hors-graphe')){layer=null;continue}
        if(!layer){
          layer=svgElement('g');
          layer.setAttribute('clip-path',`url(#${id})`);
          child.before(layer);
        }
        layer.append(child);
      }
    }
  }
  function writeSvg(P,html,graphs=[]){
    if(P.node._h===html)return;
    P.node.innerHTML=html;
    P.node._h=html;
    if(activeChartView(P))clipCharts(P.node,graphs);
  }
  A.renderNow=()=>{
    A._dirty=false;measure();
    let frame=drawFrame();
    if(frame.changed)frame=drawFrame();
    for(const [P,output] of frame.outputs)writeSvg(P,output.html,output.graphs);
    syncScrub();guardScroll();
  };
  A.render=()=>{if(A._dirty)return;A._dirty=true;requestAnimationFrame(()=>{if(A._dirty)A.renderNow()})};
  A.svg=(id,html)=>{
    const P=A.panels[id];if(!P)return;
    if(A._graphFrame)A._graphFrame.outputs.set(P,{html});
    else writeSvg(P,html);
  };

  /* ---------- temps ---------- */
  let last=0;
  const playBtn=$('.ak-play',tr);
  A.play=on=>{on=on===undefined?!A.running:on;if(on&&cfg.peutLire&&!cfg.peutLire(A))on=false;A.running=on;playBtn.textContent=on?'❚❚ Pause':'▶ Lecture';if(on){last=performance.now();requestAnimationFrame(loop)}};
  function loop(now){if(!A.running)return;const dt=Math.min(.05,(now-last)/1000)*A.speed;last=now;if(cfg.step)cfg.step(A,dt);A.renderNow();requestAnimationFrame(loop)}
  A.stepOnce=()=>{A.play(false);if(cfg.step)cfg.step(A,cfg.pas??1/24);A.render()};
  A.reset=()=>{A.play(false);A.t=0;if(cfg.reset)cfg.reset(A);A.render()};
  $('.ak-speed',tr).onchange=e=>{A.speed=+e.target.value};A.speed=cfg.vitesse||1;

  /* ---------- onglets ---------- */
  A.setTab=i=>{if(!tabs||i<0||i>=cfg.onglets.length)return;A.tab=i;A.cadrerTout();clearActivePresets();$$('.ak-tab',tabs).forEach((b,j)=>b.setAttribute('aria-selected',String(j===i)));if(cfg.onglet)cfg.onglet(A,i);refreshSettings();A.render()};

  /* ---------- thème, projection, plein écran ---------- */
  A.setTheme=t=>{root.dataset.theme=t;writeStore(THEME_KEY,t);readColors();syncMenu();A.renderNow()};
  A.setProj=on=>{
    ak.classList.toggle('is-proj',on);
    ak.classList.remove('drawer-open');
    projButton.classList.toggle('on',on);
    syncMenu();
    A.render();
  };
  const acts={
    play:()=>A.play(),step:()=>A.stepOnce(),reset:()=>A.reset(),
    help:()=>{dlg.showModal()},theme:()=>A.setTheme(root.dataset.theme==='dark'?'light':'dark'),
    image:()=>A.exportImage(),proj:()=>{
      const projected=ak.classList.contains('is-proj');
      A.setProj(!projected);
      if(cfg.menuCommun&&projected&&A.narrow)ak.classList.add('drawer-open');
    },
    fs:()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>A.toast('Plein écran refusé par le navigateur'))},
    settings:()=>{ak.classList.toggle('drawer-open');A.render()}
  };
  ak.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&acts[b.dataset.act])acts[b.dataset.act]()});
  addEventListener('keydown',e=>{
    if(dlg.open||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.target.matches('input,select,textarea'))return;
    const k=e.key.toLowerCase(), custom=cfg.touches&&cfg.touches[k];
    if(custom){e.preventDefault();custom(A);A.render();return}
    if(k===' '&&!tr.hidden){e.preventDefault();acts.play()}
    else if(k==='arrowright'&&!tr.hidden){e.preventDefault();acts.step()}
    else if(k==='r'&&!tr.hidden)acts.reset();
    else if(k==='h'||k==='?')acts.help();else if(k==='p')acts.proj();else if(k==='f')acts.fs();else if(k==='t')acts.theme();else if(k==='i')acts.image();
    else if(k==='+'||k==='='||k==='-'||k==='0'){const P=(A._hover&&!A._hover.el.hidden&&A._hover.vue)?A._hover:Object.values(A.panels).find(q=>q.vue&&!q.el.hidden);if(P){e.preventDefault();if(k==='0')A.cadrer(P);else A.zoomer(P,k==='-'?.8:1.25)}}
    else if(k==='escape'){ak.classList.remove('drawer-open');A.render()}
    else if(/^[1-9]$/.test(k))A.setTab(+k-1);
  });

  /* ---------- vue : zoom, cadrage, déplacement ---------- */
  const deplacable=P=>P.vue==='svg'||P.vue==='graphe';
  function zoomed(P){
    if(P.vue==='interne')return Math.abs(P.zoom-1)>1e-6;
    if(!deplacable(P))return false;
    const seuil=P.vue==='graphe'?1e-6:.5;
    return Math.abs(P.vz-1)>1e-6||Math.abs(P.vx)>seuil||Math.abs(P.vy)>seuil;
  }
  const markZoom=P=>{if(P.tools)P.tools.classList.toggle('is-zoomed',zoomed(P))};
  const graphAt=(P,x,y)=>P.graphs.find(g=>x>=g.x0&&x<=g.x0+g.w&&y>=g.y0&&y<=g.y0+g.h);
  function resetView(P){P.vz=1;P.vx=P.vy=0;P.zoom=1;P.panX=P.panY=0;markZoom(P)}
  A.zoomer=(P,f,px,py)=>{if(typeof P==='string')P=A.panels[P];if(!P||!P.vue)return;
    if(P.vue==='interne')P.zoom=Math.max(.4,Math.min(5,P.zoom*f));
    else{
      if(P.vue==='graphe'){
        const graph=graphAt(P,px,py);
        px=graph?(px-graph.x0)/graph.w:.5;
        py=graph?(py-graph.y0)/graph.h:.5;
      }else{px=px??P.w/2;py=py??P.h/2}
      const z=Math.max(.5,Math.min(8,P.vz*f)), delta=1/P.vz-1/z;
      P.vx+=px*delta;P.vy+=py*delta;P.vz=z;
    }
    markZoom(P);A.render()};
  A.deplacer=(P,dx,dy,px,py)=>{
    if(!deplacable(P))return;
    if(P.vue==='graphe'){const g=graphAt(P,px,py)||P.graphs[0];dx/=g.w;dy/=g.h}
    P.vx-=dx/P.vz;P.vy-=dy/P.vz;markZoom(P);A.render()
  };
  A.cadrer=P=>{if(typeof P==='string')P=A.panels[P];if(!P)return;resetView(P);A.render()};
  A.cadrerTout=()=>{for(const P of Object.values(A.panels))A.cadrer(P)};

  function wire(P){const N=P.node,pts=new Map();let mode=null,h=null,last=null,pin=null;
    const scr=e=>{const r=N.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    const toV=s=>P.vue==='svg'?[P.vx+s[0]/P.vz,P.vy+s[1]/P.vz]:s;
    const two=()=>{const[a,b]=[...pts.values()];return{d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,c:[(a[0]+b[0])/2,(a[1]+b[1])/2]}};
    N.addEventListener('pointerdown',e=>{
      const s=scr(e);A._hover=P;pts.set(e.pointerId,s);
      if(pts.size===2&&P.vue){if(mode==='drag'&&h&&h.end)h.end(e);mode='pinch';h=null;pin=two();N.setPointerCapture(e.pointerId);e.preventDefault();return}
      if(pts.size>1)return;
      const[x,y]=toV(s);
      if(deplacable(P)&&(e.shiftKey||e.button===1))mode='pan';
      else{h=P._drags.find(d=>!d.hit||d.hit(x,y,e))||null;
        if(h){mode='drag';if(h.start)h.start(x,y,e)}
        else if(deplacable(P)&&zoomed(P))mode='pan';
        else{mode=null;return}}
      last=s;N.setPointerCapture(e.pointerId);e.preventDefault();A.render()});
    N.addEventListener('pointermove',e=>{const s=scr(e);
      if(!pts.has(e.pointerId)){if(e.pointerType==='mouse'){const[x,y]=toV(s);N.style.cursor=P._drags.some(d=>d.hit&&d.hit(x,y,e))?'grab':(deplacable(P)&&(e.shiftKey||zoomed(P)))?'move':''}return}
      pts.set(e.pointerId,s);
      if(mode==='pinch'&&pts.size>=2){const q=two();A.zoomer(P,q.d/pin.d,q.c[0],q.c[1]);A.deplacer(P,q.c[0]-pin.c[0],q.c[1]-pin.c[1],q.c[0],q.c[1]);pin=q;return}
      if(mode==='pan'){A.deplacer(P,s[0]-last[0],s[1]-last[1],last[0],last[1]);last=s;return}
      if(mode==='drag'&&h){const[x,y]=toV(s);h.move(x,y,e);A.render()}});
    const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
      if(mode==='drag'&&h&&h.end)h.end(e);
      if(pts.size===0){mode=null;h=null}else if(mode==='pinch'){mode='pan';last=[...pts.values()][0]}
      A.render()};
    N.addEventListener('pointerup',end);N.addEventListener('pointercancel',end);
    if(P.vue){
      N.addEventListener('wheel',e=>{if(A.narrow&&!e.ctrlKey)return;e.preventDefault();const s=scr(e);A.zoomer(P,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),s[0],s[1])},{passive:false});
      N.addEventListener('dblclick',e=>{const[x,y]=toV(scr(e));if(!P._drags.some(d=>d.hit&&d.hit(x,y,e))&&zoomed(P))A.cadrer(P)});
      N.addEventListener('pointerenter',()=>{A._hover=P});
    }
  }
  for(const P of Object.values(A.panels))wire(P);
  A.drag=(id,h)=>{A.panels[id]._drags.push(h)};

  /* ---------- export image (toujours en thème clair) ---------- */
  A.exportImage=async()=>{
    const was=root.dataset.theme; root.dataset.theme='light'; readColors(); A.renderNow();
    const vis=Object.values(A.panels).filter(P=>!P.el.hidden), base=pwrap.getBoundingClientRect(), sc=2;
    const cv=document.createElement('canvas'); cv.width=Math.round(base.width*sc); cv.height=Math.round(base.height*sc);
    const ctx=cv.getContext('2d'); ctx.fillStyle=A.C.card; ctx.fillRect(0,0,cv.width,cv.height);
    const jobs=vis.map(P=>new Promise(res=>{const r=P.node.getBoundingClientRect(), x=(r.left-base.left)*sc, y=(r.top-base.top)*sc;
      if(P.type==='canvas'){ctx.drawImage(P.node,x,y,r.width*sc,r.height*sc);res();return}
      const clone=P.node.cloneNode(true); clone.setAttribute('width',r.width); clone.setAttribute('height',r.height);
      const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
      const im=new Image(); im.onload=()=>{ctx.drawImage(im,x,y,r.width*sc,r.height*sc);res()}; im.onerror=()=>res(); im.src=src;}));
    await Promise.all(jobs);
    root.dataset.theme=was; readColors(); A.renderNow();
    const a=document.createElement('a'); const tabName=cfg.onglets&&cfg.onglets.length>1?'_'+(A.tab+1):'';
    a.download=`${cfg.code}_${(cfg.fichier||cfg.titre).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_')}${tabName}.png`;
    a.href=cv.toDataURL('image/png'); a.click(); A.toast('Image enregistrée (thème clair)');
  };

  /* ---------- aide ---------- */
  function buildHelp(){
    const h=cfg.aide||{}, sec=(t,c)=>c?`<h4>${t}</h4>${/^\s*</.test(c)?c:`<p>${c}</p>`}`:'';
    dlg.innerHTML=`<header><h3>Aide · ${cfg.titre}</h3><button class="mini" data-close>Fermer ✕</button></header><div class="db">
    ${cfg.sousTitre?`<p class="ak-dlg-sub">${cfg.sousTitre}</p>`:''}${sec('Ce qu\'on voit',h.voit)}${sec('Ce qu\'on peut faire',h.faire)}${sec('Modèle et hypothèses',h.modele)}${sec('Lien avec le cours',h.cours)}${sec('Pour aller plus loin',h.plus)}
    <h4>Raccourcis</h4><p>${cfg.temps?'<kbd>Espace</kbd> lecture / pause · <kbd>→</kbd> pas à pas · <kbd>R</kbd> recommencer · ':''}${tabs?`<kbd>1</kbd>–<kbd>${cfg.onglets.length}</kbd> onglets · `:''}<kbd>P</kbd> projection · <kbd>F</kbd> plein écran · <kbd>T</kbd> thème · <kbd>I</kbd> image · <kbd>H</kbd> aide${h.touches?' · '+h.touches:''}</p>
    <p>Vue : molette, pincement ou <kbd>+</kbd> <kbd>−</kbd> pour zoomer · <kbd>Maj</kbd> + glisser, deux doigts, ou glisser une vue zoomée pour la déplacer · « Cadrer », <kbd>0</kbd> ou double clic : vue initiale · Double-clic sur un curseur : valeur par défaut.</p>
    ${h.credits?`<h4>Crédits</h4><p>${h.credits}</p>`:''}</div>`;
    dlg.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===dlg)dlg.close()});
  }

  /* ---------- démarrage ---------- */
  buildSettings(); buildHelp(); readColors();
  if(cfg.init)cfg.init(A);
  refreshSettings(); A.reset();
  new ResizeObserver(()=>A.render()).observe(ak);
  return A;
}

window.AnimKit={app,fmt,M,ticks,niceStep,FONT,MATH,interrupteur};
})();

<script>
'use strict';
/* =====================================================================
   MC1 MP · A1 Référentiels non galiléens : deux points de vue
   Modèle physique (sans DOM, utilisable sous node pour les contrôles).

   1. Palet pseudo-isolé (aucune force horizontale) sur un plateau en rotation uniforme Ω autour de (Oz).
      Dans le référentiel du sol ℛ (galiléen) : mouvement rectiligne uniforme, OM = OM₀ + v t.
      Dans le référentiel du plateau ℛ' (repères confondus à t = 0, φ = Ω t) :
        OM' = R(−Ωt) OM,   v/ℛ' = R(−Ωt) (v/ℛ − v_e),   v_e = Ω e_z ∧ OM,
        f_ie = m Ω² OM',   f_ic = −2 m Ω e_z ∧ v/ℛ',   m a/ℛ' = f_ie + f_ic.
      Solution exacte : aucun schéma numérique.
   2. Pendule dans une cabine en translation d'accélération constante a₀ = (a_x, a_z) par rapport au sol galiléen
      (z vertical ascendant). Pesanteur apparente g_app = g − a₀. Angle θ du fil avec la verticale descendante de la
      cabine (θ > 0 vers l'avant). Énergie potentielle −m g_app ℓ cos(θ − θ_eq) :
        θ'' = −(g_app/ℓ) sin(θ − θ_eq),   tan θ_eq = −a_x /(g + a_z).
      Intégration RK4 (pas 1/240 s).
   ===================================================================== */
globalThis.MC1DP = (() => {
  const G0 = 9.81, TAU = 2 * Math.PI;
  const rot = (v, a) => {const c = Math.cos(a), s = Math.sin(a); return [c * v[0] - s * v[1], s * v[0] + c * v[1]];};
  const norm = v => Math.hypot(v[0], v[1]);

  /* ---------- 1. palet sur un plateau tournant ---------- */
  /** q = {Om, m, r0, psi, v0, beta, mode} : départ en (r0, psi) du plateau, vitesse v0 dans la direction beta
      (mode 'plat' : par rapport au plateau ; mode 'sol' : par rapport au sol), repères confondus à t = 0 */
  function palet(q) {
    const x0 = [q.r0 * Math.cos(q.psi), q.r0 * Math.sin(q.psi)];
    const vd = [q.v0 * Math.cos(q.beta), q.v0 * Math.sin(q.beta)];
    const ve0 = [-q.Om * x0[1], q.Om * x0[0]];
    const vR = q.mode === 'sol' ? vd : [vd[0] + ve0[0], vd[1] + ve0[1]];
    return {Om: q.Om, m: q.m, x0, vR};
  }
  /** état à l'instant t : positions, vitesses (vecteurs de ℛ dans la base de ℛ, vecteurs de ℛ' dans la base de ℛ') */
  function etat(P, t) {
    const xR = [P.x0[0] + P.vR[0] * t, P.x0[1] + P.vR[1] * t];
    const ve = [-P.Om * xR[1], P.Om * xR[0]];
    const ph = P.Om * t;
    const xp = rot(xR, -ph);
    const vp = rot([P.vR[0] - ve[0], P.vR[1] - ve[1]], -ph);
    const fie = [P.m * P.Om * P.Om * xp[0], P.m * P.Om * P.Om * xp[1]];
    const fic = [2 * P.m * P.Om * vp[1], -2 * P.m * P.Om * vp[0]];
    return {t, ph, xR, vR: P.vR, ve, xp, vp, fie, fic, ap: [(fie[0] + fic[0]) / P.m, (fie[1] + fic[1]) / P.m]};
  }
  /** premier instant t > 0 où |OM| atteint R (palet parti de l'intérieur) ; Infinity s'il n'y arrive jamais */
  function tSortie(P, R) {
    const a = P.vR[0] * P.vR[0] + P.vR[1] * P.vR[1];
    if (a < 1e-12) return Infinity;
    const b = 2 * (P.x0[0] * P.vR[0] + P.x0[1] * P.vR[1]), c = P.x0[0] * P.x0[0] + P.x0[1] * P.x0[1] - R * R;
    if (c >= 0) return 0;
    return (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a);
  }
  /** intégration directe RK4 des équations de ℛ' (contrôle indépendant de la solution exacte) */
  function palet_rk4(P, tmax, n = 20000) {
    const Om = P.Om, h = tmax / n;
    const x0 = P.x0, ve0 = [-Om * x0[1], Om * x0[0]];
    let y = [x0[0], x0[1], P.vR[0] - ve0[0], P.vR[1] - ve0[1]];

    for (let i = 0; i <= nP; i++) {const e = D.etat(I.P, t * i / nP); c1.push([G.X(e.t), G.Y(hy(e.fie))]); c2.push([G.X(e.t), G.Y(hy(e.fic))]);}
    let inner = S.poly(c1, {c: C.F, w: 3}) + S.poly(c2, {c: C.B, w: 3});
    if (p.prev1) {
      const f1 = [], f2 = [], nF = 160;
      for (let i = 0; i <= nF; i++) {const e = D.etat(I.P, t + (tm - t) * i / nF); f1.push([G.X(e.t), G.Y(hy(e.fie))]); f2.push([G.X(e.t), G.Y(hy(e.fic))]);}
      inner += S.poly(f1, {c: C.F, w: 2, dash: '2 5'}) + S.poly(f2, {c: C.B, w: 2, dash: '2 5'});
      if (I.tcross !== null) {
        const xc = G.X(I.tcross);
        inner += S.line(xc, G.y0, xc, G.y0 + G.h, {c: C.ink2, w: 1.4, dash: '5 4'}) +
          lab(a, xc + 6 * k, G.y0 + 12 * k, vecH('f', 'ie') + ' = ' + vecH('f', 'ic'), {c: C.ink2, size: 13.5});
      }
    }
    inner += S.line(G.X(t), G.y0, G.X(t), G.y0 + G.h, {c: C.ink2, w: 1.2, dash: '3 4', op: .8});
    inner += S.circle(G.X(t), G.Y(hy(st.fie)), 5 * k, {fill: C.F, c: C.card, w: 1.5}) + S.circle(G.X(t), G.Y(hy(st.fic)), 5 * k, {fill: C.B, c: C.card, w: 1.5});
    a.svg('graphe', G.svg + clipped(S, G, 'mc1dp-g1', inner));
    horloge(a, t); legend01(a); metrics01(a, I, st);
  }

  /* ---------- onglet 3 : translation accélérée ---------- */
  function draw2(a) {
    const {S, C, k, fmt} = a, p = a.p, PP = pend(a), d = PP.d, t = Math.min(a.t, d.tmax), e = D.pendEtat(d, t);
    const P = a.panels.veh, W = P.w, H = P.h, sc = Math.min(W / 5.8, H / 6.0), cx = W / 2, cy = H / 2 + .1 * sc;
    const X = x => cx + sc * x, Y = z => cy - sc * z;
    const hw = 2.3, hh = 1.7, gX = .5 * p.ax * t * t, gZ = .5 * p.az * t * t;
    let s = '';
    // décor : repère du sol, qui défile à l'opposé du mouvement de la cabine
    const step = 1.5, nx = Math.ceil(W / (sc * step)) + 2, ny = Math.ceil(H / (sc * step)) + 2;
    const mod = (v, m) => ((v % m) + m) % m;
    for (let i = -nx; i <= nx; i++) {const xm = i * step - mod(gX, step); s += S.line(X(xm), 0, X(xm), H, {c: C.ink2, w: 1, op: .35});}
    for (let j = -ny; j <= ny; j++) {const zm = j * step - mod(gZ, step); s += S.line(0, Y(zm), W, Y(zm), {c: C.ink2, w: 1, op: .35});}
    s += lab(a, 10 * k, H - 14 * k, 'repère du sol ℛ (quadrillage de 1.5 m)', {c: C.ink2, size: 13});
    // cabine
    s += S.rect(X(-hw), Y(hh), 2 * hw * sc, 2 * hh * sc, {fill: C.card, c: C.c, w: 3, rx: 6});
    s += S.rect(X(-hw), Y(-hh) - 6 * k, 2 * hw * sc, 6 * k, {fill: C.c, fop: .55});
    // accélération de la cabine (vecteur proportionnel, tracé au-dessus du plafond)
    const ka = .05 * sc;
    if (Math.hypot(p.ax, p.az) > 1e-6) {
      s += S.arrow(X(0), Y(hh + .35), X(0) + ka * p.ax, Y(hh + .35) - ka * p.az, {c: C.E, w: 3.2});
      s += vecLabel(a, X(0) + ka * p.ax + (p.ax >= 0 ? 8 : -8) * k, Y(hh + .35) - ka * p.az - 6 * k, 'a', '0', '', {c: C.E, anchor: p.ax >= 0 ? 'start' : 'end', weight: 600});
    }
    // pendule : angle θ du fil avec la verticale descendante, positif vers l'avant (vers la droite)
    const px = X(0), pz = Y(hh), bx = px + d.l * sc * Math.sin(e.th), bz = pz + d.l * sc * Math.cos(e.th), geq = d.ga > 1e-6;
    if (p.prev2 && geq) {                                  // direction de g_app et équilibre prévu
      const ex = px + (d.l + .25) * sc * Math.sin(d.theq), ez = pz + (d.l + .25) * sc * Math.cos(d.theq), right = Math.sin(d.theq) >= 0;
      s += S.line(px, pz, ex, ez, {c: C.ink2, w: 1.6, dash: '6 5'});
      s += lab(a, ex + (right ? 8 : -8) * k, ez + 4 * k, 'direction de g_app : θ = ' + fmt.fix(d.theq / DEG, 1) + '°', {anchor: right ? 'start' : 'end', c: C.ink2, size: 13});
    }
    s += S.line(px, pz, px, pz + (d.l + .2) * sc, {c: C.ink2, w: 1.2, dash: '3 4', op: .7});
    if (Math.abs(e.th) > .02) s += S.arc(px, pz, .5 * sc, -Math.PI / 2, -Math.PI / 2 + e.th, {c: C.ink, w: 1.6});
    s += S.line(px, pz, bx, bz, {c: e.T < 0 ? C.F : C.ink, w: 2.4, dash: e.T < 0 ? '5 4' : undefined});
    s += S.circle(px, pz, 4 * k, {fill: C.ink});
    // forces sur la masse (longueurs proportionnelles aux forces, pour une même masse)
    if (p.forces) {
      const kf = .09 * sc, A0 = (v, c) => S.arrow(bx, bz, bx + kf * v[0], bz - kf * v[1], {c, w: 3});
      const fie = [-p.ax, -p.az], poids = [0, -G0], Tv = [-Math.sin(e.th) * e.T, Math.cos(e.th) * e.T];
      s += A0(poids, C.v) + A0(fie, C.F) + (e.T > 0 ? A0(Tv, C.B) : '');
      const put = (v, sym, sub, c, pre) => hy(v) > 1e-3 ? vecLabel(a, bx + kf * v[0] + (v[0] >= 0 ? 8 : -8) * k, bz - kf * v[1] + (v[1] <= 0 ? 18 : -6) * k, sym, sub, '', {c, pre, anchor: v[0] >= 0 ? 'start' : 'end', weight: 600}) : '';
      s += put(poids, 'g', undefined, C.v, 'm ') + put(fie, 'f', 'ie', C.F) + (e.T > 0 ? put(Tv, 'T', undefined, C.B) : '');
    }
    s += S.circle(bx, bz, Math.max(7 * k, .1 * sc), {fill: C.ink, c: C.card, w: 1.8});
    // avertissements dans la scène
    let wr = '';
    if (!geq) wr = 'Pesanteur apparente nulle : impesanteur, la masse flotte dans la cabine';
    else if (e.T < 0) wr = 'Fil détendu (tension négative) : le modèle du fil tendu n’est plus valable';
    if (wr) s += lab(a, W / 2, 22 * k, wr, {anchor: 'middle', c: C.F, weight: 600, size: 14});
    a.svg('veh', s);

    // graphe de l'angle
    const Q = a.panels.gveh, tm = d.tmax;
    let amp = Math.max(Math.abs(d.TH[0]), Math.abs(d.theq)) / DEG;
    for (let i = 0; i <= 40; i++) amp = Math.max(amp, Math.abs(d.TH[Math.floor(i * d.n / 40)]) / DEG);
    amp = Math.max(10, amp * 1.15);
    const G = S.graph({x: 0, y: 0, w: Q.w, h: Q.h, padL: 60 * k, padR: 14 * k, padT: 26 * k, padB: 44 * k, xmin: 0, xmax: tm, ymin: -amp, ymax: amp, xlab: 't (s)', ylab: 'θ (°)'});
    const nP = Math.max(2, Math.ceil(400 * t / tm)), cv = [];
    for (let i = 0; i <= nP; i++) {const tt = t * i / nP; cv.push([G.X(tt), G.Y(D.pendEtat(d, tt).th / DEG)]);}
    let inner = '';
    if (p.prev2 && geq) {
      inner += S.line(G.x0, G.Y(d.theq / DEG), G.x0 + G.w, G.Y(d.theq / DEG), {c: C.ink2, w: 1.5, dash: '6 5'});
      if (isFinite(PP.T)) for (let n = 1; n * PP.T < tm; n++) inner += S.line(G.X(n * PP.T), G.y0, G.X(n * PP.T), G.y0 + G.h, {c: C.ink2, w: 1, dash: '2 5', op: .7});
    }
    inner += S.poly(cv, {c: C.E, w: 3}) + S.line(G.X(t), G.y0, G.X(t), G.y0 + G.h, {c: C.ink2, w: 1.2, dash: '3 4', op: .8}) + S.circle(G.X(t), G.Y(e.th / DEG), 5 * k, {fill: C.E, c: C.card, w: 1.5});
    a.svg('gveh', G.svg + clipped(S, G, 'mc1dp-g2', inner));
    horloge(a, t);
    const L = [{label: 'fil et masse', c: C.ink}];
    if (p.forces) L.push({label: M.v('m') + vecH('g'), c: C.v}, {label: vecH('f', 'ie') + ' = −' + M.v('m') + vecH('a', '0'), c: C.F}, {label: vecH('T'), c: C.B});
    L.push({label: vecH('a', '0') + ' de la cabine', c: C.E});
    a.legend(L);
    const m = [{label: vecH('g', 'app') + ' = ' + vecH('g') + ' − ' + vecH('a', '0'), value: fmt.sig(d.ga, 3), unit: 'm·s⁻²'},
      {label: 'Angle ' + M.v('θ') + ' (> 0 vers l’avant)', value: fmt.fix(e.th / DEG, 1), unit: '°'}];
    if (p.prev2 && geq) {
      m.push({label: 'Équilibre ' + M.v('θ', 'éq'), value: fmt.fix(d.theq / DEG, 1), unit: '°', hint: 'tan θ<sub>éq</sub> = −a<sub>x</sub> / (g + a<sub>z</sub>)'});
      m.push({label: 'Période, petites oscillations', value: fmt.sig(PP.T, 3), unit: 's', hint: M.v('T') + ' / ' + M.v('T', '0') + ' = ' + fmt.sig(Math.sqrt(G0 / d.ga), 3)});
    }
    a.metrics(m);
  }

  /* ---------- configuration ---------- */
  AnimKit.app({
    code: 'MC1', partie: 'RougeGrenat', chapitre: 'MC1 Référentiels non galiléens',
    titre: 'Référentiels non galiléens : deux points de vue',
    titreFenetre: 'Référentiels non galiléens : deux points de vue · MC1 · MP',
    menuCommun: true, fichier: 'Deux_Points_De_Vue',
    onglets: ['Deux points de vue', 'Forces d’inertie', 'Translation accélérée'],
    panneaux: [
      {id: 'sol', titre: 'Dans le référentiel du sol ℛ (vue de dessus)', poids: 1, onglets: [0], ratioTel: 1},
      {id: 'plat', titre: 'Dans le référentiel du plateau ℛ′ (vue de dessus)', poids: 1, onglets: [0, 1], ratioTel: 1},
      {id: 'graphe', titre: 'Normes des forces d’inertie', poids: .8, onglets: [1], ratioTel: .75},
      {id: 'veh', titre: 'Dans la cabine, référentiel ℛ′ : le décor défile', poids: 1.5, onglets: [2], ratioTel: 1},
      {id: 'gveh', titre: 'Angle du fil dans la cabine', poids: .9, onglets: [2], ratioTel: .75}
    ],
    temps: true, pas: 1 / 24, vitesses: [.25, .5, 1, 2, 4], vitesse: 1,
    curseur: {max: a => tMax(a), get: a => a.t, set: (a, v) => {a.t = v;}},
    peutLire: a => {if (a.t >= tMax(a) - 1e-9) a.t = 0; return true;},
    step(a, dt) {
      const tm = tMax(a);
      a.t = Math.min(tm, a.t + dt * rate(a));
      if (a.t >= tm - 1e-9) a.play(false);
    },
    reset(a) {a.t = 0;},
    onglet(a) {a.t = 0;},
    change(a, id) {
      if (id === 'Rp' && a.p.r0 > a.p.Rp) a.set('r0', a.p.Rp, {silent: true});
    },
    reglages: [

        {label: 'Lancer depuis le bord', valeurs: {Om: .8, Rp: 3, r0: 2.5, psi: 180, v0: 2, beta: 0, mode: 'plat', m: 1, cible: false}, lecture: true},
        {label: 'Lâché sans vitesse relative', valeurs: {Om: .8, Rp: 3, r0: 2, psi: 0, v0: 0, beta: 0, mode: 'plat', m: 1, cible: false}, lecture: true},
        {label: 'Près de l’axe, Ω faible', valeurs: {Om: .3, Rp: 3, r0: .3, psi: 0, v0: 1.5, beta: 90, mode: 'plat', m: 1, cible: false}, lecture: true},
        {label: 'Rotation en sens inverse', valeurs: {Om: -.8, Rp: 3, r0: 0, psi: 0, v0: 2, beta: 0, mode: 'plat', m: 1, cible: false}, lecture: true},

      ]},
      {titre: 'Plateau', onglets: [0, 1], items: [
        {id: 'Om', type: 'range', label: 'Vitesse angulaire ' + M.v('Ω'), min: -3, max: 3, step: .05, value: .8, unit: 'rad·s⁻¹'},
        {id: 'Rp', type: 'range', label: 'Rayon du plateau', min: 1, max: 5, step: .1, value: 3, unit: 'm'},

        {id: 'psi', type: 'range', label: 'Position de départ (angle)', min: -180, max: 180, step: 1, value: 0, unit: '°', si: a => a.p.r0 > 0},
        {id: 'mode', type: 'seg', label: 'Vitesse de lancement donnée', options: [['plat', 'par rapport au plateau'], ['sol', 'par rapport au sol']], value: 'plat'},
        {id: 'v0', type: 'range', label: 'Vitesse de lancement', min: 0, max: 12, step: .1, value: 2, unit: 'm·s⁻¹'},
        {id: 'beta', type: 'range', label: 'Direction du lancer', min: -180, max: 180, step: 1, value: 0, unit: '°'},
        {id: 'm', type: 'range', label: 'Masse du palet', min: .1, max: 5, step: .1, value: 1, unit: 'kg', onglets: [1]}
      ]},
      {titre: 'À faire apparaître', onglets: [0, 1], items: [
        {id: 'vitesses', type: 'check', label: 'Vitesses dans chaque référentiel', value: false, onglets: [0]},
        {id: 'compo', type: 'check', label: 'Composition des vitesses et point coïncident', value: false, onglets: [0]},
        {id: 'somme', type: 'check', label: 'Somme des deux forces d’inertie', value: true, onglets: [1]},
        {id: 'vit1', type: 'check', label: 'Vitesse dans le plateau', value: false, onglets: [1]},
        {id: 'cible', type: 'check', label: 'Cible sur le bord (direction du lancer)', value: false},
        {id: 'futur', type: 'check', label: 'Suite de la trajectoire (pointillés)', value: false},
        {id: 'valeurs', type: 'check', label: 'Atteinte du bord, écart à la cible', value: false, onglets: [0]},
        {id: 'prev1', type: 'check', label: 'Courbes à venir et instant d’égalité des forces', value: false, onglets: [1]}
      ]},
      {titre: 'Situations', onglets: [2], presets: [
        {label: 'Wagon qui démarre (cours)', valeurs: {ax: 2, az: 0, l: 1, depart: 'vert'}, lecture: true},
        {label: 'Équilibre relatif', valeurs: {ax: 2, az: 0, l: 1, depart: 'eq'}, lecture: true},
        {label: 'Freinage', valeurs: {ax: -3, az: 0, l: 1, depart: 'vert'}, lecture: true},
        {label: 'Ascenseur qui monte', valeurs: {ax: 0, az: 3, l: 1, depart: 'libre', th0: 30}, lecture: true},
        {label: 'Ascenseur qui descend', valeurs: {ax: 0, az: -3, l: 1, depart: 'libre', th0: 30}, lecture: true},
        {label: 'Chute libre : impesanteur', valeurs: {ax: 0, az: -G0, l: 1, depart: 'libre', th0: 30}, lecture: true}
      ]},
      {titre: 'Cabine', onglets: [2], items: [

        {id: 'az', type: 'range', label: 'Accélération verticale ' + vecH('a', '0') + '·' + vecH('e', 'z'), min: -G0, max: 15, step: .01, dec: 2, value: 0, unit: 'm·s⁻²'},

      ]},

        {id: 'th0', type: 'range', label: 'Angle initial ' + M.v('θ'), min: -90, max: 90, step: 1, value: 30, unit: '°', si: a => a.p.depart === 'libre'}
      ]},
      {titre: 'À faire apparaître', onglets: [2], items: [
        {id: 'forces', type: 'check', label: 'Forces sur la masse', value: true},

      ]}
    ],
    aide: {
      voit: '<ul><li><b>Deux points de vue.</b> Un palet glisse sans frottement sur un plateau qui tourne à la vitesse angulaire Ω. À gauche, le référentiel du sol ℛ : le plateau tourne, le palet va en ligne droite à vitesse constante. À droite, le référentiel du plateau ℛ′ : le même mouvement, vu par un observateur qui tourne. La trajectoire s’y incurve vers la droite de la vitesse quand Ω > 0 (sens trigonométrique vu de dessus).</li><li><b>Forces d’inertie.</b> Dans ℛ′, le palet est accéléré alors qu’aucune force d’interaction horizontale ne s’exerce sur lui. On le décrit en ajoutant la force centrifuge (radiale, vers l’extérieur) et la force de Coriolis (orthogonale à la vitesse relative). Le graphe compare leurs normes.</li><li><b>Translation accélérée.</b> Un pendule est suspendu dans une cabine d’accélération constante a<sub>0</sub> par rapport au sol : le fil se place selon la pesanteur apparente g<sub>app</sub> = g − a<sub>0</sub>. Ascenseur et chute libre sont des cas particuliers.</li></ul>',

    },

    }
