.ak.is-proj.drawer-open .ak-right{display:flex}
.ak.is-proj.drawer-open .ak-metrics-wrap.has-items{display:flex}
.ak.is-proj.drawer-open .ak-side{position:static;width:auto;max-width:none;padding:0;background:none;border-left:0;box-shadow:none;transition:none}
.ak.is-proj .ak-drawer-head{display:flex}
.ak.is-proj .ak-btn-settings{display:inline-flex}

/* ---------- téléphone ---------- */
@media (max-width:640px){.ak{height:auto;min-height:100vh;min-height:100dvh;overflow:visible}}
@media (max-width:640px){
  .ak-chk{min-height:44px}
  .ak-body{grid-template-columns:minmax(0,1fr);padding:0 .4em .4em}
  .ak-sub,.ak-lbl{display:none}
  .ak-tools .ib{padding:.3em .45em}
  .ak-title{font-size:1.05em}
  .ak-ptools .mini{min-height:36px}
  .ak-ptools [data-z="0"]{min-width:36px}
  .ak-tools [data-act=image],.ak-tools [data-act=proj]{display:none}
  .ak-btn-settings{display:inline-flex}
  .ak-side{position:fixed;left:0;right:0;bottom:0;max-height:72%;background:var(--paper);border-top:1px solid var(--rule);border-radius:1em 1em 0 0;padding:.6em .9em 1em;transform:translateY(105%);transition:transform .2s;box-shadow:0 -8px 24px rgb(0 0 0/.3);z-index:5;visibility:hidden}

  .ak-drawer-head{display:flex}
  .ak-panels{flex-direction:column;flex:none}

  .ak-scene{flex:none;overflow:visible}
  .ak-panel+.ak-panel{border-left:0;border-top:1px solid var(--rule)}
  .ak-panel>svg,.ak-panel>canvas{flex:none}

  .ak-metrics{grid-template-columns:repeat(auto-fit,minmax(9em,1fr))}
  .ib,.ak-grp .mini,.ak-play,.ak-speed{min-height:44px}

@media (max-width:640px){

}

.ak-dialog h4{color:var(--c-ink);margin:14px 0 4px;font-size:15px}
.ak-dialog p,.ak-dialog li{margin:.3em 0}
.ak-dialog kbd{font:12px var(--font);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 5px}
.ak-toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}

@media print{.ak-tools,.ak-side,.ak-metrics-wrap,.ak-transport{display:none}}

<script>
/* =====================================================================
   AnimKit · script commun des animations (version test UI)
   ===================================================================== */
(function(){
'use strict';
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const MATH='"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif';
const MINUS='−';
const THEME_KEY='cpge-anim-theme';
const METRICS_KEY='cpge-anim-metrics-open';

/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e<-3||e>=6){const m=x/10**e;return (+m.toFixed(n-1)).toFixed(n-1).replace('-',MINUS)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>'}
    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}
function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- icônes ---------------- */
const IC={
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
  sommaire:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h0"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>',
  image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>',
  proj:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M12 16v4M8 20h8"/></svg>',
  fs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  cadrer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>',
  step:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5l9 7-9 7zM16 5h2.5v14H16z"/></svg>',
  reset:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>'
};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function el(tag,attrs={},html){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs))if(v!==undefined&&v!==null&&v!==false)e.setAttribute(k,v===true?'':v);if(html!==undefined)e.innerHTML=html;return e}
function readStore(k,def){try{const v=localStorage.getItem(k);return v===null?def:v}catch{return def}}
function writeStore(k,v){try{localStorage.setItem(k,v)}catch{}}

function interrupteur(label,id){
  const conteneur=el('label',{class:'ak-chk'});
  conteneur.append(
    el('input',{type:'checkbox',role:'switch',id}),
    el('span',{class:'ak-switch-track','aria-hidden':'true'}),
    el('span',{},label)
  );
  return conteneur;
}

/* ---------------- mathématiques en HTML ---------------- */
const M={
  v:(s,sub,sup)=>`<span class="m">${s}</span>${sub!==undefined?`<sub>${sub}</sub>`:''}${sup!==undefined?`<sup>${sup}</sup>`:''}`,
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt"><span class="sym">√</span><span class="rad">${x}</span></span>`,
  vec:s=>`<span class="vec">${s}</span>`
};

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}
      return s;
    },
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;

      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});

    const html=L.map((m,i)=>`<div class="ak-metric${m.warn?' warn':''}${expandedMetrics.has(String(i))?' is-expanded':''}" data-idx="${i}" title="Cliquer pour développer / réduire"><div class="k">${m.label}</div><div class="v">${m.value}${m.unit?(m.unit==='°'?'°':`<span class="u">${m.unit}</span>`):''}</div>${m.hint?`<div class="h">${m.hint}</div>`:''}</div>`).join('');
    if(metrics._h!==html){metrics.innerHTML=html;metrics._h=html}
  };
  A.insight=()=>{};
  A.legend=arr=>{const html=(arr||[]).filter(Boolean).map(l=>`<span><i class="${l.dash?'dash':l.dot?'dot':''}" style="background:${l.c};--lc:${l.c}"></i>${l.label}</span>`).join('');if(legend._h!==html){legend.innerHTML=html;legend._h=html}};
  A.clock=html=>{const c=$('.ak-clock',tr);if(c._h!==html){c.innerHTML=html;c._h=html}};
  A.toast=m=>{toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastEl._h);toastEl._h=setTimeout(()=>toastEl.classList.remove('show'),1800)};
  A.panelVisible=id=>!A.panels[id].el.hidden;

  /* ---------- tailles ---------- */
  function viewBox(P){
    const {w,h,vx,vy,vz}=P;
    P.node.setAttribute('viewBox',P.vue==='svg'?`${vx.toFixed(2)} ${vy.toFixed(2)} ${(w/vz).toFixed(2)} ${(h/vz).toFixed(2)}`:`0 0 ${w.toFixed(1)} ${h.toFixed(1)}`);
  }
  function measure(){
    A.narrow=ak.clientWidth<=640; ak.style.setProperty('--ak-top',(top.offsetHeight+(tabs?tabs.offsetHeight:0))+'px');
    if(A.narrow){if(metricsWrap.parentNode!==right||right.lastElementChild!==metricsWrap)right.append(metricsWrap)}
    else{if(metricsWrap.parentNode!==right||right.firstElementChild!==metricsWrap)right.insertBefore(metricsWrap,side)}
    A.k=ak.classList.contains('is-proj')?1.6:A.narrow?1:1.15;
    for(const P of Object.values(A.panels)){
      if(P.el.hidden)continue;
      if(A.narrow){const w=P.el.clientWidth||ak.clientWidth;P.node.style.height=Math.round(w*(P.cfg.ratioTel??.8))+'px'}else P.node.style.height='';
      const r=P.node.getBoundingClientRect(); P.w=Math.max(50,r.width); P.h=Math.max(50,r.height);
      if(P.type==='canvas'){const d=window.devicePixelRatio||1;if(P.node.width!==Math.round(P.w*d)||P.node.height!==Math.round(P.h*d)){P.node.width=Math.round(P.w*d);P.node.height=Math.round(P.h*d)}P.ctx=P.node.getContext('2d');P.ctx.setTransform(d,0,0,d,0,0)}
      else viewBox(P);
    }
  }
  /* ---------- rendu ---------- */
  let graphPanels=[];
  const activeChartView=P=>P?.vue==='graphe'&&zoomed(P)?P:null;
  function drawFrame(){
    const frame={graphs:[],views:graphPanels.map(activeChartView),outputs:new Map()};
    A._graphFrame=frame;
    try{cfg.draw?.(A)}finally{A._graphFrame=null}
    graphPanels=[];
    for(const [P,output] of frame.outputs){
      const graphs=[...output.html.matchAll(/<g data-ak-graph="(\d+)">/g)].map(m=>frame.graphs[+m[1]]).filter(Boolean);
      output.graphs=graphs;
      if(P.vue==='svg'||P.vue==='graphe'){
        const vue=graphs.length?'graphe':'svg';
        if(vue!==P.vue){P.vue=vue;resetView(P);viewBox(P)}
        P.graphs=graphs;
      }
      const view=activeChartView(P);
      for(const graph of graphs){
        graphPanels[graph.id]=P;
        if(graph.view!==view)frame.changed=true;
      }
    }
    return frame;
  }
  function clipCharts(node,graphs){
    const svgElement=tag=>document.createElementNS(node.namespaceURI,tag);
    for(const graph of graphs){
      const axes=node.querySelector(`[data-ak-graph="${graph.id}"]`);
      if(!axes)continue;
      const id='ak-cadre-'+graph.id, defs=svgElement('defs'),clip=svgElement('clipPath'),rect=svgElement('rect');
      clip.id=id;
      for(const [k,v] of Object.entries({x:graph.x0,y:graph.y0,width:graph.w,height:graph.h}))rect.setAttribute(k,v);
      clip.append(rect);defs.append(clip);axes.append(defs);
      let layer=null;
      for(let next=axes.nextElementSibling;next&&!next.hasAttribute('data-ak-graph');){
        const child=next;next=child.nextElementSibling;
        if(child.localName==='defs'||child.hasAttribute('data-ak-hors-graphe')){layer=null;continue}
        if(!layer){
          layer=svgElement('g');
          layer.setAttribute('clip-path',`url(#${id})`);
          child.before(layer);
        }
        layer.append(child);
      }
    }
  }
  function writeSvg(P,html,graphs=[]){
    if(P.node._h===html)return;
    P.node.innerHTML=html;
    P.node._h=html;
    if(activeChartView(P))clipCharts(P.node,graphs);
  }
  A.renderNow=()=>{
    A._dirty=false;measure();
    let frame=drawFrame();
    if(frame.changed)frame=drawFrame();
    for(const [P,output] of frame.outputs)writeSvg(P,output.html,output.graphs);
    syncScrub();guardScroll();
  };
  A.render=()=>{if(A._dirty)return;A._dirty=true;requestAnimationFrame(()=>{if(A._dirty)A.renderNow()})};
  A.svg=(id,html)=>{
    const P=A.panels[id];if(!P)return;
    if(A._graphFrame)A._graphFrame.outputs.set(P,{html});
    else writeSvg(P,html);
  };

  /* ---------- temps ---------- */
  let last=0;
  const playBtn=$('.ak-play',tr);
  A.play=on=>{on=on===undefined?!A.running:on;if(on&&cfg.peutLire&&!cfg.peutLire(A))on=false;A.running=on;playBtn.textContent=on?'❚❚ Pause':'▶ Lecture';if(on){last=performance.now();requestAnimationFrame(loop)}};
  function loop(now){if(!A.running)return;const dt=Math.min(.05,(now-last)/1000)*A.speed;last=now;if(cfg.step)cfg.step(A,dt);A.renderNow();requestAnimationFrame(loop)}
  A.stepOnce=()=>{A.play(false);if(cfg.step)cfg.step(A,cfg.pas??1/24);A.render()};
  A.reset=()=>{A.play(false);A.t=0;if(cfg.reset)cfg.reset(A);A.render()};
  $('.ak-speed',tr).onchange=e=>{A.speed=+e.target.value};A.speed=cfg.vitesse||1;

  /* ---------- onglets ---------- */
  A.setTab=i=>{if(!tabs||i<0||i>=cfg.onglets.length)return;A.play(false);A.tab=i;A.cadrerTout();clearActivePresets();$$('.ak-tab',tabs).forEach((b,j)=>b.setAttribute('aria-selected',String(j===i)));if(cfg.onglet)cfg.onglet(A,i);refreshSettings();A.render()};

  /* ---------- thème, projection, plein écran ---------- */
  A.setTheme=t=>{root.dataset.theme=t;writeStore(THEME_KEY,t);readColors();syncMenu();A.renderNow()};
  A.setProj=on=>{
    ak.classList.toggle('is-proj',on);
    ak.classList.remove('drawer-open');
    projButton.classList.toggle('on',on);
    syncMenu();
    A.render();
  };
  const acts={
    play:()=>A.play(),step:()=>A.stepOnce(),reset:()=>A.reset(),
    help:()=>{dlg.showModal()},theme:()=>A.setTheme(root.dataset.theme==='dark'?'light':'dark'),
    image:()=>A.exportImage(),proj:()=>{
      const projected=ak.classList.contains('is-proj');
      A.setProj(!projected);
      if(cfg.menuCommun&&projected&&A.narrow)ak.classList.add('drawer-open');
    },
    fs:()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>A.toast('Plein écran refusé par le navigateur'))},
    settings:()=>{ak.classList.toggle('drawer-open');A.render()}
  };
  ak.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&acts[b.dataset.act])acts[b.dataset.act]()});
  addEventListener('keydown',e=>{
    if(dlg.open||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.target.matches('input,select,textarea'))return;
    const k=e.key.toLowerCase(), custom=cfg.touches&&cfg.touches[k];
    if(custom){e.preventDefault();custom(A);A.render();return}
    if(k===' '&&!tr.hidden){e.preventDefault();acts.play()}
    else if(k==='arrowright'&&!tr.hidden){e.preventDefault();acts.step()}
    else if(k==='r'&&!tr.hidden)acts.reset();
    else if(k==='h'||k==='?')acts.help();else if(k==='p')acts.proj();else if(k==='f')acts.fs();else if(k==='t')acts.theme();else if(k==='i')acts.image();
    else if(k==='+'||k==='='||k==='-'||k==='0'){const P=(A._hover&&!A._hover.el.hidden&&A._hover.vue)?A._hover:Object.values(A.panels).find(q=>q.vue&&!q.el.hidden);if(P){e.preventDefault();if(k==='0')A.cadrer(P);else A.zoomer(P,k==='-'?.8:1.25)}}
    else if(k==='escape'){ak.classList.remove('drawer-open');A.render()}
    else if(/^[1-9]$/.test(k))A.setTab(+k-1);
  });

  /* ---------- vue : zoom, cadrage, déplacement ---------- */
  const deplacable=P=>P.vue==='svg'||P.vue==='graphe';
  function zoomed(P){
    if(P.vue==='interne')return Math.abs(P.zoom-1)>1e-6;
    if(!deplacable(P))return false;
    const seuil=P.vue==='graphe'?1e-6:.5;
    return Math.abs(P.vz-1)>1e-6||Math.abs(P.vx)>seuil||Math.abs(P.vy)>seuil;
  }
  const markZoom=P=>{if(P.tools)P.tools.classList.toggle('is-zoomed',zoomed(P))};
  const graphAt=(P,x,y)=>P.graphs.find(g=>x>=g.x0&&x<=g.x0+g.w&&y>=g.y0&&y<=g.y0+g.h);
  function resetView(P){P.vz=1;P.vx=P.vy=0;P.zoom=1;P.panX=P.panY=0;markZoom(P)}
  A.zoomer=(P,f,px,py)=>{if(typeof P==='string')P=A.panels[P];if(!P||!P.vue)return;
    if(P.vue==='interne')P.zoom=Math.max(.4,Math.min(5,P.zoom*f));
    else{
      if(P.vue==='graphe'){
        const graph=graphAt(P,px,py);
        px=graph?(px-graph.x0)/graph.w:.5;
        py=graph?(py-graph.y0)/graph.h:.5;
      }else{px=px??P.w/2;py=py??P.h/2}
      const z=Math.max(.5,Math.min(8,P.vz*f)), delta=1/P.vz-1/z;
      P.vx+=px*delta;P.vy+=py*delta;P.vz=z;
    }
    markZoom(P);A.render()};
  A.deplacer=(P,dx,dy,px,py)=>{
    if(!deplacable(P))return;
    if(P.vue==='graphe'){const g=graphAt(P,px,py)||P.graphs[0];dx/=g.w;dy/=g.h}
    P.vx-=dx/P.vz;P.vy-=dy/P.vz;markZoom(P);A.render()
  };
  A.cadrer=P=>{if(typeof P==='string')P=A.panels[P];if(!P)return;resetView(P);A.render()};
  A.cadrerTout=()=>{for(const P of Object.values(A.panels))A.cadrer(P)};

  function wire(P){const N=P.node,pts=new Map();let mode=null,h=null,last=null,pin=null;
    const scr=e=>{const r=N.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    const toV=s=>P.vue==='svg'?[P.vx+s[0]/P.vz,P.vy+s[1]/P.vz]:s;
    const two=()=>{const[a,b]=[...pts.values()];return{d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,c:[(a[0]+b[0])/2,(a[1]+b[1])/2]}};
    N.addEventListener('pointerdown',e=>{
      const s=scr(e);A._hover=P;pts.set(e.pointerId,s);
      if(pts.size===2&&P.vue){if(mode==='drag'&&h&&h.end)h.end(e);mode='pinch';h=null;pin=two();N.setPointerCapture(e.pointerId);e.preventDefault();return}
      if(pts.size>1)return;
      const[x,y]=toV(s);
      if(deplacable(P)&&(e.shiftKey||e.button===1))mode='pan';
      else{h=P._drags.find(d=>!d.hit||d.hit(x,y,e))||null;
        if(h){mode='drag';if(h.start)h.start(x,y,e)}
        else if(deplacable(P)&&zoomed(P))mode='pan';
        else{mode=null;return}}
      last=s;N.setPointerCapture(e.pointerId);e.preventDefault();A.render()});
    N.addEventListener('pointermove',e=>{const s=scr(e);
      if(!pts.has(e.pointerId)){if(e.pointerType==='mouse'){const[x,y]=toV(s);N.style.cursor=P._drags.some(d=>d.hit&&d.hit(x,y,e))?'grab':(deplacable(P)&&(e.shiftKey||zoomed(P)))?'move':''}return}
      pts.set(e.pointerId,s);
      if(mode==='pinch'&&pts.size>=2){const q=two();A.zoomer(P,q.d/pin.d,q.c[0],q.c[1]);A.deplacer(P,q.c[0]-pin.c[0],q.c[1]-pin.c[1],q.c[0],q.c[1]);pin=q;return}
      if(mode==='pan'){A.deplacer(P,s[0]-last[0],s[1]-last[1],last[0],last[1]);last=s;return}
      if(mode==='drag'&&h){const[x,y]=toV(s);h.move(x,y,e);A.render()}});
    const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
      if(mode==='drag'&&h&&h.end)h.end(e);
      if(pts.size===0){mode=null;h=null}else if(mode==='pinch'){mode='pan';last=[...pts.values()][0]}
      A.render()};
    N.addEventListener('pointerup',end);N.addEventListener('pointercancel',end);
    if(P.vue){
      N.addEventListener('wheel',e=>{if(A.narrow&&!e.ctrlKey)return;e.preventDefault();const s=scr(e);A.zoomer(P,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),s[0],s[1])},{passive:false});
      N.addEventListener('dblclick',e=>{const[x,y]=toV(scr(e));if(!P._drags.some(d=>d.hit&&d.hit(x,y,e))&&zoomed(P))A.cadrer(P)});
      N.addEventListener('pointerenter',()=>{A._hover=P});
    }
  }
  for(const P of Object.values(A.panels))wire(P);
  A.drag=(id,h)=>{A.panels[id]._drags.push(h)};

  /* ---------- export image (toujours en thème clair) ---------- */
  A.exportImage=async()=>{
    const was=root.dataset.theme; root.dataset.theme='light'; readColors(); A.renderNow();
    const vis=Object.values(A.panels).filter(P=>!P.el.hidden), base=pwrap.getBoundingClientRect(), sc=2;
    const cv=document.createElement('canvas'); cv.width=Math.round(base.width*sc); cv.height=Math.round(base.height*sc);
    const ctx=cv.getContext('2d'); ctx.fillStyle=A.C.card; ctx.fillRect(0,0,cv.width,cv.height);
    const jobs=vis.map(P=>new Promise(res=>{const r=P.node.getBoundingClientRect(), x=(r.left-base.left)*sc, y=(r.top-base.top)*sc;
      if(P.type==='canvas'){ctx.drawImage(P.node,x,y,r.width*sc,r.height*sc);res();return}
      const clone=P.node.cloneNode(true); clone.setAttribute('width',r.width); clone.setAttribute('height',r.height);
      const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
      const im=new Image(); im.onload=()=>{ctx.drawImage(im,x,y,r.width*sc,r.height*sc);res()}; im.onerror=()=>res(); im.src=src;}));
    await Promise.all(jobs);
    root.dataset.theme=was; readColors(); A.renderNow();
    const a=document.createElement('a'); const tabName=cfg.onglets&&cfg.onglets.length>1?'_'+(A.tab+1):'';
    a.download=`${cfg.code}_${(cfg.fichier||cfg.titre).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_')}${tabName}.png`;
    a.href=cv.toDataURL('image/png'); a.click(); A.toast('Image enregistrée (thème clair)');
  };

  /* ---------- aide ---------- */
  function buildHelp(){
    const h=cfg.aide||{}, sec=(t,c)=>c?`<h4>${t}</h4>${/^\s*</.test(c)?c:`<p>${c}</p>`}`:'';
    dlg.innerHTML=`<header><h3>Aide · ${cfg.titre}</h3><button class="mini" data-close>Fermer ✕</button></header><div class="db">
    ${cfg.sousTitre?`<p class="ak-dlg-sub">${cfg.sousTitre}</p>`:''}${sec('Ce qu\'on voit',h.voit)}${sec('Ce qu\'on peut faire',h.faire)}${sec('Modèle et hypothèses',h.modele)}${sec('Lien avec le cours',h.cours)}${sec('Pour aller plus loin',h.plus)}
    <h4>Raccourcis</h4><p>${cfg.temps?'<kbd>Espace</kbd> lecture / pause · <kbd>→</kbd> pas à pas · <kbd>R</kbd> recommencer · ':''}${tabs?`<kbd>1</kbd>–<kbd>${cfg.onglets.length}</kbd> onglets · `:''}<kbd>P</kbd> projection · <kbd>F</kbd> plein écran · <kbd>T</kbd> thème · <kbd>I</kbd> image · <kbd>H</kbd> aide${h.touches?' · '+h.touches:''}</p>
    <p>Vue : molette, pincement ou <kbd>+</kbd> <kbd>−</kbd> pour zoomer · <kbd>Maj</kbd> + glisser, deux doigts, ou glisser une vue zoomée pour la déplacer · « Cadrer », <kbd>0</kbd> ou double clic : vue initiale · Double-clic sur un curseur : valeur par défaut.</p>
    ${h.credits?`<h4>Crédits</h4><p>${h.credits}</p>`:''}</div>`;
    dlg.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===dlg)dlg.close()});
  }

  /* ---------- démarrage ---------- */
  buildSettings(); buildHelp(); readColors();
  if(cfg.init)cfg.init(A);
  refreshSettings(); A.reset();
  new ResizeObserver(()=>A.render()).observe(ak);
  return A;
}

window.AnimKit={app,fmt,M,ticks,niceStep,FONT,MATH,interrupteur};
})();

</script>
<script>
/* =====================================================================
   MC2 MP · A1 Frottement solide et ressort : modèle
   Bloc de masse m sur une table fixe, relié à un ressort (k) dont l'autre extrémité est en V t
   (V = 0 : extrémité fixe, oscillateur amorti). y : position du bloc, repérée de sorte que la force
   du ressort sur le bloc vaille F = k (V t − y). Donc Δℓ = V t − y (collé-glissé) et x = y (V = 0).
   Variable d'état comme dans le cours (IV.3) : adhérence tant que |F| ≤ f_s m g ; glissement
   m y'' + λ y' + k y = k V t − σ f_d m g (σ = signe de la vitesse) jusqu'à l'annulation de la vitesse.
   Chaque phase est résolue par sa solution exacte ; seuls les instants d'arrêt sont cherchés
   numériquement (balayage puis dichotomie).
   ===================================================================== */
const MC2Frott = (() => {
  'use strict';
  const G = 9.81;

  /* solution de m u'' + λ u' + k u = 0 : renvoie τ → [u, u'] */
  function libre(m, k, lam, u0, du0) {
    const g = lam / (2 * m), w2 = k / m, d = w2 - g * g;
    if (d > 1e-9 * w2) {
      const wd = Math.sqrt(d), A = u0, B = (du0 + g * u0) / wd;
      return tau => {
        const e = Math.exp(-g * tau), c = Math.cos(wd * tau), s = Math.sin(wd * tau);
        return [e * (A * c + B * s), e * ((B * wd - g * A) * c - (A * wd + g * B) * s)];
      };
    }
    if (d < -1e-9 * w2) {
      const r = Math.sqrt(-d), r1 = -g + r, r2 = -g - r, A = (du0 - r2 * u0) / (r1 - r2), B = u0 - A;
      return tau => { const e1 = Math.exp(r1 * tau), e2 = Math.exp(r2 * tau); return [A * e1 + B * e2, A * r1 * e1 + B * r2 * e2]; };
    }
    const B = du0 + g * u0;
    return tau => { const e = Math.exp(-g * tau); return [e * (u0 + B * tau), e * (B - g * (u0 + B * tau))]; };
  }

  /* phase de glissement commencée au repos en (t0, y0), de sens σ */
  function glissement(P, t0, y0, sigma) {
    const {m, k, fd, V, lam} = P;
    const decal = (lam * V + sigma * fd * m * G) / k;       // solution particulière : V t − décalage
    const u = libre(m, k, lam, y0 - (V * t0 - decal), -V);
    return {type: 'gl', t0, t1: Infinity, y0, sigma, pos: tau => { const [a, da] = u(tau); return [V * (t0 + tau) - decal + a, V + da]; }};
  }

  /* premier instant τ > 0 où la vitesse s'annule (null : pas avant tauMax) */
  function arret(seg, pas, tauMax) {
    const s = seg.sigma;
    let a = 0;
    for (let i = 1; a < tauMax; i++) {
      const b = i * pas;
      if (s * seg.pos(b)[1] <= 0) {
        let lo = a, hi = b;
        for (let j = 0; j < 60; j++) { const mi = (lo + hi) / 2; if (s * seg.pos(mi)[1] <= 0) hi = mi; else lo = mi; }
        return hi;
      }
      a = b;
    }
    return null;
  }

  /**
   * P = {m, k, fs, fd, V (m/s), lam (kg/s), y0 (m), tmax (s)}
   * Bloc immobile en y0 à t = 0.
   */
  function simuler(P) {
    const {m, k, fs, V, y0, tmax} = P, Fs = fs * m * G, eps = Fs * 1e-9;
    const T0 = 2 * Math.PI * Math.sqrt(m / k), pas = T0 / 400;
    const segs = [], departs = [], arrets = [];
    let t = 0, y = y0, fin = null;
    for (let garde = 0; garde < 20000 && t < tmax; garde++) {
      const F = k * (V * t - y);
      let sigma = 0;
      if (F > Fs + eps) sigma = 1; else if (F < -Fs - eps) sigma = -1;
      if (!sigma) {
        /* adhérence : la force du ressort croît à la vitesse k V */
        const t1 = V > 0 ? (y + Fs / k) / V : Infinity;
        segs.push({type: 'adh', t0: t, t1, y0: y, sigma: 0});
        if (!isFinite(t1)) { fin = {t, y}; break; }
        t = Math.max(t, t1);
        if (t >= tmax) break;
        sigma = 1;
      }
      const seg = glissement(P, t, y, sigma);
      segs.push(seg);
      departs.push({t, y, dl: V * t - y, sigma});
      const tau = arret(seg, pas, tmax - t + T0);
      if (tau === null) break;                              // glissement qui dure jusqu'à la fin
      seg.t1 = t + tau;
      y = seg.pos(tau)[0];
      t = seg.t1;
      arrets.push({t, y, dl: V * t - y});
    }
    return {P, segs, departs, arrets, fin, T0};
  }

  /* état à l'instant t */
  function etat(res, t) {
    const {m, k, fs, fd, V} = res.P, s = res.segs;
    let lo = 0, hi = s.length - 1;
    while (lo < hi) { const mi = (lo + hi + 1) >> 1; if (s[mi].t0 <= t) lo = mi; else hi = mi - 1; }
    const seg = s[lo];
    let y = seg.y0, v = 0;
    if (seg.type === 'gl') { const r = seg.pos(Math.max(0, Math.min(t, seg.t1) - seg.t0)); y = r[0]; v = r[1]; }
    const F = k * (V * t - y);
    const RT = seg.type === 'adh' ? -F : -seg.sigma * fd * m * G;
    return {y, v, type: seg.type, sigma: seg.sigma, F, RT, dl: V * t - y, arrete: !!res.fin && t >= res.fin.t - 1e-12, seg, Fs: fs * m * G, Fd: fd * m * G};
  }

  /* instants d'échantillonnage : grille régulière et raccords de phases */
  function instants(res, t0, t1, n = 900) {
    const ts = [];
    for (let i = 0; i <= n; i++) ts.push(t0 + (t1 - t0) * i / n);
    for (const s of res.segs) if (s.t0 > t0 && s.t0 < t1) ts.push(s.t0);
    return ts.sort((a, b) => a - b);
  }

  /* oscillateur : décroissance avec un frottement fluide seul, calée sur le premier extremum */
  function fluideCale(m, k, x0, x1) {
    const r = Math.abs(x1 / x0);
    if (!(x0 * x1 < 0) || !(r > .02 && r < .999)) return null;
    const d = -Math.log(r), z = d / Math.hypot(Math.PI, d), w0 = Math.sqrt(k / m);
    const lam = 2 * z * Math.sqrt(k * m), u = libre(m, k, lam, x0, 0);
    return {lam, zeta: z, wd: w0 * Math.sqrt(1 - z * z), x: t => u(t)[0]};
  }

  return {G, simuler, etat, instants, fluideCale, libre};
})();

// @titre    Frottement solide et ressort · MC2 · MP
// @sortie   ../MC2_Frottement_Ressort/MC2_Frottement_Ressort.html
// @inclure  MC2_Frottement_Ressort_Physique.js
// @style    MC2_Frottement_Ressort.css
// @description Bloc relié à un ressort sur une table avec frottement solide : collé-glissé, oscillateur amorti à décroissance linéaire et portrait de phase.
'use strict';
/* =====================================================================
   MC2 MP · A1 Frottement solide et ressort
   Physique : MC2_Frottement_Ressort_Physique.js (variable d'état, phases résolues exactement).
   Onglets : 1 collé-glissé · 2 oscillateur amorti · 3 portrait de phase (des deux expériences).
   Notations du cours (IV.1 à IV.3) : Δℓ, x, f_s, f_d, R_T, V, x_s, x_d, Δℓ₁, Δℓ₂, Δℓ_P, τ_a, τ_g, ω₀, T₀ ;
   λ : frottement fluide −λ ẋ (notation de l'exercice 9 du TD).
   ===================================================================== */
(() => {
  const MF = MC2Frott, M = AnimKit.M;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const clipped = (S, G, id, content) => S.clip(id, G) + '<g clip-path="url(#' + id + ')">' + content + '</g>';
  const lab = (a, x, y, html, o = {}) => a.S.text(x, y, html, {size: 14, ...o});

  const expDe = a => a.tab === 0 ? 'cg' : a.tab === 1 ? 'osc' : a.p.exp;
  const duree = a => expDe(a) === 'cg' ? a.p.dureeCG : a.p.dureeOsc;

  /* ---------- trajectoire (mémorisée tant que les paramètres ne changent pas) ---------- */
  const cache = {};
  function traj(a) {
    const p = a.p, cg = expDe(a) === 'cg';
    const P = {m: p.m, k: p.k, fs: p.fs, fd: Math.min(p.fd, p.fs), lam: p.lam, V: cg ? p.V / 100 : 0, y0: cg ? 0 : p.x0 / 100, tmax: duree(a)};
    const cle = JSON.stringify(P), id = cg ? 'cg' : 'osc';
    if (!cache[id] || cache[id].cle !== cle) cache[id] = {cle, res: MF.simuler(P)};
    return cache[id].res;
  }
  const w0 = p => Math.sqrt(p.k / p.m);
  const poids = p => p.m * MF.G;
  const dl1 = p => p.fs * poids(p) / p.k;
  const dlP = p => p.fd * poids(p) / p.k;
  const dl2 = p => (2 * p.fd - p.fs) * poids(p) / p.k;

  /* mémoire pour « garder la courbe » */
  let gardee = {cg: null, osc: null};

  const nomEtat = e => e.type === 'adh' ? 'adhérence' : 'glissement';
  const cAdh = a => a.C.B;                                          // couleurs des deux états, distinctes des forces
  const cGl = a => a.C.dark ? '#c9a0ff' : '#6d35b8';
  const coulEtat = (a, e) => e.type === 'adh' ? cAdh(a) : cGl(a);

  /* ---------- dessins élémentaires ---------- */
  function pasRond(r) {                                            // 1, 2 ou 5 × 10ⁿ
    const q = 10 ** Math.floor(Math.log10(r)), f = r / q;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * q;
  }
  function ressort(a, x1, x2, y, amp, c) {
    const n = 11, bout = 10 * a.k, L = x2 - x1 - 2 * bout, pts = [[x1, y], [x1 + bout, y]];
    for (let i = 0; i < 2 * n; i++) pts.push([x1 + bout + L * (i + .5) / (2 * n), y + (i % 2 ? amp : -amp)]);
    pts.push([x2 - bout, y], [x2, y]);
    return a.S.poly(pts, {c, w: 2});
  }
  function graduations(a, X, sc, xa, xb, y, origine) {              // règle sur la table, en cm
    const S = a.S, C = a.C, k = a.k;
    const pas = pasRond((xb - xa) / sc * 100 / Math.max(3, (xb - xa) / (80 * k))) / 100;
    let s = '';
    const w1 = (xa - X(0)) / sc, w2 = (xb - X(0)) / sc;
    for (let i = Math.ceil((w1 - origine) / pas - 1e-9); origine + i * pas <= w2 + 1e-9; i++) {
      const xw = origine + i * pas, px = X(xw), v = i * pas * 100;
      s += S.line(px, y, px, y + 7 * k, {c: C.ink2, w: 1.2});
      s += lab(a, px, y + 17 * k, a.fmt.fix(v, pas < .01 - 1e-9 ? 1 : 0), {anchor: 'middle', size: 13, c: C.ink2, halo: false});
    }
    return s;
  }
  function sol(a, xa, xb, y) {
    const S = a.S, C = a.C, k = a.k;
    let s = S.line(xa, y, xb, y, {c: C.ink, w: 2});
    for (let x = xa + 8 * k; x < xb; x += 14 * k) s += S.line(x, y + 1, x - 6 * k, y + 7 * k, {c: C.rule, w: 1.4});
    return s;
  }

  /* ---------- jauge de R_T (valeur écrite à côté de l'état) ---------- */
  function jauge(a, e, x, y, w, dessous) {
    const {S, C, k} = a;
    const Fs = e.Fs, X = v => x + w / 2 + v / Fs * w / 2, h = 12 * k, fd = e.Fd;
    let s = S.rect(x, y, w, h, {fill: C.card, c: C.ink2, w: 1.2, rx: 3});
    s += S.rect(Math.min(X(0), X(e.RT)), y + 1.5, Math.abs(X(e.RT) - X(0)), h - 3, {fill: coulEtat(a, e), op: .75});
    s += S.line(X(0), y - 3 * k, X(0), y + h + 3 * k, {c: C.ink, w: 1.4});
    for (const sg of [-1, 1]) {
      s += S.line(X(sg * fd), y - 4 * k, X(sg * fd), y + h + 4 * k, {c: C.ink2, w: 1.6, dash: '3 2'});
      s += S.line(X(sg * Fs), y - 4 * k, X(sg * Fs), y + h + 4 * k, {c: C.ink, w: 2});
    }
    s += lab(a, x - 7 * k, y + h / 2, '−' + S.v('f', 's') + S.v('mg'), {anchor: 'end', size: 13});
    s += lab(a, x + w + 7 * k, y + h / 2, '+' + S.v('f', 's') + S.v('mg'), {anchor: 'start', size: 13});
    if (dessous) {
      const yt = y + h + 15 * k;
      s += lab(a, X(0), yt, '0', {anchor: 'middle', size: 13});
      if (fd / Fs * w / 2 > 34 * k) {
        s += lab(a, X(-fd), yt, '−' + S.v('f', 'd') + S.v('mg'), {anchor: 'middle', size: 13});
        s += lab(a, X(fd), yt, '+' + S.v('f', 'd') + S.v('mg'), {anchor: 'middle', size: 13});
      }
    }
    return s;
  }

  /* ---------- scène ---------- */
  function scene(a, id) {
    const {S, C, k, p, fmt} = a, P = a.panels[id], w = P.w, h = P.h, cg = expDe(a) === 'cg';
    const res = traj(a), t = Math.min(a.t, duree(a)), e = MF.etat(res, t);
    const avecJauge = h >= 108 * k;
    const bh = clamp(h * .2, 22 * k, 54 * k), bw = bh * 1.5;
    const ySol = avecJauge ? clamp(h * .57, bh + 34 * k, h - 53 * k) : h - 30 * k;
    const yc = ySol - bh / 2;
    let g = '';
    let face, X, sc, bloc0;                                          // face : bord du bloc côté ressort

    if (cg) {
      const A = Math.max(dl1(p), Math.abs(dl2(p)), .004), L0 = 1.8 * A;
      const xBout = w - 64 * k;
      sc = (xBout - bw - 20 * k) / (L0 + 1.35 * A);
      const cam = p.V / 100 * t + L0;                                // la vue suit l'extrémité du ressort
      X = yw => xBout + (yw - cam) * sc;
      face = X(e.y); bloc0 = face - bw;
      g += sol(a, 6 * k, w - 6 * k, ySol) + graduations(a, X, sc, 18 * k, w - 18 * k, ySol + 6 * k, 0);
      g += ressort(a, face, xBout, yc, bh * .2, C.ink);
      // dynamomètre tiré à V
      g += S.line(xBout, yc, xBout + 10 * k, yc, {c: C.ink, w: 2}) + S.circle(xBout + 18 * k, yc, 8 * k, {c: C.cInk, w: 3});
      g += S.arrow(xBout + 28 * k, yc, w - 6 * k, yc, {c: C.cInk, w: 2.5});
      g += lab(a, w - 8 * k, yc - 16 * k, S.v('V'), {anchor: 'end', c: C.cInk, weight: 600});
      if (w >= 620 * k) g += lab(a, w - 8 * k, 14 * k, 'la vue suit l’extrémité du ressort · table graduée en cm', {anchor: 'end', size: 13, c: C.ink2});
    } else {
      const A = Math.max(p.xmax / 100, Math.abs(p.x0) / 100), L0 = 1.35 * A;
      const xMur = 26 * k;
      sc = (w - xMur - bw - 24 * k) / (L0 + A);
      X = x => xMur + (L0 + x) * sc;
      face = X(e.y); bloc0 = face;
      g += sol(a, xMur, w - 6 * k, ySol) + graduations(a, X, sc, xMur + 14 * k, w - 14 * k, ySol + 6 * k, 0);
      g += S.rect(xMur - 14 * k, ySol - bh - 20 * k, 14 * k, bh + 20 * k, {fill: C.rule});
      g += S.line(xMur, ySol - bh - 20 * k, xMur, ySol, {c: C.ink, w: 2.5});
      g += ressort(a, xMur, face, yc, bh * .2, C.ink);
      // longueur à vide : x = 0
      g += S.line(X(0), ySol - bh - 14 * k, X(0), ySol, {c: C.ink2, w: 1.2, dash: '4 4'});
      g += lab(a, X(0), ySol - bh - 24 * k, S.v('x') + ' = 0', {anchor: 'middle', size: 13});
      if (p.zone) {
        const xs = dl1(p);
        g += S.rect(X(-xs), ySol - 6 * k, 2 * xs * sc, 6 * k, {fill: C.c, op: .45});
        g += lab(a, X(xs) + 4 * k, ySol - bh - 8 * k, 'zone d’arrêt', {size: 13, c: C.cInk});
      }
      g += S.arrow(w - 150 * k, 16 * k, w - 102 * k, 16 * k, {c: C.ink, w: 1.8}) + lab(a, w - 126 * k, 31 * k, S.v('e', 'x'), {anchor: 'middle', size: 13}) +
        S.arrow(w - 131 * k, 24 * k, w - 120 * k, 24 * k, {c: C.ink2, w: 1, head: 3.5 * k});
    }

    // bloc
    g += S.rect(bloc0, ySol - bh, bw, bh, {fill: C.cSoft, c: C.cInk, w: 2.2, rx: 3});
    g += lab(a, bloc0 + bw / 2, ySol - bh * .74, S.v('m'), {anchor: 'middle', c: C.ink2, halo: false});

    // forces sur le bloc, proportionnelles à leur norme
    const Fref = Math.max(e.Fs, cg ? e.Fs * 1.3 : p.k * Math.max(p.xmax, Math.abs(p.x0)) / 100);
    const Lf = clamp(w * .16, 60 * k, 130 * k), sf = Lf / Fref;
    const xG = bloc0 + bw / 2;
    if (p.forces) {
      const Fr = e.F;                                               // force du ressort sur le bloc
      g += S.arrow(xG, yc, xG + Fr * sf, yc, {c: C.F, w: 3.2});
      g += S.arrow(xG, ySol - 5 * k, xG + e.RT * sf, ySol - 5 * k, {c: C.E, w: 3.2});
      g += S.circle(xG, yc, 3 * k, {fill: C.ink});
    }
    // vitesse
    const vref = cg ? Math.max(p.V / 100, w0(p) * (dl1(p) - dlP(p)) * 2, .01) : w0(p) * Math.max(p.xmax, Math.abs(p.x0)) / 100;
    const Lv = e.v / vref * clamp(w * .12, 50 * k, 100 * k);
    if (Math.abs(Lv) > 1) {
      g += S.arrow(xG, ySol - bh - 9 * k, xG + Lv, ySol - bh - 9 * k, {c: C.v, w: 2.8});
      g += lab(a, xG + Lv + (Lv > 0 ? 7 : -7) * k, ySol - bh - 10 * k, S.v('v'), {anchor: Lv > 0 ? 'start' : 'end', c: C.v, weight: 600});
    }

    // état du contact
    const txt = e.arrete ? 'ARRÊT DÉFINITIF' : e.type === 'adh' ? 'ADHÉRENCE' : 'GLISSEMENT';
    const bwB = (txt.length * 9.6 + 22) * k, yB = 5 * k;
    g += S.rect(8 * k, yB, bwB, 26 * k, {fill: C.card, c: coulEtat(a, e), w: 2.2, rx: 6});
    g += lab(a, 8 * k + bwB / 2, yB + 13.5 * k, txt, {anchor: 'middle', c: coulEtat(a, e), weight: 700, halo: false});
    g += lab(a, 18 * k + bwB, yB + 13.5 * k, S.v('R', 'T') + ' = ' + fmt.fix(Math.abs(e.RT) < 5e-3 ? 0 : e.RT, 2) + ' N', {c: C.ink, weight: 600});
    if (e.arrete && !cg) g += lab(a, avecJauge && h >= 190 * k ? 8 * k : 140 * k + bwB, avecJauge && h >= 190 * k ? yB + 42 * k : yB + 13.5 * k, 'depuis ' + S.v('t') + ' = ' + fmt.fix(res.fin.t, 2) + ' s, en ' + S.v('x') + ' = ' + fmt.fix(res.fin.y * 100, 2) + ' cm', {size: 13, c: C.ink});

    if (avecJauge) {
      const jw = clamp(w * .42, 150 * k, 420 * k), yj = ySol + 35 * k;
      g += jauge(a, e, (w - jw) / 2, yj, jw, h >= yj + 36 * k);
    }
    a.svg(id, g);

    if (!cg && id === 'scene') {                                    // choix de x0 à la souris
      P._geo = {X0: X(0), sc, face, bw, y1: ySol - bh - 8 * k, y2: ySol + 6 * k};
    }
  }

  /* ---------- graphe temporel ---------- */
  function bandes(a, G, res, tm) {
    const {S, C, k} = a;
    let s = '', noms = '';
    const iv = [];
    for (const seg of res.segs) {
      const t0 = seg.t0, t1 = Math.min(seg.t1, tm, duree(a));
      if (t1 - t0 <= 1e-9) continue;
      const d = iv[iv.length - 1];
      if (d && d.type === seg.type) d.t1 = t1; else iv.push({type: seg.type, t0, t1});
    }
    for (const q of iv) {
      const xa = G.X(q.t0), xb = G.X(q.t1);
      if (q.type === 'gl') s += S.rect(xa, G.y0, xb - xa, G.h, {fill: cGl(a), op: .16});
      const txt = q.type === 'adh' ? 'adhérence' : 'glissement';
      if (xb - xa > (txt.length * 7.2 + 10) * k) noms += lab(a, (xa + xb) / 2, G.y0 + G.h - 11 * k, txt, {anchor: 'middle', size: 13, c: q.type === 'adh' ? cAdh(a) : cGl(a), weight: 600});
    }
    return {fond: s, noms};
  }
  const courbe = (res, tm, f) => tm <= 0 ? [] : MF.instants(res, 0, tm).map(t => [t, f(MF.etat(res, t))]);

  function ligneNiveau(a, G, v, nom, o = {}) {
    const {S, C, k} = a;
    return S.line(G.x0, G.Y(v), G.x0 + G.w, G.Y(v), {c: o.c || C.cInk, w: 1.4, dash: o.dash || '6 5'}) +
      lab(a, G.x0 + G.w - 4 * k, G.Y(v) + (o.dessous ? 10 : -9) * k, nom, {anchor: 'end', size: 13, c: o.c || C.cInk});
  }

  function grapheForce(a) {
    const {S, C, k, p, fmt} = a, P = a.panels.force, res = traj(a), T = p.dureeCG, t = Math.min(a.t, T), e = MF.etat(res, t);
    const G = S.graph({x: 0, y: 0, w: P.w, h: P.h, padL: 56 * k, padR: 16 * k, padT: 24 * k, padB: 40 * k, xmin: 0, xmax: T, ymin: p.fmin, ymax: p.Fmax,
      xlab: S.v('t') + ' (s)', ylab: S.v('k') + 'Δℓ (N)'});
    const b = bandes(a, G, res, t);
    let in_ = b.fond;
    if (p.niveaux) {
      in_ += ligneNiveau(a, G, p.k * dl1(p), S.v('k') + 'Δ' + S.v('ℓ', '1'));
      if (p.fd < p.fs) {
        in_ += ligneNiveau(a, G, p.k * dlP(p), S.v('k') + 'Δ' + S.v('ℓ', 'P'), {dash: '2 4', c: C.ink2});
        in_ += ligneNiveau(a, G, p.k * dl2(p), S.v('k') + 'Δ' + S.v('ℓ', '2'));
      }
    }
    if (gardee.cg) in_ += S.curve(gardee.cg.pts, G, {c: C.ink2, w: 1.8, dash: '6 4'});
    in_ += S.curve(courbe(res, t, q => p.k * q.dl), G, {c: C.F, w: 2.8});
    if (p.durees && p.fd < p.fs) {                                  // τ_a et τ_g du dernier cycle achevé
      const c = dernierCycle(res, t);
      if (c && c.ta !== null) {
        const yv = p.k * dl1(p) + (p.Fmax - p.fmin) * .09;
        for (const [t0, t1, nom] of [[c.tPrec, c.tDep, S.v('τ', 'a')], [c.tDep, c.tArr, S.v('τ', 'g')]]) {
          const xa = G.X(t0), xb = G.X(t1);
          in_ += S.arrow((xa + xb) / 2, G.Y(yv), xb, G.Y(yv), {c: C.ink, w: 1.2, head: 5 * k}) + S.arrow((xa + xb) / 2, G.Y(yv), xa, G.Y(yv), {c: C.ink, w: 1.2, head: 5 * k});
          in_ += lab(a, (xa + xb) / 2, G.Y(yv) - 11 * k, nom, {anchor: 'middle', size: 13, c: C.ink});
        }
      }
    }
    in_ += S.line(G.X(t), G.y0, G.X(t), G.y0 + G.h, {c: C.ink2, w: 1.1, dash: '3 4'}) + S.circle(G.X(t), G.Y(p.k * e.dl), 5 * k, {fill: C.F, c: C.card, w: 1.5});
    const horsCadre = p.k * dl1(p) > p.Fmax || p.k * dl2(p) < p.fmin - 1e-9;
    a.svg('force', G.svg + clipped(S, G, 'mc2f-g1', in_ + b.noms) + (horsCadre ? lab(a, G.x0 + G.w / 2, G.y0 + 12 * k, 'Courbe hors cadre : régler les bornes de la force', {anchor: 'middle', c: C.hot, weight: 600}) : ''));
  }

  function graphePos(a) {
    const {S, C, k, p, fmt} = a, P = a.panels.pos, res = traj(a), T = p.dureeOsc, t = Math.min(a.t, T), e = MF.etat(res, t), X = p.xmax;
    const G = S.graph({x: 0, y: 0, w: P.w, h: P.h, padL: 56 * k, padR: 16 * k, padT: 24 * k, padB: 40 * k, xmin: 0, xmax: T, ymin: -X, ymax: X,
      xlab: S.v('t') + ' (s)', ylab: S.v('x') + ' (cm)'});
    const b = bandes(a, G, res, t);
    let in_ = b.fond;
    const xs = 100 * dl1(p), xd = 100 * dlP(p), T0 = 2 * Math.PI / w0(p);
    if (p.zone) {
      in_ += S.rect(G.x0, G.Y(xs), G.w, G.Y(-xs) - G.Y(xs), {fill: C.c, op: .2});
      in_ += ligneNiveau(a, G, xs, '+' + S.v('x', 's'), {dash: '2 4'}) + ligneNiveau(a, G, -xs, '−' + S.v('x', 's'), {dash: '2 4', dessous: true});
    }
    if (p.enveloppe && Math.abs(p.x0) > xs && p.lam === 0) {        // |x| = |x0| − 4 x_d t / T0
      const x0 = Math.abs(p.x0), tz = x0 / (4 * xd) * T0, tf = Math.min(tz, T);
      for (const sg of [-1, 1]) in_ += S.curve([[0, sg * x0], [tf, sg * (x0 - 4 * xd * tf / T0)]], G, {c: C.ink, w: 1.4, dash: '7 5'});
    }
    if (p.compare) {
      const f = comparaison(a, res);
      if (f && t > 0) {
        const pts = [];
        for (let i = 0; i <= 700; i++) { const tt = t * i / 700; pts.push([tt, 100 * f.x(tt)]); }
        in_ += S.curve(pts, G, {c: C.E, w: 2, dash: '5 4'});
      }
    }
    if (gardee.osc) in_ += S.curve(gardee.osc.pts, G, {c: C.ink2, w: 1.8, dash: '6 4'});
    in_ += S.curve(courbe(res, t, q => 100 * q.y), G, {c: C.cInk, w: 2.8});
    // extremums atteints
    const ext = [{t: 0, y: res.P.y0}].concat(res.arrets).filter(q => q.t <= t + 1e-9);
    ext.forEach((q, n) => {
      const y = 100 * q.y;
      in_ += S.circle(G.X(q.t), G.Y(y), 4 * k, {fill: C.card, c: C.cInk, w: 2});
      if (ext.length <= 12 && G.w / T * T0 / 2 > 24 * k) {
        let yl = G.Y(y) + (y >= 0 ? -13 : 13) * k, xl = G.X(q.t), anc = n ? 'middle' : 'start';
        if (yl < G.y0 + 8 * k || yl > G.y0 + G.h - 8 * k) { yl = clamp(G.Y(y), G.y0 + 8 * k, G.y0 + G.h - 8 * k); xl += 8 * k; anc = 'start'; }
        else if (!n) xl += 7 * k;
        in_ += lab(a, xl, yl, S.v('x', n), {anchor: anc, size: 13, c: C.ink});
      }
    });
    in_ += S.line(G.X(t), G.y0, G.X(t), G.y0 + G.h, {c: C.ink2, w: 1.1, dash: '3 4'}) + S.circle(G.X(t), G.Y(100 * e.y), 5 * k, {fill: C.cInk, c: C.card, w: 1.5});
    a.svg('pos', G.svg + clipped(S, G, 'mc2f-g2', in_ + b.noms) + (Math.abs(p.x0) > X ? lab(a, G.x0 + G.w / 2, G.y0 + 12 * k, 'Courbe hors cadre : augmenter le maximum de x', {anchor: 'middle', c: C.hot, weight: 600}) : ''));
  }

  function comparaison(a, res) {
    const x1 = res.arrets.length ? res.arrets[0].y : null;
    if (x1 === null || a.p.lam > 0) return null;
    return MF.fluideCale(a.p.m, a.p.k, res.P.y0, x1);
  }

  function dernierCycle(res, t) {                                   // dernier glissement achevé à l'instant t
    let i = -1;
    while (i + 1 < res.arrets.length && res.arrets[i + 1].t <= t + 1e-9) i++;
    if (i < 0) return null;
    const dep = res.departs[i], arr = res.arrets[i], prec = i > 0 ? res.arrets[i - 1] : null;
    return {dl1: dep.dl, dl2: arr.dl, tDep: dep.t, tArr: arr.t, tg: arr.t - dep.t, tPrec: prec ? prec.t : null, ta: prec ? dep.t - prec.t : null};
  }

  /* ---------- portrait de phase ---------- */
  function portrait(a) {
    const {S, C, k, p, fmt} = a, P = a.panels.phase, cg = expDe(a) === 'cg', res = traj(a), t = Math.min(a.t, duree(a));
    const W = w0(p), V = p.V / 100;
    const U = q => cg ? 100 * (q.dl - dlP(p)) : 100 * q.y;           // abscisse (cm)
    const Wp = q => cg ? 100 * (V - q.v) / W : 100 * q.v / W;        // ordonnée (cm)
    let R;
    if (cg) R = 100 * Math.max(Math.hypot(dl1(p) - dlP(p), V / W), dlP(p) * .2, .002) * 1.3;
    else R = Math.max(Math.abs(p.x0), 100 * dl1(p), 1) * 1.15;
    const padL = 58 * k, padR = 18 * k, padT = 26 * k, padB = 42 * k, iw = Math.max(40, P.w - padL - padR), ih = Math.max(40, P.h - padT - padB);
    const ech = Math.min(iw, ih) / (2 * R), xm = iw / ech / 2, ym = ih / ech / 2;       // mêmes échelles
    const G = S.graph({x: 0, y: 0, w: P.w, h: P.h, padL, padR, padT, padB, xmin: -xm, xmax: xm, ymin: -ym, ymax: ym,
      xlab: cg ? S.v('u') + ' = Δℓ − Δ' + S.v('ℓ', 'P') + ' (cm)' : S.v('x') + ' (cm)',
      ylab: (cg ? S.v('u̇') : S.v('ẋ')) + ' / ' + S.v('ω', '0') + ' (cm)'});
    const u = (G.X(1) - G.X(0));                                     // pixels par cm
    let in_ = S.line(G.X(0), G.y0, G.X(0), G.y0 + G.h, {c: C.ink2, w: 1});
    const tick = (x, nom, c, bas) => S.line(G.X(x), G.Y(0) - 6 * k, G.X(x), G.Y(0) + 6 * k, {c, w: 2}) + lab(a, G.X(x), G.Y(0) + (bas ? 18 : -16) * k, nom, {anchor: 'middle', size: 13, c});
    if (cg) {
      const u0 = 100 * (dl1(p) - dlP(p)), wV = 100 * V / W;
      if (p.cercle) {
        const r = Math.hypot(u0, wV);
        in_ += S.circle(G.X(0), G.Y(0), r * u, {c: C.ink2, w: 1.2, dash: '5 5'});
        in_ += S.line(G.x0, G.Y(wV), G.x0 + G.w, G.Y(wV), {c: cAdh(a), w: 1.2, dash: '5 5'});
        in_ += lab(a, G.x0 + G.w - 4 * k, G.Y(wV) - 10 * k, S.v('u̇') + ' = ' + S.v('V') + ' : bloc immobile', {anchor: 'end', size: 13, c: cAdh(a)});
        if (u0 * u > 12) in_ += tick(u0, S.v('u', '0'), C.ink, true) + tick(-u0, '−' + S.v('u', '0'), C.ink, true);
      }
    } else {
      const xd = 100 * dlP(p), xs = 100 * dl1(p);
      if (p.zone) {
        in_ += S.line(G.X(-xs), G.Y(0), G.X(xs), G.Y(0), {c: C.c, w: 7, op: .55});
        in_ += lab(a, G.X(xs) + 6 * k, G.Y(0) + 30 * k, 'zone d’arrêt', {size: 13, c: C.cInk});
      }
      if (p.cercle) {
        if (2 * xd * u > 40 * k) in_ += tick(xd, '+' + S.v('x', 'd'), C.ink, false) + tick(-xd, '−' + S.v('x', 'd'), C.ink, false);
        else in_ += lab(a, G.X(0), G.Y(0) - 18 * k, 'centres ±' + S.v('x', 'd'), {anchor: 'middle', size: 13, c: C.ink});
        in_ += S.circle(G.X(xd), G.Y(0), 3.5 * k, {fill: C.ink}) + S.circle(G.X(-xd), G.Y(0), 3.5 * k, {fill: C.ink});
      }
    }
    if (gardee[cg ? 'cg' : 'osc']?.phase) in_ += S.curve(gardee[cg ? 'cg' : 'osc'].phase, G, {c: C.ink2, w: 1.6, dash: '6 4'});
    // trajectoire : une couleur par état
    const fin = Math.min(t, res.fin ? res.fin.t : t);
    for (const seg of res.segs) {
      const t0 = seg.t0, t1 = Math.min(seg.t1, fin);
      if (t1 - t0 <= 1e-9) continue;
      const n = Math.max(3, Math.min(240, Math.ceil((t1 - t0) / res.T0 * 160))), pts = [];
      for (let i = 0; i <= n; i++) { const tt = t0 + (t1 - t0) * (i / n) * (1 - 1e-9); const q = MF.etat(res, tt); pts.push([U(q), Wp(q)]); }
      in_ += S.curve(pts, G, {c: seg.type === 'adh' ? cAdh(a) : cGl(a), w: seg.type === 'adh' ? 3.4 : 2.6});
    }
    // sens de parcours et point courant
    const e = MF.etat(res, t), px = G.X(U(e)), py = G.Y(Wp(e));
    if (!e.arrete && t > 0) {
      const h = res.T0 / 300, q = MF.etat(res, Math.max(0, t - h)), dx = px - G.X(U(q)), dy = py - G.Y(Wp(q)), n = Math.hypot(dx, dy);
      if (n > .3) in_ += S.arrow(px, py, px + dx / n * 20 * k, py + dy / n * 20 * k, {c: coulEtat(a, e), w: 2.4});
    }
    in_ += S.circle(px, py, 6 * k, {fill: coulEtat(a, e), c: C.card, w: 1.8});
    a.svg('phase', G.svg + clipped(S, G, 'mc2f-g3', in_));
  }

  /* ---------- mesures et légende ---------- */
  function mesures(a) {
    const {p, fmt} = a, res = traj(a), t = Math.min(a.t, duree(a)), e = MF.etat(res, t), cg = expDe(a) === 'cg';
    const L = [{label: 'État du contact', value: e.arrete ? 'arrêt' : nomEtat(e), unit: ''}];
    const th = s => 'théorie : ' + s;
    if (cg) {
      const c = dernierCycle(res, t);
      L.push({label: 'Allongement Δℓ', value: fmt.fix(100 * e.dl, 2), unit: 'cm'});
      L.push({label: 'Force lue ' + M.v('k') + 'Δℓ', value: fmt.fix(p.k * e.dl, 2), unit: 'N'});
      L.push({label: 'Δℓ au dernier décrochage', value: c ? fmt.fix(100 * c.dl1, 2) : '—', unit: c ? 'cm' : '', hint: p.niveaux ? th('Δ' + M.v('ℓ', '1') + ' = ' + fmt.fix(100 * dl1(p), 2) + ' cm') : ''});
      L.push({label: 'Δℓ au dernier arrêt', value: c ? fmt.fix(100 * c.dl2, 2) : '—', unit: c ? 'cm' : '', hint: p.niveaux && p.fd < p.fs ? th('Δ' + M.v('ℓ', '2') + ' = ' + fmt.fix(100 * dl2(p), 2) + ' cm') : ''});
      L.push({label: 'Durée de la dernière adhérence', value: c && c.ta !== null ? fmt.fix(c.ta < 5e-4 ? 0 : c.ta, 3) : '—', unit: c && c.ta !== null ? 's' : '', hint: p.durees ? th(M.v('τ', 'a') + ' = ' + fmt.fix(2 * (p.fs - p.fd) * poids(p) / (p.k * p.V / 100), 3) + ' s') : ''});
      const psi = Math.atan2(p.V / 100, w0(p) * (dl1(p) - dlP(p)));
      L.push({label: 'Durée du dernier glissement', value: c ? fmt.fix(c.tg, 3) : '—', unit: c ? 's' : '', hint: p.durees ? (p.lam === 0 ? th(M.v('τ', 'g') + ' = ' + fmt.fix((Math.PI + 2 * psi) / w0(p), 3) + ' s ; π/' + M.v('ω', '0') + ' = ' + fmt.fix(Math.PI / w0(p), 3) + ' s') : 'formule sans objet avec λ ≠ 0') : ''});
    } else {
      const ext = [{t: 0, y: res.P.y0}].concat(res.arrets).filter(q => q.t <= t + 1e-9).map(q => 100 * q.y);
      const der = ext.slice(-6), n0 = ext.length - der.length;
      L.push({label: 'Position ' + M.v('x'), value: fmt.fix(100 * e.y, 2), unit: 'cm'});
      L.push({label: 'Extremums ' + (n0 ? '(six derniers) ' : '') + M.v('x', 'n'), value: der.map(v => fmt.fix(v, 2)).join(' ; '), unit: 'cm'});
      const ec = der.slice(1).map((v, i) => Math.abs(der[i]) - Math.abs(v));
      L.push({label: 'Écarts |' + M.v('x', 'n') + '| − |' + M.v('x', 'n+1') + '|', value: ec.length ? ec.map(v => fmt.fix(v, 2)).join(' ; ') : '—', unit: ec.length ? 'cm' : '', hint: p.enveloppe && p.lam === 0 ? th('2 ' + M.v('x', 'd') + ' = ' + fmt.fix(200 * dlP(p), 2) + ' cm') : ''});
      L.push({label: 'Arrêt définitif', value: e.arrete ? fmt.fix(res.fin.t, 3) + ' s ; x = ' + fmt.fix(100 * res.fin.y, 2) + ' cm' : '—', unit: '', hint: p.zone ? M.v('x', 's') + ' = ' + fmt.fix(100 * dl1(p), 2) + ' cm' : ''});
    }
    a.metrics(p.mesures ? L : []);
  }

  function legende(a) {
    const {C, p} = a, cg = expDe(a) === 'cg', L = [];
    if (p.forces) L.push({label: 'force du ressort', c: C.F}, {label: M.vec(M.v('R', 'T')), c: C.E});
    L.push({label: 'vitesse du bloc', c: C.v});
    if (a.tab === 2) L.push({label: 'adhérence', c: cAdh(a)}, {label: 'glissement', c: cGl(a)});
    if (a.tab === 1 && p.compare) L.push({label: 'frottement fluide seul', c: C.E, dash: true});
    if (gardee[cg ? 'cg' : 'osc']) L.push({label: 'courbe gardée', c: C.ink2, dash: true});
    a.legend(L);
  }

  /* ---------- garder la courbe ---------- */
  function garder(a) {
    const cg = expDe(a) === 'cg', res = traj(a), t = Math.min(a.t, duree(a));
    if (t <= 0) { a.toast('Lancer la lecture avant de garder la courbe'); return; }
    const W = w0(a.p), V = a.p.V / 100, P0 = dlP(a.p);
    const ts = MF.instants(res, 0, t, 1200), et = ts.map(x => MF.etat(res, x));
    gardee[cg ? 'cg' : 'osc'] = {
      pts: ts.map((x, i) => [x, cg ? a.p.k * et[i].dl : 100 * et[i].y]),
      phase: et.map(q => cg ? [100 * (q.dl - P0), 100 * (V - q.v) / W] : [100 * q.y, 100 * q.v / W])
    };
    a.toast('Courbe gardée en pointillés');
  }

  /* ---------- situations ---------- */
  const CG = {m: .5, k: 50, fs: .5, fd: .4, V: 1, lam: 0, dureeCG: 12, fmin: 0, Fmax: 3};
  const OSC = {m: .5, k: 50, lam: 0, dureeOsc: 4, xmax: 20};
  const XD = .4 * .5 * MF.G / 50 * 100;                              // x_d (cm) pour f_d = 0.40
  const preset = (label, valeurs, titre) => ({label, valeurs, titre, lecture: true});

  /* ---------- application ---------- */
  AnimKit.app({
    code: 'MC2', partie: 'RougeGrenat', chapitre: 'MC2 Frottement solide',
    titre: 'Frottement solide et ressort',
    titreFenetre: 'Frottement solide et ressort · MC2 · MP',
    menuCommun: true, fichier: 'Frottement_Ressort',
    onglets: ['Collé-glissé', 'Oscillateur amorti', 'Portrait de phase'],
    panneaux: [
      {id: 'scene', titre: 'Bloc, ressort et table', poids: 1.05, onglets: [0, 1], ratioTel: .75},
      {id: 'force', titre: 'Force lue au dynamomètre', poids: 1.1, onglets: [0], ratioTel: .75},
      {id: 'pos', titre: 'Position du bloc', poids: 1.15, onglets: [1], ratioTel: .75},
      {id: 'sceneP', titre: 'Bloc, ressort et table', poids: .6, onglets: [2], ratioTel: .55},
      {id: 'phase', titre: 'Plan de phase (mêmes échelles sur les deux axes)', poids: 1.7, onglets: [2], ratioTel: 1}
    ],
    temps: true, pas: 1 / 50, vitesses: [.1, .25, .5, 1, 2, 4], vitesse: 1,
    curseur: {max: a => duree(a), get: a => a.t, set: (a, v) => { a.t = v; }},
    peutLire: a => { if (a.t >= duree(a) - 1e-9) a.t = 0; return true; },
    step(a, dt) { a.t = Math.min(duree(a), a.t + dt); if (a.t >= duree(a) - 1e-9) a.play(false); },
    reset(a) { a.t = 0; },
    onglet(a) { a.t = 0; },
    change(a, id) {
      if (id === 'fs' && a.p.fd > a.p.fs) a.set('fd', a.p.fs, {silent: true});
      if (id === 'fd' && a.p.fd > a.p.fs) a.set('fs', a.p.fd, {silent: true});
      if (id === 'exp') a.reset();
    },
    init(a) {
      let prise = 0;
      a.drag('scene', {
        hit: (x, y) => {
          const g = a.panels.scene._geo;
          return a.tab === 1 && !!g && x >= g.face - 12 && x <= g.face + g.bw + 12 && y >= g.y1 && y <= g.y2;
        },
        start: x => { a.play(false); a.t = 0; const g = a.panels.scene._geo; prise = x - (g.X0 + a.p.x0 / 100 * g.sc); },
        move: x => {
          const g = a.panels.scene._geo, v = clamp((x - prise - g.X0) / g.sc * 100, -Math.min(25, a.p.xmax), Math.min(25, a.p.xmax));
          a.t = 0; a.set('x0', Math.round(v * 10) / 10);
        }
      });
    },
    reglages: [
      {titre: 'Situations', onglets: [0, 2], si: a => expDe(a) === 'cg', presets: [
        preset('Exemple du cours', {...CG}),
        preset('Traction deux fois plus rapide', {...CG, V: 2}),
        preset('Traction rapide : 10 cm/s', {...CG, V: 10, dureeCG: 4}),
        preset('Coefficients égaux', {...CG, fs: .4, fd: .4}),
        preset('Avec frottement fluide, 15 cm/s', {...CG, V: 15, lam: .5, dureeCG: 6})
      ]},
      {titre: 'Situations', onglets: [1, 2], si: a => expDe(a) === 'osc', presets: [
        preset('Exemple du cours', {...OSC, fs: .4, fd: .4, x0: 4.5 * XD}),
        preset('Nombreuses oscillations', {...OSC, fs: .12, fd: .1, x0: 20}),
        preset('Dernier extremum du même côté', {...OSC, fs: .4, fd: .4, x0: 3.5 * XD}),
        preset('Lâché dans la zone d’arrêt', {...OSC, fs: .5, fd: .4, x0: 4})
      ]},
      {titre: 'Expérience', onglets: [2], items: [
        {id: 'exp', type: 'seg', options: [['cg', 'Collé-glissé'], ['osc', 'Oscillateur']], value: 'cg'}
      ]},
      {titre: 'Montage', items: [
        {id: 'm', type: 'range', label: 'Masse ' + M.v('m'), min: .1, max: 2, step: .05, dec: 2, value: .5, unit: 'kg', reinit: true},
        {id: 'k', type: 'range', label: 'Raideur ' + M.v('k'), min: 5, max: 200, step: 1, dec: 0, value: 50, unit: 'N/m', reinit: true},
        {id: 'V', type: 'range', label: 'Vitesse imposée ' + M.v('V'), min: .2, max: 20, step: .1, dec: 1, value: 1, unit: 'cm/s', reinit: true, si: a => expDe(a) === 'cg'},
        {id: 'x0', type: 'range', label: 'Allongement initial ' + M.v('x', '0') + ' (ou glisser le bloc)', min: -25, max: 25, step: .1, dec: 1, value: 17.7, unit: 'cm', reinit: true, si: a => expDe(a) === 'osc'}
      ]},
      {titre: 'Contact', items: [
        {id: 'fs', type: 'range', label: 'Coefficient statique ' + M.v('f', 's'), min: .05, max: 1, step: .01, dec: 2, value: .5, unit: '', reinit: true},
        {id: 'fd', type: 'range', label: 'Coefficient dynamique ' + M.v('f', 'd') + ' ≤ ' + M.v('f', 's'), min: .02, max: 1, step: .01, dec: 2, value: .4, unit: '', reinit: true},
        {id: 'lam', type: 'range', label: 'Frottement fluide ajouté ' + M.v('λ'), min: 0, max: 2, step: .05, dec: 2, value: 0, unit: 'kg/s', reinit: true}
      ]},
      {titre: 'À faire apparaître', items: [
        {id: 'niveaux', type: 'check', label: 'Niveaux Δℓ₁, Δℓ_P, Δℓ₂ (calcul)', value: false, si: a => a.tab === 0},
        {id: 'durees', type: 'check', label: 'Durées τ_a et τ_g', value: false, si: a => a.tab === 0},
        {id: 'zone', type: 'check', label: 'Zone d’arrêt |x| ≤ x_s', value: false, si: a => expDe(a) === 'osc'},
        {id: 'enveloppe', type: 'check', label: 'Enveloppes linéaires (λ = 0)', value: false, si: a => a.tab === 1},
        {id: 'compare', type: 'check', label: 'Comparer à un frottement fluide seul', value: false, si: a => a.tab === 1},
        {id: 'cercle', type: 'check', label: 'Construction : cercle ou centres ±x_d', value: false, si: a => a.tab === 2},
        {id: 'forces', type: 'check', label: 'Forces sur le bloc (horizontales)', value: true},
        {id: 'mesures', type: 'check', label: 'Mesures', value: true}
      ]},
      {titre: 'Comparer deux réglages', items: [
        {type: 'boutons', items: [
          {label: 'Garder la courbe', action: a => garder(a)},
          {label: 'Effacer', action: a => { gardee[expDe(a)] = null; }}
        ]}
      ]},
      {titre: 'Axes des graphes', items: [
        {id: 'dureeCG', type: 'range', label: 'Durée affichée', min: 2, max: 60, step: 1, dec: 0, value: 12, unit: 's', reinit: true, si: a => expDe(a) === 'cg'},
        {id: 'Fmax', type: 'range', label: 'Force maximale', min: .5, max: 25, step: .5, dec: 1, value: 3, unit: 'N', si: a => a.tab === 0},
        {id: 'fmin', type: 'range', label: 'Force minimale', min: -10, max: 0, step: .5, dec: 1, value: 0, unit: 'N', si: a => a.tab === 0},
        {id: 'dureeOsc', type: 'range', label: 'Durée affichée', min: 1, max: 30, step: .5, dec: 1, value: 4, unit: 's', reinit: true, si: a => expDe(a) === 'osc'},
        {id: 'xmax', type: 'range', label: 'Position maximale', min: 2, max: 25, step: 1, dec: 0, value: 20, unit: 'cm', si: a => a.tab === 1}
      ]}
    ],
    aide: {
      voit: '<ul><li><b>Collé-glissé.</b> Le bloc est tiré par un ressort dont l’extrémité avance à la vitesse constante <i>V</i>. La vue suit cette extrémité : la table graduée défile, et le bloc lui reste accroché tant qu’il adhère. La force lue au dynamomètre vaut <i>k</i>Δ<i>ℓ</i>.</li><li><b>Oscillateur amorti.</b> L’autre extrémité du ressort est fixe ; le bloc est lâché sans vitesse de <i>x</i><sub>0</sub>.</li><li><b>Portrait de phase.</b> En glissement et sans frottement fluide, le point représentatif décrit un arc de cercle.</li><li>La jauge montre la réaction tangentielle <i>R</i><sub>T</sub> entre −<i>f</i><sub>s</sub><i>mg</i> et +<i>f</i><sub>s</sub><i>mg</i> ; les traits pointillés repèrent ±<i>f</i><sub>d</sub><i>mg</i>. Le fond coloré des graphes marque les phases de glissement.</li></ul>',
      faire: '<ul><li>Lancer l’exemple du cours et regarder la jauge : en adhérence, <i>R</i><sub>T</sub> s’ajuste à la force du ressort ; au décrochage, elle saute à <i>f</i><sub>d</sub><i>mg</i>.</li><li>Garder la courbe, puis doubler <i>V</i> : prévoir ce que deviennent Δ<i>ℓ</i><sub>1</sub>, Δ<i>ℓ</i><sub>2</sub> et la durée d’adhérence avant de lancer.</li><li>Prendre <i>f</i><sub>d</sub> = <i>f</i><sub>s</sub> : la phase d’adhérence disparaît.</li><li>Dans l’onglet 2, prévoir l’écart entre deux extremums et l’endroit de l’arrêt, puis faire apparaître les enveloppes et la zone d’arrêt. Le bloc se déplace à la souris.</li><li>Dans le plan de phase, repérer le centre de chaque arc de cercle.</li></ul>',
      modele: '<p>Lois de Coulomb, <i>g</i> = 9.81 m·s⁻², table horizontale fixe, <i>R</i><sub>N</sub> = <i>mg</i>. Adhérence tant que la force du ressort vérifie |<i>F</i>| ≤ <i>f</i><sub>s</sub><i>mg</i> ; en glissement, <i>m</i><i>ẍ</i> = <i>F</i> − <i>f</i><sub>d</sub><i>mg</i> sgn(<i>ẋ</i>) − <i>λ</i><i>ẋ</i> jusqu’à l’annulation de la vitesse, puis nouveau test d’adhérence. Chaque phase est résolue par sa solution exacte (la simulation du cours, IV.3, emploie la méthode d’Euler avec les mêmes tests).</p><p><b>Limites.</b> Coefficients indépendants de la vitesse et de la durée du repos ; ressort idéal sans masse, qui travaille aussi en compression ; vitesse <i>V</i> rigoureusement constante ; pas de basculement. Sans frottement fluide, le collé-glissé persiste à toute vitesse <i>V</i>. Avec <i>f</i><sub>d</sub> = <i>f</i><sub>s</sub>, la force n’est pas rigoureusement constante : elle oscille de ± <i>kV</i>/<i>ω</i><sub>0</sub> autour de <i>f</i><sub>d</sub><i>mg</i> et le bloc s’arrête un instant à chaque période.</p><p>La courbe « frottement fluide seul » a la même raideur, la même masse et le même premier extremum, sans frottement solide.</p>',
      cours: 'MC2 MP : IV.1 (oscillateur amorti par frottement solide), IV.2 (collé-glissé), IV.3 (simulation d’un changement de mode de glissement), expérience « Collé-glissé ».'
    },
    draw(a) {
      const t = Math.min(a.t, duree(a));
      if (a.tab === 0) { scene(a, 'scene'); grapheForce(a); }
      else if (a.tab === 1) { scene(a, 'scene'); graphePos(a); }
      else { scene(a, 'sceneP'); portrait(a); }
      mesures(a); legende(a);
      a.clock('t = ' + a.fmt.fix(t, 2) + ' s');
    }
  });
})();

</script>
