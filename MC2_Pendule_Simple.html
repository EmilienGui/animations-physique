    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}
      return s;
    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){
      let d='',pen=false;
      for(const[x,y]of pts){if(!isFinite(y)||!isFinite(x)){pen=false;continue}
        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

<script>
'use strict';
window.PendulumModel=(()=>{
 const tau=2*Math.PI,rad=Math.PI/180;
 const sin=x=>Math.abs(Math.sin(x))<2e-15?0:Math.sin(x);
 function step(a,w,h,k){const f=x=>-k*sin(x),a1=w,w1=f(a),a2=w+h*w1/2,w2=f(a+h*a1/2),a3=w+h*w2/2,w3=f(a+h*a2/2),a4=w+h*w3,w4=f(a+h*a3);return [a+h*(a1+2*a2+2*a3+a4)/6,w+h*(w1+2*w2+2*w3+w4)/6];}
 function root(a,w,h,k,fn){let lo=0,hi=h,f0=fn(a,w);for(let n=0;n<44;n++){const mid=(lo+hi)/2,q=step(a,w,mid,k);if(fn(...q)*f0>0)lo=mid;else hi=mid;}return (lo+hi)/2;}
 function period(p){const h=p.w*p.w*p.l/(2*p.g)+1-Math.cos(p.theta*rad),T0=tau*Math.sqrt(p.l/p.g);if(h>=2-1e-12)return {h,T0,T:null,amplitude:h<2?Math.acos(1-h):null,regime:Math.abs(h-2)<1e-12?'separatrix':'rotation'};let a=1,b=Math.sqrt(1-h/2);for(let i=0;i<30&&Math.abs(a-b)>1e-15;i++){const old=a;a=(a+b)/2;b=Math.sqrt(old*b);}return {h,T0,T:T0/a,amplitude:Math.acos(Math.max(-1,1-h)),regime:h<1e-14?'equilibrium':'oscillation'};}
 function build(p){if(![p.l,p.m,p.g,p.theta,p.w].every(Number.isFinite)||p.l<=0||p.m<=0||p.g<=0||!['string','rod'].includes(p.support)||(p.tmax!==undefined&&(!Number.isFinite(p.tmax)||p.tmax<=0)))throw new RangeError('Paramètres hors domaine');p={...p};const k=p.g/p.l,pr=period(p),hmax=Math.min(.002,.012/Math.sqrt(k)),horizon=p.tmax===undefined?Math.min(40,Math.max(12,6*pr.T0)):p.tmax,a0=p.theta*rad,force=(a,w)=>p.l*w*w+p.g*Math.cos(a);let a=a0,w=p.w,t=0,slack=null,bottom=null,turn=null;const data=[{t,a,w}];
 if(p.support==='string'&&force(a,w)<-1e-11*p.g)slack=0;
 while(t<horizon-1e-10&&slack===null){const h=Math.min(hmax,horizon-t),[an,wn]=step(a,w,h,k);if(bottom===null&&Math.abs(sin(a))>1e-12&&sin(a)*sin(an)<=0&&Math.cos(an)>0)bottom=t+root(a,w,h,k,(aa)=>sin(aa));if(turn===null&&Math.abs(w)>1e-12&&w*wn<=0)turn=t+root(a,w,h,k,(aa,ww)=>ww);
 if(p.support==='string'&&force(an,wn)<-1e-11*p.g){const dt=root(a,w,h,k,force),q=step(a,w,dt,k);t+=dt;[a,w]=q;slack=t;data.push({t,a,w});break;}
 t+=h;a=an;w=wn;data.push({t,a,w});}
 const duration=slack===null?horizon:slack;if(bottom!==null&&bottom>duration)bottom=null;if(turn!==null&&turn>duration)turn=null;return {p,data,duration,horizon,slack,bottom,turn,...pr,comparable:slack===null&&pr.h<2-1e-12};}
 function sample(b,t){t=Math.max(0,Math.min(b.duration,t));let lo=0,hi=b.data.length-1;while(lo<hi){const mid=Math.ceil((lo+hi)/2);if(b.data[mid].t<=t)lo=mid;else hi=mid-1;}const s=b.data[lo],[a,w]=step(s.a,s.w,t-s.t,b.p.g/b.p.l),p=b.p,er=[sin(a),Math.cos(a)],et=[Math.cos(a),-sin(a)],released=b.slack!==null&&t>=b.slack-1e-8;let C=p.m*(p.g*Math.cos(a)+p.l*w*w);if(p.support==='string')C=released?0:Math.max(0,C);const ar=released&&b.slack===0?p.g*Math.cos(a):-p.l*w*w,at=-p.g*sin(a),ax=ar*er[0]+at*et[0],ay=ar*er[1]+at*et[1],v=p.l*Math.abs(w),E=p.m*(.5*p.l*p.l*w*w+p.g*p.l*(1-Math.cos(a))),omega0=Math.sqrt(p.g/p.l),ah=p.theta*rad*Math.cos(omega0*t)+p.w/omega0*Math.sin(omega0*t);return {t,a,w,er,et,C,ar,at,ax,ay,v,E,ah,released,x:p.l*er[0],y:p.l*er[1],vx:p.l*w*et[0],vy:p.l*w*et[1],P:p.m*p.g};}
 return {rad,tau,step,period,build,sample};
})();

// @titre Pendule simple · MC2 · MPSI

'use strict';
/* =====================================================================
   MC2 · Pendule simple
   Modèle : PendulumModel (durée paramétrable) ; RK4, période exacte par
   moyenne arithmético-géométrique, arrêt au relâchement du fil.
   Conventions du cours (MC2_Cours.tex) : θ depuis la verticale descendante,
   e_r de O vers M, e_θ dans le sens des θ croissants ;
   P = mg(cos θ e_r − sin θ e_θ), T = −T e_r ; θ̈ + (g/l) sin θ = 0.

const PM=window.PendulumModel, DEG=Math.PI/180, Mh=AnimKit.M;
let B=null, cap=false;
const mv=s=>Mh.v(s), ev=s=>`${Mh.vec('e')}<sub>${s}</sub>`;
/** θ̇ et θ̈ : HTML (points en CSS) et SVG (points placés au-dessus de la lettre) */

function build(a){B=PM.build({l:a.p.l,m:a.p.m,g:a.p.g,theta:a.p.theta,w:a.p.w,support:a.p.support,tmax:a.p.tmax})}

].map(ps=>({label:ps.label,valeurs:{support:'string',l:1,m:1,g:9.81,theta:30,w:0,vecs:'forces',...ps.valeurs},action:a=>{a.setTab(ps.tab);a.panels.scene.zoom=1}}));

    {titre:'Le pendule',items:[

      {id:'l',label:`Longueur ${mv('l')}`,min:.3,max:3,step:.01,unit:'m',value:1,reinit:true},
      {id:'m',label:`Masse ${mv('m')}`,min:.1,max:3,step:.1,unit:'kg',value:1,reinit:true},

    {titre:'Conditions initiales',items:[

      {id:'w',label:`Vitesse angulaire ${pt(1)}(0)`,min:-10,max:10,step:.1,unit:'rad·s<sup>−1</sup>',value:0,reinit:true},
      {type:'note',html:'θ part de la verticale descendante. Glisser M règle aussi θ(0).'},
      {type:'boutons',items:[{id:'bas',label:'Passage en bas',titre:'Place l\'instant au premier passage par θ = 0',action:a=>{if(B.bottom!==null){a.play(false);a.t=B.bottom}}},
        {id:'ext',label:'À l\'extrémité',titre:'Place l\'instant au premier arrêt (vitesse nulle)',action:a=>{if(B.turn!==null){a.play(false);a.t=B.turn}}}]}]},
    {titre:'Vecteurs sur M',onglets:[0],items:[

      {id:'comp',type:'check',label:'Projections du poids',value:false,si:a=>a.p.vecs==='forces'},

/* ---------- valeurs, message ---------- */
function analyse(a){
  if(!B)return'';const f=a.fmt,q=Q(a),p=a.p,E0=p.m*p.g*p.l*B.h,err=(q.E-E0)/(p.m*p.g*p.l);
  return `${mv('E')} = ½${mv('m')}${mv('l')}<sup>2</sup>${pt(1)}<sup>2</sup> + ${mv('m')}${mv('g')}${mv('l')}(1 − cos θ) = ${f.sig(q.E,3)} J (origine au point le plus bas). Dérive numérique Δ${mv('E')}/(${mv('m')}${mv('g')}${mv('l')}) = ${f.sci(err,1)}.`+(B.slack!==null?` Relâchement du fil à ${mv('t')} = ${f.fix(B.slack,3)} s.`:'');
}
function status(a,q){const p=a.p;return q.released?'Fil relâché':p.support==='rod'?(Math.abs(q.C)<1e-8?'Tige : force nulle':q.C<0?'Tige en compression':'Tige en traction'):'Fil tendu'}
function infos(a,q){
  const f=a.fmt,p=a.p,Cn=p.support==='string'?'T':'R',harm=a.p.harm&&B.comparable;
  a.enable('bas',B.bottom!==null);a.enable('ext',B.turn!==null);
  if(a.tab===0){
    a.metrics([{label:`Angle ${mv('θ')}`,value:f.fix(q.a/DEG,1),unit:'°',hint:`${pt(1)} = ${f.sig(q.w,3)} rad·s<sup>−1</sup>`},
      {label:`Vitesse ${mv('v')}`,value:f.sig(q.v,3),unit:'m·s<sup>−1</sup>',hint:`accélération ${f.sig(Math.hypot(q.ax,q.ay),3)} m·s<sup>−2</sup>`},
      {label:p.support==='string'?`Tension ${mv('T')}`:`Force de la tige ${mv('R')} (signée)`,value:f.sig(q.C,3),unit:'N',hint:status(a,q),warn:q.released||(p.support==='rod'&&q.C<-1e-5)}]);
  }else{
    a.metrics([{label:`Angle ${mv('θ')} exact`,value:f.fix(q.a/DEG,1),unit:'°',hint:harm?`harmonique : ${f.fix(q.ah/DEG,1)}°`:''},
      {label:`Petits angles ${mv('T')}<sub>0</sub>`,value:f.sig(B.T0,3),unit:'s'},
      {label:`Période exacte ${mv('T')}`,value:B.comparable&&B.T!==null?f.sig(B.T,4):'—',unit:B.comparable&&B.T!==null?'s':'',hint:B.comparable?`${mv('T')}/${mv('T')}<sub>0</sub> = ${f.fix(B.T/B.T0,4)}`:'pas d\'oscillation périodique'}]);
  }
  let msg;
  if(q.released)msg=B.slack===0?'Fil détendu dès <i class="m">t</i> = 0 : la liaison circulaire est impossible avec ces conditions initiales.':`Arrêt au relâchement du fil : ${mv('T')} = 0. La suite est une chute libre, non animée.`;
  else if(a.tab===1)msg=`${pt(2)} + ${Mh.frac(mv('g'),mv('l'))} sin ${mv('θ')} = 0`+(harm?` et ${pt(2)}<sub>h</sub> + ${Mh.frac(mv('g'),mv('l'))} ${mv('θ')}<sub>h</sub> = 0 : `+(B.amplitude>.35?'à grande amplitude, la solution harmonique se décale.':'même départ, courbes presque confondues.'):a.p.harm?' : pas de comparaison pour une rotation ou un fil détendu.':'. Prévoir l\'allure de la solution des petits angles, puis l\'afficher.')+' Les périodes ne dépendent pas de la masse.';
  else if(Math.abs(q.w)<1e-5&&Math.abs(Math.sin(q.a))>.001)msg=`À une extrémité : ${mv('v')} = 0, mais ${mv('a')}<sub>θ</sub> ≠ 0 : le mouvement repart.`;
  else if(Math.abs(Math.sin(q.a))<1e-4&&Math.cos(q.a)>0&&Math.abs(q.w)>1e-3)msg=`En bas : ${mv('a')}<sub>θ</sub> = 0, mais ${mv('a')}<sub>r</sub> = −${Mh.frac(`${mv('v')}<sup>2</sup>`,mv('l'))} ≠ 0 : la liaison tire plus que ${mv('m')}${mv('g')}.`;
  else if(Math.abs(Math.cos(q.a)+1)<1e-7&&Math.abs(q.w)<1e-7)msg='Équilibre supérieur instable : la tige pousse et compense le poids.';
  else msg=p.support==='rod'?`Tige sans masse : ${mv('R')} est signé ; ${mv('R')} &lt; 0 quand la tige pousse. ${pt(2)} + ${Mh.frac(mv('g'),mv('l'))} sin ${mv('θ')} = 0.`:`Fil souple : ${mv('T')} = ${mv('m')}(${mv('g')} cos ${mv('θ')} + ${mv('l')}${pt(1)}<sup>2</sup>) ≥ 0. ${pt(2)} + ${Mh.frac(mv('g'),mv('l'))} sin ${mv('θ')} = 0.`;
  a.insight(msg);
  const L=a.tab===0?(a.p.vecs==='forces'?[{c:a.C.F,label:`forces : 1 N ↔ ${f.sig(sc.F,2)} px`},a.p.comp?{c:a.C.F,label:'projections du poids',dash:true}:null]:a.p.vecs==='accel'?[{c:a.C.cInk,label:`accélération : 1 m·s<sup>−2</sup> ↔ ${f.sig(sc.a,2)} px`},{c:a.C.cInk,label:`composantes ${mv('a')}<sub>r</sub>, ${mv('a')}<sub>θ</sub>`,dash:true}]:[{c:a.C.v,label:`vitesse : 1 m·s<sup>−1</sup> ↔ ${f.sig(sc.v,2)} px`}])
    :[{c:a.C.cInk,label:'mouvement exact'},harm?{c:a.C.pred,label:'solution harmonique',dash:true}:null];
  if(cap)L.push({c:a.C.ink2,label:'flèche plafonnée au bord'});
  if(q.released)L.push({c:a.C.cInk,label:'début de la chute libre',dash:true});
  a.legend(L);
  a.clock(`${mv('t')} = ${f.fix(a.t,2)} s`);
}

/* ---------- scène ---------- */
let geo={cx:0,cy:0,s:1,bob:[0,0]}, sc={F:1,a:1,v:1};
function drawScene(a,q){
  const P=a.panels.scene,S=a.S,C=a.C,k=a.k,w=P.w,h=P.h,p=a.p;cap=false;
  // Garder de la place autour de toute la trajectoire, y compris sous M pour le poids.
  const top=40*k,bottom=24*k;
  const R=Math.max(1,Math.min(w/2-44*k,Math.max((h-top-bottom)/2.4,(h-top-bottom-65*k)/2)));
  const cx=w/2,cy=(h+top-bottom-Math.min(65*k,.4*R))/2,s=R/p.l*P.zoom,rad=p.l*s,pt=[cx+q.x*s,cy+q.y*s];
  geo={cx,cy,s,bob:pt};
  let o=`<defs><clipPath id="pclip"><rect x="2" y="2" width="${w-4}" height="${h-4}"/></clipPath></defs><g clip-path="url(#pclip)">`;
  o+=S.circle(cx,cy,rad,{c:C.rule,w:1});
  o+=S.line(cx,cy,cx,cy+rad+18*k,{c:C.ink2,w:1,dash:`${4*k} ${5*k}`});
  o+=S.text(cx+6*k,Math.min(h-12*k,cy+rad+18*k),S.v('z')+' ↓',{size:13,base:'bottom'});
  // solution harmonique (onglet 2)
  if(a.tab===1&&p.harm&&B.comparable){const hx=cx+p.l*Math.sin(q.ah)*s,hy=cy+p.l*Math.cos(q.ah)*s;o+=S.line(cx,cy,hx,hy,{c:C.pred,w:2,dash:`${7*k} ${5*k}`})+S.circle(hx,hy,(9+5*Math.cbrt(p.m))*k,{c:C.pred,w:2,dash:`${4*k} ${3*k}`})}
  // support, liaison, masse
  o+=S.line(cx-22*k,cy-3*k,cx+22*k,cy-3*k,{c:C.ink,w:3});
  for(let i=-2;i<=2;i++)o+=S.line(cx+i*9*k,cy-3*k,cx+i*9*k-6*k,cy-10*k,{c:C.ink2,w:1.2});
  o+=S.line(cx,cy,pt[0],pt[1],{c:q.released?C.ink2:C.ink,w:p.support==='rod'?5:1.8,dash:q.released?`${5*k} ${7*k}`:undefined});
  o+=S.circle(cx,cy,4*k,{fill:C.card,c:C.ink,w:1.5});
  o+=S.text(cx-12*k,cy-14*k,'O',{anchor:'end',size:16,c:C.ink});
  // angle θ
  const wr=Math.atan2(Math.sin(q.a),Math.cos(q.a)),ra=Math.min(36*k,rad*.3),angleGap=Math.min(15*k,rad*.15),arc=[];for(let i=0;i<=35;i++){const b=wr*i/35;arc.push([cx+ra*Math.sin(b),cy+ra*Math.cos(b)])}
  o+=S.poly(arc,{c:C.cInk,w:1.6});if(Math.abs(wr)>.08)o+=S.text(cx+(ra+angleGap)*Math.sin(wr/2),cy+(ra+angleGap)*Math.cos(wr/2),S.v('θ'),{anchor:'middle',size:17,c:C.cInk});
  // échelle
  o+=S.text(10*k,10*k,`${S.v('l')} = ${a.fmt.fix(p.l,2)} m`,{base:'top',size:14,c:C.ink});
  const bar=p.l>=1?1:.5,bp=bar*s;if(bp<w-30*k){o+=S.line(10*k,h-12*k,10*k+bp,h-12*k,{c:C.ink2,w:1.6})+S.line(10*k,h-17*k,10*k,h-7*k,{c:C.ink2,w:1.2})+S.line(10*k+bp,h-17*k,10*k+bp,h-7*k,{c:C.ink2,w:1.2})+S.text(10*k,h-20*k,`${a.fmt.fix(bar,1)} m`,{base:'bottom',size:13})}
  // chute libre amorcée après relâchement
  if(q.released){const pts=[];for(let i=0;i<=16;i++){const dt=i*.012;pts.push([cx+(q.x+q.vx*dt)*s,cy+(q.y+q.vy*dt+.5*p.g*dt*dt)*s])}o+=S.poly(pts,{c:C.cInk,w:2.2,dash:`${3*k} ${6*k}`})}
  o+='</g>';
  // vecteurs (onglet 1)
  if(a.tab===0){
    const gain=p.gain;sc.F=Math.min(65*k,R*.4)/9.81*gain;sc.a=Math.min(75*k,R*.58)/9.81*gain;sc.v=Math.min(80*k,R*.7)/3*gain;
    const V=(vx,vy,col,lab,sub,o2={})=>vecteur(a,pt,[vx,vy],col,lab,sub,o2);
    if(p.vecs==='forces'){
      if(p.comp){const Pr=q.P*Math.cos(q.a),Pt=-q.P*Math.sin(q.a);o+=V(q.er[0]*Pr*sc.F,q.er[1]*Pr*sc.F,C.F,'P','r',{dash:true,w:1.6});o+=V(q.et[0]*Pt*sc.F,q.et[1]*Pt*sc.F,C.F,'P','θ',{dash:true,w:1.6})}
      o+=V(0,q.P*sc.F,C.F,'P','',{w:3.2});
      o+=V(-q.er[0]*q.C*sc.F,-q.er[1]*q.C*sc.F,C.F,p.support==='string'?'T':'R','',{w:3.2});
      if(p.res)o+=V(p.m*q.ax*sc.F,p.m*q.ay*sc.F,C.ink2,'ΣF','',{dash:true,w:2});
    }else if(p.vecs==='accel'){
      o+=V(q.er[0]*q.ar*sc.a,q.er[1]*q.ar*sc.a,C.cInk,'a','r',{dash:true,w:1.8});o+=V(q.et[0]*q.at*sc.a,q.et[1]*q.at*sc.a,C.cInk,'a','θ',{dash:true,w:1.8});
      o+=V(q.ax*sc.a,q.ay*sc.a,C.cInk,'a','',{w:3});
    }else o+=V(q.vx*sc.v,q.vy*sc.v,C.v,'v','',{w:3});
    if(p.basis)o+=baseM(a,q);
  }
  const rb=(9+5*Math.cbrt(p.m))*k;
  o+=S.circle(pt[0],pt[1],rb,{fill:C.cSoft,c:C.cInk,w:2.2})+S.circle(pt[0],pt[1],2*k,{fill:C.cInk});
  o+=S.text(pt[0]+rb+4*k,pt[1]-rb-2*k,'M',{size:16,c:C.ink,weight:600});
  o+=`<circle cx="${pt[0].toFixed(1)}" cy="${pt[1].toFixed(1)}" r="${(rb+14*k).toFixed(1)}" fill="transparent" data-bob="1" style="cursor:grab"/>`;
  a.svg('scene',o);
}
/** flèche issue de M, proportionnelle, plafonnée au bord de la scène si nécessaire */
function vecteur(a,o0,d,col,lab,sub,o2){
  const P=a.panels.scene,S=a.S,k=a.k,[x,y]=o0,mg=8*k,L=Math.hypot(d[0],d[1]);if(L<.5)return'';
  let f=1;if(d[0]>0)f=Math.min(f,(P.w-mg-x)/d[0]);if(d[0]<0)f=Math.min(f,(mg-x)/d[0]);if(d[1]>0)f=Math.min(f,(P.h-mg-y)/d[1]);if(d[1]<0)f=Math.min(f,(mg-y)/d[1]);f=Math.max(0,f);if(f<.999)cap=true;
  const e=[x+d[0]*f,y+d[1]*f],u=[d[0]/L,d[1]/L];
  let s=S.arrow(x,y,e[0],e[1],{c:col,w:o2.w||2.5,dash:o2.dash?`${5*k} ${4*k}`:undefined});
  if(L*f>14*k){const nx=-u[1],ny=u[0],off=o2.dash?16:12,lx=e[0]+u[0]*10*k+nx*off*k,ly=e[1]+u[1]*10*k+ny*off*k;s+=vlab(a,lx,ly,lab,sub,col)}
  return s;
}
/** symbole vectoriel : lettre italique, indice, flèche au-dessus */
function vlab(a,x,y,lab,sub,col,size=17){
  const S=a.S,k=a.k,fs=size*k,w=(lab==='ΣF'?1.3:.62)*fs;x=Math.max(6*k,Math.min(a.panels.scene.w-w-14*k,x));y=Math.max(fs,Math.min(a.panels.scene.h-.65*fs-4*k,y));
  const html=lab==='ΣF'?'Σ'+S.v('F'):S.v(lab,sub||undefined);
  return S.text(x,y,html,{size,c:col,anchor:'start'})+S.arrow(x+(lab==='ΣF'?.6*fs:.05*fs),y-.55*fs,x+w,y-.55*fs,{c:col,w:.9,head:4.5*k});
}
function baseM(a,q){
  const S=a.S,C=a.C,k=a.k,P=a.panels.scene,x=P.w-58*k,y=P.h-52*k,len=32*k;
  let s=S.text(P.w-8*k,y-len-26*k,'Base en M',{size:13,base:'top',anchor:'end'});
  s+=S.circle(x,y,2*k,{fill:C.ink2});
  const ea=[x+q.er[0]*len,y+q.er[1]*len],eb=[x+q.et[0]*len,y+q.et[1]*len];
  s+=S.arrow(x,y,ea[0],ea[1],{c:C.ink2,w:1.6})+S.arrow(x,y,eb[0],eb[1],{c:C.ink2,w:1.6});
  s+=vlab(a,ea[0]+(q.er[0]<0?-22*k:5*k),ea[1]+(q.er[1]<0?-4*k:16*k),'e','r',C.ink2,15);
  s+=vlab(a,eb[0]+(q.et[0]<0?-22*k:5*k),eb[1]+(q.et[1]<0?-4*k:16*k),'e','θ',C.ink2,15);
  return s;
}

/* ---------- projections (onglet 1) ---------- */
function drawProj(a,q){
  const P=a.panels.proj,S=a.S,C=a.C,k=a.k,f={sig:(x,n)=>a.fmt.sig(x,n).replace(/<sup>(.*?)<\/sup>/,(m,e)=>S.sup(e))},p=a.p,Cn=p.support==='string'?'T':'R',x=14*k;
  const lines=[];const L=(txt,o={})=>lines.push([txt,o]);
  L(status(a,q),{c:q.released?C.F:C.cInk,size:17,weight:600});
  L(`${S.v('P')} = ${S.v('m')}${S.v('g')} = ${f.sig(q.P,3)} N`,{c:C.ink,size:15});
  L(`${S.v(Cn)} = ${f.sig(q.C,3)} N`,{c:C.ink,size:15});
  L('',{gap:.4});
  L('Projection radiale',{c:C.ink2,size:14});
  L(q.released?`${S.v('a','r')} = ${S.v('g')} cos ${S.v('θ')}`:`${S.v('m')}${S.v('g')} cos ${S.v('θ')} − ${S.v(Cn)} = −${S.v('m')}${S.v('l')} ${Spt(1)}${S.sup('2')}`,{c:C.ink,size:19,math:true});
  L(`${S.v('a','r')} = ${f.sig(q.ar,3)} m·s${S.sup('−2')}`,{c:C.ink2,size:15});
  L('',{gap:.4});
  L('Projection orthoradiale',{c:C.ink2,size:14});
  L(q.released?`${S.v('a','θ')} = −${S.v('g')} sin ${S.v('θ')}`:`−${S.v('m')}${S.v('g')} sin ${S.v('θ')} = ${S.v('m')}${S.v('l')} ${Spt(2)}`,{c:C.ink,size:19,math:true});
  L(`${S.v('a','θ')} = ${f.sig(q.at,3)} m·s${S.sup('−2')}`,{c:C.ink2,size:15});
  const sizes=lines.reduce((t,[,o])=>t+(o.gap?0:o.size||15),0),gaps=lines.reduce((t,[,o])=>t+(o.gap?o.gap*30:0),0);
  const leading=Math.max(1.35,Math.min(1.75,(P.h/k-20-gaps)/sizes)),tot=(sizes*leading+gaps)*k,fit=Math.min(1,Math.max(.1,(P.h-20*k)/tot)),step=k*fit;
  let y=Math.max(10*k,(P.h-tot*fit)/2),s='';
  for(const[t,o]of lines){if(o.gap){y+=o.gap*30*step;continue}const sz=o.size||15;s+=S.text(x,y,t,{size:sz*fit,c:o.c,weight:o.weight,base:'top',halo:false});y+=sz*leading*step}
  a.svg('proj',s);
}

/* ---------- graphe θ(t) (onglet 2) ---------- */
let G=null;
function drawGraph(a,q){
  const P=a.panels.graph,S=a.S,C=a.C,k=a.k,harm=a.p.harm&&B.comparable,dur=B.duration||B.horizon;
  let lo=0,hi=0;for(const d of B.data){const angle=d.a/DEG;lo=Math.min(lo,angle);hi=Math.max(hi,angle)}
  if(harm){const am=Math.hypot(a.p.theta,a.p.w/Math.sqrt(a.p.g/a.p.l)/DEG);lo=Math.min(lo,-am);hi=Math.max(hi,am)}
  if(hi-lo<10){lo-=5;hi+=5}const pad=(hi-lo)*.08;
  G=S.graph({x:4*k,y:4*k,w:P.w-8*k,h:P.h-8*k,xmin:0,xmax:dur,ymin:lo-pad,ymax:hi+pad,xlab:`${S.v('t')} (s)`,ylab:`${S.v('θ')} (°)`});
  let s=G.svg+S.clip('gclip',G);
  const N=Math.max(500,Math.ceil(40*dur/B.T0)),ex=[],hm=[];for(let i=0;i<=N;i++){const t=dur*i/N,qq=PM.sample(B,t);ex.push([t,qq.a/DEG]);if(harm)hm.push([t,qq.ah/DEG])}
  if(harm)s+=S.curve(hm,G,{c:C.pred,w:2,dash:`${7*k} ${5*k}`});
  s+=S.curve(ex,G,{c:C.cInk,w:2.6});
  const X=G.X(a.t);s+=S.line(X,G.y0,X,G.y0+G.h,{c:C.ink2,w:1,dash:`${3*k} ${4*k}`});
  s+=S.circle(X,G.Y(q.a/DEG),4*k,{fill:C.cInk});if(harm)s+=S.circle(X,G.Y(q.ah/DEG),4*k,{fill:C.pred});
  a.svg('graph',s);
}

/* ---------- interactions ---------- */
A.drag('scene',{
  hit:(x,y,e)=>!!(e.target.closest&&e.target.closest('[data-bob]')),
  start(x,y){A.play(false)},
  move(x,y){const v=Math.max(-180,Math.min(180,Math.round(Math.atan2(x-geo.cx,y-geo.cy)/DEG)));if(v!==A.p.theta)A.set('theta',v);A.reset()}
});
A.drag('graph',{
  hit:(x,y)=>G&&x>=G.x0-4&&x<=G.x0+G.w+4,
  start(x){A.play(false);A.t=Math.max(0,Math.min(B.duration,G.xv(x)))},
  move(x){A.t=Math.max(0,Math.min(B.duration,G.xv(x)))}
});

</script>
