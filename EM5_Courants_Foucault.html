const MINUS='−';

/* ---------------- nombres : point décimal, vrai signe moins ---------------- */

  /** n chiffres significatifs, sans notation exponentielle */
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));

  /** d décimales fixes */

function niceStep(range,n){

/* ---------------- mathématiques en HTML ---------------- */
const M={
  v:(s,sub,sup)=>`<span class="m">${s}</span>${sub!==undefined?`<sub>${sub}</sub>`:''}${sup!==undefined?`<sup>${sup}</sup>`:''}`,
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt"><span class="sym">√</span><span class="rad">${x}</span></span>`,
  vec:s=>`<span class="vec">${s}</span>`
};

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}
      return s;
    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const X=v=>x0+(v-o.xmin)/(o.xmax-o.xmin)*w, Y=v=>y0+h-(v-o.ymin)/(o.ymax-o.ymin)*h;
      let s='';
      const xt=o.xticks||ticks(o.xmin,o.xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5)))), yt=o.yticks||ticks(o.ymin,o.ymax,o.ny??Math.max(1,Math.round(h/(fs*3))));
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      const yAx=o.ymin<=0&&o.ymax>=0&&o.zeroAxis!==false?Y(0):y0+h, xAx=x0;
      s+=`<line x1="${n(x0)}" y1="${n(yAx)}" x2="${n(x0+w)}" y2="${n(yAx)}" stroke="${C0.ink2}" stroke-width="1.2"/><line x1="${n(xAx)}" y1="${n(y0)}" x2="${n(xAx)}" y2="${n(y0+h)}" stroke="${C0.ink2}" stroke-width="1.2"/>`;
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>o.xmin+(px-x0)/w*(o.xmax-o.xmin),yv:py=>o.ymin+(y0+h-py)/h*(o.ymax-o.ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){
      let d='',pen=false;
      for(const[x,y]of pts){if(!isFinite(y)||!isFinite(x)){pen=false;continue}
        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}
      return`<g clip-path="url(#${G.clip||''})">`+S.path(d,o)+'</g>';
    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}
  };
  return S;
}

/* ===================================================================== */
function app(cfg){
  const A={cfg,p:{},tab:0,t:0,running:false,speed:1,k:1,narrow:false,C:{},fmt,M,panels:{},_dirty:false};
  A.S=makeS(A);
  const root=document.documentElement;
  root.dataset.theme='dark';
  if(cfg.partie)root.style.setProperty('--chap',`var(--${cfg.partie})`);
  document.title=cfg.titreFenetre||`${cfg.titre} · ${cfg.code} · MPSI`;

  /* ---------- structure ---------- */
  const ak=el('div',{class:'ak',id:'ak'});
  const top=el('header',{class:'ak-top'});
  top.innerHTML=`<span class="ak-badge">${cfg.code}</span><div class="ak-titles"><h1 class="ak-title">${cfg.titre}</h1></div>
  <nav class="ak-tools" aria-label="Outils">
   <button class="ib ak-btn-settings" data-act="settings" title="Réglages">${IC.settings}<span class="ak-lbl">Réglages</span></button>
   <button class="ib" data-act="help" title="Aide (H)">${IC.help}<span class="ak-lbl">Aide</span></button>
   <button class="ib" data-act="theme" title="Thème clair / sombre (T)">${IC.theme}<span class="ak-lbl">Thème</span></button>
   <button class="ib" data-act="image" title="Enregistrer l'image (I)">${IC.image}<span class="ak-lbl">Image</span></button>
   <button class="ib" data-act="proj" title="Mode projection (P)">${IC.proj}<span class="ak-lbl">Projection</span></button>
   <button class="ib" data-act="fs" title="Plein écran (F)">${IC.fs}</button>
  </nav>`;
  ak.append(top);
  const tabs=cfg.onglets&&cfg.onglets.length>1?el('div',{class:'ak-tabs',role:'tablist'}):null;
  if(tabs){cfg.onglets.forEach((t,i)=>{const b=el('button',{class:'ak-tab',role:'tab','aria-selected':String(i===0),'data-tab':i},`<b>${i+1}</b>${t}`);b.onclick=()=>A.setTab(i);tabs.append(b)});ak.append(tabs)}
  const body=el('div',{class:'ak-body'}); ak.append(body);
  const main=el('main',{class:'ak-main'}); body.append(main);
  const scene=el('section',{class:'ak-card ak-scene'}); main.append(scene);
  /* disposition « atelier » (7 novembre 2026, facultative : cfg.atelier) :
     saisie à gauche ; résultat, graphique et détail du calcul à droite ; pas de colonne de réglages */
  A.zones={};
  if(cfg.atelier){
    const at=typeof cfg.atelier==='object'?cfg.atelier:{};
    ak.classList.add('ak-atelier');
    const left=el('section',{class:'ak-card ak-saisie'},`<div class="ak-zone-h">${at.saisie||'Mes mesures'}</div>`);
    A.zones.saisie=el('div',{class:'ak-saisie-body'}); left.append(A.zones.saisie);
    A.zones.resultat=el('section',{class:'ak-card ak-res','aria-live':'polite'});
    const det=el('details',{class:'ak-card ak-detail'},`<summary>${at.detail||'Voir le calcul'}</summary>`);
    A.zones.detail=el('div',{class:'ak-detail-body'}); det.append(A.zones.detail);
    body.insertBefore(left,main); main.insertBefore(A.zones.resultat,scene); main.append(det);
  }
  const pwrap=el('div',{class:'ak-panels'}); scene.append(pwrap);
  for(const pc of (cfg.panneaux||[{id:'scene'}])){
    const pe=el('div',{class:'ak-panel','data-id':pc.id}); pe.style.flex=`${pc.poids||1} 1 0`;
    if(pc.titre)pe.append(el('div',{class:'ak-phead'},pc.titre));
    const type=pc.type||'svg';
    const node=type==='canvas'?el('canvas'):document.createElementNS('http://www.w3.org/2000/svg','svg');
    if(type!=='canvas'){node.setAttribute('xmlns','http://www.w3.org/2000/svg');node.setAttribute('role','img');node.setAttribute('aria-label',pc.titre||cfg.titre)}
    pe.append(node);
    const P={id:pc.id,cfg:pc,el:pe,node,type,w:300,h:200,zoom:1,panX:0,panY:0,vz:1,vx:0,vy:0,_drags:[],head:pe.querySelector('.ak-phead')};
    /* Vue (7 novembre 2026) : tout panneau SVG se zoome, se cadre et se déplace (viewBox) ;
       un canvas déclaré zoom:true garde son zoom interne P.zoom, lu par l'animation. */
    P.vue=type!=='canvas'?(pc.zoom===false?null:'svg'):(pc.zoom?'interne':null);
    if(P.vue){const tl=el('div',{class:'ak-ptools'});tl.innerHTML='<button class="mini" data-z="-" title="Dézoomer (−)">−</button><button class="mini" data-z="0" title="Cadrer : vue initiale (0)">Cadrer</button><button class="mini" data-z="+" title="Zoomer (+)">+</button>';
      tl.onclick=e=>{const z=e.target.closest('[data-z]');if(!z)return;const v=z.dataset.z;if(v==='0')A.cadrer(P);else A.zoomer(P,v==='+'?1.25:.8)};P.tools=tl;pe.append(tl)}
    A.panels[pc.id]=P; pwrap.append(pe);
  }
  /* légende : bande fine entre la scène et la barre de lecture (6 novembre 2026) */
  const legend=el('div',{class:'ak-legend'}); scene.append(legend);
  const tr=el('div',{class:'ak-transport'});
  tr.innerHTML=`<button class="ib ak-play" data-act="play" title="Lecture / pause (Espace)">▶ Lecture</button>
   <button class="ib" data-act="step" title="Pas à pas (→)">${IC.step}<span class="ak-lbl">Pas</span></button>
   <button class="ib" data-act="reset" title="Recommencer (R)">${IC.reset}<span class="ak-lbl">Recommencer</span></button>
   <select class="ak-speed" title="Vitesse de lecture">${(cfg.vitesses||[.25,.5,1,2,4]).map(v=>`<option value="${v}"${v===(cfg.vitesse||1)?' selected':''}>× ${v}</option>`).join('')}</select>
   <input type="range" class="ak-scrub" min="0" max="1" step="any" value="0" aria-label="Curseur temporel" hidden><span class="ak-extra"></span><span class="ak-clock"></span>`;
  scene.append(tr);
  /* colonne de droite (6 novembre 2026) : réglages qui défilent, mesures en bas des réglages
     (sur téléphone, les mesures restent sous la scène) */
  const right=el('div',{class:'ak-right'}); body.append(right);
  const metrics=el('section',{class:'ak-metrics','aria-label':'Mesures'});
  const side=el('aside',{class:'ak-side','aria-label':'Réglages'});
  side.innerHTML='<div class="ak-drawer-head"><span>Réglages</span><button class="mini" data-act="settings">Fermer ✕</button></div>';
  right.append(side);
  /* pied de page supprimé le 6 novembre 2026 */
  const dlg=el('dialog',{class:'ak-dialog'}); const toastEl=el('div',{class:'ak-toast'});
  document.body.append(ak,dlg,toastEl);
  A.root=ak; A.extra=$('.ak-extra',tr);
  /* curseur temporel (facultatif) : cfg.curseur = {max:(a)=>…, get:(a)=>…, set:(a,v)=>…} */
  const scrub=$('.ak-scrub',tr);
  if(cfg.curseur){scrub.hidden=false;scrub.oninput=()=>{A.play(false);cfg.curseur.set(A,+scrub.value*cfg.curseur.max(A));A.render()}}
  const syncScrub=()=>{if(!cfg.curseur||document.activeElement===scrub)return;const m=cfg.curseur.max(A)||1;scrub.value=Math.max(0,Math.min(1,cfg.curseur.get(A)/m))};

  /* ---------- couleurs ---------- */
  function readColors(){
    const cs=getComputedStyle(ak), g=v=>cs.getPropertyValue(v).trim();
    const rgb=s=>{s=s.trim();if(s[0]==='#'){if(s.length===4)s='#'+[...s.slice(1)].map(x=>x+x).join('');return[1,3,5].map(i=>parseInt(s.slice(i,i+2),16))}return s.match(/[\d.]+/g).slice(0,3).map(Number)};
    const mix=(a,b,t)=>'rgb('+a.map((v,i)=>Math.round(v*t+b[i]*(1-t))).join(',')+')';
    const dark=root.dataset.theme==='dark', base=rgb(getComputedStyle(root).getPropertyValue('--'+(cfg.partie||'Anthracite')));
    const c=mix(base,base,1), cInk=dark?mix(base,[255,255,255],.5):mix(base,[0,0,0],.7), cSoft=dark?mix(base,rgb(g('--card')),.22):mix(base,rgb(g('--paper')),.1);
    A.C={paper:g('--paper'),card:g('--card'),ink:g('--ink'),ink2:g('--ink2'),rule:g('--rule'),grid:g('--grid'),c,cInk,cSoft,
      v:g('--q-v'),F:g('--q-F'),B:g('--q-B'),E:g('--q-E'),Ec:g('--q-Ec'),Ep:g('--q-Ep'),Em:g('--q-Em'),pred:g('--q-pred'),hot:g('--q-hot'),cold:g('--q-cold'),
      dark:root.dataset.theme==='dark'};
  }

  /* ---------- réglages ---------- */
  const items={}; const groups=[];
  function stepDec(st){const s=String(st);return s.includes('.')?s.split('.')[1].length:0}
  function buildSettings(){
    (cfg.reglages||[]).forEach(gc=>{
      const g=el('div',{class:'ak-card ak-grp'}); const h=el('h4',{},`<span></span>${gc.titre}`); g.append(h);
      groups.push({gc,el:g,h});
      if(gc.presets){const pr=el('div',{class:'ak-presets'});gc.presets.forEach(ps=>{const b=el('button',{class:'mini',title:ps.titre||''},ps.label);b.onclick=()=>A.preset(ps);ps._btn=b;pr.append(b)});g.append(pr)}
      for(const it of gc.items||[]){
        const box=el('div',{class:'ak-item'}); const type=it.type||'range';
        if(type==='range'){
          const dec=it.dec??stepDec(it.step??1);
          box.innerHTML=`<div class="ak-row"><label for="r_${it.id}">${it.label}</label><input class="ak-num" id="n_${it.id}" type="number" step="${it.step??1}" min="${it.min}" max="${it.max}" inputmode="decimal"><span class="ak-unit">${it.unit||''}</span></div><input type="range" id="r_${it.id}" min="${it.log?Math.log10(it.min):it.min}" max="${it.log?Math.log10(it.max):it.max}" step="${it.log?(it.stepLog??.002):(it.step??1)}">`;
          const R=$('input[type=range]',box), N=$('.ak-num',box);

})();

/* =====================================================================
   Outils communs des animations d'induction (EM3, EM4) · AnimKit
   - EMK.unit(max, unité) : préfixe SI lisible (m, µ, n, k) pour les axes et mesures
   - EMK.vt(...)          : lettre surmontée d'une flèche (vecteur) dans un texte SVG
   - EMK.tplot(...)       : graphe temporel tracé jusqu'à l'instant courant (option « futur »),
                            tangente, aire algébrique sous la courbe, courbes fantômes
   - EMK.split(box, n)    : découpe verticale d'un panneau en n graphes
   ===================================================================== */
'use strict';
globalThis.EMK=(()=>{
  const PREF=[[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n']];
  /** facteur et préfixe pour que max soit entre 1 et 1000 */
  function unit(max,u){
    max=Math.abs(max);
    if(!(max>0)||!isFinite(max))return {f:1,u};
    for(const[s,p]of PREF)if(max>=s*.9995)return {f:1/s,u:p+u};
    return {f:1e9,u:'n'+u};
  }
  function vt(a,x,y,l,sub,o={}){
    const S=a.S,k=a.k,size=o.size??16,fs=size*k,wl=.62*fs,w=wl+(sub?.42*fs*String(sub).length:0);
    const x0=o.anchor==='middle'?x-w/2:o.anchor==='end'?x-w:x;
    return S.text(x0,y,S.v(l,sub),{size,c:o.c,weight:o.weight})+S.arrow(x0+.08*fs,y-.68*fs,x0+wl+.05*fs,y-.68*fs,{c:o.c,w:.9,head:4.2*k});
  }
  function split(P,n,gap){
    const k=1,g=gap??6;const h=(P.h-g*(n-1))/n;
    return Array.from({length:n},(_,i)=>({x:0,y:i*(h+g),w:P.w,h}));
  }
  /**
   * o = {box, T, xmin, t, futur, n, ylab, xlab, sym:true (axe symétrique),
   *      series:[{f|vals, c, w, dash, all(true : toujours entière), ghost}],
   *      tangent:{f, df, c}, area:{f, c}, id, marks:[{x, label, c}]}
   */
  function tplot(a,o){
    const S=a.S,k=a.k,C=a.C,n=o.n||300,x0=o.xmin??0,T=o.T,box=o.box;
    const xs=Array.from({length:n+1},(_,i)=>x0+(T-x0)*i/n);
    const ser=o.series.map(s=>({...s,v:s.vals||xs.map(s.f)}));
    let lo=Infinity,hi=-Infinity;
    for(const s of ser)for(const v of s.v)if(isFinite(v)){if(v<lo)lo=v;if(v>hi)hi=v}
    if(o.zero!==false){lo=Math.min(lo,0);hi=Math.max(hi,0)}
    if(o.sym){const m=Math.max(Math.abs(lo),Math.abs(hi));lo=-m;hi=m}
    if(!(hi-lo>1e-30)){hi=1;lo=o.sym?-1:0}
    const pd=(hi-lo)*.08;
    const G=S.graph({x:box.x+4*k,y:box.y+2*k,w:box.w-8*k,h:box.h-4*k,xmin:x0,xmax:T,ymin:lo-(lo<0?pd:0),ymax:hi+pd,
      xlab:o.xlab??`${S.v('t')} (s)`,ylab:o.ylab,padL:o.padL});
    const tc=Math.max(x0,Math.min(T,o.t));
    const id=(o.id||'g')+Math.round(box.y);
    let s=G.svg+S.clip(id,G);
    const upto=(v,all)=>{const pts=[];for(let i=0;i<=n;i++){if(!all&&xs[i]>tc+1e-12)break;pts.push([xs[i],v[i]])}return pts};
    if(o.area){
      const pts=[];for(let i=0;i<=n;i++){if(xs[i]>tc+1e-12)break;pts.push([xs[i],o.area.f(xs[i])])}
      pts.push([tc,o.area.f(tc)]);
      if(pts.length>1){const d='M'+G.X(pts[0][0]).toFixed(1)+','+G.Y(0).toFixed(1)+pts.map(p=>'L'+G.X(p[0]).toFixed(1)+','+G.Y(p[1]).toFixed(1)).join('')+'L'+G.X(tc).toFixed(1)+','+G.Y(0).toFixed(1)+'Z';
        s+=`<g clip-path="url(#${id})"><path d="${d}" fill="${o.area.c}" fill-opacity=".22" stroke="none"/></g>`}
    }
    for(const sr of ser){
      const all=o.futur||sr.all, pts=upto(sr.v,all);
      if(!all&&!sr.vals&&sr.f)pts.push([tc,sr.f(tc)]);
      s+=S.curve(pts,G,{c:sr.c,w:sr.w??2.4,dash:sr.dash?`${6*k} ${4*k}`:undefined,op:sr.op});
    }
    if(o.tangent){
      const y0=o.tangent.f(tc),sl=o.tangent.df(tc),L=(T-x0)*.16;
      s+=S.curve([[tc-L,y0-sl*L],[tc+L,y0+sl*L]],G,{c:o.tangent.c||C.pred,w:1.8,dash:`${5*k} ${3*k}`});
    }
    for(const m of o.marks||[]){if(m.x<x0||m.x>T)continue;
      s+=S.line(G.X(m.x),G.y0,G.X(m.x),G.y0+G.h,{c:m.c||C.pred,w:1.2,dash:`${2*k} ${3*k}`})+S.text(G.X(m.x)+4*k,G.y0+4*k,m.label,{base:'top',size:13,c:m.c||C.pred})}
    s+=S.line(G.X(tc),G.y0,G.X(tc),G.y0+G.h,{c:C.ink2,w:1,dash:`${3*k} ${4*k}`});
    for(const sr of ser)if(sr.f&&!sr.ghost){const y=sr.f(tc);if(isFinite(y))s+=S.circle(G.X(tc),G.Y(y),3.8*k,{fill:sr.c})}

  }

})();

/* Fonction de flux Ψ = r A_φ d'anneaux coaxiaux (axe x) : les lignes de champ sont les
   lignes de niveau de Ψ (flux à travers le disque de rayon r centré sur l'axe : 2πΨ).
   Intégrales elliptiques complètes par moyenne arithmético-géométrique. */
globalThis.EMPsi=(()=>{
  const MU0=4e-7*Math.PI;
  function ellip(m){let a=1,b=Math.sqrt(1-m),sum=m/2,w=1;
    for(let i=0;i<24;i++){const c=(a-b)/2,na=(a+b)/2;sum+=w*c*c;w*=2;b=Math.sqrt(a*b);a=na;if(Math.abs(c)<2e-16*a)break;}
    const K=Math.PI/(2*a);return [K,K*(1-sum)];}
  function ring(a,I,z,r){
    if(r<1e-9)return 0;
    const m=Math.min(1-1e-12,4*a*r/((a+r)**2+z*z)),[K,E]=ellip(m),kk=Math.sqrt(m);
    return r*MU0*I/(Math.PI*kk)*Math.sqrt(a/r)*((1-m/2)*K-E);
  }
  /** rings = [{a, x, I}] ; renvoie Ψ(x, r) */
  const psi=(rings,x,r)=>{let s=0;for(const q of rings)s+=ring(q.a,q.I,x-q.x,r);return s;};
  /** lignes de niveau (carrés marchants) : grille F[(j)*(nx+1)+i], renvoie [[x1,y1,x2,y2]…] par niveau */
  function contours(F,nx,ny,levels){
    const out=levels.map(()=>[]);
    for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
      const v0=F[j*(nx+1)+i],v1=F[j*(nx+1)+i+1],v2=F[(j+1)*(nx+1)+i+1],v3=F[(j+1)*(nx+1)+i];
      const lo=Math.min(v0,v1,v2,v3),hi=Math.max(v0,v1,v2,v3);
      levels.forEach((L,n)=>{
        if(L<=lo||L>=hi)return;
        const c=(v0>L)|(v1>L)<<1|(v2>L)<<2|(v3>L)<<3;
        const e=q=>q===0?[i+(L-v0)/(v1-v0),j]:q===1?[i+1,j+(L-v1)/(v2-v1)]:q===2?[i+(L-v3)/(v2-v3),j+1]:[i,j+(L-v0)/(v3-v0)];
        const T={1:[[3,0]],2:[[0,1]],3:[[3,1]],4:[[1,2]],5:[[3,2],[0,1]],6:[[0,2]],7:[[3,2]],8:[[2,3]],9:[[0,2]],10:[[0,3],[1,2]],11:[[1,2]],12:[[1,3]],13:[[0,1]],14:[[0,3]]}[c];
        if(T)for(const[a,b]of T){const p=e(a),q=e(b);out[n].push([p[0],p[1],q[0],q[1]]);}
      });
    }
    return out;
  }
  return Object.freeze({ring,psi,contours,MU0});
})();

  },
  change(a,id){if(/^courbe|futur|courants/.test(id))return;a.t=0;},
  onglet(a){a.reset()},
  reset(a){a.t=0},
  step(a,dt){a.t=Math.min(tmax(a),a.t+dt);if(a.t>=tmax(a))a.play(false)},

/* ---------- mesures ---------- */
function infos(a,d,q,lg){
  const f=a.fmt,p=a.p,fut=p.futur,m=[];
  if(a.tab===0){m.push({label:'Chaleur Joule · disque plein',value:f.sig(q.Q,3),unit:'J',hint:`énergie initiale ${f.sig(q.E0,3)} J`},{label:'Chaleur Joule · disque fendu',value:f.sig(q.QS,3),unit:'J'})}
  else if(a.tab===1){m.push({label:'Vitesse dans le conducteur',value:f.sig(q.v,3),unit:'m·s<sup>−1</sup>',hint:fut?`limite ${f.sig(q.vlim,3)} m·s<sup>−1</sup>`:''},{label:'Durées de traversée',value:fut||a.t>=d.tmax-1e-9?f.sig(d.tmax,3):'?',unit:'s',hint:`PVC : ${fut||a.t>=d.tPVC?f.sig(d.tPVC,3)+' s':'?'}`})}
  else if(a.tab===2){m.push({label:`Champ critique ${M.v('B','0')}`,value:fut?f.sig(d.B0,3):'?',unit:'T',hint:fut?(d.regime==='critique'?'régime critique':d.regime==='pseudo'?'régime pseudo-périodique':'régime apériodique'):'cocher la prévision'})}
  else m.push({label:`Vitesse ${M.v('v')}`,value:f.sig(q.v,3),unit:'m·s<sup>−1</sup>',hint:fut?`limite ${f.sig(d.vlim,3)} m·s<sup>−1</sup> (si <i class="m">L</i> = 0)`:''});
  a.metrics(m);
  a.clock(`${M.v('t')} = ${f.fix(a.t,2)} s`);
  a.legend(lg);
}

/* ---------- symboles ---------- */
function champ(S,x,y,r,c,sortant){return S.circle(x,y,r,{c,w:1.1})+(sortant?S.circle(x,y,r*.3,{fill:c}):S.line(x-r*.62,y-r*.62,x+r*.62,y+r*.62,{c,w:1.1})+S.line(x-r*.62,y+r*.62,x+r*.62,y-r*.62,{c,w:1.1}))}

/* ---------- 1 · disques ---------- */
function disques(a,d,q,lg){
  const P=a.panels.scene,S=a.S,C=a.C,k=a.k,p=a.p,w=P.w,h=P.h,SH=EM5.SHEET,ell=SH.length,r=SH.radius,tb=d.table;
  const extent=ell*Math.sin(p.angle*Math.PI/180)+r;
  const sc=Math.min((w*.5-16*k)/(2*extent),(h-64*k)/(ell+r+.02)),py=Math.max(34*k,(h-44*k-(ell+r)*sc)/2);
  let s='';st.g.disks=[];
  const one=(key,ox,theta,omega,label,col)=>{
    const W=(x,y)=>[ox+x*sc,py+y*sc],rot=(x,y)=>[Math.cos(theta)*x+Math.sin(theta)*(ell+y),-Math.sin(theta)*x+Math.cos(theta)*(ell+y)];
    // champ localisé (entrant)
    if(p.B>0){const A0=W(-SH.halfWidth,ell-SH.halfHeight),B0=W(SH.halfWidth,ell+SH.halfHeight);s+=S.rect(A0[0],A0[1],B0[0]-A0[0],B0[1]-A0[1],{fill:C.B,fop:.05+.14*p.B/.12,c:C.B,w:.8,rx:3*k});
      for(const yy of[-.1,0,.1])for(const xx of[-.045,.045]){const X=W(xx,ell+yy);s+=champ(S,X[0],X[1],5*k,C.B,false)}}
    s+=S.line(...W(-.16,0),...W(.16,0),{c:C.ink2,w:3});s+=S.line(...W(0,0),...W(0,ell+r+.02),{c:C.ink2,w:1,dash:`${4*k} ${5*k}`,op:.6});
    const c0=W(...rot(0,0)),pv=W(0,0);s+=S.line(pv[0],pv[1],c0[0],c0[1],{c:C.ink2,w:2.6})+S.circle(pv[0],pv[1],3.5*k,{fill:C.ink});
    s+=S.circle(c0[0],c0[1],r*sc,{fill:C.dark?'#5d6670':'#c9ced4',c:C.ink2,w:1.3});
    if(key==='slit')for(let j=0;j<SH.slots;j++){const an=Math.PI/24+j*TAU/SH.slots,A0=W(...rot(SH.hub*Math.cos(an),SH.hub*Math.sin(an))),B0=W(...rot((r+.002)*Math.cos(an),(r+.002)*Math.sin(an)));s+=S.line(A0[0],A0[1],B0[0],B0[1],{c:C.card,w:Math.max(2.4,sc*.006)})}
    st.g.disks.push({x:c0[0],y:c0[1],r:r*sc});
    // lignes de courant : lignes de niveau de ψ, à pas fixe sur tout le mouvement
    if(p.courants&&p.B>0&&d.psiRef>0){
      const at=EM5.sheetAt(tb,key,theta),RA=tb[key].rows[at.a],RB=tb[key].rows[at.b],g=-d.gain*omega; // ⊗ : signe opposé au modèle (⊙)
      const n=Math.round(2*r/tb[key].mesh.h),hh=tb[key].mesh.h,F=new Float64Array(n*n);for(let i=0;i<n*n;i++)F[i]=(RA.psi[i]*(1-at.f)+RB.psi[i]*at.f)*g;
      const dl=d.psiRef/7,levels=[];for(let m=0;m<7;m++){levels.push((m+.5)*dl);levels.push(-(m+.5)*dl)}
      const segs=EMPsi.contours(F,n-1,n-1,levels),loc=(i,j)=>[-r+(i+.5)*hh,-r+(j+.5)*hh];
      const val=(i,j)=>F[Math.max(0,Math.min(n-1,j))*n+Math.max(0,Math.min(n-1,i))];
      segs.forEach((L,li)=>{if(!L.length)return;let path='',best=null,bx=-1e9;
        for(const[x1,y1,x2,y2]of L){const A0=W(...rot(...loc(x1,y1))),B0=W(...rot(...loc(x2,y2)));path+=`M${A0[0].toFixed(1)},${A0[1].toFixed(1)}L${B0[0].toFixed(1)},${B0[1].toFixed(1)}`;
          const xm=(x1+x2)/2;if(xm>bx){bx=xm;best=[x1,y1,x2,y2]}}
        s+=S.path(path,{c:C.E,w:1.7,op:.9});
        if(best){// flèche : j = (∂ψ/∂y, −∂ψ/∂x) dans le repère du disque
          const[x1,y1,x2,y2]=best,i=Math.round((x1+x2)/2),j=Math.round((y1+y2)/2),gx=val(i+1,j)-val(i-1,j),gy=val(i,j+1)-val(i,j-1),jx=gy,jy=-gx;
          let ux=x2-x1,uy=y2-y1;if(ux*jx+uy*jy<0){ux=-ux;uy=-uy}const ln=Math.hypot(ux,uy)||1;
          const mid=loc((x1+x2)/2,(y1+y2)/2),A0=W(...rot(mid[0]-ux/ln*hh*.6,mid[1]-uy/ln*hh*.6)),B0=W(...rot(mid[0]+ux/ln*hh*.6,mid[1]+uy/ln*hh*.6));
          s+=S.arrow(A0[0],A0[1],B0[0],B0[1],{c:C.E,w:1.8,head:8*k})}
      });
    }
    s+=S.text(ox,h-26*k,label,{anchor:'middle',size:16,c:col,weight:600});
    s+=S.text(ox,h-9*k,`${S.v('P','J')} = ${a.fmt.sig(key==='plain'?q.PJ:q.PJS,3)} W`,{anchor:'middle',size:14,c:C.F});
  };
  one('plain',w*.25,q.theta,q.omega,'Disque plein',C.ink);one('slit',w*.75,q.thetaS,q.omegaS,'Disque fendu',C.ink);
  s+=S.text(10*k,10*k,`<tspan fill="${C.B}">${S.v('B')} = ${a.fmt.fix(p.B*1000,0)} mT ⊗</tspan>   ·   ${p.metal==='cuivre'?'cuivre':'aluminium'}, ${S.v('h')} = ${a.fmt.fix(p.thickness,1)} mm`,{base:'top',size:14,c:C.ink});
  a.svg('scene',s);
  lg.push({c:C.B,label:'champ entrant localisé'},p.courants&&{c:C.E,label:'lignes de courant (pas d\'intensité fixe)'});
}

/* ---------- 2 · tube ---------- */
function tube(a,d,q,lg){
  const P=a.panels.scene,S=a.S,C=a.C,k=a.k,p=a.p,w=P.w,h=P.h,tp=d.tp,top=40*k,bot=h-40*k,L=bot-top,sc=L/tp.length,mx=w*.3,px=w*.72,R=Math.min(30*k,w*.07);
  let s='';
  const tubeD=(x,col,title)=>{s+=S.rect(x-R,top,2*R,L,{fill:col,fop:.1,c:C.ink2,w:2,rx:3*k})+S.text(x,top-14*k,title,{anchor:'middle',size:16,c:C.ink,weight:600})};
  tubeD(mx,C.E,p.metalTube==='cuivre'?'Cuivre':'Aluminium');tubeD(px,C.B,'PVC');
  const magnet=(x,z)=>{const y=top+Math.min(z,tp.length+.05)*sc;s+=S.rect(x-12*k,y-14*k,24*k,14*k,{fill:C.F})+S.rect(x-12*k,y,24*k,14*k,{fill:C.B})+S.text(x,y-7*k,'N',{anchor:'middle',size:13,c:'#fff',halo:false,weight:700})+S.text(x,y+7*k,'S',{anchor:'middle',size:13,c:'#fff',halo:false,weight:700});return y};
  const y=magnet(mx,q.z),out=a.t>d.tPVC,yp=out?0:magnet(px,.5*G*a.t*a.t);
  st.g.mag={x:mx,y};
  // anneaux de courant (schématiques), au-dessus et au-dessous de l'aimant
  if(p.courants&&q.v>1e-6){const emax=Math.abs(tp.phi*1e-6*3*(.5/tp.z0)/(1.25)**2.5*q.vlim);
    for(const j of[-3,-2,-1,1,2,3]){const u=-j*.012,zz=q.z+j*.012;if(zz<0||zz>tp.length)continue;
      const df=-3*u/(tp.z0*tp.z0)/(1+(u/tp.z0)**2)**2.5,e=-tp.phi*1e-6*df*q.v,fr=Math.min(1,Math.abs(e)/emax);if(fr<.03)continue;
      const yy=top+zz*sc,pts=[];for(let m=0;m<=40;m++){const an=TAU*m/40;pts.push([mx+R*Math.cos(an),yy-5*k*Math.sin(an)])}
      s+=S.poly(pts,{c:C.E,w:1+1.8*fr,op:.35+.65*fr});
      // devant (bas de l'ellipse) : vers la droite si e > 0 (sens direct vu de dessus)
      const dir=e>0?1:-1,hl=10*k*fr+4*k;s+=S.arrow(mx-dir*hl,yy+5*k,mx+dir*hl,yy+5*k,{c:C.E,w:1.8,op:.35+.65*fr})}}
  // forces et vitesse : flèches proportionnelles (poids de référence 40 px)
  const Fw=46*k,mg=tp.m*G;
  s+=S.arrow(mx-R-14*k,y,mx-R-14*k,y+Fw,{c:C.ink,w:2.2})+S.text(mx-R-22*k,y+Fw*.6,S.v('m')+S.v('g'),{anchor:'end',size:15,c:C.ink});
  const Ff=d.c*q.v/mg*Fw;if(Ff>2*k)s+=S.arrow(mx+R+14*k,y,mx+R+14*k,y-Ff,{c:C.F,w:2.4})+S.text(mx+R+22*k,y-Ff*.6,sb(S.v('F'),'frein'),{size:15,c:C.F});
  const Lv=q.v/q.vlim*40*k;if(Lv>2*k)s+=S.arrow(mx+R+40*k,y,mx+R+40*k,y+Lv,{c:C.v,w:2.4})+S.text(mx+R+48*k,y+Lv*.6,S.v('v'),{size:15,c:C.v});
  if(!out)s+=S.arrow(px-R-14*k,yp,px-R-14*k,yp+Fw,{c:C.ink,w:2.2});
  if(out)s+=S.text(px,top+L/2,'sorti',{anchor:'middle',size:16,c:C.ink2});
  s+=S.text(mx,h-16*k,`${S.v('v')} = ${a.fmt.sig(q.v,3)} m·s${S.sup('−1')}`,{anchor:'middle',size:14,c:C.v});
  s+=S.text(px,h-16*k,`${S.v('v')} = ${a.t>d.tPVC?'—':a.fmt.sig(G*a.t,3)+' m·s'+S.sup('−1')}`,{anchor:'middle',size:14,c:C.ink2});
  a.svg('scene',s);
  lg.push({c:C.ink,label:'poids'},{c:C.F,label:'force de freinage'},{c:C.v,label:'vitesse'},p.courants&&{c:C.E,label:'courants induits (schéma)'});
}

/* ---------- 3 · pendule conducteur ---------- */
function tige(a,d,q,lg){
  const P=a.panels.scene,S=a.S,C=a.C,k=a.k,p=a.p,w=P.w,h=P.h,aa=p.aT,sc=Math.min((w-60*k)/(2.2*aa),(h-70*k)/(1.15*aa)),ox=w/2,oy=34*k;
  const W=(x,y)=>[ox+x*sc,oy+y*sc];let s='';
  // champ sortant uniforme
  if(p.BT>0){const st0=Math.max(34*k,aa*sc/4);for(let x=ox-aa*sc*1.05;x<=ox+aa*sc*1.05;x+=st0)for(let y=oy+st0*.6;y<=oy+aa*sc*1.08;y+=st0)s+=champ(S,x,y,4.5*k,C.B,true)}
  // rail demi-circulaire et liaison O – rail
  const arc=[];for(let j=0;j<=60;j++){const u=Math.PI*j/60;arc.push(W(aa*Math.cos(u),aa*Math.sin(u)))}s+=S.poly(arc,{c:C.ink2,w:3});
  s+=S.line(...W(0,0),...W(aa,0),{c:C.ink2,w:1.6});s+=S.line(...W(-.15*aa,0),...W(.15*aa,0),{c:C.ink,w:2.4});
  s+=S.line(...W(0,0),...W(0,aa*1.08),{c:C.ink2,w:1,dash:`${4*k} ${5*k}`});
  const th=q.theta,Ax=aa*Math.sin(th),Ay=aa*Math.cos(th),A0=W(0,0),A1=W(Ax,Ay);
  s+=S.line(A0[0],A0[1],A1[0],A1[1],{c:C.ink,w:5})+S.circle(A0[0],A0[1],4*k,{fill:C.ink})+S.circle(A1[0],A1[1],4*k,{fill:C.ink});
  s+=S.text(A0[0]-10*k,A0[1]-10*k,S.v('O'),{anchor:'end',size:15,c:C.ink})+S.text(A1[0]+10*k*Math.sign(Ax||1),A1[1]+12*k,S.v('A'),{size:15,c:C.ink,anchor:Ax<0?'end':'start'});
  st.g.tige={A:A1};
  // angle
  if(Math.abs(th)>.02){const rr=aa*.3,pts=[];for(let j=0;j<=24;j++){const u=th*j/24;pts.push(W(rr*Math.sin(u),rr*Math.cos(u)))}s+=S.poly(pts,{c:C.cInk,w:1.5});const m=W(rr*1.2*Math.sin(th/2),rr*1.2*Math.cos(th/2));s+=S.text(m[0],m[1],'θ',{anchor:'middle',size:16,c:C.cInk,math:true})}
  // courant (O → A positif) et force de Laplace, proportionnels
  const imax=d.mx('i'),fr=Math.abs(q.i)/imax,ux=Math.sin(th),uy=Math.cos(th);
  if(fr>2e-3){const sg=Math.sign(q.i),c0=.5,half=.18*fr,B1=W((c0-sg*half)*Ax,(c0-sg*half)*Ay),B2=W((c0+sg*half)*Ax,(c0+sg*half)*Ay),off=12*k;
    s+=S.arrow(B1[0]-uy*off,B1[1]+ux*off,B2[0]-uy*off,B2[1]+ux*off,{c:C.E,w:2.6})+S.text((B1[0]+B2[0])/2-uy*off*2.2,(B1[1]+B2[1])/2+ux*off*2.2,S.v('i'),{anchor:'middle',size:15,c:C.E});
    // force résultante iBa, perpendiculaire à la tige, appliquée au milieu ; sens −i e_θ
    const M0=W(.5*Ax,.5*Ay),Lf=60*k*fr,ex=-Math.sign(q.i)*Math.cos(th),ey=Math.sign(q.i)*Math.sin(th);s+=S.arrow(M0[0],M0[1],M0[0]+ex*Lf,M0[1]+ey*Lf,{c:C.F,w:2.6})+S.text(M0[0]+ex*(Lf+14*k),M0[1]+ey*(Lf+14*k),sb(S.v('F'),'L'),{anchor:'middle',size:15,c:C.F})}
  const g0=W(aa*1.0,aa*.15);s+=S.arrow(g0[0],g0[1],g0[0],g0[1]+40*k,{c:C.ink2,w:1.6})+S.text(g0[0]+8*k,g0[1]+20*k,S.v('g'),{size:15});
  s+=S.text(10*k,10*k,`<tspan fill="${C.B}">${S.v('B')} = ${a.fmt.fix(p.BT,2)} T ⊙</tspan>   ·   ${S.v('R')} = ${a.fmt.sig(p.RT,2)} Ω`,{base:'top',size:14,c:C.ink});
  a.svg('scene',s);
  lg.push({c:C.B,label:'champ sortant'},{c:C.E,label:'courant (sens réel)'},{c:C.F,label:'force de Laplace résultante'});
}

/* ---------- 4 · cadre ---------- */
function cadre(a,d,q,lg){
  const P=a.panels.scene,S=a.S,C=a.C,k=a.k,p=a.p,w=P.w,h=P.h,aa=p.aC,x0=-p.h0-aa,x1=aa+.12+.02;
  const sc=Math.min((h-40*k)/(x1-x0),(w*.55)/(aa*2.4)),cx=w*.42,yT=20*k-x0*sc,Y=x=>yT+x*sc;
  let s='';
  // demi-espace de champ x > 0
  s+=S.rect(cx-aa*sc*1.5,Y(0),aa*sc*3,h-Y(0),{fill:C.B,fop:.08+.1*p.BC/2});s+=S.line(cx-aa*sc*1.5,Y(0),cx+aa*sc*1.5,Y(0),{c:C.B,w:1.2,dash:`${5*k} ${4*k}`});
  if(p.BC>0){const stp=Math.max(30*k,aa*sc*.5);for(let x=cx-aa*sc*1.3;x<=cx+aa*sc*1.3;x+=stp)for(let y=Y(0)+stp*.5;y<h;y+=stp)s+=champ(S,x,y,4.5*k,C.B,true)}
  s+=S.text(cx-aa*sc*1.5-6*k,Y(0),'0',{anchor:'end',size:14,c:C.ink2});
  // axe x descendant
  const ax=cx-aa*sc*1.5-24*k;s+=S.arrow(ax,Y(x0)+4*k,ax,h-10*k,{c:C.ink2,w:1.2})+S.text(ax-6*k,h-18*k,S.v('x'),{anchor:'end',size:14});
  // cadre
  const xl=cx-aa*sc/2,xr=cx+aa*sc/2,yb=Y(q.x),yt=Y(q.x-aa);s+=S.rect(xl,yt,xr-xl,yb-yt,{c:C.ink,w:3.5});
  st.g.cadre={xl,xr,yt,yb};
  // courant : sens positif trigonométrique à l'écran (normale ⊙) ; flèches proportionnelles
  const imax=d.mx('i'),fr=Math.abs(q.i)/imax;
  if(fr>2e-3){const sg=Math.sign(q.i),hl=Math.min(aa*sc*.3,28*k)*fr,mxx=(xl+xr)/2,myy=(yt+yb)/2;
    s+=S.arrow(mxx-sg*hl,yb,mxx+sg*hl,yb,{c:C.E,w:2.6})+S.arrow(mxx+sg*hl,yt,mxx-sg*hl,yt,{c:C.E,w:2.6})+S.arrow(xr,myy+sg*hl,xr,myy-sg*hl,{c:C.E,w:2.6})+S.arrow(xl,myy-sg*hl,xl,myy+sg*hl,{c:C.E,w:2.6})}
  // forces et vitesse
  const mg=p.mC*1e-3*G,Fw=44*k,cc=(yt+yb)/2;s+=S.arrow(xr+16*k,cc,xr+16*k,cc+Fw,{c:C.ink,w:2.2})+S.text(xr+24*k,cc+Fw*.7,S.v('m')+S.v('g'),{size:15,c:C.ink});
  const Lf=q.F/mg*Fw;if(Math.abs(Lf)>2*k)s+=S.arrow(cx,yb,cx,yb+Lf,{c:C.F,w:2.6})+S.text(cx+8*k,yb+Lf-4*k,sb(S.v('F'),'L'),{size:15,c:C.F});
  const vM=d.mx('v'),Lv=q.v/vM*60*k;if(Lv>2*k)s+=S.arrow(xl-18*k,cc,xl-18*k,cc+Lv,{c:C.v,w:2.4})+S.text(xl-26*k,cc+Lv*.6,S.v('v'),{anchor:'end',size:15,c:C.v});
  const ph=q.x<0?'1 · hors du champ':q.x<aa?'2 · à cheval':'3 · entièrement dans le champ';
  s+=S.text(w-10*k,40*k,`Phase ${ph}`,{anchor:'end',base:'top',size:15,c:C.ink});
  s+=S.text(w-10*k,62*k,`<tspan fill="${C.B}">${S.v('B')} = ${a.fmt.fix(p.BC,2)} T ⊙</tspan>`,{anchor:'end',base:'top',size:14,c:C.ink});
  a.svg('scene',s);
  lg.push({c:C.B,label:'champ sortant (x > 0)'},{c:C.E,label:'courant (sens réel)'},{c:C.F,label:'force de Laplace'},{c:C.v,label:'vitesse'});
}

/* ---------- interactions : glisser l'objet pour parcourir le temps ---------- */
A.drag('scene',{
  hit(x,y){const g=st.g,k=A.k;
    if(A.tab===0)return(g.disks||[]).some(D=>Math.hypot(x-D.x,y-D.y)<D.r+6*k);
    if(A.tab===1)return g.mag&&Math.abs(x-g.mag.x)<30*k&&Math.abs(y-g.mag.y)<24*k;
    if(A.tab===2)return g.tige&&Math.hypot(x-g.tige.A[0],y-g.tige.A[1])<24*k;
    const c=g.cadre;return c&&x>c.xl-10*k&&x<c.xr+10*k&&y>c.yt-10*k&&y<c.yb+10*k},
  start(x,y){A.play(false);st.drag={x,y,t:A.t}},
  move(x,y){const d=st.drag,T=tmax(A);if(!d)return;
    if(A.tab===0){A.t=Math.max(0,Math.min(T,d.t+(x-d.x)/A.panels.scene.w*T));return}
    if(A.tab===2){const D=data(A);let best=D.rows[0],b=1e9;const ang=Math.atan2(x-(A.panels.scene.w/2),y-34*A.k);for(const r of D.rows){const e=Math.abs(r.theta-ang)+Math.abs(r.t-A.t)*.05;if(e<b){b=e;best=r}}A.t=best.t;return}
    A.t=Math.max(0,Math.min(T,d.t+(y-d.y)/A.panels.scene.h*T))},
  end(){st.drag=null}
});

/* ---------- graphes ---------- */
function graphe(a,d,q,lg){
  const P=a.panels.graphe,S=a.S,C=a.C,k=a.k,p=a.p,T=d.tmax,fut=p.futur,full={x:0,y:0,w:P.w,h:P.h};
  const fn=key=>t=>etat(a,t)[key],g=(f)=>t=>f(etat(a,t));let s='';
  const tp=(box,series,ylab,o={})=>{const r=EMK.tplot(a,{box,T,t:a.t,futur:fut,series,ylab,sym:o.sym,id:o.id,n:o.n||400,tangent:o.tangent});s+=r.svg;const G0=r.G;
    for(const m of o.marks||[]){const X=G0.X(m.x),right=X>G0.x0+G0.w*.8;s+=S.line(X,G0.y0,X,G0.y0+G0.h,{c:C.pred,w:1.2,dash:`${2*k} ${3*k}`})+S.text(X+(right?-4:4)*k,G0.y0+G0.h*.12,m.label,{anchor:right?'end':'start',size:13,c:C.pred})}
    return G0};
  const L=(c,label,dash)=>lg.push({c,label,dash});
  if(a.tab===0){const c=p.courbe0;
    const pair=(fa,fb,ylab,id,sym)=>{tp(full,[{f:g(fa),c:C.ink},{f:g(fb),c:C.cInk,dash:true}],ylab,{id,sym});L(C.ink,'disque plein');L(C.cInk,'disque fendu',true)};
    if(c==='angles')pair(r=>r.theta*180/Math.PI,r=>r.thetaS*180/Math.PI,'θ (°)','a',true);
    else if(c==='energies')pair(r=>r.Ec+r.Ep,r=>r.EcS+r.EpS,`${sb(S.v('E'),'m')} (J)`,'e');
    else if(c==='puissances')pair(r=>r.PJ,r=>r.PJS,`${sb(S.v('P'),'J')} (W)`,'p');
    else pair(r=>-r.c*r.omega,r=>-r.cS*r.omegaS,'Couples de freinage (N·m)','c',true);
  }else if(a.tab===1){const c=p.courbe1,tp0=d.tp;
    if(c==='distance'){tp(full,[{f:fn('z'),c:C.E},{f:fn('zPVC'),c:C.B,dash:true}],'Distance parcourue (m)',{id:'z'});L(C.E,p.metalTube);L(C.B,'PVC',true)}
    else if(c==='vitesse'){const ser=[{f:fn('v'),c:C.v}];if(fut)ser.push({f:()=>q.vlim,c:C.pred,dash:true,all:true,ghost:true});
      tp(full,ser,`${S.v('v')} (m·s${S.sup('−1')})`,{id:'v',tangent:fut?{f:t=>G*t,df:()=>G,c:C.pred}:null});
      L(C.v,'vitesse dans le conducteur');if(fut){L(C.pred,`vitesse limite ${M.v('mg')}/${M.v('c')} ; τ = ${M.v('m')}/${M.v('c')} = ${a.fmt.sig(q.tau*1000,3)} ms`,true)}}
    else if(c==='energies'){tp(full,[{f:fn('W'),c:C.cInk},{f:fn('Q'),c:C.F,dash:true},{f:fn('Ec'),c:C.v,dash:true}],'Énergies depuis le lâcher (J)',{id:'e'});L(C.cInk,'travail du poids');L(C.F,'chaleur Joule',true);L(C.v,`${M.v('E','c')}`,true)}
    else if(c==='puissances'){tp(full,[{f:g(r=>tp0.m*G*r.v),c:C.cInk},{f:fn('PJ'),c:C.F,dash:true}],'Puissances (W)',{id:'p'});L(C.cInk,'puissance du poids');L(C.F,'Joule',true)}
    else{const B=EMK.split(P,2);tp(B[0],[{f:g(r=>r.flux*1e6),c:C.B}],'Φ (µWb)',{id:'f'});tp(B[1],[{f:g(r=>r.emf*1e3),c:C.cInk}],`${S.v('e')} (mV)`,{id:'e',sym:true});L(C.B,'flux à travers un anneau fixe à mi-hauteur');L(C.cInk,'f.é.m. de cet anneau')}
  }else if(a.tab===2){const c=p.courbe2;
    if(c==='angle'){const ser=[{f:g(r=>r.theta*180/Math.PI),c:C.ink}];
      if(fut&&d.regime==='pseudo'&&p.BT>0){ser.push({f:t=>p.theta0*Math.exp(-d.lam*t),c:C.pred,dash:true,all:true,ghost:true},{f:t=>-p.theta0*Math.exp(-d.lam*t),c:C.pred,dash:true,all:true,ghost:true});L(C.pred,`enveloppe θ<sub>0</sub> e<sup>−λ<i class="m">t</i></sup>, λ = ${a.fmt.sig(d.lam,3)} s<sup>−1</sup>`,true)}
      tp(full,ser,'θ (°)',{id:'a',sym:true});L(C.ink,'angle θ')}
    else if(c==='courant'){tp(full,[{f:fn('i'),c:C.E}],`${S.v('i')} (A)`,{id:'i',sym:true});L(C.E,'courant de O vers A')}
    else{tp(full,[{f:g(r=>r.Ec+r.Ep),c:C.cInk},{f:fn('Q'),c:C.F,dash:true},{f:g(r=>r.Ec+r.Ep+r.Q),c:C.pred,dash:true}],'Énergies (J)',{id:'e'});L(C.cInk,'énergie mécanique');L(C.F,'chaleur Joule',true);L(C.pred,'somme',true)}
  }else{const c=p.courbe3,marks=[];if(fut||a.t>=d.t1)marks.push({x:d.t1,label:'phase 2'});if(fut||a.t>=d.t2)marks.push({x:d.t2,label:'phase 3'});
    if(c==='vitesse'){const ser=[{f:fn('v'),c:C.v}];if(fut&&p.LC===0&&p.BC>0)ser.push({f:()=>d.vlim,c:C.pred,dash:true,all:true,ghost:true});tp(full,ser,`${S.v('v')} (m·s${S.sup('−1')})`,{id:'v',marks});if(ser.length>1)L(C.pred,`vitesse limite ${M.v('mgR')}/(${M.v('Ba')})<sup>2</sup> = ${a.fmt.sig(d.vlim,3)} m·s<sup>−1</sup>`,true)}
    else if(c==='courant'){tp(full,[{f:fn('i'),c:C.E}],`${S.v('i')} (A)`,{id:'i',sym:true,marks});L(C.E,'courant')}
    else{tp(full,[{f:fn('W'),c:C.cInk},{f:fn('Ec'),c:C.v,dash:true},{f:fn('Q'),c:C.F,dash:true}],'Énergies depuis le lâcher (J)',{id:'e',marks});L(C.cInk,'travail du poids');L(C.v,M.v('E','c'),true);L(C.F,'chaleur Joule',true)}}
  a.svg('graphe',s);
}
