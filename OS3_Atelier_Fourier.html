    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

function loadSig(a){
  const kind=a.p.kind==='free'?'mix':a.p.kind,sg=F.preset(kind,a.p.duty);
  st.sig=sg;st.c=sg.c.map(x=>({...x}));st.mean=sg.mean;a.set('dc',sg.mean,{silent:true});st.k=null;st.ref=null;selSync(a);
}
function selSync(a){const n=Math.max(1,Math.min(65,Math.round(a.p.n))),c=st.c[n];a.set('amp',Math.round(c.a*a.p.gain*1000)/1000,{silent:true});a.set('phi',Math.round(c.p*180/Math.PI),{silent:true});a.set('incl',c.on,{silent:true})}
const sdelay=a=>a.tab===2?a.p.delay:0;
function termsOf(a,N=a.p.N,full=false){
  const s={N,solo:a.tab<=3&&a.p.solo,n:Math.round(a.p.n),gain:a.p.gain,delay:sdelay(a),c:st.c};
  let ts=F.terms(s);
  if(a.p.filt&&a.tab<=2)ts=ts.map(t=>{const r=t.n*1/Math.max(1e-9,a.p.fc);return{n:t.n,a:t.a/Math.sqrt(1+r*r),p:t.p-Math.atan(r)}});
  if(!full&&st.k!==null)ts=ts.slice(0,st.k);
  return ts;
}
const dcOf=a=>a.p.dc;
const sumFn=(a,ts)=>u=>F.value(u,ts,dcOf(a));
function target(a){const kind=a.p.kind==='free'?'mix':a.p.kind;const sg=F.preset(kind,a.p.duty);return u=>sg.value(u)*a.p.gain+(a.p.dc-sg.mean*0)}
const tgtFn=a=>{const kind=a.p.kind==='free'?'mix':a.p.kind,sg=F.preset(kind,a.p.duty);return u=>sg.value(u)*a.p.gain+(a.p.dc-sg.mean)}
function eqm(a,ts){const f=sumFn(a,ts),g=tgtFn(a);let x=0,M=1024;for(let j=0;j<M;j++){const u=(j+.5)/M;x+=(f(u)-g(u))**2}return Math.sqrt(x/M)}
const presentCount=a=>F.terms({N:a.p.N,solo:false,n:1,gain:a.p.gain,delay:0,c:st.c}).length;
const sample=(fn,u0,u1,n=720)=>Array.from({length:n+1},(_,j)=>{const u=u0+(u1-u0)*j/n;return[u,fn(u)]});

/* ---------- actions ---------- */
function reportRank(a){const n=Math.round(a.p.n),I=F.integrate(tgtFn(a),n);const r=F.fromAB(I.a,I.b);st.c[n].a=r.a/Math.max(1e-9,a.p.gain);st.c[n].p=r.p;st.c[n].on=true;selSync(a)}
function decompose(a){const g=tgtFn(a);let m=0;for(let n=1;n<=65;n++){if(n>a.p.N){st.c[n].a=0;continue}const I=F.integrate(g,n),r=F.fromAB(I.a,I.b);st.c[n].a=r.a/Math.max(1e-9,a.p.gain);st.c[n].p=r.p;st.c[n].on=r.a>1e-6}
  a.set('dc',F.integrate(g,0).mean,{silent:true});selSync(a)}
function randPhases(a){for(let n=1;n<=65;n++)st.c[n].p=(Math.random()*2-1)*Math.PI;selSync(a)}

/* ---------- écoute (Web Audio) ---------- */
function stopAudio(){if(st.audio){try{st.audio.o.stop();st.audio.ctx.close()}catch(e){}st.audio=null}}
function listen(a){
  stopAudio();
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)(),ts=termsOf(a,a.p.N,true),re=new Float32Array(66),im=new Float32Array(66);
    for(const t of ts){re[t.n]=t.a*Math.cos(t.p);im[t.n]=-t.a*Math.sin(t.p)}
    if(ts.length===0){ctx.close();return}
    const w=ctx.createPeriodicWave(re,im),o=ctx.createOscillator(),g=ctx.createGain();
    o.setPeriodicWave(w);o.frequency.value=220;g.gain.value=.12;o.connect(g);g.connect(ctx.destination);o.start();
    st.audio={ctx,o};setTimeout(stopAudio,6000);
  }catch(e){}
}

/* ---------- utilitaires de dessin ---------- */
const v=(a,s,b)=>a.S.v(s,b);
const T_AXIS=(a)=>`${v(a,'t')} / T`;
function curveSet(a,fn,u0,u1,n=720){return sample(fn,u0,u1,n)}
const NP=a=>+a.p.nper||1;
const NS=a=>Math.min(2400,450*NP(a)+300);
function win(a){const z=a.tab===0&&a.p.gibzoom;const c=a.t;return z?[Math.max(0,c-.04),Math.min(1,c+.04)]:[0,NP(a)]}
function ysym(a,ts){const g=tgtFn(a),f=sumFn(a,ts);let m=1e-9;for(let j=0;j<200;j++){const u=j/200;m=Math.max(m,Math.abs(g(u)),Math.abs(f(u)))}return m*1.15}
function seff(a,ts){return F.rms(ts,dcOf(a))}
function thd(ts){const s1=ts.find(t=>t.n===1);if(!s1||s1.a<1e-9)return null;return Math.sqrt(ts.filter(t=>t.n>=2).reduce((x,t)=>x+t.a*t.a,0))/s1.a}
function gibbs(a,ts){
  if(!['square','saw','pulse'].includes(a.p.kind))return null;
  const g=tgtFn(a),f=sumFn(a,ts);let hi=-1e9,lo=1e9,mh=-1e9,ml=1e9;
  for(let j=0;j<2000;j++){const u=(j+.5)/2000,y=g(u),s=f(u);hi=Math.max(hi,y);lo=Math.min(lo,y);mh=Math.max(mh,s);ml=Math.min(ml,s)}
  return Math.max(0,(mh-hi))/Math.max(1e-9,hi-lo)*100;
}
function boxes(P,k,n,fr){const g=6*k;const hh=P.h-g*(n-1);let y=0;return fr.map(r=>{const b={x:0,y,w:P.w,h:hh*r};y+=b.h+g;return b})}

/* ---------- vue 1 : synthèse ---------- */
function mainPlot(a,ts,box,opts={}){
  const [u0,u1]=win(a),ym=ysym(a,ts),f=sumFn(a,ts),g=tgtFn(a),S=a.S,C=a.C;
  const series=[];
  if(opts.target!==false&&a.p.target)series.push({pts:sample(g,u0,u1,NS(a)),c:C.pred,dash:true,w:2});
  if(opts.sel!==false&&a.p.selcurve&&a.tab===0){const n=Math.round(a.p.n),sel=ts.find(t=>t.n===n);if(sel)series.push({pts:sample(u=>sel.a*Math.cos(TAU*n*u+sel.p),u0,u1,NS(a)),c:C.B,w:1.8,op:.8})}
  series.push({pts:sample(f,u0,u1,NS(a)),c:C.c,w:3});
  const G=K.plot(a,{box,id:'p',xmin:u0,xmax:u1,ymin:-ym,ymax:ym,xlab:T_AXIS(a),ylab:`${v(a,'s')}(${v(a,'t')})`,series:[...(opts.extra||[]),...series],cursor:a.t,dots:[{x:a.t,y:f(a.t),c:C.F}],hlines:opts.hlines||[]});
  return G;
}
function view0(a,ts){
  const P=a.panels.scene,S=a.S,C=a.C,k=a.k,[b0,b1]=boxes(P,k,2,[.46,.54]);
  let s=mainPlot(a,ts,b0,{noXlab:true}).svg;
  const d=a.p.detail;
  if(d==='spectra')s+=spectra(a,ts,b1);
  else if(d==='components')s+=components(a,ts,b1);
  else if(d==='sums')s+=sums(a,ts,b1);
  else s+=residual(a,ts,b1);
  a.svg('scene',s);
}
function spectra(a,ts,b){
  const k=a.k,S=a.S,C=a.C,nmax=Math.max(8,Math.min(66,a.p.N+2)),h=(b.h-6*k)/2,b0={x:b.x,y:b.y,w:b.w,h:h},b1={x:b.x,y:b.y+h+6*k,w:b.w,h:h};
  const tg=F.terms({N:a.p.N,solo:false,n:1,gain:a.p.gain,delay:0,c:st.sig.c.map(x=>({...x}))});
  let amax=Math.max(Math.abs(dcOf(a)),...ts.map(t=>t.a),...tg.map(t=>t.a),.2)*1.15;
  const ticks=Array.from({length:nmax+1},(_,j)=>j).filter(j=>nmax<=14||j%5===0);
  const G0=K.plot(a,{box:b0,id:'sa',xmin:-.6,xmax:nmax+.6,ymin:0,ymax:amax,xlab:'',xlabels:false,ylab:`${v(a,'S','n')}`,xticks:ticks,series:[]});
  let s=G0.svg;const G=G0.G,bw=Math.min(14*k,G.w/(nmax+2)*.6);

/* ---------- mesures 1D ---------- */
function info1D(a,ts){

  a.clock(`${Mh.v('t')} / ${Mh.v('T')} = ${f.fix(a.t,3)} · ${Mh.v('T')} = ${f.sig(T,3)} s`);
  const m=[{label:`Valeur efficace ${Mh.v('S','eff')}`,value:f.sig(seff(a,ts),4),unit:''},{label:`Erreur efficace`,value:f.sig(eqm(a,ts),3),unit:''}];

  else if(g!==null&&a.p.N>=3)m.push({label:'Dépassement de Gibbs',value:f.sig(g,3),unit:'% du saut'});
  else m.push({label:`Harmoniques présentes`,value:String(ts.length),unit:st.k!==null?`(construction)`:''});

  const seg=[[[-1,0],[-.9,.2],[-.55,.44],[-.2,.44]],[[-.2,.44],[-.12,.58],[-.02,.72],[.08,.7]],[[.08,.7],[.18,.62],[.24,.46],[.3,.37]],[[.3,.37],[.42,.3],[.5,.2],[.62,.1]],

function shapePts(a){

}
function coeffs(a){
  const key=a.p.shape+'|'+(st.custom&&a.p.shape==='custom'?st.custom.length+':'+st.custom[3][0]:'')+'|'+a.p.sort;
  if(st.cache.key!==key||!st.cache.cs){

function drawDrawing(a){

  const thin=(arr,n)=>{const st_=Math.max(1,Math.floor(arr.length/n));return arr.filter((_,j)=>j%st_===0)};
  if(a.p.dtarget)s+=S.poly(thin(co.pts,900).map(p=>[X(p[0]),Y(p[1])]),{c:C.pred,w:1.6,dash:`${5*k} ${4*k}`,close:true});

    /* trace persistante : le tracé s'estompe lentement avec l'âge jusqu'à 30 % d'opacité (jamais effacé) */
    st.cum=Math.max(st.cum,t);const NR=rec.length,ti=Math.min(NR-1,Math.floor(NR*t)),CH=64,len=NR/CH;
    const piece=(i0,i1,age)=>{if(i1-i0<1)return '';const pts=[];for(let j=i0;j<=i1;j+=2)pts.push([X(rec[j][0]),Y(rec[j][1])]);pts.push([X(rec[i1][0]),Y(rec[i1][1])]);return S.poly(pts,{c:C.c,w:3,op:a.p.dfade?.3+.7*Math.pow(1-age,1.5):1})};
    for(let c=0;c<CH;c++){
      const i0=Math.round(c*len),i1=Math.min(NR-1,Math.round((c+1)*len));
      if(st.cum<1&&i0/NR>st.cum)continue;
      if(!a.p.dfade){/* sans fondu : tout ce qui a déjà été tracé reste affiché à pleine opacité */ if(ti>=i0&&ti<i1){s+=piece(i0,ti,0);if(st.cum>=1)s+=piece(ti,i1,0)}else s+=piece(i0,i1,0);continue}
      if(ti>=i0&&ti<i1){s+=piece(i0,ti,0);s+=piece(ti,i1,Math.min(.97,1-(i1-ti)/NR*.5))}
      else{const mid=(i0+i1)/2,age=((ti-mid)/NR%1+1)%1;s+=piece(i0,i1,age)}
    }
  }
  /* épicycles */
  let tx=0,ty=0,px=X(0),py=Y(0);
  const shown=Math.min(nt,a.p.dcircles?40:0);
  const sum=[];let zx=0,zy=0;
  const ord=co.ord.slice(0,nt);
  for(let j=0;j<ord.length;j++){const c=ord[j],th=TAU*c.n*t,dx=c.re*Math.cos(th)-c.im*Math.sin(th),dy=c.re*Math.sin(th)+c.im*Math.cos(th);zx+=dx;zy+=dy;
    if(j<shown){const nx=X(zx),ny=Y(zy);if(c.a*sc>1.2)s+=S.circle(X(zx-dx),Y(zy-dy),c.a*sc,{fill:'none',c:C.ink2,w:1,op:.4});s+=S.arrow(X(zx-dx),Y(zy-dy),nx,ny,{c:C.c,w:1.8,head:Math.min(7*k,c.a*sc*.6)})}}
  s+=S.circle(X(zx),Y(zy),5*k,{fill:C.F});
  if(a.p.dcircles&&nt>shown)s+=S.text(10*k,h-14*k,`${shown} premiers cercles dessinés sur ${nt}`,{size:13,c:C.ink2});
  /* coordonnées x(t), y(t) */
  if(coords){
    const gx=wl+10*k,gw=w-gx-8*k,hh=(h-6*k)/2;
    for(const [d,lab,y0,col] of [[0,'x',0,C.c],[1,'y',hh+6*k,C.B]]){
      const G=K.plot(a,{box:{x:gx,y:y0,w:gw,h:hh},id:'co'+d,xmin:0,xmax:1,ymin:-ext*1.1,ymax:ext*1.1,xlab:d?T_AXIS(a):'',xlabels:d?undefined:false,ylab:`${lab}(${v(a,'t')})`,
        series:[{pts:thin(co.pts,600).map((p,j,arr)=>[j/(arr.length-1),p[d]]),c:C.pred,dash:true,w:1.6},{pts:thin(rec,600).map((p,j,arr)=>[j/(arr.length-1),p[d]]),c:col,w:2.6}],cursor:t,dots:[{x:t,y:d?zy:zx,c:C.F}]});
      s+=G.svg;
    }
  }
  /* dessin libre en cours */
  if(st.drawing){s+=S.text(w/2,22*k,'Tracer un contour d\'un seul geste, puis relâcher.',{anchor:'middle',size:15,c:C.F});if(st.pts)s+=S.poly(st.pts,{c:C.F,w:2.4})}
  if(a.p.shape==='custom'&&!st.custom)s+=S.text(w/2,h/2,'Aucun contour dessiné : « Dessiner à la souris ».',{anchor:'middle',size:15,c:C.ink2});
  st.dgeom={cx,cy,sc,wl};
  a.svg('scene',s);
  const f=a.fmt,errs=(()=>{let e=0,n=rec.length;const tp=co.pts;for(let j=0;j<n;j++){const q=tp[Math.floor(j*tp.length/n)],r=rec[j];e+=(q[0]-r[0])**2+(q[1]-r[1])**2}return Math.sqrt(e/n)/ext})();
  a.clock(`${Mh.v('t')} / ${Mh.v('T')} = ${f.fix(a.t,3)}`);
  a.metrics([{label:'Composantes retenues',value:String(nt),unit:`sur ${co.ord.length}`},{label:'Erreur relative du contour',value:f.sig(100*errs,3),unit:'%'},{label:'Rayon du premier cercle',value:f.sig(co.ord[1]?co.ord[1].a:0,3),unit:''}]);
  a.legend([{c:C.c,label:'reconstruction'},...(a.p.dtarget?[{c:C.pred,dash:true,label:'contour cible'}]:[]),{c:C.F,dot:true,label:'extrémité de la chaîne'}]);
}

/* ---------- interactions : raies du spectre, dessin libre ---------- */
A.drag('scene',{
  hit:(x,y)=>{
    if(A.tab===4)return st.drawing;
    if(A.tab!==0||A.p.detail!=='spectra'||!st.zones.length)return false;
    return !!zoneAt(x,y);
  },
  start(x,y){
    if(A.tab===4){st.pts=[[x,y]];return}
    st.drag=zoneAt(x,y);st.dv=null;applyDrag(x,y);
  },
  move(x,y){
    if(A.tab===4){if(st.pts)st.pts.push([x,y]);A.refresh();return}
    applyDrag(x,y);
  },
  end(){
    if(A.tab===4){
      if(st.pts&&st.pts.length>10&&st.dgeom){const g=st.dgeom,pts=st.pts.map(p=>[(p[0]-g.cx)/g.sc,(g.cy-p[1])/g.sc]);try{st.custom=F.resample(pts);A.set('shape','custom',{silent:true});A.set('terms',3,{silent:true});st.cache={};st.cum=0;A.t=0}catch(e){}}
      st.drawing=false;st.pts=null;A.refresh();return;
    }
    st.drag=null;
  }
});
function zoneAt(x,y){
  for(const z of st.zones){const G=z.G;if(y>=G.y0-4&&y<=G.y0+G.h+4&&x>=G.x0-4&&x<=G.x0+G.w+4){const n=Math.round((G.xv?G.xv(x):G.xmin+(x-G.x0)/G.w*(G.xmax-G.xmin)));if(n>=1&&n<=z.nmax)return{z,n};}}
  return null;
}
function applyDrag(x,y){
  const d=st.drag;if(!d)return;const G=d.z.G,c=st.c[d.n];
  const yv=G.yv?G.yv(y):G.ymax-(y-G.y0)/G.h*(G.ymax-G.ymin);
  if(d.z.type==='amp')c.a=Math.max(0,yv)/Math.max(1e-9,A.p.gain);
  else{c.p=Math.max(-180,Math.min(180,yv))*Math.PI/180}
  c.on=true;A.set('n',d.n,{silent:true});selSync(A);A.refresh();
}

</script>
