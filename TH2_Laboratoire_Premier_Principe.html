  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){

        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

'use strict';

'use strict';

function tint(T){const t=clamp((T+10)/120),c0=[47,111,214],c1=[150,150,150],c2=[214,52,52],m=(x,y,f)=>x.map((v,i)=>Math.round(v+(y[i]-v)*f)),t1=1/3;
  const c=t<t1?m(c0,c1,t/t1):m(c1,c2,(t-t1)/(1-t1));return `rgb(${c.join(',')})`;}
const reflect=(z,L)=>{const v=((z%(2*L))+2*L)%(2*L);return v<=L?v:2*L-v;};
/* positions de n particules dans [0,w]×[0,h] à l'instant t (agitation ∝ √T, trajectoires schématiques) */
function gasPts(n,t,w,h,Tk,k){const sp=40*k*Math.sqrt(Math.max(Tk,50)/300),out=[];
  for(let i=0;i<n;i++){const seed=((i+1)*.61803398875)%1,ang=i*2.39996323,s2=(i*.41421356237)%1;
    out.push([reflect(seed*w+Math.cos(ang)*sp*t,w),reflect(s2*h+Math.sin(ang)*sp*.7*t,h)]);}return out;}
/* cylindre horizontal à piston. o = {x,y,w,h,frac,Tk,t,Q,W,qmax,wmax,bloque,titre,tc}
   Renvoie {x,y,w,h,px} (px : abscisse du piston) ; flèches de Q (dessous) et de W (dessus) proportionnelles. */
function cylindre(a,o){
  const S=a.S,C=a.C,k=a.k,{x,y,w,h}=o,L=w*o.frac,px=x+L;let s='';
  s+=S.rect(x,y,L,h,{fill:o.tc||C.cSoft,op:o.tc?.28:.6});
  s+=S.path(`M${x+w},${y}H${x}V${y+h}H${x+w}`,{c:C.ink2,w:3});
  const n=o.n??46,r=Math.min(3.4*k,Math.max(2,Math.min(L,h)*.035)),iw=Math.max(4,L-2*r-8*k),ih=h-2*r-6*k;
  for(const q of gasPts(n,o.t||0,iw,ih,o.Tk||300,k))s+=S.circle(x+r+3*k+q[0],y+r+3*k+q[1],r,{fill:C.ink,op:.85});
  s+=S.rect(px-5*k,y-7*k,10*k,h+14*k,{fill:C.ink2,c:C.ink,w:1,rx:3*k});
  s+=S.line(px+5*k,y+h/2,Math.min(x+w+14*k,px+40*k),y+h/2,{c:C.ink2,w:6});
  s+=S.rect(Math.min(x+w+14*k,px+40*k)-4*k,y+h/2-14*k,8*k,28*k,{fill:C.ink2,rx:3*k});
  if(o.bloque){s+=S.rect(px-6*k,y-17*k,12*k,10*k,{fill:C.ink})+S.rect(px-6*k,y+h+7*k,12*k,10*k,{fill:C.ink});}
  const fr=S.rect(x-8*k,y-12*k,L+22*k,h+24*k,{c:C.cInk,w:1.6,dash:`${6*k} ${4*k}`,rx:8*k});s+=fr;
  const Lq=Math.min(70*k,w*.2);
  if(o.qmax&&Math.abs(o.Q||0)>o.qmax*.015){const l=Lq*Math.abs(o.Q)/o.qmax,xm=x+Math.min(L,w*.45)/2+L*.25,y1=y+h+10*k+Lq,y2=y+h+12*k;
    s+=o.Q>0?S.arrow(xm,y1,xm,y1-l,{c:C.hot,w:3}):S.arrow(xm,y1-l,xm,y1,{c:C.cold,w:3});
    s+=S.text(xm+10*k,y1-l/2,S.v('Q'),{size:15,c:o.Q>0?C.hot:C.cold});}
  if(o.wmax&&Math.abs(o.W||0)>o.wmax*.015){const l=Lq*1.1*Math.abs(o.W)/o.wmax,yy=y-26*k;
    s+=o.W>0?S.arrow(px+l/2,yy,px-l/2,yy,{c:C.B,w:3}):S.arrow(px-l/2,yy,px+l/2,yy,{c:C.B,w:3});
    s+=S.text(px,yy-13*k,S.v('W'),{size:15,c:C.B,anchor:'middle'});}
  return {x,y,w,h,px,svg:s};
}
/* glaçon en SVG (centre cx, cy ; côté side ; rotation rot en radians) */
function glacon(a,cx,cy,side,rot=0){
  if(side<.7)return '';const C=a.C,dark=C.dark,P=(u,v)=>[cx+(u*Math.cos(rot)-v*Math.sin(rot))*side,cy+(u*Math.sin(rot)+v*Math.cos(rot))*side];
  const front=dark?'#6b9caf':'#dcf1fa',top=dark?'#b1d7e5':'#f7fdff',right=dark?'#47788d':'#b8dbe9',edge=dark?'#bddfeb':'#6e9fb4',S=a.S;
  return S.poly([P(-.5,-.25),P(.32,-.25),P(.32,.55),P(-.5,.55)],{close:true,fill:front,c:edge,w:1.2})+
    S.poly([P(-.5,-.25),P(-.3,-.46),P(.52,-.46),P(.32,-.25)],{close:true,fill:top,c:edge,w:1.1})+
    S.poly([P(.32,-.25),P(.52,-.46),P(.52,.34),P(.32,.55)],{close:true,fill:right,c:edge,w:1.1});
}
/* dégradé vertical SVG */
const grad=(id,c1,c2)=>`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
/* point et étiquette dans un graphe G */
function repere(a,G,xv,yv,label,c,fill,dx=9,dy=-12){const S=a.S,k=a.k,X=G.X(xv),Y=G.Y(yv);
  if(!isFinite(X)||!isFinite(Y)||X<G.x0-2||X>G.x0+G.w+2||Y<G.y0-2||Y>G.y0+G.h+2)return '';
  const rgt=X>G.x0+G.w-34*k;
  return S.circle(X,Y,5*k,{fill:fill?c:a.C.card,c,w:2})+(label?S.text(X+(rgt?-dx:dx)*k,Y+dy*k,label,{anchor:rgt?'end':'start',size:13.5,c,weight:600}):'');}

/* scène « gaz sous piston » : cylindre mobile ; mémorise la géométrie pour le glisser du piston */
let dragP=null;
function sceneGaz(a,m,end,o){
  const P=a.panels.scene,S=a.S,C=a.C,k=a.k,w=P.w,h=P.h;
  const rmax=Math.max(1,end.V/m.V0),ch=Math.min(h*.30,w*.26);
  const cyl=cylindre(a,{x:w*.06,y:h*.34,w:w*.84,h:ch,frac:.9*(m.V/m.V0)/rmax,Tk:m.T||o.T0,t:clk,Q:o.Q,W:o.W,qmax:o.ref,wmax:o.ref,bloque:o.bloque,tc:tint((m.T||o.T0)-273.15)});
  dragP=o.mobile?{x:cyl.x,w:cyl.w,px:cyl.px,y:cyl.y,h:cyl.h,rmax,end}:null;
  return {svg:cyl.svg,cyl};
}

    s+=S.rect(xx,y,wi,hh,{fill:C.B,op:.2*dens,c:C.ink2,w:2,rx:13});}
  s+=S.rect(x+w1-2,cy-7,gap+4,14,{fill:C.card})+S.line(x+w1,cy-7,x2,cy-7,{c:C.ink2,w:2})+S.line(x+w1,cy+7,x2,cy+7,{c:C.ink2,w:2});

}

  if(q.kind==='metal'){const ox=x+wd*.65,oy=waterY+hgt*.09,ow=wd*.24,oh=hgt*.40;
    s+=S.rect(ox-ow/2,oy,ow,oh,{fill:C.dark?'#8a9aa4':'#c9d3d8',c:C.ink2,w:1.3,rx:4})+`<ellipse cx="${ox}" cy="${oy}" rx="${ow/2}" ry="${Math.max(4,ow*.13)}" fill="${C.dark?'#aab8c0':'#e3eaed'}" stroke="${C.ink2}"/>`+S.line(ox,oy,ox,y-12,{c:C.ink2,w:1})}
  else if(q.kind==='ice'&&m.solidMass>1e-7){
    if(m.liquidMass<1e-7){s+=S.rect(x+2,waterY,wd-4,waterH-2,{fill:C.dark?'#6b9caf':'#dcf1fa',op:.85,c:C.cold,w:1,rx:7});for(let i=0;i<5;i++)s+=S.line(x+wd*(.1+i*.18),waterY+7,x+wd*(.02+i*.18),bot-8,{c:C.card,w:1.5})}
    else{const ratio=m.solidMass/Math.max(q.addMass,.001),side=Math.min(wd*.18,hgt*.39)*Math.cbrt(Math.min(1.55,ratio)),icy=Math.min(waterY+side*.38,bot-side*.56);for(let i=0;i<4;i++)s+=glacon(a,x+wd*(.17+i*.22),icy+(i%2?1:-1)*side*.025,side,(i%2?1:-1)*.06)}}
  const probe=x+wd*.10;s+=S.line(probe,y-17,probe,bot-hgt*.22,{c:C.ink2,w:5})+S.line(probe,y-17,probe,bot-hgt*.22,{c:C.card,w:2})+S.circle(probe,bot-hgt*.22,3*k,{fill:C.hot});
  s+='</g>'+S.rect(x-18,y-15,wd+36,11,{fill:C.rule,c:C.ink2,w:1.2,rx:5})+S.rect(x-23,y-24,wd+46,hgt+43,{c:C.cInk,w:1.5,dash:`${7*k} ${5*k}`,rx:19});
  s+=S.text(w/2,h-34*k,q.kind==='ice'&&u>=1?(m.solidMass<1e-6?'Toute la glace a fondu':m.liquidMass<1e-6?'Toute l\'eau est solidifiée':'Équilibre eau–glace à 0 °C'):'Ensemble calorifugé',{anchor:'middle',size:14,c:C.cInk,weight:600});
  s+=S.text(w/2,h-12*k,`Temps du modèle : ${FM.fix(m.t/60,1)} min`,{anchor:'middle',size:13});

  t+=S.circle(G.X(m.t/60),G.Y(m.Ta),5*k,{fill:C.card,c:C.hot,w:2})+S.circle(G.X(m.t/60),G.Y(m.Tb),4.5*k,{fill:C.card,c:C.cold,w:2});

  const mets=[{label:'Température de l\'eau',value:FM.fix(m.Ta,1),unit:'°C'},{label:q.kind==='metal'?'Température du métal':q.kind==='ice'?'Température de l\'ajout':'Température eau 2',value:FM.fix(m.Tb,1),unit:'°C'}];
  if(q.kind==='ice')mets.push({label:'Masse de glace restante',value:FM.fix(m.solidMass*1000,1),unit:'g'});

  else mets.push(em('Q avec l\'extérieur',0));
  a.metrics(mets);
}

/* ---------- 4. Changements d'état ---------- */
function dPhases(a){
  const p=a.p,S=a.S,C=a.C,k=a.k,Ps=a.panels.scene,Pg=a.panels.graphe,w=Ps.w,h=Ps.h,q=ph(a),m=TH2P.volumePhase(q,u),heat=q.source==='heat',narrow=w<420;
  const x=w*.18,ww=w*.62,y=h*.30,hh=Math.max(70,h*.50),bot=y+hh;
  let s=S.text(w/2,20*k,heat?(narrow?'Σ = {eau} · P ≈ 1 bar':'Σ = {eau} · masse fixe · P ≈ 1 bar'):(narrow?'Σ = {eau + résistance}':'Σ = {eau + résistance} · P ≈ 1 bar'),{anchor:'middle',size:15,c:C.cInk,weight:600});
  s+=S.text(w/2,50*k,`${S.v('T')} = ${FM.fix(m.T,1)} °C`,{anchor:'middle',size:20,c:C.ink,weight:700});
  s+=`<defs><clipPath id="pc"><rect x="${x+3}" y="${y+3}" width="${ww-6}" height="${hh-6}" rx="5"/></clipPath></defs>`+S.rect(x,y,ww,hh,{fill:C.card,c:C.ink2,w:2.2,rx:8});
  s+='<g clip-path="url(#pc)">';
  const liqH=hh*(m.vapor>0?.08+.55*m.liquid:.12+.56*m.liquid),waterY=bot-liqH;
  if(m.liquid>0)s+=S.rect(x+3,waterY,ww-6,liqH-3,{fill:liquidTint(a,m.T)})+S.line(x+3,waterY,x+ww-3,waterY,{c:C.cold,w:1.2});
  if(m.solid>0){const side=Math.min(ww*.21,hh*.53)*Math.cbrt(m.solid),icy=m.liquid>0?Math.min(waterY+side*.38,bot-side*.56):bot-side*.56;for(let i=0;i<3;i++)s+=glacon(a,x+ww*(.23+i*.27),icy,side,(i-1)*.045)}
  if(m.vapor>0)for(let i=0;i<25;i++){const xx=x+10+((i*.618+clk*.035)%1)*(ww-20),yy=y+10+((i*.414+clk*.018)%1)*Math.max(1,waterY-y-19);s+=S.circle(xx,yy,2.4*k,{fill:C.cold})}
  s+='</g>'+S.rect(x-5,y-7,ww+10,9,{fill:C.rule,c:C.ink2,w:1.2,rx:3})+S.line(x+ww/2,y-7,x+ww/2,y-25,{c:C.ink2,w:5})+S.rect(x+ww*.29,y-34,ww*.42,10,{fill:C.rule,c:C.ink2,w:1,rx:3});
  s+=S.rect(x-10,y-14,ww+20,hh+(heat?25:42),{c:C.cInk,w:1.6,dash:`${7*k} ${5*k}`,rx:11});
  if(heat){const L=Math.max(20,Math.min(46,46*q.power/2000+10));s+=S.arrow(x+ww*.5,bot+12+L,x+ww*.5,bot+12,{c:C.hot,w:3.5})+S.text(x+ww*.5+14,bot+12+L/2,'Q reçu',{size:14,c:C.hot,weight:600})}
  else{s+=S.line(x+ww*.25,bot+40,x+ww*.25,bot+18,{c:C.B,w:2.3})+S.line(x+ww*.75,bot+40,x+ww*.75,bot+18,{c:C.B,w:2.3})+S.poly([[x+ww*.25,bot+18],[x+ww*.36,bot+13],[x+ww*.46,bot+22],[x+ww*.56,bot+13],[x+ww*.66,bot+22],[x+ww*.75,bot+18]],{c:C.hot,w:3})+S.text(x+ww/2,bot+40,`${mv('W','élec')} reçu`,{anchor:'middle',size:14,c:C.B,weight:600})}
  s+=S.text(w/2,h-12*k,m.phase+(m.vapor>0&&m.vapor<1?` · ${mv('x','G')} = ${FM.fix(m.vapor,2)}`:m.solid>0&&m.solid<1?` · fraction de glace ${FM.fix(m.solid,2)}`:''),{anchor:'middle',size:15,c:C.cInk,weight:600});
  a.svg('scene',s);
  let t='';
  if(p.ph_view==='temp'){
    const xmax=m.m*(m.hf-m.h0)/1000,G=S.graph({x:0,y:0,w:Pg.w,h:Pg.h,xmin:0,xmax,ymin:-35,ymax:165,xlab:'ΔH (kJ)',ylab:`${S.v('T')} (°C)`});
    t=S.clip('gc',G)+G.svg+S.curve(upto(f=>{const z=TH.phase(q,f);return [z.dH/1000,z.T]},300),G,{c:C.hot,w:3})+repere(a,G,m.dH/1000,m.T,'M',C.cInk,true,u<.15?10:-8,-13);
    phG={type:'temp',l:G.x0,r:G.x0+G.w};
  }else{
    const l=Pg.w*.14,r=Pg.w-16,tp=Pg.h*.14,bt=Pg.h-44*k,yy=tp+(bt-tp)*.65,X=hv=>l+hv/3100000*(r-l),hl=TH.cw*100,hg=hl+TH.Lv;
    t+=S.line(l,tp,l,bt,{c:C.ink2,w:1.3,raw:true})+S.line(l,bt,r,bt,{c:C.ink2,w:1.3,raw:true})+S.text(l,tp-14*k,S.v('P'),{size:14,c:C.ink2,halo:false})+S.text(r,bt+26*k,'h (kJ·kg<tspan dy="-0.5em" font-size="72%">−1</tspan><tspan dy="0.5em">)</tspan>',{anchor:'end',size:13,c:C.ink2,halo:false});
    t+=S.path(`M${X(80000)},${bt-5}C${X(100000)},${bt-25} ${X(hl*.7)},${yy+20} ${X(hl)},${yy}C${X(800000)},${yy-35} ${X(1500000)},${tp+8} ${X(2070000)},${tp+8}C${X(2660000)},${tp+8} ${X(2830000)},${yy-30} ${X(hg)},${yy}C${X(2780000)},${yy+23} ${X(2840000)},${bt-20} ${X(2850000)},${bt-5}`,{c:C.cold,w:2.4});
    t+=S.line(l,yy,r,yy,{c:C.ink2,w:1.2,dash:`${5*k} ${4*k}`})+S.text(l-6*k,yy,'1 bar',{anchor:'end',size:13,c:C.ink2,halo:false})+S.circle(X(hl),yy,4*k,{fill:C.cold})+S.circle(X(hg),yy,4*k,{fill:C.cold});
    t+=S.text(X(hl),yy+24*k,mv('h','L'),{anchor:'middle',size:14,c:C.cold})+S.text(X(hg),yy+24*k,mv('h','G'),{anchor:'middle',size:14,c:C.cold})+S.text(X(hl),bt+14*k,FM.fix(hl/1000,0),{anchor:'middle',size:13,c:C.ink2,halo:false})+S.text(X(hg),bt+14*k,FM.fix(hg/1000,0),{anchor:'middle',size:13,c:C.ink2,halo:false});
    t+=S.text((l+r)/2,tp+34*k,'Liquide + vapeur',{anchor:'middle',size:14,c:C.ink2});
    if(m.h>=0){t+=S.circle(X(m.h),yy,6*k,{fill:C.cInk,c:C.card,w:2})+S.text(X(m.h),yy-22*k,'M',{anchor:'middle',size:16,c:C.cInk,weight:700});
      if(m.vapor>0&&m.vapor<1){t+=S.line(X(hl),yy+6*k,X(m.h),yy+6*k,{c:C.cInk,w:4});if(Pg.h>250)t+=S.text((l+r)/2,bt-14*k,`${mv('x','G')} = LM/LG = ${FM.fix(m.vapor,2)}`,{anchor:'middle',size:15,c:C.cInk,weight:600})}}
    else t+=S.text(l+10*k,bt-18*k,'Le solide est hors de ce diagramme',{size:13,c:C.ink2});
    phG={type:'ph',l,r,h0:m.h0,hf:m.hf};
  }
  a.svg('graphe',t);
  a.legend(p.ph_view==='temp'?[{c:C.hot,label:'température en fonction de l\'énergie reçue'}]:[{c:C.cold,label:'courbe de saturation (schéma)'},{c:C.cInk,dot:true,label:'état M, glisser le long de l\'isobare'}]);
  a.metrics([em(heat?'ΔH = Q reçu':`ΔH = ${mv('W','élec')} reçu`,m.dH,`durée ${FM.fix(m.dH/q.power,0)} s`),em(`${WP} reçu`,m.W,'−P ΔV, P = 1 bar'),em(`Δ${M.v('U')}`,m.dU,'ΔH + W_P')]);
}
A.drag('graphe',{
  hit:(x)=>A.tab===3&&!!phG&&x>phG.l-10&&x<phG.r+10,
  start(){A.play(false)},
  move(x){if(!phG)return;const f=clamp((x-phG.l)/(phG.r-phG.l));
    if(phG.type==='ph'){const hv=clamp(f*3100000,TH.cw*100,TH.cw*100+TH.Lv);u=clamp((hv-phG.h0)/(phG.hf-phG.h0))}else u=f;A.t=u*DUREE}
});

/* ---------- 5. Joule–Thomson ---------- */
function dJT(a){
  const p=a.p,S=a.S,C=a.C,k=a.k,Ps=a.panels.scene,Pg=a.panels.graphe,w=Ps.w,h=Ps.h,q=jp(a),m=TH.throttle(q);
  const x=w*.06,ww=w*.88,y=h*.41,hh=h*.22,plug=x+ww*.5;
  let s=S.text(w/2,20*k,w<420?'Stationnaire · calorifugé':'Écoulement stationnaire · paroi calorifugée',{anchor:'middle',size:15,c:C.cInk,weight:600});
  s+=S.rect(x,y,ww*.48,hh,{fill:tint(m.T1-273.15),op:.8})+S.rect(plug,y,ww*.5,hh,{fill:tint(m.T2-273.15),op:.8})+S.line(x,y,x+ww,y,{c:C.ink,w:3})+S.line(x,y+hh,x+ww,y+hh,{c:C.ink,w:3});
  s+=S.rect(plug-12,y-5,24,hh+10,{fill:C.rule,c:C.ink,w:1});for(let i=0;i<8;i++)s+=S.circle(plug-7+(i%2)*14,y+7+Math.floor(i/2)*(hh-12)/4,2*k,{fill:C.card});
  s+=S.rect(x-6,y-12,ww+12,hh+24,{c:C.cInk,w:1.6,dash:`${7*k} ${5*k}`,rx:7});
  for(let i=0;i<20;i++){const xx=x+((i/20+u*.7)%1)*ww;if(Math.abs(xx-plug)>17)s+=S.circle(xx,y+hh*(.2+(i%3)*.28),2.6*k,{fill:C.ink})}
  s+=S.arrow(x+10,y+hh+39,x+ww-10,y+hh+39,{c:C.B,w:2.5})+S.text(w/2,y+hh+64,'Sens de l\'écoulement',{anchor:'middle',size:14,c:C.ink2});
  s+=S.text(x+ww*.22,y-58,`${S.v('P',1)} = ${FM.fix(q.up,1)} bar`,{anchor:'middle',size:15,c:C.B,weight:600})+S.text(x+ww*.78,y-58,`${S.v('P',2)} = ${FM.fix(q.down,1)} bar`,{anchor:'middle',size:15,c:C.B,weight:600});
  s+=S.text(x+ww*.22,y-30,`${S.v('T',1)} = ${FM.fix(m.T1,1)} K`,{anchor:'middle',size:16,c:C.ink,weight:600})+S.text(x+ww*.78,y-30,`${S.v('T',2)} = ${FM.fix(m.T2,1)} K`,{anchor:'middle',size:16,c:C.ink,weight:600});
  a.svg('scene',s);
  const hm=m.h1/28,mg=Math.max(60,hm*.15);
  const G=S.graph({x:0,y:0,w:Pg.w,h:Pg.h,xmin:hm-mg,xmax:hm+mg,ymin:0,ymax:q.up*1.2,xlab:`h (kJ·kg${S.sup('−1')})`,ylab:`${S.v('P')} (bar)`,nx:2});
  let t=S.clip('gc',G)+G.svg+S.curve([[hm,q.up],[hm,q.down]],G,{c:C.cInk,w:2.5,dash:`${6*k} ${4*k}`})+repere(a,G,hm,q.up,'Amont',C.B,true,-8,-11)+repere(a,G,hm,q.down,'Aval',C.hot,true,8,12);
  a.svg('graphe',t);a.legend([{c:C.cInk,dash:true,label:`${'h'}<sub>aval</sub> = ${'h'}<sub>amont</sub>`}]);
  a.metrics([{label:'Température aval',value:FM.fix(m.T2,2),unit:'K'},{label:`${mv('T','aval')} − ${mv('T','amont')}`,value:(m.dT>=0?'+':'−')+FM.fix(Math.abs(m.dT),2),unit:'K'},{label:`${mv('h','aval')} − ${mv('h','amont')}`,value:FM.fix((m.h2-m.h1)/28,3),unit:'kJ·kg<sup>−1</sup>'}]);
}
