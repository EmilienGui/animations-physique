   Une animation décrit sa configuration et ses fonctions :

       code:'OP1', partie:'TurquoiseLagon', titre:'…', sousTitre:'…', chapitre:'OP1 Propagation de la lumière',

       temps:true | (app)=>bool,                          // barre de lecture

       aide:{voit, faire, modele, cours},
       init(app), reset(app), step(app,dt), draw(app), change(app,id,v), onglet(app,i)
     })
   Le kit fournit : app.p (paramètres), app.tab, app.t, app.C (couleurs), app.k (échelle projection),
   app.S (dessin SVG), app.fmt (nombres), app.metrics(), app.insight(), app.legend(), app.clock(), app.drag()…
   Réglage à échelle logarithmique : {id,type:'range',log:true,min,max,dec} (curseur en log10, champ numérique en valeur réelle).
   Disposition facultative  atelier:{saisie:'Mes mesures', detail:'Voir le calcul'} : app.zones.saisie / .resultat / .detail

const MINUS='−';

/* ---------------- nombres : point décimal, vrai signe moins ---------------- */

  /** n chiffres significatifs, sans notation exponentielle */
  sig(x,n=3){

    const e=Math.floor(Math.log10(Math.abs(x)));

    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){

        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

// @description Œil réduit (accommodation, myopie, hypermétropie, presbytie, astigmatisme et correction), photographie réelle (ouverture, temps de pose, focale) et construction de la profondeur de champ.
'use strict';
/* =====================================================================
   OP2 · Œil et appareil photographique
   Physique : Optics (../_Sources_Ateliers/optics.js) et RasterOptics
   (../_Sources_Ateliers/raster.js), moteurs d'origine inchangés.
   - Œil réduit : lentille paraxiale de vergence V = P + A (A : accommodation),
     rétine fixe à L = OA′ ; verre correcteur au contact, sphérique et
     cylindrique (matrice de vergence 2 × 2). Pupille de rayon 2.5 mm.
   - Photographie : panorama réel projeté (rectilinéaire r = f′ tan θ ou fisheye
     r = f′ θ), capteur 36 mm × 24 mm, tache c = D |v − v₀|/v (cours), exposition
     ∝ τ/NO², filé horizontal pendant la pose. Profondeurs de la pièce estimées.
   - Profondeur de champ : lentille mince, D = f′/NO, limites exactes
     A₁, A₂ : c = Φ (notations du cours).
   ===================================================================== */

  aide:{

    const sx=r.u*N.w-.5,sy=O.clamp(r.v*N.h-.5,0,N.h-1),x0=(Math.floor(sx)+N.w)%N.w,x1=(x0+1)%N.w,y0=Math.floor(sy),y1=Math.min(N.h-1,y0+1),fx=sx-Math.floor(sx),fy=sy-y0;
    const wt=[(1-fx)*(1-fy),fx*(1-fy),(1-fx)*fy,fx*fy],id=[(y0*N.w+x0)*4,(y0*N.w+x1)*4,(y1*N.w+x0)*4,(y1*N.w+x1)*4];
    for(let c=0;c<3;c++)base[dst+c]=wt[0]*N.d[id[0]+c]+wt[1]*N.d[id[1]+c]+wt[2]*N.d[id[2]+c]+wt[3]*N.d[id[3]+c]}
  const lv=[0,1,2,4,7,11,17,26]; pyramide={w,h,lv,data:lv.map(r=>r?R.blur(base,w,h,r):base),inv,mask,vk};
}
function tempsPose(a){return a.p.autoexp?(a.p.N/2.8)**2/125:1/a.p.shutter}
function rendrePhoto(a){
  const p=a.p,t=tempsPose(a),key=JSON.stringify([p.N,p.f,p.focus,t,p.motion,p.speed,p.projection,st.photoYaw,st.photoPitch]);
  preparer(a); if(!pyramide)return null; if(rendu.key===key)return rendu.cv; rendu.key=key;
  const {w,h,lv,data,inv,mask}=pyramide, cv=rendu.cv; cv.width=w; cv.height=h;
  const c=cv.getContext('2d'), img=c.createImageData(w,h), d=img.data, ex=t*125*(2.8/p.N)**2;
  const lut=Array.from({length:256},(_,j)=>O.clamp(linSrgb(srgbLin(j)*ex),0,255));

    const sg=fct*Math.abs(inv[i]-invF);let j=0;while(j<lv.length-2&&sg>lv[j+1])j++;const b=O.clamp((sg-lv[j])/(lv[j+1]-lv[j]),0,1);

let rectPhoto=null;
function photo(a){
  const P=a.panels.photo, c=P.ctx, C=a.C, p=a.p, k=a.k;
  c.fillStyle=C.card;c.fillRect(0,0,P.w,P.h);

  else{c.fillStyle=C.ink2;c.font=`${15*k}px ${AnimKit.FONT}`;c.textAlign='center';c.fillText('Chargement de la photographie…',P.w/2,P.h/2)}
  if(st.focusPick&&cv){const q=pointPhoto(a,st.focusPick.u,st.focusPick.v);if(q&&q.x>=0&&q.x<=1&&q.y>=0&&q.y<=1){const xx=x+q.x*pw,yy=y+q.y*ph;
    c.lineWidth=2.5*k;c.strokeStyle='#ffffff';c.beginPath();c.arc(xx,yy,10*k,0,2*Math.PI);c.stroke();c.lineWidth=1.2*k;c.strokeStyle='#142c2a';c.beginPath();c.arc(xx,yy,12.5*k,0,2*Math.PI);c.stroke()}}

  const tps=t<1?`1/${sig(1/t,3)}`:fix(t,2);

    {label:`Ouverture et temps de pose`,value:`f/${fix(p.N,1)} · ${tps} s`},
    {label:'Zone nette (profondeur de champ)',value:cache(`${sig(d.near/1000,2)} à ${Number.isFinite(d.far)?sig(d.far/1000,2):'∞'}`,p.res),unit:p.res?'m':''},
    {label:'Exposition relative (réf. f/2.8, 1/125 s)',value:sig(t*125*(2.8/p.N)**2,2),unit:'×'}]);
  a.insight(p.projection==='fisheye'?'Projection fisheye : <i class="m">r</i> = <i class="m">f</i>′θ, les droites qui ne passent pas par le centre se courbent ; le flou de profondeur n\'est ici qu\'indicatif.'
    :p.motion?'L\'appareil tourne pendant la pose : plus le temps de pose est long, plus le filé est marqué.'
    :'Fermer le diaphragme (augmenter <i class="m">NO</i>) agrandit la zone nette mais assombrit l\'image : il faut allonger le temps de pose τ.');

A.drag('photo',{hit:(x,y)=>A.tab===1&&rectPhoto&&pyramide&&x>=rectPhoto.x&&x<=rectPhoto.x+rectPhoto.w&&y>=rectPhoto.y&&y<=rectPhoto.y+rectPhoto.h,
  start(x,y){const r=rectPhoto,Pm=pyramide,px=O.clamp(Math.floor((x-r.x)/r.w*Pm.w),0,Pm.w-1),py=O.clamp(Math.floor((y-r.y)/r.h*Pm.h),0,Pm.h-1),i=py*Pm.w+px;
    if(!Pm.mask[i])return; const ray=rayonPhoto(A,px,py,Pm.w,Pm.h); A.set('focus',+O.clamp(1/Pm.inv[i]/1000,.35,100).toFixed(2)); st.focusPick={u:ray.u,v:ray.v}},
  move(){}});

/* ===================== 3 · PROFONDEUR DE CHAMP ===================== */
function prof(a){return O.depth(a.p.focus*1000,a.p.f,a.p.N,a.p.criterion/1000)}
function pdc(a){
  const P=a.panels.pdc, S=a.S, C=a.C, k=a.k, p=a.p, cc=K.couleurs(a), nr=p.nr;
  K.vider('pdc');
  const foc=p.focus*1000, d=prof(a), D=p.f/p.N, probe=p.probe*1000, c0=p.criterion/1000;
  const umax=Math.max(foc*1.45,d.near*1.5,Math.min(Number.isFinite(d.far)?d.far:foc*2.2,foc*3),Math.min(probe,foc*3));
  const vmax=Math.max(d.v0,p.f)*1.25, xmin=16*k, lx=P.w*.6, xmax=P.w-14*k, cy=P.h*.45, hmax=P.h*.32;
  const ox=u=>lx-(u/umax)*(lx-xmin), ix=v=>lx+v/vmax*(xmax-lx), ys=hmax/(D/2);
  let s=S.arrow(xmin-6*k,cy,xmax,cy,{c:C.ink2,w:1.1,dash:`${7*k} ${5*k}`,head:9*k});
  s+=K.lentille(a,lx,1,cy-hmax*1.08,cy+hmax*1.08,'objectif',{size:14});
  s+=S.text(lx-7*k,cy+8*k,'O',{anchor:'end',base:'top',size:15,c:C.ink2,math:true});
  const sp=ix(d.v0);
  s+=S.line(sp,cy-hmax*1.12,sp,cy+hmax*1.12,{c:C.E,w:3.2})+S.text(sp+6*k,cy-hmax*1.12,'capteur',{base:'top',size:14,c:C.E});
  const fpx=ix(p.f);s+=S.line(fpx,cy-5*k,fpx,cy+5*k,{c:C.ink2,w:1.6})+S.text(fpx,cy+9*k,S.v('F′'),{anchor:'middle',base:'top',size:15,c:C.ink2,math:true});
  // bande de profondeur de champ
  if(nr>=3){const L1=ox(Number.isFinite(d.far)?Math.min(d.far,umax):umax),R1=ox(d.near);
    s+=S.rect(L1,cy+hmax*1.2,R1-L1,10*k,{fill:C.v,fop:.35})+S.text((L1+R1)/2,cy+hmax*1.2+14*k,'profondeur de champ'+(Number.isFinite(d.far)&&d.far<=umax?'':' (jusqu\'à l\'infini)'),{anchor:'middle',base:'top',size:13,c:C.v})}
  const items=[{u:foc,nom:S.v('A','0'),c:C.E,step:1},{u:d.near,nom:S.v('A','1'),c:cc.r[1],step:2},{u:d.far,nom:S.v('A','2'),c:cc.plan,step:3},{u:probe,nom:'test',c:C.F,step:3,test:true}];
  for(const it of items){if(nr<it.step)continue;const fin=Number.isFinite(it.u),v=fin?p.f*it.u/(it.u-p.f):p.f,x=fin?ox(Math.min(it.u,umax)):xmin;
    for(const sg of[-1,1]){const h=sg*D/2,endY=h*(1-vmax/v);s+=K.rayon(a,[[x,fin?cy:cy-h*ys],[lx,cy-h*ys],[xmax,cy-endY*ys]],it.c,{w:1.6,fleches:sg>0})}}
  for(const it of items){if(nr<it.step&&!it.test)continue;const fin=Number.isFinite(it.u),x=fin?ox(Math.min(it.u,umax)):xmin;
    s+=S.circle(x,cy,4.2*k,{fill:it.c})+S.text(x,cy+(it.test?-12:it.step===2?12:-12)*k,it.nom+(fin?'':' (∞)'),{anchor:'middle',base:it.test||it.step!==2?'bottom':'top',size:15,c:it.c,math:!it.test})}
  s+=K.poignee(a,'pdc',ox(Math.min(probe,umax)),cy,x=>a.set('probe',+K.clamp((lx-x)/(lx-xmin)*umax/1000,.1,100).toFixed(2)),{c:C.F});
  s+=S.text(xmin,8*k,'objets : échelle en mètres · images : échelle en millimètres',{base:'top',size:13,c:C.ink2});
  a.svg('pdc',s);
  zoomCapteur(a,items,d,D,c0);
  const vp=O.photo(probe,foc,p.f,p.N), net=vp.c<=c0*(1+1e-8);
  a.metrics([
    {label:`Limite proche ${M.v('A','1')}`,value:cache(sig(d.near/1000,3),p.res),unit:p.res?'m':''},
    {label:`Limite lointaine ${M.v('A','2')}`,value:cache(Number.isFinite(d.far)?sig(d.far/1000,3):'∞',p.res),unit:p.res&&Number.isFinite(d.far)?'m':''},
    {label:'Diamètre de la tache du point test',value:sig(vp.c*1000,3),unit:'µm',warn:!net}]);
  a.insight(nr<3?'Le capteur est placé à l\'image A′<sub>0</sub> du plan de mise au point ; les points plus proches ou plus lointains donnent une tache sur le capteur.'
    :net?'Le point test est dans la profondeur de champ : sa tache a un diamètre <i class="m">c</i> ≤ Φ.':'Le point test est hors de la profondeur de champ : sa tache a un diamètre <i class="m">c</i> > Φ.');
  a.legend([{c:C.E,label:'Plan de mise au point'},nr>=2?{c:cc.r[1],label:'Limite proche'}:null,nr>=3?{c:cc.plan,label:'Limite lointaine'}:null,nr>=3?{c:C.F,label:'Point test'}:null]);
}
function zoomCapteur(a,items,d,D,c0){
  const P=a.panels.zoomc, S=a.S, C=a.C, k=a.k, p=a.p, w=P.w, h=P.h, h1=h*.52;
  const vs=items.map(it=>Number.isFinite(it.u)?p.f*it.u/(it.u-p.f):p.f), v0=d.v0;
  const del=Math.max(.06,...vs.map((v,i)=>p.nr>=items[i].step?Math.abs(v-v0):0))*1.3, xlo=v0-del, xhi=v0+del, X=v=>12*k+(v-xlo)/(xhi-xlo)*(w-24*k), cy=h1*.5;
  let mx=.001;vs.forEach(v=>{mx=Math.max(mx,Math.abs(D/2*(1-xlo/v)),Math.abs(D/2*(1-xhi/v)))});

  s+=S.line(0,h1+6*k,w,h1+6*k,{c:C.rule,w:1,raw:true});

  const ci=[{nom:'proche',c:items[1].c,diam:O.photo(d.near,p.focus*1000,p.f,p.N).c,step:2},{nom:'plan net',c:C.E,diam:0,step:1},
    {nom:'lointaine',c:items[2].c,diam:Number.isFinite(d.far)?O.photo(d.far,p.focus*1000,p.f,p.N).c:D*Math.abs(1-v0/p.f),step:3},
    {nom:'test',c:C.F,diam:O.photo(p.probe*1000,p.focus*1000,p.f,p.N).c,step:0}];

  s+=S.text(10*k,h1+12*k,'taches sur le capteur ; Φ en pointillés',{base:'top',size:13,c:C.ink2,halo:false});
  ci.forEach((q,j)=>{const x=w*(j+.5)/4;s+=S.circle(x,yc,c0/2*fct,{c:C.ink2,w:1,dash:`${3*k} ${3*k}`});
    if(p.nr>=q.step)s+=S.circle(x,yc,Math.max(1.2*k,q.diam/2*fct),{c:q.c,w:2.2,fill:q.c,op:1,style:'fill-opacity:.18'});
    s+=S.text(x,yc+rr+6*k,q.nom,{anchor:'middle',base:'top',size:13,c:q.c,halo:false});
    if(p.res&&p.nr>=q.step)s+=S.text(x,yc+rr+24*k,`${sig(q.diam*1000,2)} µm`,{anchor:'middle',base:'top',size:13,c:C.ink2,halo:false})});
  a.svg('zoomc',s);
}
