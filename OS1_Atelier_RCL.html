<script>
/* =====================================================================
   AnimKit · script commun des animations de MPSI
   E. Guillaume · charte du 2 novembre 2026 (Charte_Animations.html)

   Une animation décrit sa configuration et ses fonctions :
     AnimKit.app({
       code:'OP1', partie:'TurquoiseLagon', titre:'…', sousTitre:'…', chapitre:'OP1 Propagation de la lumière',
       onglets:['Vue de face','Perspective'],            // facultatif
       temps:true | (app)=>bool,                          // barre de lecture
       pas:1/24,                                          // durée simulée d'un « Pas »
       panneaux:[{id:'scene', titre:'…', poids:2, type:'svg'|'canvas', onglets:[0], ratioTel:.8, zoom:true}],
       reglages:[{titre:'Situations', presets:[{label, valeurs:{…}, lecture:true}]},
                 {titre:'…', items:[{id,type:'range'|'select'|'seg'|'check'|'boutons'|'note', …}], onglets:[…], si:(app)=>bool}],
       aide:{voit, faire, modele, cours},
       init(app), reset(app), step(app,dt), draw(app), change(app,id,v), onglet(app,i)
     })
   Le kit fournit : app.p (paramètres), app.tab, app.t, app.C (couleurs), app.k (échelle projection),
   app.S (dessin SVG), app.fmt (nombres), app.metrics(), app.insight(), app.legend(), app.clock(), app.drag()…
   Réglage à échelle logarithmique : {id,type:'range',log:true,min,max,dec} (curseur en log10, champ numérique en valeur réelle).
   Disposition facultative  atelier:{saisie:'Mes mesures', detail:'Voir le calcul'} : app.zones.saisie / .resultat / .detail
   (nœuds DOM à remplir par l'animation) ; pas de colonne de réglages.
   ===================================================================== */
(function(){
'use strict';
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const MATH='"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif';
const MINUS='−';

/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  /** n chiffres significatifs, sans notation exponentielle */
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e<-3||e>=6){const m=x/10**e;return (+m.toFixed(n-1)).toFixed(n-1).replace('-',MINUS)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>'}
    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

function makeS(app){

    FONT,MATH,

    v(sym,sub,sup){

      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;

    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();

      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;

      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});

<script>
/* Physique d'origine, inchangée (extraite du HTML d'avant AnimKit). */
'use strict';
// Modèle indépendant de l'affichage, en unités SI. La tension de L réelle inclut r i.
window.RCLModel=Object.freeze({
 capacitance(areaCM2,gapMM){return 8.8541878128e-12*areaCM2*1e-4/(gapMM*1e-3)},
 resistance(lengthCM,sectionMM2){return 1e-6*lengthCM*.01/(sectionMM2*1e-6)},
 sample(s){const e=s.phase==='source'?s.E:0,r=s.real?s.r:0;
  if(s.tab==='R'){const u=e,i=u/s.R;return {u,i,p:u*i,stored:0,idealU:u,du:0,di:0,q:0,tau:.001}}
  if(s.tab==='C'){const u=s.x,i=s.phase==='isolated'?0:(e-u)/s.Rs;return {u,i,p:u*i,stored:.5*s.C*u*u,idealU:u,du:i/s.C,di:-i/(s.Rs*s.C),q:s.C*u,tau:s.Rs*s.C}}
  const i=s.x,idealU=e-(s.Rs+r)*i,u=idealU+r*i;return {u,i,p:u*i,stored:.5*s.L*i*i,idealU,du:-s.Rs*idealU/s.L,di:idealU/s.L,q:0,tau:s.L/(s.Rs+r)};
 },
 advance(s,dt){if(!(dt>=0)||!Number.isFinite(dt))throw new RangeError('Durée invalide');const before=this.sample(s),e=s.phase==='source'?s.E:0;let x=s.x,work=0;
  if(s.tab==='R')work=before.p*dt;
  else if(s.tab==='C'&&s.phase!=='isolated'){x=e+(s.x-e)*Math.exp(-dt/before.tau);work=e*s.C*(x-s.x)}
  else if(s.tab==='L'){const r=s.Rs+(s.real?s.r:0),steady=e/r,a=-Math.expm1(-dt/before.tau);x=s.x+(steady-s.x)*a;work=e*(steady*dt+(s.x-steady)*before.tau*a)}
  const after=this.sample({...s,x}),joule=work-(after.stored-before.stored);return {x,work,joule:Math.max(0,joule),after};
 }
});

/* =====================================================================
   Outils communs des animations d'électrocinétique (OS1, OS2) · AnimKit · lot 13
   - OSK.unit(max, u)  : préfixe SI lisible (k, m, µ, n) ; renvoie {f, u}
   - OSK.plot(a, o)    : graphe temporel (ou autre) avec séries, remplissage signé, repères, curseur
   - OSC.*             : symboles de circuit (copie des symboles d'EM4), flèches de tension et de courant
   ===================================================================== */
'use strict';
globalThis.OSK=(()=>{
  const PREF=[[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n'],[1e-12,'p']];
  function unit(max,u){
    max=Math.abs(max);
    if(!(max>0)||!isFinite(max))return {f:1,u};
    for(const[s,p]of PREF)if(max>=s*.9995)return {f:1/s,u:p+u};
    return {f:1e12,u:'p'+u};
  }
  /** valeur et unité en texte : « 2.02 ms » */
  const qty=(a,x,u)=>{const q=unit(x,u);return a.fmt.sig(x*q.f,3)+' '+q.u};
  const thin=(pts,n=700)=>{if(pts.length<=n)return pts;const st=pts.length/n,o=[];for(let i=0;i<n;i++)o.push(pts[Math.floor(i*st)]);o.push(pts[pts.length-1]);return o};
  /**
   * o = {box,xmin,xmax,ymin?,ymax?,sym?,zero?,xlab,ylab,id,series:[{pts,c,w,dash,op}],
   *      signed:{pts,pos,neg}, hlines:[{y,c,dash,label}], marks:[{x,label,c}], cursor:x, dots:[{x,y,c}],
   *      tangent:{x,y,slope,half,c}, yticks, xticks, xfmt, yfmt, padL}
   */
  function plot(a,o){
    const S=a.S,k=a.k,C=a.C,box=o.box;
    let lo=o.ymin,hi=o.ymax;
    if(lo===undefined||hi===undefined){
      let l=Infinity,h=-Infinity;
      const scan=ps=>{for(const[x,y]of ps)if(isFinite(y)&&x>=o.xmin-1e-12&&x<=o.xmax+1e-12){if(y<l)l=y;if(y>h)h=y}};
      for(const s of o.series||[])scan(s.pts);
      if(o.signed)scan(o.signed.pts);
      for(const hl of o.hlines||[])if(isFinite(hl.y)){if(hl.y<l)l=hl.y;if(hl.y>h)h=hl.y}
      if(o.zero!==false){l=Math.min(l,0);h=Math.max(h,0)}
      if(!(h-l>1e-30)){h=1;l=o.sym?-1:0}
      if(o.sym){const m=Math.max(Math.abs(l),Math.abs(h));l=-m;h=m}
      const pd=(h-l)*.08;lo=o.ymin??(l-(l<0?pd:0));hi=o.ymax??(h+pd);
    }
    const G=S.graph({x:box.x+2*k,y:box.y+2*k,w:box.w-4*k,h:box.h-4*k,xmin:o.xmin,xmax:o.xmax,ymin:lo,ymax:hi,xlab:o.xlab,ylab:o.ylab,
      xticks:o.xticks,yticks:o.yticks,xfmt:o.xfmt,yfmt:o.yfmt,padL:o.padL,padB:o.padB,xlabels:o.xlabels});
    const id=(o.id||'g')+Math.round(box.y)+'_'+Math.round(box.x);
    let s=G.svg+S.clip(id,G);
    const inside=(ps)=>ps;
    if(o.signed){
      const pts=thin(o.signed.pts),y0=G.Y(0),pos=[],neg=[];
      for(const[x,y]of pts){if(!isFinite(y))continue;pos.push([G.X(x),G.Y(Math.max(0,y))]);neg.push([G.X(x),G.Y(Math.min(0,y))])}
      const poly=(arr,c)=>arr.length>1?`<path d="M${arr[0][0].toFixed(1)},${y0.toFixed(1)}${arr.map(p=>`L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('')}L${arr[arr.length-1][0].toFixed(1)},${y0.toFixed(1)}Z" fill="${c}" fill-opacity=".28" stroke="none"/>`:'';
      s+=`<g clip-path="url(#${id})">${poly(pos,o.signed.pos)}${poly(neg,o.signed.neg)}</g>`;
    }
    for(const hl of o.hlines||[]){if(!isFinite(hl.y))continue;
      s+=S.line(G.x0,G.Y(hl.y),G.x0+G.w,G.Y(hl.y),{c:hl.c||C.pred,w:1.3,dash:hl.dash===false?undefined:`${6*k} ${4*k}`,op:.85});
      if(hl.label)s+=S.text(G.x0+G.w-3*k,G.Y(hl.y)-9*k,hl.label,{anchor:'end',size:13,c:hl.c||C.ink2});}
    for(const m of o.marks||[]){if(m.x<o.xmin||m.x>o.xmax)continue;
      s+=S.line(G.X(m.x),G.y0,G.X(m.x),G.y0+G.h,{c:m.c||C.pred,w:1.2,dash:`${2*k} ${3*k}`,op:.7})+S.text(G.X(m.x)+4*k,G.y0+4*k,m.label,{base:'top',size:13,c:m.c||C.ink2});}
    for(const sr of o.series||[])s+=S.curve(thin(sr.pts),G,{c:sr.c,w:sr.w??2.6,dash:sr.dash?`${7*k} ${4*k}`:undefined,op:sr.op});
    if(o.tangent){const t=o.tangent,h=t.half;s+=S.curve([[t.x-h,t.y-t.slope*h],[t.x+h,t.y+t.slope*h]],G,{c:t.c||C.pred,w:1.8,dash:`${5*k} ${3*k}`});}
    if(o.cursor!==undefined&&o.cursor>=o.xmin&&o.cursor<=o.xmax)s+=S.line(G.X(o.cursor),G.y0,G.X(o.cursor),G.y0+G.h,{c:C.ink2,w:1,dash:`${3*k} ${4*k}`});
    for(const d of o.dots||[])if(isFinite(d.y)&&d.x>=o.xmin&&d.x<=o.xmax)s+=S.circle(G.X(d.x),G.Y(d.y),4*k,{fill:d.c});
    return {svg:s,G};
  }
  return Object.freeze({unit,qty,plot,thin});
})();

/* Symboles de circuit (normes françaises usuelles), en pixels d'écran. a = application AnimKit. */
globalThis.OSC=(()=>{
  const W=(a,x1,y1,x2,y2,c)=>a.S.line(x1,y1,x2,y2,{c:c||a.C.ink,w:2});
  function res(a,x1,y1,x2,y2,o={}){if(!(Math.hypot(x2-x1,y2-y1)>1))return '';const S=a.S,k=a.k,c=o.c||a.C.ink,L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L,len=Math.min(o.len??34*k,L*.8),wd=o.wd??11*k,mx=(x1+x2)/2,my=(y1+y2)/2;
    const p=(s,t)=>[mx+ux*s-uy*t,my+uy*s+ux*t];const q=[p(-len/2,-wd/2),p(len/2,-wd/2),p(len/2,wd/2),p(-len/2,wd/2)];
    return W(a,x1,y1,mx-ux*len/2,my-uy*len/2,c)+W(a,mx+ux*len/2,my+uy*len/2,x2,y2,c)+S.poly(q,{c,w:2,fill:o.fill||a.C.card,close:true});}
  function ind(a,x1,y1,x2,y2,o={}){if(!(Math.hypot(x2-x1,y2-y1)>1))return '';const S=a.S,k=a.k,c=o.c||a.C.ink,L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L,len=Math.min(o.len??44*k,L*.85),n=4,r=len/(2*n),mx=(x1+x2)/2,my=(y1+y2)/2,sd=o.side??1;
    const s0=[mx-ux*len/2,my-uy*len/2];let d=`M${s0[0].toFixed(1)},${s0[1].toFixed(1)}`;
    for(let j=0;j<n;j++){const e=[s0[0]+ux*2*r*(j+1),s0[1]+uy*2*r*(j+1)];d+=`A${r.toFixed(1)},${r.toFixed(1)} 0 0 ${sd>0?1:0} ${e[0].toFixed(1)},${e[1].toFixed(1)}`;}
    return W(a,x1,y1,s0[0],s0[1],c)+W(a,mx+ux*len/2,my+uy*len/2,x2,y2,c)+S.path(d,{c,w:2.4});}
  function gen(a,x,y,o={}){const S=a.S,k=a.k,c=o.c||a.C.ink,r=o.r??15*k;let s=S.circle(x,y,r,{fill:a.C.card,c,w:2});
    if(o.type==='~')s+=S.path(`M${x-r*.55},${y}c${r*.18},${-r*.5} ${r*.37},${-r*.5} ${r*.55},0s${r*.37},${r*.5} ${r*.55},0`,{c,w:1.8});
    else s+=S.line(x,y-r,x,y+r,{c,w:2});
    return s;}
  function sw(a,x1,y,x2,open,o={}){const S=a.S,k=a.k,c=o.c||a.C.ink;return S.circle(x1,y,2.6*k,{fill:c})+S.circle(x2,y,2.6*k,{fill:c})+S.line(x1,y,open?x2-2*k:x2,open?y-(x2-x1)*.55:y,{c,w:2.2});}
  function cap(a,x1,y1,x2,y2,o={}){if(!(Math.hypot(x2-x1,y2-y1)>1))return '';const S=a.S,k=a.k,c=o.c||a.C.ink,L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L,g=4*k,hw=11*k,mx=(x1+x2)/2,my=(y1+y2)/2;
    const p=(t,n)=>[mx+ux*t-uy*n,my+uy*t+ux*n];
    return W(a,x1,y1,...p(-g,0),c)+W(a,...p(g,0),x2,y2,c)+S.line(...p(-g,-hw),...p(-g,hw),{c,w:2.4})+S.line(...p(g,-hw),...p(g,hw),{c,w:2.4});}
  /** flèche de tension (à côté d'un dipôle), de (x1,y1) vers (x2,y2) */
  function volt(a,x1,y1,x2,y2,lab,o={}){const S=a.S,k=a.k,c=o.c||a.C.F;return S.arrow(x1,y1,x2,y2,{c,w:1.8,dash:o.dash})+S.text((x1+x2)/2+(o.dx??10*k),(y1+y2)/2+(o.dy??0),lab,{size:15,c,anchor:o.anchor||'start'});}
  /** flèche de courant (référence) sur un fil */
  function cur(a,x,y,dir,lab,o={}){const S=a.S,k=a.k,c=o.c||a.C.E,L=o.len??18*k,d=dir==='l'?[-1,0]:dir==='r'?[1,0]:dir==='u'?[0,-1]:[0,1];
    return S.arrow(x-d[0]*L/2,y-d[1]*L/2,x+d[0]*L/2,y+d[1]*L/2,{c,w:2.4,head:9*k})+S.text(x+(o.lx??(d[1]?12*k:0)),y+(o.ly??(d[0]?-14*k:0)),lab,{size:15,c,anchor:d[1]?'start':'middle'});}
  function solenoid(a,x1,x2,cy,r,o={}){const S=a.S,k=a.k,c=o.c||a.C.E,n=o.turns??14;let s='';
    if(o.fill)s+=S.rect(x1,cy-r,x2-x1,2*r,{fill:o.fill,fop:o.fop??.2});

// @titre L'atelier des dipôles R, C et L · OS1 · MPSI
// @sortie ../OS1_Atelier_RCL/OS1_Atelier_RCL.html
// @inclure OS1_Atelier_RCL_physique.js
// @inclure OS_commun.js
// @description Résistance, condensateur et bobine en convention récepteur : lois, énergie, continuité, puissance reçue ou restituée, géométrie de R et de C.
'use strict';
/* =====================================================================
   OS1 · L'atelier des dipôles R, C et L (4 onglets)
   Physique : RCLModel (OS1_Atelier_RCL_physique.js, d'origine, inchangée) : solutions exactes RC et RL entre deux commutations.
     R : u = Ri, p = Ri² ; C : i = C du/dt, E = ½Cu² ; L : u_L = L di/dt, E = ½Li² ; bobine réelle u = u_L + ri.
     Géométrie : R = ρℓ/S (ρ = 1.0 × 10⁻⁶ Ω·m), C = ε₀S/d. Bilan : W_source = ΔE_stockée + W_Joule.
   Lot 13 : sur le kit AnimKit ; historique rejouable au curseur temporel ; courbe de puissance p(t) signée
   (reçoit / restitue) ; bilan d'énergie en option ; étiquette « u continue, i saute » à la commutation.
   ===================================================================== */
const M=window.RCLModel,K=OSK,E=OSC,Mh=AnimKit.M;
const TABS=['R','C','L'],MINUS='−';
const st={x:0,t:0,work:0,joule:0,initial:0,phase:'source',geoConn:true,geoQ:0,hist:[],view:null,ph:0,h:null,drag:null,jump:null};

const geo=a=>a.tab<2&&a.p.mode==='geometry';
function ms(a){const tab=TABS[a.tab];return{tab,E:a.p.E,R:a.p.R,C:a.p.C*1e-6,L:a.p.L*1e-3,Rs:tab==='L'?a.p.RsL:a.p.RsC,r:a.p.r,real:a.p.real&&tab==='L',x:st.x,phase:st.phase}}
const tauRef=a=>a.tab===1?a.p.RsC*a.p.C*1e-6:a.tab===2?a.p.L*1e-3/(a.p.RsL+(a.p.real?a.p.r:0)):1e-3;
const iref=a=>a.tab===0?6/a.p.R:6/(a.tab===1?a.p.RsC:a.p.RsL);
/** état électrique instantané (ou état géométrique) */
function live(a){
  const s=ms(a);
  if(geo(a)){
    if(s.tab==='R'){const R=M.resistance(a.p.length,a.p.section),u=s.E,i=u/R;return{u,i,p:u*i,stored:0,R,q:0,idealU:u,du:0,di:0,tau:1e-3}}
    const C=M.capacitance(a.p.area,a.p.gap),q=st.geoConn?C*s.E:st.geoQ,u=q/C;return{u,i:0,p:0,stored:.5*C*u*u,C,q,idealU:u,du:0,di:0,tau:1e-3};
  }
  return M.sample(s);
}
function record(a){
  if(geo(a))return;
  const m=live(a);
  st.hist.push({t:st.t,u:m.u,i:m.i,p:m.p,idealU:m.idealU,du:m.du,di:m.di,stored:m.stored,q:m.q,tau:m.tau,E:a.p.E,phase:st.phase,work:st.work,joule:st.joule});
  if(st.hist.length>6000)st.hist=st.hist.filter((_,j)=>j%2===0||j===st.hist.length-1);
}
function histAt(t){const h=st.hist;let lo=0,hi=h.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(h[m].t<=t+1e-15)lo=m;else hi=m-1}return h[lo]}
/** échantillon affiché : état courant, ou instant rejoué au curseur */
function cur(a){
  if(st.view!==null&&!geo(a)&&st.hist.length)return histAt(st.view);
  return{...live(a),E:a.p.E,phase:st.phase,work:st.work,joule:st.joule,t:st.t};
}
function resetSim(a){st.x=0;st.t=0;st.work=0;st.joule=0;st.initial=0;st.hist=[];st.view=null;st.ph=0;st.jump=null;record(a)}
function syncPhase(a){a.set('phaseC',st.phase,{silent:true});a.set('phaseL',st.phase,{silent:true});a.set('geoC',st.geoConn?'connect':'isolate',{silent:true})}
function switchPhase(a,p){
  st.view=null;
  if(geo(a)&&a.tab===1){const m=live(a);if(p==='isolate'){st.geoQ=m.q;st.geoConn=false}else st.geoConn=true;return}
  st.phase=p;record(a);st.jump={t:st.t};
}
function preset(a,fn){fn();st.initial=live(a).stored;st.hist=[];record(a);syncPhase(a)}

const A=AnimKit.app({
  code:'OS1',partie:'VioletImperial',chapitre:'OS1 Électrocinétique dans l\'ARQS',

  aide:{
    voit:'Un dipôle en <b>convention récepteur</b> : <i class="m">i</i> entre par la borne A, <i class="m">u</i> = <i class="m">V</i><sub>A</sub> − <i class="m">V</i><sub>B</sub> (la flèche de <i class="m">u</i> pointe vers A). Les flèches de référence ne changent pas de sens quand la valeur devient négative. À gauche, le circuit et le composant (énergie, champ, électrons) ; à droite, <i class="m">u</i>(<i class="m">t</i>), <i class="m">i</i>(<i class="m">t</i>) et la puissance reçue <i class="m">p</i> = <i class="m">u i</i> (verte : le dipôle reçoit de l\'énergie ; bleue : il en restitue).',
    faire:'<ul><li>Choisir R, C ou L, puis <b>Alimenter</b>, <b>Décharger</b> (C : relie les armatures à R<sub>s</sub> ; L : retire la source en gardant une boucle fermée), <b>Isoler</b> (C : débranche les deux bornes).</li><li>« Lecture » fait avancer environ 0.7 τ par seconde à vitesse × 1. <b>Le curseur temporel</b> rejoue tout l\'historique de l\'expérience (courbes et dessin au même instant).</li><li>Au moment d\'une commutation : <i class="m">u</i><sub>C</sub> et <i class="m">i</i><sub>L</sub> restent continues, <i class="m">i</i><sub>C</sub> et <i class="m">u</i><sub>L</sub> peuvent sauter.</li><li>Explorer la géométrie (R et C) : glisser les poignées dans le dessin.</li><li>Cocher « Bilan d\'énergie » pour vérifier W<sub>source</sub> = ΔE<sub>stockée</sub> + W<sub>Joule</sub>.</li></ul>',
    modele:'R, C et L sont linéaires et constants ; C est chargé à travers R<sub>s</sub> &gt; 0, la bobine est alimentée à travers R<sub>s</sub> &gt; 0. Bobine réelle : L en série avec r, la tension affichée <i class="m">u</i> inclut <i class="m">r i</i> ; la tension de l\'inductance idéale <i class="m">u</i><sub>L</sub> est en tirets. Solutions RC et RL intégrées exactement entre deux changements de réglage. Les dimensions, les espacements et la vitesse des marqueurs ne sont pas à l\'échelle ; le halo de R code la puissance, pas une température. Le champ du condensateur plan est uniforme (effets de bord négligés) ; celui de la bobine est schématique (règle de la main droite). Géométrie : R = ρℓ/S avec ρ = 1.0 × 10⁻⁶ Ω·m ; C = ε₀S/d ; comparaison d\'équilibres quasi statiques (les courants pendant les déplacements ne sont pas représentés, et l\'énergie peut faire intervenir un travail mécanique).',

  change(a,id,v){

    st.x=r.x;st.work+=r.work;st.joule+=r.joule;st.t+=dtp;

/* ---------- libellés ---------- */
const v=(a,s,b)=>a.S.v(s,b);
const sfrac=(a,x,y,num,den,o={})=>{const S=a.S,k=a.k,size=o.size??14,c=o.c||a.C.ink,wd=(o.w??34)*k;return S.text(x,y-9*k,num,{anchor:'middle',size,c})+S.line(x-wd/2,y,x+wd/2,y,{c,w:1.2})+S.text(x,y+10*k,den,{anchor:'middle',size,c})};

/* ---------- scène : circuit + composant ---------- */
function drawScene(a,m){
  const P=a.panels.scene,w=P.w,h=P.h,k=a.k;
  const hc=Math.min(h*.45,270*k);
  let s=circuit(a,{x:0,y:0,w,h:hc},m)+component(a,{x:0,y:hc,w,h:h-hc-26*k},m)+bottomMessage(a,m,w,h);
  a.svg('scene',s);
}
function loopPoint(p,xl,xr,yt,yb){
  /* chemin fermé orienté dans le sens du courant de référence (horaire) : (xl,yb) → (xl,yt) → (xr,yt) → (xr,yb) → (xl,yb) */
  const L1=yb-yt,L2=xr-xl,tot=2*(L1+L2);let d=((p%1)+1)%1*tot;
  if(d<L1)return[xl,yb-d];d-=L1;if(d<L2)return[xl+d,yt];d-=L2;if(d<L1)return[xr,yt+d];d-=L1;return[xr-d,yb];
}
function circuit(a,b,m){
  const S=a.S,C=a.C,k=a.k,tab=a.tab,isolated=m.phase==='isolated';
  const xl=b.x+62*k,xr=b.x+b.w-74*k,yt=b.y+42*k,yb=b.y+b.h-18*k,ym=(yt+yb)/2,xm=(xl+xr)/2;
  let s=S.text(b.x+10*k,b.y+6*k,'Circuit · convention récepteur',{base:'top',size:14,c:C.ink});
  /* fils */
  const withSource=m.phase==='source'||geo(a),Rs=tab>0;
  const wire=(x1,y1,x2,y2)=>E.W(a,x1,y1,x2,y2);
  /* branche source */
  if(withSource){
    s+=wire(xl,yt,xl,ym-15*k)+wire(xl,ym+15*k,xl,yb)+E.gen(a,xl,ym)+S.text(xl+22*k,ym-26*k,'+',{size:14,c:C.ink2,anchor:'middle'});
    s+=S.arrow(xl-30*k,ym+22*k,xl-30*k,ym-22*k,{c:C.F,w:1.8})+S.text(xl-38*k,ym,v(a,'E'),{anchor:'end',size:15,c:C.F});
  }else s+=wire(xl,yt,xl,yb)+S.text(xl-10*k,ym,'source retirée',{anchor:'end',size:13,c:C.ink2});
  /* fil du haut (avec R_s pour C et L) */
  const xo=isolated?xr-36*k:xr;
  if(Rs)s+=E.res(a,xl,yt,xm+20*k,yt,{len:38*k})+S.text((xl+xm+20*k)/2,yt-18*k,v(a,'R','s'),{anchor:'middle',size:15})+wire(xm+20*k,yt,xo,yt);
  else s+=wire(xl,yt,xo,yt);
  s+=wire(xl,yb,isolated?xr-36*k:xr,yb);
  if(isolated)s+=wire(xr-14*k,yt,xr,yt)+wire(xr-14*k,yb,xr,yb)+E.sw(a,xr-36*k,yt,xr-14*k,true)+E.sw(a,xr-36*k,yb,xr-14*k,true);
  /* dipôle */
  const x2=xr+34*k;
  if(tab===0){s+=E.res(a,xr,yt,xr,yb,{len:52*k})+S.text(xr-18*k,ym,v(a,'R'),{anchor:'end',size:15});
    s+=E.volt(a,x2,ym+26*k,x2,ym-26*k,v(a,'u'),{c:C.F,dx:8*k});}
  else if(tab===1){s+=E.cap(a,xr,yt,xr,yb)+S.text(xr-16*k,ym,v(a,'C'),{anchor:'end',size:15});
    s+=E.volt(a,x2,ym+22*k,x2,ym-22*k,v(a,'u'),{c:C.F,dx:8*k});}
  else{
    if(a.p.real){const y1=ym-4*k;
      s+=E.ind(a,xr,yt,xr,y1,{side:-1})+E.res(a,xr,y1,xr,yb,{len:30*k})+S.text(xr-16*k,(yt+y1)/2,v(a,'L'),{anchor:'end',size:15})+S.text(xr-16*k,(y1+yb)/2,v(a,'r'),{anchor:'end',size:15});
      s+=E.volt(a,x2,yb-6*k,x2,yt+6*k,v(a,'u'),{c:C.F,dx:8*k})+E.volt(a,xr-50*k,y1-2*k,xr-50*k,yt+8*k,v(a,'u','L'),{c:C.F,dash:`${5*k} ${3*k}`,dx:-8*k,anchor:'end'});}
    else{s+=E.ind(a,xr,yt,xr,yb,{side:-1})+S.text(xr-16*k,ym,v(a,'L'),{anchor:'end',size:15});s+=E.volt(a,x2,ym+26*k,x2,ym-26*k,v(a,'u'),{c:C.F,dx:8*k});}
  }
  /* courant de référence, fixe */
  const ya=yt+(ym-26*k-yt)/2+4*k;
  s+=E.cur(a,xr,Math.max(yt+16*k,ya),'d',v(a,'i'),{c:C.E,lx:12*k});
  s+=S.text(xr+9*k,yt-8*k,'A',{size:13,c:C.ink2,base:'bottom'})+S.text(xr+9*k,yb+14*k,'B',{size:13,c:C.ink2});
  /* marqueurs mobiles : sens réel du courant, ou des électrons */
  if(Math.abs(m.i)>1e-12&&!isolated){
    const el=a.p.show_electrons,dir=Math.sign(m.i)*(el?-1:1),N=18;
    for(let j=0;j<N;j++){const [px,py]=loopPoint(j/N+dir*st.ph,xl,xr,yt,yb);
      if(px>xr-1&&py>yt+16*k&&py<yb-16*k)continue;
      if(Math.abs(px-xl)<1&&Math.abs(py-ym)<18*k)continue;
      if(Rs&&Math.abs(py-yt)<1&&Math.abs(px-(xl+xm+20*k)/2)<22*k)continue;
      s+=S.circle(px,py,3.4*k,{fill:el?C.B:C.E,c:C.card,w:.8});}
  }
  /* commutation : u continue, i saute */
  if(st.jump&&a.tab>0&&Math.abs((st.view??st.t)-st.jump.t)<1e-9*(1+st.jump.t)+(m.tau||1)*.05&&st.jump.why!=='E'){
    s+=S.text(xm,yb-14*k,a.tab===1?`${v(a,'u','C')} continue · ${v(a,'i')} peut sauter`:`${v(a,'i')} continu · ${v(a,'u','L')} peut sauter`,{anchor:'middle',size:14,c:C.F});}
  return s;
}
function bottomMessage(a,m,w,h){
  const S=a.S,C=a.C,k=a.k,tab=a.tab,g=geo(a);let t='';
  if(g)t=tab===0?'Allonger augmente R ; épaissir diminue R.':st.geoConn?'Source connectée : la tension reste imposée.':'Condensateur isolé : la charge reste constante.';
  else if(tab===0)t=m.p>1e-12?'La résistance reçoit de l\'énergie et la dissipe.':'Tension nulle : courant et puissance nuls.';
  else if(tab===1){
    if(m.phase==='isolated')t='Isolé : i = 0 ; la tension et l\'énergie subsistent.';
    else if(Math.abs(m.i)<Math.max(1e-12,6/a.p.RsC*1e-3))t=Math.abs(m.u)<.006?'Condensateur pratiquement déchargé.':'Régime pratiquement établi : i ≈ 0, u reste non nul.';
    else t=m.p>=0?'Le condensateur reçoit de l\'énergie : E_C augmente.':'Le condensateur restitue de l\'énergie : p < 0.';
  }else{
    if(Math.abs(m.i)<1e-10&&Math.abs(m.idealU)<.006)t='Courant nul : aucune énergie magnétique stockée.';
    else if(Math.abs(m.idealU)<.006)t=a.p.real?'Régime pratiquement établi : u ≈ ri, u_L ≈ 0.':'Régime pratiquement établi : u_L ≈ 0, i reste non nul.';
    else t=m.idealU*m.i>=0?'Le courant s\'établit ; l\'énergie magnétique augmente.':'L\'énergie magnétique diminue ; la bobine la restitue.';
    if(a.p.real&&m.p>0&&m.idealU*m.i<0)t='L\'énergie magnétique diminue ; r dissipe aussi de l\'énergie.';
  }
  return S.text(w/2,h-12*k,t,{anchor:'middle',size:14,c:C.ink});
}

/* ---------- le composant ---------- */
function gauge(a,x,ybase,H,frac,col,lab,val){
  const S=a.S,C=a.C,k=a.k,wd=14*k;
  frac=Math.max(0,Math.min(1,frac));
  return S.rect(x-wd/2,ybase-H,wd,H,{c:C.ink2,w:1.2})+S.rect(x-wd/2,ybase-H*frac,wd,H*frac,{fill:col,fop:.85})+S.text(x,ybase+16*k,lab,{anchor:'middle',size:14,c:col})+S.text(x,ybase+32*k,val,{anchor:'middle',size:13,c:C.ink2});
}
function component(a,b,m){
  const S=a.S,C=a.C,k=a.k,tab=a.tab,g=geo(a),en=a.p.show_energy,cx=b.x+b.w*.46,cy=b.y+b.h*.46;
  st.h=null;let s='';
  const ref=m;
  if(tab===0){
    const len=Math.min(b.w-150*k,(g?50+a.p.length*13:190)*k),th=(g?(18+26*Math.sqrt(a.p.section)):54)*k,x1=cx-len/2,x2=cx+len/2,heat=Math.min(1,Math.log1p(Math.abs(m.p))/Math.log(11));
    if(en&&!g||en&&g)s+=S.rect(x1-12*k,cy-th/2-12*k,len+24*k,th+24*k,{fill:C.F,fop:.04+.2*heat,rx:th/2+10*k});

  const u=q(m.u,'V'),metric=(label,val,hint)=>({label,value:val.split(' ')[0],unit:val.split(' ').slice(1).join(' '),hint});
  if(g){
    a.metrics(tab===0?[metric(`Tension ${Mh.v('u')}`,u),metric(`Résistance ${Mh.v('R')}`,f.sig(m.R,3)+' Ω'),metric(`Puissance ${Mh.v('p')}`,q(m.p,'W')),{label:`${Mh.v('ℓ')} / ${Mh.v('S')}`,value:`${f.sig(a.p.length,3)} / ${f.sig(a.p.section,2)}`,unit:'cm / mm²'}]
      :[metric(`Tension ${Mh.v('u')}`,u),metric(`Charge ${Mh.v('q')}`,q(m.q,'C')),metric(`Capacité ${Mh.v('C')}`,q(m.C,'F')),metric(`Énergie ${Mh.v('E','C')}`,q(m.stored,'J'))]);
  }else a.metrics([metric(`Tension ${Mh.v('u')}`,u),metric(`Courant ${Mh.v('i')}`,q(m.i,'A')),metric(`Puissance reçue ${Mh.v('p')}`,q(m.p,'W')),
    tab===0?metric(`Énergie dissipée ${Mh.v('W','J')}`,q(m.joule,'J')):metric(`Énergie ${Mh.v('E',tab===1?'C':'L')}`,q(m.stored,'J'),`τ = ${sv2(K.qty(a,m.tau,'s'))}`)]);
  const leg=[{c:C.F,label:`tension ${Mh.v('u')}`},{c:C.E,label:`courant ${Mh.v('i')}`}];
  if(!g&&tab>0){leg.push({c:C.v,label:'puissance reçue'},{c:C.B,label:'puissance restituée'});if(a.p.real&&tab===2)leg.push({c:C.F,dash:true,label:`${Mh.v('u','L')} (bobine idéale)`})}
  if(a.p.show_electrons)leg.push({c:C.B,dot:true,label:'électrons'});else leg.push({c:C.E,dot:true,label:'sens réel du courant'});
  a.legend(leg);
}
const sv2=s=>s;   /* les sorties HTML des mesures acceptent <sup> */

/* ---------- poignées de la géométrie ---------- */
A.drag('scene',{
  hit:(x,y)=>{if(!geo(A)||!st.h)return false;const k=A.k;return Object.values(st.h).some(p=>Array.isArray(p)&&Math.hypot(x-p[0],y-p[1])<18*k)},
  start(x,y,e){const k=A.k,h=st.h;let best=null,d0=1e9;for(const id in h){const p=h[id];if(!Array.isArray(p))continue;const d=Math.hypot(x-p[0],y-p[1]);if(d<d0){d0=d;best=id}}
    st.drag={id:best,x,y,v:{length:A.p.length,section:A.p.section,area:A.p.area,gap:A.p.gap}}},
  move(x,y){const d=st.drag;if(!d)return;
    const dx=x-d.x,dy=y-d.y,cl=(q,a0,b0)=>Math.max(a0,Math.min(b0,q));
    if(d.id==='len')A.p.length=Math.round(cl(d.v.length+dx*.05,2,20)*10)/10;
    if(d.id==='sec')A.p.section=Math.round(cl(d.v.section-dy*.02,.2,3)*10)/10;
    if(d.id==='area')A.p.area=Math.round(cl(d.v.area-dy*.7,20,200));
    if(d.id==='gap')A.p.gap=Math.round(cl(d.v.gap+dx*.03,1,8)*10)/10;
    A.refresh();},
  end(){st.drag=null}
});
