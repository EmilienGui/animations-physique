help:`<p>Les aperçus de l’image occupent une zone séparée à droite du banc, ou en dessous sur une fenêtre étroite. Ils ne recouvrent pas le schéma. La case « Afficher les aperçus de l’image » permet de rendre tout l’espace au banc. Les mesures du banc sont simulées ; elles ne sont pas des mesures de laboratoire. Les boutons « Relever » mémorisent la position courante, sans juger automatiquement sa qualité. La formule de Bessel ne donne la focale correcte que si les deux relevés sont les deux positions distinctes de netteté.</p><p><b>Projection.</b> Objet et écran séparés de D. La lentille doit vérifier x(D − x) = Df′. D &lt; 4f′ : aucune position ; D = 4f′ : une position double x = D/2 ; D &gt; 4f′ : deux positions, de grandissements réciproques. Le diamètre du flou à l’écran est calculé par Thalès. L’image du F épais est calculée en moyennant les décalages produits par une pupille circulaire, sans filtre graphique du navigateur. La lettre dessinée dans la coupe est un symbole vu de face, pas une épaisseur longitudinale de l’objet.</p><p><b>Bessel.</b> Si d = |x₂ − x₁|, f′ = (D² − d²)/(4D). Silbermann impose en plus γ = −1, ce qui donne des distances objet–lentille et lentille–écran de 2f′, et D = 4f′.</p><p><b>Autocollimation.</b> Le miroir est plan et placé derrière la lentille. Au réglage objet dans le plan focal, le faisceau après la lentille est parallèle ; après réflexion et seconde traversée, l’image renversée revient dans le plan objet. Les deux passages sont calculés avec inversion du sens de propagation au miroir. Le miroir est supposé suffisamment étendu et les rayons non diaphragmés au retour. Changer sa position conserve le réglage focal. Une coïncidence du plan de retour peut aussi exister pour d’autres conjugaisons particulières ; le réglage usuel est identifié par le faisceau parallèle et son indépendance à la position du miroir.</p><p>« Animer » balaie la position de la lentille ; ce mouvement est un outil de recherche, pas une propagation optique. Révéler les solutions ou afficher les résultats reste facultatif.</p>`
