    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}

    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },

/* Modèle indépendant du dessin : UA, année julienne et multiple de GM solaire. */
window.KeplerModel=(()=>{
 'use strict';
 const TAU=2*Math.PI,AU=149597870700,YEAR=365.25*86400,GM=1.32712440018e20,MU=GM*YEAR*YEAR/(AU*AU*AU);
 const mod=(x,m=TAU)=>((x%m)+m)%m;
 function eccentric(mean,e){
  if(!(e>=0&&e<1)||!Number.isFinite(mean))throw Error('Paramètres képlériens invalides');
  const m=mod(mean+Math.PI)-Math.PI,turns=mean-m;
  let lo=-Math.PI,hi=Math.PI,E=e<.8?m:(m<0?-Math.PI:Math.PI);
  for(let i=0;i<70;i++){
   const f=E-e*Math.sin(E)-m;if(Math.abs(f)<2e-14)return E+turns;
   if(f>0)hi=E;else lo=E;
   const next=E-f/(1-e*Math.cos(E));E=next>lo&&next<hi?next:(lo+hi)/2;
  }
  return E+turns;
 }
 function orbit(a,e,mass=1){
  if(!(a>0&&mass>0&&e>=0&&e<1))throw Error('Orbite invalide');
  const mu=MU*mass,n=Math.sqrt(mu/a**3),b=a*Math.sqrt(1-e*e),C=Math.sqrt(mu*a*(1-e*e));
  return {a,e,mass,mu,n,b,C,T:TAU/n,area:Math.PI*a*b,rp:a*(1-e),ra:a*(1+e)};
 }
 function atMean(o,mean){
  const E=eccentric(mean,o.e),c=Math.cos(E),s=Math.sin(E),d=1-o.e*c;
  const x=o.a*(c-o.e),y=o.b*s,vx=-o.a*o.n*s/d,vy=o.b*o.n*c/d,r=o.a*d;
  return {E,x,y,r,vx,vy,v:Math.hypot(vx,vy),theta:Math.atan2(y,x),thetaDot:o.C/(r*r)};
 }

})();

/* =====================================================================
   MC6 · outils communs aux animations du chapitre (lot 6, 2 novembre 2026)

window.MC6=(()=>{
'use strict';
/** Caméra d'un panneau : b = {xmin,xmax,ymin,ymax} en unités du monde, y vers le haut. */
function camera(P,b,marge=28){
  const dx=Math.max(1e-12,b.xmax-b.xmin), dy=Math.max(1e-12,b.ymax-b.ymin);
  const s=Math.min(Math.max(40,P.w-2*marge)/dx,Math.max(40,P.h-2*marge)/dy)*(P.zoom||1);
  const cx=(b.xmin+b.xmax)/2, cy=(b.ymin+b.ymax)/2;
  const X=(x,y)=>[P.w/2+(x-cx)*s+(P.panX||0),P.h/2-(y-cy)*s+(P.panY||0)];
  const inv=(px,py)=>[(px-P.w/2-(P.panX||0))/s+cx,-(py-P.h/2-(P.panY||0))/s+cy];
  return {X,inv,s};
}
/** Placeur d'étiquettes : essaie plusieurs positions et garde la moins encombrée. */
function placer(a,P){
  const boxes=[], obst=[];
  const plain=h=>String(h).replace(/<tspan[^>]*font-size="72%"[^>]*>([^<]*)<\/tspan>/g,'$1').replace(/<[^>]+>/g,'').replace(/&[a-z]+;/g,'x');
  const hit=(A,B,p=3)=>A.x<B.x+B.w+p&&A.x+A.w+p>B.x&&A.y<B.y+B.h+p&&A.y+A.h+p>B.y;
  return {
    obstacle(x,y,r=10){obst.push({x:x-r,y:y-r,w:2*r,h:2*r})},
    /** renvoie le SVG de l'étiquette ; pref = [dx,dy] préféré */
    put(x,y,html,o={}){
      if(!(x>-60&&x<P.w+60&&y>-60&&y<P.h+60))return'';
      const size=(o.size??14)*a.k, w=plain(html).length*size*.56+4, h=size*1.2;
      const pr=o.pref||[10,-12];
      const cand=[pr,[10,size+6],[-w-10,-12],[-w-10,size+6],[10,-2.4*size],[-w-10,-2.4*size],[14,2.6*size],[-w-14,2.6*size],[-w/2,-1.6*size],[-w/2,2*size]];

      for(const[dx,dy]of cand){const bx=Math.max(4,Math.min(P.w-w-4,x+dx)), by=Math.max(h+2,Math.min(P.h-4,y+dy));
        const B={x:bx,y:by-h,w,h};let c=Math.hypot(bx-x-dx,by-y-dy)*.02+Math.hypot(dx,dy)*.01;

      boxes.push(best.B);

    }
  };
}
/** Barre d'échelle en bas à gauche. */
function scaleBar(a,P,cam,unit,cible=90){
  const raw=cible*a.k/cam.s, p=10**Math.floor(Math.log10(raw)), q=raw/p, L=(q>=5?5:q>=2?2:1)*p, w=L*cam.s, y=P.h-12*a.k, x=12*a.k, C=a.C;
  const lab=(L>=1?a.fmt.fix(L,0).replace(/\B(?=(\d{3})+(?!\d))/g,' '):a.fmt.sig(L,1))+' '+unit;
  return a.S.line(x,y,x+w,y,{c:C.ink2,w:2})+a.S.line(x,y-4*a.k,x,y+4*a.k,{c:C.ink2})+a.S.line(x+w,y-4*a.k,x+w,y+4*a.k,{c:C.ink2})+a.S.text(x,y-10*a.k,lab,{size:12.5,c:C.ink2});
}
/** Glisser dans un panneau : objets saisissables (grab renvoie un gestionnaire) sinon déplacement de la vue. */
function drag(a,id,grab){
  const P=a.panels[id];let h=null,start=null;
  a.drag(id,{
    hit:(x,y,e)=>true,
    start:(x,y,e)=>{h=grab?grab(x,y,e):null;start={x,y,px:P.panX,py:P.panY};if(h&&h.start)h.start(x,y)},
    move:(x,y,e)=>{if(h)h.move(x,y,e);else{P.panX=start.px+x-start.x;P.panY=start.py+y-start.y}},
    end:e=>{if(h&&h.end)h.end(e);h=null}

  P.node.style.touchAction='none';
}
/** Nombre avec espaces fines de milliers (point décimal conservé). */
function nb(a,x,d=0){const s=a.fmt.fix(x,d);const[i,f]=s.split('.');return i.replace(/\B(?=(\d{3})+(?!\d))/g,' ')+(f?'.'+f:'')}
/** Durée lisible. */
function duree(a,s){const f=a.fmt;if(!isFinite(s))return'—';if(Math.abs(s)<120)return f.sig(s,3)+' s';if(Math.abs(s)<7200)return f.sig(s/60,3)+' min';if(Math.abs(s)<172800)return f.sig(s/3600,3)+' h';return f.sig(s/86400,3)+' j'}

const dot=(x='r')=>`<span class="m pt1">${x}</span>`;
const Sdot=(x='r')=>`<tspan font-family='${AnimKit.MATH}' font-style="italic">${x}</tspan><tspan dx="-0.42em" dy="-0.12em">˙</tspan><tspan dy="0.12em" dx="0.12em">\u200b</tspan>`;
return Object.freeze({camera,placer,scaleBar,drag,nb,duree,dot,Sdot});
})();

  /* aires */
  if(a.tab===1){const dm=K.TAU*a.p.dt/100,cs=[C.E,C.v,C.B],nm=['1','2','3'];
    [-dm/2,Math.PI-dm/2,1.5*Math.PI-dm/2].forEach((m0,j)=>{s+=sector(o1,m0,dm,cs[j],.22);const q=K.atMean(o1,m0+dm/2),z=X(q.x*.62,q.y*.62);s+=S.text(z[0],z[1],S.r('𝒜')+`<tspan font-size="72%" dy="0.42em">${nm[j]}</tspan>`,{size:16,c:cs[j],anchor:'middle'})});
    if(a.p.live){const M=o1.n*a.t;s+=sector(o1,M-dm,dm,C.c,.38)}}
  /* orbites */
  os.forEach((o,j)=>{const c=X(-o.a*o.e,0);s+=`<ellipse cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" rx="${(o.a*cam.s).toFixed(1)}" ry="${(o.b*cam.s).toFixed(1)}" fill="none" stroke="${col[j]}" stroke-width="${(j?2:2.6)*k}"${j?` stroke-dasharray="${8*k} ${6*k}"`:''}/>`});
  if((a.p.marks&&a.tab!==1)||a.tab===1){const dm=K.TAU*(a.tab===1?a.p.dt:6)/100;os.forEach((o,j)=>{for(let i=0;i*dm<K.TAU-1e-9;i++){const q=K.atMean(o,i*dm),z=X(q.x,q.y);s+=S.circle(z[0],z[1],3*k,{fill:C.card,c:col[j],w:1.3})}})}
  /* géométrie de l'ellipse */
  if(a.tab<2&&a.p.geo){const Ap=X(-o1.ra,0),Pp=X(o1.rp,0),Cc=X(-o1.a*o1.e,0),F2=X(-2*o1.a*o1.e,0);
    s+=S.line(Ap[0],Ap[1],Pp[0],Pp[1],{c:C.ink2,w:1,dash:`${5*k} ${6*k}`,op:.7});
    s+=S.circle(Ap[0],Ap[1],3.5*k,{fill:C.cInk})+S.circle(Pp[0],Pp[1],3.5*k,{fill:C.cInk});
    s+=L.put(Ap[0],Ap[1],'A',{c:C.cInk,pref:[-18*k,-12*k],weight:600})+L.put(Pp[0],Pp[1],'P',{c:C.cInk,pref:[8*k,-12*k],weight:600});
    if(o1.e>1e-9){s+=S.line(Cc[0]-5*k,Cc[1],Cc[0]+5*k,Cc[1],{c:C.ink2})+S.line(Cc[0],Cc[1]-5*k,Cc[0],Cc[1]+5*k,{c:C.ink2})+S.circle(F2[0],F2[1],3*k,{fill:C.ink2});
      s+=L.put(Cc[0],Cc[1],'C',{c:C.ink2,pref:[-4*k,16*k]})+L.put(F2[0],F2[1],'F′',{c:C.ink2,pref:[-6*k,-12*k]})}
    const yy=X(0,-o1.b)[1]+18*k;if(yy<P.h-30*k&&Pp[0]-Ap[0]>110){s+=S.line(Ap[0],yy,Pp[0],yy,{c:C.ink2,w:1})+S.line(Ap[0],yy-4*k,Ap[0],yy+4*k,{c:C.ink2,w:1})+S.line(Pp[0],yy-4*k,Pp[0],yy+4*k,{c:C.ink2,w:1});s+=S.text((Ap[0]+Pp[0])/2,yy+11*k,`2${S.v('a')}<tspan font-size="72%" dy="0.42em">1</tspan>`,{anchor:'middle',size:14,c:C.ink2})}}
  /* centre attracteur */
  s+=S.circle(O[0],O[1],14*k,{fill:'#f5b301',op:.18})+S.circle(O[0],O[1],7*k,{fill:'#f5b301'});
  s+=L.put(O[0],O[1],a.tab<2&&a.p.geo&&o1.e<1e-9?'O = C = F′':'O',{pref:[10*k,20*k],weight:600});
  /* mobiles */
  os.forEach((o,j)=>{const p=ps[j],q=X(p.x,p.y),c=col[j];
    if(a.p.ray)s+=S.line(O[0],O[1],q[0],q[1],{c,w:1.3,dash:`${4*k} ${4*k}`,op:.75});
    if(a.p.vel){const t=X(p.x+p.vx*vs,p.y+p.vy*vs);s+=S.arrow(q[0],q[1],t[0],t[1],{c:C.v,w:2.2});if(Math.hypot(t[0]-q[0],t[1]-q[1])>18*k)s+=L.put(t[0],t[1],a.tab===2?S.v('v',String(j+1)):S.v('v'),{c:C.v,size:15})}
    s+=S.circle(q[0],q[1],16*k,{fill:c,op:.12})+S.circle(q[0],q[1],7*k,{fill:c,c:C.card,w:1.5});
    s+=L.put(q[0],q[1],a.tab===2?S.v('M',String(j+1)):S.v('M'),{c,size:16,pref:[12*k,-12*k]})});
  s+=MC6.scaleBar(a,P,cam,'UA');
  a.svg('scene',s);
}
function sector(o,m0,dm,c,op){
  const X=cam.X,E0=K.eccentric(m0,o.e),E1=K.eccentric(m0+dm,o.e),O=X(0,0);let d=`M${O[0].toFixed(1)},${O[1].toFixed(1)}`;
  for(let j=0;j<=90;j++){const E=E0+(E1-E0)*j/90,z=X(o.a*(Math.cos(E)-o.e),o.b*Math.sin(E));d+=`L${z[0].toFixed(1)},${z[1].toFixed(1)}`}
  return A.S.path(d+'Z',{fill:c,fop:op,c,w:1.1});
}

/* ---------- graphe logarithmique de la troisième loi ---------- */
function logPlot(a){
  const P=a.panels.log,S=a.S,C=a.C,k=a.k,L10=Math.log10;
  const G=S.graph({x:0,y:0,w:P.w,h:P.h,xmin:-.6,xmax:1.7,ymin:-.8,ymax:2.5,xlab:'log(a / 1 UA)',ylab:'log(T / 1 an)',padL:40*k,padB:34*k});
  let s=G.svg+S.clip('clipLog',G);const Lp=MC6.placer(a,P);
  if(a.p.droite){const mu=a.p.mass;s+=S.curve([[-.6,1.5*-.6-.5*L10(mu)],[1.7,1.5*1.7-.5*L10(mu)]],G,{c:C.pred,w:1.6,dash:`${6*k} ${5*k}`});
    if(Math.abs(mu-1)>1e-9)s+=S.curve([[-.6,-.9],[1.7,2.55]],G,{c:C.ink2,w:1,dash:`${2*k} ${4*k}`,op:.6})}
  PLANETES.forEach((p,i)=>{const x=G.X(L10(p.a)),y=G.Y(L10(p.T));s+=S.circle(x,y,4*k,{fill:C.ink2});Lp.obstacle(x,y,6*k);
    s+=Lp.put(x,y,p.n,{size:12,c:C.ink2,pref:i%2?[8*k,14*k]:[-8*k-p.n.length*7*k,-8*k]})});
  [[o1,C.cInk,'1'],[o2,C.B,'2']].forEach(([o,c,n])=>{const x=G.X(L10(o.a)),y=G.Y(L10(o.T));if(x>G.x0-2&&x<G.x0+G.w+2&&y>G.y0-2&&y<G.y0+G.h+2){s+=S.circle(x,y,6.5*k,{fill:c,c:C.card,w:1.5});s+=Lp.put(x,y,S.v('M',n),{c,size:15,pref:n==='1'?[10*k,-10*k]:[10*k,16*k]})}});
  a.svg('log',s);
}

/* ---------- valeurs, légende, à retenir ---------- */
function infos(a){
  const f=a.fmt,p1=K.atTime(o1,a.t),T=mv('T'),al=mv('a');
  const fr=Mh.frac;
  if(a.tab===0){
    a.metrics([{label:`Distance ${mv('r')} = OM`,value:f.sig(p1.r,3),unit:'UA',hint:`${mv('r')}<sub>min</sub> = ${f.sig(o1.rp,3)} UA · ${mv('r')}<sub>max</sub> = ${f.sig(o1.ra,3)} UA`},
      {label:`Vitesse ${mv('v')}`,value:f.sig(p1.v*K.AU/K.YEAR/1000,3),unit:'km·s<sup>−1</sup>',hint:'maximale en P, minimale en A'},
      {label:`Période ${T}<sub>1</sub>`,value:f.sig(o1.T,3),unit:'an',hint:`${mv('t')} = ${f.fix(K.mod(a.t,o1.T)/o1.T*100,0)} % du tour`}]);
    a.insight(o1.e<1e-9?`Pour ${mv('e')} = 0, le cercle est une ellipse dont les deux foyers et le centre sont confondus : ${mv('r')} et ${mv('v')} sont constants.`
      :`O occupe un foyer de l'ellipse. ${mv('r')}<sub>min</sub> = ${al}(1 − ${mv('e')}), ${mv('r')}<sub>max</sub> = ${al}(1 + ${mv('e')}) et, la constante des aires imposant ${mv('r')}<sub>min</sub>${mv('v')}<sub>P</sub> = ${mv('r')}<sub>max</sub>${mv('v')}<sub>A</sub> : ${fr(mv('v')+'<sub>P</sub>',mv('v')+'<sub>A</sub>')} = ${fr(mv('r')+'<sub>max</sub>',mv('r')+'<sub>min</sub>')} = ${f.sig(o1.ra/o1.rp,3)}.`,
      [`O occupe un foyer de l'ellipse. ${mv('r')}<sub>min</sub> = ${al}(1 − ${mv('e')}), ${mv('r')}<sub>max</sub> = ${al}(1 + ${mv('e')}) et, la constante des aires imposant ${mv('r')}<sub>min</sub>${mv('v')}<sub>P</sub> = ${mv('r')}<sub>max</sub>${mv('v')}<sub>A</sub> : ${fr(mv('v')+'<sub>P</sub>',mv('v')+'<sub>A</sub>')} = ${fr(mv('r')+'<sub>max</sub>',mv('r')+'<sub>min</sub>')} = 39.0.`]);
    a.legend([{c:a.C.cInk,label:'orbite'},{c:'#f5b301',label:'centre attracteur O',dot:true},a.p.vel&&{c:a.C.v,label:`vitesse ${mv('v')}`}]);
  }else if(a.tab===1){
    const dt=o1.T*a.p.dt/100;
    a.metrics([{label:`Durée commune Δ${mv('t')}`,value:f.sig(dt,3),unit:'an'},
      {label:'Aire de chaque secteur',value:f.sig(o1.area*a.p.dt/100,3),unit:'UA<sup>2</sup>',hint:`π${al}${mv('b')} × Δ${mv('t')}/${T}`},
      {label:'Constante des aires 𝒞',value:f.sig(o1.C,3),unit:'UA<sup>2</sup>·an<sup>−1</sup>',hint:`𝒞 = ${mv('r')}<sup>2</sup>${MC6.dot('θ')}`}]);
    a.insight(`${fr('d𝒜','d'+mv('t'))} = ${fr('𝒞','2')} : des durées égales balaient des aires égales, ${'𝒜'}<sub>1</sub> = 𝒜<sub>2</sub> = 𝒜<sub>3</sub> = ${fr('𝒞 Δ'+mv('t'),'2')}, avec des angles et des arcs parcourus différents.`);
    a.legend([{c:a.C.E,label:'𝒜<sub>1</sub> (autour de P)'},{c:a.C.v,label:'𝒜<sub>2</sub> (autour de A)'},{c:a.C.B,label:'𝒜<sub>3</sub>'},a.p.live&&{c:a.C.c,label:'aire balayée pendant le dernier Δ<span class="m">t</span>'}]);
  }else{
    const r=a.p.ratios,q=o=>f.sig(o.T**2/o.a**3,3);
    a.metrics([{label:`Période ${T}<sub>1</sub>`,value:f.sig(o1.T,3),unit:'an',hint:r?`${T}<sub>1</sub><sup>2</sup>/${al}<sub>1</sub><sup>3</sup> = ${q(o1)} an<sup>2</sup>·UA<sup>−3</sup>`:`tours : ${Math.floor(a.t/o1.T+1e-10)}`},
      {label:`Période ${T}<sub>2</sub>`,value:f.sig(o2.T,3),unit:'an',hint:r?`${T}<sub>2</sub><sup>2</sup>/${al}<sub>2</sub><sup>3</sup> = ${q(o2)} an<sup>2</sup>·UA<sup>−3</sup>`:`tours : ${Math.floor(a.t/o2.T+1e-10)}`},
      {label:`Rapport ${T}<sub>2</sub>/${T}<sub>1</sub>`,value:r?f.sig(o2.T/o1.T,3):'?',unit:'',hint:r?`(${al}<sub>2</sub>/${al}<sub>1</sub>)<sup>3/2</sup> = ${f.sig((o2.a/o1.a)**1.5,3)}`:'à prévoir avant d\'afficher'}]);
    const law=`${fr(T+'<sup>2</sup>',al+'<sup>3</sup>')} = ${fr('4π<sup>2</sup>',mv('G')+mv('m')+'<sub>O</sub>')} : le demi-grand axe fixe la période, l'excentricité ne la change pas. Les planètes s'alignent sur une droite de pente 3/2 en coordonnées logarithmiques.`;
    a.insight(r?law:`Prévoir : lequel des deux mobiles revient le premier à son péricentre ? Afficher ensuite les rapports ${fr(T+'<sup>2</sup>',al+'<sup>3</sup>')}.`,[law]);
    a.legend([{c:a.C.cInk,label:'mobile 1'},{c:a.C.B,label:'mobile 2',dash:true},{c:a.C.ink2,label:'planètes (cours)',dot:true},a.p.droite&&{c:a.C.pred,label:'pente 3/2',dash:true}]);
  }
  a.clock(`${mv('t')} = ${f.fix(a.t,2)} an`);
}
