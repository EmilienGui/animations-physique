  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){

        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

     Normale ⊙ : Φ = B a s(x), s = aire plongée ; e = −B a v (cadre à cheval), 0 sinon.
     L di/dt + R i = e ; m dv/dt = m g + B a i (côté inférieur seul dans le champ). */
  function cadre(p){
    const a=p.a,m=p.m,R=p.R,B=p.B,L=p.Lc,x0=-p.h0,xEnd=p.xfin,rows=[];
    const inside=x=>x>0&&x<a?1:0, plonge=x=>Math.max(0,Math.min(a,x))*a;
    const dt=Math.min(2e-4,L>0?L/R/20:2e-4);
    const cur=y=>L>0?y[2]:-B*a*y[1]*inside(y[0])/R;
    const fun=y=>{const f=inside(y[0]),i=cur(y),e=-B*a*y[1]*f;return [y[1],G+B*a*i*f/m,L>0?(e-R*i)/L:0,R*i*i,m*G*y[1]]};
    let y=[x0,0,0,0,0],t=0,last=-1;
    while(y[0]<xEnd&&t<60){
      if(t-last>=.002-1e-12||rows.length===0){const f=inside(y[0]),i=cur(y);last=t;
        rows.push({t,x:y[0],v:y[1],i,e:-B*a*y[1]*f,flux:B*plonge(y[0]),F:B*a*i*f,PJ:R*i*i,Ec:.5*m*y[1]**2,W:y[4],Q:y[3],Em:.5*L*i*i,phase:y[0]<0?1:y[0]<a?2:3});}
      // pas réduit au franchissement des bords du champ
      const h=(Math.abs(y[0])<y[1]*dt*2||Math.abs(y[0]-a)<y[1]*dt*2)?dt/10:dt;
      y=rk4(fun,y,h);t+=h;
    }
    const i=cur(y),f=inside(y[0]);rows.push({t,x:y[0],v:y[1],i,e:-B*a*y[1]*f,flux:B*plonge(y[0]),F:B*a*i*f,PJ:R*i*i,Ec:.5*m*y[1]**2,W:y[4],Q:y[3],Em:.5*L*i*i,phase:y[0]<0?1:y[0]<a?2:3});
    const t1=rows.find(r=>r.x>=0)?.t??t, t2=rows.find(r=>r.x>=a)?.t??t;
    return {rows,tmax:t,vlim:m*G*R/(B*B*a*a),tau:L>0?L/R:m*R/(B*B*a*a),t1,t2};

  /* ---------- fonction de courant de la nappe ----------
     ψ est définie sur les faces (cellules) du maillage ; le courant d'une arête a → b vaut
     ψ(gauche) − ψ(droite) avec j = (∂ψ/∂y, −∂ψ/∂x). Cellules incomplètes = extérieur (ψ = 0) ;
     deux cellules séparées par une arête absente (fente) forment une même face. */
  function faces(mesh){
    if(mesh._faces)return mesh._faces;
    const n=Math.round(2*EM5.SHEET.radius/mesh.h),idx=new Map();mesh.nodes.forEach((q,i)=>idx.set(q[2]+','+q[3],i));
    const ekey=new Map();mesh.edges.forEach(([a,b],j)=>ekey.set(a+','+b,j));
    const node=(i,j)=>idx.get(i+','+j), cell=(i,j)=>j*n+i, full=new Uint8Array(n*n);
    for(let j=0;j<n;j++)for(let i=0;i<n;i++)full[cell(i,j)]=[node(i,j),node(i+1,j),node(i,j+1),node(i+1,j+1)].every(v=>v!==undefined)?1:0;
    const par=Int32Array.from({length:n*n+1},(_,i)=>i),EXT=n*n;
    const find=x=>{while(par[x]!==x){par[x]=par[par[x]];x=par[x]}return x}, uni=(a,b)=>{a=find(a);b=find(b);if(a!==b)par[a]=b};
    const C=(i,j)=>i<0||j<0||i>=n||j>=n||!full[cell(i,j)]?EXT:cell(i,j);
    for(let k=0;k<n*n;k++)if(!full[k])uni(k,EXT);
    const rel=[];// [arête, face gauche, face droite]
    const edgeOf=(u,v)=>u===undefined||v===undefined?undefined:ekey.get(u+','+v);
    // arêtes horizontales (i,j)→(i+1,j) : courant +x = ψ(haut, cellule (i,j)) − ψ(bas, cellule (i,j−1))
    for(let j=0;j<=n;j++)for(let i=0;i<n;i++){const up=C(i,j),dn=C(i,j-1),e=edgeOf(node(i,j),node(i+1,j));if(e===undefined)uni(up,dn);else rel.push([e,up,dn])}
    // arêtes verticales (i,j)→(i,j+1) : courant +y = ψ(gauche, (i−1,j)) − ψ(droite, (i,j))
    for(let j=0;j<n;j++)for(let i=0;i<=n;i++){const lf=C(i-1,j),rt=C(i,j),e=edgeOf(node(i,j),node(i,j+1));if(e===undefined)uni(lf,rt);else rel.push([e,lf,rt])}
    const adj=new Map();for(const[e,A,B]of rel){const a=find(A),b=find(B);if(a===b)continue;(adj.get(a)||adj.set(a,[]).get(a)).push([b,e,-1]);(adj.get(b)||adj.set(b,[]).get(b)).push([a,e,1])}
    mesh._faces={n,find,EXT,adj,full,cell};return mesh._faces;
  }
  /** ψ aux centres des cellules (tableau n×n), pour des courants d'arête flow[] */
  function psi(mesh,flow){
    const F=faces(mesh),root=F.find(F.EXT),val=new Map([[root,0]]),queue=[root];
    while(queue.length){const f=queue.shift(),v=val.get(f);for(const[g,e,s]of F.adj.get(f)||[]){if(val.has(g))continue;
      // s = +1 : f est la face droite et g la gauche → ψ(g) = ψ(f) + I ; s = −1 : ψ(g) = ψ(f) − I
      val.set(g,v+s*flow[e]);queue.push(g)}}
    const out=new Float64Array(F.n*F.n);for(let k=0;k<F.n*F.n;k++)out[k]=F.full[k]?(val.get(F.find(k))??0):0;
    return {n:F.n,h:mesh.h,psi:out};
  }

  /* ---------- rails de Laplace avec auto-inductance L (RK4) ----------
     L di/dt + R i = E + e, e = −aBv ; m dv/dt = F + aBi ; i(0) = 0 (circuit fermé). */
  function railsL(p,mode,T){

    const dt=Math.min(1e-3,L/R/30,T/4000),N=Math.ceil(T/dt),h=T/N,every=Math.max(1,Math.round(N/400)),rows=[];
    const fun=y=>{const e=-k*y[1],di=(E+e-R*y[2])/L;return [y[1],(F+k*y[2])/m,di,R*y[2]*y[2],E*y[2],F*y[1]]};
    let y=[.18,v0,0,0,0,0];
    for(let j=0;j<=N;j++){
      if(j%every===0||j===N){const v=y[1],i=y[2],e=-k*v,FL=k*i;
        rows.push({t:j*h,x:y[0],dx:y[0]-.18,v,i,e,flux:k*y[0],FL,F,E,Ec:.5*m*v*v,Ec0:.5*m*v0*v0,Q:y[3],We:y[4],Wm:y[5],Em:.5*L*i*i,Pm:F*v,Pe:E*i,PJ:R*i*i,Pind:e*i,PL:FL*v,dEc:(F+FL)*v});}

  }
  /* ---------- rails et condensateur (TD) ----------
     R i = u − aBv, i = −C du/dt, m dv/dt = aBi ; u(0) = U₀, v(0) = 0.
     τ = 1/(1/τ₁ + 1/τ₂), τ₁ = RC, τ₂ = mR/(aB)² ; v∞ = aBCU₀/(m + (aB)²C), u∞ = aBv∞. */
  function railsC(p,t){
    const k=p.a*p.B,R=p.R,C=p.C,m=p.m,U0=p.U0,t1=R*C,t2=k>0?m*R/(k*k):Infinity,tau=1/(1/t1+1/t2);
    const vinf=k*C*U0/(m+k*k*C),uinf=k*vinf,ex=Math.exp(-t/tau);
    const i=U0/R*ex,u=uinf+(U0-uinf)*ex,v=vinf*(1-ex),x=.18+vinf*(t-tau*(1-ex)),Q=U0*U0*tau/(2*R)*(1-ex*ex);

  }
  /* ---------- deux tiges sur les rails (TD) ----------
     courant compté vers le haut dans T₂ : i = aB(v₁ − v₂)/(2R) ; m dv₁/dt = −aBi, m dv₂/dt = aBi ; τ = mR/(aB)².
     Lancer : v₁ = v₀(1 + e^(−t/τ))/2, v₂ = v₀(1 − e^(−t/τ))/2.
     T₁ imposé V₀ cos ωt (régime forcé) : v₂ = V₀ cos(ωt − φ)/√(1 + (2ωτ)²), tan φ = 2ωτ. */
  function deuxTiges(p,t){
    const k=p.a*p.B,m=p.m,R=p.R,tau=k>0?m*R/(k*k):Infinity;let v1,v2,x1,x2;
    if(p.impose){const w=p.w,A=p.V0/Math.sqrt(1+(2*w*tau)**2),ph=Math.atan(2*w*tau);v1=p.V0*Math.cos(w*t);v2=A*Math.cos(w*t-ph);x1=.18+p.V0*Math.sin(w*t)/w;x2=.62+A*(Math.sin(w*t-ph)+Math.sin(ph))/w}
    else{const ex=isFinite(tau)?Math.exp(-t/tau):1,g=isFinite(tau)?tau*(1-ex):t;v1=p.v0*(1+ex)/2;v2=p.v0*(1-ex)/2;x1=.18+p.v0/2*(t+g);x2=.62+p.v0/2*(t-g)}
    const i=k*(v1-v2)/(2*R),Ec=.5*m*(v1*v1+v2*v2),Ec0=.5*m*p.v0*p.v0;
    return {t,x1,x2,v1,v2,i,F1:-k*i,F2:k*i,Ec,Ec0,Q:p.impose?NaN:Ec0-Ec,PJ:2*R*i*i,tau,flux:k*(x2-x1)};
  }
  /* ---------- rail gun (TD) : courant constant I, champ propre des rails ----------
     fils semi-infinis : B = μ₀I/(πa) ; fils infinis : B = 2μ₀I/(πa) ; F = IaB ; v_s = √(2IaBL/m). */
  function railgun(p,t){
    const mu0=4e-7*Math.PI,B=(p.modele==='infini'?2:1)*mu0*p.I/(Math.PI*p.a),F=p.I*p.a*B,acc=F/p.m,ts=Math.sqrt(2*p.L/acc),tt=Math.min(t,ts);
    return {t,B,F,acc,ts,vs:acc*ts,v:acc*tt,x:.5*acc*tt*tt,Ec:.5*p.m*(acc*tt)**2,W:F*.5*acc*tt*tt};
  }
  return Object.freeze({surface,altTransitoire,altLibre,tige,cadre,psi,rk4,railsL,railsC,deuxTiges,railgun});
})();

/* =====================================================================
   Outils communs des animations d'induction (EM3, EM4) · AnimKit
   - EMK.unit(max, unité) : préfixe SI lisible (m, µ, n, k) pour les axes et mesures
   - EMK.vt(...)          : lettre surmontée d'une flèche (vecteur) dans un texte SVG
   - EMK.tplot(...)       : graphe temporel tracé jusqu'à l'instant courant (option « futur »),
                            tangente, aire algébrique sous la courbe, courbes fantômes
   - EMK.split(box, n)    : découpe verticale d'un panneau en n graphes
   ===================================================================== */
'use strict';
globalThis.EMK=(()=>{
  const PREF=[[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n']];
  /** facteur et préfixe pour que max soit entre 1 et 1000 */
  function unit(max,u){
    max=Math.abs(max);
    if(!(max>0)||!isFinite(max))return {f:1,u};
    for(const[s,p]of PREF)if(max>=s*.9995)return {f:1/s,u:p+u};
    return {f:1e9,u:'n'+u};
  }
  function vt(a,x,y,l,sub,o={}){
    const S=a.S,k=a.k,size=o.size??16,fs=size*k,wl=.62*fs,w=wl+(sub?.42*fs*String(sub).length:0);
    const x0=o.anchor==='middle'?x-w/2:o.anchor==='end'?x-w:x;
    return S.text(x0,y,S.v(l,sub),{size,c:o.c,weight:o.weight})+S.arrow(x0+.08*fs,y-.68*fs,x0+wl+.05*fs,y-.68*fs,{c:o.c,w:.9,head:4.2*k});
  }
  function split(P,n,gap){
    const k=1,g=gap??6;const h=(P.h-g*(n-1))/n;
    return Array.from({length:n},(_,i)=>({x:0,y:i*(h+g),w:P.w,h}));
  }
  /**
   * o = {box, T, xmin, t, futur, n, ylab, xlab, sym:true (axe symétrique),
   *      series:[{f|vals, c, w, dash, all(true : toujours entière), ghost}],
   *      tangent:{f, df, c}, area:{f, c}, id, marks:[{x, label, c}]}
   */
  function tplot(a,o){
    const S=a.S,k=a.k,C=a.C,n=o.n||300,x0=o.xmin??0,T=o.T,box=o.box;
    const xs=Array.from({length:n+1},(_,i)=>x0+(T-x0)*i/n);
    const ser=o.series.map(s=>({...s,v:s.vals||xs.map(s.f)}));
    let lo=Infinity,hi=-Infinity;
    for(const s of ser)for(const v of s.v)if(isFinite(v)){if(v<lo)lo=v;if(v>hi)hi=v}
    if(o.zero!==false){lo=Math.min(lo,0);hi=Math.max(hi,0)}
    if(o.sym){const m=Math.max(Math.abs(lo),Math.abs(hi));lo=-m;hi=m}
    if(!(hi-lo>1e-30)){hi=1;lo=o.sym?-1:0}
    const pd=(hi-lo)*.08;
    const G=S.graph({x:box.x+4*k,y:box.y+2*k,w:box.w-8*k,h:box.h-4*k,xmin:x0,xmax:T,ymin:lo-(lo<0?pd:0),ymax:hi+pd,
      xlab:o.xlab??`${S.v('t')} (s)`,ylab:o.ylab,padL:o.padL});
    const tc=Math.max(x0,Math.min(T,o.t));
    const id=(o.id||'g')+Math.round(box.y);
    let s=G.svg+S.clip(id,G);
    const upto=(v,all)=>{const pts=[];for(let i=0;i<=n;i++){if(!all&&xs[i]>tc+1e-12)break;pts.push([xs[i],v[i]])}return pts};
    if(o.area){
      const pts=[];for(let i=0;i<=n;i++){if(xs[i]>tc+1e-12)break;pts.push([xs[i],o.area.f(xs[i])])}
      pts.push([tc,o.area.f(tc)]);
      if(pts.length>1){const d='M'+G.X(pts[0][0]).toFixed(1)+','+G.Y(0).toFixed(1)+pts.map(p=>'L'+G.X(p[0]).toFixed(1)+','+G.Y(p[1]).toFixed(1)).join('')+'L'+G.X(tc).toFixed(1)+','+G.Y(0).toFixed(1)+'Z';
        s+=`<g clip-path="url(#${id})"><path d="${d}" fill="${o.area.c}" fill-opacity=".22" stroke="none"/></g>`}
    }
    for(const sr of ser){
      const all=o.futur||sr.all, pts=upto(sr.v,all);
      if(!all&&!sr.vals&&sr.f)pts.push([tc,sr.f(tc)]);
      s+=S.curve(pts,G,{c:sr.c,w:sr.w??2.4,dash:sr.dash?`${6*k} ${4*k}`:undefined,op:sr.op});
    }
    if(o.tangent){
      const y0=o.tangent.f(tc),sl=o.tangent.df(tc),L=(T-x0)*.16;
      s+=S.curve([[tc-L,y0-sl*L],[tc+L,y0+sl*L]],G,{c:o.tangent.c||C.pred,w:1.8,dash:`${5*k} ${3*k}`});
    }
    for(const m of o.marks||[]){if(m.x<x0||m.x>T)continue;
      s+=S.line(G.X(m.x),G.y0,G.X(m.x),G.y0+G.h,{c:m.c||C.pred,w:1.2,dash:`${2*k} ${3*k}`})+S.text(G.X(m.x)+4*k,G.y0+4*k,m.label,{base:'top',size:13,c:m.c||C.pred})}
    s+=S.line(G.X(tc),G.y0,G.X(tc),G.y0+G.h,{c:C.ink2,w:1,dash:`${3*k} ${4*k}`});
    for(const sr of ser)if(sr.f&&!sr.ghost){const y=sr.f(tc);if(isFinite(y))s+=S.circle(G.X(tc),G.Y(y),3.8*k,{fill:sr.c})}
    return {svg:s,G};
  }
  return Object.freeze({unit,vt,split,tplot});
})();

/* Fonction de flux Ψ = r A_φ d'anneaux coaxiaux (axe x) : les lignes de champ sont les
   lignes de niveau de Ψ (flux à travers le disque de rayon r centré sur l'axe : 2πΨ).
   Intégrales elliptiques complètes par moyenne arithmético-géométrique. */
globalThis.EMPsi=(()=>{
  const MU0=4e-7*Math.PI;
  function ellip(m){let a=1,b=Math.sqrt(1-m),sum=m/2,w=1;
    for(let i=0;i<24;i++){const c=(a-b)/2,na=(a+b)/2;sum+=w*c*c;w*=2;b=Math.sqrt(a*b);a=na;if(Math.abs(c)<2e-16*a)break;}
    const K=Math.PI/(2*a);return [K,K*(1-sum)];}
  function ring(a,I,z,r){
    if(r<1e-9)return 0;
    const m=Math.min(1-1e-12,4*a*r/((a+r)**2+z*z)),[K,E]=ellip(m),kk=Math.sqrt(m);
    return r*MU0*I/(Math.PI*kk)*Math.sqrt(a/r)*((1-m/2)*K-E);
  }
  /** rings = [{a, x, I}] ; renvoie Ψ(x, r) */
  const psi=(rings,x,r)=>{let s=0;for(const q of rings)s+=ring(q.a,q.I,x-q.x,r);return s;};
  /** lignes de niveau (carrés marchants) : grille F[(j)*(nx+1)+i], renvoie [[x1,y1,x2,y2]…] par niveau */
  function contours(F,nx,ny,levels){
    const out=levels.map(()=>[]);
    for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
      const v0=F[j*(nx+1)+i],v1=F[j*(nx+1)+i+1],v2=F[(j+1)*(nx+1)+i+1],v3=F[(j+1)*(nx+1)+i];
      const lo=Math.min(v0,v1,v2,v3),hi=Math.max(v0,v1,v2,v3);
      levels.forEach((L,n)=>{
        if(L<=lo||L>=hi)return;
        const c=(v0>L)|(v1>L)<<1|(v2>L)<<2|(v3>L)<<3;
        const e=q=>q===0?[i+(L-v0)/(v1-v0),j]:q===1?[i+1,j+(L-v1)/(v2-v1)]:q===2?[i+(L-v3)/(v2-v3),j+1]:[i,j+(L-v0)/(v3-v0)];
        const T={1:[[3,0]],2:[[0,1]],3:[[3,1]],4:[[1,2]],5:[[3,2],[0,1]],6:[[0,2]],7:[[3,2]],8:[[2,3]],9:[[0,2]],10:[[0,3],[1,2]],11:[[1,2]],12:[[1,3]],13:[[0,1]],14:[[0,3]]}[c];
        if(T)for(const[a,b]of T){const p=e(a),q=e(b);out[n].push([p[0],p[1],q[0],q[1]]);}
      });
    }
    return out;
  }
  return Object.freeze({ring,psi,contours,MU0});
})();

// @titre Rails de Laplace · EM5 · MPSI
// @sortie ../EM5_Rails_Laplace/EM5_Rails_Laplace.html
// @inclure physique.js
// @inclure EM5_Ajouts_physique.js
// @inclure ../../../EM3_FondementsInduction/EM3_Animations/_Sources/EM3_commun.js
// @description Rails de Laplace en générateur, moteur et freinage, avec condensateur, deux tiges et rail gun : induction de Lorentz et bilans de puissance.
'use strict';
/* =====================================================================
   EM5 · Rails de Laplace (6 onglets)
   Physique : EM5.rails (physique.js, solution analytique, inchangée) ;
   EM5X.railsL (auto-inductance, RK4), railsC, deuxTiges, railgun (EM5_Ajouts_physique.js).
   Conventions : circuit orienté dans le sens direct vu suivant +z, B = B e_z (⊙),
   courant positif vers le haut dans la tige (dans T₂ pour deux tiges), e = −aBv, F_L = aBi.
   ===================================================================== */
const MODES=['generateur','moteur','freinage','condensateur','deuxtiges','railgun'];
const M=AnimKit.M, G=9.81, DEG=Math.PI/180;
const sb=(base,sub)=>`${base}<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
let cache=null,cacheKey='';

/* ---------- paramètres effectifs ---------- */
function eff(a){const p=a.p,mode=MODES[a.tab];
  const incl=mode==='generateur'&&p.incline,treuil=mode==='moteur'&&p.treuil;
  return {...p,B:incl?p.B*Math.cos(p.alpha*DEG):p.B,F:incl?p.m*G*Math.sin(p.alpha*DEG):p.F,m:treuil?p.m+p.Mc:p.m,f:treuil?p.Mc*G:p.f,closed:mode==='moteur'||p.closed};
}
const duree=a=>a.tab===5?data(a).ts:a.p.duree;
function at(a,t){const mode=MODES[a.tab],q=eff(a);
  if(a.tab<=2){if(q.L>0&&q.closed)return EM5.sampleRows(data(a).rows,t);const r=EM5.rails(q,mode,t);r.Em=0;return r}
  if(a.tab===3)return EM5X.railsC(q,t);
  if(a.tab===4)return EM5X.deuxTiges(q,t);
  return EM5X.railgun({I:q.I*1e6,a:q.aG,m:q.mG,L:q.LG,modele:q.modele},t);
}
function data(a){

      {const L=sat(q.v,vM,mx);if(Math.abs(L)>2*k)s+=S.arrow(rod,top-20*k,rod+L,top-20*k,{c:C.v,w:2.6})+S.text(rod+L+Math.sign(L)*10*k,top-20*k,S.v('v'),{anchor:'middle',size:17,c:C.v})}
      {const L=sat(q.FL,FM,mx),y=bot-gap*.18;if(Math.abs(L)>2*k)s+=S.arrow(rod,y,rod+L,y,{c:C.F,w:2.6})+S.text(rod+L/2,y-13*k,sb(S.v('F'),'L'),{anchor:'middle',size:16,c:C.F})}
      if(a.tab<=2){const L=sat(q.F,FM,mx),y=top+gap*.2;if(Math.abs(L)>2*k)s+=S.arrow(rod,y,rod+L,y,{c:C.ink,w:2.2})+S.text(rod+L/2,y-13*k,mode==='moteur'?(p.treuil?`−${S.v('M')}${S.v('g')}`:`−${S.v('f')}`):p.incline?`${S.v('m')}${S.v('g')} sin α`:S.v('F'),{anchor:'middle',size:16,c:C.ink})}}
    else if(a.tab===4){const vM=Math.max(d.mx('v1'),d.mx('v2')),FM=d.mx('F2');for(const[j,vv,FF]of[[0,q.v1,q.F1],[1,q.v2,q.F2]]){const rod=P.geo.rods[j];
      {const L=sat(vv,vM,mx*.7),yv=top-(j?38:18)*k;if(Math.abs(L)>2*k)s+=S.arrow(rod,yv,rod+L,yv,{c:C.v,w:2.6})+S.text(rod+L+Math.sign(L)*12*k,yv,S.v('v',String(j+1)),{anchor:'middle',size:16,c:C.v})}
      {const L=sat(FF,FM,mx*.7),y=bot-gap*.18;if(Math.abs(L)>2*k)s+=S.arrow(rod,y,rod+L,y,{c:C.F,w:2.6})}}}
    else{const rod=P.geo.rods[0];const L=mx*q.v/d.vs;if(L>2*k)s+=S.arrow(rod,top-20*k,rod+L,top-20*k,{c:C.v,w:2.6})+S.text(rod+L+10*k,top-20*k,S.v('v'),{size:17,c:C.v});s+=S.arrow(rod,bot-gap*.18,rod+mx*.6,bot-gap*.18,{c:C.F,w:2.6})+S.text(rod+mx*.6+8*k,bot-gap*.18,sb(S.v('F'),'L')+' = '+S.v('IaB'),{size:15,c:C.F})}
  }
  // en-tête et repères
  const head=a.tab===5?`Rail gun · ${S.v('I')} = ${a.fmt.fix(p.I,1)} × 10${S.sup('6')} A · ${S.v('L')} = ${a.fmt.sig(p.LG,2)} m`:a.tab===3?`Condensateur ${S.v('C')} = ${a.fmt.sig(p.C,2)} F`:a.tab===4?(p.impose?'T₁ imposé · T₂ libre':'T₁ lancé · T₂ au repos'):mode==='moteur'?(p.treuil?`Treuil · ${S.v('E')} = ${a.fmt.fix(p.E,2)} V · ${S.v('M')} = ${a.fmt.sig(p.Mc*1000,3)} g`:`Source ${S.v('E')} = ${a.fmt.fix(p.E,2)} V`):e.closed?'Circuit fermé':'Circuit ouvert : pas de courant ni de force de Laplace';
  const bTxt=a.tab===5?'':`   ·   ${S.v('B')} = ${a.fmt.fix(p.B,2)} T ${p.incline&&a.tab===0?'vertical':'⊙'}`;
  if(p.incline&&a.tab===0)s+=S.text(10*k,32*k,`rails inclinés de ${a.fmt.fix(p.alpha,0)}° (vue perpendiculaire aux rails) : composante normale ${S.v('B')} cos α = ${a.fmt.fix(e.B,2)} T`,{base:'top',size:14,c:C.B});
  s+=S.text(10*k,10*k,head+`<tspan fill="${C.B}">${bTxt}</tspan>`,{base:'top',size:14,c:C.ink});
  if(a.tab<5&&p.B===0)s+=S.text(w/2,cy,'champ nul : aucun couplage électromécanique',{anchor:'middle',size:16,c:C.ink,weight:600});
  if(a.tab<=2&&p.treuil&&mode==='moteur'&&q.v<-1e-6)s+=S.text(w/2,bot+22*k,'E trop faible : la charge descend et entraîne la tige (générateur)',{anchor:'middle',size:14,c:C.ink});
  const dx=right+16*k;s+=S.line(dx,top,dx,bot,{c:C.ink2,w:1})+S.line(dx-4*k,top,dx+4*k,top,{c:C.ink2,w:1})+S.line(dx-4*k,bot,dx+4*k,bot,{c:C.ink2,w:1})+S.text(dx+6*k,cy,S.v('a'),{size:15});
  s+=S.text(10*k,h-10*k,a.tab===4?`${S.v('x','2')} − ${S.v('x','1')} = ${a.fmt.sig(q.x2-q.x1,3)} m`:`${S.v('x')} = ${a.fmt.sig(a.tab===5?q.x:q.x,3)} m`,{base:'bottom',size:15,c:C.ink});
  const ox=w-60*k,oy=h-20*k;s+=S.arrow(ox,oy,ox+24*k,oy,{c:C.ink2,w:1.3})+S.text(ox+27*k,oy,S.v('x'),{size:13})+S.arrow(ox,oy,ox,oy-24*k,{c:C.ink2,w:1.3})+S.text(ox+4*k,oy-26*k,S.v('y'),{size:13});
  a.svg('scene',s);
  lg.push({c:C.v,label:'vitesse'},{c:C.F,label:'force de Laplace'},{c:C.E,label:'courant (sens réel)'});
}
A.drag('scene',{hit:(x)=>{const g=A.panels.scene.geo;return g&&g.rods.some(r=>Math.abs(x-r)<16*A.k)},start(){A.play(false)},
  move(x){const g=A.panels.scene.geo,d=data(A),T=duree(A);if(A.tab===5){const P=A.panels.scene,left=46*A.k,right=P.w-34*A.k,fr=Math.max(0,Math.min(1,(x-left-(right-left)*.04)/((right-left)*.9)));A.t=Math.sqrt(fr)*T;return}
    const right=A.panels.scene.w-34*A.k,left=46*A.k,xa=left+(right-left)*.22,xb=right-(right-left)*.08,target=d.xr[0]+Math.max(0,Math.min(1,(x-xa)/(xb-xa)))*(d.xr[1]-d.xr[0]),key=A.tab===4?'x2':'x';
    let best=d.rows[0];for(const r of d.rows)if(Math.abs(r[key]-target)<Math.abs(best[key]-target))best=r;A.t=best.t}});

/* ---------- graphes ---------- */
function graphe(a,d,q,lg){
  const P=a.panels.graphe,S=a.S,C=a.C,k=a.k,p=a.p,mode=MODES[a.tab],T=duree(a),fut=p.futur,full={x:0,y:0,w:P.w,h:P.h};
  const fn=key=>t=>at(a,t)[key];let s='';const L=(c,label,dash)=>lg.push({c,label,dash});
  const tp=(box,series,ylab,o={})=>{const r=EMK.tplot(a,{box,T,t:a.t,futur:fut,series,ylab,sym:o.sym,id:o.id,n:400,tangent:o.tangent,xlab:o.xlab});s+=r.svg;return r.G};
  const dashS=`${6*k} ${4*k}`;
  if(a.tab<=2){const c=p.courbe,half=EMK.split(P,2);
    if(c==='mouvement'){const ser=[{f:fn('v'),c:C.v}];let tg=null;
      if(fut&&d.vlim!==undefined){ser.push({f:()=>d.vlim,c:C.pred,dash:true,all:true,ghost:true});if(!(eff(a).L>0)){const v0=mode==='freinage'?p.v0:0,s0=(d.vlim-v0)/d.tau;tg={f:t=>v0+s0*t,df:()=>s0,c:C.pred}}}
      const G1=EMK.tplot(a,{box:half[0],T,t:a.t,futur:fut,series:ser,ylab:`${S.v('v')} (m·s${S.sup('−1')})`,id:'v',n:400});s+=G1.svg;
      if(tg){const G0=G1.G,x1=Math.min(T,d.tau*1.6);s+=S.curve([[0,tg.f(0)],[x1,tg.f(x1)]],{...G0,clip:'v'+Math.round(half[0].y)},{c:C.pred,w:1.6,dash:`${5*k} ${3*k}`});const Xt=G0.X(d.tau);s+=S.line(Xt,G0.Y(0),Xt,G0.Y(0)-5*k,{c:C.pred,w:1.4})+S.text(Xt+4*k,G0.Y(0)-16*k,`τ = ${a.fmt.sig(d.tau,3)} s`,{anchor:'middle',size:13,c:C.pred})}
      tp(half[1],[{f:fn('i'),c:C.E}],`${S.v('i')} (A)`,{id:'i'});
      if(fut&&d.vlim!==undefined)L(C.pred,`${mode==='freinage'?'vitesse finale nulle':'vitesse limite '+a.fmt.sig(d.vlim,3)+' m·s<sup>−1</sup>'}${eff(a).L>0?'':' ; tangente à l\'origine : τ = <i class="m">mR</i>/(<i class="m">aB</i>)<sup>2</sup>'}`,true)}
    else if(c==='flux'){tp(half[0],[{f:fn('flux'),c:C.B}],`${S.r('Φ')} (Wb)`,{id:'f'});tp(half[1],[{f:fn('e'),c:C.cInk}],`${S.v('e')} (V)`,{id:'e'});L(C.B,'flux Φ = aBx');L(C.cInk,'f.é.m. e')}
    else{const pu=c==='puissances',Lq=eff(a).L>0;let se;
      if(pu)se=mode==='moteur'?[{f:fn('Pe'),c:C.cInk,n:'fournie par la source'},{f:t=>-at(a,t).Pm,c:C.ink,n:'reçue par la charge',dash:true},{f:fn('PJ'),c:C.F,n:'Joule',dash:true},{f:fn('dEc'),c:C.v,n:'dEc/dt',dash:true}]
        :[{f:t=>{const r=at(a,t);return r.Pe+r.Pm},c:C.cInk,n:'fournie'},{f:fn('PJ'),c:C.F,n:'Joule',dash:true},{f:fn('dEc'),c:C.v,n:'dEc/dt',dash:true}];
      else se=mode==='moteur'?[{f:fn('We'),c:C.cInk,n:'fournie par la source'},{f:t=>-at(a,t).Wm,c:C.ink,n:'reçue par la charge',dash:true},{f:fn('Q'),c:C.F,n:'Joule',dash:true},{f:fn('Ec'),c:C.v,n:'Ec',dash:true}]
        :mode==='freinage'?[{f:fn('Ec0'),c:C.cInk,n:'Ec initiale'},{f:fn('Q'),c:C.F,n:'Joule',dash:true},{f:fn('Ec'),c:C.v,n:'Ec',dash:true}]
        :[{f:t=>{const r=at(a,t);return r.We+r.Wm},c:C.cInk,n:'fournie'},{f:fn('Q'),c:C.F,n:'Joule',dash:true},{f:t=>{const r=at(a,t);return r.Ec-r.Ec0},c:C.v,n:'ΔEc',dash:true}];
      if(!pu&&Lq)se.push({f:fn('Em'),c:C.Em,n:'magnétique ½Li²',dash:true});
      tp(full,se,pu?'Puissances (W)':'Énergies depuis t = 0 (J)',{id:'pe'});for(const x of se)L(x.c,(pu?'puissance ':'')+x.n,!!x.dash)}
  }else if(a.tab===3){const c=p.courbeC,half=EMK.split(P,2);
    if(c==='mouvement'){const ser=[{f:fn('v'),c:C.v}];if(fut)ser.push({f:()=>q.vinf,c:C.pred,dash:true,all:true,ghost:true});tp(half[0],ser,`${S.v('v')} (m·s${S.sup('−1')})`,{id:'v'});tp(half[1],[{f:fn('i'),c:C.E}],`${S.v('i')} (A)`,{id:'i'});
      if(fut)L(C.pred,`${M.v('v')}<sub>∞</sub> = ${M.v('aBCU','0')}/(${M.v('m')} + (${M.v('aB')})<sup>2</sup>${M.v('C')}) ; τ = ${a.fmt.sig(q.tau,3)} s`,true)}
    else if(c==='tension'){const ser=[{f:fn('u'),c:C.cInk}];if(fut)ser.push({f:()=>q.uinf,c:C.pred,dash:true,all:true,ghost:true});tp(full,ser,`${S.v('u')} (V)`,{id:'u'});L(C.cInk,'tension du condensateur');if(fut)L(C.pred,`${M.v('u')}<sub>∞</sub> = ${M.v('aBv')}<sub>∞</sub> : le condensateur ne se décharge pas complètement`,true)}
    else{tp(full,[{f:fn('EC'),c:C.cInk},{f:fn('Ec'),c:C.v,dash:true},{f:fn('Q'),c:C.F,dash:true},{f:t=>{const r=at(a,t);return r.EC+r.Ec+r.Q},c:C.pred,dash:true}],'Énergies (J)',{id:'en'});L(C.cInk,'½Cu²');L(C.v,'Ec',true);L(C.F,'Joule',true);L(C.pred,'somme',true)}
  }else if(a.tab===4){const c=p.courbeD;
    if(c==='vitesses'){const ser=[{f:fn('v1'),c:C.v},{f:fn('v2'),c:C.cInk,dash:true}];if(fut&&!p.impose)ser.push({f:()=>p.v0/2,c:C.pred,dash:true,all:true,ghost:true});tp(full,ser,`Vitesses (m·s${S.sup('−1')})`,{id:'v',sym:p.impose});L(C.v,'v₁');L(C.cInk,'v₂',true);if(fut&&!p.impose)L(C.pred,`vitesse commune ${M.v('v','0')}/2 ; τ = ${a.fmt.sig(q.tau,3)} s`,true);if(fut&&p.impose){const ph=Math.atan(2*p.w*q.tau);L(C.pred,`${M.v('v','2')} : amplitude ${a.fmt.sig(p.V0/Math.sqrt(1+(2*p.w*q.tau)**2),3)} m·s<sup>−1</sup>, retard ${a.fmt.fix(ph/DEG,1)}°`,true)}}
    else if(c==='courant'){tp(full,[{f:fn('i'),c:C.E}],`${S.v('i')} (A)`,{id:'i',sym:p.impose});L(C.E,'courant (vers le haut dans T₂)')}
    else{const se=[{f:fn('Ec'),c:C.v},{f:fn('PJ'),c:C.F,dash:true}];if(!p.impose)se[1]={f:fn('Q'),c:C.F,dash:true};tp(full,se,p.impose?'Ec (J) et puissance Joule (W)':'Énergies (J)',{id:'en'});L(C.v,'énergie cinétique des deux tiges');L(C.F,p.impose?'puissance Joule':'chaleur Joule',true);if(fut&&!p.impose)L(C.pred,'la moitié de l\'énergie initiale est dissipée',true)}
  }else{const ser=[{f:fn('v'),c:C.v}];if(fut)ser.push({f:()=>340,c:C.pred,dash:true,all:true,ghost:true});
    s+=EMK.tplot(a,{box:full,T:T*1000,t:a.t*1000,futur:fut,series:ser.map(x=>({...x,f:x.ghost?x.f:t=>x.f(t/1000)})),ylab:`${S.v('v')} (m·s${S.sup('−1')})`,xlab:`${S.v('t')} (ms)`,id:'g',n:300}).svg;
    L(C.v,'vitesse du projectile');if(fut)L(C.pred,'célérité du son dans l\'air (340 m·s<sup>−1</sup>)',true)}
  a.svg('graphe',s);
}
