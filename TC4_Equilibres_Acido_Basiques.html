  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){

        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

      N.addEventListener('dblclick',e=>{const[x,y]=toV(scr(e));if(!P._drags.some(d=>d.hit&&d.hit(x,y,e))&&zoomed(P))A.cadrer(P)});
      N.addEventListener('pointerenter',()=>{A._hover=P});
    }
  }
  for(const P of Object.values(A.panels))wire(P);
  A.drag=(id,h)=>{A.panels[id]._drags.push(h)};

  /* ---------- export image (toujours en thème clair) ---------- */
  A.exportImage=async()=>{
    const was=root.dataset.theme; root.dataset.theme='light'; readColors(); A.renderNow();
    const vis=Object.values(A.panels).filter(P=>!P.el.hidden), base=pwrap.getBoundingClientRect(), sc=2;
    const cv=document.createElement('canvas'); cv.width=Math.round(base.width*sc); cv.height=Math.round(base.height*sc);
    const ctx=cv.getContext('2d'); ctx.fillStyle=A.C.card; ctx.fillRect(0,0,cv.width,cv.height);
    const jobs=vis.map(P=>new Promise(res=>{const r=P.node.getBoundingClientRect(), x=(r.left-base.left)*sc, y=(r.top-base.top)*sc;
      if(P.type==='canvas'){ctx.drawImage(P.node,x,y,r.width*sc,r.height*sc);res();return}
      const clone=P.node.cloneNode(true); clone.setAttribute('width',r.width); clone.setAttribute('height',r.height);
      const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
      const im=new Image(); im.onload=()=>{ctx.drawImage(im,x,y,r.width*sc,r.height*sc);res()}; im.onerror=()=>res(); im.src=src;}));
    await Promise.all(jobs);
    root.dataset.theme=was; readColors(); A.renderNow();
    const a=document.createElement('a'); const tabName=cfg.onglets&&cfg.onglets.length>1?'_'+(A.tab+1):'';
    a.download=`${cfg.code}_${(cfg.fichier||cfg.titre).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_')}${tabName}.png`;
    a.href=cv.toDataURL('image/png'); a.click(); A.toast('Image enregistrée (thème clair)');
  };

  /* ---------- aide ---------- */
  function buildHelp(){
    const h=cfg.aide||{}, sec=(t,c)=>c?`<h4>${t}</h4>${/^\s*</.test(c)?c:`<p>${c}</p>`}`:'';
    dlg.innerHTML=`<header><h3>Aide · ${cfg.titre}</h3><button class="mini" data-close>Fermer ✕</button></header><div class="db">
    ${cfg.sousTitre?`<p class="ak-dlg-sub">${cfg.sousTitre}</p>`:''}${sec('Ce qu\'on voit',h.voit)}${sec('Ce qu\'on peut faire',h.faire)}${sec('Modèle et hypothèses',h.modele)}${sec('Lien avec le cours',h.cours)}${sec('Pour aller plus loin',h.plus)}
    <h4>Raccourcis</h4><p>${cfg.temps?'<kbd>Espace</kbd> lecture / pause · <kbd>→</kbd> pas à pas · <kbd>R</kbd> recommencer · ':''}${tabs?`<kbd>1</kbd>–<kbd>${cfg.onglets.length}</kbd> onglets · `:''}<kbd>P</kbd> projection · <kbd>F</kbd> plein écran · <kbd>T</kbd> thème · <kbd>I</kbd> image · <kbd>H</kbd> aide${h.touches?' · '+h.touches:''}</p>
    <p>Vue : molette, pincement ou <kbd>+</kbd> <kbd>−</kbd> pour zoomer · <kbd>Maj</kbd> + glisser, deux doigts, ou glisser une vue zoomée pour la déplacer · « Cadrer », <kbd>0</kbd> ou double clic : vue initiale.</p>
    ${h.credits?`<h4>Crédits</h4><p>${h.credits}</p>`:''}</div>`;
    dlg.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===dlg)dlg.close()});
  }

  /* ---------- démarrage ---------- */
  buildSettings(); buildHelp(); readColors();
  if(cfg.init)cfg.init(A);
  refreshSettings(); A.reset();
  new ResizeObserver(()=>A.render()).observe(ak);
  return A;
}

window.AnimKit={app,fmt,M,ticks,niceStep,FONT,MATH,interrupteur};
})();

<script>
/* TC4 · Équilibres acido-basiques : modèle d'origine, inchangé (seule la déclaration window.AcidBaseModel devient const).
   mono/carbon : répartition ; reaction : réaction unique (ξ par dichotomie sur Q = K) ; aqueous : pH et quantités avec l'eau. */
'use strict';
const AcidBaseModel=Object.freeze({
 mono(pH,pKa){const r=10**(pH-pKa);return [1/(1+r),r/(1+r)]},
 carbon(pH,p1=6.3,p2=10.3){const a=10**(pH-p1),b=10**(2*pH-p1-p2),d=1+a+b;return [1/d,a/d,b/d]},
 quotient(n){const numerator=n[1]*n[2],denominator=n[0]*n[3];return denominator===0?(numerator===0?NaN:Infinity):numerator/denominator},
 reaction(n,p1,p2){
  if(n.length!==4||n.some(x=>!Number.isFinite(x)||x<0))throw new RangeError('Quantités positives ou nulles requises');
  const logK=(p2-p1)*Math.LN10,K=10**(p2-p1),lower=-Math.min(n[1],n[2]),upper=Math.min(n[0],n[3]);
  if(upper-lower<1e-15)return {K,xi:0,final:n.slice(),tau:0,Qi:this.quotient(n),lower,upper};
  let lo=lower,hi=upper;
  for(let i=0;i<140;i++){const x=(lo+hi)/2,a=[n[0]-x,n[1]+x,n[2]+x,n[3]-x];const logQ=Math.log(Math.max(0,a[1]))+Math.log(Math.max(0,a[2]))-Math.log(Math.max(0,a[0]))-Math.log(Math.max(0,a[3]));if(logQ>logK)hi=x;else lo=x;}
  const xi=(lo+hi)/2,final=[n[0]-xi,n[1]+xi,n[2]+xi,n[3]-xi].map(x=>Math.max(0,x)),capacity=xi>=0?upper:-lower;
  return {K,xi,final,tau:capacity?Math.abs(xi)/capacity:0,Qi:this.quotient(n),lower,upper};
 },
 aqueous(n,p1,p2,volumeML=100){
  if(n.length!==4||n.some(x=>!Number.isFinite(x)||x<0)||volumeML<=0)throw new RangeError('Mélange invalide');
  // n in mmol, volume in mL: n / volume gives mol/L.
  const total1=n[0]+n[1],total2=n[2]+n[3],spectator=(n[1]-n[2])/volumeML;
  const charge=p=>{const f1=this.mono(p,p1),f2=this.mono(p,p2);return 10**(-p)-10**(p-14)-total1/volumeML*f1[1]+total2/volumeML*f2[0]+spectator};
  let lo=-3,hi=17;
  for(let i=0;i<120;i++){const mid=(lo+hi)/2;if(charge(mid)>0)lo=mid;else hi=mid;}
  const pH=(lo+hi)/2,f1=this.mono(pH,p1),f2=this.mono(pH,p2),final=[total1*f1[0],total1*f1[1],total2*f2[0],total2*f2[1]];
  return {pH,final,h:10**(-pH),oh:10**(pH-14),chargeResidual:charge(pH),spectator};
 }
});

/* TC4 · Équilibres acido-basiques : ajouts de physique (lot 18).
   weak(kind, pK, c) : pH exact d'une solution d'acide faible (kind 'acide', couple AH/A⁻) ou de base faible (kind 'base',
   couple BH⁺/B) de concentration apportée c (mol/L) dans l'eau pure : électroneutralité [H₃O⁺] = [HO⁻] + [A⁻]
   (ou [H₃O⁺] + [BH⁺] = [HO⁻]), avec Kₑ = 10⁻¹⁴, activités = concentrations, 25 °C.
   Approximations du cours : acide faible pH ≈ ½(pKa − log c) ; base faible pH ≈ 7 + ½(pKa + log c) ;
   acide fort pH = −log c ; base forte pH = 14 + log c. */
'use strict';
const WeakModel=(()=>{
 const mono=AcidBaseModel.mono;
 function exact(kind,pK,c){
  const charge=p=>{const f=mono(p,pK);return 10**(-p)-10**(p-14)+(kind==='acide'?-c*f[1]:c*f[0])};
  let lo=-3,hi=17;for(let i=0;i<120;i++){const m=(lo+hi)/2;if(charge(m)>0)lo=m;else hi=m}
  const pH=(lo+hi)/2,f=mono(pH,pK);
  /* taux de réaction avec l'eau : fraction de A⁻ (acide) ou de BH⁺ (base) formée */
  return{pH,h:10**(-pH),oh:10**(pH-14),alpha:kind==='acide'?f[1]:f[0],f,tau:kind==='acide'?f[1]:f[0]};
 }
 const approx=(kind,pK,c)=>kind==='acide'?.5*(pK-Math.log10(c)):7+.5*(pK+Math.log10(c));
 const strong=(kind,c)=>kind==='acide'?-Math.log10(c):14+Math.log10(c);
 return{exact,approx,strong};
})();

// @titre Atelier d'équilibres acido-basiques · TC4 · MPSI
// @sortie ../TC4_Equilibres_Acido_Basiques/TC4_Equilibres_Acido_Basiques.html
// @inclure TC4_Equilibres_Acido_Basiques_physique.js
// @inclure TC4_Ajouts_physique.js
// @description Atelier d'équilibres acido-basiques : diagrammes de distribution et de prédominance, prévision, calcul et interprétation d'un mélange, acide ou base faible dans l'eau.
'use strict';
/* =====================================================================
   TC4 · Atelier d'équilibres acido-basiques (5 onglets)
   1 Explorer (pH imposé) · 2 Prévoir (K, Q₀) · 3 Calculer (réaction unique) · 4 Interpréter (avec l'eau) · 5 Acide ou base dans l'eau
   Physique : AcidBaseModel (TC4_Equilibres_Acido_Basiques_physique.js, d'origine, inchangée) ;
   ajouts TC4_Ajouts_physique.js : pH exact d'un acide ou d'une base faible (proposition F), formules approchées.
   Lot 18 : sur AnimKit ; pH de 0 à 14 fixe (zoom du kit) ; prévisions (K, Q₀, équilibre, résultats aqueux, formules approchées)
   masquées au départ ; progression de ξ au curseur temporel ; comparaison en barres (introduit / réaction unique / avec l'eau).
   ===================================================================== */
const MD=AcidBaseModel,WK=WeakModel,fm=AnimKit.fmt,Mh=AnimKit.M;
const CARB2=10.3;
const st={prog:0,dir:1,hand:{dist:[],prevoir:[],phc:[]},plot:{dist:null,prevoir:null,phc:null}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rd=(v,d=2)=>Math.round(v*10**d)/10**d;
const sv=(a,s)=>String(s).replace(/<sup>(.*?)<\/sup>/g,(_,e)=>a.S.sup(e));
const subT=t=>`<tspan font-size="72%" dy="0.3em">${t}</tspan><tspan dy="-0.3em">​</tspan>`;
/* formules : 'CH_3COO^−' → SVG (tspan) ou HTML (<sub>, <sup>) */
const cS=(a,s)=>s.replace(/_(\d+)/g,(_,d)=>subT(d)).replace(/\^([0-9+−*]+)/g,(_,e)=>a.S.sup(e));
const cH=s=>s.replace(/_(\d+)/g,'<sub>$1</sub>').replace(/\^([0-9+−*]+)/g,'<sup>$1</sup>');
const pal=C=>({purple:C.dark?'#c79bff':'#7b3fb3'});
const real=(a)=>Math.abs(a.p.pk1-4.8)<1e-8&&Math.abs(a.p.pk2-9.2)<1e-8;
const names=a=>real(a)?['CH_3COOH','CH_3COO^−','NH_4^+','NH_3']:['AH','A^−','BH^+','B'];
const currentPK=a=>a.p.system==='ammonium'?a.p.pk2:a.p.pk1;
const nvec=a=>[a.p.n0,a.p.n1,a.p.n2,a.p.n3];
const calc=a=>({rx:MD.reaction(nvec(a),a.p.pk1,a.p.pk2),aq:MD.aqueous(nvec(a),a.p.pk1,a.p.pk2,a.p.vol)});
const num=(a,x,d=3)=>x===null||x===undefined||Number.isNaN(x)?'indéfini':!Number.isFinite(x)?'∞':x===0?'0':fm.sig(x,d);
const numS=(a,x,d=3)=>sv(a,num(a,x,d));
const wnames=a=>a.p.wkind==='acide'?['AH','A^−']:['BH^+','B'];

/* espèces tracées dans le diagramme de distribution */
function species(a,mix){
  const p=a.p,C=a.C,P=pal(C),nn=names(a),R=[C.F,C.B,C.E,P.purple];
  if(a.tab===4){const w=wnames(a);return[{name:w[0],c:C.F,dash:false,f:x=>MD.mono(x,p.wpk)[0]},{name:w[1],c:C.B,dash:true,f:x=>MD.mono(x,p.wpk)[1]}]}
  if(mix||p.system==='pair')return[
    {name:nn[0],c:R[0],dash:false,f:x=>MD.mono(x,p.pk1)[0]},{name:nn[1],c:R[1],dash:false,f:x=>MD.mono(x,p.pk1)[1]},
    {name:nn[2],c:R[2],dash:true,f:x=>MD.mono(x,p.pk2)[0]},{name:nn[3],c:R[3],dash:true,f:x=>MD.mono(x,p.pk2)[1]}];
  if(p.system==='carbon')return['CO_2*','HCO_3^−','CO_3^2−'].map((n,i)=>({name:n,c:[R[0],R[1],R[3]][i],dash:i===2,f:x=>MD.carbon(x,p.pk1,CARB2)[i]}));
  const pk=currentPK(a),ammo=p.system==='ammonium',std=Math.abs(pk-(ammo?9.2:4.8))<1e-8;
  const ns=std?(ammo?['NH_4^+','NH_3']:['CH_3COOH','CH_3COO^−']):(ammo?['BH^+','B']:['AH','A^−']);
  return ns.map((n,i)=>({name:n,c:[R[0],R[1]][i],dash:!!i,f:x=>MD.mono(x,pk)[i]}));
}

/* ---------- ligne de prédominance (avec poignée de pKa) ---------- */
function domaine(a,o,pl,y,pKa,acid,base,c1,c2,key,hand){
  const S=a.S,C=a.C,k=a.k,{X,left,right}=pl,px=clamp(X(pKa),left,right),W=pl.W;
  o.s+=S.rect(left,y-14*k,px-left,26*k,{fill:c1,fop:.14,rx:4})+S.rect(px,y-14*k,right-px,26*k,{fill:c2,fop:.14,rx:4});
  o.s+=S.line(left,y,right,y,{c:C.ink2,w:1})+S.line(px,y-17*k,px,y+18*k,{c:C.ink,w:2});
  const fs=W<650?15:19;
  if(px-left>55)o.s+=S.text((left+px)/2,y,cS(a,acid),{anchor:'middle',size:fs,c:c1,halo:false,weight:600});
  if(right-px>55)o.s+=S.text((px+right)/2,y,cS(a,base),{anchor:'middle',size:fs,c:c2,halo:false,weight:600});
  o.s+=S.circle(px,y,9*k,{fill:C.card,c:key?C.c:C.ink2,w:2});
  if(key)hand.push({x:px,y,key});
}

/* ---------- diagramme de distribution (+ lignes de prédominance) ---------- */
function dist(a,id,opt){
  const P=a.panels[id],S=a.S,C=a.C,k=a.k,p=a.p,W=P.w,H=P.h,mix=!!opt.mix;
  const two=mix||p.system==='pair'||p.system==='carbon';
  const left=W<600?52:65,right=W-32,top=36*k,bottom=H-(two?116:90)*k,ht=Math.max(45,bottom-top);
  const X=x=>left+x/14*(right-left),Y=f=>bottom-f*ht,pl={X,left,right,top,bottom,W};
  const hand=[];st.hand[id]=hand;st.plot[id]=pl;
  const o={s:''},G={X,Y,x0:left,y0:top,w:right-left,h:ht};
  for(let f=0;f<=1.001;f+=.25){o.s+=S.line(left,Y(f),right,Y(f),{c:C.grid,w:1,raw:true});o.s+=S.text(left-9,Y(f),fm.fix(f*100,0),{anchor:'end',size:14,c:C.ink2,halo:false})}
  o.s+=S.text(left,top-16*k,W<600?'%':'Proportion (%)',{size:14,c:C.ink2,halo:false});
  for(let x=0;x<=14;x++){o.s+=S.line(X(x),top,X(x),bottom,{c:C.grid,w:1,raw:true});if(X(x)<right-26)o.s+=S.text(X(x),bottom+18*k,String(x),{anchor:'middle',size:14,c:C.ink2,halo:false})}
  o.s+=S.text(right,bottom+18*k,'pH',{anchor:'end',size:15,c:C.ink,halo:false});
  const sp=species(a,mix),cid='tc4ab-'+id;
  o.s+=S.clip(cid,G);
  for(const s of sp){const pts=[];for(let i=0;i<=280;i++){const x=14*i/280;pts.push([x,s.f(x)])}o.s+=S.curve(pts,G,{c:s.c,w:3,dash:s.dash?`${9*k} ${5*k}`:undefined})}
  const mk=opt.marker;
  if(mk!==null&&mk!==undefined){
    o.s+=S.line(X(mk),top,X(mk),bottom,{c:C.c,w:2});
    for(const s of sp)o.s+=S.circle(X(mk),Y(s.f(mk)),5*k,{fill:s.c,c:C.card,w:1.5});
    o.s+=S.text(X(mk)+(X(mk)>right-80?-8:8)*k,top+10*k,'pH = '+fm.fix(mk,2),{anchor:X(mk)>right-80?'end':'start',size:14,c:C.cInk});
  }
  const pks=opt.pks;
  pks.forEach(v=>{if(X(v)>=left&&X(v)<=right)o.s+=S.line(X(v),top,X(v),bottom,{c:C.ink2,w:1,dash:`${2*k} ${6*k}`})});
  o.s+=S.text(right,top-16*k,pks.map((v,i)=>'p'+S.r('K')+S.r('a')+(pks.length>1?subT(i+1):'')+' = '+fm.fix(v,2)).join('  ·  '),{anchor:'end',size:W<600?13:15,c:C.ink2,halo:false});
  /* lignes de prédominance */
  const nn=names(a),ys=two?[H-72*k,H-25*k]:[H-31*k],P2=pal(C);
  if(opt.dom==='wk'){const w=wnames(a);domaine(a,o,pl,ys[0],p.wpk,w[0],w[1],C.F,C.B,'wpk',hand)}
  else if(mix||p.system==='pair'){domaine(a,o,pl,ys[0],p.pk1,nn[0],nn[1],C.F,C.B,'pk1',hand);domaine(a,o,pl,ys[1],p.pk2,nn[2],nn[3],C.E,P2.purple,'pk2',hand)}
  else if(p.system==='carbon'){domaine(a,o,pl,ys[0],p.pk1,'CO_2*','HCO_3^−',C.F,C.B,'pk1',hand);domaine(a,o,pl,ys[1],CARB2,'HCO_3^−','CO_3^2−',C.B,P2.purple,null,hand)}
  else{domaine(a,o,pl,ys[0],currentPK(a),sp[0].name,sp[1].name,sp[0].c,sp[1].c,p.system==='ammonium'?'pk2':'pk1',hand)}
  return o.s;
}

/* ---------- Prévoir : lignes de prédominance seules ---------- */
function prevoir(a,rx){
  const P=a.panels.prevoir,S=a.S,C=a.C,k=a.k,p=a.p,W=P.w,H=P.h,nn=names(a),P2=pal(C);
  const left=W<600?20:40,right=W-24,X=x=>left+x/14*(right-left),pl={X,left,right,top:0,bottom:H,W};
  const hand=[];st.hand.prevoir=hand;st.plot.prevoir=pl;const o={s:''};
  o.s+=S.text(W/2,H*.10,`${cS(a,nn[0])} + ${cS(a,nn[3])} ⇌ ${cS(a,nn[1])} + ${cS(a,nn[2])}`,{anchor:'middle',size:W<500?19:W<650?22:28,c:C.ink,halo:false,weight:600});
  const pLo=Math.min(p.pk1,p.pk2),pHi=Math.max(p.pk1,p.pk2);
  if(p.showK){
    o.s+=S.text(W/2,H*.20,`Δp${S.r('K')}${S.r('a')} = ${fm.fix(p.pk2-p.pk1,2)}   ·   ${S.v('K')} = ${numS(a,rx.K)}`,{anchor:'middle',size:W<500?16:20,c:C.cInk,halo:false});
    const xl=Math.max(left,X(pLo)),xr=Math.min(right,X(pHi));
    if(xr>xl)o.s+=S.rect(xl,H*.31,xr-xl,H*.34,{fill:C.c,fop:.09});
    o.s+=S.text(W/2,H*.83,p.pk2>p.pk1?(W<600?'Réactifs : domaines disjoints':cS(a,nn[0])+' et '+cS(a,nn[3])+' : domaines de prédominance disjoints'):p.pk2<p.pk1?(W<600?'Réactifs : domaine commun':cS(a,nn[0])+' et '+cS(a,nn[3])+' : domaine de prédominance commun'):'Même p'+S.r('K')+S.r('a')+' : '+S.v('K')+' = 1',{anchor:'middle',size:W<650?15:19,c:C.cInk});
  }
  const y1=H*.44,y2=H*.62;
  domaine(a,o,pl,y1,p.pk1,nn[0],nn[1],C.F,C.B,'pk1',hand);domaine(a,o,pl,y2,p.pk2,nn[2],nn[3],C.E,P2.purple,'pk2',hand);
  for(let x=0;x<=14;x+=2)o.s+=S.text(X(x),H*.73,String(x),{anchor:'middle',size:14,c:C.ink2,halo:false});
  o.s+=S.text(right,H*.73+20*k,'pH',{anchor:'end',size:15,c:C.ink,halo:false});
  o.s+=S.text(W/2,H*.95,'Déplacer les poignées pour modifier les p'+S.r('K')+S.r('a'),{anchor:'middle',size:W<650?14:16,c:C.ink2});
  a.svg('prevoir',o.s);
}

/* ---------- Calculer : tableau de la réaction unique ---------- */
function tableau(a,rx){
  const P=a.panels.tableau,S=a.S,C=a.C,k=a.k,p=a.p,W=P.w,H=P.h,nn=names(a),P2=pal(C),col=[C.F,C.B,C.E,P2.purple];
  const xi=rx.xi*st.prog,cur=[p.n0-xi,p.n1+xi,p.n2+xi,p.n3-xi],ini=nvec(a),q=x=>numS(a,x,3);
  let o=S.text(W/2,24*k,'Réaction unique · quantités en mmol',{anchor:'middle',size:W<650?16:20,c:C.cInk,halo:false,weight:600});
  const start=44*k;
  if(W<620){
    const left=10,right=W-10,lab=Math.min(92,W*.26),cw=(right-left-lab)/(p.showEq?3:2),rh=Math.min(58*k,(H-start-70*k)/5);
    const heads=['Initial','À ξ'].concat(p.showEq?['Final']:[]);
    o+=S.rect(left,start,right-left,rh,{fill:C.cSoft});
    heads.forEach((s,i)=>o+=S.text(left+lab+cw*(i+.5),start+rh/2,s,{anchor:'middle',size:14,c:C.ink2,halo:false}));
    nn.forEach((n,i)=>{const y=start+(i+1)*rh;o+=S.line(left,y,right,y,{c:C.rule,w:1});
      o+=S.text(left+4,y+rh/2,cS(a,n),{size:15,c:col[i],halo:false,weight:600});
      const vals=[ini[i],cur[i]].concat(p.showEq?[rx.final[i]]:[]);
      vals.forEach((v,j)=>o+=S.text(left+lab+cw*(j+.5),y+rh/2,q(v),{anchor:'middle',size:14,c:j===2?C.cInk:C.ink,halo:false}))});
    o+=S.text(W/2,Math.min(H-14*k,start+5*rh+24*k),`${S.v('ξ')} = ${q(xi)} mmol`+(p.showEq?` / ${S.v('ξ','é')} = ${q(rx.xi)} mmol`:''),{anchor:'middle',size:14,c:C.ink2,halo:false});
  }else{
    const left=18,right=W-18,lab=W<760?100:135,cw=(right-left-lab)/4,rh=Math.min(56*k,(H-start-64*k)/(p.showEq?5.1:4.2));
    o+=S.rect(left,start,right-left,rh,{fill:C.cSoft});
    o+=S.text(left+9,start+rh/2,'État',{size:15,c:C.ink2,halo:false});
    nn.forEach((n,i)=>o+=S.text(left+lab+cw*(i+.5),start+rh/2,cS(a,n),{anchor:'middle',size:W<760?17:21,c:col[i],halo:false,weight:600}));
    const rows=[['Introduit',ini],['Variation',[-xi,xi,xi,-xi]],['À ξ',cur]];
    if(p.showEq)rows.push(['Équilibre',rx.final]);
    rows.forEach(([label,vals],r)=>{const y=start+(r+1)*rh,last=p.showEq&&r===3;
      if(last)o+=S.rect(left,y,right-left,rh,{fill:C.cSoft});else o+=S.line(left,y,right,y,{c:C.rule,w:1});
      o+=S.text(left+9,y+rh/2,label,{size:15,c:last?C.cInk:C.ink2,halo:false});
      vals.forEach((v,i)=>o+=S.text(left+lab+cw*(i+.5),y+rh/2,(r===1&&v>0?'+':'')+q(v),{anchor:'middle',size:W<760?16:20,c:last?C.cInk:C.ink,halo:false}))});
    const rows2=rows.length+1;
    o+=S.text(W/2,Math.min(H-14*k,start+rh*rows2+26*k),`${S.v('ξ')} = ${numS(a,xi,4)} mmol`+(p.showEq?`   /   ${S.v('ξ','é')} = ${numS(a,rx.xi,4)} mmol`:''),{anchor:'middle',size:W<650?15:19,c:C.ink2,halo:false});
  }
  a.svg('tableau',o);
}

/* ---------- Interpréter : barres introduit / réaction unique / avec l'eau ---------- */
function barres(a,rx,aq){
  const P=a.panels.barres,S=a.S,C=a.C,k=a.k,p=a.p,W=P.w,H=P.h,nn=names(a),P2=pal(C),col=[C.F,C.B,C.E,P2.purple];
  const ini=nvec(a),mx=Math.max(.1,...ini,...rx.final,...aq.final)*1.12;
  const G=S.graph({x:2*k,y:2*k,w:W-4*k,h:H-4*k,xmin:0,xmax:4,ymin:0,ymax:mx,xlabels:false,xlab:'',ylab:'Quantité (mmol)',padB:30*k});
  let o=G.svg;
  const gw=G.w/4,bw=Math.min(26*k,gw/4.2);
  for(let i=0;i<4;i++){
    const cx=G.x0+gw*(i+.5),vals=[ini[i],p.showAq?rx.final[i]:null,p.showAq?aq.final[i]:null];
    vals.forEach((v,j)=>{if(v===null)return;const x=cx+(j-1)*(bw+3*k)-bw/2,h=v/mx*G.h;
      o+=j===0?S.rect(x,G.y0+G.h-h,bw,h,{fill:'none',c:col[i],w:1.8}):S.rect(x,G.y0+G.h-h,bw,h,{fill:col[i],fop:j===1?.45:1});});
    o+=S.text(cx,G.y0+G.h+18*k,cS(a,nn[i]),{anchor:'middle',size:15,c:col[i],halo:false,weight:600});
  }
  if(p.showAq)o+=S.text(G.x0+G.w,G.y0+8*k,'contour : introduit · clair : réaction unique · plein : avec l\'eau',{anchor:'end',size:13,c:C.ink2,base:'top'});
  a.svg('barres',o);
}

/* ---------- Acide ou base dans l'eau : pH en fonction de log c ---------- */
function phc(a,w){
  const P=a.panels.phc,S=a.S,C=a.C,k=a.k,p=a.p,ac=p.wkind==='acide';
  const G=S.graph({x:2*k,y:2*k,w:P.w-4*k,h:P.h-4*k,xmin:-6,xmax:0,ymin:0,ymax:14,xticks:[-6,-5,-4,-3,-2,-1,0],yticks:[0,2,4,6,8,10,12,14],xlab:'log '+S.v('c')+' (c en mol·L'+S.sup('−1')+')',ylab:'pH',padB:40*k});
  st.plot.phc=G;
  let o=G.svg+S.clip('tc4ab-phc',G);
  const N=100,ex=[],ap=[],sg=[];
  for(let i=0;i<=N;i++){const lc=-6+6*i/N,c=10**lc;ex.push([lc,WK.exact(p.wkind,p.wpk,c).pH]);ap.push([lc,WK.approx(p.wkind,p.wpk,c)]);sg.push([lc,WK.strong(p.wkind,c)])}
  o+=S.line(G.x0,G.Y(7),G.x0+G.w,G.Y(7),{c:C.ink2,w:1,dash:`${3*k} ${5*k}`});
  if(p.showApprox){
    o+=S.curve(sg,G,{c:C.ink2,w:1.8,dash:`${5*k} ${5*k}`});
    o+=S.curve(ap,G,{c:C.pred,w:2,dash:`${8*k} ${4*k}`});
  }
  o+=S.curve(ex,G,{c:C.c,w:3});
  const lc=Math.log10(p.wc),cx=G.X(lc),cy=G.Y(w.pH);
  o+=`<path d="M${cx.toFixed(1)},${(G.y0+G.h).toFixed(1)}V${cy.toFixed(1)}H${G.x0.toFixed(1)}" fill="none" stroke="${C.F}" stroke-width="${(1.5*k).toFixed(1)}" stroke-dasharray="${4*k} ${5*k}"/>`;
  o+=S.circle(cx,cy,7*k,{fill:C.F,c:C.card,w:2});
  o+=S.text(cx+(lc>-1.2?-10:10)*k,cy+(ac?-16:16)*k,'pH = '+fm.fix(w.pH,2),{anchor:lc>-1.2?'end':'start',size:14,c:C.cInk});
  o+=S.text(G.x0+G.w-6*k,G.Y(7)-10*k,'pH = 7',{anchor:'end',size:13,c:C.ink2,halo:false});
  a.svg('phc',o);
}

/* ---------- mesures, légende, temps ---------- */
function info(a,rx,aq){
  const p=a.p,t=a.tab,arr=[],sp=species(a,t===1||t===2||t===3),Mv=Mh.v;
  if(t===0){
    const fr=sp.map(s=>s.f(p.ph));
    arr.push({label:'pH imposé',value:fm.fix(p.ph,2)});
    if(sp.length===2)sp.forEach((s,i)=>arr.push({label:cH(s.name),value:fm.fix(fr[i]*100,1),unit:'%',hint:i===1?`[base]/[acide] = ${num(a,fr[1]/fr[0])}`:''}));
    else if(p.system==='carbon')sp.forEach((s,i)=>arr.push({label:cH(s.name),value:fm.fix(fr[i]*100,1),unit:'%'}));
    else{arr.push({label:`${cH(sp[0].name)} / ${cH(sp[1].name)}`,value:`${fm.fix(fr[0]*100,1)} / ${fm.fix(fr[1]*100,1)}`,unit:'%'});arr.push({label:`${cH(sp[2].name)} / ${cH(sp[3].name)}`,value:`${fm.fix(fr[2]*100,1)} / ${fm.fix(fr[3]*100,1)}`,unit:'%',hint:'chaque couple totalise 100 %'})}
  }else if(t===1&&p.showK){
    arr.push({label:`Écart p${Mv('K','a')}₂ − p${Mv('K','a')}₁`,value:fm.fix(p.pk2-p.pk1,2)});
    arr.push({label:`Constante ${Mv('K')}`,value:num(a,rx.K)});
    arr.push({label:`Quotient initial ${Mv('Q','0')}`,value:num(a,rx.Qi),hint:Number.isNaN(rx.Qi)?'0/0 : non défini':rx.Qi<rx.K?`${Mv('Q','0')} < ${Mv('K')} : sens direct`:rx.Qi>rx.K?`${Mv('Q','0')} > ${Mv('K')} : sens indirect`:'à l\'équilibre'});
  }else if(t===2&&p.showEq){
    const tau=rx.tau;
    arr.push({label:`Avancement d'équilibre ${Mv('ξ','é')}`,value:num(a,rx.xi,4),unit:'mmol'});
    arr.push({label:'Conversion dans le sens effectif',value:tau>.9999995&&tau<1?'< 100':fm.fix(tau*100,tau>.9999&&tau<1?4:2),unit:'%'});
    arr.push({label:`Constante ${Mv('K')}`,value:num(a,rx.K)});
  }else if(t===3&&p.showAq){
    const sc=[p.n0+p.n1,p.n0+p.n1,p.n2+p.n3,p.n2+p.n3],err=Math.max(...aq.final.map((v,i)=>sc[i]?Math.abs(v-rx.final[i])/sc[i]:0));
    arr.push({label:'pH final · eau incluse',value:fm.fix(aq.pH,3)});
    arr.push({label:'Écart maximal des fractions',value:fm.fix(err*100,3),unit:'point(s)',hint:'réaction unique / calcul avec l\'eau, au sein d\'une famille'});
    arr.push({label:'[H<sub>3</sub>O<sup>+</sup>] final',value:num(a,aq.h),unit:'mol·L⁻¹'});
  }else if(t===4){
    const w=WK.exact(p.wkind,p.wpk,p.wc),ac=p.wkind==='acide';
    arr.push({label:'pH de la solution',value:fm.fix(w.pH,2)});
    arr.push({label:ac?'Fraction d\'acide dissocié':'Fraction de base protonée',value:fm.fix(w.tau*100,w.tau<.01?3:1),unit:'%',hint:ac?'[A⁻]/c':'[BH⁺]/c'});
    if(p.showApprox){
      const ap=WK.approx(p.wkind,p.wpk,p.wc),stg=WK.strong(p.wkind,p.wc);
      arr.push({label:ac?`Approximation ½(p${Mv('K','a')} − log ${Mv('c')})`:`Approximation 7 + ½(p${Mv('K','a')} + log ${Mv('c')})`,value:fm.fix(ap,2),hint:`écart avec le calcul exact : ${(ap-w.pH>=0?'+':'−')}${fm.fix(Math.abs(ap-w.pH),2)} unité de pH`});
      arr.push({label:ac?'Si l\'acide était fort : −log c':'Si la base était forte : 14 + log c',value:fm.fix(stg,2)});
    }
  }
  a.metrics(arr);
  const nonvide=(t===0||t===3||t===4)?sp.map(s=>({c:s.c,label:cH(s.name),dash:s.dash})):[];
  a.legend(nonvide);
  a.clock(t===2?`${Mh.v('ξ')} = ${fm.sig(rx.xi*st.prog,3)} mmol · ${fm.fix(st.prog*100,0)} %`:t===4?`c = ${fm.sig(p.wc,3)} mol·L<sup>−1</sup>`:'');
}

/* ---------- poignées de pKa, ligne de pH ---------- */
function drag(id,tabOK){
  const pickH=(x,y)=>st.hand[id].find(h=>Math.hypot(h.x-x,h.y-y)<22);
  const phOf=(pl,x)=>clamp((x-pl.left)/(pl.right-pl.left)*14,0,14);
  let sel=null;
  A.drag(id,{
    hit:(x,y)=>{const pl=st.plot[id];if(!pl||!tabOK(A.tab))return false;return !!pickH(x,y)||(id==='dist'&&A.tab===0&&y>=pl.top&&y<=pl.bottom)},
    start:(x,y)=>{A.play(false);sel=pickH(x,y)||null;apply(x)},
    move:(x)=>apply(x),end:()=>{sel=null}
  });
  function apply(x){
    const pl=st.plot[id];if(!pl)return;const v=phOf(pl,x);
    if(sel){
      const lim=(sel.key==='pk1'&&A.p.system==='carbon'&&A.tab===0)?10.25:13;
      A.set(sel.key,rd(clamp(v,1,lim),2));
    }else A.set('ph',rd(v,2));
  }
}
drag('dist',t=>t===0||t===3||t===4);
drag('prevoir',t=>t===1);
