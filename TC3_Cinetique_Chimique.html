const MATH='"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif';
const MINUS='−';

/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  /** n chiffres significatifs, sans notation exponentielle */
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e<-3||e>=6){const m=x/10**e;return (+m.toFixed(n-1)).toFixed(n-1).replace('-',MINUS)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>'}
    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- mathématiques en HTML ---------------- */
const M={
  v:(s,sub,sup)=>`<span class="m">${s}</span>${sub!==undefined?`<sub>${sub}</sub>`:''}${sup!==undefined?`<sup>${sup}</sup>`:''}`,
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt"><span class="sym">√</span><span class="rad">${x}</span></span>`,
  vec:s=>`<span class="vec">${s}</span>`
};

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}
      return s;
    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){
      let d='',pen=false;
      for(const[x,y]of pts){if(!isFinite(y)||!isFinite(x)){pen=false;continue}
        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}
      return`<g clip-path="url(#${G.clip||''})">`+S.path(d,o)+'</g>';
    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}
  };
  return S;
}

/* ===================================================================== */
function app(cfg){
  const A={cfg,p:{},tab:0,t:0,running:false,speed:1,k:1,narrow:false,C:{},fmt,M,panels:{},_dirty:false};
  A.S=makeS(A);
  const root=document.documentElement;
  root.dataset.theme='dark';
  if(cfg.partie)root.style.setProperty('--chap',`var(--${cfg.partie})`);
  document.title=cfg.titreFenetre||`${cfg.titre} · ${cfg.code} · MPSI`;

  /* ---------- structure ---------- */
  const ak=el('div',{class:'ak',id:'ak'});
  const top=el('header',{class:'ak-top'});
  top.innerHTML=`<span class="ak-badge">${cfg.code}</span><div class="ak-titles"><h1 class="ak-title">${cfg.titre}</h1></div>
  <nav class="ak-tools" aria-label="Outils">
   <button class="ib ak-btn-settings" data-act="settings" title="Réglages">${IC.settings}<span class="ak-lbl">Réglages</span></button>
   <button class="ib" data-act="help" title="Aide (H)">${IC.help}<span class="ak-lbl">Aide</span></button>
   <button class="ib" data-act="theme" title="Thème clair / sombre (T)">${IC.theme}<span class="ak-lbl">Thème</span></button>
   <button class="ib" data-act="image" title="Enregistrer l'image (I)">${IC.image}<span class="ak-lbl">Image</span></button>
   <button class="ib" data-act="proj" title="Mode projection (P)">${IC.proj}<span class="ak-lbl">Projection</span></button>
   <button class="ib" data-act="fs" title="Plein écran (F)">${IC.fs}</button>
  </nav>`;
  ak.append(top);
  const tabs=cfg.onglets&&cfg.onglets.length>1?el('div',{class:'ak-tabs',role:'tablist'}):null;
  if(tabs){cfg.onglets.forEach((t,i)=>{const b=el('button',{class:'ak-tab',role:'tab','aria-selected':String(i===0),'data-tab':i},`<b>${i+1}</b>${t}`);b.onclick=()=>A.setTab(i);tabs.append(b)});ak.append(tabs)}
  const body=el('div',{class:'ak-body'}); ak.append(body);
  const main=el('main',{class:'ak-main'}); body.append(main);
  const scene=el('section',{class:'ak-card ak-scene'}); main.append(scene);
  /* disposition « atelier » (7 novembre 2026, facultative : cfg.atelier) :
     saisie à gauche ; résultat, graphique et détail du calcul à droite ; pas de colonne de réglages */
  A.zones={};
  if(cfg.atelier){
    const at=typeof cfg.atelier==='object'?cfg.atelier:{};
    ak.classList.add('ak-atelier');
    const left=el('section',{class:'ak-card ak-saisie'},`<div class="ak-zone-h">${at.saisie||'Mes mesures'}</div>`);
    A.zones.saisie=el('div',{class:'ak-saisie-body'}); left.append(A.zones.saisie);
    A.zones.resultat=el('section',{class:'ak-card ak-res','aria-live':'polite'});
    const det=el('details',{class:'ak-card ak-detail'},`<summary>${at.detail||'Voir le calcul'}</summary>`);
    A.zones.detail=el('div',{class:'ak-detail-body'}); det.append(A.zones.detail);
    body.insertBefore(left,main); main.insertBefore(A.zones.resultat,scene); main.append(det);
  }
  const pwrap=el('div',{class:'ak-panels'}); scene.append(pwrap);
  for(const pc of (cfg.panneaux||[{id:'scene'}])){
    const pe=el('div',{class:'ak-panel','data-id':pc.id}); pe.style.flex=`${pc.poids||1} 1 0`;
    if(pc.titre)pe.append(el('div',{class:'ak-phead'},pc.titre));
    const type=pc.type||'svg';
    const node=type==='canvas'?el('canvas'):document.createElementNS('http://www.w3.org/2000/svg','svg');
    if(type!=='canvas'){node.setAttribute('xmlns','http://www.w3.org/2000/svg');node.setAttribute('role','img');node.setAttribute('aria-label',pc.titre||cfg.titre)}
    pe.append(node);
    const P={id:pc.id,cfg:pc,el:pe,node,type,w:300,h:200,zoom:1,panX:0,panY:0,vz:1,vx:0,vy:0,_drags:[],head:pe.querySelector('.ak-phead')};
    /* Les figures SVG utilisent le viewBox. Un panneau qui affiche S.graph
       ajuste les échelles de ses graphiques. Un canvas garde son zoom interne. */
    P.vue=type!=='canvas'?(pc.zoom===false?null:'svg'):(pc.zoom?'interne':null);
    if(P.vue){const tl=el('div',{class:'ak-ptools'});tl.innerHTML=`
      <button class="mini" data-z="-" title="Dézoomer (−)">−</button>
      <button class="mini" data-z="0" aria-label="Cadrer" title="Cadrer : vue initiale (0)">${IC.cadrer}</button>
      <button class="mini" data-z="+" title="Zoomer (+)">+</button>`;
      tl.onclick=e=>{const z=e.target.closest('[data-z]');if(!z)return;const v=z.dataset.z;if(v==='0')A.cadrer(P);else A.zoomer(P,v==='+'?1.25:.8)};P.tools=tl;pe.append(tl)}
    A.panels[pc.id]=P; pwrap.append(pe);
  }
  /* légende : bande fine entre la scène et la barre de lecture (6 novembre 2026) */
  const legend=el('div',{class:'ak-legend'}); scene.append(legend);
  const tr=el('div',{class:'ak-transport'});
  tr.innerHTML=`<button class="ib ak-play" data-act="play" title="Lecture / pause (Espace)">▶ Lecture</button>
   <button class="ib" data-act="step" title="Pas à pas (→)">${IC.step}<span class="ak-lbl">Pas</span></button>
   <button class="ib" data-act="reset" title="Recommencer (R)">${IC.reset}<span class="ak-lbl">Recommencer</span></button>
   <select class="ak-speed" title="Vitesse de lecture">${(cfg.vitesses||[.25,.5,1,2,4]).map(v=>`<option value="${v}"${v===(cfg.vitesse||1)?' selected':''}>× ${v}</option>`).join('')}</select>
   <input type="range" class="ak-scrub" min="0" max="1" step="any" value="0" aria-label="Curseur temporel" hidden><span class="ak-extra"></span><span class="ak-clock"></span>`;
  scene.append(tr);
  /* colonne de droite (6 novembre 2026) : réglages qui défilent, mesures en bas des réglages
     (sur téléphone, les mesures restent sous la scène) */
  const right=el('div',{class:'ak-right'}); body.append(right);
  const metrics=el('section',{class:'ak-metrics','aria-label':'Mesures'});
  const side=el('aside',{class:'ak-side','aria-label':'Réglages'});
  side.innerHTML='<div class="ak-drawer-head"><span>Réglages</span><button class="mini" data-act="settings">Fermer ✕</button></div>';
  right.append(side);
  /* pied de page supprimé le 6 novembre 2026 */
  const dlg=el('dialog',{class:'ak-dialog'}); const toastEl=el('div',{class:'ak-toast'});

<script>
/* TC3 · Cinétique chimique : simulation markovienne (méthode directe de Gillespie), d'origine.
   Modifications du lot 18 : (1) window.Kinetics → const Kinetics ; (2) proposition D : paramètre p.dimer1 (2 A → A₂ avec v = k[A], ν = 2, ordre 1) :
   t½ = ln2/(2k), [A] = [A]₀ exp(−2kt), k estimé = −pente/2. Le reste est inchangé. Unités internes : n en mmol, V en L, c en mmol·L⁻¹, t en s. */
/* Simulation markovienne d'un échantillon homogène : méthode directe
   de Gillespie. Les objets sont des lots, pas des molécules à l'échelle réelle.
   n en mmol, V en L, c en mmol/L et t en secondes. */
'use strict';
const Kinetics=(()=>{
 const R=8.314462618,packet=.001;
 const random=seed=>{let a=seed>>>0;return ()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}};
 const arrhenius=(T,Ea,kref)=>kref*Math.exp(Ea*1000/R*(1/298.15-1/T));
 function spec(mode,q,dimer1){if(dimer1&&mode!=='mixture'&&q===1)return{name:'2 A → A₂',names:['A','A₂'],nu:[-2,1],order:1};return mode==='mixture'?{name:'A + B → AB',names:['A','B','AB'],nu:[-1,-1,1],order:2}:q===2?{name:'2 A → A₂',names:['A','A₂'],nu:[-2,1],order:2}:{name:'A → P',names:['A','P'],nu:[-1,1],order:q}}
 function prepare(p,seed=1631){
  p={...p,q:p.mode==='temperature'?1:p.q};
  const reaction=spec(p.mode,p.q,p.dimer1),mixture=p.mode==='mixture';
  const limit=mixture?Math.floor(420/(1+p.ratio)):240;
  const N=Math.max(10,2*Math.floor(Math.min(Math.round(p.nA/packet),limit)/2));
  const quantum=p.nA/N,B=mixture?Math.round(N*p.ratio):0,initial=mixture?[N,B,0]:[N,0];
  const c0=N*quantum/p.V,b0=B*quantum/p.V,q=mixture?2:p.q;
  const k=p.mode==='temperature'?arrhenius(p.T,p.Ea,p.kref):p.k;
  const half=mixture?null:q===0?c0/(2*k):q===1?Math.log(2)/(k*(reaction.nu[0]===-2?2:1)):1/(2*k*c0);
  const duration=mixture?10/(k*(c0+b0)):q===0?c0/k*1.15:half*(q===2?5:4);
  const run={p:{...p},reaction,q,k,N,B,quantum,c0,b0,initial,seed,duration,half,events:[],initialActors:[]};
  let id=0;for(let s=0;s<initial.length;s++)for(let i=0;i<initial[s];i++)run.initialActors.push({id:id++,s});
  const pools=initial.map((n,s)=>run.initialActors.filter(a=>a.s===s).map(a=>a.id)),rng=random(seed);
  let counts=initial.slice(),t=0;
  while(true){
   const rate=propensity(run,counts);if(!(rate>0))break;
   t+=-Math.log(Math.max(1e-15,1-rng()))/rate;if(t>duration)break;
   const participants=[],products=[];
   for(let s=0;s<reaction.nu.length;s++)if(reaction.nu[s]<0){for(let j=0;j< -reaction.nu[s];j++){const index=Math.floor(rng()*pools[s].length);participants.push(pools[s].splice(index,1)[0]);counts[s]--}}
   for(let s=0;s<reaction.nu.length;s++)if(reaction.nu[s]>0){for(let j=0;j<reaction.nu[s];j++){const actor={id:id++,s};products.push(actor);pools[s].push(actor.id);counts[s]++}}
   run.events.push({t,participants,products,counts:counts.slice()});
  }
  run.finalCounts=counts;return run;
 }
 function propensity(run,n){
  const h=run.quantum/run.p.V;if(run.p.mode==='mixture')return run.k*h*n[0]*n[1];
  if(run.q===0)return n[0]>0?run.k/h:0;
  if(run.q===1)return run.k*n[0];
  return n[0]>=2?run.k*h*n[0]*(n[0]-1):0;
 }
 function countsAt(run,t){let lo=0,hi=run.events.length;while(lo<hi){const mid=(lo+hi)>>1;if(run.events[mid].t<=t)lo=mid+1;else hi=mid}return (lo?run.events[lo-1].counts:run.initial).slice()}
 function values(run,t){return countsAt(run,t).map(n=>n*run.quantum/run.p.V)}
 function theory(run,t){
  const {c0,b0,k}=run;
  if(run.p.mode==='mixture'){
   const d=b0-c0;let a;if(d===0)a=c0/(1+k*c0*t);else if(d>0){const z=d*k*t;a=d*c0*Math.exp(-z)/(d-c0*Math.expm1(-z))}else{const z=-d*k*t;a=-d*c0/(-d-b0*Math.expm1(-z))}
   const x=Math.max(0,Math.min(c0,b0,c0-a));return[c0-x,b0-x,x];
  }
  const c=run.q===0?Math.max(0,c0-k*t):run.q===1?c0*Math.exp(-k*t*(run.reaction.nu[0]===-2?2:1)):c0/(1+2*k*c0*t);
  return[c,(c0-c)/(run.q===2||run.reaction.nu[0]===-2?2:1)];
 }
 function trace(run,t){const result=[[0,...run.initial.map(n=>n*run.quantum/run.p.V)]];for(const e of run.events){if(e.t>t)break;result.push([e.t,...e.counts.map(n=>n*run.quantum/run.p.V)])}if(result.at(-1)[0]<t)result.push([t,...values(run,t)]);return result}
 function observedHalf(run){const e=run.events.find(e=>e.counts[0]<=run.N/2);return e?e.t:null}
 function fit(points){const pts=points.filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));if(pts.length<2)return null;const mx=pts.reduce((s,p)=>s+p[0],0)/pts.length,my=pts.reduce((s,p)=>s+p[1],0)/pts.length;let xx=0,xy=0;for(const[x,y]of pts){xx+=(x-mx)**2;xy+=(x-mx)*(y-my)}if(xx<1e-20)return null;const slope=xy/xx,intercept=my-slope*mx;return {slope,intercept,n:pts.length,residuals:pts.map(([x,y])=>[x,y-intercept-slope*x])}}
 function measurements(run,t,noise=0){const rng=random(run.seed+999),rows=[];if(t<=0)return rows;for(let i=0;i<=32;i++){const time=t*i/32,exact=values(run,time)[0],u=Math.max(1e-12,rng()),v=rng(),err=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);rows.push({t:time,c:exact+noise/100*run.c0*err,exact})}return rows}
 function estimateK(run,t){ // Ajustement intégral de la population suivie, sans bruit instrumental ajouté.
  const ninety=run.events.find(e=>e.counts[0]<=run.N*.1);if(ninety)t=Math.min(t,ninety.t);
  const rows=measurements(run,t).filter(r=>r.c>run.c0*.1),fitResult=fit(rows.map(r=>[r.t,Math.log(r.c/run.c0)]));
  if(!fitResult||run.N-countsAt(run,t)[0]<Math.max(8,.2*run.N)||fitResult.slope>=0)return null;return -fitResult.slope/(run.reaction.nu[0]===-2?2:1);
 }
 return Object.freeze({R,random,spec,prepare,propensity,countsAt,values,theory,trace,observedHalf,fit,measurements,estimateK,arrhenius});
})();

// @titre Cinétique chimique · TC3 · MPSI
// @sortie ../TC3_Cinetique_Chimique/TC3_Cinetique_Chimique.html
// @inclure TC3_Cinetique_Chimique_physique.js
// @style TC3_Cinetique_Chimique.css
// @description Cinétique chimique : échantillon de particules (simulation de Gillespie), ordres 0, 1 et 2, mélange stœchiométrique ou en excès, température et loi d'Arrhenius, temps de demi-réaction et vitesses initiales.
'use strict';
/* =====================================================================
   TC3 · Cinétique chimique (5 onglets)
   1 Ordres (dont 2 A → A₂ d'ordre 1) · 2 Mélange A + B · 3 Température · 4 Demi-réaction · 5 Vitesses initiales
   Physique : Kinetics (TC3_Cinetique_Chimique_physique.js) = simulation.js d'origine, à deux changements près :
   const au lieu de window, et l'option dimer1 (2 A → A₂ avec v = k[A], ν = 2).
   Unités : le modèle est invariant d'échelle ; les quantités sont désormais en mol, les volumes en L, les concentrations
   en mol·L⁻¹ (mêmes nombres et mêmes durées qu'avant, où l'on écrivait mmol).
   Lot 18 : sur AnimKit ; réacteurs en SVG ; réglages appliqués immédiatement ; curseur temporel exact (retour en arrière
   par rejeu des événements) ; axes fixes ; modèle continu, t½ théorique et tangente masqués au départ ;
   propositions B (t½ en fonction de [A]₀), C (vitesses initiales, log-log), D (2 A → A₂, ordre ≠ ν).
   ===================================================================== */
const KN=Kinetics,fm=AnimKit.fmt,Mh=AnimKit.M;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const subT=t=>`<tspan font-size="72%" dy="0.3em">${t}</tspan><tspan dy="-0.3em">​</tspan>`;
const uS=s=>String(s).replace(/[₀-₉]/g,d=>subT(d.charCodeAt(0)-8320));
const uH=s=>String(s).replace(/[₀-₉]/g,d=>'<sub>'+(d.charCodeAt(0)-8320)+'</sub>');
const sv=(a,s)=>uS(String(s).replace(/<sup>(.*?)<\/sup>/g,(_,e)=>a.S.sup(e)));
const UQ=['mol·L<sup>−1</sup>·s<sup>−1</sup>','s<sup>−1</sup>','L·mol<sup>−1</sup>·s<sup>−1</sup>'];
const LOI={a1:{q:1},a0:{q:0},a2:{q:2},d1:{q:1,d:true}};
const GRID=[.04,.07,.12,.18,.24];
const st={runs:[],stages:[],time:0,end:1,fullEnd:1,seed:1631,tab:-1,drag:null,data:{2:[],3:[],4:[]},fp:'',myst:1,G:{}};

/* ---------- paramètres ---------- */
const lawQ=(a,t)=>{const v=a.p['loi'+t];return v==='m'?st.myst:+v};
function params(a){
  const t=a.tab,p=a.p,g=k=>p[k+t],base={ratio:1,T:298.15,T2:318.15,Ea:50,kref:.035};
  if(t===0){const l=LOI[p.loi0];return{...base,mode:'orders',q:l.q,dimer1:!!l.d,nA:p.nA0,V:p.V0,k:p.k0}}
  if(t===1)return{...base,mode:'mixture',q:2,nA:p.nA1,V:p.V1,ratio:p.ratio1,k:p.k1};
  if(t===2)return{...base,mode:'temperature',q:1,nA:p.nA2,V:p.V2,k:.035,T:p.Ta2,T2:p.Tb2,Ea:p.Ea2};
  return{...base,mode:'orders',q:lawQ(a,t),nA:g('nA'),V:g('V'),k:g('k')};
}
const nuA=r=>r.reaction.nu[0]===-2?2:1;
function lawText(a,r){
  const t=a.tab;if(t>=3&&a.p['loi'+t]==='m'&&!a.p['rev'+t])return'loi de vitesse à déterminer';
  return r.p.mode==='mixture'?'v = k [A][B]':r.q===0?'v = k':r.q===1?'v = k [A]':'v = k [A]²';
}

/* ---------- acteurs et événements (animation des particules) ---------- */
function actor(s,id,rng,x,y){return{id,s,x:x??(.06+.88*rng()),y:y??(.07+.86*rng()),vx:(rng()-.5)*.35,vy:(rng()-.5)*.35,angle:rng()*Math.PI*2,spin:(rng()-.5)*1.5,born:2}}
function createStage(run){
  const rng=KN.random(run.seed+777),n=run.initialActors.length,cols=Math.ceil(Math.sqrt(n)),rows=Math.ceil(n/cols);
  const pos=Array.from({length:n},(_,i)=>({x:.04+.92*((i%cols)+.2+.6*rng())/cols,y:.04+.92*(Math.floor(i/cols)+.2+.6*rng())/rows}));
  for(let i=pos.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[pos[i],pos[j]]=[pos[j],pos[i]]}
  return{run,actors:new Map(run.initialActors.map((q,i)=>[q.id,actor(q.s,q.id,rng,pos[i].x,pos[i].y)])),index:0,effects:[],rng};
}
function fire(stage,ev,effect){
  const used=ev.participants.map(id=>stage.actors.get(id)).filter(Boolean);
  const x=used.reduce((s,q)=>s+q.x,0)/used.length,y=used.reduce((s,q)=>s+q.y,0)/used.length;
  for(const id of ev.participants)stage.actors.delete(id);
  for(const q of ev.products){const p=actor(q.s,q.id,stage.rng,x,y);p.born=effect?0:2;stage.actors.set(q.id,p)}
  if(effect){stage.effects.push({x,y,age:0,ghosts:used.map(q=>({...q}))});if(stage.effects.length>36)stage.effects.shift()}
  stage.index++;
}
function sync(t,effect){for(const s of st.stages)while(s.index<s.run.events.length&&s.run.events[s.index].t<=t)fire(s,s.run.events[s.index],effect)}
function seek(a,t){
  const target=clamp(t,0,st.end);
  if(target<st.time){st.stages=st.runs.map(createStage);st.drag=null}
  sync(target,false);for(const s of st.stages)s.effects=[];st.time=target;
}
function advance(a,dt){
  const target=Math.min(st.end,st.time+dt);sync(target,a.p.halos);st.time=target;
  if(st.time>=st.end)a.play(false);
}
function move(a,dt){
  for(const s of st.stages){
    const mob=Math.sqrt((s.run.p.mode==='temperature'?s.run.p.T:298.15)/298.15);
    for(const q of s.actors.values()){
      q.born+=dt;if(st.drag===q)continue;
      q.x+=q.vx*dt*mob;q.y+=q.vy*dt*mob;q.angle+=q.spin*dt;
      if(q.x<.035||q.x>.965){q.x=clamp(q.x,.035,.965);q.vx*=-1}
      if(q.y<.045||q.y>.955){q.y=clamp(q.y,.045,.955);q.vy*=-1}
    }
    for(const e of s.effects)e.age+=dt;
    s.effects=s.effects.filter(e=>e.age<.65);
  }
}

/* ---------- préparation d'un essai ---------- */
function prepare(a,newSeed){
  const t=a.tab,P=params(a);if(newSeed)st.seed+=101;
  st.runs=[KN.prepare(P,st.seed)];
  if(t===2)st.runs.push(KN.prepare({...P,T:P.T2},st.seed+9127));
  const fp=t===2?'T'+P.Ea:t>=3?`${t}|${P.q}|${P.k}|${P.V}`:'';
  if(fp!==st.fp){st.fp=fp;st.data={2:[],3:[],4:[]}}
  st.end=Math.max(...st.runs.map(r=>r.duration));st.fullEnd=st.end;st.time=0;
  st.stages=st.runs.map(createStage);st.drag=null;st.tab=t;
  a.refresh();a.render();
}

/* ---------- relevés (températures, t½, vitesses initiales) ---------- */
function v0Of(run){
  const e=run.events.find(q=>q.counts[0]<=Math.round(run.N*.75));if(!e)return null;
  return (run.N-e.counts[0])*run.quantum/run.p.V/e.t;
}
function storeArr(T,k){
  const arr=st.data[2],ex=arr.find(d=>Math.abs(d.T-T)<.001);
  if(ex){ex.k=(ex.k*ex.n+k)/(ex.n+1);ex.n++}else arr.push({T,k,n:1});
  arr.sort((x,y)=>x.T-y.T);
}
function relever(a){
  const t=a.tab;
  if(t===2){
    const est=st.runs.map(r=>KN.estimateK(r,st.time));
    if(est.some(k=>k===null)){a.toast('Avancer davantage : au moins 20 % de A doit avoir réagi dans chaque réacteur.');return}
    st.runs.forEach((r,i)=>storeArr(r.p.T,est[i]));a.toast('Constantes estimées ajoutées au graphique.');a.refresh();a.render();return;
  }
  const r=st.runs[0],arr=st.data[t],val=t===3?KN.observedHalf(r):v0Of(r);
  if(val===null){a.toast('Mesure impossible sur ce suivi.');return}
  if(arr.some(d=>d.seed===r.seed&&Math.abs(d.c0-r.c0)<1e-9)){a.toast('Ce suivi est déjà relevé : « Nouvel essai » pour en simuler un autre.');return}
  arr.push({c0:r.c0,y:val,seed:r.seed});if(arr.length>40)arr.shift();
  a.toast(t===3?'t½ relevé sur ce suivi.':'Vitesse initiale relevée sur ce suivi.');a.refresh();a.render();
}
function serie(a){
  const t=a.tab,P=params(a);
  if(t===2){
    st.data[2]=[];
    for(let i=0;i<7;i++){const T=278.15+10*i,run=KN.prepare({...P,T},st.seed+1234+i*331),k=KN.estimateK(run,Math.log(4)/run.k);if(k!==null)storeArr(T,k)}
    a.toast('Sept suivis indépendants simulés et ajustés.');
  }else{
    st.data[t]=[];
    GRID.forEach((nA,i)=>{const run=KN.prepare({...P,nA},st.seed+500+i*331),val=t===3?KN.observedHalf(run):v0Of(run);if(val!==null)st.data[t].push({c0:run.c0,y:val,seed:run.seed})});
    a.toast('Cinq suivis indépendants simulés (volume et k inchangés).');
  }
  a.refresh();a.render();

/* ---------- réacteurs ---------- */
function geom(a,i){
  const P=a.panels.reactor,n=st.runs.length,abs=a.tab===0&&a.p.abs,mx=abs?56:12,top=36*a.k,bot=34*a.k;
  const gw=(P.w-2*mx)/n,cx=mx+gw*(i+.5),sc=.55+.45*st.runs[i].p.V/.24,bw=Math.max(70,(gw-18)*sc),bh=Math.max(60,P.h-top-bot);
  return{x:cx-bw/2,y:top,bw,bh,cx,gw};
}
const pt=(q,b)=>[b.x+b.bw*q.x,b.y+b.bh*q.y];
function colOf(C,run,s){return s===run.reaction.names.length-1?C.v:s===0?C.B:C.E}
function mol(a,run,s,x,y,ang,alpha){
  const C=a.C,S=a.S,k=a.k,dual=st.runs.length>1,dens=Math.min(1,Math.sqrt(160/run.initialActors.length));
  const r=(dual?4.8:6.2)*dens*k/1.15,last=run.reaction.names.length-1,prod=s===last;
  const paired=prod&&run.reaction.nu.filter(v=>v<0).reduce((u,v)=>u-v,0)===2,mix=run.p.mode==='mixture',col=colOf(C,run,s);
  const edge=C.dark?'#12232c':'#ffffff';
  let o=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(ang*180/Math.PI).toFixed(0)})" opacity="${alpha.toFixed(2)}">`;
  if(paired){
    o+=`<line x1="${(-r*.9).toFixed(1)}" y1="0" x2="${(r*.9).toFixed(1)}" y2="0" stroke="${C.v}" stroke-width="${(3*k/1.15).toFixed(1)}"/>`;
    o+=`<circle cx="${(-r*.85).toFixed(1)}" cy="0" r="${r.toFixed(1)}" fill="${C.B}" stroke="${edge}" stroke-width="1"/><circle cx="${(r*.85).toFixed(1)}" cy="0" r="${r.toFixed(1)}" fill="${mix?C.E:C.B}" stroke="${edge}" stroke-width="1"/>`;
    o+=`<ellipse cx="0" cy="0" rx="${(r*2.1).toFixed(1)}" ry="${(r*1.35).toFixed(1)}" fill="none" stroke="${C.v}" stroke-width="${(1.5*k/1.15).toFixed(1)}"/>`;
  }else{
    o+=`<circle r="${r.toFixed(1)}" fill="${col}" stroke="${edge}" stroke-width="1"/>`;
    if(prod)o+=`<circle r="${(r*.5).toFixed(1)}" fill="none" stroke="${edge}" stroke-width="1.2"/>`;
  }
  o+='</g>';
  if(a.p.names)o+=a.S.text(x,y-r*(paired?2.1:1.7),uS(run.reaction.names[s]),{anchor:'middle',size:13,c:C.ink,weight:600});

}

const stepPts=(run,idx,f=1)=>{const rows=KN.trace(run,st.time),out=[];for(let i=0;i<rows.length;i++){if(i)out.push([rows[i][0],rows[i-1][idx+1]*f]);out.push([rows[i][0],rows[i][idx+1]*f])}return out};
const sample=(fn,n=200)=>Array.from({length:n+1},(_,j)=>{const t=j/n*st.end;return[t,fn(t)]});

      series.push({pts:[[0,(c-der*st.time)*f],[st.end,(c+der*(st.end-st.time))*f]],c:C.B,dash:`${8*k} ${4*k}`,w:1.8});leg.push({c:C.B,label:'Tangente (modèle)',dash:true});
    }
    if(t>=3){const h=KN.observedHalf(r);if(t===3&&h!==null&&h<=st.time)vl.push({x:h,c:C.F,op:.9})}
  }
  vl.push({x:st.time,c:C.ink2,op:.8});
  let dots=[];
  if(noise>0&&!temp){const nrm=mix?1/r.c0:f;dots=KN.measurements(r,st.time,noise).map(q=>({p:[q.t,q.c*nrm],c:cols[0],r:2.8}))}
  const ylab=mix?'concentrations normalisées':abs?'absorbance (sans unité)':'concentration (mol·L<sup>−1</sup>)';
  plot(a,'suivi',{xmin:0,xmax:st.end,ymin:noise>0&&!temp?-3*noise/100*(mix?1:r.c0*f):0,ymax,xlab:'t (s)',ylab:sv(a,ylab),series,vlines:vl,dots,msg:st.time===0?'Lecture ou curseur pour construire le suivi':''});
  st.leg=leg;
}
function bnd(pts,pad=.12){const ys=pts.map(p=>p[1]).filter(Number.isFinite);if(!ys.length)return[0,1];const lo=Math.min(...ys),hi=Math.max(...ys),d=(hi-lo)||Math.abs(hi)||1;return[lo-d*pad,hi+d*pad]}
const lnc=x=>Math.log(x);
function drawAnalyse(a){
  const t=a.tab,P=a.panels.analyse;st.leg2=[];if(P.el.hidden)return[];
  const C=a.C,k=a.k,r=st.runs[0],tl=P.head;
  if(t>=3)return drawSerie(a);
  const view=t<2?a.p.vue:a.p.vue2,rows=KN.measurements(r,st.end,a.p.bruit),vis=q=>q.t<=st.time+1e-9,nu=nuA(r),mix=r.p.mode==='mixture';
  const un=h=>UQ[h];
  if(view==='int'){
    const hyp=+a.p.hyp,f=c=>hyp===0?c:hyp===1?Math.log(c/r.c0):1/c,all=rows.filter(q=>q.c>r.c0*.03).map(q=>[q.t,f(q.c)]),pts=all.filter(q=>q[0]<=st.time+1e-9);
    const fitAll=KN.fit(all),fit=KN.fit(pts),res=a.p.resid;
    let ymin,ymax,ylab;
    if(res){const rr=fitAll?fitAll.residuals.map(q=>Math.abs(q[1])):[1],m=Math.max(...rr,1e-9)*1.3;ymin=-m;ymax=m;ylab='résidu : mesure − droite'}
    else{[ymin,ymax]=bnd(all);ylab=['[A] (mol·L<sup>−1</sup>)','ln([A] / [A]₀)','1 / [A] (L·mol<sup>−1</sup>)'][hyp]}
    const shown=res?(fit?fit.residuals:[]):pts;
    plot(a,'analyse',{xmin:0,xmax:st.end,ymin,ymax,xlab:'t (s)',ylab:sv(a,ylab),
      series:fit&&!res?[{pts:[[0,fit.intercept],[st.time,fit.intercept+fit.slope*st.time]],c:C.F,dash:`${8*k} ${5*k}`}]:(res?[{pts:[[0,0],[st.end,0]],c:C.ink2,w:1,dash:`${4*k} ${5*k}`}]:[]),
      vlines:[{x:st.time,c:C.ink2,op:.8}],dots:shown.map(p=>({p,c:C.B})),msg:pts.length<2?'Avancer pour obtenir des points':''});
    if(tl)tl.textContent='Tester un ordre : linéarisation';
    st.leg2=[{c:C.B,label:res?'Résidus':'Mesures de l\'échantillon'},...(fit&&!res?[{c:C.F,label:'Droite ajustée',dash:true}]:[])];
    const kapp=fit?(hyp===2?fit.slope:-fit.slope)/nu:NaN;
    return[{label:'Ordre testé',value:String(hyp),unit:'examen de la linéarité'},{label:'Pente ajustée',value:fm.sig(fit?fit.slope:NaN,3),unit:'unités du graphique / s'},{label:'<i class="m">k</i> déduit si le modèle est valide',value:fm.sig(kapp,3),unit:un(hyp)}];
  }
  if(view==='dif'){
    const stride=3,all=[];
    for(let i=stride;i<rows.length-stride;i++){const v=-(rows[i+stride].c-rows[i-stride].c)/(rows[i+stride].t-rows[i-stride].t)/nu;if(v>0&&rows[i].c>0)all.push({x:lnc(rows[i].c),y:lnc(v),t:rows[i+stride].t})}
    const pts=all.filter(q=>q.t<=st.time+1e-9).map(q=>[q.x,q.y]),pa=all.map(q=>[q.x,q.y]),fit=KN.fit(pts);
    const[xlo,xhi]=bnd(pa,.08),[ylo,yhi]=bnd(pa,.15);
    plot(a,'analyse',{xmin:Math.min(xlo,lnc(r.c0)-3.7),xmax:Math.max(xhi,lnc(r.c0)+.15),ymin:ylo,ymax:yhi,xlab:'ln([A] / c°)',ylab:'ln(v / v°)',
      series:fit?[{pts:[[xlo-1,fit.intercept+fit.slope*(xlo-1)],[xhi+1,fit.intercept+fit.slope*(xhi+1)]],c:C.F,dash:`${8*k} ${5*k}`}]:[],
      dots:pts.map(p=>({p,c:C.B})),msg:pts.length<2?'Avancer pour estimer des vitesses':''});
    if(tl)tl.textContent='Estimer un ordre : méthode différentielle';
    st.leg2=[{c:C.B,label:'Différences centrées'},...(fit?[{c:C.F,label:'Droite ajustée',dash:true}]:[])];
    return[{label:'Pente ajustée',value:fm.sig(fit?fit.slope:NaN,3),unit:'estimation de l\'ordre, à discuter'},{label:'Vitesses positives exploitées',value:pts.length+' / '+pa.length,unit:'fenêtre de 6 intervalles'},{label:'Bruit de mesure',value:fm.fix(a.p.bruit,1)+' %',unit:'de [A]<sub>0</sub>'}];
  }
  /* Arrhenius */
  const arr=st.data[2],pts=arr.map(d=>[1/d.T,Math.log(d.k/.035)]),fit=KN.fit(pts),Ea=r.p.Ea,R=KN.R;
  const yl=T=>Ea*1000/R*(1/298.15-1/T),ya=yl(273.15),yb=yl(353.15),xmin=1/353.15-.00004,xmax=1/273.15+.00004;
  const ylo=Math.min(ya,yb)-.5,yhi=Math.max(ya,yb)+.5,ser=[];
  if(fit)ser.push({pts:[[xmin,fit.intercept+fit.slope*xmin],[xmax,fit.intercept+fit.slope*xmax]],c:C.F,dash:`${8*k} ${5*k}`});
  if(a.p.theo)ser.push({pts:[[xmin,yl(1/xmin)],[xmax,yl(1/xmax)]],c:C.v,w:1.8,dash:`${3*k} ${5*k}`});
  plot(a,'analyse',{xmin,xmax,ymin:ylo,ymax:yhi,xlab:'1 / T (K⁻¹)',ylab:'ln(k / k_réf)',series:ser,dots:pts.map(p=>({p,c:C.B,r:4.6})),msg:pts.length<2?'Relever des k à plusieurs températures':''});
  if(tl)tl.textContent='La loi d\'Arrhenius';
  st.leg2=([{c:C.B,label:'k ajustés sur des suivis simulés'},...(fit?[{c:C.F,label:'Droite ajustée',dash:true}]:[]),...(a.p.theo?[{c:C.v,label:'Loi d\'Arrhenius du modèle',dash:true}]:[])]);
  return[{label:'Températures distinctes',value:String(pts.length),unit:'constantes simulées'},{label:'Pente ajustée',value:fm.sig(fit?fit.slope:NaN,3),unit:'K'},{label:'<i class="m">E</i><sub>a</sub> déduit = −<i class="m">R</i> × pente',value:fm.sig(fit?-fit.slope*R/1000:NaN,3),unit:'kJ·mol<sup>−1</sup>'}];
}
/* onglets 4 et 5 : t½ et v0 en fonction de [A]0 (propositions B et C) */
function drawSerie(a){
  const t=a.tab,C=a.C,k=a.k,r=st.runs[0],P=r.p,data=st.data[t],q=r.q,kk=P.k,V=P.V,cmin=GRID[0]/V,cmax=GRID[4]/V,log=a.p['log'+t]==='log';
  const th=t===3?c=>q===0?c/(2*kk):q===1?Math.LN2/kk:1/(2*kk*c):c=>q===0?kk:q===1?kk*c:2*kk*c*c;
  const lin=[1.25*Math.max(th(cmin),th(cmax)),0];
  const pts=data.map(d=>[d.c0,d.y]);
  const lp=data.map(d=>[lnc(d.c0),lnc(d.y)]),fit=data.length>=2&&new Set(data.map(d=>d.c0.toFixed(6))).size>=2?KN.fit(lp):null;
  const lthA=lnc(th(cmin)),lthB=lnc(th(cmax)),ylo=Math.min(lthA,lthB)-.7,yhi=Math.max(lthA,lthB)+.7;
  const yl=t===3?'t½ (s)':'v₀ (mol·L<sup>−1</sup>·s<sup>−1</sup>)',leg=[{c:C.B,label:t===3?'t<sub>½</sub> observé':'v<sub>0</sub> observé'}];
  const ser=[],vl=[{x:log?lnc(r.c0):r.c0,c:C.ink2,op:.8}];
  let G;
  if(!log){
    if(a.p.theo){ser.push({pts:Array.from({length:101},(_,j)=>{const c=cmin*.8+(cmax*1.1-cmin*.8)*j/100;return[c,th(c)]}),c:C.v,w:1.8,dash:`${3*k} ${5*k}`});leg.push({c:C.v,label:'Modèle continu',dash:true})}
    G=plot(a,'analyse',{xmin:0,xmax:cmax*1.12,ymin:0,ymax:lin[0],xlab:'[A]₀ (mol·L⁻¹)',ylab:sv(a,yl),series:ser,vlines:vl,dots:pts.map(p=>({p,c:C.B,r:4.4})),msg:data.length?'':'Relever des suivis pour construire le graphe'});
  }else{
    if(fit){ser.push({pts:[[lnc(cmin)-.4,fit.intercept+fit.slope*(lnc(cmin)-.4)],[lnc(cmax)+.4,fit.intercept+fit.slope*(lnc(cmax)+.4)]],c:C.F,dash:`${8*k} ${5*k}`});leg.push({c:C.F,label:'Droite ajustée',dash:true})}
    if(a.p.theo){const n=t===3?1-q:q;ser.push({pts:[[lnc(cmin)-.4,lthA+n*(-.4)],[lnc(cmax)+.4,lthB+n*.4]].map(([x,y])=>[x,y]),c:C.v,w:1.8,dash:`${3*k} ${5*k}`});leg.push({c:C.v,label:'Modèle continu',dash:true})}
    G=plot(a,'analyse',{xmin:lnc(cmin)-.4,xmax:lnc(cmax)+.4,ymin:ylo,ymax:yhi,xlab:'ln([A]₀ / c°)',ylab:t===3?'ln(t½ / t°)':'ln(v₀ / v°)',series:ser,vlines:vl,dots:lp.map(p=>({p,c:C.B,r:4.4})),msg:data.length<2?'Relever au moins deux suivis':''});
  }
  a.panels.analyse.head&&(a.panels.analyse.head.textContent=t===3?'Temps de demi-réaction en fonction de [A]₀':'Vitesse initiale en fonction de [A]₀');
  st.leg2=leg;
  const slope=fit?fit.slope:NaN,ordre=t===3?1-slope:slope,rev=a.p['loi'+t]!=='m'||a.p['rev'+t];
  return[
    {label:'Points relevés',value:String(data.length),unit:t===3?'valeurs de t½':'valeurs de v₀'},
    {label:'Pente en échelle logarithmique',value:fm.sig(slope,3),unit:t===3?'= 1 − n':'= n'},
    {label:'Ordre déduit <i class="m">n</i>',value:Number.isFinite(ordre)?fm.fix(ordre,2):'—',unit:'à arrondir à un entier',hint:rev?'ordre du modèle : '+q:undefined}
  ];
}

/* ---------- mesures et horloge ---------- */
function info(a,extra){
  const t=a.tab,r=st.runs[0],Mv=Mh.v,vals=KN.values(r,st.time),half=KN.observedHalf(r),reached=half!==null&&half<=st.time+1e-9,arr=[];
  if(t===0||t>=3){
    const hint=a.p.theo&&r.half!==null?`modèle continu : ${fm.fix(r.half,1)} s`:undefined;
    arr.push({label:'Concentration [A]',value:fm.fix(vals[0],3),unit:'mol·L<sup>−1</sup>'});
    arr.push({label:'Événements réalisés',value:String(st.stages[0].index),unit:'réactions dans l\'échantillon'});
    if(t<3)arr.push({label:`${Mv('t','½')} observé`,value:reached?fm.fix(half,1):'—',unit:'s',hint});
  }else if(t===1){
    arr.push({label:'Diminution de [B]',value:fm.fix((r.b0-vals[1])/r.b0*100,1),unit:'% depuis t = 0'});
    arr.push({label:'Diminution de [A]',value:fm.fix((r.c0-vals[0])/r.c0*100,1),unit:'% depuis t = 0'});
    if(a.p.theo){const th=KN.theory(r,st.time),ap=r.c0*Math.exp(-r.k*r.b0*st.time);arr.push({label:`Écart de l'approximation ${Mv('k')}[B]₀`,value:fm.fix(Math.abs(th[0]-ap)/r.c0*100,2),unit:'% de [A]₀',hint:`k[B]₀ = ${fm.sig(r.k*r.b0,3)} s⁻¹`})}
  }else{
    const r2=st.runs[1],h2=KN.observedHalf(r2);
    arr.push({label:`${Mv('t','½')} observé · ${Mv('T','1')}`,value:reached?fm.fix(half,1):'—',unit:'s'});
    arr.push({label:`${Mv('t','½')} observé · ${Mv('T','2')}`,value:h2!==null&&h2<=st.time+1e-9?fm.fix(h2,1):'—',unit:'s'});
    if(a.p.theo)arr.push({label:`Rapport ${Mv('k')}(T₂) / ${Mv('k')}(T₁)`,value:fm.fix(r2.k/r.k,2),unit:'modèle'});
  }
  a.metrics(arr.concat(extra||[]));a.legend((st.leg||[]).concat(st.leg2||[]));
  a.clock(`t = ${fm.fix(st.time,1)} s`);
}

/* ---------- interactions : objets, instant ---------- */
function pick(a,x,y){
  let best=null,bd=22*a.k;
  st.stages.forEach((s,i)=>{const b=geom(a,i);for(const q of s.actors.values()){const p=pt(q,b),d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;best={q,b,s}}}});
  return best;
}
A.drag('reactor',{
  hit:(x,y)=>st.runs.length>0&&!!pick(A,x,y),
  start:(x,y)=>{const h=pick(A,x,y);st.drag=h?h.q:null;st.dragBox=h?h.b:null},
  move:(x,y)=>{const q=st.drag,b=st.dragBox;if(!q||!b)return;q.x=clamp((x-b.x)/b.bw,.035,.965);q.y=clamp((y-b.y)/b.bh,.045,.955)},
  end:()=>{st.drag=null}
});
A.drag('suivi',{
  hit:(x,y)=>{const G=st.G.suivi;return !!G&&x>=G.x0&&x<=G.x0+G.w&&y>=G.y0&&y<=G.y0+G.h},
  start:(x)=>{A.play(false);seek(A,st.G.suivi.xv(x))},
  move:(x)=>{seek(A,st.G.suivi.xv(x))},
  end:()=>{}
});
