  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

/* =====================================================================
   MC3 · tables de mouvement à une dimension (ajout du lot 5, novembre 2026)
   Unités réduites : z = x/a, u = v/√(ε/m), τ = t/t₀ avec t₀ = a√(m/ε).
   - Sans frottement : on échantillonne le modèle d'origine (PotentialModel /
     EnergyModel, inchangés et contrôlés), qui impose la conservation de l'énergie.
   - Avec frottement fluide F = −α v : RK4 indépendant sur (z, u),
     dz/dτ = u, du/dτ = −U′(z) − γ u, avec γ = α t₀/m.
   ===================================================================== */
window.MC3Tables=(()=>{
  /** échantillonne sim.advance sur [0, τH] ; arrêt si sortie de [lo, hi] ou erreur numérique */
  function fromModel(sim,tauH,N,lo,hi,state){
    const out=[];let s=state(sim.at());out.push({tau:0,...s});const dt=tauH/N;
    for(let i=1;i<=N;i++){
      try{sim.advance(dt)}catch(e){return{pts:out,stop:'numerique'}}
      s=state(sim.at());out.push({tau:i*dt,...s});
      if(s.z<lo||s.z>hi)return{pts:out,stop:'sortie'};
    }
    return{pts:out,stop:null};
  }
  /** RK4 avec frottement fluide, sous-pas adapté à la courbure locale */
  function friction(d,d2,z0,u0,gamma,tauH,N,lo,hi){
    const out=[{tau:0,z:z0,u:u0}],dt=tauH/N;let z=z0,u=u0;
    const f=(z,u)=>[u,-d(z)-gamma*u];
    for(let i=1;i<=N;i++){
      let rem=dt;
      while(rem>1e-14){
        const h=Math.min(rem,.003/Math.sqrt(Math.max(1,Math.abs(d2(z)),gamma*gamma)));
        const k1=f(z,u),k2=f(z+h*k1[0]/2,u+h*k1[1]/2),k3=f(z+h*k2[0]/2,u+h*k2[1]/2),k4=f(z+h*k3[0],u+h*k3[1]);

      }

      if(z<lo||z>hi)return{pts:out,stop:'sortie'};
    }

  }

  function at(pts,tau){

    return o;
  }
  return Object.freeze({fromModel,friction,at});
})();

// @sortie ../MC3_Potentiel_Mouvement/MC3_Potentiel_Mouvement.html

'use strict';

   Modèle : PotentialModel (fichier d'origine du 24 octobre 2026, inchangé et contrôlé) :
   ℰp(x) = ε U(x/a), mouvement construit sur la conservation de l'énergie (RK4 sur une

const IT={};   // objets « items » dont on ajuste les bornes

function eqInfo(a){
  const[q,t]=selEq(),k=a.p.eps/a.p.a**2*sh().d2(q);

  if(t==='stable'&&k>1e-10)s+=`, ω<sub>0</sub> = ${a.fmt.sig(Math.sqrt(k/a.p.m),3)} rad·s<sup>−1</sup>`;
  if(t==='degenerate')s+=' : stable, mais le terme d\'ordre deux est nul, pas d\'oscillateur harmonique';
  return s+'.';
}
function regime(a,q){
  const s=sh();
  if(T.gam>0){const nearMin=s.eq.find(([z,t])=>(t==='stable'||t==='degenerate')&&Math.abs(q.z-z)<.03&&Math.abs(q.u)<.03);
    return nearMin?`Frottement : ${E('m')} a diminué et le mobile s'immobilise au minimum ${mv('x')}<sub>éq</sub> = ${a.fmt.sig(nearMin[0]*a.p.a,3)} m.`:`Frottement fluide : ${E('m')} diminue ; les rebroussements se resserrent et le domaine accessible rétrécit.`}
  if(T.stop==='sortie'&&q.end)return'Sortie de la fenêtre : le mouvement non borné continue au-delà du dessin.';
  const sim=T.sim;if(!sim)return'';
  if(a.tab===2&&!harmOK())return selEq()[1]==='degenerate'?'Minimum stable mais ℰp″ = 0 : le développement à l\'ordre deux ne donne pas d\'oscillateur.':'Choisir un minimum non dégénéré pour comparer au mouvement harmonique.';
  if(sim.stationary)return`Équilibre immobile : vitesse et force nulles, le mobile reste au point stationnaire${/stable|degenerate/.test((s.eq.find(e=>Math.abs(e[0]-st.z0)<1e-8)||[])[1]||'')?' (stable)':' (instable : la moindre perturbation l\'en écarte)'}.`;
  if(sim.separatrix)return'Mouvement séparateur : le sommet est une limite asymptotique, jamais atteinte en temps fini.';
  if(sim.bounded)return`État lié : oscillations entre deux rebroussements, où ${mv('v')} = 0 sans que la force soit nulle.`;

}

    if(I.lo<lo)o+=S.arrow(G.x0+14*k,yR,G.x0+1,yR,{c:C.Ec,w:1.6});if(I.hi>hi)o+=S.arrow(G.x0+G.w-14*k,yR,G.x0+G.w-1,yR,{c:C.Ec,w:1.6})}
  if(harmOn(a)){const h=harmAt(a,a.t);if(h.z>=lo&&h.z<=hi)o+=S.circle(X(h.z),yR,15*k,{c:C.pred,w:2,dash:`${5*k} ${4*k}`})}
  const xm=X(q.z),R=10*Math.cbrt(p.m)*k;
  if(p.vel&&T.umax>1e-9){const L=q.u/T.umax*55*k;if(Math.abs(L)>1)o+=S.arrow(xm,yR-R-7*k,xm+L,yR-R-7*k,{c:C.v,w:2.4})+(Math.abs(L)>12*k?vlab(a,xm+L/2,yR-R-14*k,'v',C.v):'')}
  if(p.frc&&T.fmax>1e-9){const L=-s.d(q.z)/T.fmax*55*k;if(Math.abs(L)>1)o+=S.arrow(xm,yR+R+7*k,xm+L,yR+R+7*k,{c:C.F,w:2.4})+(Math.abs(L)>12*k?vlab(a,xm+L/2,yR+R+24*k,'F',C.F):'')}
  o+=S.circle(xm,yR,R,{fill:C.cSoft,c:C.cInk,w:2.2})+S.circle(xm,yR,2*k,{fill:C.cInk});
  o+=`<circle cx="${xm.toFixed(1)}" cy="${yR.toFixed(1)}" r="${(R+12*k).toFixed(1)}" fill="transparent" data-mob="1" style="cursor:grab"/>`;
  geo={G,lo,hi,yR,ymin,ymax};
  a.svg('pot',o+'</g>');
}
/** lettre italique surmontée d'une flèche, centrée en x */
function vlab(a,x,y,l,c){const S=a.S,k=a.k,fs=16*k;x-=.3*fs;return S.text(x,y,S.v(l),{size:16,c})+S.arrow(x+.02*fs,y-.6*fs,x+.62*fs,y-.6*fs,{c,w:.9,head:4.5*k})}

/* ---------- graphe de droite ---------- */
let GA=null;
function drawAux(a,q){
  const P=a.panels.aux,S=a.S,C=a.C,k=a.k,p=a.p,s=sh(),[lo,hi]=bounds(a),aux=p.aux,tn=tau(a),t0v=t0(a),vu=vU(a);
  const head={phase:'Plan de phase',pos:`Position ${mv('x')}(${mv('t')})`,ener:`Énergies au cours du temps`,force:`Force ${mv('F')}(${mv('x')}) = −${E('p')}′(${mv('x')})`}[aux];
  if(P.head._h!==head){P.head.innerHTML=head;P.head._h=head}
  const past=T.pts.filter(r=>r.tau<=tn+1e-12);past.push({tau:tn,z:q.z,u:q.u});
  let o='',G;
  if(aux==='phase'){
    let um=T.umax;if(harmOn(a))um=Math.max(um,Math.hypot((st.z0-selEq()[0])*Math.sqrt(kap()),T.u0));um=Math.max(um,.05)*1.16*vu;
    G=S.graph({x:4*k,y:4*k,w:P.w-8*k,h:P.h-8*k,xmin:lo*p.a,xmax:hi*p.a,ymin:-um,ymax:um,xlab:`${S.v('x')} (m)`,ylab:`${S.v('v')} (m·s${S.sup('−1')})`});
    o=G.svg+S.clip('aclip',G);
    if(p.prev){const e=q.em/p.eps;for(const I of PM.intervals(st.prof,e)){const z1=Math.max(lo,I.lo),z2=Math.min(hi,I.hi);if(z1>z2)continue;for(const sg of[1,-1]){const pts=[];for(let i=0;i<=250;i++){const z=z1+(z2-z1)*i/250;pts.push([z*p.a,sg*Math.sqrt(Math.max(0,2*(e-s.u(z))))*vu])}o+=S.curve(pts,G,{c:C.Em,w:2,dash:`${7*k} ${5*k}`})}}}
    if(harmOn(a)){const kk=kap(),z0=selEq()[0],Am=Math.hypot(st.z0-z0,T.u0/Math.sqrt(kk)),pts=[];for(let i=0;i<=300;i++){const ph=2*Math.PI*i/300;pts.push([(z0+Am*Math.cos(ph))*p.a,-Am*Math.sqrt(kk)*Math.sin(ph)*vu])}o+=S.curve(pts,G,{c:C.pred,w:2,dash:`${6*k} ${5*k}`});const h=harmAt(a,a.t);o+=S.circle(G.X(h.z*p.a),G.Y(h.u*vu),5*k,{fill:C.card,c:C.pred,w:2})}
    o+=S.curve(past.map(r=>[r.z*p.a,r.u*vu]),G,{c:C.cInk,w:2.4});
    o+=S.circle(G.X(q.x),G.Y(q.v),5.5*k,{fill:C.cInk});
  }else if(aux==='force'){
    const fm=Math.max(T.fmax,.3)*1.2*p.eps/p.a,pts=[];for(let i=0;i<=300;i++){const z=lo+(hi-lo)*i/300;pts.push([z*p.a,-p.eps/p.a*s.d(z)])}
    G=S.graph({x:4*k,y:4*k,w:P.w-8*k,h:P.h-8*k,xmin:lo*p.a,xmax:hi*p.a,ymin:-fm,ymax:fm,xlab:`${S.v('x')} (m)`,ylab:`${S.v('F')} (N)`});
    o=G.svg+S.clip('aclip',G)+S.curve(pts,G,{c:C.F,w:2.6})+S.circle(G.X(q.x),G.Y(q.F),5*k,{fill:C.F});
  }else{
    const dur=T.dur;
    if(aux==='pos'){let y1=T.zmin*p.a,y2=T.zmax*p.a;if(harmOn(a)){const z0=selEq()[0],Am=Math.hypot(st.z0-z0,T.u0/Math.sqrt(kap()));y1=Math.min(y1,(z0-Am)*p.a);y2=Math.max(y2,(z0+Am)*p.a)}const pad=Math.max(.1*p.a,(y2-y1)*.12);
      G=S.graph({x:4*k,y:4*k,w:P.w-8*k,h:P.h-8*k,xmin:0,xmax:dur,ymin:y1-pad,ymax:y2+pad,xlab:`${S.v('t')} (s)`,ylab:`${S.v('x')} (m)`});
      o=G.svg+S.clip('aclip',G);
      if(harmOn(a)){const hp=[];for(let i=0;i<=400;i++){const t=a.t*i/400;hp.push([t,harmAt(a,t).z*p.a])}o+=S.curve(hp,G,{c:C.pred,w:2,dash:`${6*k} ${5*k}`})}
      o+=S.curve(past.map(r=>[r.tau*t0v,r.z*p.a]),G,{c:C.cInk,w:2.4})+S.circle(G.X(a.t),G.Y(q.x),4.5*k,{fill:C.cInk});
    }else{
      const EP=r=>p.eps*s.u(r.z),EC=r=>p.eps*r.u*r.u/2;let y1=0,y2=T.e0*p.eps;for(const r of T.pts){y1=Math.min(y1,EP(r));y2=Math.max(y2,EP(r)+EC(r))}const pad=Math.max(.05*p.eps,(y2-y1)*.1);
      G=S.graph({x:4*k,y:4*k,w:P.w-8*k,h:P.h-8*k,xmin:0,xmax:dur,ymin:y1-pad,ymax:y2+pad,xlab:`${S.v('t')} (s)`,ylab:'Énergie (J)'});
      o=G.svg+S.clip('aclip',G);
      o+=S.curve(past.map(r=>[r.tau*t0v,EP(r)]),G,{c:C.Ep,w:2.4})+S.curve(past.map(r=>[r.tau*t0v,EC(r)]),G,{c:C.Ec,w:2.4})+S.curve(past.map(r=>[r.tau*t0v,EP(r)+EC(r)]),G,{c:C.Em,w:2.4});
    }
    const x=G.X(a.t);o+=S.line(x,G.y0,x,G.y0+G.h,{c:C.ink2,w:1,dash:`${3*k} ${4*k}`});
  }
  GA={G,time:aux==='pos'||aux==='ener'};
  a.svg('aux',o);
}

/* ---------- interactions ---------- */
let dg=null;
A.drag('pot',{
  hit:(x,y,e)=>{if(!geo)return false;if(e.target.closest&&e.target.closest('[data-eq],[data-mob]'))return true;const yE=geo.G.Y(cur(A).em);return Math.abs(y-yE)<10*A.k&&x>geo.G.x0&&x<geo.G.x0+geo.G.w},
  start(x,y,e){A.play(false);const eq=e.target.closest&&e.target.closest('[data-eq]');
    if(eq){dg=null;st.eq=+eq.dataset.eq;A.set('eq',st.eq,{silent:true});const sel=document.getElementById('s_eq');if(sel)sel.value=String(st.eq);frame(A);return}
    dg=e.target.closest&&e.target.closest('[data-mob]')?'mob':'E'},
  move(x,y){if(!dg)return;const G=geo.G;
    if(dg==='E'){const v=G.yv(y),it=IT.E;setEnergy(A,Math.min(it.max,Math.max(it.min,v)))}
    else setStart(A,Math.max(geo.lo,Math.min(geo.hi,G.xv(x)/A.p.a)))},
  end(){if(dg){const[lo,hi]=bounds(A);if(T.zmin<lo||T.zmax>hi){A.panels.pot.zoom=1;st.local=null}}dg=null}
});
A.drag('aux',{
  hit:x=>GA&&GA.time&&x>=GA.G.x0-4&&x<=GA.G.x0+GA.G.w+4,
  start(x){A.play(false);A.t=Math.max(0,Math.min(T.dur,GA.G.xv(x)))},
  move(x){A.t=Math.max(0,Math.min(T.dur,GA.G.xv(Math.max(GA.G.x0,Math.min(GA.G.x0+GA.G.w,x)))))}
});

</script>
