    this.q('.pr-vundo').onclick = () => this.undoLast();
    this.q('.pr-vclro').onclick = () => {
      const k = +this.q('.pr-vobj').value;
      const cnt = [...this.pts.values()].filter(p => p.k === k).length;
      if (!cnt) return;
      this.app.confirm(`Effacer les ${cnt} points de l'Objet ${k + 1} ?`, () => {
        for (const [key, p] of [...this.pts]) if (p.k === k) this.pts.delete(key);
        this.draw(); this.app.markDirty();
      });
    };
    this.q('.pr-vclr').onclick = () => {
      if (!this.pts.size) return;
      this.app.confirm(`Effacer les ${this.pts.size} points du pointage vidéo ?`, () => {
        this.pts.clear(); this.hist = []; this.draw(); this.app.markDirty();
      });
    };

    this.sideEl.querySelectorAll('.pr-sTraj,.pr-sRep,.pr-sPts,.pr-sV,.pr-sA,.pr-vev,.pr-vlu,.pr-vlen').forEach(e => e.onchange = () => this.draw());
    this.q('.pr-vsc').oninput = () => this.draw();
    this.q('.pr-vmk').onclick = () => this.exportCurves();

    this.ovCv.addEventListener('pointerdown', e => this._onDown(e));
    this.ovCv.addEventListener('pointermove', e => this._onMove(e));
    this.ovCv.addEventListener('pointerup', () => { if (this.draggingPt) { this.draggingPt = null; this.app.markDirty(); } });
    this.ovCv.addEventListener('pointerleave', () => { this.mouse = null; this.loupeCv.style.display = 'none'; this.draggingPt = null; if (this.mode) this.draw(); });
    this.ovCv.addEventListener('contextmenu', e => {
      e.preventDefault();
      if (!this.vw()) return;
      const { x, y } = this._vpos(e);
      const hit = this._findNearPoint(x, y);
      if (hit) {
        this.pts.delete(this.key(hit.f, hit.k));
        this.draw();
        this.app.markDirty();
        this.app.toast('Point supprimé');
      }
    });
    this.ovCv.addEventListener('wheel', e => {
      if (!this.v.duration) return;
      e.preventDefault();
      this.stopPlay();
      this.goto(this.frame + (e.deltaY > 0 ? 1 : -1));
    }, { passive: false });

    this.ro = new ResizeObserver(() => this.layout());
    this.ro.observe(this.canvasArea);
  }

  _updMethUI() {
    const m = this.q('.pr-vmeth').value;
    this.q('.pr-bg-row').hidden = m !== 'bg';
    this.q('.pr-hsv-row').hidden = m !== 'hsv';
    this.q('.pr-tol-row').hidden = m === 'ncc';
  }

  _updObj() {
    const n = this.npi(), s = this.q('.pr-vobj'), cur = Math.min(n - 1, +s.value || 0);
    s.innerHTML = Array.from({ length: n }, (_, i) => `<option value="${i}">Objet ${i + 1}</option>`).join('');
    s.value = cur;
    this.k = Math.min(this.k, n - 1);
  }

  fpsF() { return Math.max(1, IO.parseNum(this.q('.pr-fpsf').value) || 30); }
  fpsR() { return Math.max(1, IO.parseNum(this.q('.pr-fpsr').value) || this.fpsF()); }
  npi() { return Math.max(1, Math.min(4, +this.q('.pr-vnpi').value | 0)); }
  nmax() { return Math.max(0, Math.floor((this.v.duration || 0) * this.fpsF() - 0.5)); }
  tOf(f) { return (f - this.f0) / this.fpsR(); }
  key(f, k) { return f + '|' + k; }

  undoLast() {
    const k = this.hist.pop();
    if (!k) return;
    const removed = this.pts.get(k);
    this.pts.delete(k);
    if (removed) this.goto(removed.f);
    this.draw();
    this.app.markDirty();
    this.app.toast('Dernier point annulé');
  }

  _syncSloChips() {
    const fF = this.fpsF(), fR = this.fpsR();
    const isSame = Math.abs(fR - fF) < 0.01;
    this.sideEl.querySelectorAll('.pr-slo').forEach(b => {
      const on = b.dataset.fps === 'same' ? isSame : (!isSame && Math.abs(fR - Number(b.dataset.fps)) < 0.01);
      b.setAttribute('aria-pressed', String(on));
    });
  }

  _updateBanner() {
    if (!this.bannerEl) return;
    if (!this.vw()) { this.bannerEl.hidden = true; return; }
    this.bannerEl.hidden = false;
    const txt = this.q('.pr-vb-txt'), escBtn = this.q('.pr-vb-esc');
    const msgs = {
      ech: this.tmp.length === 1 ? 'Échelle : cliquez la 2e extrémité de la règle' : 'Échelle : cliquez la 1re extrémité de la règle',
      ori: 'Origine : cliquez le point O du repère',
      axe: 'Axe x : cliquez un point de l’axe x (côté positif)',
      pt: 'Pointage actif : cliquez l’objet (glisser = corriger · clic droit = supprimer · Ctrl+Z = annuler)',
      suivi: 'Suivi auto : cliquez au centre de l’objet à suivre',
    };
    if (this.mode && msgs[this.mode]) {
      txt.textContent = msgs[this.mode];
      this.bannerEl.classList.add('armed');
      escBtn.hidden = false;
    } else {
      const next = !this.ech ? 'Étape suivante : cliquez « Échelle (2 clics) » à droite'
        : (!this.pts.size ? 'Prêt : cliquez « Pointer » ou « Lancer suivi » à droite'
          : `${this.pts.size} point(s) · Cliquez « Envoyer vers Courbes → » ou « Pointer » pour continuer`);
      txt.textContent = next;
      this.bannerEl.classList.remove('armed');
      escBtn.hidden = true;
    }
  }

  _updateBadges() {
    const b1 = this.q('.pr-st1'), b2 = this.q('.pr-st2'), b3 = this.q('.pr-st3');
    if (b1) {
      if (this.vw()) {
        const fR = this.fpsR(), fF = this.fpsF();
        b1.textContent = Math.abs(fR - fF) > 0.1 ? `✓ ralenti ${fR} ips` : `✓ ${fF} ips`;
        b1.classList.add('ok');
      } else {
        b1.textContent = 'À ouvrir';
        b1.classList.remove('ok');
      }
    }
    if (b2) {
      if (this.ech) {
        b2.textContent = this.ori ? '✓ Échelle + O' : '✓ Échelle';
        b2.classList.add('ok');
      } else {
        b2.textContent = 'À calibrer';
        b2.classList.remove('ok');
      }
    }
    if (b3) {
      const n = this.pts.size;
      b3.textContent = n ? `✓ ${n} pt${n > 1 ? 's' : ''}` : '0 pt';
      b3.classList.toggle('ok', n > 0);
    }
  }

  setMode(m) {
    this.mode = m;
    this.ovCv.style.cursor = m ? 'crosshair' : 'default';
    this.sideEl.querySelectorAll('.ib.armed').forEach(b => b.classList.remove('armed'));
    const sel = { ech: '.pr-vech', ori: '.pr-vori', axe: '.pr-vaxe', pt: '.pr-vpt', suivi: '.pr-vauto' }[m];
    if (sel) this.q(sel).classList.add('armed');
    this._updateBanner();
  }

  exportState() {
    if (!this.fname && !this.pts.size && !this.ech && !this.ori) return this.savedState || null;
    return {
      fname: this.fname,
      fpsf: this.q('.pr-fpsf').value,
      fpsr: this.q('.pr-fpsr').value,
      f0: this.f0,
      rot: this.rot,
      ech: this.ech,
      ori: this.ori,
      theta: this.theta,
      len: this.q('.pr-vlen').value,
      lu: this.q('.pr-vlu').value,
      yup: this.q('.pr-vyup').checked,
      npi: +this.q('.pr-vnpi').value || 1,
      step: +this.q('.pr-vstep').value || 1,
      pts: [...this.pts.values()],
    };
  }

  importState(st) {
    this.savedState = st || null;
    const note = this.emptyEl.querySelector('.pr-vrest-note');
    if (note) note.remove();
    if (st && st.fname && (st.pts?.length || st.ech || st.ori)) {
      const p = document.createElement('p');
      p.className = 'pr-muted pr-vrest-note';
      p.style.color = 'var(--ok)';
      p.textContent = `Pointage sauvegardé pour « ${st.fname} » (${st.pts?.length || 0} pts) : rouvrez cette vidéo pour le retrouver.`;
      this.emptyEl.querySelector('.pr-vempty-card')?.appendChild(p);
    }
  }

  _applyState(st) {
    if (!st) return;
    if (st.fpsf) this.q('.pr-fpsf').value = st.fpsf;
    if (st.fpsr) this.q('.pr-fpsr').value = st.fpsr;
    this.f0 = st.f0 || 0;
    this.rot = st.rot || 0;
    this.ech = st.ech || null;
    this.ori = st.ori || null;
    this.theta = st.theta || 0;
    this.q('.pr-vang').value = PlotFmt.val(this.theta * 180 / Math.PI, 4);
    if (st.len !== undefined) this.q('.pr-vlen').value = st.len;
    if (st.lu) this.q('.pr-vlu').value = st.lu;
    if (st.yup !== undefined) this.q('.pr-vyup').checked = !!st.yup;
    if (st.npi) { this.q('.pr-vnpi').value = st.npi; this._updObj(); }
    if (st.step) this.q('.pr-vstep').value = st.step;
    this.pts.clear(); this.hist = [];
    for (const p of (st.pts || [])) {
      const key = this.key(p.f, p.k);
      this.pts.set(key, { f: p.f, k: p.k, px: p.px, py: p.py, auto: !!p.auto });
      this.hist.push(key);
    }
  }

  load(file) {
    this.stopPlay();
    this.rawFile = file;
    this.fname = file.name;
    this.rot = 0;
    this.pts.clear();
    this.hist = [];
    this.f0 = 0;
    this.bgData = null;
    this.hsvSample = null;
    this.fallbackBanner.hidden = true;
    const restored = this.savedState && this.savedState.fname === file.name;
    if (restored) {
      this._applyState(this.savedState);
      this.savedState = null;
    }
    if (this.url) URL.revokeObjectURL(this.url);
    this.url = URL.createObjectURL(file);
    this.v.src = this.url;
    this.v.load();
    this.app.toast(restored
      ? `Vidéo « ${file.name} » chargée · pointage restauré (${this.pts.size} pts)`
      : `Chargement de « ${file.name} »…`, restored ? 'ok' : '');
  }

  _showFallback(reason) {
    this.emptyEl.hidden = true;
    this.fallbackBanner.hidden = false;
    this.q('.pr-vfb-msg').textContent = reason + ' Progressi peut convertir ce fichier localement dans votre navigateur en MP4 all-intra (téléchargement unique de FFmpeg ~25 Mo, aucune vidéo envoyée sur internet).';
    this.q('.pr-vprog').hidden = true;
  }

  async convertWithFFmpeg() {
    if (!this.rawFile) return;
    if (!navigator.onLine) {
      this.app.toast('Conversion FFmpeg impossible hors ligne. Convertissez la vidéo en MP4 (H.264) ou connectez-vous.', 'err');
      return;
    }
    this.fallbackBanner.hidden = false;
    const prog = this.q('.pr-vprog'), bar = this.q('.pr-vprog-bar'), txt = this.q('.pr-vprog-txt');
    const btn = this.q('.pr-vconv-btn');
    prog.hidden = false;
    btn.disabled = true;
    const setStatus = (pct, msg) => { bar.style.width = Math.round(pct) + '%'; txt.textContent = msg; };

    try {
      if (!this.ffmpegInst) {
        setStatus(8, 'Chargement du module FFmpeg (~25 Mo)…');
        const loadScript = src => new Promise((res, rej) => {
          const s = document.createElement('script');
          s.src = src; s.onload = res; s.onerror = () => rej(new Error('Impossible de charger ' + src));
          document.head.appendChild(s);
        });
        if (!window.FFmpegWASM) {
          await loadScript('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js');
        }
        const { FFmpeg } = window.FFmpegWASM;
        const ff = new FFmpeg();
        ff.on('progress', ({ progress }) => {
          setStatus(30 + Math.min(68, Math.max(0, progress * 68)), `Conversion en MP4… ${Math.round(progress * 100)} %`);
        });
        const toBlobURL = async (url, mime) => {
          const resp = await fetch(url);
          if (!resp.ok) throw new Error('Téléchargement échoué : ' + url);
          return URL.createObjectURL(new Blob([await resp.arrayBuffer()], { type: mime }));
        };
        setStatus(18, 'Initialisation du cœur WebAssembly…');
        const base = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd';
        await ff.load({
          coreURL: await toBlobURL(`${base}/ffmpeg-core.js`, 'text/javascript'),
          wasmURL: await toBlobURL(`${base}/ffmpeg-core.wasm`, 'application/wasm'),
        });
        this.ffmpegInst = ff;
      }

      const ff = this.ffmpegInst;
      setStatus(30, 'Lecture du fichier vidéo…');
      const ext = (this.rawFile.name.split('.').pop() || 'mp4').toLowerCase();
      const inName = 'input.' + ext;
      const data = new Uint8Array(await this.rawFile.arrayBuffer());
      await ff.writeFile(inName, data);
      await ff.exec([
        '-i', inName,
        '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '22',
        '-g', '1', '-pix_fmt', 'yuv420p', '-an', '-movflags', '+faststart',
        'output.mp4',
      ]);
      const out = await ff.readFile('output.mp4');
      await ff.deleteFile(inName).catch(() => {});
      await ff.deleteFile('output.mp4').catch(() => {});
      const blob = new Blob([out.buffer], { type: 'video/mp4' });
      if (this.url) URL.revokeObjectURL(this.url);
      this.url = URL.createObjectURL(blob);
      this.v.src = this.url;
      this.v.load();
      setStatus(100, 'Conversion terminée !');
      this.app.toast('Vidéo convertie en MP4 all-intra : pas-à-pas exact garanti !', 'ok');
    } catch (e) {
      setStatus(0, 'Échec : ' + e.message);
      this.app.toast('Conversion échouée : ' + e.message, 'err');
    } finally {
      btn.disabled = false;
    }
  }

  _meta() {
    const w = this.vw(), h = this.vh();
    const dtMs = 1000 / this.fpsR();
    this.q('.pr-vmeta').textContent = w
      ? `${this.fname} · ${w}×${h} px · ${this.v.duration.toFixed(2)} s · Δt = ${PlotFmt.val(dtMs, 3)} ms/img`
      : '';
    this._syncSloChips();
    this._updateBadges();
    this._updateBanner();
  }

  layout() {
    const W = this.canvasArea.clientWidth, H = this.canvasArea.clientHeight;
    const vw = this.vw() || 16, vh = this.vh() || 9;
    const s = Math.min(W / vw, H / vh);
    const dw = Math.max(1, vw * s), dh = Math.max(1, vh * s);
    this.disp = s;
    for (const cv of [this.viewCv, this.ovCv]) {
      cv.style.width = dw + 'px'; cv.style.height = dh + 'px';
      cv.style.left = ((W - dw) / 2) + 'px'; cv.style.top = ((H - dh) / 2) + 'px';
      if (cv.width !== vw || cv.height !== vh) { cv.width = vw; cv.height = vh; }
    }
    this._renderFrame();
    this.draw();
  }

  _renderFrame() {
    const vw = this.vw(), vh = this.vh();
    if (!vw || !vh || this.v.readyState < 2) return;
    const ctx = this.vctx;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, vw, vh);
    if (this.rot === 90) { ctx.translate(vw, 0); ctx.rotate(Math.PI / 2); }
    else if (this.rot === 180) { ctx.translate(vw, vh); ctx.rotate(Math.PI); }
    else if (this.rot === 270) { ctx.translate(0, vh); ctx.rotate(-Math.PI / 2); }
    ctx.drawImage(this.v, 0, 0);
    ctx.restore();
  }

  seekTo(f) {
    return new Promise(res => {
      const v = this.v;
      if (!v.duration) { res(); return; }
      const t = Math.min(Math.max(0, v.duration - 1e-4), (f + 0.5) / this.fpsF());
      if (Math.abs(v.currentTime - t) < 1e-6 && v.readyState >= 2) { this._renderFrame(); res(); return; }
      let ok = false;
      const done = () => { if (ok) return; ok = true; v.removeEventListener('seeked', done); this._renderFrame(); res(); };
      v.addEventListener('seeked', done);
      v.currentTime = t;
      setTimeout(done, 1800);
    });
  }

  goto(f) {
    if (!this.v.duration) return Promise.resolve();
    const nmax = this.nmax();
    this.frame = Math.max(0, Math.min(nmax, Math.round(f)));
    const pct = nmax ? (this.frame / nmax) * 100 : 0;
    const sk = this.q('.pr-vseek');
    sk.value = Math.round(pct * 10);
    sk.style.setProperty('--pct', pct.toFixed(1) + '%');
    const pad = String(nmax).length;
    const frStr = String(this.frame).padStart(pad, '\u00a0');
    const dec = this.fpsR() >= 100 ? 4 : 3;
    const tVal = this.tOf(this.frame);
    const tStr = (Math.abs(tVal) < 0.5 * Math.pow(10, -dec) ? 0 : tVal).toFixed(dec).replace('-', '−');
    this.q('.pr-vclock').textContent = `Img ${frStr}/${nmax} · t = ${tStr} s`;
    const fr = this.frame;
    return this.seekTo(fr).then(() => { if (fr === this.frame) this.draw(); });
  }

  togglePlay() {
    if (!this.v.duration) return;
    if (this.playing) { this.stopPlay(); return; }
    this.playing = true;
    this.q('.pr-vplay').textContent = '❚❚ Pause';
    const step = () => {
      if (!this.playing) return;
      if (this.frame >= this.nmax()) { this.stopPlay(); return; }
      this.goto(this.frame + 1).then(() => {
        if (this.playing) this._playTimer = setTimeout(step, Math.max(15, 1000 / Math.min(30, this.fpsF())));
      });
    };
    step();
  }
  stopPlay() {
    this.playing = false;
    clearTimeout(this._playTimer);
    if (this.q('.pr-vplay')) this.q('.pr-vplay').textContent = '▶ Lire';
  }

  async detectFps() {
    const v = this.v;
    if (!v.duration) { this.app.toast('Ouvrez d’abord une vidéo', 'err'); return; }
    if (!v.requestVideoFrameCallback) { this.app.toast('Saisissez la cadence manuellement sur ce navigateur', 'err'); return; }
    if (this.tracking || this.detecting) return;
    this.stopPlay();
    this.detecting = true;
    this.q('.pr-vdet').disabled = true;
    const keep = this.frame, times = [];
    this.app.toast('Mesure de la cadence…');
    await new Promise(res => {
      let end = false;
      const fin = () => { if (!end) { end = true; v.removeEventListener('ended', fin); res(); } };
      v.addEventListener('ended', fin);
      const cb = (_, md) => { if (end) return; times.push(md.mediaTime); if (times.length < 40 && !v.ended) v.requestVideoFrameCallback(cb); else fin(); };
      v.requestVideoFrameCallback(cb);
      v.currentTime = Math.min(v.duration * 0.25, 0.8);
      v.play().catch(fin);
      setTimeout(fin, 4500);
    });
    v.pause();
    this.detecting = false;
    this.q('.pr-vdet').disabled = false;
    const d = [];
    for (let i = 1; i < times.length; i++) { const dt = times[i] - times[i - 1]; if (dt > 1e-5) d.push(dt); }
    if (d.length < 4) { this.app.toast('Cadence non mesurable automatiquement', 'err'); this.goto(keep); return; }
    d.sort((a, b) => a - b);
    let fps = 1 / d[d.length >> 1];
    for (const s of [24, 25, 29.97, 30, 48, 50, 59.94, 60, 100, 120, 240]) {
      if (Math.abs(fps - s) / s < 0.03) { fps = s; break; }
    }
    const same = Math.abs(this.fpsR() - this.fpsF()) < 1e-6;
    const str = String(+fps.toFixed(2));
    this.q('.pr-fpsf').value = str;
    if (same) this.q('.pr-fpsr').value = str;
    this._meta();
    this.goto(keep);
    this.app.toast(`Cadence détectée : ${str} img/s`, 'ok');
  }

  // ---------- Conversions coordonnées ----------
  scale() {
    const lu = { m: 1, cm: 0.01, mm: 0.001 }[this.q('.pr-vlu').value] || 1;
    const len = (IO.parseNum(this.q('.pr-vlen').value) || 1) * lu;
    return this.ech ? len / Math.hypot(this.ech[1][0] - this.ech[0][0], this.ech[1][1] - this.ech[0][1]) : 1;
  }
  origin() { return this.ori || [0, this.vh() || 0]; }
  toPhys(px, py) {
    const [ox, oy] = this.origin(), u = px - ox, v = oy - py;
    const c = Math.cos(this.theta), s = Math.sin(this.theta), sc = this.scale();
    let X = u * c + v * s, Y = -u * s + v * c;
    if (!this.q('.pr-vyup').checked) Y = -Y;
    return [X * sc, Y * sc];
  }

  _vpos(e) {
    const r = this.ovCv.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * this.ovCv.width, y: (e.clientY - r.top) / r.height * this.ovCv.height };
  }
  _findNearPoint(x, y) {
    let best = null, bd = 14 / (this.disp || 1);
    for (const p of this.pts.values()) {
      if (p.f !== this.frame) continue;
      const d = Math.hypot(p.px - x, p.py - y);
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  }

  _onDown(e) {
    if (!this.vw() || e.button !== 0) return;
    this.stopPlay();
    const { x, y } = this._vpos(e);

    if (this.mode === 'ech') {
      this.tmp.push([x, y]);
      if (this.tmp.length === 2) {
        this.ech = this.tmp.slice(); this.tmp = []; this.setMode(null);
        const px = Math.hypot(this.ech[1][0] - this.ech[0][0], this.ech[1][1] - this.ech[0][1]);
        this.app.markDirty();
        this.app.toast(`Échelle calibrée : ${px.toFixed(1)} px = ${this.q('.pr-vlen').value} ${this.q('.pr-vlu').value}`, 'ok');
      }
      this.draw();
      return;
    }
    if (this.mode === 'ori') { this.ori = [x, y]; this.setMode(null); this.app.markDirty(); this.app.toast('Origine définie', 'ok'); this.draw(); return; }
    if (this.mode === 'axe') {
      const [ox, oy] = this.origin();
      this.theta = Math.atan2(oy - y, x - ox);
      this.q('.pr-vang').value = PlotFmt.val(this.theta * 180 / Math.PI, 4);
      this.setMode(null);
      this.app.markDirty();
      this.app.toast(`Axe x incliné de ${(this.theta * 180 / Math.PI).toFixed(1)}°`, 'ok');
      this.draw();
      return;
    }

    // Glisser un point déjà présent sur cette image pour le corriger finement
    const near = this._findNearPoint(x, y);
    if (near && this.mode !== 'suivi') {
      this.draggingPt = near;
      this.ovCv.setPointerCapture(e.pointerId);
      return;
    }

    if (this.mode === 'pt') {
      const npi = this.npi();
      this.k = Math.min(this.k, npi - 1);
      this.setPt(this.frame, this.k, x, y, false);
      this.k++;
      if (this.k >= npi) {
        this.k = 0;
        this.goto(this.frame + (+this.q('.pr-vstep').value || 1));
      }
      this.q('.pr-vobj').value = this.k;
      this.draw();
      return;
    }
    if (this.mode === 'suivi') {
      const k = +this.q('.pr-vobj').value;
      this.setPt(this.frame, k, x, y, false);
      this.setMode(null);
      this.track(k, x, y);
      return;
    }
    // Hors mode : échantillonner HSV si mode couleur actif (pour aperçu du masque)
    if (this.q('.pr-vmeth').value === 'hsv') {
      this.hsvSample = this._sampleHSV(x, y);
      this.draw();
    }
  }

  _onMove(e) {
    if (!this.vw()) return;
    this.mouse = this._vpos(e);
    if (this.draggingPt) {
      this.draggingPt.px = this.mouse.x;
      this.draggingPt.py = this.mouse.y;
      this.draggingPt.auto = false;
      this.draw();
      return;
    }
    if (this.mode) this.draw();
    else this._drawLoupe();
  }

  setPt(f, k, px, py, auto) {
    const key = this.key(f, k);
    this.pts.set(key, { f, k, px, py, auto });
    this.hist = this.hist.filter(h => h !== key);
    this.hist.push(key);
    this.app.markDirty();
  }
  ptsOf(k) { return [...this.pts.values()].filter(p => p.k === k).sort((a, b) => a.f - b.f); }

  // ---------- Utilitaires couleur HSV & régions ----------
  static rgb2hsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    let h = 0;
    if (d > 1e-6) {
      if (mx === r) h = 60 * (((g - b) / d) % 6);
      else if (mx === g) h = 60 * ((b - r) / d + 2);
      else h = 60 * ((r - g) / d + 4);
      if (h < 0) h += 360;
    }
    return [h, mx > 1e-6 ? d / mx : 0, mx];
  }

  static hsvDist(h1, s1, v1, h2, s2, v2) {
    let dh = Math.abs(h1 - h2);
    if (dh > 180) dh = 360 - dh;
    // Si peu saturé (blanc/noir/gris), pondérer surtout V et S
    const satW = Math.min(s1, s2);
    const ch = (dh / 180) * satW * 120;
    const cs = Math.abs(s1 - s2) * 75;
    const cv = Math.abs(v1 - v2) * (satW < 0.2 ? 120 : 45);
    return Math.hypot(ch, cs, cv);
  }

  _region(x0, y0, w, h) {
    const W = this.vw(), H = this.vh();
    x0 = Math.max(0, Math.min(W - 1, Math.floor(x0)));
    y0 = Math.max(0, Math.min(H - 1, Math.floor(y0)));
    w = Math.max(1, Math.min(W - x0, Math.ceil(w)));
    h = Math.max(1, Math.min(H - y0, Math.ceil(h)));
    return { x0, y0, w, h, d: this.vctx.getImageData(x0, y0, w, h).data };
  }

  _sizes() {
    const W = this.vw(), H = this.vh();
    let S = IO.parseNum(this.q('.pr-vtsz').value);
    if (!(S > 2)) S = Math.max(13, Math.min(55, Math.round(Math.min(W, H) / 22)));
    S = Math.round(S) | 1;
    let R = IO.parseNum(this.q('.pr-vrsz').value);
    if (!(R > 2)) R = Math.round(1.8 * S);
    return { S, R: Math.round(R) };
  }

  _sampleHSV(x, y) {
    const { S } = this._sizes(), rr = Math.max(2, S >> 2);
    const reg = this._region(x - rr, y - rr, 2 * rr + 1, 2 * rr + 1);
    let sc = 0, ss = 0, sumS = 0, sumV = 0, n = 0;
    for (let j = 0; j < reg.h; j++) for (let i = 0; i < reg.w; i++) {
      const o = 4 * (j * reg.w + i);
      const [h, s, v] = VideoTracker.rgb2hsv(reg.d[o], reg.d[o + 1], reg.d[o + 2]);
      const rad = h * Math.PI / 180;
      sc += Math.cos(rad); ss += Math.sin(rad); sumS += s; sumV += v; n++;
    }
    let hm = Math.atan2(ss / n, sc / n) * 180 / Math.PI;
    if (hm < 0) hm += 360;
    return { h: hm, s: sumS / n, v: sumV / n };
  }

  captureCurrentAsBackground() {
    if (!this.vw()) return;
    this._renderFrame();
    const W = this.vw(), H = this.vh();
    this.bgData = new Uint8ClampedArray(this.vctx.getImageData(0, 0, W, H).data);
    this.bgW = W; this.bgH = H;
    this.app.toast(`Fond fixe capturé (image ${this.frame})`, 'ok');
  }

  async buildMedianBackground() {
    if (!this.vw() || this.nmax() < 4) { this.captureCurrentAsBackground(); return; }
    const keep = this.frame, nmax = this.nmax();
    const W = this.vw(), H = this.vh();
    const samples = [];
    const K = 7;
    this.app.toast('Calcul du fond médian…');
    for (let s = 0; s < K; s++) {
      const f = Math.round((s + 0.5) / K * nmax);
      await this.seekTo(f);
      samples.push(this.vctx.getImageData(0, 0, W, H).data);
    }
    const out = new Uint8ClampedArray(W * H * 4);
    const tmp = new Uint8Array(K);
    const mid = K >> 1;
    for (let i = 0; i < out.length; i += 4) {
      for (let c = 0; c < 3; c++) {
        for (let s = 0; s < K; s++) tmp[s] = samples[s][i + c];
        tmp.sort();
        out[i + c] = tmp[mid];
      }
      out[i + 3] = 255;
    }
    this.bgData = out; this.bgW = W; this.bgH = H;
    await this.goto(keep);
    this.app.toast('Fond médian calculé : prêt pour le suivi !', 'ok');
  }

  // ---------- 3 Algorithmes de suivi automatique ----------
  _matchBG(px, py) {
    const { S, R } = this._sizes(), half = R + (S >> 1);
    const tol = +this.q('.pr-vtol').value || 35;
    const reg = this._region(px - half, py - half, 2 * half + 1, 2 * half + 1);
    const W = this.bgW, bg = this.bgData;
    let sx = 0, sy = 0, sw = 0, n = 0;
    for (let j = 0; j < reg.h; j++) {
      const gy = reg.y0 + j;
      for (let i = 0; i < reg.w; i++) {
        const gx = reg.x0 + i;
        const o = 4 * (j * reg.w + i), b = 4 * (gy * W + gx);
        const dr = Math.abs(reg.d[o] - bg[b]);
        const dg = Math.abs(reg.d[o + 1] - bg[b + 1]);
        const db = Math.abs(reg.d[o + 2] - bg[b + 2]);
        const diff = (dr + dg + db) / 3;
        if (diff > tol) {
          const w = diff - tol;
          sx += i * w; sy += j * w; sw += w; n++;
        }
      }
    }
    if (n < 4 || sw <= 0) return null;
    return { x: reg.x0 + sx / sw, y: reg.y0 + sy / sw, n };
  }

  _matchHSV(px, py, ref) {
    const { S, R } = this._sizes(), half = R + (S >> 1);
    const tol = +this.q('.pr-vtol').value || 38;
    const reg = this._region(px - half, py - half, 2 * half + 1, 2 * half + 1);
    let sx = 0, sy = 0, sw = 0, n = 0;
    for (let j = 0; j < reg.h; j++) for (let i = 0; i < reg.w; i++) {
      const o = 4 * (j * reg.w + i);
      const [h, s, v] = VideoTracker.rgb2hsv(reg.d[o], reg.d[o + 1], reg.d[o + 2]);
      const d = VideoTracker.hsvDist(h, s, v, ref.h, ref.s, ref.v);
      if (d < tol) {
        const w = tol - d + 1;
        sx += i * w; sy += j * w; sw += w; n++;
      }
    }
    if (n < 4 || sw <= 0) return null;
    return { x: reg.x0 + sx / sw, y: reg.y0 + sy / sw, n };
  }

  _initNCC(x, y) {
    const { S } = this._sizes(), h = S >> 1;
    const reg = this._region(x - h, y - h, S, S);
    const T = new Float32Array(S * S);
    let sum = 0;
    for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
      const ii = Math.min(reg.w - 1, Math.max(0, Math.floor(x) - h + i - reg.x0));
      const jj = Math.min(reg.h - 1, Math.max(0, Math.floor(y) - h + j - reg.y0));
      const o = 4 * (jj * reg.w + ii);
      const lum = 0.299 * reg.d[o] + 0.587 * reg.d[o + 1] + 0.114 * reg.d[o + 2];
      T[j * S + i] = lum;
      sum += lum;
    }
    const mean = sum / (S * S);
    let norm = 0;
    for (let i = 0; i < T.length; i++) { T[i] -= mean; norm += T[i] * T[i]; }
    return { T, S, norm: Math.sqrt(norm) || 1 };
  }

  _matchNCC(px, py, tpl) {
    const { T, S, norm } = tpl, h = S >> 1, { R } = this._sizes();
    const reg = this._region(px - h - R - 2, py - h - R - 2, S + 2 * R + 5, S + 2 * R + 5);
    const L = new Float32Array(reg.w * reg.h);
    for (let i = 0, p = 0; i < L.length; i++, p += 4) L[i] = 0.299 * reg.d[p] + 0.587 * reg.d[p + 1] + 0.114 * reg.d[p + 2];

    const nccAt = (cx, cy, st) => {
      if (cx < 0 || cy < 0 || cx + S > reg.w || cy + S > reg.h) return -1;
      let sum = 0, n = 0;
      for (let j = 0; j < S; j += st) for (let i = 0; i < S; i += st) { sum += L[(cy + j) * reg.w + (cx + i)]; n++; }
      const mu = sum / n;
      let num = 0, den = 0;
      for (let j = 0; j < S; j += st) for (let i = 0; i < S; i += st) {
        const v = L[(cy + j) * reg.w + (cx + i)] - mu;
        num += v * T[j * S + i];
        den += v * v;
      }
      const d = Math.sqrt(den) * (st === 1 ? norm : norm / st);
      return d > 1e-6 ? num / d : -1;
    };

    const bx = Math.round(px) - h - reg.x0, by = Math.round(py) - h - reg.y0;
    const st = S > 23 ? 2 : 1;
    let best = -2, ox = 0, oy = 0;
    for (let dy = -R; dy <= R; dy += 2) for (let dx = -R; dx <= R; dx += 2) {
      const sc = nccAt(bx + dx, by + dy, st);
      if (sc > best) { best = sc; ox = dx; oy = dy; }
    }
    let b2 = -2, fx = ox, fy = oy;
    const g = {};
    for (let dy = oy - 2; dy <= oy + 2; dy++) for (let dx = ox - 2; dx <= ox + 2; dx++) {
      const sc = nccAt(bx + dx, by + dy, 1);
      g[dx + ',' + dy] = sc;
      if (sc > b2) { b2 = sc; fx = dx; fy = dy; }
    }
    if (b2 < 0.55) return null;
    const get = (dx, dy) => g[dx + ',' + dy] ?? nccAt(bx + dx, by + dy, 1);
    const sub = (m, c, p) => { const den = m - 2 * c + p; return isFinite(den) && den < 0 ? Math.max(-0.5, Math.min(0.5, 0.5 * (m - p) / den)) : 0; };
    const sx = sub(get(fx - 1, fy), b2, get(fx + 1, fy));
    const sy = sub(get(fx, fy - 1), b2, get(fx, fy + 1));
    return { x: reg.x0 + bx + fx + h + sx, y: reg.y0 + by + fy + h + sy, score: b2 };
  }

  async track(k, x, y) {
    if (this.tracking || this.detecting) return;
    await this.seekTo(this.frame);
    const meth = this.q('.pr-vmeth').value;
    const step = Math.max(1, +this.q('.pr-vstep').value || 1);
    let fend = IO.parseNum(this.q('.pr-vfend').value);
    if (!isFinite(fend)) fend = this.nmax();

    if (meth === 'bg' && (!this.bgData || this.bgW !== this.vw() || this.bgH !== this.vh())) {
      await this.buildMedianBackground();
    }
    const hsvRef = meth === 'hsv' ? (this.hsvSample = this._sampleHSV(x, y)) : null;
    const nccTpl = meth === 'ncc' ? this._initNCC(x, y) : null;

    this.tracking = true;
    this.q('.pr-vstop').disabled = false;
    this.q('.pr-vauto').disabled = true;
    let last = { x, y }, prev = null, count = 0, lost = false;

    try {
      while (this.tracking) {
        const nf = this.frame + step;
        if (nf > Math.min(this.nmax(), fend)) break;
        await this.goto(nf);
        const pred = prev ? { x: 2 * last.x - prev.x, y: 2 * last.y - prev.y } : last;
        let res = null;
        if (meth === 'bg') res = this._matchBG(pred.x, pred.y);
        else if (meth === 'hsv') res = this._matchHSV(pred.x, pred.y, hsvRef);
        else res = this._matchNCC(pred.x, pred.y, nccTpl);

        if (!res || res.x < 0 || res.y < 0 || res.x > this.vw() || res.y > this.vh()) {
          lost = true; break;
        }
        this.setPt(this.frame, k, res.x, res.y, true);
        prev = last; last = { x: res.x, y: res.y }; count++;
        this.draw();
        await new Promise(r => setTimeout(r, 0));
      }
    } finally {
      this.tracking = false;
      this.q('.pr-vstop').disabled = true;
      this.q('.pr-vauto').disabled = false;
    }

    if (lost) {
      this.setMode('suivi');
      this.app.toast(`Objet perdu à l’image ${this.frame} (${count} pts suivis) — cliquez sur l’objet pour reprendre`, 'err');
    } else {
      this.app.toast(`Suivi terminé : ${count} images pointées automatiquement`, 'ok');
    }
    this.draw();
  }

  // ---------- Dessin overlay + loupe ----------
  _vectors(k) {
    const P = this.ptsOf(k), t = P.map(p => this.tOf(p.f)), V = [], A = [];
    for (let i = 0; i < P.length; i++) {
      V[i] = i > 0 && i < P.length - 1 && t[i + 1] !== t[i - 1]
        ? [(P[i + 1].px - P[i - 1].px) / (t[i + 1] - t[i - 1]), (P[i + 1].py - P[i - 1].py) / (t[i + 1] - t[i - 1])]
        : null;
    }
    for (let i = 0; i < P.length; i++) {
      A[i] = i > 1 && i < P.length - 2 && V[i - 1] && V[i + 1] && t[i + 1] !== t[i - 1]
        ? [(V[i + 1][0] - V[i - 1][0]) / (t[i + 1] - t[i - 1]), (V[i + 1][1] - V[i - 1][1]) / (t[i + 1] - t[i - 1])]
        : null;
    }
    return { P, V, A };
  }

  draw() {
    const c = this.octx;
    if (!c) return;
    const W = this.ovCv.width, H = this.ovCv.height;
    c.clearRect(0, 0, W, H);
    if (!this.vw()) return;

    // Aperçu en direct du masque HSV si activé
    if (this.q('.pr-vmeth').value === 'hsv' && this.q('.pr-vmask').checked && this.hsvSample) {
      const tol = +this.q('.pr-vtol').value || 38;
      const src = this.vctx.getImageData(0, 0, W, H).data;
      const ov = c.createImageData(W, H);
      const step = W > 800 ? 2 : 1;
      for (let j = 0; j < H; j += step) for (let i = 0; i < W; i += step) {
        const o = 4 * (j * W + i);
        const [h, s, v] = VideoTracker.rgb2hsv(src[o], src[o + 1], src[o + 2]);
        if (VideoTracker.hsvDist(h, s, v, this.hsvSample.h, this.hsvSample.s, this.hsvSample.v) < tol) {
          for (let dj = 0; dj < step && j + dj < H; dj++) for (let di = 0; di < step && i + di < W; di++) {
            const q = 4 * ((j + dj) * W + (i + di));
            ov.data[q] = 0; ov.data[q + 1] = 230; ov.data[q + 2] = 255; ov.data[q + 3] = 155;
          }
        }
      }
      c.putImageData(ov, 0, 0);
    }

    // Taille en pixels vidéo inversement proportionnelle à l'échelle d'affichage
    // pour une visibilité constante et nette quelle que soit la résolution (720p, 1080p, 4K)
    const u = 1 / Math.max(0.08, this.disp || 1);
    const R = 4.5 * u, lw = 2.2 * u;
    const HALO = 'rgba(0, 0, 0, 0.72)';
    const COL = ['#ff3b30', '#38bdf8', '#f472b6', '#facc15'];

    const strokeHalo = (drawPath, col, w, alpha = 1) => {
      c.save();
      c.lineCap = 'round'; c.lineJoin = 'round';
      c.globalAlpha = alpha;
      c.strokeStyle = HALO; c.lineWidth = w + 1.8 * u;
      c.beginPath(); drawPath(); c.stroke();
      c.strokeStyle = col; c.lineWidth = w;
      c.beginPath(); drawPath(); c.stroke();
      c.restore();
    };

    const arrow = (x, y, dx, dy, col) => {
      const L = Math.hypot(dx, dy); if (L < 2 * u) return;
      const hx = dx / L, hy = dy / L, a = Math.min(L * 0.36, 11 * u);
      const ex = x + dx, ey = y + dy;
      const bx = ex - a * 0.75 * hx, by = ey - a * 0.75 * hy;
      const p1x = ex - a * (hx * 0.94 - hy * 0.34), p1y = ey - a * (hy * 0.94 + hx * 0.34);
      const p2x = ex - a * (hx * 0.94 + hy * 0.34), p2y = ey - a * (hy * 0.94 - hx * 0.34);
      strokeHalo(() => { c.moveTo(x, y); c.lineTo(bx, by); }, col, 2.0 * u);
      c.save();
      c.beginPath(); c.moveTo(ex, ey); c.lineTo(p1x, p1y); c.lineTo(p2x, p2y); c.closePath();
      c.lineWidth = 1.6 * u; c.strokeStyle = HALO; c.stroke();
      c.fillStyle = col; c.fill();
      c.restore();
    };

    const drawLabel = (txt, x, y, col, sizePx = 16) => {
      c.save();
      c.font = `700 ${Math.round(sizePx * u)}px system-ui,-apple-system,sans-serif`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.lineWidth = 4.2 * u; c.strokeStyle = HALO; c.lineJoin = 'round';
      c.strokeText(txt, x, y);
      c.fillStyle = col; c.fillText(txt, x, y);
      c.restore();
    };

    if (this.ech) {
      const [p0, p1] = this.ech;
      strokeHalo(() => {
        c.moveTo(p0[0], p0[1]); c.lineTo(p1[0], p1[1]);
        for (const p of this.ech) {
          c.moveTo(p[0] - 8 * u, p[1]); c.lineTo(p[0] + 8 * u, p[1]);
          c.moveTo(p[0], p[1] - 8 * u); c.lineTo(p[0], p[1] + 8 * u);
        }
      }, '#22c55e', 3.0 * u);
      drawLabel(`${this.q('.pr-vlen').value} ${this.q('.pr-vlu').value}`, 0.5 * (p0[0] + p1[0]), 0.5 * (p0[1] + p1[1]) - 14 * u, '#4ade80', 14);
    }
    if (this.tmp.length === 1 && this.mode === 'ech') {
      const [tx, ty] = this.tmp[0];
      strokeHalo(() => { c.arc(tx, ty, 6 * u, 0, 2 * Math.PI); }, '#22c55e', 3 * u);
    }
    if (this.q('.pr-sRep').checked) {
      const [ox, oy] = this.origin(), L = Math.max(85 * u, 0.14 * Math.min(W, H)), th = this.theta;
      const yup = this.q('.pr-vyup').checked;
      const ex = [Math.cos(th), -Math.sin(th)];
      const ey = yup ? [-Math.sin(th), -Math.cos(th)] : [Math.sin(th), Math.cos(th)];
      arrow(ox, oy, L * ex[0], L * ex[1], '#fde047');
      arrow(ox, oy, L * ey[0], L * ey[1], '#fde047');
      drawLabel('x', ox + (L + 16 * u) * ex[0], oy + (L + 16 * u) * ex[1], '#fde047', 17);
      drawLabel('y', ox + (L + 16 * u) * ey[0], oy + (L + 16 * u) * ey[1], '#fde047', 17);
    }

    const showV = this.q('.pr-sV').checked, showA = this.q('.pr-sA').checked;
    const ptsMode = this.q('.pr-sPts')?.value || 'smart';
    const isPointing = this.mode === 'pt' || this.mode === 'suivi';
    const every = Math.max(1, +this.q('.pr-vev').value || 1);
    const fac = Math.pow(10, +this.q('.pr-vsc').value);
    for (let k = 0; k < this.npi(); k++) {
      const { P, V, A } = this._vectors(k);
      if (!P.length) continue;
      const col = COL[k % 4];
      if (this.q('.pr-sTraj').checked && P.length > 1) {
        const trajAlpha = (ptsMode === 'smart' && isPointing) ? 0.42 : 0.9;
        strokeHalo(() => { P.forEach((p, i) => (i ? c.lineTo(p.px, p.py) : c.moveTo(p.px, p.py))); }, col, lw, trajAlpha);
      }
      if (ptsMode !== 'none') {
        for (const p of P) {
          if (p.f === this.frame) {
            strokeHalo(() => { c.arc(p.px, p.py, 8 * u, 0, 2 * Math.PI); }, col, 2.2 * u);
            c.save(); c.fillStyle = '#ffffff'; c.beginPath(); c.arc(p.px, p.py, 2.4 * u, 0, 2 * Math.PI); c.fill(); c.restore();
          } else if (ptsMode !== 'cur') {
            let alpha = 1, rad = R;
            if (ptsMode === 'smart' && isPointing) {
              rad = 2.6 * u;
              const dMouse = this.mouse ? Math.hypot(p.px - this.mouse.x, p.py - this.mouse.y) : Infinity;
              alpha = dMouse < 38 * u ? 0.14 : 0.45;
            }
            c.save();
            c.globalAlpha = alpha;
            c.beginPath(); c.arc(p.px, p.py, rad, 0, 2 * Math.PI);
            c.fillStyle = col; c.fill();
            c.lineWidth = 1.3 * u; c.strokeStyle = HALO; c.stroke();
            c.restore();
          }
        }
      }
      if (showV) {
        const m = Math.max(1e-30, ...V.filter(Boolean).map(v => Math.hypot(v[0], v[1])));
        const K = 0.14 * Math.min(W, H) / m * fac;

    startManualTable() {
      const xn = this.uniqueName('x'), yn = this.uniqueName('y');
      this.setCurve(xn, { y: new Float64Array(10).fill(NaN), unit: '', x: null, kind: 'saisie', color: '#788496' });
      this.setCurve(yn, { y: new Float64Array(10).fill(NaN), unit: '', x: xn, kind: 'saisie' });
      const v = this.activeView();
      if (!v.curves.length) { v.curves = [yn]; v.xName = xn; }
      this.markDirty();
      this.refreshAll();
      setTimeout(() => {
        const first = $('#tableWrap input[data-i="0"]');
        if (first) first.focus();
      }, 20);

    deleteTableRow(idx) {
      const cols = this.order.filter(n => this.curve(n)?.kind !== 'model');
      for (const n of cols) {
        const c = this.curve(n);
        if (idx >= c.y.length) continue;
        const arr = new Float64Array(Math.max(0, c.y.length - 1));
        arr.set(c.y.subarray(0, idx), 0);
        arr.set(c.y.subarray(idx + 1), idx);
        c.y = arr;
        if (c.excluded?.size) {
          const nextEx = new Set();
          for (const k of c.excluded) {
            if (k < idx) nextEx.add(k);
            else if (k > idx) nextEx.add(k - 1);
          }
          c.excluded = nextEx;
        }
      }
      this.markDirty();
      this.refreshAll();
      this.toast(`Ligne #${idx + 1} supprimée`);
    },

            label: 'Annuler',

              this.curves.set(n, { ...snap });

        ul.appendChild(li);

        html += `<th data-col="${esc(n)}" title="Cliquer pour modifier nom, unité et incertitude"><span class="sw" style="background:${c.color}"></span>${esc(n)}<small>${uTxt}${inc}</small></th>`;

        for (const n of cols) {

    addTableRows(k = 5) {
      const cols = this.order.filter(n => this.curve(n)?.kind !== 'model');
      if (!cols.length) { this.promptNewColumn(); return; }
      for (const n of cols) {
        const c = this.curve(n);
        const arr = new Float64Array(c.y.length + k).fill(NaN);
        arr.set(c.y); c.y = arr;
      }
      this.refreshDataUI();

    async pasteFromClipboard() {
      try {
        const txt = await navigator.clipboard.readText();
        if (!txt.trim()) { this.toast('Presse-papiers vide', 'err'); return; }

        this._ingestColumns(cols, 'presse-papiers');

        this.modal('Coller des données', `
          <p class="pr-muted">Collez ci-dessous vos valeurs (séparées par tabulations, points-virgules ou virgules) :</p>
          <textarea id="mPaste" style="width:100%;height:14em;font-family:monospace"></textarea>`,
          [{ label: 'Annuler' }, {
            label: 'Importer', pri: true, action: bg => {
              const cols = IO.parseDelimited($('#mPaste', bg).value);
              this._ingestColumns(cols, 'saisie');
            },
          }]);
      }
    },

    runCalc() {
      const text = $('#calcTa').value;
      this.calcText = text;
      const lines = text.split('\n');
      const consts = {}, made = [], scals = [];
      const get = nm => {
        if (nm in consts) return consts[nm];
        const c = this.curve(nm); if (!c) return undefined;
        const xc = c.x ? this.curve(c.x) : null;
        return { y: c.y, x: xc ? xc.y : null, xname: c.x };
      };
      const msg = $('#calcMsg');
      for (let i = 0; i < lines.length; i++) {
        let l = lines[i].replace(/\/\/.*$/, '').trim();
        if (!l) continue;
        let unit = '';
        const mu = /\[([^\]]*)\]\s*$/.exec(l);
        if (mu) { unit = mu[1].trim(); l = l.slice(0, mu.index).trim(); }
        const m = /^([A-Za-z_À-ɏμµΩωφθλτΔ][A-Za-z0-9_À-ɏμµΩωφθλτΔ']*)\s*=\s*(.+)$/.exec(l);
        if (!m) { msg.className = 'pr-calc-msg err'; msg.textContent = `Ligne ${i + 1} : syntaxe attendue « Nom = expression »`; return; }
        const name = m[1];
        try {
          const ast = Expr.parse(m[2]);
          const ctx = {
            xref: null, xrefName: null,
            get: n => {
              const v = get(n);
              if (v && typeof v === 'object' && !ctx.xrefName && v.xname !== undefined) {
                ctx.xrefName = v.xname; ctx.xref = v.x;
              }
              return v;
            },
          };
          const res = Expr.evaluate(ast, ctx);
          if (typeof res === 'number') {
            consts[name] = res;
            scals.push(`${name} = ${PlotFmt.val(res, 5)}${unit ? ' ' + unit : ''}`);
          } else {
            const old = this.curve(name);
            this.setCurve(name, { y: res, x: ctx.xrefName && ctx.xrefName !== name ? ctx.xrefName : (old ? old.x : null), unit: unit || (old ? old.unit : ''), kind: 'calc' });
            made.push(name);
          }
        } catch (e) {
          msg.className = 'pr-calc-msg err';
          msg.textContent = `Ligne ${i + 1} : ${e.message}`;
          return;
        }
      }
      this.refreshAll();
      this.markDirty();
      msg.className = 'pr-calc-msg ok';
      msg.textContent = (made.length ? 'Calculé : ' + made.join(', ') : 'Aucune colonne créée') + (scals.length ? '  |  ' + scals.join(' · ') : '');
    },

    generateSignal() {
      try {
        const yn = $('#gY').value.trim(), yu = $('#gYu').value.trim();
        const expr = $('#gExpr').value.trim();
        const t0 = IO.parseNum($('#gT0').value) || 0;
        const D = IO.parseNum($('#gD').value);
        const N = Math.max(4, Math.min(200000, Math.round(IO.parseNum($('#gN').value) || 1000)));
        if (!this.validName(yn)) throw new Error('Nom Y invalide');
        if (!(D > 0)) throw new Error('Durée invalide');
        const t = Float64Array.from({ length: N }, (_, i) => t0 + D * i / (N - 1));
        const ctx = { xref: t, get: n => (n === 't' ? { y: t, x: null } : (this.curve(n) ? { y: this.curve(n).y, x: null } : undefined)) };
        let y = Expr.evaluate(Expr.parse(expr), ctx);
        if (typeof y === 'number') y = new Float64Array(N).fill(y);
        const tn = this.curve('t') && this.curve('t').y.length === N ? 't' : this.uniqueName('t');
        this.setCurve(tn, { y: t, unit: 's', x: null, kind: 'gen', color: '#788496' });
        this.setCurve(yn, { y, unit: yu, x: tn, kind: 'gen' });
        const v = this.activeView();
        if (!v.curves.includes(yn)) v.curves.push(yn);
        v.xName = tn;
        this.refreshAll();
        this.markDirty();
        this.toast(`Signal ${yn}(${tn}) généré (${N} points)`, 'ok');
      } catch (e) { this.toast(e.message, 'err'); }
    },

        try { ps = Expr.freeSymbols($('#mExpr').value || '', 'x'); } catch (_) { ps = []; }
      }
      const tbl = $('#mParamsTbl');
      if (!ps.length) { tbl.innerHTML = ''; return; }
      tbl.innerHTML = `<thead><tr><th>Param.</th><th>Initial</th><th style="width:3.2em">Fixe</th></tr></thead><tbody>` +
        ps.map((p, i) => `<tr>
          <td><b>${esc(p)}</b></td>
          <td><input type="text" data-mp="${esc(p)}" placeholder="${lastVals && isFinite(lastVals[i]) ? PlotFmt.val(lastVals[i], 5) : 'auto'}"></td>
          <td style="text-align:center"><input type="checkbox" data-mf="${esc(p)}"></td>
        </tr>`).join('') + `</tbody>`;
    },

    refreshPlotUI() {
      const v = this.activeView();
      v.curves = v.curves.filter(n => this.curve(n));

      // Onglets de vues (Vue 1, Vue 2, +)
      const vt = $('#viewTabs');
      vt.innerHTML = this.views.map((vw, i) =>
        `<button class="mini" data-vi="${i}" aria-pressed="${i === this.activeViewIdx}">${esc(vw.title)}${this.views.length > 1 ? ' <span data-vx="' + i + '">×</span>' : ''}</button>`
      ).join('') + `<button class="mini" id="btnAddView" title="Nouvelle vue graphique">+</button>`;
      $$('[data-vi]', vt).forEach(b => b.onclick = e => {
        if (e.target.dataset.vx !== undefined) {
          const idx = +e.target.dataset.vx;
          this.views.splice(idx, 1);
          this.activeViewIdx = Math.max(0, Math.min(this.activeViewIdx, this.views.length - 1));
          this.syncPlotFromView();
          return;
        }
        this.activeViewIdx = +b.dataset.vi;
        this.syncPlotFromView();
      });
      $('#btnAddView').onclick = () => {
        this.views.push({ id: Date.now(), title: 'Vue ' + (this.views.length + 1), curves: [], xName: null, style: 'lignepoints', logx: false, logy: false, equal: false, plotTitle: '' });
        this.activeViewIdx = this.views.length - 1;
        this.syncPlotFromView();
      };

      // Sélecteur X & titre
      $('#pXSel').innerHTML = `<option value="">(abscisse propre de chaque courbe)</option>` +
        this.order.map(n => `<option value="${esc(n)}" ${n === v.xName ? 'selected' : ''}>${esc(n)}</option>`).join('');
      if ($('#pTitle')) $('#pTitle').value = v.plotTitle || '';

      // Liste des courbes cochables
      const cl = $('#pCurveList');
      cl.innerHTML = this.order.filter(n => !n.endsWith('_x')).map(n => {
        const c = this.curve(n);
        const on = v.curves.includes(n);
        return `<div class="pr-citem">
          <label><input type="checkbox" data-pc="${esc(n)}" ${on ? 'checked' : ''}><span class="sw" style="background:${c.color}"></span><span class="cn">${esc(n)}${c.unit ? ' (' + esc(c.unit) + ')' : ''}</span></label>
          <button class="mini" data-pax="${esc(n)}" title="Axe gauche (G) ou droite (D)">${c.axis === 'd' ? 'D' : 'G'}</button>
        </div>`;
      }).join('') || '<span class="pr-muted">Aucune courbe.</span>';

      $$('[data-pc]', cl).forEach(chk => chk.onchange = () => {
        const n = chk.dataset.pc;
        if (chk.checked) { if (!v.curves.includes(n)) v.curves.push(n); }
        else v.curves = v.curves.filter(x => x !== n);
        this.plot.curves = v.curves.slice();
        this.plot.autoscale();
        this.refreshFitCurveSelector();
        this.updateQuickStats();
      });
      $$('[data-pax]', cl).forEach(b => b.onclick = () => {
        const c = this.curve(b.dataset.pax);
        c.axis = c.axis === 'd' ? 'g' : 'd';
        b.textContent = c.axis === 'd' ? 'D' : 'G';
        this.plot.autoscale();
      });

      this.plot.curves = v.curves.slice();
      this.plot.xName = v.xName;
      this.plot.title = v.plotTitle || '';
      this.plot.style = v.style; $('#pStyle').value = v.style;
      this.plot.logx = v.logx; $('#pLogX').setAttribute('aria-pressed', String(!!v.logx));
      this.plot.logy = v.logy; $('#pLogY').setAttribute('aria-pressed', String(!!v.logy));
      this.plot.equal = v.equal; $('#pEq').setAttribute('aria-pressed', String(!!v.equal));

      this.refreshFitCurveSelector();
      this.plot.draw();
      this.updateQuickStats();
    },

    syncPlotFromView() {
      this.plot.autoscale();
      this.refreshPlotUI();
    },

    refreshFitCurveSelector() {
      const sel = $('#mCurve'), prev = sel.value;
      const nonModel = this.order.filter(n => this.curve(n)?.kind !== 'model');
      const v = this.activeView();
      const def = nonModel.includes(prev) ? prev : (v.curves.find(n => nonModel.includes(n)) || nonModel[nonModel.length - 1] || '');
      sel.innerHTML = nonModel.map(n => `<option value="${esc(n)}" ${n === def ? 'selected' : ''}>${esc(n)}</option>`).join('');
      this.plot.cursorCurve = sel.value || v.curves[0] || null;
      this._syncCurveUncInputs();
    },

    runFit() {
      const name = $('#mCurve').value;
      const c = this.curve(name);
      if (!c) { this.toast('Sélectionnez une courbe à ajuster', 'err'); return; }
      this._applyQuickUnc();

      const m = Fit.MODELS.find(x => x.id === $('#mModel').value) || Fit.MODELS[0];
      const d = this.getCurveXY(name, this.plot.xName);
      const uxAll = $('#mWeight').checked ? this.getUncertainty(name, 'x', this.plot.xName) : null;
      const uyAll = $('#mWeight').checked ? this.getUncertainty(name, 'y', this.plot.xName) : null;
      const mcWanted = $('#mMC').checked;
      const mcNoUnc = mcWanted && !uxAll && !uyAll;

      let xMin = -Infinity, xMax = Infinity;
      const rMode = $('#mRange').value;
      if (rMode === 'zoom' && this.plot.zoomed()) [xMin, xMax] = this.plot.xRange();
      else if (rMode === 'bounds' && this.plot.boundsRange?.length === 2) [xMin, xMax] = this.plot.boundsRange;

      const xs = [], ys = [], ux = [], uy = [];
      for (let i = 0; i < Math.min(d.x.length, d.y.length); i++) {
        if (c.excluded?.has(i)) continue;
        const x = d.x[i], y = d.y[i];
        if (!isFinite(x) || !isFinite(y)) continue;
        if (x < xMin || x > xMax) continue;
        xs.push(x); ys.push(y);
        if (uxAll) ux.push(uxAll[i]);
        if (uyAll) uy.push(uyAll[i]);
      }
      if (xs.length < 3) { $('#mRes').textContent = 'Pas assez de points valides dans la plage (minimum 3).'; return; }

      // Sous-échantillonnage si > 15 000 pts pour la réactivité
      let fx = xs, fy = ys, fux = uxAll ? ux : null, fuy = uyAll ? uy : null;
      if (xs.length > 15000) {
        const st = Math.ceil(xs.length / 15000);
        fx = xs.filter((_, i) => i % st === 0);
        fy = ys.filter((_, i) => i % st === 0);
        if (fux) fux = fux.filter((_, i) => i % st === 0);
        if (fuy) fuy = fuy.filter((_, i) => i % st === 0);
      }

      const init = {}, fixed = {};
      $$('#mParamsTbl [data-mp]').forEach(inp => {
        if (inp.value.trim()) init[inp.dataset.mp] = IO.parseNum(inp.value);
      });
      $$('#mParamsTbl [data-mf]').forEach(chk => {
        if (chk.checked) fixed[chk.dataset.mf] = true;
      });

      try {
        const out = Fit.runModel(m, fx, fy, {
          userExpr: $('#mExpr').value,
          init, fixed,
          ux: fux, uy: fuy,
          monteCarlo: mcWanted,
        });
        this.lastFit = { ...out, curveName: name, xName: this.plot.xName || c.x || 'x', fixed };
        const { p, sig, r2, rmse, chi2red, zmax, weighted, resid, zscores } = out.res;
        const xc = this.plot.xName ? this.curve(this.plot.xName) : this.xCurveOf(name);
        const xu = xc ? xc.unit : '';

        // Badge qualité CPGE avec rappel pédagogique
        let badge = '';
        if (weighted && isFinite(chi2red)) {
          const cls = (chi2red <= 2.2 && zmax <= 2.5) ? 'pr-badge-ok' : (chi2red <= 5 ? 'pr-badge-warn' : 'pr-badge-err');
          const lbl = (chi2red <= 2.2 && zmax <= 2.5) ? 'Modèle compatible avec les incertitudes' : 'Écart significatif aux incertitudes';
          const tip = 'Règle CPGE : accord modèle/mesures satisfaisant si χ²_red ≈ 1 (≤ 2) et tous les écarts normalisés |z| ≤ 2.';
          badge = `<span class="${cls}" title="${tip}">χ²_red = ${PlotFmt.val(chi2red, 3)} · max|z| = ${PlotFmt.val(zmax, 3)} — ${lbl}</span>`;
        } else {
          const cls = r2 >= 0.99 ? 'pr-badge-ok' : (r2 >= 0.95 ? 'pr-badge-warn' : 'pr-badge-err');
          badge = `<span class="${cls}" title="Renseignez u(Y) ou u(X) pour activer le test χ²_red et les écarts normalisés z.">R² = ${r2.toFixed(5)} · RMSE = ${PlotFmt.val(rmse, 3)}</span>`;
        }
        $('#mQuality').innerHTML = badge;

        const eqStr = `${name} = ${out.expr.replace(/\bx\b/g, xc ? xc.name : 'x')}`;
        let txt = `${m.nom} (${fx.length} pts${weighted ? ', pondéré' : ''})\n${eqStr}\n\n`;
        const boxLines = [eqStr];
        out.pnames.forEach((pn, i) => {
          const formatted = fixed[pn]
            ? `${PlotFmt.val(p[i], 5)}  (fixé)`
            : PlotFmt.metro(p[i], sig[i]);
          const mcTxt = out.mc && isFinite(out.mc.sig[i]) ? `  [MC: ${PlotFmt.metro(p[i], out.mc.sig[i])}]` : '';
          txt += `${pn} = ${formatted}${mcTxt}\n`;
          boxLines.push(`${pn} = ${fixed[pn] ? PlotFmt.val(p[i], 4) + ' (fixé)' : PlotFmt.metro(p[i], sig[i])}`);
        });
        if (m.extra) {
          txt += '\n' + m.extra(p, xu).join('\n') + '\n';
        }
        txt += `\nR² = ${r2.toFixed(6)}   ·   RMSE = ${PlotFmt.val(rmse, 4)}`;
        if (weighted && isFinite(chi2red)) {
          txt += `\nχ²_red = ${PlotFmt.val(chi2red, 3)}   ·   max|z| = ${PlotFmt.val(zmax, 3)}`;
          boxLines.push(`χ²_red = ${PlotFmt.val(chi2red, 3)} · max|z| = ${PlotFmt.val(zmax, 2)}`);
        } else {
          boxLines.push(`R² = ${r2.toFixed(5)}`);
        }
        if (mcNoUnc) {
          txt += `\n\n⚠ Monte-Carlo inactif : renseignez u(Y) ou u(X) ci-dessus.`;
        }
        $('#mRes').textContent = txt;

        // Mettre à jour les placeholders des valeurs initiales
        $$('#mParamsTbl [data-mp]').forEach(inp => {
          const k = out.pnames.indexOf(inp.dataset.mp);
          if (k >= 0) inp.placeholder = PlotFmt.val(p[k], 5);
        });

        // Générer la courbe modèle dense
        const x0 = Math.min(...fx), x1 = Math.max(...fx), N = 500;
        const mx = new Float64Array(N), my = new Float64Array(N);
        const logSp = this.plot.logx && x0 > 0 && x1 > 0;
        for (let i = 0; i < N; i++) {
          const u = i / (N - 1);
          mx[i] = logSp ? Math.pow(10, Math.log10(x0) + u * (Math.log10(x1) - Math.log10(x0))) : x0 + u * (x1 - x0);
          my[i] = out.fn(mx[i], p);
        }
        const mn = 'Mod_' + name, mxn = 'Mod_' + name + '_x';
        this.setCurve(mxn, { y: mx, unit: xu, kind: 'model', x: null, color: '#888' });
        this.setCurve(mn, { y: my, unit: c.unit, kind: 'model', x: mxn, color: document.documentElement.dataset.theme === 'dark' ? '#f8fafc' : '#111827', style: 'ligne', dash: true, width: 2.3, axis: c.axis });
        const v = this.activeView();
        // Conserver v.xName : SciPlot.data() utilise toujours c.x pour kind==='model'
        if (!v.curves.includes(name)) v.curves.push(name);
        if (!v.curves.includes(mn)) v.curves.push(mn);

        this.plot.residualsData = { x: Float64Array.from(fx), r: resid, z: zscores, weighted, curveName: name };
        this.plot.showResiduals = true;
        this.plot.fitBoxLines = boxLines;
        this.plot.showFitBox = true;
        $('#pRes').setAttribute('aria-pressed', 'true');
        $('#pFitBox').setAttribute('aria-pressed', 'true');
        this.refreshPlotUI();
        this.scheduleAutoSave();
        this.toast(mcNoUnc ? 'Ajustement calculé (renseignez u(Y)/u(X) pour Monte-Carlo)' : 'Ajustement calculé', 'ok');
      } catch (e) {
        $('#mRes').textContent = 'Échec de l’ajustement : ' + e.message;
        this.toast(e.message, 'err');
      }
    },

    copyFit(fmt) {
      if (!this.lastFit) { this.toast('Aucun modèle ajusté', 'err'); return; }
      let txt = $('#mRes').textContent;
      if (fmt === 'tex') {
        const f = this.lastFit;
        txt = f.pnames.map((pn, i) => {
          const s = f.res.sig[i];
          const valStr = f.fixed?.[pn]
            ? PlotFmt.val(f.res.p[i], 4).replace('−', '-').replace('.', '{,}')
            : PlotFmt.metro(f.res.p[i], s, { latex: true, comma: true });
          return `${pn} = ${valStr}`;
        }).join(' \\quad ; \\quad ');
        txt = `$$${txt}$$`;
      }
      navigator.clipboard?.writeText(txt).then(() => this.toast('Résultats copiés dans le presse-papiers', 'ok'));
    },

    updateQuickStats() {
      const cn = $('#mCurve')?.value || this.activeView().curves[0];
      const box = $('#pStats');
      if (!cn || !box || !this.curve(cn)) { if (box) box.textContent = '—'; return; }
      const d = this.getCurveXY(cn, this.plot.xName);
      let x = d.x, y = d.y;
      if (this.plot.zoomed()) {
        const [a, b] = this.plot.xRange(), xi = [], yi = [];
        for (let i = 0; i < Math.min(x.length, y.length); i++) if (x[i] >= a && x[i] <= b) { xi.push(x[i]); yi.push(y[i]); }
        x = xi; y = yi;
      }
      const st = Num.signalStats(x, y);
      if (!st) { box.textContent = 'Aucun point visible'; return; }
      const c = this.curve(cn), u = c.unit ? ' ' + c.unit : '';
      const xc = this.plot.xName ? this.curve(this.plot.xName) : this.xCurveOf(cn);
      const xu = xc?.unit || '';
      let s = `${cn} (${st.n} pts${this.plot.zoomed() ? ', zone zoomée' : ''})\n` +
        `min = ${PlotFmt.val(st.min, 5)}${u}   max = ${PlotFmt.val(st.max, 5)}${u}\n` +
        `crête-crête = ${PlotFmt.val(st.pp, 5)}${u}\n` +
        `moyenne = ${PlotFmt.val(st.mean, 5)}${u}   RMS = ${PlotFmt.val(st.rms, 5)}${u}\n` +
        `écart-type = ${PlotFmt.val(st.std, 4)}${u}`;
      if (isFinite(st.T)) {
        s += `\npériode T = ${PlotFmt.val(st.T, 5)} ${xu}   f = ${PlotFmt.si(st.freq, xu === 's' ? 'Hz' : '')}`;
        if (isFinite(st.delta)) s += `\ndécrément δ = ${PlotFmt.val(st.delta, 4)}   Q ≈ ${PlotFmt.val(st.Qest, 3)}`;
      }
      box.textContent = s;
    },

    // ==================== ONGLET 4 : TRAITEMENTS & SPECTRES ====================

    openCurveInPlot(names, opts = {}) {
      const list = Array.isArray(names) ? names : [names];
      const v = this.activeView();
      if (opts.replace) v.curves = [];
      for (const n of list) if (this.curve(n) && !v.curves.includes(n)) v.curves.push(n);
      if (opts.logx !== undefined) v.logx = !!opts.logx;
      if (opts.xName !== undefined) v.xName = opts.xName;
      this.setTab(2);
      this.plot.autoscale();
    },

    _curveOptsHtml(sel, filter) {
      return this.order.filter(n => this.curve(n)?.kind !== 'model' && (!filter || filter(this.curve(n))))
        .map(n => `<option value="${esc(n)}" ${n === sel ? 'selected' : ''}>${esc(n)}</option>`).join('');
    },

    refreshTreatUI() {
      const P = $('#treatPanel');
      const nonModel = this.order.filter(n => this.curve(n)?.kind !== 'model');
      const defC = nonModel.find(n => this.curve(n).x) || nonModel[nonModel.length - 1] || '';
      this.tplot.overlays = [];
      this.tplot.handles = [];
      this.tplot.boundsRange = null;
      this.tplot.mesure = [];
      this.tplot.mode = 'zoom';
      this.tplot.logx = false;
      $$('#tPlotBar [data-tpm]').forEach(x => x.classList.toggle('on', x.dataset.tpm === 'zoom'));

      if (!nonModel.length) {
        P.innerHTML = `<div class="pr-sec-h">Traitements</div><p class="pr-muted">Importez ou créez d'abord des données dans l'onglet 1.</p>`;
        this.tplot.curves = []; this.tplot.draw(); return;
      }

      if (this.treatTool === 'deriv') {
        P.innerHTML = `
          <div class="pr-sec-h">Dérivée, lissage & opérations</div>
          <label class="pr-fld"><span>Courbe source</span><select id="tdC">${this._curveOptsHtml(defC)}</select></label>

              <option value="sg0">Lissage (Savitzky-Golay)</option>
              <option value="deriv">Dérivée centrée classique</option>
              <option value="lisse">Moyenne glissante</option>
              <option value="ac">Retirer la valeur moyenne (AC)</option>
              <option value="norm">Normaliser (max = 1)</option>
              <option value="abs">Valeur absolue</option>
              <option value="ech">Échantillonner à fe (repliement)</option>
            </select>
          </label>
          <div class="pr-grid2" id="tdSgRow">
            <label class="pr-fld"><span>Fenêtre (impair)</span><select id="tdWin"><option>5</option><option selected>7</option><option>9</option><option>11</option><option>15</option><option>21</option></select></label>
            <label class="pr-fld"><span>Degré poly.</span><select id="tdDeg"><option selected>2</option><option>3</option><option>4</option></select></label>
          </div>
          <label class="pr-fld" id="tdParamRow" hidden><span id="tdParamLbl">Paramètre</span><input id="tdParam" value="50"></label>
          <label class="pr-fld"><span>Nom de la courbe créée</span><input id="tdName" value=""></label>
          <button class="ib on" id="tdSave" style="width:100%">Enregistrer comme nouvelle courbe</button>
          <p class="pr-muted">Astuce : Savitzky-Golay lisse le bruit expérimental tout en préservant les pics et pentes (idéal pour pointage vidéo et dosages).</p>`;
        const upd = () => {
          const op = $('#tdOp').value, cn = $('#tdC').value;
          $('#tdSgRow').hidden = !op.startsWith('sg');
          $('#tdParamRow').hidden = !(op === 'lisse' || op === 'ech');
          if (op === 'lisse') { $('#tdParamLbl').textContent = 'Largeur fenêtre (pts)'; $('#tdParam').value = '5'; }
          if (op === 'ech') { $('#tdParamLbl').textContent = 'Fréquence fe (Hz)'; $('#tdParam').value = '50'; }
          const pre = { sg1: 'd', sg2: 'd2', sg0: 'SG', deriv: 'd', lisse: 'L', ac: 'AC', norm: 'N', abs: 'Abs', ech: 'Ech' }[op];
          $('#tdName').value = this.uniqueName(pre + '_' + cn);
          this._previewDeriv(false);
        };
        $('#tdC').onchange = upd; $('#tdOp').onchange = upd;
        $('#tdWin').onchange = () => this._previewDeriv(false);

      } else if (this.treatTool === 'bode') {

        P.innerHTML = `
