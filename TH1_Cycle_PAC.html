  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));

    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);

  },
  sci(x,n=2){

/* ---------------- graduations ---------------- */

}

}

  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);

    },

/* =====================================================================
   TH1 · Pompe à chaleur au propane R290 : propriétés et cycle
   Tables CoolProp (TH1_R290_donnees.js) interpolées ; grandeurs massiques, kJ.kg⁻¹ et kJ.K⁻¹.kg⁻¹.
   Cycle : A (entrée compresseur) → B (sortie compresseur) → C (sortie condenseur) → D (sortie détendeur).
   Convention du cours : w_u, q_c, q_f algébriques reçus par le fluide (w_u > 0, q_c < 0, q_f > 0).
   ===================================================================== */
globalThis.TH1PAC = (() => {
  const D = R290Data, K = 273.15, PREF = D.pref_bar, PMID = D.pmid_bar, DEL = D.deltas;
  const rows = D.rows.map(r => ({T: r[0], P: r[1], lnP: Math.log(r[1]), hl: r[2], hv: r[3], sl: r[4], sv: r[5], hc: r[6], sc: r[7], vap: r[8], hm: r[9], sm: r[10]}));
  const N = rows.length, TMIN = rows[0].T, TMAX = rows[N - 1].T, PMIN = rows[0].P, PMAX = rows[N - 1].P;
  const Tcrit = D.critique[0], Pcrit = D.critique[1];
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

  /* ---------- saturation ---------- */
  function idxT(T) {
    let lo = 0, hi = N - 2;
    while (lo < hi) {const m = (lo + hi + 1) >> 1; if (rows[m].T <= T) lo = m; else hi = m - 1;}
    return lo;
  }
  const lin = (a, b, f) => a + (b - a) * f;
  /** saturation à la température T (°C) */
  function sat(T) {
    T = clamp(T, TMIN, TMAX);
    const i = idxT(T), a = rows[i], b = rows[i + 1], f = (T - a.T) / (b.T - a.T);
    return {T, P: Math.exp(lin(a.lnP, b.lnP, f)), hl: lin(a.hl, b.hl, f), hv: lin(a.hv, b.hv, f), sl: lin(a.sl, b.sl, f), sv: lin(a.sv, b.sv, f), i, f};
  }
  /** température de saturation (°C) à la pression P (bar) */
  function Tsat(P) {
    const lp = Math.log(clamp(P, PMIN, PMAX));
    let lo = 0, hi = N - 2;
    while (lo < hi) {const m = (lo + hi + 1) >> 1; if (rows[m].lnP <= lp) lo = m; else hi = m - 1;}
    const a = rows[lo], b = rows[lo + 1];
    return lin(a.T, b.T, (lp - a.lnP) / (b.lnP - a.lnP));
  }
  const satP = P => sat(Tsat(P));

  /* ---------- vapeur : surchauffe δ = T − T_sat(P) ---------- */
  function rowVap(r, d) {
    let lo = 0, hi = DEL.length - 2;
    d = clamp(d, 0, DEL[DEL.length - 1]);
    while (lo < hi) {const m = (lo + hi + 1) >> 1; if (DEL[m] <= d) lo = m; else hi = m - 1;}
    const f = (d - DEL[lo]) / (DEL[lo + 1] - DEL[lo]), v = r.vap;
    return [lin(v[2 * lo], v[2 * lo + 2], f), lin(v[2 * lo + 1], v[2 * lo + 3], f)];
  }
  /** vapeur (ou gaz) à P (bar) et T (°C), T ≥ T_sat(P) : {h, s} */
  function vap(P, T) {
    const Ts = Tsat(P), d = Math.max(0, T - Ts), i = idxT(Ts), a = rows[i], b = rows[i + 1], f = (Ts - a.T) / (b.T - a.T);
    const ha = rowVap(a, d), hb = rowVap(b, d);
    return {h: lin(ha[0], hb[0], f), s: lin(ha[1], hb[1], f)};
  }
  /** liquide à P (bar) et T (°C), T ≤ T_sat(P) : {h, s} ; interpolation linéaire en P entre saturation, 22 bar et 50 bar */
  function liq(P, T) {
    const z = sat(T), a = rows[z.i], b = rows[z.i + 1];
    const mid = a.hm !== null && b.hm !== null;
    const hc = lin(a.hc, b.hc, z.f), sc = lin(a.sc, b.sc, z.f);
    let h, s;
    if (mid && P <= PMID) {
      const g = (P - z.P) / (PMID - z.P);
      h = lin(z.hl, lin(a.hm, b.hm, z.f), g); s = lin(z.sl, lin(a.sm, b.sm, z.f), g);
    } else {
      const P0 = mid ? PMID : z.P, h0 = mid ? lin(a.hm, b.hm, z.f) : z.hl, s0 = mid ? lin(a.sm, b.sm, z.f) : z.sl, g = clamp((P - P0) / (PREF - P0), 0, 2);
      h = lin(h0, hc, g); s = lin(s0, sc, g);
    }
    return {h, s};
  }
  /** état monophasé ou saturé à (P, T) */
  function etat(P, T) {
    const Ts = Tsat(P);
    return T >= Ts ? vap(P, T) : liq(P, T);
  }

  /* ---------- inversions ---------- */
  function bisect(f, lo, hi, target, n = 46) {
    const slo = f(lo) - target;
    for (let i = 0; i < n; i++) {const m = (lo + hi) / 2; if ((f(m) - target) * slo > 0) lo = m; else hi = m;}
    return (lo + hi) / 2;
  }
  /** température de la vapeur à P et s (isentrope) */
  const TvapPS = (P, s) => {const Ts = Tsat(P); return bisect(T => vap(P, T).s, Ts, Ts + 160, s);};
  /** température du vapeur à P et h */
  const TvapPH = (P, h) => {const Ts = Tsat(P); return bisect(T => vap(P, T).h, Ts, Ts + 160, h);};
  const TliqPS = (P, s) => bisect(T => liq(P, T).s, TMIN, Tsat(P), s);
  /** h (kJ/kg) sur l'isentrope s à la pression P */
  function hPS(P, s) {
    const z = satP(P);
    if (s >= z.sv) return vap(P, TvapPS(P, s)).h;
    if (s <= z.sl) return liq(P, TliqPS(P, s)).h;
    return z.hl + (s - z.sl) / (z.sv - z.sl) * (z.hv - z.hl);
  }
  /** s (kJ/K/kg) au point (P, h) */
  function sPH(P, h) {
    const z = satP(P);
    if (h >= z.hv) return vap(P, TvapPH(P, h)).s;
    if (h <= z.hl) return liq(P, bisect(T => liq(P, T).h, TMIN, z.T, h)).s;
    return z.sl + (h - z.hl) / (z.hv - z.hl) * (z.sv - z.sl);
  }

  /* ---------- le cycle ---------- */
  /**
   * p = {Tev, Tco, sh, sc, TB, Tair, Teau} (°C et K).
   * La compression est limitée à T_B ≥ T_B,is (compression isentropique).
   */
  function cycle(p) {
    const ev = sat(p.Tev), co = sat(p.Tco), Pev = ev.P, Pco = co.P;
    // A : vapeur saturante surchauffée de sh
    const TA = p.Tev + p.sh, A0 = p.sh > 0 ? vap(Pev, TA) : {h: ev.hv, s: ev.sv};
    const A = {P: Pev, T: TA, h: A0.h, s: A0.s, x: p.sh > 0 ? null : 1, phase: p.sh > 0 ? 'vapeur' : 'vapeur saturante'};
    // B_is : fin de la compression isentropique
    const TBis = TvapPS(Pco, A.s), Bis0 = vap(Pco, TBis);
    const Bis = {P: Pco, T: TBis, h: Bis0.h, s: A.s, phase: 'vapeur'};
    const TB = Math.max(p.TB, TBis), B0 = vap(Pco, TB);
    const B = {P: Pco, T: TB, h: B0.h, s: B0.s, phase: 'vapeur'};
    // C : liquide saturant sous-refroidi de sc
    const TC = p.Tco - p.sc, C0 = p.sc > 0 ? liq(Pco, TC) : {h: co.hl, s: co.sl};
    const C = {P: Pco, T: TC, h: C0.h, s: C0.s, x: p.sc > 0 ? null : 0, phase: p.sc > 0 ? 'liquide' : 'liquide saturant'};
    // D : détente isenthalpique
    const xD = (C.h - ev.hl) / (ev.hv - ev.hl);
    const Dd = {P: Pev, T: p.Tev, h: C.h, s: ev.sl + xD * (ev.sv - ev.sl), x: xD, phase: 'mélange'};
    const w = B.h - A.h, qc = C.h - B.h, qf = A.h - Dd.h;
    const TF = p.Tair + K, TC_ = p.Teau + K;
    const e = -qc / w, eCarnot = TC_ / (TC_ - TF);
    const scr = {comp: B.s - A.s, det: Dd.s - C.s, cond: C.s - B.s - qc / TC_, evap: A.s - Dd.s - qf / TF};
    const scrTot = scr.comp + scr.det + scr.cond + scr.evap;
    return {p, Pev, Pco, ev, co, A, B, C, D: Dd, Bis, TBis, w, qc, qf, e, eCarnot, wrev: -qc / eCarnot, wis: Bis.h - A.h,
      scr, scrTot, extra: TF * scrTot, bilan: w + qc + qf};
  }

  return {K, Tcrit, Pcrit, PMIN, PMAX, TMIN, TMAX, sat, Tsat, satP, vap, liq, etat, TvapPS, TvapPH, hPS, sPH, cycle, clamp,
    rows, DEL, PREF};
})();

// @description Cycle d'une pompe à chaleur air-eau au propane R290 sur les diagrammes (P,h) et (T,s) : w_u, q_c, q_f, efficacité, borne de Carnot, entropie créée par organe.
'use strict';

(() => {
  const R = TH1PAC, M = AnimKit.M, K = 273.15, lg = Math.log10;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const DEF = {Tev: -5, Tco: 45, sh: 5, sc: 5, TB: 75, Tair: 7, Teau: 40};
  const LIM = {Tev: [-25, 10], Tco: [25, 60], sh: [0, 15], sc: [0, 15], TB: [35, 120], Tair: [-15, 15], Teau: [25, 55]};
  const UNIT_H = 'kJ·kg<sup>−1</sup>', UNIT_S = 'J·K<sup>−1</sup>·kg<sup>−1</sup>';
  const ORG = ['', 'Compresseur', 'Condenseur', 'Détendeur', 'Évaporateur'];
  const SEG = ['', 'A → B', 'B → C', 'C → D', 'D → A'];
  const TH = {phx: [130, 830], phy: [1, 40], tsx: [.2, 3], tsy: [0, 420]};

  let lim = {}, limKey = '';

      lim = {Tev: ch('Tev'), sh: ch('sh'), Tco: ch('Tco'), sc: ch('sc'), TB: !p.isen && ch('TB')};
    } else if (JSON.stringify(o) !== limKey) lim = {};
    for (const key of Object.keys(DEF)) if (Math.abs(o[key] - p[key]) > e) a.set(key, o[key], {silent: true});
    return o;
  }
  let memoKey = '', memo = null;
  function cyc(a) {
    const o = norm(a), key = JSON.stringify(o);
    if (key !== memoKey) {memo = R.cycle(o); memoKey = key;}
    return memo;
  }

  /* ---------------- courbes fixes des diagrammes (calculées une fois) ---------------- */
  let famMemo = null;
  function fam() {
    if (famMemo) return famMemo;
    const logSpace = (a, b, n) => Array.from({length: n + 1}, (_, i) => a * (b / a) ** (i / n));
    const Pl = logSpace(R.PMIN * 1.0001, R.Pcrit * .9999, 90), left = [], right = [], leftTs = [], rightTs = [];
    for (const P of Pl) {const z = R.satP(P); left.push([z.hl, P]); right.push([z.hv, P]); leftTs.push([z.sl, z.T + K]); rightTs.push([z.sv, z.T + K]);}
    const isoT = [-20, 0, 20, 40, 60, 80].map(T => {
      const Ps = R.sat(T).P, z = R.sat(T), pts = [];
      for (const P of logSpace(Ps, TH.phy[1], 24).reverse()) pts.push([R.liq(P, T).h, P]);
      pts.push([z.hl, Ps], [z.hv, Ps]);
      for (const P of logSpace(TH.phy[0], Ps, 60).reverse()) {if (P < Ps * .9999) pts.push([R.vap(P, T).h, P]);}
      return {T, pts};
    });
    const isoS = [2.2, 2.3, 2.4, 2.5, 2.6, 2.7, 2.8, 2.9].map(s => {
      const pts = [];
      for (const P of logSpace(TH.phy[0], 34, 60)) {const h = R.hPS(P, s); if (h >= TH.phx[0] && h <= TH.phx[1] + 40) pts.push([h, P]);}
      return {s, pts};
    });
    const isoX = [.2, .4, .6, .8].map(x => ({x, pts: Pl.map(P => {const z = R.satP(P); return [z.hl + x * (z.hv - z.hl), P];})}));
    famMemo = {left, right, leftTs, rightTs, isoT, isoS, isoX};
    return famMemo;
  }

  /* ---------------- symboles ---------------- */
  const sy = (S, s, i) => S.v(s, i);
  const hs = (S, i) => sy(S, 'h', i);
  const ss = (S, i) => sy(S, 's', i);
  let view = null;           // état du dernier dessin (pour le glisser-déposer)

  /* ---------------- ensemble des segments du cycle ---------------- */
  function segStyle(a, i) {
    const st = a.p.etape, C = a.C, col = [null, C.v, C.hot, C.E, C.cold][i];
    return {c: col, w: st === i ? 5 : 3, op: st === 0 || st === i ? 1 : .22};
  }

  function statement(a, c) {
    const S = a.S, st = a.p.etape, v = a.p.valeurs;
    if (!st) return '';
    const val = x => v ? ' = ' + a.fmt.sig(x, 3) + ' ' + 'kJ·kg' + S.sup('−1') : '';
    if (a.tab === 0) {
      return [null,
        'Compresseur, adiabatique : ' + sy(S, 'w', 'u') + ' = ' + hs(S, 'B') + ' − ' + hs(S, 'A') + val(c.w),
        'Condenseur, isobare : ' + sy(S, 'q', 'c') + ' = ' + hs(S, 'C') + ' − ' + hs(S, 'B') + val(c.qc),
        'Détendeur, adiabatique : ' + hs(S, 'D') + ' = ' + hs(S, 'C') + (v ? ' ; titre ' + sy(S, 'x', 'D') + ' = ' + a.fmt.fix(c.D.x, 2) : ''),
        'Évaporateur, isobare : ' + sy(S, 'q', 'f') + ' = ' + hs(S, 'A') + ' − ' + hs(S, 'D') + val(c.qf)][st];
    }
    return [null,
      'Compresseur : irréversible, ' + ss(S, 'B') + ' > ' + ss(S, 'A') + (v ? ' ; ' + ss(S, 'cr') + ' = ' + a.fmt.sig(c.scr.comp * 1e3, 3) + ' J·K' + S.sup('−1') + '·kg' + S.sup('−1') : ''),
      'Condenseur : ' + sy(S, 'q', 'c') + ' = ' + hs(S, 'C') + ' − ' + hs(S, 'B') + ' = ' + S.r('∫') + 'T ds, aire sous B → C comptée négativement' + (v ? ' (' + a.fmt.sig(c.qc, 3) + ')' : ''),
      'Détendeur : ' + hs(S, 'C') + ' = ' + hs(S, 'D') + ', irréversible : ' + ss(S, 'D') + ' > ' + ss(S, 'C'),
      'Évaporateur : ' + sy(S, 'q', 'f') + ' = ' + hs(S, 'A') + ' − ' + hs(S, 'D') + ' = ' + S.r('∫') + 'T ds, aire sous D → A' + (v ? ' (' + a.fmt.sig(c.qf, 3) + ')' : '')][st];
  }

  function notes(a, c, G) {
    const S = a.S, C = a.C, k = a.k, p = a.p;
    let out = '', y = G.y0 + 15 * k;
    const text = statement(a, c);
    if (text) {out += S.text(G.x0 + 10 * k, y, text, {c: C.ink, size: 13.5, weight: 600}); y += 18 * k;}
    const lines = [];
    if (lim.Tev) lines.push(S.v('T', 'évap') + ' ≤ ' + S.v('T', 'f') + ' − 1 K : l’air doit rester plus chaud que le fluide');
    if (lim.sh) lines.push('surchauffe limitée : ' + S.v('T', 'A') + ' ≤ ' + S.v('T', 'f'));
    if (lim.Tco) lines.push(S.v('T', 'cond') + ' ≥ ' + S.v('T', 'c') + ' + 1 K : l’eau doit rester plus froide que le fluide');
    if (lim.sc) lines.push('sous-refroidissement limité : ' + S.v('T', 'C') + ' ≥ ' + S.v('T', 'c'));
    if (lim.TB) lines.push(S.v('T', 'B') + ' ≥ ' + S.v('T', 'B,is') + ' : une compression ne peut pas créer d’entropie négative');
    for (const l of lines) {out += S.text(G.x0 + G.w - 10 * k, y, l, {anchor: 'end', c: C.hot, size: 13}); y += 17 * k;}
    if (p.isen) out += S.text(G.x0 + G.w - 10 * k, y, 'compression isentropique : ' + S.v('T', 'B') + ' = ' + S.v('T', 'B,is'), {anchor: 'end', c: C.ink2, size: 13});
    return out;
  }

  /* ---------------- cotes horizontales (tab 0) ---------------- */
  function cote(a, o) {
    const S = a.S, k = a.k, C = a.C;
    const {x1, x2, y, label, col, op, valText} = o;
    let svg = `<g opacity="${op}">`;
    svg += S.arrow(x1, y, x2, y, {c: col, w: 2.2, head: 10});
    svg += S.line(x1, y - 6 * k, x1, y + 6 * k, {c: col, w: 2});
    const xm = (x1 + x2) / 2;
    svg += S.text(xm, y - 11 * k, label + (valText ? ' = ' + valText : ''), {anchor: 'middle', c: col === C.v || col === C.hot || col === C.cold ? C.ink : C.ink, size: 13.5, weight: 650});
    return svg + '</g>';
  }

  /* ---------------- onglet 1 : diagramme (P,h) ---------------- */
  function drawPH(a, c) {
    const {S, C, k} = a, P = a.panels.scene, W = P.w, H = P.h, p = a.p, F = fam(), f = a.fmt, st = p.etape;
    const G = S.graph({x: 0, y: 0, w: W, h: H, xmin: TH.phx[0], xmax: TH.phx[1], ymin: lg(TH.phy[0]), ymax: lg(TH.phy[1]),
      xticks: [200, 300, 400, 500, 600, 700, 800], yticks: [1, 2, 5, 10, 20, 40].map(lg), yfmt: v => String(+(10 ** v).toPrecision(2)), zeroAxis: false,
      xlab: 'h (kJ·kg' + S.sup('−1') + ')', ylab: 'P (bar), échelle logarithmique'});
    const X = h => G.X(h), Y = pr => G.Y(lg(pr)), pt = z => [X(z[0]), Y(z[1])];
    let s = S.clip('th1pac-ph', G) + G.svg + '<g clip-path="url(#th1pac-ph)">';
    // courbe de saturation
    s += S.poly([...F.left.map(pt), ...F.right.slice().reverse().map(pt)], {fill: C.cSoft, fop: .35, c: C.ink2, w: 2.2});
    // familles de courbes, masquées au départ
    if (p.famX) for (const q of F.isoX) {s += S.poly(q.pts.map(pt), {c: C.E, w: 1.1, dash: `${3 * k} ${4 * k}`}); const z = q.pts[0]; s += S.text(X(z[0]) + 5 * k, Y(1.18), f.fix(q.x, 1), {anchor: 'start', size: 12, c: C.E});}
    if (p.famT) for (const q of F.isoT) {s += S.poly(q.pts.map(pt), {c: C.cold, w: 1.2, dash: `${6 * k} ${4 * k}`}); const z = q.pts[0]; s += S.text(X(z[0]) + 4 * k, Y(36), f.fix(q.T, 0) + ' °C', {anchor: 'start', size: 12, c: C.cold});}
    if (p.famS) for (const q of F.isoS) {if (q.pts.length < 2) continue; s += S.poly(q.pts.map(pt), {c: C.v, w: 1.1, dash: `${2 * k} ${4 * k}`}); const z = q.pts[q.pts.length - 1]; s += S.text(X(z[0]) - 4 * k, Y(z[1]) + 10 * k, f.fix(q.s, 1), {anchor: 'end', size: 12, c: C.v});}
    s += S.text(X(165), Y(2.2), 'Liquide', {size: 13, c: C.ink2}) + S.text(X(500), Y(29), 'Liquide + vapeur', {anchor: 'middle', size: 13, c: C.ink2}) + S.text(X(775), Y(27), 'Vapeur', {anchor: 'middle', size: 13, c: C.ink2});
    // entropie créée : isentropes des quatre états, et compression isentropique de référence
    const showIs = p.entropie || st === 1;
    if (p.entropie) {
      const draw = (z, name) => {
        const pts = []; const P0 = name === 'C' || name === 'D' ? R.PMIN * 1.02 : c.Pev * .5, P1 = name === 'C' || name === 'D' ? c.Pco * 1.6 : c.Pco * 1.5;
        for (let i = 0; i <= 50; i++) {const Pp = P0 * (P1 / P0) ** (i / 50); pts.push([R.hPS(Pp, z.s), Pp]);}
        return S.poly(pts.filter(q => q[0] >= TH.phx[0] - 40 && q[0] <= TH.phx[1] + 80).map(pt), {c: C.ink2, w: 1.3, dash: `${8 * k} ${3 * k} ${2 * k} ${3 * k}`});
      };
      s += draw(c.A, 'A') + draw(c.B, 'B') + draw(c.C, 'C') + draw(c.D, 'D');
    } else if (st === 1) {
      const pts = []; for (let i = 0; i <= 40; i++) {const Pp = c.Pev * (c.Pco / c.Pev) ** (i / 40); pts.push([R.hPS(Pp, c.A.s), Pp]);}
      s += S.poly(pts.map(pt), {c: C.ink2, w: 1.5, dash: `${8 * k} ${3 * k} ${2 * k} ${3 * k}`});
    }
    // cycle
    const A = pt([c.A.h, c.A.P]), B = pt([c.B.h, c.B.P]), Cc = pt([c.C.h, c.C.P]), D = pt([c.D.h, c.D.P]);
    const seg = (i, p0, p1, dash) => {
      const g = segStyle(a, i), mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2, L = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]) || 1;
      const ux = (p1[0] - p0[0]) / L, uy = (p1[1] - p0[1]) / L;
      return `<g opacity="${g.op}">` + S.line(p0[0], p0[1], p1[0], p1[1], {c: g.c, w: g.w, dash, cap: 'butt'}) +
        (L > 30 * k ? S.arrow(mx - ux * 7 * k, my - uy * 7 * k, mx + ux * 7 * k, my + uy * 7 * k, {c: g.c, w: g.w, head: 11}) : '') + '</g>';
    };
    s += seg(1, A, B, `${9 * k} ${6 * k}`) + seg(2, B, Cc) + seg(3, Cc, D) + seg(4, D, A);
    if (showIs) {
      const Bi = pt([c.Bis.h, c.Bis.P]);
      s += S.circle(Bi[0], Bi[1], 4.5 * k, {fill: C.card, c: C.ink, w: 2}) + S.text(Bi[0] - 6 * k, Bi[1] - 12 * k, S.v('B', 'is'), {anchor: 'end', size: 14, c: C.ink, weight: 650});
    }
    // états
    const dot = (z, name, dx, dy, an) => S.circle(z[0], z[1], 5 * k, {fill: C.ink, c: C.card, w: 1.5}) + S.text(z[0] + dx * k, z[1] + dy * k, name, {anchor: an, size: 15, weight: 700, c: C.ink});
    s += dot(A, 'A', 9, 15, 'start') + dot(B, 'B', 9, -12, 'start') + dot(Cc, 'C', -9, -12, 'end') + dot(D, 'D', -9, 15, 'end');
    // pressions
    if (p.valeurs) {
      s += S.text(G.x0 + 8 * k, Y(c.Pco) - 9 * k, S.v('P', 'cond') + ' = ' + f.sig(c.Pco, 3) + ' bar', {size: 13, c: C.hot, weight: 600});
      s += S.text(G.x0 + 8 * k, Y(c.Pev) + 14 * k, S.v('P', 'évap') + ' = ' + f.sig(c.Pev, 3) + ' bar', {size: 13, c: C.cold, weight: 600});
    }
    // cotes horizontales : travail et transferts thermiques se lisent comme des longueurs
    const yb = G.y0 + G.h - 15 * k, rows = [yb - 64 * k, yb - 32 * k, yb];
    const vt = x => p.valeurs ? f.sig(x, 3) + ' kJ·kg' + S.sup('−1') : '';
    const op = i => (st === 0 || st === i ? 1 : .22);
    const guide = (xh, y0, y1) => S.line(X(xh), y0, X(xh), y1 + 7 * k, {c: C.ink2, w: 1.1, dash: `${2 * k} ${4 * k}`, op: .7});
    s += guide(c.A.h, A[1], rows[2]) + guide(c.B.h, B[1], rows[1]) + guide(c.C.h, D[1], rows[2]);
    s += cote(a, {x1: X(c.A.h), x2: X(c.B.h), y: rows[0], label: sy(S, 'w', 'u'), col: C.v, op: op(1), valText: vt(c.w)});
    s += cote(a, {x1: X(c.B.h), x2: X(c.C.h), y: rows[1], label: sy(S, 'q', 'c'), col: C.hot, op: op(2), valText: vt(c.qc)});
    s += cote(a, {x1: X(c.D.h), x2: X(c.A.h), y: rows[2], label: sy(S, 'q', 'f'), col: C.cold, op: op(4), valText: vt(c.qf)});
    if (st === 3) s += S.text(X(c.C.h) + 10 * k, (Cc[1] + D[1]) / 2, 'Δh = 0', {size: 13.5, c: C.E, weight: 650});
    s += '</g>' + notes(a, c, G);
    a.svg('scene', s);
    view = {tab: 0, G, c, X, Y};
    a.legend([{c: C.v, label: 'Compresseur A → B', dash: true}, {c: C.hot, label: 'Condenseur B → C'}, {c: C.E, label: 'Détendeur C → D'}, {c: C.cold, label: 'Évaporateur D → A'},
      showIs ? {c: C.ink2, label: 'isentropes', dash: true} : null]);
  }

  /* ---------------- chemins des isobares dans le diagramme (T,s) ---------------- */
  function pathBC(c, n = 30) {
    const out = [];
    for (let i = 0; i < n; i++) {const T = c.B.T + (c.co.T - c.B.T) * i / n; out.push([R.vap(c.Pco, T).s, T + K]);}
    out[0][0] = c.B.s;
    out.push([c.co.sv, c.co.T + K], [c.co.sl, c.co.T + K]);
    for (let i = 1; i <= n; i++) {const T = c.co.T + (c.C.T - c.co.T) * i / n; out.push([R.liq(c.Pco, T).s, T + K]);}
    out[out.length - 1][0] = c.C.s;
    return out;
  }
  function pathDA(c, n = 30) {
    const out = [[c.D.s, c.ev.T + K], [c.ev.sv, c.ev.T + K]];
    for (let i = 1; i <= n; i++) {const T = c.ev.T + (c.A.T - c.ev.T) * i / n; out.push([R.vap(c.Pev, T).s, T + K]);}
    out[out.length - 1][0] = c.A.s;
    return out;
  }

  /* ---------------- onglet 2 : diagramme (T,s) ---------------- */
  function drawTS(a, c) {
    const {S, C, k} = a, P = a.panels.scene, W = P.w, H = P.h, p = a.p, F = fam(), f = a.fmt, st = p.etape;
    const G = S.graph({x: 0, y: 0, w: W, h: H, xmin: TH.tsx[0], xmax: TH.tsx[1], ymin: TH.tsy[0], ymax: TH.tsy[1], xticks: [.5, 1, 1.5, 2, 2.5, 3], yticks: [0, 100, 200, 300, 400],
      xlab: 's (kJ·K' + S.sup('−1') + '·kg' + S.sup('−1') + ')', ylab: 'T (K)'});
    const X = v => G.X(v), Y = v => G.Y(v), pt = z => [X(z[0]), Y(z[1])];
    const bc = pathBC(c), da = pathDA(c);
    const id = 'th1pac-ts';
    let s = S.clip(id, G) + G.svg;
    s += `<defs><pattern id="th1pac-hh" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="${C.hot}" fill-opacity=".12"/><line x1="0" y1="0" x2="0" y2="8" stroke="${C.hot}" stroke-opacity=".55" stroke-width="2"/></pattern>` +
      `<pattern id="th1pac-hc" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="8" height="8" fill="${C.card}"/><rect width="8" height="8" fill="${C.cold}" fill-opacity=".22"/><line x1="0" y1="0" x2="0" y2="8" stroke="${C.cold}" stroke-opacity=".7" stroke-width="2"/></pattern></defs>`;
    s += `<g clip-path="url(#${id})">`;
    s += S.poly([...F.leftTs.map(pt), ...F.rightTs.slice().reverse().map(pt)], {fill: C.cSoft, fop: .35, c: C.ink2, w: 2.2});
    s += S.text(X(.85), Y(335), 'Liquide', {size: 13, c: C.ink2}) + S.text(X(2.05), Y(347), 'Liquide + vapeur', {anchor: 'middle', size: 13, c: C.ink2}) + S.text(X(2.8), Y(330), 'Vapeur', {anchor: 'middle', size: 13, c: C.ink2});
    // aires sous les isobares : q_c et q_f
    const base = Y(0), area = (path) => S.path('M' + path.map(q => X(q[0]).toFixed(1) + ',' + Y(q[1]).toFixed(1)).join('L') + `L${X(path[path.length - 1][0]).toFixed(1)},${base.toFixed(1)}L${X(path[0][0]).toFixed(1)},${base.toFixed(1)}Z`, {fill: 'url(#th1pac-hh)', c: 'none'});
    const areaC = path => S.path('M' + path.map(q => X(q[0]).toFixed(1) + ',' + Y(q[1]).toFixed(1)).join('L') + `L${X(path[path.length - 1][0]).toFixed(1)},${base.toFixed(1)}L${X(path[0][0]).toFixed(1)},${base.toFixed(1)}Z`, {fill: 'url(#th1pac-hc)', c: 'none'});
    const dim = i => (st === 0 || st === i ? 1 : .2);
    s += `<g opacity="${dim(2)}">${area(bc)}</g><g opacity="${dim(4)}">${areaC(da)}</g>`;
    // travail : zone entre les deux isobares
    if (st === 0 || st === 1) s += S.text(X((c.D.s + c.A.s) / 2), Y((c.ev.T + c.co.T) / 2 + K), sy(S, 'w', 'u') + ' = |' + sy(S, 'q', 'c') + '| − ' + sy(S, 'q', 'f'), {anchor: 'middle', size: 14, c: C.ink, weight: 650});
    s += S.text(X((c.D.s + c.A.s) / 2), Y(.55 * (c.ev.T + K)), sy(S, 'q', 'f'), {anchor: 'middle', size: 14, c: C.ink, weight: 650});
    // chemins
    const stl = i => segStyle(a, i);
    const g2 = stl(2), g4 = stl(4), g1 = stl(1), g3 = stl(3);
    s += `<g opacity="${g2.op}">` + S.poly(bc.map(pt), {c: g2.c, w: g2.w}) + '</g>' + `<g opacity="${g4.op}">` + S.poly(da.map(pt), {c: g4.c, w: g4.w}) + '</g>';
    const TA = c.A.T + K, TB = c.B.T + K, TCc = c.C.T + K, TD = c.D.T + K;
    s += `<g opacity="${g1.op}">` + S.line(X(c.A.s), Y(TA), X(c.B.s), Y(TB), {c: g1.c, w: g1.w, dash: `${9 * k} ${6 * k}`, cap: 'butt'}) + '</g>';
    s += `<g opacity="${g3.op}">` + S.line(X(c.C.s), Y(TCc), X(c.D.s), Y(TD), {c: g3.c, w: g3.w, dash: `${9 * k} ${6 * k}`, cap: 'butt'}) + '</g>';
    // compression isentropique de référence
    const showIs = p.entropie || st === 1;
    if (showIs) {
      s += S.line(X(c.A.s), Y(TA), X(c.A.s), Y(c.Bis.T + K), {c: C.ink2, w: 1.5, dash: `${8 * k} ${3 * k} ${2 * k} ${3 * k}`});
      s += S.circle(X(c.A.s), Y(c.Bis.T + K), 4.5 * k, {fill: C.card, c: C.ink, w: 2}) + S.text(X(c.A.s) - 8 * k, Y(c.Bis.T + K) - 11 * k, S.v('B', 'is'), {anchor: 'end', size: 14, c: C.ink, weight: 650});
    }
    // états
    const dot = (sv, T, name, dx, dy, an) => S.circle(X(sv), Y(T), 5 * k, {fill: C.ink, c: C.card, w: 1.5}) + S.text(X(sv) + dx * k, Y(T) + dy * k, name, {anchor: an, size: 15, weight: 700, c: C.ink});
    s += dot(c.A.s, TA, 'A', 9, 15, 'start') + dot(c.B.s, TB, 'B', 9, -11, 'start') + dot(c.C.s, TCc, 'C', -9, -11, 'end') + dot(c.D.s, TD, 'D', -9, 15, 'end');
    // entropie créée : bandes de hauteur T_f dont la largeur est s_cr de chaque organe
    if (p.entropie) {
      const Tf = p.Tair + K, parts = [['comp', C.v, 1], ['det', C.E, 3], ['cond', C.hot, 2], ['evap', C.cold, 4]];
      let x = TH.tsx[0] + .06;
      for (const [key, col, num] of parts) {
        const wv = c.scr[key];
        s += S.rect(X(x), Y(Tf), Math.max(1, X(x + wv) - X(x)), Y(0) - Y(Tf), {fill: col, fop: .55, c: col, w: 1.4, op: dim(num)});
        x += wv;
      }
      s += S.line(X(TH.tsx[0] + .06), Y(Tf), X(x), Y(Tf), {c: C.ink, w: 1.5});
      s += S.text(X(TH.tsx[0] + .06), Y(Tf) - 12 * k, S.v('T', 'f') + ' ' + S.r('Σ') + ' ' + S.v('s', 'cr') + ' = ' + sy(S, 'w', 'u') + ' − ' + sy(S, 'w', 'Carnot'), {size: 13.5, c: C.ink, weight: 650});
    }
    s += '</g>' + notes(a, c, G);
    a.svg('scene', s);
    view = {tab: 1, G, c, X, Y};
    const vH = x => (p.valeurs ? ' = ' + f.sig(x, 3) + ' ' + UNIT_H : '');
    a.legend([{c: C.hot, label: 'aire sous B → C : |' + M.v('q', 'c') + '|' + vH(-c.qc), dash: true}, {c: C.cold, label: 'aire sous D → A : ' + M.v('q', 'f') + vH(c.qf), dash: true},
      {c: C.v, label: 'compression A → B', dash: true}, {c: C.E, label: 'détente C → D', dash: true},
      p.entropie ? {c: C.ink2, label: 'bandes : ' + M.v('T', 'f') + ' × ' + M.v('s', 'cr') + ' de chaque organe'} : null]);
  }

  /* ---------------- mesures ---------------- */
  function metrics(a, c) {
    const p = a.p, st = p.etape, f = a.fmt, v = M.v, out = [];
    if (p.valeurs) {
      if (st === 0 || st === 1) out.push({label: v('w', 'u'), value: f.sig(c.w, 3), unit: UNIT_H, hint: v('h', 'B') + ' − ' + v('h', 'A')});
      if (st === 0 || st === 2) out.push({label: v('q', 'c'), value: f.sig(c.qc, 3), unit: UNIT_H, hint: v('h', 'C') + ' − ' + v('h', 'B')});
      if (st === 0 || st === 4) out.push({label: v('q', 'f'), value: f.sig(c.qf, 3), unit: UNIT_H, hint: v('h', 'A') + ' − ' + v('h', 'D')});
      if (st === 0 || st === 3) out.push({label: v('x', 'D'), value: f.fix(c.D.x, 2), hint: 'titre en vapeur à la sortie du détendeur'});
      if (st === 0) out.push({label: v('e', 'PAC'), value: f.sig(c.e, 3), hint: M.frac('−' + v('q', 'c'), v('w', 'u'))});
    }
    if (p.valeurs && p.carnot) {
      out.push({label: v('e', 'Carnot'), value: f.sig(c.eCarnot, 3), hint: M.frac(v('T', 'c'), v('T', 'c') + ' − ' + v('T', 'f'))});
      if (st === 0) out.push({label: v('e', 'PAC') + ' / ' + v('e', 'Carnot'), value: f.fix(100 * c.e / c.eCarnot, 0), unit: '%', hint: 'part de la borne atteinte'});
    }
    if (p.entropie) {
      const sc = c.scr, t = x => f.sig(Math.abs(x) < 1e-9 ? 0 : x * 1e3, 3);
      if (st === 0 || st === 1) out.push({label: v('s', 'cr') + ', compresseur', value: t(sc.comp), unit: UNIT_S, hint: v('s', 'B') + ' − ' + v('s', 'A')});
      if (st === 0 || st === 3) out.push({label: v('s', 'cr') + ', détendeur', value: t(sc.det), unit: UNIT_S, hint: v('s', 'D') + ' − ' + v('s', 'C')});
      if (st === 0 || st === 2) out.push({label: v('s', 'cr') + ', condenseur', value: t(sc.cond), unit: UNIT_S, hint: 'Δs − ' + v('q', 'c') + ' / ' + v('T', 'c')});
      if (st === 0 || st === 4) out.push({label: v('s', 'cr') + ', évaporateur', value: t(sc.evap), unit: UNIT_S, hint: 'Δs − ' + v('q', 'f') + ' / ' + v('T', 'f')});
      if (st === 0) out.push({label: v('T', 'f') + ' Σ ' + v('s', 'cr'), value: f.sig(c.extra, 3), unit: UNIT_H, hint: v('w', 'u') + ' − ' + v('w', 'Carnot') + ', avec ' + v('w', 'Carnot') + ' = ' + f.sig(c.wrev, 3)});
      if (st === 1) out.push({label: v('T', 'B,is'), value: f.fix(c.TBis, 1), unit: '°C', hint: v('w', 'is') + ' = ' + f.sig(c.wis, 3) + ' ' + UNIT_H + ' · ' + v('η', 'is') + ' = ' + f.fix(c.wis / c.w, 2)});
    }
    return out;
  }

  /* ---------------- glisser-déposer : isobares et point B ---------------- */
  function target(a, x, y) {
    if (!view || view.tab !== a.tab) return null;
    const {G, c, X, Y} = view, k = a.k, near = (v, w, d) => Math.abs(v - w) < d * k;
    if (a.tab === 0) {
      if (Math.hypot(x - X(c.B.h), y - Y(c.B.P)) < 16 * k) return 'B';
      if (near(y, Y(c.Pco), 8) && x >= X(c.C.h) - 6 * k && x <= X(c.B.h) + 6 * k) return 'co';
      if (near(y, Y(c.Pev), 8) && x >= X(c.D.h) - 6 * k && x <= X(c.A.h) + 6 * k) return 'ev';
      return null;
    }
    if (Math.hypot(x - X(c.B.s), y - Y(c.B.T + K)) < 16 * k) return 'B';
    if (near(y, Y(c.co.T + K), 8) && x >= X(c.co.sl) && x <= X(c.co.sv)) return 'co';
    if (near(y, Y(c.ev.T + K), 8) && x >= X(c.D.s) && x <= X(c.ev.sv)) return 'ev';
    return null;
  }
  let dragging = null;
  function moveTo(a, x, y) {
    if (!dragging || !view) return;
    const {G, c} = view;
    let T;
    if (a.tab === 0) {
      if (dragging === 'B') {const h = G.xv(x); T = R.TvapPH(c.Pco, clamp(h, c.Bis.h, 900));}
      else T = R.Tsat(10 ** G.yv(y));
    } else T = G.yv(y) - K;
    if (dragging === 'B') a.set('TB', clamp(Math.round(T * 2) / 2, LIM.TB[0], LIM.TB[1]));
    else if (dragging === 'co') a.set('Tco', clamp(Math.round(T), LIM.Tco[0], LIM.Tco[1]));
    else a.set('Tev', clamp(Math.round(T), LIM.Tev[0], LIM.Tev[1]));
  }

  /* ---------------- application ---------------- */
  const range = (id, label, step, unit, extra = {}) => ({id, label, min: LIM[id][0], max: LIM[id][1], step, value: DEF[id], unit, ...extra});
  const preset = (label, valeurs, titre) => ({label, valeurs: {...DEF, isen: false, ...valeurs}, titre});

  AnimKit.app({
    code: 'TH1', partie: 'OrangeBrule', titre: 'Cycle d’une pompe à chaleur',
    titreFenetre: 'Cycle d’une pompe à chaleur au R290 · TH1 · MP',
    menuCommun: true, fichier: 'Cycle_PAC',
    onglets: ['Diagramme (P,h)', 'Diagramme (T,s)'],
    panneaux: [{id: 'scene', titre: '', poids: 1, ratioTel: 1.15}],
    temps: false,
    touches: {
      arrowright(a) {a.set('etape', (a.p.etape + 1) % 5);},
      arrowleft(a) {a.set('etape', (a.p.etape + 4) % 5);}
    },
    reglages: [
      {titre: 'Situations', presets: [
        preset('Cycle du cours', {}, 'Évaporation à −5 °C, condensation à 45 °C, surchauffe et sous-refroidissement de 5 K, T_B = 75 °C'),
        preset('Plancher chauffant', {Tco: 35, sh: 0, sc: 0, Teau: 30, isen: true}, 'Application 4 : condensation à 35 °C, eau à 30 °C, compression isentropique'),
        preset('Radiateurs', {Tco: 50, sh: 0, sc: 0, Teau: 45, isen: true}, 'Application 4 : condensation à 50 °C, eau à 45 °C, compression isentropique'),
        preset('Froid extérieur', {Tev: -15, Tair: -7, TB: 85}, 'Air à −7 °C, évaporation à −15 °C, T_B = 85 °C'),
        preset('Compression isentropique', {isen: true}, 'Cycle du cours avec une compression isentropique')
      ]},
      {titre: 'Parcours du fluide', items: [
        {id: 'etape', type: 'seg', label: 'Organe : compresseur, condenseur, détendeur, évaporateur (touches ← →)', options: [[0, 'Cycle'], [1, 'Compr.'], [2, 'Cond.'], [3, 'Détend.'], [4, 'Évap.']], value: 0}
      ]},
      {titre: 'Fluide frigorigène', items: [
        range('Tev', `Évaporation ${M.v('T', 'évap')}`, 1, '°C'),
        range('sh', 'Surchauffe en sortie d’évaporateur', 1, 'K'),
        range('Tco', `Condensation ${M.v('T', 'cond')}`, 1, '°C'),
        range('sc', 'Sous-refroidissement en sortie de condenseur', 1, 'K'),
        {id: 'isen', type: 'check', label: `Compression isentropique (${M.v('T', 'B')} = ${M.v('T', 'B,is')})`, value: false},
        range('TB', `Refoulement ${M.v('T', 'B')}`, .5, '°C', {dec: 1, si: a => !a.p.isen})
      ]},
      {titre: 'Sources', items: [
        range('Tair', `Air extérieur ${M.v('T', 'f')}`, 1, '°C'),
        range('Teau', `Eau de chauffage ${M.v('T', 'c')}`, 1, '°C')
      ]},
      {titre: 'Affichage', items: [
        {id: 'valeurs', type: 'check', label: 'Afficher les valeurs lues, ' + M.v('e', 'PAC'), value: false},
        {id: 'carnot', type: 'check', label: 'Comparer à la borne de Carnot', value: false, si: a => a.p.valeurs},
        {id: 'entropie', type: 'check', label: 'Entropie créée par organe', value: false},
        {id: 'famT', type: 'check', label: 'Isothermes', value: false, onglets: [0]},
        {id: 'famS', type: 'check', label: 'Isentropes (kJ·K⁻¹·kg⁻¹)', value: false, onglets: [0]},
        {id: 'famX', type: 'check', label: 'Courbes d’isotitre', value: false, onglets: [0]}
      ]}
    ],
    aide: {
      voit: `<p>Le cycle d’une pompe à chaleur air-eau au propane R290, avec les états A (entrée du compresseur), B, C et D du cours. Les couleurs distinguent les organes : compresseur, condenseur, détendeur, évaporateur.</p><ul><li><b>Diagramme (P,h).</b> Pression en échelle logarithmique. Le travail utile et les transferts thermiques se lisent comme des <b>longueurs horizontales</b> : les cotes en bas du diagramme.</li><li><b>Diagramme (T,s).</b> Les aires sous les isobares B → C et D → A sont |q<sub>c</sub>| et q<sub>f</sub> (dh = T ds à P constante) ; la zone entre les deux est w<sub>u</sub>. L’aire du cycle n’est pas w<sub>u</sub> : la compression et la détente, irréversibles, sont tracées en tirets entre leurs états extrêmes.</li></ul>`,
      faire: `<ul><li>Lire w<sub>u</sub>, q<sub>c</sub> et q<sub>f</sub> sur le diagramme et calculer e<sub>PAC</sub> avant de cocher « Afficher les valeurs lues ».</li><li>Glisser les deux isobares (haute et basse) ou le point B, ou utiliser les réglages. Les situations « Plancher chauffant » et « Radiateurs » reproduisent l’application 4 du cours.</li><li>Parcourir le cycle organe par organe avec les touches ← → : le premier principe appliqué à chaque organe donne une seule longueur à lire.</li><li>Cocher « Entropie créée par organe » : les isentropes des quatre états montrent que la compression et la détente créent de l’entropie. Dans le diagramme (T,s), les bandes de hauteur T<sub>f</sub> ont pour largeur l’entropie massique créée dans chaque organe : leur aire totale est le travail dépensé en plus de celui d’une machine réversible.</li><li>Cocher « Comparer à la borne de Carnot » : la température de l’eau et celle de l’air, pas celles du fluide, fixent e<sub>Carnot</sub>.</li></ul>`,
      modele: `<p>Régime stationnaire, grandeurs massiques ; variations d’énergie mécanique négligées. Compresseur adiabatique, échangeurs isobares sans perte de charge, détendeur adiabatique et isenthalpique. La température de refoulement T<sub>B</sub> ne peut pas être inférieure à T<sub>B,is</sub>, celle d’une compression isentropique. Le fluide se refroidit dans le condenseur jusqu’à T<sub>C</sub> = T<sub>cond</sub> − sous-refroidissement, qui reste supérieure à la température T<sub>c</sub> de l’eau ; il s’évapore à T<sub>évap</sub> et sort en A à T<sub>évap</sub> + surchauffe, qui reste inférieure à celle de l’air T<sub>f</sub>. Les entropies créées valent s<sub>cr</sub> = s<sub>B</sub> − s<sub>A</sub> (compresseur), s<sub>D</sub> − s<sub>C</sub> (détendeur), Δs − q/T<sub>source</sub> pour chaque échangeur (T<sub>c</sub> pour le condenseur, T<sub>f</sub> pour l’évaporateur), et w<sub>u</sub> − w<sub>Carnot</sub> = T<sub>f</sub> Σ s<sub>cr</sub>. Les propriétés du propane viennent de tables CoolProp (modèle HEOS) interpolées ; l’état de référence est celui de CoolProp, comme dans les diagrammes du cours. Domaine : T<sub>cond</sub> ≤ 60 °C (21 bar environ), loin du point critique (96.7 °C ; 42.5 bar).</p>`,
      cours: 'TH1 MP, III.3 « Diagrammes d’un fluide réel », III.4 « Pompe à chaleur air-eau » et application 4 « Plancher chauffant ou radiateurs ».',
      plus: `<ul><li>Cycle du cours : w<sub>u</sub> = 108 kJ·kg⁻¹, q<sub>c</sub> = −379 kJ·kg⁻¹, q<sub>f</sub> = 271 kJ·kg⁻¹, e<sub>PAC</sub> = 3.51 pour e<sub>Carnot</sub> = 9.49 ; le compresseur crée plus de la moitié de l’entropie.</li><li>Un condenseur plus froid (plancher chauffant) demande un rapport de compression plus faible, donc moins de travail : e<sub>PAC</sub> passe de 4.4 à 6.4 en compression isentropique.</li></ul>`,
      credits: 'Propriétés du propane R290 : CoolProp 8.0.0 (modèle HEOS), tables préparées localement (preparer_r290.py) ; interpolation contrôlée par Verifier_PAC.cjs.'
    },
    init(a) {
      a.drag('scene', {
        hit: (x, y) => !!target(a, x, y),
        start: (x, y) => {dragging = target(a, x, y); if (dragging === 'B' && a.p.isen) a.set('isen', false, {silent: true}); moveTo(a, x, y);},
        move: (x, y) => moveTo(a, x, y),
        end: () => {dragging = null;}
      });
    },
    draw(a) {
      const c = cyc(a);
      if (a.tab === 0) drawPH(a, c); else drawTS(a, c);
      a.metrics(metrics(a, c));
    }
  });
})();

</script>
