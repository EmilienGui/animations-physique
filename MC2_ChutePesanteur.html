/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e<-3||e>=6){const m=x/10**e;return (+m.toFixed(n-1)).toFixed(n-1).replace('-',MINUS)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>'}
    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));

};

  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;

}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);

      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});

      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});

  function guardScroll(){if(side.scrollTop===0&&sideTop>0&&performance.now()-userAt>400)side.scrollTop=sideTop}
  const setH=(e,v)=>{if(e.hidden!==v)e.hidden=v};
  const setHTML=(e,v)=>{if(e._h!==v){e.innerHTML=v;e._h=v}};
  function refreshSettings(){
    const st=side.scrollTop; let num=0;
    for(const g of groups){const v=vis(g.gc);setH(g.el,!v);if(v){num++;const t=String(num).padStart(2,'0');if(g.h.firstChild.textContent!==t)g.h.firstChild.textContent=t}
      for(const ps of g.gc.presets||[])setH(ps._btn,!vis(ps));
      for(const it of g.gc.items||[])if(it._box){setH(it._box,!vis(it));if(it.type==='note'&&typeof it.html==='function')setHTML(it._box.firstChild,it.html(A))}}
    for(const id in items){const I=items[id];if(I._last!==A.p[id]){I.show(A.p[id]);I._last=A.p[id]}}
    for(const P of Object.values(A.panels))setH(P.el,!vis(P.cfg));
    const showT=typeof cfg.temps==='function'?cfg.temps(A):!!cfg.temps; setH(tr,!showT); if(!showT&&A.running)A.play(false);
    if(side.scrollTop!==st)side.scrollTop=st;
    requestAnimationFrame(()=>{if(side.scrollTop===0&&st>0)side.scrollTop=st});
  }
  A.refresh=refreshSettings;
  A.set=(id,v,{silent=false}={})=>{A.p[id]=v;if(items[id]){items[id].show(v);items[id]._last=v}if(!silent&&cfg.change)cfg.change(A,id,v);refreshSettings();A.render()};
  A.preset=ps=>{
    A.play(false);A.cadrerTout();
    for(const[k,v]of Object.entries(ps.valeurs||{})){A.p[k]=v;if(cfg.change)cfg.change(A,k,v)}
    clearActivePresets();
    if(ps._btn){ps._btn.classList.add('is-active');ps._btn.setAttribute('aria-pressed','true')}
    refreshSettings();A.reset();if(ps.action)ps.action(A);if(ps.lecture)A.play(true);A.render();
  };
  A.enable=(id,on)=>{const b=document.getElementById('b_'+id);if(b)b.disabled=!on};

  /* ---------- affichages ---------- */
  const metricsCount=$('.ak-metrics-count',metricsWrap);
  A.metrics=arr=>{
    const L=(arr||[]).filter(Boolean),hh=L.some(m=>m.hint);
    metrics.classList.toggle('has-h',hh);
    metricsWrap.classList.toggle('has-items',L.length>0);
    ak.classList.toggle('ak-has-metrics',L.length>0);
    if(metricsCount.textContent!==String(L.length))metricsCount.textContent=String(L.length);
    const html=L.map((m,i)=>`<div class="ak-metric${m.warn?' warn':''}${expandedMetrics.has(String(i))?' is-expanded':''}" data-idx="${i}" title="Cliquer pour développer / réduire"><div class="k">${m.label}</div><div class="v">${m.value}${m.unit?(m.unit==='°'?'°':`<span class="u">${m.unit}</span>`):''}</div>${m.hint?`<div class="h">${m.hint}</div>`:''}</div>`).join('');
    if(metrics._h!==html){metrics.innerHTML=html;metrics._h=html}
  };
  A.insight=()=>{};
  A.legend=arr=>{const html=(arr||[]).filter(Boolean).map(l=>`<span><i class="${l.dash?'dash':l.dot?'dot':''}" style="background:${l.c};--lc:${l.c}"></i>${l.label}</span>`).join('');if(legend._h!==html){legend.innerHTML=html;legend._h=html}};
  A.clock=html=>{const c=$('.ak-clock',tr);if(c._h!==html){c.innerHTML=html;c._h=html}};
  A.toast=m=>{toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastEl._h);toastEl._h=setTimeout(()=>toastEl.classList.remove('show'),1800)};
  A.panelVisible=id=>!A.panels[id].el.hidden;

  /* ---------- tailles ---------- */
  function viewBox(P){
    const {w,h,vx,vy,vz}=P;
    P.node.setAttribute('viewBox',P.vue==='svg'?`${vx.toFixed(2)} ${vy.toFixed(2)} ${(w/vz).toFixed(2)} ${(h/vz).toFixed(2)}`:`0 0 ${w.toFixed(1)} ${h.toFixed(1)}`);
  }
  function measure(){
    A.narrow=ak.clientWidth<=640; ak.style.setProperty('--ak-top',(top.offsetHeight+(tabs?tabs.offsetHeight:0))+'px');
    if(A.narrow){if(metricsWrap.parentNode!==right||right.lastElementChild!==metricsWrap)right.append(metricsWrap)}
    else{if(metricsWrap.parentNode!==right||right.firstElementChild!==metricsWrap)right.insertBefore(metricsWrap,side)}
    A.k=ak.classList.contains('is-proj')?1.6:A.narrow?1:1.15;
    for(const P of Object.values(A.panels)){
      if(P.el.hidden)continue;
      if(A.narrow){const w=P.el.clientWidth||ak.clientWidth;P.node.style.height=Math.round(w*(P.cfg.ratioTel??.8))+'px'}else P.node.style.height='';
      const r=P.node.getBoundingClientRect(); P.w=Math.max(50,r.width); P.h=Math.max(50,r.height);
      if(P.type==='canvas'){const d=window.devicePixelRatio||1;if(P.node.width!==Math.round(P.w*d)||P.node.height!==Math.round(P.h*d)){P.node.width=Math.round(P.w*d);P.node.height=Math.round(P.h*d)}P.ctx=P.node.getContext('2d');P.ctx.setTransform(d,0,0,d,0,0)}
      else viewBox(P);
    }
  }
  /* ---------- rendu ---------- */
  let graphPanels=[];
  const activeChartView=P=>P?.vue==='graphe'&&zoomed(P)?P:null;
  function drawFrame(){
    const frame={graphs:[],views:graphPanels.map(activeChartView),outputs:new Map()};
    A._graphFrame=frame;
    try{cfg.draw?.(A)}finally{A._graphFrame=null}
    graphPanels=[];
    for(const [P,output] of frame.outputs){
      const graphs=[...output.html.matchAll(/<g data-ak-graph="(\d+)">/g)].map(m=>frame.graphs[+m[1]]).filter(Boolean);
      output.graphs=graphs;
      if(P.vue==='svg'||P.vue==='graphe'){
        const vue=graphs.length?'graphe':'svg';
        if(vue!==P.vue){P.vue=vue;resetView(P);viewBox(P)}
        P.graphs=graphs;
      }
      const view=activeChartView(P);
      for(const graph of graphs){
        graphPanels[graph.id]=P;
        if(graph.view!==view)frame.changed=true;
      }
    }
    return frame;
  }
  function clipCharts(node,graphs){
    const svgElement=tag=>document.createElementNS(node.namespaceURI,tag);
    for(const graph of graphs){
      const axes=node.querySelector(`[data-ak-graph="${graph.id}"]`);
      if(!axes)continue;
      const id='ak-cadre-'+graph.id, defs=svgElement('defs'),clip=svgElement('clipPath'),rect=svgElement('rect');
      clip.id=id;
      for(const [k,v] of Object.entries({x:graph.x0,y:graph.y0,width:graph.w,height:graph.h}))rect.setAttribute(k,v);
      clip.append(rect);defs.append(clip);axes.append(defs);
      let layer=null;
      for(let next=axes.nextElementSibling;next&&!next.hasAttribute('data-ak-graph');){
        const child=next;next=child.nextElementSibling;
        if(child.localName==='defs'||child.hasAttribute('data-ak-hors-graphe')){layer=null;continue}
        if(!layer){
          layer=svgElement('g');
          layer.setAttribute('clip-path',`url(#${id})`);
          child.before(layer);
        }
        layer.append(child);
      }
    }
  }
  function writeSvg(P,html,graphs=[]){
    if(P.node._h===html)return;
    P.node.innerHTML=html;
    P.node._h=html;
    if(activeChartView(P))clipCharts(P.node,graphs);
  }
  A.renderNow=()=>{
    A._dirty=false;measure();
    let frame=drawFrame();
    if(frame.changed)frame=drawFrame();
    for(const [P,output] of frame.outputs)writeSvg(P,output.html,output.graphs);
    syncScrub();guardScroll();
  };
  A.render=()=>{if(A._dirty)return;A._dirty=true;requestAnimationFrame(()=>{if(A._dirty)A.renderNow()})};
  A.svg=(id,html)=>{
    const P=A.panels[id];if(!P)return;
    if(A._graphFrame)A._graphFrame.outputs.set(P,{html});
    else writeSvg(P,html);
  };

  /* ---------- temps ---------- */
  let last=0;
  const playBtn=$('.ak-play',tr);
  A.play=on=>{on=on===undefined?!A.running:on;if(on&&cfg.peutLire&&!cfg.peutLire(A))on=false;A.running=on;playBtn.textContent=on?'❚❚ Pause':'▶ Lecture';if(on){last=performance.now();requestAnimationFrame(loop)}};
  function loop(now){if(!A.running)return;const dt=Math.min(.05,(now-last)/1000)*A.speed;last=now;if(cfg.step)cfg.step(A,dt);A.renderNow();requestAnimationFrame(loop)}
  A.stepOnce=()=>{A.play(false);if(cfg.step)cfg.step(A,cfg.pas??1/24);A.render()};
  A.reset=()=>{A.play(false);A.t=0;if(cfg.reset)cfg.reset(A);A.render()};
  $('.ak-speed',tr).onchange=e=>{A.speed=+e.target.value};A.speed=cfg.vitesse||1;

  /* ---------- onglets ---------- */
  A.setTab=i=>{if(!tabs||i<0||i>=cfg.onglets.length)return;A.play(false);A.tab=i;A.cadrerTout();clearActivePresets();$$('.ak-tab',tabs).forEach((b,j)=>b.setAttribute('aria-selected',String(j===i)));if(cfg.onglet)cfg.onglet(A,i);refreshSettings();A.render()};

  /* ---------- thème, projection, plein écran ---------- */
  A.setTheme=t=>{root.dataset.theme=t;writeStore(THEME_KEY,t);readColors();syncMenu();A.renderNow()};
  A.setProj=on=>{
    ak.classList.toggle('is-proj',on);
    ak.classList.remove('drawer-open');
    projButton.classList.toggle('on',on);
    syncMenu();
    A.render();
  };
  const acts={
    play:()=>A.play(),step:()=>A.stepOnce(),reset:()=>A.reset(),
    help:()=>{dlg.showModal()},theme:()=>A.setTheme(root.dataset.theme==='dark'?'light':'dark'),
    image:()=>A.exportImage(),proj:()=>{
      const projected=ak.classList.contains('is-proj');
      A.setProj(!projected);
      if(cfg.menuCommun&&projected&&A.narrow)ak.classList.add('drawer-open');
    },
    fs:()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>A.toast('Plein écran refusé par le navigateur'))},
    settings:()=>{ak.classList.toggle('drawer-open');A.render()}
  };
  ak.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&acts[b.dataset.act])acts[b.dataset.act]()});
  addEventListener('keydown',e=>{
    if(dlg.open||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.target.matches('input,select,textarea'))return;
    const k=e.key.toLowerCase(), custom=cfg.touches&&cfg.touches[k];
    if(custom){e.preventDefault();custom(A);A.render();return}
    if(k===' '&&!tr.hidden){e.preventDefault();acts.play()}
    else if(k==='arrowright'&&!tr.hidden){e.preventDefault();acts.step()}
    else if(k==='r'&&!tr.hidden)acts.reset();
    else if(k==='h'||k==='?')acts.help();else if(k==='p')acts.proj();else if(k==='f')acts.fs();else if(k==='t')acts.theme();else if(k==='i')acts.image();
    else if(k==='+'||k==='='||k==='-'||k==='0'){const P=(A._hover&&!A._hover.el.hidden&&A._hover.vue)?A._hover:Object.values(A.panels).find(q=>q.vue&&!q.el.hidden);if(P){e.preventDefault();if(k==='0')A.cadrer(P);else A.zoomer(P,k==='-'?.8:1.25)}}
    else if(k==='escape'){ak.classList.remove('drawer-open');A.render()}
    else if(/^[1-9]$/.test(k))A.setTab(+k-1);
  });

  /* ---------- vue : zoom, cadrage, déplacement ---------- */
  const deplacable=P=>P.vue==='svg'||P.vue==='graphe';
  function zoomed(P){
    if(P.vue==='interne')return Math.abs(P.zoom-1)>1e-6;
    if(!deplacable(P))return false;
    const seuil=P.vue==='graphe'?1e-6:.5;
    return Math.abs(P.vz-1)>1e-6||Math.abs(P.vx)>seuil||Math.abs(P.vy)>seuil;
  }
  const markZoom=P=>{if(P.tools)P.tools.classList.toggle('is-zoomed',zoomed(P))};
  const graphAt=(P,x,y)=>P.graphs.find(g=>x>=g.x0&&x<=g.x0+g.w&&y>=g.y0&&y<=g.y0+g.h);
  function resetView(P){P.vz=1;P.vx=P.vy=0;P.zoom=1;P.panX=P.panY=0;markZoom(P)}
  A.zoomer=(P,f,px,py)=>{if(typeof P==='string')P=A.panels[P];if(!P||!P.vue)return;
    if(P.vue==='interne')P.zoom=Math.max(.4,Math.min(5,P.zoom*f));
    else{
      if(P.vue==='graphe'){
        const graph=graphAt(P,px,py);
        px=graph?(px-graph.x0)/graph.w:.5;
        py=graph?(py-graph.y0)/graph.h:.5;
      }else{px=px??P.w/2;py=py??P.h/2}
      const z=Math.max(.5,Math.min(8,P.vz*f)), delta=1/P.vz-1/z;
      P.vx+=px*delta;P.vy+=py*delta;P.vz=z;
    }
    markZoom(P);A.render()};
  A.deplacer=(P,dx,dy,px,py)=>{
    if(!deplacable(P))return;
    if(P.vue==='graphe'){const g=graphAt(P,px,py)||P.graphs[0];dx/=g.w;dy/=g.h}
    P.vx-=dx/P.vz;P.vy-=dy/P.vz;markZoom(P);A.render()
  };
  A.cadrer=P=>{if(typeof P==='string')P=A.panels[P];if(!P)return;resetView(P);A.render()};
  A.cadrerTout=()=>{for(const P of Object.values(A.panels))A.cadrer(P)};

  function wire(P){const N=P.node,pts=new Map();let mode=null,h=null,last=null,pin=null;
    const scr=e=>{const r=N.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    const toV=s=>P.vue==='svg'?[P.vx+s[0]/P.vz,P.vy+s[1]/P.vz]:s;
    const two=()=>{const[a,b]=[...pts.values()];return{d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,c:[(a[0]+b[0])/2,(a[1]+b[1])/2]}};
    N.addEventListener('pointerdown',e=>{
      const s=scr(e);A._hover=P;pts.set(e.pointerId,s);
      if(pts.size===2&&P.vue){if(mode==='drag'&&h&&h.end)h.end(e);mode='pinch';h=null;pin=two();N.setPointerCapture(e.pointerId);e.preventDefault();return}
      if(pts.size>1)return;
      const[x,y]=toV(s);
      if(deplacable(P)&&(e.shiftKey||e.button===1))mode='pan';
      else{h=P._drags.find(d=>!d.hit||d.hit(x,y,e))||null;
        if(h){mode='drag';if(h.start)h.start(x,y,e)}
        else if(deplacable(P)&&zoomed(P))mode='pan';
        else{mode=null;return}}
      last=s;N.setPointerCapture(e.pointerId);e.preventDefault();A.render()});
    N.addEventListener('pointermove',e=>{const s=scr(e);
      if(!pts.has(e.pointerId)){if(e.pointerType==='mouse'){const[x,y]=toV(s);N.style.cursor=P._drags.some(d=>d.hit&&d.hit(x,y,e))?'grab':(deplacable(P)&&(e.shiftKey||zoomed(P)))?'move':''}return}
      pts.set(e.pointerId,s);
      if(mode==='pinch'&&pts.size>=2){const q=two();A.zoomer(P,q.d/pin.d,q.c[0],q.c[1]);A.deplacer(P,q.c[0]-pin.c[0],q.c[1]-pin.c[1],q.c[0],q.c[1]);pin=q;return}
      if(mode==='pan'){A.deplacer(P,s[0]-last[0],s[1]-last[1],last[0],last[1]);last=s;return}
      if(mode==='drag'&&h){const[x,y]=toV(s);h.move(x,y,e);A.render()}});
    const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
      if(mode==='drag'&&h&&h.end)h.end(e);
      if(pts.size===0){mode=null;h=null}else if(mode==='pinch'){mode='pan';last=[...pts.values()][0]}
      A.render()};
    N.addEventListener('pointerup',end);N.addEventListener('pointercancel',end);
    if(P.vue){
      N.addEventListener('wheel',e=>{if(A.narrow&&!e.ctrlKey)return;e.preventDefault();const s=scr(e);A.zoomer(P,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),s[0],s[1])},{passive:false});
      N.addEventListener('dblclick',e=>{const[x,y]=toV(scr(e));if(!P._drags.some(d=>d.hit&&d.hit(x,y,e))&&zoomed(P))A.cadrer(P)});
      N.addEventListener('pointerenter',()=>{A._hover=P});
    }
  }
  for(const P of Object.values(A.panels))wire(P);
  A.drag=(id,h)=>{A.panels[id]._drags.push(h)};

  /* ---------- export image (toujours en thème clair) ---------- */
  A.exportImage=async()=>{
    const was=root.dataset.theme; root.dataset.theme='light'; readColors(); A.renderNow();
    const vis=Object.values(A.panels).filter(P=>!P.el.hidden), base=pwrap.getBoundingClientRect(), sc=2;
    const cv=document.createElement('canvas'); cv.width=Math.round(base.width*sc); cv.height=Math.round(base.height*sc);
    const ctx=cv.getContext('2d'); ctx.fillStyle=A.C.card; ctx.fillRect(0,0,cv.width,cv.height);
    const jobs=vis.map(P=>new Promise(res=>{const r=P.node.getBoundingClientRect(), x=(r.left-base.left)*sc, y=(r.top-base.top)*sc;
      if(P.type==='canvas'){ctx.drawImage(P.node,x,y,r.width*sc,r.height*sc);res();return}
      const clone=P.node.cloneNode(true); clone.setAttribute('width',r.width); clone.setAttribute('height',r.height);
      const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
      const im=new Image(); im.onload=()=>{ctx.drawImage(im,x,y,r.width*sc,r.height*sc);res()}; im.onerror=()=>res(); im.src=src;}));
    await Promise.all(jobs);
    root.dataset.theme=was; readColors(); A.renderNow();
    const a=document.createElement('a'); const tabName=cfg.onglets&&cfg.onglets.length>1?'_'+(A.tab+1):'';
    a.download=`${cfg.code}_${(cfg.fichier||cfg.titre).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_')}${tabName}.png`;
    a.href=cv.toDataURL('image/png'); a.click(); A.toast('Image enregistrée (thème clair)');
  };

  /* ---------- aide ---------- */
  function buildHelp(){
    const h=cfg.aide||{}, sec=(t,c)=>c?`<h4>${t}</h4>${/^\s*</.test(c)?c:`<p>${c}</p>`}`:'';
    dlg.innerHTML=`<header><h3>Aide · ${cfg.titre}</h3><button class="mini" data-close>Fermer ✕</button></header><div class="db">
    ${cfg.sousTitre?`<p class="ak-dlg-sub">${cfg.sousTitre}</p>`:''}${sec('Ce qu\'on voit',h.voit)}${sec('Ce qu\'on peut faire',h.faire)}${sec('Modèle et hypothèses',h.modele)}${sec('Lien avec le cours',h.cours)}${sec('Pour aller plus loin',h.plus)}
    <h4>Raccourcis</h4><p>${cfg.temps?'<kbd>Espace</kbd> lecture / pause · <kbd>→</kbd> pas à pas · <kbd>R</kbd> recommencer · ':''}${tabs?`<kbd>1</kbd>–<kbd>${cfg.onglets.length}</kbd> onglets · `:''}<kbd>P</kbd> projection · <kbd>F</kbd> plein écran · <kbd>T</kbd> thème · <kbd>I</kbd> image · <kbd>H</kbd> aide${h.touches?' · '+h.touches:''}</p>
    <p>Vue : molette, pincement ou <kbd>+</kbd> <kbd>−</kbd> pour zoomer · <kbd>Maj</kbd> + glisser, deux doigts, ou glisser une vue zoomée pour la déplacer · « Cadrer », <kbd>0</kbd> ou double clic : vue initiale · Double-clic sur un curseur : valeur par défaut.</p>
    ${h.credits?`<h4>Crédits</h4><p>${h.credits}</p>`:''}</div>`;
    dlg.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===dlg)dlg.close()});
  }

  /* ---------- démarrage ---------- */
  buildSettings(); buildHelp(); readColors();
  if(cfg.init)cfg.init(A);
  refreshSettings(); A.reset();
  new ResizeObserver(()=>A.render()).observe(ak);
  return A;
}

window.AnimKit={app,fmt,M,ticks,niceStep,FONT,MATH,interrupteur};
})();

</script>
<script>

'use strict';
window.HailModel=(()=>{
 const g=9.81,ids=['free','linear','quadratic'];
 function constants(p){const R=p.R*1e-3,m=p.m*1e-3,eta=p.eta*1e-6,rho=p.rho,Cx=p.Cx,h=p.h;if(![R,m,eta,rho,Cx,h].every(Number.isFinite)||R<=0||m<=0||h<=0||eta<0||rho<0||Cx<0)throw new RangeError('Paramètres physiques hors domaine');const b=6*Math.PI*eta*R,c=.5*rho*Cx*Math.PI*R**2;return {R,m,eta,rho,Cx,h,b,c,gamma:b/m,k:c/m,g};}
 function logCosh(x){x=Math.abs(x);if(x<1e-3){const y=x*x;return y*(.5+y*(-1/12+y*(1/45-17*y/2520)));}return x+Math.log1p(Math.exp(-2*x))-Math.LN2;}
 function distance(c,id,t){if(t<0)throw new RangeError('Temps négatif');if(id==='free'||(id==='linear'&&c.b===0)||(id==='quadratic'&&c.c===0))return .5*g*t*t;if(id==='linear'){const x=c.gamma*t;if(x<1e-3)return .5*g*t*t*(1-x/3+x*x/12-x**3/60+x**4/360);return g/c.gamma**2*(x+Math.expm1(-x));}const x=t*Math.sqrt(g*c.k);if(x<1e-3)return .5*g*t*t*(1-x*x/6+2*x**4/45-17*x**6/1260);return logCosh(x)/c.k;}

/* Mouvement dans le plan (Oxz), z vers le haut. Les coefficients de traînée
   sont rapportés à la masse. L'intégration s'arrête au premier contact au sol. */
window.ProjectileModel = (() => {
  const g = window.HailModel.g;
  const step = 0.002;

  function initialState({z0, v0, alpha}) {
    const angle = alpha * Math.PI / 180;
    const component = f => Math.abs(f) < 1e-14 ? 0 : v0 * f;
    return {x: 0, z: z0, vx: component(Math.cos(angle)), vz: component(Math.sin(angle))};
  }

  // Pour les tirs rasants ou vers le bas, on part du côté où z est décroissant.
  function zero(lo, hi, f) {
    for (let i = 0; i < 48; i++) {
      const mid = (lo + hi) / 2;
      if (f(mid) > 0) lo = mid;
      else hi = mid;
    }
    return (lo + hi) / 2;
  }

  function simulate(params, law = 'free') {
    const initial = initialState(params);
    const {z, vx, vz} = initial;
    const terminal = law === 'free' ? null : params.terminal;
    const linear = law === 'linear' ? g / terminal : 0;
    const quadratic = law === 'quadratic' ? g / terminal ** 2 : 0;
    const acceleration = q => {
      const factor = linear + quadratic * Math.hypot(q.vx, q.vz);
      return {ax: -factor * q.vx, az: -g - factor * q.vz};
    };

    let impact = 0, tApex = 0;
    let at;
    if (law === 'free') {
      at = t => ({x: vx * t, z: z + vz * t - g * t ** 2 / 2, vx, vz: vz - g * t});
      tApex = Math.max(0, vz / g);
      const root = Math.hypot(vz, Math.sqrt(2 * g * z));
      impact = vz >= 0 ? (vz + root) / g : 2 * z / (root - vz);
    } else if (law === 'linear') {
      at = t => {
        const u = linear * t;
        const decay = -Math.expm1(-u);
        const integral = decay / linear;
        const gravityDistance = u < 1e-3
          ? g * t ** 2 / 2 * (1 - u / 3 + u ** 2 / 12)
          : (g / linear) * (t - integral);
        return {x: vx * integral, z: z + vz * integral - gravityDistance,
          vx: vx * Math.exp(-u), vz: vz * Math.exp(-u) - terminal * decay};
      };
      tApex = vz > 0 ? Math.log1p(vz / terminal) / linear : 0;
      if (z > 0 || vz > 0) {
        let hi = tApex + 1;
        while (at(hi).z > 0) hi *= 2;
        impact = zero(tApex, hi, t => at(t).z);
      }
    } else {
      function slope(q) {
        const {ax, az} = acceleration(q);
        return {x:q.vx,z:q.vz,vx:ax,vz:az};
      }
      function offset(q, d, dt) {
        return {x: q.x + d.x * dt, z: q.z + d.z * dt, vx: q.vx + d.vx * dt, vz: q.vz + d.vz * dt};
      }
      function advance(q, dt) {
        const a = slope(q);
        const b = slope(offset(q, a, dt / 2));
        const c = slope(offset(q, b, dt / 2));
        const d = slope(offset(q, c, dt));
        const mean = key => (a[key] + 2 * (b[key] + c[key]) + d[key]) / 6;
        return offset(q, {x: mean('x'), z: mean('z'), vx: mean('vx'), vz: mean('vz')}, dt);
      }

      const states = [initial];
      if (z > 0 || vz > 0) {
        for (let i = 0; ; i++) {
          const q = states[i];
          const next = advance(q, step);
          const apexInStep = q.vz > 0 && next.vz <= 0;
          if (apexInStep) tApex = i * step + zero(0, step, dt => advance(q, dt).vz);
          if (next.z <= 0) {
            const lo = apexInStep ? tApex - i * step : 0;
            impact = i * step + zero(lo, step, dt => advance(q, dt).z);
            break;
          }
          states.push(next);
        }
      }
      at = t => {
        const i = Math.min(states.length - 1, Math.floor(t / step));
        return advance(states[i], Math.max(0, t - i * step));
      };
    }

    function sample(t) {
      const time = Math.max(0, Math.min(impact, t));
      const q = at(time);
      return {...q, z: time >= impact ? 0 : Math.max(0, q.z), ...acceleration(q), time, impacted: t >= impact};
    }
    const apex = sample(tApex), arrival = sample(impact);
    return {law, terminal, initial, impact, tApex, apex, arrival, sample};
  }

  // Enveloppe des tirs de même vitesse et de même altitude initiales.
  function safetyParabola({z0, v0}) {
    if (v0 === 0) return null;
    const apex = z0 + v0 ** 2 / (2 * g);
    const range = v0 * Math.sqrt(2 * apex / g);
    const bestAngle = Math.atan(v0 / Math.sqrt(v0 ** 2 + 2 * g * z0)) * 180 / Math.PI;
    return {apex, range, bestAngle, heightAt: x => apex * (1 - (x / range) ** 2)};
  }

  return Object.freeze({g, simulate, safetyParabola});
})();

  const svgv=x=>f.sig(x,3).replace(/<sup>(.*?)<\/sup>/,(m,e)=>S.sup(e));
  let s=S.text(w/2,8*k,NOM[st.sel],{anchor:'middle',base:'top',size:13,c,weight:650});
  if(q.impacted)s+=S.text(w/2,26*k,'Juste avant l’impact',{anchor:'middle',base:'top',size:11,c:C.ink2});
  const cx=w*.42,cy=h*.42,room=Math.max(20*k,Math.min(h*.29,cy-48*k,h-cy-85*k));
  scF=room/(.0039*HM.g)*.85*a.p.gain;   // px par newton
  const lp=q.P*scF,ld=q.f*scF;if(lp>room+.1||ld>room+.1||(a.p.res&&Math.abs(q.f-q.P)*scF>room+.1))cap=true;
  s+=S.circle(cx,cy,12*k,{fill:C.card,c,w:1.6});
  s+=S.arrow(cx,cy,cx,cy+Math.min(lp,room),{c:C.F,w:3})+vl(a,cx+10*k,cy+Math.min(lp,room)-4*k,'P',C.F);
  if(q.f>1e-13&&ld>.5)s+=S.arrow(cx,cy,cx,cy-Math.min(ld,room),{c:C.F,w:3})+(ld>18*k?vl(a,cx+10*k,cy-Math.min(ld,room)+12*k,'f',C.F):'');
  if(a.p.res){const net=q.f-q.P,L=Math.min(Math.abs(net)*scF,room),x=cx-40*k;if(L>.5)s+=S.arrow(x,cy,x,cy-Math.sign(net)*L,{c:C.ink2,w:2,dash:`${4*k} ${3*k}`});s+=S.text(x-6*k,cy,'Σ'+S.v('F'),{anchor:'end',size:15,c:C.ink2})}
  const y0=Math.min(h-63*k,cy+room+16*k);
  s+=S.text(10*k,y0,`${S.v('P')} = ${svgv(q.P*1e3)} mN`,{size:14,c:C.ink,base:'top'});
  s+=S.text(10*k,y0+20*k,`${S.v('f')} = ${svgv(q.f*1e3)} mN`,{size:14,c:C.ink,base:'top'});
  s+=S.text(10*k,y0+40*k,`${S.v('a','z')} = ${svgv(q.a)} m·s${S.sup('−2')}`,{size:14,c:C.ink,base:'top'});
  a.svg('forces',s);

function vl(a,x,y,l,c){const S=a.S,k=a.k,fs=17*k;return S.text(x,y,S.v(l),{size:17,c})+S.arrow(x+.05*fs,y-.55*fs,x+.6*fs,y-.55*fs,{c,w:.9,head:4.5*k})}

];

const model = a => a.tab === 0 ? free : drag;
const compared = a => a.tab === 1 && a.p.compare;
const graphMode = a => a.tab === 0 ? a.p.freeGraph : a.p.history;
const plotAngles = a => graphMode(a) === 'angle';

const duration = a => a.tab === 2 ? Hail.duration()
  : Math.max(model(a).impact, compared(a) ? free.impact : 0);
const seek = (a,t) => {a.t = Math.max(0, Math.min(duration(a), t))};

function rebuild(a) {
  const prepare = law => {
    const path = PM.simulate(a.p,law);
    const states = Array.from({length:181},(_,i)=>path.sample(path.impact*i/180));
    return {...path, states,
      maxAcceleration:Math.max(...states.map(p=>Math.hypot(p.ax,p.az)))};
  };
  free = prepare('free');
  drag = prepare(a.p.law);
}

function ballistics(a) {
  const {z0,v0} = a.p;
  if (angleStudy?.z0 === z0 && angleStudy.v0 === v0) return angleStudy;
  const safety = PM.safetyParabola({z0,v0});
  const shot = alpha => PM.simulate({z0,v0,alpha});
  const angles = Array.from({length:361},(_,i)=>i-180);
  if (safety) angles.push(safety.bestAngle,180-safety.bestAngle);
  angles.sort((a,b)=>a-b);
  const results = angles.map(alpha=>{
    const path = shot(alpha);
    return {alpha, range:Math.abs(path.arrival.x), height:path.apex.z};
  });
  const rightAngles = safety ? [safety.bestAngle/2,safety.bestAngle,
    safety.bestAngle+.3*(90-safety.bestAngle),safety.bestAngle+.7*(90-safety.bestAngle)] : [];
  const ghostAngles = safety ? [...rightAngles,90,...rightAngles.map(alpha=>180-alpha)] : [];
  const ghosts = ghostAngles.map(alpha=>{
    const path = shot(alpha);
    return Array.from({length:101},(_,i)=>{
      const q = path.sample(path.impact*i/100);
      return [q.x,q.z];
    });
  });
  angleStudy = {z0,v0,safety,results,ghosts};
  return angleStudy;
}

function showReadings(values) {
  const html = values.map(({label,value,unit,hint}) => `<div class="mc2-reading">
    <span class="mc2-caption">${label}</span>
    <strong>${value} <small>${unit}</small></strong>${hint ? `<span class="mc2-hint">${hint}</span>` : ''}</div>`).join('');
  if (readings._html !== html) {
    readings.innerHTML = html;
    readings._html = html;
  }
}

function projectileReadings(a) {
  const q = model(a), f = a.fmt;
  const measures = [
    ['Flèche', 'm', path => path.apex.z, path => path.tApex],
    ['Portée', 'm', path => Math.abs(path.arrival.x), path => path.impact],
    ['Durée du vol', 's', path => path.impact, path => path.impact],
    ['Vitesse à l’impact', ms, path => Math.hypot(path.arrival.vx,path.arrival.vz), path => path.impact]
  ];
  showReadings(measures.map(([label,unit,value,instant]) => {
    const display = path => a.p.preview || a.t >= instant(path) ? f.sig(value(path),3) : '—';
    const current = display(q), reference = display(free);
    return {
      label, value:current, unit:current === '—' ? '' : unit,
      hint: compared(a) ? `Libre · ${reference === '—' ? reference : reference+' '+unit}` : ''
    };
  }));
  a.enable('apex', q.tApex > 0);
  a.enable('arrival', q.impact > 0);
  a.clock(q.impact === 0 && !duration(a) ? 'Impact immédiat' : `t = ${f.fix(a.t,2)} s`);
}

function view(a) {
  if (dragView) return dragView;
  const {w,h} = a.panels.projectile, {k} = a;
  const padL = 46*k, padR = 20*k, padT = 38*k, padB = 43*k;
  const width = Math.max(50,w-padL-padR), height = Math.max(50,h-padT-padB);
  const inset = Math.min(42*k, width*.19);
  const ground = Math.min(48*k, height*.24);
  const paths = compared(a) ? [model(a),free] : [model(a)];
  const xs = paths.map(path => path.arrival.x);
  const safety = a.tab === 0 && (a.p.safety || a.p.ghosts || plotAngles(a)) ? ballistics(a).safety : null;
  const radius = safety?.range || 0;
  const xMin = Math.min(-radius,...xs), xMax = Math.max(radius,...xs);
  const zMax = Math.max(safety?.apex || 0,...paths.map(path => path.apex.z));
  const scale = Math.min((width-2*inset) / Math.max(10,xMax-xMin),
    (height-ground-Math.min(34*k,height*.18)) / Math.max(8,zMax));
  const xMid = (xMin+xMax)/2;
  return {width,height,padL,padR,padT,padB,
    xmin: xMid-width/(2*scale), xmax: xMid+width/(2*scale),
    ymin: -ground/scale, ymax: (height-ground)/scale,
    handleScale: Math.min(1.38*k, width*.22/55, height*.34/55)
  };
}

function statesThrough(path,p) {
  if (p.time <= 0) return [];
  if (p.time >= path.impact) return path.states;
  const index = Math.ceil(p.time/path.impact*(path.states.length-1));
  return [...path.states.slice(0,index),p];
}

function drawProjectile(a) {
  const {S,C,k} = a, {w,h} = a.panels.projectile;
  const bounds = view(a), q = model(a);
  const {padL,padR,padT,padB,handleScale,xmin,xmax,ymin,ymax} = bounds;
  const G = S.graph({x:0,y:0,w,h,padL,padR,padT,padB,xmin,xmax,ymin,ymax,nx:Math.max(3,Math.round(bounds.width/(95*k))),
    xlab: `${S.v('x')} (m)`, ylab: `${S.v('z')} (m)`, zeroAxis:false,
    yfmt:(z,step)=>z<0?'':a.fmt.fix(z,Math.max(0,-Math.floor(Math.log10(step))))});
  scene = {bounds,G};
  const Z = G.Y(0), X = G.X(0), xEnd = G.x0+G.w;
  const c = C.cInk, measures = heightColor(a);
  const dashed = `${7*k} ${5*k}`;
  let s = G.svg + S.clip('projectile-cadre',G);
  if (Z>=G.y0 && Z<=G.y0+G.h) {
    s += S.rect(G.x0,Z,G.w,G.y0+G.h-Z,{fill:C.cSoft,op:.82});
    s += S.line(G.x0,Z,xEnd,Z,{c:C.ink2,w:1.4});
    s += S.text(xEnd-5*k,Z+13*k,'Sol',{anchor:'end',size:12});
  }
  if (X>=G.x0 && X<=xEnd) s += S.arrow(X,Math.min(Z,G.y0+G.h),X,G.y0+5*k,{c:C.ink2,w:1.3});
  const study = a.tab === 0 && (a.p.safety || a.p.ghosts) ? ballistics(a) : null;
  const safety = a.p.safety ? study?.safety : null;
  if (safety) {
    const left = G.X(-safety.range), right = G.X(safety.range);
    const curve = `Q${X},${G.Y(2*safety.apex)} ${right},${Z}`;
    if (Z > G.y0) {
      const lo = Math.min(G.x0,left), hi = Math.max(xEnd,right);
      const zone = `M${lo},${Z} H${left} ${curve} H${hi} V${G.y0} H${lo} Z`;
      s += '<g clip-path="url(#projectile-cadre)">'+S.path(zone,{fill:C.B,c:'none',fop:.07})+'</g>';
    }
  }
  if (study?.safety) {
    if (a.p.ghosts) {
      s += '<g data-ghosts="">';
      for (const track of study.ghosts) {
        s += S.curve(track,G,{c:C.ink2,w:1.2,op:.56,dash:`${2*k} ${4*k}`});
      }
      s += '</g>';
    }
    if (safety) {
      const {range,apex} = safety;
      const path = `M${G.X(-range)},${Z} Q${X},${G.Y(2*apex)} ${G.X(range)},${Z}`;
      s += '<g data-safety="" clip-path="url(#projectile-cadre)">'+S.path(path,{c:C.B,w:2.3,dash:`${9*k} ${4*k}`})+'</g>';
      if (G.Y(apex)-G.y0>53*k && G.w>175*k) {
        s += S.text(G.x0+12*k,G.y0+20*k,'Zone hors d’atteinte',{size:13,c:C.B});
      }
    }
  }
  const p = q.sample(a.t), origin = q.initial;
  if (compared(a)) {
    const ref = free.sample(a.t);
    const visible = a.p.preview ? free.states : statesThrough(free,ref);
    if (visible.length) s += S.curve(visible.map(q=>[q.x,q.z]),G,{c:C.B,w:1.9,dash:dashed});
    s += S.circle(G.X(ref.x),G.Y(ref.z),7*k,{c:C.B,w:2,fill:C.card});
  }
  if (a.p.preview && q.impact>0) s += S.curve(q.states.map(q=>[q.x,q.z]),G,{c,w:2,op:.58});
  if (p.time > 0) s += S.curve(statesThrough(q,p).map(q=>[q.x,q.z]),G,{c,w:3});
  if (a.p.markers) {
    const xApex=G.X(q.apex.x), yApex=G.Y(q.apex.z), xArrival=G.X(q.arrival.x);
    if (a.p.preview || a.t >= q.tApex) {
      if (Z-yApex>15*k) {
        s += S.line(xApex,yApex,xApex,Z,{c:measures,w:1.2,dash:`${3*k} ${4*k}`});
        if (Z-yApex>55*k) {
          const left = xApex-G.x0>76*k;
          s += S.text(xApex+(left?-9:9)*k,(Z+yApex)/2,'Flèche',
            {c:measures,size:14,anchor:left?'end':'start'});
        }
      }
      s += S.circle(xApex,yApex,4*k,{fill:C.card,c:measures,w:1.7});
    }
    if (q.impact>0 && (a.p.preview || p.impacted)) {
      if (Math.abs(xArrival-X)>48*k) {
        const y=Z+12*k;
        s += S.line(X,y,xArrival,y,{c:measures,w:1.4});
        for (const x of [X,xArrival]) s += S.line(x,y-5*k,x,y+5*k,{c:measures,w:1.4});
        if(Math.abs(xArrival-X)>84*k) s += S.text((X+xArrival)/2,y+20*k,'Portée',{c:measures,anchor:'middle',size:14});
      }
      s += S.circle(xArrival,Z,4*k,{fill:C.card,c:measures,w:1.7});
    }
  }

  s += '<g data-ak-hors-graphe="">';
  const ox = X, oy = G.Y(origin.z);
  const dx = origin.vx*handleScale, dy = -origin.vz*handleScale;
  const hx = ox+dx, hy = oy+dy;
  const size = Math.hypot(dx,dy);
  const initialAngle = Math.atan2(origin.vz,origin.vx);
  s += S.circle(ox,oy,4*k,{fill:C.card,c:C.ink2,w:1.5});
  if (size>22*k && Math.abs(initialAngle)>.18 && Math.abs(initialAngle)<2.9) {
    const radius = Math.min(24*k,size*.48), textAngle = initialAngle*.53;
    s += S.line(ox,oy,ox+radius+9*k,oy,{c:C.v,w:1,dash:`${2*k} ${3*k}`});
    s += S.arc(ox,oy,radius,0,initialAngle,{c:C.v,w:1});
    s += S.text(ox+(radius+10*k)*Math.cos(textAngle),oy-(radius+10*k)*Math.sin(textAngle),S.v('α'),{c:C.v,size:14});
  }
  s += S.arrow(ox,oy,hx,hy,{c:C.v,w:2.6});
  s += S.circle(hx,hy,5*k,{fill:C.card,c:C.v,w:1.7});
  s += vectorLabel(a,hx+(dx<0?-9:9)*k,hy-9*k,'v','0',C.v,dx<0?'end':'start');

  const px = G.X(p.x), py = G.Y(p.z), accScale = Math.min(4.3,53/q.maxAcceleration)*k;
  if (a.p.vectors) {
    if (p.time>0) {
      const vx=px+p.vx*handleScale, vy=py-p.vz*handleScale;
      s += S.arrow(px,py,vx,vy,{c:C.v,w:2.3});
      if (Math.hypot(vx-px,vy-py)>15*k && Math.hypot(vx-hx,vy-hy)>29*k) s += vectorLabel(a,vx+(p.vx<0?-8:8)*k,vy-7*k,
        'v',undefined,C.v,p.vx<0?'end':'start');
    }
    const ax = px+p.ax*accScale, ay = py-p.az*accScale;
    s += S.arrow(px,py,ax,ay,{c:C.F,w:2.3});
    const labelY = ay+(q.law==='free'?-8:5)*k;
    if (Math.hypot(ax-px,ay-py)>9*k) s += vectorLabel(a,ax+(p.ax<0?-7:7)*k,labelY,
      q.law==='free'?'g':'a',undefined,C.F,p.ax<0?'end':'start');
  }
  if (a.t>0 && (!compared(a) || p.time>0)) s += S.circle(px,py,6*k,{fill:c,c:C.card,w:1.5});
  s += S.circle(hx,hy,15*k,{fill:'transparent',hit:'launch'}) + '</g>';
  a.svg('projectile',s);
  a.legend([
    {c,label:modelName[q.law]},
    compared(a) && {c:C.B,label:'Chute libre',dash:true},
    study?.safety && a.p.safety && {c:C.B,label:'Parabole de sûreté',dash:true},
    study?.safety && a.p.ghosts && {c:C.ink2,label:'Trajectoires fantômes',dot:true},
    {c:C.v,label:`Vitesse · 10 m·s⁻¹ ↔ ${a.fmt.fix(10*handleScale,0)} px`},
    a.p.vectors && {c:C.F,label:`Accélération · 10 m·s⁻² ↔ ${a.fmt.fix(10*accScale,0)} px`}
  ]);
}

function vectorLabel({S,k},x,y,symbol,sub,c,anchor) {
  const start=anchor==='end'?x-(sub?18:11)*k:x;
  return S.text(x,y,S.v(symbol,sub),{c,anchor,size:16,weight:650})+
    S.arrow(start,y-8*k,start+10*k,y-8*k,{c,w:.8,head:3.5*k});
}

function drawAngles(a) {
  const {S,C,k} = a, panel = a.panels.evolution;
  const {z0,safety,results} = ballistics(a);
  const heightInk = heightColor(a);
  const dash = `${6*k} ${4*k}`;
  const height = free.apex.z;
  const range = Math.abs(free.arrival.x);
  const max = Math.max(1,safety?.range || 0,safety?.apex || z0);
  const xticks = panel.w/k < 320 ? [-180,-90,0,90,180] : [-180,-120,-60,0,60,120,180];
  const G = S.graph({x:0,y:0,w:panel.w,h:panel.h,padT:64*k,padR:25*k,padL:43*k,padB:35*k,
    xmin:-180,xmax:180,ymin:0,ymax:1.1*max,xticks,xfmt:x=>a.fmt.fix(x,0),
    xlab:`${S.v('α')} (°)`,ylab:'m'});
  historyGraph = G;
  let s = G.svg + S.clip('angle-cadre',G);
  s += S.curve(results.map(q=>[q.alpha,q.range]),G,{c:C.cInk,w:2.5});
  s += S.curve(results.map(q=>[q.alpha,q.height]),G,{c:heightInk,w:2.3,dash});

  const x = G.X(a.p.alpha);
  s += '<g clip-path="url(#angle-cadre)">';
  if (safety) {
    for (const alpha of [safety.bestAngle,180-safety.bestAngle]) {
      s += S.circle(G.X(alpha),G.Y(safety.range),4*k,{fill:C.card,c:C.cInk,w:1.5});
    }
  }
  s += S.line(x,G.y0,x,G.y0+G.h,{c:C.ink2,w:1,dash:`${2*k} ${4*k}`});
  s += S.circle(x,G.Y(range),5*k,{fill:C.cInk,c:C.card,w:1.3});
  s += S.circle(x,G.Y(height),4*k,{fill:C.card,c:heightInk,w:2});
  s += '</g>';

  const labels = [['Portée',range,C.cInk,undefined],['Flèche',height,heightInk,dash]];
  s += '<g data-ak-hors-graphe="">';
  labels.forEach(([label,value,c,dash],i)=>{
    const left = 12*k+i*(panel.w/2);
    const amount = a.fmt.sig(value,3).replace(/<sup>(.*?)<\/sup>/g,(_,e)=>S.sup(e));
    s += S.line(left,13*k,left+16*k,13*k,{c,w:2,dash});
    s += S.text(left+22*k,13*k,`${label} ${amount} m`,{c,size:13,weight:650});
  });
  if (safety) {
    const angle = a.fmt.fix(safety.bestAngle,1).replace(/\.0$/,'');
    const mirror = a.fmt.fix(180-safety.bestAngle,1).replace(/\.0$/,'');
    s += S.text(12*k,36*k,`Portée max. à ${angle}° et ${mirror}°`,{size:12,c:C.ink2});
  }
  s += S.text(G.x0,G.y0+G.h+23.4*k,`${S.v('α')} = ${a.fmt.fix(a.p.alpha,0)}°`,{c:C.ink,size:13,weight:650});
  s += '</g>';
  a.svg('evolution',s);
}

function drawHistory(a) {
  const {S,C,k} = a, panel = a.panels.evolution;
  const q = model(a), velocity = graphMode(a)==='velocity';
  const keys = velocity ? ['vx','vz'] : ['x','z'];
  const labels = velocity ? [S.v('v','x'), S.v('v','z')] : [S.v('x'),S.v('z')];
  const paths = compared(a) ? [q,free] : [q];
  const tables = paths.map(path=>path.states);
  const values = tables.flatMap(table=>table.flatMap(p=>keys.map(key=>p[key])));
  const lo = Math.min(0,...values), hi = Math.max(1,...values);
  const margin = (hi-lo)*.08;
  const G = S.graph({x:0,y:0,w:panel.w,h:panel.h,padT:48*k,padR:18*k,
    xmin:0,xmax:Math.max(.1,duration(a)),ymin:lo-margin,ymax:hi+margin,
    xlab:`${S.v('t')} (s)`,ylab:velocity?`m·s${S.sup('−1')}`:'m'});
  historyGraph = G;
  const colors = [C.B,C.cInk];
  let s = G.svg + S.clip('evolution-cadre',G);
  paths.forEach((path,i)=>{
    const table = a.p.preview ? path.states : statesThrough(path,path.sample(a.t));
    if (!table.length) return;
    keys.forEach((key,j)=>{
      s += S.curve(table.map(p=>[p.time,p[key]]),G,{c:colors[j],w:i?1.4:2.2,dash:i?`${6*k} ${5*k}`:undefined});
    });
  });
  s += `<g clip-path="url(#evolution-cadre)">${S.line(G.X(a.t),G.y0,G.X(a.t),G.y0+G.h,{c:C.ink2,w:1,dash:`${3*k} ${4*k}`})}`;
  paths.forEach((path,i)=>{
    if (a.t>path.impact) return;
    const p = path.sample(a.t);
    keys.forEach((key,j)=>{s += S.circle(G.X(a.t),G.Y(p[key]),4*k,{fill:i?C.card:colors[j],c:colors[j],w:1.3})});
  });
  s += '</g>';
  s += `<g data-ak-hors-graphe="">${S.text(16*k,12*k,labels[0],{c:colors[0],size:16,weight:700})}${S.text(49*k,12*k,labels[1],{c:colors[1],size:16,weight:700})}
    ${compared(a)?S.text(83*k,12*k,'Pointillés · chute libre',{size:12}):''}</g>`;
  a.svg('evolution',s);
}

A.drag('projectile',{
  hit:(x,y,e)=>!!e.target.closest('[data-hit=launch]'),
  start() {
    A.play(false);
    A.t=0;
    dragView=scene.bounds;
  },
  move(x,y) {
    const {G,bounds} = scene, {initial} = model(A);
    const dx = x-G.X(0), dy = G.Y(initial.z)-y;
    const speed = Math.round(10*Math.min(55,Math.hypot(dx,dy)/bounds.handleScale))/10;
    A.p.v0 = speed;
    if (speed>0) A.p.alpha = Math.round(Math.atan2(dy,dx)*180/Math.PI);
    rebuild(A);
    A.refresh();
  },
  end() {dragView=null}
});
function selectAbscissa(x) {
  const value = historyGraph.xv(x);
  if (plotAngles(A)) {
    const alpha = Math.max(-180,Math.min(180,Math.round(value)));
    if (alpha !== A.p.alpha) {
      A.set('alpha',alpha);
      A.reset();
    }
  } else seek(A,value);
}
A.drag('evolution',{
  hit:(x,y)=>historyGraph&&x>=historyGraph.x0&&x<=historyGraph.x0+historyGraph.w&&
    y>=historyGraph.y0&&y<=historyGraph.y0+historyGraph.h,
  start(x){A.play(false);selectAbscissa(x)},
  move(x){selectAbscissa(x)}
});
Hail.wire(A);
if (typeof location !== 'undefined' && location.hash === '#grelon') A.setTab(2);

</script>
