  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

<script>
/* TH3 — Modèles de bilan. SI ; chaleurs et travaux reçus algébriquement. */
'use strict';
const TH3Physique = (() => {
  const R=8.31446261815324, kB=1.380649e-23, NA=6.02214076e23;
  const Tm=273.15, cw=4180, ci=2090, L=335000;
  const clip=(x,a,b)=>Math.max(a,Math.min(b,x));
  function gaz(p,u=1) {
    u=clip(u,0,1);
    const {n,T0,V0,gamma,mode}=p, Cv=n*R/(gamma-1);
    let V=V0, T=T0, Q=0, W=0, Se=0, Sc=0, etape='', equilibre=true;
    if(mode==='cycle') {
      const r=p.r, TB=T0*Math.pow(r,1-gamma), a=3*u;
      if(a<=1) {
        V=V0*Math.pow(r,a); T=T0*Math.pow(V/V0,1-gamma);
        W=Cv*(T-T0); etape='A → B · compression adiabatique réversible';
      } else if(a<=2) {
        T=TB; V=V0*r*Math.pow(1/r,a-1);
        Q=n*R*TB*Math.log(V/(V0*r));
        W=Cv*(TB-T0)-Q; Se=n*R*Math.log(V/(V0*r));
        etape='B → C · détente isotherme réversible';
      } else {
        V=V0; T=TB+(T0-TB)*(a-2);
        const Qbc=n*R*TB*Math.log(1/r), Qca=Cv*(T-TB);
        Q=Qbc+Qca; W=Cv*(TB-T0)-Qbc;
        Se=n*R*Math.log(1/r)+Qca/T0;
        etape='C → A · refroidissement isochore monotherme';
      }
    } else if(mode==='adiabatique') {
      V=V0*Math.pow(p.r,u); T=T0*Math.pow(V/V0,1-gamma);
      W=Cv*(T-T0); etape='Adiabatique réversible';
    } else if(mode==='isotherme') {
      V=V0*Math.pow(p.r,u); Q=n*R*T0*Math.log(V/V0);
      W=-Q; Se=Q/T0; etape='Isotherme réversible';
    } else if(mode==='libre') {
      V=u===0?V0:V0*p.r; equilibre=u===0||u===1;
      etape='Détente libre · Joule–Gay-Lussac';
    }
    const dU=Cv*(T-T0), ds=Cv*Math.log(T/T0)+n*R*Math.log(V/V0);
    Sc=ds-Se;
    if(Math.abs(Sc)<1e-10)Sc=0;
    return {T,V,P:n*R*T/V,Q,W,dU,ds:equilibre?ds:null,Se:equilibre?Se:null,Sc:equilibre?Sc:null,equilibre,etape,Cv};
  }
  function cafe(p,u=1) {
    u=clip(u,0,1);
    const T=p.Ti+(p.Tb-p.Ti)*u, Q=p.C*(T-p.Ti);
    const ds=p.C*Math.log(T/p.Ti), Se=Q/p.Tb;
    return {T,Q,W:0,dU:Q,ds,Se,Sc:ds-Se,exterieur:-Se};
  }
  function contact(p,u=1,systeme='total') {
    u=clip(u,0,1);
    const Tf=(p.Ca*p.Ta+p.Cb*p.Tb)/(p.Ca+p.Cb);
    const Q=p.Ca*(Tf-p.Ta)*u, Ta=p.Ta+Q/p.Ca, Tb=p.Tb-Q/p.Cb;
    const sa=p.Ca*Math.log(Ta/p.Ta), sb=p.Cb*Math.log(Tb/p.Tb), sc=sa+sb;
    // Convention fixe : la résistance thermique est incluse dans A (eau).
    // B est homogène, sa frontière est à T_B ; Se_B = ΔS_B, Sc_B = 0.
    let ds=sa+sb, Se=0, Sc=sc, q=0;
    if(systeme==='a'){ds=sa;Se=-sb;Sc=sc;q=Q;}
    if(systeme==='b'){ds=sb;Se=sb;Sc=0;q=-Q;}
    return {Ta,Tb,Tf,Q:q,transfert:Q,W:0,dU:q,ds,Se,Sc,sa,sb};
  }
  function eauDepuisH(m,H) {
    if(H<0){const T=Tm+H/(m*ci);return {T,x:0,S:m*ci*Math.log(T/Tm),H};}
    if(H<=m*L)return {T:Tm,x:H/(m*L),S:H/Tm,H};
    const T=Tm+(H-m*L)/(m*cw);
    return {T,x:1,S:m*(L/Tm+cw*Math.log(T/Tm)),H};
  }
  function glace(p,u=1) {
    u=clip(u,0,1);
    const Hi=p.mi*ci*(p.Ti-Tm), Hw=p.mw*(L+cw*(p.Tw-Tm));
    const total=eauDepuisH(p.mi+p.mw,Hi+Hw);
    let qf;
    if(total.x===1)qf=p.mi*(L+cw*(total.T-Tm))-Hi;
    else if(total.x===0)qf=Hw-p.mw*ci*(total.T-Tm);
    else qf=Math.max(p.mw*cw*(p.Tw-Tm),p.mi*ci*(Tm-p.Ti));
    const q=qf*u, a=eauDepuisH(p.mi,Hi+q), b=eauDepuisH(p.mw,Hw-q);
    const si=eauDepuisH(p.mi,Hi).S, sw=eauDepuisH(p.mw,Hw).S;
    const ds=a.S+b.S-si-sw;
    return {a,b,Tf:total.T,xf:total.x,liquide:p.mi*a.x+p.mw*b.x,solide:p.mi*(1-a.x)+p.mw*(1-b.x),q,qf,ds,Se:0,Sc:ds,Q:0,W:0,dH:0,si:a.S-si,sw:b.S-sw};
  }
  function logBinom(n,k) {
    k=Math.min(k,n-k);let v=0;
    for(let j=1;j<=k;j++)v+=Math.log((n-k+j)/j);

  }
  function binomiale(n) {

    const a=new Array(n+1).fill(0), m=Math.floor(n/2);a[m]=1;
    for(let k=m;k>0;k--)a[k-1]=a[k]*k/(n-k+1);

  }
  function configurations(n,k) {
    if(n>10)return [];

    for(let i=0;i<2**n;i++) {
      const bits=Array.from({length:n},(_,j)=>(i>>j)&1);
      if(bits.reduce((a,b)=>a+b,0)===k)out.push(bits);
    }
    return out;
  }
  function binomEntier(n,k) {k=Math.min(k,n-k);let v=1n;for(let j=1;j<=k;j++)v=v*BigInt(n-k+j)/BigInt(j);return v;}

    // Points indépendants, x(0) uniforme sur [0,1/2], vx gaussienne centrée.
    // Réflexions sur [0,1] : décomposition en cosinus de la densité initiale.
    if(t<=0)return 1;
    if(sigma*t<.028)return 1-sigma*t*Math.sqrt(2/Math.PI);
    let sum=0;for(let j=1;j<=127;j+=2)sum+=Math.exp(-.5*(sigma*Math.PI*j*t)**2)/(j*j);
    return .5+4/(Math.PI*Math.PI)*sum;
  }
  return {R,kB,NA,Tm,cw,ci,L,clip,gaz,cafe,contact,glace,eauDepuisH,logBinom,binomiale,configurations,binomEntier,fractionMoyenneGauche};
})();

function cafeN(q,uu,N){uu=Math.max(0,Math.min(1,uu));const Tk=j=>q.Ti+(q.Tb-q.Ti)*j/N,j=Math.min(N-1,Math.floor(uu*N)),f=uu*N-j,T=Tk(j)+(Tk(j+1)-Tk(j))*f;

    faire:'<ul><li>Choisir une famille (onglet), une situation, puis lancer la lecture ou glisser dans le graphe pour régler l\'avancement.</li><li>Contact entre deux corps : cliquer sur l\'eau, sur le bloc ou autour pour changer de système étudié.</li><li>Gaz (adiabatique, isotherme) : glisser le piston pour régler le volume final.</li><li>Cocher « Montrer toute l\'évolution » après avoir fait prévoir.</li></ul>',
    modele:'Phases condensées idéales de capacités constantes, gaz parfait fermé à γ constant, états d\'équilibre. Chaleurs et travaux reçus algébriquement, <i class="m">W</i> = −∫<i class="m">P</i><sub>ext</sub> d<i class="m">V</i>. Contact : toute la résistance thermique est placée dans la zone de contact, comptée avec l\'eau A (l\'entropie créée n\'est comptée qu\'une fois). Détente de Joule–Gay-Lussac : aucun état intermédiaire n\'est défini, seul le bilan entre états d\'équilibre est affiché. Changement d\'état : la conservation de l\'enthalpie fixe l\'état final ; des chemins fictifs servent seulement au calcul de Δ<i class="m">S</i>.',

/* ---------- textes ---------- */
function systemeTexte(a){
  if(a.tab===1)return a.p.mode==='libre'?'Gaz dans une enceinte rigide adiabatique ; le volume ajouté est initialement vide.':'Système : le gaz et les zones de contact éventuelles. Les thermostats sont à l\'extérieur.';
  if(a.tab===2)return 'Système : l\'eau et la glace, dans un récipient calorifugé, à pression constante.';
  if(a.tab===3)return 'Système : les deux gaz, dans une enceinte rigide et calorifugée, à la même température ; on retire la cloison.';
  if(a.p.scenT==='cafe')return 'Système Σ : café + zone de contact. Le thermostat (air ambiant) est à l\'extérieur.';
  return {total:'Frontière de l\'ensemble isolé A + contact + B.',a:'Frontière de l\'eau A avec la zone de contact (B exclu).',b:'Frontière du bloc B seul, homogène, sans la zone de contact.'}[a.p.sys];
}
function energieTexte(a){const d=res(a),f=a.fmt,J=v=>f.sig(v,3)+' J';
  if(a.tab===1)return `${M.v('Q')} reçue = ${J(d.Q)}<br>${M.v('W')} reçu = ${J(d.W)}<br>Δ${M.v('U')} = ${J(d.dU)}`;
  if(a.tab===3)return `${M.v('Q')} = ${M.v('W')} = Δ${M.v('U')} = 0 : la température reste ${a.fmt.sig(prm(a).T,3)} K (gaz parfaits)`;
  if(a.tab===2)return `Transfert thermique interne glace ← eau : ${J(d.q)}<br>Δ${M.v('H')} de l'ensemble = 0`;
  if(a.p.scenT==='cafe')return `${M.v('Q')} reçue par le café = ${J(d.Q)}<br>Δ${M.v('U')} du café = ${J(d.dU)}<br>Δ${M.v('S')} du thermostat = ${f.sig(d.exterieur,3)} J·K<sup>−1</sup>`;
  return `${M.v('Q')} reçue par le système = ${J(d.Q)}<br>Δ${M.v('S')} de l'eau A = ${f.sig(d.sa,3)} J·K<sup>−1</sup><br>Δ${M.v('S')} du bloc B = ${f.sig(d.sb,3)} J·K<sup>−1</sup>`;
}
function formules(a){const ln=x=>`ln ${x}`;
  if(a.tab===1){let s=`Δ${M.v('S')} = ${M.v('C','V')} ${ln(M.frac(M.v('T','f'),M.v('T','i')))} + ${M.v('n')}${M.v('R')} ${ln(M.frac(M.v('V','f'),M.v('V','i')))}, avec ${M.v('C','V')} = ${M.frac(M.v('n')+M.v('R'),M.v('γ')+' − 1')}`;
    if(a.p.mode==='adiabatique')s+=`<br>Loi de Laplace : ${M.v('P')}${M.v('V')}<sup>γ</sup> = cste, ${M.v('T')}${M.v('V')}<sup>γ−1</sup> = cste, ${M.v('T')}<sup>γ</sup>${M.v('P')}<sup>1−γ</sup> = cste`;
    if(a.p.mode==='isotherme')s+=`<br>${M.v('Q')} = ${M.v('n')}${M.v('R')}${M.v('T')} ${ln(M.frac(M.v('V','f'),M.v('V','i')))} = −${M.v('W')} ; ${M.v('S','e')} = ${M.frac(M.v('Q'),M.v('T'))}, ${M.v('S','c')} = 0`;
    if(a.p.mode==='libre')s+=`<br>${M.v('Q')} = ${M.v('W')} = Δ${M.v('U')} = 0, ${M.v('T','f')} = ${M.v('T','i')}, Δ${M.v('S')} = ${M.v('S','c')} = ${M.v('n')}${M.v('R')} ${ln(M.frac(M.v('V','f'),M.v('V','i')))}`;
    if(a.p.mode==='cycle')s+=`<br>Δ${M.v('S')}<sub>cycle</sub> = 0, donc ${M.v('S','c')} = −${M.v('S','e')} &gt; 0`;
    return s}
  if(a.tab===3)return a.p.mx_meme?`Même gaz : Δ${M.v('S')} = ${M.v('R')}[${M.v('n')} ln(${M.v('V')}/${M.v('n')}) − ${M.v('n','A')} ln(${M.v('V','A')}/${M.v('n','A')}) − ${M.v('n','B')} ln(${M.v('V','B')}/${M.v('n','B')})], nul si les pressions sont égales`:`Gaz différents : chacun se détend dans tout le volume, Δ${M.v('S')} = ${M.v('n','A')}${M.v('R')} ln ${M.frac(M.v('V'),M.v('V','A'))} + ${M.v('n','B')}${M.v('R')} ln ${M.frac(M.v('V'),M.v('V','B'))} = ${M.v('S','c')}`;
  if(a.tab===2)return `Δ${M.v('H')} = 0 ; Δ${M.v('S')}<sub>chauffage</sub> = ${M.v('m')}${M.v('c')} ${ln(M.frac(M.v('T','f'),M.v('T','i')))} ; Δ${M.v('S')}<sub>fusion</sub> = ${M.frac(M.v('m')+' '+M.v('L','f'),M.v('T','fus'))}`;
  if(a.p.scenT==='cafe')return `Δ${M.v('S')} = ${M.v('C')} ${ln(M.frac(M.v('T'),M.v('T','i')))}, ${M.v('Q')} = ${M.v('C')}(${M.v('T')} − ${M.v('T','i')}), ${M.v('S','e')} = ${a.p.cafe_N>1?`Σ ${M.frac(M.v('Q','k'),M.v('T','k'))}`:M.frac(M.v('Q'),M.v('T','th'))}`;
  return `${M.v('T','f')} = ${M.frac(M.v('C','A')+M.v('T','A')+' + '+M.v('C','B')+M.v('T','B'),M.v('C','A')+' + '+M.v('C','B'))} ; Δ${M.v('S')} = ${M.v('C','A')} ${ln(M.frac(M.v('T','f'),M.v('T','A')))} + ${M.v('C','B')} ${ln(M.frac(M.v('T','f'),M.v('T','B')))}`;
}
function infos(a,d){
  const f=a.fmt, JK='J·K<sup>−1</sup>', eq=d.equilibre!==false;
  a.metrics([]);
  const s=scen(a),q=prm(a);let t;
  if(s==='cafe')t=Math.abs(q.Ti-q.Tb)<1e-9?'À températures égales, aucun échange ni aucune création d\'entropie.':u===0?'Café et air ambiant sont à des températures différentes : le transfert thermique ira du plus chaud vers le plus froid.':d.ds<0?'Le café perd de l\'entropie, mais il en cède davantage au thermostat : l\'entropie créée reste positive.':'Le café reçoit de l\'entropie du thermostat, et le contact à température différente en crée aussi.';
  else if(s==='contact')t=a.p.sys==='total'?'Les échanges entre A et B sont internes : leur somme s\'annule. La création au contact augmente l\'entropie de l\'ensemble isolé.':a.p.sys==='a'?'A comprend la zone de contact : l\'entropie reçue de B et celle créée au contact s\'ajoutent.':'Le bloc perd de l\'entropie en refroidissant. Dans ce modèle homogène, la création a lieu au contact, compté avec A.';
  else if(s==='glace')t=u>=1?(d.solide<1e-7?`Fusion totale : l'eau finale est à ${f.fix(d.Tf-TK,1)} °C.`:`Équilibre diphasé à 0 °C : il reste ${f.sig(d.solide*1000,3)} g de glace.`):'L\'eau cède de l\'énergie à la glace, qui se réchauffe puis fond.';
  else if(s==='adiabatique')t=`${M.v('Q')} = 0 et ${M.v('S')} créée = 0 : l'évolution est isentropique. `+(q.r<1?'La compression élève la température.':'La détente abaisse la température.');
  else if(s==='isotherme')t='La température reste constante. '+(q.r<1?'Le gaz cède de la chaleur, et de l\'entropie, au thermostat.':'Le gaz reçoit de la chaleur, et de l\'entropie, du thermostat.');
  else if(s==='libre')t=eq?`Mêmes états qu'une détente isotherme réversible : Δ${M.v('S')} = ${f.sig(q.n*PH.R*Math.log(q.r),3)} ${JK}. Ici cette entropie est créée ; sur le chemin réversible, elle serait échangée.`:'Hors équilibre : ni chemin P(V) ni bilan intermédiaire. Le bilan complet apparaît à l\'état final.';
  else t=u>=1?`Le gaz retrouve son état initial : Δ${M.v('S')}<sub>cycle</sub> = 0, mais ${M.v('S')} créée = ${f.sig(PH.gaz(q,1).Sc,3)} ${JK} &gt; 0.`:`${d.etape}. Les bilans affichés sont cumulés depuis A.`;
  a.insight(t);if(s==='melange')t='';
  a.clock(`<i class="m">u</i> = ${f.fix(u*100,0)} %`);
  a.refresh();
}

/* ---------- couleur de température ---------- */
// échelle froid → chaud : bleu (−10 °C) → gris (30 °C) → rouge (110 °C), indépendante du thème
function tcol(a,T){const t=Math.max(0,Math.min(1,(T-263)/120)),c0=[47,111,214],c1=[150,150,150],c2=[214,52,52];
  const m=(x,y,f)=>x.map((v,i)=>Math.round(v+(y[i]-v)*f)),t1=1/3,c=t<t1?m(c0,c1,t/t1):m(c1,c2,(t-t1)/(1-t1));return`rgb(${c.join(',')})`}

/* ---------- scène ---------- */
let hits=[], piston=null;
/* barres du bilan : ΔS = S_échangée + S_créée, même échelle, zéro au centre */
function barres(a,d,y0,W,H){
  const S=a.S,C=a.C,k=a.k,f=a.fmt,eq=d.equilibre!==false&&d.ds!==null&&d.ds!==undefined;let s=S.line(10*k,y0,W-10*k,y0,{c:C.rule,w:1});
  if(!eq)return s+S.text(W/2,y0+H/2,'Bilan d\'entropie défini seulement entre états d\'équilibre (état final)',{anchor:'middle',size:14,c:C.ink});
  const lab=70*k,x0=lab+(W-lab-110*k)/2,mxv=Math.max(1e-9,Math.abs(d.ds),Math.abs(d.Se),Math.abs(d.Sc),Math.abs(d.Se)+Math.abs(d.Sc)),sc=(W-lab-110*k)/2/mxv,bh=13*k,r1=y0+H*.32,r2=y0+H*.72;
  const bar=(xa,xb,y,c)=>Math.abs(xb-xa)<.5?'':S.rect(Math.min(xa,xb),y-bh/2,Math.abs(xb-xa),bh,{fill:c,rx:2*k});
  s+=S.line(x0,y0+6*k,x0,y0+H-4*k,{c:C.ink2,w:1});
  s+=S.text(10*k,r1,`Δ${S.v('S')}`,{size:15,c:C.ink})+bar(x0,x0+d.ds*sc,r1,C.cInk)+S.text(W-10*k,r1,`${f.sig(d.ds,3)} J·K${S.sup('−1')}`,{anchor:'end',size:14,c:C.ink});
  s+=S.text(10*k,r2,`= ${S.v('S','éch')} + ${S.v('S','c')}`,{size:13,c:C.ink})+bar(x0,x0+d.Se*sc,r2,C.B)+bar(x0+d.Se*sc,x0+(d.Se+d.Sc)*sc,r2,C.v)
    +S.text(W-10*k,r2,`${f.sig(d.Se,3)} + ${f.sig(d.Sc,3)}`,{anchor:'end',size:14,c:C.ink});
  return s;
}
/* message court dans la scène (remplace l'ancien bloc « À retenir ») */
function message(a,d){const s0=scen(a),q=prm(a),f=a.fmt;
  if(s0==='cafe')return Math.abs(q.Ti-q.Tb)<1e-9?'Températures égales : aucun échange, aucune création':q.N>1?`${q.N} thermostats successifs : moins d'entropie créée qu'avec un seul`:'Contact entre températures différentes : S créée > 0';
  if(s0==='contact')return a.p.sys==='total'?'Échanges internes : ΔS de l\'ensemble isolé = S créée':a.p.sys==='a'?'A + contact : reçoit l\'entropie de B et toute la création':'Bloc homogène : S créée = 0, ΔS = S échangée';
  if(s0==='glace')return 'ΔH = 0 ; la fusion et l\'échange interne créent de l\'entropie';
  if(s0==='adiabatique')return 'Adiabatique réversible : S éch = 0 et S créée = 0 (isentropique)';
  if(s0==='isotherme')return 'Isotherme réversible : S créée = 0, S éch = Q/T';
  if(s0==='libre')return 'Détente libre : mêmes états que l\'isotherme, mais S créée = ΔS';
  if(s0==='cycle')return 'Sur le cycle ΔS = 0, mais S créée > 0 (étape C → A monotherme)';
  return q.meme?(Math.abs(q.nA/q.VA-q.nB/q.VB)<1e-9?'Même gaz à la même pression : rien ne change, ΔS = 0':'Même gaz à des pressions différentes : ΔS > 0'):'Gaz différents : le mélange est irréversible, S créée > 0';
}
function scene(a,d){
  const P=a.panels.scene,S=a.S,C=a.C,k=a.k,w=P.w,BH=Math.min(84*k,P.h*.3),h=P.h-BH;let s='';hits=[];piston=null;
  const s0=scen(a);
  if(s0==='cafe'){const q=prm(a);
    const Tth=d.Tth??q.Tb;s+=S.rect(8*k,8*k,w-16*k,h-16*k,{fill:tcol(a,Tth),fop:.18,c:C.rule,rx:10*k});
    s+=S.text(18*k,22*k,q.N>1?`Thermostat ${d.k} sur ${q.N}`:'Air ambiant · thermostat',{size:13})+S.text(w-18*k,22*k,`${a.fmt.fix(Tth-TK,1)} °C`,{anchor:'end',size:14,c:C.ink,weight:600});
    const bw=Math.min(w*.34,h*.6),bh=bw*1.15,bx=w/2-bw/2-8*k,by=h/2-bh/2+6*k,hd=Math.min(20*k,bh*.18);
    s+=S.rect(bx+1.5*k,by+bh*.1,bw-3*k,bh*.9-1.5*k,{fill:tcol(a,d.T),fop:.75});
    s+=S.path(`M${bx},${by}V${by+bh}H${bx+bw}V${by}`,{c:C.ink2,w:3})+S.path(`M${bx+bw},${by+bh*.53-hd}A${hd},${hd} 0 0 1 ${bx+bw},${by+bh*.53+hd}`,{c:C.ink2,w:3});
    s+=S.text(bx+bw/2,by+bh*.3,'Café',{anchor:'middle',size:14,c:C.ink})+S.text(bx+bw/2,by+bh*.62,`${a.fmt.fix(d.T-TK,1)} °C`,{anchor:'middle',size:18,c:C.ink,weight:600});
    s+=S.rect(bx-12*k,by-12*k,bw+hd+30*k,bh+24*k,{c:C.cInk,w:1.5,dash:`${5*k} ${4*k}`,rx:8*k});
    s+=S.text(w/2,by+bh+28*k,'Σ : café + contact',{anchor:'middle',size:13,c:C.cInk});
    const dT=d.T-(d.Tth??q.Tb);if(Math.abs(dT)>.01){const y=by+bh*.25,L=36*k;for(const[x1,x2]of[[bx-14*k,bx-14*k-L],[bx+bw+hd+20*k,bx+bw+hd+20*k+L]])s+=dT>0?S.arrow(x1,y,x2,y,{c:C.hot,w:2.2}):S.arrow(x2,y,x1,y,{c:C.cold,w:2.2});
      s+=S.text(bx+bw+hd+22*k,y-14*k,S.v('Q'),{size:15,c:dT>0?C.hot:C.cold})}
  }
  else if(s0==='contact'){const q=prm(a),sys=a.p.sys;
    s+=S.rect(8*k,8*k,w-16*k,h-16*k,{c:sys==='total'?C.cInk:C.rule,w:sys==='total'?1.8:1,dash:`${7*k} ${5*k}`,rx:8*k});
    const bx=w*.1,by=h*.24,bw=w*.8,bh=h*.52;
    s+=S.rect(bx+1.5*k,by+bh*.1,bw-3*k,bh*.9-1.5*k,{fill:tcol(a,d.Ta),fop:.7});

  const nT=q.nA+q.nB,NA=Math.round(62*q.nA/nT),cA=C.hot,cB=q.meme?C.hot:C.cold,refl=z=>1-Math.abs((((z%2)+2)%2)-1),rad=3.2*k;
  for(const p of PARTS){const isA=p.i<NA,j=isA?p.i:p.i-NA,nn=isA?NA:62-NA,cols=Math.max(2,Math.round(Math.sqrt(nn*(isA?(xs-x):(x+bw-xs))/bh))),rows=Math.ceil(nn/cols);
    const x0=isA?x:xs,ww=isA?xs-x:x+bw-xs;let xx=x0+((j%cols)+.5+.25*Math.sin(p.px))/cols*ww,yy=y+((Math.floor(j/cols))+.5+.25*Math.sin(p.py))/rows*bh;
    if(u>0){const rx=bw-2*rad,ry=bh-2*rad;xx=x+rad+refl((xx-x-rad+Math.sin(p.px+1)*u*5*bw)/rx)*rx;yy=y+rad+refl((yy-y-rad+Math.sin(p.py+1)*u*4*bh)/ry)*ry}
    s+=S.circle(xx,yy,rad,{fill:isA?cA:cB})}
  s+=S.text(x+(xs-x)/2,y-16*k,`A : ${a.fmt.sig(q.nA,2)} mol · ${a.fmt.sig(q.VA*1000,3)} L`,{anchor:'middle',size:14,c:C.ink});
  s+=S.text(xs+(x+bw-xs)/2,y-16*k,`B : ${a.fmt.sig(q.nB,2)} mol · ${a.fmt.sig(q.VB*1000,3)} L`,{anchor:'middle',size:14,c:C.ink});
  s+=S.text(w/2,y+bh+22*k,u===0?'cloison en place':u<1?'diffusion : hors équilibre':'état final : mélange homogène',{anchor:'middle',size:14,c:C.ink});
  s+=S.text(w/2,h-46*k,`${S.v('T')} = ${a.fmt.sig(q.T,3)} K constante · ${S.v('Q')} = ${S.v('W')} = 0`,{anchor:'middle',size:13,c:C.cInk});
  return s;
}
