@media (forced-colors:active){
  .ak-switch-track{forced-color-adjust:none;background:Canvas;outline:1px solid CanvasText}
  .ak-switch-track::after{background:CanvasText}
  .ak-chk>input:checked+.ak-switch-track{background:Highlight}
  .ak-chk>input:checked+.ak-switch-track::after{background:HighlightText}
  .ak-chk>input:focus-visible+.ak-switch-track{outline:2px solid Highlight}
}
.ak-note{font-size:.8em;color:var(--ink2);margin:.3em 0 0}
.ak-dlg-sub{color:var(--ink2);font-style:italic}
.ak-drawer-head{display:none;justify-content:space-between;align-items:center;font-weight:600}
.ak-btn-settings{display:none}

/* ---------- projection ---------- */
.ak.is-proj .ak-body{grid-template-columns:minmax(0,1fr)}
.ak.is-proj .ak-right{display:contents}
.ak.is-proj .ak-metrics-wrap{display:none}
.ak.is-proj .ak-transport .ak-lbl{display:none}
.ak.is-proj .ak-play{min-width:6.6em}
.ak.is-proj .ak-side{position:absolute;top:var(--ak-top,calc(2.95em + 3px));right:0;bottom:0;width:19em;max-width:92%;background:var(--paper);border-left:1px solid var(--rule);padding:.7em;transform:translateX(105%);transition:transform .2s;box-shadow:-8px 0 24px rgb(0 0 0/.25);z-index:5;visibility:hidden}
.ak.is-proj.drawer-open .ak-side{transform:none;visibility:visible}
.ak.is-proj.drawer-open .ak-body{grid-template-columns:minmax(0,1fr) 19em}
.ak.is-proj.drawer-open .ak-right{display:flex}
.ak.is-proj.drawer-open .ak-metrics-wrap.has-items{display:flex}
.ak.is-proj.drawer-open .ak-side{position:static;width:auto;max-width:none;padding:0;background:none;border-left:0;box-shadow:none;transition:none}
.ak.is-proj .ak-drawer-head{display:flex}
.ak.is-proj .ak-btn-settings{display:inline-flex}

/* ---------- téléphone ---------- */
@media (max-width:640px){.ak{height:auto;min-height:100vh;min-height:100dvh;overflow:visible}}
@media (max-width:640px){
  .ak-chk{min-height:44px}
  .ak-body{grid-template-columns:minmax(0,1fr);padding:0 .4em .4em}
  .ak-sub,.ak-lbl{display:none}
  .ak-tools .ib{padding:.3em .45em}
  .ak-title{font-size:1.05em}
  .ak-ptools .mini{min-height:36px}
  .ak-ptools [data-z="0"]{min-width:36px}
  .ak-tools [data-act=image],.ak-tools [data-act=proj]{display:none}
  .ak-btn-settings{display:inline-flex}
  .ak-side{position:fixed;left:0;right:0;bottom:0;max-height:72%;background:var(--paper);border-top:1px solid var(--rule);border-radius:1em 1em 0 0;padding:.6em .9em 1em;transform:translateY(105%);transition:transform .2s;box-shadow:0 -8px 24px rgb(0 0 0/.3);z-index:5;visibility:hidden}
  .ak.drawer-open .ak-side{transform:none;visibility:visible}
  .ak-drawer-head{display:flex}
  .ak-panels{flex-direction:column;flex:none}
  .ak-panel{flex:none!important}
  .ak-scene{flex:none;overflow:visible}
  .ak-panel+.ak-panel{border-left:0;border-top:1px solid var(--rule)}
  .ak-panel>svg,.ak-panel>canvas{flex:none}
  .ak-right{display:contents}
  .ak-metrics{grid-template-columns:repeat(auto-fit,minmax(9em,1fr))}
  .ib,.ak-grp .mini,.ak-play,.ak-speed{min-height:44px}
  .ak-transport{position:sticky;bottom:0;background:var(--card);z-index:2}
}

/* ---------- disposition « atelier » ---------- */
.ak-atelier .ak-body{grid-template-columns:minmax(19em,5fr) minmax(0,7fr)}
.ak.ak-atelier .ak-right,.ak.ak-atelier.is-proj .ak-right{display:none}
.ak.ak-atelier .ak-btn-settings,.ak.ak-atelier.is-proj .ak-btn-settings{display:none}
.ak.ak-atelier.is-proj .ak-body{grid-template-columns:minmax(18em,4fr) minmax(0,8fr)}
.ak-saisie{margin-top:.6em;padding:.6em .8em;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:.4em;overscroll-behavior:contain}
.ak-zone-h{font-size:.72em;letter-spacing:.06em;text-transform:uppercase;color:var(--c-ink);font-weight:700}
.ak-res{padding:.45em .8em;flex:none}
.ak-detail{flex:none;padding:0 .8em}
.ak-detail summary{cursor:pointer;padding:.45em 0;font-size:.9em;font-weight:600;color:var(--c-ink)}
.ak-detail[open]{max-height:42%;overflow:auto}
.ak-detail-body{padding:0 0 .6em}
@media (max-width:640px){
  .ak-atelier .ak-body{grid-template-columns:minmax(0,1fr)}
  .ak-atelier .ak-saisie{margin-top:.4em;overflow:visible}
  .ak-atelier .ak-detail[open]{max-height:none;overflow:visible}
}

/* ---------- aide, messages ---------- */
.ak-dialog{max-width:min(680px,92vw);max-height:85vh;border:1px solid var(--rule);border-radius:12px;background:var(--card);color:var(--ink);padding:0;font-family:var(--font)}
.ak-dialog::backdrop{background:rgb(0 0 0/.45)}
.ak-dialog header{display:flex;align-items:center;justify-content:space-between;gap:1em;padding:12px 16px;border-bottom:3px solid var(--c-btn);position:sticky;top:0;background:var(--card)}
.ak-dialog h3{margin:0;font-size:17px}
.ak-dialog .db{padding:4px 16px 16px;font-size:15px}
.ak-dialog h4{color:var(--c-ink);margin:14px 0 4px;font-size:15px}
.ak-dialog p,.ak-dialog li{margin:.3em 0}
.ak-dialog kbd{font:12px var(--font);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 5px}
.ak-toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.ak-toast.show{opacity:1}
@media print{.ak-tools,.ak-side,.ak-metrics-wrap,.ak-transport{display:none}}

/* Bandeau commun & retour sommaire */
.ak-menu-commun .ak-top{flex-wrap:wrap;gap:6px 12px}
.ak-menu-commun .ak-tools{flex:0 1 auto;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:100%}
.ak-menu-commun .ak-tools .ib{min-height:40px;padding:0 10px;font-size:15px}
.ak-menu-commun .ak-tools [data-act="fs"]{width:40px;padding:0}
.ak-menu-commun .ak-tools .ak-btn-settings{display:none}
@media(max-width:820px){
  .ak-menu-commun .ak-tools{margin-left:0;flex:1 0 100%;justify-content:flex-start}
}
@media(max-width:640px){
  .ak-menu-commun .ak-tools{gap:4px}
  .ak-menu-commun .ak-tools .ib{min-height:44px;padding:0 6px;font-size:13px}
  .ak-menu-commun .ak-tools .ak-lbl{display:inline}
  .ak-menu-commun .ak-tools .ib svg{display:none}
  .ak-menu-commun .ak-tools [data-act="fs"]{width:44px;padding:0}
  .ak-menu-commun .ak-tools [data-act="fs"] svg{display:block}
  .ak-menu-commun .ak-tools [data-act="image"],
  .ak-menu-commun .ak-tools [data-act="proj"],
  .ak-menu-commun:not(.is-proj) .ak-tools .ak-btn-settings{display:inline-flex}
}
.ak-sommaire{text-decoration:none}
.ak-sommaire:focus-visible{outline:2px solid var(--c-ink);outline-offset:2px}
@media(max-width:960px){
  .ak.is-proj:not(.ak-menu-commun) .ak-top{flex-wrap:wrap}
  .ak.is-proj:not(.ak-menu-commun) .ak-titles{flex:1}
  .ak.is-proj:not(.ak-menu-commun) .ak-tools{max-width:100%;flex-wrap:wrap;justify-content:flex-end}
}
@media(max-width:640px){
  .ak-tools .ak-sommaire .ak-lbl{display:none}
  .ak-tools .ak-sommaire.ib svg{display:block}
  .ak-menu-commun .ak-tools .ak-sommaire{width:44px;padding:0}
}

/* =====================================================================
   Progressi · progressi.css — Extensions au kit commun AnimKit (anim.css)
   ===================================================================== */
:root{
  --chap: var(--Anthracite);
  --ok: #1f7552;
  --warn: #b45309;
  --err: #c62f36;
}
:root[data-theme="dark"]{
  --ok: #4fd69a;
  --warn: #fbbf24;
  --err: #ff6b72;
}

/* ---------- Structure globale alignée AnimKit ---------- */
.ak.pr-app{ --fs: 15.5px; }
.ak.pr-app.is-proj{ --fs: 21px; }
.pr-app .ak-body{
  grid-template-columns: minmax(0,1fr) 21.5em;
}
.pr-app.is-proj .ak-body{
  grid-template-columns: minmax(0,1fr);
}
.pr-app.is-proj .ak-right{
  display: none;
}
.pr-app.is-proj.proj-panel-open .ak-body{
  grid-template-columns: minmax(0,1fr) 20em;
}
.pr-app.is-proj.proj-panel-open .ak-right{
  display: flex;
}
@media (max-width: 960px){
  .pr-app .ak-body{ grid-template-columns: minmax(0,1fr); }
  .pr-app .ak-right{
    display: none; position: fixed; top: 3.4em; right: .5em; bottom: .5em;
    width: min(22em, 92vw); z-index: 60; background: var(--paper);
    padding: .5em; border-radius: .65em; border: 1px solid var(--rule);
    box-shadow: 0 12px 32px rgb(0 0 0 / .45);
  }
  .pr-app.narrow-panel-open .ak-right{ display: flex; }
}

.pr-app .ak-right{
  overflow-y: auto; overscroll-behavior: contain; padding: .6em .2em .8em 0;
  gap: .55em; display: flex; flex-direction: column;
}
.pr-right-head{
  display: none; align-items: center; justify-content: space-between;
  padding-bottom: .35em; border-bottom: 1px solid var(--rule); flex: none;
  font-size: .82em; font-weight: 700; color: var(--c-ink);
}
.pr-app.is-proj.proj-panel-open .pr-right-head{ display: flex; }
@media (max-width: 960px){
  .pr-app.narrow-panel-open .pr-right-head{ display: flex; }
}

/* Panneaux principaux par onglet */
.pr-tab-view{ display: none; flex: 1; min-height: 0; flex-direction: column; }
.pr-tab-view.act{ display: flex; }
.pr-side-view{ display: none; flex-direction: column; gap: .55em; flex: none; }
.pr-side-view.act{ display: flex; }

/* Sections panneau droit */
.pr-sec{
  background: var(--card); border: 1px solid var(--rule); border-radius: .6em;
  padding: .6em .7em; display: flex; flex-direction: column; gap: .45em; flex: none;
}
.pr-sec-h{
  font-size: .76em; font-weight: 750; letter-spacing: .06em; text-transform: uppercase;
  color: var(--c-ink); display: flex; align-items: center; justify-content: space-between;
  padding-bottom: .25em; border-bottom: 1px solid var(--rule); flex: none;
}
.pr-subbox{
  background: color-mix(in srgb, var(--paper) 65%, var(--card));
  border: 1px solid var(--rule); border-radius: .48em;
  padding: .48em .55em; display: flex; flex-direction: column; gap: .4em; flex: none;
}

/* Contrôles compacts */
.pr-row{ display: flex; align-items: center; gap: .38em; flex-wrap: wrap; flex: none; }
.pr-grid2{ display: grid; grid-template-columns: 1fr 1fr; gap: .42em; flex: none; }
.pr-grid3{ display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .35em; flex: none; }
.pr-fld{ display: flex; flex-direction: column; gap: .18em; min-width: 0; }
.pr-fld > span{ font-size: .76em; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr-fld input[type="text"], .pr-fld input[type="number"], .pr-fld input:not([type]),
.pr-fld select, .pr-fld textarea, .pr-inp{
  width: 100%; min-width: 0; padding: .28em .45em; font-size: .88em;
  border: 1px solid var(--rule); border-radius: .38em;
  background: var(--paper); color: var(--ink);
}
.pr-fld input:focus, .pr-fld select:focus, .pr-fld textarea:focus{
  outline: 2px solid var(--c-btn); outline-offset: -1px;
}
.pr-fld input[type="range"]{ width: 100%; accent-color: var(--c-btn); margin: .2em 0; }
.pr-muted{ color: var(--ink2); font-size: .82em; margin: 0; }
.pr-meta{ font-size: .78em; color: var(--ink2); line-height: 1.35; }
.pr-switches{ display: grid; grid-template-columns: 1fr 1fr; gap: .25em .5em; flex: none; }
.pr-switches .ak-chk{ font-size: .84em; min-height: 28px; }
.ib.armed{ outline: 2.5px solid var(--warn); outline-offset: 1px; }

/* Barre d'outils locale en haut de la scène */
.pr-bar{
  display: flex; align-items: center; gap: .35em .38em; flex-wrap: wrap;
  padding: .4em .58em; border-bottom: 1px solid var(--rule);
  background: color-mix(in srgb, var(--paper) 45%, var(--card)); flex: none;
}
.pr-bar-sub{
  padding: .3em .58em;
  background: color-mix(in srgb, var(--paper) 75%, var(--card));
}
.pr-bar .sep{ width: 1px; height: 1.35em; background: var(--rule); margin: 0 .18em; flex: none; }
.pr-bar select, .pr-bar input:not([type="checkbox"]){
  padding: .22em .45em; font-size: .84em; border: 1px solid var(--rule);
  border-radius: .38em; background: var(--card); color: var(--ink); flex: none;
}
.pr-bar .ib{ padding: .24em .58em; min-height: 2.05em; font-size: .83em; flex: none; }
.pr-bar .mini{ padding: .2em .55em; min-height: 1.95em; font-size: .82em; flex: none; }
.pr-bar-lbl{ font-size: .78em; color: var(--ink2); margin-right: .1em; white-space: nowrap; }

/* ---------- Onglet 1 : Données (Tableur + Feuille de calcul) ---------- */
.pr-data-split{ flex: 1; min-height: 0; display: flex; flex-direction: column; }
.pr-table-wrap{ flex: 1; min-height: 0; overflow: auto; position: relative; }
.pr-table{
  border-collapse: collapse; font-size: .86em; font-variant-numeric: tabular-nums;
  width: max-content; min-width: 100%;
}
.pr-table th, .pr-table td{
  border: 1px solid var(--rule); padding: .18em .45em; text-align: right;
  min-width: 6.2em; height: 1.9em;
}
.pr-table th{
  position: sticky; top: 0; z-index: 3; background: var(--paper);
  text-align: center; font-weight: 650; cursor: pointer; user-select: none;
}
.pr-table th:hover{ background: var(--c-soft); }
.pr-table th .sw{ display: inline-block; width: .65em; height: .65em; border-radius: 50%; margin-right: .3em; vertical-align: middle; }
.pr-table th small{ display: block; font-weight: 400; font-size: .78em; color: var(--ink2); }
.pr-table td.idx, .pr-table th.idx{
  position: sticky; left: 0; z-index: 2; background: var(--paper); color: var(--ink2);
  min-width: 3.1em; width: 3.1em; text-align: center; cursor: default;
}
.pr-table th.idx{ z-index: 4; }
.pr-table td input{
  width: 100%; border: 0; background: transparent; text-align: right;
  padding: 0; font-variant-numeric: tabular-nums;
}
.pr-table td input:focus{ outline: 2px solid var(--c-btn); border-radius: 2px; background: var(--c-soft); }
.pr-table td.excluded{ opacity: .45; text-decoration: line-through; }

.pr-calc-pane{
  border-top: 2px solid var(--rule); display: flex; flex-direction: column;
  height: 36%; min-height: 150px; background: var(--card);
}
.pr-calc-pane.full{ height: 100%; border-top: 0; }
.pr-calc-pane[hidden]{ display: none; }
.pr-calc-body{ flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 16em; }
@media (max-width: 900px){ .pr-calc-body{ grid-template-columns: 1fr; } .pr-calc-help{ display: none; } }
.pr-calc-ta{
  width: 100%; height: 100%; border: 0; resize: none; padding: .6em .8em;
  font: .88em/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: var(--card); color: var(--ink); outline: none;
}
.pr-calc-help{
  border-left: 1px solid var(--rule); padding: .5em .65em; overflow: auto;
  font-size: .76em; color: var(--ink2); background: var(--paper); line-height: 1.5;
}
.pr-calc-help code{
  background: var(--c-soft); color: var(--c-ink); padding: .05em .28em;
  border-radius: 3px; cursor: pointer; font-family: ui-monospace, Consolas, monospace;
}
.pr-calc-msg{
  padding: .3em .7em; font-size: .8em; border-top: 1px solid var(--rule);
  background: var(--paper); min-height: 1.9em;
}
.pr-calc-msg.ok{ color: var(--ok); }
.pr-calc-msg.err{ color: var(--err); }

/* Liste de variables (panneau droit) */
.pr-vlist{ list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .22em; max-height: 17em; overflow: auto; }
.pr-vlist li{
  display: flex; align-items: center; gap: .4em; padding: .28em .42em;
  border: 1px solid transparent; border-radius: .38em; font-size: .85em;
}
.pr-vlist li:hover{ background: var(--c-soft); border-color: var(--rule); }
.pr-vlist .sw{ width: .75em; height: .75em; border-radius: 50%; flex: none; }
.pr-vlist .nm{ flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.pr-vlist .un{ color: var(--ink2); font-weight: 400; font-size: .88em; }
.pr-vlist .ct{ color: var(--ink2); font-size: .8em; }
.pr-vlist .act{ display: flex; gap: .18em; }
.pr-vlist .mini{ padding: .08em .36em; min-height: 1.5em; font-size: .78em; }

/* ---------- Onglet 2 : Pointage vidéo ---------- */
.pr-vstage{
  flex: 1; min-height: 0; position: relative; overflow: hidden;
  background: #0b0c10; display: flex; align-items: center; justify-content: center;
}
.pr-vframe, .pr-vov{ position: absolute; touch-action: none; }
.pr-vov{ z-index: 2; }
.pr-loupe{
  position: absolute; top: 12px; left: 12px;
  width: min(268px, 34vw); height: min(268px, 34vw);
  border-radius: 10px; border: 2.5px solid #fde047;
  box-shadow: 0 6px 24px rgb(0 0 0 / .75); z-index: 4; display: none; pointer-events: none;
}
.pr-vempty, .pr-vfallback{
  position: absolute; inset: 0; z-index: 5; display: flex; align-items: center;
  justify-content: center; padding: 1.2em; background: rgb(12 14 18 / .84);
}
.pr-vempty[hidden], .pr-vfallback[hidden]{ display: none; }
.pr-vempty-card{
  max-width: 30em; text-align: center; background: var(--card); color: var(--ink);
  border: 1px solid var(--rule); border-radius: .7em; padding: 1.2em 1.5em;
  display: flex; flex-direction: column; gap: .55em; align-items: center;
}
.pr-vprog{
  width: 100%; margin-top: .5em; background: var(--paper); border: 1px solid var(--rule);
  border-radius: 6px; padding: .35em; text-align: center;
}
.pr-vprog-bar{ height: 6px; width: 0%; background: var(--c-btn); border-radius: 4px; transition: width .2s; margin-bottom: .3em; }
.pr-vprog-txt{ font-size: .8em; color: var(--ink2); }
.pr-vtrans{ flex-wrap: nowrap; overflow-x: auto; }
.pr-vtrans .ib{ padding: .24em .5em; min-height: 2em; font-size: .82em; flex: none; }
.pr-vtrans .ak-play{ min-width: 5.8em; flex: none; }
.pr-vtrans .ak-scrub{ min-width: 7em; flex: 1 1 8em; }
.pr-vtrans .ak-clock{
  font-size: .83em; flex: none; min-width: 24ch; text-align: right;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums; margin-left: .2em;
}

/* ---------- Onglet 3 & 4 : Graphiques & Ajustements ---------- */
.pr-plot-wrap{ flex: 1; min-height: 0; position: relative; }
.pr-canvas{ position: absolute; inset: 0; display: block; touch-action: none; }
.pr-status{
  display: flex; align-items: center; justify-content: space-between; gap: .8em;
  padding: .28em .7em; font-size: .8em; color: var(--ink2);
  border-top: 1px solid var(--rule); background: var(--paper); flex: none;
  font-variant-numeric: tabular-nums;
}
.pr-views-bar{ display: flex; gap: .25em; align-items: center; }

/* Tableau des paramètres du modèle */
.pr-ptbl{ width: 100%; border-collapse: collapse; font-size: .82em; }
.pr-ptbl th, .pr-ptbl td{ padding: .18em .28em; border-bottom: 1px solid var(--rule); text-align: left; }
.pr-ptbl th{ color: var(--ink2); font-weight: 600; font-size: .86em; }
.pr-ptbl input[type="text"]{
  width: 100%; padding: .16em .32em; border: 1px solid var(--rule);
  border-radius: 4px; background: var(--paper); font-variant-numeric: tabular-nums;
}

/* Carte résultats d'ajustement (lisible même en projection) */
.pr-res-box{
  background: var(--paper); border: 1px solid var(--rule); border-radius: .48em;
  padding: .55em .65em; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: .82em; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
}
.pr-badge-ok{ display: inline-block; padding: .08em .45em; border-radius: 99px; font-size: .78em; font-weight: 700; background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.pr-badge-warn{ display: inline-block; padding: .08em .45em; border-radius: 99px; font-size: .78em; font-weight: 700; background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pr-badge-err{ display: inline-block; padding: .08em .45em; border-radius: 99px; font-size: .78em; font-weight: 700; background: color-mix(in srgb, var(--err) 18%, transparent); color: var(--err); }

/* Sélecteur de sous-outils Onglet 4 */
.pr-pills{ display: flex; flex-wrap: wrap; gap: .28em; }
.pr-pills .mini{ flex: 1 1 auto; text-align: center; }

/* Courbes cochables */
.pr-clist{ display: flex; flex-direction: column; gap: .22em; max-height: 11em; overflow-y: auto; flex: none; }
.pr-citem{

    for (let i = 0; i < n; i++) {
      sx += x[i]; sy += y[i]; sxx += x[i] * x[i]; sxy += x[i] * y[i];
    }
    const den = n * sxx - sx * sx;
    const a = Math.abs(den) > 1e-30 ? (n * sxy - sx * sy) / den : 0;
    return [a, (sy - a * sx) / n];
  }

  function polyfit(x, y, deg) {
    const m = deg + 1;
    const A = Array.from({ length: m }, () => new Array(m).fill(0));
    const b = new Array(m).fill(0);
    // Normalisation pour stabilité numérique
    const [x0, x1] = range(x);
    const xm = 0.5 * (x0 + x1), xs = Math.max(1e-12, 0.5 * (x1 - x0));
    for (let i = 0; i < x.length; i++) {
      const u = (x[i] - xm) / xs;
      const pw = [1];
      for (let k = 1; k < 2 * m; k++) pw[k] = pw[k - 1] * u;
      for (let a = 0; a < m; a++) {
        b[a] += pw[a] * y[i];
        for (let c = 0; c < m; c++) A[a][c] += pw[a + c];
      }
    }
    const cu = solve(A, b);
    if (!cu) return new Array(m).fill(0);
    // Reconvertir en base x : somme cu[k] * ((x - xm)/xs)^k
    const cx = new Array(m).fill(0);
    const binom = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - i + 1) / i; return r; };
    for (let k = 0; k < m; k++) {
      const f = cu[k] / Math.pow(xs, k);
      for (let j = 0; j <= k; j++) cx[j] += f * binom(k, j) * Math.pow(-xm, k - j);
    }
    return cx; // ordre croissant c0, c1, ..., cd
  }

  function estFreq(x, y) {
    const [lo, hi] = range(y), mid = 0.5 * (lo + hi);
    const hyst = 0.08 * (hi - lo);
    const cr = [];
    let armed = false;
    for (let i = 1; i < y.length; i++) {
      if (y[i] < mid - hyst) armed = true;
      if (armed && y[i - 1] < mid && y[i] >= mid) { cr.push(x[i]); armed = false; }
    }
    if (cr.length >= 2) return (cr.length - 1) / (cr[cr.length - 1] - cr[0]);
    return 1 / ((x[x.length - 1] - x[0]) || 1);
  }

  // Initialisation optimale globale pour le modèle bi-affine (dosage conductimétrique)
  function initBiAffine(x, y) {
    const idx = Array.from({ length: x.length }, (_, i) => i).sort((a, b) => x[a] - x[b]);
    const sx = idx.map(i => x[i]), sy = idx.map(i => y[i]);
    const n = sx.length;
    if (n < 4) return [0.5 * (sx[0] + sx[n - 1]), sy[0], 0, 0];
    let bestS = Infinity, best = [0.5 * (sx[0] + sx[n - 1]), sy[n >> 1], -1, 1];
    const step = Math.max(1, Math.floor(n / 80));
    for (let k = 2; k <= n - 2; k += step) {
      const xe = 0.5 * (sx[k - 1] + sx[k]);
      // Moindres carrés exacts pour y = ye + a1*(x-xe)*I(x<=xe) + a2*(x-xe)*I(x>xe)
      const A = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], B = [0, 0, 0];
      for (let i = 0; i < n; i++) {
        const dx = sx[i] - xe;
        const v = [1, dx <= 0 ? dx : 0, dx > 0 ? dx : 0];
        for (let a = 0; a < 3; a++) {
          B[a] += v[a] * sy[i];
          for (let b = 0; b < 3; b++) A[a][b] += v[a] * v[b];
        }
      }
      const sol = solve(A, B);
      if (!sol) continue;
      let S = 0;
      for (let i = 0; i < n; i++) {
        const dx = sx[i] - xe;
        const yh = sol[0] + (dx <= 0 ? sol[1] * dx : sol[2] * dx);
        S += (sy[i] - yh) ** 2;
      }
      if (S < bestS) { bestS = S; best = [xe, sol[0], sol[1], sol[2]]; }
    }
    return best;
  }

  // Levenberg-Marquardt pondéré (supporte poids w[i] = 1/sigma_i^2 et paramètres fixés)
  function lm(f, x, y, p0, opts = {}) {
    const n = x.length, m = p0.length;
    let p = p0.slice();
    const fixed = opts.fixed || new Array(m).fill(false);
    const sigmas = opts.sigmas || null; // sigma_eff[i] si pondéré
    const w = sigmas ? Float64Array.from(sigmas, s => (s > 0 && isFinite(s) ? 1 / (s * s) : 1)) : null;

    const cost = pp => {
      let s = 0;
      for (let i = 0; i < n; i++) {
        const r = y[i] - f(x[i], pp);
        s += w ? w[i] * r * r : r * r;
      }
      return s;
    };

    let S = cost(p);
    if (!isFinite(S)) S = Infinity;
    let lambda = 1e-3;
    const maxIter = opts.maxIter || 250;

    for (let it = 0; it < maxIter; it++) {
      const h = p.map(v => (Math.abs(v) > 1e-12 ? Math.abs(v) * 1e-6 : 1e-7));
      const A = Array.from({ length: m }, () => new Float64Array(m));
      const g = new Float64Array(m);
      for (let i = 0; i < n; i++) {
        const fi = f(x[i], p);
        const ri = y[i] - fi;
        const wi = w ? w[i] : 1;
        const Ji = new Float64Array(m);
        for (let k = 0; k < m; k++) {
          if (fixed[k]) continue;
          const pk = p[k];
          p[k] = pk + h[k];
          const fp = f(x[i], p);
          p[k] = pk - h[k];
          const fm = f(x[i], p);
          p[k] = pk;
          Ji[k] = isFinite(fp) && isFinite(fm) ? (fp - fm) / (2 * h[k]) : (fp - fi) / h[k];
        }
        for (let a = 0; a < m; a++) {
          if (fixed[a]) continue;
          g[a] += wi * Ji[a] * ri;
          for (let b = 0; b <= a; b++) {
            if (!fixed[b]) A[a][b] += wi * Ji[a] * Ji[b];
          }
        }
      }
      for (let a = 0; a < m; a++) for (let b = 0; b < a; b++) A[b][a] = A[a][b];

      let improved = false;
      for (let tries = 0; tries < 14; tries++) {
        const B = A.map((row, a) => Array.from(row, (v, b) =>
          (a === b ? (fixed[a] ? 1 : v * (1 + lambda) + 1e-24) : (fixed[a] || fixed[b] ? 0 : v))
        ));
        const gg = Array.from(g, (v, a) => (fixed[a] ? 0 : v));
        const d = solve(B, gg);
        if (!d) { lambda *= 10; continue; }
        const pn = p.map((v, k) => (fixed[k] ? v : v + d[k]));
        const Sn = cost(pn);
        if (isFinite(Sn) && Sn <= S) {
          const rel = (S - Sn) / (S || 1);
          p = pn; S = Sn; lambda = Math.max(lambda / 8, 1e-12); improved = true;
          if (rel < 1e-12) it = maxIter;
          break;
        }
        lambda *= 10;
      }
      if (!improved) break;
    }

    // Résidus et statistiques
    const resid = new Float64Array(n);
    const zscores = new Float64Array(n);
    let ym = 0, Sraw = 0, chi2 = 0, zmax = 0;
    for (let i = 0; i < n; i++) ym += y[i];
    ym /= n;
    let St = 0;
    for (let i = 0; i < n; i++) {
      const r = y[i] - f(x[i], p);
      resid[i] = r;
      Sraw += r * r;
      St += (y[i] - ym) ** 2;
      if (sigmas && sigmas[i] > 0) {
        const z = r / sigmas[i];
        zscores[i] = z;
        chi2 += z * z;
        if (Math.abs(z) > zmax) zmax = Math.abs(z);
      } else {
        zscores[i] = NaN;
      }
    }
    const mFree = p.reduce((acc, _, k) => acc + (fixed[k] ? 0 : 1), 0);
    const dof = Math.max(1, n - mFree);
    const r2 = St > 0 ? 1 - Sraw / St : 1;
    const rmse = Math.sqrt(Sraw / n);
    const chi2red = sigmas ? chi2 / dof : NaN;

    // Covariance & incertitudes-types analytiques
    const sig = new Array(m).fill(NaN);
    const freeIdx = [];
    for (let k = 0; k < m; k++) if (!fixed[k]) freeIdx.push(k);
    if (freeIdx.length > 0) {
      try {
        const mf = freeIdx.length;
        const h = p.map(v => (Math.abs(v) > 1e-12 ? Math.abs(v) * 1e-6 : 1e-7));
        const A = Array.from({ length: mf }, () => new Array(mf).fill(0));
        for (let i = 0; i < n; i++) {
          const wi = w ? w[i] : 1;
          const Ji = new Float64Array(mf);
          for (let a = 0; a < mf; a++) {
            const k = freeIdx[a], pk = p[k];
            p[k] = pk + h[k]; const fp = f(x[i], p);
            p[k] = pk - h[k]; const fm = f(x[i], p);
            p[k] = pk;
            Ji[a] = (fp - fm) / (2 * h[k]);
          }
          for (let a = 0; a < mf; a++) for (let b = 0; b < mf; b++) A[a][b] += wi * Ji[a] * Ji[b];
        }
        const C = invert(A);
        if (C) {
          const scale = w ? 1 : (Sraw / dof);
          for (let a = 0; a < mf; a++) sig[freeIdx[a]] = Math.sqrt(Math.max(0, C[a][a] * scale));
        }
      } catch (_) {}
    }
    for (let k = 0; k < m; k++) if (fixed[k]) sig[k] = 0;

    return { p, S: Sraw, r2, rmse, sig, resid, zscores, chi2red, zmax, dof, weighted: !!w };
  }

  // ODR / variance effective (Orear) quand ux et/ou uy sont fournis
  function lmODR(f, x, y, p0, opts = {}) {
    const ux = opts.ux || null, uy = opts.uy || null;
    const hasUx = ux && ux.some(v => v > 0 && isFinite(v));
    const hasUy = uy && uy.some(v => v > 0 && isFinite(v));
    if (!hasUx && !hasUy) return lm(f, x, y, p0, opts);

    const n = x.length;
    const baseUy = Float64Array.from({ length: n }, (_, i) => (hasUy && uy[i] > 0 && isFinite(uy[i]) ? uy[i] : 0));
    const baseUx = Float64Array.from({ length: n }, (_, i) => (hasUx && ux[i] > 0 && isFinite(ux[i]) ? ux[i] : 0));
    // Estimation initiale
    let sigmas = hasUy ? Float64Array.from(baseUy, v => (v > 0 ? v : 1)) : null;
    let res = lm(f, x, y, p0, { ...opts, sigmas });
    if (!hasUx) return { ...res, sigEff: sigmas };

    const [x0, x1] = range(x);
    const dxStep = Math.max(1e-9, (x1 - x0) * 1e-5);
    for (let outer = 0; outer < 4; outer++) {
      sigmas = new Float64Array(n);
      for (let i = 0; i < n; i++) {
        const df = (f(x[i] + dxStep, res.p) - f(x[i] - dxStep, res.p)) / (2 * dxStep);
        const s2 = baseUy[i] * baseUy[i] + (isFinite(df) ? df * df : 0) * baseUx[i] * baseUx[i];
        sigmas[i] = s2 > 0 ? Math.sqrt(s2) : 1e-12;
      }
      res = lm(f, x, y, res.p, { ...opts, sigmas, maxIter: 120 });
    }
    return { ...res, sigEff: sigmas };
  }

  // Propagation Monte-Carlo des incertitudes (N tirages gaussiens sur x et y)
  function monteCarlo(f, x, y, pOpt, ux, uy, opts = {}) {
    const N = opts.trials || 300;
    const n = x.length, m = pOpt.length;
    const randn = () => {
      let u = 0;
      while (!u) u = Math.random();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * Math.random());
    };
    const samples = Array.from({ length: m }, () => []);
    const xt = new Float64Array(n), yt = new Float64Array(n);
    for (let t = 0; t < N; t++) {
      for (let i = 0; i < n; i++) {
        xt[i] = x[i] + (ux && ux[i] > 0 ? ux[i] * randn() : 0);
        yt[i] = y[i] + (uy && uy[i] > 0 ? uy[i] * randn() : 0);
      }
      const r = lm(f, xt, yt, pOpt, { fixed: opts.fixed, sigmas: opts.sigEff, maxIter: 30 });
      if (r.p.every(isFinite)) {
        for (let k = 0; k < m; k++) samples[k].push(r.p[k]);
      }
    }
    const mean = new Array(m).fill(NaN), sig = new Array(m).fill(NaN);
    for (let k = 0; k < m; k++) {
      const a = samples[k];
      if (a.length < 10) continue;
      let s = 0; for (const v of a) s += v;
      const mu = s / a.length;
      let v2 = 0; for (const v of a) v2 += (v - mu) ** 2;
      mean[k] = mu;
      sig[k] = Math.sqrt(v2 / (a.length - 1));
    }
    return { mean, sig, nOk: samples[0].length };
  }

  function runModel(model, x, y, opts = {}) {
    const userExpr = opts.userExpr || '';
    const expr = model.params ? model.expr : userExpr;
    if (!expr || !expr.trim()) throw new Error('Saisissez une expression de modèle (variable x)');
    const pnames = model.params || Expr.freeSymbols(expr, 'x');
    if (!pnames.length) throw new Error('Aucun paramètre libre détecté dans le modèle');
    const { fn } = Expr.compileScalar(expr, 'x', pnames);

    ctx.font = `600 ${B.fs}px system-ui,sans-serif`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    let lx = B.l + 4;
    const ly = B.hasTitle ? Math.round(B.t - B.fs * 0.9) : Math.round(B.t * 0.5);
    for (const n of this.curves) {
      const c = this.store.curve(n); if (!c) continue;
      const lab = c.name + (c.unit ? ` (${c.unit})` : '') + (c.axis === 'd' ? ' →' : '');
      ctx.strokeStyle = c.color; ctx.lineWidth = 2.6;
      if (c.dash) ctx.setLineDash([5, 3]);
      ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + 16, ly); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = C.fg;
      ctx.fillText(lab, lx + 21, ly);
      lx += 30 + ctx.measureText(lab).width;
      if (lx > B.r - 40) break;
    }

    // --- Encart résultats du modèle (écran + PNG) ---
    if (this.showFitBox && this.fitBoxLines && this.fitBoxLines.length) {
      this._drawFitBox(ctx, C);
    }

    // --- Sous-graphe des résidus ---
    if (B.resBox) this._drawResiduals(ctx, B.resBox, C);

    // --- Curseurs, survol intelligent, mesure 2 pts & cadre de zoom ---
    if (!opts.forceLight) {
      this._drawCursors(ctx, C);
      if (this.dragBox) {
        const d = this.dragBox;
        ctx.strokeStyle = C.accent; ctx.lineWidth = 1.4; ctx.setLineDash([4, 3]);
        ctx.strokeRect(d.x0, d.y0, d.x1 - d.x0, d.y1 - d.y0);
        ctx.setLineDash([]);
      }
    }
  }

  _drawFitBox(ctx, C) {
    const B = this.box, lines = this.fitBoxLines;
    const fs = Math.max(10.5, B.fs - 1);
    const lh = fs + 4.5;
    ctx.save();
    ctx.font = `500 ${fs}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;
    const w = Math.min(B.r - B.l - 16, Math.max(...lines.map(l => ctx.measureText(l).width)) + 16);
    const h = lines.length * lh + 10;
    const bx = B.r - w - 10, by = B.t + 10;
    ctx.fillStyle = C.bg; ctx.globalAlpha = 0.92;
    ctx.strokeStyle = C.axis; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(bx, by, w, h, 6); ctx.fill(); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = C.fg; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    lines.forEach((l, i) => {
      if (i === 0) ctx.font = `700 ${fs}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;
      else ctx.font = `500 ${fs}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;
      ctx.fillText(l, bx + 8, by + 5 + i * lh, w - 16);
    });
    ctx.restore();
  }

  _drawHandles(ctx, C) {
    const B = this.box;
    ctx.save();
    for (const h of this.handles) {
      const px = this.X(h.x), py = this.Y(h.y);
      if (!isFinite(px) || !isFinite(py)) continue;
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = h.color || '#38bdf8';
      ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.arc(px, py, 6.5, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
      if (h.label) {
        ctx.font = `700 ${Math.max(11, B.fs - 1)}px system-ui,sans-serif`;
        ctx.fillStyle = h.color || '#38bdf8';
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillText(h.label, px, py - 10);
      }
    }
    ctx.restore();
  }

  _drawCurve(ctx, name, C) {
    const c = this.store.curve(name), d = this.data(name);
    if (!c || !d) return;
    const B = this.box, right = c.axis === 'd';
    const L = Math.min(d.x.length, d.y.length);
    if (!L) return;
    const style = c.style || this.style;
    const excl = c.excluded || null;

    // Barres d'incertitude ux, uy
    if (this.showErr && c.kind !== 'model') {
      const ux = this.store.getUncertainty(name, 'x', this.xName);
      const uy = this.store.getUncertainty(name, 'y', this.xName);
      if (ux || uy) {
        ctx.strokeStyle = c.color;
        ctx.globalAlpha = 0.65;
        ctx.lineWidth = 1.1;
        const cap = 3.5;
        ctx.beginPath();
        const step = Math.max(1, Math.floor(L / 1500));
        for (let i = 0; i < L; i += step) {
          if (excl && excl.has(i)) continue;
          const x = d.x[i], y = d.y[i];
          const px = this.X(x), py = this.Y(y, right);
          if (!isFinite(px) || !isFinite(py)) continue;
          if (uy && uy[i] > 0) {
            const py1 = this.Y(y - uy[i], right), py2 = this.Y(y + uy[i], right);
            if (isFinite(py1) && isFinite(py2)) {
              ctx.moveTo(px, py1); ctx.lineTo(px, py2);
              ctx.moveTo(px - cap, py1); ctx.lineTo(px + cap, py1);
              ctx.moveTo(px - cap, py2); ctx.lineTo(px + cap, py2);
            }
          }
          if (ux && ux[i] > 0) {
            const px1 = this.X(x - ux[i]), px2 = this.X(x + ux[i]);
            if (isFinite(px1) && isFinite(px2)) {
              ctx.moveTo(px1, py); ctx.lineTo(px2, py);
              ctx.moveTo(px1, py - cap); ctx.lineTo(px1, py + cap);
              ctx.moveTo(px2, py - cap); ctx.lineTo(px2, py + cap);
            }
          }
        }
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    ctx.strokeStyle = c.color;
    ctx.fillStyle = c.color;
    ctx.lineWidth = c.width || (c.kind === 'model' ? 2.2 : 1.7);
    if (c.dash) ctx.setLineDash([7, 4]);

    if (style === 'batons') {
      const y0 = this.Y(Math.max(right ? this.view.y2min : this.view.ymin, Math.min(0, right ? this.view.y2max : this.view.ymax)), right);
      ctx.beginPath();
      for (let i = 0; i < L; i++) {
        const px = this.X(d.x[i]), py = this.Y(d.y[i], right);
        if (!isFinite(px) || !isFinite(py)) continue;
        ctx.moveTo(px, y0); ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      return;
    }

    if (style !== 'points') {
      ctx.beginPath();
      const W = B.r - B.l;
      let monotone = true;
      for (let i = 1; i < Math.min(L, 60); i++) if (d.x[i] < d.x[i - 1]) { monotone = false; break; }
      if (L > 4 * W && monotone && (!excl || excl.size === 0)) {
        let col = -1, mn = 0, mx = 0, first = true, lastY = 0;
        for (let i = 0; i < L; i++) {
          const px = Math.floor(this.X(d.x[i])), py = this.Y(d.y[i], right);
          if (!isFinite(px) || !isFinite(py)) continue;
          if (px !== col) {
            if (col >= 0) { ctx.lineTo(col, mn); ctx.lineTo(col, mx); ctx.lineTo(col, lastY); }
            col = px; mn = mx = py;
            if (first) { ctx.moveTo(px, py); first = false; }
          } else { if (py < mn) mn = py; if (py > mx) mx = py; }
          lastY = py;
        }
        if (col >= 0) { ctx.lineTo(col, mn); ctx.lineTo(col, mx); }
      } else {
        let pen = false;
        for (let i = 0; i < L; i++) {
          if (excl && excl.has(i)) { pen = false; continue; }
          const px = this.X(d.x[i]), py = this.Y(d.y[i], right);
          if (!isFinite(px) || !isFinite(py)) { pen = false; continue; }
          if (pen) ctx.lineTo(px, py); else { ctx.moveTo(px, py); pen = true; }
        }
      }
      ctx.stroke();
    }
    ctx.setLineDash([]);

    if (style === 'points' || style === 'lignepoints') {
      const step = Math.max(1, Math.floor(L / 2500));
      const r = B.fs > 14 ? 4.2 : 3.3;
      for (let i = 0; i < L; i += step) {
        const px = this.X(d.x[i]), py = this.Y(d.y[i], right);
        if (!isFinite(px) || !isFinite(py)) continue;
        if (excl && excl.has(i)) {
          ctx.strokeStyle = C.muted; ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(px - r, py - r); ctx.lineTo(px + r, py + r);
          ctx.moveTo(px + r, py - r); ctx.lineTo(px - r, py + r);
          ctx.stroke();
        } else {
          ctx.fillStyle = c.color;
          ctx.beginPath(); ctx.arc(px, py, r, 0, 2 * Math.PI); ctx.fill();
        }
      }
    }
  }

  _drawResiduals(ctx, R, C) {
    const rd = this.residualsData;
    const useZ = rd.weighted && rd.z && rd.z.some(isFinite);
    const vals = useZ ? rd.z : rd.r;
    let maxA = 0;
    for (let i = 0; i < vals.length; i++) if (isFinite(vals[i])) maxA = Math.max(maxA, Math.abs(vals[i]));
    if (useZ) maxA = Math.max(maxA * 1.15, 2.5);
    else maxA = maxA > 0 ? maxA * 1.2 : 1;

    ctx.fillStyle = C.resBg;
    ctx.fillRect(R.l, R.t, R.r - R.l, R.b - R.t);
    const yr = v => R.b - (v + maxA) / (2 * maxA) * (R.b - R.t);

    if (useZ) {
      ctx.fillStyle = C.band;
      const y2p = yr(2), y2m = yr(-2);
      ctx.fillRect(R.l, y2p, R.r - R.l, y2m - y2p);
    }
    ctx.strokeStyle = C.axis; ctx.lineWidth = 1;
    const y0 = Math.round(yr(0)) + 0.5;
    ctx.beginPath(); ctx.moveTo(R.l, y0); ctx.lineTo(R.r, y0); ctx.stroke();
    ctx.strokeRect(R.l + 0.5, R.t + 0.5, R.r - R.l, R.b - R.t);

    // Graduations résidus (-maxA, 0, +maxA)
    ctx.fillStyle = C.muted; ctx.font = `${Math.max(10, this.box.fs - 1.5)}px system-ui,sans-serif`;
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const lim = useZ ? 2 : PlotFmt.niceStep(maxA, 1);
    for (const v of [-lim, 0, lim]) {
      const py = yr(v);
      if (py >= R.t + 4 && py <= R.b - 4) ctx.fillText(PlotFmt.val(v, 2), R.l - 6, py);
    }
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(useZ ? 'Écarts normalisés z (bande ±2)' : 'Résidus y − f(x)', R.l + 6, R.t + 4);

    ctx.save();
    ctx.beginPath(); ctx.rect(R.l, R.t, R.r - R.l, R.b - R.t); ctx.clip();
    for (let i = 0; i < rd.x.length; i++) {
      const px = this.X(rd.x[i]), py = yr(vals[i]);
      if (!isFinite(px) || !isFinite(py)) continue;
      const bad = useZ && Math.abs(vals[i]) > 2;
      ctx.fillStyle = bad ? '#ef4444' : C.accent;
      ctx.beginPath(); ctx.arc(px, py, 2.8, 0, 2 * Math.PI); ctx.fill();
    }
    ctx.restore();
  }

  nearestIndex(d, x) {
    const L = Math.min(d.x.length, d.y.length);
    if (!L) return -1;
    if (L > 4 && d.x[L - 1] >= d.x[0]) {
      let mono = true;
      for (let i = 1; i < Math.min(L, 40); i++) if (d.x[i] < d.x[i - 1]) { mono = false; break; }
      if (mono) {
        let lo = 0, hi = L - 1;
        while (hi - lo > 1) { const m = (lo + hi) >> 1; if (d.x[m] < x) lo = m; else hi = m; }
        return Math.abs(d.x[lo] - x) <= Math.abs(d.x[hi] - x) ? lo : hi;
      }
    }
    let best = 0, bd = Infinity;
    for (let i = 0; i < L; i++) { const e = Math.abs(d.x[i] - x); if (e < bd) { bd = e; best = i; } }
    return best;
  }

  nearest2D(name, px, py) {
    const c = this.store.curve(name), d = this.data(name);
    if (!c || !d) return -1;
    const right = c.axis === 'd';
    let best = -1, bd = 18;
    for (let i = 0; i < Math.min(d.x.length, d.y.length); i++) {
      const x = this.X(d.x[i]), y = this.Y(d.y[i], right);
      if (!isFinite(x) || !isFinite(y)) continue;
      const dist = Math.hypot(x - px, y - py);
      if (dist < bd) { bd = dist; best = i; }
    }
    return best;
  }

  _drawCursors(ctx, C) {
    const B = this.box;
    const label = (txt, px, py) => {
      ctx.font = `${B.fs}px system-ui,sans-serif`;
      const lines = txt.split('\n');
      const lh = B.fs + 4;
      const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 14;
      const h = lines.length * lh + 8;
      let bx = px + 12, by = py - h - 10;
      if (bx + w > B.r) bx = px - w - 12;
      if (by < B.t) by = py + 12;
      ctx.fillStyle = C.bg; ctx.globalAlpha = 0.94;
      ctx.strokeStyle = C.axis; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect(bx, by, w, h, 5); ctx.fill(); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = C.fg; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      lines.forEach((l, i) => ctx.fillText(l, bx + 7, by + 5 + i * lh));
    };
    const xc = this.xName ? this.store.curve(this.xName) : (this.curves[0] && this.store.xCurveOf(this.curves[0]));
    const xu = xc && xc.unit ? ' ' + xc.unit : '', xn = xc ? xc.name : 'x';

    if (this.cursor && (this.mode === 'reticule' || this.mode === 'curseur' || this.mode === 'tangente')) {
      let { px, py } = this.cursor;
      let txt = '';
      if ((this.mode === 'curseur' || this.mode === 'tangente') && (this.cursorCurve || this.curves[0])) {
        const cn = this.cursorCurve || this.curves[0];
        const d = this.data(cn), c = this.store.curve(cn);
        if (d && c && d.x.length) {
          const i = this.nearestIndex(d, this.invX(px));
          if (i >= 0) {
            px = this.X(d.x[i]); py = this.Y(d.y[i], c.axis === 'd');
            txt = `${xn} = ${PlotFmt.val(d.x[i], 5)}${xu}\n${c.name} = ${PlotFmt.val(d.y[i], 5)}${c.unit ? ' ' + c.unit : ''}\npoint #${i + 1}`;
            ctx.fillStyle = c.color;
            ctx.beginPath(); ctx.arc(px, py, 5, 0, 2 * Math.PI); ctx.fill();
          }
        }
      }
      if (!txt) txt = `${xn} = ${PlotFmt.val(this.invX(px), 5)}${xu}\ny = ${PlotFmt.val(this.invY(py), 5)}`;
      ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 1; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(px, B.t); ctx.lineTo(px, B.b); ctx.moveTo(B.l, py); ctx.lineTo(B.r, py); ctx.stroke();
      ctx.setLineDash([]);
      label(txt, px, py);
    }

    if (this.hoverPt && (this.mode === 'zoom' || this.mode === 'pan') && !this.dragBox && !this.down) {
      const hp = this.hoverPt, c = this.store.curve(hp.curve);
      if (c) {
        const px = this.X(hp.x), py = this.Y(hp.y, c.axis === 'd');
        if (isFinite(px) && isFinite(py) && px >= B.l && px <= B.r && py >= B.t && py <= B.b) {
          ctx.save();
          ctx.strokeStyle = c.color; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(px, py, 6.5, 0, 2 * Math.PI); ctx.stroke();
          ctx.restore();
          const txt = `${xn} = ${PlotFmt.val(hp.x, 5)}${xu}\n${c.name} = ${PlotFmt.val(hp.y, 5)}${c.unit ? ' ' + c.unit : ''}  (#${hp.i + 1})`;
          label(txt, px, py);
        }
      }
    }

    if (this.mesure.length) {
      ctx.strokeStyle = '#10b981'; ctx.lineWidth = 1.4;
      for (const m of this.mesure) {
        const px = this.X(m.x), py = this.Y(m.y);
        ctx.beginPath(); ctx.moveTo(px, B.t); ctx.lineTo(px, B.b); ctx.moveTo(B.l, py); ctx.lineTo(B.r, py); ctx.stroke();
      }
      if (this.mesure.length === 2) {
        const [a, b] = this.mesure, dx = b.x - a.x, dy = b.y - a.y;
        ctx.beginPath(); ctx.moveTo(this.X(a.x), this.Y(a.y)); ctx.lineTo(this.X(b.x), this.Y(b.y)); ctx.stroke();
        const txt = `Δ${xn} = ${PlotFmt.val(dx, 5)}${xu}\nΔy = ${PlotFmt.val(dy, 5)}\npente = ${PlotFmt.val(dy / dx, 5)}` +
          (Math.abs(dx) > 0 ? `\n1/|Δ${xn}| = ${PlotFmt.val(1 / Math.abs(dx), 5)}` : '');
        label(txt, 0.5 * (this.X(a.x) + this.X(b.x)), Math.min(this.Y(a.y), this.Y(b.y)));
      }
    }
  }

  _snap(p) {
    const cn = this.cursorCurve || this.curves[0];
    if (cn) {
      const d = this.data(cn);
      if (d && d.x.length) {
        const i = this.nearestIndex(d, this.invX(p.px));
        if (i >= 0) return { x: d.x[i], y: d.y[i], i, curve: cn };
      }
    }
    return { x: this.invX(p.px), y: this.invY(p.py), i: -1, curve: null };
  }

  _findHoverPoint(px, py) {
    let best = null, bd = 14;
    for (const n of this.curves) {
      const c = this.store.curve(n);
      if (!c || c.kind === 'model') continue;
      const d = this.data(n);
      if (!d) continue;
      const L = Math.min(d.x.length, d.y.length);
      if (!L) continue;
      const right = c.axis === 'd';
      // Échantillonnage rapide si très grande courbe
      if (L > 4000) {
        const i = this.nearestIndex(d, this.invX(px));
        if (i >= 0) {
          const x = this.X(d.x[i]), y = this.Y(d.y[i], right);
          const dist = Math.hypot(x - px, y - py);
          if (dist < bd) { bd = dist; best = { curve: n, i, x: d.x[i], y: d.y[i] }; }
        }
      } else {
        for (let i = 0; i < L; i++) {
          const x = this.X(d.x[i]), y = this.Y(d.y[i], right);
          if (!isFinite(x) || !isFinite(y)) continue;
          const dist = Math.hypot(x - px, y - py);
          if (dist < bd) { bd = dist; best = { curve: n, i, x: d.x[i], y: d.y[i] }; }
        }
      }
    }
    return best;
  }

  _findHandle(px, py) {
    let best = null, bd = 16;
    for (const h of this.handles) {
      const hx = this.X(h.x), hy = this.Y(h.y);
      const dist = Math.hypot(hx - px, hy - py);
      if (dist < bd) { bd = dist; best = h; }
    }
    return best;
  }

  _bind() {
    const cv = this.canvas;
    const pos = e => { const r = cv.getBoundingClientRect(); return { px: e.clientX - r.left, py: e.clientY - r.top }; };

    cv.addEventListener('wheel', e => {
      e.preventDefault();
      const { px, py } = pos(e);
      const V = this.getView();
      this.auto = false;
      const f = e.deltaY > 0 ? 1.18 : 1 / 1.18;
      const x = this.invXt(px), y = this.invYt(py, false), y2 = this.invYt(py, true);
      const zx = !e.shiftKey || e.ctrlKey, zy = !e.ctrlKey || e.shiftKey;
      if (zx) { V.xmin = x + (V.xmin - x) * f; V.xmax = x + (V.xmax - x) * f; }
      if (zy) {
        V.ymin = y + (V.ymin - y) * f; V.ymax = y + (V.ymax - y) * f;
        V.y2min = y2 + (V.y2min - y2) * f; V.y2max = y2 + (V.y2max - y2) * f;
      }
      this.draw();
      if (this.onChange) this.onChange();
    }, { passive: false });

    cv.addEventListener('dblclick', () => this.autoscale());

    cv.addEventListener('pointerdown', e => {
      if (e.button === 2) return;
      cv.setPointerCapture(e.pointerId);
      const p = pos(e);
      // Poignées interactives prioritaires (ex. tangentes parallèles)
      if (this.handles.length && this.box) {
        const hit = this._findHandle(p.px, p.py);
        if (hit) {
          this.dragHandle = hit;
          cv.style.cursor = 'grabbing';
          return;
        }
      }
      if (this.mode === 'mesure') {
        const pt = this._snap(p);
        if (this.mesure.length >= 2) this.mesure = [];
        this.mesure.push(pt);
        this.draw();
        if (this.onPickPoint) this.onPickPoint('mesure', this.mesure);
        return;
      }
      if (this.mode === 'exclude') {
        const cn = this.cursorCurve || this.curves.find(n => this.store.curve(n)?.kind !== 'model');
        if (cn) {
          const i = this.nearest2D(cn, p.px, p.py);
          if (i >= 0 && this.onToggleExclude) this.onToggleExclude(cn, i);
        }
        return;
      }
      if (this.mode === 'tangente') {
        const pt = this._snap(p);
        if (this.onPickPoint) this.onPickPoint('tangente', pt);
        return;
      }
      if (this.mode === 'bounds') {
        if (this.boundsRange && this.boundsRange.length === 2) {
          const [b0, b1] = this.boundsRange;
          const x0 = this.X(b0), x1 = this.X(b1);
          if (Math.abs(p.px - x0) < 12) {
            this.down = { ...p, kind: 'bounds', xStart: b1 };
            return;
          }
          if (Math.abs(p.px - x1) < 12) {
            this.down = { ...p, kind: 'bounds', xStart: b0 };
            return;
          }
        }
        const xv = this.invX(p.px);
        this.down = { ...p, kind: 'bounds', xStart: xv };
        this.boundsRange = [xv, xv];
        this.draw();
        return;
      }
      this.down = { ...p, view: { ...this.getView() }, btn: e.button };
      if (this.mode === 'reticule' || this.mode === 'curseur') {
        this.cursor = p;
        this.draw();
      }
    });

    cv.addEventListener('pointermove', e => {
      const p = pos(e);
