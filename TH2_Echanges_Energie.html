<script>
/* =====================================================================

   E. Guillaume · charte du 2 novembre 2026 (Charte_Animations.html)

   Une animation décrit sa configuration et ses fonctions :
     AnimKit.app({
       code:'OP1', partie:'TurquoiseLagon', titre:'…', sousTitre:'…', chapitre:'OP1 Propagation de la lumière',
       onglets:['Vue de face','Perspective'],            // facultatif
       temps:true | (app)=>bool,                          // barre de lecture
       pas:1/24,                                          // durée simulée d'un « Pas »
       panneaux:[{id:'scene', titre:'…', poids:2, type:'svg'|'canvas', onglets:[0], ratioTel:.8, zoom:true}],
       reglages:[{titre:'Situations', presets:[{label, valeurs:{…}, lecture:true}]},

       aide:{voit, faire, modele, cours},
       init(app), reset(app), step(app,dt), draw(app), change(app,id,v), onglet(app,i)
     })
   Le kit fournit : app.p (paramètres), app.tab, app.t, app.C (couleurs), app.k (échelle projection),
   app.S (dessin SVG), app.fmt (nombres), app.metrics(), app.insight(), app.legend(), app.clock(), app.drag()…
   Réglage à échelle logarithmique : {id,type:'range',log:true,min,max,dec} (curseur en log10, champ numérique en valeur réelle).
   Disposition facultative  atelier:{saisie:'Mes mesures', detail:'Voir le calcul'} : app.zones.saisie / .resultat / .detail
   (nœuds DOM à remplir par l'animation) ; pas de colonne de réglages.
   ===================================================================== */
(function(){
'use strict';
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const MATH='"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif';
const MINUS='−';

/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  /** n chiffres significatifs, sans notation exponentielle */
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e<-3||e>=6){const m=x/10**e;return (+m.toFixed(n-1)).toFixed(n-1).replace('-',MINUS)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>'}
    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';

    if(e>=-2&&e<=3)return fmt.sig(x,n);

  },

  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();

    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}

    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;

      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;

      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },

'use strict';

'use strict';

function em(label,x,hint){const e=energie(x);return {label,value:e.v,unit:e.u,hint:hint||''};}
/* couleur de température (°C) : bleu → gris → rouge, indépendante du thème */
function tint(T){const t=clamp((T+10)/120),c0=[47,111,214],c1=[150,150,150],c2=[214,52,52],m=(x,y,f)=>x.map((v,i)=>Math.round(v+(y[i]-v)*f)),t1=1/3;
  const c=t<t1?m(c0,c1,t/t1):m(c1,c2,(t-t1)/(1-t1));return `rgb(${c.join(',')})`;}
const reflect=(z,L)=>{const v=((z%(2*L))+2*L)%(2*L);return v<=L?v:2*L-v;};
/* positions de n particules dans [0,w]×[0,h] à l'instant t (agitation ∝ √T, trajectoires schématiques) */
function gasPts(n,t,w,h,Tk,k){const sp=40*k*Math.sqrt(Math.max(Tk,50)/300),out=[];
  for(let i=0;i<n;i++){const seed=((i+1)*.61803398875)%1,ang=i*2.39996323,s2=(i*.41421356237)%1;
    out.push([reflect(seed*w+Math.cos(ang)*sp*t,w),reflect(s2*h+Math.sin(ang)*sp*.7*t,h)]);}return out;}
/* cylindre horizontal à piston. o = {x,y,w,h,frac,Tk,t,Q,W,qmax,wmax,bloque,titre,tc}
   Renvoie {x,y,w,h,px} (px : abscisse du piston) ; flèches de Q (dessous) et de W (dessus) proportionnelles. */
function cylindre(a,o){
  const S=a.S,C=a.C,k=a.k,{x,y,w,h}=o,L=w*o.frac,px=x+L;let s='';
  s+=S.rect(x,y,L,h,{fill:o.tc||C.cSoft,op:o.tc?.28:.6});
  s+=S.path(`M${x+w},${y}H${x}V${y+h}H${x+w}`,{c:C.ink2,w:3});
  const n=o.n??46,r=Math.min(3.4*k,Math.max(2,Math.min(L,h)*.035)),iw=Math.max(4,L-2*r-8*k),ih=h-2*r-6*k;
  for(const q of gasPts(n,o.t||0,iw,ih,o.Tk||300,k))s+=S.circle(x+r+3*k+q[0],y+r+3*k+q[1],r,{fill:C.ink,op:.85});
  s+=S.rect(px-5*k,y-7*k,10*k,h+14*k,{fill:C.ink2,c:C.ink,w:1,rx:3*k});
  s+=S.line(px+5*k,y+h/2,Math.min(x+w+14*k,px+40*k),y+h/2,{c:C.ink2,w:6});
  s+=S.rect(Math.min(x+w+14*k,px+40*k)-4*k,y+h/2-14*k,8*k,28*k,{fill:C.ink2,rx:3*k});
  if(o.bloque){s+=S.rect(px-6*k,y-17*k,12*k,10*k,{fill:C.ink})+S.rect(px-6*k,y+h+7*k,12*k,10*k,{fill:C.ink});}
  const fr=S.rect(x-8*k,y-12*k,L+22*k,h+24*k,{c:C.cInk,w:1.6,dash:`${6*k} ${4*k}`,rx:8*k});s+=fr;
  const Lq=Math.min(70*k,w*.2);
  if(o.qmax&&Math.abs(o.Q||0)>o.qmax*.015){const l=Lq*Math.abs(o.Q)/o.qmax,xm=x+Math.min(L,w*.45)/2+L*.25,y1=y+h+10*k+Lq,y2=y+h+12*k;
    s+=o.Q>0?S.arrow(xm,y1,xm,y1-l,{c:C.hot,w:3}):S.arrow(xm,y1-l,xm,y1,{c:C.cold,w:3});
    s+=S.text(xm+10*k,y1-l/2,S.v('Q'),{size:15,c:o.Q>0?C.hot:C.cold});}
  if(o.wmax&&Math.abs(o.W||0)>o.wmax*.015){const l=Lq*1.1*Math.abs(o.W)/o.wmax,yy=y-26*k;
    s+=o.W>0?S.arrow(px+l/2,yy,px-l/2,yy,{c:C.B,w:3}):S.arrow(px-l/2,yy,px+l/2,yy,{c:C.B,w:3});
    s+=S.text(px,yy-13*k,S.v('W'),{size:15,c:C.B,anchor:'middle'});}
  return {x,y,w,h,px,svg:s};
}
/* glaçon en SVG (centre cx, cy ; côté side ; rotation rot en radians) */
function glacon(a,cx,cy,side,rot=0){
  if(side<.7)return '';const C=a.C,dark=C.dark,P=(u,v)=>[cx+(u*Math.cos(rot)-v*Math.sin(rot))*side,cy+(u*Math.sin(rot)+v*Math.cos(rot))*side];
  const front=dark?'#6b9caf':'#dcf1fa',top=dark?'#b1d7e5':'#f7fdff',right=dark?'#47788d':'#b8dbe9',edge=dark?'#bddfeb':'#6e9fb4',S=a.S;
  return S.poly([P(-.5,-.25),P(.32,-.25),P(.32,.55),P(-.5,.55)],{close:true,fill:front,c:edge,w:1.2})+
    S.poly([P(-.5,-.25),P(-.3,-.46),P(.52,-.46),P(.32,-.25)],{close:true,fill:top,c:edge,w:1.1})+
    S.poly([P(.32,-.25),P(.52,-.46),P(.52,.34),P(.32,.55)],{close:true,fill:right,c:edge,w:1.1});
}
/* dégradé vertical SVG */
const grad=(id,c1,c2)=>`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
/* point et étiquette dans un graphe G */
function repere(a,G,xv,yv,label,c,fill,dx=9,dy=-12){const S=a.S,k=a.k,X=G.X(xv),Y=G.Y(yv);
  if(!isFinite(X)||!isFinite(Y)||X<G.x0-2||X>G.x0+G.w+2||Y<G.y0-2||Y>G.y0+G.h+2)return '';
  const rgt=X>G.x0+G.w-34*k;
  return S.circle(X,Y,5*k,{fill:fill?c:a.C.card,c,w:2})+(label?S.text(X+(rgt?-dx:dx)*k,Y+dy*k,label,{anchor:rgt?'end':'start',size:13.5,c,weight:600}):'');}

/* scène « gaz sous piston » : cylindre mobile ; mémorise la géométrie pour le glisser du piston */
let dragP=null;
function sceneGaz(a,m,end,o){
  const P=a.panels.scene,S=a.S,C=a.C,k=a.k,w=P.w,h=P.h;
  const rmax=Math.max(1,end.V/m.V0),ch=Math.min(h*.30,w*.26);
  const cyl=cylindre(a,{x:w*.06,y:h*.34,w:w*.84,h:ch,frac:.9*(m.V/m.V0)/rmax,Tk:m.T||o.T0,t:clk,Q:o.Q,W:o.W,qmax:o.ref,wmax:o.ref,bloque:o.bloque,tc:tint((m.T||o.T0)-273.15)});
  dragP=o.mobile?{x:cyl.x,w:cyl.w,px:cyl.px,y:cyl.y,h:cyl.h,rmax,end}:null;
  return {svg:cyl.svg,cyl};
}

const DUREE=10;

const cp=a=>({n:a.p.ch_n,T:a.p.ch_T,Pbar:1,gamma:5/3,ratio:a.p.ch_ratio,kind:'isotherme'});

      const v=[f.plaqueCond,f.plaqueRad,f.fondEau,f.fondManche,f.convection,f.pertesCasserole+f.pertesEau+f.pertesManche];
      for(const x of v){fluxMax=Math.max(fluxMax,Math.abs(x));if(x<-.05)fluxNeg=true}}}
}

/* ---------- 1. Pression ---------- */
function dPression(a){
  const p=a.p,S=a.S,C=a.C,k=a.k,Ps=a.panels.scene,Pg=a.panels.graphe,g=gp(a),m=TH.gas(g,u),end=TH.gas(g,1);
  const ref=Math.max(Math.abs(end.Q),Math.abs(end.W),Math.abs(end.dU),1e-9);
  let s=S.text(Ps.w/2,22*k,'Σ = {gaz + piston}',{anchor:'middle',size:15,c:C.cInk,weight:600});
  const sc=sceneGaz(a,m,end,{T0:m.T0,Q:m.Q,W:m.W,ref,bloque:p.pk_kind==='isochore',mobile:p.pk_kind!=='isochore'});s+=sc.svg;
  s+=S.text(Ps.w/2,Ps.h-34*k,`${S.v('T')} = ${FM.sig(m.T,3)} K · ${S.v('P')} = ${FM.sig(m.P/1e5,3)} bar · ${S.v('V')} = ${FM.sig(m.V*1000,3)} L`,{anchor:'middle',size:14,c:C.ink,weight:600});
  s+=S.text(Ps.w/2,Ps.h-14*k,p.pk_kind==='isotherme'?`Thermostat à ${FM.sig(m.T0,3)} K`:p.pk_kind==='isobare'?'Piston libre, pression constante':'Piston bloqué, volume constant',{anchor:'middle',size:13});
  a.svg('scene',s);
  /* graphe de Watt : P_ext en fonction de V */
  const xmin=Math.min(m.V0,end.V)*.82*1000,xmax=Math.max(m.V0,end.V)*1.15*1000,ymax=Math.max(m.P0,end.P)*1.25/1e5;
  const G=S.graph({x:0,y:0,w:Pg.w,h:Pg.h,xmin,xmax,ymin:0,ymax,xlab:'V (L)',ylab:`${S.v('P','ext')} (bar)`});
  let t=S.clip('gp',G)+G.svg;
  const pt=z=>[z.V*1000,z.Pext/1e5],done=upto(f=>pt(TH.gas(g,f)),100);
  if(p.pk_full)t+=S.curve(Array.from({length:101},(_,i)=>pt(TH.gas(g,i/100))),G,{c:C.ink2,w:1.5,dash:`${5*k} ${4*k}`});
  if(p.pk_kind!=='isochore'&&done.length>1){
    const poly=done.map(q=>[G.X(q[0]),G.Y(q[1])]);poly.push([G.X(done[done.length-1][0]),G.Y(0)],[G.X(done[0][0]),G.Y(0)]);
    t+=S.poly(poly,{close:true,fill:C.B,op:.22,c:'none'});}
  t+=S.curve(done,G,{c:C.cInk,w:3});
  t+=repere(a,G,m.V0*1000,m.P0/1e5,'I',C.ink,false,9,-12);
  if(u>.02)t+=repere(a,G,m.V*1000,m.P/1e5,u>=1?'F':'M',C.cInk,true,9,-12);
  if(u>.05&&p.pk_kind!=='isochore')t+=S.text((G.X(m.V0*1000)+G.X(m.V*1000))/2,G.Y(0)-14*k,m.W<0?`${S.v('W','P')} < 0`:`${S.v('W','P')} > 0`,{anchor:'middle',size:14,c:C.B,weight:600});
  a.svg('graphe',t);
  a.legend([{c:C.cInk,label:'trajet parcouru'},p.pk_kind!=='isochore'&&{c:C.B,label:`aire = ${M.v('W','P')} en valeur absolue (1 bar·L = 100 J)`},p.pk_full&&{c:C.ink2,dash:true,label:'trajet complet'}]);
  a.metrics([em(`${WP} reçu`,m.W),em('Q reçu',m.Q),em(`Δ${M.v('U')}`,m.dU)]);
}
A.drag('scene',{
  hit:(x,y)=>A.tab<=1&&dragP&&Math.abs(x-dragP.px)<28*A.k&&y>dragP.y-18*A.k&&y<dragP.y+dragP.h+18*A.k,
  start(){A.play(false)},
  move(x){if(!dragP)return;const ratio=(x-dragP.x)/dragP.w/.9*dragP.rmax,rf=dragP.end.V/dragP.end.V0;if(Math.abs(rf-1)>.001){u=clamp((ratio-1)/(rf-1));A.t=u*DUREE}}
});

/* ---------- 2. Le travail dépend du chemin ---------- */
function dChemin(a){
  const p=a.p,S=a.S,C=a.C,k=a.k,Ps=a.panels.scene,Pg=a.panels.graphe,c=cp(a);
  const qs=z=>TH.gas(c,z),br=z=>TH2P.brutalIso(c,z),act=p.ch_path==='qs'?qs:br,oth=p.ch_path==='qs'?br:qs;
  const m=act(u),end=act(1),eqs=qs(1),ebr=br(1),ref=Math.max(Math.abs(eqs.W),Math.abs(ebr.W),1e-9);
  let s=S.text(Ps.w/2,22*k,'Σ = {gaz + piston} · thermostat à '+FM.sig(c.T,3)+' K',{anchor:'middle',size:15,c:C.cInk,weight:600});
  const sc=sceneGaz(a,m,end,{T0:c.T,Q:m.Q,W:m.W,ref,bloque:false,mobile:true});s+=sc.svg;
  const pf=ebr.Pf;
  s+=S.text(Ps.w/2,Ps.h-34*k,p.ch_path==='qs'?`${S.v('P')} = ${S.v('P','ext')} = ${FM.sig(qs(u).P/1e5,3)} bar à chaque instant`:(m.eq?`${S.v('P')} = ${FM.sig(m.P/1e5,3)} bar`:`${S.v('P','ext')} = ${S.v('P','F')} = ${FM.sig(pf/1e5,3)} bar · gaz hors équilibre`),{anchor:'middle',size:14,c:C.ink,weight:600});
  s+=S.text(Ps.w/2,Ps.h-14*k,p.ch_path==='qs'?'Chemin quasi-statique : équilibre mécanique continu':'Chemin brutal : seuls I et F sont des équilibres',{anchor:'middle',size:13});
  a.svg('scene',s);
  const V0=qs(0).V0,Vf=V0*c.ratio,P0=qs(0).P0,Pf=P0/c.ratio;
  const G=S.graph({x:0,y:0,w:Pg.w,h:Pg.h,xmin:Math.min(V0,Vf)*.8*1000,xmax:Math.max(V0,Vf)*1.12*1000,ymin:0,ymax:Math.max(P0,Pf)*1.22/1e5,xlab:'V (L)',ylab:`${S.v('P','ext')} (bar)`});
  let t=S.clip('gc',G)+G.svg;
  const hyper=z=>{const V=V0*lerp(1,c.ratio,z);return [V*1000,c.n*TH.R*c.T/V/1e5]};
  const rect=z=>[lerp(V0,Vf,z)*1000,Pf/1e5];
  const drawPath=(kind,done,col,full)=>{
    if(kind==='qs'){const pts=full?Array.from({length:101},(_,i)=>hyper(i/100)):upto(hyper,100);
      if(!full&&pts.length>1){const poly=pts.map(q=>[G.X(q[0]),G.Y(q[1])]);poly.push([G.X(pts[pts.length-1][0]),G.Y(0)],[G.X(pts[0][0]),G.Y(0)]);t+=S.poly(poly,{close:true,fill:col,op:.2,c:'none'})}
      t+=S.curve(pts,G,{c:col,w:full?1.6:3,dash:full?`${5*k} ${4*k}`:undefined});}
    else{const e=full?1:u;
      if(!full&&e>0)t+=S.poly([[G.X(V0*1000),G.Y(0)],[G.X(V0*1000),G.Y(Pf/1e5)],[G.X(lerp(V0,Vf,e)*1000),G.Y(Pf/1e5)],[G.X(lerp(V0,Vf,e)*1000),G.Y(0)]],{close:true,fill:col,op:.2,c:'none'});
      t+=S.curve([[V0*1000,P0/1e5],[V0*1000,Pf/1e5],[lerp(V0,Vf,e)*1000,Pf/1e5]],G,{c:col,w:full?1.6:3,dash:full?`${5*k} ${4*k}`:undefined});}
  };
  const colA=p.ch_path==='qs'?C.cInk:C.F,colO=p.ch_path==='qs'?C.F:C.cInk;
  drawPath(p.ch_path,true,colA,false);
  if(p.ch_cmp)drawPath(p.ch_path==='qs'?'br':'qs',true,colO,true);
  t+=repere(a,G,V0*1000,P0/1e5,'I',C.ink,false,9,-12);
  if(u>=1)t+=repere(a,G,Vf*1000,Pf/1e5,'F',colA,true,9,-12);
  else if(p.ch_path==='qs'&&u>.02)t+=repere(a,G,m.V*1000,m.P/1e5,'M',C.cInk,true,9,-12);
  a.svg('graphe',t);
  a.legend([{c:colA,label:p.ch_path==='qs'?'quasi-statique : '+'P'+' = nRT/V':'brutal : P_ext = P_F'},p.ch_cmp&&{c:colO,dash:true,label:p.ch_path==='qs'?'chemin brutal (comparaison)':'chemin quasi-statique (comparaison)'}]);
  const mets=[];
  if(p.ch_cmp){mets.push(em(`${WP} reçu · ${p.ch_path==='qs'?'quasi-statique':'brutal'}`,m.W),em(`${WP} reçu · ${p.ch_path==='qs'?'brutal':'quasi-statique'}`,u>=1?oth(1).W:null,u<1?'visible à la fin':''),em(`Δ${M.v('U')} (les deux chemins)`,m.dU))}
  else mets.push(em(`${WP} reçu`,m.W),em('Q reçu',m.Q),em(`Δ${M.v('U')}`,m.dU));
  a.metrics(mets);
}

/* ---------- 3. Casserole ---------- */
function dCasserole(a){
  const p=a.p,S=a.S,C=a.C,k=a.k,Ps=a.panels.scene,Pg=a.panels.graphe,w=Ps.w,h=Ps.h,m=trajC.at(u),full=p.ca_sys==='full';
  const narrow=w<420,x=w*.10,wd=w*.60,y=h*.27,plateY=h*.80,hh=Math.max(60*k,plateY-16*k-y),hy=y+hh*.12,hEnd=w*.95;
  const wall=C.dark?'#59626b':'#b9c2c9';
  let s=`<defs>${grad('gW',tint(m.top),tint(m.bottom))}<linearGradient id="gH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${tint(m.pot)}"/><stop offset="1" stop-color="${tint(m.handle)}"/></linearGradient></defs>`;
  s+=S.text(w/2,20*k,full?'Σ = {eau + ustensile}':'Σ = {eau}',{anchor:'middle',size:15,c:C.cInk,weight:600});
  if(narrow)s+=S.text(w/2,46*k,`Eau ${FM.fix(m.T,1)} °C · manche ${FM.fix(m.handle,0)} °C`,{anchor:'middle',size:14,c:C.ink,weight:600});
  else s+=S.text(x,50*k,`Eau ${FM.fix(m.T,1)} °C`,{size:17,c:C.ink,weight:600})+S.text(hEnd,50*k,`Manche ${FM.fix(m.handle,0)} °C`,{anchor:'end',size:15,c:C.ink2});
  s+=S.rect(x,y,wd,hh,{fill:'url(#gW)'});
  const unstable=Math.max(0,m.bottom-m.top),strength=clamp(unstable/.8),phase=clk*1.2;
  if(p.ca_conv&&unstable>.025){
    for(const[side,dir]of[[.28,-1],[.72,1]]){
      const cx=x+wd*side,cy=y+hh*.51,rx=wd*.215,ry=hh*.35,pt=q=>[cx+rx*Math.cos(q),cy+ry*Math.sin(q)];
      let ring='',tr='';
      for(let j=0;j<60;j++){const q=j/60*Math.PI*2,q2=(j+1)/60*Math.PI*2;ring+=S.poly([pt(q),pt(q2)],{c:dir*Math.cos(q)<0?C.hot:C.cold,w:1.5})}
      for(let i=0;i<12;i++){const q=i/12*Math.PI*2+dir*phase,col=dir*Math.cos(q)<0?C.hot:C.cold,P1=pt(q),tail=pt(q-dir*.10);
        tr+=S.poly([tail,P1],{c:col,w:2})+S.circle(P1[0],P1[1],3.2*k,{fill:col});
        if(i%4===0){const f=pt(q-dir*.17);tr+=S.arrow(f[0],f[1],P1[0],P1[1],{c:col,w:2.3})}}
      s+=`<g opacity="${(.16+.12*strength).toFixed(2)}">${ring}</g><g opacity="${(.4+.6*strength).toFixed(2)}">${tr}</g>`;
    }}
  s+=S.rect(x-7*k,y-2*k,7*k,hh+9*k,{fill:wall,c:C.ink2,w:1.2})+S.rect(x+wd,y-2*k,7*k,hh+9*k,{fill:wall,c:C.ink2,w:1.2})+S.rect(x-7*k,y+hh,wd+14*k,8*k,{fill:wall,c:C.ink2,w:1.2});
  s+=S.rect(x+wd+7*k,hy,hEnd-x-wd-7*k,15*k,{fill:'url(#gH)',c:C.ink2,w:1.2,rx:5*k});
  if(p.ca_handle==='wood')for(let j=0;j<3;j++)s+=S.line(x+wd+13*k,hy+(4+j*3)*k,hEnd-7*k,hy+(3+j*3)*k,{c:C.ink2,w:.7,dash:`${10*k} ${4*k} ${3*k} ${4*k}`});
  if(full)s+=S.poly([[x-13*k,y-13*k],[x+wd+13*k,y-13*k],[x+wd+13*k,hy-7*k],[hEnd+8*k,hy-7*k],[hEnd+8*k,hy+23*k],[x+wd+13*k,hy+23*k],[x+wd+13*k,y+hh+14*k],[x-13*k,y+hh+14*k]],{close:true,c:C.cInk,w:1.8,dash:`${7*k} ${5*k}`});
  else s+=S.rect(x+5*k,y+4*k,wd-10*k,hh-9*k,{c:C.cInk,w:1.8,dash:`${7*k} ${5*k}`,rx:7*k});
  s+=S.rect(x-12*k,plateY,wd+24*k,25*k,{fill:p.ca_heat?tint(p.ca_plate):C.rule,c:C.ink2,w:1.2,rx:6*k});
  s+=S.text(x+wd/2,plateY+13*k,p.ca_heat?`Plaque ${FM.fix(p.ca_plate,0)} °C`:'Plaque retirée',{anchor:'middle',size:14,c:p.ca_heat?'#fff':C.ink2,halo:false,weight:600});
  if(p.ca_cond){
    const qPW=m.pot-m.bottom;
    if(Math.abs(qPW)>.05){const xx=x+wd*.18,f=(clk*.8)%1,up=qPW>=0;s+=S.line(xx,y+hh+7*k,xx,y+hh-15*k,{c:C.cInk,w:2})+S.circle(xx,up?y+hh+7*k-f*22*k:y+hh-15*k+f*22*k,2.6*k,{fill:C.cInk})}
    if(Math.abs(m.pot-m.handle)>.1)for(let j=0;j<3;j++){let f=(clk*.38+j/3)%1;if(m.pot<m.handle)f=1-f;s+=S.circle(x+wd+12*k+f*Math.max(1,hEnd-x-wd-20*k),hy+7.5*k,2.5*k,{fill:C.cInk})}
  }
  if(p.ca_rad&&Math.abs(m.pot-20)>.2){
    const out=m.pot>20,span=Math.max(18,hEnd-x-wd-18*k),xx=x+wd+13*k;
    for(let j=0;j<3;j++){const yy=y+hh*(.37+j*.19),pts=[];for(let q=0;q<=24;q++){const f=q/24;pts.push([xx+f*span,yy+Math.sin(f*Math.PI*4-clk*(out?4:-4))*3*k])}s+=`<g opacity=".8">${S.poly(pts,{c:C.hot,w:1.5})}</g>`}
  }
  a.svg('scene',s);
  /* graphe : températures ou puissances */
  let t='';
  if(p.ca_view==='temp'){
    const end=trajC.at(1),ymax=Math.max(30,p.ca_start,end.T,end.handle)+8;
    const G=S.graph({x:0,y:0,w:Pg.w,h:Pg.h,xmin:0,xmax:trajC.duration/60,ymin:10,ymax,xlab:'t (min)',ylab:`${S.v('T')} (°C)`});
    t=S.clip('gc',G)+G.svg;
    t+=S.curve(upto(f=>{const z=trajC.at(f);return [z.t/60,z.T]}),G,{c:C.hot,w:3})+S.curve(upto(f=>{const z=trajC.at(f);return [z.t/60,z.handle]}),G,{c:C.cold,w:2.5,dash:`${6*k} ${4*k}`});
    t+=S.circle(G.X(m.t/60),G.Y(m.T),5*k,{fill:C.card,c:C.hot,w:2})+S.circle(G.X(m.t/60),G.Y(m.handle),4.5*k,{fill:C.card,c:C.cold,w:2});
    a.svg('graphe',t);
    a.legend([{c:C.hot,label:'eau (moyenne)'},{c:C.cold,dash:true,label:'manche'},p.ca_cond&&{c:C.cInk,dot:true,label:'conduction'},p.ca_conv&&{c:C.cold,dot:true,label:'convection'},p.ca_rad&&{c:C.hot,dot:true,label:'rayonnement'}]);
  }else{
    const f=TH2P.flux(spObj,[m.pot,m.bottom,m.top,m.handle]);
    const rows=[['Plaque → casserole : conduction',f.plaqueCond,C.cInk],['Plaque → casserole : rayonnement',f.plaqueRad,C.hot],['Fond → eau : conduction',f.fondEau,C.cInk],['Casserole → manche : conduction',f.fondManche,C.cInk],['Eau, bas → haut : convection',f.convection,C.cold],['Pertes vers l\'air (20 °C)',f.pertesCasserole+f.pertesEau+f.pertesManche,C.ink2]];
    const x0=(fluxNeg?.5:.04)*Pg.w,span=(fluxNeg?.44:.9)*Pg.w,rh=Pg.h/(rows.length+.6),sc=span/fluxMax;
    t+=S.line(x0,rh*.3,x0,Pg.h-rh*.15,{c:C.ink2,w:1.2});
    rows.forEach(([lab,v,col],i)=>{const yy=rh*(i+.65),bh=rh*.32;
      t+=S.text(x0+(fluxNeg?-span:0)+4*k,yy-bh*.5-9*k,lab,{size:13,c:C.ink2,halo:false});
      t+=S.rect(Math.min(x0,x0+v*sc),yy-bh/2,Math.max(0,Math.abs(v)*sc),bh,{fill:col,op:.85,rx:2*k});
      t+=S.text(x0+v*sc+(v>=0?6:-6)*k,yy,`${FM.sig(v,3)} W`,{anchor:v>=0?'start':'end',size:13,c:C.ink,weight:600})});
    a.svg('graphe',t);
    a.legend([{c:C.cInk,label:'conduction'},{c:C.hot,label:'rayonnement'},{c:C.cold,label:'convection'},{c:C.ink2,label:'pertes (convection + rayonnement)'}]);
  }
  a.metrics([em('Q reçu',m.Q,full?'plaque + air':'fond → eau, internes exclus'),em(`Δ${M.v('U')}`,m.dU)]);
}

/* ---------- 4. Travail électrique ---------- */
function dElectrique(a){
  const p=a.p,S=a.S,C=a.C,k=a.k,Ps=a.panels.scene,Pg=a.panels.graphe,w=Ps.w,h=Ps.h,e=ep(a),m=TH.electric(e,u),end=TH.electric(e,1);
  const full=e.system==='full',top=h*.24,botLim=h-62*k,bh=Math.max(100*k,Math.min(botLim-top,w*.5)),bw=Math.min(w*.46,bh*.95),x=w*.5-bw*.62,y=top+Math.max(0,(botLim-top-bh)/2),bot=y+bh;
  const waterH=bh*(.22+.50*m.m/2),waterY=bot-waterH,coilY=bot-13*k,x1=x+bw*.2,x2=x+bw*.8,baseY=bot+5*k,cordEnd=w*.95;
  const body=`M${x+bw*.12},${y}L${x+bw*.88},${y}L${x+bw},${bot}L${x},${bot}Z`;
  const metal=C.dark?'#59626b':'#b9c2c9';
  let s=`<defs><clipPath id="kb"><path d="${body}"/></clipPath>${grad('gK',tint(m.T),tint(Math.min(110,m.T+(e.current>0?9:0))))}</defs>`;
  s+=S.text(w/2,20*k,full?'Σ = {eau + résistance}':'Σ = {eau}',{anchor:'middle',size:15,c:C.cInk,weight:600});
  s+=S.text(w/2,48*k,`Eau ${FM.fix(m.T,1)} °C`,{anchor:'middle',size:18,c:C.ink,weight:700});
  // poignée, bec, couvercle
  s+=S.path(`M${x+bw*.93},${y+bh*.1}C${x+bw*1.5},${y+bh*.02} ${x+bw*1.5},${y+bh*.78} ${x+bw*.99},${y+bh*.72}`,{c:C.ink2,w:7});
  s+=S.poly([[x+bw*.12,y+bh*.02],[x-bw*.2,y-bh*.05],[x+bw*.03,y+bh*.2]],{close:true,fill:C.cSoft,c:C.ink2,w:2});
  s+=S.path(body,{fill:C.cSoft,op:.4,c:'none'});
  s+=`<g clip-path="url(#kb)"><rect x="${x-3}" y="${waterY}" width="${bw+6}" height="${waterH+3}" fill="url(#gK)"/></g>`;
  s+=S.path(body,{c:C.ink2,w:3});
  s+=S.rect(x+bw*.22,y-8*k,bw*.56,9*k,{fill:metal,c:C.ink2,w:1.2,rx:4*k})+S.rect(x+bw*.42,y-15*k,bw*.16,8*k,{fill:C.ink2,rx:3*k});
  // résistance : zigzag horizontal au fond, recouverte d'eau
  const zz=[];for(let i=0;i<=10;i++)zz.push([x1+(x2-x1)*i/10,coilY+(i%2?-1:1)*5*k]);
  s+=S.poly(zz,{c:e.current>0?C.hot:C.ink2,w:4});
  if(e.current>0)for(let j=0;j<4;j++){const q=(clk*.5+j/4)%1,xx=x1+(x2-x1)*(j+.5)/4;s+=`<g opacity="${((1-q)*.6).toFixed(2)}">${S.line(xx,coilY-8*k-q*Math.min(30*k,waterH*.5),xx,coilY-8*k-q*Math.min(30*k,waterH*.5)-8*k,{c:C.hot,w:2})}</g>`}
  // socle et cordon
  s+=S.rect(x-bw*.08,baseY,bw*1.16,12*k,{fill:metal,c:C.ink2,w:1.2,rx:5*k});
  const wire=full&&e.current>0?C.B:C.ink2;
  s+=S.line(x1,coilY+5*k,x1,baseY,{c:wire,w:2})+S.line(x2,coilY+5*k,x2,baseY,{c:wire,w:2});
  s+=S.line(x+bw*1.08,baseY+6*k,cordEnd-10*k,baseY+6*k,{c:wire,w:2.5})+S.rect(cordEnd-10*k,baseY-1*k,12*k,14*k,{fill:C.card,c:C.ink2,w:1.3,rx:3*k});
  s+=S.text(x2+10*k,coilY-14*k,narrowLbl(w),{size:13.5,c:C.ink2});
  // frontière du système
  const left=x+bw*.04,right=x+bw*.96,floor=bot-2*k;
  if(full)s+=S.rect(left-2*k,waterY-6*k,right-left+4*k,floor-waterY+8*k,{c:C.cInk,w:1.8,dash:`${6*k} ${4*k}`,rx:6*k});
  else{s+=S.rect(left,waterY-6*k,right-left,coilY-12*k-waterY+6*k+0,{c:C.cInk,w:1.8,dash:`${6*k} ${4*k}`,rx:6*k})+S.rect(left,coilY-12*k,right-left,floor-coilY+12*k,{c:C.cInk,w:1.8,dash:`${6*k} ${4*k}`,rx:6*k});
    s+=S.rect(x1-8*k,coilY-11*k,x2-x1+16*k,22*k,{c:C.cInk,w:1.3,dash:`${4*k} ${3*k}`,rx:8*k})}
  if(e.current>0){
    if(full)s+=S.arrow(x1-14*k,baseY+14*k,x1-14*k,coilY-2*k,{c:C.B,w:2.8});
    else for(const xx of[x+bw*.35,x+bw*.65])s+=S.arrow(xx,coilY-8*k,xx,coilY-8*k-34*k,{c:C.hot,w:2.6});
  }
  if(e.loss&&Math.abs(m.T-20)>.2){const yy=waterY+waterH*.3,out=m.T>20,L2=Math.min(40*k,Math.abs(m.T-20)/80*40*k+8*k);s+=out?S.arrow(x+4*k,yy,x+4*k-L2,yy,{c:C.hot,w:2.4}):S.arrow(x+4*k-L2,yy,x+4*k,yy,{c:C.cold,w:2.4})}
  s+=S.text(w/2,h-14*k,`${S.v('I')} = ${FM.fix(e.current,1)} A · ${S.v('P','élec')} = ${FM.sig(m.power,3)} W`+(end.limited?' · arrêt à 100 °C':''),{anchor:'middle',size:14,c:C.ink,weight:600});
  a.svg('scene',s);
  const G=S.graph({x:0,y:0,w:Pg.w,h:Pg.h,xmin:0,xmax:end.duration,ymin:0,ymax:Math.max(30,end.T+8,e.start+8),xlab:'t (s)',ylab:`${S.v('T')} (°C)`});
  let t=S.clip('gc',G)+G.svg+S.curve(upto(f=>{const z=TH.electric(e,f);return [z.t,z.T]}),G,{c:C.hot,w:3})+S.circle(G.X(m.t),G.Y(m.T),5*k,{fill:C.card,c:C.hot,w:2});
  a.svg('graphe',t);a.legend([{c:C.hot,label:'température de l\'eau'}]);
  a.metrics([em(full?`${mv('W','élec')} reçu`:'Travail reçu W',m.W),em('Q reçu',m.Q,full?'avec l\'air':'résistance + air'),em(`Δ${M.v('U')}`,m.dU)]);
}

function narrowLbl(w){return w<420?'R':'R = 10 Ω'}

</script>
