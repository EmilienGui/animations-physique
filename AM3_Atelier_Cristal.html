<script>
/* =====================================================================
   AnimKit · script commun des animations de MPSI
   E. Guillaume · charte du 2 novembre 2026 (Charte_Animations.html)

   Une animation décrit sa configuration et ses fonctions :
     AnimKit.app({
       code:'OP1', partie:'TurquoiseLagon', titre:'…', sousTitre:'…', chapitre:'OP1 Propagation de la lumière',
       onglets:['Vue de face','Perspective'],            // facultatif
       temps:true | (app)=>bool,                          // barre de lecture
       pas:1/24,                                          // durée simulée d'un « Pas »
       panneaux:[{id:'scene', titre:'…', poids:2, type:'svg'|'canvas', onglets:[0], ratioTel:.8, zoom:true}],
       reglages:[{titre:'Situations', presets:[{label, valeurs:{…}, lecture:true}]},
                 {titre:'…', items:[{id,type:'range'|'select'|'seg'|'check'|'boutons'|'note', …}], onglets:[…], si:(app)=>bool}],
       aide:{voit, faire, modele, cours},
       init(app), reset(app), step(app,dt), draw(app), change(app,id,v), onglet(app,i)
     })
   Le kit fournit : app.p (paramètres), app.tab, app.t, app.C (couleurs), app.k (échelle projection),
   app.S (dessin SVG), app.fmt (nombres), app.metrics(), app.insight(), app.legend(), app.clock(), app.drag()…
   Réglage à échelle logarithmique : {id,type:'range',log:true,min,max,dec} (curseur en log10, champ numérique en valeur réelle).
   Disposition facultative  atelier:{saisie:'Mes mesures', detail:'Voir le calcul'} : app.zones.saisie / .resultat / .detail
   (nœuds DOM à remplir par l'animation) ; pas de colonne de réglages.
   ===================================================================== */
(function(){
'use strict';
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const MATH='"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif';
const MINUS='−';

/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  /** n chiffres significatifs, sans notation exponentielle */
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e<-3||e>=6){const m=x/10**e;return (+m.toFixed(n-1)).toFixed(n-1).replace('-',MINUS)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>'}
    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

function makeS(app){

    FONT,MATH,

    v(sym,sub,sup){

      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;

    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();

      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;

      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});

function packingModel(a,top){
  const p=a.p,R=Cr.specs.cfc.R,f=top?.45:(p.cube||p.centers?.45:1),cell=Cr.lattice('cfc').map(Cr.toStack);

  if(p.task1==='neighbors'){

    bounds=atoms.filter(t=>t.alpha!==.18).map(t=>t.p);
  }
  if(p.task1==='count'&&p.sharing){
    for(let x=-1;x<=0;x++)for(let y=-1;y<=0;y++)for(let z=-1;z<=0;z++){const o=[x,y,z].map((v,i)=>v+Math.floor(st.sel[i]));if(st.sel.every((v,i)=>v>=o[i]-1e-8&&v<=o[i]+1+1e-8))wires.push(...V.cubeWires(o,1,'blue'))}
    bounds=wires.flatMap(w=>[w.a,w.b]);
  }
  if(p.task1==='contact'){
    const end=p.structure==='cs'?[1,0,0]:p.structure==='cc'?[1,1,1]:[1,1,0],ps=p.structure==='cs'?[[0,0,0],end]:[[0,0,0],Cr.mul(end,.5),end];
    atoms=ps.map(q=>atom(q,spec.R,'accent'));bonds=[{a:[0,0,0],b:end,c:'gold',width:4}];wires=V.cubeWires();bounds=Cr.lattice('cs');
    dimension={a:[0,0,0],b:end,text:p.reveal?svgMath(a,spec.contact):'distance de contact'};
  }
  return{atoms,wires,bonds,bounds,dimension,pad:p.task1==='contact'?.45:(p.reduced1?.23:.42),lock:p.task1==='contact',nb,spec};
}
/* ---------- onglet 3 : sites ---------- */
function siteModel(a){
  const p=a.p,sites=SITES(a),P=sites[st.site%sites.length],R=Cr.specs.cfc.R,limit=Cr.siteRadius(p.site),d=p.site==='octa'?.5:Math.sqrt(3)/4;
  const near=Cr.nearest(Cr.lattice('cfc',-1,2),P,d),over=p.ratio>limit+1e-7,gc=over?'red':'gold';
  let atoms,wires=[],bonds=[],bounds,frontAtoms=[],dimension,lock=false;
  if(p.local||p.cut){
    if(p.cut){
      // plan réel passant par le centre du site et deux de ses voisins
      const u=Cr.mul(Cr.sub(near[0],P),1/d);let v0=Cr.sub(near.find(q=>Math.abs(Cr.dot(Cr.sub(q,P),u))<d*.9),P);v0=Cr.sub(v0,Cr.mul(u,Cr.dot(v0,u)));const v=Cr.mul(v0,1/Cr.norm(v0));
      const tr=q=>{const t=Cr.sub(q,P);return[Cr.dot(t,u),Cr.dot(t,v),0]};
      const ps=p.site==='octa'?[near[0],near.find(q=>Cr.dist(Cr.sub(q,P),Cr.mul(u,-d))<1e-7)]:[near[0],near.find(q=>Math.abs(Cr.dot(Cr.sub(q,P),u))<d*.9)];
      atoms=ps.map(q=>atom(tr(q),R,'accent'));atoms.push(atom([0,0,0],p.ratio*R,gc,{ring:true}));
      bonds=ps.map(q=>({a:[0,0,0],b:tr(q),c:'muted',dash:[4,5]}));bounds=atoms.map(t=>t.p);lock=true;
      dimension={a:[0,0,0],b:atoms[0].p,text:p.reveal?(p.site==='octa'?`${a.S.v('d')} = ${a.S.v('a')}/2`:`${a.S.v('d')} = ${a.S.v('a')}√3/4`):'distance au voisin'};
    }else{
      atoms=near.map(q=>atom(q,R,'accent',{alpha:p.transp?.3:1}));const guest=atom(P,p.ratio*R,gc,{ring:true});atoms.push(guest);if(p.transp)frontAtoms=[guest];
      bonds=near.map(q=>({a:P,b:q,c:'muted',dash:[4,5]}));bounds=near;
      const edges=[];for(let i=0;i<near.length;i++)for(let j=i+1;j<near.length;j++)if(Cr.dist(near[i],near[j])<.708)edges.push([i,j]);wires=V.wirePoly(near,edges,'blue');
    }
  }else{
    atoms=Cr.lattice('cfc').map(q=>atom(q,R*.38,'accent',{alpha:.65}));
    atoms.push(...sites.map((q,i)=>atom(q,.034,p.site==='octa'?'gold':'purple',{key:'site:'+i,ring:i===st.site%sites.length})));
    atoms.push(atom(P,Math.max(.015,p.ratio*R*.38),gc,{key:'site:'+st.site%sites.length}));wires=V.cubeWires();bounds=Cr.lattice('cs');
  }
  return{atoms,wires,bonds,bounds,frontAtoms,dimension,pad:.45,lock,limit,over};
}
/* ---------- onglet 4 : NaCl et diamant ---------- */
function applicationModel(a){
  const p=a.p,nacl=p.material==='nacl',R=nacl?181/552:Cr.specs.diamant.R,r=nacl?95/552:R,sc=p.reduced3&&p.task3!=='contact'?.48:1;
  const host=nacl?Cr.lattice('cfc'):Cr.diamond(),guest=nacl?Cr.octa():[];
  let atoms=[...host.map(q=>atom(q,R*sc,'accent',nacl?{charge:'−'}:{})),...guest.map(q=>atom(q,r*sc,'blue',{charge:'+'}))],wires=V.cubeWires(),bonds=[],bounds,dimension;
  const lo=Math.floor(Math.min(...st.sel))-1,hi=Math.ceil(Math.max(...st.sel))+1;
  const all=nacl?[...Cr.lattice('cfc',lo,hi).map(q=>({p:q,r:R,c:'accent',charge:'−'})),...Cr.lattice('cfc',lo-1,hi).map(q=>({p:Cr.add(q,[.5,0,0]),r,c:'blue',charge:'+'}))]:Cr.diamond(lo,hi).map(q=>({p:q,r:R,c:'accent'}));
  if(p.task3!=='neighbors'&&!atoms.some(t=>Cr.dist(t.p,st.sel)<1e-7))st.sel=[0,0,0];
  const dist=nacl?.5:Math.sqrt(3)/4,near=all.filter(t=>Math.abs(Cr.dist(t.p,st.sel)-dist)<1e-7);
  if(p.task3==='neighbors'){
    const ctr=all.find(t=>Cr.dist(t.p,st.sel)<1e-7);
    atoms=[atom(st.sel,ctr.r*sc,ctr.c,{ring:true,charge:ctr.charge}),...near.map(t=>atom(t.p,t.r*sc,t.c,{charge:t.charge}))];
    bonds=near.map(t=>({a:st.sel,b:t.p,c:'gold',width:2.5}));bounds=atoms.map(t=>t.p);
  }else if(p.task3==='contact'){
    if(nacl){atoms=[atom([0,0,0],R,'accent',{charge:'−'}),atom([.5,0,0],r,'blue',{charge:'+'}),atom([1,0,0],R,'accent',{charge:'−'})];bonds=[{a:[0,0,0],b:[1,0,0],c:'gold',width:3}]}
    else{atoms=[atom([0,0,0],R,'accent'),atom([Math.sqrt(3)/4,0,0],R,'accent')];bonds=[{a:[0,0,0],b:[Math.sqrt(3)/4,0,0],c:'gold',width:3}]}
    wires=[];bounds=atoms.map(t=>t.p);
    const S=a.S;
    dimension={a:atoms[0].p,b:atoms[atoms.length-1].p,text:p.reveal?(nacl?`${S.v('a')} = 2(${S.v('R','Na'+S.sup('+'))} + ${S.v('R','Cl'+S.sup('−'))})`:`2${S.v('R')} = ${S.v('a')}√3/4`):'distance de contact'};
  }else if(!nacl){
    for(let i=0;i<atoms.length;i++)for(let j=i+1;j<atoms.length;j++)if(Math.abs(Cr.dist(atoms[i].p,atoms[j].p)-dist)<1e-7)bonds.push({a:atoms[i].p,b:atoms[j].p,c:'muted',width:2});
  }
  return{atoms,wires,bonds,bounds,dimension,pad:p.task3==='contact'?.45:(p.reduced3?.2:.4),lock:p.task3==='contact',nacl};
}

/* ---------- dessin, mesures, légende ---------- */
function captionOf(a,m){
  const p=a.p;
  if(a.tab===0)return[p.cube?'Sphères réduites · cube mis en évidence':p.centers?'Sphères réduites · centres inchangés':'Sphères tangentes','Les couleurs repèrent les positions A, B, C'];
  if(a.tab===1)return[p.structure.toUpperCase()+' · '+(p.task1==='contact'?'construction plane du contact':p.reduced1?'sphères réduites (rayons physiques pour les calculs)':'rayons physiques'),p.task1==='count'?`atome partagé entre ${Math.round(1/Cr.fraction(st.sel))} cube${Math.round(1/Cr.fraction(st.sel))>1?'s':''}`:p.task1==='neighbors'?'traits bleus : plus proches voisins':'trait ocre : direction du contact'];
  if(a.tab===2)return[(p.site==='octa'?'Site octaédrique':'Site tétraédrique')+(p.cut?' · coupe':p.local?' · environnement local':' · marqueurs = sites vides'),p.cut||p.local?'rayons physiques · hôte rigide':'cliquer sur un marqueur pour changer de site'];
  return[m.nacl?'NaCl · Cl− en vert, Na+ en bleu':'Diamant · tous les atomes sont C',p.task3==='contact'?'construction plane du contact':'cliquer sur un atome ou un ion'];
}
function draw(a){
  const P=a.panels.scene,k=a.k,p=a.p;

  cap.forEach((t,i)=>{svg+=a.S.text(10*k,(10+17*i)*k,t.replace('Cl−','Cl'+a.S.sup('−')).replace('Na+','Na'+a.S.sup('+')),{base:'top',size:13,c:a.C.ink2})});
  if(a.tab===0){
    const L=['A','B','C'],col=[a.C.v,a.C.B,a.C.E],seq=p.seq==='abc'?[0,1,2,0]:[0,1,0,1];
    let txt='';for(let i=0;i<p.layers;i++)txt+=`<tspan fill="${col[seq[i]]}" font-weight="700">${L[seq[i]]}</tspan> `;

function info(a,m){

  if(a.tab===0){
    a.metrics([{label:'Empilement',value:p.seq==='abc'?'ABCABC':'ABAB',hint:p.seq==='abc'?'cubique à faces centrées':'hexagonal compact'},

    return;
  }
  if(a.tab===1){
    const spec=m.spec,rho=Cr.density(spec.N,p.M,p.a),share=Math.round(1/Cr.fraction(st.sel)),R=spec.R*p.a;
    a.metrics(p.task1==='count'?[{label:'Population N',value:hid(a,String(spec.N))},{label:'Part de l’atome choisi',value:hid(a,share===1?'1':'1/'+share)},{label:'Compacité',value:hid(a,f.fix(spec.C*100,1)),unit:'%'}]:
      p.task1==='neighbors'?[{label:'Coordinence',value:hid(a,String(m.nb.length))},{label:'Distance des voisins',value:hid(a,f.fix(2*spec.R,3)),unit:'a',hint:hid(a,`${f.fix(2*spec.R*p.a,1)} pm`)},{label:'Hors du cube',value:hid(a,String(m.nb.filter(q=>!inCell(q)).length))}]:
      [{label:'Condition de contact',value:hid(a,mathify(spec.contact)),hint:hid(a,`R = ${f.fix(R,1)} pm`)},{label:'Compacité',value:hid(a,f.fix(spec.C*100,1)),unit:'%'},{label:'Masse volumique',value:hid(a,f.fix(rho,0)),unit:'kg·m<sup>−3</sup>'}]);
    a.legend(p.task1==='neighbors'?[{c:C.E,label:'atome choisi'},{c:C.B,label:'plus proches voisins'}]:p.task1==='contact'?[{c:C.E,label:'direction du contact'}]:[{c:C.v,label:'atomes de la maille'}]);

function explication(a){
  const p=a.p;
  if(a.tab===0)return p.layers<3?'La couche B occupe <b>une famille de creux</b> de A. Il reste deux choix pour la couche suivante.':
    p.seq==='abc'?'<b>La troisième couche C ne se superpose pas à A.</b> La répétition ABCABC donne le CFC.':'<b>La troisième couche revient à la verticale de A.</b> La répétition ABAB donne l’hexagonal compact.';
  if(a.tab===1)return p.task1==='count'?'<b>Cliquer sur un atome</b> pour étudier son partage entre les cubes voisins. La population compte les contributions en propre.':
    p.task1==='neighbors'?'<b>Les plus proches voisins dépassent le cube choisi.</b> Cliquer sur un autre atome pour vérifier son environnement.':'<b>Isoler la direction où les sphères se touchent.</b> La relation géométrique permet de calculer la compacité.';
  if(a.tab===2)return p.site==='octa'?'<b>Sites octaédriques : centre du cube et milieux des arêtes.</b> Ceux des arêtes sont partagés entre quatre cubes.':'<b>Sites tétraédriques : centres des huit petits cubes.</b> Chaque site est entièrement contenu dans la maille.';
  return p.material==='nacl'?'<b>Deux sous-réseaux imbriqués.</b> Les quatre Na<sup>+</sup> et quatre Cl<sup>−</sup> en propre donnent quatre unités de formule NaCl.':'<b>Le diamant est très dur et peu compact.</b> Sa cohésion repose sur un réseau covalent tétraédrique étendu.';
}
function formule(a){
  const p=a.p;
  if(a.tab===1){
    const spec=Cr.specs[p.structure],rho=Cr.density(spec.N,p.M,p.a);
    return `${iv('ρ')} = ${M.frac(iv('N')+' '+iv('M'),NA+' '+iv('a')+'<sup>3</sup>')}${p.reveal?` = ${a.fmt.fix(rho,0)} kg·m<sup>−3</sup>`:''}`;
  }
  if(a.tab===2){
    const lim=Cr.siteRadius(p.site),ok=p.ratio<=lim+1e-7;
    const st1=p.ratio>lim+1e-7?'Interpénétration : la sphère dépasse la place disponible.':Math.abs(p.ratio-lim)<1e-7?'Contact limite : la sphère touche tous les voisins.':'La sphère tient sans déplacer les voisins.';
    const fe=p.fe?`<br>Fer γ : ${iv('R')} = ${FE_R} pm ; carbone : ${iv('r')} = ${FE_RC} pm, soit ${iv('r')} / ${iv('R')} = ${a.fmt.fix(FE_RC/FE_R,3)}.${p.reveal?` Le site octaédrique accepte au plus ${a.fmt.fix(Cr.siteRadius('octa')*FE_R,0)} pm : le carbone ${FE_RC/FE_R>Cr.siteRadius('octa')?'ne tient pas sans déformer le réseau (solution solide d’insertion)':'tient'}.`:''}`:'';
    return `<b>${st1}</b><br>${p.reveal?(p.site==='octa'?`${iv('r','max')} = ${iv('a')}/2 − ${iv('R')}`:`${iv('r','max')} = ${iv('a')}√3/4 − ${iv('R')}`):`${iv('r','max')} = distance au voisin − ${iv('R')}`}${fe}`;
  }
  if(a.tab===3){
    if(p.material==='nacl')return `${p.reveal?`${iv('a')} = 2(${iv('R','Na<sup>+</sup>')} + ${iv('R','Cl<sup>−</sup>')}) = 552 pm`:'Na<sup>+</sup> dans tous les sites octaédriques'}<br>${iv('R','Na<sup>+</sup>')} = 95 pm ; ${iv('R','Cl<sup>−</sup>')} = 181 pm. Les anions ne sont pas tangents entre eux. Compatibilité géométrique ≠ preuve de stabilité.${p.reveal?'<br>Avec la valeur expérimentale a = 564 pm, on trouve 2164 kg·m<sup>−3</sup> : les ions ne sont pas des sphères dures.':''}`;
    return `${p.reveal?`2${iv('R')} = ${iv('a')}√3/4 ; ${iv('ρ')} = ${a.fmt.fix(Cr.density(8,12.01,356.7),0)} kg·m<sup>−3</sup>`:'CFC + quatre sites tétraédriques en alternance'}<br>${iv('a')} = 356.7 pm. Tous les atomes ont le même rayon ; le contact se fait entre un atome du CFC et un atome d’un site tétraédrique.`;

}

      {type:'boutons',items:[
        {label:'Au contact',action:a=>{a.set('ratio',Cr.siteRadius(a.p.site));a.set('local',true)}},
        {label:'Trop grande',action:a=>{a.set('ratio',Cr.siteRadius(a.p.site)+.08);a.set('local',true)}}]},
      {id:'fe',type:'check',label:`Hôte : fer γ (${FE_R} pm), carbone ${FE_RC} pm`,value:false},
      {type:'boutons',items:[{label:'Carbone (77 pm)',action:a=>{a.set('fe',true);a.set('ratio',FE_RC/FE_R);a.set('local',true)}}]}]},
    {titre:'Deux constructions',onglets:[3],items:[
      {id:'material',type:'seg',label:'Structure',options:[['nacl','NaCl · sites O'],['diamond','Diamant · sites T']],value:'nacl'},
      {id:'task3',type:'seg',label:'Observer',options:[['count','Population'],['neighbors','Environnement'],['contact','Contact']],value:'count'},
      {id:'reduced3',type:'check',label:'Réduire les sphères pour voir l’intérieur',value:true,si:a=>a.p.task3!=='contact'}]},
    {titre:'Prévoir puis vérifier',items:[
      {id:'reveal',type:'check',label:'Révéler les résultats',value:false},
      {type:'note',html:a=>explication(a)},
      {type:'note',html:a=>formule(a)}]},
    {titre:'Vue',items:[
      {type:'boutons',items:[
        {label:'Vue 3D',action:a=>{if(!locked(a))view.reset()}},
        {label:'Vue de dessus',action:a=>{if(!locked(a))view.set(0,PI/2)}},
        {label:'Vue de face',action:a=>{if(!locked(a))view.set(0,0)}}]},
      {type:'note',html:a=>locked(a)?'Cette construction plane garde une vue fixe.':'Glisser dans la scène pour tourner ; molette ou pincement pour zoomer.'}]}
  ],
  aide:{
    voit:'Un cristal dessiné en sphères. Onglet 1 : des couches compactes A, B, C que l’on empile. Onglet 2 : la maille cubique (CFC, CC ou CS), sa population, sa coordinence et son contact. Onglet 3 : les sites octaédriques et tétraédriques d’un CFC compact. Onglet 4 : NaCl et diamant.',
    faire:'<ul><li>Glisser dans la scène pour tourner la vue ; les constructions planes (contact, coupe) sont volontairement figées.</li><li>Cliquer sur un atome (onglets 2 et 4) ou sur un marqueur de site (onglet 3).</li><li>Faire une prévision, puis cocher « Révéler les résultats » : les grandeurs sont masquées au départ.</li><li>Onglet 2 : les situations Cu, Al, Fe α et Po donnent la structure, <i class="m">a</i> et <i class="m">M</i> d’un vrai métal ; comparer la masse volumique calculée à la valeur tabulée.</li><li>Onglet 3 : « Carbone dans le fer γ » montre une sphère trop grosse pour le site octaédrique (77 pm contre 52 pm disponibles).</li><li>Lecture : ajoute les couches (onglet 1), fait varier le rayon inséré (onglet 3) ou fait tourner le cristal.</li></ul>',
    modele:'Sphères dures indéformables, tangentes ; coordonnées réduites (paramètre de maille a = 1). L’hôte reste rigide. Les sphères réduites ne servent qu’à voir l’intérieur : les calculs utilisent les rayons physiques. Population, coordinence, compacité et masse volumique ρ = <i class="m">N M</i>/(𝒩<sub>A</sub> <i class="m">a</i><sup>3</sup>) viennent des formules du cours. NaCl : rayons ioniques du cours (Na<sup>+</sup> 95 pm, Cl<sup>−</sup> 181 pm), donc <i class="m">a</i> = 552 pm et ρ = 2308 kg·m<sup>−3</sup> ; la valeur expérimentale <i class="m">a</i> = 564 pm donne 2164 kg·m<sup>−3</sup>. Le fer γ est pris avec <i class="m">R</i> = 126 pm.',
    cours:'AM3 : empilements compacts ABC et ABA, maille conventionnelle, population, coordinence, compacité, masse volumique, sites interstitiels octaédriques et tétraédriques, structures NaCl et diamant.'
  },
  init(a){setView(a)},
  change(a,id,v){
    if(['structure','task1','task3','material','site'].includes(id)){a.p.reveal=false;st.sel=[0,0,0];if(id==='site'){st.site=0;a.p.local=false;a.p.cut=false}}
    if(id==='cut'&&v)a.p.local=true;
    if(id==='local'&&!v)a.p.cut=false;
    if(id==='cube'&&v){a.p.seq='abc';a.p.layers=4}
    if(id==='seq'&&v==='aba')a.p.cube=false;
    if(['structure','task1','task3','material','cut','site'].includes(id))setView(a);
  },
  onglet(a){a.play(false);a.t=0;a.p.reveal=false;st.sel=[0,0,0];st.site=0;setView(a)},
  reset(a){a.t=0;setView(a)},
  peutLire(a){if(a.tab===0&&a.p.cube)a.p.cube=false;return true},
  step(a,dt){
    if(a.tab===0){a.t+=dt;if(a.t>=1.4-1e-9){a.t=0;a.p.layers=a.p.layers%4+1;a.refresh()}}
    else if(a.tab===2){a.p.ratio=(a.p.ratio+dt*.08)%.6;a.refresh()}
    else if(task(a)!=='contact')view.yaw+=dt*.22;
  },
  draw
});
V.bind(A,'scene',view,{hit:()=>!locked(A),canRotate:()=>!locked(A),onClick:hit=>{
  if(!hit)return;
  if(A.tab===2&&String(hit.key).startsWith('site:'))st.site=Number(hit.key.split(':')[1]);
  else if(A.tab===1||A.tab===3)st.sel=hit.p.slice();
  A.refresh();
}});

</script>
</body>
</html>
