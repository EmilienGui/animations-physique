    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

/* =====================================================================
   OP2 · outils de dessin communs aux animations du chapitre (AnimKit)
   Repère : axe optique horizontal orienté dans le sens de la lumière incidente
   (vers la droite), ordonnées vers le haut. Échelles longitudinale et
   transversale indépendantes, comme dans les schémas du cours.
   La physique (lentilles minces, matrices paraxiales, lentille épaisse) est
   dans ../_Sources_Ateliers/optics.js (moteur d'origine, inchangé).

window.OP2=(()=>{
'use strict';
const DEG=Math.PI/180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/** distance algébrique surlignée (HTML) */
const bar=s=>`<span class="m" style="text-decoration:overline;text-decoration-thickness:.06em">${s}</span>`;
/** couleurs des rayons : comme les schémas TikZ du cours (rouge, bleu, turquoise) */
function couleurs(a){const C=a.C;return{
  r:[C.F,C.B,C.dark?'#4fd1c5':'#13827c'],
  obj:C.ink, img:C.dark?'#c39bff':'#7a3fc0', lens:C.cInk, foc:C.ink2, plan:C.dark?'#c39bff':'#7a3fc0'}}

/** repère monde → pixels dans un rectangle, échelles x et y indépendantes, zoom du panneau */
function repere(P,{xmin,xmax,ymax,x0=0,y0=0,w=P.w,h=P.h,mx=18,my=16,cy=null}){
  const z=P.zoom||1, xc=(xmin+xmax)/2, hw=(xmax-xmin)/2/z;
  const sx=(w-2*mx)/(2*hw), sy=(h/2-my)/(ymax/z);
  const X0=x0+w/2, Y0=cy===null?y0+h/2:cy;
  return{X:x=>X0+(x-xc)*sx, Y:y=>Y0-y*sy, x:px=>xc+(px-X0)/sx, y:py=>(Y0-py)/sy, sx, sy,
    xmin:xc-hw, xmax:xc+hw, ymax:ymax/z, left:x0, right:x0+w, top:y0, bottom:y0+h};
}

/** poignées déplaçables (une liste par panneau, refaite à chaque dessin) */
const handles={};
function poignee(a,pid,x,y,move,o={}){
  (handles[pid]=handles[pid]||[]).push({x,y,move});
  const k=a.k, c=o.c||a.C.cInk;
  return a.S.circle(x,y,9*k,{fill:a.C.card,c,w:2,op:.95})+a.S.circle(x,y,2.6*k,{fill:c});
}
function activerGlisser(A,pid,extra){
  let cur=null;
  A.drag(pid,{
    hit:(x,y)=>{const L=handles[pid]||[];const r=24*A.k;return L.some(h=>Math.hypot(h.x-x,h.y-y)<r)||(extra&&extra.hit&&extra.hit(x,y))},
    start(x,y){const L=handles[pid]||[];let best=null,d=24*A.k;for(const h of L){const e=Math.hypot(h.x-x,h.y-y);if(e<d){d=e;best=h}}
      cur=best?best.move:(extra&&extra.start?extra.start(x,y):null); if(extra&&extra.debut)extra.debut()},
    move(x,y){if(cur)cur(x,y)},
    end(){cur=null; if(extra&&extra.fin)extra.fin()}

}
function vider(pid){handles[pid]=[]}

/* ---------- dessin ---------- */
/** axe optique Δ, orienté */
function axe(a,G,o={}){
  const S=a.S, k=a.k, y=G.Y(0), x1=o.x1??G.left+4*k, x2=o.x2??G.right-6*k;
  return S.arrow(x1,y,x2,y,{c:a.C.ink2,w:1.1,dash:`${7*k} ${5*k}`,head:9*k})+

  const S=a.S,k=a.k,c=o.c||couleurs(a).lens,w=o.w??2.6; let s='';
  const hl=11*k, hw=7.5*k;

    s+=S.path(`M${x-hw},${yt-hl*.8}L${x},${yt}L${x+hw},${yt-hl*.8}`,{c,w:w*.85});

function pointAxe(a,G,x,label,o={}){
  const S=a.S,k=a.k,X=G.X(x),Y=G.Y(0),c=o.c||a.C.ink2;
  if(X<G.left+4||X>G.right-4)return'';

}
/** objet ou image transverse AB (flèche), pointillée si virtuelle */
function fleche(a,G,x,y,c,o={}){
  const S=a.S,k=a.k,X=G.X(x),Ya=G.Y(0),Yb=G.Y(y);let s='';
  if(Math.abs(Yb-Ya)<2)return '';

  if(o.B)s+=S.text(X+8*k,Yb+(y>=0?-2:2)*k,o.B,{base:y>=0?'bottom':'top',size:16,c,math:true});
  if(o.A)s+=S.text(X+(o.dxA??-7)*k,Ya+(y>=0?8:-8)*k,o.A,{anchor:'end',base:y>=0?'top':'bottom',size:15,c,math:true});

}

let phase=0;
function rayon(a,pts,c,o={}){

  const d='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L');
  if(o.dash)return S.path(d,{c,w:o.w??1.3,dash:`${6*k} ${5*k}`,op:o.op??.85});
  let s=S.path(d,{c,w:o.w??2,op:o.op});

    const ls=pts.slice(1).map((p,i)=>Math.hypot(p[0]-pts[i][0],p[1]-pts[i][1])), tot=ls.reduce((u,v)=>u+v,0);
    if(tot>1){const pas=Math.max(120*k,tot/4);for(let v0=(phase*90*k)%pas;v0<tot;v0+=pas){let v=v0,j=0;while(j<ls.length-1&&v>ls[j])v-=ls[j++];const u=v/ls[j],P=pts[j],Q=pts[j+1];
      s+=S.circle(P[0]+u*(Q[0]-P[0]),P[1]+u*(Q[1]-P[1]),3.6*k,{fill:c})}}}
  return s;
}
function pointe(a,p,q,c,w){const k=a.k,t=.55,mx=p[0]+(q[0]-p[0])*t,my=p[1]+(q[1]-p[1])*t,an=Math.atan2(q[1]-p[1],q[0]-p[0]),hl=(6+w*1.5)*k;
  return a.S.path(`M${(mx+hl*.55*Math.cos(an)).toFixed(1)},${(my+hl*.55*Math.sin(an)).toFixed(1)}L${(mx-hl*.45*Math.cos(an)-hl*.42*Math.sin(an)).toFixed(1)},${(my-hl*.45*Math.sin(an)+hl*.42*Math.cos(an)).toFixed(1)}L${(mx-hl*.45*Math.cos(an)+hl*.42*Math.sin(an)).toFixed(1)},${(my-hl*.45*Math.sin(an)-hl*.42*Math.cos(an)).toFixed(1)}Z`,{c:'none',fill:c})}
/** prolonge une droite (point, pente en px) jusqu'au bord gauche ou droit du repère */
function bord(G,x,y,pente,versDroite){const X=versDroite?G.right:G.left;return[X,y+pente*(X-x)]}
/** lettre F (objet de la focométrie) en coordonnées pixel : pied en (X,Y), hauteur H (signée : négative = renversée) */
function lettreF(a,X,Y,H,c,o={}){
  const S=a.S, h=Math.abs(H), sg=H>=0?1:-1, w=h*.55, e=Math.max(2.5*a.k,h*.14);
  const R=(x,y,ww,hh)=>{const xs=X+sg*x, ys=Y-sg*y;return S.rect(Math.min(xs,xs+sg*ww),Math.min(ys,ys-sg*hh),Math.abs(ww),Math.abs(hh),{fill:c,op:o.op})};
  return R(-e/2,0,e,h)+R(-e/2,h-e,w,e)+R(-e/2,h*.56,w*.8,e);
}
return{DEG,clamp,bar,couleurs,repere,poignee,activerGlisser,vider,axe,lentille,pointAxe,fleche,rayon,bord,lettreF,
  get phase(){return phase},set phase(v){phase=v}};
})();

// @description Mesurer la distance focale d'une lentille convergente sur un banc : projection et méthode de Bessel, méthode de Silbermann, autocollimation.
'use strict';
/* =====================================================================
   OP2 · Banc optique et focométrie
   Physique : Optics (../_Sources_Ateliers/optics.js, moteur d'origine inchangé).
   Objet (lettre F éclairée) fixe à la graduation 0, lentille mince en x, écran en D.
   Projection : x(D − x) = D f′ ; deux positions si D > 4f′ (Bessel : f′ = (D² − d²)/(4D)).
   Silbermann : γ = −1, D = 4f′. Autocollimation : objet dans le plan focal objet,
   aller, réflexion sur un miroir plan, retour (moteur Optics.autoRay).
   Tache de flou par Thalès : diamètre = Φ |x_écran − x_image| / |x_image − x|.
   ===================================================================== */
const O=window.Optics, K=window.OP2, M=AnimKit.M, H0=1.5; // hauteur de l'objet (cm)
const st={m1:null,m2:null,scan:0,gel:null};
const sig=(x,n=3)=>A.fmt.sig(x,n), fix=(x,d)=>A.fmt.fix(x,d);

const A=AnimKit.app({
  code:'OP2', partie:'TurquoiseLagon', chapitre:'OP2 Formation des images',
  titre:'Banc optique et focométrie', sousTitre:'Mesurer la distance focale d\'une lentille convergente',
  onglets:['Projection et Bessel','Silbermann','Autocollimation'],
  temps:true, pas:1/12,
  panneaux:[
    {id:'banc',titre:'Banc d\'optique (graduations en cm)',poids:2.4,zoom:true,ratioTel:.85},
    {id:'ecran',titre:'Sur l\'écran (vue de face)',type:'canvas',zoom:true,poids:1,ratioTel:.8,si:a=>a.p.apercu}],
  reglages:[
    {titre:'Situations',presets:[
      {label:'Nouvelle lentille inconnue',titre:'Tire au hasard une focale entre 6 et 15 cm',valeurs:{inconnue:true,sol:false},action:a=>{a.set('f',+(6+9*Math.random()).toFixed(1));st.m1=st.m2=null;a.toast('Nouvelle lentille : à vous de mesurer f′')}},
      {label:'Montage 4f′',onglets:[1],valeurs:{sol:true},action:a=>{a.set('D',+(4*a.p.f).toFixed(1));a.set('pos',+(2*a.p.f).toFixed(1))}},
      {label:'Réglage d\'autocollimation',onglets:[2],valeurs:{sol:true},action:a=>a.set('pos',a.p.f)}]},
    {titre:'Le banc',items:[
      {id:'pos',label:`Position de la lentille ${M.v('x')}`,min:3,max:97,step:.1,value:20,unit:'cm',dec:1},
      {id:'D',label:`Position de l'écran ${M.v('D')}`,min:20,max:100,step:.2,value:60,unit:'cm',dec:1,onglets:[0,1]},
      {id:'mir',label:'Distance lentille–miroir',min:3,max:20,step:.1,value:8,unit:'cm',dec:1,onglets:[2]},
      {id:'ap',label:`Diamètre utile ${M.v('Φ')}`,min:.5,max:5,step:.1,value:3,unit:'cm',dec:1},
      {type:'note',html:'Glisser la lentille et l\'écran. L\'objet éclairé reste à la graduation 0.'}]},
    {titre:'Mesures',onglets:[0],items:[
      {type:'boutons',items:[
        {label:`Relever ${M.v('x','1')}`,action:a=>{st.m1=a.p.pos}},
        {label:`Relever ${M.v('x','2')}`,action:a=>{st.m2=a.p.pos}},
        {label:'Effacer',action:()=>{st.m1=st.m2=null}}]},
      {type:'note',html:a=>`Relevés : ${M.v('x','1')} = ${st.m1===null?'—':fix(st.m1,1)+' cm'} ; ${M.v('x','2')} = ${st.m2===null?'—':fix(st.m2,1)+' cm'}. Deux positions distinctes donnant une image nette donnent ${M.v('d')} = |${M.v('x','2')} − ${M.v('x','1')}|.`}]},
    {titre:'La lentille',items:[
      {id:'inconnue',type:'check',label:'Focale inconnue (exercice)',value:true},
      {id:'f',label:`Distance focale ${M.v('f')}′`,min:5,max:18,step:.1,value:10,unit:'cm',dec:1,si:a=>!a.p.inconnue||a.p.sol}]},
    {titre:'Affichage',items:[
      {id:'rayons',type:'check',label:'Rayons issus du sommet de l\'objet',value:true},
      {id:'apercu',type:'check',label:'Vue de face de l\'écran',value:true},
      {id:'sol',type:'check',label:'Solutions et focale déduite (masquées au départ)',value:false}]}
  ],
  aide:{
    voit:'Un banc d\'optique gradué : un objet éclairé en forme de F à la graduation 0, une lentille convergente, puis un écran (ou un miroir plan pour l\'autocollimation). À droite, l\'écran vu de face, à l\'échelle : l\'image du F, renversée, nette ou floue.',
    faire:'<ul><li><b>Bessel</b> : pour un écran fixe, chercher en déplaçant la lentille les deux positions de netteté, les relever, puis calculer '+M.v('f')+'′. « Lecture » balaie la position de la lentille.</li><li><b>Silbermann</b> : déplacer lentille et écran jusqu\'à une image nette de même taille que l\'objet ('+M.v('γ')+' = −1).</li><li><b>Autocollimation</b> : régler la lentille pour que l\'image de retour soit nette dans le plan de l\'objet ; vérifier qu\'elle ne dépend pas de la position du miroir.</li><li>« Nouvelle lentille inconnue » tire une focale au hasard ; cocher « Solutions » pour vérifier.</li></ul>',
    modele:'Lentille mince idéale (conditions de Gauss), diaphragme circulaire de diamètre '+M.v('Φ')+'. La tache de flou d\'un point est un disque dont le diamètre se calcule par le théorème de Thalès ; l\'image floue du F est la somme de ces disques (moyenne sur la pupille, sans diffraction). Projection : '+M.v('x')+'('+M.v('D')+' − '+M.v('x')+') = '+M.v('D')+M.v('f')+'′, deux solutions si '+M.v('D')+' &gt; 4'+M.v('f')+'′ ; Bessel : '+M.v('f')+'′ = '+M.frac(M.v('D')+'<sup>2</sup> − '+M.v('d')+'<sup>2</sup>','4'+M.v('D'))+'. Silbermann : '+M.v('γ')+' = −1 et '+M.v('D')+' = 4'+M.v('f')+'′. Autocollimation : aller, réflexion sur le miroir plan, retour ; au réglage, le faisceau entre lentille et miroir est parallèle. Les relevés sont des lectures du modèle, sans incertitude ajoutée.',
    cours:'OP2 Formation des images, « Projection de l\'image d\'un objet » : '+K.bar('OA')+'<sup>2</sup> + '+M.v('D')+K.bar('OA')+' + '+M.v('D')+M.v('f')+'′ = 0 et condition '+M.v('D')+' ≥ 4'+M.v('f')+'′. Méthodes de focométrie des travaux pratiques.'
  },
  change(a,id,v){
    if(id==='D'&&a.p.pos>v-3)a.set('pos',+(v-3).toFixed(1),{silent:true});
    if(id==='pos'&&a.tab!==2&&v>a.p.D-3)a.set('pos',+(a.p.D-3).toFixed(1),{silent:true});
    if(id==='pos'&&a.tab===2&&v>40)a.set('pos',40,{silent:true});
  },
  onglet(a,i){a.play(false);if(i===0){a.set('D',60);a.set('pos',20)}if(i===1){a.set('D',50);a.set('pos',14)}if(i===2)a.set('pos',14)},
  reset(){st.scan=0},
  step(a,dt){st.scan+=dt;const p=a.p;
    const v=a.tab===2?p.f*(1+.3*Math.sin(st.scan*.25)):p.D/2+(p.D/2-4)*Math.sin(st.scan*.15);
    a.set('pos',+v.toFixed(2),{silent:true})},
  draw(a){const h=a.panels.ecran.head;if(h)h.textContent=a.tab===2?'Dans le plan de l\'objet (vue de face)':'Sur l\'écran (vue de face)';a.tab===2?autocol(a):projection(a)}
});

/* ---------- géométrie commune ---------- */
function regle(a,G,xmax,yR=-3.95){
  const S=a.S,k=a.k,y=G.Y(yR);let s=S.line(G.X(-2),y,G.X(xmax),y,{c:a.C.ink2,w:1.2});
  const pxcm=G.sx, maj=pxcm*5>34*k?5:10;
  for(let x=0;x<=xmax+1e-9;x++){const X=G.X(x);if(X<G.left||X>G.right)continue;
    if(x%maj===0){s+=S.line(X,y,X,y+7*k,{c:a.C.ink2,w:1.2})+S.text(X,y+9*k,String(x),{anchor:'middle',base:'top',size:13,halo:false})}
    else if(pxcm>4*k)s+=S.line(X,y,X,y+3.5*k,{c:a.C.ink2,w:.8})}
  return s;
}
function lentilleBanc(a,G,x,f,sol){
  const k=a.k, S=a.S; let s=K.lentille(a,G.X(x),1,G.Y(3.4),G.Y(-3.4),'𝓛');
  if(sol){s+=K.pointAxe(a,G,x-f,S.v('F'))+K.pointAxe(a,G,x+f,S.v('F′'))}
  s+=K.poignee(a,'banc',G.X(x),G.Y(-3.4),(px)=>{a.play(false);a.set('pos',+K.clamp(G.x(px),3,a.tab===2?40:a.p.D-3).toFixed(1))});
  return s;
}
function objetBanc(a,G){
  const S=a.S,k=a.k;
  return K.lettreF(a,G.X(0),G.Y(0),G.Y(0)-G.Y(H0),a.C.ink)+S.text(G.X(0)+G.sy*H0*.6+4*k,G.Y(H0),S.v('B'),{base:'bottom',size:16,math:true})+
    S.text(G.X(0)-5*k,G.Y(0)+5*k,S.v('A'),{anchor:'end',base:'top',size:15,math:true})+S.text(G.X(0),G.Y(-3.1),'objet éclairé',{anchor:'middle',base:'bottom',size:13});
}

/* ===================== PROJECTION, BESSEL, SILBERMANN ===================== */
function projection(a){
  const P=a.panels.banc, S=a.S, C=a.C, k=a.k, cc=K.couleurs(a), p=a.p, x=p.pos, D=p.D, f=p.f;
  K.vider('banc');
  const YR=-6.4, G=K.repere(P,{xmin:-5,xmax:Math.max(D+5,st.gel||0),ymax:7.2,my:10*k,cy:P.h*.47});
  const img=O.thin(-x,f), v=img.q, sd=D-x, diam=Number.isFinite(v)?Math.abs(p.ap*(sd-v)/v):p.ap, net=diam<.05, sol=O.bessel(D,f);
  let s=K.axe(a,G)+regle(a,G,D+4,YR)+objetBanc(a,G);
  // écran
  s+=S.line(G.X(D),G.Y(5.6),G.X(D),G.Y(-5.6),{c:C.ink2,w:4.5,cap:'butt'})+S.text(G.X(D)-6*k,G.Y(5.6),'écran',{anchor:'end',base:'top',size:14});
  s+=K.poignee(a,'banc',G.X(D),G.Y(-5.6),(px)=>{a.play(false);a.set('D',+K.clamp(G.x(px),20,100).toFixed(1))});
  // solutions
  if(p.sol){
    if(a.tab===0)sol.forEach((xs,i)=>{s+=S.line(G.X(xs),G.Y(3.9),G.X(xs),G.Y(-3.4),{c:C.pred,w:1.2,dash:`${5*k} ${4*k}`})+S.text(G.X(xs),G.Y(3.9),`${sol.length>1?S.v('x',i+1):S.v('x')} = ${fix(xs,1)}`,{anchor:'middle',base:'bottom',size:13,c:C.pred})});
    if(Number.isFinite(v)&&v>0&&x+v<D+4){const Xi=G.X(x+v),Yi=G.Y(img.g*H0);s+=S.line(Xi-6*k,Yi-6*k,Xi+6*k,Yi+6*k,{c:cc.img,w:2})+S.line(Xi-6*k,Yi+6*k,Xi+6*k,Yi-6*k,{c:cc.img,w:2})+S.text(Xi+7*k,Yi,S.v('B′'),{size:15,c:cc.img,math:true})}}
  // relevés
  if(a.tab===0)[st.m1,st.m2].forEach((xm,i)=>{if(xm===null)return;const X=G.X(xm),Y=G.Y(YR);
    s+=S.path(`M${X},${Y-2*k}l${-6*k},${-10*k}h${12*k}Z`,{c:'none',fill:C.E})+S.text(X,Y-13*k,S.v('x',i+1),{anchor:'middle',base:'bottom',size:14,c:C.E,math:true})});
  // rayons
  if(p.rayons){s+=`<defs><clipPath id="cb"><rect x="0" y="0" width="${P.w.toFixed(1)}" height="${(G.Y(YR+.2)).toFixed(1)}"/></clipPath></defs><g clip-path="url(#cb)">`;
    [-p.ap/2,0,p.ap/2].forEach((h,i)=>{const inc=(h-H0)/x,out=inc-h/f;
    s+=K.rayon(a,[[G.X(0),G.Y(H0)],[G.X(x),G.Y(h)],[G.X(D),G.Y(h+sd*out)]],cc.r[i],{w:1.8})});s+='</g>'}
  s+=lentilleBanc(a,G,x,f,p.sol);
  a.svg('banc',s);
  if(a.panelVisible('ecran'))ecran(a,{titre:'écran',img:{h:img.g*H0,flou:diam,net}});
  const d=st.m1!==null&&st.m2!==null?Math.abs(st.m2-st.m1):null;
  if(a.tab===0)a.metrics([
    {label:'Diamètre de la tache de flou',value:sig(diam*10,2),unit:'mm',hint:net?'image nette':''},
    {label:`Écart des relevés ${M.v('d')}`,value:d===null?'—':fix(d,1),unit:d===null?'':'cm'},
    {label:`Focale déduite ${M.v('f')}′ = ${M.frac(M.v('D')+'<sup>2</sup> − '+M.v('d')+'<sup>2</sup>','4'+M.v('D'))}`,value:d===null||d<.05?'—':p.sol?fix((D*D-d*d)/(4*D),2):'?',unit:d!==null&&d>=.05&&p.sol?'cm':''}]);
  else a.metrics([
    {label:'Diamètre de la tache de flou',value:sig(diam*10,2),unit:'mm',hint:net?'image nette':''},
    {label:`Grandissement ${M.v('γ')}`,value:Number.isFinite(img.g)?fix(img.g,2):'∞'},
    {label:`Focale ${M.v('f')}′ = ${M.frac(M.v('D'),'4')}`,value:p.sol?fix(D/4,2):'?',unit:p.sol?'cm':''}]);
  let msg;
  if(D<4*f-1e-9)msg=p.sol?`${M.v('D')} &lt; 4${M.v('f')}′ : aucune position de la lentille ne donne une image nette sur l'écran. Éloigner l'écran.`:'Aucune position de la lentille ne semble donner d\'image nette ? Éloigner l\'écran.';
  else if(a.tab===1)msg=net?(Math.abs(img.g+1)<.03?`Image nette et de même taille que l'objet, renversée : ${M.v('γ')} = −1. Alors ${M.v('D')} = 4${M.v('f')}′.`:'Image nette, mais de taille différente de l\'objet : déplacer à la fois la lentille et l\'écran.'):'Rechercher simultanément une image nette et un grandissement γ = −1.';
  else msg=net?`Image nette sur l'écran, ${Math.abs(img.g)>1?'agrandie':'réduite'} et renversée. ${d===null?'Relever cette position.':''}`:`Pour ${M.v('D')} &gt; 4${M.v('f')}′, il existe deux positions de netteté : l'une agrandit, l'autre réduit.`;
  a.insight(msg);
  a.legend(p.sol?[{c:C.pred,dash:true,label:'Positions de netteté'},{c:cc.img,label:'Image B′ (point de convergence)'}]:[]);
  a.clock('');
}

/* ===================== AUTOCOLLIMATION ===================== */
function autocol(a){
  const P=a.panels.banc, S=a.S, C=a.C, k=a.k, cc=K.couleurs(a), p=a.p, x=p.pos, f=p.f, xm=x+p.mir;
  K.vider('banc');
  const G=K.repere(P,{xmin:-5,xmax:Math.max(xm+6,30,st.gel||0),ymax:7.2,my:10*k,cy:P.h*.47}), YR=-6.4;
  let s=K.axe(a,G)+regle(a,G,G.xmax-1,YR)+objetBanc(a,G);
  // miroir plan
  s+=S.line(G.X(xm),G.Y(5.6),G.X(xm),G.Y(-5.6),{c:cc.lens,w:3.5});
  for(let y=G.Y(5.6)+8*k;y<G.Y(-5.6);y+=10*k)s+=S.line(G.X(xm),y,G.X(xm)+8*k,y-6*k,{c:C.ink2,w:1});
  s+=S.text(G.X(xm)+10*k,G.Y(5.6),'miroir plan',{base:'top',size:14,c:cc.lens});
  const R=[-.95,0,.95].map(h=>O.autoRay(x,f,p.mir,H0,h*p.ap/2));
  if(p.rayons)s+=`<defs><clipPath id="ca"><rect x="0" y="0" width="${P.w.toFixed(1)}" height="${G.Y(YR+.2).toFixed(1)}"/></clipPath></defs><g clip-path="url(#ca)">`;
  if(p.rayons)R.forEach((r,i)=>{
    s+=K.rayon(a,[[G.X(0),G.Y(H0)],[G.X(x),G.Y(r.h)],[G.X(xm),G.Y(r.yM)]],cc.r[0],{w:1.6});
    s+=K.rayon(a,[[G.X(xm),G.Y(r.yM)],[G.X(x),G.Y(r.y2)],[G.X(0),G.Y(r.ret)]],cc.r[1],{w:1.6})});
  if(p.rayons)s+='</g>';
  if(p.sol){s+=S.line(G.X(f),G.Y(3.9),G.X(f),G.Y(-3.4),{c:C.pred,w:1.2,dash:`${5*k} ${4*k}`})+S.text(G.X(f),G.Y(3.9),`${S.v('x')} = ${S.v('f')}′ = ${fix(f,1)}`,{anchor:'middle',base:'bottom',size:13,c:C.pred})}
  s+=lentilleBanc(a,G,x,f,p.sol);
  s+=K.poignee(a,'banc',G.X(xm),G.Y(-5.6),(px)=>a.set('mir',+K.clamp(G.x(px)-a.p.pos,3,20).toFixed(1)));
  a.svg('banc',s);
  const a0=R[0],b0=R[2], retu=Math.abs(a0.m2-b0.m2)<1e-12?Infinity:-(a0.y2-b0.y2)/(a0.m2-b0.m2);
  const etal=Math.max(...R.map(r=>r.ret))-Math.min(...R.map(r=>r.ret)), net=etal<.05;
  if(a.panelVisible('ecran'))ecran(a,{titre:'plan de l\'objet',objet:true,img:{h:R[1].ret,flou:etal,net}});
  a.metrics([
    {label:'Étalement de l\'image de retour',value:sig(etal*10,2),unit:'mm',hint:net?'retour net':''},
    {label:'Image de retour nette à la graduation',value:Number.isFinite(retu)?fix(x-retu,1):'∞',unit:Number.isFinite(retu)?'cm':'',hint:'objet à la graduation 0'},
    {label:`Focale ${M.v('f')}′ = distance objet–lentille`,value:p.sol?fix(x,1):'?',unit:p.sol?'cm':''}]);
  a.insight(Math.abs(x-f)<.05?'Objet dans le plan focal objet : le faisceau est parallèle entre la lentille et le miroir, l\'image de retour, renversée, est nette dans le plan de l\'objet, quelle que soit la position du miroir.'
    :'Déplacer la lentille jusqu\'à obtenir une image de retour nette, renversée, dans le plan de l\'objet. Changer ensuite la distance au miroir pour vérifier le réglage.');
  a.legend(p.rayons?[{c:cc.r[0],label:'Aller'},{c:cc.r[1],label:'Retour après réflexion'},p.sol?{c:C.pred,dash:true,label:'Plan focal objet'}:null]:[]);
  a.clock('');
}

/* ===================== VUE DE FACE (image floue calculée) =====================
   Image géométrique du F (renversée, grandissement γ) convoluée par le disque de
   défocalisation (pupille circulaire uniforme) : somme exacte sur le disque, ligne
   par ligne, grâce aux sommes cumulées de chaque ligne. Dessinée dans un canevas. */
const NR0=256, VUE0=10; // côté de la vue sans zoom (cm) ; zoom par les boutons − Cadrer + du panneau ; NR0 : pixels du calcul
let rc={key:'',cv:null};
function imageFloue(a,h,flou,yc,VUE){
  const key=[h.toFixed(3),flou.toFixed(3),yc.toFixed(3),VUE.toFixed(3),a.C.card,a.C.ink].join('|');if(rc.key===key)return rc.cv;
  const NR=flou*NR0/VUE/2>20?128:NR0; // résolution réduite pour un grand flou (calcul plus rapide, sans perte visible)
  const cv=rc.cv||document.createElement('canvas');cv.width=cv.height=NR;const c=cv.getContext('2d'),pc=NR/VUE;
  c.fillStyle='#fff';c.fillRect(0,0,NR,NR);c.fillStyle='#000';
  {const hh=Math.abs(h)*pc,sg=h>=0?1:-1,e=Math.max(1,hh*.14),w=hh*.55,X=NR/2,Y=NR/2+yc*pc;
   const Rc=(x,y,ww,hhh)=>{const xs=X+sg*x,ys=Y-sg*y;c.fillRect(Math.min(xs,xs+sg*ww),Math.min(ys,ys-sg*hhh),Math.abs(ww),Math.abs(hhh))};
   Rc(-e/2,0,e,hh);Rc(-e/2,hh-e,w,e);Rc(-e/2,hh*.56,w*.8,e)}
  const src=c.getImageData(0,0,NR,NR).data, ink=new Float32Array(NR*NR);
  for(let j=0;j<NR*NR;j++)ink[j]=1-src[j*4]/255;
  const r=flou*pc/2; let out=ink;
  if(r>.6){
    const W=NR+1, cum=new Float32Array(NR*W);
    for(let y=0;y<NR;y++){let acc=0;cum[y*W]=0;for(let x=0;x<NR;x++){acc+=ink[y*NR+x];cum[y*W+x+1]=acc}}
    const R=Math.ceil(r), half=[];let area=0;
    for(let dy=-R;dy<=R;dy++){const hw=Math.sqrt(Math.max(0,r*r-dy*dy));half.push(hw);area+=2*hw}
    out=new Float32Array(NR*NR);
    for(let y=0;y<NR;y++)for(let x=0;x<NR;x++){let sum=0;
      for(let i=0;i<half.length;i++){const yy=y+i-R;if(yy<0||yy>=NR)continue;const hw=half[i];if(hw<=0)continue;
        const xa=Math.max(0,Math.min(NR,x-hw+.5)),xb=Math.max(0,Math.min(NR,x+hw+.5)),ia=xa|0,ib=xb|0,b=yy*W;
        sum+=cum[b+ib]-cum[b+ia]+(xb-ib)*(ib<NR?ink[yy*NR+ib]:0)-(xa-ia)*(ia<NR?ink[yy*NR+ia]:0)}
      out[y*NR+x]=sum/area}
  }
