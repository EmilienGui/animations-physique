    requestAnimationFrame(()=>{if(side.scrollTop===0&&st>0)side.scrollTop=st});
  }
  A.refresh=refreshSettings;
  A.set=(id,v,{silent=false}={})=>{A.p[id]=v;if(items[id]){items[id].show(v);items[id]._last=v}if(!silent&&cfg.change)cfg.change(A,id,v);refreshSettings();A.render()};
  A.preset=ps=>{A.play(false);A.cadrerTout();for(const[k,v]of Object.entries(ps.valeurs||{})){A.p[k]=v;if(cfg.change)cfg.change(A,k,v)}refreshSettings();A.reset();if(ps.action)ps.action(A);if(ps.lecture)A.play(true);A.render()};
  A.enable=(id,on)=>{const b=document.getElementById('b_'+id);if(b)b.disabled=!on};

  /* ---------- affichages ---------- */
  A.metrics=arr=>{const L=(arr||[]).filter(Boolean),hh=L.some(m=>m.hint);metrics.classList.toggle('has-h',hh);ak.classList.toggle('ak-has-metrics',L.length>0);const html=L.map(m=>`<div class="ak-card ak-metric${m.warn?' warn':''}"><div class="k">${m.label}</div><div class="v">${m.value}${m.unit?(m.unit==='°'?'°':`<span class="u">${m.unit}</span>`):''}</div><div class="h">${m.hint||''}</div></div>`).join('');if(metrics._h!==html){metrics.innerHTML=html;metrics._h=html}};
  // Bloc « À retenir » retiré le 6 novembre 2026 : l'appel reste accepté, sans effet.
  A.insight=()=>{};
  A.legend=arr=>{const html=(arr||[]).filter(Boolean).map(l=>`<span><i class="${l.dash?'dash':l.dot?'dot':''}" style="background:${l.c};--lc:${l.c}"></i>${l.label}</span>`).join('');if(legend._h!==html){legend.innerHTML=html;legend._h=html}};
  A.clock=html=>{const c=$('.ak-clock',tr);if(c._h!==html){c.innerHTML=html;c._h=html}};
  A.toast=m=>{toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastEl._h);toastEl._h=setTimeout(()=>toastEl.classList.remove('show'),1800)};
  A.panelVisible=id=>!A.panels[id].el.hidden;

  /* ---------- tailles ---------- */
  function viewBox(P){
    const {w,h,vx,vy,vz}=P;
    P.node.setAttribute('viewBox',P.vue==='svg'?`${vx.toFixed(2)} ${vy.toFixed(2)} ${(w/vz).toFixed(2)} ${(h/vz).toFixed(2)}`:`0 0 ${w.toFixed(1)} ${h.toFixed(1)}`);
  }
  function measure(){
    A.narrow=ak.clientWidth<=640; ak.style.setProperty('--ak-top',(top.offsetHeight+(tabs?tabs.offsetHeight:0))+'px');
    {const home=A.narrow?right:side;if(metrics.parentNode!==home||(!A.narrow&&side.lastElementChild!==metrics))home.append(metrics)} A.k=ak.classList.contains('is-proj')?1.6:A.narrow?1:1.15;
    for(const P of Object.values(A.panels)){
      if(P.el.hidden)continue;
      if(A.narrow){const w=P.el.clientWidth||ak.clientWidth;P.node.style.height=Math.round(w*(P.cfg.ratioTel??.8))+'px'}else P.node.style.height='';
      const r=P.node.getBoundingClientRect(); P.w=Math.max(50,r.width); P.h=Math.max(50,r.height);
      if(P.type==='canvas'){const d=window.devicePixelRatio||1;if(P.node.width!==Math.round(P.w*d)||P.node.height!==Math.round(P.h*d)){P.node.width=Math.round(P.w*d);P.node.height=Math.round(P.h*d)}P.ctx=P.node.getContext('2d');P.ctx.setTransform(d,0,0,d,0,0)}
      else viewBox(P);
    }
  }
  /* ---------- rendu ---------- */
  let graphPanels=[];
  const activeChartView=P=>P?.vue==='graphe'&&zoomed(P)?P:null;
  function drawFrame(){
    const frame={graphs:[],views:graphPanels.map(activeChartView),outputs:new Map()};
    A._graphFrame=frame;
    try{cfg.draw?.(A)}finally{A._graphFrame=null}
    graphPanels=[];
    for(const [P,output] of frame.outputs){
      const graphs=[...output.html.matchAll(/<g data-ak-graph="(\d+)">/g)].map(m=>frame.graphs[+m[1]]).filter(Boolean);
      output.graphs=graphs;
      if(P.vue==='svg'||P.vue==='graphe'){
        const vue=graphs.length?'graphe':'svg';
        if(vue!==P.vue){P.vue=vue;resetView(P);viewBox(P)}
        P.graphs=graphs;
      }
      const view=activeChartView(P);
      for(const graph of graphs){
        graphPanels[graph.id]=P;
        if(graph.view!==view)frame.changed=true;
      }
    }
    return frame;
  }
  function clipCharts(node,graphs){
    const svgElement=tag=>document.createElementNS(node.namespaceURI,tag);
    for(const graph of graphs){
      const axes=node.querySelector(`[data-ak-graph="${graph.id}"]`);
      if(!axes)continue;
      const id='ak-cadre-'+graph.id, defs=svgElement('defs'),clip=svgElement('clipPath'),rect=svgElement('rect');
      clip.id=id;
      for(const [k,v] of Object.entries({x:graph.x0,y:graph.y0,width:graph.w,height:graph.h}))rect.setAttribute(k,v);
      clip.append(rect);defs.append(clip);axes.append(defs);
      let layer=null;
      for(let next=axes.nextElementSibling;next&&!next.hasAttribute('data-ak-graph');){
        const child=next;next=child.nextElementSibling;
        if(child.localName==='defs'||child.hasAttribute('data-ak-hors-graphe')){layer=null;continue}
        if(!layer){
          layer=svgElement('g');
          layer.setAttribute('clip-path',`url(#${id})`);
          child.before(layer);
        }
        layer.append(child);
      }
    }
  }
  function writeSvg(P,html,graphs=[]){
    if(P.node._h===html)return;
    P.node.innerHTML=html;
    P.node._h=html;
    if(activeChartView(P))clipCharts(P.node,graphs);
  }
  A.renderNow=()=>{
    A._dirty=false;measure();
    let frame=drawFrame();
    // Si un réglage change l'ordre des tracés, associer à nouveau le zoom à son panneau.
    if(frame.changed)frame=drawFrame();
    for(const [P,output] of frame.outputs)writeSvg(P,output.html,output.graphs);
    syncScrub();guardScroll();
  };
  A.render=()=>{if(A._dirty)return;A._dirty=true;requestAnimationFrame(()=>{if(A._dirty)A.renderNow()})};
  A.svg=(id,html)=>{
    const P=A.panels[id];if(!P)return;
    if(A._graphFrame)A._graphFrame.outputs.set(P,{html});
    else writeSvg(P,html);
  };

  /* ---------- temps ---------- */
  let last=0;
  const playBtn=$('.ak-play',tr);
  A.play=on=>{on=on===undefined?!A.running:on;if(on&&cfg.peutLire&&!cfg.peutLire(A))on=false;A.running=on;playBtn.textContent=on?'❚❚ Pause':'▶ Lecture';if(on){last=performance.now();requestAnimationFrame(loop)}};
  function loop(now){if(!A.running)return;const dt=Math.min(.05,(now-last)/1000)*A.speed;last=now;if(cfg.step)cfg.step(A,dt);A.renderNow();requestAnimationFrame(loop)}
  A.stepOnce=()=>{A.play(false);if(cfg.step)cfg.step(A,cfg.pas??1/24);A.render()};
  A.reset=()=>{A.play(false);A.t=0;if(cfg.reset)cfg.reset(A);A.render()};
  $('.ak-speed',tr).onchange=e=>{A.speed=+e.target.value};A.speed=cfg.vitesse||1;

  /* ---------- onglets ---------- */
  A.setTab=i=>{if(!tabs||i<0||i>=cfg.onglets.length)return;A.tab=i;A.cadrerTout();$$('.ak-tab',tabs).forEach((b,j)=>b.setAttribute('aria-selected',String(j===i)));if(cfg.onglet)cfg.onglet(A,i);refreshSettings();A.render()};

  /* ---------- thème, projection, plein écran ---------- */
  A.setTheme=t=>{root.dataset.theme=t;readColors();syncMenu();A.renderNow()};
  A.setProj=on=>{
    ak.classList.toggle('is-proj',on);
    ak.classList.remove('drawer-open');
    projButton.classList.toggle('on',on);
    syncMenu();
    A.render();
  };
  const acts={
    play:()=>A.play(),step:()=>A.stepOnce(),reset:()=>A.reset(),
    help:()=>{dlg.showModal()},theme:()=>A.setTheme(root.dataset.theme==='dark'?'light':'dark'),
    image:()=>A.exportImage(),proj:()=>{
      const projected=ak.classList.contains('is-proj');
      A.setProj(!projected);
      if(cfg.menuCommun&&projected&&A.narrow)ak.classList.add('drawer-open');
    },
    fs:()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>A.toast('Plein écran refusé par le navigateur'))},
    settings:()=>{ak.classList.toggle('drawer-open');A.render()}
  };
  ak.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&acts[b.dataset.act])acts[b.dataset.act]()});
  addEventListener('keydown',e=>{
    if(dlg.open||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.target.matches('input,select,textarea'))return;
    const k=e.key.toLowerCase(), custom=cfg.touches&&cfg.touches[k];
    if(custom){e.preventDefault();custom(A);A.render();return}
    if(k===' '&&!tr.hidden){e.preventDefault();acts.play()}
    else if(k==='arrowright'&&!tr.hidden){e.preventDefault();acts.step()}
    else if(k==='r'&&!tr.hidden)acts.reset();
    else if(k==='h'||k==='?')acts.help();else if(k==='p')acts.proj();else if(k==='f')acts.fs();else if(k==='t')acts.theme();else if(k==='i')acts.image();
    else if(k==='+'||k==='='||k==='-'||k==='0'){const P=(A._hover&&!A._hover.el.hidden&&A._hover.vue)?A._hover:Object.values(A.panels).find(q=>q.vue&&!q.el.hidden);if(P){e.preventDefault();if(k==='0')A.cadrer(P);else A.zoomer(P,k==='-'?.8:1.25)}}
    else if(k==='escape'){ak.classList.remove('drawer-open');A.render()}
    else if(/^[1-9]$/.test(k))A.setTab(+k-1);
  });

  /* ---------- vue : zoom, cadrage, déplacement ---------- */
  const deplacable=P=>P.vue==='svg'||P.vue==='graphe';
  function zoomed(P){
    if(P.vue==='interne')return Math.abs(P.zoom-1)>1e-6;
    if(!deplacable(P))return false;
    const seuil=P.vue==='graphe'?1e-6:.5;
    return Math.abs(P.vz-1)>1e-6||Math.abs(P.vx)>seuil||Math.abs(P.vy)>seuil;
  }
  const markZoom=P=>{if(P.tools)P.tools.classList.toggle('is-zoomed',zoomed(P))};
  const graphAt=(P,x,y)=>P.graphs.find(g=>x>=g.x0&&x<=g.x0+g.w&&y>=g.y0&&y<=g.y0+g.h);
  function resetView(P){P.vz=1;P.vx=P.vy=0;P.zoom=1;P.panX=P.panY=0;markZoom(P)}
  /** zoom d'un facteur f autour du point (px, py) de l'écran du panneau (centre par défaut) */
  A.zoomer=(P,f,px,py)=>{if(typeof P==='string')P=A.panels[P];if(!P||!P.vue)return;
    if(P.vue==='interne')P.zoom=Math.max(.4,Math.min(5,P.zoom*f));
    else{
      if(P.vue==='graphe'){
        const graph=graphAt(P,px,py);
        px=graph?(px-graph.x0)/graph.w:.5;
        py=graph?(py-graph.y0)/graph.h:.5;
      }else{px=px??P.w/2;py=py??P.h/2}
      const z=Math.max(.5,Math.min(8,P.vz*f)), delta=1/P.vz-1/z;
      P.vx+=px*delta;P.vy+=py*delta;P.vz=z;
    }
    markZoom(P);A.render()};
  A.deplacer=(P,dx,dy,px,py)=>{
    if(!deplacable(P))return;
    if(P.vue==='graphe'){const g=graphAt(P,px,py)||P.graphs[0];dx/=g.w;dy/=g.h}
    P.vx-=dx/P.vz;P.vy-=dy/P.vz;markZoom(P);A.render()
  };
  A.cadrer=P=>{if(typeof P==='string')P=A.panels[P];if(!P)return;resetView(P);A.render()};
  A.cadrerTout=()=>{for(const P of Object.values(A.panels))A.cadrer(P)};
  /* ---------- glisser dans un panneau ----------
     Les coordonnées transmises aux animations sont celles de leur dessin (vue zoomée comprise).
     Maj + glisser, bouton du milieu ou deux doigts : déplacer la vue ; molette ou pincement : zoomer.
     Glisser hors de tout objet manipulable déplace aussi la vue quand elle est zoomée. */
  function wire(P){const N=P.node,pts=new Map();let mode=null,h=null,last=null,pin=null;
    const scr=e=>{const r=N.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    const toV=s=>P.vue==='svg'?[P.vx+s[0]/P.vz,P.vy+s[1]/P.vz]:s;
    const two=()=>{const[a,b]=[...pts.values()];return{d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,c:[(a[0]+b[0])/2,(a[1]+b[1])/2]}};
    N.addEventListener('pointerdown',e=>{
      const s=scr(e);A._hover=P;pts.set(e.pointerId,s);
      if(pts.size===2&&P.vue){if(mode==='drag'&&h&&h.end)h.end(e);mode='pinch';h=null;pin=two();N.setPointerCapture(e.pointerId);e.preventDefault();return}
      if(pts.size>1)return;
      const[x,y]=toV(s);
      if(deplacable(P)&&(e.shiftKey||e.button===1))mode='pan';
      else{h=P._drags.find(d=>!d.hit||d.hit(x,y,e))||null;
        if(h){mode='drag';if(h.start)h.start(x,y,e)}
        else if(deplacable(P)&&zoomed(P))mode='pan';
        else{mode=null;return}}
      last=s;N.setPointerCapture(e.pointerId);e.preventDefault();A.render()});
    N.addEventListener('pointermove',e=>{const s=scr(e);
      if(!pts.has(e.pointerId)){if(e.pointerType==='mouse'){const[x,y]=toV(s);N.style.cursor=P._drags.some(d=>d.hit&&d.hit(x,y,e))?'grab':(deplacable(P)&&(e.shiftKey||zoomed(P)))?'move':''}return}
      pts.set(e.pointerId,s);
      if(mode==='pinch'&&pts.size>=2){const q=two();A.zoomer(P,q.d/pin.d,q.c[0],q.c[1]);A.deplacer(P,q.c[0]-pin.c[0],q.c[1]-pin.c[1],q.c[0],q.c[1]);pin=q;return}
      if(mode==='pan'){A.deplacer(P,s[0]-last[0],s[1]-last[1],last[0],last[1]);last=s;return}
      if(mode==='drag'&&h){const[x,y]=toV(s);h.move(x,y,e);A.render()}});
    const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
      if(mode==='drag'&&h&&h.end)h.end(e);
      if(pts.size===0){mode=null;h=null}else if(mode==='pinch'){mode='pan';last=[...pts.values()][0]}
      A.render()};
    N.addEventListener('pointerup',end);N.addEventListener('pointercancel',end);
    if(P.vue){
      N.addEventListener('wheel',e=>{if(A.narrow&&!e.ctrlKey)return;e.preventDefault();const s=scr(e);A.zoomer(P,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),s[0],s[1])},{passive:false});
      N.addEventListener('dblclick',e=>{const[x,y]=toV(scr(e));if(!P._drags.some(d=>d.hit&&d.hit(x,y,e))&&zoomed(P))A.cadrer(P)});
      N.addEventListener('pointerenter',()=>{A._hover=P});
    }
  }
  for(const P of Object.values(A.panels))wire(P);
  A.drag=(id,h)=>{A.panels[id]._drags.push(h)};

  /* ---------- export image (toujours en thème clair) ---------- */
  A.exportImage=async()=>{
    const was=root.dataset.theme; root.dataset.theme='light'; readColors(); A.renderNow();
    const vis=Object.values(A.panels).filter(P=>!P.el.hidden), base=pwrap.getBoundingClientRect(), sc=2;
    const cv=document.createElement('canvas'); cv.width=Math.round(base.width*sc); cv.height=Math.round(base.height*sc);
    const ctx=cv.getContext('2d'); ctx.fillStyle=A.C.card; ctx.fillRect(0,0,cv.width,cv.height);
    const jobs=vis.map(P=>new Promise(res=>{const r=P.node.getBoundingClientRect(), x=(r.left-base.left)*sc, y=(r.top-base.top)*sc;
      if(P.type==='canvas'){ctx.drawImage(P.node,x,y,r.width*sc,r.height*sc);res();return}
      const clone=P.node.cloneNode(true); clone.setAttribute('width',r.width); clone.setAttribute('height',r.height);
      const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
      const im=new Image(); im.onload=()=>{ctx.drawImage(im,x,y,r.width*sc,r.height*sc);res()}; im.onerror=()=>res(); im.src=src;}));
    await Promise.all(jobs);
    root.dataset.theme=was; readColors(); A.renderNow();
    const a=document.createElement('a'); const tabName=cfg.onglets&&cfg.onglets.length>1?'_'+(A.tab+1):'';
    a.download=`${cfg.code}_${(cfg.fichier||cfg.titre).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_')}${tabName}.png`;
    a.href=cv.toDataURL('image/png'); a.click(); A.toast('Image enregistrée (thème clair)');
  };

  /* ---------- aide ---------- */
  function buildHelp(){
    const h=cfg.aide||{}, sec=(t,c)=>c?`<h4>${t}</h4>${/^\s*</.test(c)?c:`<p>${c}</p>`}`:'';
    dlg.innerHTML=`<header><h3>Aide · ${cfg.titre}</h3><button class="mini" data-close>Fermer ✕</button></header><div class="db">
    ${cfg.sousTitre?`<p class="ak-dlg-sub">${cfg.sousTitre}</p>`:''}${sec('Ce qu\'on voit',h.voit)}${sec('Ce qu\'on peut faire',h.faire)}${sec('Modèle et hypothèses',h.modele)}${sec('Lien avec le cours',h.cours)}${sec('Pour aller plus loin',h.plus)}
    <h4>Raccourcis</h4><p>${cfg.temps?'<kbd>Espace</kbd> lecture / pause · <kbd>→</kbd> pas à pas · <kbd>R</kbd> recommencer · ':''}${tabs?`<kbd>1</kbd>–<kbd>${cfg.onglets.length}</kbd> onglets · `:''}<kbd>P</kbd> projection · <kbd>F</kbd> plein écran · <kbd>T</kbd> thème · <kbd>I</kbd> image · <kbd>H</kbd> aide${h.touches?' · '+h.touches:''}</p>
    <p>Vue : molette, pincement ou <kbd>+</kbd> <kbd>−</kbd> pour zoomer · <kbd>Maj</kbd> + glisser, deux doigts, ou glisser une vue zoomée pour la déplacer · « Cadrer », <kbd>0</kbd> ou double clic : vue initiale.</p>
    ${h.credits?`<h4>Crédits</h4><p>${h.credits}</p>`:''}</div>`;
    dlg.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===dlg)dlg.close()});
  }

  /* ---------- démarrage ---------- */
  buildSettings(); buildHelp(); readColors();
  if(cfg.init)cfg.init(A);
  refreshSettings(); A.reset();
  new ResizeObserver(()=>A.render()).observe(ak);
  return A;
}

window.AnimKit={app,fmt,M,ticks,niceStep,FONT,MATH,interrupteur};
})();

</script>
<script>
'use strict';
/* =====================================================================
   PH2 · Outils statistiques (sans dépendance, testés par Verifier_Modele.cjs)
   Incertitude-type : type A (s/√N), type B (Δ/√3), composition, propagation (somme,
   produit, formule quelconque par Monte-Carlo), écart normalisé, régression linéaire
   (avec transformations d'axes), comparaison multi-mesures, parseur de tableaux/CSV.
   ===================================================================== */
const PH2=(function(){
const P={};
const SQ3=Math.sqrt(3);

/* ---------- tirages (générateur à graine : reproductible ; Box-Muller par paire) ---------- */
P.rng=function(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}};
P.gauss=function(r){
  if(r._has){r._has=false;return r._sp}
  let u=0;while(u===0)u=r();
  const mag=Math.sqrt(-2*Math.log(u)),ang=2*Math.PI*r();
  r._sp=mag*Math.sin(ang);r._has=true;
  return mag*Math.cos(ang);
};

/* ---------- lecture de nombres et parseur CSV / tableur ---------- */
P.lire=function(s){
  if(typeof s==='number')return s;
  s=String(s??'').trim().replace(/[\s\u00A0\u202F]/g,'').replace(/,/g,'.').replace(/[−–]/g,'-').replace(/[×x]10\^?/i,'e');
  return s===''?NaN:Number(s);
};
P.parseEntete=function(s){
  const t=String(s??'').trim().replace(/^["']|["']$/g,'').trim();
  const m=t.match(/^(.+?)\s*[\[(]([^\]()]+)[\])]\s*$/);
  if(m)return{nom:m[1].trim(),unite:m[2].trim()};
  return{nom:t,unite:''};
};
P.parseTableau=function(text){
  const brut=String(text??'').replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  const lignes=brut.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lignes.length)return{rows:[],headers:[],delim:'',skippedHeaders:0};
  const hasTab=lignes.some(l=>l.includes('\t'));
  const hasSemi=!hasTab&&lignes.some(l=>l.includes(';'));
  let delim='';
  if(hasTab)delim='\t';
  else if(hasSemi)delim=';';
  else{
    const hasComma=lignes.some(l=>l.includes(','));
    if(hasComma){
      const multiComma=lignes.some(l=>(l.match(/,/g)||[]).length>=2);
      const dotAndComma=lignes.some(l=>/\.\d*\s*,|,\s*-?\d*\./.test(l));
      const commaSpace=lignes.some(l=>/,\s+/.test(l));
      const headerComma=!/^[\d\s.,+\-eE]+$/.test(lignes[0])&&lignes[0].includes(',');
      if(multiComma||dotAndComma||commaSpace||headerComma)delim=',';
    }
  }
  const splitLigne=l=>{
    if(!delim)return l.split(/\s+/).filter(Boolean);
    return l.split(delim).map(c=>c.trim().replace(/^["']|["']$/g,'').trim());
  };
  const parsed=lignes.map(splitLigne);
  const estNumerique=cells=>cells.some(c=>c!==''&&isFinite(P.lire(c)));
  let headers=[],skippedHeaders=0,idx=0;
  while(idx<parsed.length&&!estNumerique(parsed[idx])){
    if(idx===0)headers=parsed[idx];
    skippedHeaders++;idx++;
  }
  return{rows:parsed.slice(idx),headers,delim:delim||' ',skippedHeaders};
};

/* ---------- statistiques d'une série ---------- */
P.mean=v=>{let s=0;for(let i=0;i<v.length;i++)s+=v[i];return v.length?s/v.length:NaN};
P.sd=(v,m)=>{const n=v.length;if(n<2)return NaN;if(m===undefined)m=P.mean(v);let s=0;for(let i=0;i<n;i++)s+=(v[i]-m)*(v[i]-m);return Math.sqrt(s/(n-1))};
P.typeA=v=>{const n=v.length,m=P.mean(v),s=P.sd(v,m);return{n,mean:m,s,u:n>1?s/Math.sqrt(n):NaN}};
P.uniforme=D=>D/SQ3;
P.notice=(lecture,pct,digits,res)=>pct/100*Math.abs(lecture)+digits*res;
P.compose=(...u)=>Math.sqrt(u.reduce((s,x)=>s+x*x,0));
P.ecartNorm=(x1,u1,x2,u2)=>{const d=Math.sqrt(u1*u1+u2*u2);return d>0?Math.abs(x1-x2)/d:(x1===x2?0:Infinity)};

/* arrondi : u par excès à 2 chiffres significatifs, valeur arrondie au même rang */
P.arrondi=function(x,u){
  if(!(u>0)||!isFinite(u)||!isFinite(x))return null;
  let e=Math.floor(Math.log10(u)),q=Math.pow(10,e-1),m=Math.ceil(u/q-1e-9);
  if(m>=100){m=10;e+=1;q=Math.pow(10,e-1)}
  let rx=Math.round(x/q)*q;
  if(Object.is(rx,-0)||rx===0)rx=0;
  return{x:rx,u:m*q,d:Math.max(0,1-e),e};
};
/** mise en forme (fixe ou scientifique cohérente avec le rang de u) */
P.formater=function(x,u){
  const r=P.arrondi(x,u);
  if(!r)return null;
  const eu=r.e,ex=r.x!==0?Math.floor(Math.log10(Math.abs(r.x))):eu;
  const sci=ex<-3||ex>5||eu<-3||eu>5;
  if(sci){
    const fu=Math.pow(10,eu);
    if(r.x===0)return{sci:true,xStr:'0.0',ex:eu,uStr:(r.u/fu).toFixed(1),eu,r};
    const f=Math.pow(10,ex),dx=Math.max(0,ex-(eu-1));
    let xm=r.x/f,eUse=ex;
    if(Math.abs(Number(xm.toFixed(dx)))>=10){eUse++;xm=r.x/Math.pow(10,eUse)}
    const dxUse=Math.max(0,eUse-(eu-1));
    return{sci:true,xStr:xm.toFixed(dxUse),ex:eUse,uStr:(r.u/fu).toFixed(1),eu,r};
  }
  return{sci:false,xStr:r.x.toFixed(r.d),ex:0,uStr:r.u.toFixed(r.d),eu:0,r};
};

/* ---------- histogramme à classes « rondes » ---------- */
function nice(raw){const p=Math.pow(10,Math.floor(Math.log10(raw))),r=raw/p;return(r<1.4?1:r<2.25?2:r<3.5?2.5:r<7?5:10)*p}
P.classes=n=>Math.max(6,Math.min(60,Math.round(Math.sqrt(n)*1.2)));
P.hist=function(v,n){
  n=n===undefined?v.length:n;
  if(n<1)return null;
  let mn=Infinity,mx=-Infinity;for(let i=0;i<n;i++){if(v[i]<mn)mn=v[i];if(v[i]>mx)mx=v[i]}
  if(!isFinite(mn)||!isFinite(mx))return null;
  if(!(mx>mn)){const w=Math.abs(mn)*0.01||1;return{w,lo:mn-w,c:[0,n,0],nb:3,max:n}}
  const w=nice((mx-mn)/P.classes(n)),lo=Math.floor(mn/w+1e-9)*w,nb=Math.floor((mx-lo)/w+1e-9)+1,c=new Array(nb).fill(0);
  for(let i=0;i<n;i++){let k=Math.floor((v[i]-lo)/w+1e-9);if(k>=nb)k=nb-1;if(k<0)k=0;c[k]++}
  return{w,lo,nb,c,max:Math.max(...c)};
};
P.compte=function(v,k,lay){const c=new Array(lay.nb).fill(0);for(let i=0;i<k;i++){let j=Math.floor((v[i]-lay.lo)/lay.w+1e-9);if(j>=lay.nb)j=lay.nb-1;if(j<0)j=0;c[j]++}return c};
P.pdf=(x,m,s)=>Math.exp(-0.5*((x-m)/s)*((x-m)/s))/(s*Math.sqrt(2*Math.PI));
/** nombre de valeurs dans ±k s autour de la moyenne (k = 1, 2, 3) */
P.bandes=function(v,n,m,s){const out=[0,0,0];for(let i=0;i<n;i++){const d=Math.abs(v[i]-m);for(let k=0;k<3;k++)if(d<=(k+1)*s)out[k]++}return out};
P.modeleBandes=[0.682689492,0.954499736,0.997300204];

/* ---------- formule libre (parseur récursif sûr : gère -x^2, 2pi*f, sind/cosd/tand/rad/deg) ---------- */
const FONCTIONS={
  sqrt:'Math.sqrt',exp:'Math.exp',ln:'Math.log',log:'Math.log10',log10:'Math.log10',
  sin:'Math.sin',cos:'Math.cos',tan:'Math.tan',asin:'Math.asin',acos:'Math.acos',atan:'Math.atan',
  abs:'Math.abs',sinh:'Math.sinh',cosh:'Math.cosh',tanh:'Math.tanh',
  rad:'((__a)=>__a*Math.PI/180)',deg:'((__a)=>__a*180/Math.PI)',
  sind:'((__a)=>Math.sin(__a*Math.PI/180))',cosd:'((__a)=>Math.cos(__a*Math.PI/180))',tand:'((__a)=>Math.tan(__a*Math.PI/180))',
  asind:'((__a)=>Math.asin(__a)*180/Math.PI)',acosd:'((__a)=>Math.acos(__a)*180/Math.PI)',atand:'((__a)=>Math.atan(__a)*180/Math.PI)'
};
P.nomValide=s=>/^[A-Za-z_][A-Za-z_0-9]*$/.test(s)&&!(s in FONCTIONS)&&s!=='pi'&&!/^(Math|Function|window|document|this|eval|constructor|prototype|globalThis)$/.test(s);

P.compiler=function(expr,noms){
  let s=String(expr??'').trim().replace(/,/g,'.').replace(/[×·]/g,'*').replace(/[−–]/g,'-').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/\*\*/g,'^');
  if(!s)return{err:'Formule vide.'};
  if(!/^[0-9A-Za-z_\s+\-*/^().]*$/.test(s))return{err:'Caractère non accepté dans la formule.'};
  /* tokenisation */
  const raw=[];let i=0;
  while(i<s.length){
    const ch=s[i];
    if(/\s/.test(ch)){i++;continue}
    if(/\d/.test(ch)||(ch==='.'&&/\d/.test(s[i+1]||''))){
      const m=s.slice(i).match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/);
      raw.push({t:'num',v:m[0]});i+=m[0].length;continue;
    }
    if(/[A-Za-z_]/.test(ch)){
      const m=s.slice(i).match(/^[A-Za-z_]\w*/);
      const id=m[0];
      if(id in FONCTIONS)raw.push({t:'fn',v:FONCTIONS[id],n:id});
      else if(id==='pi')raw.push({t:'val',v:'Math.PI',n:'pi'});
      else if(noms.includes(id))raw.push({t:'val',v:id,n:id});
      else return{err:'Symbole inconnu : '+id+'.'};
      i+=id.length;continue;
    }
    if('+-*/^()'.includes(ch)){raw.push({t:ch,v:ch});i++;continue}
    return{err:'Caractère non accepté : '+ch+'.'};
  }
  /* multiplication implicite : 2pi, 2(x+1), (a+b)(c+d), 2sqrt(x), a(b+c), pi L */
  const tok=[];
  for(let k=0;k<raw.length;k++){
    const c=raw[k],p=tok[tok.length-1];
    if(p){
      const pFin=p.t==='num'||p.t==='val'||p.t===')';
      const cDeb=c.t==='val'||c.t==='fn'||c.t==='('||c.t==='num';
      if(pFin&&cDeb)tok.push({t:'*',v:'*'});
    }
    tok.push(c);
  }
  /* analyseur récursif : expr → term → unary → power → primary (-x^2 ≡ -(x**2), b^-1 ≡ b**(-1)) */
  let pos=0;
  const peek=()=>tok[pos];
  function parseExpr(){
    let left=parseTerm();
    while(peek()&&(peek().t==='+'||peek().t==='-')){const op=tok[pos++].t;left=`(${left}${op}${parseTerm()})`}
    return left;
  }
  function parseTerm(){
    let left=parseUnary();
    while(peek()&&(peek().t==='*'||peek().t==='/')){const op=tok[pos++].t;left=`(${left}${op}${parseUnary()})`}
    return left;
  }
  function parseUnary(){
    if(peek()&&(peek().t==='+'||peek().t==='-')){const op=tok[pos++].t;return `(${op}${parseUnary()})`}
    return parsePower();
  }
  function parsePower(){
    let base=parsePrimary();
    if(peek()&&peek().t==='^'){pos++;return `((${base})**(${parseUnary()}))`}
    return base;
  }
  function parsePrimary(){
    const c=peek();
    if(!c)throw new Error('Fin de formule inattendue.');
    if(c.t==='num'||c.t==='val'){pos++;return c.v}
    if(c.t==='fn'){
      pos++;
      if(!peek()||peek().t!=='(')throw new Error(`Parenthèses attendues après ${c.n}.`);
      pos++;
      const arg=parseExpr();
      if(!peek()||peek().t!==')')throw new Error(`Parenthèse fermante manquante après ${c.n}.`);
      pos++;
      return `${c.v}(${arg})`;
    }
    if(c.t==='('){
      pos++;
      const e=parseExpr();
      if(!peek()||peek().t!==')')throw new Error('Parenthèse fermante manquante.');
      pos++;
      return `(${e})`;
    }
    throw new Error('Formule non valide.');
  }
  let js;
  try{
    js=parseExpr();
    if(pos<tok.length)return{err:'Formule non valide (expression incomplète).'};
  }catch(e){return{err:e.message||'Formule non valide.'}}
  let fn;
  try{fn=new Function(...noms,'"use strict";return ('+js+');')}catch(e){return{err:'Formule non valide.'}}
  return{fn};
};

/* ---------- propagation ---------- */
/** demi-largeur effective (pour kind 'D' ou 'Dp') et incertitude-type effective (u, Δ, u %, Δ %) */
P.deltaEff=v=>v.kind==='D'?v.p:v.kind==='Dp'?v.p/100*Math.abs(v.val):NaN;
P.uEff=v=>{
  if(v.kind==='D')return v.p/SQ3;
  if(v.kind==='up')return v.p/100*Math.abs(v.val);
  if(v.kind==='Dp')return(v.p/100*Math.abs(v.val))/SQ3;
  return v.p;
};
/** tirages Monte-Carlo de f(x1, x2, …) : gaussienne (u, u%) ou uniforme sur [x − Δ, x + Δ] (Δ, Δ%) */
P.mc=function(fn,vars,N,seed){
  const r=P.rng(seed),ys=new Float64Array(N),args=new Array(vars.length);
  const meta=vars.map(v=>{const unif=v.kind==='D'||v.kind==='Dp';return{unif,amp:unif?P.deltaEff(v):P.uEff(v),val:v.val}});
  let ok=0;
  for(let i=0;i<N;i++){
    for(let j=0;j<meta.length;j++){const m=meta[j];args[j]=m.amp>0?(m.unif?m.val+m.amp*(2*r()-1):m.val+m.amp*P.gauss(r)):m.val}
    const y=fn(...args);if(isFinite(y))ys[ok++]=y;
  }
  return ys.subarray(0,ok);
};
/** contributions linéarisées (∂f/∂xi · u(xi))² par différence centrée (secours variance MC 1D si dérivée nulle) */
P.budget=function(fn,vars,seed){
  const vals=vars.map(v=>v.val),y0=fn(...vals),c=[],cLin=[];
  let mcFallback=false;
  vars.forEach((v,i)=>{
    const u=P.uEff(v);
    if(!(u>0)){c.push(0);cLin.push(0);return}
    const h=Math.max(1e-4*u,1e-6*Math.abs(vals[i]),1e-12);
    const a=vals.slice(),b=vals.slice();a[i]+=h;b[i]-=h;
    const fa=fn(...a),fb=fn(...b);
    let d=NaN;
    if(isFinite(fa)&&isFinite(fb))d=(fa-fb)/(2*h);
    else if(isFinite(fa)&&isFinite(y0))d=(fa-y0)/h;
    else if(isFinite(fb)&&isFinite(y0))d=(y0-fb)/h;
    const vLin=isFinite(d)?(d*u)*(d*u):0;
    cLin.push(vLin);
    if(vLin>0){c.push(vLin);return}
    /* dérivée nulle au point nominal (ex. cos(0), x² en 0) : variance univariée par MC 1D */
    const r=P.rng((seed||1)+101*(i+1)),unif=v.kind==='D'||v.kind==='Dp',amp=unif?P.deltaEff(v):u;
    const M1=2000,ys=new Float64Array(M1),arg=vals.slice();let ok=0;
    for(let k=0;k<M1;k++){arg[i]=unif?vals[i]+amp*(2*r()-1):vals[i]+amp*P.gauss(r);const y=fn(...arg);if(isFinite(y))ys[ok++]=y}
    const s1=ok>1?P.sd(ys.subarray(0,ok)):0;
    if(s1>0){mcFallback=true;c.push(s1*s1)}else c.push(0);
  });
  return{y0,c,uLin:Math.sqrt(cLin.reduce((x,y)=>x+y,0)),mcFallback};
};
/** somme y = Σ ci xi : contributions (ci u(xi))² */
P.budgetSomme=(vars)=>{const c=vars.map(v=>{const u=P.uEff(v);return(v.coef*u)*(v.coef*u)});const y0=vars.reduce((s,v)=>s+v.coef*v.val,0);return{y0,c,uLin:Math.sqrt(c.reduce((a,b)=>a+b,0))}};
/** produit y = k Π xi^αi : contributions (y · αi u(xi)/xi)² */
P.budgetProduit=(vars,k)=>{
  const y0=k*vars.reduce((s,v)=>s*Math.pow(v.val,v.coef),1);
  const c=vars.map(v=>{const u=P.uEff(v);return v.val===0?0:Math.pow(y0*v.coef*u/v.val,2)});
  return{y0,c,uLin:Math.sqrt(c.reduce((a,b)=>a+b,0))};
};

/* ---------- transformations d'axes pour la régression ---------- */
P.transfo=function(code,expr,varNom){
  const v=varNom||'x';
  if(!code||code==='id')return{fn:z=>z,id:true};
  if(code==='sq')return{fn:z=>z*z,id:false};
  if(code==='cu')return{fn:z=>z*z*z,id:false};
  if(code==='sqrt')return{fn:z=>z>=0?Math.sqrt(z):NaN,id:false};
  if(code==='inv')return{fn:z=>z!==0?1/z:NaN,id:false};
  if(code==='inv2')return{fn:z=>z!==0?1/(z*z):NaN,id:false};
  if(code==='ln')return{fn:z=>z>0?Math.log(z):NaN,id:false};
  if(code==='log')return{fn:z=>z>0?Math.log10(z):NaN,id:false};
  if(code==='expr'){
    const noms=v==='x'?['x']:[v,'x'];
    const cp=P.compiler(expr,noms);
    if(cp.err)return{err:cp.err,fn:null,id:false};
    return{fn:v==='x'?cp.fn:(z=>cp.fn(z,z)),id:false};
  }
  return{fn:z=>z,id:true};
};
function deriv1(fn,x,u){
  const h=Math.max(1e-4*(u||0),1e-6*Math.abs(x),1e-10);
  const a=fn(x+h),b=fn(x-h);
  if(isFinite(a)&&isFinite(b))return(a-b)/(2*h);
  const y0=fn(x);
  if(isFinite(a)&&isFinite(y0))return(a-y0)/h;
  if(isFinite(b)&&isFinite(y0))return(y0-b)/h;
  return NaN;
}
/** transforme les points bruts (x, ux, y, uy) en (X, uX, Y, uY) ; exclut les hors-domaine */
P.transformPts=function(pts,tx,ty){
  const fx=tx&&tx.fn?tx.fn:(z=>z),fy=ty&&ty.fn?ty.fn:(z=>z);
  const idX=!tx||tx.id,idY=!ty||ty.id;
  const out=[];let rejet=0;
  for(const p of pts){
    const X=fx(p.x),Y=fy(p.y);
    if(!isFinite(X)||!isFinite(Y)){rejet++;continue}
    const uX=p.ux>0?(idX?p.ux:Math.abs(deriv1(fx,p.x,p.ux))*p.ux):0;
    const uY=p.uy>0?(idY?p.uy:Math.abs(deriv1(fy,p.y,p.uy))*p.uy):0;
    if(!isFinite(uX)||!isFinite(uY)){rejet++;continue}
    out.push({...p,rawX:p.x,rawUx:p.ux,rawY:p.y,rawUy:p.uy,x:X,ux:uX,y:Y,uy:uY});
  }
  return{pts:out,rejet};
};

/* ---------- régression linéaire y = a x + b ---------- */
P.fit=function(x,y){
  const n=x.length,mx=P.mean(x),my=P.mean(y);let sxx=0,sxy=0;
  for(let i=0;i<n;i++){sxx+=(x[i]-mx)*(x[i]-mx);sxy+=(x[i]-mx)*(y[i]-my)}
  const a=sxx>0?sxy/sxx:NaN;return{a,b:my-a*mx};
};
P.zReg=function(pts,a,b){return pts.map(p=>{const d=Math.sqrt(p.uy*p.uy+a*a*p.ux*p.ux);return d>0?(p.y-a*p.x-b)/d:0})};
P.mcReg=function(pts,loi,M,seed,tx,ty){
  const r=P.rng(seed),n=pts.length,A=new Float64Array(M),B=new Float64Array(M),x=new Array(n),y=new Array(n);
  const fx=tx&&tx.fn&&!tx.id?tx.fn:null,fy=ty&&ty.fn&&!ty.id?ty.fn:null;
  let ok=0;
  for(let k=0;k<M;k++){
    let valid=true;
    for(let i=0;i<n;i++){
      const p=pts[i];
      const bx=fx?p.rawX:p.x,bux=fx?p.rawUx:p.ux,by=fy?p.rawY:p.y,buy=fy?p.rawUy:p.uy;
      let xi,yi;
      if(loi==='unif'){xi=bux>0?bx+SQ3*bux*(2*r()-1):bx;yi=buy>0?by+SQ3*buy*(2*r()-1):by}
      else{xi=bux>0?bx+bux*P.gauss(r):bx;yi=buy>0?by+buy*P.gauss(r):by}
      if(fx)xi=fx(xi);
      if(fy)yi=fy(yi);
      if(!isFinite(xi)||!isFinite(yi)){valid=false;break}
      x[i]=xi;y[i]=yi;
    }
    if(!valid)continue;
    const f=P.fit(x,y);
    if(isFinite(f.a)&&isFinite(f.b)){A[ok]=f.a;B[ok]=f.b;ok++}
  }
  const As=A.subarray(0,ok),Bs=B.subarray(0,ok);
  const ua=ok>1?P.sd(As):NaN,ub=ok>1?P.sd(Bs):NaN,ma=P.mean(As),mb=P.mean(Bs);
  let cov=NaN,corr=NaN;
  if(ok>1){let c=0;for(let k=0;k<ok;k++)c+=(As[k]-ma)*(Bs[k]-mb);cov=c/(ok-1);if(ua>0&&ub>0)corr=cov/(ua*ub)}
  return{A:As,B:Bs,ua,ub,cov,corr,ok,rejected:M-ok};
};
/** enveloppe d'incertitude ±σ(x) autour de y = a x + b à partir de Var(a), Var(b) et Cov(a, b) */
P.enveloppeReg=function(fit,ua,ub,cov,xs){
  if(!isFinite(ua)||!isFinite(ub))return[];
  const vA=ua*ua,vB=ub*ub,cAB=isFinite(cov)?cov:0;
  return xs.map(x=>({x,y:fit.a*x+fit.b,s:Math.sqrt(Math.max(0,x*x*vA+2*x*cAB+vB))}));
};
/** prédiction corrélée sur les tirages (A_k, B_k) : mode 'y' (Y(X0)), 'x' (étalonnage inverse X(Y0)), 'fab' (f(a,b)) */
P.predReg=function(fit,mc,mode,o,seed){
  const K=mc&&mc.A?mc.A.length:0;
  let As=mc&&mc.A,Bs=mc&&mc.B;
  /* repli si régression sans incertitudes : tirages gaussiens bivariés avec Cov(a,b) OLS */
  if(K<2){
    if(!isFinite(mc.ua)||!isFinite(mc.ub))return{err:'Il faut au moins 3 points (ou des incertitudes) pour estimer l\'incertitude.'};
    const M0=5000,r0=P.rng((seed||1)+7919);
    const rho=isFinite(mc.corr)?Math.max(-0.999999,Math.min(0.999999,mc.corr)):0,s2=Math.sqrt(1-rho*rho);
    As=new Float64Array(M0);Bs=new Float64Array(M0);
    for(let k=0;k<M0;k++){const z1=P.gauss(r0),z2=P.gauss(r0);As[k]=fit.a+mc.ua*z1;Bs[k]=fit.b+mc.ub*(rho*z1+s2*z2)}
  }
  const N=As.length,r=P.rng((seed||1)+3571),out=new Float64Array(N);let ok=0;
  if(mode==='y'){
    const x0=o.val,ux0=Math.max(0,o.u||0);
    if(!isFinite(x0))return{err:'Saisissez une abscisse X₀.'};
    const val=fit.a*x0+fit.b;
    for(let k=0;k<N;k++){const xk=ux0>0?x0+ux0*P.gauss(r):x0;const yk=As[k]*xk+Bs[k];if(isFinite(yk))out[ok++]=yk}
    const s=out.subarray(0,ok);return{val,u:ok>1?P.sd(s):NaN,mean:P.mean(s),ok,rejected:N-ok};
  }
  if(mode==='x'){
    const y0=o.val,uy0=Math.max(0,o.u||0);
    if(!isFinite(y0))return{err:'Saisissez une ordonnée Y₀.'};
    if(fit.a===0)return{err:'Pente nulle : inversion impossible.'};
    const val=(y0-fit.b)/fit.a;
    for(let k=0;k<N;k++){const yk=uy0>0?y0+uy0*P.gauss(r):y0;const xk=As[k]!==0?(yk-Bs[k])/As[k]:NaN;if(isFinite(xk))out[ok++]=xk}
    const s=out.subarray(0,ok);return{val,u:ok>1?P.sd(s):NaN,mean:P.mean(s),ok,rejected:N-ok};
  }
  if(mode==='fab'){
    const cp=P.compiler(o.expr,['a','b']);
    if(cp.err)return{err:cp.err};
    const val=cp.fn(fit.a,fit.b);

/* ---------- dessin d'un histogramme (clip appliqué au cadre du graphique) ---------- */
function histo(a,R,o){

  const mY=mode==='eff'?(q=>n*w*q):(q=>q*f);

  let ymax=0;
  if(o.counts)for(const c of o.counts)ymax=Math.max(ymax,cY(c));
  const pic=m=>mY(1/(m.s*Math.sqrt(2*Math.PI)));
  if(o.modele)ymax=Math.max(ymax,pic(o.modele));
  if(o.lin)ymax=Math.max(ymax,pic(o.lin));

  if(o.unif)ymax=Math.max(ymax,hU);

  const pad=0.03*(o.xhi-o.xlo),xmin=(o.xlo-pad)/f,xmax=(o.xhi+pad)/f;
  const G=S.graph({x:R.x,y:R.y,w:R.w,h:R.h,padB:36*K,xmin,xmax,ymin:0,ymax,

    xlab:(o.xlab||'')+suffixe(f),ylab:o.ylab||''});

  let s=S.clip(clip,G)+G.svg+`<g clip-path="url(#${clip})">`,X=x=>G.X(x/f),Y=G.Y;
  if(o.bandes&&o.moyenne!==undefined){const m=o.moyenne,sg=o.sigma;
    [3,2,1].forEach((k,i)=>{s+=S.rect(X(m-k*sg),G.y0,X(m+k*sg)-X(m-k*sg),G.h,{fill:C.cInk,fop:[.07,.1,.15][i]})});

      s+=S.rect(X(x0),Y(hh(c)),Math.max(1,X(x1)-X(x0)),Y(0)-Y(hh(c)),{fill:BLEU,fop:.92,c:bw>6?C.card:undefined,w:.8})})}
  const courbe=(m,sg,col,dash,w2)=>{const pts=[];const a0=Math.max(xmin*f,m-4.2*sg),b0=Math.min(xmax*f,m+4.2*sg);
    for(let i=0;i<=160;i++){const x=a0+(b0-a0)*i/160;pts.push([x/f,mY(pdf(x,m,sg))])}

  if(o.ombre&&o.modele){const m=o.modele.m,sg=o.modele.s,pts=[[(m-sg)/f,0]];

  if(mode==='pct'){if(String(pct??'').trim()==='')return 0;const p=Math.abs(lire(pct));return isFinite(p)?(p/100*Math.abs(val))/div:NaN}
  if(mode==='not'){
    const sp=String(pct??'').trim(),sd=String(dgt??'').trim(),sr=String(res??'').trim();
    if(sp===''&&sd==='')return 0;
    const p=sp===''?0:Math.abs(lire(sp)),d=sd===''?0:Math.abs(lire(sd)),r=sr===''?0:Math.abs(lire(sr));
    return finis(p,d,r)?PH2.notice(val,p,d,r)/SQ3:NaN;
  }
  return 0;
}
function lignesReg(t){
  const lignes=[];
  while(t.off.length<t.rows.length)t.off.push(false);
  t.rows.forEach((r,i)=>{
    const c=[0,1,2,3].map(j=>String(r[j]??'').trim());
    if(c.every(v=>v===''))return;
    const x=lire(c[0]),y=lire(c[2]);
    if(!finis(x,y)){lignes.push(null);return}
    const ux=uColonne(t.xmode||'pt',t.xkind,t.xcst,t.xpct,t.xdgt,t.xres,c[1],x);
    const uy=uColonne(t.ymode||'pt',t.ykind,t.ycst,t.ypct,t.ydgt,t.yres,c[3],y);
    lignes.push(finis(ux,uy)?{x,ux,y,uy,i,off:!!t.off[i]}:null);
  });
  return lignes;
}
const regSans=()=>{const P=lignesReg(ST.t3).filter(q=>q&&!q.off);return P.length>0&&P.every(q=>q.ux===0&&q.uy===0)};

/* ---------- tableau éditable avec collage intelligent (CSV/TSV/en-têtes/3 col.) & glisser-déposer CSV ---------- */
function grille(rows,cols,opts={}){
  const root=h('div',{class:'ph-grid'}),titreLigne=opts.titreLigne||'Ligne';
  let colMap=opts.colMap||cols.map((_,j)=>j);
  const fullNc=opts.fullNc||cols.length;
  const vide=()=>Array(fullNc).fill('');
  let tb=null,entetes=[];
  const libelle=(i,j)=>`${titreLigne} ${i+1}, ${entetes[j]?entetes[j].textContent:''}`;
  const syncOff=()=>{if(opts.off)while(opts.off.length<rows.length)opts.off.push(false)};
  const ligne=(r,i)=>{
    const isOff=opts.off&&opts.off[i];
    const tr=h('tr',isOff?{class:'off'}:{});
    tr.dataset.row=String(i);
    if(opts.onHoverRow){
      tr.addEventListener('mouseenter',()=>opts.onHoverRow(i));
      tr.addEventListener('mouseleave',()=>opts.onHoverRow(-1));
      tr.addEventListener('focusin',()=>opts.onHoverRow(i));
    }
    if(opts.off){
      const tdc=h('td',{class:'cb'}),cb=h('input',{type:'checkbox','aria-label':`Inclure ${titreLigne} ${i+1}`,title:'Inclure dans l\'ajustement'});
      cb.checked=!isOff;
      cb.onchange=()=>{opts.off[i]=!cb.checked;tr.classList.toggle('off',!cb.checked);change(!!opts.rapide)};
      tdc.append(cb);tr.append(tdc);
    }
    tr.append(h('td',{class:'n'},String(i+1)));
    colMap.forEach((rawJ,visJ)=>{
      const inp=h('input',{type:'text',inputmode:'decimal',value:r[rawJ]??'',spellcheck:'false',autocomplete:'off','aria-label':libelle(i,visJ)});
      inp.oninput=()=>{
        r[rawJ]=inp.value;
        if(r===rows[rows.length-1]&&inp.value.trim()!==''){rows.push(vide());syncOff();tb.append(ligne(rows[rows.length-1],rows.length-1))}
        change(!!opts.rapide);
      };
      inp.onkeydown=e=>{
        const dir=e.key==='Enter'||e.key==='ArrowDown'?1:e.key==='ArrowUp'?-1:0;
        if(dir){e.preventDefault();const nx=tb.children[i+dir];if(nx){const offC=opts.off?2:1;const cell=nx.children[visJ+offC];if(cell&&cell.firstChild)cell.firstChild.focus()}}
      };
      inp.onpaste=e=>{
        const txt=(e.clipboardData||window.clipboardData).getData('text');if(!txt)return;
        if(!/[\n\t;,]/.test(txt)&&!/\s+\S/.test(txt.trim()))return; // collage d'un seul nombre : comportement natif
        e.preventDefault();
        const pt=PH2.parseTableau(txt);
        if(!pt.rows.length){A.toast('Aucune valeur numérique reconnue');return}
        let data=pt.rows;
        if(colMap.length===1)data=data.flat().filter(Boolean).map(s=>[s]);
        data.forEach((cells,k)=>{
          const ri=i+k;while(rows.length<=ri)rows.push(vide());syncOff();
          const m2=opts.map2&&cells.length===2&&visJ===0&&colMap.length===4?opts.map2:null;
          const m3=opts.map3&&cells.length===3&&visJ===0&&colMap.length===4?opts.map3:null;
          cells.forEach((c,m)=>{
            const targetRaw=m2?m2[m]:m3?m3[m]:colMap[visJ+m];
            if(targetRaw!==undefined&&targetRaw<fullNc)rows[ri][targetRaw]=c;
          });
        });
        if(pt.skippedHeaders>0)A.toast(`${data.length} ligne(s) collée(s) (en-tête ignoré)`);
        build();change(!!opts.rapide);
      };
      const td=h('td');td.append(inp);tr.append(td);
    });
    const td=h('td'),x=h('button',{class:'ph-x',type:'button',tabindex:'-1',title:'Supprimer la ligne','aria-label':'Supprimer la ligne'},'×');
    x.onclick=()=>{pushUndo('supprimer une ligne');rows.splice(i,1);if(opts.off)opts.off.splice(i,1);build();if(A.majUndo)A.majUndo();change()};td.append(x);tr.append(td);return tr;
  };
  const build=()=>{
    if(!rows.length||rows[rows.length-1].some(c=>String(c??'').trim()!==''))rows.push(vide());
    syncOff();
    root.innerHTML='';const t=h('table');
    t.innerHTML=`<thead><tr>${opts.off?'<th title="Inclure dans l\'ajustement">✓</th>':''}<th>#</th>${cols.map(c=>`<th>${c}</th>`).join('')}<th></th></tr></thead>`;
    const ths=[...t.querySelectorAll('th')];
    entetes=ths.slice(opts.off?2:1,-1);
    tb=h('tbody');rows.forEach((r,i)=>tb.append(ligne(r,i)));t.append(tb);root.append(t);
  };
  if(opts.onDropFile){
    root.addEventListener('dragover',e=>{e.preventDefault();root.classList.add('ph-drop')});
    root.addEventListener('dragleave',()=>root.classList.remove('ph-drop'));
    root.addEventListener('drop',e=>{e.preventDefault();root.classList.remove('ph-drop');const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f)opts.onDropFile(f)});
  }
  root.nommer=(nouveaux,nouvMap)=>{
    cols=nouveaux;
    if(nouvMap){colMap=nouvMap;build();return}
    entetes.forEach((th,j)=>{if(th)th.innerHTML=cols[j]});
    const offC=opts.off?2:1;
    [...tb.rows].forEach((tr,i)=>entetes.forEach((_,j)=>{
      const el=tr.cells[j+offC]&&tr.cells[j+offC].firstChild;if(el)el.setAttribute('aria-label',libelle(i,j));
    }));
  };
  root.highlightRow=idx=>{
    if(!tb)return;
    [...tb.rows].forEach((tr,i)=>tr.classList.toggle('ph-hl',i===idx));
  };
  build();root.build=build;return root;
}

/** tableau des grandeurs mesurées (jusqu'à 12 grandeurs) : nom, valeur, u / Δ / u % / Δ %, incertitude, coefficient */
function tableVars(t,coefTitre,rapide){
  const root=h('div',{class:'ph-grid ph-vt'});
  const build=()=>{
    root.innerHTML='';const tab=h('table');
    tab.innerHTML=`<thead><tr><th>Nom</th><th>Valeur</th><th title="u : écart-type · Δ : demi-largeur (Δ/√3) · u % / Δ % : incertitude relative en %">Type</th><th>Incertitude</th>${coefTitre?`<th>${coefTitre()}</th>`:''}<th></th></tr></thead>`;
    const tb=h('tbody');
    t.vars.forEach((v,i)=>{
      const tr=h('tr'),cell=(node)=>{const td=h('td');td.append(node);tr.append(td)};
      const inp=(val,fn,{cls='',clavier='decimal'}={})=>{
        const e=h('input',{type:'text',value:val,inputmode:clavier,spellcheck:'false',autocomplete:'off',class:cls});
        e.oninput=()=>{fn(e.value);change(!!rapide)};return e;
      };
      cell(inp(v.nom,x=>{v.nom=x},{cls:'nom',clavier:'text'}));cell(inp(nbTexte(v.val),x=>{v.val=lire(x)}));
      const s=h('select',{'aria-label':'Nature de l\'incertitude'});[['u','u'],['D','Δ'],['up','u %'],['Dp','Δ %']].forEach(([val,l])=>{const o=h('option',{value:val},l);if(v.kind===val)o.selected=true;s.append(o)});
      s.onchange=()=>{v.kind=s.value;change(!!rapide)};cell(s);
      cell(inp(nbTexte(v.p),x=>{v.p=Math.abs(lire(x))}));
      if(coefTitre)cell(inp(nbTexte(v.coef),x=>{v.coef=lire(x)},{clavier:'text'}));
      const td=h('td');if(t.vars.length>1){const x=h('button',{class:'ph-x',type:'button',tabindex:'-1',title:'Supprimer','aria-label':'Supprimer cette grandeur'},'×');x.onclick=()=>{pushUndo('supprimer une grandeur');t.vars.splice(i,1);t.mute.splice(i,1);build();if(A.majUndo)A.majUndo();change()};td.append(x)}tr.append(td);
      tb.append(tr);
    });
    tab.append(tb);root.append(tab);
    if(t.vars.length<12){const b=h('button',{class:'mini',type:'button'},'+ Ajouter une grandeur');b.onclick=()=>{t.vars.push(V('x'+(t.vars.length+1),NaN,'u',NaN,1));t.mute.push(false);build();change()};root.append(b)}
  };
  build();root.build=build;return root;
}

/* ---------- helpers Carnet & chaînage ---------- */
function nomSymbole(s){
  let n=String(s||'x').trim().replace(/[^A-Za-z0-9_]/g,'');
  if(!n||!/^[A-Za-z_]/.test(n))n='x';
  if(!PH2.nomValide(n))n='v_'+n;
  return n;
}
function ajouterCarnet(item){
  const entry={nom:String(item.nom||'x').trim()||'x',x:item.x,u:item.u,unite:String(item.unite||'').trim()};
  const existe=ST.carnet.findIndex(e=>e.nom===entry.nom&&Math.abs(e.x-entry.x)<=1e-12*Math.max(1,Math.abs(entry.x))&&Math.abs(e.u-entry.u)<=1e-12*Math.max(1,Math.abs(entry.u)));
  if(existe>=0){A.toast(`Déjà dans le carnet : ${entry.nom}`);return}
  ST.carnet.push(entry);sauver();
  if(A.majCarnet)A.majCarnet();
  A.toast(`Ajouté au carnet : ${entry.nom}`);
}
function envoyerVersPropag(item){
  const cible=ST.t1.type==='formule'?ST.t2:ST.t1;
  const sym=nomSymbole(item.nom);
  const v=V(sym,item.x,'u',item.u,1);
  if(cible.vars.length===1&&!isFinite(cible.vars[0].val)){cible.vars[0]=v;cible.mute[0]=false}
  else{
    const idx=cible.vars.findIndex(q=>q.nom===sym);
    if(idx>=0){cible.vars[idx].val=item.x;cible.vars[idx].kind='u';cible.vars[idx].p=item.u;cible.mute[idx]=false}
    else if(cible.vars.length<12){cible.vars.push(v);cible.mute.push(false)}
    else{A.toast('Maximum 12 grandeurs dans Propagation');return}
  }
  sauver();
  if(A.recon)A.recon();
  A.setTab(1);
  A.toast(`${sym} envoyé dans Propagation`);
}
function envoyerVersComparer(item){
  const t=ST.t4;
  const videIdx=t.items.findIndex(q=>!isFinite(q.val));
  const nv={nom:item.nom,val:item.x,kind:'u',p:item.u,on:true};
  if(videIdx>=0)t.items[videIdx]=nv;else t.items.push(nv);
  if(!t.unite&&item.unite)t.unite=item.unite;
  sauver();if(A.construireTab)A.construireTab('t4');
  A.setTab(3);A.toast(`${item.nom} ajouté dans Comparer`);
}
function envoyerVersRef(item){
  const map=[ST.t0,ST.t1.type==='formule'?ST.t2:ST.t1,ST.t3,ST.t4];
  const t=map[A.tab];if(!t)return;
  t.ref=true;t.xref=nbTexte(item.x);t.uref=nbTexte(item.u);
  sauver();if(A.toutReconstruire)A.toutReconstruire();A.refresh();A.render();
  A.toast(`${item.nom} défini comme référence`);
}

    cours:'PH2 Mesures et incertitudes : incertitude-type, types A et B, incertitudes composées, Monte-Carlo, écart normalisé <i class="m">Z</i> = |<i class="m">x</i> − <i class="m">x</i><sub>réf</sub>| / √(<i class="m">u</i>² + <i class="m">u</i><sub>réf</sub>²), régression linéaire et validation par les écarts normalisés <i class="m">z</i><sub>i</sub>.',
    touches:'<kbd>1</kbd>–<kbd>4</kbd> onglets · <kbd>Ctrl</kbd>/<kbd>⌘</kbd>+<kbd>Z</kbd> annuler (hors saisie)'
  },
  init(a){
    const Z=a.zones;
    /* ----- carnet de séance (en haut de la colonne de saisie) ----- */
    const carnetBox=h('details',{class:'ph-carnet'});
    const majCarnet=()=>{
      const open=carnetBox.open,n=ST.carnet.length;
      carnetBox.innerHTML=`<summary>Carnet de séance <span class="ph-carnet-badge">${n}</span></summary>`;
      const list=h('div',{class:'ph-carnet-list'});
      if(!n){list.append(h('div',{class:'ph-carnet-empty'},'Cliquez « + Carnet » sur un résultat pour le mémoriser et le réutiliser dans un autre onglet.'))}
      else{
        ST.carnet.forEach((it,idx)=>{
          const row=h('div',{class:'ph-carnet-item'});
          row.append(h('span',{class:'ph-carnet-val'},ecrire(it.x,it.u,it.unite,esc(it.nom))));
          const acts=h('span',{class:'ph-carnet-acts'});
          const bP=h('button',{class:'mini',type:'button',title:'Insérer comme variable dans Propagation'},'→ Prop.');
          bP.onclick=()=>envoyerVersPropag(it);
          const bC=h('button',{class:'mini',type:'button',title:'Ajouter dans Comparer'},'→ Comp.');
          bC.onclick=()=>envoyerVersComparer(it);
          const bR=h('button',{class:'mini',type:'button',title:'Utiliser comme référence de l\'onglet actif'},'→ Réf.');
          bR.onclick=()=>envoyerVersRef(it);
          const bX=h('button',{class:'ph-x',type:'button',title:'Retirer du carnet','aria-label':'Retirer du carnet'},'×');
          bX.onclick=()=>{ST.carnet.splice(idx,1);sauver();majCarnet()};
          acts.append(bP,bC,bR,bX);row.append(acts);list.append(row);
        });
        const foot=h('div',{class:'ph-bar'});
        const clr=h('button',{class:'mini',type:'button'},'Vider le carnet');
        clr.onclick=()=>{pushUndo('vider le carnet');ST.carnet=[];sauver();majCarnet();a.majUndo()};
        foot.append(clr);list.append(foot);
      }
      carnetBox.append(list);carnetBox.open=open;
    };
    a.majCarnet=majCarnet;
    Z.saisie.append(carnetBox);

    /* barre d'actions d'un onglet : import CSV facultatif, annuler, exemple, vider */
    const undoBtns=[];
    a.majUndo=()=>{const dis=UNDO.length===0;undoBtns.forEach(b=>{b.hidden=dis;if(!dis)b.title='Annuler : '+UNDO[UNDO.length-1].label})};
    const barre=(k,extra)=>{
      const b=h('div',{class:'ph-bar'});
      if(extra)extra.forEach(n=>b.append(n));
      b.append(h('span',{class:'ph-sp'}));
      const un=h('button',{class:'mini',type:'button'},'Annuler');un.hidden=UNDO.length===0;un.onclick=doUndo;undoBtns.push(un);
      const ex=h('button',{class:'mini',type:'button',title:'Remplacer par un exemple'},'Exemple');
      const vd=h('button',{class:'mini',type:'button',title:'Effacer les saisies de cet onglet'},'Vider');
      ex.onclick=()=>{
        pushUndo('charger exemple');
        if(k==='t1'){const ty=ST.t1.type;ST.t1=ty==='produit'?exProduit():defaut().t1;ST.t1.type=ty}
        else ST[k]=defaut()[k];
        construire(k);a.majUndo();change();
      };
      vd.onclick=()=>{pushUndo('vider l\'onglet');VIDE[k](ST[k]);construire(k);a.majUndo();change()};
      b.append(un,ex,vd);return b;
    };
    const boutonCSV=(onFile)=>{
      const inp=h('input',{type:'file',accept:'.csv,.txt,.tsv,text/csv,text/plain',hidden:'true'});
      inp.onchange=()=>{if(inp.files&&inp.files[0])onFile(inp.files[0]);inp.value=''};
      const btn=h('button',{class:'mini',type:'button',title:'Importer un fichier CSV ou texte (hors-ligne)'},'Importer CSV');
      btn.onclick=()=>inp.click();
      return[btn,inp];
    };

    const panes={};
    const construire=k=>{const p=panes[k];if(!p)return;p.innerHTML='';PANES[k]();a.majUndo()};
    a.construireTab=construire;
    a.toutReconstruire=()=>{['t0','t1','t2','t3','t4'].forEach(construire);majCarnet();a.montrer()};
    a.montrer=()=>{const T=a.tab,f=ST.t1.type==='formule';
      panes.t0.hidden=T!==0;panes.t1.hidden=!(T===1&&!f);panes.t2.hidden=!(T===1&&f);panes.t3.hidden=T!==2;panes.t4.hidden=T!==3};
    a.recon=()=>{construire('t1');construire('t2');a.montrer()};

    /* ----- onglet 1 : mesure directe ----- */
    PANES.t0=()=>{const t=ST.t0,p=panes.t0;
      const importer0=file=>lireFichierTexte(file,(txt,nomF)=>{
        const pt=PH2.parseTableau(txt);if(!pt.rows.length){A.toast('Aucune donnée numérique dans '+nomF);return}
        pushUndo('import CSV');
        t.rows=pt.rows.map(r=>[r[0]||'']).filter(r=>r[0]!=='');
        if(pt.headers[0]){const e=PH2.parseEntete(pt.headers[0]);if(e.nom)t.nom=e.nom;if(e.unite)t.unite=e.unite}
        construire('t0');change();A.toast(`${t.rows.length} valeurs importées (${nomF})`);
      });
      p.append(barre('t0',boutonCSV(importer0)),fld('Grandeur mesurée',t,'nom',{nom:true,texte:true}),fld('Unité',t,'unite',{nom:true,texte:true}));
      p.append(h('div',{class:'ph-sub'},'Valeurs mesurées (coller ou déposer un fichier CSV)'),grille(t.rows,['Valeur'],{titreLigne:'Mesure',onDropFile:importer0}));
      const bB=h('div'),rb=()=>{bB.innerHTML='';if(t.B){
        bB.append(seg([['D','Δ directement'],['B','Bornes min / max'],['N','Notice de l\'appareil']],t,'modeB',rb));
        if(t.modeB==='D')bB.append(fld('Demi-largeur Δ',t,'delta'));
        else if(t.modeB==='B')bB.append(fld('Borne inférieure',t,'bmin'),fld('Borne supérieure',t,'bmax'),h('div',{class:'res-n gr'},'L\'intervalle [min ; max] a pour largeur 2Δ.'));
        else bB.append(fld('Pourcentage de la lecture (%)',t,'pct'),fld('Nombre de digits',t,'dgt'),fld('Valeur d\'un digit',t,'res'));
        if(t.modeB!=='B')bB.append(fld('Valeur lue (si moins de 2 mesures)',t,'lec'))}};
      p.append(chk('Ajouter une évaluation de type B (précision de l\'appareil)',t,'B',rb),bB);rb();
      p.append(blocRef(t));
    };

    /* ----- onglet 2 : propagation (somme / produit) ----- */
    const sousOnglets=()=>seg([['somme','Somme'],['produit','Produit'],['formule','Fonction quelconque']],ST.t1,'type',()=>a.recon());
    PANES.t1=()=>{const t=ST.t1,p=panes.t1;
      const tv=tableVars(t,()=>t.type==='somme'?`Coef. ${M.v('c')}`:`Expos. ${M.v('α')}`,false);
      p.append(barre('t1'),sousOnglets(),h('div',{class:'ph-sub'},t.type==='somme'?'y = Σ cᵢ xᵢ (somme, différence)':'y = k Π xᵢ^αᵢ (produit, quotient, puissances)'),
        fld('Grandeur calculée',t,'nom',{nom:true,texte:true}),fld('Unité',t,'unite',{nom:true,texte:true}));
      const kb=h('div');kb.append(fld('Facteur constant k (exact)',t,'k',{texte:true}));kb.hidden=t.type!=='produit';p.append(kb);
      p.append(h('div',{class:'ph-sub'},'Grandeurs mesurées'),tv,blocRef(t));
    };

    /* ----- onglet 2b : propagation (fonction quelconque, Monte-Carlo) ----- */
    PANES.t2=()=>{const t=ST.t2,p=panes.t2;
      const formule=fld(`${esc(nomGrandeur(t))} =`,t,'formule',{cls:'formule',texte:true,rapide:true});
      const finp=formule.querySelector('input');
      finp.id='ph-formule';
      formule.querySelector('label').htmlFor='ph-formule';
      const qbar=h('div',{class:'ph-qbtns'});
      ['pi','sqrt()','ln()','exp()','^','sind()','cosd()','tand()'].forEach(tok=>{
        const b=h('button',{type:'button',title:'Insérer '+tok},tok);
        b.onclick=()=>{
          const s0=finp.selectionStart??finp.value.length,s1=finp.selectionEnd??finp.value.length;
          const v=finp.value;
          finp.value=v.slice(0,s0)+tok+v.slice(s1);
          t.formule=finp.value;
          const pos=tok.endsWith('()')?s0+tok.length-1:s0+tok.length;
          if(finp.focus)finp.focus();
          if(finp.setSelectionRange)finp.setSelectionRange(pos,pos);
          change(true);
        };
        qbar.append(b);
      });
      p.append(barre('t2'),sousOnglets(),fld('Grandeur calculée',t,'nom',{nom:true,texte:true}),fld('Unité',t,'unite',{nom:true,texte:true}),formule,qbar);
      p.append(h('div',{class:'ph-hint'},'Angles en radians · sind / cosd / tand en degrés · ^ pour puissance · 2pi*f accepté'));
      p.append(h('div',{class:'ph-err',id:'ph-e2'}),h('div',{class:'ph-sub'},'Grandeurs mesurées (noms utilisés dans la formule)'),tableVars(t,null,true));
      p.append(selecteur('Nombre de tirages',[[10000,'10 000'],[100000,'100 000'],[1000000,'1 000 000']],t,'N'));
      const nb=h('button',{class:'mini',type:'button'},'Nouveaux tirages');nb.onclick=()=>{t.graine++;change()};p.append(nb);
      p.append(chk('Superposer l\'incertitude linéarisée (dérivées partielles)',t,'lin'),blocRef(t));
    };

    /* ----- onglet 3 : régression linéaire (2.1 incertitudes colonne, 2.2 transfos, 2.3 points actifs, 2.4 CSV) ----- */
    PANES.t3=()=>{const t=ST.t3,p=panes.t3;
      const csvMapBox=h('div');
      const appliquerCSV=(pt,nomF,ix,iux,iy,iuy)=>{
        pushUndo('import CSV');
        t.rows=pt.rows.map(r=>[r[ix]??'',iux>=0?(r[iux]??''):'',r[iy]??'',iuy>=0?(r[iuy]??''):'']);
        t.off=t.rows.map(()=>false);
        if(pt.headers[ix]){const e=PH2.parseEntete(pt.headers[ix]);if(e.nom)t.xnom=e.nom;if(e.unite)t.xun=e.unite}
        if(pt.headers[iy]){const e=PH2.parseEntete(pt.headers[iy]);if(e.nom)t.ynom=e.nom;if(e.unite)t.yun=e.unite}
        if(iux>=0)t.xmode='pt';
        if(iuy>=0)t.ymode='pt';
        construire('t3');change();A.toast(`${t.rows.length} points importés (${nomF})`);
      };
      const importer3=file=>lireFichierTexte(file,(txt,nomF)=>{
        const pt=PH2.parseTableau(txt);
        if(!pt.rows.length){A.toast('Aucune donnée numérique dans '+nomF);return}
        const nc=Math.max(...pt.rows.map(r=>r.length));
        if(nc===2){appliquerCSV(pt,nomF,0,-1,1,-1);return}
        if(nc===4&&t.xmode==='pt'&&t.ymode==='pt'){appliquerCSV(pt,nomF,0,1,2,3);return}
        /* sélecteur de colonnes pour CSV multi-colonnes */
        csvMapBox.innerHTML='';
        const box=h('div',{class:'ph-csv-map'});
        box.append(h('div',{},`<b>Import ${esc(nomF)}</b> (${pt.rows.length} lignes, ${nc} colonnes)`));
        const colNom=k=>pt.headers[k]?`Col. ${k+1} — ${pt.headers[k]}`:`Colonne ${k+1}`;
        const mkSel=(lab,optVide,def)=>{
          const l=h('label',{},lab),s=h('select');
          if(optVide)s.append(h('option',{value:'-1'},'Aucune'));
          for(let k=0;k<nc;k++){const o=h('option',{value:String(k)},esc(colNom(k)));if(k===def)o.selected=true;s.append(o)}
          l.append(s);return{l,s};
        };
        const sx=mkSel('Abscisse',false,0),sy=mkSel('Ordonnée',false,Math.min(1,nc-1));
        const sux=mkSel('Incertitude X',true,-1),suy=mkSel('Incertitude Y',true,nc===3?2:-1);
        const gr=h('div',{class:'ph-csv-g'});gr.append(sx.l,sy.l,sux.l,suy.l);box.append(gr);
        const bar=h('div',{class:'ph-bar'});
        const bOk=h('button',{class:'mini',type:'button'},'Importer'),bNo=h('button',{class:'mini',type:'button'},'Annuler');
        bOk.onclick=()=>appliquerCSV(pt,nomF,+sx.s.value,+sux.s.value,+sy.s.value,+suy.s.value);
        bNo.onclick=()=>{csvMapBox.innerHTML=''};
        bar.append(bNo,bOk);box.append(bar);csvMapBox.append(box);
      });

      const colConfig=()=>{
        const [nx,ny]=nomsRegression(t),cols=[],map=[];
        cols.push(M.v(nx));map.push(0);
        if((t.xmode||'pt')==='pt'){cols.push(incGrandeur(nx,t.xkind==='D'?'Δ':'u'));map.push(1)}
        cols.push(M.v(ny));map.push(2);
        if((t.ymode||'pt')==='pt'){cols.push(incGrandeur(ny,t.ykind==='D'?'Δ':'u'));map.push(3)}
        return{cols,map};
      };
      const cfg0=colConfig();
      const g=grille(t.rows,cfg0.cols,{titreLigne:'Point',colMap:cfg0.map,fullNc:4,map2:[0,2],map3:[0,2,3],off:t.off,rapide:true,onDropFile:importer3,
        onHoverRow:rawI=>{
          const actI=rawI<0?-1:IDX3.indexOf(rawI);
          if(HOVER3!==actI){HOVER3=actI;A.render()}
        }});
      a.grid3=g;
      const majColonnes=(rebuild)=>{const c=colConfig();g.nommer(c.cols,rebuild?c.map:null)};

      /* axes : noms et unités */
      const nxBox=h('div',{class:'ph-axes'});
      const dup=(lab,k1,k2)=>{const r=h('div',{class:'ph-row'},`<label>${lab}</label>`);
        for(const[k,l]of[[k1,null],[k2,'Unité']]){
          if(l)r.append(h('label',{},l));
          const i=h('input',{type:'text',value:t[k]??'',spellcheck:'false',autocomplete:'off'});
          i.oninput=()=>{t[k]=i.value;if(k===k1)majColonnes(false);change()};
          r.append(i);
        }
        return r;
      };
      nxBox.append(dup('Abscisse','xnom','xun'),dup('Ordonnée','ynom','yun'));

      /* 2.2 : transformations / linéarisation X et Y */
      const trRow=h('div',{class:'ph-tr'});
      const mkTransfo=(titre,key,exprKey,varLettre)=>{
        const box=h('div',{class:'ph-tr-box'});
        box.append(h('label',{},titre));
        const s=h('select');
        TRANSFOS.forEach(([v,l])=>{const o=h('option',{value:v},l.replace(/x/g,varLettre));if((t[key]||'id')===v)o.selected=true;s.append(o)});
        const inp=h('input',{type:'text',placeholder:`ex. 1/${varLettre}^2`,value:t[exprKey]??'',spellcheck:'false',autocomplete:'off'});
        inp.hidden=(t[key]||'id')!=='expr';
        inp.oninput=()=>{t[exprKey]=inp.value;change(true)};
        s.onchange=()=>{t[key]=s.value;inp.hidden=s.value!=='expr';change(true)};
        box.append(s,inp);return box;
      };
      trRow.append(mkTransfo('Linéarisation X','xtr','xtrExpr','x'),mkTransfo('Linéarisation Y','ytr','ytrExpr','y'));

      /* 2.1 : incertitude par colonne (Par point / Constante / Relative % / Notice) */
      const uColBloc=(titre,pref)=>{
        const box=h('div',{class:'ph-ucol'}),hd=h('div',{class:'ph-ucol-h'}),par=h('div',{class:'ph-ucol-p'});
        hd.append(h('label',{},titre));
        const modeSel=h('select');
        [['pt','Par point'],['cst','Constante'],['pct','Relative (%)'],['not','Notice (% + dgt)']].forEach(([v,l])=>{
          const o=h('option',{value:v},l);if((t[pref+'mode']||'pt')===v)o.selected=true;modeSel.append(o);
        });
        const kindSel=h('select',{'aria-label':'Nature u ou Δ'});
        [['u','u'],['D','Δ']].forEach(([v,l])=>{const o=h('option',{value:v},l);if(t[pref+'kind']===v)o.selected=true;kindSel.append(o)});
        const miniInp=(lab,k)=>{
          const l=h('label',{},lab),i=h('input',{type:'text',inputmode:'decimal',value:t[pref+k]??'',spellcheck:'false',autocomplete:'off'});
          i.oninput=()=>{t[pref+k]=i.value;change(true)};l.append(i);return l;
        };
        const renderPar=()=>{
          const m=t[pref+'mode']||'pt';
          kindSel.hidden=m==='not';
          par.innerHTML='';
          if(m==='cst')par.append(miniInp(t[pref+'kind']==='D'?'Δ =':'u =','cst'));
          else if(m==='pct')par.append(miniInp(t[pref+'kind']==='D'?'Δ (%) =':'u (%) =','pct'));
          else if(m==='not')par.append(miniInp('%','pct'),miniInp('dgt','dgt'),miniInp('pas','res'));
          par.hidden=m==='pt';
        };
        modeSel.onchange=()=>{t[pref+'mode']=modeSel.value;renderPar();majColonnes(true);change(true)};
        kindSel.onchange=()=>{t[pref+'kind']=kindSel.value;renderPar();majColonnes(false);change(true)};
        hd.append(modeSel,kindSel);box.append(hd,par);renderPar();return box;
      };

      const actTout=h('button',{class:'mini',type:'button',title:'Réactiver tous les points décochés'},'Tout réactiver');
      actTout.id='ph-react3';
      actTout.hidden=!t.off.some(Boolean);
      actTout.onclick=()=>{t.off=t.rows.map(()=>false);g.build();actTout.hidden=true;change()};

      /* 3.3 : bloc repliable prédiction / étalonnage inverse / f(a, b) avec corrélation (a, b) */
      const predDet=h('details',{class:'ph-opt'});
      if(t.predMode&&t.predMode!=='off')predDet.open=true;
      predDet.append(h('summary',{},'Prédiction, étalonnage inverse ou f(a, b)'));
      const predBody=h('div',{class:'ph-opt-body'}),predFields=h('div');
      const renderPred=()=>{
        predFields.innerHTML='';
        if(t.predMode==='y')predFields.append(fld('Abscisse X₀',t,'predVal',{rapide:true}),fld('Incertitude u(X₀) (0 si exacte)',t,'predU',{rapide:true}));
        else if(t.predMode==='x')predFields.append(fld('Ordonnée mesurée Y₀',t,'predVal',{rapide:true}),fld('Incertitude u(Y₀) (0 si exacte)',t,'predU',{rapide:true}));
        else if(t.predMode==='fab')predFields.append(
          fld('Grandeur calculée',t,'predNom',{nom:true,texte:true}),
          fld('Unité',t,'predUn',{nom:true,texte:true}),
          fld('Formule en a et b',t,'predExpr',{cls:'formule',texte:true,rapide:true}),
          h('div',{class:'ph-hint'},'Ex. 4*pi^2/a , 1/b , exp(a) — corrélation (a, b) conservée'));
      };
      predBody.append(seg([['off','Aucun'],['y','Y(X₀)'],['x','X(Y₀)'],['fab','f(a, b)']],t,'predMode',renderPred),predFields);
      renderPred();predDet.append(predBody);

      const nb3=h('button',{class:'mini',type:'button'},'Nouveaux tirages');nb3.onclick=()=>{t.graine=(t.graine||1)+1;change()};
      p.append(barre('t3',[...boutonCSV(importer3),actTout]),csvMapBox,nxBox,trRow,
        uColBloc('Incertitude X','x'),uColBloc('Incertitude Y','y'),
        h('div',{class:'ph-sub'},'Collez 2, 3 ou 4 colonnes depuis un tableur, ou déposez un fichier CSV. Décochez un point pour l\'exclure sans le supprimer.'),g);
      p.append(h('div',{class:'ph-sub'},'Monte-Carlo sur a et b'),seg([['unif','Tirages uniformes'],['gauss','Tirages gaussiens']],t,'loi'),
        selecteur('Nombre de tirages',[[1000,'1 000'],[10000,'10 000'],[50000,'50 000']],t,'M'),nb3,
        chk('Enveloppe d\'incertitude (±1σ, ±2σ)',t,'enveloppe'),

function d0(a){
  const t=ST.t0,P=a.panels.h0,nomBrut=nomGrandeur(t,'x'),nom=esc(nomBrut),unite=t.unite||'';

      pctVal=sp===''?0:Math.abs(lire(sp));dgtVal=sd===''?0:Math.abs(lire(sd));resVal=sr===''?0:Math.abs(lire(sr));
      Delta=(sp===''&&sd==='')?NaN:(finis(pctVal,dgtVal,resVal)?PH2.notice(lecture,pctVal,dgtVal,resVal):NaN);
    }

  const zi=zInfo(t,x,isFinite(u)?u:0);

  if(N>=2||(N===1&&!okB)){
    const full=PH2.hist(data,N),sF=Aa?Aa.s:0,mF=PH2.mean(data);
    const lo=[full.lo,mF-3*(sF||full.w)],hi=[full.lo+full.nb*full.w,mF+3*(sF||full.w)];
    if(zi){lo.push(zi.ref.x-3*zi.ref.u,zi.ref.x);hi.push(zi.ref.x+3*zi.ref.u,zi.ref.x)}

    if(Aa){o.moyenne=Aa.mean;o.moyNom=moyenne;if(isFinite(u)&&u>0)o.interv={m:Aa.mean,u,label:`u(${moyenne})`}}
    if(zi)o.ref=zi.ref;

  }else if(okB&&Delta>0){

    r+=note(Aa&&okB?`type A (${M.v('N')} = ${N}) et type B composés`:Aa?`type A, ${M.v('N')} = ${N} mesures`:'type B seul');

  setZone(calcZone(),c);

      if(ziB){ob.ref=ziB.ref;ob.refNom='b'}
      a.svg('ab3',histo(a,{x:0,y:0,w:w2,h:P3.h},oa).svg+histo(a,{x:w2,y:0,w:w2,h:P3.h},ob).svg);
    }
  }
  a.legend(t.histos&&!sans?[{c:BLEU,label:'Tirages Monte-Carlo'},{c:C.ink,label:'Valeur ajustée',dash:true},(zi||ziB)&&{c:C.v,label:'Référence'}]:[{c:BLEU,label:sans?'Point de mesure':'Point (|zᵢ| ≤ 2)',dot:true},ptsOff.length&&{c:C.ink2,label:'Point exclu',dot:true},t.zones&&!sans&&{c:C.cInk,label:(t.loi==='unif'?'Zone de tirage':'Zone de tirage 1σ, 2σ')+(kzm>1?` (u ×${kzm})`:'')},t.enveloppe&&isFinite(mc.ua)&&{c:C.E,label:'Enveloppe ±1σ, ±2σ',dash:true},!sans&&{c:C.F,label:'Point (|zᵢ| > 2)',dot:true},{c:C.ink,label:'Régression'},pred&&!pred.err&&(t.predMode==='y'||t.predMode==='x')&&{c:C.v,label:t.predMode==='y'?'Prévision Y(X₀)':'Étalonnage X(Y₀)',dot:true}]);

  /* résultats */
  let r=ligneRes(`Pente ${M.v('a')}`,ecrire(fit.a,mc.ua,un,M.v('a')),{nom:'a',x:fit.a,u:mc.ua,unite:un,versPropag:true})
       +ligneRes(`Ordonnée ${M.v('b')}`,ecrire(fit.b,mc.ub,uy,M.v('b')),{nom:'b',x:fit.b,u:mc.ub,unite:uy,versPropag:true});
  if(pred){
    if(pred.err)r+=note(esc(pred.err),'ko');
    else{
      const pLab=t.predMode==='y'?`Prévision ${ny}`:t.predMode==='x'?`Étalonnage ${nx}`:esc(String(t.predNom||'').trim()||'f(a,b)');
      const pNomBrut=t.predMode==='y'?nyBrut+'_0':t.predMode==='x'?nxBrut+'_0':(String(t.predNom||'').trim()||'f');
      const pUn=t.predMode==='y'?uy:t.predMode==='x'?ux:uniteCalculee(t.predUn);
      r+=ligneRes(pLab,ecrire(pred.val,pred.u,pUn,pLab),{nom:pNomBrut,x:pred.val,u:pred.u,unite:pUn,versPropag:true});
      r+=note(`Corrélation (a, b) prise en compte (${pred.ok} tirages${pred.rejected?`, ${pred.rejected} hors domaine`:''}).`,'gr');
    }
  }
  if(isFinite(mc.ub)&&mc.ub>0){
    const zb0=Math.abs(fit.b)/mc.ub;
    r+=note(`Test ${M.v('b')} = 0 : ${M.v('Z')} = <b>${F.sig(zb0,2)}</b> (${zb0<=2?'compatible avec 0':'incompatible avec 0'})`,'gr');
  }
  if(sans)r+=note(n>=3?`Sans incertitudes sur les mesures : ${incGrandeur('a')} et ${incGrandeur('b')} sont estimées à partir de la dispersion des points (${n} − 2 degrés de liberté). Ajoutez ${incX} et ${incY} pour valider le modèle avec les écarts normalisés.`:'Il faut au moins 3 points pour estimer u(a) et u(b) à partir de la dispersion.','gr');
  else if(dg.bad.length)r+=note(`${dg.bad.length===1?`Le point ${pts[dg.bad[0]].i+1} s'écarte`:`Les points ${dg.bad.map(k=>pts[k].i+1).join(', ')} s'écartent`} du modèle (|${sub('z','i')}| &gt; 2) : le modèle affine n'est pas validé.`,'ko');
  else r+=note(`Tous les |${sub('z','i')}| ≤ 2 : le modèle affine est compatible avec les mesures.`,'ok');
  if(dg.trop)r+=note('Tous les écarts sont très petits (|z| &lt; 0.5) : les incertitudes sont peut-être surestimées.','gr');
  if(dg.motif)r+=note('Les écarts sont regroupés par signe en fonction de l\'abscisse (structure en U ou en S) : le modèle est peut-être inadapté, même si tous les |z| ≤ 2.','gr');
  if(ptsOff.length)r+=note(`${ptsOff.length} point(s) décoché(s), exclu(s) de l'ajustement.`,'gr');
  if(trAct.rejet)r+=note(`${trAct.rejet} point(s) hors domaine de la transformation ignoré(s).`,'ko');
  if(mc.rejected>0)r+=note(`${mc.rejected} tirage(s) Monte-Carlo hors domaine écarté(s).`,'gr');
  if(partiel)r+=note(`${partiel} ligne(s) incomplète(s) ignorée(s).`,'gr');
  r+=zLigne(zi,ziB?`Pente ${M.v('a')}`:'')+zLigne(ziB,`Ordonnée ${M.v('b')}`);
  setZone(a.zones.resultat,r);

  /* détail du calcul */
  const sg=v=>F.sig(v,3),Ua=suffixeUnite(un),Ub=suffixeUnite(uy);
  const aNom=M.v('a'),bNom=M.v('b'),xi=sub(nx,'i'),yi=sub(ny,'i');
  const residu=`${yi} − ${aNom}${xi} − ${bNom}`;
  let c=`${M.v(ny)} = ${aNom} ${M.v(nx)} + ${bNom} (moindres carrés, ${n} points actifs)<br>`;
  if(!tx.id||!ty.id)c+=`<span class="gr">Transformation appliquée : X = ${nx}, Y = ${ny} (tirages Monte-Carlo sur les mesures brutes).</span><br>`;
  if(sans){
    const xMoy=M.v(barreMoyenne(nx)),yMoy=M.v(barreMoyenne(ny));
    const sxx=`Σ(${xi} − ${xMoy})²`;
    c+=`${aNom} = ${M.frac(`Σ(${xi} − ${xMoy})(${yi} − ${yMoy})`,sxx)} = ${sg(fit.a)}${Ua}`;
    c+=` ; ${bNom} = ${yMoy} − ${aNom} ${xMoy} = ${sg(fit.b)}${Ub}`;
    if(isFinite(sres)){
      c+=`<br><b>Dispersion des points</b><br>${M.v('s')} = ${M.sqrt(M.frac(`Σ(${residu})²`,`${M.v('N')} − 2`))} = ${sg(sres)}${Ub}`;
      c+=`<br><span class="lien">donc</span>${incGrandeur('a')} = ${M.frac(M.v('s'),M.sqrt(sxx))} = <span class="res">${sg(ua0)}${Ua}</span>`;
      c+=`<br>${incGrandeur('b')} = ${M.v('s')} ${M.sqrt(`${M.frac('1',M.v('N'))} + ${M.frac(`${xMoy}²`,sxx)}`)} = <span class="res">${sg(ub0)}${Ub}</span>`;
    }
  }else{
    c+=`${aNom} = ${sg(fit.a)}${Ua} ; ${bNom} = ${sg(fit.b)}${Ub}`;
    const conversions=[[t.xkind,nxBrut,t.xmode],[t.ykind,nyBrut,t.ymode]].filter(([kind,_,m])=>kind==='D'||m==='not')
      .map(([,nom0])=>`${incGrandeur(nom0)} = ${M.frac(incGrandeur(nom0,'Δ'),M.sqrt('3'))}`);
    if(conversions.length)c+=`<br><b>Conversion des demi-largeurs</b><br>${conversions.join(' ; ')}`;
    c+=`<br><b>Monte-Carlo</b> (${mc.A.length} tirages, loi ${t.loi==='unif'?'uniforme':'gaussienne'}, graine ${gr3})<br>`;
    c+=`${incGrandeur('a')} = <span class="res">${sg(mc.ua)}${Ua}</span> ; ${incGrandeur('b')} = <span class="res">${sg(mc.ub)}${Ub}</span>`+(isFinite(mc.corr)?` ; corrélation ${F.fix(mc.corr,2)}`:'');
    c+=`<br><b>Écarts normalisés</b><br>${M.v('z','i')} = ${M.frac(residu,M.sqrt(`${M.v('u')}(${yi})² + ${aNom}²${M.v('u')}(${xi})²`))}`;
    if(isFinite(chi2Red))c+=`<div class="gr">χ² réduit = Σ z<sub>i</sub>² / (N − 2) = <b>${F.fix(chi2Red,2)}</b> (${n-2} degré(s) de liberté).</div>`;
    c+=`<table>${z.map((v,i)=>`<tr><td>Point ${pts[i].i+1}</td><td class="${Math.abs(v)>2?'ko':'ok'}">${sub('z',pts[i].i+1)} = ${F.sig(v,3)}</td><td class="${Math.abs(v)>2?'ko':'ok'}">${Math.abs(v)>2?'hors de ±2':'dans ±2'}</td></tr>`).join('')}</table>`;
  }
  if(pred&&!pred.err){
    const pUn=t.predMode==='y'?uy:t.predMode==='x'?ux:uniteCalculee(t.predUn);
    const pExpr=t.predMode==='y'?`${aNom} X₀ + ${bNom}`:t.predMode==='x'?`${M.frac(`Y₀ − ${bNom}`,aNom)}`:esc(t.predExpr);
    c+=`<br><b>Calcul corrélé sur les tirages (${aNom}, ${bNom})</b><br>${pExpr} = <span class="res">${ecrire(pred.val,pred.u,pUn,t.predMode==='y'?'Y₀':t.predMode==='x'?'X₀':esc(t.predNom||'f'))}</span>`;
  }
  c+=zCalc(zi,aNom,'a','Écart normalisé sur la pente a')+zCalc(ziB,bNom,'b','Écart normalisé sur l\'ordonnée b');
  setZone(calcZone(),c);
}

/* ===================================================================== */
/* Onglet 4 : comparer plusieurs résultats (diagramme de compatibilité)   */
function d4(a){
  const t=ST.t4,S=a.S,C=a.C,K=a.k,P=a.panels.cmp4;
  const nomBrut=nomGrandeur(t,'x'),nom=esc(nomBrut),unite=t.unite||'';
  const actifs=t.items.filter(it=>it.on!==false&&finis(it.val,it.p)&&it.p>=0).map((it,idx)=>({
    nom:String(it.nom||'').trim()||`Mesure ${idx+1}`,x:it.val,u:it.kind==='D'?it.p/SQ3:it.p
  }));
  if(actifs.length<2){
    manque(a,'cmp4','Entrez au moins deux résultats avec leurs incertitudes pour les comparer.');
    a.legend([]);setZone(a.zones.resultat,note('Saisissez au moins deux valeurs et leurs incertitudes (ou importez depuis le Carnet de séance).','gr'));
    setZone(calcZone(),'');return;
  }
  const cmp=PH2.comparer(actifs);
  const xr=t.ref?lire(t.xref):NaN,ur=t.ref?Math.max(0,lire(t.uref)||0):0;
  const hasRef=t.ref&&isFinite(xr);
  const zRefs=hasRef?actifs.map(m=>PH2.ecartNorm(m.x,m.u,xr,ur)):null;
  const zMoyRef=hasRef&&isFinite(cmp.xMoy)?PH2.ecartNorm(cmp.xMoy,cmp.uMoy,xr,ur):NaN;

  /* diagramme de compatibilité (forest plot horizontal) */
  const los=actifs.map(m=>m.x-2.4*m.u),his=actifs.map(m=>m.x+2.4*m.u);
  if(hasRef){los.push(xr-2.4*ur,xr);his.push(xr+2.4*ur,xr)}
  let xlo=Math.min(...los),xhi=Math.max(...his);
  if(!(xhi>xlo)){const d=Math.abs(xlo)*0.05||1;xlo-=d;xhi+=d}
  const pad=0.08*(xhi-xlo);xlo-=pad;xhi+=pad;
  const f=echelle(xlo,xhi);
  const padL=Math.min(P.w*.30,145*K),padR=hasRef?84*K:26*K,padT=24*K,padB=44*K;
  const nRows=actifs.length+(t.moyPond&&isFinite(cmp.xMoy)?1:0);
  const G=S.graph({x:0,y:0,w:P.w,h:P.h,padL,padR,padT,padB,xmin:xlo/f,xmax:xhi/f,ymin:0,ymax:nRows+1,
    yticks:[],nx:Math.max(3,Math.round((P.w-padL-padR)/(80*K))),
    xfmt:(v,st)=>F.fix(v,Math.max(0,-Math.floor(Math.log10(st)+1e-9))),
    xlab:axeGrandeur(nom,unite)+suffixe(f),ylab:''});
  const X=v=>G.X(v/f);
  let s=S.clip('ccmp4',G)+G.svg+`<g clip-path="url(#ccmp4)">`;
  if(hasRef){
    if(ur>0)s+=S.rect(X(xr-ur),G.y0,X(xr+ur)-X(xr-ur),G.h,{fill:C.v,fop:.14});
    s+=S.line(X(xr),G.y0,X(xr),G.y0+G.h,{c:C.v,w:2.8});
  }
  if(t.moyPond&&isFinite(cmp.xMoy)){
    s+=S.rect(X(cmp.xMoy-cmp.uMoy),G.y0,X(cmp.xMoy+cmp.uMoy)-X(cmp.xMoy-cmp.uMoy),G.h,{fill:C.E,fop:.12});
    s+=S.line(X(cmp.xMoy),G.y0,X(cmp.xMoy),G.y0+G.h,{c:C.E,w:1.8,dash:'6 4'});
  }
  actifs.forEach((m,i)=>{
    const y=G.Y(nRows-i),bad=hasRef?zRefs[i]>2:(isFinite(cmp.xMoy)&&PH2.ecartNorm(m.x,m.u,cmp.xMoy,0)>2);
    const col=bad?C.F:BLEU;
    if(m.u>0){
      s+=S.line(X(m.x-2*m.u),y,X(m.x+2*m.u),y,{c:col,w:2,op:.4});
      s+=S.line(X(m.x-m.u),y,X(m.x+m.u),y,{c:col,w:4.5});
      s+=S.line(X(m.x-m.u),y-5*K,X(m.x-m.u),y+5*K,{c:col,w:2})+S.line(X(m.x+m.u),y-5*K,X(m.x+m.u),y+5*K,{c:col,w:2});
    }
    s+=S.circle(X(m.x),y,6*K,{fill:col,c:C.card,w:1.5});
  });
  if(t.moyPond&&isFinite(cmp.xMoy)){
    const y=G.Y(1),col=C.E;
    s+=S.line(X(cmp.xMoy-2*cmp.uMoy),y,X(cmp.xMoy+2*cmp.uMoy),y,{c:col,w:2,op:.4});
    s+=S.line(X(cmp.xMoy-cmp.uMoy),y,X(cmp.xMoy+cmp.uMoy),y,{c:col,w:5});
    s+=S.circle(X(cmp.xMoy),y,6.5*K,{fill:col,c:C.card,w:1.5});
  }
  s+='</g>';
  /* libellés à gauche et scores Z à droite (hors clip) */
  actifs.forEach((m,i)=>{
    const y=G.Y(nRows-i);
    s+=S.text(G.x0-10*K,y,esc(m.nom),{anchor:'end',size:13.5,c:C.ink,halo:false});
    if(hasRef)s+=S.text(G.x0+G.w+8*K,y,`Z = ${F.sig(zRefs[i],2)}`,{anchor:'start',size:12.5,c:zRefs[i]<=2?C.v:C.F,weight:600,halo:false});
  });
  if(t.moyPond&&isFinite(cmp.xMoy)){
    const y=G.Y(1);
    s+=S.text(G.x0-10*K,y,'Moy. pondérée',{anchor:'end',size:13.5,c:C.E,weight:600,halo:false});
    if(hasRef&&isFinite(zMoyRef))s+=S.text(G.x0+G.w+8*K,y,`Z = ${F.sig(zMoyRef,2)}`,{anchor:'start',size:12.5,c:zMoyRef<=2?C.v:C.F,weight:600,halo:false});
  }
  if(hasRef)s+=S.text(X(xr)+5*K,G.y0+13*K,S.v(nom,'réf'),{anchor:'start',size:13,c:C.v,weight:600});
  a.svg('cmp4',s);
  a.legend([{c:BLEU,label:'Mesure (±u épais, ±2u fin)',dot:true},t.moyPond&&isFinite(cmp.xMoy)&&{c:C.E,label:'Moyenne pondérée',dash:true},hasRef&&{c:C.v,label:'Référence'}]);

  /* résultats */
  let r='';
  if(t.moyPond&&isFinite(cmp.xMoy)){
    r+=ligneRes('Moy. pondérée',ecrire(cmp.xMoy,cmp.uMoy,unite,nom),{nom:nomBrut+'_pond',x:cmp.xMoy,u:cmp.uMoy,unite,versPropag:true});
  }
  if(cmp.compatible)r+=note(`Écart normalisé maximal entre mesures : ${M.v('Z')}<sub>max</sub> = <b>${F.sig(cmp.zMax,3)}</b> ≤ 2 — les ${actifs.length} résultats sont mutuellement compatibles.`,'ok');
  else{
    const koP=cmp.paires.filter(p=>!p.ok).map(p=>`${esc(actifs[p.i].nom)} / ${esc(actifs[p.j].nom)} (${M.v('Z')} = ${F.sig(p.z,3)})`).join(', ');
    r+=note(`Incompatibilité entre mesures : ${koP}.`,'ko');
    if(t.moyPond&&isFinite(cmp.xMoy))r+=note('Attention : la moyenne pondérée suppose des mesures compatibles et indépendantes.','gr');
  }
  if(hasRef){
    const badR=actifs.filter((_,i)=>zRefs[i]>2).map((m,_,arr)=>esc(m.nom));
    r+=note(badR.length?`Référence : écart > 2 pour ${actifs.map((m,i)=>zRefs[i]>2?`${esc(m.nom)} (Z = ${F.sig(zRefs[i],3)})`:'').filter(Boolean).join(', ')}.`:`Tous les résultats sont compatibles avec la référence (Z ≤ 2).`,badR.length?'ko':'ok');
  }
  setZone(a.zones.resultat,r);

  /* calcul détaillé : matrice Z_ij + référence + moyenne pondérée */
  const U=suffixeUnite(unite),sg=v=>F.sig(v,3);
  let c=`<b>Écarts normalisés entre mesures</b><br>${M.v('Z')}<sub>ij</sub> = ${M.frac(`|${sub(nom,'i')} − ${sub(nom,'j')}|`,M.sqrt(`${sub('u','i')}² + ${sub('u','j')}²`))}`;
  c+=`<table class="ph-zmat"><thead><tr><th></th>${actifs.map(m=>`<th>${esc(m.nom)}</th>`).join('')}</tr></thead><tbody>`;
  actifs.forEach((mi,i)=>{
    c+=`<tr><td>${esc(mi.nom)}</td>${actifs.map((_,j)=>{
      if(i===j)return '<td class="gr">—</td>';
      const zv=cmp.Z[i][j];return `<td class="${zv<=2?'ok':'ko'}">${F.sig(zv,3)}</td>`;
    }).join('')}</tr>`;
  });
  c+='</tbody></table>';
  if(hasRef){
    c+=`<br><b>Comparaison à la référence</b> (${sg(xr)}${ur>0?` ± ${sg(ur)}`:''}${U})<table>`;
    actifs.forEach((m,i)=>{c+=`<tr><td>${esc(m.nom)}</td><td class="${zRefs[i]<=2?'ok':'ko'}">Z = ${F.sig(zRefs[i],3)}</td><td class="${zRefs[i]<=2?'ok':'ko'}">${zRefs[i]<=2?'compatible':'incompatible'}</td></tr>`});
    c+='</table>';
  }
  if(isFinite(cmp.xMoy)){
    c+=`<br><b>Moyenne pondérée par l'inverse des variances</b> (w<sub>i</sub> = 1/u<sub>i</sub>²)<br>`;
    c+=`${M.v(barreMoyenne(nom))}<sub>pond</sub> = ${M.frac(`Σ ${sub(nom,'i')}/${sub('u','i')}²`,`Σ 1/${sub('u','i')}²`)} = ${sg(cmp.xMoy)}${U}<br>`;
    c+=`${M.v('u')}(${M.v(barreMoyenne(nom))}<sub>pond</sub>) = ${M.frac('1',M.sqrt(`Σ 1/${sub('u','i')}²`))} = <span class="res">${sg(cmp.uMoy)}${U}</span><br>`;
    c+=`<span class="gr">χ² réduit = ${F.fix(cmp.chi2Red,2)} (pour ${actifs.length-1} degré(s) de liberté).</span>`;
  }
  setZone(calcZone(),c);
}

</script>
