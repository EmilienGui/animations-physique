  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';

    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  fix(x,d=2){

  sci(x,n=2){

  A.enable=(id,on)=>{const b=document.getElementById('b_'+id);if(b)b.disabled=!on};

  /* ---------- affichages ---------- */
  const metricsCount=$('.ak-metrics-count',metricsWrap);
  A.metrics=arr=>{
    const L=(arr||[]).filter(Boolean),hh=L.some(m=>m.hint);
    metrics.classList.toggle('has-h',hh);
    metricsWrap.classList.toggle('has-items',L.length>0);
    ak.classList.toggle('ak-has-metrics',L.length>0);
    if(metricsCount.textContent!==String(L.length))metricsCount.textContent=String(L.length);
    const html=L.map((m,i)=>`<div class="ak-metric${m.warn?' warn':''}${expandedMetrics.has(String(i))?' is-expanded':''}" data-idx="${i}" title="Cliquer pour développer / réduire"><div class="k">${m.label}</div><div class="v">${m.value}${m.unit?(m.unit==='°'?'°':`<span class="u">${m.unit}</span>`):''}</div>${m.hint?`<div class="h">${m.hint}</div>`:''}</div>`).join('');
    if(metrics._h!==html){metrics.innerHTML=html;metrics._h=html}
  };
  A.insight=()=>{};
  A.legend=arr=>{const html=(arr||[]).filter(Boolean).map(l=>`<span><i class="${l.dash?'dash':l.dot?'dot':''}" style="background:${l.c};--lc:${l.c}"></i>${l.label}</span>`).join('');if(legend._h!==html){legend.innerHTML=html;legend._h=html}};
  A.clock=html=>{const c=$('.ak-clock',tr);if(c._h!==html){c.innerHTML=html;c._h=html}};
  A.toast=m=>{toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastEl._h);toastEl._h=setTimeout(()=>toastEl.classList.remove('show'),1800)};
  A.panelVisible=id=>!A.panels[id].el.hidden;

  /* ---------- tailles ---------- */
  function viewBox(P){
    const {w,h,vx,vy,vz}=P;
    P.node.setAttribute('viewBox',P.vue==='svg'?`${vx.toFixed(2)} ${vy.toFixed(2)} ${(w/vz).toFixed(2)} ${(h/vz).toFixed(2)}`:`0 0 ${w.toFixed(1)} ${h.toFixed(1)}`);
  }
  function measure(){
    A.narrow=ak.clientWidth<=640; ak.style.setProperty('--ak-top',(top.offsetHeight+(tabs?tabs.offsetHeight:0))+'px');
    if(A.narrow){if(metricsWrap.parentNode!==right||right.lastElementChild!==metricsWrap)right.append(metricsWrap)}
    else{if(metricsWrap.parentNode!==right||right.firstElementChild!==metricsWrap)right.insertBefore(metricsWrap,side)}
    A.k=ak.classList.contains('is-proj')?1.6:A.narrow?1:1.15;
    for(const P of Object.values(A.panels)){
      if(P.el.hidden)continue;
      if(A.narrow){const w=P.el.clientWidth||ak.clientWidth;P.node.style.height=Math.round(w*(P.cfg.ratioTel??.8))+'px'}else P.node.style.height='';
      const r=P.node.getBoundingClientRect(); P.w=Math.max(50,r.width); P.h=Math.max(50,r.height);
      if(P.type==='canvas'){const d=window.devicePixelRatio||1;if(P.node.width!==Math.round(P.w*d)||P.node.height!==Math.round(P.h*d)){P.node.width=Math.round(P.w*d);P.node.height=Math.round(P.h*d)}P.ctx=P.node.getContext('2d');P.ctx.setTransform(d,0,0,d,0,0)}
      else viewBox(P);
    }
  }
  /* ---------- rendu ---------- */
  let graphPanels=[];
  const activeChartView=P=>P?.vue==='graphe'&&zoomed(P)?P:null;
  function drawFrame(){
    const frame={graphs:[],views:graphPanels.map(activeChartView),outputs:new Map()};
    A._graphFrame=frame;
    try{cfg.draw?.(A)}finally{A._graphFrame=null}
    graphPanels=[];
    for(const [P,output] of frame.outputs){
      const graphs=[...output.html.matchAll(/<g data-ak-graph="(\d+)">/g)].map(m=>frame.graphs[+m[1]]).filter(Boolean);
      output.graphs=graphs;
      if(P.vue==='svg'||P.vue==='graphe'){
        const vue=graphs.length?'graphe':'svg';
        if(vue!==P.vue){P.vue=vue;resetView(P);viewBox(P)}
        P.graphs=graphs;
      }
      const view=activeChartView(P);
      for(const graph of graphs){
        graphPanels[graph.id]=P;
        if(graph.view!==view)frame.changed=true;
      }
    }
    return frame;
  }
  function clipCharts(node,graphs){
    const svgElement=tag=>document.createElementNS(node.namespaceURI,tag);
    for(const graph of graphs){
      const axes=node.querySelector(`[data-ak-graph="${graph.id}"]`);
      if(!axes)continue;
      const id='ak-cadre-'+graph.id, defs=svgElement('defs'),clip=svgElement('clipPath'),rect=svgElement('rect');
      clip.id=id;
      for(const [k,v] of Object.entries({x:graph.x0,y:graph.y0,width:graph.w,height:graph.h}))rect.setAttribute(k,v);
      clip.append(rect);defs.append(clip);axes.append(defs);
      let layer=null;
      for(let next=axes.nextElementSibling;next&&!next.hasAttribute('data-ak-graph');){
        const child=next;next=child.nextElementSibling;
        if(child.localName==='defs'||child.hasAttribute('data-ak-hors-graphe')){layer=null;continue}
        if(!layer){
          layer=svgElement('g');
          layer.setAttribute('clip-path',`url(#${id})`);
          child.before(layer);
        }
        layer.append(child);
      }
    }
  }
  function writeSvg(P,html,graphs=[]){
    if(P.node._h===html)return;
    P.node.innerHTML=html;
    P.node._h=html;
    if(activeChartView(P))clipCharts(P.node,graphs);
  }
  A.renderNow=()=>{
    A._dirty=false;measure();
    let frame=drawFrame();
    if(frame.changed)frame=drawFrame();
    for(const [P,output] of frame.outputs)writeSvg(P,output.html,output.graphs);
    syncScrub();guardScroll();
  };
  A.render=()=>{if(A._dirty)return;A._dirty=true;requestAnimationFrame(()=>{if(A._dirty)A.renderNow()})};
  A.svg=(id,html)=>{
    const P=A.panels[id];if(!P)return;
    if(A._graphFrame)A._graphFrame.outputs.set(P,{html});
    else writeSvg(P,html);
  };

  /* ---------- temps ---------- */
  let last=0;
  const playBtn=$('.ak-play',tr);
  A.play=on=>{on=on===undefined?!A.running:on;if(on&&cfg.peutLire&&!cfg.peutLire(A))on=false;A.running=on;playBtn.textContent=on?'❚❚ Pause':'▶ Lecture';if(on){last=performance.now();requestAnimationFrame(loop)}};
  function loop(now){if(!A.running)return;const dt=Math.min(.05,(now-last)/1000)*A.speed;last=now;if(cfg.step)cfg.step(A,dt);A.renderNow();requestAnimationFrame(loop)}
  A.stepOnce=()=>{A.play(false);if(cfg.step)cfg.step(A,cfg.pas??1/24);A.render()};
  A.reset=()=>{A.play(false);A.t=0;if(cfg.reset)cfg.reset(A);A.render()};
  $('.ak-speed',tr).onchange=e=>{A.speed=+e.target.value};A.speed=cfg.vitesse||1;

  /* ---------- onglets ---------- */
  A.setTab=i=>{if(!tabs||i<0||i>=cfg.onglets.length)return;A.play(false);A.tab=i;A.cadrerTout();clearActivePresets();$$('.ak-tab',tabs).forEach((b,j)=>b.setAttribute('aria-selected',String(j===i)));if(cfg.onglet)cfg.onglet(A,i);refreshSettings();A.render()};

  /* ---------- thème, projection, plein écran ---------- */
  A.setTheme=t=>{root.dataset.theme=t;writeStore(THEME_KEY,t);readColors();syncMenu();A.renderNow()};
  A.setProj=on=>{
    ak.classList.toggle('is-proj',on);
    ak.classList.remove('drawer-open');
    projButton.classList.toggle('on',on);
    syncMenu();
    A.render();
  };
  const acts={
    play:()=>A.play(),step:()=>A.stepOnce(),reset:()=>A.reset(),
    help:()=>{dlg.showModal()},theme:()=>A.setTheme(root.dataset.theme==='dark'?'light':'dark'),
    image:()=>A.exportImage(),proj:()=>{
      const projected=ak.classList.contains('is-proj');
      A.setProj(!projected);
      if(cfg.menuCommun&&projected&&A.narrow)ak.classList.add('drawer-open');
    },
    fs:()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>A.toast('Plein écran refusé par le navigateur'))},
    settings:()=>{ak.classList.toggle('drawer-open');A.render()}
  };
  ak.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&acts[b.dataset.act])acts[b.dataset.act]()});
  addEventListener('keydown',e=>{
    if(dlg.open||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.target.matches('input,select,textarea'))return;
    const k=e.key.toLowerCase(), custom=cfg.touches&&cfg.touches[k];
    if(custom){e.preventDefault();custom(A);A.render();return}
    if(k===' '&&!tr.hidden){e.preventDefault();acts.play()}
    else if(k==='arrowright'&&!tr.hidden){e.preventDefault();acts.step()}
    else if(k==='r'&&!tr.hidden)acts.reset();
    else if(k==='h'||k==='?')acts.help();else if(k==='p')acts.proj();else if(k==='f')acts.fs();else if(k==='t')acts.theme();else if(k==='i')acts.image();
    else if(k==='+'||k==='='||k==='-'||k==='0'){const P=(A._hover&&!A._hover.el.hidden&&A._hover.vue)?A._hover:Object.values(A.panels).find(q=>q.vue&&!q.el.hidden);if(P){e.preventDefault();if(k==='0')A.cadrer(P);else A.zoomer(P,k==='-'?.8:1.25)}}
    else if(k==='escape'){ak.classList.remove('drawer-open');A.render()}
    else if(/^[1-9]$/.test(k))A.setTab(+k-1);
  });

  /* ---------- vue : zoom, cadrage, déplacement ---------- */
  const deplacable=P=>P.vue==='svg'||P.vue==='graphe';
  function zoomed(P){
    if(P.vue==='interne')return Math.abs(P.zoom-1)>1e-6;
    if(!deplacable(P))return false;
    const seuil=P.vue==='graphe'?1e-6:.5;
    return Math.abs(P.vz-1)>1e-6||Math.abs(P.vx)>seuil||Math.abs(P.vy)>seuil;
  }
  const markZoom=P=>{if(P.tools)P.tools.classList.toggle('is-zoomed',zoomed(P))};
  const graphAt=(P,x,y)=>P.graphs.find(g=>x>=g.x0&&x<=g.x0+g.w&&y>=g.y0&&y<=g.y0+g.h);
  function resetView(P){P.vz=1;P.vx=P.vy=0;P.zoom=1;P.panX=P.panY=0;markZoom(P)}
  A.zoomer=(P,f,px,py)=>{if(typeof P==='string')P=A.panels[P];if(!P||!P.vue)return;
    if(P.vue==='interne')P.zoom=Math.max(.4,Math.min(5,P.zoom*f));
    else{
      if(P.vue==='graphe'){
        const graph=graphAt(P,px,py);
        px=graph?(px-graph.x0)/graph.w:.5;
        py=graph?(py-graph.y0)/graph.h:.5;
      }else{px=px??P.w/2;py=py??P.h/2}
      const z=Math.max(.5,Math.min(8,P.vz*f)), delta=1/P.vz-1/z;
      P.vx+=px*delta;P.vy+=py*delta;P.vz=z;
    }
    markZoom(P);A.render()};
  A.deplacer=(P,dx,dy,px,py)=>{
    if(!deplacable(P))return;
    if(P.vue==='graphe'){const g=graphAt(P,px,py)||P.graphs[0];dx/=g.w;dy/=g.h}
    P.vx-=dx/P.vz;P.vy-=dy/P.vz;markZoom(P);A.render()
  };
  A.cadrer=P=>{if(typeof P==='string')P=A.panels[P];if(!P)return;resetView(P);A.render()};
  A.cadrerTout=()=>{for(const P of Object.values(A.panels))A.cadrer(P)};

  function wire(P){const N=P.node,pts=new Map();let mode=null,h=null,last=null,pin=null;
    const scr=e=>{const r=N.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    const toV=s=>P.vue==='svg'?[P.vx+s[0]/P.vz,P.vy+s[1]/P.vz]:s;
    const two=()=>{const[a,b]=[...pts.values()];return{d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,c:[(a[0]+b[0])/2,(a[1]+b[1])/2]}};
    N.addEventListener('pointerdown',e=>{
      const s=scr(e);A._hover=P;pts.set(e.pointerId,s);
      if(pts.size===2&&P.vue){if(mode==='drag'&&h&&h.end)h.end(e);mode='pinch';h=null;pin=two();N.setPointerCapture(e.pointerId);e.preventDefault();return}
      if(pts.size>1)return;
      const[x,y]=toV(s);
      if(deplacable(P)&&(e.shiftKey||e.button===1))mode='pan';
      else{h=P._drags.find(d=>!d.hit||d.hit(x,y,e))||null;
        if(h){mode='drag';if(h.start)h.start(x,y,e)}
        else if(deplacable(P)&&zoomed(P))mode='pan';
        else{mode=null;return}}
      last=s;N.setPointerCapture(e.pointerId);e.preventDefault();A.render()});
    N.addEventListener('pointermove',e=>{const s=scr(e);
      if(!pts.has(e.pointerId)){if(e.pointerType==='mouse'){const[x,y]=toV(s);N.style.cursor=P._drags.some(d=>d.hit&&d.hit(x,y,e))?'grab':(deplacable(P)&&(e.shiftKey||zoomed(P)))?'move':''}return}
      pts.set(e.pointerId,s);
      if(mode==='pinch'&&pts.size>=2){const q=two();A.zoomer(P,q.d/pin.d,q.c[0],q.c[1]);A.deplacer(P,q.c[0]-pin.c[0],q.c[1]-pin.c[1],q.c[0],q.c[1]);pin=q;return}
      if(mode==='pan'){A.deplacer(P,s[0]-last[0],s[1]-last[1],last[0],last[1]);last=s;return}
      if(mode==='drag'&&h){const[x,y]=toV(s);h.move(x,y,e);A.render()}});
    const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
      if(mode==='drag'&&h&&h.end)h.end(e);
      if(pts.size===0){mode=null;h=null}else if(mode==='pinch'){mode='pan';last=[...pts.values()][0]}
      A.render()};
    N.addEventListener('pointerup',end);N.addEventListener('pointercancel',end);
    if(P.vue){
      N.addEventListener('wheel',e=>{if(A.narrow&&!e.ctrlKey)return;e.preventDefault();const s=scr(e);A.zoomer(P,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),s[0],s[1])},{passive:false});
      N.addEventListener('dblclick',e=>{const[x,y]=toV(scr(e));if(!P._drags.some(d=>d.hit&&d.hit(x,y,e))&&zoomed(P))A.cadrer(P)});
      N.addEventListener('pointerenter',()=>{A._hover=P});
    }
  }
  for(const P of Object.values(A.panels))wire(P);
  A.drag=(id,h)=>{A.panels[id]._drags.push(h)};

  /* ---------- export image (toujours en thème clair) ---------- */
  A.exportImage=async()=>{
    const was=root.dataset.theme; root.dataset.theme='light'; readColors(); A.renderNow();
    const vis=Object.values(A.panels).filter(P=>!P.el.hidden), base=pwrap.getBoundingClientRect(), sc=2;
    const cv=document.createElement('canvas'); cv.width=Math.round(base.width*sc); cv.height=Math.round(base.height*sc);
    const ctx=cv.getContext('2d'); ctx.fillStyle=A.C.card; ctx.fillRect(0,0,cv.width,cv.height);
    const jobs=vis.map(P=>new Promise(res=>{const r=P.node.getBoundingClientRect(), x=(r.left-base.left)*sc, y=(r.top-base.top)*sc;
      if(P.type==='canvas'){ctx.drawImage(P.node,x,y,r.width*sc,r.height*sc);res();return}
      const clone=P.node.cloneNode(true); clone.setAttribute('width',r.width); clone.setAttribute('height',r.height);
      const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
      const im=new Image(); im.onload=()=>{ctx.drawImage(im,x,y,r.width*sc,r.height*sc);res()}; im.onerror=()=>res(); im.src=src;}));
    await Promise.all(jobs);
    root.dataset.theme=was; readColors(); A.renderNow();
    const a=document.createElement('a'); const tabName=cfg.onglets&&cfg.onglets.length>1?'_'+(A.tab+1):'';
    a.download=`${cfg.code}_${(cfg.fichier||cfg.titre).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_')}${tabName}.png`;
    a.href=cv.toDataURL('image/png'); a.click(); A.toast('Image enregistrée (thème clair)');
  };

  /* ---------- aide ---------- */
  function buildHelp(){
    const h=cfg.aide||{}, sec=(t,c)=>c?`<h4>${t}</h4>${/^\s*</.test(c)?c:`<p>${c}</p>`}`:'';
    dlg.innerHTML=`<header><h3>Aide · ${cfg.titre}</h3><button class="mini" data-close>Fermer ✕</button></header><div class="db">
    ${cfg.sousTitre?`<p class="ak-dlg-sub">${cfg.sousTitre}</p>`:''}${sec('Ce qu\'on voit',h.voit)}${sec('Ce qu\'on peut faire',h.faire)}${sec('Modèle et hypothèses',h.modele)}${sec('Lien avec le cours',h.cours)}${sec('Pour aller plus loin',h.plus)}
    <h4>Raccourcis</h4><p>${cfg.temps?'<kbd>Espace</kbd> lecture / pause · <kbd>→</kbd> pas à pas · <kbd>R</kbd> recommencer · ':''}${tabs?`<kbd>1</kbd>–<kbd>${cfg.onglets.length}</kbd> onglets · `:''}<kbd>P</kbd> projection · <kbd>F</kbd> plein écran · <kbd>T</kbd> thème · <kbd>I</kbd> image · <kbd>H</kbd> aide${h.touches?' · '+h.touches:''}</p>
    <p>Vue : molette, pincement ou <kbd>+</kbd> <kbd>−</kbd> pour zoomer · <kbd>Maj</kbd> + glisser, deux doigts, ou glisser une vue zoomée pour la déplacer · « Cadrer », <kbd>0</kbd> ou double clic : vue initiale · Double-clic sur un curseur : valeur par défaut.</p>
    ${h.credits?`<h4>Crédits</h4><p>${h.credits}</p>`:''}</div>`;
    dlg.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===dlg)dlg.close()});
  }

  /* ---------- démarrage ---------- */
  buildSettings(); buildHelp(); readColors();
  if(cfg.init)cfg.init(A);
  refreshSettings(); A.reset();
  new ResizeObserver(()=>A.render()).observe(ak);
  return A;
}

window.AnimKit={app,fmt,M,ticks,niceStep,FONT,MATH,interrupteur};
})();

</script>
<script>
/* =====================================================================
   MC2 MP · A2 Plan incliné et cône de frottement : modèle
   Bloc en translation sur un plan incliné d'angle α ; axe (Ox) selon la ligne de plus grande pente,
   vers le haut. Variable d'état comme dans le cours (IV.3) : adhérence (v = 0, R_T = m g sin α,
   possible si tan α ≤ f_s) ou glissement (R_T = −f_d R_N sgn v). Chaque phase est un mouvement
   uniformément accéléré, résolu exactement.
   Deux expériences :
     lancer(P)   : plan fixe, bloc posé ou lancé à v0 ;
     incliner(P) : planche inclinée lentement jusqu'au départ du bloc (α_l = arctan f_s), avec
                   retour éventuel à α_r un peu après le départ.
   Angles en radians.
   ===================================================================== */
const MC2Plan = (() => {
  'use strict';
  const G = 9.81;
  const OMEGA = 5 * Math.PI / 180;          // vitesse d'inclinaison (rad/s)
  const COURSE = 0.8;                       // distance du point de départ au bas de la planche (m)
  const TAU_R = 0.3;                        // retour de la planche : délai après le départ (s)

  const tient = (alpha, fs) => Math.tan(alpha) <= fs + 1e-12;
  const accel = (alpha, fd, sg) => -G * (Math.sin(alpha) + sg * fd * Math.cos(alpha));

  /* phases d'un mouvement sur un plan fixe à partir de (t0, x0, v0) */
  function phases(alpha, fs, fd, t0, x0, v0) {
    const segs = [];
    const repos = (t, x) => segs.push({type: 'adh', t0: t, t1: Infinity, x0: x, v0: 0, a: 0, alpha, sg: 0});
    const descente = (t, x) => segs.push({type: 'gl', t0: t, t1: Infinity, x0: x, v0: 0, a: accel(alpha, fd, -1), alpha, sg: -1});
    if (Math.abs(v0) < 1e-12) {
      if (tient(alpha, fs)) repos(t0, x0); else descente(t0, x0);
      return segs;
    }
    const sg = Math.sign(v0), a = accel(alpha, fd, sg);
    if (sg * a >= -1e-12) {                 // le bloc ne ralentit pas : un seul régime
      segs.push({type: 'gl', t0, t1: Infinity, x0, v0, a: Math.abs(a) < 1e-12 ? 0 : a, alpha, sg});
      return segs;
    }
    const duree = -v0 / a, t1 = t0 + duree, x1 = x0 - v0 * v0 / (2 * a);
    segs.push({type: 'gl', t0, t1, x0, v0, a, alpha, sg});
    if (tient(alpha, fs)) repos(t1, x1); else descente(t1, x1);
    return segs;
  }

  function lancer(P) {
    const segs = phases(P.alpha, P.fs, P.fd, 0, 0, P.v0);
    const arret = segs.length > 1 ? {t: segs[0].t1, x: segs[1].x0} : null;   // premier arrêt
    return {mode: 'lancer', P, segs, fin: P.tmax, arret};
  }

  /* instant, compté depuis le début de la phase, où le bloc atteint l'abscisse xb < x0 (v ≤ 0) */
  function atteint(seg, xb) {
    const d = seg.x0 - xb, v = -seg.v0, a = -seg.a;
    if (Math.abs(a) < 1e-12) return v > 1e-12 ? d / v : Infinity;
    const disc = v * v + 2 * a * d;
    if (disc < 0) return Infinity;
    const tau = (-v + Math.sqrt(disc)) / a;
    return tau >= 0 ? tau : Infinity;
  }

  function incliner(P) {
    const al = Math.atan(P.fs), td = al / OMEGA;
    let segs = [{type: 'adh', t0: 0, t1: td, x0: 0, v0: 0, a: 0, alpha: 0, omega: OMEGA, sg: 0}];
    const a1 = Math.min(0, accel(al, P.fd, -1));          // g cos α_l (f_d − f_s)
    const depart = {type: 'gl', t0: td, t1: Infinity, x0: 0, v0: 0, a: Math.abs(a1) < 1e-12 ? 0 : a1, alpha: al, sg: -1};
    if (P.retour && P.alphaR < al - 1e-9) {
      depart.t1 = td + TAU_R;
      const vr = depart.a * TAU_R, xr = depart.a * TAU_R * TAU_R / 2;

    let in_ = b.fond;
    if (p.theorie) in_ += S.curve(courbe(res, T, f), G, {c: C.ink2, w: 1.4, dash: '2 4'});
    if (gardee) in_ += S.curve(gardee[id], G, {c: C.ink2, w: 1.8, dash: '6 4'});
    in_ += S.curve(courbe(res, t, f), G, {c: estV ? C.v : C.cInk, w: 2.8});
    if (p.valeurs && res.arret && res.arret.t <= T) {
      const xt = G.X(res.arret.t);
      in_ += S.line(xt, G.y0, xt, G.y0 + G.h, {c: C.ink, w: 1.2, dash: '5 4'});
      in_ += lab(a, xt + 5 * k, G.y0 + 10 * k, estV ? S.v('t', '1') + ' = ' + fmt.fix(res.arret.t, 2) + ' s' : S.v('d') + ' = ' + fmt.fix(Math.abs(res.arret.x), 2) + ' m', {size: 13, c: C.ink});
    }
    in_ += S.line(G.X(t), G.y0, G.X(t), G.y0 + G.h, {c: C.ink2, w: 1.1, dash: '3 4'}) + S.circle(G.X(t), G.Y(f(e)), 5 * k, {fill: estV ? C.v : C.cInk, c: C.card, w: 1.5});
    const hors = courbe(res, t, f).some(q => Math.abs(q[1]) > Y * 1.001);
    a.svg(id, G.svg + clipped(S, G, 'mc2p-' + id, in_ + b.noms) + (hors ? lab(a, G.x0 + G.w - 4 * k, G.y0 - 9 * k, 'hors cadre : augmenter le maximum', {anchor: 'end', size: 13, c: C.hot, weight: 600}) : ''));
  }

  /* ---------- onglet 3 : cône de frottement ---------- */
  function sceneCone(a) {
    const {S, C, k, p, fmt} = a, P = a.panels.cone, w = P.w, h = P.h;
    const res = traj(a), e = MP.etat(res, instant(a));
    const al = p.alpha * D, ps = Math.atan(p.fs), pd = Math.atan(fdDe(p));
    const tri = p.triangle && w > 520 * k;
    const O = [w * (tri ? .4 : .5), h * .6], R = repere(O, al);
    const bw = Math.min(170 * k, w * .3), bh = bw * .52;
    const pxN = h * .58 / (2 * MP.G), Lc = h * .46;
    const sc = bw / .3, cam = e.x;                                  // le bloc reste au centre, les graduations défilent
    let g = planFixe(a, R, w, h, sc, cam);
    const b = bloc(a, R, e, 0, bw, bh), I = b.I;
    g += b.g;
    /* cônes, de sommet I et d'axe la normale */
    const axe = Math.PI / 2 + al;
    const pt = (ang, r) => [I[0] + r * Math.cos(ang), I[1] - r * Math.sin(ang)];
    const secteur = [I];
    for (let i = 0; i <= 40; i++) secteur.push(pt(axe - ps + 2 * ps * i / 40, Lc));
    g += S.poly(secteur, {close: true, fill: C.c, c: 'none', op: .2});
    for (const sg of [-1, 1]) {
      g += S.line(...I, ...pt(axe + sg * ps, Lc), {c: C.cInk, w: 2});
      g += S.line(...I, ...pt(axe + sg * pd, Lc), {c: cGl(a), w: 2, dash: '7 5'});
    }
    /* normale et verticale */
    g += S.arrow(...I, ...pt(axe, Lc * 1.08), {c: C.ink, w: 1.6});
    g += lab(a, ...pt(axe + .02, Lc * 1.08 + 12 * k), S.v('n', '1→2'), {anchor: 'middle', c: C.ink});
    g += S.line(...I, ...pt(Math.PI / 2, Lc * .98), {c: C.ink2, w: 1.2, dash: '2 5'});
    g += lab(a, ...pt(Math.PI / 2, Lc * .98 + 11 * k), 'verticale', {anchor: 'middle', size: 13, c: C.ink2});
    const nomCone = (ang, r, sym, val, c) => {
      const q = pt(ang, r), droite = Math.cos(ang) >= 0;
      return lab(a, q[0] + (droite ? 6 : -6) * k, q[1], S.v('φ', sym) + (p.angles ? ' = ' + fmt.fix(val / D, 1) + '°' : ''), {anchor: droite ? 'start' : 'end', c, weight: 600});
    };
    g += nomCone(axe + ps, Lc, 's', ps, C.cInk) + (ps - pd > .02 ? nomCone(axe - pd, Lc * .88, 'd', pd, cGl(a)) : '');
    const F = forces(a, R, e, b.G, I, pxN);
    g += F.s;
    /* angle θ entre la normale et R */
    const angR = al + Math.atan2(e.RN, e.RT);
    if (Math.abs(angR - axe) > .03) {
      g += S.arc(I[0], I[1], Lc * .34, axe, angR, {c: C.E, w: 2});
      g += lab(a, ...pt((axe + angR) / 2, Lc * .34 + 12 * k), S.v('θ'), {anchor: 'middle', c: C.E, weight: 700});
    }
    g += vitesse(a, R, e, 0, bh, bw);
    g += etatBadge(a, e, [S.v('θ') + ' = ' + fmt.fix(e.theta / D, 1) + '°', 'α = ' + fmt.fix(p.alpha, 1) + '°']);
    g += axes(a, R, tri ? w * .68 : w);
    if (tri) g += triangle(a, R, e, w * .84, h * .2, pxN);
    a.svg('cone', g);
  }

  /* m g + R = m a, tracé bout à bout */
  function triangle(a, R, e, x, y, pxN) {
    const {S, C, k, p} = a;
    const O = [x, y], A = [x, y + e.poids * pxN], Rv = R.vec(e.RT * pxN, e.RN * pxN), B = [A[0] + Rv[0], A[1] + Rv[1]];
    const somme = Math.hypot(B[0] - O[0], B[1] - O[1]);
    const d = somme > 4 ? 0 : 8 * k;                                 // a = 0 : les deux flèches côte à côte
    let s = S.arrow(...O, ...A, {c: C.F, w: 2.8}) + S.arrow(A[0] + d, A[1], B[0] + d, B[1], {c: C.E, w: 2.8});
    const cote = e.RT > 0 ? 1 : -1;                                  // poids et réaction nommés de part et d'autre
    s += lab(a, x - cote * 10 * k - (cote > 0 ? 18 * k : 0), (O[1] + A[1]) / 2, S.v('m'), {c: C.F, weight: 700}) +
      nomVec(a, x - cote * 10 * k - (cote > 0 ? 7 * k : -11 * k), (O[1] + A[1]) / 2, 'g', C.F);
    s += nomVec(a, (A[0] + B[0]) / 2 + cote * 12 * k, (A[1] + B[1]) / 2 + 4 * k, 'R', C.E, undefined, cote > 0 ? 'start' : 'end');
    if (somme > 4) {
      s += S.arrow(...O, ...B, {c: C.v, w: 2.8});
      const q = [(O[0] + B[0]) / 2, (O[1] + B[1]) / 2], g = B[0] <= O[0];
      s += lab(a, q[0] + (g ? -22 : 8) * k, q[1] - 12 * k, S.v('m'), {c: C.v, weight: 700}) + nomVec(a, q[0] + (g ? -10 : 20) * k, q[1] - 12 * k, 'a', C.v);
    }
    s += S.circle(x, y, 3 * k, {fill: C.ink});
    s += lab(a, x, y + e.poids * pxN + 24 * k, somme > 4 ? 'somme m a, parallèle au plan' : 'somme nulle : a = 0', {anchor: 'middle', size: 13, c: C.ink});
    return s;
  }

  /* ---------- mesures et légende ---------- */
  function mesures(a) {
    const {p, fmt} = a, res = traj(a), t = instant(a), e = MP.etat(res, t);
    const L = [
      {label: 'État du contact', value: e.type === 'adh' ? 'adhérence' : 'glissement', unit: ''},
      {label: M.v('R', 'N') + ' = ' + M.v('mg') + ' cos α', value: fmt.fix(e.RN, 2), unit: 'N'},
      {label: M.v('R', 'T') + ' (algébrique)', value: fmt.fix(e.RT, 2), unit: 'N'},
      {label: '|' + M.v('R', 'T') + '| / ' + M.v('R', 'N') + ' = tan θ', value: fmt.fix(Math.abs(e.RT) / e.RN, 3), unit: ''}
    ];
    if (a.tab === 0) {
      L.push({label: 'Inclinaison α', value: fmt.fix(e.alpha / D, 1), unit: '°'});
      L.push({label: 'Angle de départ relevé', value: t >= res.td - 1e-9 ? fmt.fix(res.al / D, 1) : '—', unit: t >= res.td - 1e-9 ? '°' : '', hint: p.alim ? 'théorie : arctan ' + M.v('f', 's') : ''});
      L.push({label: 'Vitesse ' + M.v('v'), value: fmt.fix(e.v, 2), unit: 'm/s', hint: p.alim && t >= res.td ? 'au départ : ẍ = ' + fmt.fix(res.segs[1].a, 2) + ' m·s⁻²' : ''});
    } else {
      const arrete = res.arret && t >= res.arret.t - 1e-9;
      L.push({label: 'Position ' + M.v('x') + ' ; vitesse ' + M.v('v'), value: fmt.fix(e.x, 3) + ' m ; ' + fmt.fix(e.v, 2) + ' m/s', unit: ''});
      L.push({label: 'Accélération ' + M.v('ẍ'), value: p.valeurs ? fmt.fix(e.a, 2) : '—', unit: p.valeurs ? 'm·s⁻²' : '', hint: p.valeurs ? '' : 'masquée' });
      L.push({label: 'Premier arrêt', value: arrete ? fmt.fix(res.arret.t, 2) + ' s ; x = ' + fmt.fix(res.arret.x, 2) + ' m' : '—', unit: ''});
    }
    a.metrics(p.mesures ? L : []);
  }

  function legende(a) {
    const {C, p} = a, L = [{label: 'poids', c: C.F}, {label: 'réaction ' + M.vec('R') + (p.compos ? ' et composantes' : ''), c: C.E}, {label: 'vitesse', c: C.v}];
    if (a.tab !== 2) L.push({label: 'adhérence', c: cAdh(a)}, {label: 'glissement', c: cGl(a)});
    else L.push({label: 'cône φ' + '<sub>s</sub>', c: C.cInk}, {label: 'cône φ<sub>d</sub>', c: cGl(a), dash: true});
    if (a.tab === 1 && p.theorie) L.push({label: 'courbe complète prévue', c: C.ink2, dash: true});
    if (a.tab === 1 && gardee) L.push({label: 'courbe gardée', c: C.ink2, dash: true});
    a.legend(L);
  }

  function garder(a) {
    const res = traj(a), t = instant(a);
    if (t <= 0) { a.toast('Lancer la lecture avant de garder la courbe'); return; }
    gardee = {vit: courbe(res, t, q => q.v), pos: courbe(res, t, q => q.x)};
    a.toast('Courbes gardées en pointillés');
  }

  /* ---------- situations ---------- */
  const preset = (label, valeurs, titre) => ({label, valeurs, titre, lecture: true});
  const INCL = {fs: .5, fd: .3, m: 1, retour: false};
  const LANCE = {alpha: 20, fs: .5, fd: .3, v0: 2, m: 1, duree: 2, vmax: 2.5, xmax: 1};

  /* ---------- application ---------- */
  let ongletPrec = 0;
  AnimKit.app({
    code: 'MC2', partie: 'RougeGrenat', chapitre: 'MC2 Frottement solide',
    titre: 'Plan incliné et cône de frottement',
    titreFenetre: 'Plan incliné et cône de frottement · MC2 · MP',
    menuCommun: true, fichier: 'Plan_Incline',
    onglets: ['Angle limite', 'Bloc lancé', 'Cône de frottement'],
    panneaux: [
      {id: 'incl', titre: 'Planche inclinable', onglets: [0], ratioTel: .9},
      {id: 'ratio', titre: 'Rapport des composantes de la réaction', onglets: [0], ratioTel: .8},
      {id: 'scene', titre: 'Bloc sur le plan incliné', onglets: [1], ratioTel: .95},
      {id: 'vit', titre: 'Vitesse du bloc', onglets: [1], ratioTel: .6},
      {id: 'pos', titre: 'Position du bloc', onglets: [1], ratioTel: .6},
      {id: 'cone', titre: 'Réaction du plan et cônes de frottement', onglets: [2], ratioTel: 1}
    ],
    temps: true, pas: 1 / 50, vitesses: [.1, .25, .5, 1, 2, 4], vitesse: 1,
    curseur: {max: a => duree(a), get: a => instant(a), set: (a, v) => { a.t = v; }},
    peutLire: a => { if (a.t >= duree(a) - 1e-9) a.t = 0; return true; },
    step(a, dt) { a.t = Math.min(duree(a), a.t + dt); if (a.t >= duree(a) - 1e-9) a.play(false); },
    reset(a) { a.t = 0; },
    onglet(a, i) {                                                    // 2 ↔ 3 : même mouvement, même instant
      if (i === 0 || ongletPrec === 0) a.t = 0;
      ongletPrec = i;
    },
    change(a, id) {
      if (id === 'fs' && a.p.fd > a.p.fs) a.set('fd', a.p.fs, {silent: true});
      if (id === 'fd' && a.p.fd > a.p.fs) a.set('fs', a.p.fd, {silent: true});
      const phis = Math.floor(Math.atan(a.p.fs) / D * 2) / 2;         // α_r reste sous φ_s
      if ((id === 'fs' || id === 'fd' || id === 'ar') && a.p.ar > phis) a.set('ar', phis, {silent: true});
    },
    reglages: [
      {titre: 'Situations', onglets: [0], presets: [
        preset('Plan inclinable', {...INCL}),
        preset('Glissement entretenu', {...INCL, retour: true, ar: 22}),
        preset('Planche ramenée sous φ<sub>d</sub>', {...INCL, retour: true, ar: 12})
      ]},
      {titre: 'Situations', onglets: [1, 2], presets: [
        preset('Exemple du cours : arrêt', {...LANCE}),
        preset('Exemple du cours : redescente', {...LANCE, fs: .35}),
        preset('Posé sans vitesse', {...LANCE, alpha: 22, v0: 0, xmax: 3}),
        preset('Même plan, lancé vers le bas', {...LANCE, alpha: 22, v0: -.5, xmax: 3}),
        preset('Pente faible, lancé vers le bas', {...LANCE, alpha: 10, v0: -2, duree: 2.5, xmax: 2})
      ]},
      {titre: 'Plan et lancement', onglets: [1, 2], items: [
        {id: 'alpha', type: 'range', label: 'Inclinaison ' + M.v('α'), min: 0, max: 50, step: .5, dec: 1, value: 20, unit: '°', reinit: true},
        {id: 'v0', type: 'range', label: 'Vitesse initiale ' + M.v('v', '0') + ' (> 0 : vers le haut)', min: -3, max: 3, step: .05, dec: 2, value: 2, unit: 'm/s', reinit: true}
      ]},
      {titre: 'Retour de la planche', onglets: [0], items: [
        {id: 'retour', type: 'check', label: 'La ramener après le départ', value: false, reinit: true},
        {id: 'ar', type: 'range', label: 'Angle de retour ' + M.v('α', 'r') + ' ≤ φ<sub>s</sub>', min: 0, max: 45, step: .5, dec: 1, value: 22, unit: '°', reinit: true, si: a => !!a.p.retour}
      ]},
      {titre: 'Contact et bloc', items: [
        {id: 'fs', type: 'range', label: 'Coefficient statique ' + M.v('f', 's'), min: .05, max: 1, step: .01, dec: 2, value: .5, unit: '', reinit: true},
        {id: 'fd', type: 'range', label: 'Coefficient dynamique ' + M.v('f', 'd') + ' ≤ ' + M.v('f', 's'), min: .02, max: 1, step: .01, dec: 2, value: .3, unit: '', reinit: true},
        {id: 'm', type: 'range', label: 'Masse ' + M.v('m'), min: .5, max: 2, step: .05, dec: 2, value: 1, unit: 'kg'}
      ]},
      {titre: 'À faire apparaître', items: [
        {id: 'compos', type: 'check', label: 'Composantes de la réaction', value: false},
        {id: 'alim', type: 'check', label: 'Angle limite (calcul)', value: false, si: a => a.tab === 0},
        {id: 'theorie', type: 'check', label: 'Courbes v(t) et x(t) prévues', value: false, si: a => a.tab === 1},
        {id: 'valeurs', type: 'check', label: 'Arrêt et accélération (calcul)', value: false, si: a => a.tab === 1},
        {id: 'angles', type: 'check', label: 'Valeurs de φ_s et φ_d', value: false, si: a => a.tab === 2},
        {id: 'triangle', type: 'check', label: 'Montrer m a = m g + R', value: false, si: a => a.tab === 2},
        {id: 'mesures', type: 'check', label: 'Mesures', value: true}
      ]},
      {titre: 'Comparer deux réglages', onglets: [1], items: [
        {type: 'boutons', items: [
          {label: 'Garder la courbe', action: a => garder(a)},
          {label: 'Effacer', action: () => { gardee = null; }}
        ]}
      ]},
      {titre: 'Axes des graphes', onglets: [1, 2], items: [
        {id: 'duree', type: 'range', label: 'Durée', min: .5, max: 6, step: .5, dec: 1, value: 2, unit: 's', reinit: true},
        {id: 'vmax', type: 'range', label: 'Vitesse maximale', min: .5, max: 15, step: .5, dec: 1, value: 2.5, unit: 'm/s', si: a => a.tab === 1},
        {id: 'xmax', type: 'range', label: 'Position maximale', min: .5, max: 20, step: .5, dec: 1, value: 1, unit: 'm', si: a => a.tab === 1}
      ]}
    ],
    aide: {
      voit: '<ul><li><b>Angle limite.</b> La lecture incline lentement la planche (5° par seconde). Le graphe suit le rapport |<i>R</i><sub>T</sub>|/<i>R</i><sub>N</sub> : il vaut tan <i>α</i> tant que le bloc adhère, puis <i>f</i><sub>d</sub> dès qu’il glisse.</li><li><b>Bloc lancé.</b> Le plan est fixe ; le bloc est posé ou lancé avec la vitesse <i>v</i><sub>0</sub> (positive vers le haut). Le fond coloré des graphes marque les phases de glissement.</li><li><b>Cône de frottement.</b> Même mouvement et même instant que l’onglet précédent. Cône plein : demi-angle <i>φ</i><sub>s</sub> ; en pointillés : <i>φ</i><sub>d</sub>. En adhérence, la réaction est dans le premier ; en glissement, elle est sur le second, du côté opposé à la vitesse.</li></ul>',
      faire: '<ul><li>Prévoir l’angle de départ, puis lancer la lecture. Changer la masse : que devient cet angle ?</li><li>Ramener la planche à un angle plus faible après le départ : le bloc s’arrête-t-il ?</li><li>Dans l’exemple du cours, prévoir ce qui se passe après l’arrêt pour <i>f</i><sub>s</sub> = 0.50 puis 0.35, avant de lancer.</li><li>Sur le plan à 22°, comparer le bloc posé et le bloc lancé vers le bas.</li><li>Dans l’onglet 3, parcourir le mouvement avec le curseur et suivre la réaction au moment de l’arrêt.</li></ul>',
      modele: '<p>Lois de Coulomb, <i>g</i> = 9.81 m·s⁻², <i>R</i><sub>N</sub> = <i>mg</i> cos <i>α</i>. Adhérence possible tant que tan <i>α</i> ≤ <i>f</i><sub>s</sub> ; en glissement, <i>R</i><sub>T</sub> = −<i>f</i><sub>d</sub><i>R</i><sub>N</sub> sgn <i>v</i>. Chaque phase est un mouvement uniformément accéléré, résolu exactement. Le point d’application <i>I</i> de la réaction est placé sur la droite qui passe par le centre de masse : son moment y est nul, le bloc reste en translation.</p><p>Dans l’onglet 1, la planche est inclinée assez lentement pour que son mouvement propre soit négligé ; elle s’arrête au départ du bloc. Le retour à <i>α</i><sub>r</sub> se fait d’un coup, 0.3 s après le départ. Avec <i>f</i><sub>s</sub> = <i>f</i><sub>d</sub>, l’accélération est nulle à l’angle limite exactement : le bloc ne s’ébranle qu’au-delà.</p><p><b>Limites.</b> Coefficients indépendants de la vitesse et de la durée du repos ; solide en translation, sans basculement ni rotation ; pas de frottement de l’air.</p>',
      cours: 'MC2 MP : II.2 (équilibre sur un plan incliné, angle limite, cône de frottement), II.3 (bloc lancé vers le haut d’un plan incliné), expérience « Plan inclinable ».'
    },
    draw(a) {
      if (a.tab === 0) { scenePlanche(a); grapheRatio(a); }
      else if (a.tab === 1) { sceneLance(a); grapheTemps(a, 'vit'); grapheTemps(a, 'pos'); }
      else sceneCone(a);
      mesures(a); legende(a);
      a.clock('t = ' + a.fmt.fix(instant(a), 2) + ' s');
    }
  });
})();

</script>
</body>
</html>
