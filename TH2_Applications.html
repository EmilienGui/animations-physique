/* =====================================================================

       aide:{voit, faire, modele, cours},

     })
   Le kit fournit : app.p (paramètres), app.tab, app.t, app.C (couleurs), app.k (échelle projection),
   app.S (dessin SVG), app.fmt (nombres), app.metrics(), app.insight(), app.legend(), app.clock(), app.drag()…
   Réglage à échelle logarithmique : {id,type:'range',log:true,min,max,dec} (curseur en log10, champ numérique en valeur réelle).
   Disposition facultative  atelier:{saisie:'Mes mesures', detail:'Voir le calcul'} : app.zones.saisie / .resultat / .detail
   (nœuds DOM à remplir par l'animation) ; pas de colonne de réglages.
   ===================================================================== */
(function(){
'use strict';
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const MATH='"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif';
const MINUS='−';

/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  /** n chiffres significatifs, sans notation exponentielle */
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e<-3||e>=6){const m=x/10**e;return (+m.toFixed(n-1)).toFixed(n-1).replace('-',MINUS)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>'}
    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- icônes ---------------- */
const IC={
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
  sommaire:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
  help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h0"/></svg>',
  theme:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>',
  proj:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M12 16v4M8 20h8"/></svg>',
  fs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  cadrer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>',
  step:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5l9 7-9 7zM16 5h2.5v14H16z"/></svg>',
  reset:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>'
};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function el(tag,attrs={},html){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs))if(v!==undefined&&v!==null&&v!==false)e.setAttribute(k,v===true?'':v);if(html!==undefined)e.innerHTML=html;return e}

function interrupteur(label,id){
  const conteneur=el('label',{class:'ak-chk'});
  conteneur.append(
    el('input',{type:'checkbox',role:'switch',id}),
    el('span',{class:'ak-switch-track','aria-hidden':'true'}),
    el('span',{},label)
  );

/* ---------------- mathématiques en HTML ---------------- */
const M={
  v:(s,sub,sup)=>`<span class="m">${s}</span>${sub!==undefined?`<sub>${sub}</sub>`:''}${sup!==undefined?`<sup>${sup}</sup>`:''}`,
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt"><span class="sym">√</span><span class="rad">${x}</span></span>`,
  vec:s=>`<span class="vec">${s}</span>`
};

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}
      return s;
    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){
      let d='',pen=false;
      for(const[x,y]of pts){if(!isFinite(y)||!isFinite(x)){pen=false;continue}
        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}
      return`<g clip-path="url(#${G.clip||''})">`+S.path(d,o)+'</g>';
    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}
  };
  return S;
}

/* ===================================================================== */
function app(cfg){
  const A={cfg,p:{},tab:0,t:0,running:false,speed:1,k:1,narrow:false,C:{},fmt,M,panels:{},_dirty:false};
  A.S=makeS(A);
  const root=document.documentElement;
  root.dataset.theme='dark';
  if(cfg.partie)root.style.setProperty('--chap',`var(--${cfg.partie})`);
  document.title=cfg.titreFenetre||`${cfg.titre} · ${cfg.code} · MPSI`;

  /* ---------- structure ---------- */
  const ak=el('div',{class:cfg.menuCommun?'ak ak-menu-commun':'ak',id:'ak'});
  const top=el('header',{class:'ak-top'});
  top.innerHTML=`<span class="ak-badge">${cfg.code}</span><div class="ak-titles"><h1 class="ak-title">${cfg.titre}</h1></div>
  <nav class="ak-tools" aria-label="Outils">
   <button class="ib ak-btn-settings" data-act="settings" title="Réglages">${IC.settings}<span class="ak-lbl">Réglages</span></button>
   <button class="ib" data-act="help" title="Aide (H)">${IC.help}<span class="ak-lbl">Aide</span></button>
   <button class="ib" data-act="theme" title="Thème clair / sombre (T)">${IC.theme}<span class="ak-lbl">Thème</span></button>
   <button class="ib" data-act="image" title="Enregistrer l'image (I)">${IC.image}<span class="ak-lbl">Image</span></button>
   <button class="ib" data-act="proj" title="Mode projection (P)">${IC.proj}<span class="ak-lbl">Projection</span></button>
   <button class="ib" data-act="fs" title="Plein écran (F)">${IC.fs}</button>
  </nav>`;
  const nav=$('.ak-tools',top);
  const themeButton=$('[data-act=theme]',nav);
  const projButton=$('[data-act=proj]',nav);
  const fullButton=$('[data-act=fs]',nav);
  if(cfg.menuCommun){
    nav.insertBefore($('[data-act=settings]',nav),fullButton);
    $('[data-act=image]',nav).title='Enregistrer une image PNG (I)';
  }
  function syncMenu(){
    if(!cfg.menuCommun)return;
    const dark=root.dataset.theme==='dark', projected=ak.classList.contains('is-proj');
    const full=Boolean(document.fullscreenElement);
    themeButton.title=dark?'Passer au thème clair (T)':'Passer au thème sombre (T)';
    $('.ak-lbl',projButton).textContent=projected?'Réglages':'Projection';
    projButton.title=projected?'Rétablir les réglages (P)':'Agrandir la scène et masquer les réglages (P)';

    fullButton.setAttribute('aria-label',fullscreenLabel);

  }

    if(k===' '&&!tr.hidden){e.preventDefault();acts.play()}
    else if(k==='arrowright'&&!tr.hidden){e.preventDefault();acts.step()}
    else if(k==='r'&&!tr.hidden)acts.reset();
    else if(k==='h'||k==='?')acts.help();else if(k==='p')acts.proj();else if(k==='f')acts.fs();else if(k==='t')acts.theme();else if(k==='i')acts.image();
    else if(k==='+'||k==='='||k==='-'||k==='0'){const P=(A._hover&&!A._hover.el.hidden&&A._hover.vue)?A._hover:Object.values(A.panels).find(q=>q.vue&&!q.el.hidden);if(P){e.preventDefault();if(k==='0')A.cadrer(P);else A.zoomer(P,k==='-'?.8:1.25)}}
    else if(k==='escape'){ak.classList.remove('drawer-open');A.render()}
    else if(/^[1-9]$/.test(k))A.setTab(+k-1);
  });

  /* ---------- vue : zoom, cadrage, déplacement ---------- */
  const deplacable=P=>P.vue==='svg'||P.vue==='graphe';
  function zoomed(P){
    if(P.vue==='interne')return Math.abs(P.zoom-1)>1e-6;
    if(!deplacable(P))return false;
    const seuil=P.vue==='graphe'?1e-6:.5;
    return Math.abs(P.vz-1)>1e-6||Math.abs(P.vx)>seuil||Math.abs(P.vy)>seuil;
  }
  const markZoom=P=>{if(P.tools)P.tools.classList.toggle('is-zoomed',zoomed(P))};
  const graphAt=(P,x,y)=>P.graphs.find(g=>x>=g.x0&&x<=g.x0+g.w&&y>=g.y0&&y<=g.y0+g.h);
  function resetView(P){P.vz=1;P.vx=P.vy=0;P.zoom=1;P.panX=P.panY=0;markZoom(P)}
  /** zoom d'un facteur f autour du point (px, py) de l'écran du panneau (centre par défaut) */
  A.zoomer=(P,f,px,py)=>{if(typeof P==='string')P=A.panels[P];if(!P||!P.vue)return;
    if(P.vue==='interne')P.zoom=Math.max(.4,Math.min(5,P.zoom*f));
    else{
      if(P.vue==='graphe'){
        const graph=graphAt(P,px,py);
        px=graph?(px-graph.x0)/graph.w:.5;
        py=graph?(py-graph.y0)/graph.h:.5;
      }else{px=px??P.w/2;py=py??P.h/2}
      const z=Math.max(.5,Math.min(8,P.vz*f)), delta=1/P.vz-1/z;
      P.vx+=px*delta;P.vy+=py*delta;P.vz=z;
    }
    markZoom(P);A.render()};
  A.deplacer=(P,dx,dy,px,py)=>{
    if(!deplacable(P))return;
    if(P.vue==='graphe'){const g=graphAt(P,px,py)||P.graphs[0];dx/=g.w;dy/=g.h}
    P.vx-=dx/P.vz;P.vy-=dy/P.vz;markZoom(P);A.render()
  };
  A.cadrer=P=>{if(typeof P==='string')P=A.panels[P];if(!P)return;resetView(P);A.render()};
  A.cadrerTout=()=>{for(const P of Object.values(A.panels))A.cadrer(P)};
  /* ---------- glisser dans un panneau ----------
     Les coordonnées transmises aux animations sont celles de leur dessin (vue zoomée comprise).
     Maj + glisser, bouton du milieu ou deux doigts : déplacer la vue ; molette ou pincement : zoomer.
     Glisser hors de tout objet manipulable déplace aussi la vue quand elle est zoomée. */
  function wire(P){const N=P.node,pts=new Map();let mode=null,h=null,last=null,pin=null;
    const scr=e=>{const r=N.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    const toV=s=>P.vue==='svg'?[P.vx+s[0]/P.vz,P.vy+s[1]/P.vz]:s;
    const two=()=>{const[a,b]=[...pts.values()];return{d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,c:[(a[0]+b[0])/2,(a[1]+b[1])/2]}};
    N.addEventListener('pointerdown',e=>{
      const s=scr(e);A._hover=P;pts.set(e.pointerId,s);
      if(pts.size===2&&P.vue){if(mode==='drag'&&h&&h.end)h.end(e);mode='pinch';h=null;pin=two();N.setPointerCapture(e.pointerId);e.preventDefault();return}
      if(pts.size>1)return;
      const[x,y]=toV(s);
      if(deplacable(P)&&(e.shiftKey||e.button===1))mode='pan';
      else{h=P._drags.find(d=>!d.hit||d.hit(x,y,e))||null;
        if(h){mode='drag';if(h.start)h.start(x,y,e)}
        else if(deplacable(P)&&zoomed(P))mode='pan';
        else{mode=null;return}}
      last=s;N.setPointerCapture(e.pointerId);e.preventDefault();A.render()});
    N.addEventListener('pointermove',e=>{const s=scr(e);
      if(!pts.has(e.pointerId)){if(e.pointerType==='mouse'){const[x,y]=toV(s);N.style.cursor=P._drags.some(d=>d.hit&&d.hit(x,y,e))?'grab':(deplacable(P)&&(e.shiftKey||zoomed(P)))?'move':''}return}
      pts.set(e.pointerId,s);
      if(mode==='pinch'&&pts.size>=2){const q=two();A.zoomer(P,q.d/pin.d,q.c[0],q.c[1]);A.deplacer(P,q.c[0]-pin.c[0],q.c[1]-pin.c[1],q.c[0],q.c[1]);pin=q;return}
      if(mode==='pan'){A.deplacer(P,s[0]-last[0],s[1]-last[1],last[0],last[1]);last=s;return}
      if(mode==='drag'&&h){const[x,y]=toV(s);h.move(x,y,e);A.render()}});
    const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
      if(mode==='drag'&&h&&h.end)h.end(e);
      if(pts.size===0){mode=null;h=null}else if(mode==='pinch'){mode='pan';last=[...pts.values()][0]}
      A.render()};
    N.addEventListener('pointerup',end);N.addEventListener('pointercancel',end);
    if(P.vue){
      N.addEventListener('wheel',e=>{if(A.narrow&&!e.ctrlKey)return;e.preventDefault();const s=scr(e);A.zoomer(P,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),s[0],s[1])},{passive:false});
      N.addEventListener('dblclick',e=>{const[x,y]=toV(scr(e));if(!P._drags.some(d=>d.hit&&d.hit(x,y,e))&&zoomed(P))A.cadrer(P)});
      N.addEventListener('pointerenter',()=>{A._hover=P});
    }
  }
  for(const P of Object.values(A.panels))wire(P);
  A.drag=(id,h)=>{A.panels[id]._drags.push(h)};

  /* ---------- export image (toujours en thème clair) ---------- */
  A.exportImage=async()=>{
    const was=root.dataset.theme; root.dataset.theme='light'; readColors(); A.renderNow();
    const vis=Object.values(A.panels).filter(P=>!P.el.hidden), base=pwrap.getBoundingClientRect(), sc=2;
    const cv=document.createElement('canvas'); cv.width=Math.round(base.width*sc); cv.height=Math.round(base.height*sc);
    const ctx=cv.getContext('2d'); ctx.fillStyle=A.C.card; ctx.fillRect(0,0,cv.width,cv.height);
    const jobs=vis.map(P=>new Promise(res=>{const r=P.node.getBoundingClientRect(), x=(r.left-base.left)*sc, y=(r.top-base.top)*sc;
      if(P.type==='canvas'){ctx.drawImage(P.node,x,y,r.width*sc,r.height*sc);res();return}
      const clone=P.node.cloneNode(true); clone.setAttribute('width',r.width); clone.setAttribute('height',r.height);
      const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
      const im=new Image(); im.onload=()=>{ctx.drawImage(im,x,y,r.width*sc,r.height*sc);res()}; im.onerror=()=>res(); im.src=src;}));
    await Promise.all(jobs);
    root.dataset.theme=was; readColors(); A.renderNow();
    const a=document.createElement('a'); const tabName=cfg.onglets&&cfg.onglets.length>1?'_'+(A.tab+1):'';
    a.download=`${cfg.code}_${(cfg.fichier||cfg.titre).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_')}${tabName}.png`;
    a.href=cv.toDataURL('image/png'); a.click(); A.toast('Image enregistrée (thème clair)');
  };

  /* ---------- aide ---------- */
  function buildHelp(){
    const h=cfg.aide||{}, sec=(t,c)=>c?`<h4>${t}</h4>${/^\s*</.test(c)?c:`<p>${c}</p>`}`:'';
    dlg.innerHTML=`<header><h3>Aide · ${cfg.titre}</h3><button class="mini" data-close>Fermer ✕</button></header><div class="db">
    ${cfg.sousTitre?`<p class="ak-dlg-sub">${cfg.sousTitre}</p>`:''}${sec('Ce qu\'on voit',h.voit)}${sec('Ce qu\'on peut faire',h.faire)}${sec('Modèle et hypothèses',h.modele)}${sec('Lien avec le cours',h.cours)}${sec('Pour aller plus loin',h.plus)}
    <h4>Raccourcis</h4><p>${cfg.temps?'<kbd>Espace</kbd> lecture / pause · <kbd>→</kbd> pas à pas · <kbd>R</kbd> recommencer · ':''}${tabs?`<kbd>1</kbd>–<kbd>${cfg.onglets.length}</kbd> onglets · `:''}<kbd>P</kbd> projection · <kbd>F</kbd> plein écran · <kbd>T</kbd> thème · <kbd>I</kbd> image · <kbd>H</kbd> aide${h.touches?' · '+h.touches:''}</p>
    <p>Vue : molette, pincement ou <kbd>+</kbd> <kbd>−</kbd> pour zoomer · <kbd>Maj</kbd> + glisser, deux doigts, ou glisser une vue zoomée pour la déplacer · « Cadrer », <kbd>0</kbd> ou double clic : vue initiale.</p>
    ${h.credits?`<h4>Crédits</h4><p>${h.credits}</p>`:''}</div>`;
    dlg.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===dlg)dlg.close()});
  }

  /* ---------- démarrage ---------- */
  buildSettings(); buildHelp(); readColors();
  if(cfg.init)cfg.init(A);
  refreshSettings(); A.reset();
  new ResizeObserver(()=>A.render()).observe(ak);
  return A;
}

<script>
'use strict';

const TH2 = (() => {
  const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));
  const points = (a, b, n, f) => Array.from({length: n + 1}, (_, i) => {
    const x = a + (b - a) * i / n;
    return [x, f(x)];
  });
  const range = (id, label, min, max, step, value, unit = '', options = {}) =>
    ({id, label, min, max, step, value, unit, ...options});
  const select = (id, label, value, options, extra = {}) =>
    ({id, label, value, options, type: 'select', ...extra});

  function time(a, seconds) {
    if (seconds === 0) return '0 s';
    const [scale, unit] = seconds < 120 ? [1, 's']
      : seconds < 7200 ? [60, 'min'] : seconds < 172800 ? [3600, 'h'] : [86400, 'j'];
    return a.fmt.sig(seconds / scale, 3) + ' ' + unit;
  }

  function limits(min, max) {
    const pad = Math.max(.8, (max - min) * .085);
    return [min - pad, max + pad];
  }

  const colorStops = {
    viridis: ['#471365', '#472d7b', '#404588', '#375a8c', '#2e6e8e', '#27808e', '#20928c', '#21a585', '#34b679', '#58c765', '#86d549', '#b8de29', '#ece51b'],
    inferno: ['#2b0b57', '#490b6a', '#64156e', '#7d1e6d', '#982766', '#b3325a', '#cb4149', '#e05536', '#ef6e21', '#f98b0b', '#fca80d', '#f9c932', '#f2ea69'],
    cividis: ['#003070', '#263d6e', '#3d4a6c', '#50576c', '#61656f', '#727274', '#828079', '#948e77', '#a79d73', '#bbad6d', '#cfbd62', '#e4ce53', '#f9e03a'],
    blueAmber: ['#174b83', '#3b78a2', '#80adc2', '#c0d5d9', '#eee5cc', '#edcb91', '#d7954f', '#b26324', '#843c1c']
  };

  const palettes = Object.fromEntries(Object.entries(colorStops).map(([id, colors]) =>
    [id, colors.map(color => [1, 3, 5].map(offset => parseInt(color.slice(offset, offset + 2), 16)))]));
  const paletteControl = select('palette', 'Palette de température', 'viridis', [
    ['viridis', 'Viridis · indigo, vert, jaune'],
    ['inferno', 'Inferno · pourpre, orange, ivoire'],
    ['cividis', 'Cividis · bleu ardoise, or'],
    ['blueAmber', 'Bleu–ambre']
  ]);

  function rgbTemperature(position, palette = 'viridis') {
    const colors = palettes[palette];
    const t = clamp(position) * (colors.length - 1);
    const i = Math.min(Math.floor(t), colors.length - 2);
    return colors[i].map((v, j) => Math.round(v + (colors[i + 1][j] - v) * (t - i)));
  }

  function temperatureColor(a, value, min, max) {
    const ratio = max > min ? (value - min) / (max - min) : .5;
    return 'rgb(' + rgbTemperature(ratio, a.p.palette).join(',') + ')';
  }

  function thermalStrip(a, id, x, y, width, height, sample, min, max, segments = 64) {
    let stops = '';
    for (let i = 0; i <= segments; i++) {
      const u = i / segments;
      stops += '<stop offset="' + u + '" stop-color="' + temperatureColor(a, sample(u), min, max) + '"/>';
    }
    return '<defs><linearGradient id="' + id + '">' + stops + '</linearGradient></defs>' +
      a.S.rect(x, y, width, height, {c: a.C.rule, fill: 'url(#' + id + ')'});
  }

  function exportNumber(a, value) {
    const html = a.fmt.sig(value, 3);
    return html.replace(/<sup>(.*?)<\/sup>/g, (_, digits) =>
      [...digits].map(digit => '⁰¹²³⁴⁵⁶⁷⁸⁹⁻'['0123456789−'.indexOf(digit)]).join(''));
  }

  function readings(a) {
    a.root.classList.add('th2-animation');
    const row = document.createElement('dl');
    row.className = 'th2-readings';
    row.setAttribute('aria-label', 'Grandeurs affichées');
    a.root.querySelector('.ak-legend').before(row);
    let last;
    return values => {
      const html = values.map(([label, value]) => '<div><dt>' + label + '</dt><dd>' + value + '</dd></div>').join('');
      if (html !== last) row.innerHTML = last = html;
    };
  }

  function graph(a, id, xMin, xMax, yMin, yMax, xLab, yLab, options = {}) {
    const panel = a.panels[id];
    return a.S.graph({x: 7, y: 8 * a.k, w: panel.w - 20, h: panel.h - 13 * a.k,
      xmin: xMin, xmax: xMax, ymin: yMin, ymax: yMax, xlab: xLab, ylab: yLab, ...options});
  }

  function dragHorizontal(a, panel, handle, onMove) {
    a.drag(panel, {
      hit: (x, y, event) => event.target.getAttribute('data-hit') === handle,
      move: onMove
    });
  }

  return {clamp, points, range, select, time, limits, paletteControl, rgbTemperature, temperatureColor, thermalStrip, exportNumber, readings, graph, dragHorizontal};
})();

'use strict';

const TH2Stationnaire = (() => {
  function geometry({g, inner, L, section, conductivity, pV, tLeft, tRight, full}) {
    const power = g === 'plan' ? 0 : g === 'cylinder' ? 1 : 2;
    const solid = power > 0 && full;
    const a = !power || solid ? 0 : inner;
    const b = a + L;
    const factor = power === 0 ? section : power === 1 ? 2 * Math.PI * section : 4 * Math.PI;
    const area = r => factor * (power === 0 ? 1 : r ** power);
    const volume = r => factor * (r ** (power + 1) - a ** (power + 1)) / (power + 1);
    // primitive de 1 / r^m, avec origine en a
    const integral = r => {
      if (power === 0) return r - a;
      if (power === 1) return Math.log(r / a);
      return 1 / a - 1 / r;
    };
    const productionOffset = pV * a ** (power + 1) / (power + 1);
    const rise = r => pV * (r ** 2 - a ** 2) / (2 * (power + 1));
    const fluxBase = solid ? 0 : factor * ((conductivity * (tLeft - tRight) - rise(b)) / integral(b) + productionOffset);
    const flux = r => fluxBase + pV * volume(r);
    const density = r => r === 0 && solid ? 0 : flux(r) / area(r);
    const temp = r => solid ? tRight + pV * (b ** 2 - r ** 2) / (2 * conductivity * (power + 1))
      : tLeft - ((fluxBase / factor - productionOffset) * integral(r) + rise(r)) / conductivity;
    return {a, b, power, solid, area, volume, flux, density, temp, slope: r => -density(r) / conductivity};
  }

  function branch(layers, area, hot, cold, hLeft = 0, hRight = 0) {
    const resistances = layers.map(layer => layer.length / (layer.conductivity * area));
    const left = hLeft ? 1 / (hLeft * area) : 0;
    const right = hRight ? 1 / (hRight * area) : 0;
    const resistance = resistances.reduce((sum, r) => sum + r, left + right);
    const flux = (hot - cold) / resistance;
    const parts = [];
    let x = 0;
    let temperature = hot - left * flux;
    for (let i = 0; i < layers.length; i++) {
      const from = temperature;
      temperature -= resistances[i] * flux;
      const end = x + layers[i].length;
      parts.push({x, end, from, to: temperature, resistance: resistances[i]});
      x = end;
    }
    const sample = x => {
      const layer = parts.find(part => x < part.end - 1e-9) || parts[parts.length - 1];
      const f = TH2.clamp((x - layer.x) / (layer.end - layer.x));
      return {temperature: layer.from + f * (layer.to - layer.from), layer};
    };
    return {parts, length: x, left, right, hot, cold, resistance, flux, area, sample};
  }

  function jacket({radius, thickness, conductivity, h, hot, air}) {
    const outer = radius + thickness;
    const conduction = Math.log1p(thickness / radius) / (2 * Math.PI * conductivity);
    const exchange = 1 / (h * 2 * Math.PI * outer);
    const flux = (hot - air) / (conduction + exchange);
    return {outer, conduction, exchange, flux, surface: air + flux * exchange, critical: conductivity / h};
  }

  return {geometry, branch, jacket};
})();

'use strict';

const TH2Applications = (() => {
  const ice = {lambda: 2.2, rho: 917, latent: 330e3};
  const day = 86400;

  function lake(air, h) {
    // e² + 2ℓe = 2At, avec ℓ = λ/h, nul pour une température imposée.
    const ell = ice.lambda / h;
    const A = ice.lambda * -air / (ice.rho * ice.latent);
    const timeFor = e => (e ** 2 + 2 * ell * e) / (2 * A);
    function state(t) {
      const q = 2 * A * t;
      const e = q === 0 ? 0 : q / (Math.sqrt(ell ** 2 + q) + ell);
      const j = ice.lambda * -air / (e + ell);
      const surface = ell === 0 ? air : air + j / h;
      const exponent = ell === 0 ? .5 : (e + 2 * ell) / (2 * (e + ell));
      return {e, j, surface, exponent};
    }
    return {timeFor, state};
  }

  function sphere(radius, lambda, production, h, fluid) {
    const surfaceRise = production * radius / (3 * h);
    const coreRise = production * radius ** 2 / (6 * lambda);
    const surface = fluid + surfaceRise;
    const core = surface + coreRise;
    const field = TH2Stationnaire.geometry({g: 'sphere', L: radius, full: true,
      conductivity: lambda, pV: production, tRight: surface});
    return {surfaceRise, coreRise, surface, core, total: field.flux(radius), field};
  }

  const skin = {lambda: .5, capacity: 1e3 * 3.5e3};
  const wood = {lambda: .15, capacity: 7e2 * 1.7e3};
  const steel = {lambda: 50, capacity: 7.8e3 * 4.7e2};
  const effusivity = material => Math.sqrt(material.lambda * material.capacity);
  const diffusivity = material => material.lambda / material.capacity;

  // Approximation de erfc pour u positif, type Abramowitz et Stegun 7.1.26.
  function erfc(u) {
    if (u < .1) {
      const u2 = u * u;
      return 1 - 2 / Math.sqrt(Math.PI) * u * (1 - u2 / 3 + u2 ** 2 / 10 - u2 ** 3 / 42);
    }
    const v = 1 / (1 + .3275911 * u);
    return v * (.254829592 + v * (-.284496736 + v * (1.421413741 +
      v * (-1.453152027 + v * 1.061405429)))) * Math.exp(-u * u);
  }

  function contact(skinTemperature, objectTemperature, material) {
    const E1 = effusivity(skin), E2 = effusivity(material);
    const D1 = diffusivity(skin), D2 = diffusivity(material);
    const interfaceTemperature = (E1 * skinTemperature + E2 * objectTemperature) / (E1 + E2);
    const scale = E1 * (skinTemperature - interfaceTemperature) / Math.sqrt(Math.PI);
    function temperature(x, t) {
      if (x === 0) return interfaceTemperature;
      const initial = x < 0 ? skinTemperature : objectTemperature;
      if (t === 0) return initial;
      const D = x < 0 ? D1 : D2;
      return initial + (interfaceTemperature - initial) * erfc(Math.abs(x) / (2 * Math.sqrt(D * t)));
    }
    return {temperature, interfaceTemperature, flux: t => scale / Math.sqrt(t)};
  }
  return {day, lake, sphere, contact, skin, wood, steel, diffusivity};
})();

// @titre Applications des transferts thermiques · TH2 · MP
// @sortie ../TH2_Applications/TH2_Applications.html
// @inclure TH2_Commun.js

// @description Gel d’un lac, sphère de combustible et effusivité au contact du bois et de l’acier.
'use strict';

(() => {
  const {clamp, points, range, select, paletteControl, time, limits, graph, readings,
    temperatureColor, thermalStrip, exportNumber, dragHorizontal} = TH2;
  const {day, lake, sphere, contact, skin, wood, steel, diffusivity} = TH2Applications;
  const number = (a, value, unit = '') => exportNumber(a, value) + (unit ? ' ' + unit : '');
  const label = (a, x, y, value, options = {}) => a.S.text(x, y, value, {size: 13, ...options});
  const duration = a => a.tab === 0 ? a.p.lakeDays * day : a.p.contactTime;
  const lakeDefaults = {lakeAir: -10, lakeH: 10, lakeDays: 7, lakeTarget: 10};
  const sphereDefaults = {radius: 10, sphereLambda: 4, production: 30, sphereH: 1000, sphereFluid: 80,
    sphereProbe: 60, compareRadius: false};
  const contactDefaults = {skinTemp: 33, objectTemp: 20, contactTime: 10};
  let display, sphereGraph, elapsedGraph;
  const seek = (a, t) => {a.t = clamp(t, 0, duration(a));};

  function curve(a, coords, G, color, dashed = false) {
    return a.S.curve(coords, G, {c: color, w: dashed ? 2.15 : 2.75, dash: dashed ? '7 5' : undefined});
  }

  function marker(a, G, x, y, color, radius = 4.2, hit) {
    return a.S.circle(G.X(x), G.Y(y), radius * a.k, {fill: color, c: a.C.card, w: 1.45, hit});
  }

  function splitBar(a, x, y, w, fraction, color1, color2) {
    const {S, k} = a;
    return S.rect(x, y, w * fraction, 9 * k, {fill: color1, rx: 1.5}) +
      S.rect(x + w * fraction, y, w * (1 - fraction), 9 * k, {fill: color2, rx: 1.5});
  }

  AnimKit.app({
    code: 'TH2', partie: 'OrangeBrule', titre: 'Applications des transferts thermiques',
    titreFenetre: 'Applications des transferts thermiques · TH2 · MP',
    menuCommun: true, fichier: 'Applications',
    onglets: ['Gel d’un lac', 'Sphère de combustible', 'Bois et métal au toucher'],
    panneaux: [
      {id: 'lake', titre: 'Coupe et profil dans la glace', poids: 1, ratioTel: .83, onglets: [0]},
      {id: 'iceGrowth', titre: 'Épaisseur au cours du temps', poids: 1.13, ratioTel: .83, onglets: [0]},
      {id: 'sphere', titre: 'Coupe et bilan thermique', poids: 1, ratioTel: .89, onglets: [1]},
      {id: 'sphereProfile', titre: 'Profil radial de température', poids: 1.13, ratioTel: .81, onglets: [1]},
      {id: 'contact', titre: 'Deux contacts simultanés', poids: 1, ratioTel: .78, onglets: [2]},
      {id: 'contactProfile', titre: 'Profils au même instant', poids: 1.13, ratioTel: .83, onglets: [2]}
    ],
    temps: a => a.tab !== 1, pas: .25,
    curseur: {max: duration, get: a => a.t, set: seek},
    peutLire(a) {
      if (a.t >= duration(a)) a.t = 0;
      return true;
    },
    step(a, dt) {
      seek(a, a.t + dt * duration(a) / 12);
      if (a.t >= duration(a)) a.play(false);
    },
    onglet(a) {a.reset();},
    touches: {arrowleft(a) {
      if (a.tab === 1) return;
      a.play(false);
      seek(a, a.t - duration(a) / 48);
    }},
    reglages: [
      {titre: 'Situations', onglets: [0], presets: [
        {label: 'Données du TD', valeurs: lakeDefaults},
        {label: 'Air peu brassé', valeurs: {...lakeDefaults, lakeH: 5}},
        {label: 'Air brassé', valeurs: {...lakeDefaults, lakeH: 40}},
        {label: 'Croissance sur 30 jours', valeurs: {...lakeDefaults, lakeDays: 30}}
      ]},
      {titre: 'Gel et observation', onglets: [0], items: [
        range('lakeAir', 'Température de l’air', -40, -1, 1, -10, '°C'),
        range('lakeH', 'Coefficient d’échange h', 2, 120, 1, 10, 'W·m⁻²·K⁻¹', {log: true}),
        select('lakeDays', 'Durée observée', 7, [[1, '1 jour'], [3, '3 jours'], [7, '7 jours'],
          [14, '14 jours'], [30, '30 jours'], [60, '60 jours']], {reinit: true}),
        range('lakeTarget', 'Épaisseur cible', 2, 35, .5, 10, 'cm')
      ]},
      {titre: 'Situations', onglets: [1], presets: [
        {label: 'Sphère de référence', valeurs: sphereDefaults},
        {label: 'Rayon doublé', valeurs: {...sphereDefaults, radius: 20, compareRadius: true}},
        {label: 'Refroidissement renforcé', valeurs: {...sphereDefaults, sphereH: 4000}}
      ]},
      {titre: 'Sphère et refroidissement', onglets: [1], items: [
        range('radius', 'Rayon R', 2, 30, .5, 10, 'mm'),
        range('sphereLambda', 'Conductivité λ', 2, 30, .1, 4, 'W·m⁻¹·K⁻¹'),
        range('production', 'Puissance volumique pᵥ', 1, 80, 1, 30, 'MW·m⁻³'),
        range('sphereH', 'Coefficient d’échange h', 200, 12000, 10, 1000, 'W·m⁻²·K⁻¹', {log: true}),
        range('sphereFluid', 'Température du fluide', 10, 150, 1, 80, '°C'),
        range('sphereProbe', 'Position de la sonde', 0, 100, 1, 60, '% de R'),
        {id: 'compareRadius', type: 'check', label: 'Comparer à une sphère de rayon R/2', value: false}
      ]},
      {titre: 'Situations', onglets: [2], presets: [
        {label: 'Données du TD', valeurs: contactDefaults},
        {label: 'Objets à 10 °C', valeurs: {...contactDefaults, objectTemp: 10}},
        {label: 'Objets plus chauds que la peau', valeurs: {...contactDefaults, objectTemp: 45}}
      ]},
      {titre: 'Contact', onglets: [2], items: [
        range('skinTemp', 'Température initiale de la peau', 25, 38, .5, 33, '°C', {reinit: true}),
        range('objectTemp', 'Température initiale des deux objets', 5, 50, .5, 20, '°C', {reinit: true}),
        select('contactTime', 'Durée observée', 10, [[2, '2 s'], [5, '5 s'], [10, '10 s'], [20, '20 s']], {reinit: true})
      ]},
      {titre: 'Affichage', items: [paletteControl]}
    ],
    aide: {
      voit: '<ul><li><b>Gel d’un lac.</b> La coupe suit le modèle avec échange air–glace. Le graphe compare les deux épaisseurs. Le trait horizontal de la coupe situe l’autre front au même instant.</li><li><b>Sphère de combustible.</b> La sonde donne la température et la puissance traversant une sphère de rayon r. La barre sous la coupe répartit l’écart entre le cœur et le fluide.</li><li><b>Bois et métal au toucher.</b> Les deux contacts commencent ensemble. Chaque courbe est continue en x = 0 et s’étale de part et d’autre de l’interface.</li></ul>',
      faire: '<p>Pour le lac, déplacer le curseur ou cliquer dans le graphe, puis comparer les durées pour l’épaisseur cible. Faire varier h pour séparer le rôle de la glace et celui de l’échange avec l’air. La pente de log e en fonction de log t vaut 1 pour une croissance linéaire et 0.5 pour une loi en racine carrée.</p><p>Pour la sphère, choisir « Rayon doublé » pour repérer les effets de R sur les deux écarts de température. Augmenter h à rayon fixé.</p><p>Pour les contacts, comparer les températures de contact et le flux à la même date. La coupe dilate la peau et les matériaux différemment. Le graphe donne les distances en millimètres.</p>',
      modele: '<p><b>Lac.</b> Deux modèles quasi stationnaires du TD. L’eau est à 0 °C et l’air à température constante. L’énergie latente libérée par la solidification traverse la glace. Dans le modèle avec échange, e est d’abord proportionnel à t pour e ≪ λ/h, puis tend vers une loi en √t pour e ≫ λ/h. La validité du profil quasi stationnaire se dégrade si l’écart de température devient grand.</p><p><b>Sphère.</b> Solide homogène, source volumique constante et échange de Newton, en régime stationnaire. Les valeurs sont illustratives. T(0) − T<sub>s</sub> = p<sub>v</sub>R²/(6λ) et T<sub>s</sub> − T<sub>f</sub> = p<sub>v</sub>R/(3h). Le modèle suppose les propriétés constantes et le solide intact.</p><p><b>Contact.</b> Deux milieux semi-infinis initialement uniformes, avec un contact parfait. T<sub>c</sub> est la moyenne des températures initiales pondérée par les effusivités. Les flux affichés sont orientés de la peau vers l’objet. Leur limite en t = 0⁺ est singulière pour des températures initiales différentes.</p>',
      cours: 'TH2 MP, bilan sphérique, approximation quasi stationnaire, conditions aux limites et loi de Newton. TD « Gel d’un lac », « Température au centre de la Terre » et « Choc thermique et effusivité ».'
    },
    init(a) {
      display = readings(a);
      a.root.classList.add('th2-applications');
      const top = a.root.querySelector('.ak-top');
      const settings = top.querySelector('[data-act="settings"]');
      // Accès au volet sur téléphone, à côté du titre.
      settings.setAttribute('aria-label', 'Réglages');
      top.querySelector('.ak-tools').before(settings);
      dragHorizontal(a, 'sphereProfile', 'probe', x =>
        a.set('sphereProbe', Math.round(clamp(sphereGraph.xv(x)) * 100)));
      const seekGraph = x => {a.play(false); seek(a, elapsedGraph.xv(x) * day);};
      a.drag('iceGrowth', {
        hit: (x, y) => elapsedGraph && x >= elapsedGraph.x0 && x <= elapsedGraph.x0 + elapsedGraph.w &&
          y >= elapsedGraph.y0 && y <= elapsedGraph.y0 + elapsedGraph.h,
        start: seekGraph, move: seekGraph
      });
    },
    draw(a) {
      if (a.tab === 0) drawLake(a);
      else if (a.tab === 1) drawSphere(a);
      else drawContact(a);
      a.clock('t = ' + time(a, a.t));
    }
  });

  function drawLake(a) {
    const {p, S, C, k} = a;
    const imposed = lake(p.lakeAir, Infinity);
    const exchanged = lake(p.lakeAir, p.lakeH);
    const ideal = imposed.state(a.t), actual = exchanged.state(a.t);
    const target = p.lakeTarget / 100;
    const imposedTime = imposed.timeFor(target), exchangedTime = exchanged.timeFor(target);
    const depth = Math.max(imposed.state(duration(a)).e, target) * 1.12;
    const G = graph(a, 'iceGrowth', 0, p.lakeDays, 0, depth * 100, 't (jours)', 'e (cm)');
    elapsedGraph = G;
    let plot = G.svg + S.clip('th2-app-lake-growth', G);
    // Échantillonnage plus fin au voisinage du départ.
    const series = model => points(0, 1, 155, u => 100 * model.state(u ** 2 * duration(a)).e)
      .map(([u, e]) => [u ** 2 * p.lakeDays, e]);
    const current = a.t / day;
    plot += curve(a, series(imposed), G, C.B, true);
    plot += curve(a, series(exchanged), G, C.cInk);
    plot += curve(a, [[0, p.lakeTarget], [p.lakeDays, p.lakeTarget]], G, C.pred, true);
    for (const [targetTime, color] of [[imposedTime, C.B], [exchangedTime, C.cInk]]) {
      if (targetTime <= duration(a)) plot += marker(a, G, targetTime / day, p.lakeTarget, color, 3.7);
    }
    plot += curve(a, [[current, 0], [current, ideal.e * 100]], G, C.ink2, true);
    if (a.t === 0) plot += marker(a, G, 0, 0, C.cInk);
    else {
      plot += marker(a, G, current, ideal.e * 100, C.B);
      plot += marker(a, G, current, actual.e * 100, C.cInk);
    }
    a.svg('iceGrowth', plot);

    const P = a.panels.lake;
    const x = 41 * k, width = P.w - 69 * k, top = 68 * k;
    const bottom = P.h - 26 * k, span = bottom - top;
    const front = e => top + span * e / depth;
    const edge = front(actual.e), idealEdge = front(ideal.e);
    const water = C.dark ? '#172f3d' : '#dbeaf2';
    const waterText = C.dark ? '#c4e1f3' : '#25475b';
    let svg = S.rect(x, top, width, span, {fill: water, c: C.rule});
    const gradientId = 'th2-lake-ice';
    if (actual.e > 0) {
      svg += '<defs><linearGradient id="' + gradientId + '" x2="0" y2="1">' +
        '<stop stop-color="' + temperatureColor(a, actual.surface, p.lakeAir, 0) + '"/>' +
        '<stop offset="1" stop-color="' + temperatureColor(a, 0, p.lakeAir, 0) + '"/></linearGradient></defs>';
      svg += S.rect(x, top, width, edge - top, {fill: 'url(#' + gradientId + ')', fop: .8});
      svg += S.line(x, edge, x + width, edge, {c: C.cInk, w: 2.3});
      svg += S.line(x, idealEdge, x + width, idealEdge, {c: C.B, w: 1.7, dash: '7 4'});
      const tx = T => x + width * (.19 + .66 * (T - p.lakeAir) / -p.lakeAir);
      svg += S.line(tx(p.lakeAir), top - 20 * k, tx(actual.surface), top,
        {c: C.ink2, dash: '4 4', w: 1.6});
      svg += S.line(tx(actual.surface), top, tx(0), edge, {c: C.card, w: 4});
      svg += S.line(tx(actual.surface), top, tx(0), edge, {c: C.ink, w: 2});
      svg += S.circle(tx(actual.surface), top, 3.3 * k, {fill: C.ink, c: C.card});
      svg += S.circle(tx(0), edge, 3.3 * k, {fill: C.ink, c: C.card});
      svg += label(a, tx(actual.surface), top - 11 * k, S.v('T', 's'), {anchor: 'middle', c: C.ink});
      if (edge - top > 36 * k) {
        svg += label(a, tx(0) - 5 * k, edge - 13 * k, '0 °C', {anchor: 'end', c: C.ink, size: 11.6});
      }
      if (edge - top > 45 * k) {
        svg += label(a, x + 12 * k, top + 20 * k, 'Glace', {c: C.ink, weight: 650});
      }
      svg += S.arrow(x + width * .06, top + 8 * k, x + width * .06, top - 27 * k, {c: C.cInk});
    }
    svg += S.line(x, top, x + width, top, {c: C.ink, w: 1.4});
    svg += S.arrow(x - 12 * k, top, x - 12 * k, bottom, {c: C.ink2, w: 1.4});
    svg += label(a, x - 18 * k, bottom, 'z', {anchor: 'end', math: true});
    svg += label(a, x + width * .5, top - 43 * k, 'Air · ' + number(a, p.lakeAir, '°C'),
      {anchor: 'middle', c: C.ink, weight: 650});
    svg += label(a, x + width * .5, bottom - 16 * k, 'Eau liquide · 0 °C',
      {anchor: 'middle', c: waterText, bg: water, weight: 650});
    a.svg('lake', svg);

    display([
      ['Glace · échange avec l’air', number(a, actual.e * 100, 'cm')],
      ['Température de surface', number(a, actual.surface, '°C')],
      ['Pour ' + number(a, p.lakeTarget, 'cm') + ' · échange', time(a, exchangedTime)],
      ['Pour ' + number(a, p.lakeTarget, 'cm') + ' · T imposée', time(a, imposedTime)],
      ['Pente de log e en log t', a.t > 0 ? a.fmt.fix(actual.exponent, 2) : '—']
    ]);
    a.legend([{c: C.cInk, label: 'Échange air–glace'}, {c: C.B, label: 'Surface à la température de l’air', dash: true},
      {c: C.pred, label: 'Épaisseur cible', dash: true}]);
  }

  function drawSphere(a) {
    const {p, S, C, k} = a;
    const radius = p.radius / 1000, production = p.production * 1e6;
    const model = sphere(radius, p.sphereLambda, production, p.sphereH, p.sphereFluid);
    const reference = p.compareRadius ? sphere(radius / 2, p.sphereLambda, production, p.sphereH, p.sphereFluid) : null;
    const u = p.sphereProbe / 100, T = model.field.temp(u * radius);
    const [min, max] = limits(p.sphereFluid, model.core);
    const G = graph(a, 'sphereProfile', 0, 1.11, min, max, 'r / R', 'T (°C)');
    sphereGraph = G;
    let plot = G.svg + S.clip('th2-app-sphere-profile', G);
    plot += curve(a, [[0, p.sphereFluid], [1.11, p.sphereFluid]], G, C.pred, true);
    plot += curve(a, [[1, p.sphereFluid], [1, model.surface]], G, C.B, true);
    if (reference) {
      plot += curve(a, points(0, 1, 120, q => reference.field.temp(q * radius / 2)), G, C.v, true);
      plot += curve(a, [[1, p.sphereFluid], [1, reference.surface]], G, C.v, true);
    }
    plot += curve(a, points(0, 1, 120, q => model.field.temp(q * radius)), G, C.cInk);
    plot += curve(a, [[u, min], [u, T]], G, C.ink2, true);
    plot += marker(a, G, u, T, C.cInk, 6.8, 'probe');
    plot += marker(a, G, 1, model.surface, C.cInk);
    a.svg('sphereProfile', plot);

    const P = a.panels.sphere, cx = P.w / 2, cy = P.h * .33;
    const R = Math.min(P.w * .245, P.h * .263);
    const stops = points(0, 1, 24, q => model.field.temp(radius * q)).map(([q, local]) =>
      '<stop offset="' + q + '" stop-color="' + temperatureColor(a, local, p.sphereFluid, model.core) + '"/>').join('');
    let svg = '<defs><radialGradient id="th2-app-sphere-color">' + stops + '</radialGradient></defs>';
    svg += S.circle(cx, cy, R, {fill: 'url(#th2-app-sphere-color)', c: C.ink2, w: 1.5});
    if (u > 0 && u < 1) svg += S.circle(cx, cy, u * R, {c: '#fff', w: 1.3, dash: '6 4'});
    svg += S.line(cx, cy, cx + R, cy, {c: '#fff', w: 1.35});
    svg += S.circle(cx + u * R, cy, 4.6 * k, {fill: '#fff', c: '#252131'});
    for (const angle of [-Math.PI / 4, Math.PI / 4, -Math.PI * .76, Math.PI * .76]) {
      const dx = Math.cos(angle), dy = Math.sin(angle), outside = R + 18 * k;
      svg += S.arrow(cx + R * dx, cy + R * dy, cx + outside * dx, cy + outside * dy, {c: C.B, w: 1.7});
    }
    svg += label(a, cx, cy + R + 19 * k, 'Fluide · ' + number(a, p.sphereFluid, '°C'),
      {anchor: 'middle', c: C.B, weight: 650});
    const left = P.w * .10, width = P.w * .80, y = Math.max(P.h * .70, cy + R + 37 * k);
    const scale = model.coreRise / (model.coreRise + model.surfaceRise);
    svg += label(a, left, y, 'Écart entre le cœur et le fluide', {c: C.ink, weight: 650});
    svg += splitBar(a, left, y + 14 * k, width, scale, C.cInk, C.B);
    svg += label(a, left, y + 38 * k, 'Cœur–surface', {c: C.cInk});
    svg += label(a, left + width, y + 38 * k, 'Surface–fluide', {c: C.B, anchor: 'end'});
    svg += label(a, left, y + 57 * k, number(a, model.coreRise, 'K'), {c: C.cInk, weight: 700});
    svg += label(a, left + width, y + 57 * k, number(a, model.surfaceRise, 'K'), {c: C.B, anchor: 'end', weight: 700});
    a.svg('sphere', svg);
    display([
      ['Température au cœur', number(a, model.core, '°C')],
      ['Température de surface', number(a, model.surface, '°C')],
      ['Puissance évacuée', number(a, model.total, 'W')],
      ['Sonde · ' + number(a, u * p.radius, 'mm'), number(a, T, '°C')],
      ['Flux Φ à la sonde', number(a, model.field.flux(u * radius), 'W')]
    ]);
    a.legend([{c: C.cInk, label: reference ? 'Sphère de rayon R' : 'Température dans la sphère'},
      reference && {c: C.v, label: 'Sphère de rayon R/2', dash: true},
      {c: C.B, label: 'Écart à l’interface avec le fluide', dash: true}].filter(Boolean));
  }

  function drawContact(a) {
    const {p, S, C, k} = a;
    const aWood = contact(p.skinTemp, p.objectTemp, wood);
    const aSteel = contact(p.skinTemp, p.objectTemp, steel);
    const min = Math.min(p.skinTemp, p.objectTemp), max = Math.max(p.skinTemp, p.objectTemp);
    const [low, high] = limits(min, max);
    const leftDepth = 1000 * 2.7 * Math.sqrt(diffusivity(skin) * duration(a));
    const rightDepth = 1000 * 2.7 * Math.sqrt(diffusivity(steel) * duration(a));
    const G = graph(a, 'contactProfile', -leftDepth * 1.5, rightDepth, low, high, 'x (mm)', 'T (°C)');
    let plot = G.svg + S.clip('th2-app-contact-profile', G);
    const position = (u, extent) => Math.sign(extent) * Math.abs(extent) * u ** 2;
    const profile = (model, extent) => points(0, 1, 100, u => model.temperature(position(u, extent) / 1000, a.t))
      .map(([u, T]) => [position(u, extent), T]);
    plot += curve(a, [[0, low], [0, high]], G, C.ink2, true);
    for (const [model, color, dashed] of [[aWood, C.cInk, false], [aSteel, C.B, true]]) {
      if (a.t > 0) {
        plot += curve(a, profile(model, -leftDepth * 1.5), G, color, dashed);
        plot += curve(a, profile(model, rightDepth), G, color, dashed);
        plot += marker(a, G, 0, model.interfaceTemperature, color);
      }
    }
    if (a.t === 0) {
      plot += curve(a, [[-leftDepth * 1.5, p.skinTemp], [0, p.skinTemp]], G, C.ink);
      plot += curve(a, [[0, p.objectTemp], [rightDepth, p.objectTemp]], G, C.ink);
    }
    a.svg('contactProfile', plot);

    const P = a.panels.contact, left = P.w * .09, width = P.w * .82, mid = left + .44 * width;
    const objectW = left + width - mid;
    const stripHeight = Math.min(60 * k, P.h * .22);
    const skinW = mid - left;
    const row = (id, y, caption, model, color) => {
      const estimate = x => model.temperature(x / 1000, a.t);
      let svg = label(a, left, y - 17 * k, 'Peau', {c: C.ink, weight: 650});
      svg += label(a, mid + objectW, y - 17 * k, caption, {anchor: 'end', c: color, weight: 650});
      svg += thermalStrip(a, 'th2-contact-skin-' + id, left, y, skinW, stripHeight,
        u => a.t === 0 ? p.skinTemp : estimate((u - 1) * leftDepth), min, max);
      svg += thermalStrip(a, 'th2-contact-material-' + id, mid, y, objectW, stripHeight,
        u => a.t === 0 ? p.objectTemp : estimate(u * rightDepth), min, max);
      svg += S.line(mid, y - 4 * k, mid, y + stripHeight + 6 * k, {c: C.ink, w: 1.65});
      if (a.t > 0) {
        svg += label(a, mid, y + stripHeight + 23 * k, 'Au contact · ' + number(a, model.interfaceTemperature, '°C'),
          {anchor: 'middle', c: color, weight: 700});
      }
      return svg;
    };
    let scene = row('wood', Math.max(.14 * P.h, 29 * k), 'Bois', aWood, C.cInk);
    scene += row('steel', .56 * P.h, 'Acier', aSteel, C.B);
    a.svg('contact', scene);
    display([
      ['Contact peau–bois', a.t > 0 ? number(a, aWood.interfaceTemperature, '°C') : '—'],
      ['Contact peau–acier', a.t > 0 ? number(a, aSteel.interfaceTemperature, '°C') : '—'],
      ['Flux surfacique · bois', a.t > 0 ? number(a, aWood.flux(a.t) / 1000, 'kW·m⁻²') : '—'],
      ['Flux surfacique · acier', a.t > 0 ? number(a, aSteel.flux(a.t) / 1000, 'kW·m⁻²') : '—']
    ]);
    a.legend([{c: C.cInk, label: 'Contact avec le bois'}, {c: C.B, label: 'Contact avec l’acier', dash: true}]);
  }
})();

</script>
