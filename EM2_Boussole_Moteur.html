    if(x===null||x===undefined||!isFinite(x))return '—';

    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

<script>
'use strict';
globalThis.EM2Physics = (() => {
  const add = (a,b) => a.map((v,i)=>v+b[i]);
  const mul = (a,k) => a.map(v=>v*k);
  const dot = (a,b) => a.reduce((s,v,i)=>s+v*b[i],0);
  const cross = (a,b) => [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  const norm = a => Math.hypot(...a);
  const segment = (a,b,current,B) => mul(cross(add(b,mul(a,-1)),B),current);
  function loop(current,B,a,b,theta) {
    const n=[Math.cos(theta),Math.sin(theta),0],et=[-n[1],n[0],0];
    const vertices=[add(mul(et,a/2),[0,0,b/2]),add(mul(et,-a/2),[0,0,b/2]),add(mul(et,-a/2),[0,0,-b/2]),add(mul(et,a/2),[0,0,-b/2])];
    const forces=vertices.map((p,i)=>segment(p,vertices[(i+1)%4],current,[B,0,0]));
    const centers=vertices.map((p,i)=>mul(add(p,vertices[(i+1)%4]),.5));
    const resultant=forces.reduce(add,[0,0,0]);
    const torque=forces.reduce((v,F,i)=>add(v,cross(centers[i],F)),[0,0,0]);
    return {vertices,centers,forces,resultant,torque,n,mu:mul(n,current*a*b)};
  }
  function bar(p,t) {
    const force=p.current*p.length*p.B,acceleration=force/p.mass;
    const v=p.v0+acceleration*t,x=p.x0+p.v0*t+acceleration*t*t/2;
    return {x,v,force,acceleration,power:force*v,work:force*(x-p.x0),kinetic:p.mass*v*v/2};
  }
  function barEnd(p,limit=.18,maxTime=5) {
    const acceleration=p.current*p.length*p.B/p.mass,roots=[];
    for(const edge of [-limit,limit]) {
      if(Math.abs(acceleration)<1e-14) {if(Math.abs(p.v0)>1e-14)roots.push((edge-p.x0)/p.v0);}
      else {const D=p.v0*p.v0-2*acceleration*(p.x0-edge);if(D>=0)for(const sign of [-1,1])roots.push((-p.v0+sign*Math.sqrt(D))/acceleration);}
    }
    return Math.min(maxTime,...roots.filter(t=>t>1e-9));
  }
  function field(p,t) {
    const phi=p.omega*t;
    return [p.B0*Math.cos(phi),p.B0*p.ratio*Math.cos(phi-p.phase),0];
  }
  function phase(p,t) {
    if(!p.speedRamp)return p.omega*t;
    const T=p.rampTime;
    return t<T?p.omega*t*t/(2*T):p.omega*(t-T/2);
  }
  const speed = (p,t) => !p.speedRamp?p.omega:p.omega*Math.min(1,t/p.rampTime);
  const load = (p,t) => p.load*(p.loadRamp?Math.min(1,t/p.loadTime):1)*p.mu*p.B0;
  function motor(p,y,t) {
    const delta=phase(p,t)-y[0],torque=p.mu*p.B0*Math.sin(delta);
    const h=p.friction*p.mu*p.B0/p.omega;
    return {delta,torque,omega:speed(p,t),load:load(p,t),h,power:torque*y[1],acceleration:(torque-load(p,t)-h*y[1])/p.J};
  }
  function rk4(y,t,dt,derivative) {
    const k1=derivative(y,t),k2=derivative(add(y,mul(k1,dt/2)),t+dt/2),k3=derivative(add(y,mul(k2,dt/2)),t+dt/2),k4=derivative(add(y,mul(k3,dt)),t+dt);
    return add(y,mul(add(add(k1,mul(k2,2)),add(mul(k3,2),k4)),dt/6));
  }
  const fixedDerivative=p=>(y,t)=>{const sine=Math.sin(y[0]);return [y[1],-p.mu*p.B/p.J*(Math.abs(sine)<1e-14?0:sine)-p.beta*y[1]];};
  const motorDerivative=p=>(y,t)=>[y[1],motor(p,y,t).acceleration];
  const fixedEnergy=(p,y)=>p.J*y[1]*y[1]/2-p.mu*p.B*Math.cos(y[0]);
  return Object.freeze({add,mul,dot,cross,norm,segment,loop,bar,barEnd,field,phase,speed,load,motor,rk4,fixedDerivative,motorDerivative,fixedEnergy});
})();

// @titre Boussole et moteur synchrone · EM2 · MPSI
// @sortie ../EM2_Boussole_Moteur/EM2_Boussole_Moteur.html
// @inclure EM2_physique.js
// @description Couple sur un moment magnétique : boussole (équilibres, oscillations), champ tournant créé par deux bobines, moteur synchrone et décrochage.
'use strict';
/* =====================================================================
   EM2 · Boussole et moteur synchrone (3 onglets)
   Physique : EM2Physics (EM2_physique.js, ex-modele.js), équations inchangées.
   Conventions du cours : Γ_z = −μB sin θ, J θ̈ + h θ̇ = −μB sin θ ;
   champ tournant B = B0 (cos ωt, r cos(ωt − φ)) ; moteur : retard
   δ = ωt − θ, Γ = μB0 sin δ, couple de charge −Γc e_z (TD Décrochage).
   La trajectoire est calculée d'avance (RK4) pour permettre le curseur temporel.
   ===================================================================== */
const M=AnimKit.M, Ph=EM2Physics, DEG=Math.PI/180, SLOW=.03;
const mv=s=>M.v(s);
let traj=null;
const st={drag:null};
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));

/* ---------- paramètres physiques ---------- */
const fixedP=a=>({B:a.p.Bf*1e-6,mu:a.p.muf/1000,J:a.p.Jf*1e-8,beta:a.p.beta});
const fieldP=a=>({B0:a.p.B0/1000,ratio:a.p.ratio,phase:a.p.phase*DEG,omega:2*Math.PI*a.p.freq});
const motorP=a=>({mu:a.p.mum,B0:a.p.B0m/1000,J:a.p.Jm*1e-5,omega:a.p.Om,load:a.p.load,friction:a.p.fric,loadRamp:a.p.lramp,loadTime:a.p.ltime,speedRamp:a.p.sramp,rampTime:a.p.rtime,initial:a.p.init0,theta0:0});
const Tfield=a=>1/a.p.freq;
const tMax=a=>a.tab===0?a.p.dureeF:a.tab===1?4*Tfield(a):a.p.dureeM;
function init0(a){
  if(a.tab===0)return [a.p.th0*DEG,a.p.u0];
  const m=motorP(a);if(m.speedRamp||m.initial==='rest')return [0,0];
  const dem=m.initial==='loaded'&&!m.loadRamp?m.load+m.friction:m.friction;
  return [-Math.asin(Math.max(0,Math.min(.999999,dem))),m.omega];
}
/* trajectoire échantillonnée ; « cut » relance le calcul depuis un état modifié */
function compute(a,from=null){
  const tab=a.tab,p=tab===0?fixedP(a):motorP(a),der=tab===0?Ph.fixedDerivative(p):Ph.motorDerivative(p);
  const dS=tab===0?.01:.001,T=tMax(a),n=Math.round(T/dS);
  const nat=Math.sqrt(p.mu*(tab===0?p.B:p.B0)/p.J),h=Math.min(.004,.025/(nat+(tab===2?p.omega:0)+(p.beta||0)+1));
  let ys,j0,y;
  if(from){ys=traj.ys.slice(0,from.j+1);ys[from.j]=from.y.slice();j0=from.j;y=from.y.slice();}else{y=init0(a);ys=[y.slice()];j0=0;}
  let t=j0*dS;
  for(let j=j0+1;j<=n;j++){const te=j*dS;while(t<te-1e-12){const dt=Math.min(h,te-t);y=Ph.rk4(y,t,dt,der);t+=dt;}ys.push(y.slice());}
  traj={key:keyOf(a),tab,ys,dS,n};
}
const keyOf=a=>JSON.stringify([a.tab,a.tab===0?fixedP(a):motorP(a),tMax(a)]);
function T_(a){if(a.tab===1)return null;if(!traj||traj.key!==keyOf(a))compute(a);return traj;}
function stateAt(a,t){const R=T_(a),u=Math.max(0,Math.min(R.n,t/R.dS)),j=Math.min(R.n-1,Math.floor(u)),r=u-j,y0=R.ys[j],y1=R.ys[j+1];return [y0[0]+(y1[0]-y0[0])*r,y0[1]+(y1[1]-y0[1])*r];}
function cutAt(a,y){const R=T_(a),j=Math.round(Math.min(R.n,a.t/R.dS));a.t=j*R.dS;compute(a,{j,y});traj.key=keyOf(a);}

  step(a,dt){if(a.tab===2)dt*=SLOW;const T=tMax(a);a.t=Math.min(T,a.t+dt);if(a.t>=T-1e-9)a.play(false);},
  peutLire:a=>{if(a.t>=tMax(a)-1e-9)a.t=0;return true},
  draw(a){[drawFixed,drawField,drawMotor][a.tab](a);graph(a);}
});

/* ---------- outils ---------- */
function sym(a,x,y,pos,r,c){const S=a.S,k=a.k;r*=k;let s=S.circle(x,y,r,{fill:a.C.card,c,w:1.5});
  if(pos)s+=S.circle(x,y,r*.3,{fill:c});else{const e=r*.5;s+=S.line(x-e,y-e,x+e,y+e,{c,w:1.5})+S.line(x+e,y-e,x-e,y+e,{c,w:1.5});}return s;}
function vt(a,x,y,l,sub,o={}){const S=a.S,k=a.k,size=o.size??16,fs=size*k,wl=.62*fs,w=wl+(sub?.4*fs*String(sub).length:0),x0=o.anchor==='middle'?x-w/2:o.anchor==='end'?x-w:x;
  return S.text(x0,y,S.v(l,sub),{size,c:o.c})+S.arrow(x0+.08*fs,y-.66*fs,x0+wl+.05*fs,y-.66*fs,{c:o.c,w:.9,head:4.2*a.k});}
const MU=a=>`<tspan font-family='${a.S.MATH}' font-style="italic" font-weight="600">μ</tspan>`;
/** aiguille (ou spire) d'angle th, centre c, rayon R (px) */
function needle(a,c,R,th,spire){
  const S=a.S,C=a.C,k=a.k,u=[Math.cos(th),-Math.sin(th)],e=[-u[1],u[0]],P=(p,q)=>[c[0]+u[0]*p+e[0]*q,c[1]+u[1]*p+e[1]*q];let s='';
  if(!spire){s+=S.poly([P(0,-R*.12),P(R*.82,0),P(0,R*.12)],{close:true,fill:C.F,c:C.F,w:1,fop:.85})+S.poly([P(0,-R*.12),P(-R*.66,0),P(0,R*.12)],{close:true,fill:C.pred,c:C.pred,w:1,fop:.7});}
  else{const p1=P(0,-R*.6),p2=P(0,R*.6);s+=S.line(p1[0],p1[1],p2[0],p2[1],{c:C.c,w:6})+sym(a,p1[0],p1[1],false,7,C.E)+sym(a,p2[0],p2[1],true,7,C.E);}
  const t=P(R*.98,0);s+=S.arrow(c[0],c[1],t[0],t[1],{c:C.v,w:3});const l=P(R*1.12,0);s+=S.text(l[0],l[1],MU(a),{anchor:'middle',size:19,c:C.v});
  return s+S.circle(c[0],c[1],5*k,{fill:C.card,c:C.ink,w:2});
}
function torque(a,x,y,G,Gm){const S=a.S,k=a.k,C=a.C;if(Math.abs(G)<1e-16)return S.text(x,y,'Γ = 0',{anchor:'middle',size:15,c:C.F});
  return S.arc(x,y,22*k,.3,.3+Math.sign(G)*Math.min(1,Math.abs(G)/Gm)*4.4,{c:C.F,w:2.6,arrow:true})+S.text(x,y,'Γ<tspan font-size="72%" dy="0.42em">z</tspan>',{anchor:'middle',size:16,c:C.F});}

/* ---------- 1. boussole ---------- */
function drawFixed(a){
  const P=a.panels.scene,S=a.S,C=a.C,k=a.k,f=a.fmt,w=P.w,h=P.h,p=fixedP(a),y=stateAt(a,a.t),c=[w*.47,h*.53],R=Math.min(w*.3,h*.38);st.geo={c,R};
  let s=S.circle(c[0],c[1],R,{c:C.ink2,w:1,dash:`${3*k} ${6*k}`})+S.line(c[0]-R*1.3,c[1],c[0]+R*1.45,c[1],{c:C.ink2,w:1,dash:`${4*k} ${5*k}`,op:.6});
  if(p.B>0){const L=Math.min(R*1.4,R*.9*p.B/20e-6);s+=S.arrow(c[0],c[1],c[0]+L,c[1],{c:C.B,w:3.2})+vt(a,c[0]+L+6*k,c[1]-14*k,'B',undefined,{c:C.B,size:17});}
  const th=wrap(y[0]);if(Math.abs(th)>.02)s+=S.arc(c[0],c[1],Math.max(26*k,R*.36),0,th,{c:C.ink2,w:1.4,arrow:true})+S.text(c[0]+R*.48*Math.cos(th/2),c[1]-R*.48*Math.sin(th/2),'θ',{anchor:'middle',size:17,c:C.ink2,math:true,italic:true});
  s+=needle(a,c,R,y[0],a.p.spire);
  const G=-p.mu*p.B*Math.sin(y[0]);s+=torque(a,w-50*k,h-50*k,G,p.mu*p.B||1);
  s+=S.text(10*k,10*k,`Vue de dessus · ${S.v('B')} = ${f.sig(a.p.Bf,3)} µT`,{base:'top',size:14,c:C.ink})+S.text(10*k,30*k,'Tourner l\'aiguille à la souris, puis la lâcher',{base:'top',size:13,c:C.ink2});
  a.svg('scene',s);
  const T0=p.B>0?2*Math.PI*Math.sqrt(p.J/(p.mu*p.B)):NaN;
  a.metrics([{label:'Angle θ',value:f.fix(th/DEG,1),unit:'°',hint:`${M.v('θ̇')} = ${f.sig(y[1],3)} rad·s<sup>−1</sup>`},
    {label:`Moment Γ<sub>z</sub> = −μ${mv('B')} sin θ`,value:f.sig(G*1e9,3),unit:'nN·m'},
    {label:`Période ${M.v('T','0')} des petites oscillations`,value:isFinite(T0)?f.sig(T0,3):'—',unit:isFinite(T0)?'s':'',hint:`2π√(${mv('J')}/(μ${mv('B')})), sans frottement`}]);
  const rest=Math.abs(y[1])<1e-6;
  a.insight(p.B===0?'Champ nul : aucun couple, l\'aiguille garde son mouvement.':rest&&Math.abs(th)<1e-6?'Équilibre stable : μ est aligné avec <b>B</b>.':
    rest&&Math.abs(Math.abs(th)-Math.PI)<1e-6?'Équilibre instable : μ opposé à <b>B</b>. Une petite perturbation suffit à l\'en écarter.':
    p.beta===0?'Sans frottement, l\'aiguille oscille autour de la position μ ∥ <b>B</b> ; l\'énergie mécanique est conservée.':'Le frottement dissipe l\'énergie : l\'aiguille s\'immobilise dans la direction du champ, comme une boussole.');
  a.clock(`${mv('t')} = ${f.fix(a.t,2)} s`);
  a.legend([{c:C.B,label:'champ extérieur'},{c:C.v,label:'moment magnétique μ'},{c:C.F,label:'pôle N et couple'}]);
}

/* ---------- 2. champ tournant ---------- */
function coil(a,x,y,ax,val,R,zero){
  const S=a.S,C=a.C,k=a.k,col=ax==='x'?C.v:C.E;let s='';
  for(let j=0;j<4;j++){const op=(.4+.6*Math.min(1,Math.abs(val))).toFixed(2);
    s+=ax==='x'?`<ellipse cx="${(x+(j-1.5)*R*.12).toFixed(1)}" cy="${y.toFixed(1)}" rx="${(R*.09).toFixed(1)}" ry="${(R*.42).toFixed(1)}" fill="none" stroke="${col}" stroke-width="${(1.9*k).toFixed(2)}" opacity="${op}"/>`
      :`<ellipse cx="${x.toFixed(1)}" cy="${(y+(j-1.5)*R*.1).toFixed(1)}" rx="${(R*.42).toFixed(1)}" ry="${(R*.08).toFixed(1)}" fill="none" stroke="${col}" stroke-width="${(1.9*k).toFixed(2)}" opacity="${op}"/>`;}
  const lx=ax==='x'?x:x+R*.55,ly=ax==='x'?y+R*.42+16*k:y,anc=ax==='x'?'middle':'start';
  s+=S.text(lx,ly,`Bobine ${ax}`,{anchor:anc,size:14,c:col,weight:600})+S.text(lx,ly+18*k,zero?`i${ax==='x'?'ₓ':'ᵧ'} = 0`:`i${ax==='x'?'ₓ':'ᵧ'} / i₀ = ${a.fmt.fix(val,2)}`,{anchor:anc,size:14,c:col});
  return s;
}
function drawField(a){
  const P=a.panels.scene,S=a.S,C=a.C,k=a.k,f=a.fmt,w=P.w,h=P.h,p=fieldP(a),B=Ph.field(p,a.t),R=Math.min(w*.2,h*.27),c=[w*.58,h*.43];
  const sc=R/Math.max(.005,p.B0*Math.max(1,p.ratio)),Pp=b=>[c[0]+b[0]*sc,c[1]-b[1]*sc];let s='';
  s+=S.arrow(c[0]-R*1.95,c[1],c[0]+R*1.3,c[1],{c:C.ink2,w:1})+S.text(c[0]+R*1.3,c[1]+14*k,S.v('x'),{size:14})+S.arrow(c[0],c[1]+R*1.75,c[0],c[1]-R*1.3,{c:C.ink2,w:1})+S.text(c[0]+8*k,c[1]-R*1.3,S.v('y'),{size:14});
  const ix=p.B0===0?0:Math.cos(p.omega*a.t),iy=p.B0===0?0:p.ratio*Math.cos(p.omega*a.t-p.phase);
  s+=coil(a,c[0]-R*1.5,c[1],'x',ix,R,p.B0===0)+coil(a,c[0],c[1]+R*1.4,'y',iy,R,p.B0===0);
  const T=Tfield(a),t1=a.p.lieu?T:Math.min(a.t,T),n=Math.max(2,Math.round(160*t1/T)),pts=[];
  for(let j=0;j<=n;j++){const tt=a.p.lieu?T*j/n:Math.max(0,a.t-t1)+t1*j/n;pts.push(Pp(Ph.field(p,tt)));}
  if(t1>0)s+=S.poly(pts,{c:C.B,w:1.6,dash:`${4*k} ${4*k}`,op:.7});
  if(a.p.compo){const bx=Pp([B[0],0]),by=Pp([0,B[1]]),bt=Pp(B);
    s+=S.line(bx[0],bx[1],bt[0],bt[1],{c:C.E,w:1,dash:`${4*k} ${4*k}`})+S.line(by[0],by[1],bt[0],bt[1],{c:C.v,w:1,dash:`${4*k} ${4*k}`});
    if(Math.abs(B[0])*sc>3)s+=S.arrow(c[0],c[1],bx[0],bx[1],{c:C.v,w:2.4})+vt(a,bx[0]+(B[0]>0?6:-6)*k,bx[1]+20*k,'B','x',{c:C.v,anchor:B[0]>0?'start':'end',size:15});
    if(Math.abs(B[1])*sc>3)s+=S.arrow(c[0],c[1],by[0],by[1],{c:C.E,w:2.4})+vt(a,by[0]-8*k,by[1]+(B[1]>0?-4:18)*k,'B','y',{c:C.E,anchor:'end',size:15});}
  const bt=Pp(B);if(Math.hypot(...B)*sc>3)s+=S.arrow(c[0],c[1],bt[0],bt[1],{c:C.B,w:3.4})+vt(a,bt[0]+8*k,bt[1]-8*k,'B',undefined,{c:C.B,size:17});
  s+=S.circle(c[0],c[1],4*k,{fill:C.ink})+S.text(c[0]-8*k,c[1]+16*k,'O',{anchor:'end',size:14,c:C.ink,math:true,italic:true});
  s+=S.text(10*k,10*k,'iₓ / i₀ = cos(ωt)   ·   iᵧ / i₀ = r cos(ωt − φ)',{base:'top',size:14,c:C.ink});
  a.svg('scene',s);
  const nb=Math.hypot(...B),circ=Math.abs(p.ratio-1)<1e-8&&Math.abs(Math.abs(p.phase)-Math.PI/2)<1e-8,lin=p.ratio===0||Math.abs(Math.sin(p.phase))<1e-8;
  a.metrics([{label:`Norme |${M.vec('B')}|`,value:f.sig(nb*1000,3),unit:'mT'},
    {label:`Direction de ${M.vec('B')}`,value:nb>1e-12?f.fix(Math.atan2(B[1],B[0])/DEG,0):'—',unit:nb>1e-12?'°':'',hint:'depuis Ox'},
    {label:`Période ${mv('T')} = 1/${mv('f')}`,value:f.sig(T,3),unit:'s',hint:`${mv('t')} = ${f.sig(a.t/T,3)} ${mv('T')}`}]);
  a.insight(p.B0===0?'Courants nuls : champ nul.':circ?(p.phase>0?'Courants de même amplitude en quadrature : <b>B</b> garde une norme constante et tourne dans le sens direct à la vitesse ω.':'Le retard opposé inverse le sens de rotation du champ.')
    :lin?'Courants en phase (ou une seule bobine) : champ alternatif de direction fixe, il ne tourne pas.':'Amplitudes différentes : le champ tourne mais sa norme varie, son extrémité décrit une ellipse.');
  a.clock(`${mv('t')} = ${f.fix(a.t,2)} s`);
  a.legend([{c:C.v,label:'bobine x et '+M.vec('B')+'<sub>x</sub>'},{c:C.E,label:'bobine y et '+M.vec('B')+'<sub>y</sub>'},{c:C.B,label:'champ total en O'}]);
}

/* ---------- 3. moteur synchrone ---------- */
function drawMotor(a){
  const P=a.panels.scene,S=a.S,C=a.C,k=a.k,f=a.fmt,w=P.w,h=P.h,p=motorP(a),y=stateAt(a,a.t),q=Ph.motor(p,y,a.t),phi=Ph.phase(p,a.t);
  const c=[w*.5,h*.53],R=Math.min(w*.28,h*.35);st.geo={c,R};
  let s=S.circle(c[0],c[1],R*1.22,{c:C.B,w:1.6,dash:`${5*k} ${7*k}`,op:.5});
  const u=[Math.cos(phi),-Math.sin(phi)];s+=S.arrow(c[0],c[1],c[0]+u[0]*R*1.2,c[1]+u[1]*R*1.2,{c:C.B,w:3.4})+vt(a,c[0]+u[0]*R*1.36,c[1]+u[1]*R*1.36+6*k,'B',undefined,{c:C.B,anchor:'middle',size:17});
  const d=wrap(q.delta);if(Math.abs(d)>.03)s+=S.arc(c[0],c[1],Math.max(26*k,R*.42),wrap(y[0]),wrap(y[0])+d,{c:C.ink2,w:1.4,arrow:true})+S.text(c[0]+R*.55*Math.cos(wrap(y[0])+d/2),c[1]-R*.55*Math.sin(wrap(y[0])+d/2),'δ',{anchor:'middle',size:17,c:C.ink2,math:true,italic:true});
  s+=needle(a,c,R,y[0],false)+torque(a,w-50*k,h-50*k,q.torque,p.mu*p.B0);
  s+=S.text(10*k,10*k,`Stator : champ tournant à ${f.sig(q.omega,3)} rad·s${S.sup('−1')} · charge λ = ${f.fix(q.load/(p.mu*p.B0),2)}`,{base:'top',size:14,c:C.ink});
  s+=S.text(10*k,30*k,'Le rotor est entraîné par le couple calculé (lecture ralentie × 0.03)',{base:'top',size:13,c:C.ink2});
  a.svg('scene',s);
  const turns=Math.floor(Math.abs(q.delta)/(2*Math.PI)),eff=q.load/(p.mu*p.B0)+p.friction;
  a.metrics([{label:'Retard δ = ω<i class="m">t</i> − θ',value:f.fix(q.delta/DEG,1),unit:'°',hint:'déroulé : un tour perdu ajoute 360°'},
    {label:'Vitesse du rotor',value:f.sig(y[1],3),unit:'rad·s<sup>−1</sup>',hint:`champ : ${f.sig(q.omega,3)} rad·s<sup>−1</sup>`},
    {label:`Puissance ${M.v('P','ℒ')} = Γ${M.v('θ̇')}`,value:f.sig(q.power*1000,3),unit:'mW',hint:`Γ = μ${M.v('B','0')} sin δ = ${f.sig(q.torque*1000,3)} mN·m`}]);
  a.insight(turns>=1?`Décrochage : le rotor a perdu ${turns} tour${turns>1?'s':''} sur le champ. Le couple moyen devient nul et le moteur ne fournit plus de travail.`:
    p.speedRamp&&a.t<p.rampTime?'Le champ accélère progressivement : le rotor peut le suivre depuis le repos.':
    eff>=1?'Charge et frottement dépassent le couple maximal μ<i class="m">B</i><sub>0</sub> : aucun régime synchrone n\'existe.':
    Math.abs(q.omega-y[1])<.02&&Math.abs(q.acceleration)<.5?'Régime synchrone : le rotor tourne à la vitesse du champ avec un retard constant, sin δ = Γ<sub>c</sub>/Γ<sub>max</sub>.':
    'Le retard évolue : le rotor oscille autour du régime synchrone ou décroche si la charge est trop brutale.');
  a.clock(`${mv('t')} = ${f.fix(a.t,3)} s`);
  a.legend([{c:C.B,label:'champ tournant'},{c:C.v,label:'moment du rotor μ'},{c:C.F,label:'couple magnétique'}]);
}

/* ---------- graphe temporel (jusqu'à t, ou complet en prévision) ---------- */
function graph(a){
  const P=a.panels.graphe,S=a.S,C=a.C,k=a.k,T=tMax(a),tc=Math.min(a.t,T),fut=a.p.futur,ser=[];let ylab='',refs=[];
  const sample=(fn)=>{const n=a.tab===1?320:Math.min(1200,T_(a).n),pts=[];for(let j=0;j<=n;j++){const t=T*j/n;pts.push([t,fn(t)]);}return pts;};
  if(a.tab===0){const p=fixedP(a),E=a.p.gF==='E';ylab=E?`${S.v('E','m')} (nJ)`:'θ (°)';
    ser.push({pts:sample(t=>{const y=stateAt(a,t);return E?Ph.fixedEnergy(p,y)*1e9:y[0]/DEG;}),c:E?C.F:C.v});}
  else if(a.tab===1){const p=fieldP(a);ylab='i / i₀';
    ser.push({pts:sample(t=>p.B0?Math.cos(p.omega*t):0),c:C.v},{pts:sample(t=>p.B0?p.ratio*Math.cos(p.omega*t-p.phase):0),c:C.E});}
  else{const p=motorP(a),g=a.p.gM;
    if(g==='w'){ylab=`ω (rad·s${S.sup('−1')})`;ser.push({pts:sample(t=>stateAt(a,t)[1]),c:C.v},{pts:sample(t=>Ph.speed(p,t)),c:C.B,dash:true});}
    else if(g==='G'){ylab='Γ (mN·m)';ser.push({pts:sample(t=>Ph.motor(p,stateAt(a,t),t).torque*1000),c:C.F});}
    else{ylab='δ (°)';ser.push({pts:sample(t=>Ph.motor(p,stateAt(a,t),t).delta/DEG),c:C.v});
      if(a.p.prev){if(p.load+p.friction<1&&!p.speedRamp)refs.push({y:Math.asin(p.load+p.friction)/DEG,c:C.pred,l:'δ synchrone prévu'});refs.push({y:90,c:C.F,l:'90° : seuil de décrochage'});}}}
  const vals=ser.flatMap(z=>z.pts.map(q=>q[1])).concat(refs.map(r=>r.y)).filter(isFinite);
  let lo=Math.min(0,...vals),hi=Math.max(0,...vals);if(hi-lo<1e-9){lo=-1;hi=1;}const pd=(hi-lo)*.08;
  const Gr=S.graph({x:4*k,y:4*k,w:P.w-8*k,h:P.h-8*k,xmin:0,xmax:T,ymin:lo-(lo<0?pd:0),ymax:hi+pd,xlab:`${S.v('t')} (s)`,ylab});
  let s=Gr.svg+S.clip('clgr',Gr);
  for(const r of refs)s+=S.line(Gr.x0,Gr.Y(r.y),Gr.x0+Gr.w,Gr.Y(r.y),{c:r.c,w:1.4,dash:`${6*k} ${4*k}`})+S.text(Gr.x0+Gr.w-4*k,Gr.Y(r.y)-9*k,r.l,{anchor:'end',size:13,c:r.c});
  for(const z of ser){const pts=fut?z.pts:z.pts.filter(q=>q[0]<=tc+1e-12);s+=S.curve(pts,Gr,{c:z.c,w:2.3,dash:z.dash?`${6*k} ${4*k}`:undefined});}
  s+=S.line(Gr.X(tc),Gr.y0,Gr.X(tc),Gr.y0+Gr.h,{c:C.ink2,w:1,dash:`${3*k} ${4*k}`});
  a.svg('graphe',s);
}

/* ---------- interactions : tourner l'aiguille ou le rotor ---------- */
A.drag('scene',{
  hit:(x,y)=>A.tab!==1&&!!st.geo&&Math.hypot(x-st.geo.c[0],y-st.geo.c[1])<st.geo.R*1.05,
  start(){st.drag={was:A.running};A.play(false);},
  move(x,y){const g=st.geo,ang=Math.atan2(g.c[1]-y,x-g.c[0]);
    if(A.tab===0){A.p.th0=Math.round(ang/DEG);A.p.u0=0;A.t=0;traj=null;A.refresh();}
    else{const yy=stateAt(A,A.t);cutAt(A,[yy[0]+wrap(ang-yy[0]),yy[1]]);}},
  end(){const w=st.drag&&st.drag.was;st.drag=null;if(A.tab===0||w)A.play(true);}
});

</script>
