     })

   app.S (dessin SVG), app.fmt (nombres), app.metrics(), app.insight(), app.legend(), app.clock(), app.drag()…
   Réglage à échelle logarithmique : {id,type:'range',log:true,min,max,dec} (curseur en log10, champ numérique en valeur réelle).
   Disposition facultative  atelier:{saisie:'Mes mesures', detail:'Voir le calcul'} : app.zones.saisie / .resultat / .detail

const MINUS='−';

  /** n chiffres significatifs, sans notation exponentielle */
  sig(x,n=3){

    return s.replace('-',MINUS);
  },
  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

/* Tables HEOS préparées avec CoolProp ; unités internes SI. */
const Thermo = (() => {
 'use strict';
 const R=8.31446261815324, NA=6.02214076e23, kB=R/NA;
 const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
 const mix=(a,b,t)=>a+(b-a)*t;
 function bracket(array,x,get=v=>v){
  if(x<=get(array[0]))return [0,0];
  const end=array.length-1;if(x>=get(array[end]))return [end-1,1];
  let a=0,b=end;while(b-a>1){const m=(a+b)>>1;if(get(array[m])<=x)a=m;else b=m;}
  return [a,(x-get(array[a]))/(get(array[a+1])-get(array[a]))];
 }
 function saturation(key,T){
  const f=THERMO_DATA.fluids[key];
  if(T<f.Tt||T>=f.Tc)return null;
  const [i,u]=bracket(f.sat,T,r=>r[0]),a=f.sat[i],b=f.sat[i+1];
  return {T,P:Math.exp(mix(Math.log(a[1]),Math.log(b[1]),u)),
   vl:mix(a[2],b[2],u),vg:Math.exp(mix(Math.log(a[3]),Math.log(b[3]),u)),i,u};
 }
 function courseSat(T=423){return {T,P:476000,vl:.00109,vg:8.314*423/(.018*476000)};}
 function pressure(key,T,v,course=false){
  const f=THERMO_DATA.fluids[key];
  if(course){const s=courseSat();return v>=s.vl&&v<=s.vg?s.P:v>s.vg?8.314*T/(.018*v):NaN;}
  const s=saturation(key,T);
  if(s){
   if(v>=s.vl&&v<=s.vg)return s.P;
   const gas=v>s.vg, factors=gas?THERMO_DATA.gasFactors:THERMO_DATA.liquidFactors;
   const ratio=v/(gas?s.vg:s.vl),[j,w]=bracket(factors,ratio);
   const index=gas?4:5, a=f.sat[s.i][index],b=f.sat[s.i+1][index];
   // Interpolation logarithmique en pression ; raccord exact à la saturation.
   const r0=factors[j],r1=factors[j+1],z=clamp(Math.log(ratio/r0)/Math.log(r1/r0),0,1);
   if(!gas){
    const pa=THERMO_DATA.fluids[key].sat[s.i][1],pb=THERMO_DATA.fluids[key].sat[s.i+1][1];
    return s.P+mix(mix(a[j]-pa,a[j+1]-pa,z),mix(b[j]-pb,b[j+1]-pb,z),s.u);
   }
   const p0=Math.exp(mix(Math.log(a[j]),Math.log(b[j]),s.u));
   const p1=Math.exp(mix(Math.log(a[j+1]),Math.log(b[j+1]),s.u));
   const p=Math.exp(mix(Math.log(p0),Math.log(p1),z));
   if(ratio>factors.at(-1)){const ve=s.vg*factors.at(-1),zedge=p*ve*f.M/(R*T);return R*T/(f.M*v)*(1+(zedge-1)*ve/v);}
   return p;
  }
  if(T>=f.Tc){
   const [i,u]=bracket(f.super,T,r=>r[0]);
   const ratio=v/f.vc,[j]=bracket(THERMO_DATA.superFactors,ratio);
   const z=clamp(Math.log(ratio/THERMO_DATA.superFactors[j])/Math.log(THERMO_DATA.superFactors[j+1]/THERMO_DATA.superFactors[j]),0,1);
   const a=f.super[i][1],b=f.super[i+1][1];
   const p=Math.exp(mix(mix(Math.log(a[j]),Math.log(a[j+1]),z),mix(Math.log(b[j]),Math.log(b[j+1]),z),u));
   if(ratio>THERMO_DATA.superFactors.at(-1)){const ve=f.vc*THERMO_DATA.superFactors.at(-1),zedge=p*ve*f.M/(R*T);return R*T/(f.M*v)*(1+(zedge-1)*ve/v);}
   return p;
  }
  return R*T/(f.M*v);
 }
 function stateTV(key,T,v,course=false){
  const f=THERMO_DATA.fluids[key],s=course?courseSat():saturation(key,T);
  const P=pressure(key,T,v,course);
  if(s&&v>=s.vl*(1-1e-10)&&v<=s.vg*(1+1e-10)){
   const x=clamp((v-s.vl)/(s.vg-s.vl),0,1);
   return {T,v,P:s.P,x,liquidVolume:(1-x)*s.vl/v,phase:x<1e-8?'Liquide saturé':x>1-1e-8?'Vapeur saturée':'Liquide + vapeur',kind:x<1e-8?'liquid':x>1-1e-8?'gas':'two',sat:s};
  }
  if(s&&v<s.vl)return {T,v,P,x:0,liquidVolume:1,phase:'Liquide comprimé',kind:'liquid',sat:s};
  const supercritical=T>f.Tc&&P>f.Pc;
  return {T,v,P,x:null,liquidVolume:0,phase:supercritical?'Fluide supercritique':T>=f.Tc?'Gaz · T ≥ T꜀':'Vapeur sèche',kind:supercritical?'super':'gas',sat:s};
 }
 function saturationTemperature(key,P){
  const f=THERMO_DATA.fluids[key];if(P<f.Pt||P>=f.Pc)return null;
  let a=f.Tt,b=f.Tc-1e-5;for(let i=0;i<55;i++){const t=(a+b)/2;if(saturation(key,t).P>P)b=t;else a=t;}return (a+b)/2;
 }
 function volumeTP(key,T,P,quality=.5){
  const f=THERMO_DATA.fluids[key],s=saturation(key,T);
  if(s&&Math.abs(Math.log(P/s.P))<1e-11)return mix(s.vl,s.vg,quality);
  let a=s?s.vl*.761:f.vc*.501,b=Math.max(s?s.vg*1e6:f.vc*19999,2*R*T/(f.M*P));
  if(T<f.Tt)return R*T/(f.M*P);
  for(let i=0;i<65;i++){const v=Math.sqrt(a*b);if(pressure(key,T,v)>P)a=v;else b=v;}
  return Math.sqrt(a*b);
 }
 function sublimationPressure(key,T){const f=THERMO_DATA.fluids[key];return f.Pt*Math.exp(-f.Lsub/R*(1/T-1/f.Tt));}
 function meltingTemperature(key,P){const f=THERMO_DATA.fluids[key];return f.Tt+(key==='water'?-7.4e-8:2.2e-7)*(P-f.Pt);}
 function phasePT(key,T,P){
  const f=THERMO_DATA.fluids[key];
  if(T<f.Tt){if(P<sublimationPressure(key,T))return 'gas';return T>meltingTemperature(key,P)?'liquid':'solid';}
  if(T<meltingTemperature(key,P))return 'solid';
  const s=saturation(key,T);if(s)return Math.abs(Math.log(P/s.P))<2e-5?'two':P>s.P?'liquid':'gas';

 }

/* ---------- couleurs ---------- */
function mixc(c1,c2,t){const p=c=>{c=c.trim();if(c[0]==='#')return [1,3,5].map(i=>parseInt(c.slice(i,i+2),16));return c.match(/[\d.]+/g).slice(0,3).map(Number)};const a=p(c1),b=p(c2);return `rgb(${a.map((v,i)=>Math.round(v*(1-t)+b[i]*t)).join(',')})`}

/* ---------- Franklin : séquence qualitative hors équilibre ---------- */
function franklin(q){

}
/* ---------- état à partir de (T, P) ---------- */
function stateFromPT(fluid,m,T,P,qual){

}
const guidedOK=a=>{if(a.tab===0){const f=FL(a.p.cp_fluid),T=course?423:clamp(a.p.cp_T,f.Tt+1e-5,f.Tc*1.4999);return course||!!Thermo.saturation(a.p.cp_fluid,T)}

const base={T:300,V:.001,P:1e5};
function etat(a){

  let T=p.cp_T,V=p.cp_V/1000,Pt=p.cp_P*1e5,qual=p.cp_x;const g=u>0;if(!g){base.T=T;base.V=V;base.P=Pt}
  if(tab===0||tab===2){
    if(course)T=423;
    if(tab===2&&g)T=mix(base.T,Math.max(base.T+10,f.Tc*1.07),u);
    T=clamp(T,f.Tt+1e-5,f.Tc*1.4999);
    const s=course?Thermo.courseSat():Thermo.saturation(fluid,T);
    if(tab===0&&g&&s){const s1=course?.001:m*s.vl*1.03,s0=base.V>s1*1.2?base.V:(course?.05:m*s.vg*1.4);V=Math.exp(mix(Math.log(s0),Math.log(s1),u))}

    if(tab===3&&g){const d=+p.cp_dir>0?1:-1,iso=p.cp_path==='isotherme',Tend=clamp(base.T+d*45,TMIN[fluid],f.Tc*1.4999),Pend=clamp(base.P*(d>0?30:1/30),100,5e7);
      let sst=null,x0=0,Tsx=null,Psx=null;
      if(!iso){Tsx=Thermo.saturationTemperature(fluid,base.P);if(Tsx!==null&&(Tsx-base.T)*(Tsx-Tend)<0){sst=(Tsx-base.T)/(Tend-base.T);x0=base.T<Tsx?0:1}}

/* ---------- particules : lots égaux ---------- */
function makeParts(n){parts=Array.from({length:n},(_,i)=>({x:Math.random(),y:Math.random(),gx:gauss(),gy:gauss(),ph:i<n/2?'gas':'liquid',sd:Math.random()*6.283,i}));syncParts(true)}
function syncParts(init){
  if(!st)return;const x=xG(st),N=parts.length,target=st.kind==='super'||st.kind==='solid'?0:Math.round((x??1)*N);
  if(st.kind==='solid'||st.kind==='super'){for(const q of parts)q.ph=st.kind;return}
  for(const q of parts)if(q.ph!=='gas'&&q.ph!=='liquid')q.ph='gas';
  let c=parts.reduce((n,q)=>n+(q.ph==='gas'),0);
  const big=Math.abs(c-target)>N*.03;
  if(c<target){for(const q of parts)if(q.ph==='liquid'){q.ph='gas';if(!init)q.y=big?Math.random():1;if(++c>=target)break}}
  else if(c>target){for(const q of parts)if(q.ph==='gas'){q.ph='liquid';if(!init){q.y=Math.random();q.x=Math.random()}if(--c<=target)break}}

/* ---------- clics dans les diagrammes ---------- */
A.drag('diag',{
  hit:(x,y)=>(!!ptG&&ptG.inside(x,y))||(!!pvG&&pvG.inside(x,y)),
  start(x,y){clickDiag(x,y)},move(x,y){clickDiag(x,y)}
});
function clickDiag(x,y){if(ptG&&ptG.inside(x,y))clickPT(x,y);else if(pvG&&pvG.inside(x,y))clickPV(x)}
function clickPT(x,y){
  const G=ptG;if(!G||!G.inside(x,y))return;const fl=st.fluid,f=FL(fl);
  if(A.tab!==3){A.setTab(3)}course=false;u=0;A.t=0;
  const T=clamp(G.ix(x),TMIN[fl],f.Tc*1.4999);let Pp=G.iy(y)*1e5;const s=Thermo.saturation(fl,T);if(s&&Math.abs(Math.log(Pp/s.P))<.18)Pp=s.P;
  setP(A,{cp_T:+T.toFixed(2),cp_P:+clamp(Pp/1e5,.001,500).toFixed(4)});
}
function clickPV(x){
  const G=pvG;if(!G||x<G.x0||x>G.x0+G.w)return;const E=st;
  if(A.tab!==0){const T=E.T;A.setTab(0);setP(A,{cp_T:+T.toFixed(3)})}
  u=0;A.t=0;const v=Math.max(1e-9,G.ix(x));A.set('cp_V',+clamp(E.m*v*1000,.05,100).toFixed(4),{silent:true});
}

</script>
