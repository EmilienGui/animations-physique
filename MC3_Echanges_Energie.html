       aide:{voit, faire, modele, cours},
       init(app), reset(app), step(app,dt), draw(app), change(app,id,v), onglet(app,i)
     })
   Le kit fournit : app.p (paramètres), app.tab, app.t, app.C (couleurs), app.k (échelle projection),
   app.S (dessin SVG), app.fmt (nombres), app.metrics(), app.insight(), app.legend(), app.clock(), app.drag()…
   Réglage à échelle logarithmique : {id,type:'range',log:true,min,max,dec} (curseur en log10, champ numérique en valeur réelle).
   Disposition facultative  atelier:{saisie:'Mes mesures', detail:'Voir le calcul'} : app.zones.saisie / .resultat / .detail

(function(){
'use strict';
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const MATH='"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif';
const MINUS='−';

/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  /** n chiffres significatifs, sans notation exponentielle */
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e<-3||e>=6){const m=x/10**e;return (+m.toFixed(n-1)).toFixed(n-1).replace('-',MINUS)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>'}
    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);

  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;

function ticks(a,b,n=5){

  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

/* ---------------- icônes ---------------- */

/* ---------------- mathématiques en HTML ---------------- */
const M={
  v:(s,sub,sup)=>`<span class="m">${s}</span>${sub!==undefined?`<sub>${sub}</sub>`:''}${sup!==undefined?`<sup>${sup}</sup>`:''}`,
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt"><span class="sym">√</span><span class="rad">${x}</span></span>`,
  vec:s=>`<span class="vec">${s}</span>`
};

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}
      return s;
    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const X=v=>x0+(v-o.xmin)/(o.xmax-o.xmin)*w, Y=v=>y0+h-(v-o.ymin)/(o.ymax-o.ymin)*h;
      let s='';
      const xt=o.xticks||ticks(o.xmin,o.xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5)))), yt=o.yticks||ticks(o.ymin,o.ymax,o.ny??Math.max(1,Math.round(h/(fs*3))));
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      const yAx=o.ymin<=0&&o.ymax>=0&&o.zeroAxis!==false?Y(0):y0+h, xAx=x0;
      s+=`<line x1="${n(x0)}" y1="${n(yAx)}" x2="${n(x0+w)}" y2="${n(yAx)}" stroke="${C0.ink2}" stroke-width="1.2"/><line x1="${n(xAx)}" y1="${n(y0)}" x2="${n(xAx)}" y2="${n(y0+h)}" stroke="${C0.ink2}" stroke-width="1.2"/>`;
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>o.xmin+(px-x0)/w*(o.xmax-o.xmin),yv:py=>o.ymin+(y0+h-py)/h*(o.ymax-o.ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){
      let d='',pen=false;
      for(const[x,y]of pts){if(!isFinite(y)||!isFinite(x)){pen=false;continue}
        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}
      return`<g clip-path="url(#${G.clip||''})">`+S.path(d,o)+'</g>';
    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}
  };
  return S;
}

/* ===================================================================== */
function app(cfg){
  const A={cfg,p:{},tab:0,t:0,running:false,speed:1,k:1,narrow:false,C:{},fmt,M,panels:{},_dirty:false};
  A.S=makeS(A);
  const root=document.documentElement;
  root.dataset.theme='dark';
  if(cfg.partie)root.style.setProperty('--chap',`var(--${cfg.partie})`);
  document.title=cfg.titreFenetre||`${cfg.titre} · ${cfg.code} · MPSI`;

  /* ---------- structure ---------- */
  const ak=el('div',{class:'ak',id:'ak'});
  const top=el('header',{class:'ak-top'});
  top.innerHTML=`<span class="ak-badge">${cfg.code}</span><div class="ak-titles"><h1 class="ak-title">${cfg.titre}</h1></div>
  <nav class="ak-tools" aria-label="Outils">
   <button class="ib ak-btn-settings" data-act="settings" title="Réglages">${IC.settings}<span class="ak-lbl">Réglages</span></button>
   <button class="ib" data-act="help" title="Aide (H)">${IC.help}<span class="ak-lbl">Aide</span></button>
   <button class="ib" data-act="theme" title="Thème clair / sombre (T)">${IC.theme}<span class="ak-lbl">Thème</span></button>
   <button class="ib" data-act="image" title="Enregistrer l'image (I)">${IC.image}<span class="ak-lbl">Image</span></button>
   <button class="ib" data-act="proj" title="Mode projection (P)">${IC.proj}<span class="ak-lbl">Projection</span></button>
   <button class="ib" data-act="fs" title="Plein écran (F)">${IC.fs}</button>
  </nav>`;
  ak.append(top);
  const tabs=cfg.onglets&&cfg.onglets.length>1?el('div',{class:'ak-tabs',role:'tablist'}):null;
  if(tabs){cfg.onglets.forEach((t,i)=>{const b=el('button',{class:'ak-tab',role:'tab','aria-selected':String(i===0),'data-tab':i},`<b>${i+1}</b>${t}`);b.onclick=()=>A.setTab(i);tabs.append(b)});ak.append(tabs)}
  const body=el('div',{class:'ak-body'}); ak.append(body);
  const main=el('main',{class:'ak-main'}); body.append(main);
  const scene=el('section',{class:'ak-card ak-scene'}); main.append(scene);
  /* disposition « atelier » (7 novembre 2026, facultative : cfg.atelier) :
     saisie à gauche ; résultat, graphique et détail du calcul à droite ; pas de colonne de réglages */
  A.zones={};
  if(cfg.atelier){
    const at=typeof cfg.atelier==='object'?cfg.atelier:{};
    ak.classList.add('ak-atelier');
    const left=el('section',{class:'ak-card ak-saisie'},`<div class="ak-zone-h">${at.saisie||'Mes mesures'}</div>`);
    A.zones.saisie=el('div',{class:'ak-saisie-body'}); left.append(A.zones.saisie);
    A.zones.resultat=el('section',{class:'ak-card ak-res','aria-live':'polite'});
    const det=el('details',{class:'ak-card ak-detail'},`<summary>${at.detail||'Voir le calcul'}</summary>`);
    A.zones.detail=el('div',{class:'ak-detail-body'}); det.append(A.zones.detail);
    body.insertBefore(left,main); main.insertBefore(A.zones.resultat,scene); main.append(det);
  }
  const pwrap=el('div',{class:'ak-panels'}); scene.append(pwrap);
  for(const pc of (cfg.panneaux||[{id:'scene'}])){
    const pe=el('div',{class:'ak-panel','data-id':pc.id}); pe.style.flex=`${pc.poids||1} 1 0`;
    if(pc.titre)pe.append(el('div',{class:'ak-phead'},pc.titre));
    const type=pc.type||'svg';
    const node=type==='canvas'?el('canvas'):document.createElementNS('http://www.w3.org/2000/svg','svg');
    if(type!=='canvas'){node.setAttribute('xmlns','http://www.w3.org/2000/svg');node.setAttribute('role','img');node.setAttribute('aria-label',pc.titre||cfg.titre)}
    pe.append(node);
    const P={id:pc.id,cfg:pc,el:pe,node,type,w:300,h:200,zoom:1,panX:0,panY:0,vz:1,vx:0,vy:0,_drags:[],head:pe.querySelector('.ak-phead')};
    /* Vue (7 novembre 2026) : tout panneau SVG se zoome, se cadre et se déplace (viewBox) ;
       un canvas déclaré zoom:true garde son zoom interne P.zoom, lu par l'animation. */
    P.vue=type!=='canvas'?(pc.zoom===false?null:'svg'):(pc.zoom?'interne':null);
    if(P.vue){const tl=el('div',{class:'ak-ptools'});tl.innerHTML='<button class="mini" data-z="-" title="Dézoomer (−)">−</button><button class="mini" data-z="0" title="Cadrer : vue initiale (0)">Cadrer</button><button class="mini" data-z="+" title="Zoomer (+)">+</button>';
      tl.onclick=e=>{const z=e.target.closest('[data-z]');if(!z)return;const v=z.dataset.z;if(v==='0')A.cadrer(P);else A.zoomer(P,v==='+'?1.25:.8)};P.tools=tl;pe.append(tl)}
    A.panels[pc.id]=P; pwrap.append(pe);
  }
  /* légende : bande fine entre la scène et la barre de lecture (6 novembre 2026) */
  const legend=el('div',{class:'ak-legend'}); scene.append(legend);
  const tr=el('div',{class:'ak-transport'});
  tr.innerHTML=`<button class="ib ak-play" data-act="play" title="Lecture / pause (Espace)">▶ Lecture</button>
   <button class="ib" data-act="step" title="Pas à pas (→)">${IC.step}<span class="ak-lbl">Pas</span></button>
   <button class="ib" data-act="reset" title="Recommencer (R)">${IC.reset}<span class="ak-lbl">Recommencer</span></button>
   <select class="ak-speed" title="Vitesse de lecture">${(cfg.vitesses||[.25,.5,1,2,4]).map(v=>`<option value="${v}"${v===(cfg.vitesse||1)?' selected':''}>× ${v}</option>`).join('')}</select>
   <input type="range" class="ak-scrub" min="0" max="1" step="any" value="0" aria-label="Curseur temporel" hidden><span class="ak-extra"></span><span class="ak-clock"></span>`;
  scene.append(tr);
  /* colonne de droite (6 novembre 2026) : réglages qui défilent, mesures en bas des réglages
     (sur téléphone, les mesures restent sous la scène) */
  const right=el('div',{class:'ak-right'}); body.append(right);
  const metrics=el('section',{class:'ak-metrics','aria-label':'Mesures'});
  const side=el('aside',{class:'ak-side','aria-label':'Réglages'});
  side.innerHTML='<div class="ak-drawer-head"><span>Réglages</span><button class="mini" data-act="settings">Fermer ✕</button></div>';
  right.append(side);
  /* pied de page supprimé le 6 novembre 2026 */
  const dlg=el('dialog',{class:'ak-dialog'}); const toastEl=el('div',{class:'ak-toast'});
  document.body.append(ak,dlg,toastEl);
  A.root=ak; A.extra=$('.ak-extra',tr);
  /* curseur temporel (facultatif) : cfg.curseur = {max:(a)=>…, get:(a)=>…, set:(a,v)=>…} */
  const scrub=$('.ak-scrub',tr);
  if(cfg.curseur){scrub.hidden=false;scrub.oninput=()=>{A.play(false);cfg.curseur.set(A,+scrub.value*cfg.curseur.max(A));A.render()}}
  const syncScrub=()=>{if(!cfg.curseur||document.activeElement===scrub)return;const m=cfg.curseur.max(A)||1;scrub.value=Math.max(0,Math.min(1,cfg.curseur.get(A)/m))};

  /* ---------- couleurs ---------- */
  function readColors(){
    const cs=getComputedStyle(ak), g=v=>cs.getPropertyValue(v).trim();
    const rgb=s=>{s=s.trim();if(s[0]==='#'){if(s.length===4)s='#'+[...s.slice(1)].map(x=>x+x).join('');return[1,3,5].map(i=>parseInt(s.slice(i,i+2),16))}return s.match(/[\d.]+/g).slice(0,3).map(Number)};
    const mix=(a,b,t)=>'rgb('+a.map((v,i)=>Math.round(v*t+b[i]*(1-t))).join(',')+')';
    const dark=root.dataset.theme==='dark', base=rgb(getComputedStyle(root).getPropertyValue('--'+(cfg.partie||'Anthracite')));
    const c=mix(base,base,1), cInk=dark?mix(base,[255,255,255],.5):mix(base,[0,0,0],.7), cSoft=dark?mix(base,rgb(g('--card')),.22):mix(base,rgb(g('--paper')),.1);
    A.C={paper:g('--paper'),card:g('--card'),ink:g('--ink'),ink2:g('--ink2'),rule:g('--rule'),grid:g('--grid'),c,cInk,cSoft,
      v:g('--q-v'),F:g('--q-F'),B:g('--q-B'),E:g('--q-E'),Ec:g('--q-Ec'),Ep:g('--q-Ep'),Em:g('--q-Em'),pred:g('--q-pred'),hot:g('--q-hot'),cold:g('--q-cold'),
      dark:root.dataset.theme==='dark'};
  }

  /* ---------- réglages ---------- */
  const items={}; const groups=[];
  function stepDec(st){const s=String(st);return s.includes('.')?s.split('.')[1].length:0}
  function buildSettings(){
    (cfg.reglages||[]).forEach(gc=>{
      const g=el('div',{class:'ak-card ak-grp'}); const h=el('h4',{},`<span></span>${gc.titre}`); g.append(h);
      groups.push({gc,el:g,h});
      if(gc.presets){const pr=el('div',{class:'ak-presets'});gc.presets.forEach(ps=>{const b=el('button',{class:'mini',title:ps.titre||''},ps.label);b.onclick=()=>A.preset(ps);ps._btn=b;pr.append(b)});g.append(pr)}
      for(const it of gc.items||[]){
        const box=el('div',{class:'ak-item'}); const type=it.type||'range';
        if(type==='range'){
          const dec=it.dec??stepDec(it.step??1);
          box.innerHTML=`<div class="ak-row"><label for="r_${it.id}">${it.label}</label><input class="ak-num" id="n_${it.id}" type="number" step="${it.step??1}" min="${it.min}" max="${it.max}" inputmode="decimal"><span class="ak-unit">${it.unit||''}</span></div><input type="range" id="r_${it.id}" min="${it.log?Math.log10(it.min):it.min}" max="${it.log?Math.log10(it.max):it.max}" step="${it.log?(it.stepLog??.002):(it.step??1)}">`;
          const R=$('input[type=range]',box), N=$('.ak-num',box);

<script>
'use strict';
// q = x pour le ressort ; q = θ pour le pendule. Vitesses algébriques SI.
window.EnergyModel = (() => {

  const w=omega(kind,p),E=energies(kind,p,q0,v0).em,e=kind==='pendulum'?E/(p.m*g*p.l):0;
  const stationary=kind==='pendulum'&&Math.abs(v0)<1e-14&&Math.abs(Math.sin(q0))<1e-14;

      if(p.vel&&vS)o+=hvec(a,px,cy-R-12*k,q.v*vS,0,C.v,'v');
      const fS=55*k/Math.max(1e-9,p.k*Math.max(Math.abs(T.qmin),Math.abs(T.qmax))+p.alpha*T.vmax);
      if(p.frc){o+=hvec(a,px,cy+R+14*k,-p.k*q.q*fS,0,C.F,'F');if(T.fr)o+=hvec(a,px,cy+R+30*k,-p.alpha*q.v*fS,0,C.ink2,'f')}
      geo={kind:'h',cx,sc,cy};
      o+=S.text(10*k,10*k,`${S.v('x')} = ${a.fmt.fix(q.q,2)} m`,{base:'top',size:15,c:C.ink});
    }else{
      const lo=Math.min(0,T.qmin,T.xeq),hi=Math.max(0,T.qmax,T.xeq),L0=Math.max(.5,(hi-lo)*.6),top=18*k,sc=(H-top-R-40*k)/(L0+hi-Math.min(0,lo))*z,cx=Wm*.5,y0=top+L0*sc,py=y0+q.q*sc;
      o+=S.line(cx-40*k,top,cx+40*k,top,{c:C.ink,w:3});for(let j=-36;j<=36;j+=12)o+=S.line(cx+j*k,top,cx+(j-7)*k,top-8*k,{c:C.ink2,w:1.2});
      o+=spring(a,cx,top,cx,py-R,p.k);
      const ref=(y,lab)=>S.line(cx-70*k,y,cx+70*k,y,{c:C.ink2,w:1,dash:`${4*k} ${5*k}`})+S.text(cx+74*k,y,lab,{size:13});
      o+=ref(y0,`${S.v('x')} = 0 (longueur à vide)`)+ref(y0+T.xeq*sc,`${S.v('x','éq')}`);
      o+=S.arrow(cx-90*k,y0-10*k,cx-90*k,y0+40*k,{c:C.ink2,w:1.3})+S.text(cx-96*k,y0+36*k,S.v('x'),{anchor:'end',size:15});
      o+=mass(a,cx,py,R);
      if(p.vel&&vS)o+=hvec(a,cx-R-12*k,py,0,q.v*vS,C.v,'v');
      const fS=55*k/Math.max(1e-9,p.k*Math.max(Math.abs(T.qmin),Math.abs(T.qmax)),p.m*g);
      if(p.frc){o+=hvec(a,cx+R+12*k,py,0,-p.k*q.q*fS,C.F,'T')+hvec(a,cx+R+30*k,py,0,p.m*g*fS,C.F,'P');if(T.fr)o+=hvec(a,cx+R+48*k,py,0,-p.alpha*q.v*fS,C.ink2,'f')}
      geo={kind:'v',cy:y0,sc,cx};
      o+=S.text(10*k,10*k,`${S.v('x')} = ${a.fmt.fix(q.q,2)} m`,{base:'top',size:15,c:C.ink});
    }
  }else{
    const half=cmp(a)?Wm*.55:Wm,cx=half/2,cy=H*.5,r=Math.max(35*k,Math.min(half*.38,(H-60*k)*.42))*z,th=q.q,px=cx+r*Math.sin(th),py=cy+r*Math.cos(th);
    o+=S.circle(cx,cy,r,{c:C.grid,w:1.3,dash:`${3*k} ${6*k}`})+S.line(cx,cy-22*k,cx,cy+r+12*k,{c:C.ink2,w:1,dash:`${5*k} ${5*k}`});
    if(p.harm&&!cmp(a)){const hx=cx+r*Math.sin(q.hq),hy=cy+r*Math.cos(q.hq);o+=S.line(cx,cy,hx,hy,{c:C.pred,w:2,dash:`${6*k} ${5*k}`})+S.circle(hx,hy,R+3*k,{c:C.pred,w:2,dash:`${5*k} ${4*k}`})}
    o+=S.line(cx,cy,px,py,{c:C.ink,w:4})+S.circle(cx,cy,4*k,{fill:C.ink});
    const wr=EM.wrap(th),ar=Math.min(r*.38,34*k);if(Math.abs(wr)>.08){const pts=[];for(let i=0;i<=32;i++)pts.push([cx+ar*Math.sin(wr*i/32),cy+ar*Math.cos(wr*i/32)]);o+=S.poly(pts,{c:C.cInk,w:1.4})+S.text(cx+Math.sin(wr/2)*(ar+14*k),cy+Math.cos(wr/2)*(ar+14*k),S.v('θ'),{anchor:'middle',size:16,c:C.cInk})}
    o+=mass(a,px,py,R);
    const tg=[Math.cos(th),-Math.sin(th)];
    if(p.vel&&vS){o+=hvec(a,px,py,tg[0]*q.v*vS,tg[1]*q.v*vS,C.v,'v')}
    if(p.frc){const fS=55*k/(p.m*g+p.alpha*T.vmax*p.l);const Ft=-p.m*g*Math.sin(th);o+=hvec(a,px,py,tg[0]*Ft*fS,tg[1]*Ft*fS,C.F,'F','t');if(T.fr){const ff=-p.alpha*q.v*p.l;o+=hvec(a,px,py,tg[0]*ff*fS,tg[1]*ff*fS,C.ink2,'f')}}
    o+=S.text(10*k,10*k,`θ = ${a.fmt.fix(th/DEG,1)}°`,{base:'top',size:15,c:C.ink});
    if(!cmp(a))o+=S.text(Wm-10*k,H-10*k,`${S.v('ℓ')} = ${a.fmt.fix(p.l,2)} m`,{anchor:'end',base:'bottom',size:13});
    geo={kind:'p',cx,cy};
    if(cmp(a)){
      o+=S.line(half,10*k,half,H-10*k,{c:C.rule,w:1});
      const x0=half,w=Wm-half,ext=Math.max(.35,Math.abs(T.qmin),Math.abs(T.qmax),Math.abs(T.q0))*1.15,ccx=x0+w*.55,ccy=H*.5,sc=w*.36/ext,hx=ccx+q.hq*sc,wall=x0+12*k;
      o+=S.line(wall,ccy-28*k,wall,ccy+28*k,{c:C.pred,w:3})+spring(a,wall,ccy,hx-R*.8,ccy,10,C.pred,true)+S.circle(hx,ccy,R*.8,{c:C.pred,w:2.2,dash:`${5*k} ${4*k}`});
      o+=S.line(ccx,ccy-32*k,ccx,ccy+R+10*k,{c:C.ink2,w:1,dash:`${4*k} ${5*k}`});
      o+=S.text(x0+10*k,10*k,'Ressort accordé',{base:'top',size:14,c:C.pred})+S.text(x0+10*k,30*k,`${S.v('x')}/${S.v('ℓ')} = ${a.fmt.fix(q.hq,2)}`,{base:'top',size:14,c:C.pred});
      o+=S.text(x0+10*k,H-10*k,`${S.v('k')} = ${S.v('m')}${S.v('g')}/${S.v('ℓ')}`,{base:'bottom',size:13,c:C.pred});
    }
  }
  a.svg('scene',o);
}
function mass(a,x,y,R){const S=a.S,C=a.C,k=a.k;return S.circle(x,y,R,{fill:C.cSoft,c:C.cInk,w:2.4})+S.circle(x,y,3*k,{fill:C.cInk})+`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(R+10*k).toFixed(1)}" fill="transparent" data-mass="1" style="cursor:grab"/>`}
function spring(a,x1,y1,x2,y2,kk,col,thin){
  const S=a.S,k=a.k,L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L,nx=-uy,ny=ux,amp=(thin?6:10)*k,n=24,lead=Math.min(14*k,L*.15),pts=[[x1,y1],[x1+ux*lead,y1+uy*lead]];
  for(let j=1;j<n;j++){const s=lead+(L-2*lead)*j/n,d=(j%2?1:-1)*amp;pts.push([x1+ux*s+nx*d,y1+uy*s+ny*d])}
  pts.push([x2-ux*lead,y2-uy*lead],[x2,y2]);
  return S.poly(pts,{c:col||a.C.cInk,w:thin?1.6:1.4+Math.log2(kk/2+1)*.45});
}
/** vecteur proportionnel issu de (x,y), de composantes (dx,dy) en px, avec symbole fléché */
function hvec(a,x,y,dx,dy,c,l,sub){
  const S=a.S,k=a.k,L=Math.hypot(dx,dy);if(L<1)return'';
  let o=S.arrow(x,y,x+dx,y+dy,{c,w:2.4});
  if(L>12*k){const ux=dx/L,uy=dy/L,lx=x+dx+ux*12*k-(ux<0?14*k:0),ly=y+dy+uy*12*k+(uy>=0?12*k:0)+(Math.abs(uy)<.3?-8*k:0),fs=16*k;
    o+=S.text(lx,ly,S.v(l,sub),{size:16,c})+S.arrow(lx+.02*fs,ly-.62*fs,lx+.62*fs,ly-.62*fs,{c,w:.9,head:4.5*k})}
  return o;
}

/* ---------- graphe ---------- */
let GP=null;
function drawPlot(a,q){
  const P=a.panels.plot,S=a.S,C=a.C,k=a.k,p=a.p,pl=p.plot,PI=Math.PI;
  const head={pot:`Profil ${E('p')}(${pend(a)?'θ':mv('x')}) et niveau ${E('m')}`,ener:'Énergies au cours du temps',phase:'Plan de phase',pow:`Puissances et théorème de la puissance cinétique`}[pl];
  if(P.head._h!==head){P.head.innerHTML=head;P.head._h=head}
  const past=T.pts.filter(r=>r.t<=a.t+1e-12);past.push(q);
  const pk=pend(a),wrap=x=>pk?EM.wrap(x):x;
  const piT={xticks:[-PI,-PI/2,0,PI/2,PI],xfmt:v=>['−π','−π/2','0','π/2','π'][Math.round(v/(PI/2))+2]};
  let o='',G;const box={x:4*k,y:4*k,w:P.w-8*k,h:P.h-8*k};
  let qlo,qhi;if(pk){qlo=-PI;qhi=PI}else{const m=Math.max(.18,Math.abs(T.qmin-T.xeq),Math.abs(T.qmax-T.xeq))*1.25;qlo=T.xeq-m;qhi=T.xeq+m;if(vert(a)){qlo=Math.min(qlo,-.1);qhi=Math.max(qhi,.1)}}
  const qlab=pk?(cmp(a)?`θ ou ${S.v('x')}/${S.v('ℓ')} (rad)`:'θ (rad)'):`${S.v('x')} (m)`;
  const brk=pts=>{const out=[];for(let i=0;i<pts.length;i++){if(i&&pk&&Math.abs(pts[i][0]-pts[i-1][0])>PI)out.push([NaN,NaN]);out.push(pts[i])}return out};
  if(pl==='pot'){
    const Ep=x=>nrj(a,x,0).ep;let y2=Math.max(T.emax,pk?2*p.m*g*p.l:0)*1.15,y1=Math.min(0,T.emin)*1.15;if(y2-y1<1e-6)y2=y1+1;
    G=S.graph({...box,xmin:qlo,xmax:qhi,ymin:y1-(y2-y1)*.04,ymax:y2,xlab:qlab,ylab:'Énergie (J)',...(pk?piT:{})});
    o=G.svg+S.clip('gcl',G);
    const fc=(fn,o2)=>{const pts=[];for(let i=0;i<=400;i++){const x=qlo+(qhi-qlo)*i/400;pts.push([x,fn(x)])}return S.curve(pts,G,o2)};
    if(pk&&(p.harm||cmp(a)))o+=fc(x=>.5*p.m*g*p.l*x*x,{c:C.pred,w:2,dash:`${7*k} ${5*k}`});
    if(vert(a)&&p.comp){o+=fc(x=>.5*p.k*x*x,{c:C.Ep,w:1.5,dash:`${3*k} ${4*k}`})+fc(x=>-p.m*g*x,{c:C.Ep,w:1.5,dash:`${8*k} ${4*k}`})}
    o+=fc(Ep,{c:C.Ep,w:2.6});
    o+=S.line(G.x0,G.Y(q.em),G.x0+G.w,G.Y(q.em),{c:C.Em,w:2,dash:`${9*k} ${5*k}`});
    const X=G.X(wrap(q.q));o+=S.line(X,G.Y(q.ep),X,G.Y(q.em),{c:C.Ec,w:5,cap:'butt'})+S.circle(X,G.Y(q.ep),5*k,{fill:C.Ep});
    if(G.Y(q.ep)-G.Y(q.em)>24*k)o+=S.text(X+10*k,(G.Y(q.ep)+G.Y(q.em))/2,S.v('ℰ','c'),{size:16,c:C.Ec});
    if(pk&&(p.harm||cmp(a))&&Math.abs(q.hq)<=PI)o+=S.circle(G.X(q.hq),G.Y(q.hep),5*k,{fill:C.card,c:C.pred,w:2});
  }else if(pl==='phase'){
    const vm=Math.max(T.vmax,cmp(a)?Math.max(...T.pts.map(r=>Math.abs(r.hv))):0,.1)*1.18;
    G=S.graph({...box,xmin:qlo,xmax:qhi,ymin:-vm,ymax:vm,xlab:qlab,ylab:pk?`${Spt('θ')} (rad·s${S.sup('−1')})`:`${S.v('v')} (m·s${S.sup('−1')})`,...(pk?piT:{})});
    o=G.svg+S.clip('gcl',G);
    if(p.prev){const Ein=T.fr?q.em:T.e0,inert=p.m*(pk?p.l*p.l:1);for(const sg of[1,-1]){const pts=[];for(let i=0;i<=500;i++){const x=qlo+(qhi-qlo)*i/500,d=Ein-nrj(a,x,0).ep;pts.push([x,d>=0?sg*Math.sqrt(2*d/inert):NaN])}o+=S.curve(pts,G,{c:C.Em,w:2,dash:`${7*k} ${5*k}`})}}
    if(cmp(a)||(pk&&p.harm)){o+=S.curve(past.map(r=>[r.hq,r.hv]),G,{c:C.pred,w:2,dash:`${6*k} ${5*k}`});if(Math.abs(q.hq)<=PI)o+=S.circle(G.X(q.hq),G.Y(q.hv),5*k,{fill:C.card,c:C.pred,w:2})}
    o+=S.curve(brk(past.map(r=>[wrap(r.q),r.v])),G,{c:C.cInk,w:2.4})+S.circle(G.X(wrap(q.q)),G.Y(q.v),5.5*k,{fill:C.cInk});
  }else if(pl==='ener'){
    let y2=T.emax*1.12,y1=Math.min(0,T.emin)*1.12;if(cmp(a))y2=Math.max(y2,...T.pts.map(r=>r.hem*1.12));if(y2-y1<1e-6)y2=y1+1;
    G=S.graph({...box,xmin:0,xmax:T.dur,ymin:y1,ymax:y2,xlab:`${S.v('t')} (s)`,ylab:'Énergie (J)'});
    o=G.svg+S.clip('gcl',G);
    if(cmp(a)||(pk&&p.harm))for(const[key,c]of[['hep',C.Ep],['hec',C.Ec],['hem',C.Em]])o+=S.curve(past.map(r=>[r.t,r[key]]),G,{c,w:1.6,dash:`${3*k} ${5*k}`,op:.75});
    for(const[key,c,w]of[['ep',C.Ep,2.6],['ec',C.Ec,2.6],['em',C.Em,2.2]])o+=S.curve(past.map(r=>[r.t,r[key]]),G,{c,w});
  }else{
    // puissances : 𝒫 = F·v pour chaque force ; dℰc/dt calculée par différences finies de la table
    const pw=r=>{if(pk){const vt=p.l*r.v;return{a:-p.m*g*Math.sin(r.q)*vt,b:0,f:-p.alpha*vt*vt}}return{a:-p.k*r.q*r.v,b:vert(a)?p.m*g*r.v:0,f:-p.alpha*r.v*r.v}};
    let ym=1e-9;for(const r of T.pts){const w=pw(r);ym=Math.max(ym,Math.abs(w.a),Math.abs(w.b),Math.abs(w.f),Math.abs(w.a+w.b+w.f))}ym*=1.12;
    G=S.graph({...box,xmin:0,xmax:T.dur,ymin:-ym,ymax:ym,xlab:`${S.v('t')} (s)`,ylab:'Puissance (W)'});
    o=G.svg+S.clip('gcl',G);
    const cv=(fn,o2)=>S.curve(past.map(r=>[r.t,fn(r)]),G,o2);
    o+=cv(r=>pw(r).a,{c:C.F,w:2});if(vert(a))o+=cv(r=>pw(r).b,{c:C.Ep,w:2});if(T.fr)o+=cv(r=>pw(r).f,{c:C.ink2,w:2});
    o+=cv(r=>{const w=pw(r);return w.a+w.b+w.f},{c:C.cInk,w:3});
    const dt=T.pts[1].t;let dots='';for(let i=1;i<T.pts.length-1;i+=24){const r=T.pts[i];if(r.t>a.t)break;const d=(T.pts[i+1].ec-T.pts[i-1].ec)/(2*dt);const y=G.Y(d);if(y>=G.y0&&y<=G.y0+G.h)dots+=S.circle(G.X(r.t),y,2.6*k,{fill:C.Ec})}
    o+=dots;
  }
  if(pl==='ener'||pl==='pow'){const x=G.X(a.t);o+=S.line(x,G.y0,x,G.y0+G.h,{c:C.ink2,w:1,dash:`${3*k} ${4*k}`})}
  GP={G,time:pl==='ener'||pl==='pow'};
  a.svg('plot',o);
}
function Spt(s){return`<tspan font-family='${AnimKit.MATH}' font-style="italic">${s}</tspan><tspan dx="-0.44em" dy="-0.1em">˙</tspan><tspan dy="0.1em" dx="0.1em">​</tspan>`}

/* ---------- interactions ---------- */
let dg=false;
A.drag('scene',{
  hit:(x,y,e)=>!!(e.target.closest&&e.target.closest('[data-mass]')),
  start(){A.play(false);A.t=0;dg=true},
  move(x,y){if(!geo)return;
    if(geo.kind==='h')A.set('x0',+Math.max(-.8,Math.min(.8,(x-geo.cx)/geo.sc)).toFixed(3),{silent:true});
    else if(geo.kind==='v')A.set('x0',+Math.max(-.8,Math.min(2.5,(y-geo.cy)/geo.sc)).toFixed(3),{silent:true});
    else A.set('th0',Math.round(Math.atan2(x-geo.cx,y-geo.cy)/DEG),{silent:true});
    A.t=0;build(A)},
  end(){dg=false}
});
A.drag('plot',{
  hit:x=>GP&&GP.time&&x>=GP.G.x0-4&&x<=GP.G.x0+GP.G.w+4,
  start(x){A.play(false);A.t=Math.max(0,Math.min(T.dur,GP.G.xv(x)))},
  move(x){A.t=Math.max(0,Math.min(T.dur,GP.G.xv(Math.max(GP.G.x0,Math.min(GP.G.x0+GP.G.w,x)))))}
});

</script>
