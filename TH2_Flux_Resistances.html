/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e<-3||e>=6){const m=x/10**e;return (+m.toFixed(n-1)).toFixed(n-1).replace('-',MINUS)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>'}
    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));

};

function niceStep(range,n){

}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}
function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);

      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();

        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});

      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});

  side.addEventListener('scroll',()=>{const now=performance.now();if(side.scrollTop===0&&sideTop>0&&now-userAt>400){side.scrollTop=sideTop;return}sideTop=side.scrollTop});

  const setH=(e,v)=>{if(e.hidden!==v)e.hidden=v};
  const setHTML=(e,v)=>{if(e._h!==v){e.innerHTML=v;e._h=v}};
  function refreshSettings(){
    const st=side.scrollTop; let num=0;
    for(const g of groups){const v=vis(g.gc);setH(g.el,!v);if(v){num++;const t=String(num).padStart(2,'0');if(g.h.firstChild.textContent!==t)g.h.firstChild.textContent=t}
      for(const ps of g.gc.presets||[])setH(ps._btn,!vis(ps));
      for(const it of g.gc.items||[])if(it._box){setH(it._box,!vis(it));if(it.type==='note'&&typeof it.html==='function')setHTML(it._box.firstChild,it.html(A))}}
    for(const id in items){const I=items[id];if(I._last!==A.p[id]){I.show(A.p[id]);I._last=A.p[id]}}
    for(const P of Object.values(A.panels))setH(P.el,!vis(P.cfg));
    const showT=typeof cfg.temps==='function'?cfg.temps(A):!!cfg.temps; setH(tr,!showT); if(!showT&&A.running)A.play(false);
    if(side.scrollTop!==st)side.scrollTop=st;
    requestAnimationFrame(()=>{if(side.scrollTop===0&&st>0)side.scrollTop=st});
  }
  A.refresh=refreshSettings;
  A.set=(id,v,{silent=false}={})=>{A.p[id]=v;if(items[id]){items[id].show(v);items[id]._last=v}if(!silent&&cfg.change)cfg.change(A,id,v);refreshSettings();A.render()};
  A.preset=ps=>{
    A.play(false);A.cadrerTout();
    for(const[k,v]of Object.entries(ps.valeurs||{})){A.p[k]=v;if(cfg.change)cfg.change(A,k,v)}
    clearActivePresets();
    if(ps._btn){ps._btn.classList.add('is-active');ps._btn.setAttribute('aria-pressed','true')}
    refreshSettings();A.reset();if(ps.action)ps.action(A);if(ps.lecture)A.play(true);A.render();
  };
  A.enable=(id,on)=>{const b=document.getElementById('b_'+id);if(b)b.disabled=!on};

  /* ---------- affichages ---------- */
  const metricsCount=$('.ak-metrics-count',metricsWrap);
  A.metrics=arr=>{
    const L=(arr||[]).filter(Boolean),hh=L.some(m=>m.hint);
    metrics.classList.toggle('has-h',hh);
    metricsWrap.classList.toggle('has-items',L.length>0);
    ak.classList.toggle('ak-has-metrics',L.length>0);
    if(metricsCount.textContent!==String(L.length))metricsCount.textContent=String(L.length);
    const html=L.map((m,i)=>`<div class="ak-metric${m.warn?' warn':''}${expandedMetrics.has(String(i))?' is-expanded':''}" data-idx="${i}" title="Cliquer pour développer / réduire"><div class="k">${m.label}</div><div class="v">${m.value}${m.unit?(m.unit==='°'?'°':`<span class="u">${m.unit}</span>`):''}</div>${m.hint?`<div class="h">${m.hint}</div>`:''}</div>`).join('');
    if(metrics._h!==html){metrics.innerHTML=html;metrics._h=html}
  };
  A.insight=()=>{};
  A.legend=arr=>{const html=(arr||[]).filter(Boolean).map(l=>`<span><i class="${l.dash?'dash':l.dot?'dot':''}" style="background:${l.c};--lc:${l.c}"></i>${l.label}</span>`).join('');if(legend._h!==html){legend.innerHTML=html;legend._h=html}};
  A.clock=html=>{const c=$('.ak-clock',tr);if(c._h!==html){c.innerHTML=html;c._h=html}};
  A.toast=m=>{toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastEl._h);toastEl._h=setTimeout(()=>toastEl.classList.remove('show'),1800)};
  A.panelVisible=id=>!A.panels[id].el.hidden;

  /* ---------- tailles ---------- */
  function viewBox(P){
    const {w,h,vx,vy,vz}=P;
    P.node.setAttribute('viewBox',P.vue==='svg'?`${vx.toFixed(2)} ${vy.toFixed(2)} ${(w/vz).toFixed(2)} ${(h/vz).toFixed(2)}`:`0 0 ${w.toFixed(1)} ${h.toFixed(1)}`);
  }
  function measure(){
    A.narrow=ak.clientWidth<=640; ak.style.setProperty('--ak-top',(top.offsetHeight+(tabs?tabs.offsetHeight:0))+'px');
    if(A.narrow){if(metricsWrap.parentNode!==right||right.lastElementChild!==metricsWrap)right.append(metricsWrap)}
    else{if(metricsWrap.parentNode!==right||right.firstElementChild!==metricsWrap)right.insertBefore(metricsWrap,side)}
    A.k=ak.classList.contains('is-proj')?1.6:A.narrow?1:1.15;
    for(const P of Object.values(A.panels)){
      if(P.el.hidden)continue;
      if(A.narrow){const w=P.el.clientWidth||ak.clientWidth;P.node.style.height=Math.round(w*(P.cfg.ratioTel??.8))+'px'}else P.node.style.height='';
      const r=P.node.getBoundingClientRect(); P.w=Math.max(50,r.width); P.h=Math.max(50,r.height);
      if(P.type==='canvas'){const d=window.devicePixelRatio||1;if(P.node.width!==Math.round(P.w*d)||P.node.height!==Math.round(P.h*d)){P.node.width=Math.round(P.w*d);P.node.height=Math.round(P.h*d)}P.ctx=P.node.getContext('2d');P.ctx.setTransform(d,0,0,d,0,0)}
      else viewBox(P);
    }
  }
  /* ---------- rendu ---------- */
  let graphPanels=[];
  const activeChartView=P=>P?.vue==='graphe'&&zoomed(P)?P:null;
  function drawFrame(){
    const frame={graphs:[],views:graphPanels.map(activeChartView),outputs:new Map()};
    A._graphFrame=frame;
    try{cfg.draw?.(A)}finally{A._graphFrame=null}
    graphPanels=[];
    for(const [P,output] of frame.outputs){
      const graphs=[...output.html.matchAll(/<g data-ak-graph="(\d+)">/g)].map(m=>frame.graphs[+m[1]]).filter(Boolean);
      output.graphs=graphs;
      if(P.vue==='svg'||P.vue==='graphe'){
        const vue=graphs.length?'graphe':'svg';
        if(vue!==P.vue){P.vue=vue;resetView(P);viewBox(P)}
        P.graphs=graphs;
      }
      const view=activeChartView(P);
      for(const graph of graphs){
        graphPanels[graph.id]=P;
        if(graph.view!==view)frame.changed=true;
      }
    }
    return frame;
  }
  function clipCharts(node,graphs){
    const svgElement=tag=>document.createElementNS(node.namespaceURI,tag);
    for(const graph of graphs){
      const axes=node.querySelector(`[data-ak-graph="${graph.id}"]`);
      if(!axes)continue;
      const id='ak-cadre-'+graph.id, defs=svgElement('defs'),clip=svgElement('clipPath'),rect=svgElement('rect');
      clip.id=id;
      for(const [k,v] of Object.entries({x:graph.x0,y:graph.y0,width:graph.w,height:graph.h}))rect.setAttribute(k,v);
      clip.append(rect);defs.append(clip);axes.append(defs);
      let layer=null;
      for(let next=axes.nextElementSibling;next&&!next.hasAttribute('data-ak-graph');){
        const child=next;next=child.nextElementSibling;
        if(child.localName==='defs'||child.hasAttribute('data-ak-hors-graphe')){layer=null;continue}
        if(!layer){
          layer=svgElement('g');
          layer.setAttribute('clip-path',`url(#${id})`);
          child.before(layer);
        }
        layer.append(child);
      }
    }
  }
  function writeSvg(P,html,graphs=[]){
    if(P.node._h===html)return;
    P.node.innerHTML=html;
    P.node._h=html;
    if(activeChartView(P))clipCharts(P.node,graphs);
  }
  A.renderNow=()=>{
    A._dirty=false;measure();
    let frame=drawFrame();
    if(frame.changed)frame=drawFrame();
    for(const [P,output] of frame.outputs)writeSvg(P,output.html,output.graphs);
    syncScrub();guardScroll();
  };
  A.render=()=>{if(A._dirty)return;A._dirty=true;requestAnimationFrame(()=>{if(A._dirty)A.renderNow()})};
  A.svg=(id,html)=>{
    const P=A.panels[id];if(!P)return;
    if(A._graphFrame)A._graphFrame.outputs.set(P,{html});
    else writeSvg(P,html);
  };

  /* ---------- temps ---------- */
  let last=0;
  const playBtn=$('.ak-play',tr);
  A.play=on=>{on=on===undefined?!A.running:on;if(on&&cfg.peutLire&&!cfg.peutLire(A))on=false;A.running=on;playBtn.textContent=on?'❚❚ Pause':'▶ Lecture';if(on){last=performance.now();requestAnimationFrame(loop)}};
  function loop(now){if(!A.running)return;const dt=Math.min(.05,(now-last)/1000)*A.speed;last=now;if(cfg.step)cfg.step(A,dt);A.renderNow();requestAnimationFrame(loop)}
  A.stepOnce=()=>{A.play(false);if(cfg.step)cfg.step(A,cfg.pas??1/24);A.render()};
  A.reset=()=>{A.play(false);A.t=0;if(cfg.reset)cfg.reset(A);A.render()};
  $('.ak-speed',tr).onchange=e=>{A.speed=+e.target.value};A.speed=cfg.vitesse||1;

  /* ---------- onglets ---------- */
  A.setTab=i=>{if(!tabs||i<0||i>=cfg.onglets.length)return;A.tab=i;A.cadrerTout();clearActivePresets();$$('.ak-tab',tabs).forEach((b,j)=>b.setAttribute('aria-selected',String(j===i)));if(cfg.onglet)cfg.onglet(A,i);refreshSettings();A.render()};

  /* ---------- thème, projection, plein écran ---------- */
  A.setTheme=t=>{root.dataset.theme=t;writeStore(THEME_KEY,t);readColors();syncMenu();A.renderNow()};
  A.setProj=on=>{
    ak.classList.toggle('is-proj',on);
    ak.classList.remove('drawer-open');
    projButton.classList.toggle('on',on);
    syncMenu();
    A.render();
  };
  const acts={
    play:()=>A.play(),step:()=>A.stepOnce(),reset:()=>A.reset(),
    help:()=>{dlg.showModal()},theme:()=>A.setTheme(root.dataset.theme==='dark'?'light':'dark'),
    image:()=>A.exportImage(),proj:()=>{
      const projected=ak.classList.contains('is-proj');
      A.setProj(!projected);
      if(cfg.menuCommun&&projected&&A.narrow)ak.classList.add('drawer-open');
    },
    fs:()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>A.toast('Plein écran refusé par le navigateur'))},
    settings:()=>{ak.classList.toggle('drawer-open');A.render()}
  };
  ak.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&acts[b.dataset.act])acts[b.dataset.act]()});
  addEventListener('keydown',e=>{
    if(dlg.open||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.target.matches('input,select,textarea'))return;
    const k=e.key.toLowerCase(), custom=cfg.touches&&cfg.touches[k];
    if(custom){e.preventDefault();custom(A);A.render();return}
    if(k===' '&&!tr.hidden){e.preventDefault();acts.play()}
    else if(k==='arrowright'&&!tr.hidden){e.preventDefault();acts.step()}
    else if(k==='r'&&!tr.hidden)acts.reset();
    else if(k==='h'||k==='?')acts.help();else if(k==='p')acts.proj();else if(k==='f')acts.fs();else if(k==='t')acts.theme();else if(k==='i')acts.image();
    else if(k==='+'||k==='='||k==='-'||k==='0'){const P=(A._hover&&!A._hover.el.hidden&&A._hover.vue)?A._hover:Object.values(A.panels).find(q=>q.vue&&!q.el.hidden);if(P){e.preventDefault();if(k==='0')A.cadrer(P);else A.zoomer(P,k==='-'?.8:1.25)}}
    else if(k==='escape'){ak.classList.remove('drawer-open');A.render()}
    else if(/^[1-9]$/.test(k))A.setTab(+k-1);
  });

  /* ---------- vue : zoom, cadrage, déplacement ---------- */
  const deplacable=P=>P.vue==='svg'||P.vue==='graphe';
  function zoomed(P){
    if(P.vue==='interne')return Math.abs(P.zoom-1)>1e-6;
    if(!deplacable(P))return false;
    const seuil=P.vue==='graphe'?1e-6:.5;
    return Math.abs(P.vz-1)>1e-6||Math.abs(P.vx)>seuil||Math.abs(P.vy)>seuil;
  }
  const markZoom=P=>{if(P.tools)P.tools.classList.toggle('is-zoomed',zoomed(P))};
  const graphAt=(P,x,y)=>P.graphs.find(g=>x>=g.x0&&x<=g.x0+g.w&&y>=g.y0&&y<=g.y0+g.h);
  function resetView(P){P.vz=1;P.vx=P.vy=0;P.zoom=1;P.panX=P.panY=0;markZoom(P)}
  A.zoomer=(P,f,px,py)=>{if(typeof P==='string')P=A.panels[P];if(!P||!P.vue)return;
    if(P.vue==='interne')P.zoom=Math.max(.4,Math.min(5,P.zoom*f));
    else{
      if(P.vue==='graphe'){
        const graph=graphAt(P,px,py);
        px=graph?(px-graph.x0)/graph.w:.5;
        py=graph?(py-graph.y0)/graph.h:.5;
      }else{px=px??P.w/2;py=py??P.h/2}
      const z=Math.max(.5,Math.min(8,P.vz*f)), delta=1/P.vz-1/z;
      P.vx+=px*delta;P.vy+=py*delta;P.vz=z;
    }
    markZoom(P);A.render()};
  A.deplacer=(P,dx,dy,px,py)=>{
    if(!deplacable(P))return;
    if(P.vue==='graphe'){const g=graphAt(P,px,py)||P.graphs[0];dx/=g.w;dy/=g.h}
    P.vx-=dx/P.vz;P.vy-=dy/P.vz;markZoom(P);A.render()
  };
  A.cadrer=P=>{if(typeof P==='string')P=A.panels[P];if(!P)return;resetView(P);A.render()};
  A.cadrerTout=()=>{for(const P of Object.values(A.panels))A.cadrer(P)};

  function wire(P){const N=P.node,pts=new Map();let mode=null,h=null,last=null,pin=null;
    const scr=e=>{const r=N.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    const toV=s=>P.vue==='svg'?[P.vx+s[0]/P.vz,P.vy+s[1]/P.vz]:s;
    const two=()=>{const[a,b]=[...pts.values()];return{d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,c:[(a[0]+b[0])/2,(a[1]+b[1])/2]}};
    N.addEventListener('pointerdown',e=>{
      const s=scr(e);A._hover=P;pts.set(e.pointerId,s);
      if(pts.size===2&&P.vue){if(mode==='drag'&&h&&h.end)h.end(e);mode='pinch';h=null;pin=two();N.setPointerCapture(e.pointerId);e.preventDefault();return}
      if(pts.size>1)return;
      const[x,y]=toV(s);
      if(deplacable(P)&&(e.shiftKey||e.button===1))mode='pan';
      else{h=P._drags.find(d=>!d.hit||d.hit(x,y,e))||null;
        if(h){mode='drag';if(h.start)h.start(x,y,e)}
        else if(deplacable(P)&&zoomed(P))mode='pan';
        else{mode=null;return}}
      last=s;N.setPointerCapture(e.pointerId);e.preventDefault();A.render()});
    N.addEventListener('pointermove',e=>{const s=scr(e);
      if(!pts.has(e.pointerId)){if(e.pointerType==='mouse'){const[x,y]=toV(s);N.style.cursor=P._drags.some(d=>d.hit&&d.hit(x,y,e))?'grab':(deplacable(P)&&(e.shiftKey||zoomed(P)))?'move':''}return}
      pts.set(e.pointerId,s);
      if(mode==='pinch'&&pts.size>=2){const q=two();A.zoomer(P,q.d/pin.d,q.c[0],q.c[1]);A.deplacer(P,q.c[0]-pin.c[0],q.c[1]-pin.c[1],q.c[0],q.c[1]);pin=q;return}
      if(mode==='pan'){A.deplacer(P,s[0]-last[0],s[1]-last[1],last[0],last[1]);last=s;return}
      if(mode==='drag'&&h){const[x,y]=toV(s);h.move(x,y,e);A.render()}});
    const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
      if(mode==='drag'&&h&&h.end)h.end(e);
      if(pts.size===0){mode=null;h=null}else if(mode==='pinch'){mode='pan';last=[...pts.values()][0]}
      A.render()};
    N.addEventListener('pointerup',end);N.addEventListener('pointercancel',end);
    if(P.vue){
      N.addEventListener('wheel',e=>{if(A.narrow&&!e.ctrlKey)return;e.preventDefault();const s=scr(e);A.zoomer(P,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),s[0],s[1])},{passive:false});
      N.addEventListener('dblclick',e=>{const[x,y]=toV(scr(e));if(!P._drags.some(d=>d.hit&&d.hit(x,y,e))&&zoomed(P))A.cadrer(P)});
      N.addEventListener('pointerenter',()=>{A._hover=P});
    }
  }
  for(const P of Object.values(A.panels))wire(P);
  A.drag=(id,h)=>{A.panels[id]._drags.push(h)};

  /* ---------- export image (toujours en thème clair) ---------- */
  A.exportImage=async()=>{
    const was=root.dataset.theme; root.dataset.theme='light'; readColors(); A.renderNow();
    const vis=Object.values(A.panels).filter(P=>!P.el.hidden), base=pwrap.getBoundingClientRect(), sc=2;
    const cv=document.createElement('canvas'); cv.width=Math.round(base.width*sc); cv.height=Math.round(base.height*sc);
    const ctx=cv.getContext('2d'); ctx.fillStyle=A.C.card; ctx.fillRect(0,0,cv.width,cv.height);
    const jobs=vis.map(P=>new Promise(res=>{const r=P.node.getBoundingClientRect(), x=(r.left-base.left)*sc, y=(r.top-base.top)*sc;
      if(P.type==='canvas'){ctx.drawImage(P.node,x,y,r.width*sc,r.height*sc);res();return}
      const clone=P.node.cloneNode(true); clone.setAttribute('width',r.width); clone.setAttribute('height',r.height);
      const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
      const im=new Image(); im.onload=()=>{ctx.drawImage(im,x,y,r.width*sc,r.height*sc);res()}; im.onerror=()=>res(); im.src=src;}));
    await Promise.all(jobs);
    root.dataset.theme=was; readColors(); A.renderNow();
    const a=document.createElement('a'); const tabName=cfg.onglets&&cfg.onglets.length>1?'_'+(A.tab+1):'';
    a.download=`${cfg.code}_${(cfg.fichier||cfg.titre).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_')}${tabName}.png`;
    a.href=cv.toDataURL('image/png'); a.click(); A.toast('Image enregistrée (thème clair)');
  };

  /* ---------- aide ---------- */
  function buildHelp(){
    const h=cfg.aide||{}, sec=(t,c)=>c?`<h4>${t}</h4>${/^\s*</.test(c)?c:`<p>${c}</p>`}`:'';
    dlg.innerHTML=`<header><h3>Aide · ${cfg.titre}</h3><button class="mini" data-close>Fermer ✕</button></header><div class="db">
    ${cfg.sousTitre?`<p class="ak-dlg-sub">${cfg.sousTitre}</p>`:''}${sec('Ce qu\'on voit',h.voit)}${sec('Ce qu\'on peut faire',h.faire)}${sec('Modèle et hypothèses',h.modele)}${sec('Lien avec le cours',h.cours)}${sec('Pour aller plus loin',h.plus)}
    <h4>Raccourcis</h4><p>${cfg.temps?'<kbd>Espace</kbd> lecture / pause · <kbd>→</kbd> pas à pas · <kbd>R</kbd> recommencer · ':''}${tabs?`<kbd>1</kbd>–<kbd>${cfg.onglets.length}</kbd> onglets · `:''}<kbd>P</kbd> projection · <kbd>F</kbd> plein écran · <kbd>T</kbd> thème · <kbd>I</kbd> image · <kbd>H</kbd> aide${h.touches?' · '+h.touches:''}</p>
    <p>Vue : molette, pincement ou <kbd>+</kbd> <kbd>−</kbd> pour zoomer · <kbd>Maj</kbd> + glisser, deux doigts, ou glisser une vue zoomée pour la déplacer · « Cadrer », <kbd>0</kbd> ou double clic : vue initiale · Double-clic sur un curseur : valeur par défaut.</p>
    ${h.credits?`<h4>Crédits</h4><p>${h.credits}</p>`:''}</div>`;
    dlg.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===dlg)dlg.close()});
  }

  /* ---------- démarrage ---------- */
  buildSettings(); buildHelp(); readColors();
  if(cfg.init)cfg.init(A);
  refreshSettings(); A.reset();
  new ResizeObserver(()=>A.render()).observe(ak);
  return A;
}

window.AnimKit={app,fmt,M,ticks,niceStep,FONT,MATH,interrupteur};
})();

</script>
<script>
'use strict';

const TH2 = (() => {
  const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));
  const points = (a, b, n, f) => Array.from({length: n + 1}, (_, i) => {
    const x = a + (b - a) * i / n;
    return [x, f(x)];
  });
  const range = (id, label, min, max, step, value, unit = '', options = {}) =>
    ({id, label, min, max, step, value, unit, ...options});
  const select = (id, label, value, options, extra = {}) =>
    ({id, label, value, options, type: 'select', ...extra});

  function time(a, seconds) {
    if (seconds === 0) return '0 s';
    const [scale, unit] = seconds < 120 ? [1, 's']
      : seconds < 7200 ? [60, 'min'] : seconds < 172800 ? [3600, 'h'] : [86400, 'j'];
    return a.fmt.sig(seconds / scale, 3) + ' ' + unit;
  }

  function limits(min, max) {
    const pad = Math.max(.8, (max - min) * .085);
    return [min - pad, max + pad];
  }

  const colorStops = {
    viridis: ['#471365', '#472d7b', '#404588', '#375a8c', '#2e6e8e', '#27808e', '#20928c', '#21a585', '#34b679', '#58c765', '#86d549', '#b8de29', '#ece51b'],
    inferno: ['#2b0b57', '#490b6a', '#64156e', '#7d1e6d', '#982766', '#b3325a', '#cb4149', '#e05536', '#ef6e21', '#f98b0b', '#fca80d', '#f9c932', '#f2ea69'],
    cividis: ['#003070', '#263d6e', '#3d4a6c', '#50576c', '#61656f', '#727274', '#828079', '#948e77', '#a79d73', '#bbad6d', '#cfbd62', '#e4ce53', '#f9e03a'],
    blueAmber: ['#174b83', '#3b78a2', '#80adc2', '#c0d5d9', '#eee5cc', '#edcb91', '#d7954f', '#b26324', '#843c1c']
  };

  const palettes = Object.fromEntries(Object.entries(colorStops).map(([id, colors]) =>
    [id, colors.map(color => [1, 3, 5].map(offset => parseInt(color.slice(offset, offset + 2), 16)))]));
  const paletteControl = select('palette', 'Palette de température', 'viridis', [
    ['viridis', 'Viridis · indigo, vert, jaune'],
    ['inferno', 'Inferno · pourpre, orange, ivoire'],
    ['cividis', 'Cividis · bleu ardoise, or'],
    ['blueAmber', 'Bleu–ambre']
  ]);

  function rgbTemperature(position, palette = 'viridis') {
    const colors = palettes[palette];
    const t = clamp(position) * (colors.length - 1);
    const i = Math.min(Math.floor(t), colors.length - 2);
    return colors[i].map((v, j) => Math.round(v + (colors[i + 1][j] - v) * (t - i)));
  }

  function temperatureColor(a, value, min, max) {
    const ratio = max > min ? (value - min) / (max - min) : .5;
    return 'rgb(' + rgbTemperature(ratio, a.p.palette).join(',') + ')';
  }

  function thermalStrip(a, id, x, y, width, height, sample, min, max, segments = 64) {
    let stops = '';
    for (let i = 0; i <= segments; i++) {
      const u = i / segments;
      stops += '<stop offset="' + u + '" stop-color="' + temperatureColor(a, sample(u), min, max) + '"/>';
    }
    return '<defs><linearGradient id="' + id + '">' + stops + '</linearGradient></defs>' +
      a.S.rect(x, y, width, height, {c: a.C.rule, fill: 'url(#' + id + ')'});
  }

  function exportNumber(a, value) {
    const html = a.fmt.sig(value, 3);
    return html.replace(/<sup>(.*?)<\/sup>/g, (_, digits) =>
      [...digits].map(digit => '⁰¹²³⁴⁵⁶⁷⁸⁹⁻'['0123456789−'.indexOf(digit)]).join(''));
  }

  function readings(a) {
    a.root.classList.add('th2-animation');
    const row = document.createElement('dl');
    row.className = 'th2-readings';
    row.setAttribute('aria-label', 'Grandeurs affichées');
    a.root.querySelector('.ak-legend').before(row);
    let last;
    return values => {
      const html = values.map(([label, value]) => '<div><dt>' + label + '</dt><dd>' + value + '</dd></div>').join('');
      if (html !== last) row.innerHTML = last = html;
    };
  }

  function graph(a, id, xMin, xMax, yMin, yMax, xLab, yLab, options = {}) {
    const panel = a.panels[id];
    return a.S.graph({x: 7, y: 8 * a.k, w: panel.w - 20, h: panel.h - 13 * a.k,
      xmin: xMin, xmax: xMax, ymin: yMin, ymax: yMax, xlab: xLab, ylab: yLab, ...options});
  }

  function dragHorizontal(a, panel, handle, onMove) {
    a.drag(panel, {
      hit: (x, y, event) => event.target.getAttribute('data-hit') === handle,
      move: onMove
    });
  }

  return {clamp, points, range, select, time, limits, paletteControl, rgbTemperature, temperatureColor, thermalStrip, exportNumber, readings, graph, dragHorizontal};
})();

'use strict';

const TH2Stationnaire = (() => {
  function geometry({g, inner, L, section, conductivity, pV, tLeft, tRight, full}) {
    const power = g === 'plan' ? 0 : g === 'cylinder' ? 1 : 2;
    const solid = power > 0 && full;
    const a = !power || solid ? 0 : inner;
    const b = a + L;
    const factor = power === 0 ? section : power === 1 ? 2 * Math.PI * section : 4 * Math.PI;
    const area = r => factor * (power === 0 ? 1 : r ** power);
    const volume = r => factor * (r ** (power + 1) - a ** (power + 1)) / (power + 1);
    // primitive de 1 / r^m, avec origine en a
    const integral = r => {
      if (power === 0) return r - a;
      if (power === 1) return Math.log(r / a);
      return 1 / a - 1 / r;
    };
    const productionOffset = pV * a ** (power + 1) / (power + 1);
    const rise = r => pV * (r ** 2 - a ** 2) / (2 * (power + 1));
    const fluxBase = solid ? 0 : factor * ((conductivity * (tLeft - tRight) - rise(b)) / integral(b) + productionOffset);
    const flux = r => fluxBase + pV * volume(r);
    const density = r => r === 0 && solid ? 0 : flux(r) / area(r);
    const temp = r => solid ? tRight + pV * (b ** 2 - r ** 2) / (2 * conductivity * (power + 1))
      : tLeft - ((fluxBase / factor - productionOffset) * integral(r) + rise(r)) / conductivity;
    return {a, b, power, solid, area, volume, flux, density, temp, slope: r => -density(r) / conductivity};
  }

  function branch(layers, area, hot, cold, hLeft = 0, hRight = 0) {
    const resistances = layers.map(layer => layer.length / (layer.conductivity * area));
    const left = hLeft ? 1 / (hLeft * area) : 0;
    const right = hRight ? 1 / (hRight * area) : 0;
    const resistance = resistances.reduce((sum, r) => sum + r, left + right);
    const flux = (hot - cold) / resistance;
    const parts = [];
    let x = 0;
    let temperature = hot - left * flux;
    for (let i = 0; i < layers.length; i++) {
      const from = temperature;
      temperature -= resistances[i] * flux;
      const end = x + layers[i].length;
      parts.push({x, end, from, to: temperature, resistance: resistances[i]});
      x = end;
    }
    const sample = x => {
      const layer = parts.find(part => x < part.end - 1e-9) || parts[parts.length - 1];
      const f = TH2.clamp((x - layer.x) / (layer.end - layer.x));
      return {temperature: layer.from + f * (layer.to - layer.from), layer};
    };
    return {parts, length: x, left, right, hot, cold, resistance, flux, area, sample};
  }

  function jacket({radius, thickness, conductivity, h, hot, air}) {
    const outer = radius + thickness;
    const conduction = Math.log1p(thickness / radius) / (2 * Math.PI * conductivity);
    const exchange = 1 / (h * 2 * Math.PI * outer);
    const flux = (hot - air) / (conduction + exchange);
    return {outer, conduction, exchange, flux, surface: air + flux * exchange, critical: conductivity / h};
  }

  return {geometry, branch, jacket};
})();

    draw(a) {
      if (a.tab === 0) drawGeometry(a);
      else if (a.tab === 1) drawWall(a);
      else drawJacket(a);
    }
  });

  function handle(a, x, y, label, color, hit) {
    const {S, C, k} = a;
    return S.circle(x, y, 10.5 * k, {fill: color, c: C.card, w: 1.6, hit}) +
      '<g pointer-events="none">' + text(a, x, y, label, {c: C.card, halo: false,
        anchor: 'middle', weight: 750, size: 10}) + '</g>';
  }

  function drawGeometry(a) {
    const {p, S, C, k} = a;
    const model = geometry({g: p.g, inner: p.inner / 100, L: p.L / 100,
      section: p.g === 'cylinder' ? p.height : p.section, conductivity: p.geoLambda,
      pV: p.production ? p.pV : 0, tLeft: p.tLeft, tRight: p.tRight, full: p.full});
    const width = model.b - model.a;
    const r = [p.first, p.second].map(value => model.a + width * value / 100);
    const meas = r.map(x => [model.area(x), model.density(x), model.flux(x)]);
    const colors = [C.cInk, C.B];
    const curve = points(model.a, model.b, 120, model.temp);
    const temperatures = curve.map(point => point[1]);
    const min = Math.min(...temperatures), max = Math.max(...temperatures);
    const [low, high] = limits(min, max);
    const axis = model.power ? 'r' : 'x';
    const G = graph(a, 'temperature', 100 * model.a, 100 * model.b, low, high, axis + ' (cm)', 'T (°C)');
    profileUnit = x => (G.xv(x) / 100 - model.a) / width;
    let s = G.svg + S.clip('th2-control-profile', G);
    s += plot(a, curve.map(([x, y]) => [100 * x, y]), G, C.ink);
    const x = r[activeProbe];
    const slope = model.slope(x), span = .16 * width;
    const tangent = x1 => model.temp(x) + slope * (x1 - x);
    s += plot(a, points(Math.max(model.a, x - span), Math.min(model.b, x + span), 1, tangent)
      .map(([x1, y]) => [100 * x1, y]), G, colors[activeProbe], true);
    for (let i = 0; i < 2; i++) {
      const px = G.X(100 * r[i]), py = G.Y(model.temp(r[i]));
      s += S.line(px, G.y0, px, G.y0 + G.h, {c: colors[i], dash: '4 4', op: .68});
      s += handle(a, px, py, i ? 'B' : 'A', colors[i], 'surface' + i);
    }
    a.svg('temperature', s);

    const panel = a.panels.geometry;
    const center = panel.w / 2, cy = panel.h * .22;
    const sidePad = 34 * k;
    const panelW = panel.w - 2 * sidePad;
    let diagram = '';
    if (!model.power) {
      const xx = x1 => sidePad + panelW * (x1 - model.a) / width;
      const height = Math.min(54 * k, panel.h * .15);
      geometryUnit = x1 => (x1 - sidePad) / panelW;
      diagram += thermalStrip(a, 'th2-plan', sidePad, cy - height / 2, panelW,
        height, u => model.temp(model.a + width * u), min, max);
      diagram += S.rect(xx(r[0]), cy - height / 2, xx(r[1]) - xx(r[0]), height,
        {fill: C.card, fop: .24});
      r.forEach((at, i) => {
        diagram += S.line(xx(at), cy - height * .6, xx(at), cy + height * .61, {c: colors[i], w: 2.1});
        diagram += handle(a, xx(at), cy - height * .75, i ? 'B' : 'A', colors[i], 'surface' + i);
      });
    } else {
      const radius = Math.min(panelW * .28, panel.h * .207);
      const scale = radius / model.b;
      const cx = center - radius * .20;
      geometryUnit = x1 => ((x1 - cx) / scale - model.a) / width;
      let stops = '';
      for (let i = 0; i <= 80; i++) {
        const u = i / 80, rr = model.b * u;
        stops += '<stop offset="' + u + '" stop-color="' +
          temperatureColor(a, model.temp(Math.max(model.a, rr)), min, max) + '"/>';
      }
      diagram += '<defs><radialGradient id="th2-radial">' + stops + '</radialGradient></defs>';
      diagram += S.circle(cx, cy, radius, {fill: 'url(#th2-radial)', c: C.ink2});
      if (!model.solid) diagram += S.circle(cx, cy, scale * model.a, {fill: C.card, c: C.rule});
      const axisEnd = cx + radius + 20 * k;
      diagram += S.arrow(cx, cy, axisEnd, cy, {c: C.ink, w: 1.5});
      diagram += text(a, axisEnd + 5 * k, cy, 'r', {math: true});
      r.forEach((at, i) => {
        diagram += S.circle(cx, cy, scale * at, {c: colors[i], w: 1.65, dash: i ? '5 3' : undefined});
        diagram += handle(a, cx + scale * at, cy + (i ? -8 : 8) * k, i ? 'B' : 'A', colors[i], 'surface' + i);
      });
    }

    const startY = panel.h * .46;
    const left = panel.w * .07, col1 = panel.w * .42, col2 = panel.w * .72;
    const lineH = panel.h * .122, bar = panel.w * .22;
    const measureNames = ['Aire S', 'Densité ' + S.v('j', 'th'), 'Flux Φ'];
    diagram += text(a, col1, startY, 'A · ' + number(a, r[0] * 100, 'cm'), {c: colors[0], weight: 700});
    diagram += text(a, col2, startY, 'B · ' + number(a, r[1] * 100, 'cm'), {c: colors[1], weight: 700});
    for (let row = 0; row < 3; row++) {
      const y = startY + (row + 1) * lineH;
      const unit = ['m²', 'W·m⁻²', 'W'][row];
      const magnitude = Math.max(Math.abs(meas[0][row]), Math.abs(meas[1][row]), 1e-30);
      diagram += S.line(left, y - lineH * .43, panel.w * .94, y - lineH * .43, {c: C.rule, w: 1});
      diagram += text(a, left, y + 2 * k, measureNames[row], {c: C.ink, size: 12});
      meas.forEach((values, i) => {
        const xx = i ? col2 : col1;
        const ratio = Math.abs(values[row]) / magnitude;
        diagram += text(a, xx, y - 4 * k, number(a, values[row], unit), {c: C.ink, size: 11.6});
        if (row === 0) {
          const h = Math.sqrt(ratio) * 11 * k;
          diagram += S.rect(xx, y + 5 * k, h, h, {fill: colors[i], rx: 1});
        } else {
          diagram += S.rect(xx, y + 8 * k, bar, 5 * k, {fill: C.rule, rx: 2});
          diagram += S.rect(xx, y + 8 * k, bar * ratio, 5 * k, {fill: colors[i], rx: 2});
        }
      });
    }
    a.svg('geometry', diagram);
    const production = (p.production ? p.pV : 0) * (model.volume(r[1]) - model.volume(r[0]));
    display([
      ['Φ(B) − Φ(A)', number(a, model.flux(r[1]) - model.flux(r[0]), 'W')],
      ['Production entre A et B · pᵥ ΔV', number(a, production, 'W')],
      ['Pente en ' + (activeProbe ? 'B' : 'A'), number(a, slope, 'K·m⁻¹')]
    ]);
    a.legend([{c: C.ink, label: 'Température'},
      {c: colors[activeProbe], label: 'Tangente en ' + (activeProbe ? 'B' : 'A'), dash: true}]);
  }

  function segmentList(a, model, branchId, offset) {
    const sub = ['₁', '₂', '₃'];
    const film = (side, x, from, to) => ({
      name: side === 'left' ? 'Échange gauche' : 'Échange droite',
      symbol: side === 'left' ? 'Rᵢ' : 'Rₑ',
      color: side + 'Film', R: model[side], x, end: x, from, to, film: true
    });
    const parts = [
      ...(model.left ? [film('left', 0, model.hot, model.parts[0].from)] : []),
      ...model.parts.map((part, i) => ({
        name: model.materials[i].name, symbol: 'R' + sub[i],
        color: model.materials[i].color, R: part.resistance,
        x: part.x, end: part.end, from: part.from, to: part.to, film: false
      })),
      ...(model.right ? [film('right', model.length, model.parts.at(-1).to, model.cold)] : [])
    ];
    return parts.map((part, i) => {
      const [fill, light, dark] = wallColors[part.color];
      return {...part, index: offset + i, symbol: part.symbol + branchId, fill, ink: a.C.dark ? dark : light};
    });
  }

  function drawWall(a) {
    const {p, S, C, k} = a;
    const {main, extra, total, split} = wallModel(p);
    const baseline = p.wallReference ? wallModel(reference) : null;
    const length = Math.max(main.length, extra?.length ?? 0, baseline?.main.length ?? 0, baseline?.extra?.length ?? 0);
    const low = Math.min(p.hot, p.cold, baseline?.main.hot ?? Infinity, baseline?.main.cold ?? Infinity);
    const high = Math.max(p.hot, p.cold, baseline?.main.hot ?? -Infinity, baseline?.main.cold ?? -Infinity);
    const [min, max] = limits(low, high);
    const extent = length * 100;
    const G = graph(a, 'temperature', -.04 * extent, 1.04 * extent, min, max, 'x (cm)', 'T (°C)');
    const aParts = segmentList(a, main, extra ? 'A' : '', 0);
    const bParts = extra ? segmentList(a, extra, 'B', aParts.length) : [];
    const all = [...aParts, ...bParts];
    const selected = clamp(p.wallComponent, 0, all.length - 1);
    const active = all[selected];
    const options = all.map(part => '<option value="' + part.index + '">' +
      part.symbol + ' · ' + part.name + '</option>').join('');
    if (componentSelect.innerHTML !== options) componentSelect.innerHTML = options;
    if (selected !== p.wallComponent) a.set('wallComponent', selected);
    componentSelect.value = String(selected);

    let plotSvg = G.svg + S.clip('th2-wall-profile', G);
    plotSvg += '<g clip-path="url(#th2-wall-profile)">';
    const y1 = G.Y(active.from), y2 = G.Y(active.to);
    const xa = G.X(100 * active.x), xb = G.X(100 * active.end);
    plotSvg += S.rect(xa - 4, Math.min(y1, y2) - 3, Math.max(8, xb - xa + 8), Math.abs(y2 - y1) + 6,
      {fill: active.fill, fop: .3, rx: 3});
    if (baseline) {
      for (const model of [baseline.main, baseline.extra].filter(Boolean)) {
        const profile = [[0, model.hot], [0, model.parts[0].from],
          ...model.parts.map(part => [100 * part.end, part.to]), [100 * model.length, model.cold]];
        plotSvg += S.curve(profile, G, {c: C.pred, w: 1.7, dash: '2 5', op: .75});
      }
    }
    for (const part of [...bParts, ...aParts]) {
      const dashed = part.film || bParts.includes(part);
      plotSvg += S.curve([[100 * part.x, part.from], [100 * part.end, part.to]], G,
        {c: part.ink, w: part.index === selected ? 3.6 : 2.5, dash: dashed ? '6 4' : undefined});
    }
    for (const [x, y] of [[xa, y1], [xb, y2]]) {
      plotSvg += S.circle(x, y, 4 * k, {fill: active.fill, c: active.ink, w: 1.4});
    }
    a.svg('temperature', plotSvg + '</g>');

    const panel = a.panels.design;
    // Adapter le dessin à la place disponible tout en conservant les repères.
    const scale = Math.min(k, panel.w / 295, panel.h / (extra ? 305 : 205));
    const left = 29 * scale, right = panel.w - left, width = right - left;
    const center = panel.w / 2;
    const head = 22 * scale;
    const available = panel.h - head - 35 * scale;
    const row = available / (extra ? 2 : 1);
    const band = Math.min(31 * scale, row * .21);
    const circuit = p.wallCircuit;
    const tag = (x, y, label, opts) =>
      S.text(x, y, label, {size: 12 * scale / k, ...opts});
    const block = (part, x, y, w, h, role) => {
      const activePart = part.index === selected;
      const stroke = activePart ? C.ink : part.ink;
      return '<g data-wall-' + role + '="' + part.index + '">' +
        S.rect(x, y, w, h, {fill: part.fill, c: stroke, w: activePart ? 2.1 : 1, rx: 2}) +
        '<rect data-layer="' + part.index + '" x="' + x + '" y="' + y +
        '" width="' + w + '" height="' + h + '" fill="transparent"/>' + '</g>';
    };
    let scene = tag(center, head * .65, wallCases[p.wallCase].label, {anchor: 'middle', c: C.ink, weight: 700});

    function drawBranch(parts, model, name, y) {
      const count = parts.length, cell = width / count;
      const top = y + 28 * scale, wire = y + row * (extra ? .68 : .64);
      const boxH = 17 * scale;
      const heading = name ? name + ' · ' + number(a, model.flux, 'W') : 'Coupe schématique';
      let svg = tag(left, y + 12 * scale, heading, {c: C.ink2, weight: 650, size: 12 * scale / k});
      svg += tag(right, y + 12 * scale, name ? number(a, model.area, 'm²') : number(a, p.hot, '°C') + '  /  ' + number(a, p.cold, '°C'),
        {anchor: 'end', c: C.ink2, size: 11.3 * scale / k});
      if (circuit) svg += S.line(left - 8 * scale, wire, right + 8 * scale, wire, {c: C.ink2, w: 1.65});
      let barStart = left;
      for (const [i, part] of parts.entries()) {
        const slot = left + i * cell;
        const cx = slot + cell / 2;
        const tileW = cell - 4 * scale;
        svg += block(part, slot + 2 * scale, top, tileW, band, 'cut');
        svg += '<g pointer-events="none">' + tag(cx, top + band / 2, part.symbol, {
          anchor: 'middle', c: '#242731', halo: false, weight: 750
        }) + '</g>';
        const nameSize = Math.min(11.4 * scale, tileW / (Math.max(7, part.name.length) * .57));
        svg += tag(cx, top + band + 12 * scale, part.name,
          {anchor: 'middle', c: C.ink2, size: nameSize / k, halo: false});
        if (circuit) {
          const w = cell * .68;
          svg += S.line(cx, top + band + 23 * scale, cx, wire - boxH / 2,
            {c: part.ink, w: .9, dash: '2 4', op: .6});
          svg += block(part, cx - w / 2, wire - boxH / 2, w, boxH, 'resistor');
          svg += '<g pointer-events="none">' + tag(cx, wire, part.symbol, {
            anchor: 'middle', c: '#242731', halo: false, weight: 750, size: 11.6 * scale / k
          }) + '</g>';
          const value = number(a, part.R);
          const font = Math.min(11.1 * scale, (cell - 4 * scale) / (Math.max(6, value.length) * .57));
          svg += tag(cx, wire + 20 * scale, value, {anchor: 'middle', c: part.ink, size: font / k, weight: 650});
        } else {
          const w = width * part.R / model.resistance;
          svg += block(part, barStart, wire - boxH / 2, w, boxH, 'drop');
          if (w >= 23 * scale) {
            svg += '<g pointer-events="none">' + tag(barStart + w / 2, wire, part.symbol,
              {anchor: 'middle', c: '#242731', halo: false, weight: 750, size: 10.5 * scale / k}) + '</g>';
          }
          barStart += w;
        }
      }
      if (!extra) svg += tag(center, wire + 43 * scale,
        circuit ? 'Résistances en K·W⁻¹' : 'Parts de la chute de température', {anchor: 'middle', c: C.ink2});
      return {svg, wire};
    }

    const first = drawBranch(aParts, main, extra ? 'Branche A' : '', head);
    scene += first.svg;
    if (extra) {
      const second = drawBranch(bParts, extra, 'Branche B', head + row);
      scene += second.svg;
      if (circuit) {
        for (const x of [left - 8 * scale, right + 8 * scale]) {
          scene += S.line(x, first.wire, x, second.wire, {c: C.ink2, w: 1.65});
          scene += S.circle(x, first.wire, 2.6 * scale, {fill: C.ink2});
          scene += S.circle(x, second.wire, 2.6 * scale, {fill: C.ink2});
        }
        scene += tag(center, Math.min(panel.h - 28 * scale, second.wire + 38 * scale), 'Résistances en K·W⁻¹',
          {anchor: 'middle', c: C.ink2, size: 10.8 * scale / k});
      }
    }
    scene += tag(center, panel.h - 12 * scale, active.symbol + ' · ' + active.name + ' · ΔT = ' +
      number(a, Math.abs(active.from - active.to), 'K'), {anchor: 'middle', c: active.ink, weight: 700});
    a.svg('design', scene);
    const comparison = baseline && Math.abs(baseline.total) > 1e-12 ? Math.abs(total / baseline.total) : null;
    const powerShare = total ? Math.abs((extra?.flux ?? 0) / total) : null;
    const equivalent = extra ? 1 / (1 / main.resistance + 1 / extra.resistance) : main.resistance;
    display([
      ['Flux de la paroi', number(a, total, 'W')],
      baseline && ['Flux de référence', number(a, baseline.total, 'W')],
      comparison !== null && ['Flux / référence', number(a, comparison)],
      extra && ['Branche B · surface / flux', number(a, 100 * split, '%') + ' / ' +
        (powerShare === null ? '—' : number(a, 100 * powerShare, '%'))],
      ['R équivalente', number(a, equivalent, 'K·W⁻¹')],
      [active.symbol + ' · ΔT', number(a, Math.abs(active.from - active.to), 'K')],
      !circuit && [active.symbol + ' · Résistance', number(a, active.R, 'K·W⁻¹')]
    ].filter(Boolean));
    a.legend([
      {c: active.ink, label: active.symbol + ' · ' + active.name},
      extra && {c: C.ink2, label: 'Profil de la branche B', dash: true},
      baseline && {c: C.pred, label: 'Paroi de référence', dot: true}
    ].filter(Boolean));
  }

  function drawJacket(a) {
    const {p, S, C, k} = a;
    const parameters = {
      radius: p.tubeRadius / 1000, thickness: p.coat / 1000, conductivity: p.coatLambda,
      h: p.airH, hot: p.tubeTemperature, air: p.airTemperature
    };
    const sample = mm => jacket({...parameters, thickness: mm / 1000});
    const model = sample(p.coat), bare = sample(0);
    const peak = Math.max(0, 1000 * model.critical - p.tubeRadius);
    const end = peak > 0 && peak < 8
      ? Math.max(12, peak * 3, p.coat * 1.22)
      : Math.max(25, p.coat * 1.18, Math.min(65, peak) * 1.2);
    const values = points(0, end, 150, mm => sample(mm).flux);
    const upper = Math.max(...values.map(([, flux]) => flux), peak <= end ? sample(peak).flux : 0);
    const G = graph(a, 'loss', 0, end, 0, upper * 1.14, 'Épaisseur (mm)', 'Φ / H (W·m⁻¹)');
    jacketUnit = x => G.xv(x);
    let svg = G.svg + S.clip('th2-jacket-graph', G);
    svg += plot(a, [[0, bare.flux], [end, bare.flux]], G, C.pred, true);
    svg += plot(a, values, G, C.cInk);
    if (peak > 0 && peak <= end) {
      const px = G.X(peak), py = G.Y(sample(peak).flux);
      svg += S.line(px, py, px, G.y0 + G.h, {c: C.B, dash: '4 5', w: 1.7});
      svg += S.circle(px, py, 4 * k, {fill: C.B, c: C.card});
    }
    svg += S.line(G.X(p.coat), G.Y(model.flux), G.X(p.coat), G.y0 + G.h, {c: C.cInk, dash: '4 4'});
    svg += S.circle(G.X(p.coat), G.Y(model.flux), 8 * k, {fill: C.cInk, c: C.card, w: 1.8, hit: 'coat'});
    a.svg('loss', svg);

    const panel = a.panels.jacket;
    const cx = panel.w / 2, cy = panel.h * .34;
    const maxRadius = Math.min(panel.w * .25, panel.h * .24);
    const referenceRadius = parameters.radius + Math.max(5, Math.min(peak, 65) * 1.6) / 1000;
    const radius = maxRadius * Math.max(.24, Math.min(1, model.outer / referenceRadius));
    const tube = radius * parameters.radius / model.outer;
    let stops = '';
    for (let i = 0; i <= 40; i++) {
      const f = i / 40, r = Math.max(parameters.radius, f * model.outer);
      const t = parameters.hot - model.flux * Math.log(r / parameters.radius) / (2 * Math.PI * parameters.conductivity);
      stops += '<stop offset="' + f + '" stop-color="' + temperatureColor(a, t, parameters.air, parameters.hot) + '"/>';
    }
    let section = '<defs><radialGradient id="th2-jacket-gradient">' + stops + '</radialGradient></defs>';
    section += S.circle(cx, cy, radius, {fill: 'url(#th2-jacket-gradient)', c: C.rule});
    section += S.circle(cx, cy, tube, {c: C.ink, dash: '4 4', w: 1.4});
    const arrows = Math.min(38 * k, panel.w * .10);
    for (const angle of [-Math.PI / 2, .2, 2.5]) {
      const x = Math.cos(angle), y = Math.sin(angle);
      section += S.arrow(cx + x * radius, cy + y * radius, cx + x * (radius + arrows), cy + y * (radius + arrows),
        {c: C.cInk, w: 2});
    }
    section += text(a, cx, cy + maxRadius + 24 * k, 'Surface · ' + number(a, model.surface, '°C'),
      {anchor: 'middle', c: C.ink, weight: 650});
    const totalResistance = model.conduction + model.exchange;
    const ratio = model.conduction / totalResistance;
    const w = panel.w * .76, left = (panel.w - w) / 2, yy = panel.h * .72;
    section += text(a, left, yy - 16 * k, 'Part de chaque résistance', {c: C.ink});
    section += S.rect(left, yy, w, 14 * k, {fill: C.B, rx: 2});
    if (ratio > 0) section += S.rect(left, yy, w * ratio, 14 * k, {fill: C.cInk});
    section += text(a, left, yy + 28 * k, 'Manchon ' + Math.round(100 * ratio) + ' %', {c: C.cInk, size: 12});
    section += text(a, left + w, yy + 28 * k, 'Échange ' + Math.round(100 * (1 - ratio)) + ' %',
      {anchor: 'end', c: C.B, size: 12});
    a.svg('jacket', section);
    display([
      ['Tube nu', number(a, bare.flux, 'W·m⁻¹')],
      ['Tube avec manchon', number(a, model.flux, 'W·m⁻¹')],
      ['Flux / tube nu', number(a, model.flux / bare.flux)],
      ['Rayon critique λ/h', number(a, 1000 * model.critical, 'mm')]
    ]);
    a.legend([
      {c: C.cInk, label: 'Manchon'},
      {c: C.pred, label: 'Tube nu', dash: true},
      peak > 0 && peak <= end && {c: C.B, label: 'Maximum au rayon critique', dot: true}
    ].filter(Boolean));
  }
})();

</script>
</body>
</html>
