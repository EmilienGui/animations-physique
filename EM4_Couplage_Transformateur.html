  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){

        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

}
function graphTr(a,p,z,m){

    const seg=(A,B,c,lab,w=2.6,sd=1)=>{const p1=X(A),p2=X(B),L=Math.hypot(p2[0]-p1[0],p2[1]-p1[1])||1,nx=-(p2[1]-p1[1])/L*sd,ny=(p2[0]-p1[0])/L*sd;return S.arrow(p1[0],p1[1],p2[0],p2[1],{c,w})+(lab&&L>14*k?S.text((p1[0]+p2[0])/2+nx*14*k,(p1[1]+p2[1])/2+ny*14*k,lab,{size:14,c,anchor:'middle'}):'');};

/* ---------- 3. transformateur ---------- */
function drawId(a){
  const Pn=a.panels.scene,S=a.S,C=a.C,k=a.k,f=a.fmt,w=Pn.w,h=Pn.h,p=idP(a),m=ideal(p,a.t),dark=C.dark;
  const Wc=Math.min(w-230*k,420*k),Hc=Math.min(h-120*k,270*k),cx=w/2,cy=h/2+12*k,x=cx-Wc/2,y=cy-Hc/2,d=Math.max(22*k,Math.min(44*k,Hc*.18));
  const face=dark?'#5a6b78':'#c6d0d8',edge=dark?'#2b3d4b':'#758593',copper=dark?'#e3a062':'#b8722f';
  let s=S.path(`M${x},${y}h${Wc}v${Hc}h${-Wc}Z M${x+d},${y+d}v${Hc-2*d}h${Wc-2*d}v${-(Hc-2*d)}Z`,{fill:face,c:edge,w:1.4}).replace('fill-opacity','data-x');
  s=s.replace('<path ','<path fill-rule="evenodd" ');
  // flux canalisé : lignes dans le fer, flèches proportionnelles à Φ
  const Phm=Math.SQRT2*p.U/(TAU*p.f*p.N1),fr=m.phi/Phm;
  for(const q of [.3,.5,.7]){const v=d*q;s+=S.path(`M${x+v},${y+v}h${Wc-2*v}v${Hc-2*v}h${-(Wc-2*v)}Z`,{c:C.B,w:1.6,op:.15+.75*Math.abs(fr)});}
  if(Math.abs(fr)>.02){const L=34*k*fr,v=d/2;
    s+=S.arrow(cx+L/2,y+v,cx-L/2,y+v,{c:C.B,w:2.6})+S.arrow(cx-L/2,y+Hc-v,cx+L/2,y+Hc-v,{c:C.B,w:2.6})+S.arrow(x+v,cy-L/2,x+v,cy+L/2,{c:C.B,w:2.6})+S.arrow(x+Wc-v,cy+L/2,x+Wc-v,cy-L/2,{c:C.B,w:2.6});}
  s+=S.text(cx,y-14*k,'Noyau de fer · flux commun Φ',{anchor:'middle',size:14,c:C.ink});
  // enroulements
  const coil=(xc,n,c)=>{let t='';const turns=Math.max(3,Math.min(10,Math.round(n/150))),hh=Hc*.56,y0=cy-hh/2;for(let j=0;j<turns;j++){const yy=y0+hh*(j+.5)/turns;t+=S.line(xc-d/2-7*k,yy-4*k,xc+d/2+7*k,yy+4*k,{c,w:4});}return {t,y0,y1:y0+hh};};
  const cl=coil(x+d/2,p.N1,copper),cr=coil(x+Wc-d/2,p.N2,copper);s+=cl.t+cr.t;
  s+=S.text(x+d/2,y+Hc+16*k,`${sub(a,'N','1')} = ${f.fix(p.N1,0)}`,{anchor:'middle',size:14,c:C.E})+S.text(x+Wc-d/2,y+Hc+16*k,`${sub(a,'N','2')} = ${f.fix(p.N2,0)}`,{anchor:'middle',size:14,c:C.v});
  // circuits extérieurs
  const xg=x-80*k,xs=x+Wc+80*k,ya=cl.y0,yb=cl.y1;
  s+=E.W(a,x-7*k,ya,xg,ya)+E.W(a,x-7*k,yb,xg,yb)+E.W(a,xg,ya,xg,cy-15*k)+E.W(a,xg,cy+15*k,xg,yb)+E.gen(a,xg,cy,{type:'~'})+E.volt(a,xg+28*k,cy+18*k,xg+28*k,cy-18*k,sub(a,'v','1'),{c:C.E,dx:6*k});
  s+=E.W(a,x+Wc+7*k,ya,xs,ya)+E.W(a,x+Wc+7*k,yb,xs,yb);
  if(p.open)s+=E.W(a,xs,ya,xs,cy-14*k)+E.W(a,xs,cy+14*k,xs,yb)+S.circle(xs,cy-14*k,3*k,{fill:C.card,c:C.ink})+S.circle(xs,cy+14*k,3*k,{fill:C.card,c:C.ink})+S.text(xs+8*k,cy,'à vide',{size:13,c:C.ink2});
  else s+=E.res(a,xs,ya,xs,yb,{c:C.v})+S.text(xs+12*k,cy+26*k,sub(a,'R','ch'),{size:15,c:C.v});
  s+=E.volt(a,xs-26*k,cy+18*k,xs-26*k,cy-18*k,sub(a,'v','2'),{c:C.v,dx:-8*k,anchor:'end'});
  s+=S.circle(x-12*k,ya-8*k,3.2*k,{fill:C.ink})+S.circle(x+Wc+12*k,ya-8*k,3.2*k,{fill:C.ink});
  s+=E.cur(a,(xg+x)/2,ya,'r',sub(a,'i','1'),{c:C.E,ly:-14*k})+E.cur(a,(x+Wc+xs)/2,ya,'r',sub(a,'i','2'),{c:C.v,ly:-14*k});
  s+=S.text(10*k,10*k,`${S.v('m')} = ${M?sub(a,'N','2')+'/'+sub(a,'N','1'):''} = ${f.sig(m.m,3)} · ${m.m>1?'élévateur':m.m<1?'abaisseur':'isolement'}`,{base:'top',size:14,c:C.ink});
  a.svg('scene',s);
  const {T,u,tf}=timeAxis(a),b=K.split(a.panels.graphe,2,6*k),uI=K.unit(Math.max(Math.SQRT2*Math.max(m.I1,m.I2)+Math.SQRT2*m.Imu,1e-6),'A');
  const ser=[{f:x=>ideal(p,x/tf).i1*uI.f,c:C.E},{f:x=>ideal(p,x/tf).i2*uI.f,c:C.v,dash:true}];if(p.mag)ser.push({f:x=>ideal(p,x/tf).imu*uI.f,c:C.ink2,w:1.4});
  a.svg('graphe',g2(a,b,{T:T*tf,t:a.t*tf,futur:a.p.futur,sym:true,xlab:`${S.v('t')} (${u.u})`,ylab:`${sub(a,'v','1')}, ${sub(a,'v','2')} (V)`,series:[{f:x=>ideal(p,x/tf).v1,c:C.E},{f:x=>ideal(p,x/tf).v2,c:C.v,dash:true}],id:'i1'},
    {T:T*tf,t:a.t*tf,futur:a.p.futur,sym:true,xlab:`${S.v('t')} (${u.u})`,ylab:`${sub(a,'i','1')}, ${sub(a,'i','2')} (${uI.u})`,series:ser,id:'i2'}));
  a.metrics([{label:`Tension ${M.v('v','1')}`,value:f.sig(m.v1,3),unit:'V',hint:`efficace ${f.sig(m.V1,3)} V`},
    {label:`Tension ${M.v('v','2')} = ${mv('m')}${M.v('v','1')}`,value:f.sig(m.v2,3),unit:'V',hint:`efficace ${f.sig(m.V2,3)} V`},
    {label:`Courant ${M.v('i','1')}`,value:f.sig(m.i1,3),unit:'A',hint:p.mag?`${M.v('I','µ')} efficace ${f.sig(m.Imu,3)} A`:`= ${mv('m')}${M.v('i','2')}`},
    {label:'Puissance moyenne transmise',value:f.sig(m.P,3),unit:'W',hint:`${mv('B')} max ${f.sig(Phm/p.S,3)} T`}]);
  a.insight(p.open&&!p.mag?'À vide, le transformateur idéal ne consomme aucun courant, mais la tension secondaire est présente.':p.open?'À vide, le primaire absorbe le courant magnétisant, en quadrature avec <i class="m">v</i><sub>1</sub> : puissance moyenne nulle.':
    m.m>1?'Élévateur de tension, donc abaisseur de courant : <i class="m">v</i><sub>1</sub><i class="m">i</i><sub>1</sub> = <i class="m">v</i><sub>2</sub><i class="m">i</i><sub>2</sub> à chaque instant.':'Abaisseur de tension, donc élévateur de courant : <i class="m">v</i><sub>1</sub><i class="m">i</i><sub>1</sub> = <i class="m">v</i><sub>2</sub><i class="m">i</i><sub>2</sub> à chaque instant (modèle idéal).',['À vide, le primaire absorbe le courant magnétisant, en quadrature avec <i class="m">v</i><sub>1</sub> : puissance moyenne nulle.']);
  a.clock(`${mv('t')} = ${f.sig(a.t*u.f,3)} ${u.u}`);
  a.legend([{c:C.E,label:'primaire'},{c:C.v,label:'secondaire'},{c:C.B,label:'flux dans le fer'},p.mag&&{c:C.ink2,label:'courant magnétisant'}]);
}

/* ---------- 4. transport ---------- */
function drawLine(a){
  const Pn=a.panels.scene,S=a.S,C=a.C,k=a.k,f=a.fmt,w=Pn.w,h=Pn.h,p=lnP(a),m=P.line(p),m1=P.line(p,1);
  const stack=a.narrow,bw=stack?w-40*k:(w-80*k)/3,bh=stack?(h-90*k)/3:Math.min(200*k,h-110*k);
  let s=S.text(10*k,10*k,'Même puissance injectée · deux transformateurs idéaux · ligne résistive',{base:'top',size:14,c:C.ink});
  const items=[['Injection',`${f.sig(p.P/1000,3)} kW`,`${S.v('U')} = ${f.sig(p.U,3)} V`,C.E],['Transport',`${f.sig(m.Uline/1000,3)} kV`,`${S.v('I')} = ${f.sig(m.I,3)} A`,C.B],['Réception',`${f.sig(m.Preceived/1000,3)} kW`,`${S.v('U')} = ${f.sig(m.Ureceived,3)} V`,C.v]];
  const pos=items.map((_,j)=>stack?[20*k,40*k+j*(bh+10*k)]:[20*k+j*(bw+20*k),(h-bh)/2]);
  items.forEach((it,j)=>{const [x0,y0]=pos[j];s+=S.rect(x0,y0,bw,bh,{fill:C.cSoft,c:C.rule,rx:8*k})+S.text(x0+12*k,y0+12*k,it[0],{base:'top',size:14,c:C.ink2})+S.text(x0+12*k,y0+bh*.48,it[1],{size:22,c:it[3],weight:600})+S.text(x0+12*k,y0+bh-18*k,it[2],{size:15,c:C.ink});});
  // courant dans la ligne : épaisseur et flèche proportionnelles à I
  const L=60*k*m.I/m1.I;
  if(!stack){const xa=pos[1][0]+bw*.55,ya=pos[1][1]+bh*.72;s+=S.arrow(xa,ya,xa+Math.max(L,1),ya,{c:C.E,w:1+5*m.I/m1.I});}
  s+=S.text(w/2,h-14*k,`Pertes Joule ${f.sig(m.Pjoule/1000,3)} kW · sans élévation ${f.sig(m1.Pjoule/1000,3)} kW : divisées par ${S.v('m')}${S.sup('2')} = ${f.sig(p.m*p.m,3)}`,{anchor:'middle',size:14,c:C.F});
  a.svg('scene',s);
  const b=K.split(a.panels.graphe,2,6*k);
  const gA={xmin:1,T:20,t:p.m,futur:true,xlab:S.v('m')};
  const r1=K.tplot(a,{...gA,box:b[0],ylab:`${sub(a,'P','J')} (kW)`,series:[{f:x=>P.line(p,x).Pjoule/1000,c:C.F}],id:'l1'});
  const r2=K.tplot(a,{...gA,box:b[1],ylab:`${S.v('I')} (A)`,series:[{f:x=>P.line(p,x).I,c:C.E}],id:'l2'});
  st.gr=r1.G;a.svg('graphe',r1.svg+r2.svg);
  a.metrics([{label:'Tension de transport',value:f.sig(m.Uline/1000,3),unit:'kV',hint:'efficace'},
    {label:`Courant ${mv('I')} = ${M.frac(mv('P'),mv('m')+mv('U'))}`,value:f.sig(m.I,3),unit:'A',hint:''},
    {label:`Pertes ${M.v('R','ligne')}${mv('I')}<sup>2</sup>`,value:f.sig(m.Pjoule/1000,3),unit:'kW',hint:`${f.sig(100*m.Pjoule/p.P,3)} % de la puissance`},
    {label:'Rendement de la liaison',value:f.sig(100*m.eta,3),unit:'%',hint:''}]);
  a.insight('À puissance transportée fixée, multiplier la tension par <i class="m">m</i> divise le courant par <i class="m">m</i> et les pertes Joule par <i class="m">m</i>² : d\'où le transport sous 225 kV ou 400 kV.');
  a.legend([{c:C.E,label:'courant'},{c:C.F,label:'pertes Joule'},{c:C.B,label:'transport'},{c:C.v,label:'réception'}]);
}

/* ---------- interactions ---------- */
A.drag('scene',{
  hit:(x,y)=>{const g=st.geo,k=A.k;if(!g)return false;if(A.tab===0)return !!g.a2&&Math.hypot(x-g.a2[0],y-g.a2[1])<20*k;if(A.tab===1)return g.x2!==undefined&&Math.abs(x-g.x2)<22*k&&y>g.yt&&y<g.yb;return false;},
  start(x,y){st.drag=A.tab===0?{y,v:A.p.a2}:{x,v:A.p.kc};},
  move(x,y){const d=st.drag;if(!d)return;if(A.tab===0)A.p.a2=Math.round(Math.max(.3,Math.min(A.p.a1,d.v-(y-d.y)*.012))*20)/20;else A.p.kc=Math.round(Math.max(0,Math.min(.99,d.v-(x-d.x)/(st.geo.span*.16)))*100)/100;A.t=0;A.refresh();},
  end(){st.drag=null;}
});
A.drag('graphe',{
  hit:()=>A.tab===3,
  start(x){this.move(x)},
  move(x){if(!st.gr)return;A.p.mL=Math.round(Math.max(1,Math.min(20,st.gr.xv(x)))*10)/10;A.refresh();}
});

</script>
