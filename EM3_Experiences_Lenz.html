const MATH='"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif';
const MINUS='−';

/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  /** n chiffres significatifs, sans notation exponentielle */
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e<-3||e>=6){const m=x/10**e;return (+m.toFixed(n-1)).toFixed(n-1).replace('-',MINUS)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>'}
    const d=Math.max(0,n-1-e);

    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);

  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;

    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },

    text(x,y,content,o={}){

      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){

      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();

      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});

      const clone=P.node.cloneNode(true); clone.setAttribute('width',r.width); clone.setAttribute('height',r.height);
      const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
      const im=new Image(); im.onload=()=>{ctx.drawImage(im,x,y,r.width*sc,r.height*sc);res()}; im.onerror=()=>res(); im.src=src;}));
    await Promise.all(jobs);

    const a=document.createElement('a'); const tabName=cfg.onglets&&cfg.onglets.length>1?'_'+(A.tab+1):'';
    a.download=`${cfg.code}_${(cfg.fichier||cfg.titre).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_')}${tabName}.png`;
    a.href=cv.toDataURL('image/png'); a.click(); A.toast('Image enregistrée (thème clair)');
  };

  /* ---------- aide ---------- */
  function buildHelp(){

    dlg.innerHTML=`<header><h3>Aide · ${cfg.titre}</h3><button class="mini" data-close>Fermer ✕</button></header><div class="db">

    <h4>Raccourcis</h4><p>${cfg.temps?'<kbd>Espace</kbd> lecture / pause · <kbd>→</kbd> pas à pas · <kbd>R</kbd> recommencer · ':''}${tabs?`<kbd>1</kbd>–<kbd>${cfg.onglets.length}</kbd> onglets · `:''}<kbd>P</kbd> projection · <kbd>F</kbd> plein écran · <kbd>T</kbd> thème · <kbd>I</kbd> image · <kbd>H</kbd> aide${h.touches?' · '+h.touches:''}</p>
    <p>Vue : molette, pincement ou <kbd>+</kbd> <kbd>−</kbd> pour zoomer · <kbd>Maj</kbd> + glisser, deux doigts, ou glisser une vue zoomée pour la déplacer · « Cadrer », <kbd>0</kbd> ou double clic : vue initiale.</p>

<script>
/* EM3 · physique d'origine (ex-physique.js), équations inchangées */
'use strict';
// Moteurs communs aux deux ateliers. Toutes les entrées géométriques sont en SI.
// L'orientation choisie multiplie Φ, e et i ; le courant physique est orientation × i.
window.EM3Model = (() => {
  const MU0 = 4e-7 * Math.PI, TAU = 2 * Math.PI, rad = Math.PI / 180;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const quadrature = n => Array.from({length:n}, (_, k) => ({
    c:Math.cos(TAU*(k+.5)/n), s:Math.sin(TAU*(k+.5)/n), w:TAU/n
  }));
  const q96 = quadrature(96), q128 = quadrature(128), CORE=.004;
  function flux(t, p) {
    let b=p.B0/1000, db=0, S=p.area/10000, dS=0;
    let theta=p.angle*rad, omega=0, x=0, sideX=Math.sqrt(S), sideY=sideX;
    const w=TAU*p.frequency;
    switch(p.preset) {
      case 'sinus': db=-b*w*Math.sin(w*t); b*=Math.cos(w*t); break;
      case 'ramp': db=b/8; b*=t/8; break;
      case 'exp': db=-b/p.tau*Math.exp(-t/p.tau); b*=Math.exp(-t/p.tau); break;
      case 'rotation': theta+=w*t; omega=w; break;
      case 'deform': {
        theta=0;
        const a=Math.sqrt(S), u=clamp(t/8,0,1), dx=.8*a/8;
        sideX=a*(.6+.8*u); sideY=2*a-sideX;
        S=sideX*sideY; dS=(t>=0&&t<=8)?dx*(sideY-sideX):0;
        break;
      }
      case 'translate': x=.16*(t/8-.5); break;
    }
    const geometricPhi=p.N*b*S*Math.cos(theta);
    const geometricE=-p.N*(db*S*Math.cos(theta)+b*dS*Math.cos(theta)-b*S*Math.sin(theta)*omega);
    const phi=p.orientation*geometricPhi, e=p.orientation*geometricE;
    const i=p.closed?e/p.R:0, physicalI=p.orientation*i;
    const alpha=Math.abs(b)<1e-14?null:Math.acos(clamp(Math.sign(b)*p.orientation*Math.cos(theta),-1,1))/rad;
    return {t,b,db,S,dS,theta,omega,x,sideX,sideY,phi,e,i,physicalI,alpha};
  }
  // Neumann pour deux anneaux coaxiaux, sans noyau : M=μ0 ab/2 ∫cos(u)/r du.
  // Le rayon source reste inférieur au rayon récepteur : aucun fil ne se croise.
  function mutual(a,b,z,nodes=q96) {
    let m=0, dz=0;
    for(const q of nodes) {
      const r2=a*a+b*b+z*z-2*a*b*q.c+CORE*CORE, r=Math.sqrt(r2);
      m+=q.c/r*q.w;
      dz-=z*q.c/(r2*r)*q.w;
    }
    return {M:MU0*a*b/2*m,dM:MU0*a*b/2*dz};
  }
  function source(p) {
    // Aimant : deux nappes de courant équivalentes, total m = 0,35 A·m² × force.
    // Bobine : cinq anneaux portant chacun N1/5 fois le courant imposé i1.
    if(p.mode==='magnet') return {a:.014,offsets:[-.012,.012],turns:1,
      equivalent:.35*p.strength/(Math.PI*.014**2)};
    return {a:.038,offsets:[-.024,-.012,0,.012,.024],turns:100,equivalent:1};
  }
  function coupling(x,p,nodes=q96) {
    const s=source(p); let M=0,dM=0;
    for(const o of s.offsets) {const r=mutual(s.a,.065,x+o,nodes);M+=r.M;dM+=r.dM;}
    const scale=p.N*s.turns/s.offsets.length;
    return {K:M*scale,dK:dM*scale};
  }
  function motion(t,p,speed=p.speed) {
    const T=6/speed;
    if(p.motion==='hold')return {x:-p.distance/100,v:0,T};
    let a=-.24,b=-.04;
    if(p.motion==='away'){a=-.04;b=-.24;}
    if(p.motion==='pass')b=.24;
    const u=clamp(t/T,0,1), f=(1-Math.cos(Math.PI*u))/2;
    return {x:a+(b-a)*f,v:(t>=0&&t<=T)?(b-a)*Math.PI/(2*T)*Math.sin(Math.PI*u):0,T};
  }
  function drive(t,p) {
    const a=TAU*p.frequency*t, I=p.amplitude, w=TAU*p.frequency;
    if(p.signal==='constant') return {I,dI:0};
    if(p.signal==='triangle') {
      const q=(t*p.frequency)%1;
      return q<.5?{I:I*(-1+4*q),dI:4*p.frequency*I}:{I:I*(3-4*q),dI:-4*p.frequency*I};
    }
    if(p.signal==='square') {
      const h=Math.tanh(5*Math.cos(a));
      return {I:I*h,dI:-5*I*w*Math.sin(a)*(1-h*h)};
    }
    return {I:I*Math.cos(a),dI:-I*w*Math.sin(a)};
  }
  function experiment(t,p,override=null) {
    const src=source(p), moving=p.mode!=='fixed';
    const traj=override||motion(t,p);
    const x=moving?traj.x:-p.distance/100, v=moving?traj.v:0;
    const d=moving?{I:p.mode==='magnet'?src.equivalent:p.amplitude,dI:0}:drive(t,p);
    const I=p.polarity*d.I, dI=p.polarity*d.dI;
    const c=coupling(x,p);
    const phi0=c.K*I, e0=-(c.dK*v*I+c.K*dI);
    const phi=p.orientation*phi0,e=p.orientation*e0,i=p.closed?e/p.R:0;
    const physicalI=p.orientation*i, Bind=MU0*p.N*physicalI/(2*.065);
    const force=moving?physicalI*I*c.dK:0;
    return {t,x,v,I,dI,phi,e,i,physicalI,Bind,force,power:i*i*p.R,K:c.K,dK:c.dK,T:moving?traj.T||6/p.speed:8};
  }
  // Biot-Savart dans le plan méridien (x,y) des mêmes anneaux que le flux.
  function field(x,y,m,p) {
    const s=source(p), amp=m.I*s.turns/s.offsets.length;
    let bx=0,by=0;
    for(const o of s.offsets)for(const q of q128) {
      const dx=x-m.x-o, r2=dx*dx+y*y+s.a*s.a-2*y*s.a*q.c+CORE*CORE;
      const f=MU0/(4*Math.PI)*amp*q.w/(r2*Math.sqrt(r2));
      bx+=(s.a*s.a-s.a*y*q.c)*f;
      by+=s.a*q.c*dx*f;
    }
    return {bx,by};
  }
  return Object.freeze({MU0,flux,mutual,coupling,motion,drive,experiment,field,source,clamp});
})();

/* =====================================================================
   Outils communs des animations d'induction (EM3, EM4) · AnimKit
   - EMK.unit(max, unité) : préfixe SI lisible (m, µ, n, k) pour les axes et mesures
   - EMK.vt(...)          : lettre surmontée d'une flèche (vecteur) dans un texte SVG
   - EMK.tplot(...)       : graphe temporel tracé jusqu'à l'instant courant (option « futur »),
                            tangente, aire algébrique sous la courbe, courbes fantômes
   - EMK.split(box, n)    : découpe verticale d'un panneau en n graphes
   ===================================================================== */
'use strict';
globalThis.EMK=(()=>{
  const PREF=[[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n']];
  /** facteur et préfixe pour que max soit entre 1 et 1000 */
  function unit(max,u){
    max=Math.abs(max);
    if(!(max>0)||!isFinite(max))return {f:1,u};
    for(const[s,p]of PREF)if(max>=s*.9995)return {f:1/s,u:p+u};
    return {f:1e9,u:'n'+u};
  }
  function vt(a,x,y,l,sub,o={}){
    const S=a.S,k=a.k,size=o.size??16,fs=size*k,wl=.62*fs,w=wl+(sub?.42*fs*String(sub).length:0);
    const x0=o.anchor==='middle'?x-w/2:o.anchor==='end'?x-w:x;
    return S.text(x0,y,S.v(l,sub),{size,c:o.c,weight:o.weight})+S.arrow(x0+.08*fs,y-.68*fs,x0+wl+.05*fs,y-.68*fs,{c:o.c,w:.9,head:4.2*k});
  }
  function split(P,n,gap){
    const k=1,g=gap??6;const h=(P.h-g*(n-1))/n;
    return Array.from({length:n},(_,i)=>({x:0,y:i*(h+g),w:P.w,h}));
  }
  /**
   * o = {box, T, xmin, t, futur, n, ylab, xlab, sym:true (axe symétrique),
   *      series:[{f|vals, c, w, dash, all(true : toujours entière), ghost}],
   *      tangent:{f, df, c}, area:{f, c}, id, marks:[{x, label, c}]}
   */
  function tplot(a,o){
    const S=a.S,k=a.k,C=a.C,n=o.n||300,x0=o.xmin??0,T=o.T,box=o.box;
    const xs=Array.from({length:n+1},(_,i)=>x0+(T-x0)*i/n);
    const ser=o.series.map(s=>({...s,v:s.vals||xs.map(s.f)}));
    let lo=Infinity,hi=-Infinity;
    for(const s of ser)for(const v of s.v)if(isFinite(v)){if(v<lo)lo=v;if(v>hi)hi=v}
    if(o.zero!==false){lo=Math.min(lo,0);hi=Math.max(hi,0)}
    if(o.sym){const m=Math.max(Math.abs(lo),Math.abs(hi));lo=-m;hi=m}
    if(!(hi-lo>1e-30)){hi=1;lo=o.sym?-1:0}
    const pd=(hi-lo)*.08;
    const G=S.graph({x:box.x+4*k,y:box.y+2*k,w:box.w-8*k,h:box.h-4*k,xmin:x0,xmax:T,ymin:lo-(lo<0?pd:0),ymax:hi+pd,
      xlab:o.xlab??`${S.v('t')} (s)`,ylab:o.ylab,padL:o.padL});
    const tc=Math.max(x0,Math.min(T,o.t));
    const id=(o.id||'g')+Math.round(box.y);
    let s=G.svg+S.clip(id,G);
    const upto=(v,all)=>{const pts=[];for(let i=0;i<=n;i++){if(!all&&xs[i]>tc+1e-12)break;pts.push([xs[i],v[i]])}return pts};
    if(o.area){
      const pts=[];for(let i=0;i<=n;i++){if(xs[i]>tc+1e-12)break;pts.push([xs[i],o.area.f(xs[i])])}
      pts.push([tc,o.area.f(tc)]);
      if(pts.length>1){const d='M'+G.X(pts[0][0]).toFixed(1)+','+G.Y(0).toFixed(1)+pts.map(p=>'L'+G.X(p[0]).toFixed(1)+','+G.Y(p[1]).toFixed(1)).join('')+'L'+G.X(tc).toFixed(1)+','+G.Y(0).toFixed(1)+'Z';
        s+=`<g clip-path="url(#${id})"><path d="${d}" fill="${o.area.c}" fill-opacity=".22" stroke="none"/></g>`}
    }
    for(const sr of ser){
      const all=o.futur||sr.all, pts=upto(sr.v,all);
      if(!all&&!sr.vals&&sr.f)pts.push([tc,sr.f(tc)]);
      s+=S.curve(pts,G,{c:sr.c,w:sr.w??2.4,dash:sr.dash?`${6*k} ${4*k}`:undefined,op:sr.op});
    }
    if(o.tangent){
      const y0=o.tangent.f(tc),sl=o.tangent.df(tc),L=(T-x0)*.16;
      s+=S.curve([[tc-L,y0-sl*L],[tc+L,y0+sl*L]],G,{c:o.tangent.c||C.pred,w:1.8,dash:`${5*k} ${3*k}`});
    }
    for(const m of o.marks||[]){if(m.x<x0||m.x>T)continue;
      s+=S.line(G.X(m.x),G.y0,G.X(m.x),G.y0+G.h,{c:m.c||C.pred,w:1.2,dash:`${2*k} ${3*k}`})+S.text(G.X(m.x)+4*k,G.y0+4*k,m.label,{base:'top',size:13,c:m.c||C.pred})}
    s+=S.line(G.X(tc),G.y0,G.X(tc),G.y0+G.h,{c:C.ink2,w:1,dash:`${3*k} ${4*k}`});
    for(const sr of ser)if(sr.f&&!sr.ghost){const y=sr.f(tc);if(isFinite(y))s+=S.circle(G.X(tc),G.Y(y),3.8*k,{fill:sr.c})}
    return {svg:s,G};
  }
  return Object.freeze({unit,vt,split,tplot});
})();

/* Fonction de flux Ψ = r A_φ d'anneaux coaxiaux (axe x) : les lignes de champ sont les
   lignes de niveau de Ψ (flux à travers le disque de rayon r centré sur l'axe : 2πΨ).
   Intégrales elliptiques complètes par moyenne arithmético-géométrique. */
globalThis.EMPsi=(()=>{
  const MU0=4e-7*Math.PI;
  function ellip(m){let a=1,b=Math.sqrt(1-m),sum=m/2,w=1;
    for(let i=0;i<24;i++){const c=(a-b)/2,na=(a+b)/2;sum+=w*c*c;w*=2;b=Math.sqrt(a*b);a=na;if(Math.abs(c)<2e-16*a)break;}
    const K=Math.PI/(2*a);return [K,K*(1-sum)];}
  function ring(a,I,z,r){
    if(r<1e-9)return 0;
    const m=Math.min(1-1e-12,4*a*r/((a+r)**2+z*z)),[K,E]=ellip(m),kk=Math.sqrt(m);
    return r*MU0*I/(Math.PI*kk)*Math.sqrt(a/r)*((1-m/2)*K-E);
  }
  /** rings = [{a, x, I}] ; renvoie Ψ(x, r) */
  const psi=(rings,x,r)=>{let s=0;for(const q of rings)s+=ring(q.a,q.I,x-q.x,r);return s;};
  /** lignes de niveau (carrés marchants) : grille F[(j)*(nx+1)+i], renvoie [[x1,y1,x2,y2]…] par niveau */
  function contours(F,nx,ny,levels){
    const out=levels.map(()=>[]);
    for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
      const v0=F[j*(nx+1)+i],v1=F[j*(nx+1)+i+1],v2=F[(j+1)*(nx+1)+i+1],v3=F[(j+1)*(nx+1)+i];
      const lo=Math.min(v0,v1,v2,v3),hi=Math.max(v0,v1,v2,v3);
      levels.forEach((L,n)=>{
        if(L<=lo||L>=hi)return;
        const c=(v0>L)|(v1>L)<<1|(v2>L)<<2|(v3>L)<<3;
        const e=q=>q===0?[i+(L-v0)/(v1-v0),j]:q===1?[i+1,j+(L-v1)/(v2-v1)]:q===2?[i+(L-v3)/(v2-v3),j+1]:[i,j+(L-v0)/(v3-v0)];
        const T={1:[[3,0]],2:[[0,1]],3:[[3,1]],4:[[1,2]],5:[[3,2],[0,1]],6:[[0,2]],7:[[3,2]],8:[[2,3]],9:[[0,2]],10:[[0,3],[1,2]],11:[[1,2]],12:[[1,3]],13:[[0,1]],14:[[0,3]]}[c];
        if(T)for(const[a,b]of T){const p=e(a),q=e(b);out[n].push([p[0],p[1],q[0],q[1]]);}
      });
    }
    return out;
  }
  return Object.freeze({ring,psi,contours,MU0});
})();

// @titre Expériences d'induction et loi de Lenz · EM3 · MPSI
// @sortie ../EM3_Experiences_Lenz/EM3_Experiences_Lenz.html
// @inclure EM3_physique.js
// @inclure EM3_commun.js
// @description Aimant ou bobine source devant une bobine réceptrice : flux, f.é.m., courant induit, champ induit et force de Lenz ; lignes de champ calculées ; chute d'un aimant à travers la bobine.
'use strict';
/* =====================================================================
   EM3 · Expériences d'induction et loi de Lenz (4 onglets)
   Physique : EM3Model (EM3_physique.js, ex-physique.js), équations inchangées :
   anneaux de courant équivalents, inductance mutuelle de Neumann, Φ = K I, e = −dΦ/dt,
   i = e/R (auto-induction négligée), force sur la source F = i I dK/dx, B_ind = μ₀ N i/(2a).
   Ajouts du lot 9 :
   - lignes de champ = lignes de niveau de la fonction de flux Ψ = r A_φ des mêmes anneaux
     (EMPsi, EM3_commun.js) : le nombre de lignes qui traversent la bobine suit le flux ;
   - onglet « Chute d'un aimant » : mouvement calculé m dv/dt = −m g + F (RK4),
     comparaison à la chute libre, bilan E_p perdue = E_c + Q_Joule ;
   - aire algébrique sous e(t) (∫ e dt = −ΔΦ), flèches proportionnelles.
   ===================================================================== */
const M=AnimKit.M,Ph=EM3Model,K=EMK,PS=EMPsi,G=9.81,AREC=.065;
const mv=s=>M.v(s);
const IND={dark:'#ff86d0',light:'#b0237a'};
const st={man:{x:-.16,v:0,last:0},hist:[],drag:null,geo:null};
const MODE=['magnet','moving','fixed','magnet'];

const par=a=>({mode:MODE[a.tab],motion:a.tab===2?'approach':a.p.motion,speed:a.p.speed,distance:a.p.dist,N:a.p.N,R:a.p.R,
  strength:a.p.strength,amplitude:a.p.amp,frequency:a.p.freq,signal:a.p.signal,polarity:a.p.pol,orientation:a.p.ori,closed:a.p.closed});
const isMan=a=>a.tab<2&&a.p.motion==='manual';
const hidden=a=>a.p.prevoir;
function total(a){return a.tab===2?8:a.tab===3?chute(a).T:6/a.p.speed;}

/* ---------- traces précalculées ---------- */
let cT=null;
function trace(a){
  const p=par(a),key=JSON.stringify([a.tab,p]);
  if(cT&&cT.key===key)return cT;
  const pm=p.motion==='manual'||p.motion==='hold'?{...p,motion:'pass'}:p;   // échelles de dessin
  const T=p.mode==='fixed'?8:6/p.speed,n=320;
  const pts=Array.from({length:n+1},(_,j)=>Ph.experiment(T*j/n,p));
  const ref=pm===p?pts:Array.from({length:n+1},(_,j)=>Ph.experiment(6/p.speed*j/n,pm));
  const ext=(L,f)=>Math.max(1e-30,...L.map(m=>Math.abs(f(m))));
  const all=[...pts,...ref];
  const fast=Array.from({length:n+1},(_,j)=>Ph.experiment(T*j/n,{...p,speed:p.speed*2}));
  cT={key,T,pts,fast,maxPhi:ext(all,m=>m.phi),maxE:ext([...all,...fast],m=>m.e),maxI:ext(all,m=>m.physicalI),maxB:ext(all,m=>m.Bind),maxF:ext(all,m=>m.force),maxV:ext(all,m=>m.v),
    maxI1:Math.max(1e-30,Math.abs(p.amplitude))};
  return cT;
}
function model(a,t=a.t){
  if(a.tab===3)return chuteAt(a,t);
  return Ph.experiment(t,par(a),isMan(a)?{x:st.man.x,v:st.man.v,T:8}:null);
}

/* ---------- chute de l'aimant (mouvement calculé) ---------- */
let cC=null;
function chute(a){
  const p={...par(a),mode:'magnet'},mass=a.p.mass/1000,x0=a.p.h0/100,xend=-.16,key=JSON.stringify([p,mass,x0]);
  if(cC&&cC.key===key)return cC;
  const I=p.polarity*Ph.source(p).equivalent;
  const der=y=>{const c=Ph.coupling(y[0],p),e=p.orientation*(-c.dK*y[1]*I),i=p.closed?e/p.R:0,F=p.orientation*i*I*c.dK;return [y[1],-G+F/mass,p.R*i*i];};
  const dt=2e-4,out=[];let y=[x0,0,0],t=0;
  const rec=()=>{const c=Ph.coupling(y[0],p),phi=p.orientation*c.K*I,e=p.orientation*(-c.dK*y[1]*I),i=p.closed?e/p.R:0,phys=p.orientation*i;
    out.push({t,x:y[0],v:y[1],Q:y[2],phi,e,i,physicalI:phys,I,force:phys*I*c.dK,Bind:Ph.MU0*p.N*phys/(2*AREC),
      Ep:mass*G*(x0-y[0]),Ec:.5*mass*y[1]*y[1],free:x0-G*t*t/2,vfree:-G*t});};
  rec();
  for(let j=0;j<20000&&y[0]>xend;j++){
    const k1=der(y),y2=y.map((v,i)=>v+dt/2*k1[i]),k2=der(y2),y3=y.map((v,i)=>v+dt/2*k2[i]),k3=der(y3),y4=y.map((v,i)=>v+dt*k3[i]),k4=der(y4);
    y=y.map((v,i)=>v+dt/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i]));t+=dt;if(j%5===4)rec();
  }
  rec();
  const ext=f=>Math.max(1e-30,...out.map(m=>Math.abs(f(m))));
  cC={key,out,T:t,mass,x0,maxPhi:ext(m=>m.phi),maxE:ext(m=>m.e),maxI:ext(m=>m.physicalI),maxB:ext(m=>m.Bind),maxF:ext(m=>m.force),maxV:Math.max(ext(m=>m.v),G*t)};
  return cC;
}
function chuteAt(a,t){
  const C=chute(a),o=C.out;if(t<=0)return {...o[0],mode:'chute'};if(t>=C.T)return {...o[o.length-1],mode:'chute'};
  let lo=0,hi=o.length-1;while(hi-lo>1){const md=(lo+hi)>>1;if(o[md].t<=t)lo=md;else hi=md;}
  const A0=o[lo],B0=o[hi],r=(t-A0.t)/((B0.t-A0.t)||1),q={};
  for(const k in A0)q[k]=typeof A0[k]==='number'?A0[k]+(B0[k]-A0[k])*r:A0[k];
  return q;
}

/* ---------- géométrie de la scène ---------- */
function frame(a){
  const P=a.panels.scene,k=a.k,w=P.w,h=P.h,v=a.tab===3;
  const side=v?Math.min(190*k,w*.36):(w>=560?150*k:0);              // colonne réservée (vue de face ou bilan)
  const W=w-side;let o;
  if(v){const xmin=-.18,xmax=a.p.h0/100+.05,sc=Math.min((W-30*k)/.24,(h-24*k)/(xmax-xmin)),cx=W*.5,cy=12*k+xmax*sc;
    o={v,xmin,xmax,sc,P:(x,r)=>[cx+r*sc,cy-x*sc],ax:[0,-1],rd:[1,0]};}
  else{const p=par(a),whole=p.motion==='pass'||isMan(a);let xmin=-.29,xmax=whole?.29:.14;
    if(a.p.rel&&a.tab<2&&!isMan(a)){const x0=Ph.motion(0,p).x,x1=x0-Ph.motion(total(a),p).x;xmin=Math.min(x0,0,x1)-.075;xmax=Math.max(x0,0,x1)+.12;}
    const sc=Math.min((W-30*k)/(xmax-xmin),(h-96*k)/.21),cx=W/2-(xmin+xmax)*sc/2,cy=h*.43;
    o={v,xmin,xmax,sc,P:(x,r)=>[cx+x*sc,cy-r*sc],ax:[1,0],rd:[0,-1]};}
  o.side=side;o.W=W;o.w=w;o.h=h;return o;
}
/** dessine une spire vue de profil (ellipse aplatie suivant l'axe) */
function ring(a,F,x,R,c,w,op,gap=0){
  const pts=Array.from({length:73},(_,j)=>{const u=-Math.PI+gap+(2*Math.PI-2*gap)*j/72;return F.P(x+.28*R*Math.sin(u),R*Math.cos(u))});
  return a.S.poly(pts,{c,w,op});
}
let dPsi={};
function psiStep(mode){
  if(dPsi[mode])return dPsi[mode];
  const s=Ph.source({mode,strength:1}),amp=(mode==='magnet'?s.equivalent:1)*s.turns/s.offsets.length;
  return dPsi[mode]=PS.psi(s.offsets.map(o=>({a:s.a,x:o,I:amp})),0,AREC)/7;
}
function fieldLines(a,F,xs,xr,m,p){
  const S=a.S,C=a.C,k=a.k,s=Ph.source(p),amp=m.I*s.turns/s.offsets.length;
  if(Math.abs(amp)<1e-12)return '';
  const rings=s.offsets.map(o=>({a:s.a,x:xs+o,I:amp})),RM=.105;
  const nx=Math.max(40,Math.round((F.xmax-F.xmin)*F.sc/(7*k))),nr=Math.max(14,Math.round(RM*F.sc/(7*k)));
  const dx=(F.xmax-F.xmin)/nx,dr=RM/nr,Fg=new Float64Array((nx+1)*(nr+1));
  for(let j=0;j<=nr;j++)for(let i=0;i<=nx;i++)Fg[j*(nx+1)+i]=PS.psi(rings,F.xmin-xr+i*dx,j*dr);
  const d=psiStep(p.mode==='fixed'?'moving':p.mode)*Math.sign(amp),levels=Array.from({length:28},(_,j)=>(j+1)*d);
  const segs=PS.contours(Fg,nx,nr,levels);
  let path='',heads='';
  segs.forEach(L=>{L.forEach((g,n)=>{
    for(const sg of [1,-1]){const p1=F.P(F.xmin+g[0]*dx,sg*g[1]*dr),p2=F.P(F.xmin+g[2]*dx,sg*g[3]*dr);path+=`M${p1[0].toFixed(1)},${p1[1].toFixed(1)}L${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;}
    if(n%34===17){const xw=F.xmin-xr+(g[0]+g[2])/2*dx,rw=(g[1]+g[3])/2*dr;
      if(rw<.004)return;
      const B=Ph.field(xw,rw,{x:xs,I:m.I},p);
      for(const sg of [1,-1]){const c=F.P(xw+xr,sg*rw),bx=B.bx,by=sg*B.by,nb=Math.hypot(bx,by)||1,ux=(bx*F.ax[0]+by*F.rd[0])/nb,uy=(bx*F.ax[1]+by*F.rd[1])/nb,h=6.5*k;
        heads+=`<path d="M${(c[0]+ux*h).toFixed(1)},${(c[1]+uy*h).toFixed(1)}L${(c[0]-ux*h*.6-uy*h*.55).toFixed(1)},${(c[1]-uy*h*.6+ux*h*.55).toFixed(1)}L${(c[0]-ux*h*.6+uy*h*.55).toFixed(1)},${(c[1]-uy*h*.6-ux*h*.55).toFixed(1)}Z" fill="${C.B}" opacity=".85"/>`;}}
  });});
  return `<path d="${path}" fill="none" stroke="${C.B}" stroke-width="${(1.15*k).toFixed(2)}" opacity=".55"/>`+heads;
}

  const ind=C.dark?IND.dark:IND.light,v=F.v;

  const x00=a.tab<2?Ph.motion(0,p).x:0,xr=rel?-m.x+x00:0,xs=rel?x00:m.x;

  // axe
  {const q1=F.P(F.xmin,0),q2=F.P(F.xmax,0);s+=S.line(q1[0],q1[1],q2[0],q2[1],{c:C.ink2,w:1,dash:`${4*k} ${6*k}`,op:.7});

  const meter=v?[F.P(xr,-AREC)[0]-46*k,F.P(xr,-AREC)[1]]:[F.P(xr,-AREC)[0],F.P(xr,-AREC)[1]+34*k];
  const mo=v?[0,13*k]:[13*k,0];

  if(p.closed)s+=S.rect(meter[0]-18*k,meter[1]-10*k,36*k,20*k,{fill:C.card,c:C.ink,w:1.8,rx:2})+S.text(meter[0],meter[1],S.v('R'),{anchor:'middle',size:15,c:C.ink});
  else s+=S.circle(meter[0],meter[1],16*k,{fill:C.card,c:C.ink,w:1.7})+S.text(meter[0],meter[1],'V',{anchor:'middle',size:15,c:C.ink,weight:600});
  // vecteur surface (sens de référence)
  {const q=F.P(xr,AREC*1.18),L=46*k*p.orientation,e=[q[0]+F.ax[0]*L,q[1]+F.ax[1]*L];s+=S.arrow(q[0],q[1],e[0],e[1],{c:C.ink,w:2});
   s+=K.vt(a,e[0]+(v?10*k:(p.orientation>0?8:-8)*k),e[1]+(v?4:-2)*k,'S',undefined,{c:C.ink,size:15,anchor:v||p.orientation>0?'start':'end'});}
  // source
  const geo={};
  if(p.mode==='magnet'||a.tab===3){
    const half=.034,th=Math.max(11*k,.0145*sc),N1=F.P(xs+half,0),S1=F.P(xs-half,0),c0=F.P(xs,0);

    s+=K.vt(a,e[0]+(v?-6:Math.sign(vel)*8)*k,e[1]+(v?(vel>0?-8:16):4)*k,'v',undefined,{c:C.ink2,size:15,anchor:v?'end':vel>0?'start':'end'});}
  // courant, champ induit, force
  if(!hid&&p.closed&&Math.abs(m.physicalI)>1e-15){
    const fr=Math.abs(m.physicalI)/tr.maxI,u0=v?-Math.PI/2:Math.PI/2,span=1.2*fr,sg=Math.sign(m.physicalI)*(v?-1:1);
    const pts=Array.from({length:21},(_,j)=>{const u=u0-span/2+span*j/20;return F.P(xr+.28*AREC*Math.sin(u),AREC*Math.cos(u))});
    // arc avant de la bobine (côté observateur) ; sens d'après la règle de la main droite autour de +x
    const arc=v?pts:pts;s+=S.poly(arc,{c:C.E,w:5});
    if(span>.12){const A1=sg>0?arc[14]:arc[6],B1=sg>0?arc[20]:arc[0];s+=S.arrow(A1[0],A1[1],B1[0],B1[1],{c:C.E,w:4});}
    const Lb=70*k*m.Bind/tr.maxB,c0=F.P(xr,0),e=[c0[0]+F.ax[0]*Lb,c0[1]+F.ax[1]*Lb];
    if(Math.abs(Lb)>2){s+=S.line(c0[0],c0[1],e[0],e[1],{c:C.card,w:9});s+=S.arrow(c0[0],c0[1],e[0],e[1],{c:ind,w:4.5});
      s+=K.vt(a,e[0]+(v?12:Math.sign(Lb)*8)*k,e[1]+(v?(Lb>0?-6:18):22)*k,'B','ind',{c:ind,size:16,anchor:v?'start':Lb>0?'start':'end',weight:600});}
    if(a.tab!==2&&Math.abs(m.force)>1e-15){const who=rel?F.P(xr,0):geo.src,Fx=rel?-m.force:m.force,L=56*k*Fx/tr.maxF,off=v?[geo.r+14*k,0]:[0,.075*sc+12*k];
      const o=[who[0]+off[0],who[1]+off[1]],e2=[o[0]+F.ax[0]*L,o[1]+F.ax[1]*L];
      if(Math.abs(L)>8*k){s+=S.arrow(o[0],o[1],e2[0],e2[1],{c:C.Em,w:3.4});s+=K.vt(a,e2[0]+(v?8:Math.sign(Fx)*8)*k,e2[1]+(v?4:5)*k,'F',undefined,{c:C.Em,size:16,anchor:v||Fx>0?'start':'end'});}}
  }
  // colonne réservée
  if(F.side>0)s+=a.tab===3?bilan(a,F,m,tr):face(a,F,m,tr,hid,ind);
  if(!v)s+=S.text(10*k,10*k,a.tab===2?`Bobines fixes · distance ${f.sig(p.distance,3)} cm`:`${S.v('x')}<tspan font-size="72%" dy="0.42em">source</tspan><tspan dy="-0.3em">​</tspan> − ${S.v('x')}<tspan font-size="72%" dy="0.42em">bobine</tspan><tspan dy="-0.3em">​</tspan> = ${f.sig(m.x*100,3)} cm`,{base:'top',size:14,c:C.ink});
  a.svg('scene',s);
}
function face(a,F,m,tr,hid,ind){
  const S=a.S,C=a.C,k=a.k,x=F.W+F.side/2,y=F.h*.32,r=Math.min(36*k,F.side*.3);
  let s=S.line(F.W,10*k,F.W,F.h-10*k,{c:C.rule,w:1});
  s+=S.text(x,y-r-30*k,'Vue depuis +'+S.v('x'),{anchor:'middle',size:13,c:C.ink2});
  s+=S.circle(x,y,r,{c:C.c,w:2.4});
  if(!hid&&a.p.closed&&Math.abs(m.physicalI)>1e-15){
    const fr=Math.abs(m.physicalI)/tr.maxI,sg=Math.sign(m.physicalI),span=Math.max(.2,2.6*fr);
    s+=S.arc(x,y,r,Math.PI/2+(sg>0?-span/2:span/2),Math.PI/2+(sg>0?span/2:-span/2),{c:C.E,w:4,arrow:true});
    s+=S.text(x,y,m.Bind>0?'⊙':'⊗',{anchor:'middle',size:24,c:ind,halo:false});
  }else s+=S.text(x,y,hid?'?':S.v('i')+' = 0',{anchor:'middle',size:16,c:C.ink2});
  s+=S.text(x,y+r+18*k,'courant réel',{anchor:'middle',size:13,c:C.ink2});
  s+=S.text(x,y+r+36*k,'champ induit',{anchor:'middle',size:13,c:ind});
  return s;
}
function bilan(a,F,m,tr){
  const S=a.S,C=a.C,k=a.k,f=a.fmt,x0=F.W+14*k,wB=F.side-28*k,top=40*k,Hb=F.h-top-60*k;
  const Emax=Math.max(1e-12,tr.mass*G*(tr.x0+.16));
  let s=S.line(F.W,10*k,F.W,F.h-10*k,{c:C.rule,w:1})+S.text(F.W+F.side/2,12*k,'Bilan d\'énergie',{anchor:'middle',base:'top',size:14,c:C.ink});
  const bars=[['E','p,perdue',m.Ep,C.c],['E','c',m.Ec,C.v],['Q','J',m.Q,C.E]],bw=wB/3;
  bars.forEach(([l,sub,val,col],j)=>{const bh=Hb*Math.max(0,val)/Emax,xb=x0+j*bw+bw*.18;
    s+=S.rect(xb,top+Hb-bh,bw*.64,bh,{fill:col,fop:.85})+S.text(xb+bw*.32,top+Hb+14*k,S.v(l,sub.split(',')[0]),{anchor:'middle',size:14,c:col});
    s+=S.text(xb+bw*.32,top+Hb+32*k,f.fix(val*1000,2),{anchor:'middle',size:13,c:C.ink2});});
  s+=S.line(x0,top+Hb,x0+wB,top+Hb,{c:C.ink2,w:1});
  s+=S.text(F.W+F.side/2,F.h-12*k,a.narrow?'(mJ)':`(mJ) · ${S.v('E','p')} perdue = ${S.v('E','c')} + ${S.v('Q')}`,{anchor:'middle',size:13,c:C.ink2});
  return s;
}

/* ---------- graphes ---------- */
function resample(hist,t0,t1,key,n=200){
  const out=[];if(!hist.length)return {xs:[],v:[]};let j=0;
  for(let i=0;i<=n;i++){const t=t0+(t1-t0)*i/n;while(j<hist.length-1&&hist[j+1].t<=t)j++;out.push(hist[j].t<=t+1e-9?hist[j][key]:NaN);}
  return out;
}
function drawGraph(a){
  const P=a.panels[a.tab===3?'graphe3':'graphe'],S=a.S,C=a.C,k=a.k,b=K.split(P,2,4*k),hid=hidden(a);
  if(a.tab===3){
    const tr=chute(a),T=tr.T,uE=K.unit(tr.maxE,'V'),fv=t=>chuteAt(a,t).v,fe=t=>chuteAt(a,t).e*uE.f;
    const g1=K.tplot(a,{box:b[0],T,t:a.t,futur:a.p.futur,ylab:`${S.v('v')} (m·s${S.sup('−1')})`,
      series:[a.p.ghost?{f:t=>-G*t,c:C.ink2,w:1.6,dash:true,all:true,ghost:true}:null,{f:fv,c:C.ink}].filter(Boolean),id:'c1'});
    const g2=K.tplot(a,{box:b[1],T,t:a.t,futur:a.p.futur,ylab:`${S.v('e')} (${uE.u})`,series:hid?[]:[{f:fe,c:C.F}],area:hid?null:{f:fe,c:C.F},sym:true,id:'c2'});
    a.svg('graphe3',g1.svg+g2.svg+(hid?S.text(P.w/2,b[1].y+b[1].h/2,'à prévoir',{anchor:'middle',size:16,c:C.pred}):''));
    return;
  }
  const tr=trace(a),uP=K.unit(tr.maxPhi,'Wb'),uE=K.unit(tr.maxE,'V');
  if(isMan(a)){
    const t1=Math.max(8,a.t),t0=t1-8,n=200;
    const g1=K.tplot(a,{box:b[0],xmin:t0,T:t1,n,t:a.t,futur:true,ylab:`Φ (${uP.u})`,series:[{vals:resample(st.hist,t0,t1,'phi').map(x=>x*uP.f),c:C.v}],id:'m1'});
    const g2=K.tplot(a,{box:b[1],xmin:t0,T:t1,n,t:a.t,futur:true,ylab:`${S.v('e')} (${uE.u})`,series:hid?[]:[{vals:resample(st.hist,t0,t1,'e').map(x=>x*uE.f),c:C.F}],sym:true,id:'m2'});
    a.svg('graphe',g1.svg+g2.svg);return;
  }
  const T=tr.T,fP=t=>model(a,t).phi*uP.f,fE=t=>model(a,t).e*uE.f,cmp=a.p.compare&&a.tab<2&&a.p.motion!=='hold';
  const g1=K.tplot(a,{box:b[0],T,t:a.t,futur:a.p.futur,ylab:`Φ (${uP.u})`,series:[{vals:tr.pts.map(m=>m.phi*uP.f),c:C.v},{f:fP,c:C.v,w:0}],n:320,id:'p1'});
  const ser=hid?[]:[cmp?{vals:tr.fast.map(m=>m.e*uE.f),c:C.F,w:1.6,dash:true,all:true,ghost:true}:null,{vals:tr.pts.map(m=>m.e*uE.f),c:C.F},{f:fE,c:C.F,w:0}].filter(Boolean);
  const g2=K.tplot(a,{box:b[1],T,t:a.t,futur:a.p.futur,ylab:`${S.v('e')} (${uE.u})`,series:ser,area:hid?null:{f:fE,c:C.F},sym:true,n:320,id:'p2'});
  a.svg('graphe',g1.svg+g2.svg+(hid?S.text(P.w/2,b[1].y+b[1].h/2,'à prévoir',{anchor:'middle',size:16,c:C.pred}):''));
}

/* ---------- mesures ---------- */
function info(a){
  const f=a.fmt,C=a.C,p=par(a),m=model(a),hid=hidden(a),tr=a.tab===3?chute(a):trace(a);
  const uP=K.unit(tr.maxPhi,'Wb'),uE=K.unit(tr.maxE,'V'),uI=K.unit(tr.maxI,'A'),q='?';
  const phi0=a.tab===3?chute(a).out[0].phi:isMan(a)?(st.hist[0]?st.hist[0].phi:m.phi):model(a,0).phi;
  const L=[{label:'Flux lié Φ',value:f.sig(m.phi*uP.f,3),unit:uP.u,hint:a.tab===3?`${p.N} spires`:`${p.N} spires · flux de la source`},
    {label:`F.é.m. ${mv('e')} = −dΦ/d${mv('t')}`,value:hid?q:f.sig(m.e*uE.f,3),unit:hid?'':uE.u,hint:hid?'à prévoir':a.tab===3?'convention générateur':`∫${mv('e')} d${mv('t')} = −ΔΦ = ${f.sig(-(m.phi-phi0)*uP.f,3)} ${uP.u}`},
    {label:`Courant ${mv('i')}`,value:hid?q:p.closed?f.sig(m.i*uI.f,3):'0',unit:hid?'':p.closed?uI.u:'A',hint:p.closed?`${mv('i')} = ${M.frac(mv('e'),mv('R'))}`:'mesure à vide'}];
  if(a.tab===3){const C2=chute(a),last=C2.out[C2.out.length-1];
    L.unshift({label:`Vitesse ${mv('v')}`,value:f.sig(m.v,3),unit:'m·s<sup>−1</sup>',hint:`${mv('x')} = ${f.sig(m.x*100,3)} cm`});
    L[3]={label:'Chaleur Joule',value:f.sig(m.Q*1000,3),unit:'mJ',hint:`${f.sig(100*m.Q/Math.max(1e-12,m.Ep),2)} % de ${M.v('E','p')} perdue`};}
  a.metrics(L);
  let t;
  if(a.tab===3)t=!p.closed?'Circuit ouvert : aucun courant, aucune force ; l\'aimant tombe en chute libre. Le second pic de <i class="m">e</i> est plus haut et plus bref : l\'aimant va plus vite.':
    'Circuit fermé : le courant induit freine l\'aimant à l\'approche comme à l\'éloignement ; <i class="m">E</i><sub>p</sub> perdue = <i class="m">E</i><sub>c</sub> + <i class="m">Q</i>. Avec une seule bobine le freinage reste faible ; un tube de cuivre le rend spectaculaire (EM5).';
  else if(hid)t='Prévoir le signe de <i class="m">e</i>, le sens du courant réel et celui de la force, puis décocher « Prévoir ».';
  else if(!p.closed)t=Math.abs(m.e)<tr.maxE*1e-3?(a.tab<2&&a.p.motion==='hold'?'Source immobile : même avec un flux non nul, la f.é.m. est nulle.':'Le flux ne varie pas à cet instant : <i class="m">e</i> = 0.'):'Mesure à vide : une f.é.m. existe sans courant. Son signe dépend du sens de variation du flux et du sens de référence.';
  else if(Math.abs(m.physicalI)<tr.maxI*1e-3)t='Pente du flux nulle à cet instant : <i class="m">i</i> = 0, même si Φ ≠ 0.';
  else if(a.tab===2)t=m.physicalI*m.I<0?'Le champ induit s\'oppose au champ de la source : il modère l\'augmentation du flux.':'Le champ induit renforce le champ de la source : il modère la diminution du flux.';
  else t='Loi de Lenz : la force magnétique s\'oppose au mouvement relatif qui crée l\'induction ; le champ induit modère la variation du flux.';
  a.insight(t,['Circuit ouvert : aucun courant, aucune force ; l\'aimant tombe en chute libre. Le second pic de <i class="m">e</i> est plus haut et plus bref : l\'aimant va plus vite.','Mesure à vide : une f.é.m. existe sans courant. Son signe dépend du sens de variation du flux et du sens de référence.']);
  a.clock(a.tab===3?`${mv('t')} = ${f.fix(a.t*1000,0)} ms · ralenti ×10`:`${mv('t')} = ${f.fix(a.t,2)} s`);
  a.legend([a.p.lignes&&{c:C.B,label:'lignes du champ de la source'},{c:C.v,label:'flux Φ'},{c:C.F,label:'f.é.m. e'},p.closed&&{c:C.E,label:'courant réel'},p.closed&&{c:C.dark?IND.dark:IND.light,label:'champ induit (agrandi)'},p.closed&&a.tab!==2&&{c:C.Em,label:'force sur la partie mobile'},a.tab===3&&a.p.ghost&&{c:C.ink2,dash:true,label:'chute libre'}]);
}

/* ---------- saisie de la source ---------- */
A.drag('scene',{
  hit:(x,y)=>{const g=st.geo;return A.tab<2&&!!g&&Math.hypot(x-g.src[0],y-g.src[1])<g.r+8*A.k;},
  start(x){const g=st.geo;
    if(!isMan(A)){const x0=model(A).x;A.set('motion','manual');st.hist=[];st.man={x:x0,v:0,last:performance.now()};A.t=0;}
    st.drag={x,x0:st.man.x,px:st.man.x,pt:performance.now()};A.play(true);},
  move(x){const d=st.drag;if(!d)return;const now=performance.now(),nx=Math.max(-.26,Math.min(.26,d.x0+(x-d.x)/st.geo.F.sc)),dt=Math.max(.012,(now-d.pt)/1000);
    st.man.v=Math.max(-1.5,Math.min(1.5,(nx-d.px)/dt));st.man.x=nx;st.man.last=now;d.px=nx;d.pt=now;},
  end(){st.man.v=0;st.drag=null;}
});

</script>
