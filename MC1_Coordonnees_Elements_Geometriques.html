   Une animation décrit sa configuration et ses fonctions :
     AnimKit.app({
       code:'OP1', partie:'TurquoiseLagon', titre:'…', sousTitre:'…', chapitre:'OP1 Propagation de la lumière',
       onglets:['Vue de face','Perspective'],            // facultatif
       temps:true | (app)=>bool,                          // barre de lecture
       pas:1/24,                                          // durée simulée d'un « Pas »
       panneaux:[{id:'scene', titre:'…', poids:2, type:'svg'|'canvas', onglets:[0], ratioTel:.8, zoom:true}],
       reglages:[{titre:'Situations', presets:[{label, valeurs:{…}, lecture:true}]},

       aide:{voit, faire, modele, cours},
       init(app), reset(app), step(app,dt), draw(app), change(app,id,v), onglet(app,i)
     })
   Le kit fournit : app.p (paramètres), app.tab, app.t, app.C (couleurs), app.k (échelle projection),
   app.S (dessin SVG), app.fmt (nombres), app.metrics(), app.insight(), app.legend(), app.clock(), app.drag()…
   Réglage à échelle logarithmique : {id,type:'range',log:true,min,max,dec} (curseur en log10, champ numérique en valeur réelle).
   Disposition facultative  atelier:{saisie:'Mes mesures', detail:'Voir le calcul'} : app.zones.saisie / .resultat / .detail

(function(){
'use strict';
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const MATH='"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif';
const MINUS='−';

/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  /** n chiffres significatifs, sans notation exponentielle */
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e<-3||e>=6){const m=x/10**e;return (+m.toFixed(n-1)).toFixed(n-1).replace('-',MINUS)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>'}
    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){
      let d='',pen=false;
      for(const[x,y]of pts){if(!isFinite(y)||!isFinite(x)){pen=false;continue}
        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}
  };

    ${h.credits?`<h4>Crédits</h4><p>${h.credits}</p>`:''}</div>`;
    dlg.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===dlg)dlg.close()});

  new ResizeObserver(()=>A.render()).observe(ak);

}

<script>
/* MC1 · modèle géométrique d'origine (inchangé, contrôlé par Verifier_Modele.mjs : 685 contrôles). */
/* Modèle autonome : coordonnées en cm et radians. Testable sans navigateur. */
const MC1Model=(()=>{
 const TAU=2*Math.PI,EPS=1e-9;
 const add=(a,b)=>a.map((x,i)=>x+b[i]),sub=(a,b)=>a.map((x,i)=>x-b[i]),mul=(a,k)=>a.map(x=>x*k),dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0),norm=a=>Math.hypot(...a),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],unit=a=>mul(a,1/norm(a)),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
 function from(s,q){let [a,b,c=0]=q;if(s==='cart')return [a,b,c];if(s==='sph')return [a*Math.sin(b)*Math.cos(c),a*Math.sin(b)*Math.sin(c),a*Math.cos(b)];return [a*Math.cos(b),a*Math.sin(b),s==='polar'?0:c];}
 function to(s,p,az=0){const [x,y,z]=p,rho=Math.hypot(x,y),r=norm(p),a=rho>EPS?(Math.atan2(y,x)+TAU)%TAU:az;if(s==='cart')return [...p];if(s==='sph')return [r,r>EPS?Math.acos(clamp(z/r,-1,1)):Math.PI/3,a];return [rho,a,...(s==='polar'?[]:[z])];}
 function basis(s,q){if(s==='cart')return [[1,0,0],[0,1,0],[0,0,1]];if(s==='sph'){let [,t,p]=q;return [[Math.sin(t)*Math.cos(p),Math.sin(t)*Math.sin(p),Math.cos(t)],[Math.cos(t)*Math.cos(p),Math.cos(t)*Math.sin(p),-Math.sin(t)],[-Math.sin(p),Math.cos(p),0]];}const a=q[1];return [[Math.cos(a),Math.sin(a),0],[-Math.sin(a),Math.cos(a),0],...(s==='polar'?[]:[[0,0,1]])];}
 function factors(s,q){if(s==='cart')return [1,1,1];if(s==='sph')return [1,q[0],q[0]*Math.sin(q[1])];return s==='polar'?[1,q[0]]:[1,q[0],1];}
 function differential(s,q,d){return basis(s,q).reduce((v,e,i)=>add(v,mul(e,factors(s,q)[i]*d[i])),[0,0,0]);}
 function measure(s,q,d,face=-1){const h=factors(s,q),ls=d.map((v,i)=>v*h[i]);if(s==='polar')return ls[0]*ls[1];return ls.reduce((v,x,i)=>i===face?v:v*x,1);}
 function finite(s,q,d,face=-1){const [r,t,p=0]=q,[dr,dt,dp=0]=d;if(s==='cart')return measure(s,q,d,face);if(s==='polar')return (r*dr+dr*dr/2)*dt;if(s==='cyl'){if(face===0)return r*dt*dp;if(face===1)return dr*dp;if(face===2)return (r*dr+dr*dr/2)*dt;return (r*dr+dr*dr/2)*dt*dp;}if(face===0)return r*r*(Math.cos(t)-Math.cos(t+dt))*dp;if(face===1)return (r*dr+dr*dr/2)*Math.sin(t)*dp;if(face===2)return (r*dr+dr*dr/2)*dt;return ((r+dr)**3-r**3)/3*(Math.cos(t)-Math.cos(t+dt))*dp;}
 function curve(type,u){const t=TAU*u;if(type==='circle')return {p:[2.2*Math.cos(t),2.2*Math.sin(t),0],d:[-2.2*TAU*Math.sin(t),2.2*TAU*Math.cos(t),0],dd:[-2.2*TAU*TAU*Math.cos(t),-2.2*TAU*TAU*Math.sin(t),0]};if(type==='ellipse')return {p:[3*Math.cos(t),1.6*Math.sin(t),0],d:[-3*TAU*Math.sin(t),1.6*TAU*Math.cos(t),0],dd:[-3*TAU*TAU*Math.cos(t),-1.6*TAU*TAU*Math.sin(t),0]};if(type==='parabola'){const x=6*u-3;return {p:[x,.32*x*x-1.4,0],d:[6,3.84*x,0],dd:[0,23.04,0]};}return {p:[6*u-3,0,0],d:[6,0,0],dd:[0,0,0]};}
 function frenet(type,u){const c=curve(type,u),g=norm(c.d),t=mul(c.d,1/g),nd=sub(c.dd,mul(t,dot(c.dd,t))),k=norm(cross(c.d,c.dd))/g**3,n=norm(nd)>EPS?unit(nd):null,rho=k>EPS?1/k:Infinity;return {...c,g,t,n,k,rho,center:n?add(c.p,mul(n,rho)):null};}
 function arcTable(type,N=1200){const values=[0];let prev=curve(type,0).p;for(let i=1;i<=N;i++){const p=curve(type,i/N).p;values.push(values[i-1]+norm(sub(p,prev)));prev=p;}return {values,N,L:values[N]};}

})();

    modele:'Les Δ désignent des accroissements finis, les d les expressions différentielles. Les arêtes courbes de la cellule finie sont réellement courbes ; la cellule tangentielle (pointillés) a pour arêtes <i class="m">h<sub>i</sub></i>(M) Δ<i class="m">q<sub>i</sub></i> avec les facteurs 1, <i class="m">r</i> ou <i class="m">r</i> sin <i class="m">θ</i>. Les accroissements sont limités pour respecter <i class="m">r</i> ≥ 0 et 0 ≤ <i class="m">θ</i> ≤ π en sphériques ; ils sont pris positifs pour les cellules. Sur l\'axe, à l\'origine ou aux pôles, la base dessinée est conventionnelle. Frenet : trajectoires planes, vitesse strictement positive ; loi variable <i class="m">v</i>(<i class="m">s</i>) = <i class="m">v</i><sub>0</sub> [1 + 0.3 sin(2π<i class="m">s</i>/<i class="m">L</i>)], <i class="m">a<sub>t</sub></i> = <i class="m">v</i> d<i class="m">v</i>/d<i class="m">s</i>, <i class="m">a<sub>n</sub></i> = <i class="m">v</i><sup>2</sup>/<i class="m">ρ</i>. Échelles : 1 cm·s<sup>−1</sup> ↔ 0.65 cm et 1 cm·s<sup>−2</sup> ↔ 1.3 cm. Projection orthographique ; ⊙ et ⊗ signalent une direction vers l\'observateur ou vers l\'arrière.',
    cours:'MC1 Cinématique du point : coordonnées cartésiennes, cylindriques et polaires, sphériques ; d<span class="vec">OM</span> = d<i class="m">r</i> <span class="vec">e</span><sub>r</sub> + <i class="m">r</i> d<i class="m">θ</i> <span class="vec">e</span><sub>θ</sub> + d<i class="m">z</i> <span class="vec">e</span><sub>z</sub> ; d<span class="vec">OM</span> = d<i class="m">r</i> <span class="vec">e</span><sub>r</sub> + <i class="m">r</i> d<i class="m">θ</i> <span class="vec">e</span><sub>θ</sub> + <i class="m">r</i> sin <i class="m">θ</i> d<i class="m">ϕ</i> <span class="vec">e</span><sub>ϕ</sub> ; abscisse curviligne et repère de Frenet.',
    credits:'Inspiration fonctionnelle : animation des systèmes de coordonnées de PhyzikStore (T. Roy). Réalisation indépendante.'
  },
  init(a){
    const P=a.panels.scene;
    P.head.innerHTML='<div class="mc1-bar"><span class="grp" data-g="stage"><button class="mini" data-stage="point">1 · Repérer M</button><button class="mini" data-stage="move">2 · Déplacement</button><button class="mini" data-stage="cell">3 · Surfaces et volume</button></span><span class="grp" data-g="view"><button class="mini" data-view="3d">3D</button><button class="mini" data-view="top">Dessus</button><button class="mini" data-view="meridian">Méridien</button><button class="mini" data-local="1">Vue locale</button></span></div>';
    P.head.className='ak-phead';
    P.head.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
      if(b.dataset.stage)setStage(a,b.dataset.stage);else if(b.dataset.view){st.view=b.dataset.view;P.zoom=1;clearFrame()}else if(b.dataset.local){st.local=!st.local;P.zoom=1;clearFrame()}
      a.refresh();a.render()});
    // Invalider avant le traitement du bouton Cadrer par le kit, même à zoom = 1.
    P.el.addEventListener('click',e=>{if(e.target.closest('[data-z="0"]'))clearFrame()},true);
    P.node.addEventListener('wheel',e=>{e.preventDefault();P.zoom=G.clamp(P.zoom*Math.exp(-e.deltaY*.001),.4,6);a.render()},{passive:false});
    syncCoordFields(a);
  },
  reset(a){if(a.tab===4)st.u=0;else{st.lam=0;st.ph=0}},
  change(a,id,v){
    const m=/^q_(\w+)_(\d)$/.exec(id);
    if(m){const s=m[1],i=+m[2],n=getQ(s);n[i]=v*(angular(s,i)?DEG:1);setQ(s,n);if(s==='polar')st.p[2]=0;return}
    if(id==='curve'){st.curve=v;st.arc=G.arcTable(v);st.u=.12;a.panels.scene.zoom=1;clearFrame()}
    if(id==='comp'){st.lam=1;st.ph=1}
  },
  onglet(a,i){
    const s=SYS[i];a.play(false);clearFrame();st.stage='point';st.local=false;a.panels.scene.zoom=1;cam.yaw=-.65;cam.pitch=.55;
    if(s==='frenet'){st.view='top';st.u=.12}
    else{if(s==='polar'){if(Math.abs(st.p[2])>1e-8)a.toast('Polaires : M est projeté dans le plan z = 0');st.p[2]=0;st.view='top'}else if(st.view!=='3d'&&st.view!=='meridian')st.view='3d'}

  step(a,dt){
    if(a.tab===4){
      const sp=G.speed(st.arc,st.u,a.p.v0,a.p.loi==='variable'),s=G.arcAt(st.arc,st.u),uh=G.uAt(st.arc,Math.min(st.arc.L,s+sp.v*dt/2)),vm=G.speed(st.arc,uh,a.p.v0,a.p.loi==='variable').v;
      let nx=s+vm*dt;if(nx>=st.arc.L){nx=st.arc.L;a.play(false)}st.u=G.uAt(st.arc,nx);a.t+=dt;
    }else{st.ph=Math.min(1,st.ph+dt*.23);st.lam=st.ph;if(st.ph>=1)a.play(false)}
  },
  draw(a){a.tab===4?drawFrenet(a):drawSpace(a);toolbar(a)}
});

function faceSel(a){const s=sysOf(a);return s==='polar'||s==='frenet'?-1:+a.p['face_'+s]}
function setStage(a,s){a.play(false);clearFrame();st.stage=s;st.local=s!=='point';a.panels.scene.zoom=1;st.lam=1;st.ph=1;for(const x of['cart','cyl','sph'])a.p['face_'+x]=-1;a.refresh()}
function resetTab(a){
  const s=sysOf(a),P=a.panels.scene;a.play(false);clearFrame();P.zoom=1;cam.yaw=-.65;cam.pitch=.55;
  if(s==='frenet'){for(const[k,v]of[['curve','circle'],['loi','uniform'],['v0',1],['osc',true],['vit',true],['acc',false],['compare',false]])a.set(k,v,{silent:true});st.curve='circle';st.arc=G.arcTable('circle');st.u=.12;st.view='top'}
  else{st.p=s==='polar'?[2.2,1.3,0]:[2.2,1.3,1.5];st.az=.53;st.local=st.stage!=='point';st.lam=1;st.ph=1;st.view=s==='polar'?'top':'3d';
    deltaItems(s).forEach(it=>a.set(it.id,it.value,{silent:true}));for(const[k,v]of[['eps',1],['comp','all'],['tang',false],['tcell',false],['normal',false],['basis',true],['position',true],['guides',true]])a.set(k,v,{silent:true});
    if(s!=='polar')a.set('face_'+s,-1,{silent:true})}
  syncCoordFields(a);
}
/** recopie les coordonnées de M dans les champs du kit sans déclencher de calcul */
function syncCoordFields(a){
  for(const s of['cart','cyl','polar','sph']){const n=getQ(s);n.forEach((v,i)=>{const val=+(v/(angular(s,i)?DEG:1)).toFixed(angular(s,i)?1:2);a.p[qid(s,i)]=val})}
  a.refresh();
}
function toolbar(a){
  const H=a.panels.scene.head,s=sysOf(a),flat=s==='polar'||s==='frenet';
  const setP=(b,on)=>{const v=String(!!on);if(b.getAttribute('aria-pressed')!==v)b.setAttribute('aria-pressed',v)};
  H.querySelector('[data-g=stage]').hidden=s==='frenet';
  for(const b of H.querySelectorAll('[data-stage]'))setP(b,b.dataset.stage===st.stage);

}

/* ===================== dessin : primitives 3D projetées ===================== */
let prims=[], texts=[], fitPts=[], view={W:600,H:400}, frameCache=null, axisLength=null;
function clearFrame(){frameCache=null;axisLength=null}
const pal=a=>({ink:a.C.ink,muted:a.C.ink2,ghost:a.C.pred,accent:a.C.cInk,c0:a.C.F,c1:a.C.B,c2:a.C.v,acc:a.C.E});
function raw(p,s){const az=s==='sph'?q[2]:s==='cart'||s==='frenet'?0:q[1];return G.project(p,st.view,cam.yaw,cam.pitch,az)}
let curSys='cart';

const line=(pts,color='muted',w=1.4,dash='',op=1)=>prims.push({kind:'line',pts,color,w,dash,op});
const poly=(pts,color,op,face=null)=>prims.push({kind:'poly',pts,color,op,face});
const arrow=(p1,p2,color='ink',w=2.5)=>prims.push({kind:'arrow',pts:[p1,p2],color,w});
const dot=(p,color,r,drag=false)=>prims.push({kind:'dot',pts:[p],color,r,drag});
/** étiquette : html (tspans), n = largeur en caractères, vec = flèche au-dessus des n1 premiers caractères */
const label=(p,html,n,color,dx=0,dy=0,size=17,vec=0,cap=false)=>texts.push({p,html,n,color,dx,dy,size,vec,cap});
const sampled=(fn,n=64)=>Array.from({length:n+1},(_,j)=>fn(j/n));
const Sv=(s,sub)=>A.S.v(s,sub);
const eLab=(sub)=>({html:Sv('e',sub),n:1+.75*[...sub].length});
const coordLab=(s,i)=>specs[s].names[i];
function lenLab(s,i){ // libellé de l'arête : Δx, r Δθ, r sin θ Δϕ
  const nm=specs[s].names[i];

  if(s==='sph'&&i===2)return{html:Sv('r')+' sin '+Sv('θ')+' Δ'+Sv(PHI),n:9};

}

function basisAt(a,s,p){
  if(!a.p.basis)return;const bs=G.basis(s,q);
  bs.forEach((b,i)=>{const end=G.add(p,G.mul(b,.92)),o=Pp(p),t=Pp(end),dx=t[0]-o[0],dy=t[1]-o[1],L=Math.hypot(dx,dy),E=eLab(specs[s].subs[i]);
    if(L<4){const toward=raw(end,s)[2]-raw(p,s)[2]>0;label(p,E.html+(toward?' ⊙':' ⊗'),E.n+2,'c'+i,16,-24,18,1)}

function axes(s){
  // Garder aussi la longueur des axes : elle ne doit pas varier avec les coordonnées.
  if(axisLength===null)axisLength=s==='frenet'?3.6:Math.min(8.5,Math.max(3.4,...st.p.map(Math.abs))+.4);
  const mx=axisLength;
  for(let i=0;i<(s==='polar'||s==='frenet'?2:3);i++){const p1=[0,0,0],p2=[0,0,0];p1[i]=-.5;p2[i]=mx;arrow(p1,p2,'ghost',1.3);label(p2,Sv(['x','y','z'][i]),1,'muted',8,-8,17)}

}
function angleArc(fn,html,color){const pts=sampled(fn,30);line(pts,color,2);label(fn(.55),html,1,color,10,-10,18)}
function guides(a,s){
  if(!a.p.guides)return;const p=st.p,[x,y,z]=p;
  if(s==='cart'){const pa=[x,0,0],pb=[x,y,0];line([[0,0,0],pa],'c0',1.8,'5 5');line([pa,pb],'c1',1.8,'5 5');line([pb,p],'c2',1.8,'5 5');
    if(st.stage==='point'){label([x/2,0,0],Sv('x'),1,'c0',0,18);label([x,y/2,0],Sv('y'),1,'c1',14,0);label([x,y,z/2],Sv('z'),1,'c2',14,0)}return}
  const az=s==='sph'?q[2]:q[1],rho=s==='sph'?q[0]*Math.sin(q[1]):q[0],R=q[0];
  line([[0,0,0],[x,y,0],p],'ghost',1.4,'5 5');line([[0,0,z],p],'c0',1.5,'5 5');
  if(s==='sph'){
    line(sampled(t=>G.from('sph',[R,t*Math.PI,az])),'ghost',1.2,'3 5',.8);
    line(sampled(t=>[rho*Math.cos(t*G.TAU),rho*Math.sin(t*G.TAU),z]),'c2',1.2,'3 5',.8);
    if(st.stage==='point'){
      angleArc(t=>G.from('sph',[.85,t*q[1],az]),Sv('θ'),'c1');angleArc(t=>[.65*Math.cos(t*az),.65*Math.sin(t*az),0],Sv(PHI),'c2');
      line([[0,0,z],[x,y,z]],'c2',1.4);label([x/2,y/2,z],Sv('r')+' sin '+Sv('θ'),5,'c2',8,-12,17);label(G.mul(p,.55),Sv('r')+' = OM',6,'c0',-20,-12,17);
    }
  }else{
    line(sampled(t=>[rho*Math.cos(t*G.TAU),rho*Math.sin(t*G.TAU),s==='polar'?0:z]),'ghost',1.3,'3 5',.8);
    if(s==='cyl'&&rho>1e-8){line(sampled(t=>[rho*Math.cos(t*G.TAU),rho*Math.sin(t*G.TAU),0]),'ghost',1,'3 5',.5);line([[x,y,0],p],'c2',1.8,'5 5')}
    if(st.stage==='point'){angleArc(t=>[.8*Math.cos(t*az),.8*Math.sin(t*az),0],Sv('θ'),'c1');label([x/2,y/2,z],Sv('r'),1,'c0',0,-14,18);if(s==='cyl')label([x,y,z/2],Sv('z'),1,'c2',16,0,18)}

}
function drawPoint(a,s){if(a.p.position&&!st.local)arrow([0,0,0],st.p,'ink',2.2);basisAt(a,s,st.p);dot(st.p,'accent',7,true);label(st.p,'M',1,'accent',-14,22,17)}
function drawMove(a,s){
  const bs=G.basis(s,q),h=G.factors(s,q),d=effD.map(v=>v*st.lam);let res=[0,0,0];
  for(let i=0;i<d.length;i++){if(Math.abs(d[i])<1e-9)continue;
    const cv=sampled(t=>{const n=[...q];n[i]+=d[i]*t;return G.from(s,n)},35);line(cv,'c'+i,3);arrow(cv[32],cv[35],'c'+i,2.8);
    const dl=G.mul(bs[i],h[i]*d[i]);res=G.add(res,dl);
    if(a.p.tang)line([st.p,G.add(st.p,dl)],'c'+i,1.6,'4 4');
    const L=lenLab(s,i);label(cv[18],L.html,L.n,'c'+i,i===0?4:14,i===0?-15:20,17)}

    if(a.p.tang){arrow(st.p,lin,'ghost',2);line([end,lin],'ghost',1.5,'4 5');dot(lin,'ghost',4);label(lin,'T',1,'ghost',12,14,17)}}

function facePoint(s,i,v,u,w,d){const n=[...q];n[i]+=d[i]*v;const o=n.map((_,j)=>j).filter(j=>j!==i);n[o[0]]+=d[o[0]]*u;n[o[1]]+=d[o[1]]*w;return G.from(s,n)}
function normalArrow(a,s,e,html,n,color){const end=G.add(st.p,e),r1=raw(st.p,s),r2=raw(end,s);
  if(Math.hypot(r2[0]-r1[0],r2[1]-r1[1])<.01)label(st.p,html+(r2[2]>r1[2]?' ⊙':' ⊗'),n+2,color,16,-30,18,1);else{arrow(st.p,end,color,3);label(end,html,n,color,12,-12,18,1)}}
function drawCell(a,s){
  const d=effD,n=q.length,face=faceSel(a);
  if(n===2){const N=12;for(let j=0;j<N;j++)for(let k=0;k<N;k++){const pt=(u,v)=>G.from(s,[q[0]+d[0]*u,q[1]+d[1]*v]);poly([pt(j/N,k/N),pt((j+1)/N,k/N),pt((j+1)/N,(k+1)/N),pt(j/N,(k+1)/N)],'accent',.22,-1)}
    for(let i=0;i<2;i++)for(let v=0;v<=1;v++)line(sampled(t=>G.from(s,[q[0]+d[0]*(i===0?v:t),q[1]+d[1]*(i===1?v:t)])),'c'+(1-i),2.2);

      for(let j=0;j<cnt;j++)for(let k=0;k<cnt;k++){const f=(u,w)=>facePoint(s,i,v,u,w,d);poly([f(j/cnt,k/cnt),f((j+1)/cnt,k/cnt),f((j+1)/cnt,(k+1)/cnt),f(j/cnt,(k+1)/cnt)],'c'+i,face===i?.28:.11,i)}
      for(let side=0;side<2;side++)for(let edge=0;edge<=1;edge++)line(sampled(t=>facePoint(s,i,v,side===0?t:edge,side===0?edge:t,d),35),'c'+i,face===i?2.6:1.2,'',.8);
    }

  }
  const bs=G.basis(s,q),h=G.factors(s,q),vecs=d.map((v,i)=>G.mul(bs[i],h[i]*v)),loc=bits=>vecs.reduce((p,v,i)=>G.add(p,G.mul(v,bits[i])),st.p);
  if(a.p.tcell)for(let i=0;i<n;i++)for(let m=0;m<(1<<n);m++){if(m&(1<<i))continue;const b1=Array.from({length:n},(_,j)=>(m>>j)&1),b2=[...b1];b2[i]=1;line([loc(b1),loc(b2)],'ghost',1.6,'5 5',.9)}

/* ---------- cadrage, peinture ---------- */
function frame(a){
  const P=a.panels.scene;view.W=P.w;view.H=P.h;
  if(st.dragging)return;
  // Les paramètres physiques et le zoom ne changent pas le cadrage de référence.
  // Une nouvelle vue, une rotation ou un redimensionnement l'adaptent à l'écran.
  const key=[curSys,st.stage,st.local,st.view,cam.yaw,cam.pitch,view.W,view.H,a.k].join('|');
  if(frameCache&&frameCache.key===key){st.center=[...frameCache.center];st.scale=frameCache.scale*P.zoom;return}
  let pts;
  if(st.local){if(curSys==='frenet'){const p=geo.p;pts=sampled(t=>G.add(p,[2*Math.cos(t*G.TAU),2*Math.sin(t*G.TAU),0]),20)}
    else{pts=prims.flatMap(p=>p.pts);G.basis(curSys,q).forEach(b=>pts.push(G.add(st.p,G.mul(b,1.2)),G.add(st.p,G.mul(b,-.25))))}}
  else if(curSys==='frenet')pts=[...fitPts,[0,0,0]];
  else pts=prims.flatMap(p=>p.pts);
  const rp=pts.map(p=>raw(p,curSys)),xs=rp.map(p=>p[0]),ys=rp.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),mg=Math.min(48*a.k,.09*view.W),mv=Math.min(40*a.k,.13*view.H);
  st.center=[(x0+x1)/2,(y0+y1)/2];
  const scale=Math.min(Math.max(80,view.W-2*mg)/Math.max(1.5,x1-x0),Math.max(65,view.H-2*mv)/Math.max(1.5,y1-y0));
  frameCache={key,center:[...st.center],scale};st.scale=scale*P.zoom;
}
function paint(a){
  const S=a.S,C=pal(a),k=a.k,W=view.W,H=view.H;let s='';
  const depth=pr=>pr.pts.reduce((t,p)=>t+raw(p,curSys)[2],0)/pr.pts.length;
  const polys=prims.filter(p=>p.kind==='poly').sort((x,y)=>depth(x)-depth(y)),rest=prims.filter(p=>p.kind!=='poly');
  const path=(pts,close)=>pts.map((p,i)=>(i?'L':'M')+Pp(p).map(v=>v.toFixed(1)).join(',')).join('')+(close?'Z':'');
  for(const p of polys){const c=C[p.color];s+=`<path d="${path(p.pts,true)}" fill="${c}" fill-opacity="${p.op}" stroke="${c}" stroke-opacity="${p.op}" stroke-width=".3"${p.face!==null&&p.face>=0?` data-face="${p.face}" style="cursor:pointer"`:''}/>`}
  for(const p of rest){const c=C[p.color]||p.color;
    if(p.kind==='dot'){const[x,y]=Pp(p.pts[0]);if(p.drag)s+=S.circle(x,y,20*k,{c:C.accent,w:1,op:.35,dash:`${2*k} ${5*k}`});
      s+=S.circle(x,y,p.r*k,{fill:c,c:a.C.card,w:2});
      if(p.drag)s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(22*k).toFixed(1)}" fill="transparent" data-drag="1" style="cursor:grab"/>`;continue}
    if(p.kind==='arrow'){const[x1,y1]=Pp(p.pts[0]),[x2,y2]=Pp(p.pts[1]);s+=S.arrow(x1,y1,x2,y2,{c,w:p.w*.8});continue}
    s+=S.path(path(p.pts),{c,w:p.w,dash:p.dash?p.dash.split(' ').map(v=>v*k).join(' '):undefined,op:p.op})}
  // étiquettes : à côté des objets, écartées si elles se chevauchent
  const placed=[];
  for(const t of texts){const[px,py]=Pp(t.p);if(px<-30||px>W+30||py<-30||py>H+30)continue;
    const size=t.size*k,w=t.n*size*.6,h=size;
    const x=G.clamp(px+t.dx*k,6,W-w-6),y=G.clamp(py+t.dy*k,h/2+4,H-h/2-4);let best={x,y,sc:Infinity};
    for(const[ox,oy]of[[0,0],[0,23],[0,-23],[24,0],[-w/k-20,0],[14,40],[-w/k-15,-30]]){
      const xx=G.clamp(x+ox*k,6,W-w-6),yy=G.clamp(y+oy*k,h/2+4,H-h/2-4),b={x:xx,y:yy-h/2,w,h};
      const ov=placed.reduce((m,q2)=>m+(b.x<q2.x+q2.w+4&&b.x+b.w+4>q2.x&&b.y<q2.y+q2.h+2&&b.y+b.h+2>q2.y?1:0),0),sc=ov*1000+Math.abs(ox)+Math.abs(oy);
      if(sc<best.sc)best={x:xx,y:yy,sc}}
    placed.push({x:best.x,y:best.y-h/2,w,h});
    s+=S.text(best.x,best.y,t.html,{size:t.size,c:C[t.color]||t.color,weight:t.color==='accent'?600:undefined});
    if(t.vec){const ax=best.x+.04*size,bx=best.x+.56*size*t.vec,ay=best.y-(t.cap?.55:.36)*size;s+=S.arrow(ax,ay,bx,ay,{c:C[t.color],w:.9,head:4.5*k})}
  }
  a.svg('scene',s);
}

/* ===================== onglets 1 à 4 ===================== */
function drawSpace(a){
  const s=sysOf(a);curSys=s;prims=[];texts=[];fitPts=[];geo=null;
  q=getQ(s);
  const comp=a.p.comp,raw0=specs[s].names.map((_,i)=>{const v=(+a.p[did(s,i)])*(angular(s,i)?DEG:1)*a.p.eps;return st.stage==='move'&&comp!=='all'&&+comp!==i?0:st.stage==='cell'?Math.abs(v):v});
  effD=[...raw0];if(s!=='cart'){effD[0]=Math.max(-q[0],effD[0]);if(s==='sph')effD[1]=G.clamp(effD[1],-q[1],Math.PI-q[1])}
  if(!st.local){axes(s);guides(a,s)}
  if(st.stage==='point')drawPoint(a,s);else if(st.stage==='move')drawMove(a,s);else drawCell(a,s);
  frame(a);paint(a);
  infosSpace(a,s,raw0);
}
const proj=()=>A.root.classList.contains('is-proj');
const ev=s=>`${Mh.vec('e')}<sub>${s}</sub>`, mv=s=>Mh.v(s), dd=s=>`d${mv(s)}`;
const colr=(i,h)=>`<span style="color:${[A.C.F,A.C.B,A.C.v][i]}">${h}</span>`;
function formulaDiff(s){
  if(s==='cart')return`${colr(0,`${dd('x')} ${ev('x')}`)} + ${colr(1,`${dd('y')} ${ev('y')}`)} + ${colr(2,`${dd('z')} ${ev('z')}`)}`;
  if(s==='sph')return`${colr(0,`${dd('r')} ${ev('r')}`)} + ${colr(1,`${mv('r')} ${dd('θ')} ${ev('θ')}`)} + ${colr(2,`${mv('r')} sin ${mv('θ')} ${dd(PHI)} ${ev(PHI)}`)}`;
  return`${colr(0,`${dd('r')} ${ev('r')}`)} + ${colr(1,`${mv('r')} ${dd('θ')} ${ev('θ')}`)}`+(s==='cyl'?` + ${colr(2,`${dd('z')} ${ev('z')}`)}`:'');
}
function formulaCell(s,f){
  const r=mv('r'),th=mv('θ');
  if(s==='polar')return`d${mv('S')} = ${r} ${dd('r')} ${dd('θ')}`;
  if(s==='cart')return f<0?`d${mv('V')} = ${dd('x')} ${dd('y')} ${dd('z')}`:[`d${mv('S')}<sub>x</sub> = ${dd('y')} ${dd('z')}`,`d${mv('S')}<sub>y</sub> = ${dd('x')} ${dd('z')}`,`d${mv('S')}<sub>z</sub> = ${dd('x')} ${dd('y')}`][f];
  if(s==='cyl')return f<0?`d${mv('V')} = ${r} ${dd('r')} ${dd('θ')} ${dd('z')}`:[`d${mv('S')}<sub>r</sub> = ${r} ${dd('θ')} ${dd('z')}`,`d${mv('S')}<sub>θ</sub> = ${dd('r')} ${dd('z')}`,`d${mv('S')}<sub>z</sub> = ${r} ${dd('r')} ${dd('θ')}`][f];
  return f<0?`d${mv('V')} = ${r}<sup>2</sup> sin ${th} ${dd('r')} ${dd('θ')} ${dd(PHI)}`:[`d${mv('S')}<sub>r</sub> = ${r}<sup>2</sup> sin ${th} ${dd('θ')} ${dd(PHI)}`,`d${mv('S')}<sub>θ</sub> = ${r} sin ${th} ${dd('r')} ${dd(PHI)}`,`d${mv('S')}<sub>ϕ</sub> = ${r} ${dd('r')} ${dd('θ')}`][f];
}
function singular(s){
  if(s==='cart')return'';
  if(q[0]<1e-8)return s==='sph'?'À l\'origine, la base sphérique n\'est pas unique : orientation conventionnelle.':'Sur l\'axe, l\'azimut est conventionnel : '+ev('r')+' et '+ev('θ')+' ne sont pas uniques.';
  if(s==='sph'&&Math.abs(Math.sin(q[1]))<1e-8)return'Au pôle, ϕ et la base tangentielle dépendent du méridien choisi.';
  return'';
}
function infosSpace(a,s,raw0){
  const f=a.fmt,face=faceSel(a),names=specs[s].names;let msg,mets=[],leg=[];
  const lim=st.stage!=='point'&&effD.some((v,i)=>Math.abs(v-raw0[i])>1e-8);
  if(st.stage==='point'){
    mets=q.map((v,i)=>({label:`Coordonnée ${mv(names[i])}`,value:angular(s,i)?f.fix(v/DEG,1):f.fix(v,2),unit:angular(s,i)?'°':'cm'}));
    const om=`${Mh.vec('OM')} = `+(s==='cart'?`${colr(0,`${mv('x')} ${ev('x')}`)} + ${colr(1,`${mv('y')} ${ev('y')}`)} + ${colr(2,`${mv('z')} ${ev('z')}`)}`:s==='cyl'?`${colr(0,`${mv('r')} ${ev('r')}`)} + ${colr(2,`${mv('z')} ${ev('z')}`)}`:colr(0,`${mv('r')} ${ev('r')}`));
    const rem=s==='sph'?`Le parallèle de M a pour rayon ${mv('r')} sin ${mv('θ')}.`:s==='cyl'?`${mv('r')} est la distance à l'axe O${mv('z')} : OM = ${Mh.sqrt(`${mv('r')}<sup>2</sup> + ${mv('z')}<sup>2</sup>`)}.`:s==='polar'?`Une variation Δ${mv('θ')} parcourt un arc de longueur ${mv('r')} |Δ${mv('θ')}|.`:`Base orthonormée directe et fixe : ${ev('x')} ∧ ${ev('y')} = ${ev('z')}.`;
    msg=`<b>Vecteur position.</b> ${om}. `+(proj()&&!singular(s)?'':singular(s)||rem);
  }else if(st.stage==='move'){
    const ex=G.norm(G.sub(geo.end,st.p)),err=G.norm(G.sub(geo.end,geo.lin));
    mets=[{label:'Déplacement fini MM′',value:f.sig(ex,3),unit:'cm'},a.p.tang?{label:'Écart M′T',value:f.sig(err,2),unit:'cm',hint:ex>1e-9?`soit ${f.sig(err/ex*100,2)} % de MM′`:''}:null,{label:`Avancement ${mv('λ')}`,value:f.fix(st.lam,2)}];
    msg=`<b>Déplacement élémentaire en M.</b> d${Mh.vec('OM')} = ${formulaDiff(s)}. `+(proj()?singular(s):singular(s)||(a.p.tang?'Réduire les accroissements rapproche M′ de T.':'Prévoir où se place la somme des petits déplacements, puis afficher T.'))+(lim?' Accroissement limité au domaine des coordonnées.':'');
    leg=[{c:a.C.cInk,label:'MM′ : déplacement fini'},a.p.tang?{c:a.C.pred,label:'MT : somme tangentielle',dash:true}:null];
  }else{
    const ex=G.finite(s,q,effD,face),ap=G.measure(s,q,effD,face),aire=s==='polar'||face>=0,u=aire?'cm²':'cm³';
    mets=[{label:aire?'Aire de l\'élément fini':'Volume de l\'élément fini',value:f.sig(ex,3),unit:aire?'cm<sup>2</sup>':'cm<sup>3</sup>'},
      a.p.tcell?{label:'Approximation locale',value:f.sig(ap,3),unit:aire?'cm<sup>2</sup>':'cm<sup>3</sup>',hint:Math.abs(ex)>1e-12?`écart relatif ${f.sig(Math.abs(ex-ap)/Math.abs(ex)*100,2)} %`:'élément dégénéré'}:null];
    let nrm='';if(a.p.normal&&(s==='polar'||face>=0))nrm=` ; d${Mh.vec('S')} = d${mv('S')} ${ev(s==='polar'?'z':specs[s].subs[face])}`;
    const titre=face<0?(s==='polar'?'Aire élémentaire.':'Volume élémentaire.'):`Surface élémentaire ${mv(names[face])} = cste.`;
    const rem=s==='sph'?`À ${mv('r')} et Δ${mv(PHI)} fixés, la longueur ${mv('r')} sin ${mv('θ')} Δ${mv(PHI)} diminue près des pôles.`:s==='cart'?'Deux longueurs locales forment une aire ; trois forment un volume.':`À Δ${mv('θ')} fixé, l'arc ${mv('r')} Δ${mv('θ')} est proportionnel à ${mv('r')}.`;
    msg=`<b>${titre}</b> ${formulaCell(s,face)}${nrm}. `+(proj()?singular(s):singular(s)||rem)+(lim?' Accroissement limité au domaine des coordonnées.':'');
    leg=[a.p.tcell?{c:a.C.pred,label:'cellule tangentielle',dash:true}:null];
  }
  a.metrics(mets);a.insight(msg);
  a.legend([...specs[s].subs.map((sb,i)=>({c:[a.C.F,a.C.B,a.C.v][i],label:`${ev(sb)} · ${mv(names[i])}`})),...leg]);
  a.clock(st.stage==='move'?`${mv('λ')} = ${f.fix(st.lam,2)}`:'');
}

/* ===================== onglet 5 : Frenet ===================== */
function drawFrenet(a){
  curSys='frenet';prims=[];texts=[];fitPts=[];
  const F=G.frenet(st.curve,st.u),sp=G.speed(st.arc,st.u,a.p.v0,a.p.loi==='variable'),p=F.p;geo={...F,...sp};
  axes('frenet');
  line(sampled(t=>G.curve(st.curve,t).p,180),'ghost',2);
  if(st.u>1e-4)line(sampled(t=>G.curve(st.curve,t*st.u).p,Math.max(2,Math.floor(150*st.u))),'accent',4);
  const p0=G.curve(st.curve,0).p;dot(p0,'ghost',4);label(p0,'Ω',1,'ghost',-14,20,17);
  if(a.p.osc&&F.center){line(sampled(t=>G.add(F.center,[F.rho*Math.cos(t*G.TAU),F.rho*Math.sin(t*G.TAU),0]),150),'c1',1.7,'6 6');line([p,F.center],'c1',1.2,'4 5');dot(F.center,'c1',4);label(F.center,'C',1,'c1',10,14,17);label(G.add(p,G.mul(F.n,Math.min(F.rho/2,1.6))),Sv('ρ'),1,'c1',10,-10,18)}
  if(a.p.basis){arrow(p,G.add(p,G.mul(F.t,.9)),'c0',3);label(G.add(p,G.mul(F.t,.98)),Sv('e','t'),1.8,'c0',10,-10,18,1);
    if(F.n){arrow(p,G.add(p,G.mul(F.n,.9)),'c1',3);label(G.add(p,G.mul(F.n,.98)),Sv('e','n'),1.8,'c1',10,-10,18,1)}}
  if(a.p.vit){const ve=G.add(p,G.mul(F.t,sp.v*VS));arrow(p,ve,'c2',3.6);label(ve,Sv('v'),1,'c2',-10,24,18,1);fitPts.push(ve)}
  if(a.p.acc){const ac=G.add(G.mul(F.t,sp.at),F.n?G.mul(F.n,sp.v*sp.v*F.k):[0,0,0]),ae=G.add(p,G.mul(ac,AS));if(G.norm(ac)>1e-9){arrow(p,ae,'acc',3.4);label(ae,Sv('a'),1,'acc',14,22,18,1)}fitPts.push(ae)}
  if(a.p.compare&&st.curve==='circle'){const pq=G.to('polar',p);G.basis('polar',pq).forEach((e,i)=>{arrow(p,G.add(p,G.mul(e,1.3)),'ghost',1.7);label(G.add(p,G.mul(e,1.35)),Sv('e',['r','θ'][i]),1.8,'ghost',i?10:-15,-12,17,1)})}
  dot(p,'accent',7,true);label(p,'M',1,'accent',-14,22,17);
  fitPts.push(...sampled(t=>G.curve(st.curve,t).p,40));if(F.center&&F.rho<5)fitPts.push(F.center);
  frame(a);paint(a);
  const f=a.fmt,an=sp.v*sp.v*F.k;
  a.metrics([{label:`Vitesse ${mv('v')}`,value:f.sig(sp.v,3),unit:'cm·s<sup>−1</sup>'},{label:`Rayon de courbure ${mv('ρ')}`,value:F.n?f.sig(F.rho,3):'∞',unit:'cm'},
    a.p.acc?{label:`Accélération tangentielle ${mv('a')}<sub>t</sub>`,value:f.sig(sp.at,2),unit:'cm·s<sup>−2</sup>'}:null,a.p.acc?{label:`Accélération normale ${mv('a')}<sub>n</sub>`,value:f.sig(an,3),unit:'cm·s<sup>−2</sup>'}:null]);
  let msg=`<b>Repère de Frenet.</b> ${Mh.vec('v')} = ${mv('v')} ${ev('t')} et ${Mh.vec('a')} = ${Mh.frac(`d${mv('v')}`,`d${mv('t')}`)} ${ev('t')}`+(F.n?` + ${Mh.frac(`${mv('v')}<sup>2</sup>`,mv('ρ'))} ${ev('n')}. `:'. ');
  if(!proj())msg+=a.p.compare?(st.curve==='circle'?`Cercle parcouru dans le sens positif : ${ev('n')} = −${ev('r')} et ${ev('t')} = ${ev('θ')}.`:'La comparaison à la base polaire est proposée sur le cercle centré en O.')
    :F.n?(a.p.acc?`${ev('n')} pointe vers le centre de courbure C : même à vitesse constante, l'accélération est non nulle.`:`${ev('n')} pointe vers le centre de courbure C. Prévoir la direction de ${Mh.vec('a')}, puis l'afficher.`)
    :`Courbure nulle : ${mv('ρ')} → ∞, ${ev('n')} n'est pas défini et ${mv('a')}<sub>n</sub> = 0.`;
  a.insight(msg);
  a.legend([{c:a.C.F,label:`${ev('t')} tangent, sens du mouvement`},F.n?{c:a.C.B,label:`${ev('n')} vers C`}:null,a.p.vit?{c:a.C.v,label:'vitesse (1 cm·s<sup>−1</sup> ↔ 0.65 cm)'}:null,a.p.acc?{c:a.C.E,label:'accélération (1 cm·s<sup>−2</sup> ↔ 1.3 cm)'}:null]);
  a.clock(`${mv('s')} = ${f.fix(sp.s,2)} cm`);
}

/* ---------- interactions : M, faces, caméra ---------- */
let dg=null;
A.drag('scene',{
  hit:()=>true,
  start(x,y,e){const P=A.panels.scene,face=e.target.closest&&e.target.closest('[data-face]'),onM=e.target.closest&&e.target.closest('[data-drag]');
    if(!onM&&face&&st.stage==='cell'&&A.tab<4){const s=sysOf(A);if(s!=='polar')A.set('face_'+s,+face.dataset.face);dg=null;return}
    dg={kind:onM?'point':'cam',x,y,yaw:cam.yaw,pitch:cam.pitch,p:[...st.p],q:A.tab<4?getQ(sysOf(A)):[],scale:st.scale};
    if(onM){A.play(false);st.dragging=true}},
  move(x,y){if(!dg)return;const dx=x-dg.x,dy=y-dg.y;
    if(dg.kind==='cam'){if(st.view!=='3d'||A.tab===4)return;cam.yaw=dg.yaw-dx*.008;cam.pitch=G.clamp(dg.pitch-dy*.006,.22,1.18);return}
    if(A.tab===4){let best={d:1e9,u:st.u};for(let i=0;i<=700;i++){const u=i/700,pp=Pp(G.curve(st.curve,u).p),dd2=Math.hypot(pp[0]-x,pp[1]-y);if(dd2<best.d)best={d:dd2,u}}st.u=best.u;return}
    const s=sysOf(A),n=[...dg.p],X=dx/dg.scale,Y=dy/dg.scale;
    if(st.view==='top'){n[0]+=X;n[1]-=Y}
    else if(st.view==='3d'){const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),V=Y/Math.sin(cam.pitch);n[0]+=-cy*X-sy*V;n[1]+=-sy*X+cy*V}
    else{const az=s==='sph'?dg.q[2]:s==='cart'?0:dg.q[1];n[0]+=X*Math.cos(az);n[1]+=X*Math.sin(az);n[2]-=Y}
    st.p=n.map(v=>G.clamp(v,-6,6));if(s==='polar')st.p[2]=0;
    const nq=G.to(s,st.p,st.az);if(s!=='cart')st.az=nq[s==='sph'?2:1];
    syncCoordFields(A)},
  end(){dg=null;st.dragging=false}
});
