<body>
<noscript>Cette animation nécessite JavaScript.</noscript>
<script>
/* =====================================================================
   AnimKit · script commun des animations de MPSI
   E. Guillaume · charte du 2 novembre 2026 (Charte_Animations.html)

   Une animation décrit sa configuration et ses fonctions :
     AnimKit.app({
       code:'OP1', partie:'TurquoiseLagon', titre:'…', sousTitre:'…', chapitre:'OP1 Propagation de la lumière',
       onglets:['Vue de face','Perspective'],            // facultatif
       temps:true | (app)=>bool,                          // barre de lecture
       pas:1/24,                                          // durée simulée d'un « Pas »
       panneaux:[{id:'scene', titre:'…', poids:2, type:'svg'|'canvas', onglets:[0], ratioTel:.8, zoom:true}],
       reglages:[{titre:'Situations', presets:[{label, valeurs:{…}, lecture:true}]},
                 {titre:'…', items:[{id,type:'range'|'select'|'seg'|'check'|'boutons'|'note', …}], onglets:[…], si:(app)=>bool}],
       aide:{voit, faire, modele, cours},
       init(app), reset(app), step(app,dt), draw(app), change(app,id,v), onglet(app,i)
     })
   Le kit fournit : app.p (paramètres), app.tab, app.t, app.C (couleurs), app.k (échelle projection),
   app.S (dessin SVG), app.fmt (nombres), app.metrics(), app.insight(), app.legend(), app.clock(), app.drag()…
   Réglage à échelle logarithmique : {id,type:'range',log:true,min,max,dec} (curseur en log10, champ numérique en valeur réelle).
   Disposition facultative  atelier:{saisie:'Mes mesures', detail:'Voir le calcul'} : app.zones.saisie / .resultat / .detail
   (nœuds DOM à remplir par l'animation) ; pas de colonne de réglages.
   ===================================================================== */
(function(){
'use strict';
const FONT='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const MATH='"STIX Two Math","Cambria Math","Latin Modern Math","Times New Roman",serif';
const MINUS='−';

/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  /** n chiffres significatifs, sans notation exponentielle */
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e<-3||e>=6){const m=x/10**e;return (+m.toFixed(n-1)).toFixed(n-1).replace('-',MINUS)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>'}
    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- icônes ---------------- */
const IC={
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
  help:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h0"/></svg>',
  theme:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>',
  proj:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M12 16v4M8 20h8"/></svg>',
  fs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
  step:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5l9 7-9 7zM16 5h2.5v14H16z"/></svg>',
  reset:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg>'
};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function el(tag,attrs={},html){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs))if(v!==undefined&&v!==null&&v!==false)e.setAttribute(k,v===true?'':v);if(html!==undefined)e.innerHTML=html;return e}

function interrupteur(label,id){
  const conteneur=el('label',{class:'ak-chk'});
  conteneur.append(
    el('input',{type:'checkbox',role:'switch',id}),
    el('span',{class:'ak-switch-track','aria-hidden':'true'}),
    el('span',{},label)
  );
  return conteneur;
}

/* ---------------- mathématiques en HTML ---------------- */
const M={
  v:(s,sub,sup)=>`<span class="m">${s}</span>${sub!==undefined?`<sub>${sub}</sub>`:''}${sup!==undefined?`<sup>${sup}</sup>`:''}`,
  frac:(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`,
  sqrt:x=>`<span class="sqrt"><span class="sym">√</span><span class="rad">${x}</span></span>`,
  vec:s=>`<span class="vec">${s}</span>`
};

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}
      return s;
    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){
      let d='',pen=false;
      for(const[x,y]of pts){if(!isFinite(y)||!isFinite(x)){pen=false;continue}
        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}
      return`<g clip-path="url(#${G.clip||''})">`+S.path(d,o)+'</g>';
    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}
  };
  return S;
}

/* ===================================================================== */
function app(cfg){
  const A={cfg,p:{},tab:0,t:0,running:false,speed:1,k:1,narrow:false,C:{},fmt,M,panels:{},_dirty:false};
  A.S=makeS(A);
  const root=document.documentElement;
  root.dataset.theme='dark';
  if(cfg.partie)root.style.setProperty('--chap',`var(--${cfg.partie})`);
  document.title=cfg.titreFenetre||`${cfg.titre} · ${cfg.code} · MPSI`;

  /* ---------- structure ---------- */
  const ak=el('div',{class:'ak',id:'ak'});
  const top=el('header',{class:'ak-top'});
  top.innerHTML=`<span class="ak-badge">${cfg.code}</span><div class="ak-titles"><h1 class="ak-title">${cfg.titre}</h1></div>
  <nav class="ak-tools" aria-label="Outils">
   <button class="ib ak-btn-settings" data-act="settings" title="Réglages">${IC.settings}<span class="ak-lbl">Réglages</span></button>
   <button class="ib" data-act="help" title="Aide (H)">${IC.help}<span class="ak-lbl">Aide</span></button>
   <button class="ib" data-act="theme" title="Thème clair / sombre (T)">${IC.theme}<span class="ak-lbl">Thème</span></button>
   <button class="ib" data-act="image" title="Enregistrer l'image (I)">${IC.image}<span class="ak-lbl">Image</span></button>
   <button class="ib" data-act="proj" title="Mode projection (P)">${IC.proj}<span class="ak-lbl">Projection</span></button>
   <button class="ib" data-act="fs" title="Plein écran (F)">${IC.fs}</button>
  </nav>`;
  ak.append(top);
  const tabs=cfg.onglets&&cfg.onglets.length>1?el('div',{class:'ak-tabs',role:'tablist'}):null;
  if(tabs){cfg.onglets.forEach((t,i)=>{const b=el('button',{class:'ak-tab',role:'tab','aria-selected':String(i===0),'data-tab':i},`<b>${i+1}</b>${t}`);b.onclick=()=>A.setTab(i);tabs.append(b)});ak.append(tabs)}
  const body=el('div',{class:'ak-body'}); ak.append(body);

    if(P.vue==='interne')return Math.abs(P.zoom-1)>1e-6;
    if(!deplacable(P))return false;
    const seuil=P.vue==='graphe'?1e-6:.5;
    return Math.abs(P.vz-1)>1e-6||Math.abs(P.vx)>seuil||Math.abs(P.vy)>seuil;
  }
  const markZoom=P=>{if(P.tools)P.tools.classList.toggle('is-zoomed',zoomed(P))};
  const graphAt=(P,x,y)=>P.graphs.find(g=>x>=g.x0&&x<=g.x0+g.w&&y>=g.y0&&y<=g.y0+g.h);
  function resetView(P){P.vz=1;P.vx=P.vy=0;P.zoom=1;P.panX=P.panY=0;markZoom(P)}
  /** zoom d'un facteur f autour du point (px, py) de l'écran du panneau (centre par défaut) */
  A.zoomer=(P,f,px,py)=>{if(typeof P==='string')P=A.panels[P];if(!P||!P.vue)return;
    if(P.vue==='interne')P.zoom=Math.max(.4,Math.min(5,P.zoom*f));
    else{
      if(P.vue==='graphe'){
        const graph=graphAt(P,px,py);
        px=graph?(px-graph.x0)/graph.w:.5;
        py=graph?(py-graph.y0)/graph.h:.5;
      }else{px=px??P.w/2;py=py??P.h/2}
      const z=Math.max(.5,Math.min(8,P.vz*f)), delta=1/P.vz-1/z;
      P.vx+=px*delta;P.vy+=py*delta;P.vz=z;
    }
    markZoom(P);A.render()};
  A.deplacer=(P,dx,dy,px,py)=>{
    if(!deplacable(P))return;
    if(P.vue==='graphe'){const g=graphAt(P,px,py)||P.graphs[0];dx/=g.w;dy/=g.h}
    P.vx-=dx/P.vz;P.vy-=dy/P.vz;markZoom(P);A.render()
  };
  A.cadrer=P=>{if(typeof P==='string')P=A.panels[P];if(!P)return;resetView(P);A.render()};
  A.cadrerTout=()=>{for(const P of Object.values(A.panels))A.cadrer(P)};
  /* ---------- glisser dans un panneau ----------
     Les coordonnées transmises aux animations sont celles de leur dessin (vue zoomée comprise).
     Maj + glisser, bouton du milieu ou deux doigts : déplacer la vue ; molette ou pincement : zoomer.
     Glisser hors de tout objet manipulable déplace aussi la vue quand elle est zoomée. */
  function wire(P){const N=P.node,pts=new Map();let mode=null,h=null,last=null,pin=null;
    const scr=e=>{const r=N.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    const toV=s=>P.vue==='svg'?[P.vx+s[0]/P.vz,P.vy+s[1]/P.vz]:s;
    const two=()=>{const[a,b]=[...pts.values()];return{d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,c:[(a[0]+b[0])/2,(a[1]+b[1])/2]}};
    N.addEventListener('pointerdown',e=>{
      const s=scr(e);A._hover=P;pts.set(e.pointerId,s);
      if(pts.size===2&&P.vue){if(mode==='drag'&&h&&h.end)h.end(e);mode='pinch';h=null;pin=two();N.setPointerCapture(e.pointerId);e.preventDefault();return}
      if(pts.size>1)return;
      const[x,y]=toV(s);
      if(deplacable(P)&&(e.shiftKey||e.button===1))mode='pan';
      else{h=P._drags.find(d=>!d.hit||d.hit(x,y,e))||null;
        if(h){mode='drag';if(h.start)h.start(x,y,e)}
        else if(deplacable(P)&&zoomed(P))mode='pan';
        else{mode=null;return}}
      last=s;N.setPointerCapture(e.pointerId);e.preventDefault();A.render()});
    N.addEventListener('pointermove',e=>{const s=scr(e);
      if(!pts.has(e.pointerId)){if(e.pointerType==='mouse'){const[x,y]=toV(s);N.style.cursor=P._drags.some(d=>d.hit&&d.hit(x,y,e))?'grab':(deplacable(P)&&(e.shiftKey||zoomed(P)))?'move':''}return}
      pts.set(e.pointerId,s);
      if(mode==='pinch'&&pts.size>=2){const q=two();A.zoomer(P,q.d/pin.d,q.c[0],q.c[1]);A.deplacer(P,q.c[0]-pin.c[0],q.c[1]-pin.c[1],q.c[0],q.c[1]);pin=q;return}
      if(mode==='pan'){A.deplacer(P,s[0]-last[0],s[1]-last[1],last[0],last[1]);last=s;return}
      if(mode==='drag'&&h){const[x,y]=toV(s);h.move(x,y,e);A.render()}});
    const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
      if(mode==='drag'&&h&&h.end)h.end(e);
      if(pts.size===0){mode=null;h=null}else if(mode==='pinch'){mode='pan';last=[...pts.values()][0]}
      A.render()};
    N.addEventListener('pointerup',end);N.addEventListener('pointercancel',end);
    if(P.vue){
      N.addEventListener('wheel',e=>{if(A.narrow&&!e.ctrlKey)return;e.preventDefault();const s=scr(e);A.zoomer(P,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),s[0],s[1])},{passive:false});
      N.addEventListener('dblclick',e=>{const[x,y]=toV(scr(e));if(!P._drags.some(d=>d.hit&&d.hit(x,y,e))&&zoomed(P))A.cadrer(P)});
      N.addEventListener('pointerenter',()=>{A._hover=P});
    }
  }
  for(const P of Object.values(A.panels))wire(P);
  A.drag=(id,h)=>{A.panels[id]._drags.push(h)};

  /* ---------- export image (toujours en thème clair) ---------- */
  A.exportImage=async()=>{
    const was=root.dataset.theme; root.dataset.theme='light'; readColors(); A.renderNow();
    const vis=Object.values(A.panels).filter(P=>!P.el.hidden), base=pwrap.getBoundingClientRect(), sc=2;
    const cv=document.createElement('canvas'); cv.width=Math.round(base.width*sc); cv.height=Math.round(base.height*sc);
    const ctx=cv.getContext('2d'); ctx.fillStyle=A.C.card; ctx.fillRect(0,0,cv.width,cv.height);
    const jobs=vis.map(P=>new Promise(res=>{const r=P.node.getBoundingClientRect(), x=(r.left-base.left)*sc, y=(r.top-base.top)*sc;
      if(P.type==='canvas'){ctx.drawImage(P.node,x,y,r.width*sc,r.height*sc);res();return}
      const clone=P.node.cloneNode(true); clone.setAttribute('width',r.width); clone.setAttribute('height',r.height);
      const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
      const im=new Image(); im.onload=()=>{ctx.drawImage(im,x,y,r.width*sc,r.height*sc);res()}; im.onerror=()=>res(); im.src=src;}));
    await Promise.all(jobs);
    root.dataset.theme=was; readColors(); A.renderNow();
    const a=document.createElement('a'); const tabName=cfg.onglets&&cfg.onglets.length>1?'_'+(A.tab+1):'';
    a.download=`${cfg.code}_${(cfg.fichier||cfg.titre).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_')}${tabName}.png`;
    a.href=cv.toDataURL('image/png'); a.click(); A.toast('Image enregistrée (thème clair)');
  };

  /* ---------- aide ---------- */
  function buildHelp(){
    const h=cfg.aide||{}, sec=(t,c)=>c?`<h4>${t}</h4>${/^\s*</.test(c)?c:`<p>${c}</p>`}`:'';
    dlg.innerHTML=`<header><h3>Aide · ${cfg.titre}</h3><button class="mini" data-close>Fermer ✕</button></header><div class="db">
    ${cfg.sousTitre?`<p class="ak-dlg-sub">${cfg.sousTitre}</p>`:''}${sec('Ce qu\'on voit',h.voit)}${sec('Ce qu\'on peut faire',h.faire)}${sec('Modèle et hypothèses',h.modele)}${sec('Lien avec le cours',h.cours)}${sec('Pour aller plus loin',h.plus)}
    <h4>Raccourcis</h4><p>${cfg.temps?'<kbd>Espace</kbd> lecture / pause · <kbd>→</kbd> pas à pas · <kbd>R</kbd> recommencer · ':''}${tabs?`<kbd>1</kbd>–<kbd>${cfg.onglets.length}</kbd> onglets · `:''}<kbd>P</kbd> projection · <kbd>F</kbd> plein écran · <kbd>T</kbd> thème · <kbd>I</kbd> image · <kbd>H</kbd> aide${h.touches?' · '+h.touches:''}</p>
    <p>Vue : molette, pincement ou <kbd>+</kbd> <kbd>−</kbd> pour zoomer · <kbd>Maj</kbd> + glisser, deux doigts, ou glisser une vue zoomée pour la déplacer · « Cadrer », <kbd>0</kbd> ou double clic : vue initiale.</p>
    ${h.credits?`<h4>Crédits</h4><p>${h.credits}</p>`:''}</div>`;
    dlg.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===dlg)dlg.close()});
  }

  /* ---------- démarrage ---------- */
  buildSettings(); buildHelp(); readColors();
  if(cfg.init)cfg.init(A);
  refreshSettings(); A.reset();
  new ResizeObserver(()=>A.render()).observe(ak);
  return A;
}

window.AnimKit={app,fmt,M,ticks,niceStep,FONT,MATH,interrupteur};
})();

<script>
'use strict';
/* =====================================================================
   PH2 · Outils statistiques (sans dépendance, testés par Verifier_Modele.mjs)
   Incertitude-type : type A (s/√N), type B (Δ/√3), composition, propagation (somme,
   produit, formule quelconque par Monte-Carlo), écart normalisé, régression linéaire.
   ===================================================================== */
const PH2=(function(){
const P={};
const SQ3=Math.sqrt(3);

/* ---------- tirages (générateur à graine : mêmes tirages tant que la graine est la même) ---------- */
P.rng=function(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}};
P.gauss=function(r){let u=0;while(u===0)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r())};

/* ---------- statistiques d'une série ---------- */
P.mean=v=>{let s=0;for(let i=0;i<v.length;i++)s+=v[i];return v.length?s/v.length:NaN};
P.sd=(v,m)=>{const n=v.length;if(n<2)return NaN;if(m===undefined)m=P.mean(v);let s=0;for(let i=0;i<n;i++)s+=(v[i]-m)*(v[i]-m);return Math.sqrt(s/(n-1))};
P.typeA=v=>{const n=v.length,m=P.mean(v),s=P.sd(v,m);return{n,mean:m,s,u:n>1?s/Math.sqrt(n):NaN}};
P.uniforme=D=>D/SQ3;
P.notice=(lecture,pct,digits,res)=>pct/100*Math.abs(lecture)+digits*res;
P.compose=(...u)=>Math.sqrt(u.reduce((s,x)=>s+x*x,0));
P.ecartNorm=(x1,u1,x2,u2)=>{const d=Math.sqrt(u1*u1+u2*u2);return d>0?Math.abs(x1-x2)/d:(x1===x2?0:Infinity)};

/* arrondi : u par excès à 2 chiffres significatifs, valeur arrondie au même rang */
P.arrondi=function(x,u){
  if(!(u>0)||!isFinite(u))return null;
  let e=Math.floor(Math.log10(u)),q=Math.pow(10,e-1),m=Math.ceil(u/q-1e-9);
  if(m>=100){m=10;e+=1;q=Math.pow(10,e-1)}
  return{x:Math.round(x/q)*q,u:m*q,d:Math.max(0,1-e),e};
};

/* ---------- histogramme à classes « rondes » ---------- */
function nice(raw){const p=Math.pow(10,Math.floor(Math.log10(raw))),r=raw/p;return(r<1.4?1:r<2.25?2:r<3.5?2.5:r<7?5:10)*p}
P.classes=n=>Math.max(6,Math.min(60,Math.round(Math.sqrt(n)*1.2)));
P.hist=function(v,n){
  n=n===undefined?v.length:n;
  if(n<1)return null;
  let mn=Infinity,mx=-Infinity;for(let i=0;i<n;i++){if(v[i]<mn)mn=v[i];if(v[i]>mx)mx=v[i]}
  if(!(mx>mn)){const w=Math.abs(mn)*0.01||1;return{w,lo:mn-w,c:[0,n,0],nb:3,max:n}}
  const w=nice((mx-mn)/P.classes(n)),lo=Math.floor(mn/w+1e-9)*w,nb=Math.floor((mx-lo)/w+1e-9)+1,c=new Array(nb).fill(0);
  for(let i=0;i<n;i++){let k=Math.floor((v[i]-lo)/w+1e-9);if(k>=nb)k=nb-1;if(k<0)k=0;c[k]++}
  return{w,lo,nb,c,max:Math.max(...c)};
};
P.compte=function(v,k,lay){const c=new Array(lay.nb).fill(0);for(let i=0;i<k;i++){let j=Math.floor((v[i]-lay.lo)/lay.w+1e-9);if(j>=lay.nb)j=lay.nb-1;if(j<0)j=0;c[j]++}return c};
P.pdf=(x,m,s)=>Math.exp(-0.5*((x-m)/s)*((x-m)/s))/(s*Math.sqrt(2*Math.PI));
/** nombre de valeurs dans ±k s autour de la moyenne (k = 1, 2, 3) */
P.bandes=function(v,n,m,s){const out=[0,0,0];for(let i=0;i<n;i++){const d=Math.abs(v[i]-m);for(let k=0;k<3;k++)if(d<=(k+1)*s)out[k]++}return out};
P.modeleBandes=[0.682689492,0.954499736,0.997300204];

/* ---------- formule libre ---------- */
const FONCTIONS={sqrt:'Math.sqrt',exp:'Math.exp',ln:'Math.log',log:'Math.log10',sin:'Math.sin',cos:'Math.cos',tan:'Math.tan',asin:'Math.asin',acos:'Math.acos',atan:'Math.atan',abs:'Math.abs',sinh:'Math.sinh',cosh:'Math.cosh',tanh:'Math.tanh'};
P.nomValide=s=>/^[A-Za-z_][A-Za-z_0-9]*$/.test(s)&&!(s in FONCTIONS)&&s!=='pi'&&!/^(Math|Function|window|document|this|eval|constructor|prototype|globalThis)$/.test(s);
P.compiler=function(expr,noms){
  let s=String(expr).trim().replace(/,/g,'.').replace(/\^/g,'**').replace(/[×·]/g,'*').replace(/[−–]/g,'-').replace(/π/g,'pi').replace(/√/g,'sqrt');
  if(!s)return{err:'Formule vide.'};
  if(!/^[0-9A-Za-z_\s+\-*/().]*$/.test(s))return{err:'Caractère non accepté dans la formule.'};
  let inconnu=null;
  const js=s.replace(/\d+\.?\d*(?:e[+-]?\d+)?|[A-Za-z_]\w*/gi,t=>{
    if(/^\d/.test(t))return t;
    if(FONCTIONS[t])return FONCTIONS[t];
    if(t==='pi')return 'Math.PI';
    if(noms.includes(t))return t;
    inconnu=inconnu||t;return t});
  if(inconnu)return{err:'Symbole inconnu : '+inconnu+'.'};
  let fn;
  try{fn=new Function(...noms,'"use strict";return ('+js+');')}catch(e){return{err:'Formule non valide.'}}
  return{fn};
};

/* ---------- propagation ---------- */
/** u d'une grandeur : kind 'u' (écart-type) ou 'D' (demi-largeur Δ, loi uniforme) */
P.uEff=v=>v.kind==='D'?v.p/SQ3:v.p;
/** tirages Monte-Carlo de f(x1, x2, …) : gaussienne (kind u) ou uniforme sur [x − Δ, x + Δ] (kind D) */
P.mc=function(fn,vars,N,seed){
  const r=P.rng(seed),ys=new Float64Array(N),args=new Array(vars.length);
  let ok=0;
  for(let i=0;i<N;i++){
    for(let j=0;j<vars.length;j++){const v=vars[j];args[j]=v.p>0?(v.kind==='D'?v.val+v.p*(2*r()-1):v.val+v.p*P.gauss(r)):v.val}
    const y=fn(...args);if(isFinite(y))ys[ok++]=y;
  }
  return ys.subarray(0,ok);
};
/** contributions linéarisées (∂f/∂xi · u(xi))² par différence centrée ; u_lin = √Σ */
P.budget=function(fn,vars){
  const vals=vars.map(v=>v.val),y0=fn(...vals),c=[];
  vars.forEach((v,i)=>{
    const u=P.uEff(v);
    if(!(u>0)){c.push(0);return}
    const h=1e-4*u,a=vals.slice(),b=vals.slice();a[i]+=h;b[i]-=h;
    const d=(fn(...a)-fn(...b))/(2*h);c.push((d*u)*(d*u));
  });
  const s=c.reduce((x,y)=>x+y,0);
  return{y0,c,uLin:Math.sqrt(s)};
};
/** somme y = Σ ci xi : contributions (ci u(xi))² */
P.budgetSomme=(vars)=>{const c=vars.map(v=>{const u=P.uEff(v);return(v.coef*u)*(v.coef*u)});const y0=vars.reduce((s,v)=>s+v.coef*v.val,0);return{y0,c,uLin:Math.sqrt(c.reduce((a,b)=>a+b,0))}};
/** produit y = k Π xi^αi : contributions (y · αi u(xi)/xi)² */
P.budgetProduit=(vars,k)=>{
  const y0=k*vars.reduce((s,v)=>s*Math.pow(v.val,v.coef),1);
  const c=vars.map(v=>{const u=P.uEff(v);return v.val===0?0:Math.pow(y0*v.coef*u/v.val,2)});
  return{y0,c,uLin:Math.sqrt(c.reduce((a,b)=>a+b,0))};
};

/* ---------- régression linéaire y = a x + b ---------- */
P.fit=function(x,y){
  const n=x.length,mx=P.mean(x),my=P.mean(y);let sxx=0,sxy=0;
  for(let i=0;i<n;i++){sxx+=(x[i]-mx)*(x[i]-mx);sxy+=(x[i]-mx)*(y[i]-my)}
  const a=sxx>0?sxy/sxx:NaN;return{a,b:my-a*mx};
};
P.zReg=function(pts,a,b){return pts.map(p=>{const d=Math.sqrt(p.uy*p.uy+a*a*p.ux*p.ux);return d>0?(p.y-a*p.x-b)/d:0})};
P.mcReg=function(pts,loi,M,seed){
  const r=P.rng(seed),n=pts.length,A=new Float64Array(M),B=new Float64Array(M),x=new Array(n),y=new Array(n);
  for(let k=0;k<M;k++){
    for(let i=0;i<n;i++){const p=pts[i];
      if(loi==='unif'){x[i]=p.x+SQ3*p.ux*(2*r()-1);y[i]=p.y+SQ3*p.uy*(2*r()-1)}
      else{x[i]=p.x+p.ux*P.gauss(r);y[i]=p.y+p.uy*P.gauss(r)}}
    const f=P.fit(x,y);A[k]=f.a;B[k]=f.b;
  }
  const ua=P.sd(A),ub=P.sd(B),ma=P.mean(A),mb=P.mean(B);let c=0;for(let k=0;k<M;k++)c+=(A[k]-ma)*(B[k]-mb);
  return{A,B,ua,ub,corr:c/((M-1)*ua*ub)};
};
/** diagnostic des écarts normalisés : points hors de ±2, écarts tous très petits, structure en signe */
P.diagnostic=function(z){
  const n=z.length,bad=[];let mx=0,ch=0,prev=0;
  z.forEach((v,i)=>{if(Math.abs(v)>2)bad.push(i);mx=Math.max(mx,Math.abs(v));const s=Math.sign(v);if(s!==0){if(prev!==0&&s!==prev)ch++;prev=s}});
  return{bad,max:mx,changes:ch,
    trop:n>=6&&mx<0.5,
    motif:n>=7&&ch<=2&&mx>=1.2&&bad.length===0};
};
return P;
})();

// @titre Calculs et incertitudes · PH2 · MPSI
// @sortie ../PH2_Incertitudes/PH2_Incertitudes.html
// @inclure PH2_stats.js
// @style PH2_Incertitudes.css
// @description Outil de TP : incertitude-type (A et B), propagation, Monte-Carlo et régression linéaire sur les mesures saisies, avec écart normalisé.
'use strict';
/* PH2 · Calculs et incertitudes : outil de TP (disposition « atelier »).
   Modèle : PH2_stats.js. L'élève saisit ses mesures ; écart normalisé Z = |x − x_ref| / √(u² + u_ref²) dans chaque onglet. */
const M=AnimKit.M, F=AnimKit.fmt, SQ3=Math.sqrt(3), BLEU='#58a6ff';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const sub=(s,i)=>M.v(s,i);
const nomFonction=t=>String(t.nom??'').trim()||'y';
/* ---------- lecture de nombres : point ou virgule décimale acceptés ---------- */
function lire(s){
  if(typeof s==='number')return s;
  s=String(s).trim().replace(/\s/g,'').replace(/,/g,'.').replace(/[−–]/g,'-').replace(/[×x]10\^?/i,'e');
  return s===''?NaN:Number(s);
}
function lireSerie(t){return Float64Array.from(String(t).split(/[\s;]+/).filter(Boolean).map(lire).filter(isFinite))}
function lirePoints(t){
  const pts=[];
  for(const l of String(t).split(/\r?\n/)){const c=l.trim().split(/[\t; ]+/).filter(Boolean).map(lire);if(c.length===4&&c.every(isFinite))pts.push({x:c[0],ux:Math.abs(c[1]),y:c[2],uy:Math.abs(c[3])})}
  return pts;
}
const nbTexte=x=>!isFinite(x)?'':String(+x.toPrecision(8));

/* ---------- écriture d'un résultat : (valeur ± u) unité, u arrondie par excès à 2 chiffres ---------- */
function ecrire(x,u,unite,nom){
  const nm=nom||'x', un=unite?'&nbsp;'+esc(unite):'', neg=s=>s.replace('-','−');
  const r=PH2.arrondi(x,u);
  if(!r)return `${nm} = ${F.sig(x,4)}${un}`;
  const e=Math.floor(Math.log10(Math.abs(r.x)||1)),eu=Math.floor(Math.log10(r.u)),ex=k=>`${String(k).replace('-','−')}`;
  if(e<-3||e>5){const d=Math.max(0,r.d+e),f=Math.pow(10,e),fu=Math.pow(10,eu);
    return `${nm} = ${neg((r.x/f).toFixed(d))} × 10<sup>${ex(e)}</sup>${un} , u(${nm}) = ${(r.u/fu).toFixed(1)} × 10<sup>${ex(eu)}</sup>${un}`}
  return `${nm} = ${neg(r.x.toFixed(r.d))}${un} , u(${nm}) = ${r.u.toFixed(r.d)}${un}`;
}
const lienz=(z)=>z<=2?`<span class="ok">compatible</span>`:`<span class="ko">incompatible</span>`;
/** échelle d'affichage d'un axe : puissance de dix pour éviter les graduations illisibles */
function echelle(lo,hi){const m=Math.max(Math.abs(lo),Math.abs(hi));if(!(m>0))return 1;const e=Math.floor(Math.log10(m));return(e<-3||e>5)?Math.pow(10,e):1}
const suffixe=f=>f===1?'':` ×10<tspan font-size="72%" dy="-0.55em">${String(Math.round(Math.log10(f))).replace('-','−')}</tspan><tspan dy="0.4em">​</tspan>`;

/* ---------- dessin d'un histogramme (style des figures PH2) ----------
   o : lay (classes), counts, n (nombre de valeurs comptées), mode 'eff' | 'dens',
       xlo, xhi (étendue de l'axe), modele {m,s}, lin {m,s}, ombre, bandes, unif {c,D},
       ref {x,u}, moy, xlab, ylab, hauteur (effectif ou densité à inclure)                      */
function histo(a,R,o){
  const S=a.S,K=a.k,C=a.C,f=echelle(o.xlo,o.xhi);
  const lay=o.lay,n=o.n||0,mode=o.mode||'eff',w=lay?lay.w:1;
  const mY=mode==='eff'?(q=>n*w*q):(q=>q*f);
  const cY=mode==='eff'?(c=>c):(c=>c/(n*w)*f);
  const pdf=(x,m,s)=>PH2.pdf(x,m,s);
  let ymax=0;
  if(o.counts)for(const c of o.counts)ymax=Math.max(ymax,cY(c));
  const pic=m=>mY(1/(m.s*Math.sqrt(2*Math.PI)));
  if(o.modele)ymax=Math.max(ymax,pic(o.modele));
  if(o.lin)ymax=Math.max(ymax,pic(o.lin));
  if(o.ref&&o.ref.u>0)ymax=Math.max(ymax,pic({s:o.ref.u}));
  if(o.hauteur)ymax=Math.max(ymax,o.hauteur);
  const hU=o.unif?(lay&&ymax>0?0.5*ymax:mY(1/(2*o.unif.D))):0;
  if(o.unif)ymax=Math.max(ymax,hU);
  if(!(ymax>0))ymax=1;
  ymax*=o.bandes?1.75:1.14;
  const pad=0.03*(o.xhi-o.xlo),xmin=(o.xlo-pad)/f,xmax=(o.xhi+pad)/f;
  const G=S.graph({x:R.x,y:R.y,w:R.w,h:R.h,padB:36*K,xmin,xmax,ymin:0,ymax,
    nx:Math.max(3,Math.round(R.w/(78*K))),
    xfmt:(v,st)=>F.fix(v,Math.max(0,-Math.floor(Math.log10(st)+1e-9))),
    xlab:(o.xlab||'')+suffixe(f),ylab:o.ylab||''});
  const clip='c_'+(o.cid||'x');
  let s=S.clip(clip,G)+G.svg,X=x=>G.X(x/f),Y=G.Y;
  const aire=(m,sig,col,op)=>{const x1=Math.max(m-sig*1,0);return S.rect(X(m-sig),G.y0,X(m+sig)-X(m-sig),G.h,{fill:col,fop:op})};
  if(o.bandes&&o.moyenne!==undefined){const m=o.moyenne,sg=o.sigma;
    [3,2,1].forEach((k,i)=>{s+=S.rect(X(m-k*sg),G.y0,X(m+k*sg)-X(m-k*sg),G.h,{fill:C.cInk,fop:[.07,.1,.15][i]})});
    ['±σ','±2σ','±3σ'].forEach((t,i)=>{const yy=Y(ymax*(0.93-0.085*i));
      s+=S.arrow(X(m),yy,X(m-(i+1)*sg),yy,{w:1.5,c:C.ink})+S.arrow(X(m),yy,X(m+(i+1)*sg),yy,{w:1.5,c:C.ink});
      s+=S.text(X(m-(i+1)*sg)+4*K,yy-10*K,`${t} : ${['68','95','99.7'][i]} %`,{anchor:'start',size:13,c:C.ink})});
  }
  if(o.counts){const hh=cY,bw=(X(lay.lo+lay.w)-X(lay.lo));
    o.counts.forEach((c,i)=>{if(c<=0)return;const x0=(lay.lo+i*lay.w),x1=x0+lay.w;
      s+=S.rect(X(x0),Y(hh(c)),Math.max(1,X(x1)-X(x0)),Y(0)-Y(hh(c)),{fill:BLEU,fop:.92,c:bw>6?C.card:undefined,w:.8})})}
  const courbe=(m,sg,col,dash,w2)=>{const pts=[];const a0=Math.max(xmin*f,m-4.2*sg),b0=Math.min(xmax*f,m+4.2*sg);
    for(let i=0;i<=160;i++){const x=a0+(b0-a0)*i/160;pts.push([x/f,mY(pdf(x,m,sg))])}
    return S.curve(pts,G,{c:col,w:w2||2.2,dash})};
  if(o.ombre&&o.modele){const m=o.modele.m,sg=o.modele.s,pts=[[ (m-sg)/f,0]];
    for(let i=0;i<=40;i++){const x=m-sg+2*sg*i/40;pts.push([x/f,mY(pdf(x,m,sg))])}pts.push([(m+sg)/f,0]);
    s+=S.poly(pts.map(([x,y])=>[G.X(x),Y(y)]),{close:true,fill:C.cInk,fop:.3,c:'none',w:0})}
  if(o.unif){const{c:c0,D}=o.unif,h0=hU;
    s+=S.poly([[X(c0-D),Y(0)],[X(c0-D),Y(h0)],[X(c0+D),Y(h0)],[X(c0+D),Y(0)]],{c:C.E,w:2.4,dash:'7 4'})}
  if(o.modele)s+=courbe(o.modele.m,o.modele.s,C.ink,undefined,2.4);
  if(o.lin)s+=courbe(o.lin.m,o.lin.s,C.E,'7 4',2.4);
  const etiquettesEnHaut=o.interv?.haut;
  const yEtiquette=G.y0+(o.bandes?G.h*.02+12*K:12*K);
  if(o.ref){if(o.ref.u>0)s+=courbe(o.ref.x,o.ref.u,C.v,undefined,2.4);
    s+=S.line(X(o.ref.x),G.y0,X(o.ref.x),G.y0+G.h,{c:C.v,w:4.5});
    const proche=o.moyenne!==undefined&&Math.abs(X(o.ref.x)-X(o.moyenne))<70*K;
    s+=S.text(X(o.ref.x)+6*K,G.y0+(etiquettesEnHaut||proche?32*K:12*K),S.v(o.refNom||'x','réf'),{size:14,c:C.v,weight:600})}
  if(o.interv){const m=o.interv.m,u=o.interv.u;
    s+=S.rect(X(m-u),G.y0,X(m+u)-X(m-u),G.h,{fill:C.E,fop:.16});
    const y=etiquettesEnHaut?yEtiquette:G.y0+G.h*.5;
    s+=S.text(X(m+u)+5*K,y,o.interv.label||'u',{size:etiquettesEnHaut?14:13.5,c:C.E,weight:600})}
  if(o.moyenne!==undefined&&o.moy!==false){const m=o.moyenne;
    s+=S.line(X(m),G.y0,X(m),G.y0+G.h,{c:C.ink,w:1.6,dash:'6 4'});
    const aGauche=etiquettesEnHaut||o.ref&&o.ref.x>m;
    s+=S.text(X(m)+(aGauche?-6*K:6*K),yEtiquette,S.v(o.moyNom||'x̄'),{size:14,c:C.ink,weight:600,anchor:aGauche?'end':'start'})}
  return{svg:s,G};
}

/* ---------- barres du budget d'incertitude : part de chaque grandeur dans u(y)² ---------- */
let HIT_BUD=[];
function budget(a,R,vars,c,mute,uy,titre){
  const S=a.S,K=a.k,C=a.C,n=vars.length,tot=c.reduce((x,y)=>x+y,0);
  const padL=Math.min(R.w*.28,100*K),padR=64*K,top=38*K,bas=32*K,rh=Math.min(88*K,(R.h-top-bas)/Math.max(1,n));
  let s=S.text(10*K,16*K,titre,{size:13.5,c:C.ink,weight:600,halo:false,base:'top'});
  HIT_BUD=[];
  vars.forEach((v,i)=>{const y0=top+i*rh,sh=tot>0?c[i]/tot:0,L=Math.max(0,R.w-padL-padR),bw=sh*L,cy=y0+rh/2;
    HIT_BUD.push({y0:R.y+y0,y1:R.y+y0+rh,i});
    s+=S.rect(R.x+10*K,R.y+y0+3*K,R.w-20*K,rh-6*K,{fill:mute[i]?'none':C.cInk,fop:mute[i]?1:.08,c:mute[i]?C.ink2:'none',w:1,dash:mute[i]?'4 4':undefined,rx:6*K});
    s+=S.text(R.x+padL-10*K,R.y+cy,S.v(esc(v.nom||'?')),{anchor:'end',size:15,c:C.ink,halo:false});
    if(mute[i])s+=S.text(R.x+padL+8*K,R.y+cy,'u mise à zéro',{size:13,c:C.ink2,halo:false});
    else{s+=S.rect(R.x+padL,R.y+cy-14*K,bw,28*K,{fill:C.cInk,fop:.9,rx:3*K});
      s+=S.text(R.x+padL+bw+8*K,R.y+cy,`${F.fix(sh*100,0)} %`,{size:14,c:C.ink,halo:false,weight:600})}});
  s+=S.text(10*K,R.h-10*K,'Clic sur une barre : u mise à zéro',{size:12.5,c:C.ink2,halo:false,base:'bottom'});
  return s;
}

/* ---------- petits constructeurs de champs ---------- */
const h=(tag,attrs,html)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs||{}))e.setAttribute(k,v);if(html!==undefined)e.innerHTML=html;return e};
const change=()=>{sauver();A.refresh();A.render()};
function fld(label,obj,key,o={}){

}
function chk(label,obj,key,onchg){

function seg(opts,obj,key,onchg){

function selNum(label,opts,obj,key){

function blocRef(t,libelle){

/** tableau à remplir : on peut y coller des colonnes depuis un tableur ; une ligne vide est toujours ajoutée en fin */
function grille(rows,cols,titreLigne,map2){
  const root=h('div',{class:'ph-grid'}),nc=cols.length,vide=()=>Array(nc).fill('');
  let tb=null;
  const ligne=(r,i)=>{
    const tr=h('tr');tr.append(h('td',{class:'n'},String(i+1)));
    for(let j=0;j<nc;j++){
      const inp=h('input',{type:'text',inputmode:'decimal',value:r[j]??'',spellcheck:'false',autocomplete:'off','aria-label':`${titreLigne||'Ligne'} ${i+1}, ${cols[j].replace(/<[^>]+>/g,'')}`});
      inp.oninput=()=>{r[j]=inp.value;if(r===rows[rows.length-1]&&inp.value.trim()!==''){rows.push(vide());tb.append(ligne(rows[rows.length-1],rows.length-1))}change()};
      inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const nx=tb.children[i+1];if(nx)nx.children[j+1].firstChild.focus()}};
      inp.onpaste=e=>{
        const txt=(e.clipboardData||window.clipboardData).getData('text');if(!txt)return;e.preventDefault();
        let tok=txt.replace(/\r/g,'').split('\n').filter(l=>l.trim()!=='').map(l=>l.trim().split(/[\t;]+|\s+/).filter(s=>s!==''));
        if(nc===1)tok=tok.flat().map(s=>[s]);
        tok.forEach((cells,k)=>{const ri=i+k;while(rows.length<=ri)rows.push(vide());cells.forEach((c,m)=>{const jj=(map2&&cells.length===2&&j===0)?map2[m]:j+m;if(jj<nc)rows[ri][jj]=c})});
        build();change();
      };
      const td=h('td');td.append(inp);tr.append(td);
    }
    const td=h('td'),x=h('button',{class:'ph-x',type:'button',title:'Supprimer la ligne','aria-label':'Supprimer la ligne'},'×');
    x.onclick=()=>{rows.splice(i,1);build();change()};td.append(x);tr.append(td);return tr;
  };
  const build=()=>{
    if(!rows.length||rows[rows.length-1].some(c=>String(c).trim()!==''))rows.push(vide());
    root.innerHTML='';const t=h('table');t.innerHTML=`<thead><tr><th>#</th>${cols.map(c=>`<th>${c}</th>`).join('')}<th></th></tr></thead>`;
    tb=h('tbody');rows.forEach((r,i)=>tb.append(ligne(r,i)));t.append(tb);root.append(t);
  };
  build();root.build=build;return root;
}
/** tableau des grandeurs mesurées : nom, valeur, nature de l'incertitude (u ou Δ), incertitude, coefficient */
function tableVars(t,coefTitre){
  const root=h('div',{class:'ph-grid ph-vt'});
  const build=()=>{
    root.innerHTML='';const tab=h('table');
    tab.innerHTML=`<thead><tr><th>Nom</th><th>Valeur</th><th title="u : écart-type · Δ : demi-largeur (loi uniforme, u = Δ/√3)">u ou Δ</th><th>Incertitude</th>${coefTitre?`<th>${coefTitre()}</th>`:''}<th></th></tr></thead>`;
    const tb=h('tbody');
    t.vars.forEach((v,i)=>{
      const tr=h('tr'),cell=(node)=>{const td=h('td');td.append(node);tr.append(td)};
      const inp=(val,fn,cls)=>{const e=h('input',{type:'text',value:val,inputmode:cls==='nom'?'text':'decimal',spellcheck:'false',autocomplete:'off',class:cls||''});e.oninput=()=>{fn(e.value);change()};return e};
      cell(inp(v.nom,x=>{v.nom=x},'nom'));cell(inp(nbTexte(v.val),x=>{v.val=lire(x)}));
      const s=h('select',{'aria-label':'Nature de l\'incertitude'});[['u','u'],['D','Δ']].forEach(([val,l])=>{const o=h('option',{value:val},l);if(v.kind===val)o.selected=true;s.append(o)});
      s.onchange=()=>{v.kind=s.value;change()};cell(s);
      cell(inp(nbTexte(v.p),x=>{v.p=Math.abs(lire(x))}));
      if(coefTitre)cell(inp(nbTexte(v.coef),x=>{v.coef=lire(x)}));
      const td=h('td');if(t.vars.length>1){const x=h('button',{class:'ph-x',type:'button',title:'Supprimer','aria-label':'Supprimer cette grandeur'},'×');x.onclick=()=>{t.vars.splice(i,1);t.mute.splice(i,1);build();change()};td.append(x)}tr.append(td);
      tb.append(tr);
    });
    tab.append(tb);root.append(tab);
    if(t.vars.length<6){const b=h('button',{class:'mini',type:'button'},'+ Ajouter une grandeur');b.onclick=()=>{t.vars.push(V('x'+(t.vars.length+1),NaN,'u',NaN,1));t.mute.push(false);build();change()};root.append(b)}
  };
  build();root.build=build;return root;
}

    const sousOnglets=()=>seg([['somme','Somme'],['produit','Produit'],['formule','Fonction quelconque']],ST.t1,'type',()=>a.recon());
    PANES.t1=()=>{const t=ST.t1,p=panes.t1;
      const tv=tableVars(t,()=>t.type==='somme'?`Coef. ${M.v('c')}`:`Expos. ${M.v('α')}`);

      nx.append(dup('Abscisse','xnom','xun'),dup('Ordonnée','ynom','yun'));
      p.append(barre('t3'),nx,h('div',{class:'ph-sub'},'Points : coller depuis le tableur les colonnes x et y (2 colonnes), ou x, u(x), y, u(y). Les incertitudes sont facultatives. Les points se déplacent dans le graphique.'),
        grille(t.rows,[`${M.v('x')}`,`${M.v('u')}(${M.v('x')})`,`${M.v('y')}`,`${M.v('u')}(${M.v('y')})`],'Point',[0,2]));
      p.append(h('div',{class:'ph-sub'},'Monte-Carlo sur a et b'),seg([['unif','Tirages uniformes'],['gauss','Tirages gaussiens']],t,'loi'),
        selNum('Nombre de tirages',[[1000,'1 000'],[10000,'10 000'],[50000,'50 000']],t,'M'),

    for(const id of['bud1','bud2'])a.drag(id,{hit:(x,y)=>HIT_BUD.some(r=>y>=r.y0&&y<r.y1),
      start:(x,y)=>{const r=HIT_BUD.find(r=>y>=r.y0&&y<r.y1);if(!r)return;const m=ST[id==='bud1'?'t1':'t2'].mute;m[r.i]=!m[r.i];sauver()},move:()=>{}});

      end:()=>{ST.drag3=-1;ST.gel3=null;sauver();const g=a.zones.saisie.querySelector('.ph-pane:nth-child(4) .ph-grid');if(g&&g.build)g.build()}});
  },

ST.drag3=-1;ST.gel3=null;
const calcZone=()=>A.zones.detail.firstChild;

/* ===================================================================== */
/* Onglet 1 : mesure directe                                              */
function d0(a){
  const t=ST.t0,P=a.panels.h0,nom=esc(t.nom||'x'),unite=t.unite||'';
  const data=colonne(t.rows,0),N=data.length,Aa=N>=2?PH2.typeA(data):null;
  const bmin=lire(t.bmin),bmax=lire(t.bmax),bornes=t.B&&t.modeB==='B'&&bmax>bmin;
  const lecture=Aa?Aa.mean:(N===1?data[0]:bornes?(bmin+bmax)/2:lire(t.lec));
  let Delta=NaN,uB=0;
  if(t.B){Delta=t.modeB==='D'?Math.abs(lire(t.delta)):t.modeB==='B'?(bornes?(bmax-bmin)/2:NaN):PH2.notice(lecture,Math.abs(lire(t.pct)),Math.abs(lire(t.dgt)),Math.abs(lire(t.res)));uB=PH2.uniforme(Delta)}
  const uA=Aa?Aa.u:0,x=lecture,okB=t.B&&isFinite(uB)&&isFinite(x);
  const u=(Aa||okB)&&isFinite(x)?PH2.compose(uA,okB?uB:0):NaN;
  const zi=zInfo(t,x,isFinite(u)?u:0);
  /* graphique */
  if(N>=1){
    const full=PH2.hist(data,N),sF=Aa?Aa.s:0,mF=PH2.mean(data);
    const lo=[full.lo,mF-3*(sF||full.w)],hi=[full.lo+full.nb*full.w,mF+3*(sF||full.w)];
    if(zi){lo.push(zi.ref.x-3*zi.ref.u,zi.ref.x);hi.push(zi.ref.x+3*zi.ref.u,zi.ref.x)}
    const o={lay:full,counts:PH2.compte(data,N,full),n:N,mode:'eff',xlo:Math.min(...lo),xhi:Math.max(...hi),xlab:`${nom} [${esc(unite)}]`,ylab:'Effectif',cid:'h0'};
    if(Aa){o.moyenne=Aa.mean;o.moyNom='x̄';if(isFinite(u)&&u>0)o.interv={m:Aa.mean,u,label:`u(x̄)`}}
    if(zi)o.ref=zi.ref;
    a.svg('h0',histo(a,{x:0,y:0,w:P.w,h:P.h},o).svg);
  }else if(okB&&Delta>0){
    const o={mode:'dens',n:0,xlo:x-1.6*Delta,xhi:x+1.6*Delta,xlab:`${nom} [${esc(unite)}]`,ylab:'Densité de probabilité',unif:{c:x,D:Delta},modele:{m:x,s:uB},moyenne:x,moyNom:'x',cid:'h0'};
    if(zi){o.xlo=Math.min(o.xlo,zi.ref.x-3*zi.ref.u,zi.ref.x);o.xhi=Math.max(o.xhi,zi.ref.x+3*zi.ref.u,zi.ref.x);o.ref=zi.ref}
    a.svg('h0',histo(a,{x:0,y:0,w:P.w,h:P.h},o).svg);
  }else manque(a,'h0','Collez vos mesures dans le tableau pour tracer l\'histogramme.');
  a.legend(N<1?[okB&&{c:a.C.E,label:'Loi uniforme sur [x − Δ ; x + Δ]',dash:true},okB&&{c:a.C.ink,label:'Loi normale de même u'},zi&&{c:a.C.v,label:'Référence'}]:[{c:BLEU,label:'Mesures (histogramme)'},Aa&&{c:a.C.ink,label:'Moyenne x̄',dash:true},Aa&&{c:a.C.E,label:'u(x̄) composée'},zi&&{c:a.C.v,label:'Référence'}]);
  /* résultats */
  let r='';
  if(isFinite(u)){r+=ligneRes('Résultat',ecrire(x,u,unite,nom));
    if(okB&&Delta>0)r+=note(`type B : ${M.v('Δ')} = ${F.sig(Delta,3)}${unite?'&nbsp;'+esc(unite):''}, ${sub('u','B')} = ${M.frac('Δ',M.sqrt('3'))} = ${F.sig(uB,3)}${unite?'&nbsp;'+esc(unite):''}`,'gr');
    r+=note(Aa&&okB?`type A (${M.v('N')} = ${N}) et type B composés`:Aa?`type A, ${M.v('N')} = ${N} mesures`:'type B seul');}
  else r+=note('Entrez au moins deux mesures, ou une valeur lue avec une évaluation de type B.','gr');
  r+=zLigne(zi);
  setZone(a.zones.resultat,r);
  /* calcul détaillé */
  const U=`&nbsp;${esc(unite)}`,sg=v=>F.sig(v,3);let c='';
  if(Aa)c+=`<b>Type A</b> (${M.v('N')} = ${N})<br>${M.v('x̄')} = ${M.frac('1',M.v('N'))} Σ ${sub('x','i')} = ${sg(Aa.mean)}${U}<br>${M.v('s')} = ${M.sqrt(M.frac(`Σ(${sub('x','i')} − ${M.v('x̄')})²`,`${M.v('N')} − 1`))} = ${sg(Aa.s)}${U}<br><span class="lien">donc</span>${sub('u','A')} = ${M.frac(M.v('s'),M.sqrt(M.v('N')))} = <span class="res">${sg(Aa.u)}${U}</span><br>`;
  if(t.B&&isFinite(Delta))c+=`<b>Type B</b><br>${t.modeB==='B'?`Δ = ${M.frac('max − min','2')} = ${M.frac(`${sg(bmax)} − ${sg(bmin)}`,'2')} = ${sg(Delta)}${U}<br>`:t.modeB==='N'?`Δ = ${sg(Math.abs(lire(t.pct)))} % × ${sg(Math.abs(lecture))} + ${sg(lire(t.dgt))} × ${sg(lire(t.res))} = ${sg(Delta)}${U}<br>`:`Δ = ${sg(Delta)}${U}<br>`}<span class="lien">ainsi</span>${sub('u','B')} = ${M.frac('Δ',M.sqrt('3'))} = <span class="res">${sg(uB)}${U}</span><br>`;
  if(Aa&&okB)c+=`<b>Composition</b><br>${M.v('u')} = ${M.sqrt(`${sub('u','A')}² + ${sub('u','B')}²`)} = <span class="res">${sg(u)}${U}</span><br>`;
  if(isFinite(u))c+=`<b>Résultat</b><br><span class="res">${ecrire(x,u,unite,nom)}</span><div class="gr">u arrondie par excès à 2 chiffres significatifs.</div>`;
  c+=zCalc(zi,M.v('x̄'));
  if(Aa)c+=`<br><b>Dans l'intervalle</b><table>${(b=>[0,1,2].map(i=>`<tr><td>${['±s','±2s','±3s'][i]}</td><td>${b[i]} sur ${N} (${F.fix(100*b[i]/N,0)} %)</td><td class="gr">loi normale : ${['68','95','99.7'][i]} %</td></tr>`).join(''))(PH2.bandes(data,N,Aa.mean,Aa.s))}</table>`;
  setZone(calcZone(),c);
}

/* Propagation : somme ou produit                                            */
function d1(a){
  const t=ST.t1,vars=t.vars,mute=t.mute;
  while(mute.length<vars.length)mute.push(false);
  const ve=vEff(vars,mute),k=lire(t.k),somme=t.type==='somme',nom=esc(t.nom||'y'),unite=t.unite||'';
  const P1=a.panels.bud1,P2=a.panels.res1;
  const ok=vars.length&&vars.every(v=>finis(v.val,v.p,v.coef))&&(somme||finis(k)&&vars.every(v=>v.val!==0));
  if(!ok){manque(a,'bud1','Complétez les valeurs, incertitudes et coefficients.');a.svg('res1','');a.legend([]);
    setZone(a.zones.resultat,note('Complétez le tableau des grandeurs mesurées.','gr'));setZone(calcZone(),'');return}
  const B=somme?PH2.budgetSomme(ve):PH2.budgetProduit(ve,k);
  const y=B.y0,u=B.uLin,zi=zInfo(t,y,u);
  a.svg('bud1',budget(a,{x:0,y:0,w:P1.w,h:P1.h},vars,B.c,mute,u,'Part de chaque grandeur dans u(y)²'));
  const lo=[y-3.6*u],hi=[y+3.6*u];if(zi){lo.push(zi.ref.x-3*zi.ref.u,zi.ref.x);hi.push(zi.ref.x+3*zi.ref.u,zi.ref.x)}
  if(!(u>0)){lo[0]=y-1;hi[0]=y+1}
  const o={mode:'dens',n:0,xlo:Math.min(...lo),xhi:Math.max(...hi),xlab:`${nom} [${esc(unite)}]`,ylab:'Densité de probabilité',modele:u>0?{m:y,s:u}:null,ombre:u>0,moyenne:y,moyNom:'y',cid:'r1'};
  if(zi)o.ref=zi.ref;
  a.svg('res1',u>0?histo(a,{x:0,y:0,w:P2.w,h:P2.h},o).svg:a.S.text(P2.w/2,P2.h/2,'u(y) = 0',{anchor:'middle',size:16,c:a.C.ink2,halo:false}));
  a.legend([{c:a.C.cInk,label:'Part dans u(y)²'},{c:a.C.ink,label:'Loi normale N(y, u(y))'},zi&&{c:a.C.v,label:'Référence'}]);
  let r=ligneRes('Résultat',ecrire(y,u,unite,nom))+note(mute.some(Boolean)?'certaines incertitudes sont mises à zéro (clic sur une barre)':'incertitude-type composée',mute.some(Boolean)?'gr':'')+zLigne(zi);
  setZone(a.zones.resultat,r);
  const sg=v=>F.sig(v,3),cf=v=>Number.isInteger(v)?String(v).replace('-','−'):F.sig(v,3),U=`&nbsp;${esc(unite)}`;let c='';
  if(somme){
    const t1=ve.map(v=>`${cf(v.coef)} × ${sg(v.val)}`).join(' + '),t2=ve.map(v=>`(${cf(v.coef)} × ${sg(uV(v))})²`).join(' + ');
    c+=`${M.v('y')} = Σ ${sub('c','i')}${sub('x','i')} = ${t1} = ${sg(y)}${U}<br><span class="lien">ainsi</span>${M.v('u')}(${M.v('y')}) = ${M.sqrt(`Σ (${sub('c','i')} ${M.v('u')}(${sub('x','i')}))²`)}<br><span class="lien">soit</span>${M.v('u')}(${M.v('y')}) = ${M.sqrt(t2)} = <span class="res">${sg(u)}${U}</span>`;
  }else{
    const t2=ve.map(v=>`(${cf(v.coef)} × ${sg(uV(v))}/${sg(v.val)})²`).join(' + '),rel=y!==0?u/Math.abs(y):NaN;
    c+=`${M.v('y')} = ${M.v('k')} Π ${sub('x','i')}<sup>${M.v('α','i')}</sup> = ${sg(y)}${U}<br><span class="lien">ainsi</span>${M.frac(`${M.v('u')}(${M.v('y')})`,`|${M.v('y')}|`)} = ${M.sqrt(`Σ (${M.v('α','i')} ${M.frac(`${M.v('u')}(${sub('x','i')})`,sub('x','i'))})²`)}<br><span class="lien">soit</span>${M.frac(`${M.v('u')}(${M.v('y')})`,`|${M.v('y')}|`)} = ${M.sqrt(t2)} = ${sg(rel)}<br><span class="lien">donc</span>${M.v('u')}(${M.v('y')}) = <span class="res">${sg(u)}${U}</span>`;
  }
