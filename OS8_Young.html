  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){

        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

<script>
/* Modèles partagés et indépendants du dessin. Distances en SI sauf atelier (unités explicites). */
window.OS8Model=(()=>{
 const tau=2*Math.PI,sinc=x=>Math.abs(x)<1e-7?1-x*x/6:Math.sin(x)/x;
 function phasor(a,b,phi){return Math.hypot(a+b*Math.cos(phi),b*Math.sin(phi));}
 function pathDelta(a,z,y){return 2*a*y/(Math.hypot(z,y+a/2)+Math.hypot(z,y-a/2));}
 function delta(s,x,ys=s.sourceCenter*1e-3){const a=s.a*1e-6;return s.exact?pathDelta(a,s.D,x)+pathDelta(a,s.d,ys):a*(x/s.D+ys/s.d);}
 function spectrum(s){
  if(s.experiment!=='temporal'||(s.spectrum!=='white'&&s.bandwidth===0))return [{nm:s.lambda,w:1}];
  const steps=(lo,hi)=>{const maxDelta=s.a*1e-6*((s.span||.05)/s.D+Math.abs(s.sourceCenter)*1e-3/s.d);return Math.min(8192,Math.max(80,Math.ceil(16*maxDelta*(1/lo-1/hi)*1e9)));};
  let out=[];if(s.spectrum==='white'){const N=steps(380,780);for(let j=0;j<=N;j++)out.push({nm:380+400*j/N,w:j===0||j===N?.5:1});}
  else{const sigma=s.bandwidth/2.354820045,lo=Math.max(380,s.lambda-4*sigma),hi=Math.min(780,s.lambda+4*sigma),N=steps(lo,hi);for(let j=0;j<=N;j++){const nm=lo+(hi-lo)*j/N;out.push({nm,w:Math.exp(-.5*((nm-s.lambda)/sigma)**2)*(j===0||j===N?.5:1)});}}
  const norm=out.reduce((a,v)=>a+v.w,0);return out.map(v=>({...v,w:v.w/norm}));
 }
 function atLambda(s,x,nm,sourceOverride){
  const lambda=nm*1e-9,I1=s.slit1?1:0,I2=s.slit2?(s.experiment==='balance'?s.ratio:1):0;
  const ys=sourceOverride===undefined?s.sourceCenter*1e-3:sourceOverride;
  const extended=s.experiment==='spatial'&&s.sourcePick==='all'&&sourceOverride===undefined;
  const actualYs=s.experiment==='spatial'&&s.sourcePick!=='all'&&sourceOverride===undefined?ys+Number(s.sourcePick)*s.sourceWidth*1e-3/2:ys;
  const de=delta(s,x,actualYs),gamma=extended?sinc(Math.PI*s.a*1e-6*s.sourceWidth*1e-3/(lambda*s.d)):1;
  const envelope=s.experiment==='diffraction'?sinc(Math.PI*s.width*1e-6/lambda*(x/Math.hypot(s.D,x)+actualYs/Math.hypot(s.d,actualYs)))**2:1;
  const phase=-tau*de/lambda;
  return {I:Math.max(0,envelope*(I1+I2+2*Math.sqrt(I1*I2)*gamma*Math.cos(phase))),I1,I2,gamma,envelope,phase,delta:de};
 }
 function intensity(s,x,spec=spectrum(s)){
  let I=0,re=0,im=0;for(const v of spec){const q=atLambda(s,x,v.nm);I+=v.w*q.I;re+=v.w*q.gamma*Math.cos(q.phase);im+=v.w*q.gamma*Math.sin(q.phase);}
  const q=atLambda(s,x,s.lambda),balance=q.I1+q.I2?2*Math.sqrt(q.I1*q.I2)/(q.I1+q.I2):0;
  return {I,visibility:balance*Math.hypot(re,im),delta:q.delta,phase:q.phase};
 }
 function pixelIntensity(s,x,nm,dx,sourceOverride,filterUnresolved=false){
  const q=atLambda(s,x,nm,sourceOverride);if(!dx)return q.I;
  const a=s.a*1e-6,slope=s.exact?(x+a/2)/Math.hypot(s.D,x+a/2)-(x-a/2)/Math.hypot(s.D,x-a/2):a/s.D;
  const cycles=Math.abs(slope*dx/(nm*1e-9));
  const averaging=filterUnresolved&&cycles>.5?0:sinc(Math.PI*slope*dx/(nm*1e-9));
  return Math.max(0,q.envelope*(q.I1+q.I2+2*Math.sqrt(q.I1*q.I2)*q.gamma*Math.cos(q.phase)*averaging));
 }
 function pulse(x,t,kind='collision',sign=1){const v=1.5,g=z=>Math.exp(-((z/.42)**2));return kind==='collision'?[g(x-(3+v*t)),sign*g(x-(9-v*t))]:[g(x-(2+v*t)),sign*g(x-(20-v*t))];}
 function wave(s,x,y,t=s.time){const k=tau/s.lambdaWorld;const one=s.sources[0],two=s.sources[1];const r1=Math.hypot(x-one.x,y-one.y),r2=Math.hypot(x-two.x,y-two.y);const a=s.only==='two'?0:1,b=s.count===2&&s.only!=='one'?s.ratio:0;const phase=s.phase*Math.PI/180-k*(r2-r1);return {r1,r2,delta:r2-r1,phase,a,b,s1:a*Math.cos(tau*t-k*r1),s2:b*Math.cos(tau*t-k*r2+s.phase*Math.PI/180),amplitude:phasor(a,b,phase)};}
 return {sinc,phasor,pathDelta,delta,spectrum,atLambda,intensity,pixelIntensity,pulse,wave};
})();

/* OS8 · outils communs aux deux animations (lot 15, 8 novembre 2026) */
const OS8U={
  /** couleur CSS (#rgb, #rrggbb, rgb(...)) → [r,g,b] */
  rgbOf(s){s=(s||'#888').trim();if(s[0]==='#'){if(s.length===4)s='#'+[...s.slice(1)].map(x=>x+x).join('');return[1,3,5].map(i=>parseInt(s.slice(i,i+2),16))}return(s.match(/[\d.]+/g)||[136,136,136]).slice(0,3).map(Number)},
  clamp:(x,a,b)=>Math.max(a,Math.min(b,x)),
  /** couleur approchée d'une longueur d'onde (nm) : [r,g,b] dans [0,1] */
  waveRGB(nm){let r=0,g=0,b=0;if(nm<440){r=(440-nm)/60;b=1}else if(nm<490){g=(nm-440)/50;b=1}else if(nm<510){g=1;b=(510-nm)/20}else if(nm<580){r=(nm-510)/70;g=1}else if(nm<645){r=1;g=(645-nm)/65}else r=1;
    const a=nm<420?.35+.65*(nm-380)/40:nm>700?.35+.65*(780-nm)/80:1;return[r,g,b].map(v=>OS8U.clamp(v*a,0,1))},
  css(rgb,br=1){return`rgb(${rgb.map(v=>Math.round(255*OS8U.clamp(v*br,0,1))).join(',')})`},
  /** texte de canvas avec halo de la couleur du fond */
  halo(ctx,a,s,x,y,o={}){const k=a.k;ctx.font=`${o.weight||400} ${(o.size||13)*k}px ${AnimKit.FONT}`;ctx.textAlign=o.anchor||'left';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=4*k;ctx.strokeStyle=a.C.card;ctx.strokeText(s,x,y);ctx.fillStyle=o.c||a.C.ink;ctx.fillText(s,x,y)},
  line(ctx,a,x1,y1,x2,y2,c,w,dash){const k=a.k;ctx.beginPath();ctx.strokeStyle=c;ctx.lineWidth=w*k;ctx.setLineDash(dash?dash.map(v=>v*k):[]);ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([])},
  dot(ctx,a,x,y,r,fill,stroke){ctx.beginPath();ctx.arc(x,y,r*a.k,0,6.2832);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2*a.k;ctx.stroke()}},
  /** image 1 × N (ou N × 1) en URL de données, pour les bandes de franges */
  strip(rows,vertical){const n=rows.length,cv=document.createElement('canvas');cv.width=vertical?1:n;cv.height=vertical?n:1;const c=cv.getContext('2d'),im=c.createImageData(cv.width,cv.height);
    for(let j=0;j<n;j++){const q=vertical?n-1-j:j,id=4*j;for(let m=0;m<3;m++)im.data[id+m]=Math.round(255*OS8U.clamp(rows[q][m],0,1));im.data[id+3]=255}c.putImageData(im,0,0);return cv.toDataURL('image/png')}
};

function spec(a){
  const s=Sx(a),key=JSON.stringify([s.experiment,s.lambda,s.spectrum,s.bandwidth,s.span,s.sourceCenter,s.D,s.d,s.a]);
  if(!st.spec||st.spec.key!==key){

      {type:'boutons',items:[{label:'Source ponctuelle',action:a=>{a.p.pick='all';a.set('B',0)}},{label:'Premier brouillage',titre:'B = λ₀d/a',action:a=>{a.p.pick='all';a.set('B',+(a.p.lambda*1e-9*a.p.dS/(a.p.a*1e-6)*1000).toFixed(2))}}]}]},
    {titre:'Mesurer plusieurs interfranges',items:[
      {id:'ruler',type:'check',label:'Règle sur le profil',value:false},
      {id:'N',label:'Nombre d\'intervalles N',type:'range',min:1,max:12,step:1,value:4,unit:'',si:a=>a.p.ruler},
      {type:'boutons',si:a=>a.p.ruler&&a.p.calc,items:[{label:'Placer sur 4 i',action:a=>{st.m1=-2*ifr(a);st.m2=2*ifr(a);a.set('N',4);a.set('span',Math.max(a.p.span,3*ifr(a)*1000))}}]},
      {type:'note',si:a=>a.p.ruler,html:'Glisser les repères A et B sur deux franges brillantes, puis régler N. Le calcul est donné dans les mesures.'}]},
    {titre:'Vérifier mon calcul',items:[
      {id:'calc',type:'check',label:'Afficher les valeurs calculées (δ, Δϕ, interfrange)',value:false},
      {type:'note',si:a=>a.p.calc,html:a=>(a.tab===4?`δ ≃ ${M.v('a')}(${M.v('x')}/${M.v('D')} + ${M.v('y','s')}/${M.v('d')}) · γ = sinc(π${M.v('a')}${M.v('B')} / λ₀${M.v('d')})`:`δ ≃ ${M.frac(M.v('a')+M.v('x'),M.v('D'))}`)+`<br>Δ${M.v('ϕ','2/1')} = −2π ${M.frac('δ','λ₀')} · ${M.v('i')} = ${M.frac('λ₀'+M.v('D'),M.v('a'))}`}]}
  ],
  aide:{
    voit:'Le montage (en haut) et la figure d\'interférences sur l\'écran (en bas) : bande colorée et profil d\'intensité <i class="m">I</i>/<i class="m">I</i><sub>0</sub> en fonction de <i class="m">x</i>. Les deux trajets passant par T₁ (en haut, +<i class="m">a</i>/2) et T₂ (en bas, −<i class="m">a</i>/2) aboutissent au même point M, que l\'on déplace sur l\'écran. <i class="m">I</i><sub>0</sub> est l\'intensité d\'une contribution seule sur l\'axe (avant diffraction), pas l\'intensité émise par la source. La couleur suit λ₀ (indicative).',
    faire:'<ul><li>Régler λ₀, <i class="m">a</i>, <i class="m">D</i> ; glisser M sur l\'écran ou cliquer sur le profil. Molette ou « Zoom » pour changer la fenêtre visible.</li><li>« M sur une frange sombre » puis fermer T₁ ou T₂ : la lumière réapparaît (erreur fréquente : croire que fermer une fente assombrit).</li><li><b>Longueur d\'onde inconnue</b> + règle : placer A et B sur deux franges brillantes, régler N, lire <i class="m">i</i> mesuré et λ₀ déduite ; décocher pour vérifier.</li><li>Onglets : amplitudes inégales (minima non nuls), diffraction (largeur <i class="m">r</i>, enveloppe), cohérence temporelle (Δλ, lumière blanche), cohérence spatiale (largeur <i class="m">B</i> de la source).</li><li>Cocher « Vérifier mon calcul » après avoir calculé δ, Δϕ et l\'interfrange.</li></ul>',
    modele:'δ<sub>2/1</sub> = (ST₂) + (T₂M) − (ST₁) − (T₁M) ; en paraxial δ ≃ <i class="m">a</i>(<i class="m">x</i>/<i class="m">D</i> + <i class="m">y</i><sub>s</sub>/<i class="m">d</i>) ; « chemins exacts » : différences des distances euclidiennes évaluées sans soustraire des nombres voisins. Δϕ<sub>2/1</sub> = −2π δ<sub>2/1</sub>/λ₀, formule de Fresnel <i class="m">I</i> = <i class="m">I</i><sub>1</sub> + <i class="m">I</i><sub>2</sub> + 2√(<i class="m">I</i><sub>1</sub><i class="m">I</i><sub>2</sub>) cos Δϕ, <i class="m">i</i> = λ₀<i class="m">D</i>/<i class="m">a</i> (air, indice 1 ; deux contributions scalaires de même polarisation ; amplitudes imposées, divergence négligée). Diffraction : facteur sinc<sup>2</sup>[π<i class="m">r</i>(sin θ<sub>sortie</sub> − sin θ<sub>entrée</sub>)/λ₀] (Fraunhofer ; au-delà de |<i class="m">x</i>|/<i class="m">D</i> = 0.1 le calcul exact est activé). Cohérence temporelle : spectre gaussien de largeur Δλ à mi-hauteur (ou blanc 380–780 nm), intensités sommées après moyenne temporelle ; ordre de grandeur λ₀<sup>2</sup>/Δλ pour la longueur de cohérence. Cohérence spatiale : source uniforme de largeur <i class="m">B</i>, points mutuellement incohérents, facteur signé γ = sinc(π<i class="m">a</i><i class="m">B</i>/λ₀<i class="m">d</i>) (annulations et reprises), premier brouillage pour <i class="m">B</i> = λ₀<i class="m">d</i>/<i class="m">a</i> ; la sélection d\'un point retire cette moyenne. L\'affichage moyenne localement l\'intensité sur un élément de résolution : les franges plus fines sont remplacées par leur moyenne (zoomer pour les résoudre). Couleurs RGB indicatives, sans étalonnage colorimétrique. Échelles du montage distinctes, fronts d\'onde très agrandis et ralentis.',
    cours:'OS8 : expérience des fentes d\'Young (<i class="m">r</i> = 5.0 µm, <i class="m">a</i> = 50 µm, λ₀ = 633 nm, <i class="m">d</i> = 1.0 m), différence de marche, formule de Fresnel, interfrange <i class="m">i</i> = λ₀<i class="m">D</i>/<i class="m">a</i> = 1.266 cm, enveloppe de diffraction.',
    credits:'Inspiration : PhET « Interférence des ondes » (aucun code PhET).'
  },
  init(a){
    const mg=()=>st.mg,gg=()=>st.gg;
    a.drag('montage',{hit:(x,y)=>a.tab===4&&mg()&&Math.abs(x-mg().sx)<28*a.k&&Math.abs(y-mg().sy)<80*a.k,
      move:(x,y)=>{const g=mg();a.set('ys',U.clamp(+((g.cy-y)/g.srcScale).toFixed(1),-20,20))}});
    a.drag('montage',{start:(x,y)=>{const g=mg();if(g)a.set('x',+(g.wx(y)*1000).toFixed(3))},move:(x,y)=>{const g=mg();if(g)a.set('x',+U.clamp(g.wx(y)*1000,-a.p.span,a.p.span).toFixed(3))}});
    for(const w of['m1','m2'])a.drag('profil',{hit:(x)=>a.p.ruler&&gg()&&Math.abs(x-gg().X(st[w]*1000))<16*a.k,move:(x)=>{st[w]=U.clamp(gg().xv(x),-a.p.span,a.p.span)/1000}});
    a.drag('profil',{hit:(x,y)=>gg()&&x>gg().x0&&x<gg().x0+gg().w,start:(x)=>{a.set('x',+U.clamp(gg().xv(x),-a.p.span,a.p.span).toFixed(3))},move:(x)=>{a.set('x',+U.clamp(gg().xv(x),-a.p.span,a.p.span).toFixed(3))}});
    if(a.panels.profil.node.addEventListener)a.panels.profil.node.addEventListener('wheel',e=>{if(a.narrow)return;e.preventDefault();a.set('span',U.clamp(a.p.span*Math.exp(e.deltaY*.0015),.5,maxSpan(a)))},{passive:false});
  },
  change(a,id){
    if(id==='width'&&a.p.width>.9*a.p.a)a.p.a=Math.min(400,Math.ceil(a.p.width/.9));
    if(id==='a'&&a.p.width>.9*a.p.a)a.p.width=+(.9*a.p.a).toFixed(1);
    if(id==='D'||id==='span'||id==='x'){a.p.span=U.clamp(a.p.span,.5,maxSpan(a));if(a.tab===2&&a.p.span/1000/a.p.D>.1)a.p.exact=true}
    if(id==='D'||id==='span')a.p.x=U.clamp(a.p.x,-maxSpan(a),maxSpan(a));
    if(id==='lamInc'&&a.p.lamInc){a.p.ruler=true}
  },
  onglet(a,i){
    a.p.exact=false;a.p.ys=0;a.p.slit1=a.p.slit2=true;
    if(i===1)a.p.ratio=.35;if(i===3)a.p.bw=60;if(i===4)a.p.B=8;
    a.p.span=U.clamp(a.p.span,.5,maxSpan(a));a.p.x=U.clamp(a.p.x,-maxSpan(a),maxSpan(a));
  },
  reset(a){a.t=0},
  step(a,dt){a.t=(a.t+dt*.4)%1},
  draw(a){
    const p=a.p,C=a.C,k=a.k,S=a.S,Pm=a.panels.montage,Pp=a.panels.profil,s=Sx(a),span=s.span;
    const sp=spec(a),N=U.clamp(Math.ceil(Pp.w),500,1500),pr=profile(a,N);
    const light=!C.dark;
    /* ================= montage ================= */
    const w=Pm.w,h=Pm.h,left=36*k,right=w-62*k,screenX=right,cy=h/2+2*k,top=26*k,bottom=h-38*k;
    const sy=U.clamp(left+(right-left)*p.dS/(p.dS+p.D),w*.26,w*.58),gap=U.clamp((34+Math.sqrt(p.a/50)*15)*k,38*k,h*.25);
    const sY=y=>cy-y/span*(bottom-top)/2;
    const beam=sp.white&&light?'#8e98a7':U.css(sp.beam);
    const srcScale=Math.min(45*k,h*.16)/20,srcCY=cy-p.ys*srcScale,srcHalf=a.tab===4?p.B/40*Math.min(45*k,h*.15):0;
    const srcY=srcCY-(a.tab===4&&p.pick!=='all'?Number(p.pick)*srcHalf:0);
    const T=[{x:sy,y:cy-gap/2,on:p.slit1},{x:sy,y:cy+gap/2,on:p.slit2}],Mx=screenX,My=sY(p.x/1000);
    st.mg={sx:left,sy:srcY,cy,srcScale,wx:y=>(cy-y)/((bottom-top)/2)*span};
    let g=S.text(left-24*k,13*k,'Schéma : échelles distinctes, ondes agrandies',{size:12,c:C.ink2});
    g+=S.line(left-14*k,cy,screenX+34*k,cy,{c:C.grid,w:1,dash:'5 5'});
    const al=a.tab===3&&p.spectrum==='white'?.06:.07;
    T.forEach((o,j)=>{if(!o.on)return;
      g+=S.poly([[left,srcY],[o.x,o.y-7*k],[o.x,o.y+7*k]],{close:true,fill:beam,c:'none',w:0,op:al});
      g+=S.poly([[o.x,o.y],[screenX,top],[screenX,bottom]],{close:true,fill:beam,c:'none',w:0,op:al})});
    if(p.waves){const sp0=24*k*p.lambda/633;g+=`<defs><clipPath id="cw"><rect x="${(sy+2).toFixed(1)}" y="${top.toFixed(1)}" width="${(screenX-sy-3).toFixed(1)}" height="${(bottom-top).toFixed(1)}"/></clipPath></defs><g clip-path="url(#cw)">`;
      T.forEach(o=>{if(!o.on)return;for(let r=(a.t%1)*sp0;r<screenX-sy+h;r+=sp0)g+=S.path(`M${o.x.toFixed(1)},${(o.y-r).toFixed(1)}A${r.toFixed(1)},${r.toFixed(1)} 0 0 1 ${o.x.toFixed(1)},${(o.y+r).toFixed(1)}`,{c:beam,w:1.2,op:.28})});g+='</g>'}
    g+=S.line(sy,top+8*k,sy,cy-gap/2-6*k,{c:C.ink,w:4})+S.line(sy,cy-gap/2+6*k,sy,cy+gap/2-6*k,{c:C.ink,w:4})+S.line(sy,cy+gap/2+6*k,sy,bottom-8*k,{c:C.ink,w:4});
    const cl=[C.v,C.E];
    T.forEach((o,j)=>{g+=S.line(o.x,o.y-6*k,o.x,o.y+6*k,{c:o.on?beam:C.ink,w:o.on?3:5});
      if(o.on)g+=S.line(left,srcY,o.x,o.y,{c:cl[j],w:1.5,dash:j?'6 4':null})+S.line(o.x,o.y,Mx,My,{c:cl[j],w:1.7,dash:j?'6 4':null});
      g+=S.text(o.x-13*k,o.y+(j?16:-16)*k,j?'T₂':'T₁',{anchor:'end',size:15,c:C.ink,weight:600})});
    if(a.tab===4&&srcHalf>0){g+=S.line(left,srcCY-srcHalf,left,srcCY+srcHalf,{c:beam,w:5});
      for(let j=0;j<9;j++){const y=srcCY-srcHalf+2*srcHalf*j/8,sel=p.pick==='all'||Math.abs(Number(p.pick)-(1-j/4))<.01;g+=S.circle(left,y,(sel?4:2)*k,{fill:sel?beam:C.ink2})}
      g+=S.text(left-13*k,srcY,'B',{anchor:'end',size:15,c:C.ink,weight:600})}
    else g+=S.circle(left,srcY,6*k,{fill:beam,c:C.ink,w:1.5});
    g+=S.text(left+15*k,Math.max(top+12*k,srcY-srcHalf-17*k),'S',{size:15,c:C.ink,weight:600});
    const sw=22*k+(a.narrow?0:12*k);
    g+=`<image href="${pr.v}" x="${screenX.toFixed(1)}" y="${top.toFixed(1)}" width="${sw.toFixed(1)}" height="${(bottom-top).toFixed(1)}" preserveAspectRatio="none"/>`+`<rect x="${screenX.toFixed(1)}" y="${top.toFixed(1)}" width="${sw.toFixed(1)}" height="${(bottom-top).toFixed(1)}" fill="none" stroke="${C.grid}" stroke-width="1"/>`;
    g+=S.arrow(screenX+sw+8*k,bottom,screenX+sw+8*k,top,{c:C.ink2,w:1.5})+S.text(screenX+sw+8*k,top-10*k,'x',{anchor:'middle',size:15,c:C.ink})+S.text(screenX+sw+20*k,cy,'O',{anchor:'middle',size:14,c:C.ink2});
    if(My>=top&&My<=bottom)g+=S.circle(Mx,My,6*k,{fill:C.card,c:C.F,w:2})+S.text(Mx-12*k,My-13*k,'M',{anchor:'end',size:15,c:C.F,weight:700});
    else g+=S.text(w/2,top+20*k,'M hors champ',{anchor:'middle',size:14,c:C.F});
    const dim=(x1,y1,x2,y2,lab)=>S.line(x1,y1,x2,y2,{c:C.ink2,w:1})+S.line(x1,y1-5*k,x1,y1+5*k,{c:C.ink2,w:1})+S.line(x2,y2-5*k,x2,y2+5*k,{c:C.ink2,w:1})+S.text((x1+x2)/2,(y1+y2)/2-9*k,lab,{anchor:'middle',size:13,c:C.ink});
    g+=dim(left,h-16*k,sy,h-16*k,'d = '+a.fmt.sig(p.dS,3)+' m')+dim(sy,h-16*k,screenX,h-16*k,'D = '+a.fmt.sig(p.D,3)+' m');
    if(!a.narrow)g+=S.line(sy+20*k,T[0].y,sy+20*k,T[1].y,{c:C.ink2,w:1})+S.text(sy+27*k,cy,'a',{size:14,c:C.ink});
    g+=S.text(screenX-7*k,top+1*k,'+'+a.fmt.sig(p.span,3)+' mm',{anchor:'end',size:12,c:C.ink2})+S.text(screenX-7*k,bottom-1*k,'−'+a.fmt.sig(p.span,3)+' mm',{anchor:'end',size:12,c:C.ink2});
    const qM=PM.intensity(s,s.x,sp.sp),Iboth=PM.intensity({...s,slit1:true,slit2:true},s.x,sp.sp).I;
    const msgs=[];
    if(!p.slit1&&!p.slit2)msgs.push(['Les deux fentes sont fermées : aucune lumière sur l\'écran',C.F]);
    else if(!p.slit1||!p.slit2){msgs.push(['Une fente fermée : plus d\'interférences, seulement la diffraction de l\'autre',C.ink2]);if(qM.I>Iboth*1.05+1e-9)msgs.push(['Fermer une fente a fait réapparaître de la lumière en M',C.F])}
    if(2*span/N/ifr(a)>.5)msgs.push(['Franges non résolues à cette échelle : intensité moyenne affichée, zoomer',C.F]);
    msgs.forEach((m,j)=>{g+=S.text(left+6*k,top+16*k+j*18*k,m[0],{size:13,c:m[1],weight:600})});
    a.svg('montage',g);
    /* ================= profil ================= */
    const ymax=a.tab===2&&p.lobes?baseMax(a)/10:baseMax(a),X0=-p.span,X1=p.span;
    const G=S.graph({x:0,y:0,w:Pp.w,h:Pp.h,xmin:X0,xmax:X1,ymin:0,ymax,xlab:'x (mm)',ylab:'I / I₀',padT:46*k,padB:p.ruler?64*k:undefined});
    st.gg=G;
    let b=G.svg+S.clip('cp',G);
    b+=`<image href="${pr.h}" x="${G.x0.toFixed(1)}" y="${(G.y0-42*k).toFixed(1)}" width="${G.w.toFixed(1)}" height="${(22*k).toFixed(1)}" preserveAspectRatio="none"/>`+`<rect x="${G.x0.toFixed(1)}" y="${(G.y0-42*k).toFixed(1)}" width="${G.w.toFixed(1)}" height="${(22*k).toFixed(1)}" fill="none" stroke="${C.grid}" stroke-width="1"/>`;
    const xs=[];for(let j=0;j<=400;j++)xs.push(X0+(X1-X0)*j/400);
    if(a.tab===2&&p.env)b+=S.curve(xs.map(x=>[x,PM.atLambda(s,x/1000,s.lambda).envelope*baseMax(a)]),G,{c:C.pred,w:1.8,dash:'7 5'});
    if(a.tab===3&&p.dect){const nms=p.spectrum==='white'?[440,550,650]:[s.lambda-p.bw/2,s.lambda,s.lambda+p.bw/2].map(n=>U.clamp(n,380,780));nms.forEach(nm=>{b+=S.curve(xs.map(x=>[x,PM.atLambda(s,x/1000,nm).I]),G,{c:U.css(U.waveRGB(nm)),w:1.3,dash:'4 4'})})}
    if(a.tab===4&&p.decs)[-1,0,1].forEach((v,j)=>{b+=S.curve(xs.map(x=>[x,PM.atLambda(s,x/1000,s.lambda,(p.ys+v*p.B/2)*1e-3).I]),G,{c:[C.v,C.ink2,C.E][j],w:1.4,dash:'4 4'})});
    b+=S.curve(pr.rows.map(r=>[r.x*1000,r.I]),G,{c:C.cInk,w:2.8});
    b+=S.line(G.X(p.x),G.y0-42*k,G.X(p.x),G.y0+G.h,{c:C.F,w:1.4,dash:'5 4'})+S.circle(G.X(p.x),G.Y(qM.I),5*k,{fill:C.card,c:C.F,w:2});
    if(p.ruler){const yy=G.y0+G.h+44*k;
      [[st.m1,'A'],[st.m2,'B']].forEach(([x,l])=>{b+=S.line(G.X(x*1000),G.y0,G.X(x*1000),yy,{c:C.E,w:1.2,dash:'4 4'})+S.circle(G.X(x*1000),yy,5*k,{fill:C.E})+S.text(G.X(x*1000),yy-13*k,l,{anchor:'middle',size:14,c:C.E,weight:700})});
      const xa=G.X(st.m1*1000),xb=G.X(st.m2*1000);b+=S.line(xa,yy,xb,yy,{c:C.E,w:1.2})+S.text((xa+xb)/2,yy+12*k,'Δx = '+a.fmt.fix(Math.abs(st.m2-st.m1)*1000,2)+' mm',{anchor:'middle',size:13,c:C.ink})}
    if(a.tab===2&&p.lobes)b+=S.text(G.x0+G.w-6*k,G.y0+12*k,'centre tronqué',{anchor:'end',size:13,c:C.ink2});
    a.svg('profil',b);
    a.legend([{label:'Intensité',c:C.cInk},{label:'Point M',c:C.F,dash:true},{label:'Trajet par T₁',c:C.v},{label:'Trajet par T₂',c:C.E,dash:true},a.tab===2&&p.env?{label:'Enveloppe (prévision)',c:C.pred,dash:true}:null,p.ruler?{label:'Repères A, B',c:C.E,dash:true}:null].filter(Boolean));
    a.clock(`<span class="m">t</span>/<span class="m">T</span> = ${a.fmt.fix(a.t,2)}`);
    /* ================= mesures ================= */
    const mets=[{label:'Intensité I / I₀ en M',value:a.fmt.sig(qM.I,3)}];
    if(a.tab>=3)mets.push({label:'Enveloppe du contraste en M',value:a.fmt.fix(qM.visibility*100,1),unit:'%',hint:a.tab===3?'visibilité locale, pas une mesure sur deux extrema':'|γ| = |sinc(π a B / λ₀ d)| pour deux fentes égales'});
    if(p.ruler){const dx=Math.abs(st.m2-st.m1),im=dx/p.N;mets.push({label:'Interfrange mesuré Δx / N',value:a.fmt.sig(im*1000,3),unit:'mm'},{label:'λ₀ déduite  a · i / D',value:a.fmt.sig(p.a*1e-6*im/p.D*1e9,3),unit:'nm',hint:p.lamInc?'à comparer en décochant « inconnue »':''})}
    if(p.calc){
      const ys=(p.ys+(a.tab===4&&p.pick!=='all'?Number(p.pick)*p.B/2:0))*1e-3,ap=p.a*1e-6*(s.x/p.D+ys/p.dS);
      mets.push({label:'Différence de marche δ₂/₁',value:a.fmt.sig(qM.delta*1e6,3),unit:'µm',hint:'paraxiale '+a.fmt.sig(ap*1e6,5)+' µm'},
        {label:'Déphasage Δϕ₂/₁ à λ₀',value:a.fmt.sig(qM.phase/Math.PI,3),unit:'π rad'},
        {label:a.tab===3?'Interfrange de référence à λ₀':'Interfrange i (paraxial)',value:a.fmt.sig(ifr(a)*1000,3),unit:'mm',hint:a.tab===3?(p.spectrum==='white'?'spectre blanc 380–780 nm':p.bw===0?'monochromatique':'longueur de cohérence ≈ λ₀²/Δλ = '+a.fmt.sig(p.lambda*p.lambda/p.bw/1000,2)+' µm'):''});
      if(a.tab===4)mets.push({label:'Premier brouillage : B = λ₀d / a',value:a.fmt.sig(p.lambda*1e-9*p.dS/(p.a*1e-6)*1000,3),unit:'mm'});
    }
    a.metrics(mets);
  }
});

</script>
