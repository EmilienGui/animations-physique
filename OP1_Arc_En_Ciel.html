  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){

        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

/* OP1 · Arc-en-ciel : moteur physique d'origine (24 octobre 2026), repris sans modification.

/* Moteur autonome ; angles internes en radians, R = 1. */
window.RainbowModel = (() => {
 'use strict';
 const pi=Math.PI,deg=180/pi;
 const dot=(a,b)=>a.reduce((s,v,j)=>s+v*b[j],0), add=(a,b)=>a.map((v,j)=>v+b[j]), mul=(a,k)=>a.map(v=>v*k);
 function solve(n,x){
  if(!Number.isFinite(n)||n<1.3||n>1.4||!Number.isFinite(x)||x<0||x>=1)throw new RangeError('Indice ou impact hors du domaine.');
  const i=Math.asin(x),r=Math.asin(x/n),D=pi+2*i-4*r,A=[-Math.sqrt(1-x*x),x],u=[Math.cos(r-i),Math.sin(r-i)];
  const B=add(A,mul(u,2*Math.cos(r))),v=add(u,mul(B,-2*dot(u,B))),C=add(B,mul(v,2*Math.cos(r))),out=[Math.cos(-D),Math.sin(-D)];
  const reflectA=add([1,0],mul(A,2*Math.sqrt(1-x*x)));
  const transmitB=add(mul(u,n),mul(B,Math.cos(i)-n*Math.cos(r)));
  const reflectC=add(v,mul(C,-2*dot(v,C)));
  const ci=Math.cos(i),cr=Math.cos(r),Rs=((ci-n*cr)/(ci+n*cr))**2,Rp=((n*ci-cr)/(n*ci+cr))**2;
  return {n,x,i,r,D,theta:pi-D,A,B,C,u,v,out,reflectA,transmitB,reflectC,Rs,Rp,power:((1-Rs)**2*Rs+(1-Rp)**2*Rp)/2};
 }
 function minimum(n){const x=Math.sqrt((4-n*n)/3);return solve(n,x);}
 function derivative(n,x){return 2/Math.sqrt(1-x*x)-4/Math.sqrt(n*n-x*x);}
 function section(n,x){const m=solve(n,x),d=derivative(n,x);if(Math.abs(d)<1e-12)return Infinity;if(x===0)return 1/(2-4/n)**2;return Math.abs(x/(Math.sin(m.D)*d));}
 function histogram(n,N=24000,width=.5){
  const count=Math.ceil(50/width),bins=Array.from({length:count},(_,j)=>({lo:j*width,hi:(j+1)*width,power:0,density:0}));
  let total=0;for(let j=0;j<N;j++){const m=solve(n,Math.sqrt((j+.5)/N)),b=bins[Math.min(count-1,Math.floor(m.theta*deg/width))];b.power+=m.power/N;total+=m.power/N;}
  for(const b of bins)b.density=b.power/(2*pi*(Math.cos(b.lo/deg)-Math.cos(b.hi/deg)));
  return {bins,total,width,N};
 }
 // Loi illustrative ajustée aux deux indices du DM, avec les repères du cours.
 const cauchyB=(1.337-1.331)/(1/440**2-1/650**2),cauchyA=1.331-cauchyB/650**2;
 function spectrumIndex(lambda){if(!Number.isFinite(lambda)||lambda<400||lambda>700)throw new RangeError('Longueur d’onde hors du spectre représenté.');return cauchyA+cauchyB/lambda**2;}
 function spectrum(){return Array.from({length:31},(_,j)=>{const lambda=400+j*10,n=spectrumIndex(lambda);return {lambda,n,theta:minimum(n).theta};});}
 function direction(h,theta,phi){return [Math.cos(theta)*Math.cos(h)+Math.sin(theta)*Math.cos(phi)*Math.sin(h),Math.sin(theta)*Math.sin(phi),-Math.cos(theta)*Math.sin(h)+Math.sin(theta)*Math.cos(phi)*Math.cos(h)];}
 function sky(h,v){const a=[Math.cos(h),0,-Math.sin(h)],up=[Math.sin(h),0,Math.cos(h)],c=Math.max(-1,Math.min(1,dot(a,v))),q=Math.acos(c),s=Math.sin(q);return s<1e-10?[0,0]:[q*v[1]/s,q*dot(v,up)/s];}

})();

'use strict';

   Physique : RainbowModel (OP1_Arc_En_Ciel_physique.js, moteur d'origine inchangé).
   Conventions du DM4 : angles géométriques positifs ; x = b/R, i = arcsin x, sin i = n sin r,
   D = (i − r) + (π − 2r) + (i − r) = π + 2i − 4r, θ = π − D (angle avec la direction antisolaire).

const RM=window.RainbowModel, M=AnimKit.M, DEG=Math.PI/180, R2D=180/Math.PI;

const nR=a=>a.p.dispersion?NR:4/3, nB=a=>a.p.dispersion?NB:4/3;
/* indices du dessin : écart rouge–bleu éventuellement exagéré autour de leur moyenne (les mesures restent celles du DM) */
const NM=(NR+NB)/2, nRd=a=>a.p.dispersion?NM-(NM-NR)*a.p.exag:4/3, nBd=a=>a.p.dispersion?NM+(NB-NM)*a.p.exag:4/3;
function couleurs(a,dessin=true){const r=dessin?nRd(a):nR(a),b=dessin?nBd(a):nB(a),twoMin=a.p.minima;return[RM.solve(r,twoMin?RM.minimum(r).x:a.p.x),RM.solve(b,twoMin?RM.minimum(b).x:a.p.x)]}
const ETAPES=['arrivée en A','réfraction en A','réflexion en B','sortie en C'];
const clampX=v=>Math.max(0,Math.min(XMAX,v));

const A=AnimKit.app({

  onglets:['Un rayon','La caustique','Les couleurs','L\'observateur'],

  panneaux:[

    {id:'graphe',titre:'Déviation',poids:2,onglets:[1,2],ratioTel:.85},

      {label:'Axial',valeurs:{x:0,minima:false},action:()=>{st.phase=3},onglets:[0,1,2]},

      {label:'Presque rasant',valeurs:{x:XMAX,minima:false},action:()=>{st.phase=3},onglets:[0,1,2]},
      {label:'Soleil à l\'horizon',valeurs:{h:0},onglets:[3]},

      {id:'x',label:`Impact ${M.v('x')} = ${M.frac(M.v('b'),M.v('R'))}`,min:0,max:XMAX,step:0.001,value:.65,dec:3,si:a=>!(a.tab===2&&a.p.minima)},
      {id:'dispersion',type:'check',label:'Dispersion de l\'eau',value:true,onglets:[2]},

      {id:'exag',type:'seg',label:'Écart rouge–bleu dans le dessin',options:[[1,'réel'],[5,'× 5'],[10,'× 10']],value:10,onglets:[2],si:a=>a.p.dispersion},
      {type:'note',onglets:[2],si:a=>a.p.minima,html:a=>`${M.v('x','R')} = ${a.fmt.fix(RM.minimum(nR(a)).x,4)} · ${M.v('x','B')} = ${a.fmt.fix(RM.minimum(nB(a)).x,4)}`}]},

      {id:'phi',label:'Tour du cône',min:0,max:360,step:1,value:0,unit:'°'},

      {type:'boutons',items:[{label:'Vue initiale',titre:'Rétablit l\'orientation de la caméra',action:a=>{st.yaw=CAM0.yaw;st.pitch=CAM0.pitch;a.panels.obs.zoom=1}}]}]},
    {titre:'Affichage',items:[
      {id:'normales',type:'check',label:'Normales',value:true,onglets:[0]},

      {id:'branches',type:'check',label:'Autres branches (réflexions et transmissions partielles)',value:false,onglets:[0]},

      {id:'detail',type:'check',label:'Agrandir autour des minima',value:false,onglets:[2]},

    {titre:'Résultats',si:a=>a.p.res,items:[{type:'note',html:resultats}]}
  ],
  aide:{
    voit:'Une goutte d\'eau sphérique de rayon <i class="m">R</i> éclairée par des rayons solaires parallèles. On suit la lumière qui entre en A, se réfléchit partiellement en B et ressort en C : c\'est elle qui forme l\'arc primaire. Quatre étapes : un rayon, le faisceau et sa déviation minimale, la dispersion (rouge et bleu du DM), puis les directions d\'observation autour du point antisolaire.',
    faire:'<ul><li>Glisser le rayon incident (poignée à gauche) ou le point de la courbe pour régler <i class="m">x</i> = <i class="m">b</i>/<i class="m">R</i>.</li><li>Un rayon : « Pas » (ou <kbd>→</kbd>) construit le trajet étape par étape (A, puis B, puis C) ; la lecture enchaîne les étapes ; « Recommencer » revient au début.</li><li>Caustique et couleurs : la lecture balaie l\'impact de l\'axe au rayon rasant, aller et retour ; « Au minimum » place le rayon de déviation minimale.</li><li>Observateur : glisser pour faire tourner la perspective ; dans le ciel, glisser autour du point antisolaire ; la lecture fait tourner le plan du trajet.</li><li>Cocher « Résultats et formules » après avoir fait prévoir.</li><li>Couleurs : l\'écart entre les indices rouge et bleu est exagéré dans le dessin (× 10 par défaut, réglable) ; les mesures restent celles du DM.</li></ul>',
    modele:'Goutte sphérique, eau homogène, isotrope et transparente, air d\'indice 1, rayons solaires parallèles (taille apparente du Soleil négligée). Une seule branche suivie : deux réfractions et une réflexion interne <b>partielle</b> (en B, <i class="m">r</i> &lt; arcsin(1/<i class="m">n</i>)). Les épaisseurs de trait ne codent pas la puissance. La répartition angulaire est intégrée par classes de 0.5° : éclairage uniforme de la section (24 000 surfaces d\'entrée égales), lumière non polarisée, coefficients de Fresnel aux trois interfaces ; elle reste finie à cause de la largeur des classes alors que le modèle ponctuel diverge à la caustique. Spectre continu : loi de Cauchy <i class="m">n</i> = <i class="m">A</i> + <i class="m">B</i>/λ<sub>0</sub><sup>2</sup> illustrative, ajustée à <i class="m">n</i>(440 nm) = 1.337 et <i class="m">n</i>(650 nm) = 1.331 ; teintes conventionnelles. Carte du ciel : projection azimutale équidistante centrée sur le point antisolaire. Diffraction, interférences et arc secondaire ne sont pas modélisés.',
    cours:'OP1 Propagation de la lumière : lois de Snell-Descartes, réflexion partielle et totale, dispersion (loi de Cauchy, repères 440 nm et 650 nm), et DM4 « Les couleurs de l\'arc-en-ciel ». Angles géométriques positifs, comme dans le DM (et non les angles algébriques de l\'animation Snell-Descartes) : <i class="m">D</i> = π + 2<i class="m">i</i> − 4<i class="m">r</i>, minimum pour cos² <i class="m">i</i> = (<i class="m">n</i><sup>2</sup> − 1)/3, θ<sub>0</sub> = π − <i class="m">D</i><sub>0</sub> ≈ 42°.',
    touches:'onglet 1 : <kbd>→</kbd> ou « Pas » construit le trajet étape par étape, <kbd>R</kbd> le recommence'
  },
  change(a,id,v){
    if(id==='mat'&&v!=='perso')a.set('n',v,{silent:true});

  /* « Recommencer » (bouton ou R) : retour à l'état de départ de l'onglet ; les situations toutes prêtes appellent aussi reset, sans ce retour */
  reset(a){st.acc=0;if(a.tab===0)st.phase=0;

      if(a.tab===1||a.tab===2){a.set('minima',false,{silent:true});a.set('x',.65,{silent:true})}

});

/* ===================== textes ===================== */
function resultats(a){

/* ===================== outils de dessin ===================== */
function midArrow(S,p,q,c,w,k,t=.5){const mx=p[0]+(q[0]-p[0])*t,my=p[1]+(q[1]-p[1])*t,an=Math.atan2(q[1]-p[1],q[0]-p[0]),hl=(7+w*1.6)*k;
  if(Math.hypot(q[0]-p[0],q[1]-p[1])<hl*1.5)return'';
  return S.path(`M${mx+hl*.5*Math.cos(an)},${my+hl*.5*Math.sin(an)}L${mx-hl*.5*Math.cos(an)-hl*.45*Math.sin(an)},${my-hl*.5*Math.sin(an)+hl*.45*Math.cos(an)}L${mx-hl*.5*Math.cos(an)+hl*.45*Math.sin(an)},${my-hl*.5*Math.sin(an)-hl*.45*Math.cos(an)}Z`,{c:'none',fill:c})}

/** fraction empilée dans un texte SVG ; (x, y) = début, milieu de la barre */
function fracS(S,k,x,y,num,den,o={}){const size=o.size??14, fs=size*k, w=(o.len??1)*.62*fs+5*k, c=o.c;
  return S.text(x+w/2,y-.62*fs,num,{anchor:'middle',size,c,halo:o.halo})+S.line(x,y,x+w,y,{c:c||A.C.ink2,w:1})+S.text(x+w/2,y+.66*fs,den,{anchor:'middle',size,c,halo:o.halo})}
function eauOp(n){return .06+.22*(n-1.3)/.1}
/** distance du point (x, y) au bord du cadre dans la direction (dx, dy) écran */
function bord(x,y,dx,dy,W,H,mg){return Math.min(dx>1e-9?(W-mg-x)/dx:dx<-1e-9?(x-mg)/-dx:1e9,dy>1e-9?(H-mg-y)/dy:dy<-1e-9?(y-mg)/-dy:1e9)}

function angles(a,q,Pm,sc,count){
  const S=a.S,C=a.C,k=a.k,c=C.cInk; let s='';
  const lab=(o,r,t,txt)=>S.text(o[0]+r*Math.cos(t),o[1]-r*Math.sin(t),txt,{anchor:'middle',size:16,c});

/* ---------- décomposition D = D1 + D2 + D3 ---------- */
function decomposition(a){
  const P=a.panels.decomp,S=a.S,C=a.C,k=a.k,W=P.w,H=P.h,m=RM.solve(a.p.n,a.p.x),f=a.fmt;

    s+=S.rect(eauD?c[0]:c[0]-R*1.25,c[1]-R*1.05,R*1.25,R*2.1,{fill:C.c,fop:eauOp(a.p.n)});
    s+=S.line(c[0],c[1]-R*1.05,c[0],c[1]+R*1.05,{c:C.c,w:1.6});
    s+=S.line(c[0]-R*1.15,c[1],c[0]+R*1.15,c[1],{c:C.ink2,w:1,dash:`${4*k} ${4*k}`});
    let p0,p1;
    if(j===1){p0=[c[0]-R*Math.cos(m.r),c[1]-R*Math.sin(m.r)];p1=[c[0]-R*Math.cos(m.r),c[1]+R*Math.sin(m.r)]}
    else{const ia=j===0?m.i:m.r,ra=j===0?m.r:m.i;p0=[c[0]-R*Math.cos(ia),c[1]+R*Math.sin(ia)];p1=[c[0]+R*Math.cos(ra),c[1]-R*Math.sin(ra)]}
    s+=ray(S,k,p0,c,C.E,2.4)+ray(S,k,c,p1,C.E,2.4);
    // prolongement du rayon incident et angle de déviation
    const u=[c[0]-p0[0],c[1]-p0[1]],L=Math.hypot(...u),pe=[c[0]+u[0]/L*R*.95,c[1]+u[1]/L*R*.95];
    s+=S.line(c[0],c[1],pe[0],pe[1],{c:C.ink2,w:1,dash:`${3*k} ${4*k}`});
    const t1=Math.atan2(-(u[1]),u[0]),t2=Math.atan2(-(p1[1]-c[1]),p1[0]-c[0]);let d=t2-t1;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
    s+=S.arc(c[0],c[1],R*.55,t1,t1+d,{c:C.cInk,w:1.6,arrow:true});
    s+=S.text(W-8*k,c[1]-.75*14*k,form,{anchor:'end',size:15,c:C.cInk});
    s+=S.text(W-8*k,c[1]+.85*14*k,f.fix(ang*R2D,1)+'°',{anchor:'end',size:16,c:C.ink,weight:600});
  });
  a.svg('decomp',s);

  if(!histCache||histCache.n!==a.p.n)histCache={n:a.p.n,...RM.histogram(a.p.n)};
  const peak=Math.max(...histCache.bins.map(b=>b.density)), top=peak*1.12;
  const G=S.graph({x:0,y:0,w:W,h:H,xmin:0,xmax:50,ymin:0,ymax:top,padB:42*k,padL:52*k,padT:26*k,ylab:'puissance par stéradian (relative)',xfmt:v=>f.fix(v,0)+'°',yfmt:(v,s)=>f.fix(v,s<.01?3:2)});
  geo.graphe=null; let s=G.svg;
  for(const b of histCache.bins)if(b.density>0)s+=S.rect(G.X(b.lo),G.Y(b.density),Math.max(.5,G.X(b.hi)-G.X(b.lo)-.6),G.y0+G.h-G.Y(b.density),{fill:C.E,fop:.75});
  const th=RM.solve(a.p.n,a.p.x).theta*R2D;s+=S.line(G.X(th),G.y0,G.X(th),G.y0+G.h,{c:C.cInk,w:2,dash:`${5*k} ${4*k}`})+S.text(G.X(th)+5*k,G.y0+10*k,'rayon sélectionné',{size:13,c:C.cInk,base:'top',anchor:G.X(th)>G.x0+G.w*.7?'end':'start'});
  s+=S.text(G.x0+G.w,G.y0+G.h+30*k,`θ = 180° − ${S.v('D')}`,{anchor:'end',size:14});
  a.svg('graphe',s);
}

/* ===================== l'observateur ===================== */
function couleurSpectre(a,l){
  const keys=[400,440,490,530,580,610,650,700];
  const cols=a.C.dark?[[184,135,255],[133,165,255],[78,210,230],[115,212,120],[255,224,103],[255,171,88],[255,135,145],[241,113,126]]:[[123,57,190],[45,85,211],[0,150,174],[37,151,67],[207,170,0],[229,119,20],[198,43,52],[167,28,42]];
  let j=0;while(j<keys.length-2&&l>keys[j+1])j++;const t=(l-keys[j])/(keys[j+1]-keys[j]);
  return'rgb('+cols[j].map((v,i)=>Math.round(v+(cols[j+1][i]-v)*t)).join(',')+')';
}
function bande(inner,outer,proj,h,clip){
  if(clip&&h>=outer)return'';
  const al=clip?Math.acos(Math.max(-1,Math.min(1,Math.tan(h)/Math.tan(outer)))):Math.PI,up=[],lo=[];
  for(let j=0;j<=120;j++){const phi=-al+2*al*j/120,edge=clip?Math.max(inner,Math.atan2(Math.sin(h),Math.cos(h)*Math.cos(phi))):inner;up.push(proj(outer,phi));lo.push(proj(Math.min(edge,outer),phi))}
  return'M'+up.concat(lo.reverse()).map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L')+'Z';
}
function anneau(a,proj,h,ghost){let s='';for(let j=0;j<SPEC.length-1;j++){const u=SPEC[j],v=SPEC[j+1],d=bande(u.theta,v.theta,proj,h,a.p.horizon&&!ghost);if(d)s+=`<path d="${d}" fill="${couleurSpectre(a,(u.lambda+v.lambda)/2)}"${ghost?' opacity=".14"':''}/>`}return s}
function cone(a){
  const P=a.panels.obs,S=a.S,C=a.C,k=a.k,W=P.w,H=P.h,h=a.p.h*DEG,phi=a.p.phi*DEG,thR=RM.minimum(NR).theta,thB=RM.minimum(NB).theta;
  const cyw=Math.cos(st.yaw),syw=Math.sin(st.yaw),cp=Math.cos(st.pitch),sp=Math.sin(st.pitch);
  const raw=p=>{const u=p[0]*cyw-p[1]*syw,v=p[0]*syw+p[1]*cyw;return[u,-(p[2]*cp-v*sp)]};
  const add=(p,q,t=1)=>p.map((v,i)=>v+q[i]*t), mul=(p,t)=>p.map(v=>v*t);
  const outer=a.p.spectre?SPEC.at(-1).theta:thR, axis=RM.direction(h,0,0), sun=mul(axis,-1.35);
  const B=[];for(let j=0;j<=72;j++)B.push(raw(mul(RM.direction(h,outer,j*5*DEG),2.5)));
  B.push(raw([0,0,0]),raw(mul(axis,3.1)),raw(sun));
  if(a.p.horizon)for(const p of[[-1.6,-1.7,0],[3.3,-1.7,0],[3.3,1.7,0],[-1.6,1.7,0]])B.push(raw(p));
  const xs=B.map(p=>p[0]),ys=B.map(p=>p[1]),lo=[Math.min(...xs),Math.min(...ys)],hi=[Math.max(...xs),Math.max(...ys)];
  const sc=Math.min((W-50*k)/(hi[0]-lo[0]),(H-56*k)/(hi[1]-lo[1]))*P.zoom;
  const Pp=p=>{const q=raw(p);return[W/2+sc*(q[0]-(lo[0]+hi[0])/2),H/2+8*k+sc*(q[1]-(lo[1]+hi[1])/2)]};
  let s='';
  if(a.p.horizon){s+=S.poly([[-1.6,-1.7,0],[3.3,-1.7,0],[3.3,1.7,0],[-1.6,1.7,0]].map(Pp),{close:true,fill:'#6f8f4f',fop:C.dark?.28:.22,c:C.rule,w:1});
    const g=[[-1.6,-1.7,0],[3.3,-1.7,0],[3.3,1.7,0],[-1.6,1.7,0]].map(Pp).sort((u,v)=>v[1]-u[1])[0];s+=S.text(Math.max(8*k,Math.min(W-8*k,g[0])),Math.min(H-8*k,g[1]+4*k),'plan horizontal de l\'observateur',{anchor:g[0]>W/2?'end':'start',base:'top',size:13})}
  const eye=Pp([0,0,0]),anti=Pp(mul(axis,3.1));
  s+=S.line(eye[0],eye[1],anti[0],anti[1],{c:C.ink2,w:1.4,dash:`${6*k} ${6*k}`});
  if(a.p.plan){const v=mul(RM.direction(h,thR,phi),2.5),u=mul(RM.direction(h,thR,phi+Math.PI),2.5);s+=S.poly([eye,Pp(v),Pp(u)],{close:true,fill:C.c,fop:.08,c:C.c,w:1,dash:`${5*k} ${5*k}`,op:.7})}
  const proj=(t,f)=>Pp(mul(RM.direction(h,t,f),2.5));
  if(a.p.spectre){if(a.p.horizon)s+=anneau(a,proj,h,true);s+=anneau(a,proj,h,false)}
  else for(const[th,col,dash]of[[thB,C.B,true],[thR,C.F,false]]){
    const pts=Array.from({length:181},(_,j)=>mul(RM.direction(h,th,j*2*DEG),2.5));
    for(let j=0;j<12;j++){const v=mul(RM.direction(h,th,j*30*DEG),2.5),q=Pp(v);s+=S.line(eye[0],eye[1],q[0],q[1],{c:col,w:1,op:(!a.p.horizon||v[2]>=0)?.16:.05})}
    for(let j=0;j<180;j++){const vis=!a.p.horizon||(pts[j][2]+pts[j+1][2])>=0,p0=Pp(pts[j]),p1=Pp(pts[j+1]);s+=S.line(p0[0],p0[1],p1[0],p1[1],{c:col,w:vis?3.2:1.4,op:vis?1:.25,dash:dash||!vis?`${4*k} ${3*k}`:undefined,cap:'butt'})}}
  const sel=mul(RM.direction(h,thR,phi),2.5),selB=mul(RM.direction(h,thB,phi),2.5),vis=!a.p.horizon||sel[2]>=0;
  if(a.p.rayons){const R=a.p.spectre?[400,440,490,530,580,610,650,700].map(l=>[mul(RM.direction(h,RM.minimum(RM.spectrumIndex(l)).theta,phi),2.5),couleurSpectre(a,l)]):[[selB,C.B],[sel,C.F]];
    for(const[p,col]of R){if(a.p.horizon&&p[2]<0)continue;s+=ray(S,k,Pp(add(p,axis,-1.35)),Pp(p),C.E,1.8)+ray(S,k,Pp(p),eye,col,a.p.spectre?1.5:2.4)}}
  const ps=Pp(sel),pb=Pp(selB);
  s+=S.circle(ps[0],ps[1],6*k,{fill:vis?C.F:C.ink2})+S.circle(pb[0],pb[1],4*k,{fill:vis?C.B:C.ink2});
  s+=S.text(ps[0]+10*k,ps[1]-12*k,vis?'gouttes sélectionnées':'sous l\'horizon',{size:14,c:vis?C.ink:C.ink2});
  if(a.p.angles){const mid=Pp(mul(add(mul(axis,.55),mul(RM.direction(h,thR,phi),.55)),1));s+=S.text(mid[0],mid[1],'θ'+'<tspan font-size="72%" dy="0.42em">R</tspan>',{anchor:'middle',size:16,c:C.F,math:true})}
  s+=S.circle(eye[0],eye[1],6*k,{fill:C.ink})+S.text(eye[0]-10*k,eye[1]+14*k,'œil',{anchor:'end',size:15,c:C.ink});
  const sp2=Pp(sun);s+=S.circle(sp2[0],sp2[1],11*k,{fill:'#f6c343'})+S.text(sp2[0],sp2[1]-18*k,'Soleil',{anchor:'middle',size:15,c:C.E});
  s+=S.arrow(...Pp(add(sun,axis,.2)),...Pp(add(sun,axis,.75)),{c:C.E,w:2.2});
  const ap=[Math.max(12*k,Math.min(W-12*k,anti[0])),Math.max(16*k,Math.min(H-16*k,anti[1]+16*k))];
  s+=S.text(ap[0],ap[1],'direction antisolaire',{size:14,anchor:ap[0]>W*.6?'end':'start'});
  s+=S.text(10*k,10*k,'glisser pour tourner',{size:13,base:'top'});
  a.svg('obs',s);
}
function ciel(a){
  const P=a.panels.obs,S=a.S,C=a.C,k=a.k,W=P.w,H=P.h,h=a.p.h*DEG,phi=a.p.phi*DEG,thR=RM.minimum(NR).theta,thB=RM.minimum(NB).theta,f=a.fmt;
  const sc=Math.min(W/130,(H-20*k)/118)*P.zoom,c=[W/2,H*.53],Pp=p=>[c[0]+p[0]*R2D*sc,c[1]-p[1]*R2D*sc];
  geo.ciel={c,sc};
  let s='';
  const hor=Array.from({length:181},(_,j)=>RM.sky(h,[Math.cos((-85+j*170/180)*DEG),Math.sin((-85+j*170/180)*DEG),0]));
  if(a.p.horizon){s+=S.poly([[W+100,H+100],[-100,H+100],...hor.map(Pp)],{close:true,fill:'#6f8f4f',fop:C.dark?.28:.22,c:'none'})+S.poly(hor.map(Pp),{c:C.ink2,w:1.4});
    const hp=Pp(RM.sky(h,[1,0,0]));s+=S.text(W-10*k,Math.max(20*k,Math.min(H-14*k,hp[1]-12*k)),'horizon',{anchor:'end',size:14})}
  for(const t of[20,40,60]){s+=S.circle(c[0],c[1],t*sc,{c:C.ink2,w:.8,dash:`${3*k} ${6*k}`,op:.7});if(c[0]+t*sc+40*k<W)s+=S.text(c[0]+t*sc+4*k,c[1]+12*k,t+'°',{size:13})}
  if(a.p.spectre)s+=anneau(a,(t,p)=>Pp([t*Math.sin(p),t*Math.cos(p)]),h,false);
  else for(const[th,col,dash]of[[thB,C.B,true],[thR,C.F,false]]){let d='',pen=false;
    for(let j=0;j<=360;j++){const v=RM.direction(h,th,j*DEG),ok=!a.p.horizon||v[2]>=0,q=Pp(RM.sky(h,v));if(ok){d+=(pen?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1);pen=true}else pen=false}
    s+=S.path(d,{c:col,w:3.6,dash:dash?`${3*k} ${2*k}`:undefined})}
  s+=S.circle(c[0],c[1],4*k,{fill:C.ink})+S.text(c[0],c[1]+12*k,'point antisolaire',{anchor:'middle',base:'top',size:14});
  const v=RM.direction(h,thR,phi),p=Pp(RM.sky(h,v));
  if(!a.p.horizon||v[2]>=0){if(a.p.angles){s+=S.line(c[0],c[1],p[0],p[1],{c:C.F,w:1.4,dash:`${5*k} ${5*k}`});const m=[(c[0]+p[0])/2,(c[1]+p[1])/2];s+=S.text(m[0]+8*k,m[1],'θ<tspan font-size="72%" dy="0.42em">R</tspan>',{size:16,c:C.F,math:true})}
    s+=S.circle(p[0],p[1],9*k,{fill:C.card,c:C.F,w:2.6})}
  s+=S.text(10*k,H-8*k,'distances au centre = angles depuis le point antisolaire',{base:'bottom',size:13});
  a.svg('obs',s);
}
function loupe(a){
  /* coupe radiale au sommet de l'arc : angle depuis le point antisolaire en ordonnée (échelle dilatée, graduée en vrais degrés) */
  const P=a.panels.loupe,S=a.S,C=a.C,k=a.k,W=P.w,H=P.h,h=a.p.h, f=a.fmt;
  const t0=SPEC[0].theta*R2D, t1=SPEC.at(-1).theta*R2D, top=30*k, bot=H-30*k, span=bot-top;
  const R0=2.5*span, cx=W*.42, cy=bot+R0, al=Math.asin(Math.min(.9,W*.3/(R0+span)));
  const r=t=>R0+(t-t0)/(t1-t0)*span, pt=(t,f)=>[cx+r(t)*Math.sin(f),cy-r(t)*Math.cos(f)];
  const sect=(u,v,op)=>{const up=[],lo=[];for(let i=0;i<=30;i++){const f=-al+2*al*i/30;up.push(pt(v,f));lo.push(pt(u,f))}
    return`<path d="M${up.concat(lo.reverse()).map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L')}Z"${op}/>`};
  let s='';
  for(let j=0;j<SPEC.length-1;j++){const u=SPEC[j].theta*R2D,v=SPEC[j+1].theta*R2D,col=couleurSpectre(a,(SPEC[j].lambda+SPEC[j+1].lambda)/2);
    const inner=a.p.horizon?Math.max(u,h):u;
    if(a.p.horizon&&inner>u)s+=sect(u,Math.min(v,inner),` fill="${col}" stroke="${col}" stroke-width=".8" opacity=".13"`);
    if(inner<v)s+=sect(inner,v,` fill="${col}" stroke="${col}" stroke-width=".8"`)}
  const xr=pt(t1,al)[0]+6*k;
  for(let t=41.25;t<=t1+1e-9;t+=.25){if(t<t0)continue;const p=pt(t,al);s+=S.line(p[0],p[1],p[0]+5*k,p[1],{c:C.ink2,w:1})+S.text(xr+2*k,p[1],f.fix(t,2)+'°',{size:13})}
  if(a.p.horizon&&h>t0-.05&&h<t1+.05){const p=pt(h,-al),q=pt(h,al),m=pt(h,0);s+=S.path(`M${p[0]},${p[1]}A${r(h)},${r(h)} 0 0 1 ${q[0]},${q[1]}`,{c:C.ink,w:1.6,dash:`${5*k} ${3*k}`})+S.text(m[0],m[1]+4*k,'horizon',{anchor:'middle',base:'top',size:13,c:C.ink})}
  const o=pt(t1,0),i0=pt(t0,0);s+=S.text(o[0],o[1]-5*k,'rouge (extérieur)',{anchor:'middle',base:'bottom',size:13})+S.text(i0[0],i0[1]+5*k,'violet (intérieur)',{anchor:'middle',base:'top',size:13});
  if(a.p.horizon&&h>=t1)s+=S.text(W/2,(top+bot)/2,'sous l\'horizon',{anchor:'middle',size:14,c:C.ink});
  a.svg('loupe',s);
}
/* ===================== interactions ===================== */
let dragCam=null;
A.drag('goutte',{
  hit:(x,y)=>{const g=geo.goutte;if(!g||g.hx===null||g.hx===undefined)return false;return x<g.cx-g.sc*.95&&Math.abs(y-(g.cy-g.sc*A.p.x))<26*A.k},
  move(x,y){const g=geo.goutte;A.play(false);if(A.tab===2)A.set('minima',false,{silent:true});A.set('x',+clampX((g.cy-y)/g.sc).toFixed(3))}
});
A.drag('graphe',{
  hit:(x,y)=>{const G=geo.graphe;return!!G&&x>=G.x0-6&&x<=G.x0+G.w+6&&y>=G.y0-6&&y<=G.y0+G.h+6},
  move(x){const G=geo.graphe;A.play(false);if(A.tab===2)A.set('minima',false,{silent:true});A.set('x',+clampX(G.xv(x)).toFixed(3))},
  start(x){this.move(x)}
});
A.drag('obs',{
  start(x,y){A.play(false);dragCam={x,y,yaw:st.yaw,pitch:st.pitch};this.move(x,y)},
  move(x,y){
    if(A.p.vue==='ciel'){const g=geo.ciel;if(g)A.set('phi',Math.round((Math.atan2(x-g.c[0],g.c[1]-y)*R2D+360)%360))}
    else if(dragCam){st.yaw=Math.max(-.9,Math.min(1.1,dragCam.yaw+(x-dragCam.x)*.005));st.pitch=Math.max(.06,Math.min(.75,dragCam.pitch-(y-dragCam.y)*.004))}},
  end(){dragCam=null}
});

</script>
