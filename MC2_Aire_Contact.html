/* ---------------- nombres : point décimal, vrai signe moins ---------------- */
const fmt={
  sig(x,n=3){
    if(x===null||x===undefined||!isFinite(x))return '—';
    if(Math.abs(x)<1e-12)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e<-3||e>=6){const m=x/10**e;return (+m.toFixed(n-1)).toFixed(n-1).replace('-',MINUS)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>'}
    const d=Math.max(0,n-1-e);
    let s=(+x.toFixed(d)).toFixed(d);
    if(/^-?0(\.0*)?$/.test(s))s=s.replace('-','');
    return s.replace('-',MINUS);
  },
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));

};

/* ---------------- graduations ---------------- */
function niceStep(range,n){

}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}
function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);

        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});

      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});

  A.preset=ps=>{
    A.play(false);A.cadrerTout();
    for(const[k,v]of Object.entries(ps.valeurs||{})){A.p[k]=v;if(cfg.change)cfg.change(A,k,v)}
    clearActivePresets();
    if(ps._btn){ps._btn.classList.add('is-active');ps._btn.setAttribute('aria-pressed','true')}
    refreshSettings();A.reset();if(ps.action)ps.action(A);if(ps.lecture)A.play(true);A.render();
  };
  A.enable=(id,on)=>{const b=document.getElementById('b_'+id);if(b)b.disabled=!on};

  /* ---------- affichages ---------- */
  const metricsCount=$('.ak-metrics-count',metricsWrap);
  A.metrics=arr=>{
    const L=(arr||[]).filter(Boolean),hh=L.some(m=>m.hint);
    metrics.classList.toggle('has-h',hh);
    metricsWrap.classList.toggle('has-items',L.length>0);
    ak.classList.toggle('ak-has-metrics',L.length>0);
    if(metricsCount.textContent!==String(L.length))metricsCount.textContent=String(L.length);
    const html=L.map((m,i)=>`<div class="ak-metric${m.warn?' warn':''}${expandedMetrics.has(String(i))?' is-expanded':''}" data-idx="${i}" title="Cliquer pour développer / réduire"><div class="k">${m.label}</div><div class="v">${m.value}${m.unit?(m.unit==='°'?'°':`<span class="u">${m.unit}</span>`):''}</div>${m.hint?`<div class="h">${m.hint}</div>`:''}</div>`).join('');
    if(metrics._h!==html){metrics.innerHTML=html;metrics._h=html}
  };
  A.insight=()=>{};
  A.legend=arr=>{const html=(arr||[]).filter(Boolean).map(l=>`<span><i class="${l.dash?'dash':l.dot?'dot':''}" style="background:${l.c};--lc:${l.c}"></i>${l.label}</span>`).join('');if(legend._h!==html){legend.innerHTML=html;legend._h=html}};
  A.clock=html=>{const c=$('.ak-clock',tr);if(c._h!==html){c.innerHTML=html;c._h=html}};
  A.toast=m=>{toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastEl._h);toastEl._h=setTimeout(()=>toastEl.classList.remove('show'),1800)};
  A.panelVisible=id=>!A.panels[id].el.hidden;

  /* ---------- tailles ---------- */
  function viewBox(P){
    const {w,h,vx,vy,vz}=P;
    P.node.setAttribute('viewBox',P.vue==='svg'?`${vx.toFixed(2)} ${vy.toFixed(2)} ${(w/vz).toFixed(2)} ${(h/vz).toFixed(2)}`:`0 0 ${w.toFixed(1)} ${h.toFixed(1)}`);
  }
  function measure(){
    A.narrow=ak.clientWidth<=640; ak.style.setProperty('--ak-top',(top.offsetHeight+(tabs?tabs.offsetHeight:0))+'px');
    if(A.narrow){if(metricsWrap.parentNode!==right||right.lastElementChild!==metricsWrap)right.append(metricsWrap)}
    else{if(metricsWrap.parentNode!==right||right.firstElementChild!==metricsWrap)right.insertBefore(metricsWrap,side)}
    A.k=ak.classList.contains('is-proj')?1.6:A.narrow?1:1.15;
    for(const P of Object.values(A.panels)){
      if(P.el.hidden)continue;
      if(A.narrow){const w=P.el.clientWidth||ak.clientWidth;P.node.style.height=Math.round(w*(P.cfg.ratioTel??.8))+'px'}else P.node.style.height='';
      const r=P.node.getBoundingClientRect(); P.w=Math.max(50,r.width); P.h=Math.max(50,r.height);
      if(P.type==='canvas'){const d=window.devicePixelRatio||1;if(P.node.width!==Math.round(P.w*d)||P.node.height!==Math.round(P.h*d)){P.node.width=Math.round(P.w*d);P.node.height=Math.round(P.h*d)}P.ctx=P.node.getContext('2d');P.ctx.setTransform(d,0,0,d,0,0)}
      else viewBox(P);
    }
  }
  /* ---------- rendu ---------- */
  let graphPanels=[];
  const activeChartView=P=>P?.vue==='graphe'&&zoomed(P)?P:null;
  function drawFrame(){
    const frame={graphs:[],views:graphPanels.map(activeChartView),outputs:new Map()};
    A._graphFrame=frame;
    try{cfg.draw?.(A)}finally{A._graphFrame=null}
    graphPanels=[];
    for(const [P,output] of frame.outputs){
      const graphs=[...output.html.matchAll(/<g data-ak-graph="(\d+)">/g)].map(m=>frame.graphs[+m[1]]).filter(Boolean);
      output.graphs=graphs;
      if(P.vue==='svg'||P.vue==='graphe'){
        const vue=graphs.length?'graphe':'svg';
        if(vue!==P.vue){P.vue=vue;resetView(P);viewBox(P)}
        P.graphs=graphs;
      }
      const view=activeChartView(P);
      for(const graph of graphs){
        graphPanels[graph.id]=P;
        if(graph.view!==view)frame.changed=true;
      }
    }
    return frame;
  }
  function clipCharts(node,graphs){
    const svgElement=tag=>document.createElementNS(node.namespaceURI,tag);
    for(const graph of graphs){
      const axes=node.querySelector(`[data-ak-graph="${graph.id}"]`);
      if(!axes)continue;
      const id='ak-cadre-'+graph.id, defs=svgElement('defs'),clip=svgElement('clipPath'),rect=svgElement('rect');
      clip.id=id;
      for(const [k,v] of Object.entries({x:graph.x0,y:graph.y0,width:graph.w,height:graph.h}))rect.setAttribute(k,v);
      clip.append(rect);defs.append(clip);axes.append(defs);
      let layer=null;
      for(let next=axes.nextElementSibling;next&&!next.hasAttribute('data-ak-graph');){
        const child=next;next=child.nextElementSibling;
        if(child.localName==='defs'||child.hasAttribute('data-ak-hors-graphe')){layer=null;continue}
        if(!layer){
          layer=svgElement('g');
          layer.setAttribute('clip-path',`url(#${id})`);
          child.before(layer);
        }
        layer.append(child);
      }
    }
  }
  function writeSvg(P,html,graphs=[]){
    if(P.node._h===html)return;
    P.node.innerHTML=html;
    P.node._h=html;
    if(activeChartView(P))clipCharts(P.node,graphs);
  }
  A.renderNow=()=>{
    A._dirty=false;measure();
    let frame=drawFrame();
    if(frame.changed)frame=drawFrame();
    for(const [P,output] of frame.outputs)writeSvg(P,output.html,output.graphs);
    syncScrub();guardScroll();
  };
  A.render=()=>{if(A._dirty)return;A._dirty=true;requestAnimationFrame(()=>{if(A._dirty)A.renderNow()})};
  A.svg=(id,html)=>{
    const P=A.panels[id];if(!P)return;
    if(A._graphFrame)A._graphFrame.outputs.set(P,{html});
    else writeSvg(P,html);
  };

  /* ---------- temps ---------- */
  let last=0;
  const playBtn=$('.ak-play',tr);
  A.play=on=>{on=on===undefined?!A.running:on;if(on&&cfg.peutLire&&!cfg.peutLire(A))on=false;A.running=on;playBtn.textContent=on?'❚❚ Pause':'▶ Lecture';if(on){last=performance.now();requestAnimationFrame(loop)}};
  function loop(now){if(!A.running)return;const dt=Math.min(.05,(now-last)/1000)*A.speed;last=now;if(cfg.step)cfg.step(A,dt);A.renderNow();requestAnimationFrame(loop)}
  A.stepOnce=()=>{A.play(false);if(cfg.step)cfg.step(A,cfg.pas??1/24);A.render()};
  A.reset=()=>{A.play(false);A.t=0;if(cfg.reset)cfg.reset(A);A.render()};
  $('.ak-speed',tr).onchange=e=>{A.speed=+e.target.value};A.speed=cfg.vitesse||1;

  /* ---------- onglets ---------- */
  A.setTab=i=>{if(!tabs||i<0||i>=cfg.onglets.length)return;A.play(false);A.tab=i;A.cadrerTout();clearActivePresets();$$('.ak-tab',tabs).forEach((b,j)=>b.setAttribute('aria-selected',String(j===i)));if(cfg.onglet)cfg.onglet(A,i);refreshSettings();A.render()};

  /* ---------- thème, projection, plein écran ---------- */
  A.setTheme=t=>{root.dataset.theme=t;writeStore(THEME_KEY,t);readColors();syncMenu();A.renderNow()};
  A.setProj=on=>{
    ak.classList.toggle('is-proj',on);
    ak.classList.remove('drawer-open');
    projButton.classList.toggle('on',on);
    syncMenu();
    A.render();
  };
  const acts={
    play:()=>A.play(),step:()=>A.stepOnce(),reset:()=>A.reset(),
    help:()=>{dlg.showModal()},theme:()=>A.setTheme(root.dataset.theme==='dark'?'light':'dark'),
    image:()=>A.exportImage(),proj:()=>{
      const projected=ak.classList.contains('is-proj');
      A.setProj(!projected);
      if(cfg.menuCommun&&projected&&A.narrow)ak.classList.add('drawer-open');
    },
    fs:()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>A.toast('Plein écran refusé par le navigateur'))},
    settings:()=>{ak.classList.toggle('drawer-open');A.render()}
  };
  ak.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&acts[b.dataset.act])acts[b.dataset.act]()});
  addEventListener('keydown',e=>{
    if(dlg.open||e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.target.matches('input,select,textarea'))return;
    const k=e.key.toLowerCase(), custom=cfg.touches&&cfg.touches[k];
    if(custom){e.preventDefault();custom(A);A.render();return}
    if(k===' '&&!tr.hidden){e.preventDefault();acts.play()}
    else if(k==='arrowright'&&!tr.hidden){e.preventDefault();acts.step()}
    else if(k==='r'&&!tr.hidden)acts.reset();
    else if(k==='h'||k==='?')acts.help();else if(k==='p')acts.proj();else if(k==='f')acts.fs();else if(k==='t')acts.theme();else if(k==='i')acts.image();
    else if(k==='+'||k==='='||k==='-'||k==='0'){const P=(A._hover&&!A._hover.el.hidden&&A._hover.vue)?A._hover:Object.values(A.panels).find(q=>q.vue&&!q.el.hidden);if(P){e.preventDefault();if(k==='0')A.cadrer(P);else A.zoomer(P,k==='-'?.8:1.25)}}
    else if(k==='escape'){ak.classList.remove('drawer-open');A.render()}
    else if(/^[1-9]$/.test(k))A.setTab(+k-1);
  });

  /* ---------- vue : zoom, cadrage, déplacement ---------- */
  const deplacable=P=>P.vue==='svg'||P.vue==='graphe';
  function zoomed(P){
    if(P.vue==='interne')return Math.abs(P.zoom-1)>1e-6;
    if(!deplacable(P))return false;
    const seuil=P.vue==='graphe'?1e-6:.5;
    return Math.abs(P.vz-1)>1e-6||Math.abs(P.vx)>seuil||Math.abs(P.vy)>seuil;
  }
  const markZoom=P=>{if(P.tools)P.tools.classList.toggle('is-zoomed',zoomed(P))};
  const graphAt=(P,x,y)=>P.graphs.find(g=>x>=g.x0&&x<=g.x0+g.w&&y>=g.y0&&y<=g.y0+g.h);
  function resetView(P){P.vz=1;P.vx=P.vy=0;P.zoom=1;P.panX=P.panY=0;markZoom(P)}
  A.zoomer=(P,f,px,py)=>{if(typeof P==='string')P=A.panels[P];if(!P||!P.vue)return;
    if(P.vue==='interne')P.zoom=Math.max(.4,Math.min(5,P.zoom*f));
    else{
      if(P.vue==='graphe'){
        const graph=graphAt(P,px,py);
        px=graph?(px-graph.x0)/graph.w:.5;
        py=graph?(py-graph.y0)/graph.h:.5;
      }else{px=px??P.w/2;py=py??P.h/2}
      const z=Math.max(.5,Math.min(8,P.vz*f)), delta=1/P.vz-1/z;
      P.vx+=px*delta;P.vy+=py*delta;P.vz=z;
    }
    markZoom(P);A.render()};
  A.deplacer=(P,dx,dy,px,py)=>{
    if(!deplacable(P))return;
    if(P.vue==='graphe'){const g=graphAt(P,px,py)||P.graphs[0];dx/=g.w;dy/=g.h}
    P.vx-=dx/P.vz;P.vy-=dy/P.vz;markZoom(P);A.render()
  };
  A.cadrer=P=>{if(typeof P==='string')P=A.panels[P];if(!P)return;resetView(P);A.render()};
  A.cadrerTout=()=>{for(const P of Object.values(A.panels))A.cadrer(P)};

  function wire(P){const N=P.node,pts=new Map();let mode=null,h=null,last=null,pin=null;
    const scr=e=>{const r=N.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
    const toV=s=>P.vue==='svg'?[P.vx+s[0]/P.vz,P.vy+s[1]/P.vz]:s;
    const two=()=>{const[a,b]=[...pts.values()];return{d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,c:[(a[0]+b[0])/2,(a[1]+b[1])/2]}};
    N.addEventListener('pointerdown',e=>{
      const s=scr(e);A._hover=P;pts.set(e.pointerId,s);
      if(pts.size===2&&P.vue){if(mode==='drag'&&h&&h.end)h.end(e);mode='pinch';h=null;pin=two();N.setPointerCapture(e.pointerId);e.preventDefault();return}
      if(pts.size>1)return;
      const[x,y]=toV(s);
      if(deplacable(P)&&(e.shiftKey||e.button===1))mode='pan';
      else{h=P._drags.find(d=>!d.hit||d.hit(x,y,e))||null;
        if(h){mode='drag';if(h.start)h.start(x,y,e)}
        else if(deplacable(P)&&zoomed(P))mode='pan';
        else{mode=null;return}}
      last=s;N.setPointerCapture(e.pointerId);e.preventDefault();A.render()});
    N.addEventListener('pointermove',e=>{const s=scr(e);
      if(!pts.has(e.pointerId)){if(e.pointerType==='mouse'){const[x,y]=toV(s);N.style.cursor=P._drags.some(d=>d.hit&&d.hit(x,y,e))?'grab':(deplacable(P)&&(e.shiftKey||zoomed(P)))?'move':''}return}
      pts.set(e.pointerId,s);
      if(mode==='pinch'&&pts.size>=2){const q=two();A.zoomer(P,q.d/pin.d,q.c[0],q.c[1]);A.deplacer(P,q.c[0]-pin.c[0],q.c[1]-pin.c[1],q.c[0],q.c[1]);pin=q;return}
      if(mode==='pan'){A.deplacer(P,s[0]-last[0],s[1]-last[1],last[0],last[1]);last=s;return}
      if(mode==='drag'&&h){const[x,y]=toV(s);h.move(x,y,e);A.render()}});
    const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
      if(mode==='drag'&&h&&h.end)h.end(e);
      if(pts.size===0){mode=null;h=null}else if(mode==='pinch'){mode='pan';last=[...pts.values()][0]}
      A.render()};
    N.addEventListener('pointerup',end);N.addEventListener('pointercancel',end);
    if(P.vue){
      N.addEventListener('wheel',e=>{if(A.narrow&&!e.ctrlKey)return;e.preventDefault();const s=scr(e);A.zoomer(P,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),s[0],s[1])},{passive:false});
      N.addEventListener('dblclick',e=>{const[x,y]=toV(scr(e));if(!P._drags.some(d=>d.hit&&d.hit(x,y,e))&&zoomed(P))A.cadrer(P)});
      N.addEventListener('pointerenter',()=>{A._hover=P});
    }
  }
  for(const P of Object.values(A.panels))wire(P);
  A.drag=(id,h)=>{A.panels[id]._drags.push(h)};

  /* ---------- export image (toujours en thème clair) ---------- */
  A.exportImage=async()=>{
    const was=root.dataset.theme; root.dataset.theme='light'; readColors(); A.renderNow();
    const vis=Object.values(A.panels).filter(P=>!P.el.hidden), base=pwrap.getBoundingClientRect(), sc=2;
    const cv=document.createElement('canvas'); cv.width=Math.round(base.width*sc); cv.height=Math.round(base.height*sc);
    const ctx=cv.getContext('2d'); ctx.fillStyle=A.C.card; ctx.fillRect(0,0,cv.width,cv.height);
    const jobs=vis.map(P=>new Promise(res=>{const r=P.node.getBoundingClientRect(), x=(r.left-base.left)*sc, y=(r.top-base.top)*sc;
      if(P.type==='canvas'){ctx.drawImage(P.node,x,y,r.width*sc,r.height*sc);res();return}
      const clone=P.node.cloneNode(true); clone.setAttribute('width',r.width); clone.setAttribute('height',r.height);
      const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
      const im=new Image(); im.onload=()=>{ctx.drawImage(im,x,y,r.width*sc,r.height*sc);res()}; im.onerror=()=>res(); im.src=src;}));
    await Promise.all(jobs);
    root.dataset.theme=was; readColors(); A.renderNow();
    const a=document.createElement('a'); const tabName=cfg.onglets&&cfg.onglets.length>1?'_'+(A.tab+1):'';
    a.download=`${cfg.code}_${(cfg.fichier||cfg.titre).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_')}${tabName}.png`;
    a.href=cv.toDataURL('image/png'); a.click(); A.toast('Image enregistrée (thème clair)');
  };

  /* ---------- aide ---------- */
  function buildHelp(){
    const h=cfg.aide||{}, sec=(t,c)=>c?`<h4>${t}</h4>${/^\s*</.test(c)?c:`<p>${c}</p>`}`:'';
    dlg.innerHTML=`<header><h3>Aide · ${cfg.titre}</h3><button class="mini" data-close>Fermer ✕</button></header><div class="db">
    ${cfg.sousTitre?`<p class="ak-dlg-sub">${cfg.sousTitre}</p>`:''}${sec('Ce qu\'on voit',h.voit)}${sec('Ce qu\'on peut faire',h.faire)}${sec('Modèle et hypothèses',h.modele)}${sec('Lien avec le cours',h.cours)}${sec('Pour aller plus loin',h.plus)}
    <h4>Raccourcis</h4><p>${cfg.temps?'<kbd>Espace</kbd> lecture / pause · <kbd>→</kbd> pas à pas · <kbd>R</kbd> recommencer · ':''}${tabs?`<kbd>1</kbd>–<kbd>${cfg.onglets.length}</kbd> onglets · `:''}<kbd>P</kbd> projection · <kbd>F</kbd> plein écran · <kbd>T</kbd> thème · <kbd>I</kbd> image · <kbd>H</kbd> aide${h.touches?' · '+h.touches:''}</p>
    <p>Vue : molette, pincement ou <kbd>+</kbd> <kbd>−</kbd> pour zoomer · <kbd>Maj</kbd> + glisser, deux doigts, ou glisser une vue zoomée pour la déplacer · « Cadrer », <kbd>0</kbd> ou double clic : vue initiale · Double-clic sur un curseur : valeur par défaut.</p>
    ${h.credits?`<h4>Crédits</h4><p>${h.credits}</p>`:''}</div>`;
    dlg.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===dlg)dlg.close()});
  }

  /* ---------- démarrage ---------- */
  buildSettings(); buildHelp(); readColors();
  if(cfg.init)cfg.init(A);
  refreshSettings(); A.reset();
  new ResizeObserver(()=>A.render()).observe(ak);
  return A;
}

window.AnimKit={app,fmt,M,ticks,niceStep,FONT,MATH,interrupteur};
})();

</script>
<script>
/* =====================================================================
   MC2 MP · A3 Aire réelle de contact : modèle
   Rugosité composite h = (h1 + h2)/√2 : deux champs aléatoires gaussiens lissés (graine fixe).
   Les jonctions sont les zones où h > d ; l'écartement d est celui qui donne S_r = R_N / σ_c
   (modèle plastique, surfaces tronquées). La fraction colorée vaut 10⁴ × S_r / S_a.
   Face d'appui : rectangle de largeur 3 cm et de longueur S_a / 3 cm, 100 points par cm ;
   un point de la grille représente donc, après grossissement, 10⁻¹² m² de jonction réelle.
   ===================================================================== */
const MC2Contact = (() => {
  'use strict';
  const GROSSISSEMENT = 1e4;
  const PAR_CM = 100;                 // points de grille par cm
  const LARGEUR_CM = 3;
  const H = LARGEUR_CM * PAR_CM;      // 300 lignes
  const W = Math.round(32 / LARGEUR_CM * PAR_CM);   // longueur pour S_a = 32 cm²
  const LISSAGE = 3.5;                // écart type du lissage gaussien (points)
  const MAXC = 20000;                 // R_N = 10 N et σ_c = 0.5 GPa
  const GRAINE = 7;

  function alea(graine) {             // mulberry32 puis Box-Muller
    let a = graine >>> 0;
    const u = () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    return () => Math.sqrt(-2 * Math.log(1 - u())) * Math.cos(2 * Math.PI * u());
  }

  /* champ gaussien lissé (lissage séparable, bords périodiques), centré réduit */
  function champ(graine) {
    const g = alea(graine), n = W * H;
    const bruit = new Float32Array(n), tmp = new Float32Array(n), res = new Float32Array(n);
    for (let i = 0; i < n; i++) bruit[i] = g();
    const r = Math.ceil(3 * LISSAGE), noyau = [];
    for (let k = -r; k <= r; k++) noyau.push(Math.exp(-k * k / (2 * LISSAGE * LISSAGE)));
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let s = 0;
      for (let k = -r; k <= r; k++) s += noyau[k + r] * bruit[y * W + (x + k + W) % W];
      tmp[y * W + x] = s;
    }
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let s = 0;
      for (let k = -r; k <= r; k++) s += noyau[k + r] * tmp[((y + k + H) % H) * W + x];
      res[y * W + x] = s;
    }
    let m = 0, v = 0;
    for (let i = 0; i < n; i++) m += res[i];
    m /= n;
    for (let i = 0; i < n; i++) v += (res[i] - m) ** 2;
    const e = Math.sqrt(v / n);
    for (let i = 0; i < n; i++) res[i] = (res[i] - m) / e;
    return res;
  }

  let champs = null;
  function surfaces() {
    if (!champs) {
      const h1 = champ(GRAINE), h2 = champ(GRAINE + 1000), h = new Float32Array(W * H);
      for (let i = 0; i < h.length; i++) h[i] = (h1[i] + h2[i]) / Math.SQRT2;
      champs = {h1, h2, h};
    }
    return champs;
  }

  /* face d'aire S_a (cm²), centrée sur la grille : points les plus hauts classés, et nombre de
     jonctions pour chaque nombre de points en contact (union des voisins, du plus haut au plus bas) */
  const faces = {};
  function face(Sa) {
    if (faces[Sa]) return faces[Sa];
    const {h} = surfaces();
    const nx = Math.round(Sa / LARGEUR_CM * PAR_CM), off = Math.floor((W - nx) / 2), n = nx * H;
    const val = new Float32Array(n);
    for (let y = 0; y < H; y++) val.set(h.subarray(y * W + off, y * W + off + nx), y * nx);
    const tri = Float32Array.from(val).sort();
    const seuil = tri[n - MAXC - 2];
    const haut = [];
    for (let i = 0; i < n; i++) if (val[i] > seuil) haut.push(i);
    haut.sort((a, b) => val[b] - val[a]);
    const parent = new Int32Array(n).fill(-1);
    const racine = a => { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; };
    const nb = new Int32Array(MAXC + 1);
    let N = 0;
    for (let c = 0; c < MAXC; c++) {
      const i = haut[c], x = i % nx;
      parent[i] = i; N++;
      for (const j of [x > 0 ? i - 1 : -1, x < nx - 1 ? i + 1 : -1, i - nx, i + nx < n ? i + nx : -1]) {
        if (j < 0 || parent[j] < 0) continue;
        const a = racine(i), b = racine(j);
        if (a !== b) { parent[a] = b; N--; }
      }
      nb[c + 1] = N;
    }
    return (faces[Sa] = {Sa, nx, off, val, haut, nb});
  }

  /* R_N en N, σ_c en GPa → aire réelle en m² */
  const aireReelle = (R, sig) => R / (sig * 1e9);
  const points = (R, sig) => Math.max(1, Math.min(MAXC, Math.round(1000 * R / sig)));

  function etat(Sa, R, sig) {

    const d = (f.val[f.haut[c - 1]] + f.val[f.haut[c]]) / 2;

  /* jonctions en segments horizontaux [x, y, longueur] dans le repère de la face */
  function segments(e) {

    for (let y = 0; y < H; y++) {
      let x = 0;
      while (x < nx) {

        } else x++;
      }
    }
    return res;
  }

  /* coupe : portion de longueur L à partir de la colonne x0 (grille entière) sur la ligne y */
  function coupe(x0, y, L, d) {
    const {h1, h2} = surfaces(), bas = [], haut = [];
    for (let i = 0; i <= L; i++) {
      const k = y * W + x0 + i;

  /* portion de coupe qui montre des jonctions à charge moyenne et forte, dans la plus petite face */
  function coupeParDefaut(L) {
    const {h} = surfaces(), moy = etat(24, 2.94, 1).d, fort = etat(24, 9.81, 1).d;
    const petite = face(8);
    let mieux = {score: -1, x0: petite.off, y: H / 2};
    for (let y = 20; y < H - 20; y += 2) for (let x0 = petite.off + 4; x0 + L < petite.off + petite.nx - 4; x0 += 4) {
      let a = 0, b = 0, da = false, db = false;
      for (let i = 0; i <= L; i++) {
        const v = h[y * W + x0 + i];
        if (v > moy && !da) a++;
        if (v > fort && !db) b++;

      }

// @titre    Aire réelle de contact · MC2 · MP
// @sortie   ../MC2_Aire_Contact/MC2_Aire_Contact.html
// @inclure  MC2_Aire_Contact_Physique.js
// @style    MC2_Aire_Contact.css
// @description Deux surfaces rugueuses pressées l'une contre l'autre : jonctions, aire réelle de contact proportionnelle à la réaction normale et indépendante de l'aire apparente.
'use strict';
/* =====================================================================
   MC2 MP · A3 Aire réelle de contact
   Physique : MC2_Aire_Contact_Physique.js (surface aléatoire, modèle plastique par troncature).
   Onglets : 1 jonctions (face vue de dessus et coupe) · 2 charge et aire (graphes).
   Notations du cours (I.4) : S_a, S_r, R_N, R_T, σ_c, τ_c, f, jonctions, solides S₁ et S₂.
   ===================================================================== */
(() => {
  const MP = MC2Contact, M = AnimKit.M;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const clipped = (S, G, id, content) => S.clip(id, G) + '<g clip-path="url(#' + id + ')">' + content + '</g>';
  const lab = (a, x, y, html, o = {}) => a.S.text(x, y, html, {size: 14, ...o});
  const r2 = x => Math.round(x * 100) / 100;

  const RMAX = 10;                                   // charge maximale (N), 1 N/s en lecture
  const LC = 160;                                    // longueur de la coupe (points)
  const REF = {rn: 2.94, sa: 24, sig: 1};            // application 1

  const cJ = a => a.C.dark ? '#ff7f92' : a.C.c;      // jonctions
  const charge = a => Math.min(RMAX, a.p.rn + a.t);
  const etat = a => MP.etat(a.p.sa, charge(a), a.p.sig);

  let sel = null;                                    // coupe choisie (coin dans la grille entière)
  let geo = null;                                    // géométrie de la vue de dessus (pour la souris)
  let gardee = null;

  function selection(e) {
    if (!sel) sel = MP.coupeParDefaut(LC);
    return {x0: Math.round(clamp(sel.x0, e.f.off, e.f.off + e.f.nx - LC - 1)), y: Math.round(clamp(sel.y, 0, MP.H - 1))};
  }

  /* ---------- vue de dessus : même échelle quelle que soit S_a ---------- */
  function sceneFace(a) {
    const {S, C, k, fmt, p} = a, P = a.panels.face, w = P.w, h = P.h, e = etat(a), {nx, off} = e.f;
    const haut = 30 * k, bas = 28 * k;
    const sc = Math.max(.05, Math.min((w - 20 * k) / MP.W, (h - haut - bas) / MP.H));
    const x0 = w / 2 - MP.W * sc / 2, y0 = haut + Math.max(0, (h - haut - bas - MP.H * sc) / 2);
    const X = i => x0 + i * sc, Y = j => y0 + j * sc;
    geo = {x0, y0, sc};
    let g = S.rect(X(off), Y(0), nx * sc, MP.H * sc, {fill: C.grid, c: 'none'});
    let d = '';
    for (const [x, y, n] of MP.segments(e)) d += 'M' + r2(X(off + x)) + ',' + r2(Y(y)) + 'h' + r2(n * sc) + 'v' + r2(sc) + 'h' + r2(-n * sc) + 'z';
    g += '<path d="' + d + '" fill="' + cJ(a) + '" stroke="' + cJ(a) + '" stroke-width="' + r2(Math.min(.6, sc * .6)) + '"/>';
    g += S.rect(X(off), Y(0), nx * sc, MP.H * sc, {c: C.ink, w: 1.6});
    /* repère de la coupe */
    const s = selection(e), ya = Y(s.y + .5), xa = X(s.x0), xb = X(s.x0 + LC);
    g += S.line(xa, ya, xb, ya, {c: C.ink, w: 1.8});
    for (const x of [xa, xb]) g += S.line(x, ya - 7 * k, x, ya + 7 * k, {c: C.ink, w: 1.8});
    g += lab(a, (xa + xb) / 2, ya - 12 * k, 'coupe', {anchor: 'middle', size: 13, c: C.ink, weight: 700});
    const cm = fmt.fix(nx / MP.PAR_CM, 1);
    const dims = w > 460 * k ? '  (' + cm + ' cm × ' + fmt.fix(MP.LARGEUR_CM, 1) + ' cm)' : '';
    g += lab(a, w / 2, y0 - 14 * k, S.v('R', 'N') + ' = ' + fmt.fix(charge(a), 2) + ' N   ·   ' + S.v('S', 'a') + ' = ' + fmt.fix(p.sa, 0) + ' cm²' + dims, {anchor: 'middle', c: C.ink, weight: 600});
    const serre = e.c / (nx * MP.H) > .12;
    g += lab(a, w / 2, Y(MP.H) + 15 * k, serre ? (w > 460 * k ? 'taches trop serrées, elles fusionnent : effet du grossissement' : 'taches fusionnées par le grossissement') : (w > 400 * k ? 'taches : aire réelle de contact grossie 10 000 fois' : 'aire de contact grossie 10 000 fois'),
      {anchor: 'middle', size: 13, c: serre ? C.hot : C.ink2, weight: serre ? 700 : undefined});
    a.svg('face', g);
  }

  /* ---------- coupe : S₁ fixe, S₂ descend quand la charge augmente ---------- */
  function sceneCoupe(a) {
    const {S, C, k, fmt, p} = a, P = a.panels.coupe, w = P.w, h = P.h, e = etat(a), s = selection(e);
    const c = MP.coupe(s.x0, s.y, LC, e.d);
    const marge = 10 * k, droit = 64 * k, zmin = -2.7, zmax = 4.9;
    const lw = w - marge - droit;                    // marge de droite réservée aux forces
    const X = i => marge + i / LC * lw, Y = z => h - 4 * k - (z - zmin) / (zmax - zmin) * (h - 8 * k);
    const bas = [], haut = [], contact = [];
    for (let i = 0; i <= LC; i++) {
      const touche = c.bas[i] > c.haut[i], m = (c.bas[i] + c.haut[i]) / 2;
      bas.push([X(i), Y(clamp(touche ? m : c.bas[i], zmin, zmax))]);
      haut.push([X(i), Y(clamp(touche ? m : c.haut[i], zmin, zmax))]);
      contact.push(touche);
    }
    let g = S.poly([[X(0), Y(zmin)], ...bas, [X(LC), Y(zmin)]], {close: true, fill: C.grid, c: 'none'});
    g += S.poly([[X(0), Y(zmax)], ...haut, [X(LC), Y(zmax)]], {close: true, fill: C.cSoft, c: 'none'});
    g += S.poly(bas, {c: C.ink, w: 1.6}) + S.poly(haut, {c: C.ink, w: 1.6});
    let n = 0;
    for (let i = 0; i <= LC; i++) {
      if (!contact[i]) continue;
      let j = i;
      while (j < LC && contact[j + 1]) j++;
      const pts = bas.slice(i, j + 1);
      if (pts.length < 2) pts.push([pts[0][0] + lw / LC * .8, pts[0][1]]);
      g += S.poly(pts, {c: cJ(a), w: 5});
      n++; i = j;
    }
    g += lab(a, marge + 8 * k, Y(zmin) - 14 * k, S.v('S', '1'), {c: C.ink, weight: 700, size: 15});
    g += lab(a, marge + 8 * k, 16 * k, S.v('S', '2'), {c: C.ink, weight: 700, size: 15});
    g += lab(a, marge + 40 * k, 16 * k, w > 480 * k ? n + (n > 1 ? ' jonctions coupées' : ' jonction coupée') + ' · échelle verticale très dilatée' : 'échelle verticale dilatée', {size: 13, c: C.ink2});
    /* réaction normale (et tangentielle en glissement), longueurs proportionnelles */
    const pxN = Math.min(h * .52, 140 * k) / RMAX, R = charge(a);
    const ox = w - droit + 28 * k, oy = h * .58;
    g += S.arrow(ox, oy, ox, oy - Math.max(8 * k, R * pxN), {c: C.E, w: 3.2});
    g += lab(a, ox + 6 * k, oy - Math.max(8 * k, R * pxN) + 8 * k, S.v('R', 'N'), {c: C.E, weight: 700, size: 15});
    if (p.force) {
      const T = p.tau / p.sig * R, L = clamp(T * pxN, 8 * k, w * .4);
      g += S.arrow(ox, oy, ox - L, oy, {c: C.F, w: 3.2});
      g += lab(a, ox - L / 2, oy + 16 * k, S.v('R', 'T'), {c: C.F, weight: 700, size: 15, anchor: 'middle'});
      const yg = h - 14 * k;
      g += S.arrow(w * .36, yg, w * .36 + 50 * k, yg, {c: C.v, w: 2.4});
      g += lab(a, w * .36 + 58 * k, yg, 'glissement de ' + S.v('S', '2'), {c: C.v, size: 13});
    }
    g += S.circle(ox, oy, 3.5 * k, {fill: C.ink});
    a.svg('coupe', g);
  }

  /* ---------- graphes en fonction de R_N ---------- */
  const droite = (x, pente) => [[0, 0], [x, x * pente]];
  const courbeN = (sa, sig, xmax) => {
    const f = MP.face(sa), pts = [];
    for (let i = 0; i <= 120; i++) {
      const R = .2 + (Math.min(RMAX, xmax) - .2) * i / 120;
      pts.push([R, f.nb[MP.points(R, sig)]]);
    }
    return pts;
  };

  function graphe(a, id) {
    const {S, C, k, p, fmt} = a, P = a.panels[id], R = charge(a), e = etat(a);
    const ymax = id === 'sr' ? p.srmax : id === 'nb' ? p.nmax : p.rtmax;
    const nom = id === 'sr' ? S.v('S', 'r') + ' (10⁻³ mm²)' : id === 'nb' ? 'nombre de jonctions du dessin' : '‖' + S.v('R', 'T') + '‖ en glissement (N)';
    const G = S.graph({x: 0, y: 0, w: P.w, h: P.h, padL: 44 * k, padR: 18 * k, padT: 22 * k, padB: 36 * k, xmin: 0, xmax: p.xmax, ymin: 0, ymax,
      xlab: S.v('R', 'N') + ' (N)', ylab: nom});
    const pente = id === 'sr' ? 1 / p.sig : p.tau / p.sig;
    let in_ = '', y;
    if (gardee && gardee[id]) in_ += S.curve(gardee[id], G, {c: C.ink2, w: 1.8, dash: '6 4'});
    if (id === 'nb') {
      in_ += S.curve(courbeN(p.sa, p.sig, p.xmax), G, {c: cJ(a), w: 2.4});
      y = e.N;
    } else {
      if (p.droite) in_ += S.curve(droite(p.xmax, pente), G, {c: C.cInk, w: 2});
      if (R - p.rn > 1e-6) in_ += S.curve([[p.rn, p.rn * pente], [R, R * pente]], G, {c: cJ(a), w: 3.4});
      y = R * pente;
    }
    if (R <= p.xmax && y <= ymax) {
      in_ += S.line(G.X(R), G.y0 + G.h, G.X(R), G.Y(y), {c: C.ink2, w: 1, dash: '3 4'});
      in_ += S.line(G.x0, G.Y(y), G.X(R), G.Y(y), {c: C.ink2, w: 1, dash: '3 4'});
      in_ += S.circle(G.X(R), G.Y(y), 6 * k, {fill: cJ(a), c: C.card, w: 1.8});
    }
    const hors = R > p.xmax || y > ymax;
    a.svg(id, G.svg + clipped(S, G, 'mc2a-' + id, in_) + (hors ? lab(a, G.x0 + G.w - 4 * k, G.y0 - 9 * k, P.w > 420 * k ? 'hors cadre : augmenter le maximum' : 'hors cadre', {anchor: 'end', size: 13, c: C.hot, weight: 600}) : ''));
  }

  function garder(a) {
    const p = a.p;
    gardee = {sr: droite(RMAX, 1 / p.sig), nb: courbeN(p.sa, p.sig, RMAX), rt: p.force ? droite(RMAX, p.tau / p.sig) : null,
      nom: 'σ<sub>c</sub> = ' + a.fmt.fix(p.sig, 2) + ' GPa, S<sub>a</sub> = ' + a.fmt.fix(p.sa, 0) + ' cm²'};
    a.toast('Courbes gardées en pointillés');
  }

  /* ---------- mesures et légende ---------- */
  function mesures(a) {
    const {p, fmt} = a, R = charge(a), e = etat(a), ref = MP.etat(REF.sa, REF.rn, REF.sig);
    const L = [
      {label: 'Réaction normale ' + M.v('R', 'N'), value: fmt.fix(R, 2), unit: 'N'},
      {label: 'Aire réelle ' + M.v('S', 'r') + ' = ' + M.v('R', 'N') + ' / ' + M.v('σ', 'c'), value: p.valeurs ? fmt.fix(e.Sr * 1e9, 2) + ' × 10<sup>−3</sup>' : '—', unit: p.valeurs ? 'mm²' : '', hint: p.valeurs ? '' : 'masquée'},
      {label: M.v('S', 'r') + ' / ' + M.v('S', 'a'), value: p.valeurs ? fmt.fix(e.rapport * 1e6, 2) + ' × 10<sup>−6</sup>' : '—', unit: '', hint: p.valeurs ? '' : 'masqué'},
      {label: 'Jonctions du dessin', value: fmt.fix(e.N, 0), unit: ''},
      {label: 'Aire moyenne d’une jonction', value: '× ' + fmt.fix(e.aireMoy / ref.aireMoy, 2), unit: '', hint: 'rapportée à l’application 1'}
    ];
    if (p.force) {
      L.push({label: '‖' + M.vec('R') + '<sub>T</sub>‖ = ' + M.v('τ', 'c') + ' ' + M.v('S', 'r'), value: fmt.fix(p.tau / p.sig * R, 2), unit: 'N'});
      L.push({label: M.v('f') + ' = ' + M.v('τ', 'c') + ' / ' + M.v('σ', 'c'), value: fmt.fix(p.tau / p.sig, 2), unit: ''});
    }
    a.metrics(p.mesures ? L : []);
  }

  function legende(a) {
    const {C, p} = a, L = [{label: 'jonctions (aire grossie 10⁴ fois)', c: cJ(a)}, {label: 'S<sub>2</sub>', c: C.cSoft}, {label: 'S<sub>1</sub>', c: C.grid}];
    if (a.tab === 1 && gardee) L.push({label: 'gardé : ' + gardee.nom, c: C.ink2, dash: true});
    a.legend(L);
  }

  const classes = a => {
    a.root?.classList.toggle('mc2a-graphes', a.tab === 1);
    a.root?.classList.toggle('mc2a-force', !!a.p.force);
  };
  const preset = (label, valeurs, titre) => ({label, valeurs, titre});

  AnimKit.app({
    code: 'MC2', partie: 'RougeGrenat', chapitre: 'MC2 Frottement solide',
    titre: 'Aire réelle de contact',
    titreFenetre: 'Aire réelle de contact · MC2 · MP',
    menuCommun: true, fichier: 'Aire_Contact',
    onglets: ['Jonctions', 'Charge et aire'],
    panneaux: [
      {id: 'face', titre: 'Face d’appui vue de dessus', ratioTel: .45},
      {id: 'coupe', titre: 'Coupe de l’interface le long du trait', ratioTel: .6},
      {id: 'sr', titre: 'Aire réelle de contact', onglets: [1], ratioTel: .65},
      {id: 'nb', titre: 'Jonctions', onglets: [1], ratioTel: .65},
      {id: 'rt', titre: 'Force de glissement', onglets: [1], si: a => !!a.p.force, ratioTel: .65}
    ],
    temps: true, pas: .1, vitesses: [.25, .5, 1, 2, 4], vitesse: 1,
    curseur: {max: a => Math.max(1e-6, RMAX - a.p.rn), get: a => Math.min(a.t, RMAX - a.p.rn), set: (a, v) => { a.t = v; }},
    peutLire: a => { if (charge(a) >= RMAX - 1e-9) a.t = 0; return true; },
    step(a, dt) { a.t = Math.min(RMAX - a.p.rn, a.t + dt); if (charge(a) >= RMAX - 1e-9) a.play(false); },
    reset(a) { a.t = 0; },
    init(a) {
      classes(a);
      const place = (x, y) => {
        if (!geo) return;
        sel = {x0: (x - geo.x0) / geo.sc - LC / 2, y: (y - geo.y0) / geo.sc};
        sel = selection(etat(a));
      };
      a.drag('face', {
        hit: (x, y) => {
          if (!geo) return false;
          const s = selection(etat(a)), i = (x - geo.x0) / geo.sc, d = Math.abs(y - (geo.y0 + (s.y + .5) * geo.sc));
          return d < 18 * a.k && i > s.x0 - 25 && i < s.x0 + LC + 25;
        },
        move: place
      });
    },
    onglet(a) { classes(a); },
    change(a, id) { if (id === 'force') classes(a); },
    reglages: [
      {titre: 'Situations', presets: [
        preset('Application 1 : grande face', {...REF}),
        preset('Même bloc, petite face', {...REF, sa: 8}),
        preset('Charge doublée', {...REF, rn: 5.89}),
        preset('Matériau deux fois moins dur', {...REF, sig: .5})
      ]},
      {titre: 'Charge et surfaces', items: [
        {id: 'rn', type: 'range', label: 'Réaction normale ' + M.v('R', 'N'), min: .5, max: RMAX, step: .01, dec: 2, value: REF.rn, unit: 'N', reinit: true},
        {id: 'sa', type: 'range', label: 'Aire apparente ' + M.v('S', 'a'), min: 8, max: 32, step: 4, dec: 0, value: REF.sa, unit: 'cm²'},
        {id: 'sig', type: 'range', label: 'Pression d’écoulement ' + M.v('σ', 'c'), min: .5, max: 3, step: .05, dec: 2, value: REF.sig, unit: 'GPa'}
      ]},
      {titre: 'Glissement', items: [
        {id: 'force', type: 'check', label: 'Montrer la force de glissement', value: false},
        {id: 'tau', type: 'range', label: 'Contrainte de cisaillement ' + M.v('τ', 'c'), min: .1, max: 1.5, step: .01, dec: 2, value: .57, unit: 'GPa', si: a => !!a.p.force}
      ]},
      {titre: 'À faire apparaître', items: [
        {id: 'droite', type: 'check', label: 'Droites prévues par le modèle', value: false, si: a => a.tab === 1},
        {id: 'valeurs', type: 'check', label: 'Valeurs de S_r et S_r / S_a', value: false},
        {id: 'mesures', type: 'check', label: 'Mesures', value: true}
      ]},
      {titre: 'Comparer deux réglages', onglets: [1], items: [
        {type: 'boutons', items: [
          {label: 'Garder la courbe', action: a => garder(a)},
          {label: 'Effacer', action: () => { gardee = null; }}
        ]}
      ]},
      {titre: 'Axes des graphes', onglets: [1], items: [
        {id: 'xmax', type: 'range', label: 'Charge maximale', min: 4, max: RMAX, step: 1, dec: 0, value: RMAX, unit: 'N'},
        {id: 'srmax', type: 'range', label: 'Aire réelle maximale (10⁻³ mm²)', min: 4, max: 40, step: 2, dec: 0, value: 22, unit: ''},
        {id: 'nmax', type: 'range', label: 'Nombre maximal de jonctions', min: 100, max: 600, step: 50, dec: 0, value: 400, unit: ''},
        {id: 'rtmax', type: 'range', label: 'Force maximale', min: 2, max: 30, step: 1, dec: 0, value: 8, unit: 'N', si: a => !!a.p.force}
      ]}
    ],
    aide: {
      voit: '<ul><li><b>Jonctions.</b> La face d’appui du bloc, vue de dessus, et une coupe de l’interface le long du trait noir. Les taches sont les jonctions, seules zones où les deux solides se touchent.</li><li><b>Charge et aire.</b> Les mêmes vues, avec l’aire réelle et le nombre de jonctions en fonction de la réaction normale.</li></ul><p><b>Grossissement.</b> À l’échelle, on ne verrait rien : dans l’application 1, <i>S</i><sub>r</sub>/<i>S</i><sub>a</sub> vaut environ un millionième. La fraction de la face colorée vaut 10 000 fois <i>S</i><sub>r</sub>/<i>S</i><sub>a</sub>. Les valeurs affichées sont les valeurs réelles.</p>',
      faire: '<ul><li>Lancer la lecture : la charge augmente de 1 N par seconde à partir de la valeur réglée. Que font les jonctions ?</li><li>Déplacer le trait de coupe en le faisant glisser.</li><li>À charge égale, prévoir ce que devient l’aire réelle sur une face trois fois plus petite, puis comparer le nombre et la taille des jonctions.</li><li>Prévoir la courbe de l’aire réelle pour un matériau deux fois moins dur.</li><li>Montrer la force de glissement : de quoi dépend le coefficient de frottement ?</li></ul>',
      modele: '<p>Rugosité aléatoire (gaussienne, tirée une fois pour toutes) ; les jonctions sont les zones où les sommets dépasseraient l’écartement des deux solides, qui sont alors aplatis (modèle plastique de Bowden et Tabor). L’écartement est celui qui donne <i>S</i><sub>r</sub> = <i>R</i><sub>N</sub>/<i>σ</i><sub>c</sub> ; en glissement, ‖<i>R</i><sub>T</sub>‖ = <i>τ</i><sub>c</sub><i>S</i><sub>r</sub>. Les deux contraintes se règlent ici séparément ; pour un matériau réel, elles varient ensemble : un métal plus mou se cisaille aussi plus facilement, et <i>f</i> = <i>τ</i><sub>c</sub>/<i>σ</i><sub>c</sub> change peu.</p><p><b>Limites.</b> La proportionnalité de <i>S</i><sub>r</sub> à <i>R</i><sub>N</sub> est une <b>hypothèse</b> du modèle plastique, pas un résultat de la simulation : celle-ci montre comment cette aire se répartit. Le nombre de jonctions dépend du tirage et de la finesse de la rugosité : seules ses variations ont un sens. La matière écrasée n’est pas redistribuée ; ni élasticité, ni croissance des jonctions sous cisaillement, ni adhésion. Chaque réglage correspond à une première mise en charge de surfaces neuves : après décharge, les sommets resteraient aplatis. Aux plus fortes fractions, les taches grossies fusionnent, ce qui n’arrive pas à l’échelle réelle.</p>',
      cours: 'MC2 MP : I.4 (aire réelle de contact, modèle de Bowden et Tabor) et application 1 (aire réelle de contact d’un bloc d’acier).'
    },
    draw(a) {
      sceneFace(a); sceneCoupe(a);
      if (a.tab === 1) { graphe(a, 'sr'); graphe(a, 'nb'); if (a.p.force) graphe(a, 'rt'); }
      mesures(a); legende(a);
      a.clock(a.M.v('R', 'N') + ' = ' + a.fmt.fix(charge(a), 2) + ' N');
    }
  });
})();

</script>
