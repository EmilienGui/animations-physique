  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

function modelE(a){return M4.budget({tc:a.p.e_tc,tf:a.p.e_tf,qc:a.p.e_qc,w:a.p.e_w})}
function modelG(a){const eta=a.p.g_rel*(1-(a.p.g_tf+K0)/(a.p.g_tc+K0));return M4.budget({tc:a.p.g_tc,tf:a.p.g_tf,qc:100,w:-100*eta})}

/* ---------- formules ---------- */
function formules(a){const v=M.v;
  if(a.tab===1)return `${v('η','C')} = 1 − ${M.frac(v('T','f'),v('T','c'))}<br>${v('e','frigo')} = ${M.frac(v('T','f'),v('T','c')+' − '+v('T','f'))} ; ${v('e','PAC')} = ${M.frac(v('T','c'),v('T','c')+' − '+v('T','f'))}<br>${v('Q','c')} / ${v('T','c')} + ${v('Q','f')} / ${v('T','f')} = 0`;
  if(a.tab===2)return `${v('η')} = ${v('x')} × ${v('η','C')} ; valorisation totale = ${v('η')} + ${v('r')}(1 − ${v('η')})`;
  return `${v('W')} + ${v('Q','c')} + ${v('Q','f')} = 0<br>${v('S','c')} = −${M.frac(v('Q','c'),v('T','c'))} − ${M.frac(v('Q','f'),v('T','f'))} ≥ 0`;
}

/* ---------- schéma d'échanges ---------- */
function exchangeScene(a,b){
  const P=a.panels.scene,S=a.S,C=a.C,k=a.k,w=P.w,h=P.h,cogen=a.tab===2;let s='';
  const horiz=w>=640,cw=Math.min(w*(horiz?.26:.4),170*k),ch=84*k,pad=12*k,fr=Math.max(46*k,Math.min(60*k,w*.1));
  const cold=horiz?{x:pad,y:h*.4-ch/2}:{x:pad,y:pad+14*k},hot=horiz?{x:w-pad-cw,y:h*.4-ch/2}:{x:w-pad-cw,y:pad+14*k};
  const fl={x:w/2,y:horiz?h*.4:h*.52};
  const wc={x:w/2,y:h-70*k};
  const card=(p,col,name,T)=>S.rect(p.x,p.y,cw,ch,{fill:C.card,c:col,w:2,rx:8*k})+S.text(p.x+cw/2,p.y+16*k,name,{anchor:'middle',size:14,c:col,weight:600,halo:false})+S.text(p.x+cw/2,p.y+44*k,`${a.fmt.fix(T-K0,0)} °C`,{anchor:'middle',size:22,c:col,weight:600,halo:false})+S.text(p.x+cw/2,p.y+68*k,`${a.fmt.fix(T,0)} K`,{anchor:'middle',size:13,halo:false});
  s+=card(cold,C.cold,cogen?'Réseau de chauffage':'Source froide',b.Tf)+card(hot,C.hot,cogen?'Combustion':'Source chaude',b.Tc);
  s+=S.circle(fl.x,fl.y,fr,{fill:C.cSoft,c:C.cInk,w:2})+S.text(fl.x,fl.y-8*k,'Fluide',{anchor:'middle',size:18,c:C.ink,weight:600,halo:false})+S.text(fl.x,fl.y+14*k,'ΔU = 0',{anchor:'middle',size:13,halo:false});
  const vmax=cogen?100:Math.max(200,Math.abs(b.Qf),Math.abs(b.Qc),Math.abs(b.W));
  const wlab=b.W<=0?'Travail fourni':'Travail reçu',wcw=Math.max(110*k,wlab.length*8.5*k);
  s+=S.rect(wc.x-wcw/2,wc.y,wcw,34*k,{fill:C.card,c:C.v,w:2,rx:7*k})+S.text(wc.x,wc.y+17*k,wlab,{anchor:'middle',size:15,c:C.v,halo:false});
  /* flèches : points de départ (source) et d'arrivée (fluide) */
  const ang=(p,q)=>{const d=Math.hypot(q[0]-p[0],q[1]-p[1]);return[(q[0]-p[0])/d,(q[1]-p[1])/d]};
  const link=(src,col,val,name,side)=>{const dst=[fl.x,fl.y],u=ang(src,dst),p1=[src[0],src[1]],p2=[dst[0]-u[0]*(fr+8*k),dst[1]-u[1]*(fr+8*k)];
    let o=K.energyArrow(a,p1,p2,val,vmax,col,{zero:true,w:5*k/ k*1});
    const mx=(p1[0]+p2[0])/2,my=(p1[1]+p2[1])/2;
    return o+S.text(mx+side*24*k,my,`${name} = ${sg(a,val)} J`,{anchor:side>0?'start':'end',size:15,c:col,weight:600})};
  const cFrom=horiz?[cold.x+cw+8*k,fl.y]:[cold.x+cw*.6,cold.y+ch+8*k],hFrom=horiz?[hot.x-8*k,fl.y]:[hot.x+cw*.4,hot.y+ch+8*k];
  s+=link(cFrom,C.cold,b.Qf,'Qf',-1)+link(hFrom,C.hot,b.Qc,'Qc',1)+link([wc.x,wc.y-8*k],C.v,b.W,'W',1);
  if(cogen){s+=S.text(cold.x+cw/2,cold.y+ch+22*k,`Chaleur valorisée : ${a.fmt.fix(-b.Qf*a.p.g_rate,1)} J`,{anchor:'middle',size:14,c:C.cold,weight:600})}
  /* verdict masqué au départ */
  if(a.p.prev&&!cogen)s+=S.text(w/2,h-12*k,b.allowed?(Math.abs(b.Sc)<1e-8?'Limite réversible : S créée = 0':'Fonctionnement possible : S créée ≥ 0'):'Impossible : S créée < 0',{anchor:'middle',size:16,c:b.allowed?C.v:C.F,weight:700});
  else if(!cogen)s+=S.text(w/2,h-12*k,'Signe + : énergie reçue par le fluide',{anchor:'middle',size:13});
  a.svg('scene',s);
}

/* ---------- plan (Q_c, W) ---------- */
let GP=null;
function planGraph(a,b){
  const P=a.panels.graphe,S=a.S,C=a.C,k=a.k,w=P.w,h=P.h;let s='';
  const G=S.graph({x:0,y:0,w,h,xmin:-200,xmax:200,ymin:-200,ymax:200,xlab:`${S.v('Q','c')} (J)`,ylab:`${S.v('W')} (J)`,xticks:[-200,-100,0,100,200],yticks:[-200,-100,0,100,200]});GP=G;
  s+=S.clip('plan',G)+G.svg;
  const eC=1-b.Tf/b.Tc;
  if(a.p.prev){const yl=q=>-eC*q,pts=[[G.X(-200),G.Y(yl(-200))],[G.X(200),G.Y(yl(200))]];
    s+=`<g clip-path="url(#plan)">`+S.path(`M${pts[0][0]},${pts[0][1]}L${pts[1][0]},${pts[1][1]}L${G.X(200)},${G.Y(200)}L${G.X(-200)},${G.Y(200)}Z`,{fill:C.v,fop:.13,c:null,w:0})
     +S.path(`M${pts[0][0]},${pts[0][1]}L${pts[1][0]},${pts[1][1]}L${G.X(200)},${G.Y(-200)}L${G.X(-200)},${G.Y(-200)}Z`,{fill:C.F,fop:.1,c:null,w:0})+`</g>`
     +S.line(pts[0][0],pts[0][1],pts[1][0],pts[1][1],{c:C.v,w:2.5})
     +S.text(G.X(120),G.Y(-eC*120)+16*k,'S créée = 0',{anchor:'middle',size:13,c:C.v,weight:600})
     +S.text(G.X(-195),G.Y(190),'Possible',{size:14,c:C.v,weight:600,halo:false})+S.text(G.X(195),G.Y(-190),'Impossible',{anchor:'end',size:14,c:C.F,weight:600,halo:false})}
  s+=S.text(G.X(195),G.Y(-12),'moteur',{anchor:'end',size:13,halo:false})+S.text(G.X(-195),G.Y(14),'récepteur',{size:13,halo:false});
  s+=S.circle(G.X(a.p.e_qc),G.Y(a.p.e_w),8*k,{fill:a.p.prev?(b.allowed?C.v:C.F):C.cInk,c:C.paper,w:2});
  a.svg('graphe',s);a.legend([]);
}
A.drag('graphe',{hit:(x,y)=>A.tab===0&&GP&&Math.hypot(GP.X(A.p.e_qc)-x,GP.Y(A.p.e_w)-y)<26*A.k,
  move(x,y){A.set('e_qc',Math.round(clamp(GP.xv(x),-200,200)),{silent:true});A.set('e_w',Math.round(clamp(GP.yv(y),-200,200)),{silent:true})}});

/* ---------- cogénération : répartition de 100 J ---------- */
function cogenGraph(a,b){
  const P=a.panels.graphe,S=a.S,C=a.C,k=a.k,w=P.w,h=P.h;let s='';const useful=-b.Qf*a.p.g_rate,loss=-b.Qf-useful;
  s+=S.text(w/2,22*k,'Pour 100 J reçus de la source chaude',{anchor:'middle',size:16,c:C.ink,weight:600,halo:false});
  if(a.p.prev){const x=24*k,bw=w-48*k,rows=[['Travail',-b.W,C.v],['Chaleur valorisée',useful,C.cold],['Chaleur non valorisée',loss,C.pred]],dy=Math.min(86*k,(h-150*k)/3);
    rows.forEach(([l,v,c],i)=>{const y=62*k+i*dy;s+=S.text(x,y,l,{size:15,c,halo:false})+S.text(x+bw,y,`${a.fmt.fix(v,1)} J`,{anchor:'end',size:17,c,weight:600,halo:false})+S.rect(x,y+14*k,bw,12*k,{fill:C.card,c:C.rule,rx:3*k})+S.rect(x,y+14*k,bw*clamp(v/100,0,1),12*k,{fill:c,rx:3*k})});
    const y=h-62*k;s+=S.line(x,y-14*k,x+bw,y-14*k,{c:C.rule,w:1})+S.text(x,y+4*k,'Rendement moteur',{size:15,halo:false})+S.text(x+bw,y+4*k,`${a.fmt.fix(-b.W,1)} %`,{anchor:'end',size:20,c:C.v,weight:600,halo:false})+S.text(x,y+30*k,'Valorisation totale',{size:15,halo:false})+S.text(x+bw,y+30*k,`${a.fmt.fix(-b.W+useful,1)} %`,{anchor:'end',size:20,c:C.cInk,weight:600,halo:false})}
  else s+=S.text(w/2,h/2,'Prévoir la répartition, puis afficher les résultats',{anchor:'middle',size:15,halo:false});
  a.svg('graphe',s);a.legend([]);
}

/* ---------- Carnot ---------- */
let plotC=null;
function drawCarnot(a){
  const c=modelC(a),d=c.sample(U),rev=!!a.p.c_rev,P=a.panels.scene,S=a.S,C=a.C,k=a.k,w=P.w,h=P.h;let s='';
  const fi=d.forwardStep??d.step,disp=d.step,cols=[C.hot,C.v,C.cold,C.v];
  const Vlo=c.states[0].V,Vhi=c.states[2].V,f=clamp((d.V-Vlo)/(Vhi-Vlo),0,1);
  const bw=Math.min(w*.24,120*k),top=46*k,Hs=Math.max(80*k,h-top-150*k),cx=w/2,dead=Hs*.18;
  const cyl=K.cylinder(a,cx,top,bw,Hs,f,{dead,gas:K.tcol(d.T,280,700),gop:.55,wallw:3.2});
  const zy1=top,zy2=top+dead+Hs;
  const hotOn=fi===0,coldOn=fi===2,adia=fi===1||fi===3,gap=18*k,bl=Math.min(w*.2,100*k);
  const blk=(x,col,on,name,T)=>S.rect(x,zy1,bl,zy2-zy1,{fill:col,fop:on?.3:.1,c:col,w:on?2.5:1,dash:on?undefined:`${4*k} ${4*k}`,rx:5*k})+S.text(x+bl/2,zy1+(zy2-zy1)/2-10*k,name,{anchor:'middle',size:14,c:col,weight:600,halo:false})+S.text(x+bl/2,zy1+(zy2-zy1)/2+12*k,`${a.fmt.fix(T-K0,0)} °C`,{anchor:'middle',size:14,c:col,halo:false});
  const xh=cx-bw/2-(hotOn?0:gap)-bl,xc=cx+bw/2+(coldOn?0:gap);
  s+=blk(xh,C.hot,hotOn,'Source chaude',c.Tc)+blk(xc,C.cold,coldOn,'Source froide',c.Tf);
  s+=cyl.s;
  if(adia){for(const sx of[-1,1]){const x=cx+sx*(bw/2+5*k);s+=S.line(x,zy1+4*k,x,zy2-4*k,{c:C.pred,w:7*k,op:.55})}
    s+=S.text(cx,zy1-14*k,'Parois isolées · Q = 0',{anchor:'middle',size:14,c:C.pred,weight:600})}
  /* flèches Q (échange de l'étape) et W (travail de l'étape), proportionnelles */
  const st=c.steps[fi],dir=rev?-1:1,Qs=st.Q*dir,Ws=st.W*dir,Qm=Math.max(Math.abs(c.steps[0].Q),Math.abs(c.steps[2].Q)),Wm=Math.max(...c.steps.map(z=>Math.abs(z.W)));
  if(hotOn)s+=K.energyArrow(a,[xh+bl+2*k,zy1+(zy2-zy1)*.75],[cx-bw/2-2*k,zy1+(zy2-zy1)*.75],Qs,Qm,C.hot,{w:5});
  if(coldOn)s+=K.energyArrow(a,[xc-2*k,zy1+(zy2-zy1)*.75],[cx+bw/2+2*k,zy1+(zy2-zy1)*.75],Qs,Qm,C.cold,{w:5});
  if(hotOn||coldOn)s+=S.text(hotOn?xh+bl+(cx-bw/2-xh-bl)/2:cx+bw/2+(xc-cx-bw/2)/2,zy1+(zy2-zy1)*.75-16*k,`Q = ${sg(a,Qs)} J`,{anchor:'middle',size:14,c:hotOn?C.hot:C.cold,weight:600});
  s+=K.energyArrow(a,[cx,cyl.bottom+40*k],[cx,cyl.bottom+4*k],Ws,Wm,C.v,{w:5})+S.text(cx+14*k,cyl.bottom+26*k,`W = ${sg(a,Ws)} J`,{size:14,c:C.v,weight:600});
  s+=S.text(w/2,h-12*k,NOMS_CARNOT(rev)[disp]+' · le piston représente un gaz fermé (modèle)',{anchor:'middle',size:14,c:C.cInk,weight:600});
  a.svg('scene',s);
  const plot=K.cyclePlot(a,'graphe',c,U,a.p.diag,{cols,fill:a.p.prev,lab:[-1,1,1,-1]});plotC=plot;
  const lg=[{c:C.hot,label:'Isotherme chaude'},{c:C.v,label:'Adiabatique'},{c:C.cold,label:'Isotherme froide'}];a.legend(lg);
  a.clock(`phase ${a.fmt.fix(U*100,0)} %`);
}
K.cycleDrag(A,'graphe',()=>plotC,u=>{U=u;A.t=u*DUREE},()=>A.tab===1);

/* ---------- mesures ---------- */
function infos(a){
  const v=M.v,f=a.fmt,m=[];
  if(a.tab===1){const c=modelC(a);
    if(a.p.prev){const rev=a.p.c_rev;m.push({label:`${v('Q','c')}`,value:sg(a,c.Qc),unit:'J',hint:'Source chaude'},{label:`${v('Q','f')}`,value:sg(a,c.Qf),unit:'J',hint:'Source froide'},{label:`${v('W')}`,value:sg(a,c.W),unit:'J',hint:'Travail reçu sur le cycle'});
      m.push(rev?{label:`${v('e','frigo')} · ${v('e','PAC')}`,value:`${f.fix(c.ef,2)} · ${f.fix(c.ep,2)}`,hint:'Efficacités de Carnot'}:{label:v('η','C'),value:f.fix(c.eta*100,1),unit:'%',hint:`1 − ${f.fix(c.Tf,0)}/${f.fix(c.Tc,0)}`})}
    if(a.p.err){const bad=1-a.p.c_tf/a.p.c_tc;m.push({label:'Erreur fréquente (°C)',value:f.fix(bad*100,1),unit:'%',warn:true,hint:`≠ ${f.fix(c.eta*100,1)} % : utiliser les kelvins`})}
  }else if(a.tab===0){const b=modelE(a);
    if(a.p.prev){m.push({label:`${v('S','c')}`,value:sg(a,b.Sc,3),unit:'J·K<sup>−1</sup>',warn:!b.allowed,hint:b.allowed?'≥ 0 : possible':'< 0 : impossible'});
      const recv=b.type==='récepteur';
      if(b.type==='moteur')m.push({label:v('η'),value:f.fix(b.eta*100,1),unit:'%',hint:`Carnot : ${f.fix(b.etaMax*100,1)} %`});
      else if(recv)m.push({label:`${v('e','frigo')} · ${v('e','PAC')}`,value:`${f.fix(b.ef,2)} · ${f.fix(b.ep,2)}`,hint:Number.isFinite(b.efMax)?`Carnot : ${f.fix(b.efMax,2)} · ${f.fix(b.epMax,2)}`:'Sources à même température'});
      else m.push({label:'Type de machine',value:b.type==='dissipateur'?'Dissipateur':'Autre',hint:'Ni moteur ni récepteur ditherme'})}
    if(a.p.err&&b.type==='moteur'&&b.Tc>0){const bad=1-a.p.e_tf/a.p.e_tc;m.push({label:'Erreur fréquente (°C)',value:isFinite(bad)?f.fix(bad*100,1):'—',unit:'%',warn:true,hint:`≠ ${f.fix(b.etaMax*100,1)} % : utiliser les kelvins`})}
  }else{const b=modelG(a);if(a.p.prev)m.push({label:'Travail fourni',value:f.fix(-b.W,1),unit:'J',hint:'Pour 100 J reçus'},{label:'Chaleur valorisée',value:f.fix(-b.Qf*a.p.g_rate,1),unit:'J'},{label:'Rendement moteur',value:f.fix(b.eta*100,1),unit:'%',hint:`Carnot : ${f.fix(b.etaMax*100,1)} %`})}
  a.metrics(m);
}
