  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

<script>
/* OP1 · Fibres optiques : moteur physique d'origine (24 octobre 2026), repris sans modification.
   Saut d'indice et gradient n² = nc² − (nc² − ng²)(y/a)², invariant k = n cos θ′, temps = ∫ n ds / c. */
window.FibreModel = (() => {
 const C = .299792458, RAD = Math.PI/180, EPS=1e-11;
 function validate(p){
  for(const key of ['nc','ng','n0','radius','offset','length'])if(!Number.isFinite(p[key]))throw new RangeError('Paramètre non fini');
  if(p.nc<1.1||p.nc>1.8||p.ng<1||p.ng>p.nc||p.n0<1||p.n0>1.5||p.radius<5||p.radius>100||Math.abs(p.offset)>.85||p.length<.01||p.length>5)throw new RangeError('Paramètres hors domaine');
 }
 function index(p,kind,y){return kind==='graded'?Math.sqrt(p.nc*p.nc-(p.nc*p.nc-p.ng*p.ng)*Math.min(1,y*y)):Math.abs(y)<=1?p.nc:p.ng;}
 function acceptance(p,kind){const n=index(p,kind,p.offset),on=Math.sqrt(Math.max(0,n*n-p.ng*p.ng));return {on,angle:Math.asin(Math.min(1,on/p.n0))/RAD,saturated:on>=p.n0};}
 function ray(p,kind,theta){
  validate(p);if(!['step','graded'].includes(kind)||!Number.isFinite(theta)||Math.abs(theta)>89.999)throw new RangeError('Rayon hors domaine');
  const n=index(p,kind,p.offset),q=p.n0*Math.sin(theta*RAD),D=p.nc*p.nc-p.ng*p.ng;
  if(Math.abs(q)>=n)return {kind,theta,n,q,entered:false,guided:false,limiting:false,p};
  const k=Math.sqrt(n*n-q*q),s=q/k,graded=kind==='graded'&&D>EPS,w=graded?Math.sqrt(D)/k:0,A=p.offset,B=graded?q/Math.sqrt(D):0;
  const matched=D<EPS,limiting=!matched&&Math.abs(k-p.ng)<EPS,guided=!matched&&k>p.ng+EPS;
  let hit=Infinity,side=0;
  if(graded&&!guided&&!limiting){
   const amp=Math.hypot(A,B),phi=Math.atan2(A,B);
   if(amp>=1){for(const sign of [-1,1]){const alpha=Math.asin(sign/amp);for(const root of [alpha,Math.PI-alpha]){let delta=((root-phi)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);if(delta<1e-12)delta+=2*Math.PI;const u=delta/w;if(u<hit){hit=u;side=sign;}}}}
  }else if(!graded&&Math.abs(s)>EPS){side=Math.sign(s);hit=(side-A)/s;}
  const r={kind,theta,n,q,k,s,D,graded,w,A,B,matched,guided,limiting,entered:true,hit,side,p,thetaPrime:Math.atan(s)/RAD,incidence:90-Math.abs(Math.atan(s)/RAD)};
  const end=p.length*1e9/p.radius;
  r.received=guided||(graded&&limiting)||(!limiting&&end<hit);
  r.tau=r.received?time(r,end):null;
  return r;
 }
 function rawY(r,u){return r.graded?r.A*Math.cos(r.w*u)+r.B*Math.sin(r.w*u):r.A+r.s*u;}
 function position(r,u){
  if(!r.entered)return null;
  if(r.graded&&(r.guided||r.limiting||u<=r.hit))return rawY(r,u);
  if(!r.graded&&r.guided){const v=r.A+r.s*u+1,phase=((v%4)+4)%4;return phase<=2?phase-1:3-phase;}
  if(u<=r.hit||!Number.isFinite(r.hit))return rawY(r,u);
  const outerSlope=r.side*Math.sqrt(Math.max(0,r.p.ng*r.p.ng-r.k*r.k))/r.k;
  return r.side+outerSlope*(u-r.hit);
 }
 function coreIntegral(r,u){
  if(!r.graded)return r.p.nc*r.p.nc*u;
  const x=r.w*u;
  // Taylor expansion prevents cancellation near u=0 or a very small index contrast.
  let iy2;
  if(Math.abs(x)<1e-4){
   const a=r.A,b=r.B;
   iy2=(a*a*x+a*b*x*x+(b*b-a*a)*x*x*x/3-a*b*x**4/3+(a*a-b*b)*x**5/15)/r.w;
  }else iy2=(r.A*r.A+r.B*r.B)*u/2+(r.A*r.A-r.B*r.B)*Math.sin(2*x)/(4*r.w)+r.A*r.B*Math.sin(x)**2/r.w;
  return r.p.nc*r.p.nc*u-r.D*iy2;
 }
 function time(r,u){
  if(!r.entered||u<0)return NaN;
  if(!r.guided&&(!r.limiting||!r.graded)&&u>r.hit)return (coreIntegral(r,r.hit)+r.p.ng*r.p.ng*(u-r.hit))*r.p.radius*1e-6/(C*r.k);
  return coreIntegral(r,u)*r.p.radius*1e-6/(C*r.k);
 }
 function distanceAtTime(r,t,maxU){
  if(t<=0)return 0;if(t>=time(r,maxU))return maxU;
  let lo=0,hi=maxU;for(let j=0;j<42;j++){const mid=(lo+hi)/2;if(time(r,mid)<t)lo=mid;else hi=mid;}return (lo+hi)/2;
 }
 function samples(p,kind,theta){return [0,.25,.5,.75,1].map(f=>ray(p,kind,theta*f));}
 function spread(rays){const ts=rays.filter(r=>r.received&&r.tau!==null).map(r=>r.tau);return ts.length?Math.max(...ts)-Math.min(...ts):null;}
 function signal(t,taus,width,gap,two){const sigma=width/(2*Math.sqrt(2*Math.log(2)));let value=0;for(const tau of taus){value+=Math.exp(-.5*((t-tau)/sigma)**2)/5;if(two)value+=Math.exp(-.5*((t-tau-gap)/sigma)**2)/5;}return value;}
 return Object.freeze({C,RAD,index,acceptance,ray,position,time,distanceAtTime,samples,spread,signal,validate});
})();

// @titre Fibres optiques · OP1 · MPSI
// @sortie ../OP1_Fibres_Optiques/OP1_Fibres_Optiques.html
// @inclure OP1_Fibres_Optiques_physique.js
// @description Guidage par réflexion totale, cône d'acceptance, fibres à saut et à gradient d'indice, dispersion intermodale d'une impulsion.
'use strict';
/* =====================================================================
   OP1 · Fibres optiques
   Physique : FibreModel (OP1_Fibres_Optiques_physique.js, moteur d'origine inchangé).
   Notations du cours : θ angle d'entrée avec l'axe, θ′ angle du rayon réfracté avec l'axe,
   i incidence sur l'interface cœur–gaine, n0 sin θmax = √(nc² − ng²), ΔTm = nc (nc/ng − 1) L/c.
   Gradient : n²(y) = nc² − (nc² − ng²)(y/a)², invariant k = n cos θ′, temps = ∫ n ds / c.
   ===================================================================== */
const FM=window.FibreModel, M=AnimKit.M, RAD=Math.PI/180;
let cache=null, cacheKey='', st={clock:0,period:1e-3,lx:null};
const mp=a=>({nc:a.p.nc,ng:a.p.ng,n0:a.p.n0,radius:a.p.rc,offset:a.p.y0,length:a.p.L});
const angCols=a=>[a.C.ink2,a.C.B,a.C.E,a.C.dark?'#c39bff':'#7a3fc0',a.C.F];

function calc(a){
  const key=JSON.stringify([a.p.nc,a.p.ng,a.p.n0,a.p.rc,a.p.y0,a.p.L,a.p.theta,a.p.width,a.p.gap,a.p.deux]); if(key===cacheKey)return cache;
  const p=mp(a), c={};
  for(const kd of['step','graded']){const rays=FM.samples(p,kd,a.p.theta);c[kd]={sel:FM.ray(p,kd,a.p.theta),rays,received:rays.filter(r=>r.received),acc:FM.acceptance(p,kd),spread:FM.spread(rays)}}
  c.ref=p.nc*p.length*1000/FM.C;
  const ts=[...c.step.received,...c.graded.received].map(r=>r.tau-c.ref), sig=a.p.width/2.354820045;
  c.lo=Math.min(-3.5*sig,...ts.map(t=>t-3.5*sig)); c.hi=Math.max(3.5*sig,...ts.map(t=>t+3.5*sig))+(a.p.deux?a.p.gap:0);
  c.arrival=Math.max(0,c.ref+c.lo); c.end=c.ref+c.hi;
  c.dTm=p.nc*(p.nc/p.ng-1)*p.length*1000/FM.C;
  cache=c; cacheKey=key; return c;
}

    const T=FM.time(r,maxU);times.push(T);
    if(st.clock<=T){const u=FM.distanceAtTime(r,st.clock,maxU),y=FM.position(r,u);if(Math.abs(y)<=RG+.6){const q=Pp(W3(y,u/comp));dots+=S.circle(q[0],q[1],4.5*k,{fill:col,c:C.card,w:1.2})}}
  });
  s+=g+dots;
  const tg=Pp([0,RG,Lm*.8]),tc=Pp([0,-RG,Lm*.8]);
  s+=S.text(tg[0],tg[1]-6*k,`gaine · ${S.v('n','g')} = ${f.fix(p.ng,3)}`,{anchor:'middle',base:'bottom',size:14,c:C.cInk});
  s+=S.text(tc[0],tc[1]+6*k,kd==='graded'?`cœur · ${S.v('n')} de ${f.fix(p.nc,3)} à ${f.fix(p.ng,3)}`:`cœur · ${S.v('n','c')} = ${f.fix(p.nc,3)}`,{anchor:'middle',base:'top',size:14,c:C.ink});
  s+=S.text(10*k,8*k,'glisser pour tourner',{base:'top',size:13});
  s+=S.text(W-10*k,H-8*k,`z comprimé × ${f.sig(comp,2)} · rayons méridiens · gaine schématique`,{anchor:'end',base:'bottom',size:13});
  st.lx=null;
  return s;
}

/* ===================== signal transmis ===================== */
function signal(a,c){
  const P=a.panels.signal,W=P.w,H=P.h,S=a.S,C=a.C,k=a.k,p=a.p,f=a.fmt,cols=angCols(a),clock=st.clock;
  const left=Math.min(96*k,W*.2),right=W-14*k,span=right-left,topH=Math.min(150*k,H*.32);
  let s=S.text(10*k,6*k,`avancement de chaque rayon le long de la fibre, de 0 à ${S.v('L')} (une ligne par rayon)`,{base:'top',size:14});
  const maxU=p.L*1e9/p.rc;
  ['step','graded'].forEach((kd,row)=>{
    const y=28*k+row*(topH-24*k)/2, band=(topH-40*k)/2;
    s+=S.text(10*k,y+band*.4,kd==='step'?'Saut':'Gradient',{size:14,c:C.cInk});
    c[kd].rays.forEach((r,j)=>{const yy=y+j*Math.max(3.5*k,band/5.5);s+=S.line(left,yy,right,yy,{c:C.rule,w:1});if(!r.received)return;
      if(clock<=r.tau)s+=S.circle(left+span*FM.distanceAtTime(r,clock,maxU)/maxU,yy,3.6*k,{fill:cols[j]});
      if(p.deux&&clock>=p.gap&&clock<=p.gap+r.tau)s+=S.circle(left+span*FM.distanceAtTime(r,clock-p.gap,maxU)/maxU,yy,3.6*k,{fill:cols[j],c:C.card,w:1})});
  });
  s+=S.text(left,topH+2*k,'0',{size:13,anchor:'middle',base:'top'})+S.text(right,topH+2*k,S.v('L'),{size:13,anchor:'middle',base:'top'});
  const ct=topH+20*k, ch=(H-ct-30*k)/2, lo=c.lo, hi=c.hi, X=t=>left+(t-lo)/(hi-lo)*span, cx=X(clock-c.ref), visible=cx>=left&&cx<=right;
  ['step','graded'].forEach((kd,row)=>{
    const tp=ct+row*ch, bot=tp+ch-20*k, amp=ch-34*k;
    s+=S.text(10*k,tp+amp*.5,kd==='step'?'Saut':'Gradient',{size:14,c:C.cInk});
    s+=S.line(left,bot,right,bot,{c:C.ink2,w:1})+S.line(left,bot-amp,right,bot-amp,{c:C.rule,w:1,dash:`${3*k} ${5*k}`});
    s+=S.text(left-6*k,bot,'0',{anchor:'end',size:13})+S.text(left-6*k,bot-amp,'1',{anchor:'end',size:13});
    for(const t of AnimKit.ticks(lo,hi,Math.max(3,Math.round(span/(70*k))))){const x=X(t);s+=S.line(x,bot,x,bot+4*k,{c:C.ink2,w:1})+S.text(x,bot+5*k,f.fix(t,0),{anchor:'middle',base:'top',size:13})}
    const taus=c[kd].received.map(r=>r.tau-c.ref), out=[], ref=[], N=Math.max(300,Math.min(1200,Math.ceil(span))), lim=p.tout?hi:clock-c.ref;
    for(let i=0;i<=N;i++){const t=lo+(hi-lo)*i/N;ref.push([X(t),bot-FM.signal(t,[0,0,0,0,0],p.width,p.gap,p.deux)*amp]);if(t<=lim)out.push([X(t),bot-FM.signal(t,taus,p.width,p.gap,p.deux)*amp])}
    s+=S.poly(ref,{c:C.ink2,w:1.4,dash:`${5*k} ${5*k}`,op:.75})+S.poly(out,{c:row===0?C.B:C.F,w:2.6});
    for(const tau of taus)if(p.tout||tau<=clock-c.ref)s+=S.line(X(tau),bot,X(tau),bot-8*k,{c:C.cInk,w:2});
    if(visible)s+=S.line(cx,tp+2*k,cx,bot,{c:C.E,w:1.8,dash:`${4*k} ${3*k}`});
  });
  s+=S.text(right,H-4*k,`${S.v('t')} − τ<tspan font-size="72%" dy="0.42em">réf</tspan><tspan dy="-0.42em"> (ns) · pointillés : impulsion d'entrée décalée de τ</tspan><tspan font-size="72%" dy="0.42em">réf</tspan>`,{anchor:'end',base:'bottom',size:13});
  a.svg('signal',s);
}

/* ===================== interactions ===================== */
A.drag('fibre',{
  hit:(x,y)=>A.tab===0&&(A.p.vue==='structure'||!!st.lx&&Math.hypot(x-st.lx.lx,y-st.lx.ly)<40*A.k),
  start(x,y){st.cam=A.p.vue==='structure'?{x,y,yaw:cam.yaw,pitch:cam.pitch}:null},
  move(x,y){if(st.cam){cam.yaw=Math.max(-1.45,Math.min(1.45,st.cam.yaw+(x-st.cam.x)*.006));cam.pitch=Math.max(-.2,Math.min(1.3,st.cam.pitch+(y-st.cam.y)*.005));return}
    const g=st.lx;if(!g)return;const t=Math.atan(Math.tan(Math.atan2(y-g.eY,Math.max(12,g.x0-x)))/g.q)/RAD;A.set('theta',Math.max(-75,Math.min(75,Math.round(t*10)/10)))}
});

</script>
