  /** d décimales fixes */
  fix(x,d=2){
    if(x===null||x===undefined||!isFinite(x))return '—';
    let s=(Math.abs(x)<0.5*10**-d?0:x).toFixed(d);
    return s.replace('-',MINUS);
  },
  /** puissance de dix lisible : 3.0 × 10⁻⁵ */
  sci(x,n=2){
    if(!isFinite(x))return '—';
    if(x===0)return '0';
    const e=Math.floor(Math.log10(Math.abs(x)));
    if(e>=-2&&e<=3)return fmt.sig(x,n);
    return fmt.sig(x/10**e,n)+' × 10<sup>'+String(e).replace('-',MINUS)+'</sup>';
  },
  /** angle en degrés depuis des radians */
  deg(rad,d=0){return fmt.fix(rad*180/Math.PI,d)}
};

/* ---------------- graduations ---------------- */
function niceStep(range,n){
  const raw=range/Math.max(1,n), p=10**Math.floor(Math.log10(raw)), r=raw/p;
  return (r<1.5?1:r<3?2:r<7?5:10)*p;
}
function ticks(a,b,n=5){
  if(!(b>a))return[a];
  const st=niceStep(b-a,n), out=[];
  for(let v=Math.ceil(a/st-1e-9)*st;v<=b+st*1e-9;v+=st)out.push(Math.abs(v)<st*1e-9?0:+v.toPrecision(12));
  return out;
}
function tickLabel(v,step){
  const d=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
  return fmt.fix(v,d);
}

function chartTicks(list, min, max, count, formatter, zoomed){
  if(!list||zoomed&&list.length&&!formatter)return ticks(min,max,count);
  if(!zoomed)return list;
  const marge=(max-min)*1e-8;
  return list.filter(v=>v>=min-marge&&v<=max+marge);
}

/* ---------------- dessin SVG (chaînes) ---------------- */
function makeS(app){
  const C=()=>app.C, k=()=>app.k;
  const a=(o,name,val)=>val===undefined||val===null||val===false?'':` ${name}="${val}"`;
  const n=v=>typeof v==='number'?+v.toFixed(2):v;
  const S={
    FONT,MATH,
    /** variable en italique avec indice/exposant, utilisable dans S.text */
    v(sym,sub,sup){
      let s=`<tspan font-family='${MATH}' font-style="italic">${sym}</tspan>`;
      if(sub!==undefined)s+=`<tspan font-size="72%" dy="0.42em">${sub}</tspan><tspan dy="-0.3em">​</tspan>`;
      if(sup!==undefined)s+=`<tspan font-size="72%" dy="-0.55em">${sup}</tspan><tspan dy="0.4em">​</tspan>`;
      return s;
    },
    /** exposant dans un texte SVG (unités : m·s⁻¹…) */
    sup:x=>`<tspan font-size="72%" dy="-0.55em">${x}</tspan><tspan dy="0.4em">\u200b</tspan>`,
    /** symbole droit en police mathématique */
    r:sym=>`<tspan font-family='${MATH}'>${sym}</tspan>`,
    line(x1,y1,x2,y2,o={}){return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)}${a(o,'stroke-linecap',o.cap||'round')}${a(o,'opacity',o.op)}/>`},
    path(d,o={}){return`<path d="${d}" fill="${o.fill||'none'}" stroke="${o.c===undefined?C().ink:o.c}" stroke-width="${n((o.w??1.5)*(o.raw?1:k()))}"${a(o,'stroke-dasharray',o.dash)} stroke-linejoin="round" stroke-linecap="round"${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}/>`},
    poly(pts,o={}){if(pts.length<2)return'';return S.path('M'+pts.map(p=>n(p[0])+','+n(p[1])).join('L')+(o.close?'Z':''),o)},
    circle(x,y,r,o={}){return`<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1.5)*k())}"`:''}${a(o,'opacity',o.op)}${a(o,'stroke-dasharray',o.dash)}${a(o,'data-hit',o.hit)}${a(o,'style',o.style)}/>`},
    rect(x,y,w,h,o={}){return`<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" fill="${o.fill||'none'}"${o.c?` stroke="${o.c}" stroke-width="${n((o.w??1)*k())}"`:''}${a(o,'rx',o.rx)}${a(o,'opacity',o.op)}${a(o,'fill-opacity',o.fop)}${a(o,'stroke-dasharray',o.dash)}/>`},
    /** flèche : pointe proportionnelle à l'épaisseur */
    arrow(x1,y1,x2,y2,o={}){
      const w=(o.w??2)*k(), L=Math.hypot(x2-x1,y2-y1); if(L<1)return'';
      const hl=Math.min(o.head??(6+w*2.6),L*.6), an=Math.atan2(y2-y1,x2-x1), c=o.c||C().ink;
      const bx=x2-hl*.75*Math.cos(an), by=y2-hl*.75*Math.sin(an);
      return`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(bx)}" y2="${n(by)}" stroke="${c}" stroke-width="${n(w)}" stroke-linecap="round"${a(o,'stroke-dasharray',o.dash)}${a(o,'opacity',o.op)}/>`+
        `<path d="M${n(x2)},${n(y2)}L${n(x2-hl*Math.cos(an-.4))},${n(y2-hl*Math.sin(an-.4))}L${n(x2-hl*Math.cos(an+.4))},${n(y2-hl*Math.sin(an+.4))}Z" fill="${c}"${a(o,'opacity',o.op)}/>`;
    },
    /** texte avec halo de la couleur du fond (ne masque pas la scène) */
    text(x,y,content,o={}){
      const size=(o.size??13)*k(), halo=o.halo===false?'':` style="paint-order:stroke;stroke:${o.bg||C().card};stroke-width:${n(3.5*k())}px;stroke-linejoin:round"`;
      const anc=o.anchor||'start', dy=o.base==='top'?'0.8em':o.base==='bottom'?'0':'0.35em';
      return`<text x="${n(x)}" y="${n(y)}" dy="${dy}" text-anchor="${anc}" font-size="${n(size)}" font-family='${o.math?MATH:FONT}' fill="${o.c||C().ink2}"${o.weight?` font-weight="${o.weight}"`:''}${o.italic?' font-style="italic"':''}${halo}${a(o,'transform',o.rot!==undefined?`rotate(${o.rot} ${n(x)} ${n(y)})`:undefined)}>${content}</text>`;
    },
    /** arc d'angle orienté de a1 à a2 (radians, sens trigonométrique, y vers le haut) */
    arc(cx,cy,r,a1,a2,o={}){
      const p=t=>[cx+r*Math.cos(t),cy-r*Math.sin(t)], [x1,y1]=p(a1), [x2,y2]=p(a2), large=Math.abs(a2-a1)>Math.PI?1:0, sweep=a2>a1?0:1;
      let s=`<path d="M${n(x1)},${n(y1)}A${n(r)},${n(r)} 0 ${large} ${sweep} ${n(x2)},${n(y2)}" fill="none" stroke="${o.c||C().ink}" stroke-width="${n((o.w??1.5)*k())}"/>`;
      if(o.arrow&&Math.abs(a2-a1)>0.08){const t=a2, d=a2>a1?1:-1, tx=-Math.sin(t)*d, ty=-Math.cos(t)*d, hl=6*k();
        s+=`<path d="M${n(x2)},${n(y2)}L${n(x2-hl*tx-hl*.45*Math.cos(t))},${n(y2-hl*ty+hl*.45*Math.sin(t))}L${n(x2-hl*tx+hl*.45*Math.cos(t))},${n(y2-hl*ty-hl*.45*Math.sin(t))}Z" fill="${o.c||C().ink}"/>`}

    },
    /**
     * repère de graphe ; renvoie {svg, X, Y, x0,y0,w,h}
     * o = {x,y,w,h, xmin,xmax,ymin,ymax, xlab, ylab, nx, ny, grid, xticks, yticks}
     */
    graph(o){
      const C0=C(), K=k(), fs=12*K, padL=o.padL??(fs*3.2), padB=o.padB??(fs*2.3), padT=o.padT??(fs*1.4), padR=o.padR??(fs*.8);
      const x0=o.x+padL, y0=o.y+padT, w=Math.max(10,o.w-padL-padR), h=Math.max(10,o.h-padT-padB);
      const frame=app._graphFrame, id=frame?.graphs.length;
      const view=frame?.views[id]||null;
      frame?.graphs.push({id,x0,y0,w,h,view});
      const dx=o.xmax-o.xmin, dy=o.ymax-o.ymin;
      const xmin=view?o.xmin+dx*view.vx:o.xmin, xmax=view?xmin+dx/view.vz:o.xmax;
      const ymax=view?o.ymax-dy*view.vy:o.ymax, ymin=view?ymax-dy/view.vz:o.ymin;
      const X=v=>x0+(v-xmin)/(xmax-xmin)*w, Y=v=>y0+h-(v-ymin)/(ymax-ymin)*h;
      let s='';
      const xt=chartTicks(o.xticks,xmin,xmax,o.nx??Math.max(2,Math.round(w/(fs*5.5))),o.xfmt,view);
      const yt=chartTicks(o.yticks,ymin,ymax,o.ny??Math.max(1,Math.round(h/(fs*3))),o.yfmt,view);
      const xs=xt.length>1?xt[1]-xt[0]:1, ys=yt.length>1?yt[1]-yt[0]:1;
      if(o.grid!==false){for(const v of xt)s+=`<line x1="${n(X(v))}" y1="${n(y0)}" x2="${n(X(v))}" y2="${n(y0+h)}" stroke="${C0.grid}" stroke-width="1"/>`;
        for(const v of yt)s+=`<line x1="${n(x0)}" y1="${n(Y(v))}" x2="${n(x0+w)}" y2="${n(Y(v))}" stroke="${C0.grid}" stroke-width="1"/>`}
      s+=S.line(x0,y0+h,x0+w,y0+h,{c:C0.ink2,w:1.2,raw:true});
      s+=S.line(x0,y0,x0,y0+h,{c:C0.ink2,w:1.2,raw:true});
      if(ymin<0&&ymax>0&&o.zeroAxis!==false)s+=S.line(x0,Y(0),x0+w,Y(0),{c:C0.ink2,w:1,raw:true});
      for(const v of xt){if(o.xlabels===false)break;s+=S.text(X(v),y0+h+fs*.9,(o.xfmt||tickLabel)(v,xs),{anchor:'middle',size:12,halo:false})}
      for(const v of yt){if(o.ylabels===false)break;s+=S.text(x0-fs*.4,Y(v),(o.yfmt||tickLabel)(v,ys),{anchor:'end',size:12,halo:false})}
      if(o.xlab)s+=S.text(x0+w,y0+h+fs*1.95,o.xlab,{anchor:'end',size:12.5,halo:false,c:C0.ink2});
      if(o.ylab)s+=S.text(x0+fs*.3,y0-fs*.75,o.ylab,{anchor:'start',size:12.5,halo:false,c:C0.ink2});
      if(frame)s=`<g data-ak-graph="${id}">${s}</g>`;
      return{svg:s,X,Y,x0,y0,w,h,xv:px=>xmin+(px-x0)/w*(xmax-xmin),yv:py=>ymax-(py-y0)/h*(ymax-ymin)};
    },
    /** courbe d'un tableau de points [x,y] dans un repère (coupe hors cadre) */
    curve(pts,G,o={}){

        const X=G.X(x), Y=Math.max(G.y0-2e3,Math.min(G.y0+G.h+2e3,G.Y(y)));d+=(pen?'L':'M')+n(X)+','+n(Y);pen=true}

    },
    clip(id,G){G.clip=id;return`<defs><clipPath id="${id}"><rect x="${n(G.x0)}" y="${n(G.y0-1)}" width="${n(G.w+1)}" height="${n(G.h+2)}"/></clipPath></defs>`}

      N.addEventListener('dblclick',e=>{const[x,y]=toV(scr(e));if(!P._drags.some(d=>d.hit&&d.hit(x,y,e))&&zoomed(P))A.cadrer(P)});
      N.addEventListener('pointerenter',()=>{A._hover=P});
    }
  }
  for(const P of Object.values(A.panels))wire(P);
  A.drag=(id,h)=>{A.panels[id]._drags.push(h)};

  /* ---------- export image (toujours en thème clair) ---------- */
  A.exportImage=async()=>{
    const was=root.dataset.theme; root.dataset.theme='light'; readColors(); A.renderNow();
    const vis=Object.values(A.panels).filter(P=>!P.el.hidden), base=pwrap.getBoundingClientRect(), sc=2;
    const cv=document.createElement('canvas'); cv.width=Math.round(base.width*sc); cv.height=Math.round(base.height*sc);
    const ctx=cv.getContext('2d'); ctx.fillStyle=A.C.card; ctx.fillRect(0,0,cv.width,cv.height);
    const jobs=vis.map(P=>new Promise(res=>{const r=P.node.getBoundingClientRect(), x=(r.left-base.left)*sc, y=(r.top-base.top)*sc;
      if(P.type==='canvas'){ctx.drawImage(P.node,x,y,r.width*sc,r.height*sc);res();return}
      const clone=P.node.cloneNode(true); clone.setAttribute('width',r.width); clone.setAttribute('height',r.height);
      const src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(clone));
      const im=new Image(); im.onload=()=>{ctx.drawImage(im,x,y,r.width*sc,r.height*sc);res()}; im.onerror=()=>res(); im.src=src;}));
    await Promise.all(jobs);
    root.dataset.theme=was; readColors(); A.renderNow();
    const a=document.createElement('a'); const tabName=cfg.onglets&&cfg.onglets.length>1?'_'+(A.tab+1):'';
    a.download=`${cfg.code}_${(cfg.fichier||cfg.titre).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_')}${tabName}.png`;
    a.href=cv.toDataURL('image/png'); a.click(); A.toast('Image enregistrée (thème clair)');
  };

  /* ---------- aide ---------- */
  function buildHelp(){
    const h=cfg.aide||{}, sec=(t,c)=>c?`<h4>${t}</h4>${/^\s*</.test(c)?c:`<p>${c}</p>`}`:'';
    dlg.innerHTML=`<header><h3>Aide · ${cfg.titre}</h3><button class="mini" data-close>Fermer ✕</button></header><div class="db">
    ${cfg.sousTitre?`<p class="ak-dlg-sub">${cfg.sousTitre}</p>`:''}${sec('Ce qu\'on voit',h.voit)}${sec('Ce qu\'on peut faire',h.faire)}${sec('Modèle et hypothèses',h.modele)}${sec('Lien avec le cours',h.cours)}${sec('Pour aller plus loin',h.plus)}
    <h4>Raccourcis</h4><p>${cfg.temps?'<kbd>Espace</kbd> lecture / pause · <kbd>→</kbd> pas à pas · <kbd>R</kbd> recommencer · ':''}${tabs?`<kbd>1</kbd>–<kbd>${cfg.onglets.length}</kbd> onglets · `:''}<kbd>P</kbd> projection · <kbd>F</kbd> plein écran · <kbd>T</kbd> thème · <kbd>I</kbd> image · <kbd>H</kbd> aide${h.touches?' · '+h.touches:''}</p>
    <p>Vue : molette, pincement ou <kbd>+</kbd> <kbd>−</kbd> pour zoomer · <kbd>Maj</kbd> + glisser, deux doigts, ou glisser une vue zoomée pour la déplacer · « Cadrer », <kbd>0</kbd> ou double clic : vue initiale.</p>
    ${h.credits?`<h4>Crédits</h4><p>${h.credits}</p>`:''}</div>`;
    dlg.addEventListener('click',e=>{if(e.target.closest('[data-close]')||e.target===dlg)dlg.close()});
  }

  /* ---------- démarrage ---------- */
  buildSettings(); buildHelp(); readColors();
  if(cfg.init)cfg.init(A);
  refreshSettings(); A.reset();
  new ResizeObserver(()=>A.render()).observe(ak);
  return A;
}

window.AnimKit={app,fmt,M,ticks,niceStep,FONT,MATH,interrupteur};
})();

</script>
<script>

// @titre Lois de Snell-Descartes · OP1 · MPSI
// @sortie ../OP1_Snell_Descartes/OP1_Snell_Descartes.html
// @description Réflexion, réfraction et réflexion totale sur un dioptre plan : animation interactive du cours de MPSI.
'use strict';
/* =====================================================================
   OP1 · Lois de Snell-Descartes
   Conventions du cours (OP1_Cours.tex) : angles algébriques, positifs dans le sens
   trigonométrique vu de face ; i1 repéré depuis la normale supérieure vers la source,
   r depuis la même normale vers le rayon réfléchi, i2 depuis la normale inférieure.
   r = −i1 et n1 sin i1 = n2 sin i2.
   ===================================================================== */
const DEG=Math.PI/180, L0=600; // longueur d'onde dans le vide (nm)
const MATERIAUX=[[1,'Air · 1.00'],[1.33,'Eau · 1.33'],[1.5,'Verre · 1.50'],[2.42,'Diamant · 2.42'],['perso','Personnalisé']];
const nomMat=n=>({1:'air',1.33:'eau',1.5:'verre',2.42:'diamant'})[n]||'milieu';

/* ---------- physique ---------- */
/* coefficients de Fresnel en puissance, lumière non polarisée (moyenne des polarisations s et p) */
function fresnel(n1,n2,i1){const s2=n1*Math.sin(i1)/n2;if(Math.abs(s2)>=1)return{R:1,T:0};
  const c1=Math.cos(i1),c2=Math.sqrt(1-s2*s2),rs=(n1*c1-n2*c2)/(n1*c1+n2*c2),rp=(n2*c1-n1*c2)/(n2*c1+n1*c2),Rr=(rs*rs+rp*rp)/2;return{R:Rr,T:1-Rr}}
/* loi de Cauchy n(λ₀) = A + B/λ₀² ; ici n(589 nm) = indice réglé et B proportionnel à n − 1 (B = 4.2 × 10³ nm² pour n = 1.5) */
const SPECTRE=[[400,'#8a4dff'],[450,'#3d6bff'],[500,'#18b3c9'],[550,'#3fcf4a'],[600,'#f2c21b'],[650,'#ff7a1a'],[700,'#e8302a']];
const cauchy=(n,l)=>n+4200*(n-1)/.5*(1/(l*l)-1/(589*589));
let vus=new Map(),vusCle='';
function optique(n1,n2,i1){
  const s2=n1*Math.sin(i1)/n2, total=Math.abs(s2)>1+1e-12;
  const ilim=n1>n2?Math.asin(n2/n1):null;
  return {r:-i1, i2:total?null:Math.asin(Math.max(-1,Math.min(1,s2))), total, ilim};
}

let phase=0, sens=1, cam={psi:-35*DEG,beta:22*DEG};

const A=AnimKit.app({
  code:'OP1', partie:'TurquoiseLagon', chapitre:'OP1 Propagation de la lumière',
  titre:'Lois de Snell-Descartes', sousTitre:'Réflexion, réfraction et réflexion totale sur un dioptre plan',
  onglets:['Vue de face','Perspective'],
  temps:a=>a.p.rep!=='rayons'||a.p.balayer, pas:1/12,
  panneaux:[{id:'scene',poids:3,ratioTel:1.05},{id:'graphe',poids:2,onglets:[0],ratioTel:.85}],
  reglages:[
    {titre:'Situations',presets:[
      {label:'Air → verre',valeurs:{m1:1,n1:1,m2:1.5,n2:1.5,i1:40}},
      {label:'Verre → air',valeurs:{m1:1.5,n1:1.5,m2:1,n2:1,i1:30}},
      {label:'Réflexion totale',valeurs:{m1:1.5,n1:1.5,m2:1,n2:1,i1:55}},
      {label:'Même indice',valeurs:{m1:1.5,n1:1.5,m2:1.5,n2:1.5,i1:40}},
      {label:'Balayage',valeurs:{balayer:true},lecture:true,titre:'Fait varier i₁ de −90° à +90°'}]},
    {titre:'Les milieux',items:[
      {id:'m1',type:'select',label:`Milieu incident`,options:MATERIAUX,value:1},
      {id:'n1',label:`Indice ${AnimKit.M.v('n','1')}`,min:1,max:2.5,step:0.01,value:1},
      {id:'m2',type:'select',label:`Milieu transmis`,options:MATERIAUX,value:1.5},
      {id:'n2',label:`Indice ${AnimKit.M.v('n','2')}`,min:1,max:2.5,step:0.01,value:1.5},
      {type:'boutons',items:[{label:'⇅ Intervertir les milieux',action:a=>{const{n1,n2,m1,m2}=a.p;a.set('n1',n2,{silent:true});a.set('n2',n1,{silent:true});a.set('m1',m2,{silent:true});a.set('m2',m1,{silent:true})}}]},
      {type:'note',html:'Teinte plus marquée : indice plus élevé (ce n\'est ni une couleur réelle ni une absorption).'}]},
    {titre:'L\'incidence',items:[
      {id:'i1',label:`Angle ${AnimKit.M.v('i','1')}`,min:-90,max:90,step:0.5,value:40,unit:'°',dec:1},
      {type:'boutons',items:[{id:'lim',label:'Angle limite',titre:'Place i₁ exactement à l\'angle limite',action:a=>{const o=optique(a.p.n1,a.p.n2,0);if(o.ilim)a.set('i1',Math.sign(a.p.i1||1)*+(o.ilim/DEG).toFixed(1))}}]},
      {id:'balayer',type:'check',label:'Balayer l\'incidence pendant la lecture',value:false}]},
    {titre:'Affichage',items:[
      {id:'rep',type:'seg',label:'Représentation de la lumière',options:[['rayons','Rayons'],['deux','Les deux'],['fronts','Fronts d\'onde']],value:'rayons'},
      {id:'normale',type:'check',label:'Normale',value:true},
      {id:'angles',type:'check',label:'Angles orientés',value:true},
      {id:'rapporteur',type:'check',label:'Rapporteur',value:false},
      {id:'plan',type:'check',label:'Plan d\'incidence',value:true,onglets:[1]},
      {id:'lambda',type:'check',label:'Longueurs d\'onde',value:false,si:a=>a.p.rep!=='rayons'&&!a.p.blanc},
      {id:'descartes',type:'check',label:'Construction de Descartes (deux cercles)',value:false,onglets:[0]},
      {id:'fresnel',type:'check',label:'Épaisseurs proportionnelles à la puissance (Fresnel)',value:false},
      {id:'limite',type:'check',label:'Angle limite (prévision)',value:false,si:a=>a.p.n1>a.p.n2}]},
    {titre:'Lumière blanche',onglets:[0],items:[
      {id:'blanc',type:'check',label:'Lumière blanche : dispersion (loi de Cauchy)',value:false},
      {id:'exag',label:'Écarts angulaires agrandis ×',min:1,max:30,step:1,value:10,si:a=>a.p.blanc},
      {type:'note',si:a=>a.p.blanc,html:'Indice des milieux selon λ<sub>0</sub> : <i class="m">n</i>(λ<sub>0</sub>) = <i class="m">A</i> + <i class="m">B</i>/λ<sub>0</sub><sup>2</sup>, réglé à 589 nm. Les écarts entre couleurs sont agrandis pour être visibles ; les valeurs affichées sont les vraies.'}]},
    {titre:'Graphe',onglets:[0],items:[
      {id:'courbe',type:'seg',label:'Grandeur',options:[['angles','Angle de réfraction'],['puissance','Puissances R et T']],value:'angles'},
      {id:'futur',type:'check',label:'Courbe complète et approximation des petits angles (prévision)',value:false},
      {type:'note',html:'Sans la prévision, le graphe ne garde que les incidences déjà explorées.'}]}
  ],
  aide:{
    voit:'Un pinceau lumineux issu d\'un laser arrive en I sur un dioptre plan séparant deux milieux transparents d\'indices <i class="m">n</i><sub>1</sub> et <i class="m">n</i><sub>2</sub>. Rayon incident en rouge, réfléchi en vert, réfracté en bleu.',
    faire:'<ul><li>Glisser le laser (vue de face) ou utiliser le curseur pour régler <i class="m">i</i><sub>1</sub>.</li><li>Choisir les matériaux ou régler les indices, puis intervertir les milieux.</li><li>Pour la réflexion totale : « Verre → air », bouton « Angle limite », puis augmenter légèrement <i class="m">i</i><sub>1</sub>.</li><li>Afficher les fronts d\'onde puis lancer la lecture pour les voir avancer.</li><li>En perspective, glisser sur la scène pour tourner le point de vue.</li></ul>',
    modele:'Dioptre plan entre deux milieux transparents, homogènes, isotropes et non absorbants. Lois de Snell-Descartes : <i class="m">r</i> = −<i class="m">i</i><sub>1</sub> et <i class="m">n</i><sub>1</sub> sin <i class="m">i</i><sub>1</sub> = <i class="m">n</i><sub>2</sub> sin <i class="m">i</i><sub>2</sub>. Réflexion totale si <i class="m">n</i><sub>1</sub> &gt; <i class="m">n</i><sub>2</sub> et |<i class="m">i</i><sub>1</sub>| &gt; arcsin(<i class="m">n</i><sub>2</sub>/<i class="m">n</i><sub>1</sub>). Les épaisseurs des rayons sont conventionnelles (les coefficients de Fresnel ne sont pas calculés). Fronts d\'onde : régime monochromatique établi, λ<sub>0</sub> = 600 nm, λ = λ<sub>0</sub>/<i class="m">n</i> ; l\'échelle des longueurs est agrandie et le temps très fortement ralenti.',
    plus:'<ul><li><b>Construction de Descartes</b> : deux demi-cercles de centre I, de rayons proportionnels à <i class="m">n</i><sub>1</sub> et <i class="m">n</i><sub>2</sub>. Le prolongement du rayon incident coupe le premier en P ; la parallèle à la normale passant par P coupe le second en Q : (IQ) est le rayon réfracté, car <i class="m">n</i><sub>1</sub> sin <i class="m">i</i><sub>1</sub> = <i class="m">n</i><sub>2</sub> sin <i class="m">i</i><sub>2</sub>. Si la parallèle ne coupe pas le second cercle : réflexion totale.</li><li><b>Puissances</b> (hors programme) : coefficients de Fresnel en lumière non polarisée ; la puissance réfléchie augmente quand on approche de l\'angle limite, puis devient totale. En incidence normale air → verre, <i class="m">R</i> ≈ 4 %. L\'angle de Brewster, où la polarisation <i class="m">p</i> n\'est pas réfléchie, est marqué en prévision.</li><li><b>Erreur fréquente</b> : les angles ne sont pas proportionnels ; <i class="m">i</i><sub>2</sub> ≈ (<i class="m">n</i><sub>1</sub>/<i class="m">n</i><sub>2</sub>) <i class="m">i</i><sub>1</sub> n\'est valable qu\'aux petits angles (comparer sur le graphe).</li></ul>',
    cours:'OP1 Propagation de la lumière, partie « Les lois de Snell-Descartes ». Milieux dispersifs et loi de Cauchy <i class="m">n</i>(λ<sub>0</sub>) = <i class="m">A</i> + <i class="m">B</i>/λ<sub>0</sub><sup>2</sup>. Angles algébriques orientés dans le sens trigonométrique vu de face : <i class="m">i</i><sub>1</sub> et <i class="m">r</i> sont repérés depuis la normale côté milieu 1, <i class="m">i</i><sub>2</sub> depuis la normale côté milieu 2.',
    touches:'<kbd>←</kbd> <kbd>→</kbd> modifient aussi <i class="m">i</i><sub>1</sub> quand la lecture est arrêtée et que le curseur a le focus'
  },
  change(a,id,v){
    if(id==='m1'&&v!=='perso')a.set('n1',v,{silent:true});
    if(id==='m2'&&v!=='perso')a.set('n2',v,{silent:true});
    if(id==='n1')a.set('m1',MATERIAUX.some(m=>m[0]===v)?v:'perso',{silent:true});
    if(id==='n2')a.set('m2',MATERIAUX.some(m=>m[0]===v)?v:'perso',{silent:true});
    if(id==='i1'&&a.p.balayer&&!a.running)a.p.balayer=false;
    a.enable('lim',a.p.n1>a.p.n2);
  },
  init(a){a.enable('lim',false)},
  reset(a){phase=0},
  step(a,dt){
    phase+=dt*0.8; a.t+=dt;
    if(a.p.balayer){let v=a.p.i1+sens*dt*12; if(v>90){v=90;sens=-1} if(v<-90){v=-90;sens=1} a.set('i1',+v.toFixed(2),{silent:true})}
  },
  draw(a){a.tab===0?drawFace(a):draw3D(a); if(a.tab===0)graphe(a); infos(a)}
});

/* ---------- mesures et message ---------- */
function infos(a){
  const {n1,n2,i1}=a.p, o=optique(n1,n2,i1*DEG), f=a.fmt, M=AnimKit.M;
  a.metrics([
    {label:`Incidence ${M.v('i','1')}`,value:f.fix(i1,1),unit:'°'},
    {label:`Réflexion ${M.v('r')}`,value:f.fix(o.r/DEG,1),unit:'°'},
    o.total?{label:`Réfraction ${M.v('i','2')} · réflexion totale`,value:'aucune',warn:true}
           :{label:`Réfraction ${M.v('i','2')}`,value:f.fix(o.i2/DEG,1),unit:'°'}
  ]);
  const fr=fresnel(n1,n2,i1*DEG),extra=[];
  if(a.p.fresnel)extra.push({label:`Puissances réfléchie ${M.v('R')} et transmise ${M.v('T')}`,value:`${f.fix(fr.R*100,1)} % · ${f.fix(fr.T*100,1)} %`,unit:''});
  if(a.p.blanc&&a.tab===0){const ib=optique(cauchy(n1,400),cauchy(n2,400),i1*DEG),ir=optique(cauchy(n1,700),cauchy(n2,700),i1*DEG);
    extra.push({label:`${M.v('i','2')} à 400 nm et à 700 nm`,value:`${ib.total?'—':f.fix(ib.i2/DEG,2)+'°'} · ${ir.total?'—':f.fix(ir.i2/DEG,2)+'°'}`,unit:'',hint:!ib.total&&!ir.total?`écart ${f.fix(Math.abs(ib.i2-ir.i2)/DEG,2)}°`:''})}
  if(extra.length)a.metrics([{label:`Incidence ${M.v('i','1')}`,value:f.fix(i1,1),unit:'°'},o.total?{label:`Réfraction ${M.v('i','2')}`,value:'aucune',warn:true}:{label:`Réfraction ${M.v('i','2')}`,value:f.fix(o.i2/DEG,1),unit:'°'}].concat(extra));
  let msg;
  if(n1===n2)msg='Indices égaux : la lumière traverse sans être déviée ni réfléchie.';
  else if(o.total)msg=`Réflexion totale : |${M.v('i','1')}| dépasse l'angle limite ${M.v('i','lim')} = arcsin ${M.frac(M.v('n','2'),M.v('n','1'))} = ${f.fix(o.ilim/DEG,1)}°. Toute la lumière est réfléchie.`;
  else if(n2>n1)msg=`${M.v('n','2')} &gt; ${M.v('n','1')} : le rayon réfracté se rapproche de la normale, |${M.v('i','2')}| &lt; |${M.v('i','1')}|. Il existe toujours.`;
  else msg=`${M.v('n','2')} &lt; ${M.v('n','1')} : le rayon réfracté s'écarte de la normale, |${M.v('i','2')}| &gt; |${M.v('i','1')}|. Au-delà de ${M.v('i','lim')} = ${f.fix(o.ilim/DEG,1)}°, il n'existe plus.`;
  const bl=a.p.blanc&&a.tab===0,L=[{c:bl?a.C.ink:a.C.F,label:bl?'Incident (lumière blanche)':'Incident'},{c:bl?a.C.ink2:a.C.v,label:'Réfléchi'},o.total||a.p.blanc?null:{c:a.C.B,label:'Réfracté'},a.p.blanc&&a.tab===0&&{c:'#3fcf4a',label:'Réfractés (400 à 700 nm)'},a.p.limite&&n1>n2&&{c:a.C.pred,label:'angle limite',dash:true},a.p.descartes&&a.tab===0&&{c:a.C.ink2,label:'construction de Descartes',dash:true}];
  if(a.tab===0)L.push(...(a._lgG||[]));
  a.legend(L);
  a.clock(a.p.rep!=='rayons'?'temps très ralenti':'');
}

/* ---------- utilitaires de dessin ---------- */
function teinte(a,n){return {fill:a.C.c,fop:0.05+0.30*(n-1)/1.5}}
function rayStyle(a,kind,total){const w={inc:3,ref:total?3:1.8,tra:2.6}[kind];return{c:{inc:a.C.F,ref:a.C.v,tra:a.C.B}[kind],w}}

/* ===================== VUE DE FACE ===================== */
function drawFace(a){
  const P=a.panels.scene, S=a.S, C=a.C, k=a.k, w=P.w, h=P.h, {n1,n2,i1:i1d}=a.p;
  const o=optique(n1,n2,i1d*DEG), i1=i1d*DEG;
  const cx=w/2, cy=h/2, R=Math.min(w*0.46,h*0.46)*P.zoom; // longueur des rayons
  const fs=13;
  let s='';
  // milieux
  s+=S.rect(0,0,w,cy,teinte(a,n1))+S.rect(0,cy,w,h-cy,teinte(a,n2));
  s+=S.line(0,cy,w,cy,{c:C.ink,w:1.6});
  s+=S.text(10*k,14*k,`Milieu 1 · ${nomMat(n1)} · ${S.v('n','1')} = ${a.fmt.fix(n1,2)}`,{base:'top',size:fs,c:C.ink});
  s+=S.text(10*k,h-12*k,`Milieu 2 · ${nomMat(n2)} · ${S.v('n','2')} = ${a.fmt.fix(n2,2)}`,{base:'bottom',size:fs,c:C.ink});
  s+=S.text(w-8*k,cy+8*k,'dioptre',{anchor:'end',base:'top',size:14});
  // rapporteur
  if(a.p.rapporteur){const rr=R*0.62;s+=S.circle(cx,cy,rr,{c:C.ink2,w:.8,op:.7});
    for(let d=0;d<360;d+=5){const t=d*DEG,l=d%10===0?9:5;s+=S.line(cx+rr*Math.cos(t),cy-rr*Math.sin(t),cx+(rr-l*k)*Math.cos(t),cy-(rr-l*k)*Math.sin(t),{c:C.ink2,w:.8,op:.8})}
    for(let d=0;d<360;d+=30){if(d%90===0&&d!==0&&d!==180)continue;const t=d*DEG,lab=Math.round(Math.abs(((d-90+540)%180)-90));s+=S.text(cx+(rr+11*k)*Math.cos(t),cy-(rr+11*k)*Math.sin(t),String(90-lab)+'°',{anchor:'middle',size:13,c:C.ink2})}}
  // normale
  if(a.p.normale){s+=S.line(cx,4*k,cx,h-4*k,{c:C.ink2,w:1.1,dash:`${6*k} ${5*k}`});s+=S.text(cx+6*k,30*k,'normale',{base:'top',size:14})}
  // directions (repère mathématique : y vers le haut)
  const src=[-Math.sin(i1),Math.cos(i1)];           // vers la source
  const ref=[Math.sin(i1),Math.cos(i1)];            // réfléchi (r = −i1)
  const tra=o.total?null:[Math.sin(o.i2),-Math.cos(o.i2)];
  const Pt=(d,l)=>[cx+d[0]*l,cy-d[1]*l];
  // longueur jusqu'au bord de la scène : les rayons sont prolongés jusqu'au cadre
  const mg=4*k, bord=d=>Math.min(d[0]>1e-9?(w-mg-cx)/d[0]:d[0]<-1e-9?(cx-mg)/-d[0]:1e9, d[1]>1e-9?(cy-mg)/d[1]:d[1]<-1e-9?(h-mg-cy)/-d[1]:1e9);
  /* laser à distance fixe de I */ const Ls=Math.min(R,bord(src)-34*k), Lr=bord(ref), Lt=tra?bord(tra):0;
  const showRays=a.p.rep!=='fronts'||a.p.blanc, showFronts=a.p.rep!=='rayons'&&!a.p.blanc, fr=fresnel(n1,n2,i1);
  // fronts d'onde
  if(showFronts)s+=fronts(a,{cx,cy,R,src,ref,tra,n1,n2,o,Ls,Lr,Lt});
  // rayons
  const rayW=showRays?1:0.55;
  if(showRays||true){
    const sI=rayStyle(a,'inc'), sR=rayStyle(a,'ref',o.total), sT=rayStyle(a,'tra');
    if(a.p.fresnel){sI.w=7;sR.w=7*fr.R;sT.w=7*fr.T}
    if(a.p.blanc){sI.c=C.ink;sR.c=C.ink2}
    const [lx,ly]=Pt(src,Ls);
    s+=S.line(lx,ly,cx,cy,{c:sI.c,w:sI.w*rayW,op:showRays?1:.6});
    s+=midArrow(S,[lx,ly],[cx,cy],sI.c,sI.w*rayW,k);
    if((n1!==n2||o.total)&&sR.w>.05){const [rx,ry]=Pt(ref,Lr);s+=S.line(cx,cy,rx,ry,{c:sR.c,w:sR.w*rayW,op:showRays?1:.6});s+=midArrow(S,[cx,cy],[rx,ry],sR.c,Math.max(1.2,sR.w)*rayW,k)}
    if(a.p.blanc){const i2r=o.total?null:o.i2;
      for(const[l,col]of SPECTRE){const q=optique(cauchy(n1,l),cauchy(n2,l),i1);if(q.total)continue;const ref0=i2r??q.i2,ang=ref0+a.p.exag*(q.i2-ref0),d=[Math.sin(ang),-Math.cos(ang)],L2=bord(d),[tx,ty]=Pt(d,L2);
        const wl=a.p.fresnel?7*fresnel(cauchy(n1,l),cauchy(n2,l),i1).T:1.8;s+=S.line(cx,cy,tx,ty,{c:col,w:wl})}
      const nt=SPECTRE.filter(([l])=>optique(cauchy(n1,l),cauchy(n2,l),i1).total).length;
      if(nt>0&&nt<SPECTRE.length)s+=S.text(cx+12*k,cy+30*k,`${nt} couleur${nt>1?'s':''} sur ${SPECTRE.length} totalement réfléchie${nt>1?'s':''} (le bleu d'abord)`,{base:'top',size:14,c:C.ink})}
    else if(tra){const [tx,ty]=Pt(tra,Lt);if(sT.w>.05){s+=S.line(cx,cy,tx,ty,{c:sT.c,w:sT.w*rayW,op:showRays?1:.6});s+=midArrow(S,[cx,cy],[tx,ty],sT.c,Math.max(1.2,sT.w)*rayW,k)}}
    // laser
    s+=laser(a,lx,ly,src);
  }
  if(a.p.limite&&o.ilim){for(const sg of[1,-1]){const d=[-sg*Math.sin(o.ilim),Math.cos(o.ilim)],L1=bord(d),[ex,ey]=Pt(d,L1);s+=S.line(cx,cy,ex,ey,{c:C.pred,w:1.4,dash:`${6*k} ${4*k}`})}
    const d=[-Math.sin(o.ilim),Math.cos(o.ilim)],[lx2,ly2]=Pt(d,Math.min(R*.85,bord(d)-20*k));s+=S.text(lx2-8*k,ly2,`${S.v('i','lim')} = ${a.fmt.fix(o.ilim/DEG,1)}°`,{anchor:'end',size:14,c:C.pred})}
  if(a.p.descartes){const nm=Math.max(n1,n2),rc=Math.min(R*.9,(h-cy)-16*k,(w/2)-16*k),r1=rc*n1/nm,r2=rc*n2/nm;
    const half=r=>{const pts=[];for(let j=0;j<=60;j++){const t=Math.PI+Math.PI*j/60;pts.push([cx+r*Math.cos(t),cy-r*Math.sin(t)])}return S.poly(pts,{c:C.ink2,w:1.2,dash:`${5*k} ${4*k}`})};
    s+=half(r1)+half(r2)+S.text(cx-r1*.72,cy+r1*.72,S.v('n','1'),{size:14,c:C.ink2,anchor:'end'})+S.text(cx-r2*.72-6*k,cy+r2*.72+8*k,S.v('n','2'),{size:14,c:C.ink2,anchor:'end'});
    const Px=cx+r1*Math.sin(i1),Py=cy+r1*Math.cos(i1);s+=S.line(cx,cy,Px,Py,{c:C.F,w:1.2,dash:`${3*k} ${3*k}`})+S.circle(Px,Py,3.5*k,{fill:C.F})+S.text(Px+8*k,Py,'P',{size:14,c:C.F});
    const dx=Px-cx;if(Math.abs(dx)<=r2){const Qy=cy+Math.sqrt(r2*r2-dx*dx);s+=S.line(Px,Math.min(Py,Qy)-6*k,Px,Math.max(Py,Qy)+6*k,{c:C.ink2,w:1.2,dash:`${2*k} ${3*k}`})+S.circle(Px,Qy,3.5*k,{fill:C.B})+S.text(Px+8*k,Qy+6*k,'Q',{size:14,c:C.B})}
    else s+=S.line(Px,cy+2*k,Px,h-4*k,{c:C.ink2,w:1.2,dash:`${2*k} ${3*k}`})+S.text(Px+(dx>0?-8:8)*k,h-24*k,'ne coupe pas le cercle : réflexion totale',{anchor:dx>0?'end':'start',size:14,c:C.ink})}
  if(o.total)s+=S.text(cx,cy+34*k,'réflexion totale : aucun rayon réfracté',{anchor:'middle',size:16,c:C.v,weight:600});
  else if(n1===n2)s+=S.text(cx+10*k,cy-14*k,'indices égaux : ni déviation ni réflexion',{size:15,c:C.ink});
  s+=S.circle(cx,cy,3*k,{fill:C.ink});
  s+=S.text(cx-8*k,cy+9*k,'I',{anchor:'end',base:'top',size:13,c:C.ink,italic:false});
  // angles orientés
  if(a.p.angles){
    const ra=Math.min(R*0.30,70*k);
    if(Math.abs(i1)>0.01){s+=S.arc(cx,cy,ra,Math.PI/2,Math.PI/2+i1,{c:C.F,w:1.6,arrow:true});s+=angLab(a,cx,cy,ra+15*k,Math.PI/2+i1/2,S.v('i','1'),C.F)}
    if((n1!==n2||o.total)&&Math.abs(i1)>0.01){const rb=ra*0.78;s+=S.arc(cx,cy,rb,Math.PI/2,Math.PI/2-i1,{c:C.v,w:1.6,arrow:true});s+=angLab(a,cx,cy,rb+14*k,Math.PI/2-i1/2,S.v('r'),C.v)}
    if(tra&&Math.abs(o.i2)>0.01){s+=S.arc(cx,cy,ra,-Math.PI/2,-Math.PI/2+o.i2,{c:C.B,w:1.6,arrow:true});s+=angLab(a,cx,cy,ra+15*k,-Math.PI/2+o.i2/2,S.v('i','2'),C.B)}
  }
  a.svg('scene',s);
}
function midArrow(S,p,q,c,w,k){const mx=p[0]+(q[0]-p[0])*.55,my=p[1]+(q[1]-p[1])*.55,an=Math.atan2(q[1]-p[1],q[0]-p[0]),hl=(7+w*1.6)*k;
  return S.path(`M${mx+hl*.5*Math.cos(an)},${my+hl*.5*Math.sin(an)}L${mx-hl*.5*Math.cos(an)-hl*.45*Math.sin(an)},${my-hl*.5*Math.sin(an)+hl*.45*Math.cos(an)}L${mx-hl*.5*Math.cos(an)+hl*.45*Math.sin(an)},${my-hl*.5*Math.sin(an)-hl*.45*Math.cos(an)}Z`,{c:'none',fill:c})}
function angLab(a,cx,cy,r,t,txt,c){return a.S.text(cx+r*Math.cos(t),cy-r*Math.sin(t),txt,{anchor:'middle',size:16,c})}
function laser(a,x,y,d){const S=a.S,k=a.k,L=34*k,W=11*k,an=Math.atan2(-d[1],d[0])*180/Math.PI;
  return`<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${an.toFixed(2)})" data-laser="1"><rect x="${(-L*.15).toFixed(1)}" y="${(-W/2).toFixed(1)}" width="${L.toFixed(1)}" height="${W.toFixed(1)}" rx="${(2*k).toFixed(1)}" fill="${a.C.card}" stroke="${a.C.ink}" stroke-width="${1.4*k}"/><rect x="${(L*.62).toFixed(1)}" y="${(-W/2).toFixed(1)}" width="${(L*.23).toFixed(1)}" height="${W.toFixed(1)}" fill="${a.C.F}" opacity=".8"/></g>`}

/* fronts d'onde : crêtes perpendiculaires aux rayons, phase continue en I */
function fronts(a,g){
  const S=a.S, C=a.C, k=a.k, {cx,cy,R,src,ref,tra,n1,n2,o,Ls,Lr,Lt}=g;
  const lam0=58*k*a.panels.scene.zoom, b=Math.min(R*0.16,34*k);
  let s='';
  const beam=(d,lam,u0,u1,c,upper,w)=>{
    const p=[-d[1],d[0]]; let out='';
    // crêtes : u/λ − νt = entier, donc u = (j + νt) λ : elles avancent dans le sens de propagation
    const j0=Math.ceil(u0/lam-phase), j1=Math.floor(u1/lam-phase);
    for(let j=j0;j<=j1;j++){const u=(j+phase)*lam, X=cx+d[0]*u, Y=cy-d[1]*u;
      let A=[X-p[0]*b,Y+p[1]*b], B=[X+p[0]*b,Y-p[1]*b];
      const cl=clipHalf(A,B,cy,upper); if(cl)out+=S.line(cl[0][0],cl[0][1],cl[1][0],cl[1][1],{c,w:w});}
    return out;};
  const lam1=lam0/n1, lam2=lam0/n2, inc=[-src[0],-src[1]];
  s+=beam(inc,lam1,-Ls,0,C.F,true,1.6);
  if(n1!==n2||o.total)s+=beam(ref,lam1,0,Lr,C.v,true,o.total?1.6:1.1);
  if(tra)s+=beam(tra,lam2,0,Lt,C.B,false,1.5);
  if(a.p.lambda){
    s+=lamMark(a,cx,cy,inc,lam1,-R*0.62,b,`${S.v('λ','1')} = ${a.fmt.fix(L0/n1,0)} nm`,C.F);
    if(tra)s+=lamMark(a,cx,cy,tra,lam2,R*0.45,b,`${S.v('λ','2')} = ${a.fmt.fix(L0/n2,0)} nm`,C.B);
  }
  return s;
}
function clipHalf(A,B,cy,upper){const inside=p=>upper?p[1]<=cy+0.01:p[1]>=cy-0.01;const ia=inside(A),ib=inside(B);if(ia&&ib)return[A,B];if(!ia&&!ib)return null;
  const t=(cy-A[1])/(B[1]-A[1]),M=[A[0]+(B[0]-A[0])*t,cy];return ia?[A,M]:[M,B]}
function lamMark(a,cx,cy,d,lam,u,b,label,c){
  const S=a.S,k=a.k,off=b+12*k;let p=[-d[1],d[0]];
  { const ux=cx+d[0]*u; if((ux+p[0]*off-cx)*(ux-cx)<0||Math.abs(ux+p[0]*off-cx)<Math.abs(ux-cx))p=[-p[0],-p[1]]; } // côté opposé à la normale
  const u0=(Math.round(u/lam-phase)+phase)*lam;
  const P1=[cx+d[0]*u0+p[0]*off,cy-d[1]*u0-p[1]*off], P2=[cx+d[0]*(u0+lam)+p[0]*off,cy-d[1]*(u0+lam)-p[1]*off];
  let s=S.arrow(P1[0],P1[1],P2[0],P2[1],{c,w:1.2,head:7*k})+S.arrow(P2[0],P2[1],P1[0],P1[1],{c,w:1.2,head:7*k});
  const m=[(P1[0]+P2[0])/2+p[0]*14*k,(P1[1]+P2[1])/2-p[1]*14*k];
  return s+S.text(m[0],m[1],label,{anchor:'middle',size:13,c});
}

/* ===================== PERSPECTIVE ===================== */
function draw3D(a){
  const P=a.panels.scene, S=a.S, C=a.C, k=a.k, w=P.w, h=P.h, {n1,n2,i1:i1d}=a.p;
  const o=optique(n1,n2,i1d*DEG), i1=i1d*DEG, {psi,beta}=cam;
  const sc=Math.min(w*0.34,h*0.36)*P.zoom, cx=w/2, cy=h*0.47;
  const pr=(x,y,z)=>{const xr=x*Math.cos(psi)+y*Math.sin(psi), yr=-x*Math.sin(psi)+y*Math.cos(psi);return[cx+sc*xr, cy-sc*(z*Math.cos(beta)+yr*Math.sin(beta))]};
  const poly=(pts,o2)=>S.poly(pts.map(p=>pr(...p)),{...o2,close:true});
  const ln=(p,q,o2)=>{const A=pr(...p),B=pr(...q);return S.line(A[0],A[1],B[0],B[1],o2)};
  const X=1.25,Y=0.95,Z=1.05;
  let s='';
  // milieu 2 : volume sous le dioptre (faces visibles)
  const t2=teinte(a,n2), t1=teinte(a,n1);
  s+=poly([[-X,-Y,0],[X,-Y,0],[X,-Y,-Z],[-X,-Y,-Z]],{fill:t2.fill,fop:t2.fop*0.8,c:C.rule,w:1});
  s+=poly([[X,-Y,0],[X,Y,0],[X,Y,-Z],[X,-Y,-Z]],{fill:t2.fill,fop:t2.fop*0.6,c:C.rule,w:1});
  // plan d'incidence, moitié basse
  if(a.p.plan)s+=poly([[-X,0,0],[X,0,0],[X,0,-Z],[-X,0,-Z]],{fill:C.ink2,fop:.07,c:C.ink2,w:.8,dash:`${4*k} ${4*k}`});
  const dir=(t,len,up)=>[Math.sin(t)*len,0,(up?1:-1)*Math.cos(t)*len];
  // rayon réfracté (sous le dioptre)
  const fl=(p,q,c,wd)=>midArrow(S,pr(...p),pr(...q),c,wd,k); // flèche au milieu du rayon
  if(!o.total){const e=dir(o.i2,Z*1.35,false);s+=ln([0,0,0],e,{c:C.B,w:2.6})+fl([0,0,0],e,C.B,2.6);}
  if(a.p.normale)s+=ln([0,0,0],[0,0,-Z],{c:C.ink2,w:1.1,dash:`${6*k} ${5*k}`});
  // dioptre
  s+=poly([[-X,-Y,0],[X,-Y,0],[X,Y,0],[-X,Y,0]],{fill:t2.fill,fop:0.12+t2.fop*0.5,c:C.ink,w:1.4});
  s+=S.text(...pr(X,-Y,0),'dioptre',{size:15,base:'top',anchor:'middle'});
  // plan d'incidence, moitié haute
  if(a.p.plan){s+=poly([[-X,0,0],[X,0,0],[X,0,Z],[-X,0,Z]],{fill:C.ink2,fop:.07,c:C.ink2,w:.8,dash:`${4*k} ${4*k}`});s+=S.text(...pr(-X,0,Z),'plan d\'incidence',{size:15,base:'top'})}
  if(a.p.normale){s+=ln([0,0,0],[0,0,Z],{c:C.ink2,w:1.1,dash:`${6*k} ${5*k}`});s+=S.text(...pr(0,0,Z*1.04),'normale',{size:15,anchor:'middle',base:'bottom'})}
  // rayons incident et réfléchi
  const si=[-Math.sin(i1)*Z*1.45,0,Math.cos(i1)*Z*1.45];
  s+=ln(si,[0,0,0],{c:C.F,w:3})+fl(si,[0,0,0],C.F,3);
  if(n1!==n2||o.total){const re=[Math.sin(i1)*Z*1.45,0,Math.cos(i1)*Z*1.45];s+=ln([0,0,0],re,{c:C.v,w:o.total?3:1.8})+fl([0,0,0],re,C.v,o.total?3:1.8)}
  const I=pr(0,0,0); s+=S.circle(I[0],I[1],3*k,{fill:C.ink})+S.text(I[0]-7*k,I[1]+6*k,'I',{anchor:'end',base:'top',size:16,c:C.ink});
  s+=S.text(10*k,14*k,`Milieu 1 · ${S.v('n','1')} = ${a.fmt.fix(n1,2)}`,{base:'top',size:16,c:C.ink});
  s+=S.text(10*k,h-12*k,`Milieu 2 · ${S.v('n','2')} = ${a.fmt.fix(n2,2)}`,{base:'bottom',size:16,c:C.ink});
  s+=S.text(w-10*k,h-12*k,'Glisser pour tourner',{anchor:'end',base:'bottom',size:13.5});
  a.svg('scene',s);
}

/* ---------- interactions ---------- */
let dragMode=null, start=null;
A.drag('scene',{
  hit:(x,y)=>A.tab===1||y<A.panels.scene.h/2,
  start(x,y){const P=A.panels.scene;
    if(A.tab===0){dragMode=y<P.h/2?'laser':null}else{dragMode='cam';start={x,y,psi:cam.psi,beta:cam.beta}}},
  move(x,y){const P=A.panels.scene;
    if(dragMode==='laser'){const dx=x-P.w/2, dy=Math.max(0,P.h/2-y); if(Math.abs(dx)<4&&dy<4)return; let v=Math.atan2(-dx,dy)/DEG; v=Math.max(-90,Math.min(90,v)); if(A.p.balayer)A.set('balayer',false,{silent:true}); A.set('i1',Math.round(v*2)/2)}
    else if(dragMode==='cam'){cam.psi=Math.max(-80*DEG,Math.min(80*DEG,start.psi-(x-start.x)*0.008));cam.beta=Math.max(4*DEG,Math.min(60*DEG,start.beta+(y-start.y)*0.006))}},
  end(){dragMode=null}
});

/* ===================== GRAPHE (vue de face) =====================
   i₂(i₁) ou puissances R, T(i₁). Sans la prévision, seules les incidences explorées sont tracées. */
function graphe(a){
  const P=a.panels.graphe,S=a.S,C=a.C,k=a.k,{n1,n2,i1}=a.p,f=a.fmt,lg=[];
  const key=n1+'|'+n2;if(key!==vusCle){vus=new Map();vusCle=key}
  const i0=Math.round(i1*2)/2;vus.set(i0,true);
  const o=optique(n1,n2,i1*DEG);let s='';
  if(a.p.courbe==='angles'){
    const G=S.graph({x:0,y:0,w:P.w,h:P.h,xmin:-90,xmax:90,ymin:-90,ymax:90,xticks:[-90,-60,-30,0,30,60,90],yticks:[-90,-60,-30,0,30,60,90],xlab:`${S.v('i','1')} (°)`,ylab:`${S.v('i','2')} (°)`});
    s+=S.clip('gs',G)+G.svg;
    if(a.p.futur){const pts=[];for(let j=0;j<=360;j++){const x=-90+j/2,q=optique(n1,n2,x*DEG);pts.push([x,q.total?NaN:q.i2/DEG])}
      s+=S.curve(pts,G,{c:C.B,w:2.2});s+=S.curve([[-90,-90*n1/n2],[90,90*n1/n2]],G,{c:C.pred,w:1.6,dash:`${6*k} ${4*k}`});
      if(o.ilim)for(const sg of[-1,1]){const X=G.X(sg*o.ilim/DEG);s+=S.line(X,G.y0,X,G.y0+G.h,{c:C.pred,w:1.2,dash:`${2*k} ${3*k}`})}
      lg.push({c:C.B,label:'loi de Snell-Descartes'},{c:C.pred,label:`petits angles ${AnimKit.M.v('i','2')} ≈ (${AnimKit.M.v('n','1')}/${AnimKit.M.v('n','2')}) ${AnimKit.M.v('i','1')}`,dash:true})}
    for(const x of vus.keys()){const q=optique(n1,n2,x*DEG);if(!q.total)s+=S.circle(G.X(x),G.Y(q.i2/DEG),2.2*k,{fill:C.B,op:.55})}
    if(!o.total)s+=S.circle(G.X(i1),G.Y(o.i2/DEG),5*k,{fill:C.card,c:C.B,w:2.2});
    else s+=S.text(G.X(i1),G.y0+12*k,'réflexion totale',{anchor:i1>0?'end':'start',base:'top',size:13,c:C.v});
  }else{
    const G=S.graph({x:0,y:0,w:P.w,h:P.h,xmin:0,xmax:90,ymin:0,ymax:100,xticks:[0,15,30,45,60,75,90],xlab:`|${S.v('i','1')}| (°)`,ylab:'Puissance (%)'});
    s+=S.clip('gs',G)+G.svg;
    if(a.p.futur){const pr=[],pt=[];for(let j=0;j<=360;j++){const x=j/4,q=fresnel(n1,n2,x*DEG);pr.push([x,q.R*100]);pt.push([x,q.T*100])}
      s+=S.curve(pr,G,{c:C.v,w:2.2})+S.curve(pt,G,{c:C.B,w:2.2});
      const ib=Math.atan(n2/n1)/DEG;if(!o.ilim||ib<o.ilim/DEG){const X=G.X(ib);s+=S.line(X,G.y0,X,G.y0+G.h,{c:C.pred,w:1.2,dash:`${2*k} ${3*k}`})+S.text(X+4*k,G.y0+G.h*.45,`Brewster ${f.fix(ib,1)}°`,{size:13,c:C.pred})}
      if(o.ilim){const X=G.X(o.ilim/DEG);s+=S.line(X,G.y0,X,G.y0+G.h,{c:C.pred,w:1.2,dash:`${2*k} ${3*k}`})+S.text(X-4*k,G.y0+G.h*.6,`${S.v('i','lim')}`,{anchor:'end',size:13,c:C.pred})}}
    for(const x of vus.keys()){const q=fresnel(n1,n2,Math.abs(x)*DEG);s+=S.circle(G.X(Math.abs(x)),G.Y(q.R*100),2.2*k,{fill:C.v,op:.55})+S.circle(G.X(Math.abs(x)),G.Y(q.T*100),2.2*k,{fill:C.B,op:.55})}
    const q=fresnel(n1,n2,Math.abs(i1)*DEG);s+=S.circle(G.X(Math.abs(i1)),G.Y(q.R*100),5*k,{fill:C.card,c:C.v,w:2.2})+S.circle(G.X(Math.abs(i1)),G.Y(q.T*100),5*k,{fill:C.card,c:C.B,w:2.2});
    lg.push({c:C.v,label:'puissance réfléchie R',dot:true},{c:C.B,label:'puissance transmise T',dot:true});
  }
  a.svg('graphe',s);a._lgG=lg;
}
