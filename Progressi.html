    _previewDeriv(save) {
      const cn = $('#tdC').value, op = $('#tdOp').value;
      const c = this.curve(cn), d = this.getCurveXY(cn), xc = this.xCurveOf(cn);
      if (!c || !d) return;
      try {
        let y, xOut = null, unit = c.unit;
        const win = +$('#tdWin').value || 7, deg = +$('#tdDeg').value || 2;
        if (op === 'sg1') { y = Num.savitzkyGolay(d.x, d.y, win, deg, 1); unit = c.unit + (xc?.unit ? '/' + xc.unit : ''); }
        else if (op === 'sg2') { y = Num.savitzkyGolay(d.x, d.y, win, deg, 2); unit = c.unit + (xc?.unit ? '/' + xc.unit + '²' : ''); }
        else if (op === 'sg0') { y = Num.savitzkyGolay(d.x, d.y, win, deg, 0); }
        else if (op === 'deriv') { y = Num.deriv(d.x, d.y); unit = c.unit + (xc?.unit ? '/' + xc.unit : ''); }
        else if (op === 'lisse') { y = Num.smooth(d.y, IO.parseNum($('#tdParam').value) || 5); }
        else if (op === 'ac') { const m = Num.mean(d.y); y = Float64Array.from(d.y, v => v - m); }
        else if (op === 'norm') { const m = Math.max(...Array.from(d.y, v => (isFinite(v) ? Math.abs(v) : 0))) || 1; y = Float64Array.from(d.y, v => v / m); unit = ''; }
        else if (op === 'abs') { y = Float64Array.from(d.y, Math.abs); }
        else if (op === 'ech') {
          const fe = IO.parseNum($('#tdParam').value);
          if (!(fe > 0)) throw new Error('fe invalide');
          const n = d.x.length, x0 = d.x[0], x1 = d.x[n - 1], N = Math.max(2, Math.floor((x1 - x0) * fe) + 1);
          xOut = Float64Array.from({ length: N }, (_, k) => x0 + k / fe);
          y = Float64Array.from(xOut, t => {
            let i = 0; while (i < n - 2 && d.x[i + 1] < t) i++;
            const u = (t - d.x[i]) / ((d.x[i + 1] - d.x[i]) || 1);
            return d.y[i] + u * (d.y[i + 1] - d.y[i]);
          });
        }
        const tmpName = save ? ($('#tdName').value.trim() || this.uniqueName('Calc_' + cn)) : '__prev';
        if (xOut) {
          const xn = save ? this.uniqueName(tmpName + '_t') : '__prev_x';
          this.curves.set(xn, { name: xn, unit: xc?.unit || '', x: null, y: xOut, color: '#888', axis: 'g', kind: save ? 'calc' : 'tmp' });
          if (save && !this.order.includes(xn)) this.order.push(xn);
          this.curves.set(tmpName, { name: tmpName, unit, x: xn, y, color: '#10b981', axis: 'g', kind: save ? 'calc' : 'tmp', style: 'lignepoints' });
        } else {
          this.curves.set(tmpName, { name: tmpName, unit, x: c.x, y, color: '#10b981', axis: (op === 'sg1' || op === 'sg2' || op === 'deriv') ? 'd' : 'g', kind: save ? 'calc' : 'tmp' });
        }
        if (save) {
          this.curves.delete('__prev'); this.curves.delete('__prev_x');
          if (!this.order.includes(tmpName)) this.order.push(tmpName);
          this.markDirty();
          this.refreshDataUI();
          this.toast(`Courbe ${tmpName} enregistrée`, 'ok', { label: 'Voir dans Courbes →', fn: () => this.openCurveInPlot(tmpName) });
        }
        this.tplot.xName = null;
        this.tplot.style = 'ligne';
        this.tplot.curves = [cn, tmpName];
        this.tplot.autoscale();
        $('#tInfo').textContent = `Aperçu : ${cn} (gauche) et résultat (${op === 'sg1' || op === 'sg2' || op === 'deriv' ? 'axe droit →' : 'même axe'})`;
      } catch (e) { this.toast(e.message, 'err'); }
    },

    _previewInteg() {
      const cn = $('#tiC').value, c = this.curve(cn), d = this.getCurveXY(cn), xc = this.xCurveOf(cn);
      if (!c || !d) return;
      const a = IO.parseNum($('#tiA').value), b = IO.parseNum($('#tiB').value);
      const res = Num.integBounds(d.x, d.y, a, b);
      const u = [c.unit, xc?.unit].filter(Boolean).join('·');
      $('#tiRes').textContent = `Intervalle : [${PlotFmt.val(a, 5)} ; ${PlotFmt.val(b, 5)}] ${xc?.unit || ''}\nAire ∫ y dx = ${PlotFmt.val(res.area, 6)} ${u}\nMoyenne sur [a,b] = ${PlotFmt.val(res.area / (b - a), 5)} ${c.unit || ''}`;
      this.tplot.curves = [cn];
      this.tplot.xName = null;
      this.tplot.style = 'lignepoints';
      this.tplot.overlays = [(ctx, p, C) => {
        if (res.pts.length < 2) return;
        const y0 = p.Y(0);
        ctx.fillStyle = C.accent; ctx.globalAlpha = 0.22;
        ctx.beginPath();
        ctx.moveTo(p.X(res.pts[0][0]), y0);
        for (const [xx, yy] of res.pts) ctx.lineTo(p.X(xx), p.Y(yy));
        ctx.lineTo(p.X(res.pts[res.pts.length - 1][0]), y0);
        ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1;
      }];
      this.tplot.autoscale();
    },

    _previewDosage(resetV, doAutoscale = true) {
      const cn = $('#tdoC').value, c = this.curve(cn), d = this.getCurveXY(cn), xc = this.xCurveOf(cn);
      if (!c || !d) return;
      if (this.dosageType === 'cond') {
        this.tplot.curves = [cn];
        this.tplot.xName = null;
        this.tplot.style = 'lignepoints';
        this.tplot.overlays = [];
        this.tplot.handles = [];
        if (doAutoscale) this.tplot.autoscale(); else this.tplot.draw();
        $('#tInfo').textContent = 'Dosage conductimétrique : cliquez « Lancer l’ajustement 2 droites → » pour déterminer V_E.';
        return;
      }
      const xu = xc?.unit || '';
      const xmin = Num.min(d.x), xmax = Num.max(d.x);
      const pk = Num.findTitrationPeaks(d.x, d.y, +$('#tdoW').value || 5);
      if (pk.equivs.length) {
        $('#tdoPeaks').textContent = pk.equivs.slice(0, 3).map((e, i) =>
          `Équiv. ${i + 1} : V_E = ${PlotFmt.val(e.V, 4)} ${xu} · ${cn}_E = ${PlotFmt.val(e.y, 4)}`
        ).join('\n');
      } else {
        $('#tdoPeaks').textContent = 'Aucun saut net détecté.';
      }

      // Initialisation auto de V1 et V2 autour de la 1ère équivalence
      if (resetV || !$('#tdoV1').value) {
        const span = (xmax - xmin) || 1;
        const ve = pk.equivs[0]?.V ?? 0.5 * (xmin + xmax);
        $('#tdoV1').value = PlotFmt.val(Math.max(xmin, ve - 0.14 * span), 4);
        $('#tdoV2').value = PlotFmt.val(Math.min(xmax, ve + 0.14 * span), 4);
      }
      const v1 = IO.parseNum($('#tdoV1').value), v2 = IO.parseNum($('#tdoV2').value);
      const slopeIn = $('#tdoM').value.trim() ? IO.parseNum($('#tdoM').value) : null;
      const tan = Num.parallelTangents(d.x, d.y, v1, v2, slopeIn);
      if (tan) {
        $('#tdoTanRes').textContent = `V_E = ${PlotFmt.val(tan.ve, 4)} ${xu}\n${cn}_E = ${PlotFmt.val(tan.phe, 4)}\npente commune = ${PlotFmt.val(tan.m, 3)}`;
      }

      const yAt = vx => {
        const i = this.tplot.nearestIndex(d, vx);
        return i >= 0 ? d.y[i] : 0;
      };
      this.tplot.handles = [
        {
          id: 'v1', x: v1, y: yAt(v1), color: '#38bdf8', label: 'V₁',
          onDrag: xNew => {
            const clamped = Math.max(xmin, Math.min(xmax, xNew));
            $('#tdoV1').value = PlotFmt.val(clamped, 4);
            this._previewDosage(false, false);
          },
        },
        {
          id: 'v2', x: v2, y: yAt(v2), color: '#38bdf8', label: 'V₂',
          onDrag: xNew => {
            const clamped = Math.max(xmin, Math.min(xmax, xNew));
            $('#tdoV2').value = PlotFmt.val(clamped, 4);
            this._previewDosage(false, false);
          },
        },
      ];

      this.curves.set('__dos_d', { name: 'd' + cn + '/d' + (xc?.name || 'x'), unit: '', x: c.x, y: pk.deriv, color: '#f59e0b', axis: 'd', kind: 'tmp', style: 'ligne' });
      this.tplot.curves = [cn, '__dos_d'];
      this.tplot.xName = null;
      this.tplot.style = 'lignepoints';
      this.tplot.overlays = [(ctx, p) => {
        if (!tan) return;
        const [xa, xb] = p.xRange();
        const drawLine = (b, col, dash) => {
          ctx.strokeStyle = col; ctx.lineWidth = 1.6;
          ctx.setLineDash(dash ? [6, 4] : []);
          ctx.beginPath(); ctx.moveTo(p.X(xa), p.Y(tan.m * xa + b)); ctx.lineTo(p.X(xb), p.Y(tan.m * xb + b)); ctx.stroke();
          ctx.setLineDash([]);
        };
        drawLine(tan.b1, '#38bdf8', true);
        drawLine(tan.b2, '#38bdf8', true);
        drawLine(tan.bm, '#10b981', false);
        // Point équivalent
        const px = p.X(tan.ve), py = p.Y(tan.phe);
        ctx.fillStyle = '#10b981';
        ctx.beginPath(); ctx.arc(px, py, 5.5, 0, 2 * Math.PI); ctx.fill();
        ctx.strokeStyle = '#10b981'; ctx.setLineDash([4, 3]);
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, p.box.b); ctx.stroke();
        ctx.setLineDash([]);
      }];
      if (doAutoscale) this.tplot.autoscale(); else this.tplot.draw();
      $('#tInfo').textContent = 'Glissez les poignées bleues V₁ et V₂ sur la courbe pour ajuster les tangentes parallèles.';
    },

    _previewFFT(save) {
      const cn = $('#tfC').value, c = this.curve(cn), d = this.getCurveXY(cn), xc = this.xCurveOf(cn);
      if (!c || !d) return;
      try {
        const sp = Num.spectrum(d.x, d.y, { window: $('#tfW').value, zeroPad: $('#tfPad').checked });
        const db = $('#tfDB').checked;
        const amp = db ? Float64Array.from(sp.a, v => 20 * Math.log10(Math.max(v, 1e-12))) : sp.a;
        const fu = xc?.unit === 's' ? 'Hz' : (xc?.unit === 'ms' ? 'kHz' : '');
        const fn = save ? this.uniqueName('Freq_' + cn) : '__fft_f';
        const an = save ? this.uniqueName('Spectre_' + cn) : '__fft_a';
        this.curves.set(fn, { name: fn, unit: fu, x: null, y: sp.f, color: '#888', axis: 'g', kind: save ? 'calc' : 'tmp' });
        this.curves.set(an, { name: an, unit: db ? 'dB' : c.unit, x: fn, y: amp, color: '#3b82f6', axis: 'g', kind: save ? 'calc' : 'tmp', style: $('#tfSt').value });
        if (save) {
          this.curves.delete('__fft_f'); this.curves.delete('__fft_a');
          if (!this.order.includes(fn)) this.order.push(fn);
          if (!this.order.includes(an)) this.order.push(an);
          this.markDirty();
          this.refreshDataUI();
          this.toast(`Spectre enregistré (${fn}, ${an})`, 'ok', { label: 'Voir dans Courbes →', fn: () => this.openCurveInPlot(an, { replace: true, xName: fn }) });
        }
        this.tplot.xName = null;
        this.tplot.style = $('#tfSt').value;
        this.tplot.curves = [an];
        this.tplot.cursorCurve = an;
        this.tplot.autoscale();

        // Zoomer automatiquement sur les fréquences utiles
        if (sp.peaks.length) {
          const fMaxUseful = Math.min(sp.f[sp.f.length - 1], Math.max(...sp.peaks.slice(0, 5).map(p => p.f)) * 1.45 + 5 * sp.df);
          const V = this.tplot.getView();
          if (fMaxUseful < 0.65 * V.xmax) {
            this.tplot.auto = false;
            this.tplot.view = { ...V, xmin: 0, xmax: fMaxUseful };
            this.tplot.draw();
          }
        }
        let txt = `Résolution Δf = ${PlotFmt.si(sp.df, fu)} · DC = ${PlotFmt.val(sp.dc, 4)}\n`;
        if (isFinite(sp.thd)) txt += `THD ≈ ${sp.thd.toFixed(2)} %\n`;
        txt += '\nPics principaux :\n' + sp.peaks.slice(0, 5).map((p, i) =>
          `${i + 1}. f = ${PlotFmt.si(p.f, fu)} · A = ${PlotFmt.val(p.a, 4)}`
        ).join('\n');
        $('#tfRes').textContent = txt;
        $('#tInfo').textContent = 'Utilisez « Curseur » ou survolez un pic pour lire sa fréquence exacte.';
      } catch (e) { $('#tfRes').textContent = 'Erreur : ' + e.message; }
    },

    _previewFilter(save) {
      const cn = $('#tflC').value, type = $('#tflT').value;
      const c = this.curve(cn), d = this.getCurveXY(cn);
      if (!c || !d || d.x.length < 4) return;
      try {
        const f0 = IO.parseNum($('#tflF').value) || 100;
        const Q = IO.parseNum($('#tflQ').value) || 0.707;
        let y;
        if (type === 'pb1' || type === 'ph1') y = Num.filter1(d.x, d.y, type === 'pb1' ? 'lp' : 'hp', f0);
        else {
          const fs = (d.x.length - 1) / ((d.x[d.x.length - 1] - d.x[0]) || 1);
          if (f0 >= fs / 2) throw new Error(`f₀ doit être < fe/2 = ${PlotFmt.si(fs / 2, 'Hz')}`);
          y = Num.biquad(d.y, type, f0, Q, fs);
        }
        const nm = save ? this.uniqueName('Filt_' + cn) : '__filt';
        this.curves.set(nm, { name: nm, unit: c.unit, x: c.x, y, color: '#10b981', axis: 'g', kind: save ? 'calc' : 'tmp', width: 2 });
        if (save) {
          this.curves.delete('__filt');
          if (!this.order.includes(nm)) this.order.push(nm);
          this.markDirty();
          this.refreshDataUI();
          this.toast(`Courbe filtrée ${nm} enregistrée`, 'ok', { label: 'Voir dans Courbes →', fn: () => this.openCurveInPlot([cn, nm]) });
        }
        this.tplot.xName = null;
        this.tplot.logx = false;
        this.tplot.style = 'ligne';
        this.tplot.curves = [cn, nm];
        this.tplot.autoscale();
      } catch (e) { this.toast(e.message, 'err'); }
    },

    _runBode() {
      const en = $('#tbE').value, sn = $('#tbS').value, m = $('#tbM').value;
      const de = this.getCurveXY(en), ds = this.getCurveXY(sn);
      if (!de || !ds) return;
      const n = Math.min(de.x.length, de.y.length, ds.y.length);
      if (n < 8) { this.toast('Pas assez de points', 'err'); return; }
      const x = de.x.subarray(0, n), e = de.y.subarray(0, n), s = ds.y.subarray(0, n);
      try {
        if (m === 'fft') {
          const Se = Num.spectrum(x, e, { window: 'rect' }), Ss = Num.spectrum(x, s, { window: 'rect' });
          let amax = 0; for (let k = 1; k < Se.a.length; k++) amax = Math.max(amax, Se.a[k]);
          const thr = 0.02 * amax, F = [], G = [], P = [];
          let prev = null, off = 0;
          for (let k = 1; k < Se.a.length; k++) {
            if (!(Se.a[k] > thr)) continue;
            let ph = (Ss.ph[k] - Se.ph[k]) * 180 / Math.PI;
            ph = ((ph + 180) % 360 + 360) % 360 - 180;
            if (prev !== null) { while (ph + off - prev > 180) off -= 360; while (ph + off - prev < -180) off += 360; }
            ph += off; prev = ph;
            F.push(Se.f[k]); G.push(20 * Math.log10(Ss.a[k] / Se.a[k])); P.push(ph);
          }
          if (F.length < 2) throw new Error('Spectre d’entrée trop pauvre (utilisez un chirp, bruit ou échelon)');
          this.setCurve('Bode_f', { y: F, unit: 'Hz', x: null, kind: 'calc', color: '#888' });
          this.setCurve('Bode_GdB', { y: G, unit: 'dB', x: 'Bode_f', kind: 'calc', color: '#3b82f6' });
          this.setCurve('Bode_phi', { y: P, unit: '°', x: 'Bode_f', kind: 'calc', color: '#ef4444', axis: 'd' });
        } else {
          const sinM = Fit.MODELS.find(x => x.id === 'sin');
          const fe = Fit.runModel(sinM, x, e);
          const f = Math.abs(fe.res.p[1]);
          if (!(f > 0)) throw new Error('Fréquence introuvable');
          const fitAB = y => {
            const w = 2 * Math.PI * f, A = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], B = [0, 0, 0];
            for (let i = 0; i < n; i++) {
              const v = [Math.sin(w * x[i]), Math.cos(w * x[i]), 1];
              for (let a = 0; a < 3; a++) { B[a] += v[a] * y[i]; for (let b = 0; b < 3; b++) A[a][b] += v[a] * v[b]; }
            }
            const sol = Num.solveLinear(A, B);
            return { amp: Math.hypot(sol[0], sol[1]), phi: Math.atan2(sol[1], sol[0]) };
          };
          const E = fitAB(e), S = fitAB(s), g = S.amp / E.amp;
          let ph = (S.phi - E.phi) * 180 / Math.PI;
          ph = ((ph + 180) % 360 + 360) % 360 - 180;
          const add = (nm, v, unit, xN, col, ax) => {
            const c = this.curve(nm); const arr = c ? Array.from(c.y) : []; arr.push(v);
            this.setCurve(nm, { y: arr, unit, x: xN, kind: 'calc', color: col, axis: ax || 'g' });
          };
          add('Bode_f', f, 'Hz', null, '#888');
          add('Bode_GdB', 20 * Math.log10(g), 'dB', 'Bode_f', '#3b82f6', 'g');
          add('Bode_phi', ph, '°', 'Bode_f', '#ef4444', 'd');
        }
        this.tplot.logx = true;
        this.tplot.xName = null;
        this.tplot.style = 'lignepoints';
        this.tplot.curves = ['Bode_GdB', 'Bode_phi'];
        this.tplot.autoscale();
        this.markDirty();
        this.refreshDataUI();
        this.toast('Diagramme de Bode mis à jour', 'ok', { label: 'Voir dans Courbes →', fn: () => this.openCurveInPlot(['Bode_GdB', 'Bode_phi'], { replace: true, logx: true, xName: 'Bode_f' }) });
      } catch (e) { this.toast('Bode : ' + e.message, 'err'); }
    },

    // ==================== FICHIERS, SESSIONS & EXEMPLES ====================
    onVideoExported(made) {
      const otherViews = this.views.filter(vw => vw.curves.length && !vw.isVideoView);
      const vTraj = { id: 1, title: 'Trajectoire y(x)', curves: [made[1]], xName: made[0], style: 'lignepoints', logx: false, logy: false, equal: true, isVideoView: true };
      const vHor = { id: 2, title: 'Horaires x(t), y(t)', curves: made.slice(), xName: 't', style: 'lignepoints', logx: false, logy: false, equal: false, isVideoView: true };
      this.views = [vTraj, vHor, ...otherViews];
      this.activeViewIdx = 0;
      this.setTab(2);
      this.plot.autoscale();
      this.markDirty();
      this.toast(`Courbes créées (${made.join(', ')}, vitesses et accélérations)`, 'ok');
    },

    loadSample(id, silent = false) {
      const ds = IO.sampleDataset(id);
      this.curves.clear(); this.order = []; this.colorIdx = 0; this.lastFit = null;
      for (const col of ds.cols) this.setCurve(col.name, col);
      this.views = [{
        id: 1, title: ds.label.split(' (')[0],
        curves: ds.plot.curves.slice(), xName: ds.plot.xName || null,
        style: ds.plot.style || 'points', logx: !!ds.plot.logx, logy: false, equal: false, plotTitle: '',
      }];
      this.activeViewIdx = 0;
      if (this.plot) {
        this.plot.residualsData = null; this.plot.showResiduals = false;
        this.plot.fitBoxLines = null; this.plot.showFitBox = false;
        $('#pRes').setAttribute('aria-pressed', 'false');
        $('#pFitBox').setAttribute('aria-pressed', 'false');
      }
      if (id === 'ph') {
        this.treatTool = 'dosage';
        this.dosageType = 'ph';
        $$('#treatPills [data-tt]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.tt === 'dosage')));
      }
      this.refreshAll();
      if (ds.suggestModel) {
        $('#mModel').value = ds.suggestModel;
        this._renderModelParams();
      }
      if (!silent) {
        this.setTab(ds.openTab !== undefined ? ds.openTab : 2);
        this.plot?.autoscale();
        this.toast(`Exemple chargé : ${ds.label}`, 'ok');
      }
    },

    _ingestColumns(cols, sourceLabel) {
      if (!cols.length) return;
      const xCol = cols[0];
      const xName = this.uniqueName(xCol.name);
      this.setCurve(xName, { y: xCol.y, unit: xCol.unit, x: null, kind: 'import', color: '#788496' });
      const ys = [];
      for (let i = 1; i < cols.length; i++) {
        const yn = this.uniqueName(cols[i].name);
        this.setCurve(yn, { y: cols[i].y, unit: cols[i].unit, x: xName, kind: 'import' });
        ys.push(yn);
      }
      const v = this.activeView();
      if (!v.curves.length) { v.curves = ys.slice(0, 4); v.xName = xName; }
      this.refreshAll();
      this.markDirty();
      this.toast(`Importé depuis ${sourceLabel} : ${cols.length} colonne(s), ${xCol.y.length} points`, 'ok');
    },

    async handleFile(file) {
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      if (['mp4', 'mov', 'webm', 'avi', 'mkv', 'm4v', '3gp', 'ogv'].includes(ext) || file.type.startsWith('video/')) {
        this.setTab(1);
        this.video.load(file);
        return;
      }
      if (ext === 'json') {
        try {
          const data = JSON.parse(await file.text());
          this.loadSession(data);
          this.toast(`Session « ${file.name} » ouverte`, 'ok');
        } catch (e) { this.toast('Session invalide : ' + e.message, 'err'); }
        return;
      }
      if (ext === 'xlsx') {
        try {
          const sheets = await IO.readXlsxSheets(file);
          if (!sheets.length) throw new Error('Classeur vide');
          const finish = sh => {
            try {
              const cols = IO.parseSheetRows(sh.rows);
              this._ingestColumns(cols, `${file.name} (${sh.name})`);
              this.setTab(2);
              this.plot.autoscale();
            } catch (e) { this.toast('Import échoué : ' + e.message, 'err'); }
          };
          if (sheets.length === 1) { finish(sheets[0]); return; }
          const opts = sheets.map((s, i) => `<option value="${i}">${esc(s.name)} (${s.rows.length} lignes)</option>`).join('');
          this.modal(`Choisir la feuille · ${file.name}`, `
            <p class="pr-muted">Ce classeur Excel contient ${sheets.length} feuilles non vides :</p>
            <label class="pr-fld"><span>Feuille à importer</span><select id="mXlsxSheet">${opts}</select></label>`,
            [{ label: 'Annuler' }, {
              label: 'Importer', pri: true, action: bg => {
                const idx = +$('#mXlsxSheet', bg).value || 0;
                finish(sheets[idx]);
              },
            }]);
        } catch (e) { this.toast('Import Excel échoué : ' + e.message, 'err'); }
        return;
      }
      try {
        const cols = await IO.importFile(file);
        this._ingestColumns(cols, file.name);
        this.setTab(2);
        this.plot.autoscale();
      } catch (e) { this.toast('Import échoué : ' + e.message, 'err'); }
    },

    buildSessionObject() {
      return {
        app: 'Progressi', version: 2, savedAt: Date.now(),
        tab: this.tab,
        calcText: this.calcText,
        order: this.order,
        curves: this.order.map(n => {
          const c = this.curve(n);
          return {
            name: c.name, unit: c.unit, x: c.x, color: c.color, axis: c.axis, kind: c.kind,
            uxSpec: c.uxSpec, uySpec: c.uySpec, excluded: [...(c.excluded || [])],
            y: Array.from(c.y),
          };
        }),
        views: this.views,
        activeViewIdx: this.activeViewIdx,
        video: this.video ? this.video.exportState() : null,
      };
    },

    markDirty() {
      this.dirty = true;
      this.scheduleAutoSave();
    },

    scheduleAutoSave() {
      clearTimeout(this._saveTimer);
      this._saveTimer = setTimeout(() => this.autoSaveNow(), 350);
    },

    autoSaveNow() {
      clearTimeout(this._saveTimer);
      try {
        const str = JSON.stringify(this.buildSessionObject());
        if (str.length > 4_200_000) {
          if (!this._quotaWarned) {
            this._quotaWarned = true;
            this.toast('Données volumineuses : pensez à enregistrer en .json (Ctrl+S)', 'err');
          }
          return;
        }
        localStorage.setItem(AUTOSAVE_KEY, str);
      } catch (_) {
        if (!this._quotaWarned) {
          this._quotaWarned = true;
          this.toast('Sauvegarde auto pleine : enregistrez la session (Ctrl+S)', 'err');
        }
      }
    },

    clearAutoSave() {
      clearTimeout(this._saveTimer);
      try { localStorage.removeItem(AUTOSAVE_KEY); } catch (_) {}
    },

    restoreAutoSave() {
      try {
        const raw = localStorage.getItem(AUTOSAVE_KEY);
        if (!raw) return false;
        const data = JSON.parse(raw);
        if (!data || data.app !== 'Progressi') return false;
        const hasCurves = Array.isArray(data.curves) && data.curves.length > 0;
        const hasVideo = data.video && (data.video.pts?.length || data.video.ech || data.video.ori);
        if (!hasCurves && !hasVideo) return false;
        this.loadSession(data, true);
        const tab = (typeof data.tab === 'number' && data.tab >= 0 && data.tab <= 3) ? data.tab : 0;
        this.setTab(tab);
        this.dirty = false;
        this.toast('Session précédente restaurée automatiquement', 'ok');
        return true;
      } catch (_) { return false; }
    },

    saveSession() {
      const data = this.buildSessionObject();
      this.download('session_progressi.json', JSON.stringify(data, null, 2), 'application/json');
      this.dirty = false;
      this.autoSaveNow();
      this.toast('Session enregistrée (.json)', 'ok');
    },

    loadSession(data, fromAuto = false) {
      this.curves.clear(); this.order = []; this.lastFit = null;
      const list = Array.isArray(data.curves) ? data.curves : Object.values(data.curves || {});
      for (const c of list) {
        this.setCurve(c.name, {
          unit: c.unit || '', x: c.x || null, y: c.y || [],
          color: c.color || this.nextColor(), axis: c.axis || 'g', kind: c.kind || 'import',
          uxSpec: c.uxSpec || '', uySpec: c.uySpec || '', excluded: c.excluded || [],
        });
      }
      if (data.calcText !== undefined) { this.calcText = data.calcText; $('#calcTa').value = data.calcText; }
      if (Array.isArray(data.views) && data.views.length) this.views = data.views;
      else {
        this.views = []; this.ensureDefaultView();
        const yNames = this.order.filter(n => this.curve(n).x);
        this.views[0].curves = yNames.slice(0, 4);
      }
      this.activeViewIdx = Math.max(0, Math.min(data.activeViewIdx || 0, this.views.length - 1));
      if (this.video) this.video.importState(data.video || null);
      this.refreshAll();
      if (!fromAuto) { this.dirty = false; this.autoSaveNow(); }
    },

    exportActiveImage() {
      let url = null, fname = 'progressi_graphe.png';
      if (this.tab === 1 && this.video) { url = this.video.exportPNG(); fname = 'progressi_pointage.png'; }
      else if (this.tab === 3 && this.tplot) { url = this.tplot.exportPNG(true); fname = 'progressi_traitement.png'; }
      else if (this.plot) { url = this.plot.exportPNG(true); }
      if (!url) { this.toast('Rien à exporter sur cet onglet', 'err'); return; }
      const a = document.createElement('a');
      a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
      this.toast(`Image ${fname} enregistrée`, 'ok');
    },

    async copyActiveImage() {
      let blob = null;
      if (this.tab === 1 && this.video) blob = await this.video.exportPNGBlob();
      else if (this.tab === 3 && this.tplot) blob = await this.tplot.exportPNGBlob(true);
      else if (this.plot) blob = await this.plot.exportPNGBlob(true);
      if (!blob) { this.toast('Rien à copier sur cet onglet', 'err'); return; }
      try {
        if (navigator.clipboard?.write && window.ClipboardItem) {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          this.toast('Image PNG copiée (prête à coller par Ctrl+V dans le compte-rendu)', 'ok');
          return;
        }
      } catch (_) {}
      // Repli téléchargement si le navigateur refuse l'écriture d'image au presse-papiers
      this.exportActiveImage();
    },

    // ==================== UTILITAIRES UI ====================
    toast(msg, cls = '', action = null) {
      const t = $('#prToast');
      t.innerHTML = '';
      const span = document.createElement('span');
      span.textContent = msg;
      t.appendChild(span);
      if (action && action.label && action.fn) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pr-toast-act';
        btn.textContent = action.label;
        btn.onclick = () => { t.hidden = true; action.fn(); };
        t.appendChild(btn);
      }
      t.className = 'pr-toast' + (cls ? ' ' + cls : '');
      t.hidden = false;
      clearTimeout(this._toastT);
      this._toastT = setTimeout(() => { t.hidden = true; }, action ? 6500 : 4500);
    },

    confirm(msg, onOk) {
      this.modal('Confirmation', `<p style="margin:0">${esc(msg)}</p>`, [
        { label: 'Annuler' },
        { label: 'Confirmer', pri: true, action: () => { onOk(); } },
      ]);
    },

    modal(title, bodyHtml, buttons = [{ label: 'Fermer' }], onOpen) {
      const bg = document.createElement('div');
      bg.className = 'pr-modal-bg';
      bg.innerHTML = `<div class="pr-modal"><div class="pr-modal-h"><span>${esc(title)}</span><button class="mini" data-close>✕</button></div><div class="pr-modal-b">${bodyHtml}</div><div class="pr-modal-f"></div></div>`;
      const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
      const onKey = e => { if (e.key === 'Escape') close(); };
      document.addEventListener('keydown', onKey);
      $('[data-close]', bg).onclick = close;
      bg.addEventListener('mousedown', e => { if (e.target === bg) close(); });
      const mf = $('.pr-modal-f', bg);
      for (const b of buttons) {
        const btn = document.createElement('button');
        btn.className = 'ib' + (b.pri ? ' on' : '');
        btn.textContent = b.label;
        btn.onclick = () => { if (!b.action || b.action(bg) !== false) close(); };
        mf.appendChild(btn);
      }
      document.body.appendChild(bg);
      if (onOpen) onOpen(bg);
    },

    pickFile(accept) {
      return new Promise(res => {
        const inp = $('#prFileIn');
        inp.value = ''; inp.accept = accept || '';
        inp.onchange = () => res(inp.files[0] || null);
        inp.click();
      });
    },

    download(name, content, type = 'text/plain') {
      const blob = new Blob([content], { type });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    },

    _bindGlobalEvents() {
      // Sauvegarde auto synchrone + confirmation si modifications non exportées en .json
      window.addEventListener('beforeunload', e => {
        if (this.dirty) {
          this.autoSaveNow();
          e.preventDefault();
          e.returnValue = '';
        }
      });

      // Drag & drop global
      let dragCount = 0;
      const ov = $('#prDrop');
      window.addEventListener('dragenter', e => { e.preventDefault(); dragCount++; ov.classList.add('on'); });
      window.addEventListener('dragover', e => e.preventDefault());
      window.addEventListener('dragleave', () => { dragCount = Math.max(0, dragCount - 1); if (!dragCount) ov.classList.remove('on'); });
      window.addEventListener('drop', e => {
        e.preventDefault(); dragCount = 0; ov.classList.remove('on');
        const f = e.dataTransfer?.files?.[0];
        if (f) this.handleFile(f);
      });

      // Raccourcis clavier (ignorés lors de la saisie texte)
      document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); this.saveSession(); return; }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') { e.preventDefault(); this.pickFile('.json').then(f => f && this.handleFile(f)); return; }
        if (e.altKey && ['1', '2', '3', '4'].includes(e.key)) { e.preventDefault(); this.setTab(+e.key - 1); return; }

        const tag = document.activeElement?.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && this.tab === 1 && this.video) {
          e.preventDefault(); this.video.undoLast(); return;
        }
        if (e.key === 'Escape') {
          if (this.tab === 1 && this.video?.mode) { this.video.setMode(null); return; }
          if (this.tab === 2 && this.plot && this.plot.mode !== 'zoom') { this.setPlotMode('zoom'); return; }
        }

        const k = e.key.toLowerCase();
        if (k === 't') $('[data-act=theme]').click();
        else if (k === 'p') $('[data-act=proj]').click();
        else if (k === 'f') $('[data-act=fs]').click();
        else if (k === 'h') $('[data-act=help]').click();
        else if (k === 'i') $('[data-act=image]').click();
        else if (k === 'c' && !e.ctrlKey && !e.metaKey) $('[data-act=copyimg]').click();
        else if (this.tab === 1 && this.video) {
          if (e.key === 'ArrowRight') { e.preventDefault(); this.video.goto(this.video.frame + (e.shiftKey ? 10 : 1)); }
          else if (e.key === 'ArrowLeft') { e.preventDefault(); this.video.goto(this.video.frame - (e.shiftKey ? 10 : 1)); }
          else if (e.key === ' ') { e.preventDefault(); this.video.togglePlay(); }
        }
      });
    },
  };

  window.addEventListener('DOMContentLoaded', () => App.init());
  return App;
})();

</script>
</body>
</html>
